  - id: rag-agents-029
    type: single
    difficulty: medium
    tags:
      - mcp
      - capabilities
      - resources
      - tools
    question: |
      An MCP server for a coding assistant offers the project's documentation so that the model
      can read it as context; reading it has no side effects and needs no significant computation.
      Which MCP capability type fits best?
    options:
      - text: Resource
        correct: true
      - text: Tool
        why: Tools are executable functions the model invokes to perform actions or compute results, such as running code [^1].
      - text: Prompt
        why: Prompts are predefined templates or workflows that guide interactions, such as a code-style prompt [^1].
      - text: Sampling
        why: Sampling lets the server ask the client to run an LLM interaction, e.g. to review generated code [^1].
    explanation: |
      MCP distinguishes Tools (executable functions with actions or computed results), Resources
      (read-only data sources that provide context without significant computation), Prompts
      (predefined templates or workflows) and Sampling (server-initiated LLM requests) [^1]. The
      Hugging Face MCP course illustrates this with a code agent that has a documentation Resource,
      a code-interpreter Tool, a code-style Prompt and a code-review Sampling step [^1].
    references:
      - source: hf-mcp-course
        locator: Unit 1, Key Concepts and Terminology — Capabilities (table and code-agent example)
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/key-concepts.mdx
    source:
      id: hf-mcp-course
      ref: units/en/unit1/key-concepts.mdx#capabilities
      url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/key-concepts.mdx
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-030
    type: multiple
    difficulty: medium
    tags:
      - mcp
      - sdk
      - protocol
    question: |
      The official MCP SDKs (Python, TypeScript and others) are libraries for writing MCP clients
      and servers. Which of these tasks do they typically handle? Select all that apply.
    options:
      - text: Serializing and deserializing protocol messages
        correct: true
      - text: Registering and discovering capabilities
        correct: true
      - text: Managing connections between clients and servers
        correct: true
      - text: Hosting and running the large language model
        why: The SDKs connect applications to capabilities; the model runs in or behind the Host application [^1].
      - text: Deciding which tool the model should call for a user request
        why: That decision belongs to the Host and its LLM; the SDK only carries out the protocol [^2].
    explanation: |
      The SDKs implement the MCP specification so that developers can focus on their
      application's capabilities: they handle protocol-level communication, capability
      registration and discovery, message serialization and deserialization, connection management
      and error handling [^1]. Choosing which capability to invoke happens in the Host, often with
      the help of its LLM [^2].
    references:
      - source: hf-mcp-course
        locator: Unit 1, MCP SDK — SDK Overview
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/sdk.mdx
      - source: hf-mcp-course
        locator: Unit 1, Architectural Components of MCP — Communication Flow (steps 2 and 5)
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/architectural-components.mdx
    source:
      id: hf-mcp-course
      ref: units/en/unit1/quiz2.mdx#q2
      url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/quiz2.mdx
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-031
    type: single
    difficulty: medium
    tags:
      - mcp
      - json-rpc
      - transport
    question: What role does JSON-RPC 2.0 play in MCP?
    options:
      - text: The message format of all client–server communication
        correct: true
      - text: The transport that carries messages between machines
        why: Transport is separate; MCP uses stdio for local and HTTP+SSE or Streamable HTTP for remote communication [^1].
      - text: The schema language in which tools are defined
        why: Capabilities are described by their own schemas; JSON-RPC is used to invoke them and exchange data [^2].
      - text: The authentication scheme that secures servers
        why: JSON-RPC defines requests, responses and notifications, not authentication [^1].
    explanation: |
      MCP uses JSON-RPC 2.0, a lightweight remote procedure call protocol encoded in JSON, as the
      format of every message: requests (client to server, with an id), responses (with the same
      id, a result or an error) and notifications (no reply expected) [^1]. How the messages travel
      is specified separately by the transport mechanisms, stdio locally and HTTP-based streaming
      remotely [^1].
    references:
      - source: hf-mcp-course
        locator: 'Unit 1, The Communication Protocol — JSON-RPC: The Foundation; Transport Mechanisms'
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/communication-protocol.mdx
      - source: hf-mcp-course
        locator: 'Unit 1, Quiz 2: MCP SDK, Q5 (feedback on the options)'
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/quiz2.mdx
    source:
      id: hf-mcp-course
      ref: units/en/unit1/quiz2.mdx#q5
      url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/quiz2.mdx
