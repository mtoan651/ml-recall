  - id: rag-agents-013
    type: single
    question: How do AI agents use tools as a form of "acting" in an environment?
    options:
      - text: By passively waiting for user instructions
      - text: By only using pre-programmed responses
      - text: By asking the LLM to generate tool invocation code when appropriate and running tools on behalf of the model
        correct: true
    explanation: Agents can invoke tools and use reasoning to plan and re-plan based on the information gained. [^1]
