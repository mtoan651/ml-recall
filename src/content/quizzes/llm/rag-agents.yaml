  - id: rag-agents-014
    type: single
    question: What is a key feature of Agentic RAG?
    options:
      - text: It can only use document-based tools, to answer questions in a RAG workflow
        why: Agentic RAG can use different tools, including document-based tools.
      - text: It automatically answers questions without tools, like a chatbot
        why: Agentic RAG does use tools to answer questions.
      - text: It can decide to use any tool to answer questions, including RAG tools
        correct: true
      - text: It only works with Function Calling Agents
        why: Agentic RAG is not limited to Function Calling Agents.
    explanation: Agentic RAG has the flexibility to use different tools to answer questions. [^1]
    references:
      - source: hf-agents-course
        locator: Unit 2.2 The LlamaIndex framework
        url: https://huggingface.co/learn/agents-course/unit2/llama-index/introduction
    source:
      id: hf-agents-course
      ref: unit2/llama-index/quiz2#q4
      url: https://huggingface.co/learn/agents-course/unit2/llama-index/quiz2
    status: draft
  - id: rag-agents-015
    type: single
    question: |
      How does smolagents handle the debate between code-based actions and JSON-based actions?

      Which statement correctly characterizes smolagents' philosophy about action formats?
    options:
      - text: It only allows JSON-based actions for all agent tasks, requiring a parser to extract the tool calls
        why: ToolCallingAgent uses JSON-based calls, but smolagents also provides a primary CodeAgent option that writes Python code.
      - text: It focuses on code-based actions via a CodeAgent but also supports JSON-based tool calls with a ToolCallingAgent
        correct: true
      - text: It disallows any external function calls, instead requiring all logic to reside entirely within the LLM
        why: smolagents is specifically designed to grant LLMs the ability to call tools or code externally.
      - text: It requires users to manually convert every code snippet into a JSON object before running the agent
        why: smolagents can automatically manage code snippet creation within the CodeAgent path, no manual JSON conversion necessary.
    explanation: Yes, smolagents primarily recommends code-based actions but includes a JSON-based alternative for users who prefer it or need it. [^1]
    references:
      - source: hf-agents-course
        locator: Unit 2.1 The smolagents framework
        url: https://huggingface.co/learn/agents-course/unit2/smolagents/introduction
    source:
      id: hf-agents-course
      ref: unit2/smolagents/quiz1#q4
      url: https://huggingface.co/learn/agents-course/unit2/smolagents/quiz1
    status: draft
  - id: rag-agents-016
    type: single
    question: |
      How does a CodeAgent handle multi-step tasks using the ReAct (Reason + Act) approach?

      Which statement correctly describes how the CodeAgent executes a series of steps to solve a task?
    options:
      - text: It passes each step to a different agent in a multi-agent system, then combines results
        why: Although multi-agent systems can distribute tasks, CodeAgent itself can handle multiple steps on its own using ReAct.
      - text: It stores every action in JSON for easy parsing before executing them all at once
        why: This behavior matches ToolCallingAgent's JSON-based approach, not CodeAgent.
      - text: It cycles through writing internal thoughts, generating Python code, executing the code, and logging the results until it arrives at a final answer
        correct: true
      - text: It relies on a vision module to validate code output before continuing to the next step
        why: Vision capabilities are supported in smolagents, but they're not a default requirement for CodeAgent or the ReAct approach.
    explanation: Correct. This describes the ReAct pattern that CodeAgent uses, including iterative reasoning and code execution. [^1]
    references:
      - source: hf-agents-course
        locator: Unit 2.1 The smolagents framework
        url: https://huggingface.co/learn/agents-course/unit2/smolagents/introduction
    source:
      id: hf-agents-course
      ref: unit2/smolagents/quiz2#q2
      url: https://huggingface.co/learn/agents-course/unit2/smolagents/quiz2
    status: draft
