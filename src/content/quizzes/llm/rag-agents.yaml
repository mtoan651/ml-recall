  - id: rag-agents-042
    type: multiple
    difficulty: medium
    tags:
      - audit-trail
      - digital-signatures
      - governance
    question: |
      An agent's action receipt carries a valid signature from the agent's key and sits correctly in a
      hash chain. What does successful verification prove? Select all that apply.
    options:
      - text: That the policy named in the receipt was actually evaluated and allowed the action
        why: The receipt records what was claimed; it does not prove that a policy check was enforced [^1].
      - text: That the content has not changed since it was signed
        correct: true
      - text: That this receipt came after the one it links to in the chain
        correct: true
      - text: That the agent's action was the correct one
        why: A wrong action can be signed just as cleanly as a right one; receipts record what happened, not whether it was right [^1].
      - text: That this key signed this exact content
        correct: true
    explanation: |
      Receipts prove attribution (a specific key signed the payload), integrity (the payload is
      unchanged) and ordering (its place in the hash chain) [^1]. They do not prove correctness, policy
      compliance, which human stands behind the key, or that the agent's inputs were truthful; those need
      input validation, policy enforcement and identity infrastructure on top [^1].
    references:
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 18: Securing AI Agents with Cryptographic Receipts, What Receipts Prove (and What They Do Not) and Knowledge Check 5'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/18-securing-ai-agents/README.md#what-receipts-prove-and-what-they-do-not
    source:
      id: ms-ai-agents-for-beginners
      ref: 18-securing-ai-agents#q5
      url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/18-securing-ai-agents/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-043
    type: single
    difficulty: medium
    tags:
      - audit-trail
      - hashing
      - privacy
    question: |
      An agent's signed receipt stores `tool_args_hash` and `result_hash` instead of the raw tool
      arguments and result. Why?
    options:
      - text: The receipt stays small and leaks no private data, yet still binds to the stored originals
        correct: true
      - text: Hashes can be decrypted later by the auditor to recover the raw content
        why: A hash is a one-way function; the auditor instead hashes a separately stored copy and compares.
      - text: Raw arguments cannot be signed, only hashes can
        why: Any bytes can be signed; hashing is a design choice for privacy and size.
      - text: Hashing makes the receipt verifiable without the public key
        why: Verification always needs the public key; hashing does not replace the signature check.
    explanation: |
      Receipts may be archived or shared where raw arguments and results (personal or business data)
      must not leak [^1]. A cryptographic hash has a fixed size and reveals nothing practical about its
      input, yet any change to the stored original changes the hash, so an auditor can still check that
      a separately kept copy matches [^1][^2].
    references:
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 18: Securing AI Agents with Cryptographic Receipts, Knowledge Check 3'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/18-securing-ai-agents/README.md#knowledge-check
      - title: 'Wikipedia: Cryptographic hash function'
        url: https://en.wikipedia.org/wiki/Cryptographic_hash_function#Properties
        locator: Section "Properties"
    source:
      id: ms-ai-agents-for-beginners
      ref: 18-securing-ai-agents#q3
      url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/18-securing-ai-agents/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-044
    type: single
    difficulty: easy
    tags:
      - rag
      - retriever
      - generator
    question: In a retrieval-augmented generation (RAG) system, what does the retriever do?
    options:
      - text: It finds relevant information in external data sources
        correct: true
      - text: It generates the final answer from the user's question
        why: Writing the answer is the generator's job, i.e. the LLM working on the augmented prompt [^1].
      - text: It retrains the model whenever new documents are added to the knowledge base
        why: RAG adds retrieved text to the prompt at query time; it does not change the model's weights [^2].
      - text: It recalls relevant facts from the model's training data
        why: RAG's point is to bring in data the model was not trained on, from your own sources [^1][^2].
    explanation: |
      A RAG system has two parts: the retriever searches knowledge bases (by keyword, full-text or
      vector search) for information relevant to the question, and the generator, an LLM, answers from
      a prompt augmented with that information [^1]. This lets answers rely on data you provide rather
      than only on the model's training data [^1][^2].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 5: Talk to Your Data with RAG, RAG core concepts'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/05-rag/README.md#retrieval-augmented-generation-rag-core-concepts
      - title: 'Wikipedia: Retrieval-augmented generation'
        url: https://en.wikipedia.org/wiki/Retrieval-augmented_generation#Process
        locator: Section "Process"
    source:
      id: ms-genai-javascript
      ref: lessons/05-rag#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/05-rag/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-045
    type: single
    difficulty: medium
    tags:
      - tool-calling
      - function-calling
      - agents
    question: |
      An app registers a function `find_landing_spot(lat, long)` as a tool with an LLM and sends a user
      question. What does the model itself do when it "calls" the tool?
    options:
      - text: It runs the function's code on its own servers and continues with the result
        why: The model only produces text; executing the function is the job of the application or agent framework [^2].
      - text: It reads the function's source code to work out the answer without running it
        why: The model only sees the registered metadata (name, description, parameters), not the implementation [^1].
      - text: It returns the tool name and arguments, and the application runs the function and sends back the result
        correct: true
      - text: It calls the function automatically for every request, whether or not it is needed
        why: The model decides from the request and the tool descriptions whether a tool call is needed at all [^1].
    explanation: |
      Registering a tool gives the model metadata — its name, purpose and input parameters — so that it
      can suggest when and how to use it [^1]. The model then emits a tool call (name plus arguments);
      the surrounding code parses it, runs the actual function and passes the result back to the model
      for its final answer [^1][^2].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 6: Tool Calling, Registering a tool; Calling a tool'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/06-tool-calling/README.md#registering-a-tool
      - source: hf-agents-course
        locator: Unit 1. What are Tools?, "How do tools work?"
        url: https://huggingface.co/learn/agents-course/unit1/tools
    source:
      id: ms-genai-javascript
      ref: lessons/06-tool-calling#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/06-tool-calling/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-046
    type: single
    difficulty: easy
    tags:
      - tool-calling
      - tool-metadata
      - json-schema
    question: What is the role of a tool's metadata (its description and parameter schema) in tool calling?
    options:
      - text: It stores the results of earlier tool calls so that the model can reuse them later
        why: Earlier results travel in the conversation messages, not in the tool's metadata.
      - text: It gives the model the tool's implementation so it can run the code itself
        why: The implementation stays in the application; the model sees only a description of purpose, inputs and outputs [^1].
      - text: It describes the tool's purpose and inputs, so the model can decide when and how to call it
        correct: true
      - text: It makes the model execute the tool automatically on every single request it receives
        why: Whether a tool is called is decided per request, from the request and the description [^1].
    explanation: |
      The metadata describes the tool's purpose, inputs and outputs for the model [^1]. From this
      description alone the model decides whether a request needs the tool and fills in the arguments;
      the implementation details stay with the application, which executes the call [^1][^2].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 6: Tool Calling, Registering a tool and solution-quiz.md, Question 2 (explanation)'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/06-tool-calling/solution/solution-quiz.md
      - source: hf-agents-course
        locator: Unit 1. What are Tools?, "How do tools work?"
        url: https://huggingface.co/learn/agents-course/unit1/tools
    source:
      id: ms-genai-javascript
      ref: lessons/06-tool-calling#q2
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/06-tool-calling/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-047
    type: single
    difficulty: medium
    tags:
      - mcp
      - model-context-protocol
      - primitives
    question: |
      An MCP server for a code project should let the client application attach file contents and git
      history as context, chosen by the application rather than invoked by the model. Which MCP server
      primitive is meant for this?
    options:
      - text: Tools
        why: Tools are model-controlled functions that the LLM invokes to take actions, such as API calls or writing files [^1].
      - text: Prompts
        why: Prompts are user-controlled templates, such as slash commands, that the user chooses to invoke [^1].
      - text: Sampling requests
        why: Sampling is a *client* feature that lets a server ask the client's model for a completion; it is not a server primitive for context.
      - text: Resources
        correct: true
    explanation: |
      An MCP server exposes three primitives: prompts (user-controlled templates), resources
      (application-controlled data such as file contents or git history) and tools (model-controlled
      functions for actions) [^1][^2]. Data that the application selects and attaches as context is a
      resource; an action the model decides to take is a tool [^1].
    references:
      - title: 'Model Context Protocol specification (2025-06-18): Server Features — Overview'
        url: https://modelcontextprotocol.io/specification/2025-06-18/server
        locator: Server Features overview, control hierarchy table
      - source: ms-genai-javascript
        locator: 'Lesson 7: MCP, MCP Building Blocks'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/07-mcp/README.md#mcp-building-blocks
    source:
      id: ms-genai-javascript
      ref: lessons/07-mcp#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/07-mcp/README.md#knowledge-check
    status: reviewed
    reviewed_by: claude
  - id: rag-agents-048
    type: single
    difficulty: medium
    tags:
      - mcp
      - mcp-client
      - tool-calling
    question: |
      A plain MCP client lists a server's tools and the user must pick and call them by name. What
      changes when you add an LLM to the client?
    options:
      - text: The tools now run inside the LLM itself instead of on the MCP server
        why: The server still executes its tools; the LLM only chooses the call and its arguments [^1].
      - text: The MCP server no longer needs to describe its tools to the client
        why: The client still fetches the tool list and converts it into a tool schema for the LLM [^1].
      - text: The client can now connect to only one of the server's tools at a time
        why: Adding an LLM does not limit the number of tools; it chooses among all of them [^1].
      - text: Users ask in natural language and the LLM picks the server tool to call
        correct: true
    explanation: |
      With an LLM in the client, the client first asks the server for its tools and resources and turns
      them into a tool schema for the LLM [^1]. At prompt time the user writes a natural-language request,
      the LLM picks the tool and its arguments, and the client makes the call — a more natural
      conversation than invoking server capabilities by hand [^1][^2].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 8: Enhancing MCP Clients with Large Language Models, Adding a Large Language Model to a Client'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/08-mcp-advanced/README.md#adding-a-large-language-model-to-a-client
