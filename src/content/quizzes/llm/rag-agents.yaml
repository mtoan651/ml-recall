  - id: rag-agents-030
    type: multiple
    difficulty: medium
    tags:
      - mcp
      - sdk
      - protocol
    question: |
      The official MCP SDKs (Python, TypeScript and others) are libraries for writing MCP clients
      and servers. Which of these tasks do they typically handle? Select all that apply.
    options:
      - text: Serializing and deserializing protocol messages
        correct: true
      - text: Registering and discovering capabilities
        correct: true
      - text: Managing connections between clients and servers
        correct: true
      - text: Hosting and running the large language model
        why: The SDKs connect applications to capabilities; the model runs in or behind the Host application [^1].
      - text: Deciding which tool the model should call for a user request
        why: That decision belongs to the Host and its LLM; the SDK only carries out the protocol [^2].
    explanation: |
      The SDKs implement the MCP specification so that developers can focus on their
      application's capabilities: they handle protocol-level communication, capability
      registration and discovery, message serialization and deserialization, connection management
      and error handling [^1]. Choosing which capability to invoke happens in the Host, often with
      the help of its LLM [^2].
    references:
      - source: hf-mcp-course
        locator: Unit 1, MCP SDK — SDK Overview
        url: https://github.com/huggingface/mcp-course/blob/dbfa79bf6f311ae50256912308e169661996aab1/units/en/unit1/sdk.mdx
