title: RAG & Agents
questions:
  - id: rag-agents-001
    type: single
    difficulty: easy
    question: |
      What does observability in AI agents primarily refer to?

      Which statement accurately describes the purpose of observability for AI agents?
    options:
      - text: It involves tracking internal operations through logs, metrics, and spans to understand agent behavior.
        correct: true
      - text: It is solely focused on reducing the financial cost of running the agent.
        why: Observability covers cost but is not limited to it.
      - text: It means scoring the agent's answers on a test set whose correct outputs are known.
        why: That is offline evaluation. Observability collects the signals (logs, metrics, traces); evaluation analyzes them and runs tests.
      - text: It means recording only the final answer the agent returns to the user.
        why: Observability looks inside the run, at the actions, tool calls and model calls, not just at the final answer.
    explanation: |
      Observability means understanding what happens inside an agent from the signals it emits:
      logs, metrics and traces [^1]. A trace covers one whole task, and its spans are the individual
      steps, such as an LLM call or a tool call [^2]. Tracking actions, tool use, model calls and
      responses this way is what lets you debug the agent and improve it [^1]. Cost is one of the
      metrics it watches, alongside latency, request errors, user feedback and accuracy [^3].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-what-is-observability
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. What is Observability?
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#traces-and-spans
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Traces and Spans
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-key-metrics-to-monitor
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Key Metrics to Monitor
    source:
      id: hf-agents-course
      ref: bonus-unit2/quiz#q1
      url: https://huggingface.co/learn/agents-course/bonus-unit2/quiz
    status: draft
  - id: rag-agents-002
    type: single
    question: |
      Which of the following is NOT a common metric monitored in agent observability?

      Select the metric that does not typically fall under the observability umbrella.
    options:
      - text: Latency
        why: Latency is commonly tracked to assess agent responsiveness.
      - text: Cost per Agent Run
        why: Monitoring cost is a key aspect of observability.
      - text: User Feedback and Ratings
        why: User feedback is crucial for evaluating agent performance.
      - text: Lines of Code of the Agent
        correct: true
    explanation: The number of lines of code is not a typical observability metric. [^1]
    references:
      - source: hf-agents-course
        locator: Bonus Unit 2. Agent Observability and Evaluation
        url: https://huggingface.co/learn/agents-course/bonus-unit2/introduction
    source:
      id: hf-agents-course
      ref: bonus-unit2/quiz#q2
      url: https://huggingface.co/learn/agents-course/bonus-unit2/quiz
    status: draft
  - id: rag-agents-003
    type: single
    difficulty: easy
    question: |
      What best describes offline evaluation of an AI agent?

      Determine the statement that correctly captures the essence of offline evaluation.
    options:
      - text: Evaluating the agent using real user interactions in a live environment.
        why: This describes online evaluation rather than offline.
      - text: Assessing agent performance using curated datasets with known ground truth.
        correct: true
      - text: Monitoring the agent's internal logs in real-time.
        why: This is more related to observability rather than evaluation.
      - text: Comparing two versions of the agent with an A/B test on live traffic.
        why: A/B tests run on live traffic, so they are a form of online evaluation.
    explanation: |
      Offline evaluation tests the agent in a controlled setting on curated datasets whose expected
      outputs are known, for example a set of math word problems with their answers, typically
      during development or in a CI pipeline [^1]. Because there is ground truth, it is repeatable
      and gives clear accuracy metrics [^1]. Anything run on real user traffic in production,
      including A/B tests, is online evaluation [^2], and watching logs as they arrive is
      observability rather than a test against known answers.
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-offline-evaluation
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Offline Evaluation
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-online-evaluation
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Online Evaluation
    source:
      id: hf-agents-course
      ref: bonus-unit2/quiz#q3
      url: https://huggingface.co/learn/agents-course/bonus-unit2/quiz
    status: draft
  - id: rag-agents-004
    type: single
    difficulty: easy
    question: |
      Which advantage does online evaluation of agents offer?

      Pick the statement that best reflects the benefit of online evaluation.
    options:
      - text: It provides controlled testing scenarios using pre-defined datasets.
        why: Controlled testing is a benefit of offline evaluation, not online.
      - text: It captures live user interactions and real-world performance data.
        correct: true
      - text: It eliminates the need for any offline testing and benchmarks.
        why: Both offline and online evaluations are important and complementary.
      - text: It solely focuses on reducing the computational cost of the agent.
        why: Cost monitoring is part of observability, not the primary advantage of online evaluation.
    explanation: |
      Online evaluation monitors the agent on real user interactions in production, so it captures
      what a lab test set can't anticipate, such as model drift over time and unexpected kinds of
      queries [^1]. Controlled tests on predefined datasets are offline evaluation. The two are
      complementary, not substitutes: teams usually loop between them, adding the failures seen
      online to the offline test set [^2]. Cost is one of many observability metrics, not the point
      of online evaluation.
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-online-evaluation
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Online Evaluation
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-combining-the-two
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Combining the two
    source:
      id: hf-agents-course
      ref: bonus-unit2/quiz#q4
      url: https://huggingface.co/learn/agents-course/bonus-unit2/quiz
    status: draft
  - id: rag-agents-005
    type: single
    difficulty: medium
    question: |
      What role does OpenTelemetry play in AI agent observability and evaluation?

      Which statement best describes the role of OpenTelemetry in monitoring AI agents?
    options:
      - text: It provides a standardized framework to instrument code, enabling the collection of traces, metrics, and logs for observability.
        correct: true
      - text: It acts as a replacement for manual debugging by automatically fixing code issues.
        why: Incorrect. The telemetry it collects helps you debug, but OpenTelemetry itself never changes or fixes code.
      - text: It primarily serves as a database for storing historical logs without real-time capabilities.
        why: Incorrect. OpenTelemetry is not a storage backend. It generates, collects and exports telemetry, and leaves storing and visualizing it to other tools.
      - text: It is used to optimize the computational performance of the AI agent by automatically tuning model parameters.
        why: Incorrect. OpenTelemetry is centered on observability rather than performance tuning.
    explanation: |
      OpenTelemetry is an open-source, vendor-neutral observability framework and toolkit. You
      instrument your code with it to generate, collect and export telemetry such as traces, metrics
      and logs, and any compatible backend can then store and analyze that data [^1]. Agent
      frameworks such as smolagents use the OpenTelemetry standard to expose their runs to
      observability tools like Langfuse [^2]. It is not a storage backend itself, and it neither
      fixes code nor tunes the model [^1].
    references:
      - title: What is OpenTelemetry? (OpenTelemetry documentation)
        url: https://opentelemetry.io/docs/what-is-opentelemetry/
        locator: What is OpenTelemetry? (definition, "OpenTelemetry is not an observability backend itself")
        quote: OpenTelemetry is not an observability backend itself.
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-observability-tools
        locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Observability Tools
    source:
      id: hf-agents-course
      ref: bonus-unit2/quiz#q5
      url: https://huggingface.co/learn/agents-course/bonus-unit2/quiz
    status: draft
  - id: rag-agents-006
    type: single
    difficulty: easy
    question: |
      What is an Agent?

      Which of the following best describes an AI Agent?
    options:
      - text: An AI model that can reason, plan, and use tools to interact with its environment to achieve a specific goal.
        correct: true
      - text: A system that solely processes static text, without any inherent mechanism to interact dynamically with its surroundings or execute meaningful actions.
        why: An Agent must be able to take an action and interact with its environment.
      - text: A conversational agent restricted to answering queries, lacking the ability to perform any actions or interact with external systems.
        why: A chatbot like this lacks the ability to take actions, making it different from an Agent.
      - text: An online repository of information that offers static content without the capability to execute tasks or interact actively with users.
        why: An Agent actively interacts with its environment rather than just providing static information.
    explanation: |
      The course defines an Agent as a system that uses an AI model to interact with its environment
      in order to achieve a user-defined objective, combining reasoning, planning and the execution
      of actions, often through external tools [^1]. What makes it an agent is this agency, the
      ability to act on its environment [^2]. A system that only processes text, a chatbot that can
      only answer questions and a static repository of information all lack it.
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
        locator: Unit 1. What is an Agent?, sec. Let's go more formal
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#the-big-picture-alfred-the-agent
        locator: 'Unit 1. What is an Agent?, sec. The Big Picture: Alfred The Agent'
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q1
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-007
    type: single
    difficulty: easy
    question: |
      What is the Role of Planning in an Agent?

      Why does an Agent need to plan before taking an action?
    options:
      - text: To primarily store or recall past interactions, rather than mapping out a sequence of future actions.
        why: Planning is about determining future actions, not storing past interactions.
      - text: To decide on the sequence of actions and select appropriate tools needed to fulfill the user’s request.
        correct: true
      - text: To execute a sequence of arbitrary and uncoordinated actions that lack any defined strategy or intentional objective.
        why: Planning ensures the Agent's actions are intentional and not random.
      - text: To merely convert or translate text, bypassing any process of formulating a deliberate sequence of actions or employing strategic reasoning.
        why: Planning is about structuring actions, not just converting text.
    explanation: |
      In the course's example, before fulfilling a request the agent reasons and plans: it works out
      the sequence of steps and the tools it needs, and only then acts [^1]. Planning is done by the
      agent's AI model, its "brain", which decides which actions to take in the situation [^2].
      Planning thoughts break a complex task into smaller steps and are revised as new observations
      arrive [^3]. Storing past interactions is memory, not planning, and planning is exactly what
      keeps the actions from being arbitrary.
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#the-big-picture-alfred-the-agent
        locator: 'Unit 1. What is an Agent?, sec. The Big Picture: Alfred The Agent'
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
        locator: Unit 1. What is an Agent?, sec. Let's go more formal (The Brain)
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/thoughts
        locator: 'Unit 1. Thought: Internal Reasoning and the ReAct Approach, introduction'
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q2
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-008
    type: single
    question: |
      How Do Tools Enhance an Agent's Capabilities?

      Why are tools essential for an Agent?
    options:
      - text: Tools let the LLM call external APIs by itself, so no agent code is needed to run them.
        why: An LLM can only output text. It writes a tool call, and the agent parses it and runs the tool on the LLM's behalf.
      - text: Tools are solely designed for memory storage, lacking any capacity to facilitate the execution of tasks or enhance interactive performance.
        why: Tools are primarily for performing actions, not just for storing data.
      - text: Tools retrain the LLM's weights on new data, so the Agent permanently learns new skills.
        why: Calling a tool doesn't change the model's weights; the tool's result is simply added to the conversation as an observation.
      - text: Tools provide the Agent with the ability to execute actions a text-generation model cannot perform natively, such as making coffee or generating images.
        correct: true
    explanation: Tools enable Agents to interact with the real world and complete tasks. [^1]
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/tools
        locator: Unit 1. What are Tools?, "How do tools work?"
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q3
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-009
    type: single
    question: |
      How Do Actions Differ from Tools?

      What is the key difference between Actions and Tools?
    options:
      - text: Actions are the steps the Agent takes, while Tools are external resources the Agent can use to perform those actions.
        correct: true
      - text: Actions and Tools are entirely identical components that can be used interchangeably, with no clear differences between them.
        why: No. Actions are the steps the Agent takes, while Tools are specific functions the Agent calls to carry some of them out.
      - text: Tools are broad utilities available for many different functions, whereas Actions are restricted to physical interactions with the real world.
        why: Not necessarily. Actions can involve both digital and physical tasks.
      - text: Actions inherently require the use of LLMs to be determined and executed, whereas Tools are designed to function autonomously without such dependencies.
        why: While LLMs help decide Actions, Actions themselves are not dependent on LLMs.
    explanation: |
      Actions are the concrete steps an Agent takes to interact with its environment, such as searching
      the web, querying a database or replying to the user [^1]. Tools are the functions the Agent can
      call to carry out some of those steps, for example a web-search or calculator function [^2].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/actions
        locator: 'Unit 1. Actions: Enabling the Agent to Engage with Its Environment'
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/tools
        locator: Unit 1. What are Tools?
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q4
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-010
    type: single
    question: |
      What Role Do Large Language Models (LLMs) Play in Agents?

      How do LLMs contribute to an Agent’s functionality?
    options:
      - text: LLMs function merely as passive repositories that store information, lacking any capability to actively process input or produce dynamic responses.
        why: LLMs actively process text input and generate responses, rather than just storing information.
      - text: LLMs serve as the reasoning 'brain' of the Agent, processing text inputs to understand instructions and plan actions.
        correct: true
      - text: LLMs execute the Agent's tools themselves, sending requests to external APIs directly without any agent code.
        why: An LLM can only output text. It writes the tool call, and the agent runs the tool on its behalf.
      - text: LLMs only turn the final result into polished text, while hand-written rules decide which actions to take.
        why: In an Agent, the LLM is the reasoning engine that decides the next action, not just a text formatter.
    explanation: LLMs enable the Agent to interpret, plan, and decide on the next steps. [^1]
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents
        locator: Unit 1. What is an Agent?
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q5
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-011
    type: single
    difficulty: easy
    question: |
      Which of the Following Best Demonstrates an AI Agent?

      Which real-world example best illustrates an AI Agent at work?
    options:
      - text: A static FAQ page on a website that provides fixed information and lacks any interactive or dynamic response capabilities.
        why: A static FAQ page does not interact dynamically with users or take actions.
      - text: A simple calculator that performs arithmetic operations based on fixed rules, without any capability for reasoning or planning.
        why: A calculator follows fixed rules without reasoning or planning, so it is not an Agent.
      - text: A virtual assistant like Siri or Alexa that can understand spoken commands, reason through them, and perform tasks like setting reminders or sending messages.
        correct: true
      - text: A video game NPC that operates on a fixed script of responses, without the ability to reason, plan, or use external tools.
        why: Unless the NPC can reason, plan, and use tools, it does not function as an AI Agent.
    explanation: |
      An agent understands natural language, reasons and plans, and acts on its environment [^1].
      Virtual assistants such as Siri or Alexa do all three: they interpret a spoken request, work
      out what it needs, and carry out actions such as setting reminders or sending messages [^2]. A
      static FAQ page and a calculator only return fixed content or apply fixed rules, and an NPC on
      a fixed script can't reason or use tools; the course counts an NPC as an agent only when an LLM
      lets it respond to and adapt to the player [^3].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
        locator: Unit 1. What is an Agent?, sec. Let's go more formal and closing summary
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#example-1-personal-virtual-assistants
        locator: 'Unit 1. What is an Agent?, sec. Example 1: Personal Virtual Assistants'
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#example-3-ai-non-playable-character-in-a-video-game
        locator: 'Unit 1. What is an Agent?, sec. Example 3: AI Non-Playable Character in a video game'
    source:
      id: hf-agents-course
      ref: unit1/quiz1#q6
      url: https://huggingface.co/learn/agents-course/unit1/quiz1
    status: draft
  - id: rag-agents-012
    type: single
    question: Which of the following best describes an AI tool?
    options:
      - text: A model component that only generates text responses
        why: Generating text is what the LLM itself does; a tool is something the agent calls to act beyond text.
      - text: A function or external API the agent can call to perform a specific task
        correct: true
      - text: A memory feature that stores the agent's past conversations
        why: Storing conversations is the agent's memory, not a tool; a tool is a callable function with a clear objective.
    explanation: Tools are executable functions that agents can use to perform specific tasks and interact with external environments. [^1]
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/tools
        locator: Unit 1. What are Tools?, "What are AI Tools?"
    source:
      id: hf-agents-course
      ref: unit1/quiz2#q1
      url: https://huggingface.co/learn/agents-course/unit1/quiz2
    status: draft
  - id: rag-agents-013
    type: single
    question: How do AI agents use tools as a form of "acting" in an environment?
    options:
      - text: By passively waiting for the user to give step-by-step instructions
        why: An agent acts on its own initiative; its LLM decides when a tool is needed.
      - text: By only returning pre-programmed responses to each request
        why: That describes a rule-based bot; an agent's LLM decides which tool to call and with which arguments.
      - text: By having the LLM write tool calls, which the agent then runs on its behalf
        correct: true
    explanation: |
      An LLM can only output text, so it cannot call a tool by itself. It writes a tool call (as text or
      code); the agent parses it, runs the tool on the LLM's behalf and adds the result to the
      conversation, so the LLM can plan its next step [^1].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/tools
        locator: Unit 1. What are Tools?, "How do tools work?"
    source:
      id: hf-agents-course
      ref: unit1/quiz2#q2
      url: https://huggingface.co/learn/agents-course/unit1/quiz2
    status: draft
  - id: rag-agents-014
    type: single
    question: What is a key feature of Agentic RAG?
    options:
      - text: It can only use document-based tools, to answer questions in a RAG workflow
        why: Agentic RAG can use different tools, including document-based tools.
      - text: It automatically answers questions without tools, like a chatbot
        why: Agentic RAG does use tools to answer questions.
      - text: It can decide to use any tool to answer questions, including RAG tools
        correct: true
      - text: It only works with Function Calling Agents
        why: Agentic RAG is not limited to Function Calling Agents.
    explanation: Agentic RAG has the flexibility to use different tools to answer questions. [^1]
    references:
      - source: hf-agents-course
        locator: Unit 2.2 The LlamaIndex framework
        url: https://huggingface.co/learn/agents-course/unit2/llama-index/introduction
