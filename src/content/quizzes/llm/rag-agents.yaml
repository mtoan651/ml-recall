        locator: 'Lesson 8: solution-quiz.md, Question 1'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/08-mcp-advanced/solutions/solution-quiz.md
    source:
