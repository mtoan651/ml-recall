  - id: rag-agents-041
    type: single
    difficulty: hard
    tags:
      - audit-trail
      - hash-chain
      - digital-signatures
    question: |
      An agent signs a receipt for every action with its private key, and each receipt stores the hash
      of the previous receipt (`previous_receipt_hash`). Receipts 1–4 form a chain. What would an attacker
      have to do to delete receipt 2 without the deletion being detected?
    options:
      - text: Nothing more than deleting it, because every receipt's signature is verified on its own
        why: Receipt 3 records the hash of receipt 2, so the gap shows up as a broken link at receipt 3 [^1].
      - text: Fix receipt 3's link and re-sign receipts 3 and 4, which needs the agent's private key
        correct: true
      - text: Only change receipt 3's previous-hash field so that it points at receipt 1 instead
        why: Editing receipt 3 changes its signed content, so its signature fails, and its new hash no longer matches receipt 4's link [^1].
      - text: Delete receipt 1 as well, so that the chain simply starts at receipt 3
        why: Receipt 3 would still point at a missing predecessor; deleting more receipts does not repair the chain.
    explanation: |
      Each receipt is signed over its content, and the content includes the hash of its predecessor [^1].
      Removing receipt 2 breaks the link stored in receipt 3; fixing that link changes receipt 3, which
      invalidates its signature and its hash, so receipt 4's link breaks too, and so on [^1]. Hiding the
      deletion therefore means re-signing every later receipt, which requires the agent's private key —
      infeasible if the key is kept in a hardware vault [^1][^2].
    references:
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 18: Securing AI Agents with Cryptographic Receipts, Chaining Receipts for Multi-Step Agents and Knowledge Check 4'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/18-securing-ai-agents/README.md#chaining-receipts-for-multi-step-agents
      - title: 'Wikipedia: Hash chain'
        url: https://en.wikipedia.org/wiki/Hash_chain
        locator: Introduction
    source:
      id: ms-ai-agents-for-beginners
      ref: 18-securing-ai-agents#q4
