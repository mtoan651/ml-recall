      ref: chapter12/2#q1
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-002
    type: single
    question: What is the main advantage of RLHF for training language models?
    options:
      - text: It helps align models with human preferences and values
        correct: true
      - text: It makes models generate text faster
        why: RLHF isn't primarily about improving generation speed.
      - text: It reduces the model's memory usage
        why: RLHF doesn't focus on model efficiency or memory optimization.
    explanation: Correct! RLHF uses human feedback to guide models toward more helpful, harmless, and aligned behavior. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
    source:
      id: hf-llm-course
      ref: chapter12/2#q2
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-003
    type: single
    question: In the context of RL for LLMs, what represents an "action"?
    options:
      - text: Generating words or choosing responses in a conversation
        correct: true
      - text: Updating model weights
        why: This is part of the training process, not an action in the RL context.
      - text: Processing input tokens
        why: This is part of the model's operation, not an action in the RL context.
    explanation: Correct! For LLMs, actions typically involve text generation decisions. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
    source:
      id: hf-llm-course
      ref: chapter12/2#q3
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-004
    type: single
    question: What is the role of the reward in RL training of language models?
    options:
      - text: To score how well the model's responses match the desired behavior
        correct: true
      - text: To measure how large the model's vocabulary is
        why: Rewards aren't used to evaluate vocabulary knowledge.
      - text: To determine how fast the model is trained
        why: Rewards provide feedback on response quality, not training efficiency.
    explanation: Correct! Rewards guide the model toward generating more helpful, truthful, and appropriate responses. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
    source:
      id: hf-llm-course
      ref: chapter12/2#q4
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-005
    type: single
    question: What is a reward in the context of RL for LLMs?
    options:
      - text: A numerical score that measures the quality of a response
        correct: true
      - text: A function that generates responses
        why: Rewards are feedback on response quality, not the generation process itself.
      - text: A model that evaluates the quality of responses
        why: Rewards are feedback on response quality, not an evaluation model.
    explanation: Correct! Rewards provide feedback on response quality, guiding the model toward desired behavior. [^1]
    references:
