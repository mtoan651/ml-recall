  - id: alignment-016
    type: short_answer
    difficulty: easy
    tags:
      - reward-model
      - pairwise-loss
      - bradley-terry
    question: |
      A reward model is trained with the pairwise loss $-\log \sigma\big(r(x, y_w) - r(x, y_l)\big)$,
      where $y_w$ is the response the labeler preferred and $y_l$ the other one. On one comparison
      it currently outputs $r(x, y_w) = 0.5$ and $r(x, y_l) = 1.7$. What is the loss on this pair
      (natural log)?
    answer:
      numeric: 1.463
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $-\log \sigma(0.5 - 1.7) = \log(1 + e^{1.2}) \approx 1.463$
    explanation: |
      The loss is the negative log-likelihood of the label under the Bradley–Terry model, a binary
      classification on the reward difference [^1][^2]. Here the difference is $-1.2$, so the model
      gives the labeler's choice probability $\sigma(-1.2) \approx 0.231$ and the loss is
      $-\log 0.231 \approx 1.463$. If the scores were the other way round, the loss would be only
      $\log(1 + e^{-1.2}) \approx 0.263$, so the gradient mainly pushes $r(x, y_w)$ up and
      $r(x, y_l)$ down on pairs the model gets wrong [^3].
    references:
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback (InstructGPT)
        url: https://arxiv.org/abs/2203.02155
