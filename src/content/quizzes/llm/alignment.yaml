  - id: alignment-007
    type: single
    question: What is the 'Aha Moment' phenomenon in R1-Zero's training?
    options:
      - text: A process where the model recognizes errors, self-corrects, and explains its corrections
        correct: true
      - text: The point where the model reaches human-level performance
        why: The 'Aha Moment' specifically refers to the model's ability to recognize and correct its own mistakes, similar to human problem-solving realizations.
      - text: When the model completes its training process
        why: The 'Aha Moment' is about the model's emergent ability to recognize errors and self-correct during problem-solving, not about training completion.
    explanation: |
      The 'Aha Moment' is the model learning, without being programmed to, to stop and rethink its own
      work. The HF course breaks it into four steps: an initial attempt, recognizing an error or
      inconsistency, self-correcting, and explaining why the new approach is better [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Breakthrough 'Aha' Moment"
    source:
      id: hf-llm-course
      ref: chapter12/3#q3
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-008
    type: single
    question: How does GRPO's group formation work?
    options:
      - text: It samples 4–16 answers to the same prompt and scores them together
        correct: true
      - text: It combines several different models into one ensemble
        why: GRPO uses a single model to generate multiple solution attempts, not an ensemble of different models.
      - text: It splits the training data into different groups
        why: GRPO's group formation involves generating multiple solutions for the same problem, not splitting training data.
    explanation: Correct! GRPO generates multiple attempts at solving the same problem, typically 4, 8, or 16 different attempts, which are then evaluated as a group. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
    source:
      id: hf-llm-course
      ref: chapter12/3#q4
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-009
    type: single
    question: What is the key difference between DeepSeek-R1-Zero and DeepSeek-R1?
    options:
      - text: R1-Zero is trained with pure RL; R1 adds supervised fine-tuning
        correct: true
      - text: R1-Zero is a smaller version of R1 with fewer parameters
        why: The difference is in their training approaches (pure RL vs. multi-phase), not their model sizes.
      - text: R1-Zero was pre-trained on much less text than R1
        why: 'The key distinction is their training methodology: pure RL for R1-Zero versus a combined SFT and RL approach for R1.'
    explanation: |
      DeepSeek-R1-Zero is trained with reinforcement learning only, with no supervised fine-tuning.
      DeepSeek-R1 builds on it with a multi-phase pipeline that combines supervised fine-tuning and RL,
      which gives it better language consistency and readability [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Training Process"
    source:
      id: hf-llm-course
      ref: chapter12/3#q5
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-010
    type: single
    difficulty: medium
    question: What is the main contribution of the DeepSeek-R1 paper (2025)?
    options:
      - text: Introducing GRPO, a new RL algorithm that compares groups of sampled answers
        why: R1 is trained with GRPO, but GRPO was introduced earlier, in the DeepSeekMath paper (2024).
      - text: Training with far more GPUs and compute than any earlier language model
        why: The contribution is the training method, not the amount of compute.
      - text: Scaling the model to more parameters than any existing language model
        why: The contribution is the training method, not the model size.
      - text: Showing that reasoning can emerge from RL alone, without human-written reasoning examples
        correct: true
    explanation: |
      The paper set out to test whether pure reinforcement learning could develop reasoning without
      supervised fine-tuning [^1]. Its abstract reports that reasoning can be incentivized through
      pure RL, without human-labelled reasoning trajectories, with self-reflection and verification
      emerging during training [^2]; R1 then adds supervised phases for readability [^1]. GRPO, the
      RL algorithm it uses, was introduced earlier in DeepSeekMath [^3], even though the course page
      presents it as new in R1 [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: 'Chapter 12.3: Understanding the DeepSeek R1 Paper, introduction and sec. The Training Process'
      - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning'
        url: https://arxiv.org/abs/2501.12948
        locator: Abstract
      - title: 'Shao et al. (2024), DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models'
        url: https://arxiv.org/abs/2402.03300
        locator: Abstract
    source:
      id: hf-llm-course
      ref: chapter12/3#q1
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
