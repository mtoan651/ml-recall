    question: |
      Perez et al. (2022) red-team a chatbot with a second "red" language model that writes test
      questions, while a classifier flags offensive replies. When the red LM is trained with RL to
      elicit offensive replies, a KL penalty with weight $\alpha$ keeps it close to its initial
      distribution. What happened as $\alpha$ was lowered?
    options:
      - text: Fewer of its questions drew offensive replies, but the questions became more diverse
        why: That describes raising $\alpha$; lowering it trades diversity for expected reward, letting RL push harder on the reward [^1].
      - text: Its questions became more diverse and also drew offensive replies more often
        why: The methods traded diversity against harmfulness; with low $\alpha$ the red LM converged on one successful pattern [^1].
      - text: Nothing changed, because the KL penalty affects only the training speed
        why: The penalty changes what the red LM generates; without enough of it, RL collapses toward a single high-reward kind of question [^1].
      - text: More of its questions drew offensive replies, but the questions became less diverse
        correct: true
    explanation: |
      The KL penalty is there to stop RL from collapsing onto a single high-reward generation [^1].
      With lower penalties RL elicited offensive replies most often, over 40% of the time at
      $\alpha = 0.3$, but then 78% of its test cases contained the word "invisible": the red LM had
      converged on one successful pattern. The methods trade diversity against difficulty [^1]. Manual
      red teaming by people is the other approach: Ganguli et al. released 38,961 human red-team
      attacks and found RLHF models harder to red team as they scale [^2].
    references:
      - title: Perez et al. (2022), Red Teaming Language Models with Language Models
        url: https://arxiv.org/abs/2202.03286
        locator: Sec. 2.2 Test Case Generation Methods (Reinforcement Learning); Sec. 3.2 Results
