  - id: alignment-017
    type: true_false
    difficulty: medium
    tags:
      - reward-model
      - shift-invariance
      - normalization
    shuffle: false
    question: |
      A reward model is trained with the pairwise loss $-\log \sigma\big(r(x, y_w) - r(x, y_l)\big)$.
      True or false: adding the same constant, say $+5$, to every reward the model outputs changes
      the value of this loss.
    options:
      - text: 'True'
        why: The constant cancels in the difference $r(x, y_w) - r(x, y_l)$, so the loss and its gradients are unchanged [^1].
      - text: 'False'
        correct: true
    explanation: |
      The loss depends only on reward differences, so the training data cannot fix the overall
      level of the rewards [^1][^2]. InstructGPT notes this invariance to shifts and therefore
      normalizes the reward model with a bias, so that labeler demonstrations get a mean score of 0
      before RL starts [^1]. The Bradley–Terry preference probability has the same property: it
      depends only on the difference of the two scores [^3].
    references:
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback (InstructGPT)
        url: https://arxiv.org/abs/2203.02155
