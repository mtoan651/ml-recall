  - id: alignment-006
    type: single
    question: What are the four phases of the DeepSeek R1 training process?
    options:
      - text: Cold Start, Reasoning RL, Rejection Sampling, and Diverse RL
        correct: true
      - text: Pre-training, Fine-tuning, Testing, and Deployment
        why: 'The paper specifically outlines four different phases: Cold Start (quality foundation), Reasoning RL (capability building), Rejection Sampling (quality control), and Diverse RL (broad alignment).'
      - text: Data Collection, Model Training, Evaluation, and Optimization
        why: The paper describes a specific four-phase process that includes Cold Start, Reasoning RL, Rejection Sampling, and Diverse RL phases.
    explanation: Correct! These are the exact four phases described in the paper, each serving a specific purpose in the training pipeline. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
