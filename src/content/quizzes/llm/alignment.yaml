  - id: alignment-009
    type: single
    question: What is the key difference between DeepSeek-R1-Zero and DeepSeek-R1?
    options:
      - text: R1-Zero uses pure RL while R1 combines RL with supervised fine-tuning
        correct: true
      - text: R1-Zero is smaller than R1
        why: The difference is in their training approaches (pure RL vs. multi-phase), not their model sizes.
      - text: R1-Zero was trained on less data
        why: 'The key distinction is their training methodology: pure RL for R1-Zero versus a combined SFT and RL approach for R1.'
    explanation: Correct! As shown in the comparison table, R1-Zero uses pure RL training while R1 uses a multi-phase approach combining supervised fine-tuning with RL, resulting in better language consistency. [^1]
