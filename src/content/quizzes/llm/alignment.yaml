    question: |
      Snell et al. (2024) compared spending extra inference-time compute on a smaller model with
      pretraining a roughly 14× larger model, at a matched FLOPs budget. What did they conclude?
    options:
      - text: It helps on easy and medium questions, but on the hardest ones more pretraining works better
        correct: true
      - text: One fixed strategy, best-of-N with as many samples as the budget allows, is optimal for every prompt
        why: The best strategy depends on the prompt's difficulty, and choosing it per prompt was about 4× more efficient than best-of-N [^2].
      - text: Extra test-time compute beats the larger pretrained model on questions of every difficulty level
        why: On the most challenging questions they saw very little benefit from more test-time compute; there, pretraining was more effective [^1].
      - text: Extra test-time compute never helps; at equal FLOPs the larger pretrained model always wins
        why: On easy and medium questions a smaller model with more test-time compute could outperform the 14× larger model [^1][^2].
    explanation: |
      The paper finds that how well a test-time method works depends strongly on the difficulty of
      the prompt, so it allocates test-time compute adaptively per prompt (a "compute-optimal"
      strategy), which is more than 4× more efficient than a best-of-N baseline [^2]. In the
      FLOPs-matched comparison, test-time compute can replace extra pretraining on questions within
      the model's capabilities, but on questions beyond them pretraining is likely more effective, so
      the two kinds of compute are not 1-to-1 exchangeable [^1].
