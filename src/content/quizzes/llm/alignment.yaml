title: Alignment & Reasoning
questions:
  - id: alignment-001
    type: single
    question: What are the key components of Reinforcement Learning?
    options:
      - text: Agent, Environment, Action, Reward, and Policy
        correct: true
      - text: Model, Data, Loss Function, and Optimizer
        why: These are components more commonly associated with supervised learning.
      - text: Input, Output, and Hidden Layers
        why: These are components of neural network architecture, not specifically RL components.
    explanation: Correct! These are the fundamental components that make up a reinforcement learning system. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
    source:
