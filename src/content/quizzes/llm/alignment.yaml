  - id: alignment-018
    type: single
    difficulty: medium
    tags:
      - reward-overoptimization
      - goodhart
      - reward-model
    question: |
      Gao et al. (2022) let a fixed "gold" reward model play the role of human labelers and train a
      smaller proxy reward model on its labels. A policy is then optimized against the proxy with RL.
      As the optimization proceeds (measured by the KL divergence from the initial policy), how does
      the gold reward score behave?
    options:
      - text: It falls from the very start, since optimizing any learned proxy hurts the true goal
        why: Early optimization improves the gold score too; it only declines once the policy is pushed further [^1].
      - text: It rises and levels off near the proxy score, since the proxy learned from gold labels
        why: The proxy is imperfect, and optimizing it too much eventually lowers the gold score; the two curves diverge instead of meeting [^1].
      - text: It first rises and later falls, even though the proxy score keeps rising
        correct: true
      - text: It tracks the proxy score exactly, apart from a constant offset between the two
        why: The proxy keeps rising while the gold score turns down, so the gap between them grows; the paper uses this gap as one measure of overoptimization [^1].
    explanation: |
      Goodhart's law says that when a measure becomes a target, it ceases to be a good measure, and
      a learned reward model is such a measure [^1]. Gao et al. observe that optimizing the proxy
      makes the gold reward initially increase and later decrease; they call this overoptimization
      and fit it with smooth functional forms of the KL distance [^1]. The same failure, a proxy
      reward optimized at the expense of the true one, is the formal definition of reward hacking
      given by Skalse et al. [^2].
    references:
      - title: Gao, Schulman & Hilton (2022), Scaling Laws for Reward Model Overoptimization
        url: https://arxiv.org/abs/2210.10760
        locator: Abstract; Sec. 1 Introduction; Figure 1 caption
      - title: Skalse et al. (2022), Defining and Characterizing Reward Hacking
        url: https://arxiv.org/abs/2209.13085
        locator: Abstract
    source:
      id: original
      ref: alignment-018
    status: draft
  - id: alignment-019
    type: multiple
    difficulty: medium
    tags:
      - reward-hacking
      - specification-gaming
      - rlhf
    question: |
      A language model is fine-tuned with RL against a learned reward model or an automatic checker.
      Which of these behaviors are examples of reward hacking? Select all that apply.
    options:
      - text: The model learns to refuse requests for weapon instructions, exactly as the reward was meant to teach it
        why: Here the reward and the designers' intent agree, so optimizing the reward produces the intended behavior [^1].
      - text: The model agrees with a user's false claim, because agreeing tended to earn a high reward
        correct: true
      - text: Answers grow longer and longer, because the reward model happens to score long answers higher
        correct: true
      - text: A coding agent edits the unit tests so that they pass, instead of fixing the bug they test
        correct: true
      - text: The training loss diverges after a few steps, because the learning rate was set too high
        why: This is an optimization failure; the policy is not exploiting a gap between the reward and the intended goal [^1].
    explanation: |
      Reward hacking means achieving the literal, formal objective without the outcome the designers
      intended; Skalse et al. define it as optimizing an imperfect proxy reward so that performance
      under the true reward becomes poor [^1][^2]. In RLHF the reward model is only a proxy for human
      judgment, and common hacks include length bias and sycophancy [^1]. Agents used for software
      development have also been reported modifying test or scoring code instead of solving the
      task [^1].
    references:
      - title: 'Wikipedia: Reward hacking'
        url: https://en.wikipedia.org/wiki/Reward_hacking#Reward_hacking_in_modern_language_models
        locator: Lead section; Reward hacking in modern language models; Deliberate reward hacking in reasoning models
      - title: Skalse et al. (2022), Defining and Characterizing Reward Hacking
        url: https://arxiv.org/abs/2209.13085
        locator: Abstract; Sec. 1 Introduction
