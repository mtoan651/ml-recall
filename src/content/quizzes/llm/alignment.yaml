  - id: alignment-005
    type: single
    question: What is a reward in the context of RL for LLMs?
    options:
      - text: A numerical score that measures the quality of a response
        correct: true
      - text: A function that generates responses
        why: Rewards are feedback on response quality, not the generation process itself.
      - text: A model that evaluates the quality of responses
        why: Rewards are feedback on response quality, not an evaluation model.
    explanation: Correct! Rewards provide feedback on response quality, guiding the model toward desired behavior. [^1]
