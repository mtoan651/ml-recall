  - id: alignment-003
    type: single
    question: In the context of RL for LLMs, what represents an "action"?
    options:
      - text: Generating words or choosing responses in a conversation
        correct: true
      - text: Updating model weights
        why: This is part of the training process, not an action in the RL context.
      - text: Processing input tokens
        why: This is part of the model's operation, not an action in the RL context.
    explanation: Correct! For LLMs, actions typically involve text generation decisions. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
