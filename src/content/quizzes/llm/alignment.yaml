title: Alignment & Reasoning
questions:
  - id: alignment-001
    type: single
    difficulty: easy
    question: What are the key components of Reinforcement Learning?
    options:
      - text: Agent, Environment, Action, Reward, and Policy
        correct: true
      - text: Model, Data, Loss Function, and Optimizer
        why: These are components more commonly associated with supervised learning.
      - text: Input, Output, and Hidden Layers
        why: These are components of neural network architecture, not specifically RL components.
    explanation: |
      In reinforcement learning an agent (for an LLM, the model itself) interacts with an
      environment: it takes actions, receives rewards as feedback, and improves its policy, the
      strategy that picks an action in each situation, so that it earns higher rewards [^1].
      Model, data, loss function and optimizer are the ingredients of an ordinary supervised
      training run, and input, output and hidden layers describe a network's architecture; neither
      list names the parts of this interaction loop.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#what-is-reinforcement-learning-rl
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. What is Reinforcement Learning (RL)? (Agent, Environment, Action, Reward, Policy)
    source:
      id: hf-llm-course
      ref: chapter12/2#q1
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-002
    type: single
    difficulty: easy
    question: What is the main advantage of RLHF for training language models?
    options:
      - text: It helps align models with human preferences and values
        correct: true
      - text: It makes models generate text much faster at inference time
        why: RLHF isn't primarily about improving generation speed.
      - text: It reduces the amount of memory the model needs to run
        why: RLHF doesn't focus on model efficiency or memory optimization.
    explanation: |
      Pre-training on next-word prediction makes an LLM fluent, but not necessarily helpful,
      harmless or aligned with what people prefer [^1]. RLHF uses human feedback as the reward
      signal: people compare responses, a reward model learns to predict their preferences, and the
      LLM is then fine-tuned with RL to produce responses that this reward model scores highly [^2].
      It changes what the model says, not how fast it generates text or how much memory it needs.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#role-of-rl-in-large-language-models-llms
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Role of RL in Large Language Models (LLMs)
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#reinforcement-learning-from-human-feedback-rlhf
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reinforcement Learning from Human Feedback (RLHF)
    source:
      id: hf-llm-course
      ref: chapter12/2#q2
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-003
    type: single
    difficulty: easy
    question: In the context of RL for LLMs, what represents an "action"?
    options:
      - text: Generating words or choosing responses in a conversation
        correct: true
      - text: Updating the model's weights after it receives a reward
        why: That is the learning step, in which the policy is improved after rewards come in. It is not an action taken in the environment.
      - text: Reading and encoding the tokens of the input prompt
        why: Taking in the prompt is how the agent observes its current state. The action is what it generates in response.
    explanation: |
      Actions are the choices an agent makes in its environment; when the agent is an LLM, they are
      text-generation decisions, such as which words to produce, which answer to give or how to
      respond in a conversation [^1]. The RL loop separates them from the other steps: the agent
      first observes its state (for an LLM, reads the prompt), then acts, receives a reward, and
      finally updates its policy, which for an LLM means updating its weights [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#action
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Action
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#the-rl-process-trial-and-error
        locator: 'Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. The RL Process: Trial and Error (table)'
    source:
      id: hf-llm-course
      ref: chapter12/2#q3
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-004
    type: single
    difficulty: easy
    question: What is the role of the reward in RL training of language models?
    options:
      - text: To score how well the model's responses match the desired behavior
        correct: true
      - text: To measure how large a vocabulary the model has learned to use
        why: Rewards aren't used to evaluate vocabulary knowledge. They score the quality of the responses the model generates.
      - text: To set how fast the model trains, the way a learning rate does
        why: Training speed is set by things like the optimizer and its learning rate. The reward is feedback on how good a response was.
    explanation: |
      In reinforcement learning, the reward is the feedback the environment gives the agent after an
      action, usually a number: positive when the action was good, negative as a penalty [^1]. For an
      LLM, rewards are designed to reflect how well a response does the task, for example how helpful,
      truthful or harmless it is [^1]. The model then updates its policy, reinforcing the responses that
      earned high rewards and moving away from those that earned low ones [^2]. The reward judges what
      the model says; it doesn't measure its vocabulary, and it isn't a training-speed setting.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#reward
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reward
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#the-rl-process-trial-and-error
        locator: 'Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. The RL Process: Trial and Error (table, steps 3-4)'
    source:
      id: hf-llm-course
      ref: chapter12/2#q4
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-005
    type: single
    difficulty: easy
    question: What is a reward in the context of RL for LLMs?
    options:
      - text: A numerical score that measures the quality of a response
        correct: true
      - text: A function that generates responses
        why: Rewards are feedback on response quality, not the generation process itself.
      - text: A model that evaluates the quality of responses
        why: Rewards are feedback on response quality, not an evaluation model.
    explanation: |
      A reward is the feedback the environment gives the agent after an action, and it is usually a
      number: positive for good behavior, negative as a penalty [^1]. For an LLM it scores a
      response, for example on how helpful, truthful or harmless it is [^1]. What generates the
      responses is the policy, the LLM itself. A model that scores responses is a reward model: in
      RLHF it is what produces the rewards, but the reward is the score it outputs, not the model [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#reward
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reward
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/2#reinforcement-learning-from-human-feedback-rlhf
        locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reinforcement Learning from Human Feedback (RLHF)
    source:
      id: hf-llm-course
      ref: chapter12/2#q5
      url: https://huggingface.co/learn/llm-course/chapter12/2
    status: draft
  - id: alignment-006
    type: single
    difficulty: medium
    question: What are the four phases of the DeepSeek R1 training process?
    options:
      - text: Cold Start, Reasoning RL, Rejection Sampling, and Diverse RL
        correct: true
      - text: Pre-training, Fine-tuning, Testing, and Deployment
        why: 'The paper specifically outlines four different phases: Cold Start (quality foundation), Reasoning RL (capability building), Rejection Sampling (quality control), and Diverse RL (broad alignment).'
      - text: Data Collection, Model Training, Evaluation, and Optimization
        why: The paper describes a specific four-phase process that includes Cold Start, Reasoning RL, Rejection Sampling, and Diverse RL phases.
    explanation: |
      DeepSeek-R1 starts from the pretrained DeepSeek-V3-Base and alternates supervised
      fine-tuning (SFT) and RL in four stages [^1][^2]; generic project stages such as testing and
      deployment are not part of this recipe.

      1. **Cold start:** SFT on thousands of high-quality, readable chain-of-thought examples.
      2. **Reasoning RL:** large-scale RL on verifiable tasks (math, code, science, logic), with
         rule-based rewards for correct answers.
      3. **Rejection sampling:** the RL checkpoint generates many answers, only good ones are kept
         (checked by rules or judged by DeepSeek-V3), and they become data for another round of SFT.
      4. **Diverse RL:** a final RL stage on all kinds of prompts, with rule-based rewards for
         reasoning and model-based rewards for human preferences such as helpfulness and harmlessness.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3#the-training-process
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. The Training Process (Cold Start, Reasoning RL, Rejection Sampling, Diverse RL)
      - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning, arXiv:2501.12948v1'
        url: https://arxiv.org/abs/2501.12948v1
        locator: 'Sec. 2.3 DeepSeek-R1: Reinforcement Learning with Cold Start, 2.3.1-2.3.4'
    source:
      id: hf-llm-course
      ref: chapter12/3#q2
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-007
    type: single
    question: What is the 'Aha Moment' phenomenon in R1-Zero's training?
    options:
      - text: A process where the model recognizes errors, self-corrects, and explains its corrections
        correct: true
      - text: The point where the model reaches human-level performance
        why: The 'Aha Moment' specifically refers to the model's ability to recognize and correct its own mistakes, similar to human problem-solving realizations.
      - text: When the model completes its training process
        why: The 'Aha Moment' is about the model's emergent ability to recognize errors and self-correct during problem-solving, not about training completion.
    explanation: |
      The 'Aha Moment' is the model learning, without being programmed to, to stop and rethink its own
      work. The HF course breaks it into four steps: an initial attempt, recognizing an error or
      inconsistency, self-correcting, and explaining why the new approach is better [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Breakthrough 'Aha' Moment"
    source:
      id: hf-llm-course
      ref: chapter12/3#q3
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-008
    type: single
    difficulty: easy
    question: How does GRPO's group formation work?
    options:
      - text: It samples 4–16 answers to the same prompt and scores them together
        correct: true
      - text: It combines several different models into one ensemble
        why: GRPO uses a single model to generate multiple solution attempts, not an ensemble of different models.
      - text: It splits the training data into different groups
        why: GRPO's group formation involves generating multiple solutions for the same problem, not splitting training data.
    explanation: |
      GRPO starts by forming a group: given a prompt, the model doesn't generate one response but
      several attempts at the same problem, usually 4, 8 or 16, which are kept together [^1]. Each
      attempt is scored by a reward function, and the rewards are normalized within the group,
      $A_i = (r_i - \operatorname{mean}(r)) / \operatorname{std}(r)$, so the model learns which answers
      were better or worse than their peers [^2]. All the attempts come from the one policy being
      trained [^3], not from an ensemble of different models, and a group is a set of answers to one
      prompt, not a split of the training data.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3#group-formation-creating-multiple-solutions
        locator: 'Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. Group Formation: Creating Multiple Solutions'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3#preference-learning-understanding-what-makes-a-good-solution
        locator: 'Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. Preference Learning: Understanding What Makes a Good Solution'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3#grpo-algorithm-in-pseudocode
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. GRPO Algorithm in Pseudocode (group_size outputs per prompt)
    source:
      id: hf-llm-course
      ref: chapter12/3#q4
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-009
    type: single
    question: What is the key difference between DeepSeek-R1-Zero and DeepSeek-R1?
    options:
      - text: R1-Zero is trained with pure RL; R1 adds supervised fine-tuning
        correct: true
      - text: R1-Zero is a smaller version of R1 with fewer parameters
        why: The difference is in their training approaches (pure RL vs. multi-phase), not their model sizes.
      - text: R1-Zero was pre-trained on much less text than R1
        why: 'The key distinction is their training methodology: pure RL for R1-Zero versus a combined SFT and RL approach for R1.'
    explanation: |
      DeepSeek-R1-Zero is trained with reinforcement learning only, with no supervised fine-tuning.
      DeepSeek-R1 builds on it with a multi-phase pipeline that combines supervised fine-tuning and RL,
      which gives it better language consistency and readability [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Training Process"
    source:
      id: hf-llm-course
      ref: chapter12/3#q5
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-010
    type: single
    difficulty: medium
    question: What is the main contribution of the DeepSeek-R1 paper (2025)?
    options:
      - text: Introducing GRPO, a new RL algorithm that compares groups of sampled answers
        why: R1 is trained with GRPO, but GRPO was introduced earlier, in the DeepSeekMath paper (2024).
      - text: Training with far more GPUs and compute than any earlier language model
        why: The contribution is the training method, not the amount of compute.
      - text: Scaling the model to more parameters than any existing language model
        why: The contribution is the training method, not the model size.
      - text: Showing that reasoning can emerge from RL alone, without human-written reasoning examples
        correct: true
    explanation: |
      The paper set out to test whether pure reinforcement learning could develop reasoning without
      supervised fine-tuning [^1]. Its abstract reports that reasoning can be incentivized through
      pure RL, without human-labelled reasoning trajectories, with self-reflection and verification
      emerging during training [^2]; R1 then adds supervised phases for readability [^1]. GRPO, the
      RL algorithm it uses, was introduced earlier in DeepSeekMath [^3], even though the course page
      presents it as new in R1 [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter12/3
        locator: 'Chapter 12.3: Understanding the DeepSeek R1 Paper, introduction and sec. The Training Process'
      - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning'
        url: https://arxiv.org/abs/2501.12948
        locator: Abstract
      - title: 'Shao et al. (2024), DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models'
        url: https://arxiv.org/abs/2402.03300
        locator: Abstract
    source:
      id: hf-llm-course
      ref: chapter12/3#q1
      url: https://huggingface.co/learn/llm-course/chapter12/3
    status: draft
  - id: alignment-011
    type: single
    difficulty: medium
    tags:
      - rlhf
      - kl-penalty
      - reward-model
    question: |
      In RLHF the policy maximises the reward model's score minus a penalty
      $\beta\,\mathrm{KL}(\pi_\theta \,\|\, \pi_{\text{ref}})$ to the reference (supervised) model. Why
      is the KL term there?
    options:
      - text: To keep the policy near the reference model so it cannot exploit reward-model flaws
        correct: true
      - text: To raise the probability of the responses with the highest reward even further than before
        why: Reward maximisation already does that; the KL term pulls the other way, toward the reference model [^2].
      - text: To make each training step cheaper to compute
        why: The penalty adds work (reference-model log-probabilities); its purpose is regularisation, not speed.
      - text: To remove biases that were present in the pretraining data
        why: The KL term keeps the policy near the reference model, so it preserves rather than removes the reference model's behaviour.
    explanation: |
      The reward model is only an approximation of human preferences, and a policy optimised hard
      against it finds outputs that score well without being good (reward over-optimisation) [^2].
      The per-token KL penalty to the supervised model keeps the policy's outputs close to what that
      model would say, which limits such exploitation and keeps the text fluent [^1][^2]. In
      InstructGPT this objective is optimised with PPO.
    references:
      - source: nptel-intro-llms
        locator: Assignment 8, Q8 and Q10 (KL divergence in regularized reward maximization; PPO)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback, arXiv:2203.02155
        url: https://arxiv.org/abs/2203.02155
        locator: Sec. 3.5 Models — Reinforcement learning (RL), Eq. (2)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment8#q8
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
    status: draft
