  - id: alignment-024
    type: short_answer
    difficulty: easy
    tags:
      - self-consistency
      - chain-of-thought
      - test-time-compute
    question: |
      A model is prompted with chain-of-thought exemplars for a math word problem. Greedy decoding
      gives the answer 26. With self-consistency, six reasoning paths are sampled instead:

      | Path | Final answer | Length-normalized probability of the path |
      |---|---|---|
      | 1 | 18 | 0.44 |
      | 2 | 26 | 0.52 |
      | 3 | 18 | 0.40 |
      | 4 | 14 | 0.47 |
      | 5 | 18 | 0.43 |
      | 6 | 26 | 0.49 |

      Aggregating by majority vote over the final answers, which answer does self-consistency
      return?
    answer:
      numeric: 18
      tolerance: 0
      hint: a number
      model: 18 appears in 3 of the 6 paths, 26 in 2 and 14 in 1, so the majority answer is 18.
    explanation: |
      Self-consistency replaces greedy decoding in chain-of-thought prompting: it samples a diverse
      set of reasoning paths and then marginalizes them out by taking a majority vote over the final
      answers, $\operatorname*{arg\,max}_a \sum_i \mathbb{1}(a_i = a)$ [^1]. Here 18 wins with three
      votes, although the single most probable path and the greedy decode both say 26. The idea is
      that correct reasoning paths, even if they differ, tend to agree on the final answer more than
      incorrect ones [^1]. Weighting the votes by the normalized path probabilities gave almost the
      same accuracy as the plain vote [^1]; the price is the extra compute for sampling many
      paths [^2].
    references:
      - title: Wang et al. (2023), Self-Consistency Improves Chain of Thought Reasoning in Language Models
        url: https://arxiv.org/abs/2203.11171
        locator: Sec. 2 Self-Consistency over Diverse Reasoning Paths; Table 1
      - title: Wang et al. (2023), Self-Consistency Improves Chain of Thought Reasoning in Language Models
        url: https://arxiv.org/abs/2203.11171
        locator: Sec. 5 Conclusion and Discussion (computation cost)
    source:
      id: original
      ref: alignment-024
    status: draft
