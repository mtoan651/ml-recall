    question: |
      Constitutional AI (Bai et al., 2022) trains a harmless assistant without any human labels of
      harmfulness; human oversight comes only from a written list of principles. How is the
      training organized?
    options:
      - text: Humans first rank answers by harmlessness to train a preference model, and afterwards the principles are used to write a supervised fine-tuning dataset
        why: No human harmlessness labels are used, and the supervised stage comes first; the comparison labels for harmlessness come from a model [^1].
      - text: A model invents new principles during training, and the policy is fine-tuned to imitate them directly, without any preference model or RL stage
        why: The constitution is written by people, and the second stage trains a preference model and runs RL against it [^1][^2].
      - text: The model critiques and revises its own answers by the principles and is tuned on the revisions; then AI-labeled pairs train a preference model for RL
        correct: true
      - text: The principles act as a fixed filter at inference time that blocks harmful outputs, so the model's weights are never trained on them at all
        why: Both stages train the model, first with supervised learning on revised responses, then with RL against a preference model [^1].
    explanation: |
      In the supervised stage, a helpful-only model answers harmful prompts, critiques its answer
      according to a principle drawn from the constitution, revises it, and a pretrained model is
      fine-tuned on the final revisions [^1]. In the RL stage, the fine-tuned model produces pairs of
      responses, a feedback model judges which one is less harmful according to a principle in a
      multiple-choice format, and a preference model trained on these AI labels (mixed with human
      helpfulness labels) provides the reward for RL, which the authors call RL from AI Feedback
      (RLAIF) [^1][^2]. The result is a harmless but non-evasive assistant that explains its
      objections to harmful requests [^2].
