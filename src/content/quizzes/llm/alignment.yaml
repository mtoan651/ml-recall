  - id: alignment-011
    type: single
    difficulty: medium
    tags:
      - rlhf
      - kl-penalty
      - reward-model
    question: |
      In RLHF the policy maximises the reward model's score minus a penalty
      $\beta\,\mathrm{KL}(\pi_\theta \,\|\, \pi_{\text{ref}})$ to the reference (supervised) model. Why
      is the KL term there?
    options:
      - text: To keep the policy near the reference model so it cannot exploit reward-model flaws
        correct: true
      - text: To raise the probability of the responses with the highest reward even further than before
        why: Reward maximisation already does that; the KL term pulls the other way, toward the reference model [^2].
      - text: To make each training step cheaper to compute
        why: The penalty adds work (reference-model log-probabilities); its purpose is regularisation, not speed.
      - text: To remove biases that were present in the pretraining data
        why: The KL term keeps the policy near the reference model, so it preserves rather than removes the reference model's behaviour.
    explanation: |
      The reward model is only an approximation of human preferences, and a policy optimised hard
      against it finds outputs that score well without being good (reward over-optimisation) [^2].
      The per-token KL penalty to the supervised model keeps the policy's outputs close to what that
      model would say, which limits such exploitation and keeps the text fluent [^1][^2]. In
      InstructGPT this objective is optimised with PPO.
    references:
      - source: nptel-intro-llms
        locator: Assignment 8, Q8 and Q10 (KL divergence in regularized reward maximization; PPO)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback, arXiv:2203.02155
        url: https://arxiv.org/abs/2203.02155
        locator: Sec. 3.5 Models — Reinforcement learning (RL), Eq. (2)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment8#q8
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
    status: draft
  - id: alignment-012
    type: short_answer
    difficulty: easy
    tags:
      - rlhf
      - instructgpt
      - pipeline
    question: |
      Complete InstructGPT's three-step RLHF recipe. First, labelers write demonstrations of the
      desired behavior, and a pretrained GPT-3 is fine-tuned on them with {{1}} learning. Second,
      labelers compare several outputs for the same prompt, and a {{2}} model is trained to predict
      which output they prefer. Third, the fine-tuned policy is optimized against that model's score
      with the RL algorithm {{3}}.
    answer:
      blanks:
        - accept:
            - supervised
          hint: one word
        - accept:
            - reward
            - preference
          hint: one word
        - accept:
            - PPO
            - proximal policy optimization
          hint: an abbreviation
      model: Supervised fine-tuning (SFT) on demonstrations, then a reward model trained on comparisons, then PPO against that reward model.
    explanation: |
      InstructGPT applies three steps: supervised fine-tuning (SFT) on labeler demonstrations, a
      reward model (RM) trained on labeler comparisons between outputs, and PPO fine-tuning of the
      SFT policy with the RM output as a scalar reward [^1]. The order matters: most comparison data
      are sampled from the SFT policy, and the RL policy starts from the SFT model [^1]. The DPO
      paper describes the same three phases as the standard RLHF pipeline [^2]. Steps 2 and 3 can be
      iterated, collecting new comparisons on the current best policy [^1].
    references:
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback (InstructGPT)
        url: https://arxiv.org/abs/2203.02155
        locator: Sec. 3.1 High-level methodology (Steps 1-3)
      - title: 'Rafailov et al. (2023), Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
        url: https://arxiv.org/abs/2305.18290
        locator: Sec. 3 Preliminaries (SFT, Reward Modelling Phase, RL Fine-Tuning Phase)
    source:
      id: original
      ref: alignment-012
    status: draft
  - id: alignment-013
    type: multiple
    difficulty: medium
    tags:
      - rlhf
      - instructgpt
      - kl-penalty
      - ppo-ptx
    question: |
      InstructGPT's RL step maximizes

      $$\text{objective}(\phi) = E_{(x,y) \sim D_{\pi_\phi^{RL}}}\left[r_\theta(x,y) - \beta \log \frac{\pi_\phi^{RL}(y \mid x)}{\pi^{SFT}(y \mid x)}\right] + \gamma\, E_{x \sim D_{\text{pretrain}}}\left[\log \pi_\phi^{RL}(x)\right]$$

      where $r_\theta$ is the reward model and $\pi^{SFT}$ the supervised fine-tuned model. Which
      statements about this step are correct? Select all that apply.
    options:
      - text: Each episode is one prompt and one response; the reward model scores the response once and the episode ends
        correct: true
      - text: The $\beta$ term is a per-token KL penalty toward the SFT model, meant to curb reward-model over-optimization
        correct: true
      - text: The reward model $r_\theta$ is trained by maximizing this same objective, jointly with the policy
        why: The reward model is trained beforehand on labeler comparisons with a pairwise loss; in this objective only the policy parameters $\phi$ are optimized [^1].
      - text: The $\gamma$ term (PPO-ptx) mixes in pretraining gradients to reduce performance drops on public NLP datasets
        correct: true
      - text: The $\beta$ term rewards the policy for moving far away from the SFT model, which encourages exploring new outputs
        why: The term is subtracted, so the policy is penalized, not rewarded, for drifting away from the SFT model [^1][^2].
    explanation: |
      The RL environment is a bandit: it shows a prompt, takes the response, assigns the reward-model
      score and ends the episode [^1]. The KL penalty from the SFT model is there to mitigate
      over-optimization of the reward model [^1]; it keeps the policy near the distribution on which
      the reward model is accurate and preserves output diversity [^2]. RLHF fine-tuning lowered
      scores relative to GPT-3 on public datasets such as SQuAD and DROP, an "alignment tax", and
      mixing in pretraining gradients (PPO-ptx, $\gamma > 0$) greatly reduces these regressions; with
      $\gamma = 0$ the models are called "PPO" [^1].
    references:
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback (InstructGPT)
        url: https://arxiv.org/abs/2203.02155
        locator: Sec. 3.5 Models (Reinforcement learning, Eq. 2); Sec. 1 Introduction (alignment tax)
      - title: 'Rafailov et al. (2023), Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
        url: https://arxiv.org/abs/2305.18290
        locator: Sec. 3 Preliminaries, RL Fine-Tuning Phase, Eq. (3)
    source:
      id: original
      ref: alignment-013
    status: draft
  - id: alignment-014
    type: short_answer
    difficulty: easy
    tags:
      - reward-model
      - comparisons
      - instructgpt
    question: |
      To collect preference data faster, InstructGPT shows a labeler $K$ responses to one prompt and
      asks for a full ranking, which is then split into pairwise comparisons for the reward model.
      For $K = 8$, how many pairwise comparisons does one ranking yield?
    answer:
      numeric: 28
      tolerance: 0
      hint: an integer
      model: $\binom{8}{2} = \frac{8 \cdot 7}{2} = 28$
    explanation: |
      A ranking of $K$ responses contains one comparison for every pair, $\binom{K}{2}$ in total;
      InstructGPT used $K$ between 4 and 9 [^1]. Each response appears in $K - 1 = 7$ of them, and
      comparisons from one prompt are strongly correlated, so shuffling them in as separate data
      points made the reward model overfit within one pass [^1]. InstructGPT therefore trains on all
      $\binom{K}{2}$ comparisons of a prompt as a single batch element, which also needs only one
      forward pass per response, and scales the loss by $1/\binom{K}{2}$ [^1][^2].
    references:
      - title: Ouyang et al. (2022), Training language models to follow instructions with human feedback (InstructGPT)
        url: https://arxiv.org/abs/2203.02155
        locator: Sec. 3.5 Models, Reward modeling (RM), Eq. (1) and footnote 5
      - title: 'Wikipedia: Reinforcement learning from human feedback'
        url: https://en.wikipedia.org/wiki/Reinforcement_learning_from_human_feedback#Reward_model
        locator: Training, Reward model
    source:
      id: original
      ref: alignment-014
    status: draft
  - id: alignment-015
    type: short_answer
    difficulty: medium
    tags:
      - bradley-terry
      - reward-model
      - preference-probability
    question: |
      A reward model is trained under the Bradley–Terry preference model,
      $P(y_1 \succ y_2 \mid x) = \sigma\big(r(x, y_1) - r(x, y_2)\big)$. For three responses $A$, $B$,
      $C$ to the same prompt it predicts $P(A \succ B) = 0.8$ and $P(B \succ C) = 0.6$. What
      probability does it assign to $A \succ C$?
    answer:
      numeric: 0.857
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $r_A - r_B = \ln 4$ and $r_B - r_C = \ln 1.5$, so $P(A \succ C) = \sigma(\ln 6) = 6/7 \approx 0.857$
    explanation: |
      In the Bradley–Terry model the log-odds of a preference is the difference of the two scores,
      $\log \frac{P(i \succ j)}{P(j \succ i)} = \beta_i - \beta_j$ [^1]. Odds of 4 (from 0.8) and 1.5
      (from 0.6) mean $r_A - r_B = \ln 4$ and $r_B - r_C = \ln 1.5$; the differences add, so the odds
      multiply to $4 \times 1.5 = 6$ and $P(A \succ C) = 6/7 \approx 0.857$. RLHF reward models use
      exactly this model: only reward differences matter, and they are turned into preference
      probabilities by the sigmoid [^2][^3].
    references:
