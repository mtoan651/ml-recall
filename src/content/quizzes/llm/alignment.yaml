  - id: alignment-020
    type: multiple
    difficulty: medium
    tags:
      - dpo
      - implicit-reward
      - kl-constraint
    question: |
      Direct Preference Optimization (DPO) trains a policy $\pi_\theta$ on a fixed dataset of
      preference pairs $(x, y_w, y_l)$ with the loss

      $$\mathcal{L}_{\text{DPO}} = -E\left[\log \sigma\left(\beta \log \frac{\pi_\theta(y_w \mid x)}{\pi_{\text{ref}}(y_w \mid x)} - \beta \log \frac{\pi_\theta(y_l \mid x)}{\pi_{\text{ref}}(y_l \mid x)}\right)\right]$$

      Which statements are correct? Select all that apply.
    options:
      - text: The loss is a Bradley–Terry likelihood in which the implicit reward replaces a learned reward model
        correct: true
      - text: A larger $\beta$ lets the policy drift further away from $\pi_{\text{ref}}$, because the preference signal is stronger
        why: $\beta$ weights the KL constraint toward the reference policy; a higher $\beta$ means less deviation from it [^1][^2].
      - text: No separate reward model is trained; the implicit reward is $\beta \log \frac{\pi_\theta(y \mid x)}{\pi_{\text{ref}}(y \mid x)}$
        correct: true
      - text: The reference model $\pi_{\text{ref}}$ is no longer needed once training starts, since only $\pi_\theta$ is updated
        why: Every term of the loss divides by $\pi_{\text{ref}}$, so its log-probabilities of $y_w$ and $y_l$ are needed for every pair [^1].
      - text: No responses are sampled from $\pi_\theta$ during training; the loss uses only the stored pairs
        correct: true
    explanation: |
      DPO starts from the same KL-constrained objective as RLHF, whose optimal policy can be written
      in closed form, so the reward can be expressed as $\beta \log \frac{\pi(y \mid x)}{\pi_{\text{ref}}(y \mid x)}$
      plus a term that cancels in the Bradley–Terry model [^1]. Plugging this into the Bradley–Terry
      likelihood gives a simple classification loss over policies, so DPO needs neither a standalone
      reward model nor an RL loop with sampling from the policy [^1]. In this objective $\beta$
      controls how far the policy may deviate from $\pi_{\text{ref}}$ [^1][^2].
    references:
      - title: 'Rafailov et al. (2023), Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
        url: https://arxiv.org/abs/2305.18290
        locator: Abstract; Sec. 3 Preliminaries, Eq. (3); Sec. 4 Direct Preference Optimization, Eqs. (5)-(7)
      - title: 'Hugging Face TRL docs: DPO Trainer (DPOConfig, parameter beta)'
        url: https://huggingface.co/docs/trl/dpo_trainer#trl.DPOConfig
        locator: DPOConfig, beta ("Higher β means less deviation from the reference model")
    source:
      id: original
      ref: alignment-020
    status: draft
  - id: alignment-021
    type: short_answer
    difficulty: hard
    tags:
      - dpo
      - code-reading
      - pytorch
    question: |
      This computes the DPO loss for one preference pair from summed log-probabilities of the whole
      responses. What does it print?

      ```python
      import torch
      import torch.nn.functional as F

      beta = 0.1
      # log-probabilities of the chosen and the rejected response
      policy_chosen, policy_rejected = torch.tensor(-42.0), torch.tensor(-55.0)
      ref_chosen, ref_rejected = torch.tensor(-45.0), torch.tensor(-50.0)

      logits = beta * ((policy_chosen - ref_chosen) - (policy_rejected - ref_rejected))
      loss = -F.logsigmoid(logits)
      print(round(loss.item(), 3))
      ```
    answer:
      numeric: 0.371
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $0.1 \cdot \big(3 - (-5)\big) = 0.8$ and $-\log \sigma(0.8) = \log(1 + e^{-0.8}) \approx 0.371$
    explanation: |
      The code is the DPO loss for one pair, $-\log \sigma\big(\beta \log \frac{\pi_\theta(y_w)}{\pi_{\text{ref}}(y_w)} - \beta \log \frac{\pi_\theta(y_l)}{\pi_{\text{ref}}(y_l)}\big)$
      [^1][^2]. The policy raised the chosen response's log-probability by 3 and lowered the rejected
      one's by 5 relative to the reference, so the implicit rewards are $0.3$ and $-0.5$ and
      the logit is $0.8$. The loss $\log(1 + e^{-0.8}) \approx 0.371$ is already below
      $\log 2 \approx 0.693$, its value when the policy equals the reference. Its gradient weights
      each pair by how wrongly the implicit reward orders the two responses, so pairs like this one,
      already ordered correctly, get a smaller weight [^1].
    references:
      - title: 'Rafailov et al. (2023), Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
        url: https://arxiv.org/abs/2305.18290
        locator: Sec. 4 Direct Preference Optimization, Eq. (7) and "What does the DPO update do?"
      - title: 'Hugging Face TRL docs: DPO Trainer'
        url: https://huggingface.co/docs/trl/dpo_trainer#computing-the-loss
        locator: Looking deeper into the DPO method, Computing the loss; Logged metrics (rewards/chosen, rewards/rejected)
    source:
      id: original
      ref: alignment-021
    status: draft
