  - id: alignment-002
    type: single
    question: What is the main advantage of RLHF for training language models?
    options:
      - text: It helps align models with human preferences and values
        correct: true
      - text: It makes models generate text faster
        why: RLHF isn't primarily about improving generation speed.
      - text: It reduces the model's memory usage
        why: RLHF doesn't focus on model efficiency or memory optimization.
    explanation: Correct! RLHF uses human feedback to guide models toward more helpful, harmless, and aligned behavior. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 12: Build Reasoning Models'
        url: https://huggingface.co/learn/llm-course/chapter12/1
