  - id: llm-basics-022
    type: single
    difficulty: easy
    tags:
      - prompt-engineering
      - specificity
    question: Which image-generation prompt follows prompt-engineering best practice most closely?
    options:
      - text: Show me an image of a red Volvo XC90 parked by a cliff at sunset
        correct: true
      - text: Show me an image of a red car
        why: It is vague about which car and what scene, so the model has to guess most details [^1].
      - text: Show me an image of a car, and be as creative as you can
        why: Asking for creativity without specifics hands every decision to the model and makes the result unpredictable [^1].
      - text: Show me an image of a red Volvo XC90
        why: Naming the make and model helps, but nothing describes the setting; it is the second-best prompt [^1].
    explanation: |
      Good prompts are specific: they say *what* (a red Volvo XC90 rather than "a car") and give the
      surrounding context (parked by a cliff at sunset) [^1]. The more of the intended content the
      prompt pins down, the less the model fills in on its own, and the closer the output is to what
      you wanted [^1][^2].
    references:
      - source: ms-genai-for-beginners
        locator: 'Lesson 04: Prompt Engineering Fundamentals, Best Practices and Knowledge check answer'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/04-prompt-engineering-fundamentals/README.md#best-practices
      - title: 'Wikipedia: Prompt engineering'
        url: https://en.wikipedia.org/wiki/Prompt_engineering#Text-to-image_prompting
        locator: Section "Text-to-image prompting"
    source:
      id: ms-genai-for-beginners
      ref: 04-prompt-engineering-fundamentals#q1
      url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/04-prompt-engineering-fundamentals/README.md#knowledge-check
    status: draft
  - id: llm-basics-023
    type: single
    difficulty: medium
    tags:
      - chain-of-thought
      - prompting
      - reasoning
    question: |
      An LLM answers "Alice has 5 apples, throws away 3, gives 2 to Bob and Bob gives one back. How many
      does she have?" with 5. You add a similar solved example that writes out each calculation step
      (7 − 1 = 6, 6 − 4 = 2, 2 + 1 = 3) before the question. Why does this chain-of-thought prompt help?
    options:
      - text: It guarantees a correct answer on every arithmetic problem
        why: Chain-of-thought improves multi-step reasoning on average but does not guarantee correctness [^2].
      - text: The model checks its own final answer against the example's final result
        why: The example has a different answer (3); the model reuses its method, not its result.
      - text: The extra example shortens the prompt, which leaves more of the context window for the answer
        why: A chain-of-thought prompt is longer, and the answer that follows uses even more tokens [^1].
      - text: The model copies the worked method and computes each intermediate step before answering
        correct: true
    explanation: |
      Chain-of-thought prompting shows the model how to solve a problem step by step, here by a similar
      example with its calculation written out [^1]. The model then generates its own intermediate steps
      ($5 - 3 = 2$, $2 - 2 = 0$, $0 + 1 = 1$) before the answer, which makes multi-step arithmetic and
      reasoning problems much more reliable [^1][^2]. Wei et al. showed that such step-by-step exemplars
      substantially improve large models on math word problems [^2].
    references:
      - source: ms-genai-for-beginners
        locator: 'Lesson 05: Creating Advanced prompts, Chain-of-thought'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/05-advanced-prompts/README.md#chain-of-thought
      - title: Wei et al. (2022), Chain-of-Thought Prompting Elicits Reasoning in Large Language Models, arXiv:2201.11903
        url: https://arxiv.org/abs/2201.11903
        locator: Abstract and Sec. 3 Arithmetic Reasoning
    source:
      id: ms-genai-for-beginners
      ref: 05-advanced-prompts#q1
      url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/05-advanced-prompts/README.md#knowledge-check
    status: draft
  - id: llm-basics-024
    type: single
    difficulty: easy
    tags:
      - temperature
      - sampling
      - decoding
    question: |
      A text-generation app uses an LLM's `temperature` parameter. What happens when you lower the
      temperature towards 0?
    options:
      - text: The model uses fewer tokens of the prompt, so it runs faster
        why: Temperature only reshapes the sampling distribution of each new token; the whole prompt is still processed.
      - text: The answers become guaranteed to be factually correct
        why: A low temperature picks the model's most likely continuation, which can still be wrong.
      - text: The output becomes more predictable, concentrating on the most likely next tokens
        correct: true
      - text: The responses become shorter, because the model generates fewer tokens at a low temperature
        why: Length is controlled by the token limit (e.g. `max_tokens`), not by the temperature.
    explanation: |
      Temperature controls how random the output is: higher values give more varied text, lower values
      more predictable text, with 0 the least varied [^1][^2]. Technically the logits are divided by the
      temperature before the softmax, so a low temperature sharpens the next-token distribution towards
      the most likely tokens [^3]. It does not change the response length or the facts the model knows.
    references:
      - source: ms-genai-for-beginners
        locator: 'Lesson 06: Building Text Generation Applications, Improve your setup (Experimenting with temperature)'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/06-text-generation-apps/README.md#improve-your-setup
      - source: ms-genai-for-beginners
        locator: 'Lesson 05: Creating Advanced prompts, Using temperature to vary your output'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/05-advanced-prompts/README.md#using-temperature-to-vary-your-output
      - title: 'Wikipedia: Softmax function'
        url: https://en.wikipedia.org/wiki/Softmax_function#Definition
        locator: Sections "Definition" (temperature $T = 1/\beta$) and "Smooth arg max"
    source:
      id: ms-genai-for-beginners
      ref: 06-text-generation-apps#q1
      url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/06-text-generation-apps/README.md#knowledge-check
    status: draft
  - id: llm-basics-025
    type: single
    difficulty: medium
    tags:
      - context-window
      - tokens
      - max-tokens
    question: |
      A model has a context window of 128k tokens and can generate at most 16k output tokens. What is
      the context window?
    options:
      - text: The `max_tokens` setting of a request, which caps how long the reply can be
        why: '`max_tokens` limits only the generated output; the context window is a fixed property of the model.'
      - text: The number of previous chat messages that the model takes into account when replying
        why: The limit is counted in tokens, not messages; how many earlier messages fit depends on their length [^1].
      - text: The most tokens the model can process at once, input and generated output together
        correct: true
      - text: A setting that controls how creative the model's replies are
        why: Creativity is controlled by sampling settings such as temperature, not by the context window.
    explanation: |
      The context window is the span of tokens the model can attend to in one go: the prompt, including
      the conversation history, plus the tokens it generates [^1][^2]. With a 128k window and at most 16k
      output tokens, about $128\text{k} - 16\text{k} = 112\text{k}$ tokens remain for the input [^2]. When
      a conversation grows beyond that, older messages must be dropped or summarized.
    references:
      - title: 'Wikipedia: Large language model'
        url: https://en.wikipedia.org/wiki/Large_language_model#Attention_mechanism_and_context_window
        locator: Section "Attention mechanism and context window"
      - source: ms-genai-javascript
        locator: 'Lesson 2: Writing Your First AI App, Context window'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/02-first-ai-app/README.md#context-window
    source:
      id: ms-genai-javascript
      ref: lessons/02-first-ai-app#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/02-first-ai-app/README.md#knowledge-check
    status: draft
  - id: llm-basics-026
    type: single
    difficulty: easy
    tags:
      - prompt-engineering
      - fine-tuning
    question: Which of these is an example of prompt engineering rather than model training?
    options:
      - text: Training the model on labelled examples to recognize patterns in data
        why: Training updates the model's weights; prompt engineering only changes the input [^1][^2].
      - text: Fine-tuning the model on your company's past support tickets
        why: Fine-tuning creates a new model with updated weights, which is training, not prompting [^2].
      - text: Rewriting the request with a role, examples and the required output format
        correct: true
      - text: Adding more layers to the model so that it can understand longer and more complex prompts
        why: Changing the architecture is model design; prompt engineering works with a fixed model.
    explanation: |
      Prompt engineering is crafting the prompt — instructions, context, examples, output format — to
      get the desired output from a language model whose weights stay fixed [^1]. Techniques such as
      few-shot prompting, chain-of-thought and meta prompts all work this way [^1]. Training or
      fine-tuning, by contrast, changes the model's weights on data [^2].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 3: Prompt Engineering, What is prompt engineering? and Prompt engineering techniques and strategies'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/03-prompt-engineering/README.md#what-is-prompt-engineering
      - source: ms-genai-for-beginners
        locator: 'Lesson 02: Exploring and comparing different LLMs, Fine-tuned model'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/02-exploring-and-comparing-different-llms/README.md#fine-tuned-model
    source:
      id: ms-genai-javascript
      ref: lessons/03-prompt-engineering#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/03-prompt-engineering/README.md#knowledge-check
    status: draft
  - id: llm-basics-027
    type: single
    difficulty: easy
    tags:
      - structured-output
      - json
      - information-extraction
    question: |
      A travel chatbot asks an LLM to return the destination, dates and budget from the user's message
      as JSON that follows a given schema, instead of a free-text answer. What is the main benefit?
    options:
      - text: Your code can parse, validate and pass the extracted fields to other services
        correct: true
      - text: The response uses no tokens, because JSON is not text
        why: JSON is generated as tokens like any other text.
      - text: The model no longer needs the user's message to produce an answer
        why: The fields are extracted *from* the user's message, so it is still required.
      - text: The model becomes unable to make mistakes in the extracted values
        why: A schema fixes the shape of the output, not the correctness of the values; they still need checking.
    explanation: |
      Structured output organizes the answer in a format such as JSON, XML or CSV, which makes it easy
      for other services to process, and is also easier for people to read [^1]. Asking for a fixed
      schema turns free text into data you can extract and validate, for example the destination, dates
      and budget of a trip request [^1].
    references:
      - source: ms-genai-javascript
        locator: 'Lesson 4: Structured Output, Structured Output and Extracting data from prompts'
        url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/04-structured-output/README.md#structured-output
    source:
      id: ms-genai-javascript
      ref: lessons/04-structured-output#q1
      url: https://github.com/microsoft/generative-ai-with-javascript/blob/03e41953411ca192bd69d37e6b784a0baaaab65b/lessons/04-structured-output/README.md#knowledge-check
