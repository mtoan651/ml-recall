  - id: llm-basics-031
    type: single
    difficulty: medium
    tags:
      - mechanistic-interpretability
      - induction-heads
      - in-context-learning
    question: |
      Interpretability research on transformers found "induction heads". What does an induction head
      do?
    options:
      - text: It looks back for an earlier copy of the current token and predicts what followed it
        correct: true
      - text: It attends only to punctuation tokens, in order to detect where sentences begin and end
        why: Induction heads copy continuations of repeated tokens; they are not specialised for punctuation [^2].
      - text: It masks future tokens so the model cannot look ahead
        why: The causal mask does that for every head; it is not a learned behaviour of one head.
      - text: It is a feed-forward layer that stores out-of-distribution facts
        why: An induction head is an attention head, formed together with a previous-token head [^2].
    explanation: |
      In a sequence "… A B … A", an induction head attends from the second A to the token after the
      first A, i.e. B, and copies it, so the model predicts B [^1][^2]. It works with a
      previous-token head in an earlier layer, forming a two-layer circuit, and Olsson et al. argue
      that such heads are a major mechanism behind in-context learning [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 10, Q7–Q8 (induction heads; circuits)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
      - title: Olsson et al. (2022), In-context Learning and Induction Heads, arXiv:2209.11895
        url: https://arxiv.org/abs/2209.11895
        locator: Abstract; Introduction (definition of induction heads)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment10#q7
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
