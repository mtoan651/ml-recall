  - id: llm-basics-032
    type: short_answer
    difficulty: medium
    tags:
      - next-token-prediction
      - sliding-window
      - data-loading
      - llms-from-scratch
    question: |
      The book's dataset cuts a tokenized text into input/target pairs with a sliding window:

      ```python
      token_ids = list(range(100, 110))          # 10 token IDs
      max_length, stride = 4, 2
      inputs, targets = [], []
      for i in range(0, len(token_ids) - max_length, stride):
          inputs.append(token_ids[i:i + max_length])
          targets.append(token_ids[i + 1:i + max_length + 1])
      print(len(inputs), targets[1])
      ```

      The last line prints {{1}} (the number of pairs) and a list whose first element is {{2}}.
    answer:
      blanks:
        - numeric: 3
          hint: an integer
        - numeric: 103
          hint: an integer
      model: '`3 [103, 104, 105, 106]`: windows start at 0, 2 and 4; each target is its input shifted by one.'
    explanation: |
      `range(0, 10 - 4, 2)` yields the start positions 0, 2 and 4, so there are 3 pairs [^1]. A window
      starting at 6 is excluded: its input `[106, …, 109]` would need the target token at index 10,
      which does not exist. The second pair starts at 2: input `[102, 103, 104, 105]` and target
      `[103, 104, 105, 106]`, the same tokens shifted one position to the right, so that position
      `j` of the target is the next token after position `j` of the input [^1]. A stride smaller than
      `max_length` makes consecutive windows overlap [^2].
    references:
      - source: llms-from-scratch
        locator: pkg/llms_from_scratch/ch02.py, GPTDatasetV1 (lines 11-31)
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/pkg/llms_from_scratch/ch02.py#L11-L31
      - source: llms-from-scratch
        locator: ch02/01_main-chapter-code/ch02.ipynb, Sec. 2.6 Data sampling with a sliding window
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/ch02/01_main-chapter-code/ch02.ipynb
    source:
