  - id: llm-basics-028
    type: single
    difficulty: easy
    tags:
      - tree-of-thought
      - chain-of-thought
      - prompting
    question: |
      What lets Tree-of-Thought (ToT) prompting solve problems that Chain-of-Thought (CoT) prompting
      fails on?
    options:
      - text: It explores several reasoning paths, evaluates them and can backtrack
        correct: true
      - text: It fine-tunes the model with reinforcement learning on each new problem
        why: ToT is an inference-time method; it uses the frozen model to propose and evaluate thoughts [^2].
      - text: It adds domain-specific heuristics that remove hallucinations
        why: ToT is a general search framework; it has no built-in domain knowledge and does not guarantee factuality [^2].
      - text: It removes the need to write any prompt for the model
        why: ToT still prompts the model, both to generate thoughts and to evaluate them [^2].
    explanation: |
      CoT generates one chain of reasoning left to right, so an early mistake cannot be undone [^1].
      ToT treats intermediate "thoughts" as nodes of a tree: the model proposes several next thoughts,
      rates how promising each is, and a search algorithm such as breadth-first or depth-first search
      expands the good ones and backtracks from dead ends [^2]. On tasks like the Game of 24 this
      deliberate search raised the success rate far above CoT [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 8, Q5 (why Tree-of-Thought is more effective than Chain-of-Thought)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
      - title: 'Yao et al. (2023), Tree of Thoughts: Deliberate Problem Solving with Large Language Models, arXiv:2305.10601'
        url: https://arxiv.org/abs/2305.10601
        locator: Abstract; Sec. 3 Tree of Thoughts
    source:
