  - id: llm-basics-018
    type: multiple
    difficulty: medium
    tags:
      - llm-applications
      - rag
      - hallucination
    question: |
      Your company is considering several projects that would rely on an LLM. Which of them are
      good use cases? Select all that apply.
    options:
      - text: Extracting structured fields from messy invoices
        correct: true
      - text: Answering employees' questions about current company policies from what the model learned in pretraining, without giving it the policy documents
        why: A pretrained model knows only its fixed training data, so it may give outdated answers about policies; retrieval-augmented generation (RAG) fixes this by giving it the current documents [^2].
      - text: Helping beginner programmers debug their Python code
        correct: true
      - text: Writing the results and reference list of a scientific journal article with no human checking
        why: Factual accuracy is critical here, and LLMs can hallucinate results or cite sources that do not exist [^1].
      - text: Generating creative writing prompts for students
        correct: true
    explanation: |
      Extracting structured data from unstructured text, code generation and debugging, and
      creative text generation are among the things LLMs do well [^1]. Tasks that require exact,
      verifiable facts, such as reported results and citations, are where hallucinations do the most
      harm [^1]. Questions about current or private information are a special case: most LLMs are
      trained on a fixed dataset with no access to new policies, so they answer such questions well
      only when retrieval supplies the relevant documents in the prompt [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 1. Introduction to LLM applications (What are LLMs good at?; When should you avoid using LLMs?)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 3.2 Retrieval-Augmented Generation (RAG)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
