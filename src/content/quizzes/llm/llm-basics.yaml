  - id: llm-basics-030
    type: multiple
    difficulty: medium
    tags:
      - knowledge-distillation
      - sequence-level-distillation
      - compression
    question: |
      Which statements about sequence-level knowledge distillation for language models are true?
      Select all that apply.
    options:
      - text: The student is trained on whole output sequences produced by the teacher, e.g. its beam-search outputs
        correct: true
      - text: It can be combined with word-level distillation, which matches the teacher's per-token distributions
        correct: true
      - text: It needs only the teacher's top-1 token at each position, with no sequence-level search
        why: Sequence-level distillation approximates the teacher's distribution over whole sequences, typically with beam search [^2].
      - text: It requires the teacher to write a chain-of-thought explanation for each example
        why: The student simply imitates the teacher's output sequences; no explanations are needed [^2].
    explanation: |
      Word-level distillation trains the student to match the teacher's next-token distribution at
      each position [^2]. Sequence-level distillation instead runs the teacher (e.g. with beam search)
      to produce output sequences and trains the student on them as targets, transferring the
      teacher's sequence-level behaviour [^1][^2]. Kim and Rush found the two complementary and
      combined them, with large gains for small translation models [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 10, Q10 (sequence-level distillation)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
      - title: Kim & Rush (2016), Sequence-Level Knowledge Distillation, arXiv:1606.07947
        url: https://arxiv.org/abs/1606.07947
        locator: Sec. 3.1 Word-Level Knowledge Distillation; Sec. 3.2 Sequence-Level Knowledge Distillation
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment10#q10
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
