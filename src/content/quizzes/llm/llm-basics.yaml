  - id: llm-basics-033
    type: short_answer
    difficulty: medium
    tags:
      - parameter-count
      - weight-tying
      - gpt-2
      - llms-from-scratch
    question: |
      The book's `GPTModel` with the GPT-2 small configuration has separate input-embedding and output
      layers. What does the last line print?

      ```python
      GPT_CONFIG_124M = {"vocab_size": 50257, "context_length": 1024, "emb_dim": 768,
                         "n_heads": 12, "n_layers": 12, "drop_rate": 0.1, "qkv_bias": False}
      model = GPTModel(GPT_CONFIG_124M)
      total = sum(p.numel() for p in model.parameters())
      print(total)                                    # 163009536
      print(model.tok_emb.weight.shape)               # torch.Size([50257, 768])
      print(model.out_head)                           # Linear(in_features=768, out_features=50257, bias=False)
      print(total - sum(p.numel() for p in model.out_head.parameters()))
      ```
    answer:
      numeric: 124412160
      tolerance: 0
      hint: an integer
      model: $163{,}009{,}536 - 768 \cdot 50{,}257 = 124{,}412{,}160$
    explanation: |
      The output head is a bias-free linear layer with a $50{,}257 \times 768$ weight, i.e.
      $38{,}597{,}376$ parameters, and $163{,}009{,}536 - 38{,}597{,}376 = 124{,}412{,}160$ [^1]. That
      is the "124M" of GPT-2 small: the original GPT-2 *ties* the output layer to the token-embedding
      matrix, which has exactly the same shape, so the large vocabulary matrix is stored and counted
      only once [^1]. The book keeps the two layers separate, which costs about 38.6 million extra
      parameters [^2].
    references:
      - source: llms-from-scratch
        locator: ch04/01_main-chapter-code/ch04.ipynb, Sec. 4.6 Coding the GPT model (parameter count and weight tying)
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/ch04/01_main-chapter-code/ch04.ipynb
