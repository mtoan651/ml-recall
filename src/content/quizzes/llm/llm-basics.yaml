  - id: llm-basics-036
    type: single
    difficulty: medium
    tags:
      - text-generation
      - end-of-sequence
      - batching
      - llms-from-scratch
    question: |
      The book's `generate` stops early with `if idx_next == eos_id: break`. You call it with a batch
      of two prompts, and at some step the next tokens are:

      ```python
      eos_id = 50256
      idx_next = torch.tensor([[50256], [13]])   # shape (2, 1): one sequence just ended
      if idx_next == eos_id:
          print("stop")
      ```

      What happens?
    options:
      - text: It raises a `RuntimeError` (ambiguous truth value)
        correct: true
      - text: It prints "stop", because at least one sequence produced the end token
        why: '`if` does not apply "any" implicitly; that would need `(idx_next == eos_id).any()`.'
      - text: It prints nothing, because not every sequence produced the end token
        why: '`if` does not apply "all" implicitly either; that would need `(idx_next == eos_id).all()`.'
      - text: It prints "stop", because `if` looks only at the first element
        why: PyTorch refuses to pick an element; converting a multi-element tensor to `bool` is an error.
    explanation: |
      `idx_next == eos_id` is an element-wise comparison with shape (2, 1). An `if` needs a single
      Python bool, and PyTorch only converts a tensor with exactly one element (like `.item()` [^1]),
      so it raises `RuntimeError: Boolean value of Tensor with more than one value is ambiguous`. The
      book's check [^2] therefore only works for a batch of one prompt, where `idx_next` has a single
      element. For batches you must say what you mean, for example stop when
      `(idx_next == eos_id).all()`, and keep padding the sequences that already ended.
    references:
      - title: 'PyTorch documentation: torch.Tensor.item'
        locator: torch.Tensor.item
        url: https://docs.pytorch.org/docs/stable/generated/torch.Tensor.item.html
      - source: llms-from-scratch
        locator: pkg/llms_from_scratch/ch05.py, generate (line 53)
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/pkg/llms_from_scratch/ch05.py#L53
    source:
