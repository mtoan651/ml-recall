      ref: chapter11/5#q3
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-004
    type: single
    question: What should be included in a comprehensive evaluation strategy?
    options:
      - text: Only standard benchmarks
        why: Incorrect! A comprehensive strategy should include multiple evaluation methods.
      - text: Standard benchmarks, custom evaluation datasets, and domain-specific testing
        correct: true
      - text: Only custom datasets specific to your use case
        why: Incorrect! While custom datasets are important, they shouldn't be the only evaluation method.
    explanation: Correct! A comprehensive strategy should include multiple layers of evaluation. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
