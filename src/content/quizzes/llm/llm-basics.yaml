        locator: 'Lesson 03: Using Generative AI Responsibly, Hallucinations'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/03-using-generative-ai-responsibly/README.md#hallucinations
      - source: ms-genai-for-beginners
        locator: 'Lesson 06: Building Text Generation Applications, Improve your setup (Experimenting with temperature)'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/06-text-generation-apps/README.md#improve-your-setup
