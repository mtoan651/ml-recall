  - id: llm-basics-029
    type: single
    difficulty: medium
    tags:
      - quantization
      - post-training-quantization
      - calibration
    question: |
      Post-training quantization (PTQ) converts a trained LLM to low precision without retraining it,
      but it still runs the model on a small calibration dataset. What is that data for?
    options:
      - text: To measure typical activation ranges and set the quantization scales
        correct: true
      - text: To fine-tune all of the weights briefly on that data and then save the updated model
        why: That would be quantization-aware training or fine-tuning with a training loss; PTQ only sets quantization parameters, and methods like GPTQ at most solve a layer-wise reconstruction problem on the calibration activations [^2].
      - text: To precompute and store the attention matrices of typical inputs
        why: Attention matrices depend on each new input and are never cached from calibration data.
      - text: To find outlier dimensions that magnitude pruning then removes
        why: Pruning is a separate compression method; calibration sets the quantization ranges [^2].
    explanation: |
      To map floating-point values to a few integer levels, PTQ needs a scale (and zero point) for
      each tensor or group [^1]. Weight ranges can be read off the weights themselves, but activation
      ranges depend on the inputs, so the model is run on a small set of representative examples to
      measure them [^1]. Methods such as GPTQ also use these calibration activations to quantize each
      layer's weights so that the layer's outputs change as little as possible [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 10, Q5 (why PTQ uses a calibration dataset)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
      - title: 'Frantar et al. (2022), GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers, arXiv:2210.17323'
        url: https://arxiv.org/abs/2210.17323
        locator: Abstract; Sec. 3 Background (layer-wise quantization on calibration data)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment10#q5
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
