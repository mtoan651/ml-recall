  - id: llm-basics-006
    type: single
    question: What is the purpose of creating custom evaluation datasets?
    options:
      - text: To reflect your specific use case and include real user queries from your domain
        correct: true
      - text: To replace standard benchmarks entirely
        why: Incorrect! Custom datasets should complement, not replace, standard benchmarks.
      - text: To make evaluation easier
        why: Incorrect! Creating custom datasets requires additional effort but provides more relevant evaluation.
    explanation: Correct! Custom datasets help ensure evaluation is relevant to your specific needs. [^1]
