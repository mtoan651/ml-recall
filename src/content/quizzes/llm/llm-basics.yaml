  - id: llm-basics-035
    type: short_answer
    difficulty: hard
    tags:
      - top-k-sampling
      - temperature
      - decoding
      - llms-from-scratch
    question: |
      The book's `generate` first applies top-k filtering and then temperature scaling. What does the
      last line print? Round to 3 decimals.

      ```python
      logits = torch.tensor([[1.0, 6.0, 3.0, 4.0, 2.0]])     # next-token logits, 5-token vocabulary
      top_k, temperature = 3, 2.0

      top_logits, _ = torch.topk(logits, top_k)
      min_val = top_logits[:, -1]
      logits = torch.where(logits < min_val, torch.tensor(float("-inf")), logits)
      logits = logits / temperature
      probs = torch.softmax(logits, dim=-1)
      print(probs[0, 1].item())
      ```
    answer:
      numeric: 0.629
      tolerance: 0.001
      hint: a number between 0 and 1, 3 decimals
      model: '0.629: $e^{3}/(e^{3} + e^{2} + e^{1.5})$'
    explanation: |
      `torch.topk` returns the 3 largest logits in descending order, `[6, 4, 3]` [^1], so `min_val`
      is 3 and the logits 1 and 2 are replaced by $-\infty$; those tokens get probability 0 [^2].
      Dividing by the temperature 2 gives 3, 1.5 and 2 for tokens 1, 2 and 3, and the softmax gives
      token 1 the probability $e^{3}/(e^{3} + e^{1.5} + e^{2}) \approx 20.09/31.96 \approx 0.629$.
      Without temperature scaling it would be $e^{6}/(e^{6} + e^{3} + e^{4}) \approx 0.844$: a
      temperature above 1 flattens the distribution over the tokens that survive top-k [^2].
    references:
      - title: 'PyTorch documentation: torch.topk'
        locator: torch.topk
        url: https://docs.pytorch.org/docs/stable/generated/torch.topk.html
      - source: llms-from-scratch
        locator: pkg/llms_from_scratch/ch05.py, generate (lines 19-59)
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/pkg/llms_from_scratch/ch05.py#L19-L59
