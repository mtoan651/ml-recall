  - id: llm-basics-015
    type: single
    difficulty: medium
    tags:
      - decoder-only
      - encoder-decoder
      - causal-attention
    question: |
      In machine translation the whole source sentence is known before decoding starts. What is a
      limitation of a decoder-only Transformer that reads "source + target" as one sequence under a
      causal mask?
    options:
      - text: Source tokens attend only to earlier tokens, so the source never gets a bidirectional encoding
        correct: true
      - text: It cannot generate a translation longer than the source sentence
        why: A decoder generates token by token until it emits an end token, at any length.
      - text: It cannot condition on the source at all, because a decoder-only model has no cross-attention layer
        why: The source is in its context window, and target tokens attend to it through self-attention.
      - text: It must be trained with a different loss than an encoder–decoder model
        why: Both are trained with next-token cross-entropy on the target tokens.
    explanation: |
      In a decoder-only model each token attends only to its past [^1], so even a source token near the
      start never sees the rest of the source. An encoder–decoder model encodes the source with
      unrestricted self-attention, where all input tokens attend to each other, and every target token
      attends to all of them through cross-attention [^1]. The decoder-only model also spends one
      context window and one set of weights on both source and target.
    references:
      - source: d2l
        locator: Sec. 11.9.2 Encoder–Decoder; 11.9.3.1 GPT and GPT-2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#encoder-decoder
      - source: d2l
        locator: Sec. 11.9.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/large-pretraining-transformers#ex4
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    status: draft
  - id: llm-basics-016
    type: single
    difficulty: medium
    tags:
      - bert
      - pretraining
      - cross-entropy
    question: |
      While a small BERT with a vocabulary of about 20,000 tokens is pretrained on WikiText-2, its
      masked-language-modeling (MLM) loss stays far above its next-sentence-prediction (NSP) loss. Why?
    options:
      - text: MLM chooses among ~20,000 tokens and NSP between 2, so even uniform guessing costs far more for MLM
        correct: true
      - text: The MLM loss is weighted ten times more heavily than the NSP loss in the total loss
        why: d2l simply adds the two losses with equal weight [^2].
      - text: NSP is computed on more examples per minibatch than MLM, which averages its loss down
        why: How many predictions are averaged does not change the typical size of each loss term.
      - text: The MLM head starts from random weights, while the NSP head starts out already pretrained
        why: Both heads are created and trained from scratch together during pretraining.
    explanation: |
      Each MLM prediction is a softmax over the whole vocabulary, while NSP is a binary decision [^1].
      The cross-entropy of a uniform guess is the log of the number of classes,
      $\ln 20000 \approx 9.9$ nats against $\ln 2 \approx 0.69$, and predicting a hidden word is also much harder than telling whether a sentence was
      randomly sampled from elsewhere in the corpus [^1]. The total pretraining loss is just the sum of
      the two [^2].
    references:
      - source: d2l
        locator: Sec. 15.8.5 Pretraining Tasks
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html#pretraining-tasks
      - source: d2l
        locator: Sec. 15.10.1 Pretraining BERT
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert-pretraining.html
      - source: d2l
        locator: Sec. 15.10.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert-pretraining.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-pretraining/bert-pretraining#ex1
      url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert-pretraining.html#exercises
    status: draft
  - id: llm-basics-017
    type: multiple
    difficulty: easy
    tags:
      - llm-applications
      - hallucination
      - high-stakes
    question: Which of these are good use cases for a large language model (LLM)? Select all that apply.
    options:
      - text: A chatbot that helps students find their way around a university website
        correct: true
      - text: Summarizing 1,000 open-text survey responses
        correct: true
      - text: Deciding on its own, without a lawyer's review, which clauses of a contract are legally risky
        why: Legal interpretation is high-stakes and needs a real understanding of the consequences; LLM mistakes there can be serious, so they should not decide alone [^1].
      - text: Giving patients medical diagnoses from the symptoms they describe
        why: Medical diagnosis is a high-stakes task where factual accuracy is critical, and LLMs can hallucinate [^1].
      - text: Drafting blog posts for a company website
        correct: true
    explanation: |
      LLMs are good at generating human-like text, summarizing information, extracting structured
      data from unstructured text and supporting information retrieval, which covers chatbots,
      summaries and content drafts [^1]. They should be avoided, or used with extreme caution, when
      factual accuracy is critical, since they can hallucinate facts and sources, and in high-stakes
      applications such as medical diagnoses or legal interpretation [^1].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 1. Introduction to LLM applications (What are LLMs good at?; When should you avoid using LLMs?)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
    source:
