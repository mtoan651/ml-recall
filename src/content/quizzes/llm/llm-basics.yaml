  - id: llm-basics-019
    type: single
    difficulty: medium
    tags:
      - in-context-learning
      - prompting
      - few-shot
    question: |
      A pretrained language model answers a task much better after you add a few worked examples
      (few-shot prompting) or ask it to reason step by step (chain-of-thought prompting). What has
      changed?
    options:
      - text: The examples in the prompt trigger a small gradient update of the model's weights
        why: Prompting runs only the forward pass; no loss is computed and no weights are updated [^2].
      - text: The model stores the examples and uses them for every later user
        why: The examples only live in the current context; a new conversation starts from the same frozen model [^2].
      - text: The model is fine-tuned on the prompt before it generates the answer
        why: Fine-tuning would update the weights on labeled data; few-shot prompting specifies the task purely through text [^2].
      - text: Only the input the model conditions on; its weights are the same as before
        correct: true
    explanation: |
      A language model generates a completion conditioned on its prompt, so changing the prompt
      changes the task it performs without changing the model [^1]. Few-shot and chain-of-thought
      prompts work by giving the model a context that makes the desired kind of answer more likely:
      the weights stay frozen, and the "learning" happens only in the context, which is why it is
      called in-context learning [^1][^2]. GPT-3 was evaluated this way, with tasks and
      demonstrations given "purely via text interaction" and no gradient updates [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 2. In-context learning, 2.1 Prompting (Questions for you)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
      - title: Brown et al. (2020), Language Models are Few-Shot Learners
        locator: Abstract; Sec. 1 Introduction (in-context learning)
        url: https://arxiv.org/abs/2005.14165
        quote: GPT-3 is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified purely via text interaction with the model.
    source:
      id: ubc-dsci575
      ref: lectures/notes/08_llms-applications.ipynb#ex8.3
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
