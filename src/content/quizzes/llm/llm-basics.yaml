title: LLM Fundamentals & Prompting
questions:
  - id: llm-basics-001
    type: single
    question: What are the main advantages of using automatic benchmarks for model evaluation?
    options:
      - text: They provide perfect real-world performance metrics
        why: Incorrect! While automatic benchmarks are useful, they don't always translate directly to real-world performance.
      - text: They allow for standardized comparison between models and provide reproducible results
        correct: true
      - text: They eliminate the need for any other form of evaluation
        why: Incorrect! Automatic benchmarks should be part of a comprehensive evaluation strategy, not the only method.
    explanation: Correct! This is one of the key benefits of automatic benchmarks. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q1
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-002
    type: single
    question: Which benchmark specifically tests knowledge across 57 different subjects?
    options:
      - text: BBH (Big Bench Hard)
        why: Incorrect! BBH focuses on complex reasoning tasks, not broad subject knowledge.
      - text: GSM8K
        why: Incorrect! GSM8K specifically targets mathematical problem-solving.
      - text: MMLU
        correct: true
    explanation: Correct! MMLU (Massive Multitask Language Understanding) tests knowledge across 57 subjects, from science to humanities. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q2
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-003
    type: single
    question: What is LLM-as-Judge?
    options:
      - text: Using one language model to evaluate another's outputs
        correct: true
      - text: A benchmark that tests judicial reasoning
        why: Incorrect! LLM-as-Judge refers to using one model to evaluate another, not testing judicial reasoning.
      - text: A method for training models on legal datasets
        why: Incorrect! This isn't related to training on legal data, but rather using one model to evaluate another's outputs.
    explanation: Correct! This is an alternative evaluation approach that can provide more nuanced feedback. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q3
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-004
    type: single
    question: What should be included in a comprehensive evaluation strategy?
    options:
      - text: Only standard benchmarks
        why: Incorrect! A comprehensive strategy should include multiple evaluation methods.
      - text: Standard benchmarks, custom evaluation datasets, and domain-specific testing
        correct: true
      - text: Only custom datasets specific to your use case
        why: Incorrect! While custom datasets are important, they shouldn't be the only evaluation method.
    explanation: Correct! A comprehensive strategy should include multiple layers of evaluation. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q4
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-005
    type: single
    question: What is a limitation of automatic benchmarks?
    options:
      - text: They are too expensive to run
        why: Incorrect! Cost isn't typically the main limitation of automatic benchmarks.
      - text: Benchmark performance doesn't always translate directly to real-world effectiveness
        correct: true
      - text: They can only evaluate small models
        why: Incorrect! Automatic benchmarks can be used to evaluate models of various sizes.
    explanation: Correct! This is a key limitation to keep in mind when using automatic benchmarks. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q5
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-006
    type: single
    question: What is the purpose of creating custom evaluation datasets?
    options:
      - text: To reflect your specific use case and include real user queries from your domain
        correct: true
      - text: To replace standard benchmarks entirely
        why: Incorrect! Custom datasets should complement, not replace, standard benchmarks.
      - text: To make evaluation easier
        why: Incorrect! Creating custom datasets requires additional effort but provides more relevant evaluation.
    explanation: Correct! Custom datasets help ensure evaluation is relevant to your specific needs. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
    source:
      id: hf-llm-course
      ref: chapter11/5#q6
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
