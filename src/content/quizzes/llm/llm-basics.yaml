domain: llm
topic: llm-basics
title: LLM Fundamentals & Prompting
questions:
  - id: llm-basics-001
    type: single
    difficulty: easy
    question: What are the main advantages of using automatic benchmarks for model evaluation?
    options:
      - text: They provide perfect real-world performance metrics
        why: Incorrect! While automatic benchmarks are useful, they don't always translate directly to real-world performance.
      - text: They allow for standardized comparison between models and provide reproducible results
        correct: true
      - text: They eliminate the need for any other form of evaluation
        why: Incorrect! Automatic benchmarks should be part of a comprehensive evaluation strategy, not the only method.
    explanation: |
      Automatic benchmarks are curated datasets with predefined tasks and metrics. Their key advantage
      is standardization: every model is scored the same way, so results can be compared across models
      and reproduced [^1]. They are not a perfect proxy, though: a model that excels at academic
      benchmarks may still struggle in a specific domain, so benchmarks are only one part of a
      comprehensive evaluation strategy [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#understanding-automatic-benchmarks
        locator: Chapter 11.5 Evaluation, secs. Automatic Benchmarks and Understanding Automatic Benchmarks
        quote: The key advantage of using automatic benchmarks is their standardization - they allow for consistent comparison across different models and provide reproducible results.
    source:
      id: hf-llm-course
      ref: chapter11/5#q1
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-002
    type: single
    difficulty: easy
    question: Which benchmark specifically tests knowledge across 57 different subjects?
    options:
      - text: BBH (Big Bench Hard)
        why: Incorrect! BBH focuses on complex reasoning tasks, not broad subject knowledge.
      - text: GSM8K
        why: Incorrect! GSM8K specifically targets mathematical problem-solving.
      - text: MMLU
        correct: true
    explanation: |
      MMLU (Massive Multitask Language Understanding) tests knowledge across 57 subjects, from science
      to the humanities [^1]. BBH (Big Bench Hard) and GSM8K are reasoning benchmarks instead: BBH tests
      logical thinking and planning, and GSM8K targets mathematical problem-solving [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#general-knowledge-benchmarks
        locator: Chapter 11.5 Evaluation, secs. General Knowledge Benchmarks and Reasoning Benchmarks
        quote: MMLU (Massive Multitask Language Understanding) tests knowledge across 57 subjects, from science to humanities.
    source:
      id: hf-llm-course
      ref: chapter11/5#q2
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-003
    type: single
    difficulty: easy
    question: What is LLM-as-Judge?
    options:
      - text: Using one language model to evaluate another's outputs
        correct: true
      - text: A benchmark that tests judicial reasoning
        why: Incorrect! LLM-as-Judge refers to using one model to evaluate another, not testing judicial reasoning.
      - text: Letting users vote on which of two anonymous models answered better
        why: Incorrect! That is an evaluation arena such as Chatbot Arena, where the judges are crowds of human users, not a model.
    explanation: |
      LLM-as-Judge means using one language model to evaluate the outputs of another. It can give more
      nuanced feedback than traditional metrics, but the judge model brings its own biases and
      limitations [^1]. It is an evaluation method, not a benchmark, and it differs from evaluation
      arenas such as Chatbot Arena, where human users chat with two anonymous models and vote for the
      better answer [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#alternative-evaluation-approaches
        locator: Chapter 11.5 Evaluation, secs. LLM-as-Judge and Evaluation Arenas
    source:
      id: hf-llm-course
      ref: chapter11/5#q3
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-004
    type: single
    difficulty: easy
    question: What should be included in a comprehensive evaluation strategy?
    options:
      - text: Only standard benchmarks, since they are reproducible and comparable
        why: Incorrect! A comprehensive strategy should include multiple evaluation methods.
      - text: Standard benchmarks, custom evaluation datasets, and domain-specific testing
        correct: true
      - text: Only custom datasets built from real queries in your own domain
        why: Incorrect! While custom datasets are important, they shouldn't be the only evaluation method.
    explanation: |
      No single kind of test is enough. Standard benchmarks give a baseline and allow comparison with
      other models, but they should not be the only method [^1]. On top of them you build custom
      evaluation datasets from your actual use case (real user queries, edge cases, hard scenarios) and
      add further layers such as human evaluation, domain-expert review and A/B testing [^1]. Custom data
      alone would lose the comparison with other models; benchmarks alone miss what matters in your
      domain.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#custom-evaluation
        locator: Chapter 11.5 Evaluation, sec. Custom Evaluation
    source:
      id: hf-llm-course
      ref: chapter11/5#q4
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-005
    type: single
    difficulty: easy
    question: What is a limitation of automatic benchmarks?
    options:
      - text: They are too expensive to run for most model developers
        why: Incorrect! Cost isn't typically the main limitation of automatic benchmarks.
      - text: A high benchmark score may not carry over to real-world use
        correct: true
      - text: They can only evaluate models below a certain size
        why: Incorrect! Automatic benchmarks can be used to evaluate models of various sizes.
    explanation: |
      Benchmark performance doesn't always translate directly into real-world effectiveness: a model
      that excels at academic benchmarks may still struggle with a specific domain or practical use case
      [^1]. Each benchmark also has blind spots; MMLU, for instance, may not reflect the depth of
      expertise a specific domain needs [^1]. That is why benchmarks should be only one part of the
      evaluation, next to custom, domain-specific tests [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#understanding-automatic-benchmarks
        locator: Chapter 11.5 Evaluation, secs. Understanding Automatic Benchmarks, General Knowledge Benchmarks and Custom Evaluation
    source:
      id: hf-llm-course
      ref: chapter11/5#q5
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-006
    type: single
    difficulty: easy
    question: What is the purpose of creating custom evaluation datasets?
    options:
      - text: To reflect your use case, e.g. with real user queries from your domain
        correct: true
      - text: To replace standard benchmarks entirely with in-house tests
        why: Incorrect! Custom datasets should complement, not replace, standard benchmarks.
      - text: To make evaluation easier and cheaper than running benchmarks
        why: Incorrect! Creating custom datasets requires additional effort but provides more relevant evaluation.
    explanation: |
      Standard benchmarks give a baseline, but they know nothing about your application. Custom
      evaluation datasets are built to reflect your actual use case: real user queries from your
      domain, edge cases you have met, and especially challenging scenarios [^1]. They complement the
      standard benchmarks rather than replace them, and building them takes extra work [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/5#custom-evaluation
        locator: Chapter 11.5 Evaluation, sec. Custom Evaluation
    source:
      id: hf-llm-course
      ref: chapter11/5#q6
      url: https://huggingface.co/learn/llm-course/chapter11/5
    status: draft
  - id: llm-basics-007
    type: single
    difficulty: easy
    question: What does GPT stand for?
    options:
      - text: Generic Pre-Trained network
      - text: Generative Pre-trained Transformers
        correct: true
      - text: Generic Positional Text
    explanation: |
      GPT stands for Generative Pre-trained Transformer [^1]. Each word describes the model:
      it generates text, it is first pre-trained as a language model on large amounts of unlabeled
      text, and its backbone is a Transformer (specifically a Transformer decoder) [^2]. The other
      expansions are invented.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
        locator: 'Lesson: Pre-Trained Large Language Models, introduction'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-and-gpt-2
        locator: Sec. 11.9.3 Decoder-Only, 11.9.3.1 GPT and GPT-2
    source:
      id: ms-ai-for-beginners
      ref: quiz-120/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
    status: draft
  - id: llm-basics-008
    type: true_false
    difficulty: easy
    question: GPT is based on transformer architecture
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      GPT uses a Transformer decoder as its backbone and is trained as an autoregressive language
      model: each token can attend only to the tokens before it, and the model learns to predict the
      next one [^2]. The HF course accordingly groups GPT-like models as auto-regressive Transformer
      models [^3], and the "T" in GPT itself stands for Transformer [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
        locator: 'Lesson: Pre-Trained Large Language Models, introduction'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-and-gpt-2
        locator: Sec. 11.9.3 Decoder-Only, 11.9.3.1 GPT and GPT-2
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#a-bit-of-transformer-history
        locator: Chapter 1.4 How do Transformers work?, sec. A bit of Transformer history
    source:
      id: ms-ai-for-beginners
      ref: quiz-120/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
    status: draft
  - id: llm-basics-009
    type: single
    difficulty: easy
    question: Prompt engineering can be used with
    options:
      - text: Zero-shot learning
      - text: Few-shot learning
      - text: Both
        correct: true
    explanation: |
      Prompt engineering means choosing the words, format and symbols of the input so that the model
      produces the desired output [^1]. Large pretrained models such as GPT can solve tasks without
      further training, in zero-shot or few-shot settings [^1]. In both cases the task is specified
      only through the prompt: a zero-shot prompt holds the task description and the input, a few-shot
      prompt also adds a few solved input-output examples, and no parameters are updated (in-context
      learning) [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#prompt-engineering
        locator: 'Lesson: Pre-Trained Large Language Models, secs. Prompt Engineering and Conclusion'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-3-and-beyond
        locator: Sec. 11.9.3.2 GPT-3 and Beyond (Fig. 11.9.7)
    source:
      id: ms-ai-for-beginners
      ref: quiz-220/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
    status: draft
  - id: llm-basics-010
    type: single
    difficulty: easy
    question: What is a Large Language Model (LLM)?
    options:
      - text: A simple chatbot that matches messages to a list of pre-defined answers
      - text: A deep learning model trained on vast amounts of text to understand and generate language
        correct: true
      - text: A rule-based AI system that follows strict, hand-written predefined commands
    explanation: |
      An LLM is an AI model trained on vast amounts of text so that it can understand and generate
      human language; most modern LLMs are deep neural networks built on the Transformer architecture
      [^1]. It learns by predicting the next word (token) from the previous ones and generates a reply
      one token at a time [^1]. It neither returns pre-written answers nor follows hand-coded rules:
      its behaviour comes from patterns in text learned during pre-training [^1].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#what-is-a-large-language-model
        locator: Unit 1, What are LLMs?, secs. What is a Large Language Model? and How are LLMs trained?
    source:
      id: hf-agents-course
      ref: unit1/quiz2#q3
      url: https://huggingface.co/learn/agents-course/unit1/quiz2
    status: draft
  - id: llm-basics-011
    type: single
    difficulty: easy
    question: Which of the following best describes the role of special tokens in LLMs?
    options:
      - text: They are additional words stored in the model's vocabulary to enhance text generation quality
      - text: They serve specific functions like marking the end of a sequence (EOS) or separating different message roles in chat models
        correct: true
      - text: They are randomly inserted tokens used to improve response variability
    explanation: |
      Special tokens are model-specific tokens that open and close the structured parts of a
      sequence, such as the start or end of a sequence, message or response. The most important is the
      end-of-sequence (EOS) token: generation stops when the model predicts it [^1]. In chat models,
      special tokens also mark where each user and assistant turn starts and ends [^2]. They are not
      ordinary words added for quality, nor random noise; each has a fixed structural role, and their
      exact form differs by model (for example `<|endoftext|>` for GPT-4, `<|im_end|>` for SmolLM2)
      [^1].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#what-is-a-large-language-model
        locator: Unit 1, What are LLMs?, sec. What is a Large Language Model? (special tokens table) and Understanding next token prediction
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/messages-and-special-tokens
        locator: Unit 1, Messages and Special Tokens, introduction
    source:
      id: hf-agents-course
      ref: unit1/quiz2#q4
      url: https://huggingface.co/learn/agents-course/unit1/quiz2
    status: draft
  - id: llm-basics-012
    type: single
    difficulty: easy
    question: How do AI chat models process user messages internally?
    options:
      - text: They directly interpret messages as structured commands with no transformations
      - text: They convert user messages into a formatted prompt by concatenating system, user, and assistant messages
        correct: true
      - text: They generate responses randomly based on previous conversations
    explanation: |
      Chat messages are a UI abstraction. Before the model sees them, a chat template concatenates all
      messages of the conversation (system, user and assistant) into a single prompt string and wraps
      each turn in the model's own special tokens [^1]. The model does not remember earlier turns; it
      rereads the whole formatted conversation every time [^1]. It does not parse messages as
      structured commands, and its reply is not random: it comes from predicting the next token given
      that prompt [^2].
    references:
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/messages-and-special-tokens#conversations-user-and-assistant-messages
        locator: 'Unit 1, Messages and Special Tokens, introduction and sec. Conversations: User and Assistant Messages'
      - source: hf-agents-course
        url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#understanding-next-token-prediction
        locator: Unit 1, What are LLMs?, sec. Understanding next token prediction
    source:
      id: hf-agents-course
      ref: unit1/quiz2#q5
      url: https://huggingface.co/learn/agents-course/unit1/quiz2
    status: draft
  - id: llm-basics-013
    type: single
    difficulty: easy
    question: How can a generative pre-trained transformer such as GPT perform a task like sentiment classification without any task-specific training?
    options:
      - text: The task is written as text to continue, e.g. a prompt ending in "Sentiment:", and the model generates the answer
        correct: true
      - text: A new classification layer must first be trained on labelled reviews, since GPT itself can only generate free text
      - text: GPT outputs class probabilities directly, because it was pre-trained as a sentiment classifier
      - text: It cannot; a generative model can only continue text and never solves other tasks
    explanation: |
      Large language models such as GPT can solve many tasks without domain-specific training, because
      many tasks can be modelled as text generation: the model gives the conditional probability of the
      next word given the previous ones [^1]. Prompts are the inputs that instruct the model, and prompt
      engineering chooses wording and format to elicit the desired output [^1]. Training a new
      classification head on labelled data is fine-tuning, which needs a task-specific dataset [^2], and
      GPT is pre-trained on next-word prediction, not as a classifier [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
        locator: 'Lesson: Pre-Trained Large Language Models, secs. Text Generation and Perplexity and Prompt Engineering'
      - title: Language Models are Few-Shot Learners (Brown et al., 2020)
        url: https://arxiv.org/abs/2005.14165
        locator: Sec. 2 Approach (Fine-Tuning, Few-Shot, One-Shot, Zero-Shot)
    source:
      id: ms-ai-for-beginners
      ref: quiz-120/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
    status: draft
  - id: llm-basics-014
    type: single
    difficulty: easy
    question: For a large language model, what is *zero-shot* learning?
    options:
      - text: It gets only a natural-language description of the task, with no examples and no weight updates
        correct: true
      - text: The prompt contains a few solved examples of the task, followed by the new input that the model must answer
      - text: The model's weights are fine-tuned on a small labelled dataset for the task
      - text: The model is trained from scratch for a single epoch on the task's data
    explanation: |
      In zero-shot use, no demonstrations are allowed: the model receives only a natural-language
      instruction describing the task and answers with forward passes, without weight updates [^1].
      Putting a few solved examples in the prompt is few-shot (one example is one-shot), and updating
      the weights on a labelled task dataset is fine-tuning [^1]. GPT models can solve many tasks in
      this way without any domain-specific training [^2].
    references:
      - title: Language Models are Few-Shot Learners (Brown et al., 2020)
        url: https://arxiv.org/abs/2005.14165
        locator: Sec. 2 Approach (Fine-Tuning, Few-Shot, One-Shot, Zero-Shot)
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
        locator: 'Lesson: Pre-Trained Large Language Models, introduction'
    source:
      id: ms-ai-for-beginners
      ref: quiz-220/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
