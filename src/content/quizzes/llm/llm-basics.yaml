  - id: llm-basics-018
    type: multiple
    difficulty: medium
    tags:
      - llm-applications
      - rag
      - hallucination
    question: |
      Your company is considering several projects that would rely on an LLM. Which of them are
      good use cases? Select all that apply.
    options:
      - text: Extracting structured fields from messy invoices
        correct: true
      - text: Answering employees' questions about current company policies from what the model learned in pretraining, without giving it the policy documents
        why: A pretrained model knows only its fixed training data, so it may give outdated answers about policies; retrieval-augmented generation (RAG) fixes this by giving it the current documents [^2].
      - text: Helping beginner programmers debug their Python code
        correct: true
      - text: Writing the results and reference list of a scientific journal article with no human checking
        why: Factual accuracy is critical here, and LLMs can hallucinate results or cite sources that do not exist [^1].
      - text: Generating creative writing prompts for students
        correct: true
    explanation: |
      Extracting structured data from unstructured text, code generation and debugging, and
      creative text generation are among the things LLMs do well [^1]. Tasks that require exact,
      verifiable facts, such as reported results and citations, are where hallucinations do the most
      harm [^1]. Questions about current or private information are a special case: most LLMs are
      trained on a fixed dataset with no access to new policies, so they answer such questions well
      only when retrieval supplies the relevant documents in the prompt [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 1. Introduction to LLM applications (What are LLMs good at?; When should you avoid using LLMs?)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 3.2 Retrieval-Augmented Generation (RAG)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/08_llms-applications.ipynb#ex8.2
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
    status: draft
  - id: llm-basics-019
    type: single
    difficulty: medium
    tags:
      - in-context-learning
      - prompting
      - few-shot
    question: |
      A pretrained language model answers a task much better after you add a few worked examples
      (few-shot prompting) or ask it to reason step by step (chain-of-thought prompting). What has
      changed?
    options:
      - text: The examples in the prompt trigger a small gradient update of the model's weights
        why: Prompting runs only the forward pass; no loss is computed and no weights are updated [^2].
      - text: The model stores the examples and uses them for every later user
        why: The examples only live in the current context; a new conversation starts from the same frozen model [^2].
      - text: The model is fine-tuned on the prompt before it generates the answer
        why: Fine-tuning would update the weights on labeled data; few-shot prompting specifies the task purely through text [^2].
      - text: Only the input the model conditions on; its weights are the same as before
        correct: true
    explanation: |
      A language model generates a completion conditioned on its prompt, so changing the prompt
      changes the task it performs without changing the model [^1]. Few-shot and chain-of-thought
      prompts work by giving the model a context that makes the desired kind of answer more likely:
      the weights stay frozen, and the "learning" happens only in the context, which is why it is
      called in-context learning [^1][^2]. GPT-3 was evaluated this way, with tasks and
      demonstrations given "purely via text interaction" and no gradient updates [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 8: Applications of Large Language Models — 2. In-context learning, 2.1 Prompting (Questions for you)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
      - title: Brown et al. (2020), Language Models are Few-Shot Learners
        locator: Abstract; Sec. 1 Introduction (in-context learning)
        url: https://arxiv.org/abs/2005.14165
        quote: GPT-3 is applied without any gradient updates or fine-tuning, with tasks and few-shot demonstrations specified purely via text interaction with the model.
    source:
      id: ubc-dsci575
      ref: lectures/notes/08_llms-applications.ipynb#ex8.3
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/08_llms-applications.ipynb
    status: draft
  - id: llm-basics-020
    type: single
    difficulty: easy
    tags:
      - data-contamination
      - evaluation
      - benchmarks
    question: What does "data contamination" mean when evaluating a large language model on a benchmark?
    options:
      - text: The benchmark's test data was part of what the model was trained on
        correct: true
      - text: The benchmark's labels contain annotation errors
        why: Noisy gold labels are a separate problem (annotator bias and artifacts in datasets) [^1].
      - text: The model's training data contains toxic or harmful text
        why: That is a data-quality and safety issue, not contamination of the evaluation [^1].
      - text: Several benchmarks test the same skill, so their results are correlated
        why: Overlapping benchmarks do not leak test data into training, which is what contamination means [^1].
    explanation: |
      Data contamination means evaluating an LLM on the same data it was trained on; the score then
      measures memorization rather than generalization [^1]. The lecture's example: many papers
      queried ChatGPT through the web interface, handing over benchmark data that could have been
      used to improve later models [^1]. Like any test-set leak it breaks the train/test separation
      on which evaluation rests [^2].
    references:
      - source: trusthlt-nlp
        locator: Lecture 1 slides, frame 'Beware of (unintended) data contamination!' (citing Balloccu et al., EACL 2024)
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture01/pdf/nlpwdl2025-lecture01-handout.pdf
      - source: d2l
        locator: Sec. 4.6.2 Test Set Reuse
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#test-set-reuse
    source:
      id: trusthlt-nlp
      ref: lectures/lecture01/nlpwdl2025-lecture01.tex#data-contamination
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture01/pdf/nlpwdl2025-lecture01-handout.pdf
    status: draft
  - id: llm-basics-021
    type: single
    difficulty: easy
    tags:
      - non-determinism
      - sampling
      - hallucination
    question: |
      You send the same prompt to an LLM chat app twice and get two different answers. Which statement
      best describes how to treat LLM output?
    options:
      - text: Variation only appears at the highest temperature setting; any lower setting gives identical answers
        why: Lower temperatures make output more predictable, but sampling still introduces variation unless it is (close to) zero [^3].
      - text: The model computes exact results, so its arithmetic and code can be used without checking
        why: LLMs can produce confident but wrong content, including wrong sums and broken code, so their output must be verified [^1][^2].
      - text: Outputs are sampled and can vary for the same prompt; treat them as a first draft to check and refine
        correct: true
      - text: The model looks answers up in a stored table, so different outputs mean the model was updated in between
        why: An LLM generates text token by token from a probability distribution; it does not look up stored answers [^1].
    explanation: |
      Generative models are not deterministic: each answer is sampled, so the same prompt can give
      different completions [^1]. They also fabricate references and facts and present them
      persuasively, so their output is a good first attempt that you still need to check and improve
      [^1][^2]. The temperature setting controls how varied the sampling is [^3].
    references:
      - source: ms-genai-for-beginners
        locator: 'Lesson 01: Introduction to Generative AI and LLMs (last paragraph before the assignment) and Knowledge check answer'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/01-introduction-to-genai/README.md#knowledge-check
      - source: ms-genai-for-beginners
        locator: 'Lesson 03: Using Generative AI Responsibly, Hallucinations'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/03-using-generative-ai-responsibly/README.md#hallucinations
      - source: ms-genai-for-beginners
        locator: 'Lesson 06: Building Text Generation Applications, Improve your setup (Experimenting with temperature)'
        url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/06-text-generation-apps/README.md#improve-your-setup
    source:
      id: ms-genai-for-beginners
      ref: 01-introduction-to-genai#q1
      url: https://github.com/microsoft/generative-ai-for-beginners/blob/d8ec07e31c4b32bd283d565c1abd9b58bb5cf2e8/01-introduction-to-genai/README.md#knowledge-check
