  - id: llm-basics-034
    type: short_answer
    difficulty: easy
    tags:
      - text-generation
      - greedy-decoding
      - context-window
      - llms-from-scratch
    question: |
      `idx` holds 2 prompts of 5 token IDs each, shape (2, 5). What is the shape of
      `generate_text_simple(model, idx, max_new_tokens=3, context_size=4)`?

      ```python
      def generate_text_simple(model, idx, max_new_tokens, context_size):
          for _ in range(max_new_tokens):
              idx_cond = idx[:, -context_size:]
              with torch.no_grad():
                  logits = model(idx_cond)            # (batch, n_tokens, vocab_size)
              logits = logits[:, -1, :]
              idx_next = torch.argmax(logits, dim=-1, keepdim=True)
              idx = torch.cat((idx, idx_next), dim=1)
          return idx
      ```
    answer:
      accept:
        - (2, 8)
      pattern: (torch\.size)?\(?\[?\s*2\s*[,x×]\s*8\s*\]?\)?
      hint: Two dimensions in order, e.g. (5, 6)
      model: '$(2, 8)$: the 5 prompt tokens plus 3 generated ones.'
    explanation: |
      Each iteration picks the most likely next token from the logits of the **last** position
      (`argmax` with `keepdim=True` gives shape (2, 1)) and appends it to the full sequence along
      dimension 1 [^1]. Cropping to the last `context_size` tokens only limits what the model *sees*
      (it supports at most 4 positions); it does not shorten `idx` itself. After 3 steps the result is
      (2, 5 + 3) = (2, 8), and the first 5 columns are still the prompts [^1][^2].
    references:
      - source: llms-from-scratch
        locator: pkg/llms_from_scratch/ch04.py, generate_text_simple (lines 107-130)
        url: https://github.com/rasbt/LLMs-from-scratch/blob/cdbd33e6d57a71e20ea31434841095fac50cecd8/pkg/llms_from_scratch/ch04.py#L107-L130
      - title: 'PyTorch documentation: torch.cat'
        locator: torch.cat
        url: https://docs.pytorch.org/docs/stable/generated/torch.cat.html
    source:
