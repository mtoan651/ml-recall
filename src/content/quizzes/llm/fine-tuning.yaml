  - id: fine-tuning-014
    type: single
    difficulty: hard
    tags:
      - lora
      - initialization
      - gradients
      - code-reading
      - pytorch
    question: |
      A minimal LoRA layer wraps a pretrained `nn.Linear`:

      ```python
      class LoRALinear(nn.Module):
          def __init__(self, base: nn.Linear, r=8, alpha=16):
              super().__init__()
              self.base = base.requires_grad_(False)       # frozen W0 and bias
              self.A = nn.Parameter(0.01 * torch.randn(r, base.in_features))
              self.B = nn.Parameter(torch.zeros(base.out_features, r))
              self.scale = alpha / r

          def forward(self, x):
              return self.base(x) + (x @ self.A.T @ self.B.T) * self.scale
      ```

      You run one forward pass and `loss.backward()`, before any optimizer step. Which statement is
      true?
    options:
      - text: The output equals the base layer's output; `A.grad` and `B.grad` are both zero, so training never starts
        why: The gradient of $B$ is $s\,\mathbf{g}\,(A\mathbf{x})^\top$, which is nonzero because $A$ is random. Training would stall only if $A$ were zero too.
      - text: The output differs from the base layer's output, because the random $A$ adds noise
        why: The extra term is $BA\mathbf{x}$ with $B = 0$, so it is exactly zero and the model starts at the pretrained function [^1].
      - text: The output equals the base layer's output; `B.grad` is nonzero and `A.grad` is all zeros
        correct: true
      - text: The output equals the base layer's output; `A.grad` is nonzero and `B.grad` is all zeros
        why: It is the other way round. The gradient of $A$ is $s\,B^\top\mathbf{g}\,\mathbf{x}^\top$, which vanishes because $B = 0$.
    explanation: |
      This is LoRA's initialization: $A$ random Gaussian and $B$ zero, so $\Delta W = BA = 0$ and
      training starts exactly at the pretrained $W_0$ [^1]. With $h = W_0\mathbf{x} + s\,BA\mathbf{x}$,
      $s = \alpha/r$ [^1][^2], and the output gradient $\mathbf{g} = \partial L / \partial h$, the chain
      rule gives $\partial L/\partial B = s\,\mathbf{g}\,(A\mathbf{x})^\top \neq 0$ and
      $\partial L/\partial A = s\,B^\top\mathbf{g}\,\mathbf{x}^\top = 0$. After the first update
      $B \neq 0$, and from then on $A$ learns too. Initializing both matrices to zero would keep both
      gradients at zero forever.
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3) and the initialization paragraph
      - title: 'Hugging Face PEFT docs: LoRA (conceptual guide)'
        url: https://huggingface.co/docs/peft/main/en/conceptual_guides/lora#common-lora-parameters-in-peft
        locator: Common LoRA parameters in PEFT (lora_alpha, default scaling lora_alpha/r)
    source:
      id: original
      ref: fine-tuning-014
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-015
    type: short_answer
    difficulty: medium
    tags:
      - lora
      - parameter-count
      - rank
    question: |
      LoRA adapts a pretrained $4096 \times 4096$ weight matrix $W_0$ with the update $\Delta W = BA$,
      where $B \in \mathbb{R}^{4096 \times r}$ and $A \in \mathbb{R}^{r \times 4096}$. At which rank
      $r$ does LoRA train exactly as many parameters as fine-tuning $W_0$ itself in full?
    answer:
      numeric: 2048
      tolerance: 0
      hint: a whole number
      model: $r(d + k) = dk$ gives $r = \frac{dk}{d + k} = \frac{4096 \cdot 4096}{8192} = 2048$
    explanation: |
      LoRA trains $B \in \mathbb{R}^{d \times r}$ and $A \in \mathbb{R}^{r \times k}$ instead of the
      $d \times k$ update [^1], so it has $r(d + k)$ parameters. Setting $r(d + k) = dk$ gives
      $r = dk/(d + k)$, which is $d/2 = 2048$ for a square matrix. Ranks used in practice are tiny by
      comparison: at $r = 8$ the count is $8 \cdot 8192 = 65\,536$, about 0.39% of the 16.8 million
      entries of $W_0$. The saving comes from the low-rank assumption itself, since $BA$ has rank at
      most $r$; LoRA roughly recovers the expressiveness of full fine-tuning only when $r$ is raised
      to the rank of the pretrained matrix (with all biases trained too) [^2], where it would use
      more parameters than full fine-tuning.
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3)
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1, paragraph "A Generalization of Full Fine-tuning"
    source:
      id: original
      ref: fine-tuning-015
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-016
    type: short_answer
    difficulty: medium
    tags:
      - lora
      - peft
      - parameter-count
      - code-reading
      - grouped-query-attention
    question: |
      A decoder-only model has 16 layers. Each attention block contains
      `q_proj = nn.Linear(2048, 2048, bias=False)`, `k_proj = nn.Linear(2048, 512, bias=False)`,
      `v_proj = nn.Linear(2048, 512, bias=False)` and `o_proj = nn.Linear(2048, 2048, bias=False)`.
      You wrap the model with PEFT:

      ```python
      from peft import LoraConfig, get_peft_model

      config = LoraConfig(r=16, lora_alpha=32, target_modules=["q_proj", "v_proj"])
      model = get_peft_model(base_model, config)
      model.print_trainable_parameters()
      ```

      How many trainable parameters are reported?
    answer:
      numeric: 1703936
      tolerance: 0
      hint: a whole number
      model: $16 \times 16 \times \big[(2048 + 2048) + (2048 + 512)\big] = 16 \times 16 \times 6656 = 1\,703\,936$
    explanation: |
      `target_modules` names the layers that get LoRA matrices; PEFT matches the names in every layer,
      so `q_proj` and `v_proj` are adapted in all 16 layers, and all other weights are frozen [^1][^2].
      A LoRA pair for a layer with $k$ inputs and $d$ outputs has $r(d + k)$ parameters [^3]:
      $16 \times 4096 = 65\,536$ for `q_proj`, but only $16 \times 2560 = 40\,960$ for `v_proj`, whose
      output is just 512 wide. Over 16 layers this gives $16 \times 106\,496 = 1\,703\,936$. The
      `lora_alpha` value only scales the update and adds no parameters [^2].
    references:
      - title: 'Hugging Face PEFT docs: Quicktour'
        url: https://huggingface.co/docs/peft/quicktour#peft-configuration-and-model
        locator: PEFT configuration and model (target_modules matching, print_trainable_parameters)
      - title: 'Hugging Face PEFT docs: LoRA (conceptual guide)'
        url: https://huggingface.co/docs/peft/main/en/conceptual_guides/lora#common-lora-parameters-in-peft
        locator: Common LoRA parameters in PEFT
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3)
    source:
      id: original
      ref: fine-tuning-016
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-017
    type: short_answer
    difficulty: medium
    tags:
      - lora
      - parameter-count
      - ratio
    question: |
      A decoder-only model has 6.7 billion parameters in total, 32 layers and $d_{model} = 4096$. You
      apply LoRA with rank $r = 16$ to all four attention projections $W_q, W_k, W_v, W_o$ (each
      $4096 \times 4096$) in every layer. What percentage of the model's parameter count is trainable?
    answer:
      numeric: 0.25
      tolerance: 0.005
      hint: a percentage with 2 decimals, without the % sign
      model: $32 \times 4 \times 16 \times (4096 + 4096) = 16\,777\,216$ trainable; $16\,777\,216 / (6.7 \times 10^9) \approx 0.25\%$
    explanation: |
      Each adapted $d \times k$ matrix gets $B \in \mathbb{R}^{d \times r}$ and
      $A \in \mathbb{R}^{r \times k}$ [^1], so for square matrices the count is
      $|\Theta| = 2 \times \hat{L}_{LoRA} \times d_{model} \times r$, where $\hat{L}_{LoRA}$ is the
      number of adapted matrices [^2]. Here $\hat{L}_{LoRA} = 32 \times 4 = 128$, which gives
      $2 \times 128 \times 4096 \times 16 \approx 16.8$ million, about 0.25% of 6.7 billion. Even with
      every attention matrix adapted, LoRA trains a tiny fraction of the model, which is why a GPT-3
      LoRA checkpoint shrank from 350 GB to 35 MB [^3].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3)
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 5.1 Baselines, paragraph "LoRA" (formula for the number of trainable parameters)
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.2 Applying LoRA to Transformer, paragraph "Practical Benefits and Limitations"
    source:
      id: original
      ref: fine-tuning-017
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-018
    type: single
    difficulty: medium
    tags:
      - lora
      - adapters
      - inference-latency
      - merging
    question: |
      After training, a LoRA model can be served with no extra inference latency compared with the
      original model, while bottleneck adapters (Houlsby et al.) add latency even when the bottleneck is
      very small. What explains the difference?
    options:
      - text: Adapters have far more parameters than LoRA, and inference latency grows with parameter count
        why: Adapters can be tiny, yet the LoRA paper measures added latency even with a very small bottleneck, because the extra layers must run in sequence [^2].
      - text: LoRA's matrices are so small that computing $BA\mathbf{x}$ as a separate branch costs no time
        why: Kept as a separate branch, the low-rank path is extra work at inference; the zero-latency guarantee comes from merging it into $W_0$ [^1][^3].
      - text: LoRA's update is linear and parallel to $W_0$, so it merges into one matrix $W_0 + BA$
        correct: true
      - text: LoRA weights are only needed during training and are thrown away once the model is deployed
        why: The learned update is kept, folded into the weights; throwing it away would undo the fine-tuning [^1].
    explanation: |
      Because $h = W_0\mathbf{x} + BA\mathbf{x}$ is linear in $\mathbf{x}$, you can compute and store
      $W = W_0 + BA$ once and run inference as usual, with no additional latency by construction [^1].
      PEFT's `merge_and_unload()` does exactly this and returns a standalone model [^3][^4]. Adapter
      layers contain a nonlinearity and sit in sequence after the attention and feed-forward
      sub-layers, so they cannot be folded away; on GPT-2 medium with batch size 1 they added 20–30%
      latency [^2]. To switch tasks, LoRA can subtract $BA$ and add another task's $B'A'$ [^1].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1, paragraph "No Additional Inference Latency"
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 3 Aren't Existing Solutions Good Enough?, paragraph "Adapter Layers Introduce Inference Latency", Table 1
      - title: 'Hugging Face PEFT docs: LoRA (conceptual guide)'
        url: https://huggingface.co/docs/peft/main/en/conceptual_guides/lora#merge-lora-weights-into-the-base-model
        locator: Merge LoRA weights into the base model
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/4#merging-lora-adapters
        locator: Chapter 11.4 LoRA (Low-Rank Adaptation), sec. Merging LoRA Adapters
    source:
      id: original
      ref: fine-tuning-018
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-019
    type: single
    difficulty: medium
    tags:
      - lora
      - alpha
      - scaling
      - learning-rate
    question: |
      LoRA multiplies the low-rank update by a constant:
      $h = W_0\mathbf{x} + \frac{\alpha}{r} BA\mathbf{x}$. The original paper sets $\alpha$ once, to the
      first rank $r$ it tries, and never tunes it. What does the $\frac{\alpha}{r}$ factor give you when
      training with Adam?
    options:
      - text: It caps the rank of $BA$ at $r$, which would otherwise grow during training
        why: The shapes of $B$ ($d \times r$) and $A$ ($r \times k$) already bound the rank of $BA$ by $r$; no scale is needed for that [^1].
      - text: It makes the update $BA$ zero at the start, so training begins at $W_0$
        why: A zero update at the start comes from initializing $B$ to zero, not from the scale factor [^1].
      - text: It shrinks the frozen weights $W_0$ so that the learned update can dominate the output
        why: The factor multiplies only the update $BA\mathbf{x}$; $W_0\mathbf{x}$ is left as it is [^1].
      - text: You can change the rank $r$ without retuning the learning rate each time
        correct: true
    explanation: |
      With Adam, tuning $\alpha$ is roughly the same as tuning the learning rate, so the LoRA authors
      fix $\alpha$ and divide by $r$; this reduces the need to retune hyperparameters when $r$ varies
      [^1]. QLoRA likewise keeps $\alpha$ fixed and searches only the learning rate [^2], and the TRL
      guide notes that the $1/r$ scaling makes the optimal learning rate approximately
      rank-independent [^3]. In PEFT the default scale is `lora_alpha / r` [^4].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices (initialization and scaling paragraph)
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Appendix A.1 Hyperparameters for QLoRA
      - title: 'Hugging Face TRL docs: LoRA Without Regret'
        url: https://huggingface.co/docs/trl/lora_without_regret#3-fullft-and-high-rank-loras-have-similar-learning-curves
        locator: Key findings, 3. "FullFT and high-rank LoRAs have similar learning curves"
      - title: 'Hugging Face PEFT docs: LoRA (conceptual guide)'
        url: https://huggingface.co/docs/peft/main/en/conceptual_guides/lora#common-lora-parameters-in-peft
        locator: Common LoRA parameters in PEFT (use_rslora, lora_alpha/r)
    source:
      id: original
      ref: fine-tuning-019
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-020
    type: multiple
    difficulty: hard
    tags:
      - lora
      - target-modules
      - attention
      - qlora
    question: |
      Which statements about *where* to apply LoRA in a Transformer are supported by the LoRA paper and
      later work? Select all that apply.
    options:
      - text: LoRA works only for square matrices, so the rectangular MLP projections cannot be adapted
        why: $B \in \mathbb{R}^{d \times r}$ and $A \in \mathbb{R}^{r \times k}$ fit any $d \times k$ matrix [^1]; the paper left the MLP out for simplicity, not because it is impossible [^2].
      - text: On GPT-3 with a fixed budget of trainable parameters, adapting $W_q$ and $W_v$ at $r = 4$ beat adapting $W_q$ alone at $r = 8$
        correct: true
      - text: Raising the rank of attention-only LoRA fully makes up for leaving the MLP layers untouched
        why: The "LoRA Without Regret" results find that attention-only LoRA underperforms even when its rank is raised to match the parameter count [^5].
      - text: QLoRA found that LoRA on all linear layers of each Transformer block is needed to match full fine-tuning
        correct: true
      - text: The original LoRA paper adapts only attention weights and keeps the MLP modules frozen
        correct: true
    explanation: |
      The LoRA paper studies only the attention matrices, for simplicity and parameter efficiency [^2].
      With an 18M-parameter budget on GPT-3 175B, $W_q$ and $W_v$ at $r = 4$ reached 73.7% on WikiSQL
      and 91.3% on MultiNLI, against 70.4% and 91.0% for $W_q$ alone at $r = 8$ [^3]: covering more
      matrices with a small rank beat a higher rank on one. Later work went further: QLoRA reports that
      LoRA on all linear Transformer block layers is required to match full fine-tuning [^4], and the
      TRL guide recommends `target_modules="all-linear"` [^5].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3)
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.2 Applying LoRA to Transformer
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 7.1 Which Weight Matrices in Transformer Should We Apply LoRA to?, Table 5
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 4 QLoRA vs. Standard Finetuning, paragraph "Default LoRA hyperparameters do not match 16-bit performance"
      - title: 'Hugging Face TRL docs: LoRA Without Regret'
        url: https://huggingface.co/docs/trl/lora_without_regret#1-lora-performs-better-when-applied-to-all-weight-matrices
        locator: Key findings, 1. LoRA performs better when applied to all weight matrices
