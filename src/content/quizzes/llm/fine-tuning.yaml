schema_version: 1
domain: llm
topic: fine-tuning
title: Fine-tuning & PEFT
questions:
  - id: fine-tuning-001
    type: single
    difficulty: easy
    question: Why do we use dynamic padding instead of padding all sequences to the maximum length in the dataset?
    options:
      - text: Dynamic padding is required by the model architecture.
        why: No, models can handle both fixed and dynamic padding.
      - text: It pads each batch only to its own longest sequence, saving computation.
        correct: true
      - text: It improves model accuracy.
        why: Padding strategy doesn't directly affect model accuracy.
      - text: It's required when using the DataCollatorWithPadding.
        why: DataCollatorWithPadding enables dynamic padding, but you could still use fixed padding if desired.
    explanation: |
      Padding every sample to the longest sequence in the whole dataset (or to the model's maximum
      length) wastes computation on pad tokens. With dynamic padding, padding is postponed until
      the batches are built: a collate function such as `DataCollatorWithPadding` pads each batch
      only to the length of its longest sample, which speeds up training considerably [^1]. It is
      an efficiency choice, not a requirement of the model or of the collator, and it can even cause
      problems on TPUs, which prefer fixed shapes [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
        locator: Chapter 3.2 Processing the data, sec. Dynamic padding
    source:
      id: hf-llm-course
      ref: chapter3/2#q2
      url: https://huggingface.co/learn/llm-course/chapter3/2
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-002
    type: single
    difficulty: easy
    question: What should you monitor during SFT training?
    options:
      - text: Both quantitative metrics and qualitative outputs
        correct: true
      - text: Only the training loss curve
        why: Training loss alone isn't sufficient to ensure good model behavior.
      - text: Only the quality of the model's generated outputs
        why: While important, qualitative evaluation alone misses important training dynamics.
    explanation: |
      Quantitative signals (training and validation loss, learning rate, gradient norms) reveal the
      training dynamics: for example, validation loss rising while training loss falls signals
      overfitting [^1]. But the loss can look fine while the model picks up unwanted behavior, such
      as inconsistent output formatting, so you should also read the model's actual outputs
      regularly [^2]. Each kind of check catches problems that the other misses.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3#metrics-to-monitor
        locator: Chapter 11.3 Supervised Fine-Tuning, sec. Metrics to Monitor
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3#warning-signs-to-watch-for
        locator: Chapter 11.3 Supervised Fine-Tuning, sec. Warning Signs to Watch For (closing warning)
    source:
      id: hf-llm-course
      ref: chapter11/3#q4
      url: https://huggingface.co/learn/llm-course/chapter11/3
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-003
    type: single
    difficulty: easy
    question: Which of the following statements is true about LLMs?
    options:
      - text: A distilled LLM contains fewer parameters than the foundation language model it was distilled from.
        correct: true
      - text: A fine-tuned LLM contains fewer parameters than the foundation language model it was fine-tuned from.
        why: A fine-tuned model contains the *same number* of parameters as the original foundation language model.
      - text: As users perform more prompt engineering, the number of parameters in an LLM grows.
        why: Prompt engineering doesn't add (or remove or alter) LLM parameters.
    explanation: |
      Distillation creates a smaller version of an LLM: typically a large teacher model labels data,
      and that data trains a smaller student model with fewer parameters, which is cheaper to serve but
      usually predicts a little less well [^1]. Fine-tuning only updates existing weights on
      task-specific examples (all of them, or a subset with parameter-efficient tuning), so a fine-tuned
      model has exactly as many parameters as the foundation model [^2]. Prompt engineering changes only
      the input: it customizes the output without adding, removing or altering any parameter [^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#distillation
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Distillation'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#fine-tuning
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Fine-tuning'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#prompt_engineering
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Prompt engineering (note)'
    source:
      id: google-mlcc
      ref: llm/tuning#q1
      url: https://developers.google.com/machine-learning/crash-course/llm/tuning
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-004
    type: single
    difficulty: medium
    tags:
      - t5
      - multitask
      - text-to-text
    question: |
      Can a single fine-tuning minibatch for T5 mix examples from different tasks, for example
      summarization and translation?
    options:
      - text: 'Yes: every task is text-to-text, with a task description in the input, sharing one model and loss'
        correct: true
      - text: 'No: each task needs its own output layer, so a minibatch must come from one task'
        why: T5 needs no additional layers for a task; its decoder generates the answer as text [^1].
      - text: "No: the decoder's causal mask requires all targets in one minibatch to have exactly the same number of tokens"
        why: Targets of different lengths are padded and masked as usual.
      - text: Yes, but only if the tasks have the same number of output classes
        why: The outputs are token sequences, not class labels, so there is no class count to match.
    explanation: |
      T5 casts every task as generating target text from input text, with a task description such as
      "Summarize:" placed before the task input [^1]. Fine-tuning differs from BERT's in that the input
      carries the task description, the decoder can generate outputs of any length, and no additional
      layers are needed [^1]. Examples from different tasks therefore share the model, the output
      vocabulary and the cross-entropy loss, and can sit in one minibatch.
    references:
      - source: d2l
        locator: Sec. 11.9.2.1 Pretraining T5; 11.9.2.2 Fine-Tuning T5
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#fine-tuning-t5
      - source: d2l
        locator: Sec. 11.9.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/large-pretraining-transformers#ex1
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-005
    type: single
    difficulty: easy
    tags:
      - bert
      - fine-tuning
      - classification-head
    question: |
      You fine-tune a pretrained BERT-style encoder for text classification by adding new layers.
      Where do they go?
    options:
      - text: On top of the last layer, fed with the output at the `<cls>` token
        correct: true
      - text: Below the first layer, between the token embeddings and the pretrained blocks
        why: New random layers there would change the inputs that all the pretrained layers were trained on.
      - text: Inside every encoder block, replacing its pretrained feed-forward network
        why: This would throw away pretrained parameters instead of building on them.
      - text: Directly on the token embeddings, so that the pretrained encoder is skipped
        why: The embeddings alone are context-independent; the value of BERT lies in its encoder.
    explanation: |
      BERT's `<cls>` output depends on all input tokens, so it serves as a representation of the whole
      text; fine-tuning feeds it into an additional fully connected layer that is trained from scratch,
      while all pretrained parameters are updated [^1][^2]. Placing the new layers on top keeps the
      pretrained computation intact and uses its most task-ready, contextual output.
    references:
      - source: d2l
        locator: Sec. 11.9.1.2 Fine-Tuning BERT
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#fine-tuning-bert
      - source: d2l
        locator: Sec. 16.6.1 Single Text Classification
        url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#single-text-classification
      - source: d2l
        locator: Sec. 11.9.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/large-pretraining-transformers#ex3
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-006
    type: single
    difficulty: medium
    tags:
      - bert
      - negative-sampling
      - retrieval
      - ranking
    question: |
      You build a news search engine with BERT. For each training query the single most relevant
      article is labeled, and the pool of articles is huge. How can negative sampling be used in
      training?
    options:
      - text: "Classify (query, article) pairs from BERT's `<cls>` output: labeled article positive, random articles negative"
        correct: true
      - text: Feed BERT the query alone and train a softmax over all articles, one output class per article
        why: A softmax over millions of articles is exactly the expensive normalization that negative sampling avoids [^2].
      - text: Sample noise words inside each article and train BERT's masked language model on them
        why: This mixes up word-level pretraining with the query–article relevance the engine must learn.
      - text: Train on the labeled (query, article) pairs only, because a binary relevance classifier does not need any negatives
        why: With positive examples only, the classifier can learn to call every pair relevant.
    explanation: |
      Relevance of a query to an article is a text-pair task: BERT reads both as one input and an
      output layer on the `<cls>` representation scores the pair [^1]. Negative sampling turns the
      impossible normalization over the whole pool into binary decisions, the true pair against $K$
      randomly drawn articles [^2]. At query time, candidate articles are ranked by this score.
    references:
      - source: d2l
        locator: Sec. 16.6.2 Text Pair Classification or Regression
        url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#text-pair-classification-or-regression
      - source: d2l
        locator: Sec. 15.2.1 Negative Sampling
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/approx-training.html#negative-sampling
      - source: d2l
        locator: Sec. 16.6.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-applications/finetuning-bert#ex1
      url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-007
    type: single
    difficulty: medium
    tags:
      - causal-language-modeling
      - data-collator
      - domain-adaptation
    question: |
      A small GPT-2 model pretrained on Python code, given the prompt `class SimpleAdder {`, quickly falls back into
      Python syntax. NMA fine-tunes it on JavaScript files with
      ```python
      data_collator = DataCollatorForLanguageModeling(tokenizer=tokenizer, mlm=False)
      ```
      What training objective does `mlm=False` select?
    options:
      - text: 'Causal language modelling: the labels are the inputs themselves, and each next token is predicted'
        correct: true
      - text: 'Masked language modelling: some tokens are hidden and predicted from both sides'
        why: That is `mlm=True`, the BERT-style objective; a GPT-style decoder is trained left to right.
      - text: 'Sequence classification: each file is labelled "JavaScript" or "Python"'
        why: The collator builds language-modelling batches; no class labels are involved.
      - text: Instruction tuning on prompt–answer pairs, with the loss only on the answers
        why: Plain code files have no prompt/answer split; every token is a training target.
    explanation: |
      With `mlm=False` the collator prepares causal language modelling: it copies the input ids into the labels, and the
      model shifts them internally so that each position predicts the next token, the same objective GPT-2 was
      pretrained with [^1][^2]. Continuing this objective on JavaScript moves the model into the new domain; after a
      short run it completes the prompt with a JavaScript `constructor` instead of Python syntax [^1].
    references:
      - source: neuromatch-dl
        locator: W2D5 Tutorial 2, Section 4 NLG with GPT, Fine-Tuning
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
      - source: hf-llm-course
        locator: Chapter 7, Training a causal language model from scratch (data collator with mlm=False)
        url: https://huggingface.co/learn/llm-course/chapter7/6
    source:
      id: neuromatch-dl
      ref: W2D5_TimeSeriesAndNaturalLanguageProcessing/W2D5_Tutorial2#sec4-finetuning
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-008
    type: short_answer
    difficulty: medium
    tags:
      - lora
      - peft
      - parameter-count
    question: |
      LoRA with rank $r = 16$ is applied to one $4096 \times 4096$ projection matrix $W$ of a frozen model:
      the update is $\Delta W = BA$ with $B \in \mathbb{R}^{4096 \times 16}$ and
      $A \in \mathbb{R}^{16 \times 4096}$. How many trainable parameters does this add for that matrix?
    answer:
      numeric: 131072
      tolerance: 0
      hint: a whole number
      model: $2 \cdot 4096 \cdot 16 = 131{,}072$ (vs. $4096^2 \approx 16.8$ million in $W$)
    explanation: |
      LoRA freezes $W$ and trains only the low-rank factors $B$ and $A$, with
      $4096 \cdot 16 + 16 \cdot 4096 = 131{,}072$ parameters, about 0.8% of the $16.8$ million entries of
      $W$ [^1]. The rank $r$ trades capacity against size, and the update is scaled by $\alpha/r$
      (`lora_alpha=16` with `r=16` gives scale 1) [^1][^2]. Applying it to several projections, such as
      the query, key, value and output projections, multiplies this count accordingly [^2].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models, arXiv:2106.09685'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices
      - source: galaxy-training
        locator: Fine-tuning a LLM for DNA Sequence Classification — Configure LoRA for Parameter-Efficient Fine-Tuning
        url: https://training.galaxyproject.org/training-material/topics/statistics/tutorials/genomic-llm-finetuning/tutorial.html
    source:
      id: galaxy-training
      ref: genomic-llm-finetuning#q4
      url: https://github.com/galaxyproject/training-material/blob/917e68d1d61c2915c7a970d75468b8494be90c0d/topics/statistics/tutorials/genomic-llm-finetuning/tutorial.md
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-009
    type: short_answer
    difficulty: easy
    tags:
      - quantization
      - qlora
      - memory
    question: |
      A model has 7 billion parameters. In bfloat16 its weights take $7 \times 10^9 \times 2$ bytes
      $= 14$ GB. You load it with 4-bit quantization (`load_in_4bit=True`). Ignoring the small overhead of
      quantization constants, how many GB do the weights take now?
    answer:
      numeric: 3.5
      tolerance: 0.01
      hint: a number of GB (1 GB = 10^9 bytes)
      model: $7 \times 10^9 \times 0.5$ bytes $= 3.5$ GB
    explanation: |
      Four bits are half a byte, so the weights need $7 \times 10^9 \times 0.5 = 3.5$ GB, a quarter of
      the bfloat16 size [^1][^2]. QLoRA-style fine-tuning keeps these 4-bit weights frozen, computes in
      bfloat16 (`bnb_4bit_compute_dtype`), and trains small LoRA adapters on top; double quantization
      also compresses the quantization constants to save a little more memory [^1][^2].
    references:
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs, arXiv:2305.14314'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 3 QLoRA Finetuning (4-bit NormalFloat, Double Quantization)
      - source: galaxy-training
        locator: Fine-tuning a LLM for DNA Sequence Classification — Specify settings for quantization
        url: https://training.galaxyproject.org/training-material/topics/statistics/tutorials/genomic-llm-finetuning/tutorial.html
    source:
      id: galaxy-training
      ref: genomic-llm-finetuning#q2
      url: https://github.com/galaxyproject/training-material/blob/917e68d1d61c2915c7a970d75468b8494be90c0d/topics/statistics/tutorials/genomic-llm-finetuning/tutorial.md
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-010
    type: single
    difficulty: medium
    tags:
      - prefix-tuning
      - adapters
      - peft
    question: |
      Prefix tuning and adapters both fine-tune a frozen transformer with few new parameters. Where
      does each put its task-specific parameters?
    options:
      - text: 'Prefix tuning: key/value vectors prepended at every layer; adapters: small bottleneck layers in each block'
        correct: true
      - text: 'Prefix tuning: small bottleneck layers inside each block; adapters: key/value vectors prepended at every layer'
        why: 'This swaps the two methods: adapters are inserted modules, prefixes are prepended activations [^2][^3].'
      - text: Both retrain only the final output layer, with different learning rates
        why: Both methods change the computation inside the network while keeping the pretrained weights frozen [^2][^3].
      - text: Both write task knowledge into the attention mask instead of adding parameters
        why: Both add trainable parameters; neither works by editing the attention mask [^2][^3].
    explanation: |
      Prefix tuning keeps the language model frozen and optimises a sequence of continuous vectors
      that act like virtual tokens: they are prepended to the keys and values at every layer, so all
      real tokens can attend to them [^2]. Adapters insert small bottleneck feed-forward modules
      (down-projection, nonlinearity, up-projection, residual) inside each transformer block and train
      only those [^3]. Either way, a task costs a small fraction of the model's parameters [^1].
    references:
      - source: nptel-intro-llms
        locator: Assignment 10, Q1 (prefix tuning vs adapters)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
      - title: 'Li & Liang (2021), Prefix-Tuning: Optimizing Continuous Prompts for Generation, arXiv:2101.00190'
        url: https://arxiv.org/abs/2101.00190
        locator: Abstract; Sec. 4 Prefix-Tuning
      - title: Houlsby et al. (2019), Parameter-Efficient Transfer Learning for NLP, arXiv:1902.00751
        url: https://arxiv.org/abs/1902.00751
        locator: Sec. 2.1 Instantiation for Transformer Networks (Fig. 2)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment10#q1
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-011
    type: single
    difficulty: medium
    tags:
      - qlora
      - quantization
      - double-quantization
    question: |
      QLoRA fine-tunes LoRA adapters on top of a base model stored in 4-bit precision. What does its
      "double quantization" do?
    options:
      - text: It also quantizes the quantization constants, saving more memory
        correct: true
      - text: It quantizes every weight twice to reach 1-bit storage
        why: The weights stay at 4 bits; the second quantization is applied to the per-block scaling constants [^2].
      - text: It swaps weights back to 16 bits whenever the loss gets worse
        why: QLoRA keeps the base weights in 4 bits throughout and dequantizes them only for computation [^2].
      - text: It quantizes the LoRA adapters as well as the frozen base model weights
        why: The LoRA adapters are trained in 16-bit precision; only the frozen base model is quantized [^2].
    explanation: |
      Block-wise 4-bit quantization stores one scaling constant per block of weights (e.g. 64), and in
      32-bit precision those constants add about 0.5 bit per parameter [^2]. Double quantization
      quantizes these constants themselves to 8 bits, cutting the overhead from 0.5 to about 0.127
      bit per parameter, which saves roughly 3 GB on a 65B model [^1][^2]. It is one of QLoRA's three memory savings,
      besides the 4-bit NormalFloat format and paged optimizers [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 10, Q9 (role of double quantization in QLoRA)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs, arXiv:2305.14314'
        url: https://arxiv.org/abs/2305.14314
        locator: Abstract; Sec. 3 QLoRA Finetuning (Double Quantization)
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment10#q9
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_10.png
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-012
    type: multiple
    difficulty: medium
    tags:
      - soft-prompts
      - prompt-tuning
      - peft
    question: |
      Soft prompts (prompt tuning) prepend trainable embedding vectors to the input of a frozen
      model, instead of hand-written text prompts. What are their main drawbacks? Select all that
      apply.
    options:
      - text: They must be learned by gradient descent on task data, unlike written prompts
        correct: true
      - text: The learned vectors match no words, so users cannot read or edit them
        correct: true
      - text: A forward pass is much slower than with a text prompt of the same length
        why: A soft prompt of $k$ vectors costs the same as $k$ ordinary token embeddings in the forward pass [^2].
      - text: They need a transformer architecture different from the standard one
        why: The vectors are simply prepended to the input embeddings of an unchanged model [^2].
    explanation: |
      A soft prompt is a short sequence of continuous vectors trained by backpropagation while the
      model stays frozen [^2]. That is cheap compared with full fine-tuning, but unlike a discrete
      prompt it needs labelled data and a training run for each task [^1]. The vectors need not lie
      near any word embedding, so they cannot be read or tweaked by hand. The model and its forward
      pass are unchanged apart from a few extra input positions [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 8, Q2 (challenges of soft prompts)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
      - title: Lester et al. (2021), The Power of Scale for Parameter-Efficient Prompt Tuning, arXiv:2104.08691
        url: https://arxiv.org/abs/2104.08691
        locator: Sec. 2 Prompt Tuning; Sec. 7 Interpretability
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment8#q2
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-013
    type: single
    difficulty: easy
    tags:
      - lora
      - peft
      - memory
      - adam
    question: |
      You fine-tune a 7-billion-parameter language model with Adam. Full fine-tuning runs out of GPU
      memory, but LoRA on the same model fits. Where does most of LoRA's memory saving come from?
    options:
      - text: LoRA stores the frozen pretrained weights in 4-bit precision instead of 16-bit precision
        why: Storing the frozen base model in 4 bits is what QLoRA adds on top of LoRA [^3]; plain LoRA keeps $W_0$ as it is and only freezes it [^1].
      - text: Frozen weights need no weight gradients and no Adam moment estimates; only $A$ and $B$ do
        correct: true
      - text: LoRA moves the pretrained matrices off the GPU during training and keeps only $BA$ there
        why: The forward pass is $h = W_0\mathbf{x} + BA\mathbf{x}$, so $W_0$ is needed at every training step [^1].
      - text: LoRA skips the backward pass through the frozen layers, so their activations need not be stored
        why: Gradients still flow back through the frozen layers to reach the adapters below them; only the weight gradients of the frozen matrices are skipped [^3].
    explanation: |
      Adam keeps two moment estimates for every trainable parameter, on top of its gradient. In LoRA
      the pretrained $W_0$ is frozen and receives no gradient updates, so gradients and optimizer
      states exist only for the small matrices $A$ and $B$ [^1]. For a large Transformer this cuts
      training VRAM by up to 2/3; on GPT-3 175B it went from 1.2 TB to 350 GB [^2]. The frozen
      weights still sit in GPU memory, and the backward pass still runs through them; QLoRA goes
      further and stores them in 4 bits [^3].
    references:
      - title: 'Hu et al. (2021), LoRA: Low-Rank Adaptation of Large Language Models'
        url: https://arxiv.org/abs/2106.09685
        locator: Sec. 4.1 Low-Rank-Parametrized Update Matrices, Eq. (3)
