  - id: fine-tuning-024
    type: multiple
    difficulty: medium
    tags:
      - prefix-tuning
      - prompt-tuning
      - soft-prompts
      - scale
    question: |
      Prefix tuning and prompt tuning both freeze the pretrained language model and learn a few
      continuous "virtual token" vectors per task. Which statements are correct? Select all that apply.
    options:
      - text: Both pick real tokens from the vocabulary, so the learned prompts stay readable
        why: Soft prompts are learned by backpropagation and need not match any word's embedding, which is why they are not human-readable [^4].
      - text: At the T5-XXL scale (11B parameters), prompt tuning matches full model tuning
        correct: true
      - text: Prefix tuning prepends trainable vectors to the activations of every layer
        correct: true
      - text: Prefix tuning also updates the model's weights, but with a small learning rate
        why: Prefix tuning keeps the language model's parameters fixed; the prefix parameters are the only trainable ones [^1].
      - text: Prompt tuning prepends trainable vectors only to the embedded input
        correct: true
    explanation: |
      In prefix tuning the activations at the prefix positions of every layer are free parameters, and
      later tokens attend to them as if they were virtual tokens [^1]. Prompt tuning simplifies this to
      a single learned prompt prepended to the embedded input; the frozen Transformer computes the
      upper layers from it [^2]. Prefix tuning also needs an MLP reparameterization to train stably,
      which prompt tuning does without [^1][^2]. Prompt tuning becomes more competitive with scale: at
      T5-XXL it matches even multi-task model tuning with over 20,000 times fewer task-specific
      parameters [^3].
    references:
      - title: 'Li & Liang (2021), Prefix-Tuning: Optimizing Continuous Prompts for Generation'
        url: https://arxiv.org/abs/2101.00190
        locator: Sec. 4.2 Method, Eq. (3); Sec. 4.3 Parametrization of the prefix
      - title: Lester, Al-Rfou & Constant (2021), The Power of Scale for Parameter-Efficient Prompt Tuning
        url: https://arxiv.org/abs/2104.08691
        locator: Sec. 4 Comparison to Similar Approaches
      - title: Lester, Al-Rfou & Constant (2021), The Power of Scale for Parameter-Efficient Prompt Tuning
        url: https://arxiv.org/abs/2104.08691
        locator: Sec. 3.1 Closing the Gap, Figure 1
      - title: 'Hugging Face PEFT docs: Soft prompts (conceptual guide)'
        url: https://huggingface.co/docs/peft/main/en/conceptual_guides/prompting#soft-prompts
        locator: Soft prompts (introduction), Prompt tuning, Prefix tuning
    source:
      id: original
      ref: fine-tuning-024
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-025
    type: multiple
    difficulty: medium
    tags:
      - catastrophic-forgetting
      - ewc
      - adapters
      - replay
    question: |
      You fine-tune a pretrained model on a narrow new task and want it to keep what it could do before,
      that is, to avoid catastrophic forgetting. Which strategies help? Select all that apply.
    options:
      - text: Unfreeze all layers at once with a large learning rate, so the new task needs fewer steps
        why: Fine-tuning all layers at once risks catastrophic forgetting, which is why ULMFiT unfreezes gradually and gives lower layers smaller learning rates [^4]; large steps also move the pretrained weights further [^5].
      - text: Train until the loss on the new task is near zero, so that the weights settle down
        why: Gradient steps on the new task alone minimize its loss but destroy what was learned for the old task; more of them only moves further away [^2].
      - text: Add an EWC penalty that keeps weights important for the old task close to their old values
        correct: true
      - text: Mix examples from the original data or tasks into the fine-tuning batches
        correct: true
      - text: Freeze the pretrained weights and train only small adapter modules for the new task
        correct: true
    explanation: |
      Forgetting happens because the weights that solved the old task are overwritten for the new one.
      Interleaving data from all tasks prevents it, since the weights are then optimized jointly for
      every task [^1]. EWC adds $\sum_i \frac{\lambda}{2} F_i (\theta_i - \theta^*_{A,i})^2$ to the new
      task's loss, slowing learning on weights whose Fisher information $F_i$ marks them as important
      for the old task [^2]. Adapters keep the shared weights frozen, so the model has perfect memory of
      earlier tasks [^3]. ULMFiT's gradual unfreezing and per-layer learning rates address the same
      risk [^4].
    references:
      - title: Kirkpatrick et al. (2017), Overcoming catastrophic forgetting in neural networks
        url: https://arxiv.org/abs/1612.00796
        locator: Sec. 1 Introduction (interleaving data from multiple tasks)
      - title: Kirkpatrick et al. (2017), Overcoming catastrophic forgetting in neural networks
        url: https://arxiv.org/abs/1612.00796
        locator: Sec. 2 Elastic weight consolidation, Eq. (3) and Figure 1
      - title: Houlsby et al. (2019), Parameter-Efficient Transfer Learning for NLP
        url: https://arxiv.org/abs/1902.00751
        locator: Sec. 1 Introduction; Sec. 4 Related Work, paragraph "Continual Learning"
      - title: Howard & Ruder (2018), Universal Language Model Fine-tuning for Text Classification
        url: https://arxiv.org/abs/1801.06146
        locator: Sec. 3.2 Target task LM fine-tuning (Discriminative fine-tuning); Sec. 3.3 (Gradual unfreezing)
      - title: 'Stanford CS231n notes: Transfer Learning'
        url: https://cs231n.github.io/transfer-learning/#tf
        locator: Practical advice, "Learning rates"
    source:
      id: original
      ref: fine-tuning-025
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-026
    type: true_false
    difficulty: medium
    tags:
      - instruction-tuning
      - flan
      - zero-shot
      - scale
    shuffle: false
    question: |
      FLAN fine-tunes pretrained language models on over 60 NLP datasets phrased as natural-language
      instructions (instruction tuning) and evaluates them zero-shot on task clusters held out of
      training. True or false: in its scaling ablation, instruction tuning improved held-out zero-shot
      performance at every model size tested, from 422M to 137B parameters.
    options:
      - text: 'True'
        why: For the 8B and smaller models, instruction tuning actually hurt performance on held-out tasks; only the two models of about 100B parameters gained substantially [^2].
      - text: 'False'
        correct: true
    explanation: |
      For the 137B model, instruction tuning substantially improves zero-shot performance on unseen
      tasks; FLAN beats zero-shot 175B GPT-3 on 20 of 25 datasets [^1]. A dataset counts as unseen only
      if no dataset from its task cluster was used in instruction tuning [^3]. The scaling ablation shows
      that the benefit needs scale: the models of about 100B parameters improve substantially on
      held-out tasks, but for 8B and smaller ones instruction tuning hurts [^2]. The authors suggest that
      learning the roughly 40 training tasks fills a small model's capacity, while a large model also
      learns to follow instructions [^2].
    references:
      - title: Wei et al. (2021), Finetuned Language Models Are Zero-Shot Learners
        url: https://arxiv.org/abs/2109.01652
        locator: Abstract
      - title: Wei et al. (2021), Finetuned Language Models Are Zero-Shot Learners
        url: https://arxiv.org/abs/2109.01652
        locator: Sec. 4.2 Scaling laws, Figure 7
      - title: Wei et al. (2021), Finetuned Language Models Are Zero-Shot Learners
        url: https://arxiv.org/abs/2109.01652
        locator: Sec. 2.2 Evaluation Splits
    source:
      id: original
      ref: fine-tuning-026
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-027
    type: multiple
    difficulty: medium
    tags:
      - learning-rate
      - data-quality
      - lima
      - lora
      - sft
    question: |
      You fine-tune an LLM into a chat assistant. Which statements about learning rates, batch sizes and
      training data are supported by published results? Select all that apply.
    options:
      - text: In LIMA's ablations, 16 times more examples of the same quality kept improving the answers
        why: Diversity and quality helped, but a 16-fold increase in quantity alone left performance on a plateau [^3].
      - text: LoRA tolerates large batch sizes better than full fine-tuning, so batches can grow freely
        why: The opposite was found; LoRA is less tolerant of large batch sizes, raising the rank does not fix it, and an effective batch size below 32 is recommended [^1].
      - text: LoRA usually needs a higher learning rate than full fine-tuning of the same model
        correct: true
      - text: LIMA made a 65B model a strong assistant with only 1,000 carefully curated examples
        correct: true
    explanation: |
      Counterintuitively, LoRA's best learning rate is higher than full fine-tuning's; the TRL
      reproduction of "LoRA Without Regret" used $10^{-5}$ for LoRA against $10^{-6}$ for full
      fine-tuning [^1]. LIMA fine-tuned LLaMA 65B with the standard supervised loss on 1,000 curated
      prompt–response pairs, without RLHF, and its answers were equivalent to or preferred over GPT-4's
      in 43% of cases [^2]. Its ablations show that input diversity and output quality matter, while
      scaling up quantity alone might not [^3]. The authors read this as support for the Superficial
      Alignment Hypothesis: knowledge comes almost entirely from pretraining, and alignment mainly
      teaches format and style [^4].
    references:
      - title: 'Hugging Face TRL docs: LoRA Without Regret'
        url: https://huggingface.co/docs/trl/lora_without_regret#key-findings-in-optimizing-lora
        locator: Key findings in optimizing LoRA, items 3 (learning rate) and 4 (batch size)
      - title: 'Zhou et al. (2023), LIMA: Less Is More for Alignment'
        url: https://arxiv.org/abs/2305.11206
        locator: Abstract; Sec. 3 Training LIMA
      - title: 'Zhou et al. (2023), LIMA: Less Is More for Alignment'
        url: https://arxiv.org/abs/2305.11206
        locator: Sec. 5 Why is Less More? Ablations on Data Diversity, Quality, and Quantity, Figure 6
      - title: 'Zhou et al. (2023), LIMA: Less Is More for Alignment'
        url: https://arxiv.org/abs/2305.11206
        locator: Sec. 2 Alignment Data (Superficial Alignment Hypothesis)
    source:
      id: original
      ref: fine-tuning-027
    status: reviewed
