  - id: fine-tuning-021
    type: short_answer
    difficulty: hard
    tags:
      - qlora
      - quantization
      - double-quantization
      - memory
    question: |
      QLoRA stores a 7-billion-parameter base model in 4-bit NormalFloat, quantized in blocks of 64
      weights with one quantization constant per block. With double quantization these constants are
      themselves stored as 8-bit floats, and every 256 of them share one 32-bit second-level constant.
      How many gigabytes ($10^9$ bytes) do the stored weights and constants take?
    answer:
      numeric: 3.61
      tolerance: 0.006
      hint: GB, 2 decimals
      model: $4 + \frac{8}{64} + \frac{32}{64 \cdot 256} \approx 4.127$ bits per parameter; $7 \times 10^9 \times 4.127 / 8 \approx 3.61$ GB
    explanation: |
      The 4-bit codes alone take $7 \times 10^9 \times 4 / 8 = 3.5$ GB, against 14 GB for the same
      weights in 16-bit. With 32-bit constants, one per block of 64, the constants would add
      $32/64 = 0.5$ bits per parameter (3.94 GB in total); double quantization cuts this to
      $8/64 + 32/(64 \cdot 256) = 0.127$ bits, a saving of 0.373 bits per parameter [^1], so the total
      is about 3.61 GB. This counts only the frozen weights: the LoRA adapters, their optimizer states
      and the activations come on top [^2]. Together these savings let QLoRA fine-tune a 65B model on a
      single 48 GB GPU [^3].
    references:
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 3 QLoRA Finetuning, paragraph "Double Quantization"
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 2 Background, paragraph "Memory Requirement of Parameter-Efficient Finetuning"
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Abstract
    source:
      id: original
      ref: fine-tuning-021
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-022
    type: multiple
    difficulty: medium
    tags:
      - qlora
      - quantization
      - nf4
      - paged-optimizers
    question: |
      QLoRA fine-tunes very large language models on a single GPU. Which statements describe how it
      works? Select all that apply.
    options:
      - text: Paged optimizers move optimizer states to CPU RAM automatically when GPU memory runs short
        correct: true
      - text: Weight gradients are computed only for the LoRA parameters, which are kept in BFloat16
        correct: true
      - text: The frozen base weights are stored in 4-bit NormalFloat and dequantized to BFloat16 for computation
        correct: true
      - text: The 4-bit base weights also receive gradient updates, and the LoRA adapters add extra capacity
        why: The base model stays frozen; gradients flow *through* it into the LoRA adapters only [^1][^2].
      - text: NormalFloat spaces its levels evenly, because pretrained weights are spread out uniformly
        why: NF4 is built for zero-centered, normally distributed weights and places its levels at quantiles, so that each bin gets an equal share of the values [^3].
    explanation: |
      QLoRA has one storage data type, usually 4-bit NormalFloat, and one computation data type,
      BFloat16: weights are dequantized for the forward and backward pass, but weight gradients are
      computed only for the LoRA parameters [^2]. Gradients flow back through the frozen 4-bit model
      into the adapters [^1]. NF4 builds on quantile quantization and assumes the zero-centered normal
      distribution of pretrained weights [^3]. Paged optimizers use NVIDIA unified memory to evict
      optimizer states to CPU RAM when the GPU runs out of memory, which absorbs memory spikes [^4].
    references:
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Abstract
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 3 QLoRA Finetuning, paragraph "QLoRA", Eq. (5)–(6)
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 3 QLoRA Finetuning, paragraph "4-bit NormalFloat Quantization"
      - title: 'Dettmers et al. (2023), QLoRA: Efficient Finetuning of Quantized LLMs'
        url: https://arxiv.org/abs/2305.14314
        locator: Sec. 3 QLoRA Finetuning, paragraph "Paged Optimizers"
    source:
      id: original
      ref: fine-tuning-022
    status: reviewed
    reviewed_by: claude
  - id: fine-tuning-023
    type: short_answer
    difficulty: medium
    tags:
      - adapters
      - peft
      - parameter-count
    question: |
      Houlsby-style adapters are added to a 12-layer Transformer with hidden size $d = 768$. Each
      adapter is a bottleneck: a linear layer $d \to m$ with bias, a nonlinearity, a linear layer
      $m \to d$ with bias, and a skip connection around them, with $m = 64$. Every layer gets two
      adapters, one after the attention sub-layer and one after the feed-forward sub-layer. How many
      adapter parameters are added in total? (Ignore layer-norm and classifier parameters.)
    answer:
      numeric: 2379264
      tolerance: 0
      hint: a whole number
      model: $12 \times 2 \times (2md + d + m) = 24 \times (2 \cdot 64 \cdot 768 + 768 + 64) = 24 \times 99\,136 = 2\,379\,264$
    explanation: |
      The down-projection has $dm$ weights and $m$ biases and the up-projection $md$ weights and $d$
      biases, so one adapter adds $2md + d + m$ parameters [^1]. Two adapters per layer over 12 layers
      give $24 \times 99\,136 \approx 2.38$ million; $m = 64$ is the fixed adapter size the paper tried
      on GLUE [^2]. Thanks to the skip connection, an adapter whose projections start near zero is
      close to the identity, so training starts from the pretrained network's behavior [^1]. Unlike a
      merged LoRA update, these extra layers still run in sequence at inference time [^3].
    references:
      - title: Houlsby et al. (2019), Parameter-Efficient Transfer Learning for NLP
        url: https://arxiv.org/abs/1902.00751
        locator: Sec. 2.1 Instantiation for Transformer Networks, Figure 2
      - title: Houlsby et al. (2019), Parameter-Efficient Transfer Learning for NLP
        url: https://arxiv.org/abs/1902.00751
