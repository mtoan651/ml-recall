schema_version: 1
domain: llm
topic: fine-tuning
title: Fine-tuning & PEFT
questions:
  - id: fine-tuning-001
    type: single
    difficulty: easy
    question: Why do we use dynamic padding instead of padding all sequences to the maximum length in the dataset?
    options:
      - text: Dynamic padding is required by the model architecture.
        why: No, models can handle both fixed and dynamic padding.
      - text: It pads each batch only to its own longest sequence, saving computation.
        correct: true
      - text: It improves model accuracy.
        why: Padding strategy doesn't directly affect model accuracy.
      - text: It's required when using the DataCollatorWithPadding.
        why: DataCollatorWithPadding enables dynamic padding, but you could still use fixed padding if desired.
    explanation: |
      Padding every sample to the longest sequence in the whole dataset (or to the model's maximum
      length) wastes computation on pad tokens. With dynamic padding, padding is postponed until
      the batches are built: a collate function such as `DataCollatorWithPadding` pads each batch
      only to the length of its longest sample, which speeds up training considerably [^1]. It is
      an efficiency choice, not a requirement of the model or of the collator, and it can even cause
      problems on TPUs, which prefer fixed shapes [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
        locator: Chapter 3.2 Processing the data, sec. Dynamic padding
    source:
      id: hf-llm-course
      ref: chapter3/2#q2
      url: https://huggingface.co/learn/llm-course/chapter3/2
    status: draft
  - id: fine-tuning-002
    type: single
    difficulty: easy
    question: What should you monitor during SFT training?
    options:
      - text: Both quantitative metrics and qualitative outputs
        correct: true
      - text: Only the training loss curve
        why: Training loss alone isn't sufficient to ensure good model behavior.
      - text: Only the quality of the model's generated outputs
        why: While important, qualitative evaluation alone misses important training dynamics.
    explanation: |
      Quantitative signals (training and validation loss, learning rate, gradient norms) reveal the
      training dynamics: for example, validation loss rising while training loss falls signals
      overfitting [^1]. But the loss can look fine while the model picks up unwanted behavior, such
      as inconsistent output formatting, so you should also read the model's actual outputs
      regularly [^2]. Each kind of check catches problems that the other misses.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3#metrics-to-monitor
        locator: Chapter 11.3 Supervised Fine-Tuning, sec. Metrics to Monitor
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3#warning-signs-to-watch-for
        locator: Chapter 11.3 Supervised Fine-Tuning, sec. Warning Signs to Watch For (closing warning)
    source:
      id: hf-llm-course
      ref: chapter11/3#q4
      url: https://huggingface.co/learn/llm-course/chapter11/3
    status: draft
  - id: fine-tuning-003
    type: single
    difficulty: easy
    question: Which of the following statements is true about LLMs?
    options:
      - text: A distilled LLM contains fewer parameters than the foundation language model it sprung from.
        correct: true
      - text: A fine-tuned LLM contains fewer parameters than the foundation language model it was trained on.
        why: A fine-tuned model contains the *same number* of parameters as the original foundation language model.
      - text: As users perform more prompt engineering, the number of parameters in an LLM grows.
        why: Prompt engineering doesn't add (or remove or alter) LLM parameters.
    explanation: |
      Distillation creates a smaller version of an LLM: typically a large teacher model labels data,
      and that data trains a smaller student model with fewer parameters, which is cheaper to serve but
      usually predicts a little less well [^1]. Fine-tuning only updates existing weights on
      task-specific examples (all of them, or a subset with parameter-efficient tuning), so a fine-tuned
      model has exactly as many parameters as the foundation model [^2]. Prompt engineering changes only
      the input: it customizes the output without adding, removing or altering any parameter [^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#distillation
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Distillation'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#fine-tuning
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Fine-tuning'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/tuning#prompt_engineering
        locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Prompt engineering (note)'
    source:
      id: google-mlcc
      ref: llm/tuning#q1
      url: https://developers.google.com/machine-learning/crash-course/llm/tuning
    status: draft
