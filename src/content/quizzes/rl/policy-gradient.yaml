  - id: policy-gradient-007
    type: multiple
    question: Which of the following statements are true about Monte Carlo method?
    options:
      - text: It's a sampling mechanism, which means we don't analyze all the possible states, but a sample of those
        correct: true
      - text: It's very resistant to stochasticity (random elements in the trajectory)
        why: Monte Carlo randomly estimates everytime a sample of trajectories. However, even same trajectories can have different reward values if they contain stochastic elements
      - text: To reduce the impact of stochastic elements in Monte Carlo, we take `n` strategies and average them, reducing their individual impact
        correct: true
    references:
