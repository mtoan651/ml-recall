schema_version: 1
domain: rl
topic: policy-gradient
title: Policy Gradient & Actor-Critic
questions:
  - id: policy-gradient-001
    type: multiple
    difficulty: medium
    question: What are the advantages of policy-gradient over value-based methods? (Check all that apply)
    options:
      - text: Policy-gradient methods can learn a stochastic policy
        correct: true
      - text: Policy-gradient methods are more effective in high-dimensional action spaces and continuous actions spaces
        correct: true
      - text: Policy-gradient converges most of the time on a global maximum.
        why: No, frequently, policy-gradient converges on a local maximum instead of a global optimum.
    explanation: |
      Policy-gradient methods output a probability distribution over actions, so they can learn a
      genuinely stochastic policy. This builds exploration in and handles perceptual aliasing,
      where two states look identical but need different actions [^1]. Value methods have no
      natural way to find stochastic optimal policies [^2]. They also suit huge or continuous
      action spaces. A Q-network has to score every action and take the max, and maximizing
      over a continuous output is an optimization problem in its own right [^1]. The global
      maximum claim is false: policy gradient frequently ends up at a local maximum, and
      REINFORCE is only guaranteed to converge to a local optimum [^1][^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/advantages-disadvantages
        locator: Unit 4, "The advantages and disadvantages of policy-gradient methods" (Advantages; Disadvantages)
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.1 Policy Approximation and its Advantages, pp. 322–324; Sec. 13.3 REINFORCE, p. 329
    source:
      id: hf-deep-rl-course
      ref: unit4/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit4/quiz
    status: draft
  - id: policy-gradient-002
    type: short_answer
    difficulty: medium
    question: |
      Complete the statement of what the Policy Gradient Theorem gives us. It rewrites the gradient
      of the objective in a form that does not involve the derivative of the {{1}} distribution:
      $\nabla J(\theta) \propto \sum_s \mu(s) \sum_a q_\pi(s,a)\, \nabla_\theta \pi(a \mid s, \theta)$.
      As a result the gradient can be estimated from sampled {{2}}, using only
      $\nabla_\theta \log \pi_\theta(a_t \mid s_t)$ and the observed returns, with no model of the
      environment.
    answer:
      blanks:
        - accept:
            - state
            - states
            - state visitation
            - on-policy state
            - on-policy
          hint: one word
        - accept:
            - trajectories
            - trajectory
            - episodes
            - episode
            - rollouts
            - rollout
          hint: one word (plural)
    explanation: |
      Changing $\theta$ changes the actions and therefore which states the agent visits, but how that
      shifts the state distribution depends on the environment's dynamics, which are usually unknown
      [^1]. The theorem sidesteps this: the gradient becomes a sum over states weighted by $\mu(s)$
      in which only the policy is differentiated [^1]. In the trajectory form used by REINFORCE, the
      initial-state and transition probabilities do not depend on $\theta$, so their derivatives
      vanish and only $\sum_t \nabla_\theta \log \pi_\theta(a_t \mid s_t)$ remains, which is averaged
      over sampled trajectories [^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.2 The Policy Gradient Theorem, Eq. (13.5), pp. 324–326
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/pg-theorem
        locator: Unit 4, "(Optional) the Policy Gradient Theorem"
    source:
      id: hf-deep-rl-course
      ref: unit4/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit4/quiz
    status: draft
  - id: policy-gradient-003
    type: multiple
    difficulty: medium
    question: What's the difference between policy-based methods and policy-gradient methods? (Check all that apply)
    options:
      - text: Policy-based methods are a subset of policy-gradient methods.
      - text: Policy-gradient methods are a subset of policy-based methods.
        correct: true
      - text: In Policy-based methods, we can optimize the parameter $\theta$ **indirectly** by maximizing the local approximation of the objective function with techniques like hill climbing, simulated annealing, or evolution strategies.
        correct: true
      - text: In Policy-gradient methods, we optimize the parameter $\theta$ **directly** by performing the gradient ascent on the performance of the objective function.
        correct: true
    explanation: |
      Policy-gradient methods are a subclass of policy-based methods, not the other way round
      [^1]. Both search directly for a policy. They differ in how they optimize $\theta$.
      General policy-based methods may improve $\theta$ indirectly, for example by hill climbing,
      simulated annealing or evolution strategies on a local approximation of the objective.
      Policy-gradient methods compute (an estimate of) $\nabla_\theta J(\theta)$ and do gradient
      ascent on it [^1]. Sutton & Barto define policy-gradient methods by exactly this
      gradient-ascent update on a performance measure $J(\theta)$ [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#the-difference-between-policy-based-and-policy-gradient-methods
        locator: Unit 4, "What are the policy-based methods?", section "The difference between policy-based and policy-gradient methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Ch. 13 introduction, Eq. (13.1), p. 321
    source:
      id: hf-deep-rl-course
      ref: unit4/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit4/quiz
    status: draft
  - id: policy-gradient-004
    type: single
    difficulty: easy
    question: Why do we use gradient ascent instead of gradient descent to optimize $J(\theta)$?
    options:
      - text: We want to minimize $J(\theta)$ and gradient ascent gives us the direction of the steepest increase of $J(\theta)$
      - text: We want to maximize $J(\theta)$ and gradient ascent gives us the direction of the steepest increase of $J(\theta)$
        correct: true
    explanation: |
      $J(\theta)$ is the expected return of the policy, which is something we want to make as
      large as possible [^1]. The gradient points in the direction of steepest increase, so we
      step along it: $\theta \leftarrow \theta + \alpha \nabla_\theta J(\theta)$ [^1][^2].
      Gradient descent is the right tool when the objective is a loss to minimize. Saying we
      want to minimize $J$ contradicts using the direction that increases it.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/policy-gradient#gradient-ascent-and-the-policy-gradient-theorem
        locator: Unit 4, "Diving deeper into policy-gradient methods", sections "The objective function" and "Gradient Ascent and the Policy-gradient Theorem"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Ch. 13 introduction, Eq. (13.1), p. 321
    source:
      id: hf-deep-rl-course
      ref: unit4/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit4/quiz
    status: draft
  - id: policy-gradient-005
    type: single
    difficulty: medium
    question: Which of the following interpretations of bias-variance tradeoff is the most accurate in the field of Reinforcement Learning?
    options:
      - text: The bias-variance tradeoff reflects how my model is able to generalize the knowledge to previously tagged data we give to the model during training time.
        why: This is the traditional bias-variance tradeoff in Machine Learning. In our specific case of Reinforcement Learning, we don't have previously tagged data, but only a reward signal.
      - text: The bias-variance tradeoff reflects how well the reinforcement signal reflects the true reward the agent should get from the environment
        correct: true
    explanation: |
      An RL agent has no labeled examples of the correct action; it learns only from a reward
      signal [^1]. In RL, bias and variance describe the estimate of return used as the learning
      signal. REINFORCE uses the actual Monte Carlo return, which is unbiased but varies a lot
      between episodes [^2]. Actor-critic methods replace it with a bootstrapped one-step return,
      which has lower variance but introduces bias [^3]. The tradeoff is therefore about how
      faithfully the reinforcement signal tracks the true expected return. Generalizing from
      labeled training data is the supervised-learning reading of bias and variance.
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, pp. 1–2
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/variance-problem
        locator: Unit 6, "The Problem of Variance in Reinforce"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.5 Actor–Critic Methods, p. 331
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-006
    type: multiple
    difficulty: medium
    question: Which of the following statements are true, when talking about models with bias and/or variance in RL?
    options:
      - text: An unbiased reward signal returns rewards similar to the real / expected ones from the environment
        correct: true
      - text: A biased reward signal returns rewards similar to the real / expected ones from the environment
        why: If a reward signal is biased, it means the reward signal we get differs from the real reward we should be getting from an environment
      - text: A reward signal with high variance has much noise in it and gets affected by, for example, stochastic (non constant) elements in the environment
        correct: true
      - text: A reward signal with low variance has much noise in it and gets affected by, for example, stochastic (non constant) elements in the environment
        why: If a reward signal has low variance, then it's less affected by the noise of the environment and produces similar values regardless of the random elements in the environment
    explanation: |
      "Unbiased" means the signal matches the true expected return on average. The Monte Carlo
      return in REINFORCE is unbiased because it is the return actually obtained, not an
      estimate [^1]. "High variance" means noisy: randomness in the environment and in the
      policy can give very different returns from the same starting state [^1]. The two wrong
      options swap the terms. A biased signal is one that systematically differs from the true
      return; bootstrapping on a critic's estimate is the classic source of such bias [^2].
      A low-variance signal is the one that stays stable despite the noise.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/variance-problem
        locator: Unit 6, "The Problem of Variance in Reinforce"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.5 Actor–Critic Methods, p. 331
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-007
    type: multiple
    difficulty: medium
    question: Which of the following statements are true about Monte Carlo method?
    options:
      - text: It's a sampling mechanism, which means we don't analyze all the possible states, but a sample of those
        correct: true
      - text: It's very resistant to stochasticity (random elements in the trajectory)
        why: Monte Carlo estimates from a fresh random sample of trajectories every time, and even the same trajectory can give different rewards if it contains stochastic elements. That makes it sensitive to randomness, not resistant to it.
      - text: To reduce the impact of stochastic elements in Monte Carlo, we sample $n$ trajectories and average them, reducing their individual impact
        correct: true
    explanation: |
      Monte Carlo estimation works from samples. It runs episodes and averages the returns it
      actually observes, rather than accounting for every possible state and trajectory [^1][^2].
      That makes it sensitive to randomness, not resistant: stochastic transitions and a
      stochastic policy can give very different returns from the same start [^1]. The usual
      remedy is to collect many trajectories and average them, so that each one's noise has less
      influence. The price is lower sample efficiency [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/variance-problem
        locator: Unit 6, "The Problem of Variance in Reinforce"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, pp. 58–59 (Monte Carlo methods average sample returns)
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-008
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of the Actor-Critic method (A2C). It learns two function
      approximations. The actor is a {{1}} $\pi_\theta(a \mid s)$ that controls how the agent acts.
      The critic is a {{2}} function that measures how good the action taken was and guides the
      actor's update. Judging actions with the critic instead of full Monte Carlo returns, as
      REINFORCE does, reduces the {{3}} of the gradient estimate.
    answer:
      blanks:
        - accept:
            - policy
            - policy function
          hint: one word
        - accept:
            - value
            - action-value
            - action value
            - state-value
            - state value
            - Q-value
            - Q
            - advantage
          hint: one word
        - accept:
            - variance
          hint: a statistical property
    explanation: |
      REINFORCE weights each action by a full Monte Carlo return, a very noisy signal, so
      actor-critic methods let a learned critic assess each action instead [^1]. In Sutton & Barto's
      one-step version the critic's estimate $R_{t+1} + \gamma \hat v(S_{t+1}, \mathbf{w})$ replaces
      the return; it has lower variance but introduces some bias [^2]. Both parts keep learning: the
      actor updates its policy parameters from the critic's feedback, and the critic updates its
      value parameters [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic#reducing-variance-with-actor-critic-methods
        locator: Unit 6, "Advantage Actor-Critic (A2C)", sections "Reducing variance with Actor-Critic methods" and "The Actor-Critic Process"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.5 Actor–Critic Methods, Eqs. (13.12)–(13.14), p. 331
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-009
    type: multiple
    difficulty: medium
    question: Which of the following statements are true about the Actor-Critic Method?
    options:
      - text: The Critic does not learn any function during the training process
        why: Both the Actor and the Critic function parameters are updated during training time
      - text: The Actor learns a policy function, while the Critic learns a value function
        correct: true
      - text: It adds resistance to stochasticity and reduces high variance
        correct: true
    explanation: |
      Actor-critic learns two function approximators. The actor is a policy $\pi_\theta$ that
      chooses actions, and the critic is a value function that judges them [^1]. It was
      introduced to cut the high variance of REINFORCE's Monte Carlo returns [^1]. The critic's
      one-step return varies far less than the actual return, although it adds some bias [^2].
      The claim that the critic learns nothing is false: during training the actor updates its
      policy parameters and the critic updates its value parameters [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic#the-actor-critic-process
        locator: Unit 6, "Advantage Actor-Critic (A2C)", sections "Reducing variance with Actor-Critic methods" and "The Actor-Critic Process"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 13.5 Actor–Critic Methods, p. 331
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-010
    type: short_answer
    difficulty: medium
    question: |
      Complete the description of the advantage in A2C. The advantage $A(s,a) = Q(s,a) - V(s)$
      measures how much better taking action $a$ in state $s$ is than the {{1}} value of that state.
      If $A(s,a) > 0$, the update {{2}} the probability of taking $a$ in $s$. Learning both $Q$ and
      $V$ would need two value functions, so A2C estimates the advantage with the {{3}} error
      $r + \gamma V(s') - V(s)$.
    answer:
      blanks:
        - accept:
            - average
            - mean
            - expected
          hint: one word
        - accept:
            - increases
            - raises
            - boosts
            - pushes up
            - increase
            - raise
          hint: one verb
        - accept:
            - TD
            - temporal difference
            - temporal-difference
          hint: an abbreviation or two words
    explanation: |
      Subtracting $V(s)$ turns the action value into a relative score: the extra return the action
      earns compared with what the policy gets from that state on average [^1][^2]. A positive
      advantage moves the policy toward that action and a negative one moves it away [^1]. Because
      estimating both $Q$ and $V$ would need two networks, A2C uses the TD error
      $r + \gamma V(s') - V(s)$, which needs only a state-value critic, as its estimate of the
      advantage [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic#adding-advantage-in-actor-critic-a2c
        locator: Unit 6, "Advantage Actor-Critic (A2C)", section "Adding Advantage in Actor-Critic (A2C)"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#advantage-functions
        locator: Section "Advantage Functions"
    source:
      id: hf-deep-rl-course
      ref: unit6/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit6/quiz
    status: draft
  - id: policy-gradient-011
    type: single
    difficulty: medium
    question: |
      In an actor-critic agent, the critic estimates the total reward that can be expected from the
      current state. How is the critic trained?
    options:
      - text: By minimising the difference between its estimates and the cumulative rewards actually observed
        correct: true
      - text: By copying the action probabilities that the actor outputs
      - text: By making the action that the actor took more likely, as in policy gradients
      - text: It is not trained; it is the fixed reward function that the environment provides
    explanation: |
      Actor-critic trains a network to return two things: the policy, i.e. which action to take (the
      actor), and an estimate of the total reward expected from the current state (the critic) [^1].
      Because the real cumulative rewards are known from the experiment, the critic loss is the
      difference between them and the critic's estimates; the actor loss is computed as in the policy
      gradient algorithm [^1]. The critic is a learned value function, not the environment's reward
      function, and both parts are updated during training [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#actor-critic-algorithm
        locator: 'Lesson: Deep Reinforcement Learning, sec. Actor-Critic Algorithm'
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic
        locator: 'Unit 6: Advantage Actor-Critic (A2C), sec. Reducing variance with Actor-Critic methods'
    source:
      id: ms-ai-for-beginners
      ref: quiz-222/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: policy-gradient-012
    type: short_answer
    difficulty: medium
    tags:
      - gaussian-policy
      - log-likelihood
      - continuous-actions
    question: |
      A diagonal Gaussian policy has mean $\mu = (0.5,\ -1)$ and log standard deviations
      $\log\sigma = (0,\ \ln 2)$ in some state. What is $\log \pi(a \mid s)$ of the action
      $a = (1.5,\ 1)$? Use
      $\log\pi = -\tfrac12\left(\sum_i \left[\frac{(a_i-\mu_i)^2}{\sigma_i^2} + 2\log\sigma_i\right] + k\log 2\pi\right)$
      and give 3 decimals.
    answer:
      numeric: -3.531
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $-\tfrac12\left(1 + 0 + 1 + 2\ln 2 + 2\ln 2\pi\right) = -3.531$
    explanation: |
      Here $\sigma = (1, 2)$ and $k = 2$ [^1]. The squared standardized errors are $1^2/1 = 1$ and
      $2^2/4 = 1$, the log-std terms add $2\ln 2 = 1.386$, and $k\ln 2\pi = 3.676$; so
      $\log\pi = -\frac12(1 + 1 + 1.386 + 3.676) = -3.531$ [^1]. Equivalently it is the sum of two 1-D
      normal log-densities, $-1.419 + (-2.112)$, because a diagonal Gaussian factorizes over action
      dimensions [^1][^2].
    references:
      - source: spinning-up
        locator: 'Part 1: Key Concepts in RL, Stochastic Policies — Diagonal Gaussian Policies (Log-Likelihood)'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#stochastic-policies
      - source: spinning-up
        locator: 'Exercises, Problem Set 1: Exercise 1.1 Gaussian Log-Likelihood'
        url: https://spinningup.openai.com/en/latest/spinningup/exercises.html
    source:
      id: spinning-up
      ref: docs/spinningup/exercises.rst#q1
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/exercises.rst
    status: draft
  - id: policy-gradient-013
    type: single
    difficulty: medium
    tags:
      - gaussian-policy
      - log-std
      - parameterization
    question: |
      A PPO policy for continuous actions is a diagonal Gaussian whose mean comes from a neural network.
      Many implementations keep a separate parameter vector $\log\sigma$ (not depending on the state) and
      use $\sigma = \exp(\log\sigma)$. Why learn $\log\sigma$ rather than $\sigma$ directly?
    options:
      - text: $\log\sigma$ can take any real value, while $\sigma$ must stay positive
        correct: true
      - text: It makes $\sigma$ depend on the state through the mean network
        why: In this design $\log\sigma$ is a standalone parameter vector; a state-dependent $\sigma$ would need its own network output [^1].
      - text: The log makes the policy deterministic, which PPO requires
        why: A Gaussian with $\sigma > 0$ is stochastic either way; PPO in fact relies on a stochastic policy for exploration [^1].
      - text: Sampling actions is only possible when the standard deviation is in log space
        why: Sampling uses $a = \mu + \sigma \odot z$ with the exponentiated $\sigma$; the log space only matters for learning it [^1].
    explanation: |
      A standard deviation must be non-negative, and enforcing that constraint during gradient-based
      training is awkward [^1]. Learning $\log\sigma$, which is free to be any real number, and
      exponentiating it removes the constraint without losing anything [^1]. Spinning Up's VPG, TRPO and
      PPO use a state-independent $\log\sigma$ vector; the alternative is a network head that outputs
      $\log\sigma_\theta(s)$ [^1][^2].
    references:
      - source: spinning-up
        locator: 'Part 1: Key Concepts in RL, Stochastic Policies — Diagonal Gaussian Policies'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#stochastic-policies
      - source: spinning-up
        locator: 'Exercises, Problem Set 1: Exercise 1.2 Policy for PPO'
        url: https://spinningup.openai.com/en/latest/spinningup/exercises.html
    source:
      id: spinning-up
      ref: docs/spinningup/exercises.rst#q2
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/exercises.rst
    status: draft
  - id: policy-gradient-014
    type: single
    difficulty: hard
    tags:
      - value-function
      - advantage-estimation
      - trpo
    question: |
      You run TRPO on a locomotion task twice: once fitting the value function $V_\phi$ with 80
      gradient steps per epoch, once with 0 steps (so $V_\phi$ stays at its random initialization). The
      second run gets stuck early. Why?
    options:
      - text: Without value-function updates, the policy network receives no gradient at all
        why: The policy is still updated every epoch; only the quality of its advantage weights changes.
      - text: The advantage estimates that weight each update are built from $V_\phi$ and become poor
        correct: true
      - text: The environment's rewards are rescaled by the value function, so they stay near zero
        why: Rewards come from the environment unchanged; the value function only serves as a baseline for estimating advantages.
      - text: TRPO's trust region shrinks to zero when the value function is not trained
        why: The KL trust region constrains policy updates only; it does not depend on how much the value function is trained.
    explanation: |
      Policy-gradient methods such as TRPO weight each $\nabla\log\pi_\theta(a_t\mid s_t)$ by an
      advantage estimate, here computed with GAE from the learned $V_\phi$ [^1][^2]. A good $V_\phi$ is a
      baseline that reduces variance; an untrained one makes the advantage estimates noisy and biased
      (GAE also bootstraps from $V_\phi$), so the updates barely improve the policy [^2]. The exercise's reference results show exactly this: fast
      progress with a fitted value function, stagnation without one [^3].
    references:
      - source: spinning-up
        locator: 'Part 3: Intro to Policy Optimization, Baselines in Policy Gradients and Other Forms of the Policy Gradient'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#baselines-in-policy-gradients
      - title: Schulman et al. (2016), High-Dimensional Continuous Control Using Generalized Advantage Estimation, arXiv:1506.02438
        url: https://arxiv.org/abs/1506.02438
        locator: Sec. 3 Advantage Function Estimation
      - source: spinning-up
        locator: Solution to Exercise 2.1 (value function fitting in TRPO)
        url: https://spinningup.openai.com/en/latest/spinningup/exercise2_1_soln.html
    source:
      id: spinning-up
      ref: docs/spinningup/exercises.rst#q4
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/exercises.rst
    status: draft
  - id: policy-gradient-015
    type: short_answer
    difficulty: easy
    tags:
      - reward-to-go
      - policy-gradient-weights
    question: |
      An episode has rewards $r_0, r_1, r_2, r_3 = 1, 0, 2, 3$ (undiscounted). The simplest policy
      gradient weights every $\nabla\log\pi(a_t\mid s_t)$ by the total return $R(\tau) = 6$. With the
      reward-to-go form instead, what weight does the action taken at $t = 1$ get?
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: $\hat R_1 = r_1 + r_2 + r_3 = 0 + 2 + 3 = 5$
    explanation: |
      The reward-to-go $\hat R_t = \sum_{t' \ge t} r_{t'}$ only counts rewards obtained *after* the
      action, because earlier rewards cannot have been caused by it [^1]. For $t = 1$ that is
      $0 + 2 + 3 = 5$; the weights of the four actions are $6, 5, 5, 3$ instead of $6, 6, 6, 6$ [^1].
    references:
      - source: spinning-up
        locator: "Part 3: Intro to Policy Optimization, Don't Let the Past Distract You"
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#don-t-let-the-past-distract-you
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q1
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-016
    type: single
    difficulty: medium
    tags:
      - reward-to-go
      - variance-reduction
    question: |
      Replacing $R(\tau)$ by the reward-to-go $\hat R_t$ in the policy-gradient estimator improves
      learning. What exactly changes?
    options:
      - text: The estimator becomes biased, but the bias is small enough to be worth it
        why: Dropping terms whose expectation is zero keeps the estimator unbiased [^1][^2].
      - text: The expected gradient changes so that it points more directly to the optimum
        why: Both forms have the same expectation; the dropped terms have mean zero [^1].
      - text: It removes the need to sample trajectories from the current policy
        why: Reward-to-go is still an on-policy estimator built from trajectories of the current policy [^1].
      - text: The expected gradient stays the same, but its sample estimate has lower variance
        correct: true
    explanation: |
      The terms that reinforce an action in proportion to rewards obtained *before* it have zero mean
      but nonzero variance; they only add noise [^1]. Removing them leaves the expected policy gradient
      unchanged, a consequence of the expected grad-log-prob lemma, while fewer sample trajectories are
      needed for a good estimate [^1][^2].
    references:
      - source: spinning-up
        locator: "Part 3: Intro to Policy Optimization, Don't Let the Past Distract You (You Should Know: But how is this better?)"
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#don-t-let-the-past-distract-you
      - source: spinning-up
        locator: Extra Material, Proof for Don't Let the Past Distract You
        url: https://spinningup.openai.com/en/latest/spinningup/extra_pg_proof1.html
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q2
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-017
    type: multiple
    difficulty: hard
    tags:
      - baselines
      - advantage
      - eglp-lemma
    question: |
      The policy gradient can be written
      $\nabla_\theta J = \mathbb{E}\big[\sum_t \nabla_\theta\log\pi_\theta(a_t\mid s_t)\,\Phi_t\big]$.
      Which choices of the weight $\Phi_t$ give the **same** expected gradient? Select all that apply.
    options:
      - text: The reward-to-go minus an arbitrary function of the action taken, $\hat R_t - b(a_t)$
        why: The zero-mean argument needs a baseline that does not depend on the action; $\mathbb{E}_{a}[\nabla\log\pi(a\mid s)\,b(a)]$ is generally not zero, so this biases the gradient [^1].
      - text: The advantage $A^{\pi}(s_t, a_t) = Q^{\pi}(s_t, a_t) - V^{\pi}(s_t)$
        correct: true
      - text: The reward obtained just before the action, $r_{t-1}$
        why: Rewards obtained before $a_t$ contribute zero in expectation, so this weight drops the actual signal and gives a different (zero) expected gradient [^1].
      - text: The reward-to-go minus a baseline that depends only on the state, $\hat R_t - b(s_t)$
        correct: true
      - text: The total return $R(\tau)$ of the episode
        correct: true
    explanation: |
      By the expected grad-log-prob lemma, $\mathbb{E}_{a\sim\pi}[\nabla\log\pi(a\mid s)\,b(s)] = 0$
      for any $b$ that depends only on the state, so state baselines can be added or subtracted freely
      [^1]. All of $R(\tau)$, $\hat R_t$, $\hat R_t - b(s_t)$, $Q^{\pi}(s_t,a_t)$ and $A^{\pi}(s_t,a_t)$ give
      the same expectation with different variances [^1][^2]. A weight that depends on the action through
      something other than its consequences, or that only looks at the past, changes the expectation.
    references:
      - source: spinning-up
        locator: 'Part 3: Intro to Policy Optimization, Expected Grad-Log-Prob Lemma; Baselines in Policy Gradients; Other Forms of the Policy Gradient'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#other-forms-of-the-policy-gradient
      - title: Schulman et al. (2016), High-Dimensional Continuous Control Using Generalized Advantage Estimation, arXiv:1506.02438
        url: https://arxiv.org/abs/1506.02438
        locator: Sec. 2 Preliminaries (list of valid $\Psi_t$)
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q3
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-018
    type: true_false
    difficulty: medium
    tags:
      - policy-gradient-loss
      - surrogate-objective
    question: |
      In a vanilla policy-gradient implementation the "loss" is `-(logp * weights).mean()` over a batch
      of data from the current policy. If this loss keeps decreasing during training, the policy's
      expected return must be improving.
    options:
      - text: 'True'
        why: The loss only has the right *gradient* at the current parameters on fresh data; its value does not track performance [^1].
      - text: 'False'
        correct: true
    explanation: |
      This "loss" is not a performance measure: its gradient equals the negative policy gradient only
      when evaluated at the current parameters, with data generated by those parameters [^1]. Its value
      can fall — even towards $-\infty$ when optimized hard on one batch — while the return gets worse.
      In policy-gradient methods you should monitor the average return, not this loss [^1].
    references:
      - source: spinning-up
        locator: 'Part 3: Intro to Policy Optimization, Implementing the Simplest Policy Gradient (You Should Know: the loss function means nothing)'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#implementing-the-simplest-policy-gradient
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q4
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-019
    type: single
    difficulty: medium
    tags:
      - log-prob
      - gaussian-policy
      - tensor-shapes
    question: |
      A diagonal Gaussian policy for a 6-dimensional action space computes
      `logp = Normal(mu, std).log_prob(act)` for a batch of 64 actions, where `mu`, `std` and `act`
      all have shape `(64, 6)`. What do you need for the policy-gradient loss?
    options:
      - text: '`logp` has shape `(64, 6)`; sum over the last dimension to get one log-probability per action, shape `(64,)`'
        correct: true
      - text: '`logp` already has shape `(64,)`, one value per action'
        why: '`Normal.log_prob` returns one value per component, so the result keeps the shape `(64, 6)` [^1].'
      - text: '`logp` has shape `(64, 6)`; average over the last dimension to get one value per action'
        why: The log-density of a product of independent components is the *sum* of their log-densities, not the mean [^1].
      - text: '`logp` has shape `(64, 6)`; take the maximum over the last dimension'
        why: All components belong to the same action, so all their log-probabilities add up; the maximum is meaningless here.
    explanation: |
      PyTorch's `Normal` treats each component separately, so `log_prob` returns a tensor of shape
      `(batch, act_dim)` [^1]. A diagonal Gaussian's log-likelihood is the sum over action dimensions, so
      you use `log_prob(act).sum(axis=-1)` to get shape `(64,)` for the RL loss [^1][^2].
    references:
      - source: spinning-up
        locator: 'Part 3: Intro to Policy Optimization, Implementing the Simplest Policy Gradient (You Should Know: log_prob of a Normal distribution)'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#implementing-the-simplest-policy-gradient
      - source: spinning-up
        locator: 'Part 1: Key Concepts in RL, Stochastic Policies — Diagonal Gaussian Policies (Log-Likelihood)'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#stochastic-policies
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q5
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-020
    type: single
    difficulty: medium
    tags:
      - log-derivative-trick
      - model-free
      - trajectory-probability
    question: |
      The gradient of the log-probability of a trajectory $\tau = (s_0, a_0, \dots, s_{T+1})$ under policy
      $\pi_\theta$ is used to derive the policy gradient. Why can the policy gradient be estimated without
      a model of the environment's dynamics?
    options:
      - text: The log-derivative trick converts the transition probabilities into rewards along the way
        why: The trick rewrites $\nabla P$ as $P\,\nabla\log P$; it does not convert probabilities into rewards [^1].
      - text: The derivation assumes deterministic transitions, so all their probabilities are equal to 1
        why: The derivation allows stochastic transitions; their terms vanish because they do not depend on $\theta$, not because they equal 1.
      - text: Only the policy's log-probabilities depend on $\theta$; the environment terms have zero gradient
        correct: true
      - text: The transition probabilities are learned together with the policy and then cancel
        why: Nothing is learned about the transitions; their log-probabilities simply have zero gradient with respect to $\theta$ [^1].
    explanation: |
      $\log P(\tau\mid\theta) = \log\rho_0(s_0) + \sum_t[\log P(s_{t+1}\mid s_t,a_t) + \log\pi_\theta(a_t\mid s_t)]$,
      and the environment terms do not depend on $\theta$, so their gradients are zero [^1]. That leaves
      $\sum_t\nabla_\theta\log\pi_\theta(a_t\mid s_t)$, which we can compute from the policy alone, and the
      expectation over trajectories is estimated by simply running the policy [^1].
    references:
      - source: spinning-up
        locator: 'Part 3: Intro to Policy Optimization, Deriving the Simplest Policy Gradient (facts 3–5)'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html#deriving-the-simplest-policy-gradient
    source:
      id: spinning-up
      ref: docs/spinningup/rl_intro3.rst#q6
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/rl_intro3.rst
    status: draft
  - id: policy-gradient-021
    type: single
    difficulty: medium
    tags:
      - reinforce
      - log-derivative-trick
      - score-function
    question: |
      REINFORCE uses the log-derivative trick
      $\nabla_\theta \mathbb{E}_{y \sim \pi_\theta}[R(y)] = \mathbb{E}_{y \sim \pi_\theta}[R(y)\,\nabla_\theta \log \pi_\theta(y)]$.
      Why is this useful when fine-tuning a language model with a reward?
    options:
      - text: The gradient can be estimated from sampled outputs without differentiating the reward
        correct: true
      - text: It removes the need to sample any outputs from the model while the policy is being trained
        why: The right-hand side is an expectation under $\pi_\theta$, estimated precisely by sampling outputs [^2].
      - text: It makes the gradient estimate exact, with zero variance
        why: REINFORCE estimates are notoriously noisy; baselines are used to reduce their variance [^2].
      - text: It enlarges the vocabulary that the model can sample tokens from
        why: The trick rewrites a gradient; it has nothing to do with the vocabulary.
    explanation: |
      The expected reward depends on $\theta$ only through the sampling distribution, and the reward
      itself (a human rating or a reward model's score of a discrete text) is not differentiable [^1].
      Using $\nabla_\theta \pi_\theta = \pi_\theta \nabla_\theta \log \pi_\theta$ turns the gradient
      into an expectation that can be estimated by sampling $y$, scoring it, and weighting
      $\nabla_\theta \log \pi_\theta(y)$ by the reward [^2]. Subtracting a baseline from $R$ keeps the
      estimate unbiased while lowering its variance [^2].
    references:
      - source: nptel-intro-llms
        locator: Assignment 8, Q9 (advantage of the log-derivative trick in REINFORCE)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
      - title: 'Wikipedia: Policy gradient method'
        url: https://en.wikipedia.org/wiki/Policy_gradient_method#REINFORCE
        locator: REINFORCE — Policy gradient; Variance reduction — REINFORCE with baseline
    source:
      id: nptel-intro-llms
      ref: intro-llms/assignment8#q9
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106102576/noc25_cs45_assignment_Week_8.png
    status: draft
