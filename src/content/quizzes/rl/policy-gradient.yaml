  - id: policy-gradient-008
    type: short_answer
    question: How would you describe, with your own words, the Actor-Critic Method (A2C)?
    answer:
      model: |
        The idea behind Actor-Critic is that we learn two function approximations:
        1. A `policy` that controls how our agent acts (π)
        2. A `value` function to assist the policy update by measuring how good the action taken is (q)
    references:
      - source: hf-deep-rl-course
        locator: Unit 6. Actor Critic methods with Robotics environments
        url: https://huggingface.co/learn/deep-rl-course/unit6/introduction
    source:
