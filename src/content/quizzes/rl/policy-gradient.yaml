  - id: policy-gradient-005
    type: single
    question: Which of the following interpretations of bias-variance tradeoff is the most accurate in the field of Reinforcement Learning?
    options:
      - text: The bias-variance tradeoff reflects how my model is able to generalize the knowledge to previously tagged data we give to the model during training time.
        why: This is the traditional bias-variance tradeoff in Machine Learning. In our specific case of Reinforcement Learning, we don't have previously tagged data, but only a reward signal.
      - text: The bias-variance tradeoff reflects how well the reinforcement signal reflects the true reward the agent should get from the enviromment
        correct: true
    references:
