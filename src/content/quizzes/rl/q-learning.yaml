  - id: q-learning-019
    type: short_answer
    difficulty: medium
    question: |
      How do we update the Q-value of a state–action pair? The figure below shows the Q-learning
      update with five numbered parts. Complete their definitions. Part 1 is the new Q-value
      estimate, and part 2 (both occurrences) is the former Q-value estimate. Part 3, $\alpha$, is
      the {{1}}. Part 4, $R_{t+1}$, is the immediate {{2}}. Part 5, $\gamma \max_a Q(S_{t+1}, a)$, is
      the discounted estimate of the {{3}} Q-value of the next state. Parts 4 and 5 form the TD
      target, and the whole bracket, target minus former estimate, is the TD {{4}}.
    figure:
      src: ./q-learning/q-learning-019.svg
      alt: 'The Q-learning update Q(S_t, A_t) ← Q(S_t, A_t) + α[R_{t+1} + γ max_a Q(S_{t+1}, a) − Q(S_t, A_t)] with numbered parts: 1 is the Q(S_t, A_t) on the left, 2 is Q(S_t, A_t) on the right (both occurrences), 3 is α, 4 is R_{t+1} and 5 is γ max_a Q(S_{t+1}, a).'
    answer:
      blanks:
        - accept:
            - learning rate
            - step size
            - step-size parameter
            - lr
          hint: two words
        - accept:
            - reward
            - rewards
          hint: one word
        - accept:
            - optimal
            - best
            - maximum
            - max
            - highest
            - largest
            - greatest
          hint: one word
        - accept:
            - error
          hint: one word
    explanation: |
      To update $Q(S_t, A_t)$ the agent needs $S_t$, $A_t$, $R_{t+1}$ and $S_{t+1}$: the reward and
      the next state form the TD target, and the old estimate moves a fraction $\alpha$ toward it
      [^1]. The next state's value is taken greedily with $\max_a$ even though the agent acts
      $\epsilon$-greedily, which is what makes Q-learning off-policy [^1]. With this target the
      learned $Q$ approximates the optimal action-value function $q_*$ directly, whatever policy
      generates the experience [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#step4
        locator: 'Unit 2, "Introducing Q-Learning", section "Step 4: Update Q(St, At)" (labelled update figure)'
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, Eq. (6.8), p. 131'
