  - id: q-learning-016
    type: short_answer
    difficulty: easy
    question: |
      The figure below shows the Bellman equation with four numbered parts. Complete their
      definitions. Part 1, $V_\pi(s)$, is the {{1}} of state $s$. Part 2, $\mathbb{E}_\pi[R_{t+1}$,
      is the expected immediate {{2}}, where the subscript $\pi$ means the agent uses its {{3}} to
      choose actions at every time step. Part 3, $\gamma V_\pi(S_{t+1})$, adds the {{4}} value of the
      next state. Part 4, $S_t = s$, says the agent starts in state $s$.
    figure:
