  - id: q-learning-031
    type: short_answer
    difficulty: medium
    tags:
      - td3
      - clipped-double-q
      - bellman-target
    question: |
      TD3 learns two critics and forms one target from their target networks,
      $y = r + \gamma(1-d)\min_{i=1,2} Q_{\phi_{i,\text{targ}}}(s', a'(s'))$. For a transition with
      $r = 1$, $\gamma = 0.99$, $d = 0$ (not terminal), and target critics giving $10$ and $8$ at
      $(s', a'(s'))$, what is $y$?
    answer:
      numeric: 8.92
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $1 + 0.99 \cdot \min(10, 8) = 1 + 7.92 = 8.92$
    explanation: |
      TD3's clipped double-Q learning uses the *smaller* of the two target critics in the Bellman
      target, $1 + 0.99 \cdot 8 = 8.92$, and both critics regress towards this same target [^1]. Taking
      the minimum counters the overestimation bias that a single learned Q-function develops when the
      policy exploits its errors [^1][^2]. With $d = 1$ the bootstrap term would vanish and $y = r = 1$.
    references:
      - source: spinning-up
        locator: 'Algorithms: Twin Delayed DDPG, Key Equations (clipped double-Q learning)'
        url: https://spinningup.openai.com/en/latest/algorithms/td3.html#key-equations
      - title: Fujimoto, van Hoof & Meger (2018), Addressing Function Approximation Error in Actor-Critic Methods, arXiv:1802.09477
        url: https://arxiv.org/abs/1802.09477
        locator: Sec. 4.2 Clipped Double Q-Learning for Actor-Critic
    source:
      id: spinning-up
      ref: docs/spinningup/exercises.rst#q3
      url: https://github.com/openai/spinningup/blob/038665d62d569055401d91856abb287263096178/docs/spinningup/exercises.rst
    status: reviewed
    reviewed_by: claude
