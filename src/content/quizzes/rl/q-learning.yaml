        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, pp. 131–132'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#the-q-table-structure
