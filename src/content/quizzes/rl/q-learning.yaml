  - id: q-learning-022
    type: single
    difficulty: easy
    question: When the number of possible states is not known in advance, a Q-table can be stored as a Python dictionary instead of a fixed-size array. What are its keys and values?
    options:
      - text: 'Key: a (state, action) pair; value: the Q-value estimated for that pair'
        correct: true
      - text: 'Key: a state; value: the single action the agent should take in that state'
        why: A map from states to actions is a policy, which the agent derives from the Q-values; the Q-table stores a value for every state–action pair [^1].
      - text: 'Key: a Q-value; value: the action that produced it'
        why: Many pairs can share the same Q-value, and the update has to look up and change the value of a given (state, action) pair [^2][^3].
    explanation: |
      A Q-table records how good each action is in each state, one value per state–action pair [^1],
      and the Q-learning update changes the value of one such pair at a time [^2]. In the ML-For-Beginners CartPole lesson the discretized states have no guaranteed bounds, so the table becomes a dictionary keyed
      by the pair (state, action), with the Q-value as the value and 0 as the default for pairs not
      seen yet [^3]. A map from each state to an action is a policy, which the agent derives from the
      Q-values, not the Q-table itself [^1]. Q-values make no sense as keys, since many pairs can
      share the same value.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
