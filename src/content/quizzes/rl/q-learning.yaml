  - id: q-learning-025
    type: short_answer
    difficulty: medium
    tags:
      - value-iteration
      - contraction
      - discount-factor
      - convergence
    question: |
      For $\gamma < 1$, each sweep of value iteration shrinks the largest error
      $\max_s |V_k(s) - V^*(s)|$ by at least a factor γ. If the initial error is 1 and $\gamma = 0.9$,
      how many sweeps guarantee an error of at most 0.01?
    answer:
      numeric: 44
      tolerance: 0
      hint: a whole number
      model: $0.9^k \le 0.01 \Rightarrow k \ge \ln 0.01/\ln 0.9 \approx 43.7$, so 44 sweeps
    explanation: |
      The guarantee needs $\gamma^k \le 0.01$, i.e. $k \ge \ln 0.01/\ln 0.9 \approx 43.7$, so 44 sweeps
      ($0.9^{44} \approx 0.0097$, while $0.9^{43} \approx 0.0108$). With $\gamma = 0.5$, 7 sweeps
      suffice. The number of sweeps grows roughly like $\ln(1/\varepsilon)/(1 - \gamma)$ as γ
      approaches 1, and at $\gamma = 1$ the update is no longer a contraction, so convergence is no
      longer guaranteed [^1]. d2l states that value iteration converges to $V^*$ from any
      initialization for the discounted problem [^2].
    references:
      - title: 'Wikipedia: Markov decision process'
        url: https://en.wikipedia.org/wiki/Markov_decision_process#Value_iteration
        locator: Algorithms, Value iteration (convergence for γ < 1 by the Banach fixed-point theorem)
      - source: d2l
        locator: Sec. 17.2.6 Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#id2
      - source: d2l
        locator: Sec. 17.2.10 Exercises, Exercise 4
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/value-iter#ex4
      url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: q-learning-026
    type: single
    difficulty: medium
    tags:
      - q-learning
      - discount-factor
      - frozenlake
    question: |
      Tabular Q-learning runs on the $4 \times 4$ FrozenLake map below (S start, F frozen, H hole,
      G goal; deterministic moves; reward 1 only on the move into G; holes and G end the episode), with
      target $y = r + \gamma\max_{a'} Q(s', a')$ and $\gamma = 0$.

      ```
      S F F F
      F H F H
      F F F H
      H F F G
      ```

      Which states can ever end up with $\max_a Q(s, a) > 0$?
    options:
      - text: Only the state directly left of G, whose move into G earns the reward
        correct: true
      - text: Every state on a shortest path from S to G
        why: With $\gamma = 0$ the target is just $r$, so no value propagates back from the goal [^1].
      - text: Every state from which G can be reached, all with value close to 1
        why: That needs $\gamma = 1$, where a reward many steps ahead counts in full.
      - text: No state at all, because the reward only comes when the episode ends
        why: The move that ends the episode at G is itself rewarded, and its Q-value is updated toward 1 [^1].
    explanation: |
      With $\gamma = 0$ the update target is the immediate reward [^1]. G's neighbors are the hole above
      it and the frozen cell to its left, and holes end the episode, so only the left neighbor has a
      move with reward 1; its Q-value approaches 1 while all others stay 0. The greedy policy everywhere
      else is a tie-break, so it cannot lead the agent from S to G; with $\gamma = 0.95$, as in d2l,
      the value propagates back along the path [^2].
    references:
      - source: d2l
        locator: Sec. 17.3.1 The Q-Learning Algorithm
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#the-q-learning-algorithm
      - source: d2l
        locator: Sec. 17.3.5 Implementation of Q-Learning
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#implementation-of-q-learning
      - source: d2l
        locator: Sec. 17.3.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/qlearning#ex2
      url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: q-learning-027
    type: multiple
    difficulty: medium
    tags:
      - q-learning
      - epsilon-greedy
      - exploration
      - off-policy
    question: |
      Tabular Q-learning explores with an ε-greedy policy; all Q-values start at 0, and `argmax` breaks
      ties by taking the first action. Select all statements that are true.
    options:
      - text: With ε = 0, the agent keeps taking the tie-break action and, on a sparse-reward map, may never reach the goal or learn anything
        correct: true
      - text: With ε = 1, the agent acts at random, yet the learned Q can still approach $Q^*$, since the target uses $\max_{a'} Q(s', a')$
        correct: true
      - text: With ε = 1, the greedy policy read off the learned Q-table is just as random as the behavior
        why: How the agent acts and what it learns are separate; the Q-table can still encode the optimal policy [^1].
      - text: A larger ε always earns a higher return during training, because the agent explores more
        why: Exploring means often not taking the best known action, which costs return during training.
      - text: ε matters only in the first episode; afterwards the agent acts greedily whatever its value
        why: In the standard algorithm, and in d2l's code, ε applies to every action of every episode [^2].
    explanation: |
      If the exploration policy never reaches parts of the state–action space, the Q estimates are poor
      everywhere [^1]. With ε = 0 and all-zero Q-values the agent keeps choosing the first action, and
      as long as it collects no reward nothing changes. A uniformly random policy visits all states,
      only slowly [^1], and since Q-learning's target uses the maximum over next actions rather than the
      action actually taken, the values it learns can still converge to $Q^*$ even from a random
      policy [^1][^2].
    references:
      - source: d2l
        locator: Sec. 17.3.3 Exploration in Q-Learning; 17.3.4 The "Self-correcting" Property of Q-Learning
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#exploration-in-q-learning
      - source: d2l
        locator: Sec. 17.3.5 Implementation of Q-Learning
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#implementation-of-q-learning
      - source: d2l
        locator: Sec. 17.3.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/qlearning#ex3
      url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: q-learning-028
    type: short_answer
    difficulty: medium
    tags:
      - optimistic-initialization
      - td-error
      - exploration
    question: |
      A Q-learning agent with $\gamma = 0.99$ initializes every $Q(s, a)$ optimistically to $1/(1 - \gamma) = 100$, the largest
      possible return when rewards lie in $[0, 1]$. It takes action $a$ in state $s$, receives reward 0 and lands in $s'$,
      whose Q-values are all still 100. With learning rate $\alpha = 0.1$, what is $Q(s, a)$ after the update?
    answer:
      numeric: 99.9
      tolerance: 0.001
      hint: a number, 1 decimal
      model: TD error $0 + 0.99 \cdot 100 - 100 = -1$; $100 + 0.1 \cdot (-1) = 99.9$
    explanation: |
      Q-learning moves $Q(s, a)$ toward the TD target $r + \gamma\max_{a'} Q(s', a')$ by $\alpha$ times the TD error [^1][^2]. Here
      the target is $0 + 0.99 \cdot 100 = 99$, the error is $-1$ and the new value is $99.9$. The agent is slightly
      "disappointed", so a greedy agent next prefers the untried actions that still hold 100: optimistic initialization
      drives exploration even without $\epsilon$-greedy [^1][^2]. With all values initialized to 0, a greedy agent sees every
      action as equally good and can get stuck repeating one [^1].
    references:
      - source: neuromatch-dl
        locator: W3D4 Tutorial 2, Section 1 Q-learning (the Q-learning update rule in code, Coding Exercise 1)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D4_BasicReinforcementLearning/instructor/W3D4_Tutorial2.ipynb
      - title: 'Sutton and Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Sec. 2.6 Optimistic Initial Values and Sec. 6.5 Q-learning
    source:
      id: neuromatch-dl
      ref: W3D4_BasicReinforcementLearning/W3D4_Tutorial2#ex1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D4_BasicReinforcementLearning/instructor/W3D4_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: q-learning-029
    type: single
    difficulty: medium
    tags:
      - sarsa
      - on-policy
      - off-policy
      - cliff-walking
    question: |
      In the Cliff World grid (start and goal at the two ends of the bottom row, the cells between them a cliff with
      reward −100, every other move −1), Q-learning and SARSA are both trained with ε-greedy exploration. Q-learning's
      greedy policy walks right along the cliff edge, while SARSA's goes one row higher. Why?
    options:
      - text: SARSA values its own exploring policy, which sometimes slips off the edge; Q-learning values greedy play
        correct: true
      - text: SARSA uses a larger discount factor, so it places more value on the safer path
        why: 'Both use the same $\gamma$; the difference is the TD target: the action actually taken (SARSA) versus the best action (Q-learning).'
      - text: Q-learning explores more, so it was the only one of the two to discover the shorter path
        why: Both use the same ε-greedy exploration; Q-learning prefers the edge because its target assumes greedy play afterwards.
      - text: SARSA cannot represent the path along the cliff edge in its tabular Q-function
        why: Both use the same tabular Q; SARSA's values next to the edge are lowered by exploratory falls, so it avoids that path.
    explanation: |
      Q-learning's target uses $\max_a Q(s', a)$, the value of acting greedily afterwards, so it learns the
      optimal path right along the edge even though exploration occasionally drops it into the cliff [^1][^2]. On
      Neuromatch's $4 \times 10$ grid that path is 1 up, 9 right and 1 down, a return of −11 [^1]. SARSA's target uses the
      next action its ε-greedy policy actually takes, so the risk of a random step into the cliff lowers the values next
      to the edge, and it learns a path one row higher that costs 2 more steps [^1][^2]. This is the on-policy versus
      off-policy distinction [^1].
    references:
      - source: neuromatch-cn
        locator: W3D4 Tutorial 3, Section 2 Q-Learning and Bonus Sections 1–2 (SARSA, On-Policy vs Off-Policy)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D4_ReinforcementLearning/instructor/W3D4_Tutorial3.ipynb
      - title: 'Sutton and Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Sec. 6.5 Q-learning, Example 6.6 Cliff Walking
    source:
      id: neuromatch-cn
      ref: W3D4_ReinforcementLearning/W3D4_Tutorial3#bonus2
      url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D4_ReinforcementLearning/instructor/W3D4_Tutorial3.ipynb
    status: reviewed
    reviewed_by: claude
  - id: q-learning-030
    type: multiple
    difficulty: medium
    tags:
      - dyna-q
      - model-based-rl
      - planning
    question: |
      Dyna-Q adds planning to Q-learning: after each real step it updates $Q$ from the real transition, stores the observed
      reward and next state in a table $\text{Model}(s, a)$, and then performs $k$ extra Q-learning updates on transitions
      replayed from that table. Which statements are true? Select all that apply.
    options:
      - text: With $k = 0$ it reduces to ordinary Q-learning
        correct: true
      - text: Storing one outcome per state–action pair is a valid model only if the environment is deterministic
        correct: true
      - text: A change in the world (e.g. a new shortcut) that is experienced once can spread through the Q-table during planning
        correct: true
      - text: More planning steps always help, so $k$ should be as large as compute allows
        why: "Neuromatch's tutorial finds diminishing returns: beyond some $k$ the extra planning adds little relative to its cost [^1]."
      - text: Planning updates use a different learning rule from the one used for real experience
        why: Simulated transitions are learned with the same Q-learning update as real ones.
    explanation: |
      Dyna-Q combines acting, learning and planning: one Q-learning update from the real transition and $k$ more from
      transitions sampled from the stored model; with $k = 0$ there is no planning and it is just Q-learning [^1][^2]. The
      model simply caches the last reward and next state seen for each pair, which is correct only when each state–action
      pair always leads to the same outcome [^1]. Because planning replays stored transitions, a change seen once is
      propagated without being experienced again, which is why Dyna-Q exploits a new shortcut much faster than Q-learning;
      beyond some $k$ the gains level off [^1].
    references:
      - source: neuromatch-cn
        locator: W3D4 Tutorial 4, Sections 2–4 (Dyna-Q, How much to plan?, When the world changes...)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D4_ReinforcementLearning/instructor/W3D4_Tutorial4.ipynb
      - title: 'Sutton and Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: 'Sec. 8.2 Dyna: Integrated Planning, Acting, and Learning'
    source:
      id: neuromatch-cn
      ref: W3D4_ReinforcementLearning/W3D4_Tutorial4#sec2
      url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D4_ReinforcementLearning/instructor/W3D4_Tutorial4.ipynb
