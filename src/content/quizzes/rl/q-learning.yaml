  - id: q-learning-003
    type: multiple
    question: What are the two main approaches to find optimal policy?
    options:
      - text: Policy-based methods
        correct: true
      - text: Random-based methods
      - text: Value-based methods
        correct: true
      - text: Evolution-strategies methods
    explanation: With Policy-Based methods, we train the policy directly to learn which action to take given a state. With value-based methods, we train a value function to learn which state is more valuable and use this value function to take the action that leads to it. [^1]
    references:
      - source: hf-deep-rl-course
        locator: Unit 2. Introduction to Q-Learning
        url: https://huggingface.co/learn/deep-rl-course/unit2/introduction
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: draft
  - id: q-learning-004
    type: short_answer
    difficulty: medium
    question: What is the Bellman Equation?
    answer:
      model: |
        **The Bellman equation is a recursive equation** that works like this: instead of starting for each state from the beginning and calculating the return, we can consider the value of any state as:

        Rt+1 + gamma * V(St+1)

        The immediate reward + the discounted value of the state that follows
    explanation: |
      The full equation is an expectation over the policy and the environment's dynamics:
      $v_\pi(s) = \sum_a \pi(a \mid s) \sum_{s', r} p(s', r \mid s, a)\,[r + \gamma v_\pi(s')]$.
      The model answer gives the intuition behind it: reward along the way plus the discounted
      value of where you land [^1]. Its practical value is that you no longer need to add up an
      entire future return for every state, and TD learning and Q-learning use this one-step form
      directly as their update target [^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, Eq. (3.14), p. 59
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/bellman-equation
        locator: 'Unit 2, "The Bellman Equation: simplify our value estimation"'
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: draft
  - id: q-learning-005
    type: multiple
    difficulty: easy
    question: What is the difference between Monte Carlo and Temporal Difference learning methods?
    options:
      - text: With Monte Carlo methods, we update the value function from a complete episode
        correct: true
      - text: With Monte Carlo methods, we update the value function from a step
      - text: With TD learning methods, we update the value function from a complete episode
      - text: With TD learning methods, we update the value function from a step
        correct: true
    explanation: |
      Monte Carlo waits until the episode ends, computes the actual return $G_t$ and uses it as
      the target: $V(S_t) \leftarrow V(S_t) + \alpha[G_t - V(S_t)]$ [^1][^2]. TD(0) updates after a
      single step. Its target $R_{t+1} + \gamma V(S_{t+1})$ uses the current estimate of the next
      state's value, which is called bootstrapping [^1][^2]. The two other options swap the
      methods.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td
        locator: Unit 2, "Monte Carlo vs Temporal Difference Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 6.1 TD Prediction, Eqs. (6.1)–(6.2), pp. 119–120
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: draft
  - id: q-learning-006
    type: single
    difficulty: easy
    question: What is Q-Learning?
    options:
      - text: The algorithm we use to train our Q-function
        correct: true
      - text: A value function
        why: It's an action-value function since it determines the value of being at a particular state and taking a specific action at that state
      - text: An algorithm that determines the value of being at a particular state and taking a specific action at that state
        why: Q-function is the function that determines the value of being at a particular state and taking a specific action at that state.
      - text: A table
        why: Q-learning is not a Q-table. The Q-function is the algorithm that will feed the Q-table.
    explanation: |
      Q-learning is an off-policy, value-based TD algorithm. Its job is to train the Q-function,
      the action-value function [^1]. Its update moves $Q$ towards the optimal action-value
      function $q_*$ [^2]. The other options describe what it produces, not what it is. The
      Q-function is the action-value function that gives the value of a state–action pair. The
      Q-table is the data structure that stores those values in the tabular case [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, Eq. (6.8), p. 131'
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q1
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-007
    type: single
    difficulty: easy
    question: What is a Q-table?
    options:
      - text: An algorithm we use in Q-Learning
      - text: Q-table is the internal memory of our agent
        correct: true
      - text: In Q-table each cell corresponds a state value
        why: Each cell corresponds to a state-action value pair value. Not a state value.
    explanation: |
      The Q-table is where the Q-function keeps its values, its memory or "cheat sheet". There is
      one cell per state–action pair, and a lookup returns the value of taking that action in
      that state [^1]. Storing one entry per state or state–action pair in an array is what
      makes a method tabular [^2]. It is not an algorithm: Q-learning is the algorithm that fills
      the table [^1]. And its cells hold state–action values, not plain state values [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-008
    type: short_answer
    difficulty: medium
    question: Why if we have an optimal Q-function Q* we have an optimal policy?
    answer:
      model: Because if we have an optimal Q-function, we have an optimal policy since we know for each state what is the best action to take.
    explanation: |
      The optimal policy just picks $a^*(s) = \arg\max_a Q^*(s,a)$ in every state [^1]. This
      works because $Q^*$ already contains the long-term consequences of each action, like a
      cache of every one-step lookahead, so choosing optimally needs no model of the
      environment's dynamics; knowing only $V^*$ would not be enough [^2]. That is also why
      value-based methods can use a simple greedy rule on top of the learned values instead of
      a trained policy [^3].
    references:
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#the-optimal-q-function-and-the-optimal-action
        locator: Section "The Optimal Q-Function and the Optimal Action"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.6 Optimal Policies and Optimal Value Functions, p. 65
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods" (link between value function and policy)
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q3
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-009
    type: short_answer
    difficulty: easy
    question: Can you explain what is Epsilon-Greedy Strategy?
    answer:
      model: |
        Epsilon Greedy Strategy is a policy that handles the exploration/exploitation trade-off.

        The idea is that we define epsilon ɛ = 1.0:

        - With *probability 1 — ɛ* : we do exploitation (aka our agent selects the action with the highest state-action pair value).
        - With *probability ɛ* : we do exploration (trying random action).
    explanation: |
      In practice $\epsilon$ starts high, so early training is mostly random exploration. It is
      then lowered step by step as the Q-table's estimates improve and more exploitation pays
      off [^1]. The theoretical appeal is that every action keeps being tried, so in the limit
      all action-value estimates converge to their true values [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#step2
        locator: 'Unit 2, "Introducing Q-Learning", section "Step 2: Choose an action using the epsilon-greedy strategy"'
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 2.2 Action-value Methods, pp. 27–28
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q4
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-010
    type: short_answer
    difficulty: easy
    question: We mentioned Q Learning is a tabular method. What are tabular methods?
    answer:
      model: '*Tabular methods* is a type of problem in which the state and actions spaces are small enough to approximate value functions to be **represented as arrays and tables**. For instance, **Q-Learning is a tabular method** since we use a table to represent the state, and action value pairs.'
    explanation: |
      The catch is scale. Q-learning had worked fine with 16 states (FrozenLake) or 500
      (Taxi-v3), but an Atari frame of $210 \times 160 \times 3$ values in 0–255 gives
      $256^{100800}$ possible observations, far too many for a table [^1]. For spaces that large, the value
      function has to be approximated with a parameterized function that generalizes from states
      seen to states never seen, which is the step from Q-learning to Deep Q-learning [^1][^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/from-q-to-dqn
        locator: Unit 3, "From Q-Learning to Deep Q-Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Part I introduction, p. 23; Part II introduction, p. 195
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
  - id: q-learning-011
    type: single
    difficulty: easy
    question: Why can't we use a classical Q-Learning to solve an Atari Game?
    options:
      - text: Atari environments are too fast for Q-Learning
      - text: Atari environments have a big observation space. So creating an updating the Q-Table would not be efficient
        correct: true
    explanation: |
      Classical Q-learning needs one table entry per state–action pair. An Atari observation is a
      $210 \times 160 \times 3$ image with values from 0 to 255, so there are about
      $256^{100800}$ possible observations. Creating and updating such a Q-table is hopeless [^1].
      Memory is only part of the problem: almost every state would be new, so the agent has to
      generalize from similar states, which needs function approximation [^2]. The course puts
      the problem down to the size of the observation space, not to how fast the game runs [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/from-q-to-dqn
        locator: Unit 3, "From Q-Learning to Deep Q-Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Part II introduction (Approximate Solution Methods), p. 195
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
  - id: q-learning-012
    type: short_answer
    difficulty: medium
    question: Why do we stack four frames together when we use frames as input in Deep Q-Learning?
    answer:
      model: |
        We stack frames together because it helps us **handle the problem of temporal limitation**: one frame is not enough to capture temporal information.
        For instance, in pong, our agent **will be unable to know the ball direction if it gets only one frame**.
    explanation: |
      In RL terms, a single frame is not a Markov state, because it shows where things are but
      not how they are moving [^2]. DQN (Mnih et al.) therefore stacked the four most recent
      preprocessed $84 \times 84$ frames into an $84 \times 84 \times 4$ input [^1]. This did not
      remove partial observability in every game, but it made many of them more Markovian [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play, pp. 438–439
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-network#preprocessing
        locator: Unit 3, "The Deep Q-Network (DQN)", section "Preprocessing the input and temporal limitation"
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
  - id: q-learning-013
    type: multiple
    question: What are the two phases of Deep Q-Learning?
    options:
      - text: Sampling
        correct: true
      - text: Shuffling
      - text: Reranking
      - text: Training
        correct: true
    explanation: We perform actions and store the observed experiences tuples in a replay memory. We select the small batch of tuple randomly and learn from it using a gradient descent update step. [^1]
    references:
      - source: hf-deep-rl-course
        locator: Unit 3. Deep Q-Learning with Atari Games
        url: https://huggingface.co/learn/deep-rl-course/unit3/introduction
    source:
