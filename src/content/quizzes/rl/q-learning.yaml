  - id: q-learning-004
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of the Bellman equation. It is a {{1}} equation: instead of adding
      up the whole return from each state, we write the value of a state as the immediate {{2}} plus
      the {{3}} value of the state that follows.
    answer:
      blanks:
        - accept:
            - recursive
            - recurrence
            - recursion
          hint: one word
        - accept:
            - reward
            - rewards
          hint: one word
        - accept:
            - discounted
          hint: one word
      model: $V(S_t) = R_{t+1} + \gamma V(S_{t+1})$
    explanation: |
      Defining the value of a state through the value of its successor means you no longer have to
      sum a long future return for every state [^2]. In full the equation is an expectation over the
      policy and the dynamics,
      $v_\pi(s) = \sum_a \pi(a \mid s) \sum_{s', r} p(s', r \mid s, a)\,[r + \gamma v_\pi(s')]$:
      the reward expected along the way plus the discounted value of the next state [^1]. TD learning
      uses exactly this one-step form, $R_{t+1} + \gamma V(S_{t+1})$, as its update target [^3].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, Eq. (3.14), p. 59
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/bellman-equation
        locator: 'Unit 2, "The Bellman Equation: simplify our value estimation"'
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td#td-learning
        locator: 'Unit 2, "Monte Carlo vs Temporal Difference Learning", section "Temporal Difference Learning: learning at each step"'
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: draft
  - id: q-learning-005
    type: multiple
    difficulty: easy
    question: What is the difference between Monte Carlo and Temporal Difference learning methods?
    options:
      - text: With Monte Carlo methods, we update the value function from a complete episode
        correct: true
      - text: With Monte Carlo methods, we update the value function from a step
      - text: With TD learning methods, we update the value function from a complete episode
      - text: With TD learning methods, we update the value function from a step
        correct: true
    explanation: |
      Monte Carlo waits until the episode ends, computes the actual return $G_t$ and uses it as
      the target: $V(S_t) \leftarrow V(S_t) + \alpha[G_t - V(S_t)]$ [^1][^2]. TD(0) updates after a
      single step. Its target $R_{t+1} + \gamma V(S_{t+1})$ uses the current estimate of the next
      state's value, which is called bootstrapping [^1][^2]. The two other options swap the
      methods.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td
        locator: Unit 2, "Monte Carlo vs Temporal Difference Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 6.1 TD Prediction, Eqs. (6.1)–(6.2), pp. 119–120
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: draft
  - id: q-learning-006
    type: single
    difficulty: easy
    question: What is Q-Learning?
    options:
      - text: The algorithm we use to train our Q-function
        correct: true
      - text: A value function
        why: It's an action-value function since it determines the value of being at a particular state and taking a specific action at that state
      - text: An algorithm that determines the value of being at a particular state and taking a specific action at that state
        why: Q-function is the function that determines the value of being at a particular state and taking a specific action at that state.
      - text: A table
        why: Q-learning is not a Q-table. The Q-function is the algorithm that will feed the Q-table.
    explanation: |
      Q-learning is an off-policy, value-based TD algorithm. Its job is to train the Q-function,
      the action-value function [^1]. Its update moves $Q$ towards the optimal action-value
      function $q_*$ [^2]. The other options describe what it produces, not what it is. The
      Q-function is the action-value function that gives the value of a state–action pair. The
      Q-table is the data structure that stores those values in the tabular case [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, Eq. (6.8), p. 131'
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q1
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-007
    type: single
    difficulty: easy
    question: What is a Q-table?
    options:
      - text: An algorithm we use in Q-Learning
      - text: Q-table is the internal memory of our agent
        correct: true
      - text: In Q-table each cell corresponds a state value
        why: Each cell corresponds to a state-action value pair value. Not a state value.
    explanation: |
      The Q-table is where the Q-function keeps its values, its memory or "cheat sheet". There is
      one cell per state–action pair, and a lookup returns the value of taking that action in
      that state [^1]. Storing one entry per state or state–action pair in an array is what
      makes a method tabular [^2]. It is not an algorithm: Q-learning is the algorithm that fills
      the table [^1]. And its cells hold state–action values, not plain state values [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-008
    type: short_answer
    difficulty: medium
    question: |
      Why does an optimal Q-function $Q^*$ give us an optimal policy? Complete the reasoning.
      $Q^*$ gives the value of every action in every state, so in each state we know the best action:
      the one with the {{1}} $Q^*$ value. Acting {{2}} with respect to $Q^*$,
      $\pi^*(s) = \arg\max_a Q^*(s,a)$, is therefore an optimal policy.
    answer:
      blanks:
        - accept:
            - highest
            - largest
            - maximum
            - max
            - greatest
            - biggest
            - best
          hint: one word
        - accept:
            - greedily
            - greedy
          hint: one word
    explanation: |
      The optimal policy picks $a^*(s) = \arg\max_a Q^*(s,a)$ in every state [^1]. This works
      because $Q^*$ already includes the long-term consequences of each action, like a cache of
      every one-step lookahead, so choosing optimally needs no model of the environment's dynamics;
      knowing only $V^*$ would not be enough [^2]. That is also why value-based methods can put a
      simple greedy rule on top of the learned values instead of training a policy [^3].
    references:
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#the-optimal-q-function-and-the-optimal-action
        locator: Section "The Optimal Q-Function and the Optimal Action"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.6 Optimal Policies and Optimal Value Functions, p. 65
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods" (link between value function and policy)
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q3
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
  - id: q-learning-009
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of the epsilon-greedy strategy, which handles the
      exploration/exploitation trade-off. With probability $\epsilon$ the agent {{1}}: it tries a
      random action. With probability $1 - \epsilon$ it {{2}}: it takes the action with the highest
      Q-value. $\epsilon$ starts high (e.g. 1.0) and is {{3}} during training as the Q-table
      improves.
    answer:
      blanks:
        - accept:
            - explores
            - explore
            - exploration
            - exploring
          hint: one word
        - accept:
            - exploits
            - exploit
            - exploitation
            - exploiting
          hint: one word
        - accept:
            - decreased
            - reduced
            - decayed
            - lowered
            - annealed
            - decreases
            - decays
          hint: one word
    explanation: |
      Starting with a high $\epsilon$ makes early training mostly random exploration. As the
      Q-table's estimates get better, $\epsilon$ is lowered step by step so the agent exploits more
      [^1]. The theoretical appeal is that every action keeps being tried, so in the limit all
      action-value estimates converge to their true values [^2].
    references:
