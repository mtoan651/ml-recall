  - id: q-learning-020
    type: short_answer
    difficulty: medium
    question: |
      What's the difference between on-policy and off-policy methods? Complete the description. An
      {{1}}-policy method uses one policy for acting and a different one for updating: Q-learning
      acts $\epsilon$-greedily, but its update uses the {{2}} action value $\max_a Q(S_{t+1}, a)$.
      An {{3}}-policy method uses the same policy for both: {{4}} picks $A_{t+1}$
      $\epsilon$-greedily and updates with $\gamma Q(S_{t+1}, A_{t+1})$ for that same action.
    answer:
      blanks:
        - accept:
            - off
            - off-policy
          hint: one word
        - accept:
            - greedy
            - best
            - maximum
            - max
            - highest
          hint: one word
        - accept:
            - on
            - on-policy
          hint: one word
        - accept:
            - Sarsa
            - SARSA
          hint: name of an algorithm
    explanation: |
      The course defines off-policy learning as using different policies for acting (inference) and
      for updating (training), and on-policy learning as using the same policy for both [^1]. In
      Sutton & Barto's terms, an on-policy method evaluates or improves the policy that generates
      the data, while an off-policy method evaluates or improves a different one [^2]. Q-learning's
      greedy max lets it learn about the greedy policy while behaving $\epsilon$-greedily, whereas
      Sarsa's target uses the action its $\epsilon$-greedy policy actually takes next [^1][^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#off-vs-on
        locator: Unit 2, "Introducing Q-Learning", section "Off-policy vs On-policy"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 5.4 Monte Carlo Control without Exploring Starts, p. 100; Secs. 6.4–6.5 Sarsa and Q-learning, pp. 129–131
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q6
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: draft
