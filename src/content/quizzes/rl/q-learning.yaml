topic: q-learning
title: Value-Based Methods
questions:
  - id: q-learning-001
    type: single
    difficulty: easy
    shuffle: false
    question: What is Q-Learning?
    options:
      - text: a mechanism for recording the 'goodness' of each action in each state
        why: "True, but only half the description: the Q-table that records this 'goodness' is also what defines the policy, so both statements apply [^1]."
      - text: an algorithm where the policy is defined by a Q-Table
        why: Also true, but the Q-table that defines the policy is exactly the record of how good each action is in each state, so both statements apply [^1].
      - text: both of the above
        correct: true
    explanation: |
      The ML-For-Beginners lesson describes Q-learning in both ways. Its policy is defined by a
      Q-table, and that table records the "goodness" (quality) of each action in each state [^1].
      The agent acts by choosing the action with the highest value in its current state [^1][^2].
      Q-learning itself is the algorithm that fills in this table using TD updates [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", sections "Q-Learning" and "Checking the policy"
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
    source:
      id: ms-ml-for-beginners
      ref: quiz-46/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: q-learning-002
    type: single
    difficulty: easy
    question: What are the hyperparameters we used during Q-Learning?
    options:
      - text: q-table value, current reward, random action
        why: Q-table values are the parameters being learned, the reward comes from the environment and a random action is something the agent does; none of them is set before training [^2].
      - text: learning rate, discount factor, exploration/exploitation factor
        correct: true
      - text: cumulative rewards, learning rate, exploration factor
        why: Cumulative rewards are what the agent collects from the environment, not a setting you choose, and the discount factor is missing [^1][^2].
    explanation: |
      The ML-For-Beginners CartPole lesson sets three hyperparameters: `alpha`, the learning rate, which controls how far
      each update moves a Q-table entry; `gamma`, the discount factor, which weighs future
      against immediate reward; and `epsilon`, the exploration/exploitation factor [^1]. The
      other options mix in things that are not hyperparameters. Q-table values are the
      parameters being learned, and rewards are data that come from the environment.
      Hyperparameters are what you choose to steer the learning of those parameters [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#lets-start-q-learning
        locator: Reinforcement lesson 2 "CartPole Skating", section "Let's start Q-Learning" (code block 10)
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#investigating-the-learning-process
        locator: Reinforcement lesson 1, section "Investigating the learning process" (hyperparameters vs. parameters)
    source:
      id: ms-ml-for-beginners
      ref: quiz-48/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: q-learning-003
    type: multiple
    difficulty: easy
    question: What are the two main approaches to find optimal policy?
    options:
      - text: Policy-based methods
        correct: true
      - text: Random-based methods
        why: 'Not an established category: acting at random can help exploration, but it is not a way of finding the optimal policy [^1].'
      - text: Value-based methods
        correct: true
      - text: Evolution-strategies methods
        why: Evolution strategies optimize a policy's parameters directly, so they are one kind of policy-based method rather than a main approach of their own [^2].
    explanation: |
      Both approaches look for the optimal policy $\pi^*$. Policy-based methods learn it directly:
      the agent is trained to output which action to take in each state. Value-based methods learn it
      indirectly: the agent learns how valuable each state is and then takes the actions that lead to
      the more valuable states [^1]. Evolution strategies are not a third main approach. Like hill
      climbing and simulated annealing, they are one way of optimizing a policy's parameters
      directly, so they belong to the policy-based family [^2]. "Random-based methods" is not an
      established category.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/two-methods#policy
        locator: "Unit 1, \"Two main approaches for solving RL problems\", section \"The Policy π: the agent's brain\""
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#the-difference-between-policy-based-and-policy-gradient-methods
        locator: Unit 4, "What are the policy-based methods?", section "The difference between policy-based and policy-gradient methods"
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-004
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of the Bellman equation. It is a {{1}} equation: instead of adding
      up the whole return from each state, we write the value of a state as the immediate {{2}} plus
      the {{3}} value of the state that follows.
    answer:
      blanks:
        - accept:
            - recursive
            - recurrence
            - recursion
          hint: one word
        - accept:
            - reward
            - rewards
          hint: one word
        - accept:
            - discounted
          hint: one word (what the factor γ does to it)
      model: $V(S_t) = R_{t+1} + \gamma V(S_{t+1})$
    explanation: |
      Defining the value of a state through the value of its successor means you no longer have to
      sum a long future return for every state [^2]. In full the equation is an expectation over the
      policy and the dynamics,
      $v_\pi(s) = \sum_a \pi(a \mid s) \sum_{s', r} p(s', r \mid s, a)\,[r + \gamma v_\pi(s')]$:
      the reward expected along the way plus the discounted value of the next state [^1]. TD learning
      uses exactly this one-step form, $R_{t+1} + \gamma V(S_{t+1})$, as its update target [^3].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, Eq. (3.14), p. 59
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/bellman-equation
        locator: 'Unit 2, "The Bellman Equation: simplify our value estimation"'
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td#td-learning
        locator: 'Unit 2, "Monte Carlo vs Temporal Difference Learning", section "Temporal Difference Learning: learning at each step"'
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-005
    type: multiple
    difficulty: easy
    question: What is the difference between Monte Carlo and Temporal Difference learning methods?
    options:
      - text: With Monte Carlo methods, we update the value function from a complete episode
        correct: true
      - text: With Monte Carlo methods, we update the value function from a step
        why: Monte Carlo needs the actual return $G_t$, which is only known once the episode has ended [^1][^2].
      - text: With TD learning methods, we update the value function from a complete episode
        why: TD(0) updates after a single step, with the target $R_{t+1} + \gamma V(S_{t+1})$, instead of waiting for the end of the episode [^1][^2].
      - text: With TD learning methods, we update the value function from a step
        correct: true
    explanation: |
      Monte Carlo waits until the episode ends, computes the actual return $G_t$ and uses it as
      the target: $V(S_t) \leftarrow V(S_t) + \alpha[G_t - V(S_t)]$ [^1][^2]. TD(0) updates after a
      single step. Its target $R_{t+1} + \gamma V(S_{t+1})$ uses the current estimate of the next
      state's value, which is called bootstrapping [^1][^2]. The two other options swap the
      methods.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td
        locator: Unit 2, "Monte Carlo vs Temporal Difference Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 6.1 TD Prediction, Eqs. (6.1)–(6.2), pp. 119–120
    source:
      id: hf-deep-rl-course
      ref: unit2/mid-way-quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit2/mid-way-quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-006
    type: single
    difficulty: easy
    question: What is Q-Learning?
    options:
      - text: The algorithm we use to train our Q-function
        correct: true
      - text: A value function
        why: Q-learning is not a function but the algorithm that trains one. The function it trains is the Q-function, an action-value function that gives the value of taking a specific action in a particular state.
      - text: An algorithm that determines the value of being at a particular state and taking a specific action at that state
        why: Q-function is the function that determines the value of being at a particular state and taking a specific action at that state.
      - text: A table
        why: Q-learning is not a Q-table. The Q-table stores the Q-function's values, and Q-learning is the algorithm that fills it in.
    explanation: |
      Q-learning is an off-policy, value-based TD algorithm. Its job is to train the Q-function,
      the action-value function [^1]. Its update moves $Q$ towards the optimal action-value
      function $q_*$ [^2]. The other options describe what it produces, not what it is. The
      Q-function is the action-value function that gives the value of a state–action pair. The
      Q-table is the data structure that stores those values in the tabular case [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, Eq. (6.8), p. 131'
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q1
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: reviewed
    reviewed_by: claude
  - id: q-learning-007
    type: single
    difficulty: easy
    question: What is a Q-table?
    options:
      - text: An algorithm we use in Q-Learning
        why: The Q-table is a data structure, the agent's memory; Q-learning is the algorithm that fills it in [^1].
      - text: Q-table is the internal memory of our agent
        correct: true
      - text: In Q-table each cell corresponds to a state value
        why: Each cell holds the value of a state–action pair, not the value of a state alone.
    explanation: |
      The Q-table is where the Q-function keeps its values, its memory or "cheat sheet". There is
      one cell per state–action pair, and a lookup returns the value of taking that action in
      that state [^1]. Storing one entry per state or state–action pair in an array is what
      makes a method tabular [^2]. It is not an algorithm: Q-learning is the algorithm that fills
      the table [^1]. And its cells hold state–action values, not plain state values [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
        locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q2
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: reviewed
    reviewed_by: claude
  - id: q-learning-008
    type: short_answer
    difficulty: medium
    question: |
      Why does an optimal Q-function $Q^*$ give us an optimal policy? Complete the reasoning.
      $Q^*$ gives the value of every action in every state, so in each state we know the best action:
      the one with the {{1}} $Q^*$ value. Acting {{2}} with respect to $Q^*$,
      $\pi^*(s) = \arg\max_a Q^*(s,a)$, is therefore an optimal policy.
    answer:
      blanks:
        - accept:
            - highest
            - largest
            - maximum
            - max
            - greatest
            - biggest
            - best
          hint: one word
        - accept:
            - greedily
            - greedy
          hint: one word
    explanation: |
      The optimal policy picks $a^*(s) = \arg\max_a Q^*(s,a)$ in every state [^1]. This works
      because $Q^*$ already includes the long-term consequences of each action, like a cache of
      every one-step lookahead, so choosing optimally needs no model of the environment's dynamics;
      knowing only $V^*$ would not be enough [^2]. That is also why value-based methods can put a
      simple greedy rule on top of the learned values instead of training a policy [^3].
    references:
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#the-optimal-q-function-and-the-optimal-action
        locator: Section "The Optimal Q-Function and the Optimal Action"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.6 Optimal Policies and Optimal Value Functions, p. 65
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods" (link between value function and policy)
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q3
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: reviewed
    reviewed_by: claude
  - id: q-learning-009
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of the epsilon-greedy strategy, which handles the
      exploration/exploitation trade-off. With probability $\epsilon$ the agent {{1}}: it tries a
      random action. With probability $1 - \epsilon$ it {{2}}: it takes the action with the highest
      Q-value. $\epsilon$ starts high (e.g. 1.0) and is {{3}} during training as the Q-table
      improves.
    answer:
      blanks:
        - accept:
            - explores
            - explore
            - exploration
            - exploring
          hint: one word
        - accept:
            - exploits
            - exploit
            - exploitation
            - exploiting
          hint: one word
        - accept:
            - decreased
            - reduced
            - decayed
            - lowered
            - annealed
            - decreases
            - decays
          hint: one word
    explanation: |
      Starting with a high $\epsilon$ makes early training mostly random exploration. As the
      Q-table's estimates get better, $\epsilon$ is lowered step by step so the agent exploits more
      [^1]. The theoretical appeal is that every action keeps being tried, so in the limit all
      action-value estimates converge to their true values [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#step2
        locator: 'Unit 2, "Introducing Q-Learning", section "Step 2: Choose an action using the epsilon-greedy strategy"'
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 2.2 Action-value Methods, pp. 27–28
    source:
      id: hf-deep-rl-course
      ref: unit2/quiz2#q4
      url: https://huggingface.co/learn/deep-rl-course/unit2/quiz2
    status: reviewed
    reviewed_by: claude
  - id: q-learning-010
    type: short_answer
    difficulty: easy
    question: |
      Complete the description of tabular methods. They apply when the state and action spaces are
      {{1}} enough for the value function to be stored exactly as arrays or tables. Q-learning is a
      tabular method because it keeps a {{2}} with one cell per state–action pair. For FrozenLake
      4×4, with 16 states and 4 actions, that table has {{3}} cells.
    answer:
      blanks:
        - accept:
            - small
            - little
            - few
          hint: one word
        - accept:
            - Q-table
            - table
            - lookup table
            - Q table
          hint: what Q-learning stores its values in
        - numeric: 64
          hint: a number
    explanation: |
      Sutton & Barto call the case where the state (or state–action) space is small enough to give
      every element its own table entry the tabular case, and its methods tabular methods [^2]. The Hugging Face course's FrozenLake 4×4 has 16 states and 4 actions (left, down, right, up), so its Q-table has
      $16 \times 4 = 64$ entries [^3]. The catch is scale: an Atari frame of $210 \times 160 \times 3$
      values in 0–255 gives $256^{100800}$ possible observations, far too many for a table, so Deep
      Q-learning approximates the Q-values with a neural network instead [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/from-q-to-dqn
        locator: Unit 3, "From Q-Learning to Deep Q-Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67; Part I introduction, p. 23
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/hands-on#part-1-frozen-lake--non-slippery-version
        locator: Unit 2, Hands-on, Part 1 Frozen Lake (observation and action spaces, Q-table)
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-011
    type: single
    difficulty: easy
    question: Why can't we use a classical Q-Learning to solve an Atari Game?
    options:
      - text: Atari environments are too fast for Q-Learning
        why: Speed is not the obstacle. The problem is the size of the observation space.
      - text: Atari environments have a big observation space. So creating and updating the Q-Table would not be efficient
        correct: true
      - text: Atari games have a continuous action space, so a Q-table cannot have one column per action
        why: Atari games have a discrete action space with only a handful of joystick moves, so the actions fit easily in a table [^3].
      - text: Classical Q-learning needs the environment's transition probabilities, which Atari games do not provide
        why: Q-learning is model-free. It learns from sampled transitions and never needs the environment's transition probabilities [^4].
    explanation: |
      Classical Q-learning needs one table entry per state–action pair. An Atari observation is a
      $210 \times 160 \times 3$ image with values from 0 to 255, so there are about
      $256^{100800}$ possible observations. Creating and updating such a Q-table is hopeless [^1].
      Memory is only part of the problem: almost every state would be new, so the agent has to
      generalize from similar states, which needs function approximation [^2]. The Hugging Face course puts the problem down to the size of the observation space, not to how fast the game runs [^1].
      The actions are not the issue either, since Atari's action space is discrete [^3]. And
      Q-learning is model-free, which is one reason DQN was built on it [^4].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/from-q-to-dqn
        locator: Unit 3, "From Q-Learning to Deep Q-Learning"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Part II introduction (Approximate Solution Methods), p. 195
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
        locator: Section "Action Spaces"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play, p. 438
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-012
    type: short_answer
    difficulty: medium
    question: |
      Why do we stack four frames together when we use frames as input in Deep Q-Learning? Complete
      the reasoning. A single frame shows where objects are but not how they move: in Pong you cannot
      tell from one frame which way the ball is going. On its own, a frame therefore lacks the {{1}}
      property: it does not hold everything needed to decide what to do next without looking at the
      history. Stacking the four most recent frames supplies the missing {{2}} information.
    answer:
      blanks:
        - accept:
            - Markov
            - Markovian
          hint: one word
        - accept:
            - temporal
            - motion
            - movement
            - time
            - velocity
            - direction
            - speed
          hint: one word
    explanation: |
      One frame shows positions but not velocities, which is why a single Pong frame cannot tell you
      where the ball is heading; the Hugging Face course calls this the problem of temporal limitation [^2]. The
      Markov property means the current state alone is enough to choose an action, with no need for
      the history of earlier states [^3]. A single frame fails this test, because the full state of
      many Atari games cannot be observed from one image [^1]. DQN (Mnih et al.) therefore stacked
      the four most recent preprocessed $84 \times 84$ frames into an $84 \times 84 \times 4$ input;
      this did not remove partial observability in every game, but it made many of them more
      Markovian [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play, pp. 438–439
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-network#preprocessing
        locator: Unit 3, "The Deep Q-Network (DQN)", section "Preprocessing the input and temporal limitation"
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#markov-property
        locator: Unit 1, "The Reinforcement Learning Framework", section "Markov Property"
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-013
    type: multiple
    difficulty: easy
    question: What are the two phases of Deep Q-Learning?
    options:
      - text: Sampling
        correct: true
      - text: Shuffling
        why: Drawing a random mini-batch from the replay memory is part of the training phase, not a phase of its own [^1].
      - text: Reranking
        why: 'Nothing is reranked: the algorithm only alternates between collecting experience and learning from a sample of it [^1].'
      - text: Training
        correct: true
    explanation: |
      The Deep Q-Learning training algorithm alternates two phases [^1]. In the sampling phase the
      agent acts in the environment and stores the experience tuples it observes in a replay memory.
      In the training phase it draws a small random batch of tuples from that memory and learns from
      it with a gradient-descent step [^1][^2]. Drawing the batch at random is part of the training
      phase, not a separate shuffling phase, and nothing is reranked.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm
        locator: Unit 3, "The Deep Q-Learning Algorithm" (the two phases, Sampling and Training)
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play (experience replay), p. 440
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: reviewed
    reviewed_by: claude
  - id: q-learning-014
    type: short_answer
    difficulty: medium
    question: |
      Why do we create a replay memory in Deep Q-Learning? Complete the two reasons. First, the
      buffer stores experience tuples so that each one can be {{1}} in several updates instead of
      being thrown away after one, which uses experience more efficiently. Second, sampling random
      mini-batches from it reduces the {{2}} between consecutive experiences and stops the network
      from overwriting what it learned from older experiences, a problem called catastrophic {{3}}.
    answer:
      blanks:
        - accept:
            - reused
            - reuse
            - replayed
            - used again
            - sampled again
            - used
          hint: one word
        - accept:
            - correlation
            - correlations
            - dependence
            - dependency
          hint: one word
        - accept:
            - forgetting
            - interference
          hint: one word
    explanation: |
      Without a buffer, online RL learns from each transition once and discards it; storing
      transitions lets the agent learn from the same experience many times [^2]. Feeding consecutive
      transitions makes the network forget earlier situations, e.g. how to play level 1 after moving
      on to a different level 2 [^2]. Uniformly sampled mini-batches are much less correlated than
      consecutive steps, which lowers the variance of the updates and removes one source of
      instability; sampling disconnected transitions is allowed because Q-learning is off-policy
      [^1].
