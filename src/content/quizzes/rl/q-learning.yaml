      occurrences) is the {{1}} estimate. Part 3, $\alpha$, is the {{2}}. Part 4, $G_t$, is the
      {{3}} actually observed from time step $t$, which is only known at the end of the {{4}}.
    figure:
      src: ./q-learning/q-learning-018.svg
      alt: 'The Monte Carlo update V(S_t) ← V(S_t) + α[G_t − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α and 4 is G_t.'
