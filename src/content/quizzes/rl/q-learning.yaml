  - id: q-learning-023
    type: short_answer
    difficulty: easy
    tags:
      - value-iteration
      - complexity
      - dynamic-programming
    question: |
      Value iteration updates every state with
      $V_{k+1}(s) = \max_a \bigl\{ r(s, a) + \gamma\sum_{s'} P(s' \mid s, a)\,V_k(s') \bigr\}$. On an
      $8 \times 8$ FrozenLake grid (64 states, 4 actions), with the sum taken over all 64 next states,
      how many products $P(s' \mid s, a)\,V_k(s')$ does one sweep over all states compute?
    answer:
      numeric: 16384
      tolerance: 0
      hint: a whole number
      model: $|\mathcal{S}| \cdot |\mathcal{A}| \cdot |\mathcal{S}| = 64 \times 4 \times 64 = 16{,}384$
    explanation: |
      For each of the 64 states and each of the 4 actions the update sums over 64 next states, so one
      sweep costs $O(|\mathcal{S}|^2|\mathcal{A}|)$, here $16{,}384$ products [^1]. The total cost is
      this times the number of sweeps until convergence. d2l's implementation loops only over the
      next states listed for each (state, action) pair [^2]; with deterministic moves that is one per
      pair, so a sparse sweep needs only $64 \times 4 = 256$ products.
    references:
      - source: d2l
        locator: Sec. 17.2.6 Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#id2
      - source: d2l
        locator: Sec. 17.2.8 Implementation of Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#implementation-of-value-iteration
      - source: d2l
        locator: Sec. 17.2.10 Exercises, Exercise 2
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/value-iter#ex2
      url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: q-learning-024
    type: single
    difficulty: medium
    tags:
      - value-iteration
      - discount-factor
      - frozenlake
    question: |
      In FrozenLake with deterministic moves, the agent gets reward 1 only on the move that enters the
      goal and 0 otherwise, and holes and the goal end the episode. What does value iteration return
      with discount factor $\gamma = 0$?
    options:
      - text: Value 1 only for states one move from the goal; elsewhere the policy is an arbitrary tie-break
        correct: true
      - text: The same optimal policy as with $\gamma = 0.95$, only with smaller values everywhere
        why: With $\gamma = 0$ future rewards are ignored, so states farther from the goal get no signal at all.
      - text: Value 1 for every state from which the goal can be reached
        why: That is the result for $\gamma = 1$, where a reward several steps away counts in full.
      - text: Nothing useful, because value iteration does not converge without discounting
        why: With $\gamma = 0$ the update ignores $V_k$, so it converges after one sweep.
    explanation: |
      With $\gamma = 0$ the update reduces to $V_{k+1}(s) = \max_a r(s, a)$ [^1], so only states with a
      move into the goal get value 1 and all actions elsewhere tie at 0; d2l's code then picks the
      first action by `argmax` [^2]. A small γ makes the agent short-sighted, while a large γ such as
      0.99 lets distant rewards count [^3]. With $\gamma = 0.5$, a state $j$ moves from the goal has
      value $0.5^{j-1}$, and with $\gamma = 1$ every state that can reach the goal has value 1, with no
      preference for short paths.
    references:
      - source: d2l
        locator: Sec. 17.2.6 Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#id2
      - source: d2l
        locator: Sec. 17.2.8 Implementation of Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html#implementation-of-value-iteration
      - source: d2l
        locator: Sec. 17.1.2 Return and Discount Factor
        url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#return-and-discount-factor
