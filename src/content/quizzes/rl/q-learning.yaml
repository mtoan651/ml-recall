    question: We mentioned Q Learning is a tabular method. What are tabular methods?
    answer:
      model: '*Tabular methods* is a type of problem in which the state and actions spaces are small enough to approximate value functions to be **represented as arrays and tables**. For instance, **Q-Learning is a tabular method** since we use a table to represent the state, and action value pairs.'
