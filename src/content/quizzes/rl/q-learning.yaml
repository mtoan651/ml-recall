  - id: q-learning-014
    type: short_answer
    difficulty: medium
    question: Why do we create a replay memory in Deep Q-Learning?
    answer:
      model: |
        **1. Make more efficient use of the experiences during the training**

        Usually, in online reinforcement learning, the agent interacts in the environment, gets experiences (state, action, reward, and next state), learns from them (updates the neural network), and discards them. This is not efficient.
        But, with experience replay, **we create a replay buffer that saves experience samples that we can reuse during the training**.

        **2. Avoid forgetting previous experiences and reduce the correlation between experiences**

          The problem we get if we give sequential samples of experiences to our neural network is that it **tends to forget the previous experiences as it overwrites new experiences**. For instance, if we are in the first level and then the second, which is different, our agent can forget how to behave and play in the first level.
    explanation: |
      Random sampling also helps stability. Mini-batches drawn uniformly from the buffer are not
      correlated with one another, which lowers the variance of the updates and removes one
      source of instability [^1][^2]. Sampling disconnected transitions is allowed because Q-learning is off-policy, so its updates do not have to follow a
      connected trajectory [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play (experience replay), p. 440
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm#exp-replay
        locator: Unit 3, "The Deep Q-Learning Algorithm", section "Experience Replay to make more efficient use of experiences"
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
  - id: q-learning-015
    type: short_answer
    difficulty: medium
    question: How do we use Double Deep Q-Learning?
    answer:
      model: |
        When we compute the Q target, we use two networks to decouple the action selection from the target Q value generation. We:

          - Use our *DQN network* to **select the best action to take for the next state** (the action with the highest Q value).

          - Use our *Target network* to calculate **the target Q value of taking that action at the next state**.
    explanation: |
      The reason is maximization bias: the max over noisy Q-estimates is, on average, larger than
      the true best value, so standard (Deep) Q-learning tends to overestimate [^1][^2]. If one
      estimate chooses the argmax and a second, independent estimate scores it, the value of the
      chosen action is unbiased. That is the double-learning idea, which Double DQN implements
      with the online and target networks [^1][^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 6.7 Maximization Bias and Double Learning, pp. 134–136
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm#double-dqn
        locator: Unit 3, "The Deep Q-Learning Algorithm", section "Double DQN"
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
