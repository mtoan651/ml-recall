  - id: q-learning-014
    type: short_answer
    difficulty: medium
    question: |
      Why do we create a replay memory in Deep Q-Learning? Complete the two reasons. First, the
      buffer stores experience tuples so that each one can be {{1}} in several updates instead of
      being thrown away after one, which uses experience more efficiently. Second, sampling random
      mini-batches from it reduces the {{2}} between consecutive experiences and stops the network
      from overwriting what it learned from older experiences, a problem called catastrophic {{3}}.
    answer:
      blanks:
        - accept:
            - reused
            - reuse
            - replayed
            - used again
            - sampled again
            - used
          hint: one word
        - accept:
            - correlation
            - correlations
            - dependence
            - dependency
          hint: one word
        - accept:
            - forgetting
            - interference
          hint: one word
    explanation: |
      Without a buffer, online RL learns from each transition once and discards it; storing
      transitions lets the agent learn from the same experience many times [^2]. Feeding consecutive
      transitions makes the network forget earlier situations, e.g. how to play level 1 after moving
      on to a different level 2 [^2]. Uniformly sampled mini-batches are much less correlated than
      consecutive steps, which lowers the variance of the updates and removes one source of
      instability; sampling disconnected transitions is allowed because Q-learning is off-policy
      [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.5 Human-level Video Game Play (experience replay), p. 440
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm#exp-replay
        locator: Unit 3, "The Deep Q-Learning Algorithm", section "Experience Replay to make more efficient use of experiences"
    source:
      id: hf-deep-rl-course
      ref: unit3/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit3/quiz
    status: draft
  - id: q-learning-015
    type: short_answer
    difficulty: medium
    question: |
      How do we use Double Deep Q-Learning? Complete the description. When computing the Q-target,
      Double DQN uses the {{1}} network to select the best action for the next state, and the {{2}}
      network to calculate the Q-value of taking that action in the next state. Decoupling action
      selection from evaluation reduces the {{3}} of Q-values caused by taking a max over noisy
      estimates.
    answer:
      blanks:
        - accept:
            - DQN
            - online
            - main
            - current
            - policy
            - Q
            - Q-network
            - deep Q
          hint: the network being trained
        - accept:
            - target
          hint: one word
        - accept:
            - overestimation
            - over-estimation
            - overestimate
            - maximization bias
          hint: one word
    explanation: |
      The max over noisy Q-estimates is on average larger than the true best value, so standard
      (Deep) Q-learning tends to overestimate; Sutton & Barto call this maximization bias [^1][^2].
      If one estimate chooses the argmax and a second, independent estimate scores it, the value of
      the chosen action is no longer biased upward [^1]. Double DQN applies this double-learning idea
      with the two networks it already has, the online DQN network and the target network [^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 6.7 Maximization Bias and Double Learning, pp. 134–136
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm#double-dqn
        locator: Unit 3, "The Deep Q-Learning Algorithm", section "Double DQN"
    source:
      id: hf-deep-rl-course
