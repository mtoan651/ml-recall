        url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#step2
        locator: 'Unit 2, "Introducing Q-Learning", section "Step 2: Choose an action using the epsilon-greedy strategy"'
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 2.2 Action-value Methods, pp. 27–28
    source:
