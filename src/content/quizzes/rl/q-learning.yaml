      Complete their definitions. Part 1 is the {{1}} estimate of the value of state $S_t$, and
      part 2 (both occurrences) is the former estimate. Part 3, $\alpha$, is the {{2}}. Part 4,
      $R_{t+1}$, is the {{3}} received after leaving $S_t$, and part 5, $\gamma V(S_{t+1})$, is the
      discounted value estimate of the next state. Parts 4 and 5 together form the TD {{4}}.
    figure:
      src: ./q-learning/q-learning-017.svg
      alt: 'The TD update V(S_t) ← V(S_t) + α[R_{t+1} + γ V(S_{t+1}) − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α, 4 is R_{t+1} and 5 is γ V(S_{t+1}).'
