title: RL Fundamentals
questions:
  - id: rl-basics-001
    type: single
    difficulty: easy
    question: 'What is a good example of Reinforcement learning:'
    options:
      - text: Zero-shot image classification
      - text: Zero-shot text classification
      - text: Learning to play chess
        correct: true
    explanation: |
      RL is learning by doing: an agent acts in an environment and improves its behavior from the
      rewards it gets [^1]. A board game fits this exactly. Each move is an action, the rules
      form the environment, and winning or losing is the reward. AlphaZero, for example,
      learned chess, Go and shogi through reinforcement learning [^1][^2]. Zero-shot image or
      text classification assigns a label to an input in a single step. There is no sequence of
      actions and no trial-and-error search for reward, which are the defining features of
      RL [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
        locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "Other RL Tasks"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1
    source:
      id: ms-ai-for-beginners
      ref: quiz-122/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-002
    type: single
    difficulty: easy
    question: When creating RL-based chess engine, we need to
    options:
      - text: use all existing chess matches as a dataset
      - text: let computer play against itself many times
        correct: true
      - text: program exhaustive search algorithm
    explanation: |
      RL learns from experience, and in a two-player game the program can create that experience
      by playing against itself. AlphaZero was trained from scratch by two agents playing each
      other and improving at every step [^1]. AlphaGo Zero used no human game records at all,
      only self-play reinforcement learning, and AlphaZero applied the same general algorithm to
      chess [^2]. A database of past matches would make the program imitate humans, which this
      work showed is unnecessary [^2]. Exhaustive search is not feasible: even large dedicated
      computers cannot compute optimal chess moves outright [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
        locator: Lesson 22 "Deep Reinforcement Learning", section "Other RL Tasks"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67
    source:
      id: ms-ai-for-beginners
      ref: quiz-122/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-003
    type: single
    difficulty: easy
    question: How does RL training algorithm knows how well it did?
    options:
      - text: It achieves high accuracy
      - text: Using perplexity metric
      - text: Using reward function
        correct: true
    explanation: |
      An RL agent's only feedback is reward. The reward function says how successful an attempt
      was; in a game it might be the final score [^1]. The agent's single objective is to
      maximize total reward over the long run, and it is never told which action would have been
      correct [^2]. That rules out accuracy, which needs known correct labels. Perplexity is a
      language-model metric that measures how well a model predicts the next token in a
      text [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#deep-reinforcement-learning
        locator: Lesson 22 "Deep Reinforcement Learning", introduction
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1; Sec. 1.3 Elements of Reinforcement Learning, p. 6
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#perplexity
        locator: Sec. 9.3.2 Perplexity
    source:
      id: ms-ai-for-beginners
      ref: quiz-222/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-004
    type: single
    difficulty: easy
    question: Which problem(s) is RL is applicable to?
    options:
      - text: With discrete environment
      - text: With continuous environment
      - text: Both
        correct: true
    explanation: |
      RL works with both kinds of environment. The ML-for-Beginners lessons first apply
      Q-learning to a board world with discrete states, then to CartPole, whose state is a vector
      of real numbers [^1]. For a Q-table, a continuous state has to be discretized, for example
      into bins [^1]. Actions can likewise be discrete (a finite set of moves, as in Atari or Go)
      or continuous (real-valued, as in robot control or steering a car) [^2][^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#state-discretization
        locator: Reinforcement lesson 2 "CartPole Skating", introduction, section "State discretization" and Conclusion
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#action-space
        locator: Unit 1, "The Reinforcement Learning Framework", section "Action Space"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
        locator: Section "Action Spaces"
    source:
      id: ms-ai-for-beginners
      ref: quiz-222/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-005
    type: single
    difficulty: easy
    question: What is reinforcement learning?
    options:
      - text: teaching someone something over and over again until they understand
      - text: a learning technique that deciphers the optimal behavior of an agent in some environment by running many experiments
        correct: true
      - text: understanding how to run multiple experiments at once
    explanation: |
      The lesson defines RL as a way to learn an agent's optimal behavior in an environment by
      running many experiments, with the goal set by a reward function [^1]. Sutton & Barto
      describe it as learning how to map situations to actions so as to maximize a numerical
      reward, finding good actions by trying them out [^2]. The other options leave out what
      makes it RL: an agent that chooses actions in order to earn reward [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#introduction
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Introduction"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-006
    type: single
    difficulty: easy
    question: What is a policy?
    options:
      - text: a function that returns the action at any given state
        correct: true
      - text: a document that tells you whether or not you can return an item
      - text: a function that is used for a random purpose
    explanation: |
      A policy is the agent's strategy: a function that returns the action to take in any given
      state [^1]. Formally it maps states to actions, or, for a stochastic policy, to the
      probability of choosing each action [^2]. The return-policy and random-purpose options play
      on the everyday meaning of the word.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#actions-and-policy
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Actions and policy"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.3 Elements of Reinforcement Learning, p. 6; Sec. 3.5 Policies and Value Functions, p. 58
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-007
    type: true_false
    difficulty: easy
    question: A reward function returns a score for each state of an environment.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      In the lesson the reward function gives every state a score: $-10$ for water or the wolf,
      $+10$ for the apple and $-0.1$ for an ordinary move, with higher numbers meaning better
      outcomes [^1]. The general MDP formulation is broader. The reward arrives after the agent
      acts in a state, so it can depend on the state, the action and the next state, as in
      $p(s', r \mid s, a)$ [^2]. Scoring states alone is the simpler special case the lesson uses.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#reward-function
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Reward function"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.1 The Agent–Environment Interface, Eqs. (3.1)–(3.2), pp. 47–48
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-008
    type: true_false
    difficulty: easy
    question: Chess and Go are games with continuous states.
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Chess and Go are played on a board with fixed rules, and a position is one of a finite set
      of configurations. Their state is therefore discrete [^1]. A continuous state is described
      by real numbers, like CartPole's cart position and velocity, pole angle and rotation
      rate [^1]. Go's action space is discrete as well, since only a finite number of moves is
      available [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
        locator: Reinforcement lesson 2 "CartPole Skating", introduction and section "Exercise - initialize a cartpole environment"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
        locator: Section "Action Spaces"
    source:
