        url: https://gymnasium.farama.org/environments/classic_control/cart_pole/#description
        locator: Secs. Description and Observation Space
      - title: 'Gymnasium documentation: Mountain Car'
        url: https://gymnasium.farama.org/environments/classic_control/mountain_car/#description
        locator: Sec. Description
      - title: 'Gymnasium documentation: Lunar Lander'
        url: https://gymnasium.farama.org/environments/box2d/lunar_lander/#description
        locator: Sec. Description
