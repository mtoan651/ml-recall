      ref: quiz-47/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-009
    type: single
    difficulty: easy
    question: What tool can we use to play out different scenarios of potential states in a game?
    options:
      - text: guess and check
      - text: simulation environments
        correct: true
      - text: state transition testing
    explanation: |
      RL needs an environment or simulator that enforces the rules of the game, where experiments
      can be run and their results observed [^1]. A simulation environment such as OpenAI Gym
      simulates anything from Atari games to the physics of pole balancing, so the agent can play
      out as many scenarios as it needs [^1][^2]. Guessing and checking by hand, or testing
      individual state transitions, cannot produce that volume of experience. The lesson's
      CartPole agent, for example, trains on 100,000 simulated episodes [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#openai-gym
        locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "OpenAI Gym"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#openai-gym
        locator: Reinforcement lesson 2 "CartPole Skating", section "OpenAI Gym"
    source:
      id: ms-ml-for-beginners
      ref: quiz-47/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-010
    type: single
    difficulty: easy
    question: Where do we define all possible actions in an environment?
    options:
      - text: methods
      - text: action space
        correct: true
      - text: action list
    explanation: |
      Each Gym environment defines an action space, which lists the possible actions, and an
      observation space, which describes what the agent receives. For CartPole the action space
      is discrete, with just two actions, left and right [^1]. In general, the action space is the
      set of all actions available in an environment, and it can be discrete or continuous [^2].
      "Methods" and "action list" are not the standard term.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#exercise---initialize-a-cartpole-environment
        locator: Reinforcement lesson 2 "CartPole Skating", section "Exercise - initialize a cartpole environment"
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#action-space
        locator: Unit 1, "The Reinforcement Learning Framework", section "Action Space"
    source:
      id: ms-ml-for-beginners
      ref: quiz-48/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-011
    type: short_answer
    difficulty: easy
    question: What is Reinforcement Learning?
    answer:
      model: Reinforcement learning is a **framework for solving control tasks (also called decision problems)** by building agents that learn from the environment by interacting with it through trial and error and **receiving rewards (positive or negative) as unique feedback**.
    explanation: |
      RL is unlike supervised learning, because the learner is never shown labeled examples of
      the correct action, and unlike unsupervised learning, because it maximizes a reward signal
      rather than looking for hidden structure. That makes it a third paradigm, whose two most
      distinctive features are trial-and-error search and delayed reward [^1]. The course's own picture is a child handed a game they have
      never played, who gets better with no supervision, just by noticing which actions earn
      points and which lose them [^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, pp. 1–2
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/what-is-rl#the-big-picture
        locator: Unit 1, "What is Reinforcement Learning?", section "The big picture"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-012
    type: single
    difficulty: easy
    question: |
      Define the RL Loop

      At every step:
      - Our Agent receives ______ from the environment
      - Based on that ______ the Agent takes an ______
      - Our Agent will move to the right
      - The Environment goes to a ______
      - The Environment gives a ______ to the Agent
    options:
      - text: an action a0, action a0, state s0, state s1, reward r1
        why: 'At every step: Our Agent receives **state s0** from the environment. Based on that **state s0** the Agent takes an **action a0**. Our Agent will move to the right. The Environment goes to a **new state s1**. The Environment gives **a reward r1** to the Agent.'
      - text: state s0, state s0, action a0, new state s1, reward r1
        correct: true
      - text: a state s0, state s0, action a0, state s1, action a1
        why: 'At every step: Our Agent receives **state s0** from the environment. Based on that **state s0** the Agent takes an **action a0**. Our Agent will move to the right. The Environment goes to a **new state s1**. The Environment gives **a reward r1** to the Agent.'
    explanation: |
      The loop starts with the environment giving the agent a state $S_0$, for example the first
      frame of the game. From that state the agent picks an action $A_0$ (move right). The
      environment then moves to a new state $S_1$ and gives the agent a reward $R_1$ [^1].
      Repeating this produces the trajectory $S_0, A_0, R_1, S_1, A_1, R_2, \dots$ [^2]. The
      other options go wrong because the agent receives a state, not an action, and the
      environment returns a reward; actions only ever come from the agent.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#the-rl-process
        locator: Unit 1, "The Reinforcement Learning Framework", section "The RL Process"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.1 The Agent–Environment Interface, Fig. 3.1 and Eq. (3.1), pp. 47–48
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-013
    type: multiple
    question: What's the difference between a state and an observation?
    options:
      - text: The state is a complete description of the state of the world (there is no hidden information)
        correct: true
      - text: The state is a partial description of the state
      - text: The observation is a complete description of the state of the world (there is no hidden information)
      - text: The observation is a partial description of the state
        correct: true
      - text: We receive a state when we play with chess environment
        correct: true
      - text: We receive an observation when we play with chess environment
        why: Since we have access to the whole checkboard information.
      - text: We receive a state when we play with Super Mario Bros
        why: We only see a part of the level close to the player, so we receive an observation.
      - text: We receive an observation when we play with Super Mario Bros
        correct: true
    explanation: Since we have access to the whole checkboard information. We only see a part of the level close to the player. [^1]
    references:
      - source: hf-deep-rl-course
        locator: Unit 1. Introduction to Deep Reinforcement Learning
        url: https://huggingface.co/learn/deep-rl-course/unit1/introduction
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-014
    type: multiple
    question: A task is an instance of a Reinforcement Learning problem. What are the two types of tasks?
    options:
      - text: Episodic
        correct: true
      - text: Recursive
      - text: Adversarial
      - text: Continuing
        correct: true
    explanation: 'In Episodic task, we have a starting point and an ending point (a terminal state). This creates an episode: a list of States, Actions, Rewards, and new States. For instance, think about Super Mario Bros: an episode begin at the launch of a new Mario Level and ending when you’re killed or you reached the end of the level. Continuing tasks are tasks that continue forever (no terminal state). In this case, the agent must learn how to choose the best actions and simultaneously interact with the environment. [^1]'
    references:
      - source: hf-deep-rl-course
        locator: Unit 1. Introduction to Deep Reinforcement Learning
        url: https://huggingface.co/learn/deep-rl-course/unit1/introduction
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-015
    type: short_answer
    difficulty: easy
    question: What is the exploration/exploitation tradeoff?
    answer:
      model: |
        In Reinforcement Learning, we need to **balance how much we explore the environment and how much we exploit what we know about the environment**.

        - *Exploration* is exploring the environment by **trying random actions in order to find more information about the environment**.

        - *Exploitation* is **exploiting known information to maximize the reward**.
    explanation: |
      Neither side works on its own: an agent that only exploits can settle on a small nearby
      reward and never find a much larger one further away, as with the mouse in the course's
      cheese maze [^2]. Learning to act well means trying many actions and gradually favoring
      the ones that look best, and on a stochastic task each action has to be tried many times
      before its estimated reward is reliable [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 3
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/exp-exp-tradeoff
        locator: Unit 1, "The Exploration/Exploitation trade-off"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-016
    type: short_answer
    difficulty: easy
    question: What is a policy?
    answer:
      model: '- The Policy π **is the brain of our Agent**. It’s the function that tells us what action to take given the state we are in. So it defines the agent’s behavior at a given time.'
    explanation: |
      Policies come in two kinds. A deterministic policy always returns the same action for a
      given state. A stochastic policy outputs a probability distribution over actions, written
      $\pi(a \mid s)$ [^1][^2]. Training aims to find the optimal policy $\pi^*$, the one that
      maximizes expected return [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/two-methods#policy
        locator: "Unit 1, \"Two main approaches for solving RL problems\", sections \"The Policy π: the agent's brain\" and \"Policy-Based Methods\""
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, p. 58
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-017
    type: short_answer
    difficulty: easy
    question: What are value-based methods?
    answer:
      model: |
        - Value-based methods is one of the main approaches for solving RL problems.
        - In Value-based methods, instead of training a policy function, **we train a value function that maps a state to the expected value of being at that state**.
    explanation: |
      The value of a state is the expected discounted return from starting there and then
      following the policy [^2]. In value-based methods the policy itself is not trained: it is
      a fixed rule, such as greedy or epsilon-greedy, that picks actions from the learned values,
      so finding the optimal value function gives the optimal policy [^1]. The value function can
      be defined over states ($V$) or over state–action pairs ($Q$) [^1].
    references:
