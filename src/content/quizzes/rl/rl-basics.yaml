      ref: chapter_reinforcement-learning/mdp#ex2
      url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-025
    type: short_answer
    difficulty: hard
    tags:
      - value-iteration
      - bellman-equation
      - gridworld
    question: |
      A grid world has 6 free cells in 2 rows of 3, surrounded by walls; the goal `g` is the top-left cell:
      ```
      g . .
      . . .
      ```
      Actions move up, down, left or right; moving into a wall leaves the agent where it is. Every action whose next cell
      is the goal gives reward 1 (including bumping into a wall while standing on the goal); all other actions give 0,
      and the goal is not terminal. Value iteration with $\gamma = 0.99$ converges to the optimal values $V^*$. What is
      $V^*$ of the bottom-right cell?
    answer:
      numeric: 98.01
      tolerance: 0.02
      hint: a number, 2 decimals
      model: $V^*(g) = 1/(1 - \gamma) = 100$; a neighbour of the goal gets $1 + 0.99 \cdot 100 = 100$; two steps away $99$; three steps away $0.99 \cdot 99 = 98.01$
    explanation: |
      Value iteration repeats the Bellman backup $Q(s,a) \leftarrow R(s,a) + \gamma\sum_{s'} P(s' \mid s, a)\max_{a'} Q(s', a')$ until it stops
      changing [^1][^2]. On the goal the agent can collect reward 1 forever by bumping into a wall, so
      $V^*(g) = 1/(1 - 0.99) = 100$, and a cell next to the goal gets $1 + 0.99 \cdot 100 = 100$ as well [^1]. Each further step
      multiplies by $\gamma$ without new reward: the bottom-right cell is 3 moves from the goal, so
      $V^* = 0.99 \cdot 0.99 \cdot 100 = 98.01$. The greedy policy $\arg\max_a Q(s, a)$ then always moves toward the goal [^1].
    references:
      - source: neuromatch-dl
        locator: W3D4 Tutorial 1, Section 2.2 Markov Decision Process and Section 3 Value iteration (Coding Exercise 4)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D4_BasicReinforcementLearning/instructor/W3D4_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 17.2 Value Iteration
        url: https://d2l.ai/chapter_reinforcement-learning/value-iter.html
    source:
      id: neuromatch-dl
      ref: W3D4_BasicReinforcementLearning/W3D4_Tutorial1#ex4
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D4_BasicReinforcementLearning/instructor/W3D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-026
    type: single
    difficulty: medium
    tags:
      - behavioural-cloning
      - imitation-learning
      - policy-network
    question: |
      To build an Othello player, you train a policy network on a dataset of expert games: for each board the network
      outputs log-probabilities over the board positions and is trained to maximize the log-probability of the move the
      expert made. What kind of learning is this?
    options:
      - text: "Behavioural cloning: supervised learning of the expert's moves, without any rewards"
        correct: true
      - text: 'Q-learning: the network learns the value of each move from the final game outcome'
        why: The targets are the expert's moves, not values or returns; no reward signal enters the loss.
      - text: 'Policy-gradient RL: moves are reinforced in proportion to the return of each game'
        why: Policy gradients weight log-probabilities by returns of the agent's own games; here every expert move is a fixed label.
      - text: 'Unsupervised learning: the network clusters board positions without any targets'
        why: Each board comes with a target move, so this is supervised learning.
    explanation: |
      The loss is the cross-entropy between the network's move distribution and the expert's move,
      $-\frac1N\sum_i \log \pi_\theta(a_i^{\text{expert}} \mid s_i)$, an ordinary classification objective [^1]. Learning a policy by
      imitating demonstrations this way is behavioural cloning [^2]. It needs no reward, but the player can only be as
      good as the demonstrations and can stray into situations the experts never produced, which is why the Neuromatch tutorial later adds
      planning with Monte Carlo rollouts [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W3D5 Tutorial 2, Section 3 Train a policy network from expert game data (Coding Exercise 3.1)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D5_AdvancedReinforcementLearningAndDeepLearningDiscussion3/instructor/W3D5_Tutorial2.ipynb
      - title: 'Wikipedia: Imitation learning'
        url: https://en.wikipedia.org/wiki/Imitation_learning
        locator: Approaches, Behavior Cloning
    source:
      id: neuromatch-dl
      ref: W3D5_AdvancedReinforcementLearningAndDeepLearningDiscussion3/W3D5_Tutorial2#ex3.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D5_AdvancedReinforcementLearningAndDeepLearningDiscussion3/instructor/W3D5_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-027
    type: single
    difficulty: medium
    tags:
      - monte-carlo-rollouts
      - planning
      - board-games
    question: An Othello player plans with Monte Carlo rollouts, using a trained policy network and a value network. How does it choose a move?
    options:
      - text: For each of the few likeliest moves, it samples short continuations with the policy, scores their ends with the value net, and takes the best average
        correct: true
      - text: It plays the move with the highest policy probability and uses one rollout only to check that the move is legal
        why: Legality comes from the game rules; the rollouts estimate how good each candidate move is.
      - text: It searches every legal move exhaustively to the end of the game and plays the guaranteed winner
        why: Rollouts are short (a few moves deep) and only for the top few moves; the full game tree is far too large to search.
      - text: It keeps training the policy network during each game, using the rollout outcomes as new labels
        why: The rollouts only evaluate candidate moves; the networks stay fixed while the player plays.
    explanation: |
      The planner keeps the $K$ moves with the highest policy probability (3 in the Neuromatch tutorial) and, for each, runs several
      rollouts (10) that sample moves from the policy for a few steps (depth 5), returning the value network's estimate at
      the end, or the actual result if the game ends [^1]. Averaging these returns gives a Monte Carlo estimate of each
      move's value, and the player picks the highest [^1][^2]. Simulating ahead lets the agent look beyond a single value
      prediction, at the cost of many network evaluations per move [^2].
    references:
      - source: neuromatch-dl
        locator: W3D5 Tutorial 2, Section 5 Plan using Monte Carlo Rollouts (Coding Exercises 5.1 and 5.2)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D5_AdvancedReinforcementLearningAndDeepLearningDiscussion3/instructor/W3D5_Tutorial2.ipynb
      - title: 'Sutton and Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Sec. 8.10 Rollout Algorithms
    source:
