  - id: rl-basics-023
    type: single
    difficulty: easy
    tags:
      - mdp
      - markov-property
      - state-design
    question: |
      You model the MountainCar task as a Markov decision process: an underpowered car in a valley
      must reach a flag on the right hill, and each action accelerates it to the left, to the right,
      or not at all. Which choice of state makes the process Markov?
    options:
      - text: The car's position and velocity
        correct: true
      - text: The car's position alone
        why: The next position also depends on the current velocity, which one position does not reveal [^1].
      - text: The car's position and the last action taken
        why: One action changes the velocity only a little; the current velocity depends on the whole history of actions.
      - text: The time step and the distance to the flag
        why: These still say nothing about how fast, and in which direction, the car is moving.
    explanation: |
      d2l discusses exactly this case: a robot whose action is an acceleration is not Markov if the
      state is only its location, because the next location depends on the velocity; making the state
      (location, velocity) restores the Markov property [^1]. The standard MountainCar environment
      therefore observes position and velocity, has three discrete actions (accelerate left, don't
      accelerate, accelerate right), and gives a reward of −1 per time step until the car reaches the
      flag, so maximizing the return means reaching it quickly [^2].
    references:
      - source: d2l
        locator: Sec. 17.1.3 Discussion of the Markov Assumption
        url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#discussion-of-the-markov-assumption
      - title: 'Gymnasium documentation: Mountain Car'
        url: https://gymnasium.farama.org/environments/classic_control/mountain_car/
        locator: Observation Space; Action Space; Reward; Episode End
      - source: d2l
        locator: Sec. 17.1.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/mdp#ex1
      url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#exercises
    status: draft
  - id: rl-basics-024
    type: multiple
    difficulty: medium
    tags:
      - mdp
      - pong
      - reward-design
      - state-design
    question: |
      You design a Markov decision process for the Atari game Pong, in which the agent moves a paddle
      to return a ball past the opponent. Which choices are sound? Select all that apply.
    options:
      - text: "Reward: +1 when the ball passes the opponent's paddle, −1 when it passes yours, 0 otherwise"
        correct: true
      - text: 'Actions: move the paddle up, move it down, or leave it where it is'
        correct: true
      - text: "State: the last few screen frames stacked, so the ball's direction can be seen"
        correct: true
      - text: 'State: only the current screen frame, since it shows where everything is'
        why: One frame shows positions but not velocities, so it is not a Markov state [^1].
      - text: The transition probabilities must be known to the agent, or Pong is not an MDP
        why: The MDP has a transition function whether or not the agent knows it; Q-learning learns without it [^3].
    explanation: |
      An MDP needs states, actions, transitions and a reward designed with the goal in mind, and its
      state must make the future depend only on the present [^1]. In Pong the agent scores when the
      ball passes the opponent's paddle and loses a point when it passes its own [^2]; up, down and
      stay are the essential paddle moves (the Atari version adds FIRE variants) [^2]. Stacking recent
      frames supplies the velocity a single frame lacks [^1]. The transition function is part of the
      MDP even when unknown to the agent, which model-free methods such as Q-learning handle by
      learning from experience [^3].
    references:
      - source: d2l
        locator: Sec. 17.1.1 Definition of an MDP; 17.1.3 Discussion of the Markov Assumption
        url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#definition-of-an-mdp
      - title: 'Arcade Learning Environment documentation: Pong'
        url: https://ale.farama.org/environments/pong/
        locator: Description; Actions; Rewards
      - source: d2l
        locator: Sec. 17.3 Q-Learning (introduction) and 17.3.1 The Q-Learning Algorithm
        url: https://d2l.ai/chapter_reinforcement-learning/qlearning.html#the-q-learning-algorithm
      - source: d2l
        locator: Sec. 17.1.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#exercises
    source:
      id: d2l
      ref: chapter_reinforcement-learning/mdp#ex2
      url: https://d2l.ai/chapter_reinforcement-learning/mdp.html#exercises
    status: draft
