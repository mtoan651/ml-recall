  - id: rl-basics-018
    type: short_answer
    difficulty: easy
    question: What are policy-based methods?
    answer:
      model: |
        - In *Policy-Based Methods*, we learn a **policy function directly**.
        - This policy function will **map from each state to the best corresponding action at that state**. Or a **probability distribution over the set of possible actions at that state**.
    explanation: |
      Usually the policy is parameterized, for example as a neural network $\pi_\theta(a \mid s)$.
      The parameters $\theta$ are then tuned by gradient ascent to maximize the expected return
      $J(\theta)$ [^1]. A value function can still help with learning, but it is not needed to
      choose actions [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#value-based-policy-based-and-actor-critic-methods
