  - id: rl-basics-017
    type: short_answer
    difficulty: easy
    question: |
      What are value-based methods? Complete the description. Instead of training a policy,
      value-based methods train a {{1}} function that outputs, for each state, the expected {{2}}
      if the agent starts in that state and then follows the policy. The policy itself is not
      trained: it is a simple pre-specified rule, such as {{3}} action selection, that picks actions
      from the learned values.
    answer:
      blanks:
        - accept:
            - value
            - state-value
            - state value
          hint: one word
        - accept:
            - return
            - discounted return
            - cumulative reward
            - cumulative discounted reward
            - value
          hint: one word
        - accept:
            - greedy
            - epsilon-greedy
            - ε-greedy
            - e-greedy
          hint: one word
    explanation: |
      The value of a state is the expected discounted return from starting there and then following
      the policy [^2]. In value-based methods the policy is a fixed rule, such as greedy or
      epsilon-greedy, that picks actions from the learned values, so finding the optimal value
      function gives the optimal policy [^1]. The value function can be defined over states ($V$)
      or over state–action pairs ($Q$) [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
