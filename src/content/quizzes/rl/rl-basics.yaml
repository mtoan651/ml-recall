title: RL Fundamentals
questions:
  - id: rl-basics-001
    type: single
    difficulty: easy
    question: 'What is a good example of Reinforcement learning:'
    options:
      - text: Zero-shot image classification
      - text: Zero-shot text classification
      - text: Learning to play chess
        correct: true
    explanation: |
      RL is learning by doing: an agent acts in an environment and improves its behavior from the
      rewards it gets [^1]. A board game fits this exactly. Each move is an action, the rules
      form the environment, and winning or losing is the reward. AlphaZero, for example,
      learned chess, Go and shogi through reinforcement learning [^1][^2]. Zero-shot image or
      text classification assigns a label to an input in a single step. There is no sequence of
      actions and no trial-and-error search for reward, which are the defining features of
      RL [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
        locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "Other RL Tasks"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1
    source:
      id: ms-ai-for-beginners
      ref: quiz-122/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-002
    type: single
    difficulty: easy
    question: When creating an RL-based chess engine, we need to
    options:
      - text: use all existing chess matches as a dataset
      - text: let the computer play against itself many times
        correct: true
      - text: program an exhaustive search algorithm
    explanation: |
      RL learns from experience, and in a two-player game the program can create that experience
      by playing against itself. AlphaZero was trained from scratch by two agents playing each
      other and improving at every step [^1]. AlphaGo Zero used no human game records at all,
      only self-play reinforcement learning, and AlphaZero applied the same general algorithm to
      chess [^2]. A database of past matches would make the program imitate humans, which this
      work showed is unnecessary [^2]. Exhaustive search is not feasible: even large dedicated
      computers cannot compute optimal chess moves outright [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
        locator: Lesson 22 "Deep Reinforcement Learning", section "Other RL Tasks"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.7 Optimality and Approximation, p. 67
    source:
      id: ms-ai-for-beginners
      ref: quiz-122/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-003
    type: single
    difficulty: easy
    question: How does an RL training algorithm know how well it did?
    options:
      - text: It achieves high accuracy
      - text: Using perplexity metric
      - text: Using reward function
        correct: true
    explanation: |
      An RL agent's only feedback is reward. The reward function says how successful an attempt
      was; in a game it might be the final score [^1]. The agent's single objective is to
      maximize total reward over the long run, and it is never told which action would have been
      correct [^2]. That rules out accuracy, which needs known correct labels. Perplexity is a
      language-model metric that measures how well a model predicts the next token in a
      text [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#deep-reinforcement-learning
        locator: Lesson 22 "Deep Reinforcement Learning", introduction
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1; Sec. 1.3 Elements of Reinforcement Learning, p. 6
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#perplexity
        locator: Sec. 9.3.2 Perplexity
    source:
      id: ms-ai-for-beginners
      ref: quiz-222/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-004
    type: single
    difficulty: easy
    question: Which kinds of environment is RL applicable to?
    options:
      - text: Only discrete environments
      - text: Only continuous environments
      - text: Both discrete and continuous environments
        correct: true
    explanation: |
      RL works with both kinds of environment. The ML-for-Beginners lessons first apply
      Q-learning to a board world with discrete states, then to CartPole, whose state is a vector
      of real numbers [^1]. For a Q-table, a continuous state has to be discretized, for example
      into bins [^1]. Actions can likewise be discrete (a finite set of moves, as in Atari or Go)
      or continuous (real-valued, as in robot control or steering a car) [^2][^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#state-discretization
        locator: Reinforcement lesson 2 "CartPole Skating", introduction, section "State discretization" and Conclusion
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#action-space
        locator: Unit 1, "The Reinforcement Learning Framework", section "Action Space"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
        locator: Section "Action Spaces"
    source:
      id: ms-ai-for-beginners
      ref: quiz-222/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-005
    type: single
    difficulty: easy
    question: What is reinforcement learning?
    options:
      - text: teaching someone the same thing over and over again until they finally understand it
      - text: a learning technique that finds an agent's optimal behavior in an environment by running many experiments
        correct: true
      - text: a way of understanding how to run multiple experiments at once, in parallel
    explanation: |
      The lesson defines RL as a way to learn an agent's optimal behavior in an environment by
      running many experiments, with the goal set by a reward function [^1]. Sutton & Barto
      describe it as learning how to map situations to actions so as to maximize a numerical
      reward, finding good actions by trying them out [^2]. The other options leave out what
      makes it RL: an agent that chooses actions in order to earn reward [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#introduction
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Introduction"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 1
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-006
    type: single
    difficulty: easy
    question: What is a policy?
    options:
      - text: a function that returns the action at any given state
        correct: true
      - text: a function that returns the reward the agent receives in a given state
        why: That is the reward function, which scores the immediate outcome of a state.
      - text: a function that returns the total reward the agent can expect from a given state
        why: That is a value function, which estimates the long-run reward from a state onwards.
    explanation: |
      A policy is the agent's strategy: a function that returns the action to take in any given
      state [^1]. Formally it maps states to actions, or, for a stochastic policy, to the
      probability of choosing each action [^2]. The other options describe the two other core
      elements of an RL system. The reward function gives the immediate score of a state, and a
      value function estimates the total reward the agent can expect to collect from a state
      onwards [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#actions-and-policy
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Actions and policy"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.3 Elements of Reinforcement Learning, p. 6; Sec. 3.5 Policies and Value Functions, p. 58
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-007
    type: true_false
    difficulty: easy
    question: A reward function returns a score for each state of an environment.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      In the lesson the reward function gives every state a score: $-10$ for water or the wolf,
      $+10$ for the apple and $-0.1$ for an ordinary move, with higher numbers meaning better
      outcomes [^1]. The general MDP formulation is broader. The reward arrives after the agent
      acts in a state, so it can depend on the state, the action and the next state, as in
      $p(s', r \mid s, a)$ [^2]. Scoring states alone is the simpler special case the lesson uses.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#reward-function
        locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Reward function"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.1 The Agent–Environment Interface, Eqs. (3.1)–(3.2), pp. 47–48
    source:
      id: ms-ml-for-beginners
      ref: quiz-45/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-008
    type: true_false
    difficulty: easy
    question: Chess and Go are games with continuous states.
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Chess and Go are played on a board with fixed rules, and a position is one of a finite set
      of configurations. Their state is therefore discrete [^1]. A continuous state is described
      by real numbers, like CartPole's cart position and velocity, pole angle and rotation
      rate [^1]. Go's action space is discrete as well, since only a finite number of moves is
      available [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
        locator: Reinforcement lesson 2 "CartPole Skating", introduction and section "Exercise - initialize a cartpole environment"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
        locator: Section "Action Spaces"
    source:
      id: ms-ml-for-beginners
      ref: quiz-47/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-009
    type: single
    difficulty: easy
    question: What tool can we use to play out different scenarios of potential states in a game?
    options:
      - text: guess and check
      - text: simulation environments
        correct: true
      - text: state transition testing
    explanation: |
      RL needs an environment or simulator that enforces the rules of the game, where experiments
      can be run and their results observed [^1]. A simulation environment such as OpenAI Gym
      simulates anything from Atari games to the physics of pole balancing, so the agent can play
      out as many scenarios as it needs [^1][^2]. Guessing and checking by hand, or testing
      individual state transitions, cannot produce that volume of experience. The lesson's
      CartPole agent, for example, trains on 100,000 simulated episodes [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#openai-gym
        locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "OpenAI Gym"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#openai-gym
        locator: Reinforcement lesson 2 "CartPole Skating", section "OpenAI Gym"
    source:
      id: ms-ml-for-beginners
      ref: quiz-47/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-010
    type: single
    difficulty: easy
    question: Where do we define all possible actions in an environment?
    options:
      - text: methods
      - text: action space
        correct: true
      - text: action list
    explanation: |
      Each Gym environment defines an action space, which lists the possible actions, and an
      observation space, which describes what the agent receives. For CartPole the action space
      is discrete, with just two actions, left and right [^1]. In general, the action space is the
      set of all actions available in an environment, and it can be discrete or continuous [^2].
      "Methods" and "action list" are not the standard terms.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#exercise---initialize-a-cartpole-environment
        locator: Reinforcement lesson 2 "CartPole Skating", section "Exercise - initialize a cartpole environment"
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#action-space
        locator: Unit 1, "The Reinforcement Learning Framework", section "Action Space"
    source:
      id: ms-ml-for-beginners
      ref: quiz-48/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: rl-basics-011
    type: short_answer
    difficulty: easy
    question: |
      What is Reinforcement Learning? Complete the definition. Reinforcement learning is a framework
      for solving control tasks (decision problems) by building {{1}} that learn from the
      environment by interacting with it through {{2}} and receiving {{3}} (positive or negative) as
      their only feedback.
    answer:
      blanks:
        - accept:
            - agents
            - agent
          hint: one word
        - accept:
            - trial and error
            - trial-and-error
          hint: three words
        - accept:
            - rewards
            - reward
          hint: one word
    explanation: |
      RL differs from supervised learning, because the learner is never shown labeled examples of
      the correct action, and from unsupervised learning, because it maximizes a reward signal rather
      than looking for hidden structure. That makes it a third paradigm, whose two most distinctive
      features are trial-and-error search and delayed reward [^1]. The course's picture is a child
      handed a game they have never played, who improves with no supervision just by noticing which
      actions earn points and which lose them [^2].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, pp. 1–2
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/what-is-rl#the-big-picture
        locator: Unit 1, "What is Reinforcement Learning?", sections "The big picture" and "A formal definition"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-012
    type: single
    difficulty: easy
    question: |
      Complete the RL loop. At every step:

      - Our Agent receives ______ from the environment
      - Based on that ______ the Agent takes an ______ (in a platform game, for example, it moves to the right)
      - The Environment goes to a ______
      - The Environment gives a ______ to the Agent

      Which list fills the five blanks, in order?
    options:
      - text: an action $A_0$, action $A_0$, state $S_0$, state $S_1$, reward $R_1$
        why: The environment hands the agent a state, not an action. The agent receives $S_0$ and then chooses the action $A_0$ itself.
      - text: state $S_0$, state $S_0$, action $A_0$, new state $S_1$, reward $R_1$
        correct: true
      - text: a state $S_0$, state $S_0$, action $A_0$, state $S_1$, action $A_1$
        why: The last thing the environment gives the agent is a reward $R_1$. Actions such as $A_1$ only ever come from the agent.
    explanation: |
      The loop starts with the environment giving the agent a state $S_0$, for example the first
      frame of the game. From that state the agent picks an action $A_0$ (move right). The
      environment then moves to a new state $S_1$ and gives the agent a reward $R_1$ [^1].
      Repeating this produces the trajectory $S_0, A_0, R_1, S_1, A_1, R_2, \dots$ [^2]. The
      other options go wrong because the agent receives a state, not an action, and the
      environment returns a reward; actions only ever come from the agent.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#the-rl-process
        locator: Unit 1, "The Reinforcement Learning Framework", section "The RL Process"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.1 The Agent–Environment Interface, Fig. 3.1 and Eq. (3.1), pp. 47–48
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-013
    type: multiple
    difficulty: easy
    question: What's the difference between a state and an observation?
    options:
      - text: The state is a complete description of the state of the world (there is no hidden information)
        correct: true
      - text: The state is a partial description of the state
        why: That describes an observation. A state is complete.
      - text: The observation is a complete description of the state of the world (there is no hidden information)
        why: That is the definition of a state. An observation can leave information out.
      - text: The observation is a partial description of the state
        correct: true
      - text: We receive a state when we play in a chess environment
        correct: true
      - text: We receive an observation when we play in a chess environment
        why: The whole chessboard is visible, so the environment is fully observed and we receive a state.
      - text: We receive a state when we play Super Mario Bros
        why: We only see the part of the level close to the player, so we receive an observation.
      - text: We receive an observation when we play Super Mario Bros
        correct: true
    explanation: |
      A state is a complete description of the world, with no hidden information. An observation is
      a partial description that may leave some information out [^1][^2]. In chess the whole board
      is visible, so the environment is fully observed and the agent receives a state. In Super Mario
      Bros only the part of the level near the player is on screen, so the environment is partially
      observed and the agent receives an observation [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#obs-space
        locator: Unit 1, "The Reinforcement Learning Framework", section "Observations/States Space"
      - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
        url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#states-and-observations
        locator: Section "States and Observations"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-014
    type: multiple
    difficulty: easy
    question: A task is an instance of a Reinforcement Learning problem. What are the two types of tasks?
    options:
      - text: Episodic
        correct: true
      - text: Recursive
      - text: Adversarial
      - text: Continuing
        correct: true
    explanation: |
      An episodic task has a starting point and a terminal state, so the interaction breaks into
      episodes, each a list of states, actions, rewards and new states. In Super Mario Bros an
      episode starts when a level is launched and ends when Mario is killed or reaches the end of the
      level [^1]. A continuing task has no terminal state and runs until we stop it, like an agent
      that trades stocks automatically [^1]. Sutton & Barto draw the same line between episodic and
      continuing tasks [^2]. "Recursive" and "adversarial" are not task types in this
      classification.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/tasks
        locator: Unit 1, "Type of tasks" (Episodic task; Continuing tasks)
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.3 Returns and Episodes, p. 54
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-015
    type: short_answer
    difficulty: easy
    question: |
      What is the exploration/exploitation trade-off? Complete the description. An RL agent must
      balance {{1}}, trying random actions to find more information about the environment, against
      {{2}}, using what it already knows to maximize the reward.
    answer:
      blanks:
        - accept:
            - exploration
            - exploring
            - explore
          hint: one word
        - accept:
            - exploitation
            - exploiting
            - exploit
          hint: one word
    explanation: |
      Neither side works alone: an agent that only exploits can settle on a small nearby reward and
      never find a much larger one further away, like the mouse in the course's cheese maze [^2].
      Learning to act well means trying many actions and gradually favoring the ones that look best,
      and on a stochastic task each action has to be tried many times before its estimated reward is
      reliable [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 3
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/exp-exp-tradeoff
        locator: Unit 1, "The Exploration/Exploitation trade-off"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-016
    type: short_answer
    difficulty: easy
    question: |
      What is a policy? Complete the description. The policy $\pi$ is the agent's brain: the
      function that, given the {{1}} the agent is in, tells it which {{2}} to take. A {{3}} policy
      always returns the same action for a given state, while a {{4}} policy outputs a probability
      distribution over actions, $\pi(a \mid s)$.
    answer:
      blanks:
        - accept:
            - state
            - observation
          hint: one word
        - accept:
            - action
          hint: one word
        - accept:
            - deterministic
          hint: one word
        - accept:
            - stochastic
            - probabilistic
          hint: one word
    explanation: |
      The policy defines how the agent behaves at a given time, and training aims to find the
      optimal policy $\pi^*$, the one that maximizes expected return [^1]. Sutton & Barto define a
      policy formally as a mapping from states to probabilities of selecting each action, so
      $\pi(a \mid s)$ is the probability of taking $a$ in $s$; a deterministic policy is the special
      case that puts all probability on one action [^2][^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/two-methods#policy
        locator: "Unit 1, \"Two main approaches for solving RL problems\", sections \"The Policy π: the agent's brain\" and \"Policy-Based Methods\""
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, p. 58
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-017
    type: short_answer
    difficulty: easy
    question: |
      What are value-based methods? Complete the description. Instead of training a policy,
      value-based methods train a {{1}} function that outputs, for each state, the expected {{2}}
      if the agent starts in that state and then follows the policy. The policy itself is not
      trained: it is a simple pre-specified rule, such as {{3}} action selection, that picks actions
      from the learned values.
    answer:
      blanks:
        - accept:
            - value
            - state-value
            - state value
          hint: one word
        - accept:
            - return
            - discounted return
            - cumulative reward
            - cumulative discounted reward
            - value
          hint: one word
        - accept:
            - greedy
            - epsilon-greedy
            - ε-greedy
            - e-greedy
          hint: one word
    explanation: |
      The value of a state is the expected discounted return from starting there and then following
      the policy [^2]. In value-based methods the policy is a fixed rule, such as greedy or
      epsilon-greedy, that picks actions from the learned values, so finding the optimal value
      function gives the optimal policy [^1]. The value function can be defined over states ($V$)
      or over state–action pairs ($Q$) [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, Eq. (3.12), p. 58
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q7
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-018
    type: short_answer
    difficulty: easy
    question: |
      What are policy-based methods? Complete the description. Policy-based methods learn the {{1}}
      function directly, with no value function needed to choose actions. It maps each state to the
      best action, or to a {{2}} distribution over the possible actions. Its parameters $\theta$ are
      tuned by gradient {{3}} to maximize the expected return $J(\theta)$.
    answer:
      blanks:
        - accept:
            - policy
          hint: one word
        - accept:
            - probability
          hint: one word
        - accept:
            - ascent
          hint: one word
    explanation: |
      Usually the policy is parameterized, for example as a neural network $\pi_\theta(a \mid s)$
      that outputs a probability distribution over actions, and $\theta$ is tuned by gradient ascent
      on the expected return $J(\theta)$ [^1]. It is ascent rather than descent because the objective
      is a return to maximize, not a loss to minimize [^1]. A value function can still help learn
      $\theta$, but it is not needed to select actions [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#value-based-policy-based-and-actor-critic-methods
        locator: Unit 4, "What are the policy-based methods?", section "Value-based, Policy-based, and Actor-critic methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Ch. 13 introduction, p. 321
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q8
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: draft
  - id: rl-basics-019
    type: single
    difficulty: easy
    question: |
      RL environments built in a game engine (for example with Unity ML-Agents) can give the agent
      its observation in two ways: as rendered **frames** or as **raycasts**. What is the
      difference?
    options:
      - text: Frames give the agent the pixels of the rendered screen; raycasts are lines cast from the agent that report which objects they hit
        correct: true
      - text: Frames give the agent the pixels of the rendered screen; raycasts send only a random sample of those pixels to save memory
        why: Raycasts have nothing to do with pixels. They are lines projected into the scene, like lasers, that detect collisions with objects.
      - text: Raycasts give the agent the pixels of the rendered screen; frames are lines cast from the agent that report which objects they hit
        why: It is the other way round. Frames are the screen pixels; raycasts are the lines that detect collisions.
      - text: Both give the agent pixels; raycasts simply render the same screen at a much lower resolution
        why: A raycast observation contains no image at all, only what each ray collided with.
    explanation: |
      A frame-based observation is the rendered image, so the agent perceives the environment
      through the pixels of the screen [^1]. A raycast is instead a line projected from the agent,
      best thought of as a laser, that detects whether it passes through an object: the
      SnowballTarget agent observes the world through several sets of raycasts (plus a "can I
      shoot" flag) rather than through vision [^1], and the Pyramids agent uses 148 raycasts that
      detect the switch, bricks, the golden brick and walls [^2]. Raycasts therefore do not sample
      or downscale pixels, and the reversed pairing mixes up which observation is which.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit5/snowball-target#the-observation-space
        locator: Unit 5, The SnowballTarget environment, sec. The observation space
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit5/pyramids#the-observation-space
        locator: Unit 5, The Pyramids environment, sec. The observation space
    source:
      id: hf-deep-rl-course
      ref: unit5/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit5/quiz
    status: draft
  - id: rl-basics-020
    type: single
    difficulty: easy
    question: Instead of a labelled dataset, what does reinforcement learning need in order to train an agent?
    options:
      - text: An environment, often a simulator, to act in and a reward function that scores the outcome
        correct: true
      - text: A dataset of game states, each labelled by an expert with the correct action to take in it
      - text: A large unlabelled dataset whose examples are grouped into clusters
      - text: A fixed test set on which accuracy is measured after every move
    explanation: |
      Supervised learning relies on a dataset with known outcomes, while RL learns by doing [^1]. It
      needs an environment or simulator that sets the rules and lets us run experiments and observe the
      results, and a reward function that says how successful an experiment was, e.g. the final score of
      a game [^1]. RL is not told the correct action for each state; often it only learns whether it won
      at the end of the game [^1], so labelled states, clusters and per-move accuracy do not fit.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md
        locator: 'Lesson: Deep Reinforcement Learning, introduction'
    source:
      id: ms-ai-for-beginners
      ref: quiz-122/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: draft
  - id: rl-basics-021
    type: single
    difficulty: easy
    question: In the classic CartPole reinforcement-learning environment, what must the agent learn to do?
    options:
      - text: Drive an under-powered car up a steep hill by building momentum
      - text: Fire a lander's engines so that it touches down gently on a landing pad
      - text: Push a cart left or right to keep a pole balanced upright on it
        correct: true
    explanation: |
      In CartPole a pole is attached by an unpowered joint to a cart that moves along a track, and
      the agent pushes the cart left or right to keep the pole balanced upright [^1][^2]. Its state
      is continuous: four real numbers for the cart's position and velocity and the pole's angle and
      angular velocity, which is why the lesson discretizes it before it can use a Q-table [^1][^2].
      Reaching the top of a hill by accelerating back and forth is Mountain Car [^3], and landing a
      rocket on a pad is Lunar Lander [^4].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
        locator: 'Lesson: CartPole skating, secs. Introduction and State discretization'
