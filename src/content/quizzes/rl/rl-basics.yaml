      ref: quiz-122/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-22.json
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-021
    type: single
    difficulty: easy
    question: In the classic CartPole reinforcement-learning environment, what must the agent learn to do?
    options:
      - text: Drive an under-powered car up a steep hill by building momentum
        why: That is Mountain Car, where the car must rock back and forth to build up momentum [^3].
      - text: Fire a lander's engines so that it touches down gently on a landing pad
        why: That is Lunar Lander, where the agent fires the engines to land on the pad [^4].
      - text: Push a cart left or right to keep a pole balanced upright on it
        correct: true
    explanation: |
      In CartPole a pole is attached by an unpowered joint to a cart that moves along a track, and
      the agent pushes the cart left or right to keep the pole balanced upright [^1][^2]. Its state
      is continuous: four real numbers for the cart's position and velocity and the pole's angle and
      angular velocity, which is why ML-For-Beginners discretizes it before it can use a Q-table [^1][^2].
      Reaching the top of a hill by accelerating back and forth is Mountain Car [^3], and landing a
      rocket on a pad is Lunar Lander [^4].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
