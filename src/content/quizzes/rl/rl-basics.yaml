  - id: rl-basics-015
    type: short_answer
    difficulty: easy
    question: |
      What is the exploration/exploitation trade-off? Complete the description. An RL agent must
      balance {{1}}, trying random actions to find more information about the environment, against
      {{2}}, using what it already knows to maximize the reward.
    answer:
      blanks:
        - accept:
            - exploration
            - exploring
            - explore
          hint: one word
        - accept:
            - exploitation
            - exploiting
            - exploit
          hint: one word
    explanation: |
      Neither side works alone: an agent that only exploits can settle on a small nearby reward and
      never find a much larger one further away, like the mouse in the Hugging Face course's cheese maze [^2].
      Learning to act well means trying many actions and gradually favoring the ones that look best,
      and on a stochastic task each action has to be tried many times before its estimated reward is
      reliable [^1].
    references:
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 1.1 Reinforcement Learning, p. 3
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/exp-exp-tradeoff
        locator: Unit 1, "The Exploration/Exploitation trade-off"
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-016
    type: short_answer
    difficulty: easy
    question: |
      What is a policy? Complete the description. The policy $\pi$ is the agent's brain: the
      function that, given the {{1}} the agent is in, tells it which {{2}} to take. A {{3}} policy
      always returns the same action for a given state, while a {{4}} policy outputs a probability
      distribution over actions, $\pi(a \mid s)$.
    answer:
      blanks:
        - accept:
            - state
            - observation
          hint: one word
        - accept:
            - action
          hint: one word
        - accept:
            - deterministic
          hint: one word
        - accept:
            - stochastic
            - probabilistic
          hint: one word
    explanation: |
      The policy defines how the agent behaves at a given time, and training aims to find the
      optimal policy $\pi^*$, the one that maximizes expected return [^1]. Sutton & Barto define a
      policy formally as a mapping from states to probabilities of selecting each action, so
      $\pi(a \mid s)$ is the probability of taking $a$ in $s$; a deterministic policy is the special
      case that puts all probability on one action [^2][^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit1/two-methods#policy
        locator: "Unit 1, \"Two main approaches for solving RL problems\", sections \"The Policy π: the agent's brain\" and \"Policy-Based Methods\""
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, p. 58
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-017
    type: short_answer
    difficulty: easy
    question: |
      What are value-based methods? Complete the description. Instead of training a policy,
      value-based methods train a {{1}} function that outputs, for each state, the expected {{2}}
      if the agent starts in that state and then follows the policy. The policy itself is not
      trained: it is a simple pre-specified rule, such as {{3}} action selection, that picks actions
      from the learned values.
    answer:
      blanks:
        - accept:
            - value
            - state-value
            - state value
          hint: one word
        - accept:
            - return
            - discounted return
            - cumulative reward
            - cumulative discounted reward
            - value
          hint: one word
        - accept:
            - greedy
            - epsilon-greedy
            - ε-greedy
            - e-greedy
          hint: one word
    explanation: |
      The value of a state is the expected discounted return from starting there and then following
      the policy [^2]. In value-based methods the policy is a fixed rule, such as greedy or
      epsilon-greedy, that picks actions from the learned values, so finding the optimal value
      function gives the optimal policy [^1]. The value function can be defined over states ($V$)
      or over state–action pairs ($Q$) [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit2/two-types-value-based-methods
        locator: Unit 2, "Two types of value-based methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Sec. 3.5 Policies and Value Functions, Eq. (3.12), p. 58
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q7
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-018
    type: short_answer
    difficulty: easy
    question: |
      What are policy-based methods? Complete the description. Policy-based methods learn the {{1}}
      function directly, with no value function needed to choose actions. It maps each state to the
      best action, or to a {{2}} distribution over the possible actions. Its parameters $\theta$ are
      tuned by gradient {{3}} to maximize the expected return $J(\theta)$.
    answer:
      blanks:
        - accept:
            - policy
          hint: one word
        - accept:
            - probability
          hint: one word
        - accept:
            - ascent
          hint: one word
    explanation: |
      Usually the policy is parameterized, for example as a neural network $\pi_\theta(a \mid s)$
      that outputs a probability distribution over actions, and $\theta$ is tuned by gradient ascent
      on the expected return $J(\theta)$ [^1]. It is ascent rather than descent because the objective
      is a return to maximize, not a loss to minimize [^1]. A value function can still help learn
      $\theta$, but it is not needed to select actions [^2].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#value-based-policy-based-and-actor-critic-methods
        locator: Unit 4, "What are the policy-based methods?", section "Value-based, Policy-based, and Actor-critic methods"
      - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
        url: http://incompleteideas.net/book/RLbook2020.pdf
        locator: Ch. 13 introduction, p. 321
    source:
      id: hf-deep-rl-course
      ref: unit1/quiz#q8
      url: https://huggingface.co/learn/deep-rl-course/unit1/quiz
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-019
    type: single
    difficulty: easy
    question: |
      RL environments built in a game engine (for example with Unity ML-Agents) can give the agent
      its observation in two ways: as rendered **frames** or as **raycasts**. What is the
      difference?
    options:
      - text: Frames give the agent the pixels of the rendered screen; raycasts are lines cast from the agent that report which objects they hit
        correct: true
      - text: Frames give the agent the pixels of the rendered screen; raycasts send only a random sample of those pixels to save memory
        why: Raycasts have nothing to do with pixels. They are lines projected into the scene, like lasers, that detect collisions with objects.
      - text: Raycasts give the agent the pixels of the rendered screen; frames are lines cast from the agent that report which objects they hit
        why: It is the other way round. Frames are the screen pixels; raycasts are the lines that detect collisions.
      - text: Both give the agent pixels; raycasts simply render the same screen at a much lower resolution
        why: A raycast observation contains no image at all, only what each ray collided with.
    explanation: |
      A frame-based observation is the rendered image, so the agent perceives the environment
      through the pixels of the screen [^1]. A raycast is instead a line projected from the agent,
      best thought of as a laser, that detects whether it passes through an object: the
      SnowballTarget agent observes the world through several sets of raycasts (plus a "can I
      shoot" flag) rather than through vision [^1], and the Pyramids agent uses 148 raycasts that
      detect the switch, bricks, the golden brick and walls [^2]. Raycasts therefore do not sample
      or downscale pixels, and the reversed pairing mixes up which observation is which.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit5/snowball-target#the-observation-space
        locator: Unit 5, The SnowballTarget environment, sec. The observation space
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit5/pyramids#the-observation-space
        locator: Unit 5, The Pyramids environment, sec. The observation space
    source:
      id: hf-deep-rl-course
      ref: unit5/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit5/quiz
    status: reviewed
    reviewed_by: claude
  - id: rl-basics-020
    type: single
    difficulty: easy
    question: Instead of a labelled dataset, what does reinforcement learning need in order to train an agent?
    options:
      - text: An environment, often a simulator, to act in and a reward function that scores the outcome
        correct: true
      - text: A dataset of game states, each labelled by an expert with the correct action to take in it
        why: That is supervised learning; an RL agent is never told the correct action and often learns only whether it won at the end [^1].
      - text: A large unlabelled dataset whose examples are grouped into clusters
        why: Grouping unlabelled examples into clusters is unsupervised learning; RL learns from the rewards it earns by acting [^1].
      - text: A fixed test set on which accuracy is measured after every move
        why: Accuracy needs known correct answers; RL judges its actions by the reward the environment gives [^1].
    explanation: |
      Supervised learning relies on a dataset with known outcomes, while RL learns by doing [^1]. It
      needs an environment or simulator that sets the rules and lets us run experiments and observe the
      results, and a reward function that says how successful an experiment was, e.g. the final score of
      a game [^1]. RL is not told the correct action for each state; often it only learns whether it won
      at the end of the game [^1], so labelled states, clusters and per-move accuracy do not fit.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md
        locator: 'Lesson: Deep Reinforcement Learning, introduction'
    source:
