        locator: Sec. 14.11.5 Prediction
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fcn.html#initializing-transposed-convolutional-layers
        locator: Sec. 14.11.2 Initializing Transposed Convolutional Layers
