  - id: segmentation-004
    type: single
    difficulty: easy
    question: |
      A photo shows three sheep on a meadow. Which task labels every pixel and also tells the three
      sheep apart as separate objects, instead of giving all sheep pixels one "sheep" class?
    options:
      - text: Instance segmentation
        correct: true
      - text: Semantic segmentation
        why: It labels every pixel but gives all sheep one "sheep" class, without telling the three animals apart [^1].
      - text: Object detection with bounding boxes
        why: It separates the sheep, but with rectangles rather than a label for every pixel [^1].
      - text: Image classification
        why: It gives one label to the whole image, with neither pixel labels nor separate objects.
    explanation: |
      Segmentation classifies every pixel. Semantic segmentation only gives each pixel its class and
      does not separate objects of the same class, so all sheep get one label; instance segmentation
      also divides a class into its individual instances [^1]. Object detection locates objects with
      bounding boxes rather than pixel masks [^1], and image classification gives one label for the
      whole image.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
        locator: 'Lesson: Segmentation, introduction'
    source:
      id: ms-ai-for-beginners
      ref: quiz-112/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-12.json
    status: reviewed
    reviewed_by: claude
  - id: segmentation-005
    type: single
    difficulty: medium
    question: A segmentation network outputs, for every pixel, scores for each class. Which loss is normally used to train it?
    options:
      - text: Cross-entropy averaged over all pixels (binary cross-entropy for a two-class mask)
        correct: true
      - text: Mean squared error between the predicted mask image and the target mask image, pixel by pixel
        why: MSE compares two images, as in an autoencoder; a mask holds class numbers, so a classification loss is used [^1].
      - text: Intersection over Union between predicted and true bounding boxes
        why: Bounding-box IoU belongs to object detection; a segmentation network predicts a class per pixel, not boxes [^2].
      - text: The 0-1 loss of the single most likely class for the whole image
        why: One label for the whole image is image classification, not segmentation.
    explanation: |
      Segmentation is pixel classification: each pixel of the target mask holds a class number,
      one-hot encoded along the channel dimension, so a classification loss is used, cross-entropy
      averaged over all pixels, or binary cross-entropy when the mask is binary [^1]. Mean squared
      error is what a classical autoencoder uses to compare two images [^1]. IoU compares bounding
      boxes in object detection [^2], and one label for the whole image would be image
      classification.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
        locator: 'Lesson: Segmentation, introduction (loss function)'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#intersection-over-union
        locator: 'Lesson: Object Detection, sec. Intersection over Union'
    source:
      id: ms-ai-for-beginners
      ref: quiz-112/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-12.json
    status: reviewed
    reviewed_by: claude
  - id: segmentation-006
    type: single
    difficulty: medium
    question: |
      A plain encoder–decoder for segmentation, such as a basic SegNet, uses convolutions and pooling
      in the encoder and convolutions with upsampling in the decoder. The pooling reduces the spatial
      resolution, so the decoder cannot restore pixel positions accurately. What does U-Net add to
      fix this?
    options:
      - text: Skip connections that pass the encoder's feature maps at each level to the decoder at the same level
        correct: true
      - text: Batch normalization after each convolution, so that the deep encoder-decoder network can be trained at all
        why: Batch normalization is already used in such encoder–decoders to train the deep network; it does not bring back spatial detail [^1].
      - text: A fully connected head that predicts a bounding box for each object
        why: Bounding boxes belong to object detection; a segmentation mask needs a class for every pixel [^2].
      - text: More pooling layers in the decoder, so the mask is produced at a lower resolution
        why: More pooling would lower the resolution further; the decoder must upsample to the input's size [^2].
    explanation: |
      A plain encoder–decoder uses convolutions and pooling in the encoder and convolutions with
      upsampling in the decoder; the pyramid encoder reduces the spatial accuracy of the features, so
      the decoder cannot reconstruct pixel positions correctly [^1]. U-Net adds skip connections
      between encoder and decoder layers at each level, so the decoder does not lose the information
      from the original input at that level [^1]. Batch normalization is already part of such a
      network, where it lets the multi-layer network train [^1]. A segmentation mask has the input's
      size, so the decoder upsamples rather than pooling further, and bounding boxes belong to object
      detection [^2]. The original SegNet softens the problem in another way: its decoder upsamples
      with the max-pooling indices saved by the encoder [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/SemanticSegmentationPytorch.ipynb
        locator: Semantic Segmentation (PyTorch notebook), secs. SegNet and U-Net
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
        locator: 'Lesson: Segmentation, introduction'
      - title: 'Badrinarayanan, Kendall & Cipolla (2017), SegNet: A Deep Convolutional Encoder-Decoder Architecture for Image Segmentation'
        url: https://arxiv.org/abs/1511.00561
        locator: Abstract
    source:
      id: ms-ai-for-beginners
      ref: quiz-212/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-12.json
    status: reviewed
    reviewed_by: claude
  - id: segmentation-007
    type: multiple
    difficulty: medium
    tags:
      - semantic-segmentation
      - data-augmentation
      - label-maps
    question: |
      You reuse image-classification augmentations to train a semantic segmentation model, where every
      pixel has a class label. Which statements are correct? Select all that apply.
    options:
      - text: Random cropping cannot be used, because a crop would cut objects at its border
        why: d2l uses random cropping for segmentation, cutting the same area from the image and from its label map [^1].
      - text: A random horizontal flip must be applied to the label map too, with the same random draw
        correct: true
      - text: Resizing a random crop with bilinear interpolation is just as safe for the label map as for the image
        why: Interpolating class indices creates values between classes, for example class 2 at a border between classes 1 and 3; d2l avoids rescaling and crops to a fixed size instead [^1].
      - text: Color jitter (brightness, contrast, hue) can be applied to the input image alone
        correct: true
    explanation: |
      d2l avoids rescaling for segmentation, because the predicted pixel classes would have to be
      rescaled back to the original image, which can be inaccurate at class borders; it crops the same
      fixed-size area from the input image and from the label map instead [^1]. The label map holds class
      indices, which must not be averaged, so any resizing of labels has to use nearest-neighbour
      interpolation. Color changes leave pixel positions untouched, so the labels stay valid, while
      geometric augmentations such as flips and crops must transform image and labels identically [^2].
    references:
      - source: d2l
        locator: Sec. 14.9.2.1 Data Preprocessing
        url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html#data-preprocessing
      - source: d2l
        locator: Sec. 14.1.1 Common Image Augmentation Methods
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#common-image-augmentation-methods
      - source: d2l
        locator: Sec. 14.9.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/semantic-segmentation-and-dataset#ex2
      url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: segmentation-008
    type: short_answer
    difficulty: medium
    tags:
      - transposed-convolution
      - convolution-as-matrix
    question: |
      `X = torch.arange(9.0).reshape(3, 3)` and `K = torch.tensor([[1.0, 2.0], [3.0, 4.0]])`.
      Cross-correlation gives `Y = corr2d(X, K) = [[27, 37], [57, 67]]`. A transposed convolution with
      the same kernel then gives `Z = trans_conv(Y, K)`, which has the same $3 \times 3$ shape as `X`.
      What is `Z[1, 1]`, the center entry (where `X[1, 1] = 4`)?
    answer:
      numeric: 400
      tolerance: 0
      hint: a whole number
      model: $27 \cdot 4 + 37 \cdot 3 + 57 \cdot 2 + 67 \cdot 1 = 400$
    explanation: |
      A transposed convolution broadcasts each input value through the kernel: `Y[i, j] * K` is added to
      the $2 \times 2$ block of the output starting at $(i, j)$ [^1]. The center $(1, 1)$ lies in all four
      blocks, at kernel positions $(1, 1)$, $(1, 0)$, $(0, 1)$ and $(0, 0)$, so
      $Z_{1,1} = 27 \cdot 4 + 37 \cdot 3 + 57 \cdot 2 + 67 \cdot 1 = 400$. In matrix form the convolution
      is $\mathbf{y} = \mathbf{W}\mathbf{x}$ with a $4 \times 9$ matrix $\mathbf{W}$, and the transposed
      convolution computes $\mathbf{W}^\top \mathbf{y} = \mathbf{W}^\top \mathbf{W}\mathbf{x}$ [^2]. It
      restores the shape of `X`, not its values: $\mathbf{W}$ has no inverse.
    references:
      - source: d2l
        locator: Sec. 14.10.1 Basic Operation
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#basic-operation
      - source: d2l
        locator: Sec. 14.10.3 Connection to Matrix Transposition
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#connection-to-matrix-transposition
      - source: d2l
        locator: Sec. 14.10.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/transposed-conv#ex1
      url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: segmentation-009
    type: short_answer
    difficulty: medium
    tags:
      - convolution-as-matrix
      - sparsity
      - efficiency
    question: |
      A convolution can be written as $\mathbf{y} = \mathbf{W}\mathbf{x}$, where $\mathbf{x}$ is the
      flattened input and each row of $\mathbf{W}$ holds the kernel weights for one output position and
      zeros elsewhere. For a $32 \times 32$ single-channel input and a $3 \times 3$ kernel (stride 1, no
      padding), $\mathbf{W}$ has $900 \times 1024$ entries. What percentage of them are nonzero?
    answer:
      numeric: 0.879
      tolerance: 0.01
      hint: a percentage, 2 decimals (e.g. 1.25)
      model: Each row has 9 nonzeros out of 1024, so $9/1024 \approx 0.88\%$.
    explanation: |
      d2l builds exactly such a sparse weight matrix with many zeros to explain transposed
      convolutions [^1]. Storing $\mathbf{W}$ densely means $921\,600$ numbers and as many
      multiplications per example, while a direct convolution needs 9 weights and $900 \times 9 = 8100$
      multiplications, so more than 99% of the dense work multiplies by zero, and the waste grows with
      the square of the image size. Practical libraries therefore never form $\mathbf{W}$; when they use
      matrix multiplication, they copy the input windows into a matrix instead (im2col) [^2].
    references:
      - source: d2l
        locator: Sec. 14.10.3 Connection to Matrix Transposition
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#connection-to-matrix-transposition
      - title: 'CS231n notes: Convolutional Neural Networks'
        locator: Convolutional Layer, Implementation as Matrix Multiplication
        url: https://cs231n.github.io/convolutional-networks/#conv
      - source: d2l
        locator: Sec. 14.10.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/transposed-conv#ex2
      url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: segmentation-010
    type: single
    difficulty: medium
    tags:
      - instance-segmentation
      - semantic-segmentation
      - mask-r-cnn
      - u-net
    shuffle: false
    question: |
      A colleague writes: "Segmentation predicts masks and does not tell objects of the same class
      apart; typical architectures are Mask R-CNN and U-Net." What is wrong with this claim?
    options:
      - text: Neither model predicts pixel masks; both of them output only bounding boxes
        why: Both output pixel masks; bounding boxes alone are object detection.
      - text: Mask R-CNN predicts one mask per detected object, so it does tell instances apart
        correct: true
      - text: Nothing; both models output a single class map and never separate object instances
        why: Mask R-CNN predicts a separate mask for every detected box, which is exactly how it separates instances [^2].
      - text: U-Net is the model that separates instances, while Mask R-CNN only labels pixels by class
        why: It is the other way around; U-Net outputs one class score map per pixel [^3].
    explanation: |
      Semantic segmentation gives every pixel a class, so two dogs share one "dog" region; instance
      segmentation must also say which dog each pixel belongs to [^1]. Mask R-CNN adds a mask branch
      to the Faster R-CNN detector and predicts one mask per detected object, so it does instance
      segmentation [^2]. U-Net is an encoder–decoder that outputs a per-pixel class map, i.e. semantic
      segmentation [^3].
    references:
      - source: d2l
        locator: Sec. 14.9.1 Image Segmentation and Instance Segmentation
        url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html#image-segmentation-and-instance-segmentation
      - title: He, Gkioxari, Dollár & Girshick (2017), Mask R-CNN, arXiv:1703.06870
        url: https://arxiv.org/abs/1703.06870
        locator: Abstract and Sec. 3 Mask R-CNN
      - title: Ronneberger, Fischer & Brox (2015), U-Net, arXiv:1505.04597
        url: https://arxiv.org/abs/1505.04597
        locator: Sec. 2 Network Architecture
    source:
      id: ds-interviews
      ref: theory.md#q118
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#neural-networks-for-computer-vision
    status: reviewed
    reviewed_by: claude
  - id: segmentation-011
    type: short_answer
    difficulty: medium
    tags:
      - metrics
      - iou
      - mean-iou
      - confusion-matrix
    question: |
      A 3-class segmentation model is evaluated on 120 pixels. Entry $n_{ij}$ counts the pixels of
      true class $i$ (row) that were predicted as class $j$ (column).

      | true \ predicted | background | cat | dog |
      | --- | --- | --- | --- |
      | **background** | 50 | 6 | 4 |
      | **cat** | 5 | 21 | 4 |
      | **dog** | 3 | 7 | 20 |

      What is the mean IoU, the intersection over union averaged over the three classes?
    answer:
      numeric: 0.5833
      tolerance: 0.005
      hint: a number between 0 and 1, 2 decimals
      model: $\frac{1}{3}\left(\frac{50}{68} + \frac{21}{43} + \frac{20}{38}\right) \approx \frac{1}{3}(0.735 + 0.488 + 0.526) \approx 0.58$
    explanation: |
      For class $i$ the intersection is $n_{ii}$, and the union is every pixel that is class $i$ in
      the ground truth or in the prediction: row sum + column sum $- \, n_{ii}$ [^1][^2]. Background
      gives $50/(60 + 58 - 50) = 50/68$, cat $21/(30 + 34 - 21) = 21/43$ and dog
      $20/(30 + 28 - 20) = 20/38$; their mean is about 0.58. Pixel accuracy is higher,
      $91/120 \approx 0.76$, because mean IoU weighs every class equally and counts both false
      positives and false negatives [^1].
    references:
      - title: Long, Shelhamer & Darrell (2015), Fully Convolutional Networks for Semantic Segmentation
        url: https://arxiv.org/abs/1411.4038
        locator: Sec. 5 Results, Metrics (pixel accuracy, mean accuracy, mean IU)
      - title: 'Wikipedia: Jaccard index'
        url: https://en.wikipedia.org/wiki/Jaccard_index#Overview
        locator: Introduction and Overview
    source:
      id: original
      ref: segmentation-011
    status: reviewed
    reviewed_by: claude
  - id: segmentation-012
    type: short_answer
    difficulty: hard
    tags:
      - metrics
      - dice
      - iou
      - jaccard
    question: |
      For one object, the predicted mask $X$ and the ground-truth mask $Y$ have an IoU (Jaccard index)
      of $J = 0.6$. What is their Dice coefficient $D = \frac{2|X \cap Y|}{|X| + |Y|}$?
    answer:
      numeric: 0.75
      tolerance: 0.005
      hint: a number between 0 and 1, 2 decimals
      model: $D = \frac{2J}{1 + J} = \frac{1.2}{1.6} = 0.75$
    explanation: |
      With $I = |X \cap Y|$, the union is $|X| + |Y| - I$, so $J = \frac{I}{|X| + |Y| - I}$ [^2] and
      $D = \frac{2I}{|X| + |Y|}$ [^1]. Eliminating the sizes gives $D = \frac{2J}{1 + J}$ and
      $J = \frac{D}{2 - D}$ [^1]. For example, $I = 60$ and $|X| + |Y| = 160$ give $J = 60/100 = 0.6$
      and $D = 120/160 = 0.75$. Dice is never below IoU (they are equal only at 0 and 1), and since
      the conversion is increasing, both rank the masks of a single object in the same order.
    references:
      - title: 'Wikipedia: Sørensen–Dice coefficient'
        url: https://en.wikipedia.org/wiki/S%C3%B8rensen%E2%80%93Dice_coefficient#Difference_from_Jaccard
        locator: Formula and Difference from Jaccard
      - title: 'Wikipedia: Jaccard index'
        url: https://en.wikipedia.org/wiki/Jaccard_index#Overview
        locator: Introduction and Overview
    source:
      id: original
      ref: segmentation-012
    status: reviewed
    reviewed_by: claude
  - id: segmentation-013
    type: short_answer
    difficulty: medium
    tags:
      - fcn
      - transposed-convolution
      - output-shape
      - code-reading
    question: |
      An FCN upsamples its backbone's feature map with a transposed convolution. For a
      $480 \times 640$ input image, the ResNet-18 backbone and the $1 \times 1$ convolution give a
      $15 \times 20$ map with 21 class channels.

      ```python
      import torch
      from torch import nn

      conv_trans = nn.ConvTranspose2d(21, 21, kernel_size=64, padding=16, stride=32)
      X = torch.rand(1, 21, 15, 20)
      print(conv_trans(X).shape)
      ```

      What is the last number printed, the output width?
    answer:
      numeric: 640
      tolerance: 0
      hint: a whole number
      model: $(20 - 1) \cdot 32 - 2 \cdot 16 + (64 - 1) + 1 = 640$
    explanation: |
      For a transposed convolution with dilation 1 and no output padding, the output width is
      $(W_{in} - 1) \cdot s - 2p + (k - 1) + 1$ [^1], here $608 - 32 + 64 = 640$. In general, stride
      $s$, padding $s/2$ and kernel $2s$ multiply height and width by exactly $s$ [^2], so the map
      returns to $480 \times 640$, the input size, and its 21 channels hold the class scores of each
      pixel [^2]. Padding in a transposed convolution removes rows and columns from the output
      instead of adding them to the input [^3].
    references:
      - title: 'PyTorch documentation: torch.nn.ConvTranspose2d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html
        locator: Shape (formula for H_out and W_out)
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fcn.html#the-model
        locator: Sec. 14.11.1 The Model
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html#padding-strides-and-multiple-channels
        locator: Sec. 14.10.2 Padding, Strides, and Multiple Channels
