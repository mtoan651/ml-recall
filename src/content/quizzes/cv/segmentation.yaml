      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-12.json
    status: draft
  - id: segmentation-002
    type: single
    difficulty: easy
    question: ____ extracts features from an input image
    options:
      - text: decoder
      - text: generator
      - text: encoder
        correct: true
    explanation: |
      The encoder is the first half of a segmentation network. It reads the input image and
      compresses it into feature maps [^1]. In U-Net this is the contracting path, which
      captures the image's context [^2]. The decoder works in the opposite direction, turning
      features into the output mask [^1]. A generator is a GAN component that turns a random
      vector into an image, so it does not extract features from an input image [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md#segmentation
        locator: Lesson 12 "Segmentation", introduction (Encoder / Decoder)
      - title: 'Ronneberger, Fischer & Brox (2015), U-Net: Convolutional Networks for Biomedical Image Segmentation'
        url: https://arxiv.org/abs/1505.04597
        locator: Abstract
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
        locator: Lesson 10 "Generative Adversarial Networks", vocabulary note (Generator / Discriminator)
    source:
