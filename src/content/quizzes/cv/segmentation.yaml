topic: segmentation
title: Segmentation
questions:
  - id: segmentation-001
    type: single
    difficulty: easy
    question: Segmentation networks consist of ____ and ____ parts
    options:
      - text: classifier, divider
      - text: encoder, decoder
        correct: true
      - text: generator, discriminator
    explanation: |
      Segmentation networks follow the same pattern as an autoencoder. An encoder extracts
      features from the image, and a decoder turns those features into a mask with the same size
      as the input and one channel per class [^1]. U-Net is the classic example: a contracting
      path captures context, and a symmetric expanding path recovers precise localization [^2].
      A fully convolutional network does the same, using transposed convolutions to bring the
      feature maps back to the input's height and width [^3]. A generator and a discriminator
      are the two parts of a GAN, not of a segmentation model [^4].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md#segmentation
        locator: Lesson 12 "Segmentation", introduction (Encoder / Decoder)
      - title: 'Ronneberger, Fischer & Brox (2015), U-Net: Convolutional Networks for Biomedical Image Segmentation'
        url: https://arxiv.org/abs/1505.04597
        locator: Abstract
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fcn.html#the-model
        locator: Sec. 14.11 Fully Convolutional Networks (introduction and 14.11.1 The Model)
      - source: d2l
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html
        locator: Sec. 20.1 Generative Adversarial Networks (introduction)
    source:
