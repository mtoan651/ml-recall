    reviewed_by: claude
  - id: segmentation-014
    type: multiple
    difficulty: medium
    tags:
      - fcn
      - transposed-convolution
      - bilinear-interpolation
      - transfer-learning
    question: |
      d2l builds a fully convolutional network (FCN) for semantic segmentation of Pascal VOC
      (21 classes) from a pretrained ResNet-18. Which statements about this network are true?
      Select all that apply.
    options:
      - text: Its transposed convolution starts as bilinear upsampling, not with random weights
        correct: true
      - text: Its input must be exactly $320 \times 480$, the image size used in training
        why: A fully convolutional network accepts other sizes. d2l only needs height and width to be multiples of 32 and crops other test images into such areas [^2].
      - text: It drops ResNet-18's global average pooling and fully connected layers
        correct: true
      - text: A $1 \times 1$ convolution turns the 512 feature channels into 21, one per class
        correct: true
      - text: Its output has a single channel holding each pixel's class index, so no argmax is needed
        why: The output has 21 channels holding the class predictions for the pixel at the same position; the predicted class is the argmax over the channels [^1][^2].
    explanation: |
      The FCN copies the pretrained ResNet-18 layers except the final global average pooling and
      fully connected layer, which a per-pixel output does not need [^1]. A $1 \times 1$ convolution
      maps the channels to the number of classes, and a transposed convolution with stride 32 brings
      the $1/32$-size map back to the input's height and width, so the channels at each position hold
      the class predictions for that input pixel [^1]. The transposed convolution is initialised as
      bilinear-interpolation upsampling, while the $1 \times 1$ convolution uses Xavier
      initialisation [^3]. At prediction time each pixel's class is the argmax over the channels [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fcn.html#the-model
        locator: Sec. 14.11.1 The Model
      - source: d2l
