  - id: cv-basics-013
    type: single
    difficulty: easy
    tags:
      - data-augmentation
      - random-crop
      - validation
    question: |
      For CIFAR-10 you build two datasets from the same images: the training set applies a random crop
      to every image each time it is loaded, while the validation set uses the images unchanged. Why
      is the augmentation left out of the validation set?
    options:
      - text: Validation must reflect the real, unaltered inputs; augmentation only regularizes training
        correct: true
      - text: Random crops on validation images would leak the labels into the model's inputs
        why: Cropping changes only pixels, never the label; the problem is that the evaluation would become noisy and unlike real inputs.
      - text: Augmented validation images would make the validation loss drop below the training loss
        why: Random changes usually make images harder, not easier; and the goal is a faithful estimate, not a particular loss value.
      - text: Data augmentation only works on tensors that require gradients, which validation data do not
        why: Augmentation is an input transformation and needs no gradients; it could be applied to any data.
    explanation: |
      Random crops show the model shifted versions of each training image, which discourages it from
      relying on exact pixel positions and reduces overfitting [^1]. The validation set is there to
      estimate performance on real inputs, so it uses deterministic preprocessing only; d2l likewise
      applies random augmentation to training images and only the deterministic conversion to test
      images [^1][^2]. With the augmentation, training accuracy usually rises more slowly while
      validation accuracy improves.
    references:
      - source: d2l
        locator: Sec. 14.1 Image Augmentation (introduction) and Sec. 14.1.2 Training with Image Augmentation
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#training-with-image-augmentation
      - source: mit-ocw-67960
        locator: Homework 1, CIFAR-10 Classification, Problems 14–15
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q14
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: draft
