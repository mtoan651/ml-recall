    reviewed_by: claude
  - id: cv-basics-015
    type: short_answer
    difficulty: easy
    tags:
      - data-augmentation
      - inference
    question: |
      At inference time, a face-recognition model is run on five augmented copies of each incoming image
      (a horizontal flip, small crops, a slight rotation), and the five predicted probability
      distributions are averaged. What is this technique called?
    answer:
      accept:
        - test-time augmentation
        - test time augmentation
        - test-time augmentations
        - TTA
        - test-time data augmentation
      hint: a three-word term or its acronym
      model: Test-time augmentation (TTA)
    explanation: |
      Data augmentation is usually applied only during training [^2], but the same transformations can
      be applied to test images, and averaging the predictions over the augmented copies is called
      test-time augmentation [^1]. AlexNet already did this, averaging the softmax outputs of ten
      patches (four corners and the centre, plus their horizontal reflections) [^3]. It costs one forward
      pass per copy.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-257, p. 286; Solution SOL-257, pp. 330–331
        url: https://arxiv.org/abs/2201.00650v2
