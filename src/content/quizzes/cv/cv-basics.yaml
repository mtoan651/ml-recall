title: Computer Vision Basics
questions:
  - id: cv-basics-001
    type: true_false
    difficulty: easy
    question: Optical flow helps us understand how each pixel moves from one video frame to the next.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Optical flow measures the apparent motion between two consecutive video frames: for a pixel
      (or object point) it estimates a displacement vector, i.e. where that point moved to in the
      next frame [^2]. The lesson uses it in exactly this way, to detect motion by seeing how
      individual pixels move from frame to frame [^1]. Its uses include video stabilization,
      compression and real-time tracking [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#examples-of-using-computer-vision
        locator: Lesson 6 "Introduction to Computer Vision", section "Examples of using Computer Vision" (Detecting motion using Optical Flow)
      - title: Optical Flow in OpenCV (C++/Python), LearnOpenCV (M. Kuklin)
        url: https://learnopencv.com/optical-flow-in-opencv/
        locator: Sections "What is Optical Flow?" and "Optical Flow applications"
    source:
      id: ms-ai-for-beginners
      ref: quiz-206/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-002
    type: single
    difficulty: easy
    question: _____ computes the vector field that shows where each pixel is moving
    options:
      - text: Sparse Optical Flow
      - text: Dense Optical Flow
        correct: true
      - text: Frame Differencing
    explanation: |
      Dense optical flow estimates a motion vector for every pixel, so its output is a full vector
      field over the frame [^1][^2]. Sparse optical flow instead tracks only a chosen set of
      distinctive points, such as corners found with the Shi–Tomasi detector and followed with
      Lucas–Kanade. It therefore says nothing about pixels outside that set [^2]. Frame
      differencing subtracts two consecutive frames: the difference shows how much each pixel
      changed, which is enough to detect that something moved, but it gives no direction of
      motion, so it is not a vector field [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#examples-of-using-computer-vision
        locator: Lesson 6 "Introduction to Computer Vision", section "Examples of using Computer Vision" (Dense vs. Sparse Optical Flow)
      - title: Optical Flow in OpenCV (C++/Python), LearnOpenCV (M. Kuklin)
        url: https://learnopencv.com/optical-flow-in-opencv/
        locator: Sections "Sparse and Dense Optical Flow", "Sparse Optical Flow" and "Dense Optical Flow"
    source:
      id: ms-ai-for-beginners
      ref: quiz-206/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-003
    type: multiple
    difficulty: easy
    question: |
      Computer vision aims to give computers a high-level understanding of digital images. Which of
      these tasks belong to computer vision? Select all that apply.
    options:
      - text: Finding and locating the objects in a photo
        correct: true
      - text: Estimating a person's age from a photo of their face
        correct: true
      - text: Reconstructing a 3D model of a scene from images
        correct: true
      - text: Translating an English sentence into French
      - text: Converting recorded speech into text
    explanation: |
      "Understanding" an image covers many tasks: finding objects in a picture (object detection),
      recognising events, describing a picture in text, reconstructing a scene in 3D, and tasks on
      images of people such as age and emotion estimation or face recognition [^1]. Machine
      translation works on text and speech recognition on audio; both reached human parity as
      separate fields from image classification [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md
        locator: 'Lesson: Introduction to Computer Vision, introduction'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#recent-ai-research
        locator: 'Lesson: Introduction to AI, sec. Recent AI Research (human parity table)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-106/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-004
    type: single
    difficulty: easy
    question: |
      OpenCV is the de facto standard library for image processing. In which channel order does
      `cv2.imread` return a colour image?
    options:
      - text: BGR (blue, green, red)
        correct: true
      - text: RGB (red, green, blue)
      - text: HSV (hue, saturation, value)
      - text: It returns a single grayscale channel
    explanation: |
      OpenCV traditionally encodes colour images as BGR, while most other Python tools, such as
      Matplotlib, expect RGB [^1]. An image loaded with `cv2.imread` and shown directly therefore has
      its red and blue swapped; convert it first with `cv2.cvtColor(im, cv2.COLOR_BGR2RGB)` or by
      reversing the channel axis [^1]. HSV and grayscale are other colour spaces that `cvtColor` can
      convert to on request, not the default when loading a colour image [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#loading-images
        locator: 'Lesson: Introduction to Computer Vision, sec. Loading Images'
    source:
      id: ms-ai-for-beginners
      ref: quiz-106/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-005
    type: short_answer
    difficulty: easy
    question: |
      A colour image 320 pixels wide and 200 pixels high is loaded with OpenCV into a NumPy array.
      What is the shape of the array?
    answer:
      accept:
        - (200, 320, 3)
      pattern: \(?\s*200\s*[,x×]\s*320\s*[,x×]\s*3\s*\)?
      hint: Three numbers, e.g. (10, 20, 1)
      model: '$(200, 320, 3)$: (height, width, colour channels)'
    explanation: |
      Images are stored as NumPy arrays with rows first: a grayscale image of 320×200 pixels is a
      $200 \times 320$ array, and a colour image of the same size has shape $200 \times 320 \times 3$, one
      slice per colour channel [^1]. A common mistake is to write the width first, as in the usual
      "320×200" description of the image size.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#loading-images
        locator: 'Lesson: Introduction to Computer Vision, sec. Loading Images'
    source:
      id: ms-ai-for-beginners
      ref: quiz-106/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-006
    type: single
    difficulty: easy
    question: |
      In a computer-vision pipeline, resizing an image to the size a network expects and blurring it
      to remove noise are typically done at which stage?
    options:
      - text: Pre-processing, before the image is fed to the network
        correct: true
      - text: Training, as part of the backpropagation step
      - text: Post-processing, applied to the network's predictions
    explanation: |
      Before an image is passed to a neural network, it often pays to enhance it with algorithmic
      techniques; OpenCV's pre-processing steps include resizing (`cv2.resize`), blurring
      (`cv2.medianBlur`, `cv2.GaussianBlur`), brightness and contrast changes and thresholding [^1].
      Backpropagation updates the network's weights and does not edit the input images, and
      post-processing works on the predictions after the network has run.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#image-processing
        locator: 'Lesson: Introduction to Computer Vision, sec. Image Processing'
    source:
      id: ms-ai-for-beginners
      ref: quiz-206/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-6.json
    status: draft
  - id: cv-basics-007
    type: single
    question: True or false? When treating spectrograms as images for classification, you will always benefit from image data augmentation techniques, such as shifting an image, cropping it, or resizing.
    options:
      - text: 'True'
        why: Image augmentations assume the label does not change under shifts and rescaling, which is not true along a spectrogram's frequency axis.
      - text: 'False'
        correct: true
    explanation: |
      A spectrogram is not a natural image: its vertical axis is frequency, so shifting it up or
      down changes the pitch, and cropping or resizing distorts frequencies and durations. Such
      transforms can hurt [^1]. Audio-specific augmentations are used instead, for example
      adding noise, time stretching, or masking blocks of time steps and frequency channels as in
      SpecAugment [^2].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
      - title: 'Park et al. (2019), SpecAugment: A Simple Data Augmentation Method for Automatic Speech Recognition'
        locator: Sec. 2 Augmentation Policy
        url: https://arxiv.org/abs/1904.08779
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q7
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
  - id: cv-basics-008
    type: single
    difficulty: easy
    tags:
      - image-augmentation
      - overfitting
    question: |
      You train the same ResNet-18 on CIFAR-10 twice, once with random horizontal flips and once with no
      augmentation, and compare training and test accuracy. Which result supports the claim that image
      augmentation mitigates overfitting?
    options:
      - text: With augmentation, training accuracy rises faster, so the model fits the training images more closely
        why: Fitting the training images more closely is not less overfitting; augmentation usually makes the training task harder, not easier.
      - text: Without augmentation, training and test accuracy are both lower than with augmentation
        why: Low accuracy on both sets points to underfitting, which is not what augmentation is meant to fix [^2].
      - text: Without augmentation, training accuracy is higher but test accuracy lower, so the train–test gap is wider
        correct: true
      - text: Both runs reach the same test accuracy, but the run with augmentation finishes its epochs sooner
        why: Overfitting is about the gap between training and test performance, not about training speed.
    explanation: |
      Augmentation applies random changes to the training images, which enlarges the training set and
      makes the model rely less on details such as the exact position or color of an object, so it
      generalizes better [^1]. Overfitting shows up as a gap between training and test (generalization)
      performance [^2]. So the evidence to look for is a smaller gap with augmentation: training accuracy
      no higher, or even lower, and test accuracy higher. Augmentation is applied only to the training
      images; at test time d2l uses no random transforms, to get deterministic predictions [^1].
    references:
      - source: d2l
        locator: Sec. 14.1 Image Augmentation (introduction) and Sec. 14.1.2 Training with Image Augmentation
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#training-with-image-augmentation
      - source: d2l
        locator: Sec. 3.6.1 Training Error and Generalization Error
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
      - source: d2l
        locator: Sec. 14.1.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/image-augmentation#ex1
      url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#exercises
    status: draft
  - id: cv-basics-009
    type: single
    difficulty: easy
    tags:
      - neural-style-transfer
      - total-variation
      - loss-weights
    question: |
      Neural style transfer optimizes the pixels of a synthesized image to minimize
      `content_weight * content_loss + style_weight * style_loss + tv_weight * tv_loss`.
      Your result keeps too little of the content image's layout and is covered in high-frequency
      speckle. Which change targets both problems?
    options:
      - text: Raise `content_weight` and raise `tv_weight`
        correct: true
      - text: Lower `content_weight` and raise `tv_weight`
        why: Raising `tv_weight` smooths the speckle, but lowering `content_weight` keeps even less of the content.
      - text: Raise `content_weight` and lower `tv_weight`
        why: This helps the content, but a weaker total variation term lets more high-frequency noise through [^1].
      - text: Raise `style_weight` and lower `tv_weight`
        why: A stronger style term pulls the image further from the content, and a weaker total variation term allows more noise.
    explanation: |
      The content loss keeps the synthesized image's content features close to those of the content
      image, and the style loss matches the Gram matrices of the style image. The total variation loss
      $\sum_{i,j} |x_{i,j} - x_{i+1,j}| + |x_{i,j} - x_{i,j+1}|$ makes neighbouring pixels similar and so
      reduces high-frequency noise [^1]. The final loss is a weighted sum, and the weights trade off
      content retention, style transfer and noise reduction [^2].
    references:
      - source: d2l
        locator: Sec. 14.12.5.3 Total Variation Loss
        url: https://d2l.ai/chapter_computer-vision/neural-style.html#total-variation-loss
      - source: d2l
        locator: Sec. 14.12.5.4 Loss Function
        url: https://d2l.ai/chapter_computer-vision/neural-style.html#loss-function
      - source: d2l
        locator: Sec. 14.12.9 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/neural-style.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/neural-style#ex2
      url: https://d2l.ai/chapter_computer-vision/neural-style.html#exercises
    status: draft
  - id: cv-basics-010
    type: single
    difficulty: easy
    tags:
      - data-augmentation
      - label-preserving
      - mnist
    question: |
      You train a handwritten-digit classifier (0–9). Which augmentation is most likely to **hurt**,
      because it can change the correct label?
    options:
      - text: Shifting images by 1–2 pixels
        why: A small shift keeps every digit recognizable, so it is a safe, label-preserving augmentation.
      - text: Slightly changing brightness and contrast
        why: Photometric changes do not alter the shape of the digit, so its label stays the same.
      - text: Rotating images by up to 180°
        correct: true
      - text: Adding a little Gaussian noise
        why: Mild noise leaves the digit's shape and label unchanged and makes the model more robust.
    explanation: |
      Augmentations must preserve the label [^1]. Rotating a 6 by 180° gives a 9 (and vice versa), so
      large rotations teach the model wrong labels, whereas small shifts, noise and color changes keep
      the digit intact. d2l likewise notes that even common flips are a choice that depends on the
      data: left–right flips rarely change an object's category, up–down flips are less common [^1].
    references:
      - source: d2l
        locator: Sec. 14.1.1.1 Flipping and Cropping
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#flipping-and-cropping
      - source: ds-interviews
        locator: theory.md, Neural networks for computer vision — "How to choose which augmentations to use?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#neural-networks-for-computer-vision
    source:
      id: ds-interviews
      ref: theory.md#q114
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#neural-networks-for-computer-vision
    status: draft
  - id: cv-basics-011
    type: single
    difficulty: medium
    tags:
      - data-augmentation
      - satellite-images
    question: For which dataset are vertical flips and rotations by any angle the most natural augmentations?
    options:
      - text: Satellite images of land use, taken straight overhead
        correct: true
      - text: Street photos of cars and trucks
        why: Upside-down vehicles never occur in such photos; horizontal flips are the safe choice there [^2].
      - text: Scans of handwritten digits
        why: Large rotations mix up classes, turning a 6 into something that looks like a 9 [^2].
      - text: Photos of building façades labelled by architectural style
        why: Photos of buildings have a clear up and down, so vertical flips create unrealistic images.
    explanation: |
      A useful augmentation preserves the class while varying things the classifier should ignore
      [^2]. Pictures taken straight overhead have no natural orientation, so the exercise's solution
      suggests trying flips and rotations first for the EuroSAT satellite images, and none of them is
      likely to confuse the land-use classes [^1]. For photos with an up and a down, the same
      transformations produce images the model will never see at test time, and for digits they can
      even change the label [^2].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 6 exercise, Question 1 EuroSAT (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex6.py
      - source: kaggle-learn
        locator: Computer Vision, Lesson 6 Data Augmentation — tutorial, The Usefulness of Fake Data; Using Data Augmentation
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/tut6.ipynb
    source:
      id: kaggle-learn
      ref: computer_vision/ex6#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/ex6.ipynb
    status: draft
  - id: cv-basics-012
    type: single
    difficulty: easy
    tags:
      - data-augmentation
      - color-augmentation
    question: |
      You train a classifier to recognize flower species from photographs. Which augmentation is the
      riskiest to apply?
    options:
      - text: Large random hue shifts, such as turning red petals blue
        correct: true
      - text: Random horizontal flips of the whole photo
        why: A mirrored flower is still the same species, so the class is preserved [^1].
      - text: Moderate random rotations of the photo
        why: Flowers appear at many angles in photos, so moderate rotations keep the images realistic [^1].
      - text: Small random changes to the brightness or contrast of the image
        why: Lighting varies between photos anyway; a small change of brightness or contrast does not alter the species [^2].
    explanation: |
      Transformations must not mix up the classes [^2]. Colour is often distinctive of a flower's
      species, so a change of hue is the most likely to make a photo look like another class; the
      exercise's solution recommends horizontal flips and moderate rotations first [^1]. It adds a
      caveat: cultivated flowers vary a lot in colour, so depending on the dataset hue changes might
      still help, which is why the tutorial's advice is to try augmentations and see [^1][^2].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 6 exercise, Question 2 TensorFlow Flowers (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex6.py
      - source: kaggle-learn
        locator: Computer Vision, Lesson 6 Data Augmentation — tutorial, Using Data Augmentation
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/tut6.ipynb
    source:
      id: kaggle-learn
      ref: computer_vision/ex6#q2
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/ex6.ipynb
