  - id: object-detection-015
    type: single
    difficulty: medium
    tags:
      - data-augmentation
      - random-cropping
      - bounding-boxes
    question: |
      You add random cropping as data augmentation when training an object detector. What has to be
      handled that does not come up in image classification?
    options:
      - text: Boxes must be shifted and clipped to the crop, and objects left mostly outside it dropped from the labels
        correct: true
      - text: The crop must be resized back to the original size, which keeps every box coordinate valid
        why: Resizing the crop does not restore the original coordinates; boxes still have to be expressed relative to the crop.
      - text: Nothing extra, because the labels of an image stay valid after any crop of that image
        why: Detection labels include box coordinates in the image's coordinate system, and cropping changes those coordinates.
      - text: Only crops that contain no objects may be used, so that no bounding box is ever cut
        why: Crops without objects contain no positive examples. SSD samples crops that overlap the objects instead [^2].
    explanation: |
      In classification one label describes the whole image, but a detection label is a class plus box
      coordinates relative to the image [^1]. After cropping, every box has to be translated into the
      crop's coordinates and clipped to it. A crop that contains only a small sliver of an object should
      not teach the model that the sliver is the whole object; SSD keeps the overlapping part of a
      ground-truth box only if the box's center lies inside the sampled patch, and samples patches with a
      minimum IoU with the objects [^2].
    references:
      - source: d2l
        locator: Sec. 14.6.2 Reading the Dataset (labels are class and box coordinates)
        url: https://d2l.ai/chapter_computer-vision/object-detection-dataset.html#reading-the-dataset
      - title: 'SSD: Single Shot MultiBox Detector (Liu et al., 2016)'
        locator: Sec. 2.2 Training, Data augmentation
        url: https://arxiv.org/abs/1512.02325
      - source: d2l
        locator: Sec. 14.6.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/object-detection-dataset.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/object-detection-dataset#ex2
      url: https://d2l.ai/chapter_computer-vision/object-detection-dataset.html#exercises
    status: draft
  - id: object-detection-016
    type: short_answer
    difficulty: medium
    tags:
      - focal-loss
      - class-imbalance
      - ssd
    question: |
      Focal loss replaces the cross-entropy $-\log p_j$ by $-\alpha (1 - p_j)^{\gamma} \log p_j$, where
      $p_j$ is the predicted probability of the true class. With $\alpha = 1$ and $\gamma = 2$, by what
      factor is the loss of a well-classified example with $p_j = 0.9$ smaller than its cross-entropy?
    answer:
      numeric: 100
      tolerance: 0.5
      hint: a number
      model: $(1 - 0.9)^2 = 0.01$, so the loss is 100 times smaller; for a hard example with $p_j = 0.1$ the factor is only $1/0.81 \approx 1.23$.
    explanation: |
      The factor $(1 - p_j)^\gamma$ is close to 0 for confident correct predictions and close to 1 for
      misclassified ones, so increasing $\gamma$ cuts the relative loss of well-classified examples and
      training focuses on the hard ones [^1]. Lin et al. designed the loss for dense one-stage detectors,
      which score a very large number of anchors that are mostly easy background; without the factor
      these easy negatives dominate the total loss [^2].
    references:
      - source: d2l
        locator: Sec. 14.7.5 Exercises, Exercise 1 (focal loss)
        url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
      - title: Focal Loss for Dense Object Detection (Lin et al., 2017)
        locator: Sec. 3.2 Focal Loss Definition
        url: https://arxiv.org/abs/1708.02002
    source:
      id: d2l
      ref: chapter_computer-vision/ssd#ex1
      url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
    status: draft
  - id: object-detection-017
    type: short_answer
    difficulty: medium
    tags:
      - smooth-l1
      - bounding-box-regression
      - loss-functions
    question: |
      The smooth $\ell_1$ loss with hyperparameter $\sigma$ is
      $$f(x) = \begin{cases} (\sigma x)^2/2, & |x| < 1/\sigma^2,\\ |x| - 0.5/\sigma^2, & \text{otherwise.}\end{cases}$$
      With $\sigma = 2$, what is $f(0.2)$?
    answer:
      numeric: 0.08
      tolerance: 0.0005
      hint: a number, 2 decimals
      model: $|0.2| < 1/4$, so the quadratic branch applies, $(2 \cdot 0.2)^2/2 = 0.08$; the plain $\ell_1$ loss would give 0.2.
    explanation: |
      Near zero the loss is quadratic, so its gradient $\sigma^2 x$ shrinks smoothly as a predicted offset
      approaches its target, whereas the $\ell_1$ gradient stays at $\pm 1$. Beyond $|x| = 1/\sigma^2$ it is
      linear like $\ell_1$, so large errors and outliers do not dominate as they would under a squared
      loss. The two pieces meet with the same value $0.5/\sigma^2$ and slope 1, and a very large $\sigma$
      makes the loss behave like $\ell_1$ [^1]. d2l's SSD uses the plain $\ell_1$ loss for the
      offsets [^2].
    references:
      - source: d2l
        locator: Sec. 14.7.5 Exercises, Exercise 1 (smooth L1 loss)
        url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
      - source: d2l
        locator: Sec. 14.7.2.2 Defining Loss and Evaluation Functions
        url: https://d2l.ai/chapter_computer-vision/ssd.html#defining-loss-and-evaluation-functions
    source:
      id: d2l
      ref: chapter_computer-vision/ssd#ex1-b
      url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
    status: draft
  - id: object-detection-018
    type: short_answer
    difficulty: easy
    tags:
      - ssd
      - hard-negative-mining
      - class-imbalance
    question: |
      Most anchor boxes in a detector are background (negatives). Instead of using all of them, SSD
      ranks the negatives by their classification loss and keeps only the hardest ones, so that
      negatives outnumber positives by at most 3 to 1. An image has 8,732 anchors, 8 of them positive.
      How many negative anchors contribute to the classification loss?
    answer:
      numeric: 24
      tolerance: 0
      hint: a whole number
      model: At most $3 \times 8 = 24$ negatives, the 24 with the highest classification loss.
    explanation: |
      The d2l exercise suggests downsampling the vast number of negative anchors to balance the classes [^1].
      SSD does this with hard negative mining: after matching, it sorts the negatives by their confidence
      loss and keeps the top ones so the ratio is at most 3:1, which the authors found gives faster and
      more stable training [^2]. Without it, the 8,724 negatives would outnumber the positives about
      1000 to 1 and swamp the loss.
    references:
      - source: d2l
        locator: Sec. 14.7.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
      - title: 'SSD: Single Shot MultiBox Detector (Liu et al., 2016)'
        locator: Sec. 2.2 Training, Hard negative mining
        url: https://arxiv.org/abs/1512.02325
    source:
      id: d2l
      ref: chapter_computer-vision/ssd#ex2
      url: https://d2l.ai/chapter_computer-vision/ssd.html#exercises
    status: draft
  - id: object-detection-019
    type: true_false
    difficulty: easy
    tags:
      - yolo
      - one-stage-detectors
    shuffle: false
    question: |
      True or false: object detection can be framed as a single regression problem, in which one network
      maps the whole image directly to bounding-box coordinates and class probabilities, with no
      separate region-proposal step.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: YOLO does exactly this. It predicts all boxes and class probabilities from the full image in one evaluation of a single network [^2].
    explanation: |
      The R-CNN family first generates region proposals and then classifies each region and refines its
      box [^1]. YOLO frames detection as a regression to spatially separated bounding boxes and the
      associated class probabilities, predicted by a single network directly from the full image in one
      evaluation [^2]. It divides the image into an $S \times S$ grid, and each cell predicts a few boxes
      with confidences plus class probabilities, which makes it fast enough for real-time use.
    references:
      - source: d2l
        locator: Sec. 14.8.1 R-CNNs
        url: https://d2l.ai/chapter_computer-vision/rcnn.html#r-cnns
      - title: 'You Only Look Once: Unified, Real-Time Object Detection (Redmon et al., 2016)'
        locator: Abstract and Sec. 2 Unified Detection
        url: https://arxiv.org/abs/1506.02640
      - source: d2l
        locator: Sec. 14.8.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_computer-vision/rcnn.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/rcnn#ex1
      url: https://d2l.ai/chapter_computer-vision/rcnn.html#exercises
    status: draft
  - id: object-detection-020
    type: single
    difficulty: medium
    tags:
      - ssd
      - faster-r-cnn
      - one-stage-detectors
      - two-stage-detectors
    question: |
      What is the main structural difference between single-shot multibox detection (SSD) and
      Faster R-CNN?
    options:
      - text: SSD builds on a pretrained CNN backbone, while Faster R-CNN has to train its whole CNN from scratch
        why: Both usually start from a pretrained backbone such as VGG or ResNet [^1][^2].
      - text: SSD relies on selective search for its region proposals, while Faster R-CNN learns them with a proposal network
        why: SSD uses no region proposals at all; selective search belongs to R-CNN and Fast R-CNN [^2].
      - text: SSD predicts from dense anchors in one pass; Faster R-CNN first proposes regions, then classifies each
        correct: true
      - text: SSD predicts a pixel mask for every object, while Faster R-CNN predicts only the bounding boxes
        why: Pixel masks are added by Mask R-CNN, not by SSD [^2].
    explanation: |
      SSD runs a base network followed by multiscale feature map blocks and predicts the classes and
      offsets of all anchor boxes at every scale directly, in a single stage [^1]. Faster R-CNN is a
      two-stage detector: a region proposal network scores anchors as object or background and keeps a
      few proposals after NMS, and RoI pooling then extracts features for each proposal for the final
      class and box prediction [^2]. One-stage detectors are simpler and faster, while two-stage ones
      spend more computation per region.
    references:
      - source: d2l
        locator: Sec. 14.7.1 Model
        url: https://d2l.ai/chapter_computer-vision/ssd.html#model
      - source: d2l
        locator: Sec. 14.8.3 Faster R-CNN and Sec. 14.8.5 Summary
        url: https://d2l.ai/chapter_computer-vision/rcnn.html#faster-r-cnn
      - source: d2l
        locator: Sec. 14.8.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/rcnn.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/rcnn#ex2
      url: https://d2l.ai/chapter_computer-vision/rcnn.html#exercises
    status: draft
