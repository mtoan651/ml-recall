schema_version: 1
domain: cv
topic: object-detection
title: Object Detection
questions:
  - id: object-detection-001
    type: single
    difficulty: easy
    question: With object detection, we don't just get the class of an object, but also its ____
    options:
      - text: shape
        why: A bounding box gives the object's position but not its exact outline; pixel-level outlines are the job of segmentation [^3].
      - text: location
        correct: true
      - text: category
        why: The category of an object is its class, which a classifier already gives; detection adds where the object is [^1].
    explanation: |
      An image classifier only says what is in the picture. Object detection also says where each
      object is [^1][^2]. That position is usually given as a bounding box, a rectangle described
      by its corner or center coordinates [^2]. "Category" is just another word for the class.
      "Shape" is also wrong: a rectangular box gives the location but not the object's exact
      outline, and pixel-level outlines are the job of segmentation [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#object-detection
        locator: Lesson 11 "Object Detection", introduction
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/bounding-box.html#bounding-boxes
        locator: Sec. 14.3 Object Detection and Bounding Boxes (introduction and 14.3.1 Bounding Boxes)
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html
        locator: Sec. 14.9 Semantic Segmentation and the Dataset (introduction)
    source:
      id: ms-ai-for-beginners
      ref: quiz-111/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-002
    type: single
    difficulty: easy
    question: What does an object detection model output for each object it finds?
    options:
      - text: object class only
        why: A class label alone is what image classification gives; it does not say where the object is [^2].
      - text: bounding box only
        why: Boxes without labels would not tell you what each object is; detectors predict a class for every box [^3].
      - text: class and bounding box
        correct: true
    explanation: |
      A detector has to say both what each object is and where it is. Its output is therefore a
      class label plus bounding-box coordinates for every object found [^1][^2]. YOLO, for
      example, predicts bounding boxes and their class probabilities directly from the full
      image [^3]. A class label alone is plain image classification, and boxes without labels
      would not tell you which object is which.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#different-object-detection-approaches
        locator: Lesson 11 "Object Detection", sections "A Naive Approach to Object Detection" and "Different Object Detection Approaches"
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/bounding-box.html
        locator: Sec. 14.3 Object Detection and Bounding Boxes (introduction)
      - title: 'Redmon et al. (2016), You Only Look Once: Unified, Real-Time Object Detection'
        url: https://arxiv.org/abs/1506.02640
        locator: Abstract; Sec. 2 Unified Detection
    source:
      id: ms-ai-for-beginners
      ref: quiz-211/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-003
    type: single
    difficulty: easy
    question: Which family of object detection models is generally faster?
    options:
      - text: one-pass models
        correct: true
      - text: region-proposal models such as R-CNN
        why: They first generate regions of interest and then run the CNN classifier on them, which takes many passes over the image and is slow [^1].
      - text: Fast R-CNN
        why: Fast R-CNN belongs to the region-proposal family; with selective search for proposals it runs at about 0.5 frames per second, against 45 for YOLO [^2].
    explanation: |
      One-pass detectors (YOLO, SSD, RetinaNet) predict classes and boxes in a single forward
      pass of the network. Region-proposal methods (R-CNN, Fast R-CNN, Faster R-CNN) first
      generate regions of interest and then run the classifier on them, which takes many passes
      and is slow [^1]. In the YOLO paper's comparison, Fast R-CNN runs at about 0.5 frames per
      second because it still relies on selective search for proposals, while YOLO runs at
      45 fps [^2]. Fast R-CNN is therefore an example of the slower family, not the answer.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#different-object-detection-approaches
        locator: Lesson 11 "Object Detection", section "Different Object Detection Approaches"
      - title: 'Redmon et al. (2016), You Only Look Once: Unified, Real-Time Object Detection'
        url: https://arxiv.org/abs/1506.02640
        locator: Sec. 1 Introduction; Sec. 4.1 Comparison to Other Real-Time Systems, Table 1
    source:
      id: ms-ai-for-beginners
      ref: quiz-211/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-004
    type: single
    difficulty: easy
    question: Which metric can be used to determine how well bounding boxes are aligned?
    options:
      - text: accuracy
        why: Accuracy counts how many predictions are right; it says nothing about how far a predicted box is from the ground-truth box.
      - text: precision
        why: Precision is the share of predicted boxes that count as correct, and deciding that a box is correct already requires an IoU threshold [^1].
      - text: IoU
        correct: true
    explanation: |
      Intersection over Union divides the area where two boxes overlap by the area they cover
      together. It is 1 for identical boxes and 0 for boxes that do not touch, so it directly
      measures how well a predicted box lines up with the ground-truth box [^1][^2]. Accuracy and
      precision count whether predictions are right or wrong. In detection, precision is computed
      only after an IoU threshold has decided which predicted boxes count as matches [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#intersection-over-union
        locator: Lesson 11 "Object Detection", sections "Intersection over Union" and "AP and IoU"
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/anchor.html#intersection-over-union-iou
        locator: Sec. 14.4.2 Intersection over Union (IoU)
    source:
      id: ms-ai-for-beginners
      ref: quiz-211/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-005
    type: single
    difficulty: medium
    question: Which of the following statements is **false**?
    options:
      - text: Semantic segmentation models predict the class of each pixel, while multiclass image classifiers predict the class of entire image.
        why: This statement is true; semantic segmentation labels every pixel, while a classifier gives one label for the whole image [^3].
      - text: A bounding box with an IoU (intersection over union) equal to $96\%$ would likely be considered a true positive.
        why: This statement is true; 96% is far above the usual IoU threshold (50% in PASCAL VOC), so the box counts as a correct detection [^1].
      - text: When a predicted bounding box does not correspond to any object in the scene, it is considered a false positive.
        why: This statement is true; a detection that matches no ground-truth object is a false positive [^2].
      - text: A bounding box with an IoU (intersection over union) equal to $3\%$ would likely be considered a false negative.
        correct: true
    explanation: |
      A predicted box counts as a correct detection only if its IoU with a ground-truth box is
      above a threshold (50% in PASCAL VOC). Predictions that fail this test are scored as false
      detections, that is, false positives [^1][^2]. A box with 3% IoU is therefore a false
      positive; a false negative is something else, a ground-truth object that no prediction
      detected [^2]. The other three statements are true: 96% is far above any usual threshold,
      so that box is a true positive, and a box that matches no object is a false positive [^2].
      Finally, semantic segmentation labels every pixel, while a classifier gives one label for the whole
      image [^3].
    references:
      - title: Everingham et al. (2010), The PASCAL Visual Object Classes (VOC) Challenge, IJCV 88
        url: http://host.robots.ox.ac.uk/pascal/VOC/pubs/everingham10.pdf
        locator: Sec. 4.2 "Evaluation of Results", paragraph "Bounding Box Evaluation", Eq. (3), p. 314
      - title: Padilla, Object-Detection-Metrics (GitHub README)
        url: https://github.com/rafaelpadilla/Object-Detection-Metrics/blob/803ec11ce5996629bbabd18e1bab6bf563d284fa/README.md#true-positive-false-positive-false-negative-and-true-negative
        locator: Section "True Positive, False Positive, False Negative and True Negative"
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html
        locator: Sec. 14.9 Semantic Segmentation and the Dataset (introduction)
    source:
      id: mmlu-redux
      ref: machine_learning/32
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=32
    status: reviewed
    reviewed_by: claude
  - id: object-detection-006
    type: single
    difficulty: medium
    question: |
      A naive object detector cuts an image into tiles and runs an image classifier on each tile.
      Why do real object detectors also need a regression output?
    options:
      - text: Tiles locate an object only roughly; precise bounding-box coordinates must be predicted by regression
        correct: true
      - text: The class label of each detected object is a continuous number, so it must also be predicted by regression
        why: Class labels are categories, so the class is still predicted by classification; only the box coordinates are continuous [^1].
      - text: Image classifiers cannot process an image that is larger than a single tile of the grid
        why: The weakness of the tile approach is imprecise localization of the box, not an input-size limit of the classifier [^1].
      - text: A regression output removes the need for images labelled with the objects they contain
        why: Box regression needs more labelling, not less; it is trained on datasets with box annotations such as PASCAL VOC or COCO [^1].
    explanation: |
      The tile approach (split the image, classify each tile, keep tiles with high activation) finds
      the object's bounding box only very imprecisely [^1]. For a precise location the detector has to
      predict the coordinates of the box, which is a regression task and needs datasets labelled with
      boxes, such as PASCAL VOC or COCO [^1]. YOLO, for example, frames detection as regression from
      the image to box coordinates and class probabilities [^2]. The class itself is still predicted by
      classification.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#a-naive-approach-to-object-detection
        locator: 'Lesson: Object Detection, secs. A Naive Approach to Object Detection and Datasets for Object Detection'
      - title: 'You Only Look Once: Unified, Real-Time Object Detection (Redmon et al., 2016)'
        url: https://arxiv.org/abs/1506.02640
        locator: Sec. 2 Unified Detection, Figure 2
    source:
      id: ms-ai-for-beginners
      ref: quiz-111/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-007
    type: short_answer
    difficulty: easy
    question: |
      YOLO divides an image into an $S \times S$ grid, and every grid cell predicts $B$ bounding boxes,
      each with a confidence score. With $S = 7$ and $B = 2$, how many bounding boxes does the
      network predict for one image, before low-confidence boxes are discarded?
    answer:
      numeric: 98
      tolerance: 0
      model: $7 \times 7 \times 2 = 98$
    explanation: |
      YOLO splits the image into $S \times S$ regions, and for each region a CNN predicts several
      possible objects with bounding-box coordinates and a confidence [^1]. On PASCAL VOC it uses
      $S = 7$ and $B = 2$, so it predicts $7 \times 7 \times 2 = 98$ boxes per image in a single pass
      [^2]. The number of objects actually reported varies from image to image: boxes with low
      confidence are dropped, and non-maximal suppression removes duplicates of the same object [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#yolo---you-only-look-once
        locator: 'Lesson: Object Detection, sec. YOLO - You Only Look Once'
      - title: 'You Only Look Once: Unified, Real-Time Object Detection (Redmon et al., 2016)'
        url: https://arxiv.org/abs/1506.02640
        locator: Sec. 2 Unified Detection and Sec. 2.3 Inference
    source:
      id: ms-ai-for-beginners
      ref: quiz-111/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-11.json
    status: reviewed
    reviewed_by: claude
  - id: object-detection-008
    type: short_answer
    difficulty: easy
    tags:
      - bounding-boxes
      - box-formats
    question: |
      A bounding box in corner format $(x_1, y_1, x_2, y_2)$ is $(40, 20, 200, 140)$, in pixel
      coordinates with the origin at the top-left corner and $y$ pointing down. Write it in center format
      $(c_x, c_y, w, h)$.
    answer:
      accept:
        - (120, 80, 160, 120)
      pattern: \(?\s*120(\.0+)?\s*,\s*80(\.0+)?\s*,\s*160(\.0+)?\s*,\s*120(\.0+)?\s*\)?
      hint: four numbers, e.g. (10, 20, 30, 40)
      model: $c_x = (40 + 200)/2 = 120$, $c_y = (20 + 140)/2 = 80$, $w = 200 - 40 = 160$, $h = 140 - 20 = 120$
    explanation: |
      The center is the midpoint of the two corners, and the width and height are the differences of
      their coordinates; d2l's `box_corner_to_center` computes exactly these four values [^1]. Both
      formats describe an axis-aligned rectangle with four numbers, its four degrees of freedom, which is
      why the last dimension of the `boxes` tensor these functions take is always 4 [^1][^2].
    references:
      - source: d2l
        locator: Sec. 14.3.1 Bounding Boxes
        url: https://d2l.ai/chapter_computer-vision/bounding-box.html#bounding-boxes
      - source: d2l
        locator: Sec. 14.3.3 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/bounding-box.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/bounding-box#ex2
      url: https://d2l.ai/chapter_computer-vision/bounding-box.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: object-detection-009
    type: short_answer
    difficulty: easy
    tags:
      - anchor-boxes
    question: |
      d2l generates anchor boxes centered on every pixel. With $n$ sizes $s_1, \ldots, s_n$ and $m$
      aspect ratios $r_1, \ldots, r_m$ it keeps only the combinations that contain $s_1$ or $r_1$. How
      many anchor boxes does it generate for a $300 \times 400$ image with
      `sizes=[0.75, 0.5, 0.25, 0.1]` and `ratios=[1, 2, 0.5]`?
    answer:
      numeric: 720000
      tolerance: 0
      hint: a whole number
      model: $n + m - 1 = 4 + 3 - 1 = 6$ anchors per pixel, so $300 \cdot 400 \cdot 6 = 720\,000$.
    explanation: |
      The combinations $(s_1, r_1), \ldots, (s_1, r_m), (s_2, r_1), \ldots, (s_n, r_1)$ give $n + m - 1$
      anchor boxes per pixel and $wh(n + m - 1)$ for the whole image [^1]. All $nm = 12$ combinations
      would double that to 1.44 million. Even the reduced count is large, which is why multiscale
      detection places anchor centers on the cells of a coarser feature map instead of on every
      pixel [^2].
    references:
      - source: d2l
        locator: Sec. 14.4.1 Generating Multiple Anchor Boxes
        url: https://d2l.ai/chapter_computer-vision/anchor.html#generating-multiple-anchor-boxes
      - source: d2l
        locator: Sec. 14.5.1 Multiscale Anchor Boxes
        url: https://d2l.ai/chapter_computer-vision/multiscale-object-detection.html#multiscale-anchor-boxes
      - source: d2l
        locator: Sec. 14.4.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/anchor#ex1
      url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: object-detection-010
    type: short_answer
    difficulty: medium
    tags:
      - iou
      - bounding-boxes
    question: |
      Two $1 \times 1$ squares overlap; the second is shifted horizontally by $d$ relative to the first
      ($0 \le d \le 1$, no vertical shift). For which $d$ is their intersection over union exactly 0.5?
    answer:
      numeric: 0.3333
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\frac{1 - d}{1 + d} = \frac{1}{2}$ gives $d = 1/3$.
    explanation: |
      IoU is the area of the intersection divided by the area of the union [^1]. The intersection is a
      $(1 - d) \times 1$ rectangle, and the union is $2 - (1 - d) = 1 + d$, so
      $\text{IoU} = (1 - d)/(1 + d)$, which equals 0.5 at $d = 1/3$. Two boxes shifted by a third of
      their width already reach the IoU of 0.5 that d2l uses as its default threshold when assigning
      ground-truth boxes to anchors [^2], so 0.5 is a fairly loose match.
    references:
      - source: d2l
        locator: Sec. 14.4.2 Intersection over Union (IoU)
        url: https://d2l.ai/chapter_computer-vision/anchor.html#intersection-over-union-iou
      - source: d2l
        locator: Sec. 14.4.3.1 Assigning Ground-Truth Bounding Boxes to Anchor Boxes
        url: https://d2l.ai/chapter_computer-vision/anchor.html#assigning-ground-truth-bounding-boxes-to-anchor-boxes
      - source: d2l
        locator: Sec. 14.4.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/anchor#ex2
      url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: object-detection-011
    type: short_answer
    difficulty: medium
    tags:
      - non-maximum-suppression
      - soft-nms
    question: |
      Two people stand close together. A detector gives one box per person, with scores 0.95 and 0.80,
      and the boxes have an IoU of 0.6. Plain non-maximum suppression with threshold 0.5 would delete
      the 0.80 box. Linear Soft-NMS keeps it and instead multiplies its score by $(1 - \text{IoU})$
      whenever its IoU with the selected box is at least the threshold. What is its new score?
    answer:
      numeric: 0.32
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $0.80 \times (1 - 0.6) = 0.32$
    explanation: |
      NMS is greedy: it keeps the highest-scoring box and removes every other box whose IoU with it
      exceeds the threshold [^1], so the second person would be missed. Soft-NMS instead decays the
      scores of overlapping boxes as a function of their overlap, so no box is eliminated outright [^2].
      With the linear rule $s_i \leftarrow s_i (1 - \text{IoU})$ the box keeps a score of 0.32 and can
      still be reported, while near-duplicates with IoU close to 1 drop to almost 0. The paper also
      proposes a Gaussian penalty $s_i e^{-\text{IoU}^2/\sigma}$, which avoids the jump at the
      threshold [^2].
    references:
      - source: d2l
        locator: Sec. 14.4.4 Predicting Bounding Boxes with Non-Maximum Suppression
        url: https://d2l.ai/chapter_computer-vision/anchor.html#predicting-bounding-boxes-with-non-maximum-suppression
      - title: 'Soft-NMS: Improving Object Detection With One Line of Code (Bodla et al., 2017)'
        locator: Abstract and Sec. 4 Soft-NMS (rescoring functions)
        url: https://arxiv.org/abs/1704.04503
      - source: d2l
        locator: Sec. 14.4.6 Exercises, Exercise 4
        url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/anchor#ex4
      url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: object-detection-012
    type: true_false
    difficulty: medium
    tags:
      - non-maximum-suppression
      - detr
      - set-prediction
    shuffle: false
    question: |
      True or false: non-maximum suppression does not have to be a hand-crafted post-processing step;
      a detector can learn to output a single box per object.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Hosang et al. trained a network that performs non-maximum suppression from boxes and scores alone, and DETR's set prediction removes the NMS step altogether [^2][^3].
    explanation: |
      d2l's NMS is a fixed greedy rule with a hand-picked IoU threshold [^1]. Hosang et al. replaced it
      with a learned network that rescores detections and suppresses duplicates using only boxes and
      their scores [^2]. DETR goes further: it predicts a fixed-size set of boxes and is trained with a
      one-to-one (bipartite) matching to the ground truth, which penalizes duplicate detections, so it
      needs no NMS at all [^3].
    references:
      - source: d2l
        locator: Sec. 14.4.4 Predicting Bounding Boxes with Non-Maximum Suppression
        url: https://d2l.ai/chapter_computer-vision/anchor.html#predicting-bounding-boxes-with-non-maximum-suppression
      - title: Learning non-maximum suppression (Hosang, Benenson & Schiele, 2017)
        locator: Abstract
        url: https://arxiv.org/abs/1705.02950
      - title: End-to-End Object Detection with Transformers (Carion et al., 2020)
        locator: Abstract
        url: https://arxiv.org/abs/2005.12872
      - source: d2l
        locator: Sec. 14.4.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/anchor#ex5
      url: https://d2l.ai/chapter_computer-vision/anchor.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: object-detection-013
    type: single
    difficulty: medium
    tags:
      - multiscale-detection
      - receptive-field
      - feature-maps
    question: |
      A multiscale detector uses anchors on a large feature map near the input for small objects, and
      anchors on a small feature map near the output for large objects. Why do the deeper, smaller
      feature maps suit large objects?
    options:
      - text: Their units have smaller receptive fields, so they can concentrate on the fine details of large objects
        why: Receptive fields grow with depth; units near the output see larger parts of the input [^1].
      - text: Their units carry fewer channels, so the predictors on top of them have fewer parameters to fit
        why: Channel counts usually grow with depth, and the number of channels does not decide which object sizes a map can detect.
      - text: They are upsampled back to the input resolution before prediction, so they see more of the pixels
        why: The detector predicts directly on the small maps; no upsampling takes place [^3].
      - text: Their units have larger receptive fields and more abstract features, so they can cover whole large objects
        correct: true
    explanation: |
      Units of feature maps closer to the output have wider receptive fields on the input image, so they
      can detect larger objects [^1]. Deep networks learn hierarchical features with increasing levels of
      abstraction [^2], so the maps at different scales also differ in abstraction: early maps hold
      low-level patterns such as edges, later ones whole object parts. In SSD the multiscale maps near
      the top are smaller but have larger receptive fields, and they detect fewer but larger
      objects [^3].
    references:
      - source: d2l
        locator: Sec. 14.5.2 Multiscale Detection
        url: https://d2l.ai/chapter_computer-vision/multiscale-object-detection.html#multiscale-detection
      - source: d2l
        locator: Sec. 8.1.1 Representation Learning
        url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#representation-learning
      - source: d2l
        locator: Sec. 14.7.1 Model
        url: https://d2l.ai/chapter_computer-vision/ssd.html#model
      - source: d2l
        locator: Sec. 14.5.4 Exercises, Exercise 1
