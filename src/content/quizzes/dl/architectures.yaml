topic: architectures
title: Landmark Architectures
questions:
  - id: architectures-001
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** RoBERTa pretrains on a corpus that is approximate 10x larger than the corpus BERT pretrained on.

      **Statement 2.** ResNeXts in 2018 usually used tanh activation functions.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      BERT was pretrained on BookCorpus plus English Wikipedia, about 16GB of text, while RoBERTa
      collects five English corpora that add up to more than 160GB, so "about 10x larger" is true [^1].
      ResNeXt keeps the ResNet recipe: every convolution is followed by batch normalization and then
      a ReLU (the block output gets its ReLU after the shortcut is added), with no tanh anywhere [^2].
      So the first statement is true and the second is false.
    references:
      - title: 'RoBERTa: A Robustly Optimized BERT Pretraining Approach (Liu et al., 2019)'
        url: https://arxiv.org/abs/1907.11692
        locator: Sec. 2.5 Data and Sec. 3.2 Data
        quote: We consider five English-language corpora of varying sizes and domains, totaling over 160GB of uncompressed text.
      - title: Aggregated Residual Transformations for Deep Neural Networks (Xie et al., 2017)
        url: https://arxiv.org/abs/1611.05431
        locator: Sec. 4 Implementation details
    source:
      id: mmlu-redux
      ref: machine_learning/23
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=23
    status: draft
  - id: architectures-002
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** VGGNets have convolutional kernels of smaller width and height than AlexNet's first-layer kernels.

      **Statement 2.** Data-dependent weight initialization procedures were introduced before Batch Normalization.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      VGG builds every block from $3\times3$ convolutions [^1], while AlexNet's first layer uses an
      $11\times11$ window to cover the larger ImageNet images [^2], so the first statement is true.
      For the second, setting initial weights from the data is older than batch normalization
      (Ioffe & Szegedy, 2015): Krähenbühl et al. trace data-driven initialization back to whitening
      the activations of every layer (LeCun et al., 1998), and their k-means initialization follows
      Coates & Ng (2012) [^3]. Watch the dates, though: the paper actually titled "Data-dependent
      Initializations" came out after batch normalization and lists it as earlier work [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-blocks
        locator: Sec. 8.2.1 VGG Blocks
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#architecture
        locator: Sec. 8.1.2.1 Architecture (AlexNet)
      - title: Data-dependent Initializations of Convolutional Neural Networks (Krähenbühl et al., 2016)
        url: https://arxiv.org/abs/1511.06856
        locator: Sec. 1 Introduction (related work) and Sec. 3.3
    source:
      id: mmlu-redux
      ref: machine_learning/54
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=54
    status: draft
  - id: architectures-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The original ResNets and Transformers are feedforward neural networks.

      **Statement 2.** The original Transformers use self-attention, but the original ResNet does not.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Neither model has recurrent connections. He et al. describe residual learning as feedforward
      networks with identity shortcut connections [^1], and Vaswani et al. built the Transformer with
      no recurrence and no convolutions, stacking only attention and point-wise fully connected
      layers [^2]. Its decoder does generate one token at a time at inference, using earlier outputs as
      input, but that is a decoding loop, not a recurrent layer [^2]. The Transformer's encoder and
      decoder are made of self-attention layers [^2], whereas a ResNet block is just $3\times3$
      convolutions, batch normalization, ReLU and a shortcut, with no attention [^3]. Both
      statements are true.
    references:
      - title: Deep Residual Learning for Image Recognition (He et al., 2015)
        url: https://arxiv.org/abs/1512.03385
        locator: Sec. 1 Introduction (Fig. 2)
      - title: Attention Is All You Need (Vaswani et al., 2017)
        url: https://arxiv.org/abs/1706.03762
        locator: Abstract; Sec. 3 Model Architecture
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#residual-blocks
        locator: Sec. 8.6.2 Residual Blocks
    source:
      id: mmlu-redux
      ref: machine_learning/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=75
    status: draft
  - id: architectures-004
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** Industrial-scale neural networks are normally trained on CPUs, not GPUs.

      **Statement 2.** The ResNet-50 model has over 1 billion parameters.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      Deep learning's success is closely tied to GPUs and related accelerators such as TPUs, whose
      many cores and tensor units are built for the matrix arithmetic of training [^1], so
      industrial-scale networks are trained on accelerators rather than CPUs. ResNet-50 is also far
      smaller than a billion parameters: torchvision's ResNet-50 has 25,557,032 parameters, about
      25.6 million [^2]. Both statements are false.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_computational-performance/hardware.html#gpus-and-other-accelerators
        locator: Sec. 13.4.5 GPUs and other Accelerators
      - title: torchvision.models.resnet50 (PyTorch documentation)
        url: https://docs.pytorch.org/vision/stable/models/generated/torchvision.models.resnet50.html
        locator: ResNet50_Weights.IMAGENET1K_V1, num_params
    source:
      id: mmlu-redux
      ref: machine_learning/93
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=93
    status: draft
  - id: architectures-005
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Layer Normalization is used in the original ResNet paper, not Batch Normalization.

      **Statement 2.** DCGANs use self-attention to stabilize training.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      The original ResNet puts batch normalization right after each convolution and before the
      activation [^1]; layer normalization was introduced later, by Ba et al. (2016) [^2]. DCGAN
      stabilized GAN training with architectural rules: strided convolutions instead of pooling,
      batch normalization in both networks, no fully connected hidden layers, ReLU in the generator
      and LeakyReLU in the discriminator [^3]. Self-attention is not one of them. Both statements are
      false.
    references:
      - title: Deep Residual Learning for Image Recognition (He et al., 2015)
        url: https://arxiv.org/abs/1512.03385
        locator: Sec. 3.4 Implementation
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
        locator: Sec. 8.5.2.3 Layer Normalization
      - title: Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks (Radford et al., 2016)
        url: https://arxiv.org/abs/1511.06434
        locator: Sec. 3 Approach and Model Architecture (architecture guidelines box)
    source:
      id: mmlu-redux
      ref: machine_learning/97
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=97
    status: draft
