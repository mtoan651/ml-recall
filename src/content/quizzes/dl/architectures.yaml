  - id: architectures-022
    type: single
    difficulty: medium
    tags:
      - vision-transformer
      - inductive-bias
      - cnn
    question: |
      Trained from scratch on a small image dataset such as CIFAR-10, a vision transformer usually
      does worse than a ResNet of similar size, while on very large datasets it can do better. What is
      the main reason?
    options:
      - text: It lacks convolution's built-in locality and translation biases
        correct: true
      - text: Self-attention cannot represent local features such as edges at all
        why: Attention can learn to focus on nearby patches; it just has to learn this from data instead of having it built in [^2].
      - text: The ViT needs image sizes that are a multiple of the patch size
        why: That is a shape constraint, solved by resizing or padding; it does not explain lower accuracy.
      - text: The ViT has too few parameters to fit the training set
        why: ViTs are large models; their problem on small data is generalization, not capacity.
    explanation: |
      A convolution assumes that nearby pixels matter together and that the same pattern can appear
      anywhere; these assumptions are right for images and save the network from learning them [^1].
      A ViT treats patches as a set with learned position embeddings, so it must learn such structure
      from examples, and with little data it generalizes worse [^1][^2]. With enough data the weaker
      bias stops hurting and the flexibility pays off.
    references:
      - source: d2l
        locator: Sec. 11.8.6 Summary and Discussion
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#summary-and-discussion
      - title: Dosovitskiy et al. (2021), An Image is Worth 16x16 Words, arXiv:2010.11929
        locator: Sec. 1 Introduction; Sec. 3.1 Vision Transformer (Inductive bias)
        url: https://arxiv.org/abs/2010.11929
      - source: mit-ocw-67960
        locator: Homework 3, Problem 3(e)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw3_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw3#q3e
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw3_pdf/
