topic: architectures
title: Landmark Architectures
questions:
  - id: architectures-001
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** RoBERTa pretrains on a corpus that is approximately 10x larger than the corpus BERT pretrained on.

      **Statement 2.** ResNeXts in 2018 usually used tanh activation functions.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      BERT was pretrained on BookCorpus plus English Wikipedia, about 16GB of text, while RoBERTa
      collects five English corpora that add up to more than 160GB, so "about 10x larger" is true [^1].
      ResNeXt keeps the ResNet recipe: every convolution is followed by batch normalization and then
      a ReLU (the block output gets its ReLU after the shortcut is added), with no tanh anywhere [^2].
      So the first statement is true and the second is false.
    references:
      - title: 'RoBERTa: A Robustly Optimized BERT Pretraining Approach (Liu et al., 2019)'
        url: https://arxiv.org/abs/1907.11692
        locator: Sec. 2.5 Data and Sec. 3.2 Data
        quote: We consider five English-language corpora of varying sizes and domains, totaling over 160GB of uncompressed text.
      - title: Aggregated Residual Transformations for Deep Neural Networks (Xie et al., 2017)
        url: https://arxiv.org/abs/1611.05431
        locator: Sec. 4 Implementation details
    source:
      id: mmlu-redux
      ref: machine_learning/23
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=23
    status: draft
  - id: architectures-002
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** VGGNets have convolutional kernels of smaller width and height than AlexNet's first-layer kernels.

      **Statement 2.** Data-dependent weight initialization procedures were introduced before Batch Normalization.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      VGG builds every block from $3\times3$ convolutions [^1], while AlexNet's first layer uses an
      $11\times11$ window to cover the larger ImageNet images [^2], so the first statement is true.
      For the second, setting initial weights from the data is older than batch normalization
      (Ioffe & Szegedy, 2015): Krähenbühl et al. trace data-driven initialization back to whitening
      the activations of every layer (LeCun et al., 1998), and their k-means initialization follows
      Coates & Ng (2012) [^3]. Watch the dates, though: the paper actually titled "Data-dependent
      Initializations" came out after batch normalization and lists it as earlier work [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-blocks
        locator: Sec. 8.2.1 VGG Blocks
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#architecture
        locator: Sec. 8.1.2.1 Architecture (AlexNet)
      - title: Data-dependent Initializations of Convolutional Neural Networks (Krähenbühl et al., 2016)
        url: https://arxiv.org/abs/1511.06856
        locator: Sec. 1 Introduction (related work) and Sec. 3.3
    source:
      id: mmlu-redux
      ref: machine_learning/54
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=54
    status: draft
  - id: architectures-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The original ResNets and Transformers are feedforward neural networks.

      **Statement 2.** The original Transformers use self-attention, but the original ResNet does not.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Neither model has recurrent connections. He et al. describe residual learning as feedforward
      networks with identity shortcut connections [^1], and Vaswani et al. built the Transformer with
      no recurrence and no convolutions, stacking only attention and point-wise fully connected
      layers [^2]. Its decoder does generate one token at a time at inference, using earlier outputs as
      input, but that is a decoding loop, not a recurrent layer [^2]. The Transformer's encoder and
      decoder are made of self-attention layers [^2], whereas a ResNet block is just $3\times3$
      convolutions, batch normalization, ReLU and a shortcut, with no attention [^3]. Both
      statements are true.
    references:
      - title: Deep Residual Learning for Image Recognition (He et al., 2015)
        url: https://arxiv.org/abs/1512.03385
        locator: Sec. 1 Introduction (Fig. 2)
      - title: Attention Is All You Need (Vaswani et al., 2017)
        url: https://arxiv.org/abs/1706.03762
        locator: Abstract; Sec. 3 Model Architecture
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#residual-blocks
        locator: Sec. 8.6.2 Residual Blocks
    source:
      id: mmlu-redux
      ref: machine_learning/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=75
    status: draft
  - id: architectures-004
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** Industrial-scale neural networks are normally trained on CPUs, not GPUs.

      **Statement 2.** The ResNet-50 model has over 1 billion parameters.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      Deep learning's success is closely tied to GPUs and related accelerators such as TPUs, whose
      many cores and tensor units are built for the matrix arithmetic of training [^1], so
      industrial-scale networks are trained on accelerators rather than CPUs. ResNet-50 is also far
      smaller than a billion parameters: torchvision's ResNet-50 has 25,557,032 parameters, about
      25.6 million [^2]. Both statements are false.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_computational-performance/hardware.html#gpus-and-other-accelerators
        locator: Sec. 13.4.5 GPUs and other Accelerators
      - title: torchvision.models.resnet50 (PyTorch documentation)
        url: https://docs.pytorch.org/vision/stable/models/generated/torchvision.models.resnet50.html
        locator: ResNet50_Weights.IMAGENET1K_V1, num_params
    source:
      id: mmlu-redux
      ref: machine_learning/93
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=93
    status: draft
  - id: architectures-005
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Layer Normalization is used in the original ResNet paper, not Batch Normalization.

      **Statement 2.** DCGANs use self-attention to stabilize training.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      The original ResNet puts batch normalization right after each convolution and before the
      activation [^1]; layer normalization was introduced later, by Ba et al. (2016) [^2]. DCGAN
      stabilized GAN training with architectural rules: strided convolutions instead of pooling,
      batch normalization in both networks, no fully connected hidden layers, ReLU in the generator
      and LeakyReLU in the discriminator [^3]. Self-attention is not one of them. Both statements are
      false.
    references:
      - title: Deep Residual Learning for Image Recognition (He et al., 2015)
        url: https://arxiv.org/abs/1512.03385
        locator: Sec. 3.4 Implementation
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
        locator: Sec. 8.5.2.3 Layer Normalization
      - title: Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks (Radford et al., 2016)
        url: https://arxiv.org/abs/1511.06434
        locator: Sec. 3 Approach and Model Architecture (architecture guidelines box)
    source:
      id: mmlu-redux
      ref: machine_learning/97
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=97
    status: draft
  - id: architectures-006
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Highway networks, whose skip connections are controlled by learned gates, were introduced after ResNets.

      **Statement 2.** DenseNets usually cost more memory than ResNets.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
      - text: False, True
        correct: true
    explanation: 'Statement 1 is false: highway networks came first, and residual networks share their motivation but replace the learned gates with a plain identity shortcut [^1]. Statement 2 is true. A ResNet block adds its input to its output, whereas a DenseNet block concatenates all earlier feature maps along the channel dimension; this feature reuse keeps the parameter count low, but the concatenations make DenseNets memory-hungry on the GPU [^2].'
    references:
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#function-classes
        locator: Sec. 8.6.1 Function Classes (highway networks predate ResNets)
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#summary-and-discussion
        locator: Sec. 8.7.6 Summary and Discussion (DenseNet)
    source:
      id: mmlu-redux
      ref: machine_learning/83
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=83
    status: draft
  - id: architectures-007
    type: single
    difficulty: medium
    tags:
      - alexnet
      - parameter-count
      - flops
    question: |
      d2l's AlexNet takes a $1 \times 224 \times 224$ input and has five convolutional layers followed by
      fully connected layers of sizes $6400 \to 4096 \to 4096 \to 10$. It has about 46.8 million
      parameters and needs about 0.94 billion multiply–adds per image. How are these shared between the
      convolutional and the fully connected layers?
    options:
      - text: The FC layers hold about 92% of the parameters; the conv layers do about 95% of the multiply–adds
        correct: true
      - text: The conv layers hold about 92% of the parameters; the FC layers do about 95% of the multiply–adds
        why: The conv layers have only about 3.7 million parameters, but each kernel weight is reused at every output position, so they do most of the arithmetic.
      - text: The FC layers dominate both, with about 92% of the parameters and 95% of the multiply–adds
        why: Each FC weight is used exactly once per image, so the 43 million FC weights cost only about 43 million multiply–adds out of 0.94 billion.
      - text: The conv layers dominate both, with about 92% of the parameters and 95% of the multiply–adds
        why: The two hidden FC layers alone need $6400 \times 4096 + 4096 \times 4096 \approx 43$ million weights, most of the 46.8 million [^1].
    explanation: |
      The last two hidden layers need matrices of size $6400 \times 4096$ and $4096 \times 4096$,
      about 164 MB of memory [^1]; all FC layers together hold about 43.0 million of the 46.8 million
      parameters. A fully connected weight is used once per image, whereas a kernel weight is reused at
      every position of the feature map, so the conv layers, with only about 3.7 million parameters, do
      about 895 million of the 938 million multiply–adds. Memory is dominated by the FC layers and
      compute by the convolutions, which is why later designs such as NiN dropped the large FC
      layers [^2]. The counts come from d2l's PyTorch AlexNet with 10 output classes.
    references:
      - source: d2l
        locator: Sec. 8.1.4 Discussion
        url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#discussion
      - source: d2l
        locator: Sec. 8.3 Network in Network (introduction)
        url: https://d2l.ai/chapter_convolutional-modern/nin.html
      - source: d2l
        locator: Sec. 8.1.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/alexnet#ex1
      url: https://d2l.ai/chapter_convolutional-modern/alexnet.html#exercises
    status: draft
  - id: architectures-008
    type: short_answer
    difficulty: medium
    tags:
      - vgg
      - parameter-count
      - fully-connected
    question: |
      d2l's VGG-11 turns a $1 \times 224 \times 224$ image into a $512 \times 7 \times 7$ feature map,
      flattens it, and feeds it to a fully connected layer with 4096 outputs. How many parameters
      (weights and biases) does this first fully connected layer have?
    answer:
      numeric: 102764544
      tolerance: 0
      hint: a whole number
      model: $512 \cdot 7 \cdot 7 \cdot 4096 + 4096 = 102\,764\,544$
    explanation: |
      The flattened feature map has $512 \cdot 7 \cdot 7 = 25\,088$ values, so the layer needs
      $25\,088 \times 4096$ weights plus 4096 biases, about 102.8 million parameters [^1]. In
      single precision that is about 411 MB, the "monstrous matrix" of almost 400 MB that d2l mentions [^2].
      The whole d2l VGG-11 has about 128.8 million parameters, so this one layer holds about 80% of them,
      while the convolutions do about 98% of the 7.5 billion multiply–adds. Replacing the large FC layers
      by global average pooling, as NiN does, removes most of this cost [^2].
    references:
      - source: d2l
        locator: Sec. 8.2.2 VGG Network
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-network
      - source: d2l
        locator: Sec. 8.3 Network in Network (introduction)
        url: https://d2l.ai/chapter_convolutional-modern/nin.html
      - source: d2l
        locator: Sec. 8.2.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/vgg#ex1
      url: https://d2l.ai/chapter_convolutional-modern/vgg.html#exercises
    status: draft
  - id: architectures-009
    type: single
    difficulty: easy
    tags:
      - vgg
      - vgg-blocks
    question: |
      VGG-11 is built with `arch = ((1, 64), (1, 128), (2, 256), (2, 512), (2, 512))`, where each pair
      gives the number of $3 \times 3$ convolutions and the output channels of one VGG block, followed by
      three fully connected layers. Printing the output shape of each top-level module shows the five
      blocks and the three FC layers (plus flatten, ReLU and dropout), only eight entries with weights,
      although VGG-11 has 11 weight layers. Where are the other three?
    options:
      - text: They are the max-pooling layers between the blocks, which count as layers
        why: Pooling layers have no weights; the "11" counts 8 convolutional and 3 fully connected layers [^1].
      - text: They are ReLU activations, which VGG counts among its weight layers
        why: Activations have no parameters, so they are not counted in "VGG-11".
      - text: Inside the last three blocks, each of which stacks two $3 \times 3$ convolutions
        correct: true
      - text: Inside the first three blocks, each of which stacks two $3 \times 3$ convolutions
        why: The first two blocks have one convolution each; only blocks 3 to 5 have two [^1].
    explanation: |
      The tuple gives $1 + 1 + 2 + 2 + 2 = 8$ convolutional layers, and with the 3 fully connected
      layers that makes 11 [^1]. Each VGG block is a `Sequential` of convolutions and ReLUs that ends in
      max-pooling [^2], so a per-module summary reports only the block's final output shape. The second
      convolution in blocks 3, 4 and 5 is hidden inside its block, which is why the summary seems to
      show only eight of the eleven weight layers.
    references:
      - source: d2l
        locator: Sec. 8.2.2 VGG Network
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-network
      - source: d2l
        locator: Sec. 8.2.1 VGG Blocks
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-blocks
      - source: d2l
        locator: Sec. 8.2.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/vgg#ex2
      url: https://d2l.ai/chapter_convolutional-modern/vgg.html#exercises
    status: draft
  - id: architectures-010
    type: short_answer
    difficulty: easy
    tags:
      - nin
      - global-average-pooling
      - parameter-count
    question: |
      NiN's last block outputs a $10 \times 5 \times 5$ tensor, one channel per class, and global average
      pooling turns it into 10 logits. If you instead flatten the tensor and use a fully connected layer
      to produce the 10 logits, how many parameters (weights and biases) does that layer add?
    answer:
      numeric: 2510
      tolerance: 0
      hint: a whole number
      model: $250 \times 10 + 10 = 2510$
    explanation: |
      The flattened tensor has $10 \cdot 5 \cdot 5 = 250$ values, so the layer needs
      $250 \times 10$ weights and 10 biases. That is tiny next to NiN's roughly 2 million parameters: the
      big saving of NiN comes from never having AlexNet-style 4096-wide fully connected layers, since its
      last NiN block already reduces the representation to one channel per class [^1]. Global average
      pooling has no parameters at all and averages over positions, which adds translation invariance [^2];
      the FC head would tie each logit to particular positions of the $5 \times 5$ map.
    references:
      - source: d2l
        locator: Sec. 8.3.2 NiN Model
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#nin-model
      - source: d2l
        locator: Sec. 8.3.4 Summary
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#summary
      - source: d2l
        locator: Sec. 8.3.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/nin#ex3
      url: https://d2l.ai/chapter_convolutional-modern/nin.html#exercises
    status: draft
  - id: architectures-011
    type: short_answer
    difficulty: medium
    tags:
      - nin
      - parameter-count
      - 1x1-convolution
    question: |
      The third NiN block takes 256 input channels and applies a $3 \times 3$ convolution with 384
      output channels, then two $1 \times 1$ convolutions with 384 output channels each, all with
      biases. How many parameters does the block have?
    answer:
      numeric: 1180800
      tolerance: 0
      hint: a whole number
      model: $(384 \cdot 256 \cdot 9 + 384) + 2 \cdot (384 \cdot 384 + 384) = 885\,120 + 295\,680 = 1\,180\,800$
    explanation: |
      A kernel has shape $c_o \times c_i \times k_h \times k_w$, plus one bias per output channel [^2],
      so the $3 \times 3$ convolution has $384 \cdot 256 \cdot 9 + 384 = 885\,120$ parameters. A
      $1 \times 1$ convolution needs only $c_o \times c_i$ weights [^3], here $384 \cdot 384 + 384$ each,
      so the two of them add per-pixel nonlinearity for about a third of the cost of the $3 \times 3$
      layer [^1]. The whole d2l NiN (one input channel, 10 classes) has 1,992,166 parameters, about
      2.0 million against 46.8 million for AlexNet, and this block holds about 59% of them.
    references:
      - source: d2l
        locator: Sec. 8.3.1 NiN Blocks
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#nin-blocks
      - source: d2l
        locator: Sec. 7.4.2 Multiple Output Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#multiple-output-channels
      - source: d2l
        locator: Sec. 7.4.3 1×1 Convolutional Layer
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html
      - source: d2l
        locator: Sec. 8.3.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/nin#ex4
      url: https://d2l.ai/chapter_convolutional-modern/nin.html#exercises
    status: draft
  - id: architectures-012
    type: multiple
    difficulty: medium
    tags:
      - nin
      - googlenet
      - inception
      - parameter-count
      - global-average-pooling
    question: |
      d2l's versions of AlexNet and VGG-11 have about 47 and 129 million parameters, while its NiN and
      GoogLeNet have about 2 and 6 million. Which design choices explain the gap? Select all that apply.
    options:
      - text: They run on smaller images, and convolution kernels need fewer weights for smaller inputs
        why: A kernel has $c_o \times c_i \times k_h \times k_w$ weights whatever the input size [^3].
      - text: NiN replaces AlexNet's $11 \times 11$, $5 \times 5$ and $3 \times 3$ convolutions by $1 \times 1$ convolutions throughout
        why: NiN keeps AlexNet's kernel sizes for the first convolution of each block and adds $1 \times 1$ convolutions after it [^1].
      - text: Their max-pooling layers have fewer weights than the pooling layers of AlexNet and VGG
        why: Pooling layers have no parameters in any of these networks.
      - text: Inception blocks cut the channel count with $1 \times 1$ convolutions before the $3 \times 3$ and $5 \times 5$ ones
        correct: true
      - text: NiN and GoogLeNet end with global average pooling instead of 4096-wide fully connected layers
        correct: true
    explanation: |
      AlexNet and VGG spend most of their parameters in fully connected layers (about 43 of 47 million
      and 120 of 129 million). NiN and GoogLeNet end in global average pooling, NiN with no FC layer at
      all and GoogLeNet with a single $1024 \to 10$ layer [^1][^2]. In the Inception block the two middle
      branches first apply a $1 \times 1$ convolution to cut the channels, for example from 192 to 96
      and to 16, so the expensive $3 \times 3$ and $5 \times 5$ kernels see few input channels [^2]. The
      number of kernel weights does not depend on the image size [^3]. The counts come from d2l's code
      with one input channel and 10 classes.
    references:
      - source: d2l
        locator: Sec. 8.3.2 NiN Model and Sec. 8.3.4 Summary
        url: https://d2l.ai/chapter_convolutional-modern/nin.html#nin-model
      - source: d2l
        locator: Sec. 8.4.1 Inception Blocks and Sec. 8.4.2 GoogLeNet Model
        url: https://d2l.ai/chapter_convolutional-modern/googlenet.html#inception-blocks
      - source: d2l
        locator: Sec. 7.4.2 Multiple Output Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#multiple-output-channels
      - source: d2l
        locator: Sec. 8.4.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-modern/googlenet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/googlenet#ex4
      url: https://d2l.ai/chapter_convolutional-modern/googlenet.html#exercises
    status: draft
  - id: architectures-013
    type: single
    difficulty: medium
    tags:
      - resnet
      - inception
      - residual-connection
    question: How does a residual block differ from an Inception block in the way it combines its branches?
    options:
      - text: A residual block concatenates its input and output along the channels; Inception adds its four branches together
        why: Concatenating input and output is DenseNet's pattern; ResNet adds them, and Inception concatenates its branches [^1][^2].
      - text: Both concatenate their branches along the channel axis, so they differ only in which kernel sizes they use
        why: A residual block adds its two branches elementwise, which is why their shapes must match [^2].
      - text: A residual block adds a learned branch to an identity path; Inception concatenates four learned branches
        correct: true
      - text: Both add their branches elementwise, so they differ only in how many parallel branches they contain
        why: Inception concatenates the outputs of its four branches along the channel dimension [^1].
    explanation: |
      An Inception block runs four parallel branches ($1 \times 1$, $3 \times 3$, $5 \times 5$ and
      pooling) and concatenates their outputs along the channels [^1]. A residual block has two
      branches, one of them the identity, and adds them: $f(\mathbf{x}) = \mathbf{x} + g(\mathbf{x})$
      before the final ReLU. d2l calls it a special case of the multi-branch Inception block, and the
      addition is why a $1 \times 1$ convolution is needed when the number of channels changes [^2].
      Pushing the weights of $g$ to zero turns a residual block into the identity, so each added block
      keeps the function classes nested, which an Inception block does not guarantee [^3].
    references:
      - source: d2l
        locator: Sec. 8.4.1 Inception Blocks
        url: https://d2l.ai/chapter_convolutional-modern/googlenet.html#inception-blocks
      - source: d2l
        locator: Sec. 8.6.2 Residual Blocks
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#residual-blocks
      - source: d2l
        locator: Sec. 8.6.1 Function Classes
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#function-classes
      - source: d2l
        locator: Sec. 8.6.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/resnet#ex1
      url: https://d2l.ai/chapter_convolutional-modern/resnet.html#exercises
    status: draft
  - id: architectures-014
    type: single
    difficulty: medium
    tags:
      - resnet
      - function-classes
      - overfitting
    question: |
      With residual connections, each larger ResNet contains the smaller ones as special cases: the
      function classes are nested. Why can we still not keep adding layers and expect ever better test
      accuracy?
    options:
      - text: Nesting only guarantees an equal or better training fit; a bigger class can overfit and costs more
        correct: true
      - text: Every added layer raises the training error, because the identity path accumulates noise from all earlier layers
        why: A block that learns the identity leaves the function unchanged, so the best training error cannot get worse [^1].
      - text: Beyond about 152 layers the residual branches can no longer learn the zero mapping, so the classes stop being nested
        why: Any residual block can still represent the identity by setting its branch to zero, at any depth [^1].
      - text: Nested classes all contain exactly the same functions, so extra layers add no expressive power
        why: A larger nested class contains the smaller one plus new functions, so it is strictly more expressive [^1].
    explanation: |
      Nested classes guarantee that the best function in the larger class is at least as good on the
      training objective, so the achievable training fit never gets worse [^1]. Test accuracy also
      depends on how well the training data pin down the right function. A larger class can overfit and
      needs more data or regularization to generalize [^2], every layer costs memory and compute, and the
      optimizer is not guaranteed to find the best function in the class.
    references:
      - source: d2l
        locator: Sec. 8.6.1 Function Classes
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#function-classes
      - source: d2l
        locator: Sec. 3.6.2 Underfitting or Overfitting?
        url: https://d2l.ai/chapter_linear-regression/generalization.html#underfitting-or-overfitting
      - source: d2l
        locator: Sec. 8.6.7 Exercises, Exercise 5
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/resnet#ex5
      url: https://d2l.ai/chapter_convolutional-modern/resnet.html#exercises
    status: draft
  - id: architectures-015
    type: single
    difficulty: medium
    tags:
      - densenet
      - resnet
      - parameter-count
      - growth-rate
    question: |
      d2l builds a DenseNet with four dense blocks of four convolution blocks each (growth rate 32), to
      match the four stages of its ResNet-18. The DenseNet has about 0.76 million parameters and the
      ResNet-18 about 11.2 million. What is the main reason?
    options:
      - text: DenseNet replaces batch normalization, which holds many parameters, with average pooling in every block
        why: DenseNet uses batch normalization in every convolution block, and it costs only two parameters per channel [^1].
      - text: DenseNet uses $1 \times 1$ kernels in its dense blocks, while ResNet-18 uses $3 \times 3$ kernels throughout
        why: The convolutions inside d2l's dense blocks are $3 \times 3$; $1 \times 1$ convolutions appear only in the transition layers [^1][^2].
      - text: Concatenation shares weights between layers, so each kernel has to be stored only once for the whole network
        why: Concatenation shares features, not weights; every convolution block still has its own kernel.
      - text: Each layer adds only 32 channels and gets earlier features by concatenation, so its convolutions stay narrow
        correct: true
    explanation: |
      In a dense block every convolution block outputs only the growth rate of 32 channels and its
      input is concatenated to its output, so four blocks add $4 \times 32 = 128$ channels [^1]; transition
      layers then halve the channels with a $1 \times 1$ convolution [^2]. ResNet-18's convolutions map
      64 up to 512 channels to the same number again, and a single $512 \to 512$ $3 \times 3$ convolution
      already has about 2.4 million weights. Because every layer can read all earlier feature maps, it
      does not have to carry them forward itself, and the DenseNet paper credits this feature reuse for
      its parameter efficiency [^3].
    references:
      - source: d2l
        locator: Sec. 8.7.2 Dense Blocks and Sec. 8.7.4 DenseNet Model
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#dense-blocks
      - source: d2l
        locator: Sec. 8.7.3 Transition Layers
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#transition-layers
      - title: Densely Connected Convolutional Networks (Huang et al., 2017)
        locator: Abstract and Sec. 3 DenseNets (Growth rate)
        url: https://arxiv.org/abs/1608.06993
      - source: d2l
        locator: Sec. 8.7.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/densenet#ex2
      url: https://d2l.ai/chapter_convolutional-modern/densenet.html#exercises
    status: draft
  - id: architectures-016
    type: short_answer
    difficulty: easy
    tags:
      - densenet
      - growth-rate
      - channels
    question: |
      A dense block receives 64 channels and has four convolution blocks, each producing 32 channels
      (growth rate 32); each convolution block's output is concatenated to its input along the
      channels. How many input channels does the fourth convolution block see?
    answer:
      numeric: 160
      tolerance: 0
      hint: a whole number
      model: $64 + 3 \times 32 = 160$; the whole block outputs $64 + 4 \times 32 = 192$ channels.
    explanation: |
      Each convolution block appends its 32 new channels to everything before it, so the $\ell$-th block
      sees the block input plus the outputs of the $\ell - 1$ blocks before it, $c_0 + (\ell - 1)k$
      channels [^1][^2]. For $\ell = 4$ that is $64 + 3 \cdot 32 = 160$, and the block ends with 192
      channels; d2l's small example works the same way, with 3 input channels and two blocks of 10
      giving $3 + 10 + 10 = 23$ [^1]. The width grows linearly through a dense block, which is why
      transition layers compress it between blocks.
    references:
      - source: d2l
        locator: Sec. 8.7.2 Dense Blocks
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#dense-blocks
      - title: Densely Connected Convolutional Networks (Huang et al., 2017)
        locator: Sec. 3 DenseNets, Growth rate
        url: https://arxiv.org/abs/1608.06993
      - source: d2l
        locator: Sec. 8.7.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-modern/densenet.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/densenet#ex2-b
      url: https://d2l.ai/chapter_convolutional-modern/densenet.html#exercises
    status: draft
  - id: architectures-017
    type: single
    difficulty: medium
    tags:
      - squeeze-and-excitation
      - attention
      - channel-attention
    question: |
      A squeeze-and-excitation (SE) block global-average-pools each channel of a feature map, passes
      the pooled vector through two fully connected layers, and rescales channel $c$ by a weight
      $s_c = \sigma(\cdot)_c$ given by a sigmoid. Read as an attention mechanism, how do these weights
      differ from softmax attention pooling?
    options:
      - text: They are sigmoid gates, one per channel, that need not sum to 1, so several channels can stand out
        correct: true
      - text: They form a softmax over spatial positions, like attention over the patches of an image
        why: There is one weight per channel; global pooling has already removed the spatial positions [^1].
      - text: They are fixed after training and do not depend on the input image
        why: They are computed from the pooled descriptor of each input, so they change from image to image [^1].
      - text: They pick exactly one channel, a hard form of attention that sets every other channel to exactly zero
        why: Sigmoid gates are soft and not mutually exclusive [^1].
    explanation: |
      An SE block squeezes each channel to one number by global average pooling, then computes
      $\mathbf{s} = \sigma(\mathbf{W}_2\,\mathrm{ReLU}(\mathbf{W}_1\mathbf{z}))$ and rescales channel
      $c$ by $s_c$ [^1]. The authors chose a sigmoid, not a softmax, because several channels may need
      to be emphasized at once rather than one-hot [^1]. In d2l's terms the weights are nonnegative
      but not a convex combination, a case the attention framework allows next to the more common
      softmax normalization [^2].
    references:
      - title: Hu, Shen, Albanie, Sun & Wu (2017), Squeeze-and-Excitation Networks
        url: https://arxiv.org/abs/1709.01507
        locator: Sec. 3.1 Squeeze; Sec. 3.2 Excitation (Eqs. 2–4)
      - source: d2l
        locator: Sec. 11.1 Queries, Keys, and Values (special cases of attention weights)
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html
      - source: d2l
        locator: Sec. 11.1.3 Exercises, Exercise 4
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/queries-keys-values#ex4
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html#exercises
    status: draft
  - id: architectures-018
    type: single
    difficulty: medium
    tags:
      - graph-neural-networks
      - aggregation
      - message-passing
    question: |
      A message-passing GNN aggregates the neighbour features of node $v$ as
      $f\big(\sum_{u \in N(v)} g(h_u)\big)$, where $g$ is applied to each neighbour separately and $f$
      sees only the sum. Which choice of $f$ and $g$ gives the mean of the neighbour features?
    options:
      - text: $g(h) = (h, 1)$ and $f(s, c) = s / c$
        correct: true
      - text: $g(h) = h / \lvert N(v) \rvert$ and $f(s) = s$
        why: $g$ sees one neighbour's feature at a time and does not know how many neighbours $v$ has.
      - text: $g(h) = h$ and $f(s) = s / d$, with $d$ the feature dimension
        why: The sum must be divided by the number of neighbours, not by the feature dimension; $f$ needs that count from the sum.
      - text: $g(h) = e^{h}$ and $f(s) = \log s$
        why: This is log-sum-exp, a smooth version of the maximum, not the mean.
    explanation: |
      Appending a constant 1 to each message makes the sum carry two things: the feature total
      $\sum_u h_u$ and the neighbour count $\lvert N(v) \rvert$ [^1]. $f$ can then divide one by the other.
      Sum aggregation with learned $f$ and $g$ (MLPs in practice) is the most expressive of the
      standard aggregators, because a sum over a multiset can be made injective while mean and max
      cannot [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Graph neural networks, Problem 15(a)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?, arXiv:1810.00826
        locator: Sec. 4 Building powerful graph neural networks; Sec. 5 Less powerful but still interesting GNNs
        url: https://arxiv.org/abs/1810.00826
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q15a
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: draft
  - id: architectures-019
    type: single
    difficulty: hard
    tags:
      - graph-neural-networks
      - aggregation
      - log-sum-exp
    question: |
      With the same sum-based aggregator $f\big(\sum_{u \in N(v)} g(h_u)\big)$ and scalar features, which
      choice approximates the maximum $\max_{u \in N(v)} h_u$ arbitrarily well for large $\beta > 0$?
    options:
      - text: $g(h) = e^{\beta h}$, $f(s) = (\log s) / \beta$
        correct: true
      - text: $g(h) = \beta h^2$, $f(s) = \sqrt{s / \beta}$
        why: The $\beta$ cancels, leaving the Euclidean norm of the features, which loses their signs and grows with the number of neighbours.
      - text: $g(h) = e^{\beta h}$, $f(s) = s / \beta$
        why: Without the logarithm the output grows like $e^{\beta \max_u h_u} / \beta$ instead of approaching the maximum.
      - text: $g(h) = (\beta h, 1)$, $f(s, c) = s / (\beta c)$
        why: The $\beta$ cancels and this is the mean of the features, which lies below the maximum unless all features are equal.
    explanation: |
      The log-sum-exp satisfies $\max_u h_u \le \tfrac{1}{\beta}\log\sum_u e^{\beta h_u} \le \max_u h_u + \tfrac{\log n}{\beta}$
      for $n$ neighbours, so the error vanishes as $\beta$ grows [^1]. The homework's hint points to the
      same idea with norms: $(\sum_u \lvert h_u \rvert^p)^{1/p} \to \max_u \lvert h_u \rvert$ as $p \to \infty$, made
      sign-safe by shifting features from $[-C, C]$ to $[0, 2C]$ first [^2]. Either way a sum aggregator
      with suitable $f$ and $g$ can emulate max aggregation.
    references:
      - title: 'Wikipedia: LogSumExp'
        locator: Properties
        url: https://en.wikipedia.org/wiki/LogSumExp#Properties
      - source: mit-ocw-67960
        locator: Homework 2, Graph neural networks, Problem 15(b)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q15b
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: draft
  - id: architectures-020
    type: single
    difficulty: hard
    tags:
      - graph-neural-networks
      - weisfeiler-leman
      - expressivity
    question: |
      Every node starts with the same feature vector. Which pair of graphs can no message-passing GNN
      tell apart, whatever its aggregate, update and readout functions?
    options:
      - text: A 6-cycle and two disjoint triangles
        correct: true
      - text: A triangle and a path of three nodes
        why: The path has two degree-1 nodes, so after one round of message passing the node features already differ.
      - text: A 4-cycle and a star with one centre and three leaves
        why: The star's centre has degree 3 and its leaves degree 1, while every 4-cycle node has degree 2, so one round separates them.
      - text: A 4-cycle and a path of four nodes
        why: The path's end nodes have degree 1, so their messages differ from the cycle's after one round.
    explanation: |
      A message-passing GNN can separate two graphs only if the 1-dimensional Weisfeiler–Leman test can
      [^1][^2]. In a 6-cycle and in two triangles every node has exactly two neighbours, so at every
      round each node receives the same messages and all 12 nodes keep identical features. The readout
      then sees the same multiset of six features for both graphs, although one graph has two
      triangles and the other none, so such GNNs cannot count triangles [^3].
    references:
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?, arXiv:1810.00826
        locator: Sec. 4 Building powerful graph neural networks, Lemma 2
        url: https://arxiv.org/abs/1810.00826
      - title: 'Wikipedia: Weisfeiler Leman graph isomorphism test'
        locator: Introduction (relation to graph neural networks)
        url: https://en.wikipedia.org/wiki/Weisfeiler_Leman_graph_isomorphism_test
      - source: mit-ocw-67960
        locator: Homework 2, Graph neural networks, Problem 16(c)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q16c
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
