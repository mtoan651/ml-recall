  - id: architectures-021
    type: true_false
    difficulty: medium
    tags:
      - graph-neural-networks
      - molecules
      - chirality
    shuffle: false
    question: |
      A molecule is given to a message-passing GNN as a graph: atoms are nodes whose features encode the
      element, bonds are edges whose features encode the bond type. True or false: such a GNN can tell
      a chiral molecule from its mirror image.
    options:
      - text: 'True'
        why: A molecule and its mirror image have the same atoms joined by the same bonds, so their graphs are identical and every GNN output is identical too [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      Mirror-image (chiral) molecules differ only in the 3D arrangement of their atoms; their
      connectivity is the same [^1]. A GNN that sees only the graph is a function of that connectivity
      and the node and edge features, so it gives both the same output [^2]. To separate them, the
      input must carry geometry, for example 3D coordinates or explicit chirality tags on the atoms.
    references:
      - title: 'Wikipedia: Chirality (chemistry)'
        locator: Introduction
        url: https://en.wikipedia.org/wiki/Chirality_(chemistry)
      - source: mit-ocw-67960
        locator: Homework 2, Graph neural networks, Problem 17
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q17
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
