  - id: cnn-029
    type: single
    difficulty: medium
    tags:
      - 1x1-convolution
      - floating-point
      - code-reading
    question: |
      d2l checks that a $1 \times 1$ convolution written as one matrix product agrees with its general
      multichannel cross-correlation:

      ```python
      Y1 = corr2d_multi_in_out_1x1(X, K)  # reshape, then one matmul
      Y2 = corr2d_multi_in_out(X, K)      # corr2d per channel, then a Python sum
      assert float(torch.abs(Y1 - Y2).sum()) < 1e-6
      ```

      Why does the check use a tolerance instead of testing for exact equality?
    options:
      - text: Both compute the same sums, but in a different order, and float rounding depends on the order
        correct: true
      - text: The general version pads the input, so its border values come out slightly different
        why: '`corr2d` uses no padding, and with a $1 \times 1$ kernel both outputs keep the height and width of the input.'
      - text: '`torch.normal` draws fresh random numbers each time a function reads `X` or `K`'
        why: '`X` and `K` are drawn once and the same tensors are passed to both functions.'
      - text: The matrix version leaves out the bias term, so the two results always differ by a small constant offset
        why: Neither function adds a bias; both compute only the weighted sums over the input channels.
    explanation: |
      Mathematically both functions compute $\sum_c K_{o,c} X_{c,i,j}$ for every output [^1]. In
      floating point, addition is not associative: $(a + b) + c$ and $a + (b + c)$ can differ in the
      last bits [^2]. The matrix-multiplication routine may accumulate the products in a different order
      (blocked, vectorized) than the Python sum over channels, so `Y1` and `Y2` can differ by about
      $10^{-7}$. They may match exactly on some inputs, but nothing guarantees it, which is why such
      tests compare floats with a tolerance, as `torch.allclose` does [^3].
    references:
      - source: d2l
        locator: Sec. 7.4.3 1×1 Convolutional Layer
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html
      - title: 'Wikipedia: Floating-point arithmetic'
        locator: Accuracy problems (addition is not associative)
        url: https://en.wikipedia.org/wiki/Floating-point_arithmetic#Accuracy_problems
      - title: torch.allclose (PyTorch documentation)
        locator: Function description
        url: https://docs.pytorch.org/docs/stable/generated/torch.allclose.html
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/channels#ex4
      url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    status: draft
  - id: cnn-030
    type: short_answer
    difficulty: easy
    tags:
      - grouped-convolution
      - block-diagonal
      - computational-cost
    question: |
      A layer multiplies a 256-dimensional channel vector by a dense $256 \times 256$ weight matrix.
      You replace it with a block-diagonal matrix of 8 blocks of size $32 \times 32$, as a grouped
      convolution with 8 groups does. By what factor does the number of multiplications drop?
    answer:
      numeric: 8
      tolerance: 0
      hint: a whole number
      model: $256^2 = 65\,536$ against $8 \times 32^2 = 8192$, a factor of 8.
    explanation: |
      Only the diagonal blocks are nonzero, so the product needs $b$ small products of size
      $(c/b) \times (c/b)$, that is $c^2/b$ multiplications instead of $c^2$. d2l derives the same for a
      grouped convolution with $g$ groups: the cost falls from $\mathcal{O}(c_i c_o)$ to
      $\mathcal{O}(c_i c_o / g)$, and the number of parameters falls by the same factor $g$ [^1]. It
      also notes that a grouped convolution can be viewed as a block-diagonal weight matrix [^2].
    references:
      - source: d2l
        locator: Sec. 8.6.5 ResNeXt
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#resnext
      - source: d2l
        locator: Sec. 8.6.6 Summary and Discussion
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#summary-and-discussion
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 7
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
