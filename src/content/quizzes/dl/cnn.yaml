  - id: cnn-059
    type: true_false
    difficulty: medium
    tags:
      - max-pooling
      - receptive-field
    question: |
      True or false: for every input height and width, two consecutive `nn.MaxPool2d(2, 2)` layers give
      exactly the same output as one `nn.MaxPool2d(4, 4)`.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The windows do not overlap, so each $4 \times 4$ window is exactly the union of four $2 \times 2$ windows pooled by the second layer.
    explanation: |
      True. With window equal to stride the windows tile the input, and output $(i, j)$ of the second
      pooling takes the maximum of four first-level maxima, which together cover rows $4i$ to $4i + 3$
      and columns $4j$ to $4j + 3$, the same block as `MaxPool2d(4, 4)` [^2]. The sizes match too,
      $\lfloor\lfloor n / 2 \rfloor / 2\rfloor = \lfloor n / 4 \rfloor$, and both drop the same leftover
      rows and columns [^1][^2]. This breaks for overlapping windows, for example `MaxPool2d(3, 2)`.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-240 part 5, p. 273; Solution SOL-240 part 5, p. 324
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
    source:
      id: dl-interviews
      ref: ch8#prb240-2
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: cnn-060
    type: single
    difficulty: easy
    tags:
      - batch-normalization
      - channels
    question: |
      This module fails when an image batch is passed through `self.cnn` and then `self.math`:

      ```python
      self.cnn = nn.Sequential(nn.Conv2d(3, 64, kernel_size=3, padding=2))
      self.math = nn.Sequential(nn.BatchNorm2d(32), nn.PReLU(), nn.Dropout2d(0.05))
      ```

      Which fix is correct?
    options:
      - text: '`nn.BatchNorm2d(64)`: one mean and variance per convolution output channel'
        correct: true
      - text: '`nn.BatchNorm2d(3)`: one mean and variance per RGB channel of the input image'
        why: Batch normalization normalizes the tensor it receives, which has the 64 channels of the convolution's output [^2].
      - text: '`nn.BatchNorm2d(32)`, but with a batch size of 32'
        why: The argument is the number of channels, not the batch size [^3].
      - text: '`nn.BatchNorm1d(64)`: one mean and variance per pixel'
        why: After a convolution, batch norm keeps one mean and variance per channel, computed over the batch and all positions [^2].
    explanation: |
      `BatchNorm2d(C)` expects an input of shape $(N, C, H, W)$ and learns a scale and a shift for each of
      the $C$ channels [^3]. For convolutional layers the statistics are computed per output channel over
      all $N \cdot H \cdot W$ values of that channel, so that the same normalization applies at every
      position [^2]. The convolution outputs 64 channels, so the layer must be `BatchNorm2d(64)` [^1].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-243, pp. 274–275; Solution SOL-243, p. 325
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 8.5.2.2 Convolutional Layers
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#convolutional-layers
      - title: torch.nn.BatchNorm2d (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html
        locator: Parameters (num_features) and Shape
    source:
      id: dl-interviews
      ref: ch8#prb243
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: cnn-061
    type: single
    difficulty: medium
    tags:
      - convolution
      - cross-correlation
      - numpy
    question: What does `np.convolve([1, 2, 3], [1, -1])` return?
    options:
      - text: '`[1, 1, 1, -3]`'
        correct: true
      - text: '`[-1, -1, -1, 3]`'
        why: This is `np.correlate([1, 2, 3], [1, -1], "full")`, which does not flip the second sequence [^2].
      - text: '`[1, 1]`'
        why: That is only the `"valid"` part; the default mode `"full"` returns all $3 + 2 - 1 = 4$ overlaps [^2].
      - text: '`[-1, -1]`'
        why: That is the valid part of the correlation; convolution flips the kernel and returns the full length by default.
    explanation: |
      The full convolution $c_k = \sum_n a_n b_{k-n}$ has $3 + 2 - 1 = 4$ entries:
      $c_0 = 1$, $c_1 = 2 - 1 = 1$, $c_2 = 3 - 2 = 1$, $c_3 = -3$ [^1][^2]. The kernel $[1, -1]$ is flipped
      before sliding, so in the middle each output is a forward difference, $a_n - a_{n-1}$. Correlating
      instead (no flip) gives the same magnitudes with opposite signs, $[-1, -1, -1, 3]$ [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-197, p. 240; Solution SOL-197, Figs. 8.52–8.53, p. 295
        url: https://arxiv.org/abs/2201.00650v2
      - title: numpy.convolve (NumPy documentation)
        url: https://numpy.org/doc/stable/reference/generated/numpy.convolve.html
        locator: Notes (definition) and mode 'full'
    source:
      id: dl-interviews
      ref: ch8#prb197
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: cnn-062
    type: short_answer
    difficulty: medium
    tags:
      - padding
      - stride
      - same-padding
    question: |
      A $3 \times 3$ convolution with stride 2 is applied to a $225 \times 225$ input using TensorFlow's
      `"SAME"` padding, which pads just enough that the output size is $\lceil n / s \rceil$. How many
      pixels per side does the output have? (With `"VALID"` padding, which adds no padding, it would be
      112.)
    answer:
      numeric: 113
      tolerance: 0
      hint: a whole number
      model: $\lceil 225 / 2 \rceil = 113$
    explanation: |
      "VALID" uses only positions where the kernel fits inside the input, giving
      $\lfloor (225 - 3) / 2 \rfloor + 1 = 112$ [^1][^3]. "SAME" adds zeros at the border so that every
      input value can be covered; with stride 1 the output then has the input's size, and with stride $s$
      it has $\lceil n / s \rceil = 113$ pixels [^2][^3]. Here that takes 2 padding pixels in total.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-189 and PRB-190, p. 236; Solutions SOL-189 and SOL-190, p. 292
        url: https://arxiv.org/abs/2201.00650v2
      - title: tf.nn.convolution (TensorFlow API documentation)
        url: https://www.tensorflow.org/api_docs/python/tf/nn/convolution
        locator: Description of padding ("SAME" output shape)
      - source: d2l
        locator: Sec. 7.3.2 Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
    source:
      id: dl-interviews
      ref: ch8#prb189
      url: https://arxiv.org/abs/2201.00650v2
