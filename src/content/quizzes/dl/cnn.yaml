  - id: cnn-050
    type: short_answer
    difficulty: medium
    tags:
      - global-average-pooling
      - parameter-count
      - classifier-head
    question: |
      A convolutional base outputs 512 feature maps of size $5 \times 5$ per image, and the head is a
      single `Dense(1, activation='sigmoid')` unit. That unit has {{1}} trainable parameters if the
      maps are flattened first, and {{2}} if they first go through global average pooling.
    answer:
      blanks:
        - numeric: 12801
          tolerance: 0
          hint: with Flatten
        - numeric: 513
          tolerance: 0
          hint: with global average pooling
      model: Flatten gives $5 \cdot 5 \cdot 512 + 1 = 12801$; global average pooling gives $512 + 1 = 513$.
    explanation: |
      `Flatten` unstacks every activation, giving $5 \times 5 \times 512 = 12800$ inputs plus a bias.
      `GlobalAvgPool2D` instead replaces each feature map by its average value, giving 512 inputs plus
      a bias, 25 times fewer weights [^1]. Each pooled value acts as a score for one high-level
      feature, large if it is present and small if not, and the head only has to map these scores to
      the classes [^2].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 3 exercise, Global Average Pooling (text before Question 3)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/ex3.ipynb
