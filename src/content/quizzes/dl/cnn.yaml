  - id: cnn-040
    type: single
    difficulty: medium
    tags:
      - edge-detection
      - kernels
    question: |
      The kernel $\begin{bmatrix}1 & -1\\ 1 & -1\end{bmatrix}$ responds strongly to vertical edges (a left–right change in
      brightness). You transpose it to $\begin{bmatrix}1 & 1\\ -1 & -1\end{bmatrix}$ and apply it to an image that contains only
      a vertical edge: bright columns on the left, dark on the right, every row identical. What does the transposed
      kernel detect, and what does it output on this image?
    options:
      - text: Horizontal edges; on this image it outputs zero everywhere
        correct: true
      - text: Vertical edges again; it outputs the same map with the sign flipped
        why: 'Transposing swaps rows and columns: the kernel now compares the top row of each window with the bottom row, i.e. it detects horizontal edges.'
      - text: Horizontal edges; it outputs large values along the vertical edge
        why: Every row is identical, so top minus bottom is zero in every window, including those on the edge.
      - text: Diagonal edges; it outputs half the response of the original kernel
        why: The transposed kernel subtracts the bottom row from the top row, a horizontal-edge detector, and its response here is exactly zero.
    explanation: |
      The transposed kernel adds the top row of each $2 \times 2$ window and subtracts the bottom row, so it responds to
      brightness changes from top to bottom: horizontal edges [^1]. In an image with a purely vertical edge every row is
      identical, so top and bottom cancel in every window and the output is 0 everywhere [^1][^2]. The original kernel,
      which subtracts the right column from the left, is the one that fires on this edge [^1].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 1, Section 2.2 Padding and Edge Detection, Think! 2.2.1 and Think! 2.2.2 Kernel structure
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 7.2.3 Object Edge Detection in Images
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#object-edge-detection-in-images
    source:
      id: neuromatch-dl
      ref: W2D2_Convnets/W2D2_Tutorial1#think2.2.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
