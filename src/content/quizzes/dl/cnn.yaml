  - id: cnn-003
    type: true_false
    difficulty: easy
    question: CNNs are mostly used for computer vision tasks.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      CNNs are built to exploit the 2D grid structure of images, and CNN-based architectures are now
      everywhere in computer vision [^2]. The lesson adds that they are not limited to images: they
      are good at finding fixed-size patterns in general, so 1D CNNs are used on audio and 3D CNNs on
      video, but vision remains their main use [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md#review--self-study
        locator: 'Lesson: Convolutional Neural Networks, Well-Known CNN Architectures (Review & Self Study)'
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-neural-networks/index.html
        locator: Ch. 7 Convolutional Neural Networks (chapter introduction)
    source:
      id: ms-ai-for-beginners
      ref: quiz-107/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-7.json
