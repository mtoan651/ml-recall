  - id: cnn-053
    type: single
    difficulty: hard
    tags:
      - circulant
      - fourier
      - convolution-theorem
    question: |
      Every $n \times n$ circulant matrix is a polynomial $C = c_0 I + c_1 P + \dots + c_{n-1}P^{n-1}$ in the
      cyclic shift $P$, so it performs a cyclic convolution. What are the eigenvectors of circulant
      matrices, and what follows for the product $CD$ of two circulants?
    options:
      - text: The Fourier modes; the eigenvalues of $CD$ are the products of those of $C$ and $D$
        correct: true
      - text: The standard basis vectors; the eigenvalues of $CD$ are the products of those of $C$ and $D$
        why: $P$ moves each standard basis vector to the next one, so they are not eigenvectors of $P$ or of its polynomials.
      - text: The Fourier modes; the eigenvalues of $CD$ are the sums of those of $C$ and $D$
        why: Sums of eigenvalues belong to $C + D$; for a product with shared eigenvectors they multiply.
      - text: They depend on the coefficients $c_k$, so two circulants share eigenvectors only if $CD = DC$
        why: All circulants are polynomials in the same $P$, so they all share $P$'s eigenvectors and always commute.
    explanation: |
      The eigenvectors of the shift $P$ are the Fourier modes, and every polynomial in $P$ has the same
      eigenvectors; its eigenvalues are the discrete Fourier transform of its first column [^1]. Since
      all circulants are diagonalized by the same basis, they commute and the eigenvalues of $CD$
      multiply [^1]. In signal terms this is the convolution theorem: cyclic convolution becomes
      elementwise multiplication of DFTs, which is how FFT-based convolution works [^2].
    references:
      - title: 'Wikipedia: Circulant matrix'
        locator: Properties — Eigenvectors and eigenvalues; Other properties
        url: https://en.wikipedia.org/wiki/Circulant_matrix
      - source: mit-ocw-18065
        locator: Problems for Lectures 31–32 (textbook Section IV.2), Problems 4–5
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec32-q4
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
