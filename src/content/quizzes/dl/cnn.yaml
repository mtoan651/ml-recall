  - id: cnn-028
    type: short_answer
    difficulty: medium
    tags:
      - computational-cost
      - padding
    question: |
      A $3 \times 3$ convolution with stride 1 runs on a $32 \times 32$ input. With padding 1 on every
      side the output is $32 \times 32$. By what factor does the number of multiplications grow if you
      double the padding to 2 on every side?
    answer:
      numeric: 1.129
      tolerance: 0.005
      hint: a number, 2 decimals
      model: The output grows to $34 \times 34$, so the factor is $(34/32)^2 \approx 1.13$.
    explanation: |
      With a total padding of $p$ per dimension the output size is $n - k + p + 1$ [^1], so 4 padding
      rows and columns give $32 - 3 + 4 + 1 = 34$. The cost per output value does not change, so the
      total grows with the number of outputs, $34^2 / 32^2 \approx 1.13$. Doubling the padding barely
      changes the compute, unlike doubling the channels (a factor of 4) [^2], but the output is now
      larger than the input, and its new border values come from windows that are mostly zeros.
    references:
      - source: d2l
        locator: Sec. 7.3.1 Padding, Eq. (7.3.1)
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#padding
