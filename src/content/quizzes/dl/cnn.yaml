  - id: cnn-032
    type: single
    difficulty: medium
    tags:
      - pooling
      - average-pooling
      - depthwise-convolution
      - code-reading
    question: |
      You want a convolution that reproduces `nn.AvgPool2d(2)` (a $2 \times 2$ window with stride 2)
      on a `c`-channel input. Each candidate below gets all its weights set to `0.25` and no bias.
      Which one matches the pooling layer?
    options:
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=1, groups=c)`'
        why: With stride 1 the windows overlap and the output is $(h - 1) \times (w - 1)$; `AvgPool2d(2)` uses a stride equal to its window size [^2].
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=2, groups=c)`'
        correct: true
      - text: '`nn.Conv2d(c, 1, kernel_size=2, stride=2)`'
        why: This has a single output channel, while pooling keeps the number of channels [^3].
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=2)`'
        why: Without groups, each output channel sums over all `c` input channels, so channels get mixed; pooling handles each channel on its own [^3].
    explanation: |
      Average pooling outputs the mean of each window and has no parameters [^1]; frameworks set the
      stride equal to the window size by default [^2], and pooling processes every channel separately,
      so the number of channels stays the same [^3]. A depthwise convolution (`groups=c`) applies one
      $2 \times 2$ kernel to each channel; with all weights $1/(p_h p_w) = 0.25$ and stride 2 it computes
      exactly the mean of each window [^4]. A normal convolution would instead add up the results of all
      input channels, as a multichannel convolution does.
    references:
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
      - source: d2l
        locator: Sec. 7.5.3 Multiple Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#multiple-channels
      - title: torch.nn.Conv2d (PyTorch documentation)
        locator: Parameters, groups
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
