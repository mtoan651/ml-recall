  - id: cnn-055
    type: short_answer
    difficulty: easy
    tags:
      - max-pooling
    question: |
      `MaxPool2d(2, 2)` (window $2 \times 2$, stride 2, no padding) is applied to

      $$\begin{bmatrix} -1 & 0 & 11 & -1 \\ -1 & 7 & 1 & -1 \\ -1 & 0 & 1 & -1 \\ -1 & 0 & 1 & -1 \end{bmatrix}.$$

      Fill in the $2 \times 2$ output. Top left: {{1}}, top right: {{2}}, bottom left: {{3}},
      bottom right: {{4}}.
    answer:
      blanks:
        - numeric: 7
          tolerance: 0
        - numeric: 11
          tolerance: 0
        - numeric: 0
          tolerance: 0
        - numeric: 1
          tolerance: 0
      model: $\begin{bmatrix} 7 & 11 \\ 0 & 1 \end{bmatrix}$
    explanation: |
      The window and the stride are both 2, so the input splits into four non-overlapping $2 \times 2$
      blocks, and each output is the maximum of one block [^2]: $\max(-1, 0, -1, 7) = 7$,
      $\max(11, -1, 1, -1) = 11$, $\max(-1, 0, -1, 0) = 0$ and $\max(1, -1, 1, -1) = 1$ [^1]. Max-pooling
      halves the height and width and has no parameters.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-239, pp. 270–271; Solution SOL-239, p. 323
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
    source:
      id: dl-interviews
      ref: ch8#prb239
      url: https://arxiv.org/abs/2201.00650v2
