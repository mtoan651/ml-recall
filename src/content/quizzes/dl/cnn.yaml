  - id: cnn-032
    type: single
    difficulty: medium
    tags:
      - pooling
      - average-pooling
      - depthwise-convolution
      - code-reading
    question: |
      You want a convolution that reproduces `nn.AvgPool2d(2)` (a $2 \times 2$ window with stride 2)
      on a `c`-channel input. Each candidate below gets all its weights set to `0.25` and no bias.
      Which one matches the pooling layer?
    options:
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=1, groups=c)`'
        why: With stride 1 the windows overlap and the output is $(h - 1) \times (w - 1)$; `AvgPool2d(2)` uses a stride equal to its window size [^2].
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=2, groups=c)`'
        correct: true
      - text: '`nn.Conv2d(c, 1, kernel_size=2, stride=2)`'
        why: This has a single output channel, while pooling keeps the number of channels [^3].
      - text: '`nn.Conv2d(c, c, kernel_size=2, stride=2)`'
        why: Without groups, each output channel sums over all `c` input channels, so channels get mixed; pooling handles each channel on its own [^3].
    explanation: |
      Average pooling outputs the mean of each window and has no parameters [^1]; frameworks set the
      stride equal to the window size by default [^2], and pooling processes every channel separately,
      so the number of channels stays the same [^3]. A depthwise convolution (`groups=c`) applies one
      $2 \times 2$ kernel to each channel; with all weights $1/(p_h p_w) = 0.25$ and stride 2 it computes
      exactly the mean of each window [^4]. A normal convolution would instead add up the results of all
      input channels, as a multichannel convolution does.
    references:
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
      - source: d2l
        locator: Sec. 7.5.3 Multiple Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#multiple-channels
      - title: torch.nn.Conv2d (PyTorch documentation)
        locator: Parameters, groups
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/pooling#ex1
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    status: draft
  - id: cnn-033
    type: true_false
    difficulty: medium
    tags:
      - pooling
      - max-pooling
      - linearity
    shuffle: false
    question: |
      True or false: with suitable weights and bias, a single convolutional layer with no activation
      function can compute $2 \times 2$ max-pooling.
    options:
      - text: 'True'
        why: A convolution is affine in its input, but the maximum is not. For a window $(1, 0, 0, 0)$ the max is 1, for $(0, 1, 0, 0)$ it is 1, but for their sum $(1, 1, 0, 0)$ it is still 1, not 2.
      - text: 'False'
        correct: true
    explanation: |
      A convolutional layer computes a weighted sum of the window plus a bias, an affine function
      $f(\mathbf{x}) = \mathbf{w}^\top \mathbf{x} + b$. Suppose it equalled the max on every window. The
      all-zero window forces $b = 0$, each window with a single 1 forces every weight to be 1, and then
      $f(1, 1, 0, 0) = 2$ while the max is 1, a contradiction. Pooling layers have no kernel and compute
      the max directly, a nonlinear operation [^1]. Adding ReLU changes the picture, since
      $\max(a, b) = b + \mathrm{ReLU}(a - b)$.
    references:
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/pooling#ex2
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    status: draft
  - id: cnn-034
    type: single
    difficulty: medium
    tags:
      - relu
      - max-pooling
    question: |
      Which expression equals $\max(a, b)$ for all real numbers $a$ and $b$, using only
      $\mathrm{ReLU}(x) = \max(0, x)$, additions and subtractions?
    options:
      - text: $\mathrm{ReLU}(a - b) + \mathrm{ReLU}(b - a)$
        why: This is $|a - b|$, which is 0 for $a = b = 1$.
      - text: $b + \mathrm{ReLU}(a - b)$
        correct: true
      - text: $\mathrm{ReLU}(a + b) - \mathrm{ReLU}(-a)$
        why: For $a = 1, b = 2$ this gives $3 - 0 = 3$, not 2.
      - text: $\mathrm{ReLU}(a) + \mathrm{ReLU}(b)$
        why: For $a = b = 1$ this gives 2, not 1.
    explanation: |
      If $a \ge b$, then $\mathrm{ReLU}(a - b) = a - b$ and the sum is $a$; otherwise the ReLU gives 0
      and the sum is $b$. To use ReLU units only, write $b = \mathrm{ReLU}(b) - \mathrm{ReLU}(-b)$, so
      $\max(a, b) = \mathrm{ReLU}(a - b) + \mathrm{ReLU}(b) - \mathrm{ReLU}(-b)$ [^2]. Applying the
      pairwise max twice, $\max(\max(a, b), \max(c, d))$, gives the max of a $2 \times 2$ window, so
      max-pooling can be built from convolutions that form the differences plus ReLU layers, even though
      a convolution alone cannot compute it [^1].
    references:
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/pooling#ex3
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    status: draft
  - id: cnn-035
    type: short_answer
    difficulty: medium
    tags:
      - pooling
      - computational-cost
    question: |
      A $2 \times 2$ max-pooling layer with stride 2 and no padding is applied to a
      $64 \times 32 \times 32$ input (channels × height × width). Finding the maximum of $n$ numbers
      takes $n - 1$ comparisons. How many comparisons does the layer make?
    answer:
      numeric: 49152
      tolerance: 0
      hint: a whole number
      model: The output is $64 \times 16 \times 16 = 16\,384$ windows of 4 values, each needing 3 comparisons, so $49\,152$.
    explanation: |
      Pooling works on each channel separately and keeps the number of channels [^1], and a
      $2 \times 2$ window with stride 2 halves the height and width [^2], giving $64 \times 16 \times 16$
      outputs. Each output is the max of 4 values, which takes 3 comparisons, so
      $64 \cdot 256 \cdot 3 = 49\,152$. In general the cost is $c \cdot h_o \cdot w_o \cdot (p_h p_w - 1)$:
      linear in the number of channels, with no $c_i \times c_o$ product, so pooling is far cheaper than
      a convolution on the same input [^3].
    references:
      - source: d2l
        locator: Sec. 7.5.3 Multiple Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#multiple-channels
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
      - source: d2l
        locator: Sec. 7.4.4 Discussion
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#discussion
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/pooling#ex4
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
