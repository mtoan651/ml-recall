  - id: cnn-054
    type: short_answer
    difficulty: easy
    tags:
      - convolution
      - relu
      - max-pooling
    question: |
      A 1D input $[7, 3, -6, 2, 5]$ goes through a convolutional layer with kernel $[3, 1]$
      (cross-correlation as in PyTorch's `Conv1d`, stride 1, no padding, no bias), then ReLU, then
      max-pooling with window 2 and stride 2. What is the output?
    answer:
      accept:
        - '[24, 11]'
      pattern: \[?\s*24\s*,\s*11\s*\]?
      hint: Two numbers, e.g. [1, 2]
      model: $[24, 3, -16, 11] \xrightarrow{\text{ReLU}} [24, 3, 0, 11] \xrightarrow{\text{pool}} [24, 11]$
    explanation: |
      Sliding the kernel over the input gives $7 \cdot 3 + 3 \cdot 1 = 24$, $3 \cdot 3 - 6 = 3$,
      $-6 \cdot 3 + 2 = -16$ and $2 \cdot 3 + 5 = 11$ [^1][^2]. ReLU sets the negative value to 0, giving
      $[24, 3, 0, 11]$, and max-pooling over the non-overlapping pairs keeps $\max(24, 3) = 24$ and
      $\max(0, 11) = 11$ [^1][^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-236 to PRB-238, pp. 268–270; Solutions SOL-236 to SOL-238, pp. 321–322
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 7.2.1 The Cross-Correlation Operation
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#the-cross-correlation-operation
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
    source:
      id: dl-interviews
      ref: ch8#prb236
      url: https://arxiv.org/abs/2201.00650v2
