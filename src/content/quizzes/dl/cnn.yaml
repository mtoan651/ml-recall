  - id: cnn-016
    type: multiple
    difficulty: medium
    tags:
      - edge-detection
      - cross-correlation
      - kernels
    question: |
      A $6 \times 6$ image `X` has ones on and below the main diagonal and zeros above it
      (`X = torch.tril(torch.ones(6, 6))`), so it contains a diagonal edge. It is cross-correlated with
      the finite-difference kernel `K = [[1, -1]]`, which computes $x_{i,j} - x_{i,j+1}$.
      Select all that apply.
    options:
      - text: The output has the same $6 \times 6$ shape as `X`
        why: Without padding, a $1 \times 2$ kernel shrinks the width by one, so the output is $6 \times 5$ [^2].
      - text: The output is zero everywhere, because `K` only detects vertical edges
        why: A diagonal edge changes value along every row, so horizontal differences pick it up. Only a horizontal edge, which is constant along each row, is invisible to `K` [^1].
      - text: Transposing the image with `X.T` makes the response of `K` vanish, just as transposing a vertical edge does
        why: '`X.T` still has a diagonal edge. The response only changes sign, to $-1$, and moves one row down.'
      - text: The output is nonzero along the diagonal, one entry per row except the last
        correct: true
      - text: The transposed kernel `[[1], [-1]]`, which takes vertical differences, also responds to this edge
        correct: true
    explanation: |
      Row $i$ of `X` is 1 up to column $i$ and 0 after it, so $x_{i,i} - x_{i,i+1} = 1$ and all other
      differences are 0; the last row is all ones and gives only zeros. In d2l, `K` detects the
      vertical edge of a black-and-white image and vanishes on the transposed image, whose edge is
      horizontal [^1]. A diagonal edge has both a horizontal and a vertical component: vertical
      differences $x_{i,j} - x_{i+1,j}$ are $-1$ at $j = i + 1$, so the transposed kernel responds too.
      Transposing `X` gives an upper-triangular image whose response is $-1$ one row below the
      diagonal. Without padding the output loses $k - 1$ columns, so it is $6 \times 5$ [^2].
    references:
      - source: d2l
        locator: Sec. 7.2.3 Object Edge Detection in Images
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#object-edge-detection-in-images
      - source: d2l
        locator: Sec. 7.2.1 The Cross-Correlation Operation, Eq. (7.2.1)
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#the-cross-correlation-operation
      - source: d2l
        locator: Sec. 7.2.8 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#exercises
