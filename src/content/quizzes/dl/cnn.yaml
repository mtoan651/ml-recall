  - id: cnn-019
    type: short_answer
    difficulty: medium
    tags:
      - im2col
      - matrix-multiplication
      - convolution
    question: |
      To compute `corr2d(X, K)` with a single matrix product, you copy every kernel-sized window of
      `X` into one row of a matrix `A` and flatten `K` into a column vector `k`; then `A @ k`,
      reshaped, is the output. For a $6 \times 8$ input `X` and a $3 \times 3$ kernel `K` (stride 1,
      no padding), what is the shape of `A`?
    answer:
      accept:
        - (24, 9)
      pattern: \(?\s*24\s*[,x×]\s*9\s*\)?
      hint: rows × columns, e.g. (10, 4)
      model: $(24, 9)$, one row per output position ($4 \times 6 = 24$) and one column per kernel weight ($3 \times 3 = 9$)
    explanation: |
      The output has $(6 - 3 + 1) \times (8 - 3 + 1) = 4 \times 6 = 24$ positions [^1], and each is
      the dot product of one $3 \times 3$ window with the kernel. So `A` has 24 rows of 9 values,
      and `A @ k` produces all 24 outputs at once. This "im2col" trick turns a convolution into one
      large matrix product that fast matrix-multiplication routines handle well, at the price of
      copying each input pixel into up to 9 rows [^2]. With several channels, each row holds
      $c_i k_h k_w$ values and `k` becomes a matrix with one column per output channel [^2].
    references:
      - source: d2l
        locator: Sec. 7.2.1 The Cross-Correlation Operation, Eq. (7.2.1)
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#the-cross-correlation-operation
      - title: 'CS231n notes: Convolutional Neural Networks'
        locator: Convolutional Layer, Implementation as Matrix Multiplication
        url: https://cs231n.github.io/convolutional-networks/#conv
      - source: d2l
        locator: Sec. 7.2.8 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/conv-layer#ex4
      url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#exercises
    status: draft
  - id: cnn-020
    type: short_answer
    difficulty: medium
    tags:
      - padding
      - stride
      - output-shape
    question: |
      In PyTorch, `nn.Conv2d(1, 1, kernel_size=(3, 5), padding=(0, 1), stride=(3, 4))` is applied
      to an $8 \times 8$ input. `padding=(0, 1)` adds no rows, and one column of zeros on each side.
      What is the height and width of the output?
    answer:
      accept:
        - (2, 2)
      pattern: \(?\s*2\s*[,x×]\s*2\s*\)?
      hint: height × width, e.g. (3, 4)
      model: Height $\lfloor (8 - 3 + 0 + 3)/3 \rfloor = 2$ and width $\lfloor (8 - 5 + 2 + 4)/4 \rfloor = 2$, so $2 \times 2$.
    explanation: |
      With a total of $p_h$ padding rows, $p_w$ padding columns and strides $s_h, s_w$, the output is
      $\lfloor (n_h - k_h + p_h + s_h)/s_h \rfloor \times \lfloor (n_w - k_w + p_w + s_w)/s_w \rfloor$ [^1].
      Here $p_h = 0$ and $p_w = 2$ (one column per side), so the height is $\lfloor 8/3 \rfloor = 2$
      and the width $\lfloor 9/4 \rfloor = 2$. PyTorch's own formula,
      $\lfloor (n + 2 \cdot \text{padding} - k)/s \rfloor + 1$ per dimension, gives the same result [^2].
      This is the last example of d2l's padding-and-stride section, whose output is $2 \times 2$ [^1].
    references:
      - source: d2l
        locator: Sec. 7.3.2 Stride, Eq. (7.3.2)
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
      - title: torch.nn.Conv2d (PyTorch documentation)
        locator: Shape
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html
      - source: d2l
        locator: Sec. 7.3.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/padding-and-strides#ex1
      url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    status: draft
  - id: cnn-021
    type: single
    difficulty: easy
    tags:
      - stride
      - audio
      - downsampling
    question: |
      An audio signal sampled at 16 kHz goes through a 1D convolution with stride 2. What does the
      stride of 2 correspond to?
    options:
      - text: Halving the amplitude of the signal while keeping its original sampling rate
        why: The stride sets which positions are evaluated, not the size of the values; the amplitude depends on the kernel weights.
      - text: Upsampling to 32 kHz, since every input sample now produces two values in the output sequence
        why: A stride of $s$ skips $s - 1$ positions between windows, so the output gets shorter, not longer [^1].
      - text: Downsampling, with one output value per two input samples, an effective rate of 8 kHz
        correct: true
      - text: Merging the two channels of a stereo recording into a single mono channel
        why: Channels form a separate axis. The stride acts along the time axis only.
    explanation: |
      The stride is the number of positions the window moves at each step, so a stride of 2 evaluates
      every second position and halves the length of the output [^1]. d2l notes that a stride of $n$
      reduces the resolution to $1/n$ of the input [^2]. For audio the axis is time, so 16,000 samples
      per second become 8,000 output values per second: downsampling by a factor of 2, like lowering the
      sampling rate [^3]. A smoothing kernel in front of the stride plays the role of the low-pass
      filter that proper downsampling needs [^3].
    references:
      - source: d2l
        locator: Sec. 7.3.2 Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
      - source: d2l
        locator: Sec. 7.3.3 Summary and Discussion
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#summary-and-discussion
      - title: 'Wikipedia: Downsampling (signal processing)'
        locator: Downsampling by an integer factor
        url: https://en.wikipedia.org/wiki/Downsampling_(signal_processing)#Downsampling_by_an_integer_factor
      - source: d2l
        locator: Sec. 7.3.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/padding-and-strides#ex2
      url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    status: draft
  - id: cnn-022
    type: short_answer
    difficulty: easy
    tags:
      - stride
      - computational-cost
    question: |
      A $3 \times 3$ convolution with padding 1 on every side runs on a $224 \times 224$ feature map.
      Changing its stride from 1 to 2 cuts the number of multiply–add operations by what factor?
    answer:
      numeric: 4
      tolerance: 0
      hint: a whole number
      model: The output shrinks from $224 \times 224$ to $112 \times 112$, so $224^2 / 112^2 = 4$.
    explanation: |
      With padding $k - 1$ in total, the output size per dimension is $\lfloor (n + s - 1)/s \rfloor$ [^1]:
      224 with stride 1 and 112 with stride 2. Every output value costs the same
      $k_h k_w c_i$ multiplications per output channel [^2], so the cost scales with the number of
      outputs, $224^2 / 112^2 = 4$. In general a stride of $s$ in both directions cuts the computation,
      and the memory for the output, by about $s^2$, which is why strided layers are used to
      downsample [^1].
    references:
      - source: d2l
        locator: Sec. 7.3.2 Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
      - source: d2l
        locator: Sec. 7.4.4 Discussion (cost of a convolution)
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#discussion
      - source: d2l
        locator: Sec. 7.3.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/padding-and-strides#ex4
      url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
    status: draft
  - id: cnn-023
    type: single
    difficulty: medium
    tags:
      - stride
      - transposed-convolution
      - upsampling
    question: |
      A "stride of 1/2" means the output has twice the height and width of the input. How is such a
      layer built in practice, and what is it used for?
    options:
      - text: As a stride-2 convolution followed by max-pooling, to downsample feature maps quickly
        why: Both of these shrink the output; a stride of 1/2 has to enlarge it.
      - text: As a $1 \times 1$ convolution, which doubles the resolution by doubling the channels
        why: A $1 \times 1$ convolution keeps the height and width and only changes the number of channels.
      - text: As a transposed convolution, to upsample feature maps, for example in segmentation
        correct: true
      - text: As a dilated convolution with dilation 2, which doubles the size of the output
        why: Dilation spreads the kernel taps to enlarge the receptive field; with matching padding the output keeps its size, it does not grow.
    explanation: |
      Transposed convolution is also called fractionally-strided convolution [^1]. It is equivalent to
      inserting $s - 1$ zeros between neighbouring input values and running an ordinary stride-1
      convolution with suitable padding, so a stride of 2 in the transposed layer acts like a stride
      of 1/2 [^2]. For
      example, a transposed convolution with a $4 \times 4$ kernel, stride 2 and padding 1 doubles the
      height and width [^3]. Such layers restore resolution in segmentation networks and build up images
      in GAN generators [^1][^3].
    references:
      - source: d2l
        locator: Sec. 14.10 Transposed Convolution (introduction)
        url: https://d2l.ai/chapter_computer-vision/transposed-conv.html
      - title: A guide to convolution arithmetic for deep learning (Dumoulin & Visin, 2016)
        locator: Sec. 4 Transposed convolution arithmetic (zero insertion for non-unit strides)
        url: https://arxiv.org/abs/1603.07285
      - source: d2l
        locator: Sec. 20.2.2 The Generator
        url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#the-generator
      - source: d2l
        locator: Sec. 7.3.4 Exercises, Exercise 6
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#exercises
