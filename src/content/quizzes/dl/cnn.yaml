      - blur
    question: |
      A $2 \times 2$ kernel with all entries $\tfrac14$ slides over the image below with stride 1 and no padding, as in a CNN
      layer (cross-correlation):
      $$\begin{bmatrix}0 & 200 & 200\\ 0 & 0 & 200\\ 0 & 0 & 0\end{bmatrix}$$
      The output is $2 \times 2$. What is its top-right entry?
    answer:
      numeric: 150
      tolerance: 0
      hint: a number
      model: $(200 + 200 + 0 + 200)/4 = 150$
    explanation: |
      Each output entry is the sum of the element-wise products of the kernel with one $2 \times 2$ window of the image
      [^1][^2]. The top-right window is $\begin{bmatrix}200 & 200\\ 0 & 200\end{bmatrix}$, and with all weights $\tfrac14$ the
      entry is the window's mean, $600/4 = 150$ [^1]. The full output is $\begin{bmatrix}50 & 150\\ 0 & 50\end{bmatrix}$: this
      kernel is a box blur that averages neighbouring pixels [^1].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 1, Section 2, Coding Exercise 2.1 Convolution of a Simple Kernel
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 7.2.1 The Cross-Correlation Operation
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#the-cross-correlation-operation
