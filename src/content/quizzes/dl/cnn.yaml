  - id: cnn-008
    type: short_answer
    difficulty: easy
    tags:
      - output-shape
    question: A $32 \times 32$ single-channel input is convolved with a $5 \times 5$ kernel, stride 1, no padding. What is the height of the output?
    answer:
      numeric: 28
      model: $32 - 5 + 1 = 28$
    explanation: Without padding and with stride 1 the kernel can only slide until it runs out of pixels, so the output height is $n_h - k_h + 1 = 32 - 5 + 1 = 28$ [^1].
    references:
      - source: d2l
        locator: Sec. 7.3 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html
        quote: the output shape will be (n_h−k_h+1) × (n_w−k_w+1)
    source:
      id: original
      ref: cnn-008
    status: reviewed
  - id: cnn-009
    type: short_answer
    difficulty: medium
    tags:
      - parameter-count
    question: A convolutional layer maps a $32 \times 32 \times 3$ input to 10 output channels using $5 \times 5$ kernels with bias. How many learnable parameters does the layer have?
    answer:
      numeric: 760
      model: $10 \times 3 \times 5 \times 5 + 10 = 760$
    explanation: The kernel tensor has shape $c_o \times c_i \times k_h \times k_w = 10 \times 3 \times 5 \times 5$, i.e. 750 weights [^1], plus one bias per output channel (10), giving 760. The $32 \times 32$ spatial size does not matter because the kernel is shared across positions.
    references:
      - source: d2l
        locator: Sec. 7.4 Multiple Input and Multiple Output Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html
        quote: the shape of the convolution kernel is c_o × c_i × k_h × k_w
    source:
      id: original
      ref: cnn-009
    status: reviewed
  - id: cnn-010
    type: multiple
    difficulty: medium
    tags:
      - parameter-count
      - pytorch
    question: Which of the following layers have learnable parameters? Select all that apply.
    options:
      - text: '`nn.Conv2d`'
        correct: true
      - text: '`nn.BatchNorm2d`'
        correct: true
      - text: '`nn.MaxPool2d`'
        why: Pooling has no kernel, hence no parameters [^1].
      - text: '`nn.ReLU`'
        why: A fixed element-wise function; nothing is learned.
      - text: '`nn.Dropout`'
        why: Randomly zeroes activations during training; nothing is learned.
    explanation: Convolutions learn their kernels and biases, and batch normalization learns a per-channel scale $\gamma$ and shift $\beta$ [^2]. Max pooling, ReLU and dropout are fixed operations — the pooling layer contains no parameters [^1].
    references:
      - source: d2l
        locator: Sec. 7.5 Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html
        quote: the pooling layer contains no parameters (there is no kernel)
      - source: d2l
        locator: Sec. 8.5 Batch Normalization
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html
    source:
      id: original
      ref: cnn-010
    status: reviewed
