  - id: cnn-045
    type: short_answer
    difficulty: medium
    tags:
      - parameter-count
      - fully-connected
      - convolution
    question: |
      A $32 \times 32$ RGB image (3,072 input values) must be mapped to a $32 \times 32 \times 16$ feature
      map. A $3 \times 3$ convolution with padding 1 and 16 output channels needs $3\cdot3\cdot3\cdot16 +
      16 = 448$ parameters. How many parameters (weights plus biases) does a fully connected layer with
      the same input and output sizes need?
    answer:
      numeric: 50348032
      tolerance: 0
      hint: a whole number
      model: $3072 \cdot 16384 + 16384 = 50{,}348{,}032$
    explanation: |
      The output has $32 \cdot 32 \cdot 16 = 16{,}384$ values; a dense layer connects each of them to all
      3,072 inputs and adds a bias, giving $3072 \cdot 16384 + 16384 = 50{,}348{,}032$ parameters. The
      convolution needs about 100,000 times fewer, because each output only looks at a $3 \times 3$
      neighbourhood (locality) and the same kernel is reused at every position (translation
      invariance) [^1][^2].
    references:
      - source: d2l
        locator: Sec. 7.1 From Fully Connected Layers to Convolutions (7.1.2 Constraining the MLP)
        url: https://d2l.ai/chapter_convolutional-neural-networks/why-conv.html
