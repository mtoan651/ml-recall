  - id: cnn-043
    type: short_answer
    difficulty: medium
    tags:
      - depthwise-separable-convolution
      - mobilenet
      - parameter-count
    question: |
      A convolution maps 64 input channels to 2 output channels with 3×3 kernels (no biases). A depthwise separable
      version uses one 3×3 filter per input channel (depthwise step), followed by a 1×1 convolution from 64 to 2
      channels (pointwise step). How many fewer weights does the depthwise separable version need?
    answer:
      numeric: 448
      tolerance: 0
      hint: an integer
      model: 'Regular: $64 \cdot 3 \cdot 3 \cdot 2 = 1152$; separable: $64 \cdot 9 + 64 \cdot 2 = 704$; difference $448$'
    explanation: |
      A regular convolution has a 3×3 kernel for every pair of input and output channels: $64 \cdot 9 \cdot 2 = 1152$ weights
      [^1]. The depthwise step filters each input channel separately ($64 \cdot 9 = 576$) and the pointwise 1×1 step mixes
      the channels ($64 \cdot 2 = 128$), 704 in total [^1][^2]. With only 4 input channels the saving is $72 - 44 = 28$; it
      grows with the number of channels, which is why MobileNets use this factorization throughout [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 3, Section 5 Depthwise separable convolutions, Coding Exercise 5.1 and Think! 5.1
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial3.ipynb
      - title: 'Howard et al. (2017), MobileNets: Efficient Convolutional Neural Networks for Mobile Vision Applications'
        url: https://arxiv.org/abs/1704.04861
        locator: Sec. 3.1 Depthwise Separable Convolution
    source:
      id: neuromatch-dl
      ref: W2D2_Convnets/W2D2_Tutorial3#think5.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial3.ipynb
