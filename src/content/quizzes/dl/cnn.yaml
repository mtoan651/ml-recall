  - id: cnn-052
    type: short_answer
    difficulty: medium
    tags:
      - cyclic-convolution
      - convolution
      - circulant
    question: |
      Compute the cyclic (circular) convolution of $c = (2, 1, 3)$ and $d = (3, 1, 2)$, both of length 3:
      $(c \circledast d)_k = \sum_{j} c_j\, d_{(k - j) \bmod 3}$ for $k = 0, 1, 2$.
    answer:
      accept:
        - (11, 11, 14)
      pattern: \(?\s*11\s*,\s*11\s*,\s*14\s*\)?
      hint: three numbers, e.g. (1, 2, 3)
      model: Linear convolution $(6, 5, 14, 5, 6)$; wrapping entries 3 and 4 onto 0 and 1 gives $(11, 11, 14)$
    explanation: |
      The ordinary convolution has length 5: $(6,\ 2{+}3,\ 4{+}1{+}9,\ 1{\cdot}2{+}3{\cdot}1,\ 6) = (6, 5, 14, 5, 6)$ [^1].
      The cyclic version wraps indices modulo 3, so the last two entries are added onto the first two,
      giving $(11, 11, 14)$ [^1]. Both versions satisfy the check
      $(\sum c)(\sum d) = 6 \times 6 = 36 = 11 + 11 + 14$. Cyclic convolution is multiplication by a circulant
      matrix, and a CNN with circular padding computes exactly this [^2].
    references:
      - title: 'Wikipedia: Circular convolution'
        locator: Definitions; Discrete sequences
        url: https://en.wikipedia.org/wiki/Circular_convolution
      - source: mit-ocw-18065
        locator: Problems for Lecture 30 (textbook Section IV.2), Problem 1; Lecture 31, Problem 3
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec30-q1
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
