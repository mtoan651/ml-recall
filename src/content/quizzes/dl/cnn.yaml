  - id: cnn-044
    type: single
    difficulty: medium
    tags:
      - inductive-bias
      - mlp
      - feature-learning
    question: |
      An MLP is trained on images by flattening each image into a vector. When you visualize its first-layer weights as
      images, you do not see the small edge-like filters that the first layer of a CNN typically learns. Why?
    options:
      - text: An MLP has no built-in bias toward local, translation-equivariant features, so nothing favours edge filters
        correct: true
      - text: Only the last layer of an MLP gets trained, so the first layer keeps its random initial weights
        why: Backpropagation trains every layer; the first layer does learn features, just not localized edge filters.
      - text: Flattening destroys the pixel values, so the first layer only receives meaningless noise
        why: Flattening keeps every pixel value; it only discards the explicit 2-D neighbourhood structure.
      - text: Edge detectors need more parameters than a single dense layer of an MLP has available
        why: A dense first layer has far more parameters than a small convolution kernel; capacity is not the issue.
    explanation: |
      Each first-layer unit of an MLP connects to every pixel, with no weight sharing and no notion of neighbourhood, so
      it is free to learn image-sized patterns [^1]. A CNN's small shared kernels build in locality and translation
      equivariance, an inductive bias under which local edge detectors emerge in the first layer [^1][^2]. Without that
      prior, an MLP does not learn a hierarchy that starts from edges by default [^1].
    references:
      - source: neuromatch-dl
        locator: W1D3 Tutorial 2, Section 2 Deeper MLPs, Think! 2 Why first layer features are high level?
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D3_MultiLayerPerceptrons/instructor/W1D3_Tutorial2.ipynb
      - source: d2l
        locator: Sec. 7.1 From Fully Connected Layers to Convolutions
        url: https://d2l.ai/chapter_convolutional-neural-networks/why-conv.html
    source:
      id: neuromatch-dl
      ref: W1D3_MultiLayerPerceptrons/W1D3_Tutorial2#think2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D3_MultiLayerPerceptrons/instructor/W1D3_Tutorial2.ipynb
