  - id: cnn-038
    type: short_answer
    difficulty: medium
    tags:
      - parameter-count
      - flatten
      - cifar10
    question: |
      A CIFAR-10 CNN takes $32 \times 32 \times 3$ images through three blocks of
      `Conv2d(kernel 3, padding 1)` + ReLU + `MaxPool2d(2, 2)`, with 16, 32 and 64 output channels,
      then flattens and applies `fc1 = nn.Linear(?, 500)`. How many parameters does `fc1` have?
    answer:
      numeric: 512500
      tolerance: 0
      hint: a whole number
      model: $32 \to 16 \to 8 \to 4$; input $64 \cdot 4 \cdot 4 = 1024$; $1024 \times 500 + 500 = 512{,}500$
    explanation: |
      Padded $3 \times 3$ convolutions keep the size and each pooling halves it, so the feature map
      after the third block is $64 \times 4 \times 4$, flattened to 1024 values [^1][^2]. `fc1`
      therefore has $1024 \cdot 500 + 500 = 512{,}500$ parameters, far more than the three
      convolutions together ($448 + 4{,}640 + 18{,}496$); in such small CNNs most parameters sit in
      the first fully connected layer.
