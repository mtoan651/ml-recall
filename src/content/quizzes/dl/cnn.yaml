  - id: cnn-051
    type: short_answer
    difficulty: easy
    tags:
      - receptive-field
      - stacked-convolutions
    question: |
      Three convolutional layers with $3 \times 3$ kernels and stride 1 are stacked directly on an
      image. A neuron in the third layer receives information from a square patch of input pixels.
      What is the side length of that patch?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number of pixels
      model: $3 \to 5 \to 7$, one more pixel on each side per layer
    explanation: |
      The receptive field of a neuron is the set of input pixels it is connected to [^1]. One
      $3 \times 3$ layer sees a $3 \times 3$ patch; a second layer sees a $3 \times 3$ patch of the
      first, whose fields overlap in a $5 \times 5$ patch, and a third layer adds one more pixel on
      each side: $7 \times 7$ [^2]. Three stacked $3 \times 3$ kernels have $27$ weights per channel
      pair, against $49$ for a single $7 \times 7$ kernel with the same receptive field, which is how
      convnets grow large receptive fields cheaply [^1].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 4 exercise, The Receptive Field
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/ex4.ipynb
      - source: kaggle-learn
        locator: Computer Vision, Lesson 4 exercise, Question 1 Growing the Receptive Field (hint and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex4.py
    source:
