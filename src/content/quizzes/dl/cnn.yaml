        locator: CIFAR-10 CNN notebook, Define the Network Architecture (Net class, 'linear layer (64 * 4 * 4 -> 500)')
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/convolutional-neural-networks/cifar-cnn/cifar10_cnn_solution.ipynb
