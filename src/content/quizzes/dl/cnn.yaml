  - id: cnn-024
    type: short_answer
    difficulty: medium
    tags:
      - convolution
      - kernel-size
      - receptive-field
    question: |
      Two convolutions are applied one after the other with no nonlinearity in between: first a
      $3 \times 3$ kernel, then a $5 \times 5$ kernel (one channel, stride 1). The pair is equivalent to
      a single convolution with a $k \times k$ kernel. What is $k$?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: $k = k_1 + k_2 - 1 = 3 + 5 - 1 = 7$
    explanation: |
      Convolution is associative, $(X * K_1) * K_2 = X * (K_1 * K_2)$, so two linear convolutions
      collapse into one whose kernel is $K_1 * K_2$ [^2]. Convolving a length-3 and a length-5 sequence
      gives length $3 + 5 - 1 = 7$ in each direction. The output sizes agree: without padding the first
      layer removes 2 rows and columns and the second removes 4, together 6, exactly what one
      $7 \times 7$ kernel removes [^1]. Each output therefore sees a $7 \times 7$ receptive field [^3].
      Without nonlinearities in between, extra depth adds no expressive power.
    references:
      - source: d2l
        locator: Sec. 7.2.1 The Cross-Correlation Operation, Eq. (7.2.1)
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#the-cross-correlation-operation
      - title: 'Wikipedia: Convolution'
        locator: Properties, Associativity
        url: https://en.wikipedia.org/wiki/Convolution#Algebraic_properties
      - source: d2l
        locator: Sec. 7.2.6 Feature Map and Receptive Field
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#feature-map-and-receptive-field
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/channels#ex1
      url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    status: draft
  - id: cnn-025
    type: true_false
    difficulty: hard
    tags:
      - convolution
      - kernel-factorization
    shuffle: false
    question: |
      Convolving the length-2 kernels $[a, b]$ and $[c, d]$ gives the length-3 kernel
      $[ac,\ ad + bc,\ bd]$. True or false: every length-3 1D kernel with real weights can be written
      this way, as two stacked length-2 convolutions with no nonlinearity in between.
    options:
      - text: 'True'
        why: The kernel $[1, 0, 1]$ would need $ac = 1$, $bd = 1$ and $ad + bc = 0$. The first two give $c = 1/a$ and $d = 1/b$, and then $ad + bc = a/b + b/a$, which is never 0 for real nonzero $a, b$.
      - text: 'False'
        correct: true
    explanation: |
      Composing two convolutions always gives one convolution, but the converse fails. Convolving
      coefficient sequences multiplies polynomials, so $[a, b]$ corresponds to $a + bz$ and a
      length-3 kernel $[p, q, r]$ to $p + qz + rz^2$ [^1]. That kernel splits into two real length-2
      kernels exactly when the quadratic has real roots. $[1, 0, 1]$ corresponds to $1 + z^2$, which
      has none, so it cannot be factored. In 2D the count also fails: a $3 \times 3$ kernel has 9
      weights, two stacked $2 \times 2$ kernels only 8, so most $3 \times 3$ kernels are out of reach [^2].
    references:
      - title: 'Wikipedia: Convolution'
        locator: Discrete convolution (polynomial multiplication)
        url: https://en.wikipedia.org/wiki/Convolution#Discrete_convolution
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/channels#ex1-b
      url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    status: draft
  - id: cnn-026
    type: short_answer
    difficulty: medium
    tags:
      - computational-cost
      - convolution
      - stride
    question: |
      A convolutional layer maps a $3 \times 32 \times 32$ input to 16 output channels with $3 \times 3$
      kernels, padding 1 on every side and stride 2. Counting one multiplication per kernel weight per
      output value (ignore the bias and the additions), how many multiplications does the forward pass
      need for one example?
    answer:
      numeric: 110592
      tolerance: 0
      hint: a whole number
      model: The output is $16 \times 16 \times 16 = 4096$ values, each needing $3 \cdot 3 \cdot 3 = 27$ multiplications, so $4096 \times 27 = 110\,592$.
    explanation: |
      The output height and width are $\lfloor (32 - 3 + 2 + 2)/2 \rfloor = 16$ [^1]. Each output value
      sums $c_i k_h k_w = 27$ products over its window and all input channels, and there are
      $c_o \times 16 \times 16$ output values, so the total is $c_o h_o w_o c_i k_h k_w = 110\,592$.
      This is the $\mathcal{O}(h \cdot w \cdot k^2 \cdot c_i \cdot c_o)$ cost from d2l, with the
      output size in place of the input size [^2]. The additions take about as many operations again,
      and the same layer with stride 1 would need $442\,368$ multiplications.
    references:
      - source: d2l
        locator: Sec. 7.3.2 Stride, Eq. (7.3.2)
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
      - source: d2l
        locator: Sec. 7.4.4 Discussion
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#discussion
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/channels#ex2
      url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
