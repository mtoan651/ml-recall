  - id: cnn-036
    type: single
    difficulty: easy
    tags:
      - pooling
      - min-pooling
    question: |
      A framework offers max-pooling but no minimum pooling. Which expression computes $2 \times 2$
      minimum pooling of a tensor `X` with any real values, using the max-pooling function `maxpool`?
    options:
      - text: '`1 / maxpool(1 / X)`'
        why: This only works for strictly positive values; zeros cause a division by zero and negative values break the ordering.
      - text: '`-maxpool(X)`'
        why: This negates the maximum of each window, which has nothing to do with the minimum.
      - text: '`maxpool(-X)`'
        why: This is the negated minimum of each window; the sign has to be flipped back.
      - text: '`-maxpool(-X)`'
        correct: true
    explanation: |
      For any set of numbers, $\min S = -\max(-S)$: negating reverses the order, so the largest of the
      negated values is the negated smallest value. Pooling applies its operation to each window
      separately [^1], so `-maxpool(-X)` with the same window and stride is minimum pooling, and no
      separate layer is needed.
    references:
      - source: d2l
        locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
      - source: d2l
        locator: Sec. 7.5.5 Exercises, Exercise 6
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-neural-networks/pooling#ex6
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#exercises
    status: draft
  - id: cnn-037
    type: short_answer
    difficulty: medium
    tags:
      - output-size
      - patchgan
      - convolution-arithmetic
    question: |
      The last layer of a CycleGAN discriminator receives an $8 \times 8 \times 512$ feature map
      and applies `nn.Conv2d(512, 1, kernel_size=8, stride=1, padding=0)`. What is the spatial
      size (height = width) of its output?
    answer:
      numeric: 1
      tolerance: 0
      hint: a whole number
      model: $(8 - 8 + 2 \cdot 0)/1 + 1 = 1$, so the output is $1 \times 1 \times 1$
    explanation: |
      The output width of a convolution is $(W - F + 2P)/S + 1$ [^1][^2]. A kernel as large as the
      input with no padding fits in exactly one position, so the layer outputs a single number per
      image, the real/fake score; it acts like a fully connected layer over the whole map [^1]. The
      four earlier stride-2 convolutions had reduced the $128 \times 128$ input to $8 \times 8$.
    references:
