  - id: cnn-056
    type: single
    difficulty: medium
    tags:
      - convolution
      - cross-correlation
      - kernel-flip
    question: |
      SciPy's `convolve2d` computes a true convolution:

      ```python
      import numpy as np
      from scipy.signal import convolve2d

      X = np.zeros((6, 6)); X[:, :3] = 3.0; X[:, 3:] = 1.0     # bright left half, dark right half
      K = np.zeros((3, 3)); K[:, 0] = 2.0; K[:, 2] = -2.0      # every row of K is [2, 0, -2]
      out = convolve2d(X, K, mode="valid")
      ```

      What is the first row of `out`?
    options:
      - text: '`[0, -12, -12, 0]`'
        correct: true
      - text: '`[0, 12, 12, 0]`'
        why: This is the cross-correlation, which is what `nn.Conv2d` computes; a true convolution flips the kernel first [^2].
      - text: '`[-12, -12, -12, -12]`'
        why: Windows that lie entirely in the left or the right half see a constant row, and $2c - 2c = 0$.
      - text: '`[0, -4, -4, 0]`'
        why: Each $3 \times 3$ window has three identical rows, so the row result $-4$ is counted three times.
    explanation: |
      `mode="valid"` keeps only the $4 \times 4$ positions where the kernel fits [^1]. A convolution flips
      the kernel, so every row acts as $[-2, 0, 2]$: the window over columns 1–3 gives
      $3 \cdot (-2 \cdot 3 + 0 + 2 \cdot 1) = -12$, and so does the window over columns 2–4, while the
      windows over constant columns give 0 [^1][^2]. Deep learning layers compute the cross-correlation
      instead, which would give $+12$; for learned kernels the difference does not matter [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-194, pp. 238–239; Solution SOL-194, p. 293
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 7.2.5 Cross-Correlation and Convolution
        url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html#cross-correlation-and-convolution
    source:
      id: dl-interviews
      ref: ch8#prb194
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: cnn-057
    type: short_answer
    difficulty: medium
    tags:
      - separable-convolution
      - gaussian-blur
      - computational-cost
    question: |
      The 2D Gaussian factorizes, $G(x, y) = G(x)\,G(y)$, so a $7 \times 7$ Gaussian blur can be applied as
      a $7 \times 1$ convolution followed by a $1 \times 7$ one. Ignoring the image borders, how many times
      fewer multiplications per output pixel does the separable version need?
    answer:
      numeric: 3.5
      tolerance: 0.01
      hint: a number
      model: $\dfrac{7 \cdot 7}{7 + 7} = \dfrac{49}{14} = 3.5$
    explanation: |
      A direct $k \times k$ convolution needs $k^2$ multiplications per pixel, the two 1D passes only
      $2k$; for $k = 7$ that is 49 against 14 [^2]. A kernel is separable when it is the outer product of a
      column and a row vector, which holds for the Gaussian because its exponent splits into an $x$ and a
      $y$ part [^1][^2]. The saving grows with $k$: the cost per pixel drops from $O(k^2)$ to $O(k)$.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-198, p. 241; Solution SOL-198, pp. 295–296
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Separable filter'
        url: https://en.wikipedia.org/wiki/Separable_filter
    source:
      id: dl-interviews
      ref: ch8#prb198
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: cnn-058
    type: short_answer
    difficulty: medium
    tags:
      - tensor-shapes
      - padding
      - pooling
    question: |
      ```python
      net = torch.nn.Sequential(
          torch.nn.Conv2d(3, 32, kernel_size=7, padding=2),
          torch.nn.BatchNorm2d(32),
          torch.nn.MaxPool2d(2, 2),
          torch.nn.MaxPool2d(2, 2),
      )
      x = net(torch.rand(1, 3, 224, 224))
      x = x.view(x.size(0), -1)
      ```

      How many columns does `x` have?
    answer:
      numeric: 96800
      tolerance: 0
      hint: a whole number
      model: $224 + 2 \cdot 2 - 7 + 1 = 222 \to 111 \to 55$, and $32 \cdot 55 \cdot 55 = 96\,800$
    explanation: |
      The convolution gives $224 + 2 \cdot 2 - 7 + 1 = 222$ pixels per side [^2], and batch normalization
      keeps the shape [^1]. Each $2 \times 2$ pooling with stride 2 halves the size, rounding down:
      $222 \to 111 \to 55$ [^3]. Flattening $32$ channels of $55 \times 55$ gives 96,800 values per image.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-240, pp. 271–273; Solution SOL-240, pp. 323–324
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 7.3.1 Padding
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#padding
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
    source:
      id: dl-interviews
      ref: ch8#prb240
      url: https://arxiv.org/abs/2201.00650v2
