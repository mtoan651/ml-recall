  - id: cnn-041
    type: short_answer
    difficulty: easy
    tags:
      - output-shape
      - pooling
      - flatten
    question: |
      A CNN for $28 \times 28$ grayscale letters has these layers in order (stride 1 and no padding for the
      convolutions): `Conv2d(1, 32, kernel_size=3)`, ReLU, `Conv2d(32, 64, kernel_size=3)`, ReLU, `MaxPool2d(2)`,
      flatten, `Linear(in_features, 128)`, ReLU, `Linear(128, 2)`. What must `in_features` be?
    answer:
      numeric: 9216
      tolerance: 0
      hint: an integer
      model: $28 \to 26 \to 24 \to 12$; $64 \times 12 \times 12 = 9216$
    explanation: |
      Each 3×3 convolution without padding removes 2 rows and 2 columns ($28 \to 26 \to 24$), and 2×2 max-pooling halves the
      size to 12 [^1][^2]. Flattening 64 channels of $12 \times 12$ gives 9216 features [^1]. This first linear layer has
      $9216 \cdot 128 + 128 \approx 1.18$ million parameters, far more than the two convolutions together
      ($320 + 18496$): dense layers on top of feature maps, not the convolutions, dominate the parameter count [^1].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 1, Section 4 Putting it all together, Coding Exercise 4 Implement your own CNN
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
