  - id: cnn-042
    type: short_answer
    difficulty: hard
    tags:
      - resnext
      - grouped-convolution
      - parameter-count
    question: |
      A ResNet bottleneck block with 256 input and output channels uses a 1×1 convolution to 64 channels, a 3×3
      convolution from 64 to 64 channels and a 1×1 convolution back to 256: $256 \cdot 64 + 9 \cdot 64 \cdot 64 + 64 \cdot 256 = 69632$
      weights (ignoring biases). A ResNeXt block instead has 32 parallel paths, each a 1×1 convolution from 256 to 4
      channels, a 3×3 convolution from 4 to 4 and a 1×1 convolution from 4 to 256, with the path outputs summed. How many
      weights does the ResNeXt block have (ignoring biases)?
    answer:
      numeric: 70144
      tolerance: 0
      hint: an integer
      model: $32 \times (256 \cdot 4 + 9 \cdot 4 \cdot 4 + 4 \cdot 256) = 32 \times 2192 = 70144$
    explanation: |
      Each path costs $1024 + 144 + 1024 = 2192$ weights, and 32 paths give $70144$, almost the same as the ResNet block
      [^1][^2]. For that budget ResNeXt has $32 \times 4 = 128$ channels in its bottleneck instead of 64, but each 3×3
      convolution mixes only the 4 channels of its own path, which is a grouped convolution [^1][^2]. The wider bottleneck
      tends to outweigh the restricted mixing, which is why ResNeXt usually outperforms ResNet at equal cost [^1].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 3, Section 4 Inception + ResNeXt, Interactive Demo 4 and Think! 4 ResNet vs. ResNeXt
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial3.ipynb
      - title: Xie et al. (2017), Aggregated Residual Transformations for Deep Neural Networks
        url: https://arxiv.org/abs/1611.05431
        locator: Sec. 3.4 Model Capacity, Eq. (4)
    source:
      id: neuromatch-dl
      ref: W2D2_Convnets/W2D2_Tutorial3#think4
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial3.ipynb
