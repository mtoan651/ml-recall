  - id: cnn-031
    type: single
    difficulty: medium
    tags:
      - grouped-convolution
      - resnext
      - channel-mixing
    question: |
      A grouped convolution with $g$ groups is $g$ times cheaper than a dense one, because its
      channel-mixing matrix is block-diagonal. What is the main downside, and how does the ResNeXt
      block reduce it?
    options:
      - text: The output has only $1/g$ of the channels; concatenating $g$ copies of it restores the full width
        why: Each group produces $c_o/g$ channels, so all groups together still produce $c_o$; copies would add no information.
      - text: The receptive field shrinks by a factor of $g$; larger kernels in later layers make up for it
        why: Groups split the channels, not the image; the kernel size and the receptive field stay the same.
      - text: The layer needs $g$ times more parameters; sharing weights between the groups removes the excess
        why: A grouped convolution has $g$ times fewer parameters than a dense one [^1].
      - text: Groups never exchange information; $1 \times 1$ convolutions around it mix the channels again
        correct: true
    explanation: |
      With a block-diagonal weight matrix, channel $i$ of group 1 never influences any output of group
      2, so features computed in different groups cannot be combined. d2l names this as the only
      challenge of the design: no information is exchanged between the $g$ groups [^1]. ResNeXt places
      the grouped $3 \times 3$ convolution between two $1 \times 1$ convolutions, which mix all channels
      and cost only $\mathcal{O}(c \cdot b)$ [^1]. ShuffleNet uses another fix: it permutes channels
      between groups after each grouped convolution [^2].
    references:
      - source: d2l
        locator: Sec. 8.6.5 ResNeXt
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#resnext
      - title: 'ShuffleNet: An Extremely Efficient Convolutional Neural Network for Mobile Devices (Zhang et al., 2017)'
        locator: Sec. 3.1 Channel Shuffle for Group Convolutions
        url: https://arxiv.org/abs/1707.01083
      - source: d2l
        locator: Sec. 7.4.5 Exercises, Exercise 7
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#exercises
    source:
