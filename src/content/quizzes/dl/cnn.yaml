  - id: cnn-048
    type: short_answer
    difficulty: easy
    tags:
      - convolution
      - max-pooling
      - output-shape
      - padding
      - stride
    question: |
      A $400 \times 400$ grayscale image goes through a $3 \times 3$ convolution with stride 1 and
      `'valid'` padding, then ReLU, then $2 \times 2$ max pooling with stride 2 and `'same'` padding.
      What is the height of the pooled feature map?
    answer:
      numeric: 199
      tolerance: 0
      hint: a whole number of pixels
      model: $400 - 3 + 1 = 398$ after the convolution, $398 / 2 = 199$ after pooling
    explanation: |
      With `'valid'` padding the window stays inside the input, so the output shrinks by the kernel
      size minus one: $400 - 3 + 1 = 398$ [^1]. ReLU keeps the size. A stride-2 pooling window then
      moves 2 pixels per step, and since 398 is even, $2 \times 2$ windows tile the map exactly and no
      padding is added: $398 / 2 = 199$ [^2]. The exercise's checker expects a $199 \times 199$
      condensed image for exactly this pipeline [^3].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 4 The Sliding Window — tutorial, Stride; Padding
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/tut4.ipynb
      - source: d2l
        locator: Sec. 7.3.2 Stride, Eq. (7.3.2)
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html#stride
      - source: kaggle-learn
        locator: Computer Vision, Lesson 3 exercise, Question 1 Apply Pooling to Condense (checker)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex3.py
    source:
