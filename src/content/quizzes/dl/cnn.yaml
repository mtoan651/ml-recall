  - id: cnn-049
    type: single
    difficulty: medium
    tags:
      - max-pooling
      - translation-invariance
    question: |
      A feature map contains a small circle. You shift the circle by one or two pixels and then apply
      $2 \times 2$ max pooling (stride 2) several times in a row, to both the original and the
      shifted map. How do the two final maps compare?
    options:
      - text: They come out the same, because repeated pooling discards small shifts
        correct: true
      - text: They keep the shift, just at a lower resolution
        why: Pooling removes some positional information, so after several rounds a shift of a pixel or two no longer shows [^1].
      - text: They would come out the same for a shift of any size
        why: Pooling gives invariance only over small distances; features that start far apart stay distinct [^1].
      - text: The shifted circle vanishes, since only the original pixels can be maxima
        why: Max pooling keeps the largest activation in each window wherever it lies, so a shifted feature is kept, not lost [^1].
    explanation: |
      The zero pixels around a feature carry positional information, and max pooling throws some of
      it away; repeated pooling makes features at slightly different positions indistinguishable [^1].
      This is translation invariance over small distances, and the exercise's solution notes that the
      final image is the same each time a small random shift is applied [^2]. Building this invariance
      into the network means it does not have to learn from data to ignore small shifts in framing [^1].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 3 Maximum Pooling — tutorial, Translation Invariance
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/tut3.ipynb
      - source: kaggle-learn
        locator: Computer Vision, Lesson 3 exercise, Question 2 Explore Invariance (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex3.py
    source:
      id: kaggle-learn
      ref: computer_vision/ex3#q2
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/computer_vision/raw/ex3.ipynb
