  - id: cnn-027
    type: short_answer
    difficulty: easy
    tags:
      - computational-cost
      - channels
    question: |
      By what factor does the number of multiplications of a convolutional layer grow if you double
      both the number of input channels $c_i$ and the number of output channels $c_o$, keeping the
      kernel size, padding, stride and input height and width the same?
    answer:
      numeric: 4
      tolerance: 0
      hint: a whole number
      model: The cost is proportional to $c_i \cdot c_o$, so it grows by $2 \times 2 = 4$.
    explanation: |
      A convolution costs $\mathcal{O}(h \cdot w \cdot k^2 \cdot c_i \cdot c_o)$ [^1]: every output
      channel looks at every input channel. Doubling both channel counts multiplies the cost by
      $2 \times 2 = 4$, and so does the number of kernel weights,
      $c_o \times c_i \times k_h \times k_w$ [^2]. This quadratic penalty for wider layers is what
      grouped convolutions, as in ResNeXt, are designed to soften [^3].
    references:
      - source: d2l
        locator: Sec. 7.4.4 Discussion
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#discussion
      - source: d2l
