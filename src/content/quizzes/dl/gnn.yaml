    reviewed_by: claude
  - id: gnn-016
    type: short_answer
    difficulty: medium
    tags:
      - gcn
      - parameter-count
      - pyg
    question: |
      Kipf and Welling's two-layer GCN for Cora maps each node's 1,433 bag-of-words features to 16
      hidden units and then to the 7 classes. It is built in PyTorch Geometric as `GCNConv(1433, 16)`
      followed by `GCNConv(16, 7)`, and each layer keeps PyG's default `bias=True`, so it has a weight
      matrix **and** a bias vector. How many trainable parameters does the model have in total?
    answer:
      numeric: 23063
      tolerance: 0
      hint: a whole number
      model: $(1433 \cdot 16 + 16) + (16 \cdot 7 + 7) = 22944 + 119 = 23063$
    explanation: |
      Each `GCNConv(C, F)` holds a $C \times F$ weight matrix and a bias of size $F$ [^1], so the two
      layers have $1433 \cdot 16 + 16 = 22{,}944$ and $16 \cdot 7 + 7 = 119$ parameters. Cora's 2,708
      nodes and 5,429 edges [^2] do not appear: the normalised adjacency matrix comes from the graph
      and has no parameters. The paper's model is
      $Z = \mathrm{softmax}\big(\hat A\,\mathrm{ReLU}(\hat A X W^{(0)})\,W^{(1)}\big)$ with 16 hidden
      units on Cora [^2]; its equation has no bias terms, so without biases the count would be
      $1433 \cdot 16 + 16 \cdot 7 = 23{,}040$.
    references:
      - title: 'PyTorch Geometric documentation: GCNConv'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.conv.GCNConv.html
        locator: Formula; Parameters (in_channels, out_channels, bias)
