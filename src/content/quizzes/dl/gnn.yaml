topic: gnn
title: Graph Neural Networks
questions:
  - id: gnn-001
    type: short_answer
    difficulty: easy
    tags:
      - graph-basics
      - adjacency-matrix
      - self-loops
    question: |
      An undirected graph has $N = 6$ nodes and $|E| = 7$ edges, with no self-loops and no repeated
      edges. A GCN works with $\tilde A = A + I$, the adjacency matrix with a self-loop added at every
      node. How many entries of the $6 \times 6$ matrix $\tilde A$ are non-zero?
    answer:
      numeric: 20
      tolerance: 0
      hint: a whole number
      model: $2|E| + N = 2 \cdot 7 + 6 = 20$
    explanation: |
      In an undirected graph each edge $\{i, j\}$ sets both $A_{ij}$ and $A_{ji}$, so the adjacency
      matrix is symmetric [^1] and has $2|E| = 14$ non-zero entries, none of them on the diagonal.
      Adding the identity puts a 1 on each of the $N = 6$ diagonal entries [^2], giving
      $14 + 6 = 20$. Equivalently, the row sums of $\tilde A$ are the degrees plus one, and the degrees
      add up to $2|E|$ (handshaking lemma) [^3]. The other 16 entries stay zero, which is why GCN code
      stores $\tilde A$ as a sparse matrix.
    references:
      - title: 'Wikipedia: Adjacency matrix'
        url: https://en.wikipedia.org/wiki/Adjacency_matrix
        locator: Introduction (simple graphs; undirected graphs give a symmetric matrix); Definition
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2 Fast Approximate Convolutions on Graphs (Eq. 2)
      - title: 'Wikipedia: Degree (graph theory)'
        url: https://en.wikipedia.org/wiki/Degree_(graph_theory)#Handshaking_lemma
        locator: Handshaking lemma
    source:
      id: original
      ref: gnn-001
    status: reviewed
    reviewed_by: claude
  - id: gnn-002
    type: short_answer
    difficulty: medium
    tags:
      - graph-basics
      - adjacency-matrix
      - walks
    question: |
      An undirected graph has nodes $0, \dots, 4$ and the six edges
      $\{0,1\}, \{0,2\}, \{0,3\}, \{1,2\}, \{1,3\}, \{3,4\}$. Let $A$ be its adjacency matrix.
      What is the entry $(A^2)_{01}$?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: $(A^2)_{01} = \sum_k A_{0k} A_{k1} = 2$, the walks $0 \to 2 \to 1$ and $0 \to 3 \to 1$
    explanation: |
      $(A^2)_{ij} = \sum_k A_{ik} A_{kj}$ counts the walks of length 2 from $i$ to $j$ [^1][^2]: one
      for every node $k$ adjacent to both. Nodes 0 and 1 have the common neighbours 2 and 3, so
      $(A^2)_{01} = 2$; the edge $\{0,1\}$ itself is a walk of length 1 and does not count. On the
      diagonal, $(A^2)_{ii}$ is the degree of $i$ (go to a neighbour and come back). The same view
      explains message passing: multiplying the node features by $A$ sums each node's neighbours, and
      repeating it $k$ times reaches nodes $k$ hops away [^2].
    references:
      - title: 'Wikipedia: Adjacency matrix'
        url: https://en.wikipedia.org/wiki/Adjacency_matrix#Matrix_powers
        locator: Properties, Matrix powers
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: Into the Weeds, Graph convolutions as matrix multiplications, and matrix multiplications as walks on a graph
    source:
      id: original
      ref: gnn-002
    status: reviewed
    reviewed_by: claude
  - id: gnn-003
    type: single
    difficulty: easy
    tags:
      - graph-tasks
      - graph-classification
    question: Which of these is a **graph-level** prediction task?
    options:
      - text: Predicting whether a molecule (atoms and bonds) is toxic
        correct: true
      - text: Predicting the research topic of every paper in a citation network
        why: Every paper (node) gets its own label, so this is a node-level task, like classifying the members of a social network [^1].
      - text: Predicting whether two users of a social network will become friends
        why: This asks whether an edge exists between a pair of nodes, an edge-level task (link prediction) [^1].
      - text: Predicting the partial charge of every atom in a molecule
        why: Each atom (node) gets its own output, so this is node-level even though the input is one molecule [^1].
    explanation: |
      Graph tasks are grouped by what receives a prediction [^1]: a graph-level task predicts one
      property of a whole graph (for a molecule, its smell or whether it binds a receptor, the analogue
      of image classification); a node-level task predicts a property of every node (the analogue of
      segmentation); an edge-level task predicts the presence or value of edges. For a graph-level
      output the node embeddings are pooled into one vector by a readout such as a sum [^2]. Toxicity
      is a property of the molecule as a whole.
    references:
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: What types of problems have graph structured data? (Graph-level, Node-level and Edge-level task)
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?
        url: https://arxiv.org/abs/1810.00826
        locator: Sec. 2 Preliminaries (node and graph classification, READOUT Eq. 2.4)
    source:
      id: original
      ref: gnn-003
    status: reviewed
    reviewed_by: claude
  - id: gnn-004
    type: single
    difficulty: easy
    tags:
      - permutation-invariance
      - adjacency-matrix
      - mlp
    question: |
      Why is "flatten the $n \times n$ adjacency matrix and feed it to an MLP" a poor way to classify
      graphs?
    options:
      - text: Renumbering the nodes changes the input and can change the output
        correct: true
      - text: An MLP cannot be trained on inputs made only of zeros and ones
        why: Binary inputs are fine for an MLP (one-hot features are binary); the problem is that the input depends on an arbitrary node order.
      - text: Flattening the matrix throws away the direction of directed edges
        why: $A_{ij}$ and $A_{ji}$ are separate entries, so the flattened matrix of a directed graph still records the direction of every edge.
      - text: The adjacency matrix carries no information about how the nodes are connected
        why: It encodes all of the connectivity; the trouble is that many different matrices, one per node ordering, encode the same graph [^1].
    explanation: |
      Nodes have no natural order, so a graph with $n$ nodes can be written down in any of $n!$
      orderings, which permute the rows and columns of its adjacency matrix [^1][^2]. An MLP on the
      flattened matrix treats these as different inputs and has no guarantee of giving them the same
      output: it is not permutation invariant [^1]. It also needs a fixed $n$, while the graphs of a
      dataset differ in size, and an $n \times n$ matrix wastes memory on sparse graphs [^1]. GNNs share
      one function across nodes and combine neighbours with order-independent aggregations instead.
    references:
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: The challenges of using graphs in machine learning
      - title: 'Wikipedia: Adjacency matrix'
        url: https://en.wikipedia.org/wiki/Adjacency_matrix#Isomorphism_and_invariants
        locator: Properties, Isomorphism and invariants
    source:
      id: original
      ref: gnn-004
    status: reviewed
    reviewed_by: claude
  - id: gnn-005
    type: single
    difficulty: easy
    tags:
      - cnn
      - graph-structure
      - message-passing
    question: |
      A $3 \times 3$ convolution kernel stores one weight for each relative position (up-left, up,
      up-right, …). Which property of images makes this possible but fails for the nodes of a general
      graph?
    options:
      - text: Every interior pixel has the same number of neighbours at fixed offsets
        correct: true
      - text: Every pixel carries a real-valued feature vector, such as its RGB values
        why: Graph nodes carry feature vectors too (pixels can be seen as nodes with their RGB values as features) [^2]; features are not the obstacle.
      - text: Images are small enough to fit into the memory of a single GPU
        why: Size is a separate scalability issue; it does not decide whether neighbours can get position-specific weights.
      - text: Neighbouring pixels are usually more similar than distant pixels
        why: Smoothness is a statistical property of natural images, not what lets a kernel assign one weight per neighbour position.
    explanation: |
      Seen as a graph, an image is a grid in which every non-border pixel has exactly 8 neighbours [^1],
      each identified by its offset, so a kernel can keep one weight per offset and slide everywhere.
      In a general graph the number of neighbours varies from node to node and the neighbours have no
      order, so "the weight of the upper-left neighbour" has no meaning [^1][^2]. GNNs therefore apply
      one shared function to all neighbours and combine the results with an order-independent
      aggregation such as a sum or a mean [^1].
    references:
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: Images as graphs; Passing messages between parts of the graph
      - title: Daigavane, Ravindran & Aggarwal (2021), Understanding Convolutions on Graphs, Distill
        url: https://distill.pub/2021/understanding-gnns/
        locator: The Challenges of Computation on Graphs (Node-Order Equivariance); Extending Convolutions to Graphs
    source:
      id: original
      ref: gnn-005
    status: reviewed
    reviewed_by: claude
  - id: gnn-006
    type: single
    difficulty: medium
    tags:
      - permutation-equivariance
      - message-passing
    question: |
      A permutation matrix $P$ renumbers the $n$ nodes of a graph with node features
      $X \in \mathbb{R}^{n \times d}$ and adjacency matrix $A$. A GNN layer $F(X, A)$ outputs one row
      per node. Which equation says that $F$ is permutation **equivariant**?
    options:
      - text: $F(PX, PAP^\top) = P F(X, A)$
        correct: true
      - text: $F(PX, PAP^\top) = F(X, A)$
        why: This is invariance; row $i$ of the output would then describe a different node after renumbering. Invariance is what a graph-level readout needs, not a layer with one output per node [^2].
      - text: $F(PX, A) = P\,F(X, A)$
        why: Renumbering the nodes permutes both the rows and the columns of $A$; permuting only $X$ describes a different graph [^1].
      - text: $F(X, PAP^\top) = P\,F(X, A)$
        why: The feature rows must be permuted together with $A$; permuting only the adjacency matrix attaches each feature vector to a different node [^1].
    explanation: |
      Renumbering the nodes with $P$ reorders the rows of $X$ ($X \to PX$) and both the rows and the
      columns of the adjacency matrix ($A \to PAP^\top$) [^1]. A node-level layer should then return
      the same node outputs in the new order, $F(PX, PAP^\top) = P\,F(X, A)$: node-order
      equivariance [^1][^2]. Message-passing layers have this property because every node applies the
      same functions and aggregates its neighbours with an order-independent operation [^2]. A
      graph-level readout must instead be invariant, giving the same vector for every node order [^2].
    references:
      - title: Daigavane, Ravindran & Aggarwal (2021), Understanding Convolutions on Graphs, Distill
        url: https://distill.pub/2021/understanding-gnns/
        locator: Node-Order Equivariance; Polynomial Filters are Node-Order Equivariant
      - title: 'Wikipedia: Graph neural network'
        url: https://en.wikipedia.org/wiki/Graph_neural_network#Architecture
        locator: Introduction; Architecture
    source:
      id: original
      ref: gnn-006
    status: reviewed
    reviewed_by: claude
  - id: gnn-007
    type: single
    difficulty: easy
    tags:
      - readout
      - permutation-invariance
      - graph-classification
    question: |
      A GNN computes final node embeddings $h_v$ for graphs with different numbers of nodes. Which
      readout gives a graph embedding $h_G$ of fixed size that does not depend on how the nodes are
      numbered?
    options:
      - text: The element-wise sum $h_G = \sum_v h_v$
        correct: true
      - text: The concatenation of all $h_v$ in node-index order
        why: Its length grows with the number of nodes, and renumbering the nodes reorders the blocks, so one graph gives several different vectors.
      - text: The embedding of the node with index 0, $h_G = h_0$
        why: Which node gets index 0 is arbitrary, so a renumbered copy of the same graph would get a different embedding.
      - text: The last hidden state of an LSTM run over the $h_v$ in index order
        why: An LSTM reads a sequence, so its output depends on the order of the nodes; GraphSAGE notes that LSTMs are not permutation invariant [^3].
    explanation: |
      For graph classification, a readout pools the final node embeddings into one vector,
      $h_G = \mathrm{READOUT}(\{h_v : v \in G\})$ [^1]. It must be permutation invariant, so that
      renumbering the nodes does not change the output, and it must accept any number of nodes; the
      element-wise sum, mean and maximum all qualify [^2]. Of the three, the sum keeps the most
      information about the multiset of embeddings, which is why GIN uses sum readouts [^1].
    references:
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?
        url: https://arxiv.org/abs/1810.00826
        locator: Sec. 2 Preliminaries (Eq. 2.4); Sec. 4.2 Graph-level readout of GIN; Sec. 5.2 (Figure 2, ranking of sum, mean and max)
      - title: 'Wikipedia: Graph neural network'
        url: https://en.wikipedia.org/wiki/Graph_neural_network#Architecture
        locator: Architecture (Global pooling)
      - title: Hamilton, Ying & Leskovec (2017), Inductive Representation Learning on Large Graphs
        url: https://arxiv.org/abs/1706.02216
        locator: Sec. 3.3 Aggregator Architectures (LSTM aggregator)
    source:
      id: original
      ref: gnn-007
    status: reviewed
    reviewed_by: claude
  - id: gnn-008
    type: single
    difficulty: easy
    tags:
      - message-passing
      - aggregation
    question: |
      A message-passing layer updates node $i$ as

      $$
      h_i' = \gamma\Big(h_i,\ \bigoplus_{j \in \mathcal N(i)} \phi\big(h_i, h_j, e_{ji}\big)\Big),
      $$

      where $\mathcal N(i)$ is the set of neighbours of $i$ and $e_{ji}$ the feature of the edge
      $j \to i$. What is $\bigoplus$, and which property must it have?
    options:
      - text: The aggregation; it must be permutation invariant and take any number of messages
        correct: true
      - text: The update function; it must be a trainable multi-layer perceptron
        why: The update is $\gamma$, which combines the node's previous state with the aggregated messages [^1].
      - text: The message function; it must be a linear function of $h_j$
        why: The message is $\phi$, computed per edge; it can be any differentiable function, for example an MLP [^1].
      - text: The aggregation; it must concatenate all the messages so that no information is lost
        why: Concatenation depends on the order of the neighbours and its length grows with the degree, so it is not permutation invariant [^3].
    explanation: |
      In this general form, $\phi$ builds a message along every edge $j \to i$, $\bigoplus$ combines
      the messages of all neighbours, and $\gamma$ updates the node from its previous state and the
      combined messages [^1][^2]. Since neighbours have no order and their number varies, $\bigoplus$
      must be a differentiable, permutation-invariant function of a variable-size set, such as sum,
      mean or max [^1][^3]. Gilmer et al.'s MPNN, for instance, sums message functions $M_t$ over the
      neighbours and applies an update function $U_t$ [^2].
    references:
      - title: 'PyTorch Geometric documentation: Creating Message Passing Networks'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/tutorial/create_gnn.html
        locator: Introduction (general message passing formula); The MessagePassing Base Class
      - title: Gilmer et al. (2017), Neural Message Passing for Quantum Chemistry
        url: https://arxiv.org/abs/1704.01212
        locator: Sec. 2 Message Passing Neural Networks (Eqs. 1–3)
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: Into the Weeds, Comparing aggregation operations
    source:
      id: original
      ref: gnn-008
    status: reviewed
    reviewed_by: claude
  - id: gnn-009
    type: single
    difficulty: medium
    tags:
      - aggregation
      - gin
      - expressive-power
    question: |
      Node $u$ has four neighbours with scalar features $\{1, 1, 2, 2\}$; node $v$ has two neighbours
      with features $\{1, 2\}$. Which neighbour aggregator gives $u$ and $v$ **different** values?
    options:
      - text: Sum
        correct: true
      - text: Mean
        why: Both means are 1.5. The mean keeps the proportions of the values, not how many neighbours there are [^1].
      - text: Max
        why: Both maxima are 2. The max reduces the multiset to the set of distinct values and ignores how often each occurs [^1].
      - text: Min
        why: Both minima are 1; like the max, the min ignores multiplicities.
    explanation: |
      The sum gives $6$ for $u$ and $3$ for $v$; the mean gives $1.5$ for both, the max $2$ and the min
      $1$. Xu et al. rank the aggregators by what they keep of the multiset of neighbour features: the
      sum can capture the whole multiset, the mean only its distribution (proportions), the max only
      the underlying set [^1]. That is why GIN aggregates with a sum followed by an MLP [^2]:
      $h_v^{(k)} = \mathrm{MLP}^{(k)}\big((1 + \epsilon^{(k)})\,h_v^{(k-1)} + \sum_{u \in \mathcal N(v)} h_u^{(k-1)}\big)$.
      Mean and max are still useful, e.g. when degrees vary a lot or a single salient neighbour
      matters [^3].
    references:
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?
        url: https://arxiv.org/abs/1810.00826
        locator: Sec. 5.2 Structures that confuse mean and max-pooling (Figure 2); 5.3 Mean learns distributions; 5.4 Max-pooling learns sets with distinct elements
      - title: Xu, Hu, Leskovec & Jegelka (2019), How Powerful are Graph Neural Networks?
        url: https://arxiv.org/abs/1810.00826
        locator: Sec. 4.1 Graph Isomorphism Network (GIN), Eq. 4.1
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: Into the Weeds, Comparing aggregation operations
    source:
      id: original
      ref: gnn-009
    status: reviewed
    reviewed_by: claude
  - id: gnn-010
    type: single
    difficulty: easy
    tags:
      - gcn
      - self-loops
    question: Why does a GCN add self-loops, using $\tilde A = A + I$ instead of the adjacency matrix $A$?
    options:
      - text: So that each node's own features are included in its update
        correct: true
      - text: So that the adjacency matrix of the graph becomes symmetric
        why: The adjacency matrix of an undirected graph is already symmetric, and adding $I$ changes only the diagonal.
      - text: So that the graph becomes connected, with no separate components
        why: Self-loops add no edges between different nodes, so separate components stay separate.
      - text: So that the degree normalisation is no longer needed
        why: GCN still normalises with $\tilde D^{-1/2}\tilde A\tilde D^{-1/2}$; the self-loops only make every degree at least 1 [^1].
    explanation: |
      With $A$ alone, $(AH)_i = \sum_{j \in \mathcal N(i)} h_j$ sums only the neighbours, so a node's own
      state would be dropped in every layer. Self-loops make each node its own neighbour, so the layer
      mixes the node's features with those of its neighbours [^1][^2]. Kipf and Welling's rule
      $H^{(l+1)} = \sigma(\tilde D^{-1/2}\tilde A\tilde D^{-1/2} H^{(l)} W^{(l)})$ uses
      $\tilde A = A + I_N$ and the degrees $\tilde D_{ii} = \sum_j \tilde A_{ij}$ of that matrix [^1];
      PyG's `GCNConv` likewise adds self-loops as its first step [^3].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2 Fast Approximate Convolutions on Graphs (Eq. 2)
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, Why GCNs Work
      - title: 'PyTorch Geometric documentation: Creating Message Passing Networks'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/tutorial/create_gnn.html
        locator: Implementing the GCN Layer (steps 1–6)
    source:
      id: original
      ref: gnn-010
    status: reviewed
    reviewed_by: claude
  - id: gnn-011
    type: single
    difficulty: medium
    tags:
      - gcn
      - normalisation
    question: |
      A GCN layer computes $\sigma(\tilde D^{-1/2}\tilde A\tilde D^{-1/2} H W)$, where
      $\tilde A = A + I$ is the adjacency matrix with self-loops and $\tilde D$ its diagonal degree
      matrix, $\tilde D_{ii} = \sum_j \tilde A_{ij}$. What would go wrong if it computed
      $\sigma(\tilde A H W)$, without the degree normalisation?
    options:
      - text: Outputs would grow with node degree and could blow up across layers
        correct: true
      - text: The layer would stop being permutation equivariant
        why: $\tilde A H W$ is a plain sum over each node and its neighbours, which does not depend on their order; the normalisation is about scale, not symmetry.
      - text: The layer would need a separate weight matrix for each node of the graph
        why: $W$ is shared by all nodes either way; the normalisation adds no parameters and removes none.
      - text: Isolated nodes would cause a division by zero in the update
        why: Without the normalisation there is no division at all, and with self-loops every degree in $\tilde D$ is at least 1.
    explanation: |
      Without normalisation, row $i$ of $\tilde A H$ is the sum of $\tilde d_i$ feature vectors, so
      high-degree nodes get much larger values than low-degree ones, and every extra layer multiplies
      the gap: in a star with 5 leaves, the centre's entry of $\tilde A^5 \mathbf 1$ is 576 and each
      leaf's is 256. The symmetric normalisation weights each edge by $1/\sqrt{\tilde d_i \tilde d_j}$;
      this is how GCN handles very different node degrees with a single weight matrix per layer [^1].
      The eigenvalues of the normalised matrix are at most 1 in absolute value, so repeated
      application stays bounded [^2].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2.2 Layer-Wise Linear Model (renormalization trick); Sec. 4.2 Neural Networks on Graphs
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, When GCNs Fail (Theorem 1 and its proof)
    source:
      id: original
      ref: gnn-011
    status: reviewed
    reviewed_by: claude
  - id: gnn-012
    type: single
    difficulty: hard
    tags:
      - gcn
      - renormalization-trick
      - spectral
    question: |
      Kipf and Welling first derive the filter $\theta\,(I_N + D^{-1/2} A D^{-1/2})\,x$, where $D$ is
      the diagonal degree matrix of the adjacency matrix $A$. They then replace
      $I_N + D^{-1/2} A D^{-1/2}$ by $\tilde D^{-1/2}\tilde A\tilde D^{-1/2}$, with $\tilde A = A + I_N$
      and $\tilde D$ the degree matrix of $\tilde A$ (the renormalisation trick). Which problem of the
      first operator does this fix?
    options:
      - text: Its eigenvalues reach 2, so repeated use in deep models can explode or vanish
        correct: true
      - text: It leaves out each node's own features, which only the self-loops of $\tilde A$ bring back
        why: The $I_N$ term is exactly the node's own contribution, so both operators include it.
      - text: It is not symmetric, so it has no orthonormal basis of eigenvectors to work with
        why: For an undirected graph it is symmetric; symmetry is not the issue.
      - text: It needs an eigendecomposition of the graph Laplacian, which is too slow for large graphs
        why: Both operators are first-order in the adjacency matrix and need no eigendecomposition; avoiding it was the point of the first-order approximation [^1].
    explanation: |
      The operator $I_N + D^{-1/2}AD^{-1/2}$ has eigenvalues in $[0, 2]$, so applying it again and again
      in a deep network can cause numerical instabilities and exploding or vanishing gradients [^1].
      Putting the identity inside the normalisation ($\tilde A = A + I_N$,
      $\tilde D_{ii} = \sum_j \tilde A_{ij}$) gives a matrix whose eigenvalues lie in $(-1, 1]$ [^2]. On a
      star with 5 leaves, $(I_N + D^{-1/2}AD^{-1/2})^{10}\mathbf 1$ has norm about 2343, while the
      renormalised matrix gives about 2.4. The renormalised layer also scored best in the paper's
      comparison of propagation models [^1].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2.2 Layer-Wise Linear Model (Eqs. 7–8); Sec. 6.2 Evaluation of Propagation Model (Table 3)
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, When GCNs Fail (proof of Theorem 1)
    source:
      id: original
      ref: gnn-012
    status: reviewed
    reviewed_by: claude
  - id: gnn-013
    type: short_answer
    difficulty: medium
    tags:
      - gcn
      - normalisation
      - hand-computation
    question: |
      Take the undirected path graph $1 - 2 - 3$. A GCN uses
      $\hat A = \tilde D^{-1/2}\tilde A\tilde D^{-1/2}$ with $\tilde A = A + I$ and
      $\tilde D_{ii} = \sum_j \tilde A_{ij}$. What is the entry $\hat A_{12}$, the weight that node 1
      gives to node 2?
    answer:
      numeric: 0.4082
      tolerance: 0.003
      hint: a number between 0 and 1, 3 decimals
      model: $\tilde d_1 = 2$ and $\tilde d_2 = 3$, so $\hat A_{12} = 1/\sqrt{2 \cdot 3} = 1/\sqrt 6 \approx 0.408$
    explanation: |
      With self-loops, node 1 has degree $\tilde d_1 = 1 + 1 = 2$ and node 2 has
      $\tilde d_2 = 2 + 1 = 3$. Entry $(i, j)$ of $\tilde D^{-1/2}\tilde A\tilde D^{-1/2}$ is
      $\tilde A_{ij}/\sqrt{\tilde d_i \tilde d_j}$ [^1][^2], so $\hat A_{12} = 1/\sqrt 6 \approx 0.408$.
      The diagonal of $\hat A$ is $(1/2, 1/3, 1/2)$. Unlike the mean $\tilde D^{-1}\tilde A$, the rows
      of $\hat A$ need not sum to 1: row 2 sums to $1/3 + 2/\sqrt 6 \approx 1.15$.
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2 Fast Approximate Convolutions on Graphs (Eq. 2)
      - title: 'PyTorch Geometric documentation: GCNConv'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.conv.GCNConv.html
        locator: Node-wise formulation
