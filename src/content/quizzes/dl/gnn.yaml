  - id: gnn-017
    type: short_answer
    difficulty: medium
    tags:
      - receptive-field
      - message-passing
    question: |
      An undirected graph has nodes $0, \dots, 6$ and the seven edges
      $\{0,1\}, \{0,2\}, \{1,3\}, \{2,4\}, \{3,5\}, \{4,5\}, \{5,6\}$. A 2-layer message-passing GNN
      (each layer combines a node with its direct neighbours) computes the output of node 0. How many
      nodes, counting node 0 itself, have input features that can influence this output?
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: the nodes within 2 hops of node 0, $\{0, 1, 2, 3, 4\}$
    explanation: |
      Each message-passing layer moves information one hop, so after $k$ layers a node's
      representation depends on its $k$-hop neighbourhood [^1][^2]. Node 0 reaches nodes 1 and 2 in
      one hop and nodes 3 and 4 in two, so 5 nodes count; nodes 5 and 6 are 3 and 4 hops away and would
      need 3 and 4 layers. In matrix form, the non-zero entries in row 0 of $(A + I)^2$ are exactly
      these 5 nodes [^3].
    references:
      - title: 'Wikipedia: Graph neural network'
        url: https://en.wikipedia.org/wiki/Graph_neural_network#Message_passing_layers
        locator: Message passing layers
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2.2 Layer-Wise Linear Model (k-th order neighbourhood)
      - title: Sanchez-Lengeling et al. (2021), A Gentle Introduction to Graph Neural Networks, Distill
        url: https://distill.pub/2021/gnn-intro/
        locator: Into the Weeds, Graph convolutions as matrix multiplications, and matrix multiplications as walks on a graph
    source:
      id: original
      ref: gnn-017
    status: reviewed
    reviewed_by: claude
  - id: gnn-018
    type: true_false
    difficulty: easy
    tags:
      - over-smoothing
      - depth
      - gcn
    shuffle: false
    question: |
      True or false: because every extra GCN layer widens each node's receptive field by one hop, a
      10-layer GCN without residual connections usually classifies the nodes of a citation graph
      better than a 2-layer GCN.
    options:
      - text: 'True'
        why: Kipf and Welling got their best results with 2 or 3 layers, and beyond about 7 layers training without residual connections became difficult [^1].
      - text: 'False'
        correct: true
    explanation: |
      In Kipf and Welling's depth experiments on Cora, Citeseer and Pubmed, 2- or 3-layer models did
      best, and deeper models without residual connections were hard to train [^1]. A GCN layer is a
      form of Laplacian smoothing: a few rounds make the nodes of a cluster similar, which helps, but
      many rounds mix the features of different clusters until they are indistinguishable,
      the problem called over-smoothing [^2]. A larger receptive field only helps while the
      representations stay distinguishable.
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Appendix B Experiments on Model Depth (Figure 5)
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, Why GCNs Work; When GCNs Fail
    source:
      id: original
      ref: gnn-018
    status: reviewed
    reviewed_by: claude
  - id: gnn-019
    type: single
    difficulty: medium
    tags:
      - over-smoothing
      - depth
    question: What does **over-smoothing** mean for a GNN with many message-passing layers?
    options:
      - text: All node representations become almost the same, so nodes look alike
        correct: true
      - text: The weights grow so large during training that the loss diverges
        why: That describes exploding gradients. Over-smoothing comes from repeated neighbourhood averaging and shows up even in untrained GCNs with random weights [^2].
      - text: The model memorises the labelled nodes and then fails on the test nodes
        why: That is overfitting, a separate risk of deep models that Kipf and Welling mention next to the training difficulty [^3].
      - text: Information from distant nodes is squeezed into fixed-size vectors
        why: That is over-squashing, the bottleneck created by long-range dependencies [^1].
    explanation: |
      Every layer averages each node with its neighbours. Li et al. show that GCN propagation is a
      special form of Laplacian smoothing, and that repeating it drives the features of all nodes in a
      connected component towards the same values (up to a degree factor), so they become
      indistinguishable [^2]. Over-smoothing and over-squashing are both listed as problems of deep
      message-passing stacks; skip connections, gated updates and jumping knowledge can mitigate
      over-smoothing [^1].
    references:
      - title: 'Wikipedia: Graph neural network'
        url: https://en.wikipedia.org/wiki/Graph_neural_network#Message_passing_layers
        locator: Message passing layers
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, When GCNs Fail (Figure 2, Theorem 1)
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Appendix B Experiments on Model Depth
    source:
      id: original
      ref: gnn-019
    status: reviewed
    reviewed_by: claude
  - id: gnn-020
    type: single
    difficulty: hard
    tags:
      - over-smoothing
      - gcn
      - spectral
    question: |
      On a connected undirected graph with adjacency matrix $A$, let $\tilde A = A + I$ (self-loops
      added), $\tilde D$ its diagonal degree matrix and $\tilde d_i = \tilde D_{ii}$. A feature vector
      $x$ is multiplied again and again by $\hat A = \tilde D^{-1/2}\tilde A\tilde D^{-1/2}$ (no weights,
      no nonlinearity). What does $\hat A^k x$ approach as $k \to \infty$, for a generic $x$?
    options:
      - text: A vector whose entry at node $i$ is proportional to $\sqrt{\tilde d_i}$
        correct: true
      - text: A constant vector, the same value at every node
        why: That is the limit for the random-walk (mean) normalisation $\tilde D^{-1}\tilde A$, whose eigenvector for eigenvalue 1 is the all-ones vector [^1].
      - text: The zero vector, because every eigenvalue of $\hat A$ is strictly below 1
        why: The largest eigenvalue of $\hat A$ is exactly 1, with eigenvector $\tilde D^{1/2}\mathbf 1$, so that component of $x$ survives.
      - text: The vector $x$ itself, since $\hat A$ is normalised
        why: Normalisation bounds the eigenvalues by 1 in absolute value but does not make $\hat A$ the identity; every other component of $x$ shrinks.
    explanation: |
      $\hat A\,\tilde D^{1/2}\mathbf 1 = \tilde D^{-1/2}\tilde A\mathbf 1 = \tilde D^{-1/2}\tilde D\mathbf 1 = \tilde D^{1/2}\mathbf 1$,
      so $\tilde D^{1/2}\mathbf 1$ is an eigenvector with eigenvalue 1 (equivalently, eigenvalue 0 of
      the symmetric normalised Laplacian $I - \hat A$) [^2]. With self-loops the graph has no
      bipartite component, all other eigenvalues have absolute value below 1, and their components
      vanish under repeated multiplication [^1]. Li et al. conclude that symmetric Laplacian smoothing
      makes the features of a connected component proportional to the square root of the degree,
      while the random-walk version makes them equal [^1]; the $D^{-1/2}$ printed in the statement of
      their Theorem 1 should read $D^{1/2}$, as the eigenvector above shows. Either way the features
      stop carrying node-specific information: over-smoothing.
    references:
      - title: Li, Han & Wu (2018), Deeper Insights into Graph Convolutional Networks for Semi-Supervised Learning
        url: https://arxiv.org/abs/1801.07606
        locator: Sec. 3 Analysis, When GCNs Fail (the text before Theorem 1, and its proof)
      - title: von Luxburg (2007), A Tutorial on Spectral Clustering
        url: https://arxiv.org/abs/0711.0189
        locator: Sec. 3.2 The normalized graph Laplacians (Propositions 3 and 4)
    source:
      id: original
      ref: gnn-020
    status: reviewed
    reviewed_by: claude
  - id: gnn-021
    type: single
    difficulty: medium
    tags:
      - graphsage
      - inductive
    question: |
      What allows GraphSAGE to compute embeddings for nodes that were **not** in the graph during
      training?
    options:
      - text: It learns shared aggregators that compute embeddings from neighbourhoods
        correct: true
      - text: It samples a fixed number of neighbours for every node
        why: Sampling keeps the cost of each batch fixed [^1]; a method that samples could still learn one embedding per node and be transductive.
      - text: It trains one embedding vector for each node and stores them in a lookup table
        why: That is what transductive methods such as DeepWalk do, and a lookup table has no entry for an unseen node [^1].
      - text: It rescales every embedding to unit length after each layer
        why: The $\ell_2$ normalisation in Algorithm 1 only rescales embeddings; it has nothing to do with unseen nodes.
    explanation: |
      Instead of training a separate embedding for each node, GraphSAGE learns $K$ aggregator
      functions and weight matrices that compute an embedding from the features of a node's (sampled)
      neighbourhood [^1]. These functions are shared by all nodes, so they can be applied to new nodes
      or to entirely new graphs, such as new Reddit posts or the protein-interaction graphs of unseen
      tissues [^1]. This is inductive learning; methods that optimise per-node embeddings on one fixed
      graph are transductive [^1].
    references:
      - title: Hamilton, Ying & Leskovec (2017), Inductive Representation Learning on Large Graphs
        url: https://arxiv.org/abs/1706.02216
        locator: Abstract; Sec. 2 Related work (Factorization-based embedding approaches); Sec. 3.1 Embedding generation (Algorithm 1); Sec. 4.2 Generalizing across graphs (protein-protein interactions)
    source:
      id: original
      ref: gnn-021
    status: reviewed
    reviewed_by: claude
  - id: gnn-022
    type: short_answer
    difficulty: medium
    tags:
      - graphsage
      - neighbour-sampling
    question: |
      GraphSAGE with $K = 2$ layers uses the neighbourhood sample sizes $S_1 = 25$ and $S_2 = 10$ of the
      paper's experiments; neighbours are drawn uniformly, with replacement when a node has fewer
      neighbours than needed. For one target node, how many 2-hop neighbour samples are drawn, however
      large the graph is?
    answer:
      numeric: 250
      tolerance: 0
      hint: a whole number
      model: $S_1 \cdot S_2 = 25 \cdot 10 = 250$ (on top of $S_2 = 10$ immediate neighbours)
    explanation: |
      GraphSAGE replaces each full neighbourhood by a fixed-size uniform sample, so the cost of a batch
      is $O(\prod_{i=1}^K S_i)$ instead of growing with the node degrees [^1]. Seen from a target node,
      $K = 2$ with $S_1 = 25$ and $S_2 = 10$ means $S_2 = 10$ sampled immediate neighbours and
      $S_1 \cdot S_2 = 250$ sampled 2-hop neighbours, drawn with replacement when a degree is smaller
      than the sample size [^2]. The authors found that $K = 2$ with $S_1 \cdot S_2 \le 500$ already
      performs well [^1].
    references:
      - title: Hamilton, Ying & Leskovec (2017), Inductive Representation Learning on Large Graphs
        url: https://arxiv.org/abs/1706.02216
        locator: Sec. 3.1 Embedding generation (Neighborhood definition); Sec. 4 Experiments (Experimental set-up)
      - title: Hamilton, Ying & Leskovec (2017), Inductive Representation Learning on Large Graphs
        url: https://arxiv.org/abs/1706.02216
        locator: Appendix A Minibatch pseudocode
    source:
      id: original
      ref: gnn-022
    status: reviewed
    reviewed_by: claude
  - id: gnn-023
    type: single
    difficulty: easy
    tags:
      - transductive
      - inductive
      - gcn
    question: |
      A GCN is trained on the Cora citation graph: all 2,708 papers, their features and their
      citations are in the graph during training, but only 140 labels are used. The model is then
      evaluated on 1,000 other papers of that same graph, whose labels were hidden. What is this
      setting, in which the test nodes are already part of the training graph, called?
    options:
      - text: Transductive learning
        correct: true
      - text: Inductive learning
        why: Inductive learning evaluates on nodes or whole graphs that were not seen during training, such as GAT's unseen protein–protein interaction test graphs [^2].
      - text: Self-supervised learning
        why: The labels of 140 nodes are used directly in the loss; no pretext task built from the unlabelled data is involved.
      - text: Transfer learning
        why: Nothing is transferred to another task or dataset; training and test nodes come from the same graph.
    explanation: |
      In the transductive setting the test nodes are part of the graph during training: their
      features and edges are visible, only their labels are hidden [^1][^2]. Kipf and Welling's
      semi-supervised GCN works this way on Cora, with 20 labels per class (140 in total), 500
      validation and 1,000 test nodes [^1][^3]. Inductive methods such as GraphSAGE must instead
      generalise to nodes or graphs never seen in training [^2].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 4.2 Neural Networks on Graphs (transductive node classification); Sec. 5.1 Datasets; Sec. 5.2 Experimental Set-Up
      - title: Veličković et al. (2018), Graph Attention Networks
        url: https://arxiv.org/abs/1710.10903
        locator: Sec. 3.1 Datasets (Transductive learning; Inductive learning)
      - title: 'PyTorch Geometric documentation: Introduction by Example'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/get_started/introduction.html
        locator: Common Benchmark Datasets (Cora masks)
    source:
