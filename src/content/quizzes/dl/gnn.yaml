  - id: gnn-014
    type: short_answer
    difficulty: hard
    tags:
      - gcn
      - hand-computation
    question: |
      An undirected graph has nodes $0, 1, 2, 3$ and edges $\{0,1\}, \{0,2\}, \{1,2\}, \{0,3\}$: a
      triangle with node 3 hanging off node 0. Each node has one scalar feature, $x = (1, 2, 3, 4)$.
      One GCN layer computes

      $$
      H = \mathrm{ReLU}\big(\tilde D^{-1/2}\tilde A\tilde D^{-1/2}\, x\, W\big), \qquad \tilde A = A + I,
      $$

      where $\tilde D$ is the diagonal degree matrix of $\tilde A$ ($\tilde D_{ii} = \sum_j \tilde A_{ij}$),
      the $1 \times 1$ weight is $W = 1$ and there is no bias. What is the output of node 0?
    answer:
      numeric: 3.11
      tolerance: 0.01
      hint: a decimal number, 2 decimals
      model: $\tilde d = (4, 3, 3, 2)$, so $h_0 = \frac{1}{4} + \frac{2}{\sqrt{12}} + \frac{3}{\sqrt{12}} + \frac{4}{\sqrt 8} \approx 0.25 + 0.577 + 0.866 + 1.414 \approx 3.11$
    explanation: |
      With self-loops the degrees are $\tilde d = (4, 3, 3, 2)$. Node 0's new value is
      $\sum_j x_j/\sqrt{\tilde d_0 \tilde d_j}$ over its closed neighbourhood $\{0, 1, 2, 3\}$ [^1][^2]:
      $1/4 + 2/\sqrt{12} + 3/\sqrt{12} + 4/\sqrt 8 \approx 3.11$, which the ReLU leaves unchanged. It is
      neither the plain sum $(\tilde A x)_0 = 10$ nor the mean $10/4 = 2.5$: the symmetric
      normalisation gives the low-degree neighbour 3 the largest weight, $1/\sqrt 8 \approx 0.354$.
      The whole layer outputs about $(3.11, 1.96, 1.96, 2.35)$.
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2 Fast Approximate Convolutions on Graphs (Eq. 2)
      - title: 'PyTorch Geometric documentation: GCNConv'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.conv.GCNConv.html
        locator: Node-wise formulation
    source:
      id: original
      ref: gnn-014
    status: reviewed
    reviewed_by: claude
  - id: gnn-015
    type: true_false
    difficulty: easy
    tags:
      - gcn
      - parameter-count
      - weight-sharing
    shuffle: false
    question: |
      True or false: the same GCN layer (16 input and 32 output features) has more trainable
      parameters when it runs on a graph with 10,000 nodes than on a graph with 100 nodes.
    options:
      - text: 'True'
        why: The weight matrix is shared by all nodes, so the number of parameters depends only on the feature sizes, not on the graph [^1].
      - text: 'False'
        correct: true
    explanation: |
      A GCN layer has one weight matrix shared by all nodes, here $W \in \mathbb{R}^{16 \times 32}$; the graph
      enters only through the normalised adjacency matrix $\tilde D^{-1/2}\tilde A\tilde D^{-1/2}$,
      which is computed, not learned [^1]. With PyG's default bias, `GCNConv(16, 32)` has
      $16 \cdot 32 + 32 = 544$ parameters on every graph [^3]. Earlier designs that learned a weight
      matrix per node degree did not scale to graphs with wide degree distributions; GCN uses a single
      matrix per layer and handles degrees by normalisation [^2].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2.2 Layer-Wise Linear Model (Eq. 8)
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 4.2 Neural Networks on Graphs
      - title: 'PyTorch Geometric documentation: GCNConv'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.conv.GCNConv.html
        locator: Parameters (in_channels, out_channels, bias)
