    reviewed_by: claude
  - id: gnn-024
    type: single
    difficulty: medium
    tags:
      - gat
      - gcn
      - attention
    question: How does a GAT layer weight the neighbours of a node differently from a GCN layer?
    options:
      - text: GAT learns them from node features by attention; GCN fixes them from degrees
        correct: true
      - text: GAT attends to every node of the graph, while GCN uses only direct neighbours
        why: GAT uses masked attention; $e_{ij}$ is computed only for $j$ in the neighbourhood of $i$, including $i$ itself [^1].
      - text: GAT weights neighbours with eigenvectors of the graph Laplacian, GCN with degrees
        why: GAT needs no eigendecomposition or other costly matrix operation; its weights come from a small shared network applied to pairs of nodes [^1].
      - text: GAT gives every neighbour the weight $1/|\mathcal N(i)|$, while GCN learns its weights
        why: It is the other way round; GCN's weights are fixed by the graph and GAT's are learned [^2].
    explanation: |
      GAT computes a score $e_{ij} = \mathrm{LeakyReLU}\big(\mathbf a^\top [W h_i \,\Vert\, W h_j]\big)$
      for every neighbour $j$ of $i$ (including $i$), normalises the scores with a softmax over the
      neighbourhood, $\alpha_{ij} = \mathrm{softmax}_j(e_{ij})$, and outputs the weighted sum
      $\sum_j \alpha_{ij} W h_j$ [^1]. The weights depend on the features, so neighbours of the same
      node can get different importance [^1]. GCN's weights $1/\sqrt{\tilde d_i \tilde d_j}$, with
      $\tilde d_i$ the degree of $i$ counting its self-loop, are fixed by the graph: a GCN is
      like a GAT whose coefficients are not learned [^2].
    references:
      - title: Veličković et al. (2018), Graph Attention Networks
        url: https://arxiv.org/abs/1710.10903
        locator: Sec. 2.1 Graph Attentional Layer (Eqs. 1–4); Sec. 2.2 Comparisons to Related Work
      - title: 'Wikipedia: Graph neural network'
        url: https://en.wikipedia.org/wiki/Graph_neural_network#Graph_attention_network
        locator: Message passing layers, Graph attention network
    source:
      id: original
      ref: gnn-024
    status: reviewed
    reviewed_by: claude
  - id: gnn-025
    type: short_answer
    difficulty: hard
    tags:
      - gat
      - attention
      - hand-computation
    question: |
      In a single-head GAT layer, node $i$ attends over $\mathcal N(i) = \{i, u, w\}$ (itself and two
      neighbours). After the shared linear map the features are scalars: $Wh_i = 0.5$, $Wh_u = 1.5$ and
      $Wh_w = -2.0$. The attention vector is $\mathbf a = (1, 1)$, so the raw score is
      $s_{ij} = \mathbf a^\top [Wh_i \,\Vert\, Wh_j] = Wh_i + Wh_j$, and

      $$
      \alpha_{ij} = \frac{\exp\big(\mathrm{LeakyReLU}(s_{ij})\big)}{\sum_{k \in \mathcal N(i)} \exp\big(\mathrm{LeakyReLU}(s_{ik})\big)}
      $$

      with negative slope 0.2. What is $\alpha_{iu}$?
    answer:
      numeric: 0.68
      tolerance: 0.01
      hint: a number between 0 and 1, 2 decimals
      model: scores $(1, 2, -1.5) \to$ LeakyReLU $(1, 2, -0.3)$; $\alpha_{iu} = e^{2}/(e^{1} + e^{2} + e^{-0.3}) \approx 7.389/10.848 \approx 0.68$
    explanation: |
      The raw scores are $s_{ii} = 1.0$, $s_{iu} = 2.0$ and $s_{iw} = -1.5$. The LeakyReLU with slope
      0.2 keeps the positive scores and turns $-1.5$ into $-0.3$ [^1]. The softmax over the
      neighbourhood gives $\alpha \approx (0.25, 0.68, 0.07)$ for $(i, u, w)$, so
      $\alpha_{iu} \approx 0.68$; skipping the LeakyReLU would give 0.72, and leaving out the
      self-loop 0.91. The new feature is $\sum_j \alpha_{ij} W h_j \approx 1.01$ before the
      nonlinearity [^1]. PyG's `GATConv` uses the same formula, with self-loops added by default [^2].
    references:
      - title: Veličković et al. (2018), Graph Attention Networks
        url: https://arxiv.org/abs/1710.10903
        locator: Sec. 2.1 Graph Attentional Layer (Eqs. 1–4)
      - title: 'PyTorch Geometric documentation: GATConv'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.conv.GATConv.html
        locator: Formulas; Parameters (negative_slope, add_self_loops)
    source:
      id: original
      ref: gnn-025
    status: reviewed
    reviewed_by: claude
  - id: gnn-026
    type: true_false
    difficulty: medium
    tags:
      - gat
      - attention
      - masked-attention
    shuffle: false
    question: |
      True or false: like self-attention in a Transformer, a GAT layer computes an attention
      coefficient between every pair of nodes in the graph.
    options:
      - text: 'True'
        why: GAT uses masked attention; $e_{ij}$ is computed only for the nodes $j$ in the neighbourhood $\mathcal N(i)$ of $i$, its first-order neighbours and itself [^1].
      - text: 'False'
        correct: true
    explanation: |
      Letting every node attend to every other node would throw away the graph structure, so GAT
      computes $e_{ij}$ only for $j \in \mathcal N(i)$, the first-order neighbours of $i$ including $i$,
      and the softmax normalises over that neighbourhood only [^1]. This keeps the cost of one head
      that maps $F$ input to $F'$ output features at $O(|V|FF' + |E|F')$, linear in the number of
      edges [^1]. With $K$ heads the outputs are
      concatenated, e.g. $8 \times 8 = 64$ features per node in the first layer of the Cora model,
      while a multi-head output layer averages them instead [^1].
    references:
      - title: Veličković et al. (2018), Graph Attention Networks
        url: https://arxiv.org/abs/1710.10903
        locator: Sec. 2.1 Graph Attentional Layer (Eqs. 1–6); Sec. 2.2 Comparisons to Related Work; Sec. 3.3 Experimental Setup
    source:
      id: original
      ref: gnn-026
    status: reviewed
    reviewed_by: claude
  - id: gnn-027
    type: short_answer
    difficulty: medium
    tags:
      - pyg
      - edge-index
      - code-reading
    question: |
      What is the **second** number printed?

      ```python
      import torch
      from torch_geometric.data import Data

      edge_index = torch.tensor([[0, 1, 1, 2, 2, 3],
                                 [1, 0, 2, 1, 3, 2]])
      x = torch.randn(4, 8)
      data = Data(x=x, edge_index=edge_index)
      print(data.num_nodes, data.num_edges)
      ```
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: '`4 6`: each of the 3 undirected edges is stored in both directions'
    explanation: |
      PyG stores connectivity in COO format: `edge_index` has shape `[2, num_edges]`, with source
      nodes in row 0 and target nodes in row 1 [^1]. An undirected graph needs both directions of every
      edge, so the path $0 - 1 - 2 - 3$ with 3 undirected edges takes 6 columns, and `num_edges` counts
      columns [^1]: the script prints `4 6`. `num_nodes` comes from the 4 rows of `x`, and
      `data.is_undirected()` would return `True`.
    references:
      - title: 'PyTorch Geometric documentation: Introduction by Example'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/get_started/introduction.html
        locator: Data Handling of Graphs
    source:
      id: original
      ref: gnn-027
    status: reviewed
    reviewed_by: claude
  - id: gnn-028
    type: short_answer
    difficulty: medium
    tags:
      - pyg
      - edge-index
      - message-passing
      - directed-graph
    question: |
      A directed graph with 5 nodes is stored in PyTorch Geometric as

      ```python
      edge_index = torch.tensor([[0, 0, 1, 3, 2],
                                 [1, 2, 2, 2, 4]])
      ```

      A `MessagePassing` layer with the default `flow="source_to_target"` and `aggr="add"` runs on this
      graph without adding self-loops. How many messages does node 2 aggregate?
    answer:
      numeric: 3
      tolerance: 0
      hint: a whole number
      model: 'the columns with target 2: $0 \to 2$, $1 \to 2$ and $3 \to 2$'
    explanation: |
      Each column of `edge_index` is one edge, with its source in row 0 and its target in row 1 [^1].
      With `flow="source_to_target"`, a message is built for node $i$ along every edge $(j, i)$, so
      node 2 receives one message per column whose second entry is 2 [^2]: from nodes 0, 1 and 3. The
      edge $2 \to 4$ carries a message from node 2 to node 4, not to node 2. Node 2 therefore
      aggregates 3 messages (its in-degree), nodes 1 and 4 one each, and nodes 0 and 3 none.
    references:
      - title: 'PyTorch Geometric documentation: Introduction by Example'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/get_started/introduction.html
        locator: Data Handling of Graphs
      - title: 'PyTorch Geometric documentation: Creating Message Passing Networks'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/tutorial/create_gnn.html
        locator: The MessagePassing Base Class (flow)
    source:
      id: original
      ref: gnn-028
    status: reviewed
    reviewed_by: claude
  - id: gnn-029
    type: short_answer
    difficulty: easy
    tags:
      - pyg
      - readout
      - pooling
      - code-reading
    question: |
      Five nodes of a mini-batch of two graphs have one feature each. What is the **second** value
      printed?

      ```python
      import torch
      from torch_geometric.nn import global_mean_pool

      x = torch.tensor([[1.0], [2.0], [3.0], [4.0], [10.0]])
      batch = torch.tensor([0, 0, 0, 1, 1])
      print(global_mean_pool(x, batch))
      ```
    answer:
      numeric: 7
      tolerance: 0
      hint: a number
      model: graph 1 holds the nodes with features 4 and 10, so its mean is $(4 + 10)/2 = 7$
    explanation: |
      The `batch` vector assigns every node to its graph in the mini-batch [^1], and
      `global_mean_pool` averages the node features of each graph separately [^2]: graph 0 has the
      features $1, 2, 3$ (mean 2) and graph 1 has $4, 10$ (mean 7), so the output is the $2 \times 1$
      tensor `[[2.], [7.]]`. The mean of all five nodes, 4.0, would mix the two graphs. A mean
      readout does not depend on the node order and works for any graph size, so it turns node
      embeddings into one embedding per graph for graph classification.
    references:
      - title: 'PyTorch Geometric documentation: Introduction by Example'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/get_started/introduction.html
        locator: Mini-batches
      - title: 'PyTorch Geometric documentation: global_mean_pool'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/generated/torch_geometric.nn.pool.global_mean_pool.html
        locator: Formula and parameters (x, batch)
    source:
      id: original
      ref: gnn-029
    status: reviewed
    reviewed_by: claude
  - id: gnn-030
    type: single
    difficulty: medium
    tags:
      - pyg
      - mini-batching
    question: How does PyTorch Geometric put several graphs of different sizes into one mini-batch?
    options:
      - text: As one big graph with a block-diagonal adjacency matrix and a `batch` vector
        correct: true
      - text: By padding every graph with dummy nodes up to the size of the largest graph
        why: No padding is needed; the graphs become disconnected parts of one big graph, so no messages flow between them [^1].
      - text: By resampling the graphs so that each one has the same number of nodes
        why: Every graph keeps all of its own nodes and edges; the graphs are only placed side by side in one big graph [^1].
      - text: By stacking the dense adjacency matrices into one tensor of shape $(B, n, n)$
        why: That needs the same $n$ for all graphs (or padding); PyG concatenates along the node dimension and keeps a sparse `edge_index` [^1].
    explanation: |
      PyG builds a mini-batch as a single graph whose adjacency matrix is block-diagonal, one block per
      graph, with node features and targets concatenated along the node dimension [^1]. Because there
      are no edges between the blocks, message passing on the big graph is the same as on each graph
      separately, and no padding is needed. The extra `batch` vector maps each node to its graph, so a
      readout such as a per-graph mean returns one vector per graph [^1].
    references:
      - title: 'PyTorch Geometric documentation: Introduction by Example'
        url: https://pytorch-geometric.readthedocs.io/en/2.8.1/get_started/introduction.html
        locator: Mini-batches
    source:
      id: original
      ref: gnn-030
    status: reviewed
    reviewed_by: claude
  - id: gnn-031
    type: true_false
    difficulty: easy
    tags:
      - gcn
      - complexity
      - sparse-matrix
    shuffle: false
    question: |
      True or false: with the adjacency matrix stored as a sparse matrix, the cost of one GCN layer
      $\hat A X W$ on a graph with $N$ nodes and $|E|$ edges, where
      $\hat A = \tilde D^{-1/2}\tilde A\tilde D^{-1/2}$, $\tilde A = A + I$ and $\tilde D$ is the
      degree matrix of $\tilde A$, grows linearly with $|E|$ (for fixed feature sizes), not with $N^2$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The product $\hat A (XW)$ touches only the non-zero entries of $\hat A$, one per edge direction plus one per self-loop; the dense $N \times N$ matrix is never formed [^1].
    explanation: |
      Kipf and Welling compute $\tilde A X$ as a sparse–dense matrix product, so filtering a
      $C$-channel signal into $F$ feature maps costs $O(|E|FC)$, and full-batch training needs
      $O(|E|)$ memory for the graph [^1]. Most real graphs are sparse, with a number of edges roughly
      linear in the number of nodes [^2], so this is far cheaper than a dense $N \times N$
      multiplication. A GAT head has the same order of cost, $O(|V|FF' + |E|F')$ with $|V| = N$ [^3].
    references:
      - title: Kipf & Welling (2017), Semi-Supervised Classification with Graph Convolutional Networks
        url: https://arxiv.org/abs/1609.02907
        locator: Sec. 2.2 Layer-Wise Linear Model (after Eq. 8); Sec. 3.1 Example
      - title: Daigavane, Ravindran & Aggarwal (2021), Understanding Convolutions on Graphs, Distill
        url: https://distill.pub/2021/understanding-gnns/
        locator: The Challenges of Computation on Graphs (Scalability)
      - title: Veličković et al. (2018), Graph Attention Networks
        url: https://arxiv.org/abs/1710.10903
        locator: Sec. 2.2 Comparisons to Related Work
    source:
      id: original
      ref: gnn-031
    status: reviewed
    reviewed_by: claude
