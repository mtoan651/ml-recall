    difficulty: medium
    shuffle: false
    question: A network has 3 input features, one hidden layer of four neurons and a single output node, and every node uses a linear (identity) activation. Can this model learn nonlinear relationships?
    options:
      - text: Yes
      - text: No
        correct: true
    explanation: |
      With the identity activation, each hidden neuron outputs just a weighted sum of the inputs
      plus a bias, and the output node takes a weighted sum of those values plus another bias.
      That is a linear calculation applied to the results of linear calculations, which is still
      linear [^1]. Written out, $\mathbf{o} = (\mathbf{x}W^{(1)} + \mathbf{b}^{(1)})W^{(2)} + \mathbf{b}^{(2)} = \mathbf{x}W + \mathbf{b}$,
      so the hidden layer can be folded away into one linear layer [^2]. The extra layer adds
      parameters (21 here instead of 4) but no new kinds of functions [^1]. To learn nonlinear
      relationships, a nonlinear activation such as ReLU has to follow each hidden affine step [^2].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/neural-networks/nodes-hidden-layers#exercise_2
        locator: "Neural networks: Nodes and hidden layers, 'Exercise 2'"
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear, Eq. (5.1.2)
        quote: An affine function of an affine function is itself an affine function.
