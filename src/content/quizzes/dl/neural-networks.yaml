    question: |
      A dense MLP has layer widths 4–8–8–3 (input, two hidden layers, output), with a bias for every
      unit. Counting learned layers only, its depth is $K =$ {{1}}, and it has {{2}} trainable
      parameters.
    answer:
      blanks:
        - numeric: 3
          tolerance: 0
          hint: an integer
        - numeric: 139
          tolerance: 0
          hint: an integer
      model: $K = 3$ weight layers; $(4 \cdot 8 + 8) + (8 \cdot 8 + 8) + (8 \cdot 3 + 3) = 40 + 72 + 27 = 139$.
    explanation: |
      Depth counts the learned transformations — the hidden layers and the output layer — but not
      the input, which only supplies features; 4–8–8–3 therefore has $K = 3$ [^1]. A dense layer
      mapping $d$ inputs to $h$ units holds a $d \times h$ weight matrix plus one bias per unit,
      so the totals are $40$, $72$ and $27$, i.e. $139$ parameters [^2]. Architecture fixes these
      counts; training only sets the values.
