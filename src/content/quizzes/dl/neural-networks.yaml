  - id: neural-networks-077
    type: single
    difficulty: medium
    tags:
      - relu-network
      - convexity
    question: |
      A ReLU network with $l \ge 2$ layers maps a scalar input $x$ to a scalar output. Viewed as a
      function of $x$, what can be said about its shape in general?
    options:
      - text: Depending on the weights it can be convex, concave or neither
        correct: true
      - text: It is always convex, because ReLU is a convex function
        why: A negative output weight turns a convex ReLU term into a concave one, and mixing signs gives shapes that are neither [^1].
      - text: It is always convex for $l = 2$ and can be non-convex only for $l \ge 3$
        why: Already with two layers, $-\mathrm{ReLU}(x)$ is concave and $\mathrm{ReLU}(x) - \mathrm{ReLU}(x - 1)$ is neither convex nor concave.
      - text: It is always concave, because the hidden units saturate
        why: ReLU does not saturate for positive inputs, and $\mathrm{ReLU}(x)$ itself is a convex network output.
    explanation: |
      A two-layer network is a weighted sum $\sum_j w_j\,\mathrm{ReLU}(a_j x + c_j) + b$ [^1]. Each
      term is convex when $w_j > 0$ and concave when $w_j < 0$, so with mixed signs the sum can be
      neither: $\mathrm{ReLU}(x) - \mathrm{ReLU}(x - 1)$ is flat, then rises, then is flat again.
      Deeper networks inherit this, so convexity in the input is not guaranteed for any $l \ge 2$ [^2].
      Networks that must be convex in their input restrict the weights instead, as input-convex
      neural networks do with non-negative hidden-to-hidden weights [^3].
    references:
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
      - source: mit-ocw-67960
        locator: Homework 1, Approximation, Problem 3
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
      - title: Amos, Xu & Kolter (2017), Input Convex Neural Networks, arXiv:1609.07152
        locator: Sec. 3 Convex neural network architectures, Proposition 1
        url: https://arxiv.org/abs/1609.07152
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q3
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-078
    type: single
    difficulty: easy
    tags:
      - relu-network
      - piecewise-linear
      - continuity
    question: |
      As a function of a scalar input, what kind of function does a ReLU network of any depth and
      width always compute?
    options:
      - text: A continuous, piecewise linear function
        correct: true
      - text: A piecewise linear function that may jump where a unit switches on
        why: ReLU is continuous, and sums and compositions of continuous functions are continuous, so the output has no jumps [^1].
      - text: A polynomial whose degree grows with the depth
        why: Each layer is affine and ReLU is linear on each side of zero, so $x$ is never multiplied by itself.
      - text: A linear function, because every layer is affine
        why: The ReLU between the affine maps is nonlinear and creates kinks where a unit's input crosses zero [^1].
    explanation: |
      ReLU is continuous and linear on each side of zero [^1]. Affine maps, sums and compositions of
      continuous piecewise linear functions are again continuous and piecewise linear, so the output
      has zero discontinuities but can have kinks, the points where some unit's pre-activation crosses
      zero [^2]. The kinks are why the network is not differentiable everywhere, while its value never
      jumps.
    references:
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
      - source: mit-ocw-67960
        locator: Homework 1, Approximation, Problem 4(a)–(b)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q4a
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-079
    type: single
    difficulty: hard
    tags:
      - relu-network
      - depth
      - linear-regions
      - expressivity
    question: |
      Keep the width $k$ of a scalar-input ReLU network fixed and add layers. How can the largest
      possible number of non-differentiable points (kinks) of the output grow with the number of
      layers $l$?
    options:
      - text: Exponentially in $l$
        correct: true
      - text: Linearly in $l$, adding at most $k$ kinks per layer
        why: A new layer acts on the previous layer's output, so it can split every existing linear piece again rather than add a fixed number of kinks [^1].
      - text: Polynomially in $l$, like $l^k$
        why: Composition can double the number of pieces per layer, which beats any polynomial in $l$ [^2].
      - text: It stays at most $k$, whatever the depth
        why: That bound holds for a single hidden layer, where each unit contributes one kink; deeper layers fold the input repeatedly [^1].
    explanation: |
      Kinks separate linear regions, and each unit of a new layer is a threshold on the previous layer's
      output, so it can cut every existing region in two [^1]. A width-2 layer can compute the tent map
      $g(x) = 2\,\mathrm{ReLU}(x) - 4\,\mathrm{ReLU}(x - \tfrac12)$ on $[0, 1]$, and composing it $l$ times
      gives a sawtooth with $2^l$ linear pieces [^2]. A one-hidden-layer network needs about $2^l$ units
      for the same function, so deeper networks can be exponentially more efficient for some functions,
      even though a wide shallow network is already a universal approximator [^1].
    references:
      - source: mit-ocw-67960
        locator: Homework 1, Approximation, Problem 4(c) iii–iv
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
      - title: Telgarsky (2016), Benefits of depth in neural networks, arXiv:1602.04485
        locator: Sec. 1.1 Main result; Sec. 3 Benefits of depth (triangle-wave construction)
        url: https://arxiv.org/abs/1602.04485
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q4c
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-080
    type: multiple
    difficulty: hard
    tags:
      - relu-network
      - bias
      - convexity
    question: |
      A two-layer ReLU network of width 2 has no biases: $f(x) = W_2\,\mathrm{ReLU}(W_1 x)$ with
      $W_1 \in \mathbb{R}^{2 \times 1}$, $W_2 \in \mathbb{R}^{1 \times 2}$ and scalar $x$. Which shapes
      can $f$ take on $[-5, 5]$ for a suitable choice of weights? Select all that apply.
    options:
      - text: A linear function, such as $f(x) = x$
        correct: true
      - text: A convex function that is not linear, such as $f(x) = \lvert x \rvert$
        correct: true
      - text: A function with two non-differentiable points
        why: Without biases every unit $\mathrm{ReLU}(w x)$ has its kink at $x = 0$, so $f$ has at most one kink.
      - text: A function that is neither convex nor concave
        why: $f$ is made of two linear pieces that meet at $x = 0$; it is convex if the right slope is at least the left slope and concave otherwise.
    explanation: |
      $\mathrm{ReLU}(wx)$ equals $w\,\mathrm{ReLU}(x)$ for $w > 0$ and $\lvert w \rvert\,\mathrm{ReLU}(-x)$
      for $w < 0$, so $f(x) = a\,\mathrm{ReLU}(x) + b\,\mathrm{ReLU}(-x)$ for some $a, b$ [^1]. With
      $W_1 = (1, -1)^\top$, $W_2 = (1, -1)$ this is $x$, and with $W_2 = (1, 1)$ it is $\lvert x \rvert$.
      Every such $f$ has slope $a$ for $x > 0$ and $-b$ for $x < 0$, with one possible kink at 0, so it is
      always convex or concave. Biases are what let the kinks move away from the origin [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 1, Approximation, Problem 5
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q5
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-081
    type: single
    difficulty: medium
    tags:
      - relu-network
      - boolean-functions
      - functional-completeness
    question: |
      For Boolean inputs $x_1, x_2 \in \{0, 1\}$, which logic gate does the ReLU unit
      $f(x_1, x_2) = 1 - \mathrm{ReLU}(x_1 + x_2 - 1)$ compute?
    options:
      - text: NAND
        correct: true
      - text: AND
        why: AND is $\mathrm{ReLU}(x_1 + x_2 - 1)$ itself, which is 1 only for $(1, 1)$; here that case gives 0.
      - text: OR
        why: OR is 0 for $(0, 0)$, but $f(0, 0) = 1 - \mathrm{ReLU}(-1) = 1$.
      - text: XOR
        why: XOR is 0 for $(0, 0)$, but $f(0, 0) = 1$.
    explanation: |
      $\mathrm{ReLU}(x_1 + x_2 - 1)$ is 1 for $(1, 1)$ and 0 for the other three inputs, so
      $f = 1 - \mathrm{ReLU}(\cdot)$ is 0 only for $(1, 1)$: the NAND gate [^1]. NAND is functionally
      complete, so every Boolean function can be built by wiring NAND gates together [^2]. Stacking
      such ReLU units therefore lets a deep enough ReLU network represent any Boolean function.
    references:
      - source: mit-ocw-67960
        locator: Homework 1, Problem 7(c) (NAND gate and functional completeness)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
      - title: 'Wikipedia: Functional completeness'
        locator: Minimal functionally complete operator sets
        url: https://en.wikipedia.org/wiki/Functional_completeness
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q7c
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-082
    type: single
    difficulty: hard
    tags:
      - backpropagation
      - weight-sharing
      - matrix-calculus
    question: |
      A weight matrix $W \in \mathbb{R}^{d \times d}$ is used twice:
      $$y = Wx,\quad u = \mathrm{ReLU}(y),\quad v = u + Wu,\quad L = \tfrac12 \lVert v \rVert_2^2.$$
      With $\Theta$ the elementwise step function ($\Theta(y_k) = 1$ if $y_k \ge 0$, else 0), which
      expression is $\partial L / \partial W$?
    options:
      - text: $v u^\top + \mathrm{diag}(\Theta(y))\,(I + W^\top)\,v\,x^\top$
        correct: true
      - text: $\mathrm{diag}(\Theta(y))\,(I + W^\top)\,v\,x^\top$
        why: This keeps only the path through $y = Wx$ and misses the direct use of $W$ in $v = u + Wu$, which contributes $v u^\top$.
      - text: $v u^\top + \mathrm{diag}(\Theta(y))\,(I + W)\,v\,x^\top$
        why: Backpropagating through $u \mapsto Wu$ multiplies the upstream gradient by $W^\top$, not $W$ [^1].
      - text: $v u^\top + (I + W^\top)\,v\,x^\top$
        why: This drops the ReLU's local derivative; units with $y_k < 0$ pass no gradient back to $W$.
      - text: $v u^\top + (I + W^\top)\,\mathrm{diag}(\Theta(y))\,v\,x^\top$
        why: The ReLU's derivative must act on $\partial L / \partial u = (I + W^\top)v$, i.e. after the multiplication by $I + W^\top$; the two matrices do not commute.
    explanation: |
      When a parameter is used in several places, the chain rule adds the gradients of all paths [^1].
      Holding $u$ fixed, $v = u + Wu$ gives $\partial L / \partial W = v u^\top$. Through the other path,
      $\partial L / \partial u = (I + W^\top) v$, the ReLU multiplies it by $\Theta(y)$ elementwise, and
      $y = Wx$ turns the result into an outer product with $x$, giving
      $\mathrm{diag}(\Theta(y))(I + W^\top) v\, x^\top$ [^2]. A finite-difference check on random
      $3 \times 3$ matrices matches the sum of both terms to about $10^{-8}$.
    references:
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
      - source: mit-ocw-67960
        locator: Homework 1, Backpropagation, Problem 8(b)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw1#q8b
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-083
    type: short_answer
    difficulty: hard
    tags:
      - relu-network
      - linear-regions
      - hyperplane-arrangement
    question: |
      A network with 2-dimensional inputs has one hidden layer of $N = 4$ ReLU units,
      $F(v) = \sum_{j=1}^{4} c_j\,\mathrm{ReLU}(w_j^\top v + b_j)$. Each unit switches on or off along the
      line $w_j^\top v + b_j = 0$, and the four lines are in general position. At most how many flat
      (linear) pieces can the graph of $F$ have?
    answer:
      numeric: 11
      tolerance: 0
      hint: a whole number
      model: $\binom40 + \binom41 + \binom42 = 1 + 4 + 6 = 11$
    explanation: |
      Inside each region cut out by the four lines every unit is either on or off, so $F$ is linear
      there [^1]. $N$ lines in general position split the plane into $1 + N + \binom{N}{2}$ regions, here
      $1 + 4 + 6 = 11$ [^2]; a grid check over random lines finds the same 11 on/off patterns. In $m$
      input dimensions the count is $\sum_{i=0}^{m}\binom{N}{i}$, which grows only polynomially with
      width, while depth can multiply the number of pieces [^3].
    references:
      - source: mit-ocw-18065
        locator: Problems for Lecture 26 (textbook Section VII.1), Problem 7
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
      - title: 'Wikipedia: Arrangement of lines'
        locator: Complexity of arrangements
        url: https://en.wikipedia.org/wiki/Arrangement_of_lines
      - title: Montúfar et al. (2014), On the Number of Linear Regions of Deep Neural Networks, arXiv:1402.1869
        locator: Abstract
        url: https://arxiv.org/abs/1402.1869
    source:
