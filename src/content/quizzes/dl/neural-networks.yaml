  - id: neural-networks-060
    type: single
    difficulty: hard
    tags:
      - initialization
      - zero-init
      - symmetry
      - tanh
    question: |
      A regression MLP $\hat y = \mathbf{w}_2^\top \tanh(W_1\mathbf{x} + \mathbf{b}_1) + b_2$ is initialized
      with **all** weights and biases equal to 0 and trained with gradient descent on MSE. What happens?
    options:
      - text: Training works normally, because the output bias gets a gradient and breaks the symmetry
        why: The output bias does change, but it only shifts the prediction; the hidden weights and biases still receive exactly zero gradient.
      - text: Only the output bias $b_2$ ever changes, so the network can only learn a constant
        correct: true
      - text: The hidden units learn identical but nonzero weights, so the network behaves like one hidden unit
        why: That happens with a constant nonzero initialization; with zeros and $\tanh(0) = 0$, the gradients of $W_1$ and $\mathbf{w}_2$ are exactly zero at every step.
      - text: The loss becomes NaN after the first step because of a division by zero
        why: Nothing is divided by the weights; the gradients are simply zero, not undefined.
    explanation: |
      With zero weights every hidden activation is $\tanh(0) = 0$. The gradient of $\mathbf{w}_2$ is
      $\delta\,\mathbf{h} = \mathbf{0}$, and the gradient reaching the hidden layer is
      $\mathbf{w}_2\delta = \mathbf{0}$, so $W_1$ and $\mathbf{b}_1$ never move either; only $b_2$ gets
      the gradient $\delta$ and converges to the mean target. Initialization must break the symmetry
      between hidden units, which is why weights are drawn at random [^1][^2].
    references:
      - source: d2l
        locator: Sec. 5.4.1.3 Breaking the Symmetry
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#breaking-the-symmetry
      - source: d2l
        locator: Sec. 5.3 Forward Propagation, Backward Propagation, and Computational Graphs (5.3.3 Backpropagation)
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
    source:
      id: ds-interviews
      ref: theory.md#q91
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#neural-networks
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-061
    type: short_answer
    difficulty: medium
    tags:
      - perceptron
      - learning-rule
    question: |
      Run the perceptron algorithm (step size 1, initial weights $\mathbf{w} = (0, 0, 0)$) on the
      augmented points $(1, x_1, x_2)$, cycling through them in this order: negative $(-1, 0)$,
      negative $(2, -2)$, positive $(1, 0)$. A point counts as misclassified when
      $y\,(\mathbf{w} \cdot \mathbf{x}) \le 0$, and then $\mathbf{w} \leftarrow \mathbf{w} +
      y\,\mathbf{x}$. How many updates happen before a full pass makes no mistake?
    answer:
      numeric: 4
      tolerance: 0
      hint: a whole number
      model: $(0,0,0) \to (-1,1,0) \to (-2,-1,2) \to (-1,0,2)$ in pass 1, then $(0,1,2)$ at the positive point in pass 2; pass 3 is clean.
    explanation: |
      Pass 1 updates on all three points (the first because $\mathbf{w} \cdot \mathbf{x} = 0$) [^1].
      In pass 2 the two negatives are now correct, but the positive $(1, 1, 0)$ scores $-1$ and
      triggers a fourth update to $\mathbf{w} = (0, 1, 2)$, i.e. the boundary $x_1 + 2x_2 = 0$, which
      separates all three points [^2].
    references:
      - title: 'Wikipedia: Perceptron'
        url: https://en.wikipedia.org/wiki/Perceptron#Steps
        locator: Learning algorithm, Steps
      - source: mit-ocw-6034-s05
        locator: Quiz 2 (Spring 2005) solutions, Problem 3 Perceptron, part 1
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    source:
      id: mit-ocw-6034-s05
      ref: q2_soln#q3.1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-062
    type: short_answer
    difficulty: medium
    tags:
      - sigmoid
      - gradient-descent
      - backpropagation
    question: |
      A single sigmoid unit computes $y = s(z)$ with $z = -w_0 + w_1 x_1 + w_2 x_2$ (a constant input
      $-1$ on $w_0$), current weights $w_0 = 0$, $w_1 = 1$, $w_2 = 1$. For the input
      $\mathbf{x} = (2, -2)$ with target $y^* = 0$ and error $E = \frac{1}{2}(y - y^*)^2$, what is the
      gradient-descent change $\Delta w_2$ with step size $\eta = 1$?
    answer:
      numeric: 0.25
      tolerance: 0.001
      hint: a decimal, e.g. 0.5
      model: $z = 0$, $y = 0.5$; $\Delta w_2 = -\eta (y - y^*)\,y(1-y)\,x_2 = -(0.5)(0.25)(-2) = 0.25$
    explanation: |
      By the chain rule $\partial E/\partial w_2 = (y - y^*)\,s'(z)\,x_2$ with $s'(z) = y(1 - y)$
      [^1][^2]. Here $z = 2 - 2 = 0$, so $y = 0.5$ and $s'(z) = 0.25$, and $\Delta w_2 = -0.5 \cdot 0.25
      \cdot (-2) = 0.25$: the weight on $x_2$ grows, which lowers $z$ for this input because
      $x_2 < 0$, pushing $y$ toward the target 0.
    references:
      - title: 'Wikipedia: Logistic function'
        url: https://en.wikipedia.org/wiki/Logistic_function#Derivative
        locator: Derivative
      - source: mit-ocw-6034-s05
        locator: Quiz 2 (Spring 2005) solutions, Problem 4 Neural Net, part 2
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    source:
      id: mit-ocw-6034-s05
      ref: q2_soln#q4.2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-063
    type: short_answer
    difficulty: hard
    tags:
      - perceptron
      - dual-form
      - learning-rule
    question: |
      A perceptron (step size 1, zero initial weights, inputs augmented as $(1, x_1, x_2, x_3)$) is run
      until it separates this data. The last column says how many times each point was misclassified
      (and so used in an update):

      | $x_1$ | $x_2$ | $x_3$ | $y$ | mistakes |
      |---|---|---|---|---|
      | 2 | 3 | 1 | +1 | 12 |
      | 2 | 4 | 0 | +1 | 0 |
      | 3 | 1 | 1 | −1 | 3 |
      | 1 | 1 | 0 | −1 | 6 |
      | 1 | 2 | 1 | −1 | 11 |

      What is the final weight on $x_2$?
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: $\mathbf{w} = 12(1,2,3,1) - 3(1,3,1,1) - 6(1,1,1,0) - 11(1,1,2,1) = (-8, -2, 5, -2)$
    explanation: |
      Each update adds $y_i \mathbf{x}_i$, so the final weights are $\mathbf{w} = \sum_i m_i y_i
      \mathbf{x}_i$, where $m_i$ counts the mistakes on point $i$; this is the dual view of the
      perceptron [^1][^2]. The $x_2$ component is $12 \cdot 3 - 3 \cdot 1 - 6 \cdot 1 - 11 \cdot 2 =
      5$, and the separator is $-8 - 2x_1 + 5x_2 - 2x_3 = 0$.
    references:
      - title: 'Wikipedia: Kernel perceptron'
        url: https://en.wikipedia.org/wiki/Kernel_perceptron#Algorithm
        locator: Algorithm (dual form, mistake counts)
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 6 Perceptron
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q6-perceptron
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-064
    type: single
    difficulty: medium
    tags:
      - backpropagation
      - output-layer
      - regression
    question: |
      A network trained by backpropagation on squared error $E = \frac{1}{2}(y - y^*)^2$ has sigmoid
      hidden units. You change only the output unit from a sigmoid to a linear unit, $y = \sum_i w_i
      x_i$, to do regression. How does the output unit's error term $\delta$ change?
    options:
      - text: Every $\delta$ in the network loses its $o(1 - o)$ factor
        why: Only the output unit changed; the hidden units are still sigmoids and keep their derivative.
      - text: It becomes $y(1 - y)$, independent of the target
        why: The error term must depend on how far the output is from the target.
      - text: It stays $y(1 - y)(y - y^*)$, because the hidden units are still sigmoids
        why: The factor $y(1 - y)$ is the derivative of the output sigmoid, which has been removed.
      - text: It becomes $y - y^*$; the factor $y(1 - y)$ disappears
        correct: true
    explanation: |
      The output $\delta$ is $\partial E/\partial z = (\partial E/\partial y)(\partial y/\partial z)$
      [^1][^2]. For a sigmoid, $\partial y/\partial z = y(1 - y)$; for a linear unit it is 1, so
      $\delta = y - y^*$. All hidden-layer formulas stay the same, since they only receive this
      $\delta$ through the weights.
    references:
      - title: 'Wikipedia: Backpropagation'
        url: https://en.wikipedia.org/wiki/Backpropagation#Derivation
        locator: Derivation
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 5 Backprop
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q5-backprop
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-065
    type: single
    difficulty: medium
    tags:
      - weight-decay
      - regularization
      - gradient-descent
    question: |
      A single sigmoid unit $y = s(\mathbf{w} \cdot \mathbf{x})$ is trained on
      $E(\mathbf{w}) = \frac{1}{2}\sum_i (y_i - y_i^*)^2 + \frac{\beta}{2}\sum_j w_j^2$. What is the
      stochastic gradient-descent update for $w_j$ on one example $(\mathbf{x}, y^*)$ with step size
      $\eta$?
    options:
      - text: $w_j \leftarrow w_j - \eta\,[(y - y^*)\,x_j + \beta w_j]$
        why: This drops the sigmoid derivative $y(1 - y)$ from the chain rule.
      - text: $w_j \leftarrow w_j - \eta\,[(y - y^*)\,y(1 - y)\,x_j + \beta w_j]$
        correct: true
      - text: $w_j \leftarrow w_j - \eta\,[(y - y^*)\,y(1 - y)\,x_j - \beta w_j]$
        why: The penalty's gradient is $+\beta w_j$; subtracting it shrinks weights toward 0, the sign here would grow them.
      - text: $w_j \leftarrow (1 - \eta\beta)\,w_j$
        why: That is only the decay part; the error term still has to be followed.
    explanation: |
      The gradient of the squared error is $(y - y^*)\,y(1 - y)\,x_j$ and the gradient of
      $\frac{\beta}{2}w_j^2$ is $\beta w_j$, so each step also shrinks every weight by $\eta\beta w_j$:
      weight decay [^1][^2]. Small weights keep the sigmoid out of saturation and limit overfitting;
      $\beta$ is chosen by cross-validation.
    references:
      - source: d2l
        locator: Sec. 3.7 Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 5 Machine Learning (sigmoid unit with weight penalty)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q5-weight-decay
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-066
    type: multiple
    difficulty: medium
    tags:
      - perceptron
      - linear-separability
      - boolean-functions
    question: |
      A single threshold perceptron outputs 1 when $\sum_i w_i x_i - w_T > 0$ and 0 otherwise. Which
      of these functions can it compute, for suitable weights? Select all that apply.
    options:
      - text: $A < B$ for real-valued inputs $A, B$
        correct: true
      - text: $A \oplus B$ (exclusive or) for Boolean inputs
        why: XOR is not linearly separable; no line puts (0,1) and (1,0) on one side and (0,0) and (1,1) on the other.
      - text: $|A - B| < E$ for real-valued inputs $A, B, E$
        why: The true region is the intersection of two half-spaces, $A - B < E$ and $B - A < E$, which a single linear threshold cannot carve out.
      - text: $A \rightarrow B$ (that is, $\neg A \lor B$) for Boolean inputs $A, B \in \{0, 1\}$
        correct: true
    explanation: |
      A perceptron can compute exactly the linearly separable functions [^1]. $A \rightarrow B$ works
      with $w_A = -1$, $w_B = 1$, $w_T = -0.5$ (only $A = 1, B = 0$ gives a sum $\le 0$), and
      $A < B$ with $w_A = -1$, $w_B = 1$, $w_T = 0$ [^2]. "Within $E$" needs two inequalities at once,
      and XOR is the classic non-separable case, so both need a hidden layer.
    references:
      - title: 'Wikipedia: Perceptron'
        url: https://en.wikipedia.org/wiki/Perceptron#Boolean_function
        locator: Power of representation, Boolean function
      - source: mit-ocw-6034
        locator: Quiz 3 (2009), Question 2 Part A, items 1–3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2009#q2a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-067
    type: short_answer
    difficulty: hard
    tags:
      - backpropagation
      - sigmoid
      - forward-pass
    question: |
      A small network of sigmoid units without thresholds: unit A has input X with weight
      $W_{XA} = 1$, unit B has input Y with weight $W_{YB} = -1$, and the output unit C has inputs A
      and B with weights $W_{AC} = 1$, $W_{BC} = 0$. For $X = 60$, $Y = 70$ and target $d = 1$, the
      output error term is $\delta_C = o_C(1 - o_C)(d - o_C)$ and the update is
      $\Delta W_{AC} = \delta_C\, o_A$ (learning rate 1). What is $\Delta W_{AC}$? Round to 3
      decimals.
    answer:
      numeric: 0.053
      tolerance: 0.001
      hint: a decimal, 3 decimal places
      model: $o_A = s(60) \approx 1$, $o_B = s(-70) \approx 0$, $z_C = 1$, $o_C = s(1) \approx 0.731$; $\delta_C = 0.731 \cdot 0.269 \cdot 0.269 \approx 0.053$; $\Delta W_{AC} \approx 0.053$
    explanation: |
      Forward pass: A and B are saturated at about 1 and 0, so $z_C = 1 \cdot 1 + 0 \cdot 0 = 1$ and
      $o_C = s(1) \approx 0.73$ [^1]. The output error term is $\delta_C \approx 0.73 \cdot 0.27 \cdot
      0.27 \approx 0.053$, and since $o_A \approx 1$ the weight $W_{AC}$ changes by about 0.053 [^2].
    references:
      - title: 'Wikipedia: Backpropagation'
        url: https://en.wikipedia.org/wiki/Backpropagation#Derivation
        locator: Derivation
      - source: mit-ocw-6034
        locator: Quiz 3 (2010), Problem 2 Neural Nets, Part A1–A2
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2010#q2a2-wac
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2010/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-068
    type: single
    difficulty: medium
    tags:
      - backpropagation
      - saturation
      - vanishing-gradient
    question: |
      In the network X → A → C (weights $W_{XA} = 1$, $W_{AC} = 1$, sigmoid units, no thresholds) with
      input $X = 60$ and a nonzero output error term $\delta_C \approx 0.053$, backpropagation gives
      $\Delta W_{XA} = \delta_A X$ with $\delta_A = o_A(1 - o_A)\,W_{AC}\,\delta_C$. Why is
      $\Delta W_{XA}$ practically zero?
    options:
      - text: Unit A is saturated, so $o_A(1 - o_A) \approx 10^{-26}$
        correct: true
      - text: The other hidden unit has weight $W_{BC} = 0$
        why: $W_{BC}$ only affects the path through B; A's error term depends on $W_{AC} = 1$.
      - text: The output error $d - o_C$ is zero
        why: The output is about 0.73 against a target of 1, so the error is about 0.27.
      - text: The large input $X = 60$ makes the update round off to zero
        why: $X$ multiplies the update, so a large $X$ would make it bigger; the tiny factor is the sigmoid derivative.
    explanation: |
      The sigmoid's slope $s'(z) = s(z)(1 - s(z))$ is at most 0.25 and vanishes for large $|z|$ [^1].
      With $z_A = 60$ it is about $e^{-60} \approx 10^{-26}$, so almost no error signal reaches
      $W_{XA}$, however large the output error is. This saturation is one cause of vanishing
      gradients and a reason to scale inputs and keep weights small [^2].
    references:
      - title: 'Wikipedia: Logistic function'
        url: https://en.wikipedia.org/wiki/Logistic_function#Derivative
        locator: Derivative
      - source: d2l
        locator: Sec. 5.4.1.1 Vanishing Gradients (sigmoid saturation)
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#vanishing-gradients
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2010#q2a2-wxa
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2010/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-069
    type: single
    difficulty: medium
    tags:
      - recurrent-networks
      - backpropagation
      - feedback
    question: |
      To give a network a sense of timing, you feed the output of one neuron back into the input of
      one of its ancestors. Why can't plain backpropagation, as derived for feedforward networks,
      train this network directly?
    options:
      - text: The loop doubles the number of weights, which makes backpropagation too slow
        why: One feedback connection adds one weight; cost is not the obstacle.
      - text: The loop makes the graph cyclic, so errors have no backward order
        correct: true
      - text: Sigmoid units cannot receive their own outputs as inputs
        why: Nothing in a sigmoid unit forbids that input; the problem is the cycle in the graph.
      - text: Recurrent networks have no differentiable error function
        why: Their error is just as differentiable; the gradient is obtained by unrolling the loop in time.
    explanation: |
      Backpropagation computes the error terms layer by layer from the output back to the inputs,
      which needs an acyclic computation graph [^1]. With a feedback loop, a unit's output depends on
      its own earlier output, so the network must first be unrolled over time steps; the resulting
      algorithm is backpropagation through time [^2].
    references:
      - title: 'Wikipedia: Recurrent neural network'
        url: https://en.wikipedia.org/wiki/Recurrent_neural_network#Training
        locator: Training (backpropagation through time)
      - source: d2l
        locator: Sec. 9.7 Backpropagation Through Time
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#backpropagation-through-time
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2009#q2c1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-070
    type: single
    difficulty: medium
    tags:
      - loss-functions
      - differentiability
      - cost-sensitive
    question: |
      A physician trains a single sigmoid unit and wants the error to be the total misclassification
      cost: $c_{01}$ for each false positive and $c_{10}$ for each false negative, computed after
      thresholding the output at 0.5. Why is this a poor training criterion for gradient descent?
    options:
      - text: It is always larger than the squared error, so training diverges
        why: The size of an error function does not make gradient descent diverge; its slope does the work.
      - text: It cannot give false positives and false negatives different weights
        why: It does weight them differently, by $c_{01}$ and $c_{10}$; the trouble is its shape, not its weighting.
      - text: It ignores the training labels
        why: It compares predictions with the labels to count the two kinds of mistakes.
      - text: It is piecewise constant, so its gradient is zero almost everywhere
        correct: true
    explanation: |
      Counting thresholded mistakes changes only when a point crosses the boundary, so small weight
      changes leave it unchanged and the gradient gives no direction [^1]. A cost-weighted squared
      error, $c_{10}\sum_{y=1}(g(\mathbf{x}) - y)^2 + c_{01}\sum_{y=0}(g(\mathbf{x}) - y)^2$, keeps
      the costs and is differentiable, so backpropagation can use it [^2].
    references:
      - source: d2l
        locator: Sec. 4.3.2 Accuracy (accuracy is not differentiable, so it is hard to optimize directly)
        url: https://d2l.ai/chapter_linear-classification/classification.html#accuracy
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 8 Neural networks, parts 1–4
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q8-nn-cost
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-071
    type: short_answer
    difficulty: easy
    tags:
      - linear-unit
      - parameter-count
      - keras
    question: |
      The Red Wine Quality table has 12 columns: 11 physicochemical measurements and the target
      `quality`. A linear model for it is `keras.Sequential([layers.Dense(units=1, input_shape=[11])])`.
      How many trainable parameters does the model have?
    answer:
      numeric: 12
      tolerance: 0
      hint: a whole number
      model: 11 weights (one per input) + 1 bias = 12
    explanation: |
      The input shape counts only the features, not the target, so the model takes 11 inputs [^1]. A
      linear unit computes a weighted sum of its inputs plus a bias, so it has one weight per input
      and one bias: $11 + 1 = 12$ [^2]. Before training the weights are random and the bias is 0; the
      network learns by finding better values for them [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 1 exercise, Questions 1–3 (input shape, linear model, weights)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/deep_learning_intro/ex1.py
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 1 A Single Neuron — tutorial, The Linear Unit; Multiple Inputs
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/tut1.ipynb
    source:
