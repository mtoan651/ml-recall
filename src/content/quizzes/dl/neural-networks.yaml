        why: The stack still has weights and biases.
    explanation: With identity activations, $\hat y = x(W^1 W^2) + (b^1 W^2 + b^2)$ — still one weight matrix and one bias [^1]. An affine function of an affine function is affine, so nonlinear activations are what add expressive power [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 23
      - source: d2l
        locator: Sec. 5.1 Multilayer Perceptrons
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        quote: An affine function of an affine function is itself an affine function.
    source:
      id: ncu-intro-dl
      ref: exercise-03/q09
    status: reviewed
    reviewed_by: owner
  - id: neural-networks-035
    type: single
    difficulty: medium
    tags:
      - binary-cross-entropy
      - ce6146
      - ce6146-ex03
      - sigmoid
    question: Which output activation and loss suit a single binary label?
    options:
      - text: Identity output with categorical cross-entropy
        why: The identity does not produce a probability.
      - text: Softmax output with mean squared error
        why: Softmax over a single output is always 1, and MSE is not the likelihood of a binary target.
      - text: ReLU output with binary cross-entropy
        why: A ReLU output is unbounded above, so it is not a probability.
      - text: Sigmoid output with binary cross-entropy
        correct: true
    explanation: The sigmoid turns the logit into $p \in (0, 1)$, and binary cross-entropy $-y \log p - (1 - y) \log(1 - p)$ is the negative log-likelihood of a Bernoulli target [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 52–53
