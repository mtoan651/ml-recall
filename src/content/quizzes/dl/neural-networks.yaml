  - id: neural-networks-013
    type: single
    question: |
      Evaluate both statements.

      **Statement 1.** RELUs are not monotonic, but sigmoids are monotonic.

      **Statement 2.** Neural networks trained with gradient descent with high probability converge to the global optimum.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: "**Statement 1** is false: ReLU, $\\max(0, x)$, is monotonic (non-decreasing), and so is the sigmoid. **Statement 2** is false: a neural network's loss is non-convex, so gradient descent usually ends in a local optimum or saddle region, with no guarantee of the global optimum. MMLU-Redux experts flagged the original answer key as wrong [^1]."
    references:
      - source: mmlu-redux
        locator: machine_learning row 0 — wrong_groundtruth
    source:
      id: mmlu-redux
      ref: machine_learning/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=0
    status: draft
  - id: neural-networks-014
    type: single
    difficulty: easy
    question: 'The numerical output of a sigmoid node in a neural network:'
    options:
      - text: Is unbounded, encompassing all real numbers.
      - text: Is unbounded, encompassing all integers.
      - text: Is bounded between 0 and 1.
        correct: true
      - text: Is bounded between -1 and 1.
    explanation: |
      The sigmoid $\sigma(x) = 1/(1+e^{-x})$ squashes any real input into the interval $(0, 1)$,
      which is why it is used for outputs that are read as probabilities [^1]. The range from $-1$
      to $1$ belongs to tanh, a different squashing function [^1]; neither of them is unbounded or
      integer-valued.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function and Sec. 5.1.2.3 Tanh Function
    source:
      id: mmlu-redux
      ref: machine_learning/19
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=19
    status: draft
  - id: neural-networks-015
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** The derivative of the sigmoid $\sigma(x)=(1+e^{-x})^{-1}$ with respect to $x$ is equal to $\text{Var}(B)$ where $B\sim \text{Bern}(\sigma(x))$ is a Bernoulli random variable.

      **Statement 2.** Setting the bias parameters in each layer of neural network to 0 changes the bias-variance trade-off such that the model's variance increases and the model's bias decreases
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      Statement 1: the sigmoid's derivative is $\sigma'(x) = \sigma(x)\,(1-\sigma(x))$ [^1], and a
      Bernoulli variable with success probability $p$ has variance $p(1-p)$ [^2]. With
      $p = \sigma(x)$ the two are identical, so the statement is true. Statement 2: forcing every bias
      to 0 removes parameters and shrinks the set of functions the network can represent. A more
      restricted model moves towards underfitting, i.e. higher bias and lower variance [^3][^4], the
      opposite of what the statement claims, so it is false.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function, Eq. (5.1.7)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#bernoulli
        locator: Sec. 22.8.1 Bernoulli
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-complexity
        locator: Sec. 3.6.1.1 Model Complexity
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#overfitting-and-bias-variance-tradeoff
        locator: 'Lesson: Neural Network Frameworks, Overfitting and Bias-Variance Tradeoff'
    source:
      id: mmlu-redux
      ref: machine_learning/46
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=46
    status: draft
  - id: neural-networks-016
    type: single
    difficulty: medium
    question: We are training fully connected network with two hidden layers to predict housing prices. Inputs are $100$-dimensional, and have several features such as the number of square feet, the median family income, etc. The first hidden layer has $1000$ activations. The second hidden layer has $10$ activations. The output is a scalar representing the house price. Assuming a vanilla network with affine transformations and with no batch normalization and no learnable parameters in the activation function, how many parameters does this network have?
    options:
      - text: '111021'
        correct: true
      - text: '110010'
      - text: '111110'
      - text: '110011'
    explanation: |
      A fully connected layer with $n_\text{in}$ inputs and $n_\text{out}$ outputs has an
      $n_\text{in} \times n_\text{out}$ weight matrix and $n_\text{out}$ biases [^1]. Adding up the
      three layers ($100 \to 1000 \to 10 \to 1$):

      $$\underbrace{100 \cdot 1000 + 1000}_{101{,}000} + \underbrace{1000 \cdot 10 + 10}_{10{,}010} + \underbrace{10 \cdot 1 + 1}_{11} = 111{,}021.$$

      The distractor 110,010 counts only the weights, and 110,011 adds just the output bias; every
      layer has its own bias vector [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear (weight and bias shapes)
    source:
      id: mmlu-redux
      ref: machine_learning/62
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=62
    status: draft
  - id: neural-networks-017
    type: single
    difficulty: hard
    shuffle: false
    question: Given a Neural Net with N input nodes, no hidden layers, one output node, with Entropy Loss and Sigmoid Activation Functions, which of the following algorithms (with the proper hyper-parameters and initialization) can be used to find the global optimum?
    options:
      - text: Stochastic Gradient Descent
      - text: Mini-Batch Gradient Descent
      - text: Batch Gradient Descent
      - text: All of the above
        correct: true
    explanation: |
      With no hidden layer, one sigmoid output and cross-entropy loss, this network is exactly
      logistic regression. The Hessian of its cross-entropy error is positive definite, so the error
      is convex in the weights with a single minimum [^1], and for a convex objective any local
      minimum is the global one [^2]. Gradient steps therefore reach the optimum whether each step uses
      one example, a minibatch or the full dataset, as long as the learning rate is chosen well
      (decayed for the stochastic versions) [^3]. One caveat: if the classes are perfectly linearly
      separable the weights grow without bound and no finite optimum exists unless you add
      regularization [^1].
    references:
      - title: Pattern Recognition and Machine Learning (Bishop, 2006)
        url: https://www.microsoft.com/en-us/research/uploads/prod/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 4.3.2 Logistic regression (p. 206) and Sec. 4.3.3 Iterative reweighted least squares, Eq. (4.97)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/convexity.html#local-minima-are-global-minima
        locator: Sec. 12.2.2.1 Local Minima Are Global Minima
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html#summary
        locator: Sec. 12.4.5 Summary (Stochastic Gradient Descent)
    source:
      id: mmlu-redux
      ref: machine_learning/66
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=66
    status: draft
  - id: neural-networks-018
    type: single
    difficulty: medium
    shuffle: false
    question: 'Neural networks:'
    options:
      - text: Optimize a convex objective function
      - text: Can only be trained with stochastic gradient descent
      - text: Can use a mix of different activation functions
        correct: true
      - text: None of the above
    explanation: |
      Nothing forces a single activation function on the whole network. A common design uses ReLU in
      the hidden layers and a sigmoid on the output unit to produce a probability [^1], and every
      LSTM cell combines sigmoid gates with a tanh input node [^2]. The other claims fail: deep
      learning objectives are generally nonconvex, with many local minima and saddle points [^3], and
      networks are trained with many optimizers besides plain SGD, Adam being a popular one [^4].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-gate-forget-gate-and-output-gate
        locator: Sec. 10.1.1.2 Input Gate, Forget Gate, and Output Gate
      - source: d2l
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#summary
        locator: Sec. 12.1.3 Summary (Optimization and Deep Learning)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html
        locator: Sec. 12.10 Adam
