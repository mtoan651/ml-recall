  - id: neural-networks-032
    type: short_answer
    difficulty: easy
    tags:
      - activation-functions
      - ce6146
      - ce6146-ex02
      - sigmoid
    question: Which activation function squashes any real input into $(0, 1)$, so its output can be read as the probability of the positive class in binary classification?
    answer:
      accept:
        - sigmoid
        - sigmoid function
        - logistic
        - logistic sigmoid
        - logistic function
      model: The (logistic) sigmoid $\sigma(z) = 1 / (1 + e^{-z})$.
    explanation: The sigmoid maps a real-valued logit into $(0, 1)$, which is interpreted as $P(y = 1 \mid x)$ for a Bernoulli output [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 65
