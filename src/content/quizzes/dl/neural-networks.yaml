  - id: neural-networks-074
    type: multiple
    difficulty: medium
    tags:
      - embeddings
      - categorical-features
      - recommender-systems
    question: |
      A music-streaming service trains a neural network on 500 million past streams to suggest songs.
      Each row has these variables:

      | Variable | Meaning | Unique values |
      |---|---|---|
      | `stream_id` | id of this streaming event (one per row) | 500 million |
      | `user_id` | id of the listener | 5 million |
      | `song_id` | id of the song | 10 million |
      | `artist_id` | id of the song's artist | 1 million |
      | `song_duration` | length of the song in seconds | 450 |

      Which variables should go into the network through an embedding layer? Select all that apply.
    options:
      - text: '`user_id`'
        correct: true
      - text: '`song_id`'
        correct: true
      - text: '`artist_id`'
        correct: true
      - text: '`stream_id`'
        why: It is unique to each row, essentially an index, so it carries nothing that could generalize to new streams [^1].
      - text: '`song_duration`'
        why: A duration is a (roughly) continuous quantity; it should be a numeric input after preprocessing, not a set of categories [^1].
    explanation: |
      Embedding layers suit sparse categorical variables with very many possible values, which would
      be hard to handle otherwise; `user_id`, `song_id` and `artist_id` are such variables [^1]. An
      embedding layer maps each id to a dense vector, learned with the rest of the model, that
      captures latent properties useful for the prediction [^2]. A category with few values, such as a 150-value country code or a two-valued flag,
      can simply be one-hot encoded or used as a binary input instead [^1].
    references:
      - source: kaggle-learn
        locator: Embeddings exercise 1, Part 1 When to use embeddings? (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/embeddings/ex1_embedding_layers.py
      - source: kaggle-learn
