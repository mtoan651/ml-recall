  - id: neural-networks-029
    type: single
    difficulty: easy
    tags:
      - backpropagation
      - ce6146
      - ce6146-ex02
    question: What does the backward pass of a neural network compute?
    options:
      - text: The gradients of the loss with respect to the weights, which the optimizer then uses to update them
        correct: true
      - text: The non-linearity of the network
        why: Non-linearity comes from the activation functions in the forward pass.
      - text: The normalized inputs
        why: Normalization is preprocessing.
      - text: The network's output
        why: The output is computed by the forward pass.
    explanation: The backward pass propagates derivatives from the loss to every parameter with the chain rule. Backpropagation computes gradients; the optimizer step that follows uses them to change the weights [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 51
