  - id: neural-networks-084
    type: multiple
    difficulty: medium
    tags:
      - piecewise-linear
      - relu-network
      - function-composition
    question: |
      $F_1$ and $F_2$ are continuous piecewise linear (CPL) functions. Which of these are always CPL as
      well? Select all that apply.
    options:
      - text: The maximum $\max(F_1, F_2)$
        correct: true
      - text: The sum $F_1 + F_2$
        correct: true
      - text: The composition $F_2(F_1(x))$, for one-variable $F_1$ and $F_2$
        correct: true
      - text: The product $F_1 F_2$
        why: $F_1(x) = F_2(x) = x$ are linear, but their product $x^2$ is curved, not piecewise linear.
      - text: The quotient $F_1 / F_2$ where $F_2 > 0$
        why: $1/x$ on $x > 0$ is a quotient of linear functions but is curved everywhere.
    explanation: |
      On every region where both functions are linear, their maximum, sum and composition are again
      linear, and only finitely many new breakpoints appear, so continuity and piecewise linearity are
      kept [^1]. These closure rules are why every ReLU network is CPL: each layer adds linear
      functions, takes $\max(0, \cdot)$ and composes with the next layer [^1][^2]. Products and quotients
      create curvature, which ReLU networks can only approximate with many pieces.
    references:
      - source: mit-ocw-18065
        locator: Problems for Lecture 26 (textbook Section VII.1), Problem 4
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec26-q4
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-085
    type: short_answer
    difficulty: easy
    tags:
      - computational-graph
      - backpropagation
      - chain-rule
    question: |
      A computational graph computes $f(x, y) = x^3 (x - y)$ through the nodes $a = x^3$, $b = x - y$ and
      $f = ab$. What is $\partial f / \partial x$ at $(x, y) = (2, 3)$?
    answer:
      numeric: -4
      tolerance: 0.001
      hint: a number (it may be negative)
      model: $\frac{\partial f}{\partial a}\frac{\partial a}{\partial x} + \frac{\partial f}{\partial b}\frac{\partial b}{\partial x} = b \cdot 3x^2 + a \cdot 1 = (-1)(12) + 8 = -4$
    explanation: |
      The forward pass gives $a = 8$, $b = -1$ and $f = -8$ [^1]. Backpropagation sends
      $\partial f/\partial a = b = -1$ and $\partial f/\partial b = a = 8$ back along the edges, and $x$ collects
      the contributions of both paths: $-1 \cdot 3x^2 + 8 \cdot 1 = -12 + 8 = -4$ [^2]. Along the same pass,
      $\partial f/\partial y = 8 \cdot (-1) = -8$; a finite-difference check confirms both values.
    references:
      - source: mit-ocw-18065
        locator: Problems for Lecture 27 (textbook Section VII.2), Problem 5
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec27-q5
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-086
    type: short_answer
    difficulty: hard
    tags:
      - forward-propagation
      - softmax
      - cross-entropy
    question: |
      A network has inputs $\mathbf{x} = (0.9, 0.7)$ and three ReLU hidden units with weight rows
      $(-0.3, 0.15)$, $(0.32, -0.91)$ and $(0.37, 0.47)$ and a bias of 0.001 each. Its two output units
      have no bias and weight rows $(0.15, -0.46, 0.59)$ and $(0.10, 0.32, -0.79)$. A softmax turns the
      outputs into probabilities, and the true class is the first one. What is the cross-entropy loss
      (natural logarithm)? Round to 3 decimals.
    answer:
      numeric: 0.337
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\mathbf{h} = (0, 0, 0.663)$, $\mathbf{o} = (0.391, -0.524)$, $\hat{y}_1 = 0.714$, $-\ln 0.714 \approx 0.337$
    explanation: |
      The hidden pre-activations are $-0.27 + 0.105 + 0.001 = -0.164$, $0.288 - 0.637 + 0.001 = -0.348$
      and $0.333 + 0.329 + 0.001 = 0.663$, so ReLU gives $\mathbf{h} = (0, 0, 0.663)$ [^1][^2]. The
      outputs are $0.59 \cdot 0.663 = 0.391$ and $-0.79 \cdot 0.663 = -0.524$, and the softmax gives
      $\hat{y}_1 = 1 / (1 + e^{-0.915}) \approx 0.714$ [^1]. The cross-entropy with a one-hot label is
      $-\ln \hat{y}_1 \approx 0.337$ [^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-211, pp. 249–251; Solution SOL-211, Figs. 8.57–8.60, pp. 302–304
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.3.1 Forward Propagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#forward-propagation
      - source: d2l
        locator: Sec. 4.1.2.1 Log-Likelihood
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#log-likelihood
    source:
      id: dl-interviews
      ref: ch8#prb211
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-087
    type: single
    difficulty: easy
    tags:
      - perceptron
      - logic-gates
      - bias
    question: |
      A perceptron with weights $w_1 = w_2 = 1$ outputs 1 if $w_1 x_1 + w_2 x_2 + b > 0$ and 0 otherwise,
      for binary inputs $x_1, x_2 \in \{0, 1\}$. With $b = -0.25$, which logic function does it compute?
    options:
      - text: OR
        correct: true
      - text: AND
        why: For $(0, 1)$ the sum is $1 - 0.25 = 0.75 > 0$, so the output is 1; AND needs $-2 < b \le -1$, for example $b = -1.5$.
      - text: XOR
        why: XOR is not linearly separable, so no single perceptron computes it [^2].
      - text: The constant 0
        why: That happens for $b = -2.5$, where even $1 + 1 - 2.5 = -0.5$ is negative [^1].
    explanation: |
      The weighted sums are $-0.25$, $0.75$, $0.75$ and $1.75$ for the inputs $(0,0)$, $(0,1)$, $(1,0)$
      and $(1,1)$, so the output is 1 unless both inputs are 0: that is OR [^1]. The bias sets the
      threshold: with both weights 1, OR needs $-1 < b \le 0$, AND needs $-2 < b \le -1$, and $b = -2.5$
      gives a perceptron that never fires [^1]. A single perceptron draws one straight line, which is why
      XOR is out of reach [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-216, pp. 251–252; Solution SOL-216, Figs. 8.61–8.62, p. 305
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Perceptron'
        url: https://en.wikipedia.org/wiki/Perceptron
        locator: Definition; Power of representation, Boolean function
    source:
      id: dl-interviews
      ref: ch8#prb216
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-088
    type: multiple
    difficulty: medium
    tags:
      - activation-functions
      - differentiability
      - backpropagation
    question: Which of these candidate activation functions are differentiable at $x = 0$? Select all that apply.
    options:
      - text: $f(x) = \lvert x \rvert$
        why: The left derivative is $-1$ and the right derivative is $+1$ [^2].
      - text: $f(x) = x$
        correct: true
      - text: $f(x) = x \sin(1/x)$ for $x \ne 0$, with $f(0) = 0$
        why: The difference quotient $f(h)/h = \sin(1/h)$ oscillates between $-1$ and $1$ as $h \to 0$, so it has no limit [^2].
      - text: $f(x) = x^2$ for $x > 0$ and $f(x) = -x$ for $x \le 0$
        why: The derivative from the left is $-1$ and from the right is 0 [^2].
      - text: $f(x) = x \lvert x \rvert$
        correct: true
    explanation: |
      $f$ is differentiable at 0 when $\lim_{h \to 0} (f(h) - f(0))/h$ exists [^2]. For $f(x) = x$ the
      quotient is 1, and for $x\lvert x \rvert$ it is $\lvert h \rvert \to 0$; for the other three the
      one-sided limits differ or do not exist [^1]. A kink at a single point does not stop
      backpropagation, though: ReLU is not differentiable at 0 either, and frameworks simply use a
      one-sided derivative there [^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-210, p. 249; Solution SOL-210, pp. 301–302
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.3.1 Differential Calculus
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#differential-calculus
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
    source:
      id: dl-interviews
      ref: ch8#prb210
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-089
    type: short_answer
    difficulty: medium
    tags:
      - sigmoid
      - hardware
      - derivative
    question: |
      Some hardware approximates $e^x$ by $2^{1.44x}$ and the sigmoid by
      $\tilde{s}(x) = \dfrac{1}{1 + 2^{-1.5x}}$. What is $\tilde{s}'(0)$? Round to 3 decimals. (The true
      sigmoid has $\sigma'(0) = 0.25$.)
    answer:
      numeric: 0.260
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\tilde{s}'(0) = \dfrac{1.5 \ln 2}{4} \approx 0.260$
    explanation: |
      Since $2^{-1.5x} = e^{-1.5 \ln 2 \cdot x}$, the approximation is a sigmoid with a scaled input,
      $\tilde{s}(x) = \sigma(kx)$ with $k = 1.5 \ln 2 \approx 1.040$ [^1]. By the chain rule,
      $\tilde{s}'(x) = k\,\tilde{s}(x)(1 - \tilde{s}(x))$, so $\tilde{s}'(0) = k / 4 \approx 0.260$ [^2]. The
      exact factor would be $\log_2 e \approx 1.4427$ instead of 1.5, which gives $k = 1$; rounding it up
      makes the curve about 4% too steep.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-217, Eqs. (8.26)–(8.28), pp. 253–256; Solution SOL-217, pp. 307–310
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.1.2.2 Sigmoid Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
    source:
      id: dl-interviews
      ref: ch8#prb217
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-090
    type: short_answer
    difficulty: easy
    tags:
      - mlp
      - parameter-count
      - pytorch
    question: |
      How many trainable parameters does this network have?

      ```python
      net = nn.Sequential(
          nn.Linear(200, 512), nn.Tanh(),
          nn.Linear(512, 512), nn.Tanh(),
          nn.Linear(512, 10), nn.LogSoftmax(dim=1),
      )
      ```
    answer:
      numeric: 370698
      tolerance: 0
      hint: a whole number
      model: $(200 \cdot 512 + 512) + (512 \cdot 512 + 512) + (512 \cdot 10 + 10) = 370\,698$
    explanation: |
      `net` is an MLP with two hidden layers of 512 tanh units [^1]. Each `nn.Linear(n_in, n_out)` has
      $n_{\text{in}} \cdot n_{\text{out}}$ weights and $n_{\text{out}}$ biases [^2]: 102,912 for the first
      layer, 262,656 for the second and 5,130 for the output layer. The activations and `LogSoftmax` have
      no parameters, so the total is 370,698.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-219, pp. 256–257; Solution SOL-219, p. 313
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
