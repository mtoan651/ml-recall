  - id: neural-networks-073
    type: single
    difficulty: easy
    tags:
      - binary-classification
      - cross-entropy
      - accuracy
      - loss-function
    question: |
      You report accuracy for a binary classifier, yet you train it by minimizing binary
      cross-entropy. Why not train it on accuracy directly?
    options:
      - text: Accuracy changes in jumps, so it gives SGD no smooth signal to follow
        correct: true
      - text: Accuracy can only be computed on the validation set, never on training batches
        why: Accuracy can be computed on any batch; Keras reports it during training as a metric [^1].
      - text: Accuracy needs probabilities, while cross-entropy works on raw unbounded outputs
        why: Both take the probabilities produced by a sigmoid output; the difference is that accuracy changes in jumps while cross-entropy changes smoothly [^1].
      - text: Minimizing cross-entropy always gives a higher accuracy than any other loss could
        why: Cross-entropy is a smooth stand-in; accuracy tends to improve along with it, but no loss is guaranteed best [^1].
    explanation: |
      SGD needs a loss that changes smoothly with the weights, but accuracy, a ratio of correct
      predictions to total predictions, changes in jumps, so it cannot serve as a loss [^1].
      Cross-entropy measures the distance between the predicted probabilities and the true class and
      grows the further the probability of the correct class is from 1.0; other metrics such as
      accuracy tend to improve along with it [^1]. Kaggle's learning curves for such a classifier show
      exactly that: accuracy rose as the cross-entropy fell [^2].
    references:
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 6 Binary Classification — tutorial, Accuracy and Cross-Entropy; Making Probabilities with the Sigmoid Function
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/tut6.ipynb
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 6 exercise, Question 3 Train and Evaluate (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/deep_learning_intro/ex6.py
