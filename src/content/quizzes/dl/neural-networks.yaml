  - id: neural-networks-020
    type: short_answer
    difficulty: medium
    tags:
      - softmax
      - numerical-stability
    question: The softmax $\hat y_j = \exp(o_j) / \sum_k \exp(o_k)$ can overflow for large logits. Why is it safe to subtract $\max_k o_k$ from every logit before exponentiating?
    answer:
      model: 'Softmax is invariant to adding a constant $c$ to all logits: the factor $\exp(-c)$ appears in the numerator and in every term of the denominator and cancels. With $c = \max_k o_k$ every exponent is $\le 0$, so $\exp$ cannot overflow.'
    explanation: $\frac{\exp(o_j - \bar o)}{\sum_k \exp(o_k - \bar o)} = \frac{\exp(o_j)\exp(-\bar o)}{\sum_k \exp(o_k)\exp(-\bar o)} = \hat y_j$, so the probabilities are unchanged, and choosing $\bar o = \max_k o_k$ guarantees $o_j - \bar o \le 0$ for all $j$ [^1].
    references:
      - source: d2l
        locator: Sec. 4.5.2 Softmax Revisited
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html
    source:
      id: original
      ref: neural-networks-020
    status: reviewed
  - id: neural-networks-021
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - representation-learning
    question: Why do deep networks need much less hand-engineered feature design for images?
    options:
      - text: Once a network has enough layers it no longer needs training data.
        why: Deep networks still learn everything from training data.
      - text: Each layer applies features that experts fixed before training.
        why: That is exactly the hand-engineered approach deep learning moves away from.
      - text: Each image is reduced to its average pixel value.
        why: This would throw away almost all of the information in the image.
      - text: Their layers learn useful feature representations from the training data.
        correct: true
    explanation: 'Representation learning adjusts the feature mapping jointly with the prediction objective: early layers tend to capture local patterns such as edges, and later layers combine them into task-specific features [^1]. Conventional models often rely on engineered features instead [^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 8
      - source: ncu-intro-dl
        locator: Lecture 1, slide 10
    source:
      id: ncu-intro-dl
      ref: exercise-01/q02
    status: draft
