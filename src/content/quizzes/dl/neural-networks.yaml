  - id: neural-networks-072
    type: short_answer
    difficulty: medium
    tags:
      - parameter-count
      - dense-layers
      - keras
    question: |
      A regression model for a dataset with 8 feature columns is:

      ```python
      model = keras.Sequential([
          layers.Dense(512, activation='relu', input_shape=[8]),
          layers.Dense(512, activation='relu'),
          layers.Dense(512, activation='relu'),
          layers.Dense(1),
      ])
      ```

      How many trainable parameters does it have?
    answer:
      numeric: 530433
      tolerance: 0
      hint: a whole number
      model: $(8 \cdot 512 + 512) + 2(512 \cdot 512 + 512) + (512 + 1) = 4608 + 2 \cdot 262656 + 513 = 530433$
    explanation: |
      A dense layer connects every input to every unit and gives each unit a bias, so it has
      $n_{\text{in}} \times n_{\text{out}} + n_{\text{out}}$ parameters [^1]. The first hidden layer has
      $8 \cdot 512 + 512 = 4608$, each of the next two $512 \cdot 512 + 512 = 262656$, and the output
      unit $512 + 1 = 513$, for 530,433 in total. Activations add no parameters, and the output layer
      has no activation because the target is a real number [^2].
    references:
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 2 Deep Neural Networks — tutorial, Layers; Stacking Dense Layers
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/tut2.ipynb
