  - id: neural-networks-075
    type: short_answer
    difficulty: easy
    tags:
      - matrix-factorization
      - embeddings
      - dot-product
      - recommender-systems
    question: |
      A matrix-factorization recommender was trained on ratings centered on the training mean of 3.5
      stars, so it predicts $3.5 + \mathbf{u} \cdot \mathbf{m}$. A user's embedding is
      $\mathbf{u} = (0.5, -1.0, 0.8, 1.5)$ and a movie's embedding is
      $\mathbf{m} = (1.2, 0.3, -0.5, 0.4)$. What rating does the model predict, in stars?
    answer:
      numeric: 4.0
      tolerance: 0.01
      hint: stars, 2 decimals
      model: $3.5 + (0.6 - 0.3 - 0.4 + 0.6) = 3.5 + 0.5 = 4.0$
    explanation: |
      The model combines the two embeddings with a dot product, which needs both vectors to have the
      same length [^1]: $0.5 \cdot 1.2 + (-1.0)(0.3) + 0.8 \cdot (-0.5) + 1.5 \cdot 0.4 = 0.5$. Because
      it was trained on centered ratings, an output of 0 means the overall average, so the prediction
      is $3.5 + 0.5 = 4.0$ stars [^1]. Each term $u_i m_i$ pairs how much the user likes a quality with
      how much the movie has it, which is why the two embedding spaces are tied together [^1].
    references:
      - source: kaggle-learn
        locator: Embeddings tutorial 2 Matrix factorization for recommendation problems, Dot Products and Why?
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/embeddings/raw/2-factorization.ipynb
    source:
