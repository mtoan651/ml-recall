  - id: neural-networks-013
    type: single
    question: |
      Evaluate both statements.

      **Statement 1.** RELUs are not monotonic, but sigmoids are monotonic.

      **Statement 2.** Neural networks trained with gradient descent with high probability converge to the global optimum.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: "**Statement 1** is false: ReLU, $\\max(0, x)$, is monotonic (non-decreasing), and so is the sigmoid. **Statement 2** is false: a neural network's loss is non-convex, so gradient descent usually ends in a local optimum or saddle region, with no guarantee of the global optimum. MMLU-Redux experts flagged the original answer key (D) as wrong [^1]."
    references:
      - source: mmlu-redux
        locator: machine_learning row 0 — wrong_groundtruth
    source:
      id: mmlu-redux
      ref: machine_learning/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=0
