  - id: neural-networks-076
    type: short_answer
    difficulty: easy
    tags:
      - relu-network
      - parameter-count
      - mlp
    question: |
      A ReLU network maps a scalar input $x$ to a scalar output with $l = 3$ weight layers,
      $$f(x) = W_3\,\mathrm{ReLU}\big(W_2\,\mathrm{ReLU}(W_1 x + b_1) + b_2\big) + b_3,$$
      and both hidden layers have width $k = 10$. How many trainable parameters (weights and biases)
      does it have?
    answer:
      numeric: 141
      tolerance: 0
      hint: a whole number
      model: '$W_1, b_1$: $10 + 10$; $W_2, b_2$: $100 + 10$; $W_3, b_3$: $10 + 1$; total $141$'
    explanation: |
      The shapes follow from the scalar input and output: $W_1 \in \mathbb{R}^{10 \times 1}$,
      $W_2 \in \mathbb{R}^{10 \times 10}$, $W_3 \in \mathbb{R}^{1 \times 10}$, and one bias per unit,
      $b_1, b_2 \in \mathbb{R}^{10}$ and $b_3 \in \mathbb{R}$ [^1]. That gives
      $20 + 110 + 11 = 141$ parameters. In general the count is $k^2 + 4k + 1$: the hidden-to-hidden
      matrix dominates, so doubling the width roughly quadruples the parameters [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 1, Approximation, Problems 1–2
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw1_pdf/
      - source: d2l
        locator: Sec. 5.1.1.3 From Linear to Nonlinear
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
