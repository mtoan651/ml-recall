questions:
  - id: neural-networks-001
    type: single
    difficulty: easy
    question: Select the sentence that best describes the terms "model", "architecture", and "weights".
    options:
      - text: If a model is a building, its architecture is the blueprint and the weights are the people living inside.
        why: Following this metaphor, the weights would be the bricks and other materials used to construct the building.
      - text: An architecture is a map to build a model and its weights are the cities represented on the map.
        why: The problem with this metaphor is that a map usually represents one existing reality (there is only one city in France named Paris). For a given architecture, multiple weights are possible.
      - text: An architecture is a succession of mathematical functions to build a model and its weights are those functions' parameters.
        correct: true
    explanation: The same set of mathematical functions (architecture) can be used to build different models by using different parameters (weights). [^1]
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#architecture-vs-checkpoints
        locator: 'Chapter 1, How do Transformers work?: Architectures vs. checkpoints'
    source:
      id: hf-llm-course
      ref: chapter1/7#q7
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: neural-networks-002
    type: multiple
    difficulty: easy
    question: What is the point of applying a SoftMax function to the logits output by a sequence classification model?
    options:
      - text: It softens the logits so that they're more reliable.
        why: No, the SoftMax function does not affect the reliability of results.
      - text: It applies a lower and upper bound so that they're understandable.
        correct: true
        why: Every softmax output lies between 0 and 1.
      - text: The total sum of the output is then 1, resulting in a possible probabilistic interpretation.
        correct: true
        why: Dividing each exponentiated logit by the sum of all of them makes the outputs add up to 1, like a probability distribution.
    explanation: |
      The logits of a sequence classification model are raw, unnormalized scores; to be read as
      probabilities they go through a SoftMax layer [^1]. Softmax exponentiates every logit, which
      makes it non-negative, and divides by the sum of the exponentials, so each output lies between
      0 and 1 and all outputs add up to 1 [^2]. Both properties together allow the probabilistic
      reading. Softmax also preserves the ordering of the logits, so it does not change which class
      wins and does not make the prediction any more reliable [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/2#postprocessing-the-output
        locator: 'Chapter 2, Behind the pipeline: Postprocessing the output'
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
        locator: Sec. 4.1.1.2 The Softmax, Eqs. (4.1.3)–(4.1.4)
        quote: because the softmax operation preserves the ordering among its arguments, we do not need to compute the softmax to determine which class has been assigned the highest probability
    source:
      id: hf-llm-course
      ref: chapter2/9#q7
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: neural-networks-003
    type: true_false
    difficulty: easy
    question: A simple neuron is also called a 'threshold logic unit'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Rosenblatt's 1957 Mark-1 perceptron had 400 inputs, one binary output and a single neuron,
      which the lesson calls a threshold logic unit [^1]. The name comes from its step activation:
      the unit outputs one value when its weighted input is above a threshold and the other value
      below it, the thresholding units that McCulloch and Pitts used to model neurons that either
      fire or do not [^1][^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md
        locator: 'Lesson: Introduction to Neural Networks - Perceptron (introduction and Perceptron Model)'
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function
    source:
      id: ms-ai-for-beginners
      ref: quiz-103/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-3.json
    status: draft
  - id: neural-networks-004
    type: single
    difficulty: easy
    question: A perceptron is a ___ type of model
    options:
      - text: multi-class classification
      - text: clustering
      - text: binary classification
        correct: true
    explanation: |
      A perceptron computes $y(x) = f(w^\top x)$, where $f$ is a step function returning $+1$ or
      $-1$, so it separates the input into exactly two classes: it is a binary classification model
      [^1]. It is trained from labelled examples ($t_i = \pm 1$), so it is supervised learning, not
      clustering [^1]. Handling more than two classes needs an extension, which is one of the goals
      of the multi-layer networks in the next lesson [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#perceptron-model
        locator: 'Lesson: Introduction to Neural Networks - Perceptron, Perceptron Model and Training the Perceptron'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron (introduction)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-103/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-3.json
    status: draft
  - id: neural-networks-005
    type: single
    difficulty: easy
    question: To train a perceptron, find a weights vector that results in the smallest ___.
    options:
      - text: size
      - text: error
        correct: true
      - text: nodes
    explanation: |
      Training means finding the weight vector that classifies as many training points as possible
      correctly, i.e. the one with the smallest error [^1]. The lesson measures this error with the
      perceptron criterion $E(w) = -\sum_i w^\top x_i t_i$, summed only over misclassified points, so it
      is zero when every point is on the right side [^1]. The number of nodes is not what training
      changes; the model is a single neuron and only its weights are learned [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
        locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
    source:
      id: ms-ai-for-beginners
      ref: quiz-203/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-3.json
    status: draft
  - id: neural-networks-006
    type: true_false
    difficulty: easy
    question: To minimize the function of weights, you can use gradient descent
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      The perceptron criterion $E(w)$ is a function of the weights, and the lesson minimizes it with
      gradient descent: start from initial weights $w^{(0)}$ and repeatedly step against the gradient,
      $w^{(t+1)} = w^{(t)} - \eta \nabla E(w)$ [^1]. The same idea, updating the parameters in the
      direction that lowers the loss, is how nearly every deep learning model is trained [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
        locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
    source:
      id: ms-ai-for-beginners
      ref: quiz-203/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-3.json
    status: draft
  - id: neural-networks-007
    type: single
    difficulty: easy
    question: During gradient descent, each step updates the ___
    options:
      - text: learning rate
      - text: weights
        correct: true
      - text: gradient
    explanation: |
      Each gradient-descent step changes the weights: $w^{(t+1)} = w^{(t)} - \eta \nabla E(w)$ [^1].
      The learning rate $\eta$ is a hyperparameter set by the designer that only scales the step
      [^2], and the gradient $\nabla E(w)$ is not updated but recomputed at the current weights to
      decide the direction of the next step [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
        locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
    source:
      id: ms-ai-for-beginners
      ref: quiz-203/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-3.json
    status: draft
  - id: neural-networks-008
    type: true_false
    difficulty: easy
    question: The quality of prediction is measured by Loss function
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      To train a model we need a number that says how good its predictions are, and that number is
      the loss function $\mathcal{L}$: absolute or squared error for regression, 0-1 or logistic loss
      for classification [^1]. Loss is usually non-negative, smaller is better, and a perfect
      prediction scores 0 [^2]; training then means changing the parameters to make it smaller [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#formalization-of-machine-learning
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Formalization of Machine Learning'
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function
        locator: Sec. 3.1.1.2 Loss Function
    source:
      id: ms-ai-for-beginners
      ref: quiz-104/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-4.json
    status: draft
  - id: neural-networks-009
    type: single
    difficulty: easy
    question: One layer network is capable of classifying ____
    options:
      - text: linearly joined classes
      - text: linearly separable classes
        correct: true
      - text: single layers of classes
    explanation: |
      A one-layer network computes a linear function $f(x) = wx + b$ (optionally followed by
      softmax), so it can only tell apart classes that are linearly separable [^1]. Separating other
      classes needs hidden layers with a nonlinear activation; without the nonlinearity, stacked affine
      layers collapse back into one affine layer and gain nothing [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#multi-layered-perceptrons-and-backpropagation
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Multi-Layered Perceptrons and Backpropagation'
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear
    source:
      id: ms-ai-for-beginners
      ref: quiz-104/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-4.json
    status: draft
  - id: neural-networks-010
    type: single
    difficulty: easy
    question: The method of training multi-layered perceptron is called ____
    options:
      - text: back propagation
        correct: true
      - text: multiple propagation
      - text: front propagation
    explanation: |
      In a multi-layer network the loss is a composition of functions, so its gradient comes from the
      chain rule. The chain-rule products for different layers share their leftmost factors, so they
      are computed efficiently by starting at the loss and moving backwards through the computational
      graph, hence the name backpropagation [^1]. d2l describes it the same way: traverse the network
      from the output layer to the input layer, applying the chain rule and storing the intermediate
      derivatives [^2]. Forward propagation is the opposite pass, which computes and stores the
      intermediate values and outputs from input to output [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#multi-layered-perceptrons-and-backpropagation
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Multi-Layered Perceptrons and Backpropagation'
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
        locator: Sec. 5.3.1 Forward Propagation and Sec. 5.3.3 Backpropagation
    source:
      id: ms-ai-for-beginners
      ref: quiz-104/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-4.json
    status: draft
  - id: neural-networks-011
    type: single
    difficulty: easy
    shuffle: false
    question: We use ____ for regression loss functions
    options:
      - text: absolute error
      - text: mean squared error
      - text: all of the above
        correct: true
    explanation: |
      A regression loss compares a predicted number with the true one, and the lesson lists both the
      absolute error $\sum_i |f(x^{(i)}) - y^{(i)}|$ and the squared error
      $\sum_i (f(x^{(i)}) - y^{(i)})^2$ [^1]. Both are standard, usually averaged as mean absolute
      error (MAE) and mean squared error (MSE); MSE pulls the model more strongly towards outliers,
      while MAE stays closer to the bulk of the data [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#formalization-of-machine-learning
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Formalization of Machine Learning'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/loss
        locator: 'Linear regression: Loss, Types of loss and Choosing a loss'
    source:
      id: ms-ai-for-beginners
      ref: quiz-204/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-4.json
    status: draft
  - id: neural-networks-012
    type: true_false
    difficulty: easy
    question: Binary cross-entropy is also called log loss
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      For binary classification with a single sigmoid output the lesson's notebook uses binary
      cross-entropy and notes that it is the same as log loss [^1]. Google's course writes log loss
      as $-\frac{1}{N}\sum_i \left[y_i \log y_i' + (1-y_i)\log(1-y_i')\right]$ [^2], and PyTorch's
      binary cross-entropy loss has exactly the same per-example form [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/IntroKerasTF.ipynb
        locator: 'Notebook: Introduction to TensorFlow/Keras, "Classification Loss Functions"'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/loss-regularization#log_loss
        locator: 'Logistic regression: Loss and regularization, Log Loss'
      - title: torch.nn.BCELoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCELoss.html
        locator: Class description, loss formula
    source:
      id: ms-ai-for-beginners
      ref: quiz-205/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
    status: draft
  - id: neural-networks-013
    type: single
    question: |
      Evaluate both statements.

      **Statement 1.** RELUs are not monotonic, but sigmoids are monotonic.

      **Statement 2.** Neural networks trained with gradient descent with high probability converge to the global optimum.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: "**Statement 1** is false: ReLU, $\\max(0, x)$, is monotonic (non-decreasing), and so is the sigmoid. **Statement 2** is false: a neural network's loss is non-convex, so gradient descent usually ends in a local optimum or saddle region, with no guarantee of the global optimum. MMLU-Redux experts flagged the original answer key as wrong [^1]."
    references:
      - source: mmlu-redux
        locator: machine_learning row 0 — wrong_groundtruth
    source:
      id: mmlu-redux
      ref: machine_learning/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=0
    status: draft
  - id: neural-networks-014
    type: single
    difficulty: easy
    question: 'The numerical output of a sigmoid node in a neural network:'
    options:
      - text: Is unbounded, encompassing all real numbers.
      - text: Is unbounded, encompassing all integers.
      - text: Is bounded between 0 and 1.
        correct: true
      - text: Is bounded between -1 and 1.
    explanation: |
      The sigmoid $\sigma(x) = 1/(1+e^{-x})$ squashes any real input into the interval $(0, 1)$,
      which is why it is used for outputs that are read as probabilities [^1]. The range from $-1$
      to $1$ belongs to tanh, a different squashing function [^1]; neither of them is unbounded or
      integer-valued.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function and Sec. 5.1.2.3 Tanh Function
    source:
      id: mmlu-redux
      ref: machine_learning/19
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=19
    status: draft
  - id: neural-networks-015
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** The derivative of the sigmoid $\sigma(x)=(1+e^{-x})^{-1}$ with respect to $x$ is equal to $\text{Var}(B)$ where $B\sim \text{Bern}(\sigma(x))$ is a Bernoulli random variable.

      **Statement 2.** Setting the bias parameters in each layer of neural network to 0 changes the bias-variance trade-off such that the model's variance increases and the model's bias decreases
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      Statement 1: the sigmoid's derivative is $\sigma'(x) = \sigma(x)\,(1-\sigma(x))$ [^1], and a
      Bernoulli variable with success probability $p$ has variance $p(1-p)$ [^2]. With
      $p = \sigma(x)$ the two are identical, so the statement is true. Statement 2: forcing every bias
      to 0 removes parameters and shrinks the set of functions the network can represent. A more
      restricted model moves towards underfitting, i.e. higher bias and lower variance [^3][^4], the
      opposite of what the statement claims, so it is false.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function, Eq. (5.1.7)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#bernoulli
        locator: Sec. 22.8.1 Bernoulli
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-complexity
        locator: Sec. 3.6.1.1 Model Complexity
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#overfitting-and-bias-variance-tradeoff
        locator: 'Lesson: Neural Network Frameworks, Overfitting and Bias-Variance Tradeoff'
    source:
      id: mmlu-redux
      ref: machine_learning/46
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=46
    status: draft
  - id: neural-networks-016
    type: single
    difficulty: medium
    question: We are training fully connected network with two hidden layers to predict housing prices. Inputs are $100$-dimensional, and have several features such as the number of square feet, the median family income, etc. The first hidden layer has $1000$ activations. The second hidden layer has $10$ activations. The output is a scalar representing the house price. Assuming a vanilla network with affine transformations and with no batch normalization and no learnable parameters in the activation function, how many parameters does this network have?
    options:
      - text: '111021'
        correct: true
      - text: '110010'
      - text: '111110'
      - text: '110011'
    explanation: |
      A fully connected layer with $n_\text{in}$ inputs and $n_\text{out}$ outputs has an
      $n_\text{in} \times n_\text{out}$ weight matrix and $n_\text{out}$ biases [^1]. Adding up the
      three layers ($100 \to 1000 \to 10 \to 1$):

      $$\underbrace{100 \cdot 1000 + 1000}_{101{,}000} + \underbrace{1000 \cdot 10 + 10}_{10{,}010} + \underbrace{10 \cdot 1 + 1}_{11} = 111{,}021.$$

      The distractor 110,010 counts only the weights, and 110,011 adds just the output bias; every
      layer has its own bias vector [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear (weight and bias shapes)
    source:
      id: mmlu-redux
      ref: machine_learning/62
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=62
    status: draft
  - id: neural-networks-017
    type: single
    difficulty: hard
    shuffle: false
    question: Given a Neural Net with N input nodes, no hidden layers, one output node, with Entropy Loss and Sigmoid Activation Functions, which of the following algorithms (with the proper hyper-parameters and initialization) can be used to find the global optimum?
    options:
      - text: Stochastic Gradient Descent
      - text: Mini-Batch Gradient Descent
      - text: Batch Gradient Descent
      - text: All of the above
        correct: true
    explanation: |
      With no hidden layer, one sigmoid output and cross-entropy loss, this network is exactly
      logistic regression. The Hessian of its cross-entropy error is positive definite, so the error
      is convex in the weights with a single minimum [^1], and for a convex objective any local
      minimum is the global one [^2]. Gradient steps therefore reach the optimum whether each step uses
      one example, a minibatch or the full dataset, as long as the learning rate is chosen well
      (decayed for the stochastic versions) [^3]. One caveat: if the classes are perfectly linearly
      separable the weights grow without bound and no finite optimum exists unless you add
      regularization [^1].
    references:
      - title: Pattern Recognition and Machine Learning (Bishop, 2006)
