  - id: neural-networks-097
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - feedforward
      - terminology
    question: Which statement about feedforward neural networks (FNNs) is correct?
    options:
      - text: Skip connections are allowed, provided the computation graph stays acyclic
        correct: true
      - text: Every layer of an FNN must be fully connected to the previous layer
        why: Feedforward describes acyclic information flow; sparse connections, shared weights and branches are all allowed.
      - text: A network counts as "deep" only once it has at least ten hidden layers
        why: There is no agreed numerical cut-off; one states the actual layer count instead.
      - text: An FNN feeds each layer's output back into the same layer at the next time step
        why: Feeding outputs back creates a cycle, which is what recurrent networks do and FNNs exclude.
    explanation: |
      "Feedforward" means the computation graph contains no directed cycle — information only moves
      forward, unlike in a recurrent network [^1][^3] — so the network can be evaluated in one pass,
      in dependency order [^2]. That allows sparse connectivity, parameter sharing, bottlenecks
      and skip connections that jump over layers. An
      MLP is the special case of a fully connected FNN having one or more nonlinear hidden layers,
      and "deep" only means many successive learned layers.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 7–8, 41
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.2 Computational Graph of Forward Propagation; Sec. 5.3.4 Training Neural Networks
      - title: 'Wikipedia: Feedforward neural network'
        url: https://en.wikipedia.org/wiki/Feedforward_neural_network
        locator: Introduction (lead section)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q03
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-098
