    question: With $\mathrm{ReLU}(z) = \max(0, z)$, what is $\mathrm{ReLU}(-2)$?
    options:
      - text: '0'
        correct: true
      - text: −2
        why: ReLU never outputs a negative value.
      - text: '2'
        why: ReLU is not the absolute value.
      - text: '1'
    explanation: '$\max(0, -2) = 0$: ReLU passes positive inputs through unchanged and maps every negative input to 0 [^1][^2].'
    references:
