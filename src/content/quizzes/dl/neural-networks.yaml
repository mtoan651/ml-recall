      - pytorch
    question: |
      What does this code print?

      ```python
      import torch
      import torch.nn.functional as F
      z = torch.tensor([-3.0])   # logit
      y = torch.tensor([1.0])    # label
      print(round(F.binary_cross_entropy_with_logits(z, y).item(), 4))
      ```
    answer:
      numeric: 3.0486
      tolerance: 0.0002
      hint: a number with 4 decimals
      model: $-\log\sigma(-3) = \log(1 + e^{3}) = 3 + \log(1 + e^{-3}) \approx 3.0486$
    explanation: |
      For label 1 the binary cross-entropy is $-\log p$ with $p = \sigma(z)$, and
      `binary_cross_entropy_with_logits` computes it directly from the logit [^1][^2]. Here
      $-\log\sigma(z) = \log(1 + e^{-z})$; the numerically stable form
      $\max(z, 0) - yz + \log(1 + e^{-|z|})$ — the log-sum-exp trick of factoring out the largest
      exponent [^3] — gives $0 + 3 + \log(1 + e^{-3}) \approx 3.0486$ without exponentiating a
      large positive number. The label is positive while the model gives it probability
      $\sigma(-3) \approx 0.047$, so the loss is large.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 52–53, 61
      - title: torch.nn.BCEWithLogitsLoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html
        locator: Class description (sigmoid and BCE in one layer, log-sum-exp trick for numerical stability)
      - title: 'Wikipedia: LogSumExp'
        url: https://en.wikipedia.org/wiki/LogSumExp
        locator: log-sum-exp trick for log-domain calculations
    source:
      id: ncu-intro-dl
      ref: lecture-02/q16
