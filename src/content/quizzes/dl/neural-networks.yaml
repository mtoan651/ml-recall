  - id: neural-networks-033
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex03
      - dense-layer
      - parameter-count
    question: A fully connected layer maps 3 inputs to 4 units, and each unit has its own bias. How many trainable parameters does the layer have?
    options:
      - text: '7'
        why: This adds the layer sizes instead of counting connections.
      - text: '12'
        why: This counts the weights but forgets the biases.
      - text: '16'
        correct: true
      - text: '20'
    explanation: The weight matrix has $3 \times 4 = 12$ entries and there is one bias per unit, giving $12 + 4 = 16$ parameters [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 15, 17
