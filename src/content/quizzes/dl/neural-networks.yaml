  - id: neural-networks-034
    type: single
    difficulty: medium
    tags:
      - activation-functions
      - affine
      - ce6146
      - ce6146-ex03
    question: You stack several affine layers but use the identity as every activation function. What can the whole stack represent?
    options:
      - text: Only a single affine transformation
        correct: true
      - text: Any nonlinear function exactly
        why: Without a nonlinearity the stack stays affine.
      - text: A recurrent network
        why: Stacking layers does not create recurrent connections.
      - text: A function without parameters
        why: The stack still has weights and biases.
    explanation: With identity activations, $\hat y = x(W^1 W^2) + (b^1 W^2 + b^2)$ — still one weight matrix and one bias [^1]. An affine function of an affine function is affine, so nonlinear activations are what add expressive power [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 23
      - source: d2l
        locator: Sec. 5.1 Multilayer Perceptrons
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        quote: An affine function of an affine function is itself an affine function.
    source:
      id: ncu-intro-dl
      ref: exercise-03/q09
    status: draft
  - id: neural-networks-035
    type: single
    difficulty: medium
    tags:
      - binary-cross-entropy
      - ce6146
      - ce6146-ex03
      - sigmoid
    question: Which output activation and loss suit a single binary label?
    options:
      - text: Identity output with categorical cross-entropy
        why: The identity does not produce a probability.
      - text: Softmax output with mean squared error
        why: Softmax over a single output is always 1, and MSE is not the likelihood of a binary target.
      - text: ReLU output with binary cross-entropy
        why: A ReLU output is unbounded above, so it is not a probability.
      - text: Sigmoid output with binary cross-entropy
        correct: true
    explanation: The sigmoid turns the logit into $p \in (0, 1)$, and binary cross-entropy $-y \log p - (1 - y) \log(1 - p)$ is the negative log-likelihood of a Bernoulli target [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 52–53
    source:
      id: ncu-intro-dl
      ref: exercise-03/q10
    status: draft
  - id: neural-networks-036
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - softmax
    question: An input belongs to exactly one of three classes. Which output function gives a probability distribution over the classes?
    options:
      - text: Three independent ReLU outputs
        why: They are non-negative but do not sum to 1.
      - text: An identity output
        why: Identity outputs are unbounded.
      - text: Softmax
        correct: true
      - text: A single tanh output
        why: One value in $(-1, 1)$ cannot describe three classes.
    explanation: Softmax, $p_k = e^{z_k} / \sum_j e^{z_j}$, produces non-negative values that sum to 1, which suits mutually exclusive classes [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 58
      - source: d2l
        locator: Sec. 4.1 Softmax Regression
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    source:
      id: ncu-intro-dl
      ref: exercise-03/q11
    status: draft
  - id: neural-networks-037
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex03
      - derivatives
      - squared-error
    question: For $L = \tfrac{1}{2}(\hat y - y)^2$, what is $\partial L / \partial \hat y$ when $\hat y = 2$ and $y = 3$?
    options:
      - text: '1'
        why: 'The sign is flipped: the derivative is $\hat y - y$.'
      - text: −1
        correct: true
      - text: '0.5'
      - text: −2
        why: This forgets that the factor ½ cancels the 2 from the square.
    explanation: $\partial L / \partial \hat y = \hat y - y = 2 - 3 = -1$; the factor ½ is there exactly so that the 2 from differentiating the square cancels [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 48–50
    source:
      id: ncu-intro-dl
      ref: exercise-03/q12
    status: draft
  - id: neural-networks-038
    type: single
    difficulty: medium
    tags:
      - backpropagation
      - ce6146
      - ce6146-ex03
      - relu
    question: A ReLU unit has pre-activation $z = -2$ and receives the upstream gradient $\partial L / \partial a = 3$. What is $\partial L / \partial z$?
    options:
      - text: −6
        why: This multiplies by $z$ instead of by $\mathrm{ReLU}'(z)$.
      - text: '3'
        why: $\mathrm{ReLU}'(z)$ is 0 here, not 1.
      - text: −2
      - text: '0'
        correct: true
    explanation: |-
      $\mathrm{ReLU}'(z) = 0$ for $z < 0$, so by the chain rule $\partial L / \partial z = 3 \times 0 = 0$: no gradient flows through an inactive ReLU [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 77
      - source: ncu-intro-dl
        locator: Lecture 2, slide 72
    source:
      id: ncu-intro-dl
      ref: exercise-03/q13
    status: draft
