  - id: neural-networks-025
    type: single
    difficulty: easy
    tags:
      - bias
      - ce6146
      - ce6146-ex02
      - ce6146-ex03
    question: What role does the bias $b$ play in a neuron that computes $z = \sum_i w_i x_i + b$?
    options:
      - text: It multiplies the input by another neuron's output.
        why: That is not what the bias does; it is added, not multiplied.
      - text: It adds a learnable constant to the weighted sum.
        correct: true
      - text: It computes the validation accuracy.
        why: Accuracy is an evaluation metric, not part of a neuron.
      - text: It sets the batch size.
        why: Batch size is a training setting.
    explanation: The bias is an additive parameter that does not depend on the input. It shifts the pre-activation, so the neuron is not forced to pass through the origin [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 11, 13
      - source: d2l
        locator: Sec. 3.1 Linear Regression
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q05
    status: draft
  - id: neural-networks-026
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - perceptron
    question: Which statement describes a single perceptron?
    options:
      - text: A single-layer network that can only solve problems that are not linearly separable
        why: It is the other way round.
      - text: The simplest neural classifier, able to separate classes that one line or hyperplane can divide
        correct: true
      - text: A multi-layer model built for hierarchical patterns
        why: That describes a multilayer perceptron (MLP).
      - text: A recurrent model for sequential data
        why: That describes a recurrent neural network.
    explanation: 'A perceptron thresholds a single affine score $s = xw + b$, so its decision boundary is one line (hyperplane): it can only handle linearly separable data [^1].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 24
    source:
      id: ncu-intro-dl
      ref: exercise-02/q06
    status: draft
  - id: neural-networks-027
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - perceptron
      - xor
    question: What is the main limitation of a single perceptron?
    options:
      - text: It is too complex to implement.
      - text: It cannot represent functions that are not linearly separable, such as XOR.
        correct: true
      - text: It fails even on linearly separable data.
        why: Linearly separable data is exactly what it can handle.
      - text: It always overfits.
    explanation: For XOR, the points $(0,1)$ and $(1,0)$ belong to one class and $(0,0)$ and $(1,1)$ to the other; the inequalities a single line would need contradict each other [^1]. A hidden layer with a nonlinear activation solves it [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 24–25
      - source: ncu-intro-dl
        locator: Lecture 2, slide 27
    source:
      id: ncu-intro-dl
      ref: exercise-02/q07
    status: draft
  - id: neural-networks-028
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-ex03
      - feedforward
    question: What does “feedforward” mean in a feedforward neural network?
    options:
      - text: Values circulate through recurrent loops.
        why: Loops are what recurrent networks add.
      - text: Values flow from the outputs back to the inputs.
        why: Only gradients flow backwards, and only during training.
      - text: Values flow from the inputs towards the outputs without any directed cycle.
        correct: true
      - text: Values flow in a random order.
    explanation: In a feedforward network the forward computation passes values from inputs to outputs with no directed cycle; there is no feedback loop [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 7–8
    source:
      id: ncu-intro-dl
      ref: exercise-02/q08
    status: draft
  - id: neural-networks-029
    type: single
    difficulty: easy
    tags:
      - backpropagation
      - ce6146
      - ce6146-ex02
    question: What does the backward pass of a neural network compute?
    options:
      - text: The gradients of the loss with respect to the weights, which the optimizer then uses to update them
        correct: true
      - text: The non-linearity of the network
        why: Non-linearity comes from the activation functions in the forward pass.
      - text: The normalized inputs
        why: Normalization is preprocessing.
      - text: The network's output
        why: The output is computed by the forward pass.
    explanation: The backward pass propagates derivatives from the loss to every parameter with the chain rule. Backpropagation computes gradients; the optimizer step that follows uses them to change the weights [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 51
      - source: d2l
        locator: Sec. 5.3 Forward Propagation, Backward Propagation, and Computational Graphs
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q09
    status: draft
  - id: neural-networks-030
    type: single
    difficulty: easy
    tags:
      - backpropagation
      - ce6146
      - ce6146-ex02
      - chain-rule
    question: Why is the chain rule essential for backpropagation?
    options:
      - text: It simplifies the network architecture.
      - text: It gives the derivative of a composition of functions — and a network is such a composition.
        correct: true
      - text: It computes the forward activations.
        why: Activations come from the forward pass.
      - text: It is not needed for backpropagation.
    explanation: A network is a composition of layers, so the chain rule multiplies local derivatives along the path from the loss back to each parameter; backpropagation reuses intermediate results to do this efficiently [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 72
      - source: d2l
        locator: Sec. 5.3 Forward Propagation, Backward Propagation, and Computational Graphs
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
