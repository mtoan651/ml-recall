  - id: neural-networks-019
    type: single
    difficulty: medium
    question: 'For a neural network, which one of these structural assumptions is the one that most affects the trade-off between underfitting (i.e. a high bias model) and overfitting (i.e. a high variance model):'
    options:
      - text: The number of hidden nodes
        correct: true
      - text: The learning rate
      - text: The initial choice of weights
      - text: The use of a constant-term unit input
    explanation: |
      The number of hidden units sets how many parameters the network has, since each hidden layer
      has a $d \times h$ weight matrix and $h$ biases [^1]. Models with more parameters can usually
      fit more arbitrary patterns, so too few hidden units underfit and too many can overfit [^2].
      The learning rate only affects optimization (too small is slow, too large diverges) [^3], the
      initial weights only decide where optimization starts, and a constant-term input adds just one
      bias weight per unit [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-complexity
        locator: Sec. 3.6.1.1 Model Complexity and Sec. 3.6.2 Underfitting or Overfitting?
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
    source:
      id: mmlu-redux
      ref: machine_learning/89
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=89
