  - id: neural-networks-036
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - softmax
    question: An input belongs to exactly one of three classes. Which output function gives a probability distribution over the classes?
    options:
      - text: Three independent ReLU outputs
        why: They are non-negative but do not sum to 1.
      - text: An identity output
        why: Identity outputs are unbounded.
      - text: Softmax
        correct: true
      - text: A single tanh output
        why: One value in $(-1, 1)$ cannot describe three classes.
    explanation: Softmax, $p_k = e^{z_k} / \sum_j e^{z_j}$, produces non-negative values that sum to 1, which suits mutually exclusive classes [^1][^2].
    references:
