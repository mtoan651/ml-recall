    question: What does backpropagation do during training?
    options:
      - text: It computes the gradient of the loss with respect to every trainable parameter.
        correct: true
      - text: It decides how the data is split into training, validation and test sets.
        why: The split is fixed before training starts.
      - text: It assigns labels to new, unseen examples.
        why: Predicting on new inputs is inference, not training.
      - text: It chooses the decision threshold used on the test set.
        why: A threshold is a separate decision rule.
    explanation: Backpropagation applies the chain rule backwards through the network to obtain $\partial L / \partial \theta$ for all weights and biases; an optimizer then uses these gradients to update the parameters [^1][^2].
