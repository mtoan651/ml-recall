  - id: neural-networks-001
    type: single
    question: Select the sentence that best describes the terms "model", "architecture", and "weights".
    options:
      - text: If a model is a building, its architecture is the blueprint and the weights are the people living inside.
        why: Following this metaphor, the weights would be the bricks and other materials used to construct the building.
      - text: An architecture is a map to build a model and its weights are the cities represented on the map.
        why: The problem with this metaphor is that a map usually represents one existing reality (there is only one city in France named Paris). For a given architecture, multiple weights are possible.
      - text: An architecture is a succession of mathematical functions to build a model and its weights are those functions parameters.
        correct: true
    explanation: The same set of mathematical functions (architecture) can be used to build different models by using different parameters (weights). [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 1: Transformer models'
        url: https://huggingface.co/learn/llm-course/chapter1/1
    source:
      id: hf-llm-course
      ref: chapter1/7#q7
      url: https://huggingface.co/learn/llm-course/chapter1/7
