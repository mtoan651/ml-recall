      - derivatives
      - squared-error
    question: For $L = \tfrac{1}{2}(\hat y - y)^2$, what is $\partial L / \partial \hat y$ when $\hat y = 2$ and $y = 3$?
    options:
      - text: '1'
        why: 'The sign is flipped: the derivative is $\hat y - y$.'
      - text: −1
        correct: true
      - text: '0.5'
      - text: −2
        why: This forgets that the factor ½ cancels the 2 from the square.
    explanation: $\partial L / \partial \hat y = \hat y - y = 2 - 3 = -1$; the factor ½ is there exactly so that the 2 from differentiating the square cancels [^1].
