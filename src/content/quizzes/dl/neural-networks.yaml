  - id: neural-networks-111
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - softmax
      - cross-entropy
    question: |
      The output layer of a three-class classifier produces the logits $z = (1, 3, 0)$, and the observed class is the
      first one. What is the categorical cross-entropy loss (natural log)? Give 3 decimals.
    answer:
      numeric: 2.170
      tolerance: 0.002
      hint: 3 decimals
      model: $\ell = \log(e^{1} + e^{3} + e^{0}) - z_1 = \log 23.80 - 1 \approx 3.170 - 1 = 2.170$
    explanation: |
      With a one-hot target, cross-entropy is $-\log p_k$ for the observed class $k$, and with
      softmax probabilities this equals $\log\sum_j e^{z_j} - z_k$ (log-sum-exp minus the true
      logit) [^1][^2]. Here $\log(2.718 + 20.086 + 1) \approx 3.170$, so $\ell \approx 2.170$. The
      model gives the true class only $p_1 = e/23.80 \approx 0.114$ while favouring class 2, hence
      the large loss.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 58–61
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
    source:
      id: ncu-intro-dl
      ref: lecture-02/q17
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-112
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - softmax
      - numerical-stability
    question: |
      Which transformations of a logit vector $z$ leave $\mathrm{softmax}(z)$ unchanged? Select all
      that apply.
    options:
      - text: Adding 7 to every logit
        correct: true
      - text: Subtracting the largest logit from every logit
        correct: true
      - text: Multiplying every logit by 2
        why: Scaling changes the differences between logits and makes the distribution sharper.
      - text: Adding 1 to the largest logit only
        why: Raising a single logit enlarges the shared denominator, so every probability moves.
    explanation: |
      Adding the same constant $c$ to all logits multiplies the numerator and every term of the
      denominator by $e^{c}$, which cancels: softmax depends only on differences between logits
      [^1][^2]. Subtracting $\max_j z_j$ is such a shift and is used to avoid overflow in
      $\exp$. Scaling the logits (a temperature change) or shifting only some of them changes the
      differences and therefore the probabilities.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 58, 61
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html
        locator: Sec. 4.5.2 Softmax Revisited
    source:
      id: ncu-intro-dl
      ref: lecture-02/q18
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-113
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - softmax
      - cross-entropy
      - gradient
    question: |
      A softmax output layer is trained with cross-entropy against a one-hot target, and every
      predicted probability lies strictly between 0 and 1. Which statements about the gradient of
      the loss with respect to the logits are true? Select all that apply.
    options:
      - text: Its components add up to zero
        correct: true
      - text: The true class's component is its only negative component
        correct: true
      - text: It becomes zero as soon as the true class gets the largest probability
        why: The gradient is $p - y$, which vanishes only when the true class has probability 1; a correct but unsure prediction still produces a gradient.
      - text: A wrong class's component is $-p_j$, so gradient descent raises that logit
        why: The component is $+p_j$; gradient descent subtracts it and therefore lowers the logits of the wrong classes.
    explanation: |
      For softmax followed by cross-entropy, $\partial\ell/\partial z_j = p_j - y_j$ [^1][^2]. The
      true class $k$ gets $p_k - 1 < 0$ and every other class gets $p_j > 0$, so a gradient step
      raises the true logit and lowers the others. The components sum to $\sum_j p_j - 1 = 0$,
      consistent with the loss being unchanged when the same constant is added to every logit. For
      example, logits $(0, 0, \ln 2)$ give $p = (0.25, 0.25, 0.5)$ and, with class 3 observed, the
      gradient $(0.25, 0.25, -0.5)$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 85
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss (derivative with respect to the logits)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q19
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-114
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - mse
      - conditional-mean
      - multimodal
    question: |
      For one route, a delivery takes about 10 minutes half of the time and about 30 minutes the
      other half (each with a spread of about 2 minutes). A network trained with mean squared error
      sees many such examples with identical inputs. What will it learn to predict for this route?
    options:
      - text: About 20 minutes, a value that almost never actually occurs
        correct: true
      - text: About 10 minutes, the faster of the two typical outcomes
        why: MSE punishes the large errors on the 30-minute trips, which pulls the prediction toward the middle.
      - text: About 30 minutes, the slower of the two typical outcomes
        why: Predicting 30 gives large squared errors on half of the trips; the mean does better.
      - text: 10 or 30 minutes, chosen at random for each prediction
        why: A deterministic network gives one output per input; it cannot sample between modes.
    explanation: |
      Minimizing expected squared error at a fixed input yields the conditional mean of the target
      [^1][^2], here $0.5 \cdot 10 + 0.5 \cdot 30 = 20$ minutes. With two well-separated modes the
      density at 20 minutes is tiny, so the "best" point prediction is an unlikely value. A model
      that should represent several plausible outcomes needs a richer output, such as a mixture
      density network that predicts a weighted mixture of Gaussians [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 48, 65–66
      - title: 'Wikipedia: Conditional expectation'
        url: https://en.wikipedia.org/wiki/Conditional_expectation
        locator: Definitions — L² random variables (the expectation minimizes the mean squared error)
      - title: Graves (2013), Generating Sequences With Recurrent Neural Networks, arXiv:1308.0850
        url: https://arxiv.org/abs/1308.0850
        locator: Sec. 4.1 Mixture Density Outputs
    source:
      id: ncu-intro-dl
      ref: lecture-02/q20
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-115
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - chain-rule
    question: |
      A scalar weight $w$ enters the computation $z = 3w - 1$, $a = z^2$, $L = 2a$. What is
      $\partial L/\partial w$ at $w = 1$?
    answer:
      numeric: 24
      tolerance: 0.001
      hint: a number
      model: $z = 2$; $\frac{\partial L}{\partial a}\frac{\partial a}{\partial z}\frac{\partial z}{\partial w} = 2 \cdot (2 \cdot 2) \cdot 3 = 24$
    explanation: |
      The chain rule multiplies the local derivatives along the path:
      $\partial L/\partial w = (\partial L/\partial a)(\partial a/\partial z)(\partial z/\partial w)$
      [^1][^2]. At $w = 1$, $z = 2$, so the factors are $2$, $2z = 4$ and $3$, giving $24$.
      Backpropagation evaluates exactly these products, starting from the loss and moving back
      through each operation.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 72
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/calculus.html
        locator: Sec. 2.4.4 Chain Rule
    source:
      id: ncu-intro-dl
      ref: lecture-02/q21
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-116
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - backpropagation
      - computational-graph
    question: |
      A hidden activation $a = \sigma(z)$ (logistic sigmoid) feeds two later pre-activations,
      $z' = 3a + \dots$ and $z'' = -2a + \dots$. Backpropagation has already found
      $\partial L/\partial z' = 1$ and $\partial L/\partial z'' = 2$. If $z = 0$, what is
      $\partial L/\partial z$?
    answer:
      numeric: -0.25
      tolerance: 0.001
      hint: a number
      model: $\partial L/\partial a = 1 \cdot 3 + 2 \cdot (-2) = -1$; $\partial L/\partial z = -1 \cdot \sigma'(0) = -1 \cdot 0.25 = -0.25$
    explanation: |
      When a value is used by several successors, its gradient is the sum of the contributions
      along all paths [^1][^2]: $\partial L/\partial a = 3 \cdot 1 + (-2) \cdot 2 = -1$. Passing
      through the sigmoid multiplies by its local derivative
      $\sigma'(0) = \sigma(0)(1 - \sigma(0)) = 0.25$, so $\partial L/\partial z = -0.25$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 74, 78
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.3 Backpropagation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q22
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-117
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l02
      - backpropagation
      - relu
    question: |
      Use the 2–2–1 network $z^1 = xW^1 + b^1$, $a^1 = \mathrm{ReLU}(z^1)$, $\hat y = a^1 v + c$ with

      $$W^1 = \begin{bmatrix} 1 & -1 \\ 0.5 & 1 \end{bmatrix},\quad b^1 = \begin{bmatrix} -3 & 0.5 \end{bmatrix},\quad v = \begin{bmatrix} 2 \\ 0.4 \end{bmatrix},\quad c = 1,$$

      the input $x = [1, 3]$ (so $z^1 = [-0.5, 2.5]$ and $\hat y = 2$), the target $y = 3$ and the
      loss $L = \tfrac12(\hat y - y)^2$. What is $\partial L / \partial W^1_{22}$, the gradient of the
      weight from input 2 to hidden unit 2?
    answer:
      numeric: -1.2
      tolerance: 0.001
      hint: a number
      model: $\delta^2 = \hat y - y = -1$; $\partial L/\partial a^1 = \delta^2 v^\top = [-2, -0.4]$; $\delta^1 = [-2, -0.4] \odot [0, 1] = [0, -0.4]$; $\partial L/\partial W^1_{22} = x_2\,\delta^1_2 = 3(-0.4) = -1.2$.
    explanation: |
      Backpropagation starts from $\partial L/\partial\hat y = \hat y - y = -1$, sends it to the
      hidden activations through the output weights, $[-1 \cdot 2, -1 \cdot 0.4]$, and multiplies
      by the ReLU derivatives $[0, 1]$ to get $\delta^1 = [0, -0.4]$ [^1][^2]. A weight's gradient
      is its input times the $\delta$ of the unit it feeds, $\partial L/\partial W^1_{ij} = x_i\,\delta^1_j$,
      so $W^1_{22}$ gets $3 \cdot (-0.4) = -1.2$. The inactive first unit passes no gradient, so
      its incoming weights get 0 for this example.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 73, 75–77
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.3 Backpropagation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q23
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-118
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - backpropagation
      - batch
      - bias-gradient
    question: |
      A dense layer computes $Z = AW + b$ for a batch of 3 examples and 2 units, with the bias row
      $b$ broadcast to every row. Backpropagation gives the upstream gradient (the $1/B$ of the mean
      loss is already included):

      $$D = \frac{\partial L}{\partial Z} = \begin{bmatrix} 0.2 & -0.1 \\ 0.4 & 0.3 \\ -0.1 & 0.5 \end{bmatrix}.$$

      The first component of $\partial L/\partial b$ is {{1}} and the second is {{2}}.
    answer:
      blanks:
        - numeric: 0.5
          tolerance: 0.001
          hint: a number
        - numeric: 0.7
          tolerance: 0.001
          hint: a number
      model: Sum the rows of $D$ — $0.2 + 0.4 - 0.1 = 0.5$ and $-0.1 + 0.3 + 0.5 = 0.7$.
    explanation: |
      The same bias is added to every example, so its gradient accumulates the contributions of
      all rows: $\partial L/\partial b = \sum_n D_{n,:}$ [^1]. Likewise
      $\partial L/\partial W = A^\top D$ adds up the per-example products of input and upstream
      gradient, and $\partial L/\partial A = DW^\top$ passes the gradient on — the single-example
      rules stacked over the batch [^1][^2]. The $1/B$ of a mean loss should be applied only once in the
      backward pass — here it is already contained in $D$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 80–82
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.3 Backpropagation, Eqs. (5.3.11)–(5.3.12)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q24
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-119
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - binary-cross-entropy
      - sigmoid
      - gradient
    question: |
      A sigmoid output gives $p = 0.02$ for an example whose label is $y = 1$. The gradient of the
      loss with respect to the logit $z$ is {{1}} for binary cross-entropy and {{2}} for the
      half-squared error $\tfrac12(p - y)^2$. Give 4 decimals.
    answer:
      blanks:
        - numeric: -0.98
          tolerance: 0.0005
          hint: 4 decimals
        - numeric: -0.0192
          tolerance: 0.00005
          hint: 4 decimals
      model: BCE gives $p - y = -0.98$; half-squared error gives $(p - y)\,p(1 - p) = -0.98 \cdot 0.0196 \approx -0.0192$.
    explanation: |
      With BCE the sigmoid's derivative cancels and the logit gradient is $p - y$, the two-class case
      of the softmax result $\partial\ell/\partial z_j = p_j - y_j$ [^1][^2]. With squared error the
      chain rule keeps the factor $\sigma'(z) = p(1 - p)$, which is tiny when the sigmoid saturates
      [^3]. For this confidently wrong prediction BCE pushes about 50 times harder,
      which is one reason cross-entropy is preferred for sigmoid outputs.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 83
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss, Eq. (4.1.10)
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.2.2 Sigmoid Function (derivative and saturation)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q25
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-120
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - gradient-checking
      - finite-differences
    question: |
      To check a backpropagated gradient of $L(\theta) = \theta^3$ at $\theta = 2$ (exact value 12),
      you use the step $\varepsilon = 0.01$. The central difference
      $[L(\theta + \varepsilon) - L(\theta - \varepsilon)]/(2\varepsilon)$ gives {{1}}, and the
      forward difference $[L(\theta + \varepsilon) - L(\theta)]/\varepsilon$ gives {{2}}. Give 4
      decimals.
    answer:
      blanks:
        - numeric: 12.0001
          tolerance: 0.00005
          hint: 4 decimals
        - numeric: 12.0601
          tolerance: 0.00005
          hint: 4 decimals
      model: Central $= 3\theta^2 + \varepsilon^2 = 12.0001$; forward $= 3\theta^2 + 3\theta\varepsilon + \varepsilon^2 = 12.0601$.
    explanation: |
      Gradient checking compares backpropagation with a finite-difference estimate [^1]. The central
      difference cancels the first-order error term, so its error shrinks like $\varepsilon^2$
      ($0.0001$ here), while the one-sided forward difference has an error of order
      $\varepsilon$ ($0.0601$) [^2]. A much smaller $\varepsilon$ is not always better, because
      floating-point rounding errors grow as the two function values get closer.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 87–88
      - title: 'Wikipedia: Numerical differentiation'
        url: https://en.wikipedia.org/wiki/Numerical_differentiation
        locator: Finite differences; Step size
    source:
      id: ncu-intro-dl
      ref: lecture-02/q26
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-121
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - forward-pass
      - binary-cross-entropy
    question: |
      A pass/fail predictor uses column vectors: $z^1 = W^1 x + b^1$, $a^1 = \mathrm{ReLU}(z^1)$,
      $z^2 = W^2 a^1 + b^2$, $\hat y = \sigma(z^2)$, with

      $$W^1 = \begin{bmatrix} 0.5 & -1 \\ 1 & 0.5 \end{bmatrix},\quad b^1 = \begin{bmatrix} -1 \\ -1 \end{bmatrix},\quad W^2 = \begin{bmatrix} 1 & 2 \end{bmatrix},\quad b^2 = -1.$$

      A student with features $x = (2, 1)^\top$ passed ($y = 1$). What is the binary cross-entropy
      loss (natural log) of the prediction for this student? Give 4 decimals.
    answer:
      numeric: 0.1269
      tolerance: 0.0003
      hint: 4 decimals
      model: $z^1 = (1 - 1 - 1,\; 2 + 0.5 - 1) = (-1, 1.5)$, $a^1 = (0, 1.5)$, $z^2 = 0 + 3 - 1 = 2$, $\hat y = \sigma(2) \approx 0.8808$, loss $= -\ln 0.8808 \approx 0.1269$.
    explanation: |
      Row $i$ of $W^1$ holds hidden unit $i$'s weights in this column convention [^1][^2]. The hidden
      pre-activations are $(-1, 1.5)$; ReLU switches off the first unit, so $a^1 = (0, 1.5)$. The
      output logit is $1 \cdot 0 + 2 \cdot 1.5 - 1 = 2$ and $\hat y = \sigma(2) \approx 0.881$.
      For $y = 1$ the binary cross-entropy reduces to $-\log\hat y \approx 0.1269$ [^3]: the
      prediction is correct and fairly confident, so the loss is small.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 16–21
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.1 Forward Propagation
      - title: torch.nn.BCEWithLogitsLoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html
        locator: Class description (loss formula)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q03
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-122
    type: multiple
    difficulty: medium
    tags:
      - perceptron
      - logistic-regression
      - linear-separability
    question: |
      Compared with a logistic regression classifier, what are drawbacks of a classic Perceptron
      (a step activation trained with the perceptron learning rule)? Select all that apply.
    options:
      - text: Its training only converges if the classes are linearly separable
        correct: true
      - text: It outputs a class but no estimate of the class probability
        correct: true
      - text: It cannot learn a bias term, so its boundary must pass through the origin
        why: A Perceptron has a bias (threshold) weight like any linear unit, learned with the same rule.
      - text: It needs a hidden layer even to represent a linear decision boundary
        why: A single Perceptron is already a linear classifier; hidden layers are needed only for boundaries that are not linear, such as XOR.
    explanation: |
      If the training set is linearly separable, the perceptron rule is guaranteed to converge;
      otherwise there is no stable solution and it keeps updating forever [^2]. Its step activation
      also produces a hard class only, so there is no probability to read off (scikit-learn's
      `Perceptron` has no `predict_proba`). Logistic regression minimizes the log loss, so it
      converges to a reasonable solution even on non-separable data and outputs probabilities.
      Replacing the step function by a sigmoid and training with gradient descent on cross-entropy
      turns the Perceptron into exactly a logistic regression classifier [^1]. In scikit-learn the
      Perceptron is an `SGDClassifier` with the perceptron loss, which updates only on mistakes [^3].
    references:
      - source: handson-ml3
        locator: 10_neural_nets_with_keras.ipynb, Exercise solutions, 3.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/10_neural_nets_with_keras.ipynb
      - title: 'Wikipedia: Perceptron'
        locator: Learning algorithm for a single-layer perceptron, Convergence of one perceptron on a linearly separable dataset
        url: https://en.wikipedia.org/wiki/Perceptron#Convergence_of_one_perceptron_on_a_linearly_separable_dataset
      - title: 'scikit-learn user guide: Linear Models'
        locator: Sec. 1.1.13.1 Perceptron
        url: https://scikit-learn.org/stable/modules/linear_model.html#perceptron
    source:
      id: handson-ml3
      ref: 10_neural_nets_with_keras#ex3
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/10_neural_nets_with_keras.ipynb
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-123
    type: short_answer
    difficulty: easy
    tags:
      - output-layer
      - regression
      - log-transform
    question: |
      An MLP predicts house prices, which range from tens of thousands to millions of dollars. Its
      output layer is a single neuron with {{1}} activation function, and since the targets span
      several orders of magnitude, it is often trained to predict the {{2}} of the price, applying
      `exp` to its output to get the price back.
    answer:
      blanks:
        - accept:
            - no
            - none
            - linear
            - identity
            - a linear
            - an identity
            - the identity
            - no activation
          hint: one word
        - accept:
            - log
            - logarithm
            - natural log
            - natural logarithm
            - ln
            - log price
          hint: one word
      model: No activation (a linear output), and the logarithm of the price.
    explanation: |
      For regression the output neuron should be free to produce any real value, so no activation
      function is applied: the output is just $\mathbf{H}\mathbf{W}^{(2)} + \mathbf{b}^{(2)}$, a
      linear function of the last hidden layer [^2]. When targets vary over orders of magnitude,
      relative errors matter more than absolute ones, so one usually measures and learns the error
      on $\log y$; d2l's house-price model trains on the logarithm of the price [^3]. At prediction
      time, $\exp(\log v) = v$ recovers the price [^1]. (For comparison: a binary task such as spam
      detection uses one sigmoid output, and a 10-class task such as MNIST uses 10 softmax outputs
      [^1].)
    references:
