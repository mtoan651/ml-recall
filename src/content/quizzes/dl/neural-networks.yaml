  - id: neural-networks-034
    type: single
    difficulty: medium
    tags:
      - activation-functions
      - affine
      - ce6146
      - ce6146-ex03
    question: You stack several affine layers but use the identity as every activation function. What can the whole stack represent?
    options:
      - text: Only a single affine transformation
        correct: true
      - text: Any nonlinear function exactly
        why: Without a nonlinearity the stack stays affine.
      - text: A recurrent network
        why: Stacking layers does not create recurrent connections.
      - text: A function without parameters
        why: The stack still has weights and biases.
    explanation: With identity activations, $\hat y = x(W^1 W^2) + (b^1 W^2 + b^2)$ — still one weight matrix and one bias [^1]. An affine function of an affine function is affine, so nonlinear activations are what add expressive power [^2].
    references:
      - source: ncu-intro-dl
