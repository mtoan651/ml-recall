      - parameter-sharing
    question: |
      True or false: a dense layer from 20 inputs to 5 units has the same 105 parameters whether it
      processes one example or a mini-batch of 64 examples, $Z = XW + b$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: A batch does not get its own copy of the weights; every row of $X$ is multiplied by the same $W$ and receives the same broadcast bias.
    explanation: |
      In batch form $X$ stacks the 64 inputs as rows, and every row is multiplied by the same
      $20 \times 5$ weight matrix; the $1 \times 5$ bias row is broadcast to each row of $XW$
      [^1][^2]. The layer has $20 \cdot 5 + 5 = 105$ parameters whatever the batch size. Only the
      activations ($64 \times 5$ here) grow with the batch.
