  - id: neural-networks-099
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - xor
      - relu
    question: |
      For binary inputs $x_1, x_2 \in \{0, 1\}$, a network computes the hidden features
      $a_1 = \mathrm{ReLU}(x_1 + x_2)$ and $a_2 = \mathrm{ReLU}(x_1 + x_2 - 1.5)$ and the output
      $\hat y = a_1 + c\,a_2$. For which value of $c$ does $\hat y$ equal XOR on all four inputs?
    answer:
      numeric: -4
      tolerance: 0
      hint: a number
      model: Only $(1, 1)$ activates $a_2$ ($a_2 = 0.5$, $a_1 = 2$), so $2 + 0.5c = 0$ gives $c = -4$; the other inputs give $0, 1, 1$ already.
    explanation: |
      XOR is not linearly separable, so a single linear threshold unit cannot compute it, but one
      hidden layer of nonlinear units can [^1][^2]. Here $a_1$ counts the ones in the input, and
      $a_2$ is nonzero only for $(1, 1)$, where it equals $0.5$. The inputs $(0,0)$, $(0,1)$,
      $(1,0)$ give $\hat y = 0, 1, 1$ regardless of $c$; for $(1, 1)$ we need $2 + 0.5c = 0$, so
      $c = -4$. The hidden layer maps the four points into a space where a weighted sum separates
      the classes.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 24–28
      - title: 'Wikipedia: Perceptron'
        url: https://en.wikipedia.org/wiki/Perceptron
        locator: Power of representation — Universal approximation theorem
    source:
      id: ncu-intro-dl
      ref: lecture-02/q05
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-100
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - relu
      - autograd
      - pytorch
    question: |
      What does this code print?

      ```python
      import torch
      x = torch.tensor([-1.0, 0.0, 2.0], requires_grad=True)
      torch.relu(x).sum().backward()
      print(x.grad)
      ```
    options:
      - text: '`tensor([0., 0., 1.])`'
        correct: true
      - text: '`tensor([0., 0.5, 1.])`'
        why: PyTorch does not average the one-sided slopes at the kink; it uses 0 at exactly zero.
      - text: '`tensor([0., 1., 1.])`'
        why: The slope 1 belongs to strictly positive inputs; at zero the convention used is 0.
      - text: '`tensor([0., 0., 2.])`'
        why: These are the ReLU outputs, not the derivatives of the sum with respect to `x`.
    explanation: |
      The ReLU derivative is 0 for negative inputs and 1 for positive ones; at exactly 0 the
      derivative does not exist, and implementations pick a value — the usual convention, also
      PyTorch's, is 0 [^1][^2]. Since the loss is a plain sum, each `x.grad` entry is just the
      local slope: `[0, 0, 1]`. In practice an input lands exactly on 0 rarely, so the choice
      hardly matters.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 26, 86
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.2.1 ReLU Function
    source:
      id: ncu-intro-dl
      ref: lecture-02/q06
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-101
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - sigmoid
    question: |
      A hidden feature of a scalar input is $f(x) = c\,\sigma(wx + b)$ with the logistic sigmoid
      $\sigma$, $w = 4$, $b = -2$ and $c = 2$. Its midpoint (where $\sigma = 0.5$) is at $x =$ {{1}},
      and the slope $f'(x)$ at that point is {{2}}.
    answer:
      blanks:
        - numeric: 0.5
          tolerance: 0.001
          hint: a number
        - numeric: 2
          tolerance: 0.001
          hint: a number
      model: Midpoint where $wx + b = 0$, i.e. $x = -b/w = 0.5$; slope $c\,w\,\sigma'(0) = 2 \cdot 4 \cdot 0.25 = 2$.
    explanation: |
      The sigmoid equals 0.5 where its argument is 0, so the curve is centred at $x = -b/w = 0.5$:
      the bias shifts it sideways and the weight sets its steepness [^1]. By the chain rule
      $f'(x) = c\,w\,\sigma'(wx + b)$, and $\sigma'(z) = \sigma(z)(1 - \sigma(z))$ peaks at
      $1/4$ when $z = 0$ [^2]. The slope at the midpoint is therefore $cw/4 = 2$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 29–30
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.2.2 Sigmoid Function
    source:
      id: ncu-intro-dl
      ref: lecture-02/q07
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-102
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - prelu
      - activation-functions
    question: |
      A PReLU unit outputs $a = z$ for $z \ge 0$ and $a = \alpha z$ for $z < 0$, where the slope
      $\alpha$ is learned. At $z = -1.5$ with $\alpha = 0.1$, what is the derivative
      $\partial a / \partial \alpha$ used to update $\alpha$?
    answer:
      numeric: -1.5
      tolerance: 0.001
      hint: a number
      model: On the negative branch $a = \alpha z$, so $\partial a/\partial \alpha = z = -1.5$.
    explanation: |
      Leaky ReLU uses a constant slope on the negative side, whereas PReLU makes that slope a parameter learned by
      backpropagation [^1][^2]. On the negative branch $a = \alpha z$ is linear in $\alpha$, so
      $\partial a/\partial\alpha = z = -1.5$ (for $z \ge 0$ it would be 0). The output here is
      $a = -0.15$; raising $\alpha$ makes it more negative, which is what the negative derivative
      says.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 32–33
      - title: torch.nn.PReLU (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.PReLU.html
        locator: Class description (learnable parameter a)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q08
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-103
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - relu
      - bias
    question: |
      A hidden unit computes $\mathrm{ReLU}(wx + b)$ of a scalar input with $w = -2$ and $b = 3$.
      For which inputs is the unit active (positive output)?
    options:
      - text: $x < 1.5$
        correct: true
      - text: $x > 1.5$
        why: This ignores the negative weight, which reverses the direction of the inequality.
      - text: $x > -1.5$
        why: The threshold is $-b/w = 1.5$, not $-1.5$, and the side is also reversed.
      - text: $x < -1.5$
        why: The sign of the threshold is wrong; solve $-2x + 3 > 0$.
    explanation: |
      A ReLU unit gives a positive output exactly when its pre-activation exceeds 0: $-2x + 3 > 0 \iff x < 1.5$
      [^1][^2]. The bias moves the threshold $-b/w$, and the sign of the weight decides on which side
      of it the unit fires; on the active side the slope is $w = -2$. Units with different biases
      switch on at different inputs, which is how a hidden layer builds piecewise-linear functions.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 13, 26
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.2.1 ReLU Function
    source:
      id: ncu-intro-dl
      ref: lecture-02/q09
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-104
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - universal-approximation
    question: |
      Which statements about the universal approximation theorem for networks with one hidden layer
      (for example sigmoid units and a linear output) are correct? Select all that apply.
    options:
      - text: It covers every continuous target on a closed, bounded input region, approximated uniformly to any accuracy
        correct: true
      - text: It only asserts that a large enough finite width exists, and that width can be very large
        correct: true
      - text: It guarantees that gradient descent from a random start finds the approximating weights
        why: The theorem only asserts that suitable weights exist; it says nothing about training finding them.
      - text: It guarantees that a network fitting the training data well also predicts new inputs well
        why: Representational capacity is not generalization; a large network can fit the training set and still predict poorly.
    explanation: |
      The theorem is an existence result: for a continuous target on a compact domain and any
      tolerance $\varepsilon > 0$, some finite width achieves maximum error below $\varepsilon$
      [^1][^2]. It gives no useful bound on the width, the data or the training time, and it does
      not guarantee that an optimizer reaches those weights or that the fitted model generalizes.
      Deeper networks can often represent the same function far more compactly [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 37, 42
      - title: 'Wikipedia: Universal approximation theorem'
        url: https://en.wikipedia.org/wiki/Universal_approximation_theorem
        locator: Introduction; Arbitrary-width case
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.1.4 Universal Approximators
    source:
      id: ncu-intro-dl
      ref: lecture-02/q10
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-105
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l02
      - relu
      - function-approximation
    question: |
      A one-hidden-layer ReLU network approximates $g(x) = x^2$ on $[0, 1]$ by the piecewise-linear
      function that matches $g$ at the 5 equally spaced points $0, 0.25, 0.5, 0.75, 1$ and is linear
      in between. What is the maximum absolute error on $[0, 1]$? Give the exact value as a decimal.
    answer:
      numeric: 0.015625
      tolerance: 0.00001
      hint: a decimal, e.g. 0.0123
      model: On a piece $[a, b]$ the error is $(x - a)(b - x)$, largest at the midpoint, $(b - a)^2/4 = 0.25^2/4 = 1/64 = 0.015625$.
    explanation: |
      Such an interpolant is written with ReLU units placed at the knots,
      $f(x) = 0.25\,\mathrm{ReLU}(x) + 0.5\,\mathrm{ReLU}(x - 0.25) + 0.5\,\mathrm{ReLU}(x - 0.5) + 0.5\,\mathrm{ReLU}(x - 0.75)$,
      each output weight being the change of slope [^1]. On a piece $[a, b]$ the chord lies above the
      parabola by $f(x) - x^2 = (x - a)(b - x)$, which peaks at the midpoint with value
      $(b - a)^2/4$ — the general bound $(b - a)^2 \max|g''|/8$ for linear interpolation with
      $g'' = 2$ [^3]. With width $0.25$ that is $1/64 = 0.015625$; halving the width quarters the
      error [^3], so more hidden units buy accuracy — a concrete case of universal approximation
      [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 35–38
      - title: 'Wikipedia: Universal approximation theorem'
        url: https://en.wikipedia.org/wiki/Universal_approximation_theorem
        locator: Introduction
      - title: 'Wikipedia: Linear interpolation'
        url: https://en.wikipedia.org/wiki/Linear_interpolation
        locator: Linear interpolation as an approximation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q11
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-106
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - depth
      - linear-regions
    question: |
      On $[0, 1]$, the "tent" map $T(x) = 2\,\mathrm{ReLU}(x) - 4\,\mathrm{ReLU}(x - 0.5)$ rises from
      0 to 1 and falls back to 0, with 2 linear pieces. How many linear pieces does the three-fold
      composition $T(T(T(x)))$ have on $[0, 1]$?
    answer:
      numeric: 8
      tolerance: 0
      hint: an integer
      model: Each composition doubles the pieces, because every piece of the inner map sweeps $[0, 1]$ once and $T$ folds it in two; $2^3 = 8$.
    explanation: |
      Every linear piece of the inner map covers the whole interval $[0, 1]$, so applying $T$ again
      folds each piece in two: 2 pieces become 4, then 8 [^1]. Composing $k$ such layers, each with
      only two ReLU units, gives $2^k$ pieces, while a single hidden layer needs a number of units
      that grows with the number of pieces it must create. This is one way depth lets later layers
      reuse earlier features and represent some functions far more compactly [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 39–40
      - title: Montúfar et al. (2014), On the Number of Linear Regions of Deep Neural Networks, arXiv:1402.1869
        url: https://arxiv.org/abs/1402.1869
        locator: Abstract (deep networks re-use pieces of computation exponentially often in depth)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q12
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-107
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - multilabel
      - output-layer
    question: |
      An inspection model must report every defect visible in an image of a part: scratch, crack
      and stain can each be present or absent, in any combination. Which output layer and loss fit?
    options:
      - text: Three sigmoid outputs, trained with the sum of the three binary cross-entropies
        correct: true
      - text: A softmax over the three defects, trained with categorical cross-entropy
        why: Softmax probabilities sum to 1, which models exactly one class per image and cannot express two defects at once.
      - text: A single sigmoid output that is 1 when any defect is present
        why: This only says whether some defect exists; it cannot tell which ones.
      - text: Three identity (linear) outputs, trained with mean squared error against the 0/1 labels
        why: The outputs would not be valid probabilities; Bernoulli labels pair naturally with sigmoids and cross-entropy.
    explanation: |
      In multilabel classification each label is its own yes/no question, so each gets a Bernoulli
      model with probability $p_j = \sigma(z_j)$ [^1][^2]. Assuming labels independent given the
      input, the negative log-likelihood is the sum of the per-label binary cross-entropies, and
      the probabilities do not have to add up to 1. Softmax with categorical cross-entropy is for mutually
      exclusive classes [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 44, 63, 67
      - title: torch.nn.BCEWithLogitsLoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html
        locator: Class description (multi-label case, one sigmoid per class)
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        locator: Sec. 4.1.1.2 The Softmax
    source:
      id: ncu-intro-dl
      ref: lecture-02/q13
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-108
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - mse
      - mae
      - loss-functions
    question: |
      At one input, the observed targets are $[1, 2, 2, 9, 11]$, equally weighted. A model can only
      output a single constant $a$ here. The value of $a$ that minimizes the mean squared error is
      {{1}}, and the value that minimizes the mean absolute error is {{2}}.
    answer:
      blanks:
        - numeric: 5
          tolerance: 0.001
          hint: a number
        - numeric: 2
          tolerance: 0.001
          hint: a number
      model: MSE is minimized by the mean $25/5 = 5$; MAE by the median, 2.
    explanation: |
      The squared error $\sum_n (a - y_n)^2$ has derivative $2\sum_n (a - y_n)$, which vanishes at
      the mean, $a = 5$ [^1][^3]. The absolute error is minimized by a median, here 2: moving $a$
      away from the middle value increases the distance to more targets than it decreases [^2].
      The loss therefore decides what the network estimates — the conditional mean (pulled up by the large
      targets 9 and 11) or the conditional median (robust to them).
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 48, 50–51
      - title: 'Wikipedia: Median'
        url: https://en.wikipedia.org/wiki/Median
        locator: Optimality property
      - title: 'Wikipedia: Conditional expectation'
        url: https://en.wikipedia.org/wiki/Conditional_expectation
        locator: Definitions — L² random variables (the expectation minimizes the mean squared error)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q14
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-109
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l02
      - gaussian-nll
      - heteroscedastic
    question: |
      A regression network predicts a mean $\mu(x)$ and a log-variance $s(x) = \log\sigma^2(x)$ and
      is trained with the Gaussian negative log-likelihood
      $\tfrac12\left[(y - \mu)^2 e^{-s} + s + \log 2\pi\right]$. For an example whose residual is
      $y - \mu = 3$, which predicted variance $\sigma^2 = e^{s}$ minimizes this loss?
    answer:
      numeric: 9
      tolerance: 0.001
      hint: a number
      model: $\partial/\partial s = \tfrac12(-r^2 e^{-s} + 1) = 0 \Rightarrow e^{s} = r^2 = 9$
    explanation: |
      Setting the derivative with respect to $s$ to zero gives $r^2 e^{-s} = 1$, i.e.
      $\sigma^2 = r^2 = 9$ [^1]. The first term rewards a large variance (it down-weights the
      squared error), and the $+s$ term penalizes it, so the network learns to predict large
      variances where its errors are large — heteroscedastic, input-dependent noise [^2]. With a
      fixed common variance the second term is constant and the loss reduces to squared error.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 47, 64
      - title: Kendall & Gal (2017), What Uncertainties Do We Need in Bayesian Deep Learning for Computer Vision?, arXiv:1703.04977
        url: https://arxiv.org/abs/1703.04977
        locator: Sec. 2.2 Heteroscedastic Aleatoric Uncertainty; Sec. 3.2 Heteroscedastic Uncertainty as Learned Loss Attenuation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q15
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-110
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
