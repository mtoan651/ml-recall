  - id: neural-networks-091
    type: short_answer
    difficulty: medium
    tags:
      - swish
      - activation-functions
      - non-monotonic
    question: |
      Swish, $f(x) = x\,\sigma(x)$ with the logistic sigmoid $\sigma$, is not monotonic: it dips below
      zero for negative inputs before rising back towards 0. What is its minimum value? Round to 3
      decimals.
    answer:
      numeric: -0.278
      tolerance: 0.002
      hint: a negative number, 3 decimals
      model: $f'(x) = \sigma(x)\big(1 + x(1 - \sigma(x))\big) = 0$ at $x \approx -1.278$, where $f \approx -0.278$
    explanation: |
      $f'(x) = \sigma(x) + x\,\sigma(x)(1 - \sigma(x))$ vanishes where $1 + x(1 - \sigma(x)) = 0$, that is
      at $x \approx -1.278$; there $\sigma(x) \approx 0.218$ and $f(x) \approx -0.278$ [^2]. Swish was found
      by an automated search over activation functions, and its non-monotonic bump for negative inputs
      is one of its unusual properties [^1][^2]. For $x \to -\infty$ it tends to 0, and for large $x$ it
      behaves like $x$.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-226, p. 260; Solution SOL-226, p. 315
        url: https://arxiv.org/abs/2201.00650v2
      - title: Ramachandran, Zoph & Le (2017), Searching for Activation Functions
        locator: Sec. 4 Swish (properties, non-monotonic bump)
        url: https://arxiv.org/abs/1710.05941
    source:
      id: dl-interviews
      ref: ch8#prb226
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-092
    type: single
    difficulty: medium
    tags:
      - sigmoid
      - backpropagation
      - code-reading
    question: |
      A hand-written sigmoid layer:

      ```python
      class Sigmoid:
          def forward(self, x):
              self.x = x
              return 1 / (1 + np.exp(-x))

          def backward(self, grad):
              return self.x * (1 - self.x) * grad
      ```

      What does `backward(1.0)` return after `forward(2.0)`, and is it right?
    options:
      - text: $-2$, though the correct gradient is $\sigma(2)(1 - \sigma(2)) \approx 0.105$
        correct: true
      - text: About 0.105, which is the correct gradient $\sigma(2)(1 - \sigma(2))$
        why: '`backward` uses the stored input $x = 2$, not the output $\sigma(2) \approx 0.881$, so it computes $2 \cdot (1 - 2) = -2$.'
      - text: $-2$, which is right, because the sigmoid's derivative is $\sigma'(x) = x(1 - x)$
        why: The identity is $\sigma'(x) = \sigma(x)(1 - \sigma(x))$; it holds for the output of the sigmoid, not its input [^2].
      - text: About 0.881, the sigmoid output $\sigma(2)$
        why: '`backward` never recomputes the sigmoid; it only uses the stored input.'
    explanation: |
      The derivative of the sigmoid is $\sigma'(x) = \sigma(x)(1 - \sigma(x))$ [^2], so `backward` needs
      the *output* $s = \sigma(x)$. Storing the input and plugging it into $s(1 - s)$ gives
      $2 \cdot (1 - 2) = -2$ instead of $0.881 \cdot 0.119 \approx 0.105$, with the wrong sign [^1]. The fix
      is to save `self.s = 1 / (1 + np.exp(-x))` in `forward` and return `self.s * (1 - self.s) * grad`.
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-120, pp. 134–135; Solution SOL-120, Fig. 5.13, p. 157
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.1.2.2 Sigmoid Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
    source:
      id: dl-interviews
      ref: ch5#prb120
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-093
    type: short_answer
    difficulty: hard
    tags:
      - backpropagation
      - chain-rule
      - custom-activation
    question: |
      A tiny network has one input $y_i = 1$, a hidden unit with transfer function $x^3$ and an output
      unit with transfer function $\sin(2x)$:
      $\mathrm{net}_j = w_{ij} y_i$, $y_j = \mathrm{net}_j^3$, $\mathrm{net}_k = w_{jk} y_j$,
      $y_k = \sin(2\,\mathrm{net}_k)$, and the loss is $E = \tfrac12 (y_k - d)^2$ with target $d = 0$. For
      $w_{ij} = 0.5$ and $w_{jk} = 2$, what is $\partial E / \partial w_{ij}$? Round to 3 decimals.
    answer:
      numeric: 1.262
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $(y_k - d) \cdot 2\cos(2\,\mathrm{net}_k) \cdot w_{jk} \cdot 3\,\mathrm{net}_j^2 \cdot y_i = 0.479 \cdot 1.755 \cdot 2 \cdot 0.75 \approx 1.262$
    explanation: |
      Forward: $\mathrm{net}_j = 0.5$, $y_j = 0.125$, $\mathrm{net}_k = 0.25$, $y_k = \sin 0.5 \approx 0.479$.
      Backward, one factor per node [^1][^2]: $\delta_k = (y_k - d) \cdot 2\cos(2\,\mathrm{net}_k)
      \approx 0.479 \cdot 1.755 \approx 0.841$; $\partial E / \partial y_j = \delta_k w_{jk} \approx 1.683$;
      $\delta_j = 1.683 \cdot 3\,\mathrm{net}_j^2 = 1.683 \cdot 0.75 \approx 1.262$; and
      $\partial E / \partial w_{ij} = \delta_j y_i \approx 1.262$. A finite-difference check gives the same
      value. Only the activation derivatives ($3x^2$ and $2\cos 2x$) change compared with sigmoid units [^1].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-121, p. 135; Solution SOL-121, Eqs. (5.48)–(5.53), pp. 157–158
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
    source:
      id: dl-interviews
      ref: ch5#prb121
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-094
    type: true_false
    difficulty: easy
    tags:
      - tanh
      - saturation
      - activation-functions
    question: |
      True or false: because tanh is symmetric around 0, tanh units cannot saturate; saturation only
      affects sigmoid units.
    options:
      - text: 'True'
        why: For $\lvert x \rvert = 3$ the derivative of tanh is already below 0.01, so large pre-activations stall learning just as with the sigmoid [^2].
      - text: 'False'
        correct: true
    explanation: |
      False. $\tanh(x) = 2\sigma(2x) - 1$ is a rescaled sigmoid, so it flattens out at $\pm 1$ in the same
      way, and its derivative $1 - \tanh^2 x$ vanishes for large $\lvert x \rvert$: $\tanh'(3) \approx 0.0099$ [^1][^2].
      Its zero-centred outputs help optimization compared with the sigmoid, whose outputs are centred at
      0.5, but they do not prevent saturation [^1]. Glorot and Bengio observed that the top hidden layer
      of sigmoid networks saturates early in training, which motivated zero-centred activations and
      careful initialization [^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-220 and PRB-262, pp. 257–258 and 287; Solutions SOL-220 and SOL-262, pp. 313 and 332
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.1.2.3 Tanh Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#tanh-function
      - title: Glorot & Bengio (2010), Understanding the Difficulty of Training Deep Feedforward Neural Networks
        locator: Sec. 3.1 Experiments with the Sigmoid
        url: https://proceedings.mlr.press/v9/glorot10a.html
    source:
      id: dl-interviews
      ref: ch8#prb220
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-095
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - forward-pass
      - relu
    question: |
      A 2–2–1 network uses row vectors, a hidden ReLU layer and a linear (identity) output:
      $z^1 = xW^1 + b^1$, $a^1 = \mathrm{ReLU}(z^1)$, $\hat y = a^1 v + c$, with

      $$W^1 = \begin{bmatrix} 1 & -1 \\ 0.5 & 1 \end{bmatrix},\quad b^1 = \begin{bmatrix} -3 & 0.5 \end{bmatrix},\quad v = \begin{bmatrix} 2 \\ 0.4 \end{bmatrix},\quad c = 1.$$

      What is $\hat y$ for the input $x = [1, 3]$?
    answer:
      numeric: 2
      tolerance: 0.001
      hint: a number
      model: $z^1 = [1 + 1.5 - 3,\; -1 + 3 + 0.5] = [-0.5, 2.5]$, $a^1 = [0, 2.5]$, $\hat y = 0 \cdot 2 + 2.5 \cdot 0.4 + 1 = 2$.
    explanation: |
      Each hidden unit computes a weighted sum of all inputs plus its bias; $W^1_{ij}$ is the
      weight from input $i$ into unit $j$, so column $j$ holds unit $j$'s weights [^1]. Unit 1:
      $1(1) + 3(0.5) - 3 = -0.5$; unit 2: $1(-1) + 3(1) + 0.5 = 2.5$. ReLU zeroes the negative
      one, giving $a^1 = [0, 2.5]$, and the identity output is $0 \cdot 2 + 2.5 \cdot 0.4 + 1 = 2$.
      The first unit is inactive for this input, so its output weight has no effect here [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 15–19
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.1.3 From Linear to Nonlinear (Eq. (5.1.3)); Sec. 5.1.2.1 ReLU Function
    source:
      id: ncu-intro-dl
      ref: lecture-02/q01
