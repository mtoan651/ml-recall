  - id: neural-networks-058
    type: short_answer
    difficulty: medium
    tags:
      - backpropagation
      - chain-rule
      - linear-networks
    question: |
      A "shallow narrow" linear network predicts $\hat{y} = w_1 w_2 x$ and is trained on the squared error
      $L = (y - w_1 w_2 x)^2$. For one example with $x = 1$ and $y = 2$, and current weights $w_1 = 1.4$, $w_2 = -1.6$, what is
      $\partial L/\partial w_1$?
    answer:
      numeric: 13.568
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $-2 w_2 x (y - w_1 w_2 x) = -2(-1.6)(1)(2 + 2.24) = 13.568$
    explanation: |
      By the chain rule, $\partial L/\partial w_1 = -2\,(y - w_1 w_2 x)\cdot w_2 x$ [^1]. The prediction is $1.4 \cdot (-1.6) = -2.24$,
      so the residual is $4.24$ and the gradient is $-2 \cdot 4.24 \cdot (-1.6) = 13.568$ [^1]. Each weight's gradient is
      scaled by the other weight; in a deeper chain it is scaled by the product of all the other weights, which is how
      depth makes gradients vanish or explode [^2].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 2, Section 1.1 A Shallow Narrow Linear Net, Analytical Exercise 1.1 Loss Gradients
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
      - source: neuromatch-dl
        locator: W1D2 Tutorial 2, Section 2.1 The effect of depth
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
    source:
      id: neuromatch-dl
      ref: W1D2_LinearDeepLearning/W1D2_Tutorial2#ex1.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
