  - id: neural-networks-031
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - neuron
    question: A neuron computes $z = w_1 x_1 + w_2 x_2 + b$ with $x_1 = 2$, $x_2 = 3$, $w_1 = 1$, $w_2 = 2$ and $b = 1$. What is $z$?
    options:
      - text: '6'
      - text: '7'
      - text: '8'
        why: This forgets the bias.
      - text: '9'
        correct: true
    explanation: $z = 1 \cdot 2 + 2 \cdot 3 + 1 = 9$ — the pre-activation, before any activation function is applied [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 11–12
    source:
