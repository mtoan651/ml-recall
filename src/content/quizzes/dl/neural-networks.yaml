  - id: neural-networks-020
    type: short_answer
    difficulty: medium
    tags:
      - softmax
      - numerical-stability
    question: |
      The softmax $\hat y_j = \exp(o_j) / \sum_k \exp(o_k)$ can overflow for large logits, so
      implementations first subtract $\bar o = \max_k o_k$ from every logit. Complete the reason this
      is safe. Softmax is {{1}} to subtracting the same constant from every logit, because the factor
      $\exp(-\bar o)$ appears in the numerator and in every term of the denominator and cancels. After
      the shift, every exponent $o_j - \bar o$ is at most {{2}}, so no $\exp$ can overflow.
    answer:
      blanks:
        - accept:
            - invariant
            - shift-invariant
            - translation-invariant
            - unchanged
            - unaffected
            - insensitive
          hint: one word
        - numeric: 0
          accept:
            - zero
          hint: a number
      model: Invariant; the largest shifted logit is $0$, so every $\exp(o_j - \bar o) \in (0, 1]$.
    explanation: |
      Multiplying the numerator and the denominator by the same positive factor $\exp(-\bar o)$
      leaves the ratio unchanged, so the shifted logits give exactly the same probabilities [^1].
      With $\bar o = \max_k o_k$ the largest shifted logit is 0 and all others are negative, so each
      $\exp(o_j - \bar o)$ lies in $(0, 1]$ and the denominator lies between 1 and the number of
      classes [^1]. Underflow can still round tiny probabilities to 0, which is one reason frameworks
      combine softmax with the cross-entropy loss (the LogSumExp trick) [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html
        locator: Sec. 4.5.2 Softmax Revisited, Eqs. (4.5.1)–(4.5.2)
    source:
      id: original
      ref: neural-networks-020
    status: reviewed
