  - id: neural-networks-050
    type: short_answer
    difficulty: medium
    tags:
      - sigmoid
      - vanishing-gradients
      - saturation
    question: |
      A sigmoid unit has pre-activation $x = 10$. What is the sigmoid's derivative $\sigma'(10)$? Give
      3 significant digits.
    answer:
      numeric: 4.54e-05
      tolerance: 5e-07
      hint: a number, e.g. 1.23e-4
      model: $\sigma(10)(1 - \sigma(10)) \approx 0.99995 \times 4.54 \times 10^{-5} \approx 4.54 \times 10^{-5}$
    explanation: |
      $\sigma'(x) = \sigma(x)(1 - \sigma(x))$, which peaks at 0.25 at $x = 0$ and approaches 0 as $|x|$
      grows [^1]. At $x = 10$ it is about $4.54 \times 10^{-5}$, roughly 5,500 times smaller than at 0,
      so any gradient passing back through this saturated unit is all but erased. Large
      pre-activations arise easily, for example from large weights, and in a deep stack of sigmoid
      layers such factors multiply: this vanishing-gradient problem is why ReLU replaced the sigmoid in
      hidden layers [^2].
    references:
      - source: d2l
        locator: Sec. 5.1.2.2 Sigmoid Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
      - source: d2l
        locator: Sec. 5.4.1.1 Vanishing Gradients
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#vanishing-gradients
      - source: d2l
        locator: Sec. 5.1.4 Exercises, Exercise 7
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/mlp#ex7
      url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-051
    type: single
    difficulty: hard
    tags:
      - hidden-units
      - bottleneck
      - dead-relu
    question: |
      An MLP for 10-class Fashion-MNIST has a hidden layer with a single ReLU unit, $784 \to 1 \to 10$.
      Why is this a bad design?
    options:
      - text: The network can predict at most two of the ten classes, one on each side of the ReLU's kink
        why: The ten logits $a_k h + c_k$ are lines in $h$, and their upper envelope can include all ten, each winning on an interval; the classes are just forced into a fixed order.
      - text: A single hidden unit makes the network far too large to train in a reasonable amount of time
        why: It has 785 + 20 = 805 parameters, far fewer than softmax regression's 7,850; the problem is too little capacity, not too much.
      - text: Softmax needs at least as many hidden units as there are classes to produce normalized probabilities
        why: The softmax normalizes any vector of 10 logits; the number of hidden units does not matter for that.
      - text: All logits depend on one number, and if that ReLU unit dies, no gradient reaches the first layer
        correct: true
    explanation: |
      d2l asks why a hidden layer with a single neuron is a bad idea [^1]. The output layer computes
      the logits $o_k = a_k h + c_k$ from the single activation $h \ge 0$, so each image is summarized
      by one number and the classes have to line up along it, each winning on one interval of $h$; ten
      clothing classes rarely fit on one scale like that. ReLU makes it worse: its derivative is 0 for
      negative inputs [^2], so if the unit's pre-activation becomes negative for every input, $h$ is
      always 0, no gradient reaches the first layer or the output weights, and the network predicts the
      same probabilities for every image. With many hidden units, one dead unit leaves the others
      working.
    references:
      - source: d2l
        locator: Sec. 5.2.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp-implementation.html#exercises
      - source: d2l
        locator: Sec. 5.1.2.1 ReLU Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#relu-function
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/mlp-implementation#ex3
      url: https://d2l.ai/chapter_multilayer-perceptrons/mlp-implementation.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-052
    type: short_answer
    difficulty: easy
    tags:
      - gradients
      - tensor-shapes
      - backpropagation
    question: |
      A scalar loss $f$ is computed from a minibatch matrix $\mathbf{X}$ of shape $64 \times 784$. What
      is the shape of the gradient $\partial f / \partial \mathbf{X}$?
    answer:
      accept:
        - (64, 784)
      pattern: (torch\.size)?\(?\[?\s*64\s*[,x×]\s*784\s*\]?\)?
      hint: Two dimensions, e.g. (8, 16)
      model: $64 \times 784$, the same shape as $\mathbf{X}$
    explanation: |
      The gradient of a scalar holds one partial derivative $\partial f / \partial x_{ij}$ for every
      entry of the input, so it has exactly the input's shape [^1]. In backpropagation every gradient
      with respect to a variable or parameter matches that variable's shape, e.g.
      $\partial J / \partial \mathbf{W}^{(2)} \in \mathbb{R}^{q \times h}$ for
      $\mathbf{W}^{(2)} \in \mathbb{R}^{q \times h}$ [^2]. Only the derivative of a vector-valued output
      would be a larger object, a Jacobian.
    references:
      - source: d2l
        locator: Sec. 2.5.1 A Simple Function
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
      - source: d2l
        locator: Sec. 5.3.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/backprop#ex1
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-053
    type: single
    difficulty: medium
    tags:
      - backpropagation
      - bias
      - computational-graph
    question: |
      A one-hidden-layer network computes $\mathbf{z} = \mathbf{W}^{(1)}\mathbf{x} + \mathbf{b}^{(1)}$,
      $\mathbf{h} = \phi(\mathbf{z})$ and $\mathbf{o} = \mathbf{W}^{(2)}\mathbf{h}$, with objective
      $J = l(\mathbf{o}, y) + \frac{\lambda}{2}\left(\lVert\mathbf{W}^{(1)}\rVert_F^2 + \lVert\mathbf{W}^{(2)}\rVert_F^2\right)$;
      the bias is not regularized. What is $\partial J / \partial \mathbf{b}^{(1)}$?
    options:
      - text: $\left({\mathbf{W}^{(2)}}^\top \frac{\partial J}{\partial \mathbf{o}}\right) \odot \phi'(\mathbf{z})$
        correct: true
      - text: $\left({\mathbf{W}^{(2)}}^\top \frac{\partial J}{\partial \mathbf{o}}\right) \odot \phi'(\mathbf{z}) + \lambda\mathbf{b}^{(1)}$
        why: The penalty contains only the weight matrices, so it adds nothing to the bias gradient [^1].
      - text: $\left(\left({\mathbf{W}^{(2)}}^\top \frac{\partial J}{\partial \mathbf{o}}\right) \odot \phi'(\mathbf{z})\right)\mathbf{x}^\top$
        why: That is the data part of $\partial J / \partial \mathbf{W}^{(1)}$; the bias enters $\mathbf{z}$ with coefficient 1, not $\mathbf{x}$ [^1].
      - text: ${\mathbf{W}^{(2)}}^\top \frac{\partial J}{\partial \mathbf{o}}$
        why: This is $\partial J / \partial \mathbf{h}$; the gradient still has to pass through the activation, i.e. be multiplied elementwise by $\phi'(\mathbf{z})$ [^1].
    explanation: |
      Since $\mathbf{z} = \mathbf{W}^{(1)}\mathbf{x} + \mathbf{b}^{(1)}$, the bias enters $\mathbf{z}$
      with coefficient 1, so its gradient equals $\partial J / \partial \mathbf{z}$, which
      backpropagation computes anyway on its way to $\mathbf{W}^{(1)}$ [^1]. That quantity is
      $\frac{\partial J}{\partial \mathbf{h}} \odot \phi'(\mathbf{z})$ with
      $\frac{\partial J}{\partial \mathbf{h}} = {\mathbf{W}^{(2)}}^\top \frac{\partial J}{\partial \mathbf{o}}$
      [^1]. In the computational graph the bias is just one more input of the addition that produces
      $\mathbf{z}$ [^2]; for a minibatch, the per-example gradients are summed or averaged.
    references:
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
      - source: d2l
        locator: Sec. 5.3.2 Computational Graph of Forward Propagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#computational-graph-of-forward-propagation
      - source: d2l
        locator: Sec. 5.3.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/backprop#ex2
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-054
    type: single
    difficulty: hard
    tags:
      - symmetry
      - relu
      - positive-homogeneity
      - identifiability
    question: |
      Permuting the hidden units is one symmetry of an MLP. Which other change of the parameters leaves
      the function computed by a ReLU network exactly the same for every input?
    options:
      - text: Add the same constant to all incoming weights of one hidden unit
        why: That adds $c\sum_j x_j$ to the pre-activation, which depends on the input, so the function changes.
      - text: Scale one hidden unit's incoming weights and bias by $c > 0$ and its outgoing weights by $1/c$
        correct: true
      - text: Flip the signs of one hidden unit's incoming weights, of its bias and of all its outgoing weights
        why: That works for the odd function tanh, since $\tanh(-z) = -\tanh(z)$, but $\mathrm{ReLU}(-z) \neq -\mathrm{ReLU}(z)$.
      - text: Multiply one hidden unit's incoming weights and its outgoing weights both by $c > 0$
        why: The unit's contribution to the output then scales by $c^2$; the outgoing weights must be divided by $c$ to compensate [^1].
    explanation: |
      ReLU is positively homogeneous: $\mathrm{ReLU}(cz) = c\,\mathrm{ReLU}(z)$ for every $c > 0$ [^1].
      Scaling a unit's incoming weights and bias by $c$ therefore scales its output by $c$, and
      dividing its outgoing weights by $c$ cancels this exactly, so a whole continuum of parameter
      settings computes the same function [^1]. Like the permutation symmetry [^2], this means a
      network's parameters are not identifiable from its function; Dinh et al. use it to show that the
      flatness of a minimum can be changed without changing the function [^1].
    references:
      - title: Dinh et al. (2017), Sharp Minima Can Generalize For Deep Nets, arXiv:1703.04933
        locator: Sec. 3 Properties of Deep Rectified Networks, Definitions 4–5
        url: https://arxiv.org/abs/1703.04933
      - source: d2l
        locator: Sec. 5.4.1.3 Breaking the Symmetry
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#breaking-the-symmetry
      - source: d2l
        locator: Sec. 5.4.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/numerical-stability-and-init#ex1
      url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: neural-networks-055
    type: single
    difficulty: easy
    tags:
      - hidden-layers
      - model-complexity
    question: What is the purpose of adding hidden layers to a neural network?
    options:
      - text: To make the network run faster on GPUs
        why: More layers mean more computation; neural networks need GPUs because they are slow, not the other way round [^2].
      - text: To reduce the amount of training data needed
        why: Bigger networks have more parameters, and neural networks often need a lot of data in the first place [^2].
      - text: To learn more complex patterns and features
        correct: true
      - text: To guarantee that training finds the best weights
        why: Calling `fit` on a neural network never guarantees the optimum, with or without more layers [^2].
    explanation: |
      A neural network applies a sequence of transformations to its input; each hidden layer
      computes new features (hidden units) from the previous layer's outputs, and with a nonlinear
      function applied to each hidden unit the network can represent much more than a linear
      model [^1]. The number and size of the layers control the fundamental trade-off: more or
      bigger layers give a more complex model that can learn very complex functions [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 18: Multi-class classification and introduction to computer vision — Introduction to neural networks'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/18_intro_to_computer-vision.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 18: Multi-class classification and introduction to computer vision — Why neural networks?; Why not neural networks?'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/18_intro_to_computer-vision.ipynb
    source:
