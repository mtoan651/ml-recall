  - id: frameworks-022
    type: short_answer
    difficulty: hard
    tags:
      - jax
      - jit
      - tracing
      - pure-functions
      - side-effects
    question: |
      ```python
      import jax
      import jax.numpy as jnp

      calls = []

      @jax.jit
      def f(x):
          calls.append(1)        # a Python side effect
          return 2 * x

      for v in [1.0, 2.0, 3.0]:
          f(jnp.array(v))
      f(jnp.arange(3.0))
      f(jnp.arange(4.0))
      f(jnp.arange(4.0) + 1)
      print(len(calls))
      ```

      What does the last line print?
    answer:
      numeric: 3
      tolerance: 0
      hint: a whole number
      model: '3: one trace each for the float32 shapes `()`, `(3,)` and `(4,)`; the other calls reuse a cached compilation.'
    explanation: |
      `jax.jit` runs the Python body only to trace it: tracers record the JAX operations, and Python
      side effects such as `calls.append(1)` happen during that trace but are not part of the compiled
      computation [^1]. The compiled executable is cached under the JAX types of the arguments (shape
      and dtype): later calls with the same types never run the Python function again, while a new
      shape or dtype triggers a fresh trace [^1]. The six calls here have three distinct argument
      types: the scalars, all created the same way by `jnp.array(v)` and hence of one type;
      `float32[3]`; and `float32[4]`, shared by `jnp.arange(4.0)` and `jnp.arange(4.0) + 1`, whose
      values differ but whose type does not. So the body runs 3 times. This is why
      jitted functions must be pure: a side effect appears on the first call and then silently
      vanishes [^1][^2].
    references:
      - title: 'JAX documentation: Just-in-time compilation'
        url: https://docs.jax.dev/en/latest/201/jit.html#what-the-compiled-function-captures
        locator: What the compiled function captures; JIT and caching
      - title: 'JAX documentation: JAX - The Sharp Bits'
        url: https://docs.jax.dev/en/latest/notebooks/Common_Gotchas_in_JAX.html#pure-functions
        locator: Pure functions
