    explanation: |
      BatchNorm learns a scale $\gamma$ and a shift $\beta$ per channel, 10 + 10 = 20 parameters [^1].
      Its running mean and variance are not trained by gradient descent; they are **buffers**,
      registered with `register_buffer`, and so are not returned by `parameters()` [^2]. A
