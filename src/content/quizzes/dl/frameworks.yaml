  - id: frameworks-017
    type: single
    difficulty: medium
    tags:
      - autograd
      - in-place
      - optimizer
      - pytorch
    question: |
      A hand-written SGD step updates a weight in place:

      ```python
      w = torch.ones(3, requires_grad=True)
      w -= 0.1 * torch.ones(3)
      ```

      What happens on the last line?
    options:
      - text: It raises a `RuntimeError`, because a leaf tensor that requires grad is modified in place
        correct: true
      - text: '`w` becomes `[0.9, 0.9, 0.9]` and remains a leaf that requires grad'
        why: That is the result of the same line inside `with torch.no_grad():`, the usual way to write a manual update.
      - text: '`w` becomes `[0.9, 0.9, 0.9]` and silently loses `requires_grad`'
        why: In-place operations never switch `requires_grad` off; PyTorch refuses the operation instead.
      - text: The update is recorded in the graph, so the next `backward()` also differentiates through it
        why: Autograd does not allow an in-place change of a leaf that requires grad to be recorded; it raises an error.
    explanation: |
      A leaf tensor with `requires_grad=True` is where gradients are accumulated, and PyTorch does not
      let an in-place operation that autograd would have to record overwrite it: the line raises
      `RuntimeError: a leaf Variable that requires grad is being used in an in-place operation`.
      Parameter updates are meant to run in no-grad mode, where operations are not recorded; the docs
      name optimizer updates as a typical use [^1]. `with torch.no_grad(): w -= 0.1 * w.grad` is what
      `torch.optim.SGD` effectively does: its step is $\theta_t = \theta_{t-1} - \gamma g_t$, run in
      a `torch.no_grad()` context [^2].
    references:
      - title: 'PyTorch documentation: Autograd mechanics'
        locator: No-grad Mode
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#no-grad-mode
