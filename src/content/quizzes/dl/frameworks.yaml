  - id: frameworks-003
    type: multiple
    difficulty: medium
    question: |
      You rerun the same training job (same model, data and settings) on a cloud compute cluster
      with more nodes. Which of these change as a result? Select all that apply.
    options:
      - text: Responsiveness (how soon training finishes)
        correct: true
      - text: Cost (a larger cluster is billed for more nodes)
        correct: true
      - text: The accuracy the trained model reaches
        why: Accuracy depends on the data, the model and its settings; more machines make the same training finish sooner, not end more accurate.
    explanation: |
      Larger clusters are more expensive but more responsive: the more nodes, the sooner the training
      finishes [^1]. Cluster size is therefore a trade-off between time and money; with time to spare
      but a tight budget, a small cluster is the better start [^1]. The accuracy of the model depends
      on the data, the algorithm and its settings, so running the same training on more machines makes
      it finish sooner without making the model more accurate.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#221-choosing-the-right-options-for-your-compute-resources
        locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.2.1 Choosing the right options (Cluster Size) and 2.2.2 Creating a compute cluster'
    source:
      id: ms-ds-for-beginners
      ref: quiz-36/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
