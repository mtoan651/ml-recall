  - id: frameworks-006
    type: single
    difficulty: easy
    question: What is ONNX (Open Neural Network Exchange) used for?
    options:
      - text: Training neural networks faster by spreading the work over several GPUs
        why: That is distributed training (for example PyTorch's DistributedDataParallel); ONNX only describes and stores models [^1].
      - text: Saving trained models in a common format that other frameworks and runtimes can load and run
        correct: true
      - text: Labeling raw training data automatically, so that a neural network can then be trained on it
        why: ONNX never touches the training data; it is a file format for models that are already trained [^1].
    explanation: |
      ONNX is an open format for representing machine-learning models: a common set of operators and
      a common file format, so that a model can be used with many frameworks, tools, runtimes and
      compilers [^1]. PyTorch's `torch.onnx` exports a model's computation graph to ONNX, and the
      exported model can then be run by any ONNX-compatible runtime such as ONNX Runtime [^2];
      scikit-learn models can be converted too, to serve predictions without Python [^3]. ONNX does
      not train models or label data; a model exported to ONNX can, for example, run inside a
      JavaScript web app [^4].
    references:
      - title: 'ONNX: Open Neural Network Exchange (project home page)'
        url: https://onnx.ai/
        locator: Home page introduction
      - title: 'PyTorch documentation: torch.onnx'
        url: https://docs.pytorch.org/docs/stable/onnx.html#overview
        locator: Overview
      - title: 'scikit-learn User Guide: Model persistence'
        url: https://scikit-learn.org/stable/model_persistence.html#onnx-persistence
        locator: Sec. 11.2 ONNX
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#considerations
        locator: 'Lesson: Build a web app to use a ML model, sec. Considerations'
    source:
