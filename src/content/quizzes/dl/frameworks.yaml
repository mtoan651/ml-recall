  - id: frameworks-015
    type: short_answer
    difficulty: medium
    tags:
      - autograd
      - detach
      - pytorch
    question: |
      What does the last line print?

      ```python
      x = torch.tensor(3.0, requires_grad=True)
      y = x.detach() ** 2 + 2 * x
      y.backward()
      print(x.grad)
      ```
    answer:
      numeric: 2
      tolerance: 0
      hint: a number
      model: '`tensor(2.)`: the detached term is a constant for autograd.'
    explanation: |
      `x.detach()` returns a new tensor that shares the value 3 but is cut off from the graph and
      never requires gradients [^1]. Autograd therefore sees $y = c^2 + 2x$ with a constant $c$, and
      $dy/dx = 2$. Without `.detach()` the result would be $2x + 2 = 8$. The same idea is used
      whenever a value must enter a loss as a fixed target, e.g. the target network's output in DQN.
    references:
