    reviewed_by: claude
  - id: frameworks-023
    type: single
    difficulty: medium
    tags:
      - mixed-precision
      - float16
      - loss-scaling
      - underflow
      - floating-point
    question: |
      In float16 mixed-precision training, the loss is multiplied by a large factor $S$ (e.g. 1024)
      before `backward()`, and the gradients are divided by $S$ again before the optimizer step. What
      problem does this solve?
    options:
      - text: Small gradients would underflow to zero in float16; scaling moves them into its range
        correct: true
      - text: It raises the effective learning rate $S$-fold to make up for float16's low precision
        why: The gradients are unscaled before the optimizer step, so the scale factor does not change the size of the update or interfere with the learning rate [^1][^2].
      - text: It stops large gradients from overflowing to infinity in float16
        why: Scaling up makes overflow more likely, not less; when `inf` or `NaN` gradients appear, the update is skipped and $S$ is lowered [^1].
      - text: It lets the optimizer update float16 weights directly, without a float32 master copy
        why: Loss scaling protects the gradient values; the float32 master copy of the weights is a separate technique, needed because tiny updates vanish when added to float16 weights [^1].
    explanation: |
      float16 has 5 exponent bits: its largest finite value is 65504 and its smallest positive
      (subnormal) value is $2^{-24} \approx 6 \times 10^{-8}$ [^3]. Gradients smaller than that flush to
      zero, and the updates of the corresponding parameters are lost [^2]. In Micikevicius et al.'s
      SSD example many activation gradients fell below this range although values down to $2^{-27}$
      mattered, and scaling by 8 was enough to match float32 accuracy [^1]. Multiplying the loss by
      $S$ multiplies every gradient by $S$ through the chain rule at no extra cost, and dividing by $S$
      before the update keeps the step unchanged [^1][^2]. bfloat16 keeps float32's 8 exponent bits and
      hence its range [^4], so gradients that underflow in float16 stay representable: PyTorch's
      float16 recipe pairs autocasting with a gradient scaler, while its bfloat16 mixed precision on
      CPU uses autocasting alone [^2].
    references:
      - title: Micikevicius et al. (2018), Mixed Precision Training, ICLR, arXiv:1710.03740
        url: https://arxiv.org/abs/1710.03740
        locator: Sec. 3.1 FP32 Master Copy of Weights; Sec. 3.2 Loss Scaling; Sec. 5 Conclusions
