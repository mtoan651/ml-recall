      - prng-key
      - reproducibility
      - pure-functions
    shuffle: false
    question: |
      ```python
      import jax

      key = jax.random.key(0)
      a = jax.random.normal(key, (3,))
      b = jax.random.normal(key, (3,))
      ```

      True or false: `a` and `b` contain different random numbers.
    options:
      - text: 'True'
        why: JAX has no hidden generator state that advances between calls; `normal` is a pure function of its key, so the same key gives the same sample [^1].
      - text: 'False'
        correct: true
    explanation: |
      Every function in `jax.random` is a pure, deterministic function of the key it receives: called
      twice with the same key, it returns the same numbers, by design [^1]. This differs from NumPy's
      global generator, which silently advances after each draw [^1]. To get new numbers you
      derive new keys, e.g. `key, subkey = jax.random.split(key)`, and you never reuse a key unless you
      want identical outputs [^1]. JAX avoids hidden state because its compiler must be free to
      reorder and parallelize work, and its transformations such as `jit` only work correctly on pure
      functions [^1][^2].
    references:
