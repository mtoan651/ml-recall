  - id: frameworks-005
    type: short_answer
    difficulty: easy
    question: |
      In Keras, a model is first configured for training with `model.compile(optimizer="adam",
      loss="sparse_categorical_crossentropy")`. Complete the call that then trains it for 5 epochs:
      `model.`{{1}}`(x_train, y_train, epochs=5)`
    answer:
      blanks:
        - accept:
            - fit
          hint: a method name
    explanation: |
      High-level APIs such as Keras treat a network as a sequence of layers; training usually means
      preparing the data and calling a `fit` function [^1]. In Keras, `compile` only configures the
      optimizer, loss and metrics, and `Model.fit` then trains the model for a fixed number of epochs
      (passes over the dataset) [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md
        locator: 'Lesson: Neural Network Frameworks, high-level APIs'
      - title: Keras documentation
        url: https://keras.io/api/models/model_training_apis/
        locator: 'Model training APIs: compile method and fit method'
    source:
      id: ms-ai-for-beginners
      ref: quiz-205/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
    status: draft
  - id: frameworks-006
    type: single
    difficulty: easy
    question: What is ONNX (Open Neural Network Exchange) used for?
    options:
      - text: Training neural networks faster by spreading the work over several GPUs
      - text: Saving trained models in a common format that other frameworks and runtimes can load and run
        correct: true
      - text: Labeling raw training data automatically, so that a neural network can then be trained on it
    explanation: |
      ONNX is an open format for representing machine-learning models: a common set of operators and
      a common file format, so that a model can be used with many frameworks, tools, runtimes and
      compilers [^1]. PyTorch's `torch.onnx` exports a model's computation graph to ONNX, and the
      exported model can then be run by any ONNX-compatible runtime such as ONNX Runtime [^2];
      scikit-learn models can be converted too, to serve predictions without Python [^3]. ONNX does
      not train models or label data; the curriculum uses it to run an already trained model inside
      a JavaScript web app [^4].
    references:
      - title: 'ONNX: Open Neural Network Exchange (project home page)'
        url: https://onnx.ai/
        locator: Home page introduction
      - title: 'PyTorch documentation: torch.onnx'
        url: https://docs.pytorch.org/docs/stable/onnx.html#overview
        locator: Overview
