  - id: frameworks-001
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
    question: Which pair consists of two deep learning frameworks?
    options:
      - text: Python and JupyterLab
        why: A programming language and a notebook environment.
      - text: Keras and PyTorch
        correct: true
      - text: CPU and GPU
        why: These are hardware.
      - text: Training set and test set
        why: These are data splits.
    explanation: PyTorch provides tensors, automatic differentiation and neural-network building blocks; Keras is a high-level API that can run on TensorFlow, JAX or PyTorch backends [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 96–97
    source:
      id: ncu-intro-dl
      ref: exercise-01/q09
    status: reviewed
  - id: frameworks-002
    type: single
    difficulty: easy
    question: In which case do you need a GPU rather than a CPU?
    options:
      - text: When you fit a small decision tree on tabular data
      - text: When you load and clean a CSV file
      - text: When you train a deep neural network
        correct: true
    explanation: |
      A CPU is built to run a wide range of tasks quickly but with limited concurrency, while a GPU
      is built for parallel computing, which makes it much faster at training deep learning models
      [^1]. Deep learning is compute-hungry, and its large matrix operations map well onto a GPU's
      thousands of simple cores working in parallel [^2]. Fitting a small decision tree or loading and
      cleaning a file is light work that a CPU handles well, and a GPU would only add cost [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#221-choosing-the-right-options-for-your-compute-resources
        locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.2.1 Choosing the right options for your compute resources'
      - source: d2l
        url: https://d2l.ai/chapter_computational-performance/hardware.html
        locator: Sec. 13.4 Hardware
    source:
      id: ms-ds-for-beginners
      ref: quiz-35/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
    status: draft
  - id: frameworks-003
    type: multiple
    difficulty: medium
    question: |
      You rerun the same training job (same model, data and settings) on a compute cluster
      with more nodes. Which of these change as a result? Select all that apply.
    options:
      - text: Responsiveness (how soon training finishes)
        correct: true
      - text: Cost
        correct: true
      - text: The accuracy the trained model reaches
    explanation: |
      Larger clusters are more expensive but more responsive: the more nodes, the shorter the
      training [^1]. The lesson presents cluster size purely as this trade-off between time and
      money [^1]. The accuracy of the model depends on the data, the algorithm and its settings, so
      running the same training on more machines makes it finish sooner without making the model
      more accurate.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#221-choosing-the-right-options-for-your-compute-resources
        locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.2.1 Choosing the right options (Cluster Size) and 2.2.2 Creating a compute cluster'
    source:
      id: ms-ds-for-beginners
      ref: quiz-36/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
    status: draft
  - id: frameworks-004
    type: single
    difficulty: easy
    question: Why do deep learning frameworks such as PyTorch and TensorFlow support running computations on GPUs or TPUs?
    options:
      - text: Training needs a huge number of tensor operations, and a GPU or TPU can run many of them in parallel
        correct: true
      - text: Only a GPU can compute exact gradients; on a CPU, the framework can only approximate them numerically
      - text: A GPU holds the whole dataset in its memory, so minibatches are no longer needed
      - text: Backpropagation is defined only for code that runs on a GPU
    explanation: |
      A framework has to do two things: operate on tensors and compute gradients for gradient
      descent [^1]. Deep network training requires a very large amount of computation, so being able
      to parallelise it on GPUs or other specialised units such as TPUs is very important [^1]. Both
      TensorFlow and PyTorch run the same tensor and gradient operations on CPU and GPU [^1], so the
      GPU makes training faster, not more exact, and backpropagation works on either device. Training
      still uses minibatches drawn from the dataset (stochastic gradient descent) [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md
        locator: 'Lesson: Neural Network Frameworks, introduction'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#gradient-descent-optimization
        locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, sec. Gradient Descent Optimization'
    source:
      id: ms-ai-for-beginners
      ref: quiz-105/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
