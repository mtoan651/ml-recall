  - id: frameworks-019
    type: multiple
    difficulty: easy
    tags:
      - computation-graph
      - eager-execution
      - symbolic-programming
      - compilation
    question: |
      A deep learning framework can run each tensor operation as soon as Python reaches it (eager,
      imperative or define-by-run execution), or first build the whole computation as a graph and
      then compile and run it (symbolic or define-and-run execution). Which statements are true?
      Select all that apply.
    options:
      - text: In eager mode you can `print` any intermediate tensor or inspect it in a Python debugger
        correct: true
      - text: A compiled graph can be optimized as a whole and run without the Python interpreter
        correct: true
      - text: Only a static graph can be differentiated automatically; eager code needs finite differences
        why: PyTorch's autograd records the operations while eager code runs and backpropagates through that record, which gives exact gradients [^2].
      - text: Eager execution is always faster, since it skips the compilation step entirely
        why: Every eager operation goes through the Python interpreter, and on fast GPUs this overhead can dominate; a compiled program can skip the interpreter and be rewritten as a whole [^1].
    explanation: |
      d2l contrasts the two styles. Imperative (eager) code is easier to write and to debug, because
      every intermediate value exists and can be printed or examined with Python's debugging tools.
      Symbolic code is more efficient and easier to port: the compiler sees the whole program before
      it runs, so it can rewrite and optimize it, avoid the Python interpreter's overhead and export
      the program to run outside Python [^1]. Both styles support automatic differentiation: PyTorch's
      autograd builds the graph while the forward pass runs and rebuilds it at every iteration, which
      is what lets ordinary Python control flow change the graph from one step to the next [^2].
      Hybrid programming combines them: develop and debug eagerly, then compile the finished model
      for speed and deployment [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_computational-performance/hybridize.html#symbolic-programming
        locator: Sec. 13.1 Compilers and Interpreters (13.1.1 Symbolic Programming, 13.1.2 Hybrid Programming)
      - title: 'PyTorch documentation: Autograd mechanics'
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#how-autograd-encodes-the-history
        locator: How autograd encodes the history
    source:
      id: original
      ref: frameworks-019
    status: reviewed
    reviewed_by: claude
  - id: frameworks-020
    type: single
    difficulty: medium
    tags:
      - computation-graph
      - tracing
      - control-flow
      - graph-capture
      - pytorch
    question: |
      A simple tracer, such as PyTorch's `torch.jit.trace`, runs a function once on an example input
      and records the tensor operations that execute. Plain Python values, such as the outcome of an
      `if` test, are frozen as constants, and no check on them is recorded. The function below is
      traced with the example input `torch.ones(3)`:

      ```python
      def f(x):
          if x.sum() > 0:
              return x * 2
          return -x
      ```

      What does the recorded graph return when it is then called with `-torch.ones(3)`?
    options:
      - text: '`tensor([-2., -2., -2.])`'
        correct: true
      - text: '`tensor([1., 1., 1.])`'
        why: That is what calling `f` itself returns. The graph contains only `x * 2`, the branch taken for the example input; the `if` test was never recorded [^1].
      - text: '`tensor([2., 2., 2.])`'
        why: The tracer records operations, not the example's output; the recorded `x * 2` is applied to the new input, which gives −2 in every entry.
      - text: An error, because the new input takes a different branch than the example did
        why: A simple tracer records no check on the branch, so the graph runs and silently returns a wrong result; `torch.jit.trace` only warns while tracing. `torch.export`, in contrast, refuses to capture such data-dependent control flow in the first place [^2].
    explanation: |
      The test `x.sum() > 0` turned into a Python boolean during tracing, so only the operations of
      the branch taken for `torch.ones(3)`, namely `x * 2`, are in the graph, and the traced function
      runs that same graph on any input [^1]. Called on `-torch.ones(3)`, it gives $-2$ in every
      entry, while `f` itself would return ones. `torch.jit.trace` (now deprecated) behaves exactly
      like this and only emits a `TracerWarning` while tracing. The newer tools deal with the problem
      explicitly: `torch.export` must capture a full graph, so it raises an error on data-dependent
      control flow and asks you to rewrite it with explicit control-flow operators, while
      `torch.compile` inserts a "graph break" and runs that part in eager Python [^2]. JAX's `jit`
      likewise raises an error when a Python `if` depends on a traced value and points to
      `jax.lax.cond` instead [^3].
    references:
      - title: 'PyTorch documentation (2.10): torch.jit.trace'
        url: https://docs.pytorch.org/docs/2.10/generated/torch.jit.trace.html
        locator: torch.jit.trace (warning on data-dependent control flow)
      - title: 'PyTorch documentation: torch.export'
        url: https://docs.pytorch.org/docs/stable/user_guide/torch_compiler/export.html#existing-frameworks
        locator: Existing frameworks (partial vs. full graph capture; comparison with torch.jit.trace); Data/Shape-Dependent Control Flow
      - title: 'JAX documentation: Just-in-time compilation'
        url: https://docs.jax.dev/en/latest/201/jit.html#why-can-t-we-just-jit-everything
        locator: Why can't we just jit everything?
    source:
      id: original
      ref: frameworks-020
    status: reviewed
    reviewed_by: claude
