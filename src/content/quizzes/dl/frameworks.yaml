  - id: frameworks-014
    type: short_answer
    difficulty: medium
    tags:
      - autograd
      - gradient-accumulation
      - pytorch
    question: |
      What does the last line print?

      ```python
      x = torch.tensor(2.0, requires_grad=True)
      for _ in range(3):
          y = x ** 2
          y.backward()
      print(x.grad)
      ```
    answer:
      numeric: 12
      tolerance: 0
      hint: a number
      model: '`tensor(12.)`: each `backward()` adds $dy/dx = 2x = 4$.'
    explanation: |
      The derivative of $x^2$ at $x = 2$ is 4. `backward()` does not overwrite `.grad`; it
      **accumulates** into the `.grad` of the leaf tensors [^1][^2], so three calls leave
      $4 + 4 + 4 = 12$. This is why training loops call `optimizer.zero_grad()` (or reset `.grad`)
      once per step, and also why gradient accumulation over several micro-batches works by simply
      calling `backward()` several times before one optimizer step.
    references:
      - title: 'PyTorch documentation: torch.Tensor.backward'
        locator: torch.Tensor.backward
        url: https://docs.pytorch.org/docs/stable/generated/torch.Tensor.backward.html
      - title: 'PyTorch documentation: Autograd mechanics'
        locator: Setting requires_grad
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#setting-requires-grad
