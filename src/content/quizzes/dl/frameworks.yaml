  - id: frameworks-018
    type: single
    difficulty: easy
    tags:
      - autograd
      - no-grad
      - pytorch
    question: |
      What happens when the last line runs?

      ```python
      x = torch.ones(2, requires_grad=True)
      with torch.no_grad():
          y = (x * 3).sum()
      y.backward()
      ```
    options:
      - text: It raises a `RuntimeError`
        correct: true
      - text: '`x.grad` becomes `[3., 3.]`'
        why: That would need the multiplication to be recorded; under `torch.no_grad()` nothing is recorded.
      - text: '`x.grad` becomes `[0., 0.]`'
        why: No graph connects `y` to `x`, so autograd cannot produce any gradient, not even zeros.
      - text: Nothing happens and `x.grad` stays `None`
        why: Calling `backward()` on a tensor without a graph is an error, not a silent no-op.
    explanation: |
      Inside `torch.no_grad()` every result has `requires_grad=False`, even when the inputs require
      gradients [^1]. `y` is therefore a plain tensor without a `grad_fn`, and `y.backward()` raises
      `RuntimeError: element 0 of tensors does not require grad and does not have a grad_fn`. Use
      no-grad mode for inference [^1] and parameter updates [^2], and compute the loss you want to
      differentiate outside it.
    references:
      - title: 'PyTorch documentation: torch.no_grad'
