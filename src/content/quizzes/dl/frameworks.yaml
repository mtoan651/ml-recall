        locator: Introduction; Gradient Scaling
      - title: 'Wikipedia: Half-precision floating-point format'
        url: https://en.wikipedia.org/wiki/Half-precision_floating-point_format#Exponent_encoding
        locator: 'IEEE 754 half-precision binary floating-point format: binary16; Exponent encoding'
      - title: 'Wikipedia: bfloat16 floating-point format'
        url: https://en.wikipedia.org/wiki/Bfloat16_floating-point_format
        locator: Introduction
