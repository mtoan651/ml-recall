    reviewed_by: claude
  - id: training-044
    type: true_false
    difficulty: medium
    tags:
      - overfitting
      - softmax-regression
      - convexity
      - early-stopping
    shuffle: false
    question: |
      True or false: softmax regression is a convex, linear model, so training it for more epochs
      cannot make its validation accuracy go down.
    options:
      - text: 'True'
        why: Convexity makes the training loss easy to minimize; it says nothing about data the model has not seen. With 7,850 parameters, softmax regression on Fashion-MNIST can still fit quirks of the training set [^1].
      - text: 'False'
        correct: true
    explanation: |
      Convexity guarantees that gradient descent heads for the global minimum of the training loss,
      but that minimum need not be the best model for new data. As training continues, the model keeps
      lowering the training loss by fitting peculiarities of the training examples, and validation
      accuracy can start to drop: the model overfits [^1]. The remedies are those for any overfitting
      model: stop when the validation error stops improving [^2], or add weight decay [^3].
    references:
      - source: d2l
        locator: Sec. 3.6.1 Training Error and Generalization Error
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
