  - id: training-029
    type: single
    difficulty: easy
    question: What is the ideal learning rate?
    options:
      - text: It is problem-dependent.
        correct: true
      - text: 0.01, a common default
        why: 0.01 is a common starting point, but the best value differs from one model and dataset to another.
      - text: 1.0, so that training converges fastest
        why: A learning rate that is too large makes the weights bounce around and can slow down or prevent convergence.
    explanation: |
      There is no universal best value: each model and dataset has its own ideal learning rate, which
      has to be found by experimenting [^1]. Too small a learning rate needs many iterations to
      converge, and too large a one never converges, with a loss that bounces around or keeps
      increasing, so 1.0 is not automatically fastest [^1]. Values such as 0.01 are only common
      starting points for that search.
    references:
      - source: google-mlcc
        locator: 'Linear regression: Hyperparameters'
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters
