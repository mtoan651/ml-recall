  - id: training-069
    type: single
    difficulty: medium
    tags:
      - l2-regularization
      - embeddings
      - recommender-systems
    question: |
      A matrix-factorization recommender predicts $3.5 + \mathbf{u} \cdot \mathbf{m}$, where 3.5 is the
      mean training rating. Trained without regularization, its top recommendations are obscure movies
      rated by only a handful of users. Why does adding an L2 penalty on the embeddings fix this?
    options:
      - text: Obscure movies' embeddings shrink toward zero, so their predictions fall back to about 3.5
        correct: true
      - text: The penalty drops every movie with fewer than a set number of ratings from the training data
        why: That is the other fix, a threshold on the number of ratings; L2 regularization keeps all movies and changes the loss instead [^1].
      - text: The penalty pushes the predictions of obscure movies down to the lowest possible rating
        why: A zero embedding gives a dot product of 0, which means the average rating of 3.5, not the minimum [^1].
      - text: The penalty forces all movie embeddings to be equal, so every movie gets the same prediction
        why: Popular movies are worth large weights because they improve many predictions, so their embeddings stay informative [^1].
    explanation: |
      L2 regularization adds a weight penalty to the loss, so the model must balance accurate
      predictions against keeping embeddings small [^1]. Moving an obscure movie's embedding to fit its
      one or two ratings improves the loss very little, so its weights end up close to 0 [^1]. A movie
      whose embedding is all zeros gets output 0 for every user, which on the centered scale is the
      training average of about 3.5 stars, a sensible guess for a movie we know little about [^2].
      The regularized model also overfits less, which improves its validation error [^1].
    references:
      - source: kaggle-learn
        locator: Embeddings exercise 2, Parts 3–6 (thresholding; A whirlwind introduction to L2 regularization; regularization)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/embeddings/raw/2-exercises.ipynb
      - source: kaggle-learn
        locator: Embeddings exercise 2, Part 5 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/embeddings/ex2_factorization.py
    source:
      id: kaggle-learn
      ref: embeddings/ex2#q5
