  - id: training-051
    type: short_answer
    difficulty: easy
    tags:
      - weight-initialization
      - uniform-initialization
    question: |
      A rule of thumb initializes the weights of a layer uniformly in $[-y, y]$ with
      $y = 1/\sqrt{n}$, where $n$ is the number of inputs to each neuron. An MLP for Fashion-MNIST
      has layers 784 → 256 → 128 → 10. What is $y$ for the second layer (256 → 128)?
    answer:
      numeric: 0.0625
      tolerance: 0.0001
      hint: a number, 4 decimals
      model: '$n = 256$ inputs: $y = 1/\sqrt{256} = 1/16 = 0.0625$'
    explanation: |
      The notebook's general rule is to start weights close to zero without being too small, in
      $[-1/\sqrt{n}, 1/\sqrt{n}]$ with $n$ the neuron's fan-in [^1]; for 256 inputs that is
      $\pm 0.0625$ (for the first layer, $\pm 1/28 \approx 0.036$). Scaling with the fan-in keeps
      the variance of each neuron's summed input roughly constant across layers, the same idea
      behind Xavier initialization [^2].
    references:
      - source: udacity-dl-pytorch
        locator: Weight Initialization notebook, General rule for setting weights
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/weight-initialization/weight_initialization_solution.ipynb
