      - text: To limit the model's effective complexity and reduce overfitting
        correct: true
      - text: To add more hidden layers
      - text: To update the weights more often
    explanation: Penalties such as L1/L2, dropout, early stopping and similar techniques constrain effective capacity so that the model generalizes better to unseen data [^1][^2].
