  - id: training-102
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l03
      - regularization
    question: Which of these changes to a training setup is a form of regularization?
    options:
      - text: Adding $\lambda \sum_i w_i^2$ to the loss
        correct: true
      - text: Doubling the number of hidden units
        why: More units raise the model's capacity — the opposite of restraining it.
      - text: Continuing training after the validation loss has started to rise
        why: That is the opposite of early stopping and makes overfitting worse.
      - text: Raising the learning rate so that training converges faster
        why: The learning rate affects how the optimizer moves, not how complex the learned function may be.
    explanation: |
      Regularization techniques restrain the model's effective complexity so that it generalizes better to
      unseen data; an L2 penalty does this by making large weights costly [^1][^2]. More units or extra
      epochs past the validation minimum increase the risk of overfitting instead.
    references:
      - source: ncu-intro-dl
        locator: Exercise 2, question 15; Lecture 3, slides 59, 62
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
