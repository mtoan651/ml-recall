  - id: training-052
    type: single
    difficulty: medium
    tags:
      - saddle-point
      - loss-landscape
      - linear-networks
    question: |
      The network $\hat{y} = w_1 w_2 x$ is trained with squared error on data from $y = x$, so its minima form the curve
      $w_1 w_2 = 1$. What kind of point is $(w_1, w_2) = (0, 0)$?
    options:
      - text: 'A saddle point: the gradient is zero, the loss falls along $w_1 = w_2$ and rises along $w_1 = -w_2$'
        correct: true
      - text: 'A local minimum: every small change of the weights increases the loss'
        why: Moving along $w_1 = w_2 = \varepsilon$ gives the product $\varepsilon^2 > 0$, which moves the prediction toward the targets and lowers the loss.
      - text: 'A local maximum: the loss is largest when the network outputs zero'
        why: Moving along $w_1 = -w_2$ makes the product negative and the loss larger, so the origin is not a maximum either.
      - text: 'Not a critical point: the gradient there points toward the curve of solutions'
        why: Each partial derivative contains a factor $w_2$ or $w_1$, so at the origin the gradient is exactly zero.
    explanation: |
      The gradients are $\partial L/\partial w_1 = -2 w_2 x(y - w_1 w_2 x)$ and $\partial L/\partial w_2 = -2 w_1 x(y - w_1 w_2 x)$; both vanish at
      the origin [^1]. Along $w_1 = w_2 = \varepsilon$ the product $\varepsilon^2$ moves the output toward $y = x$ and the loss drops,
      while along $w_1 = -w_2$ the product $-\varepsilon^2$ moves it away and the loss rises, so the origin is a saddle [^1].
      Gradient descent started near it moves very slowly at first, one source of the long plateaus seen when deep
      linear networks are trained from small weights [^2].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 2, Section 1.2 Learning landscapes (Think!)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
      - title: Saxe, McClelland and Ganguli (2013), Exact solutions to the nonlinear dynamics of learning in deep linear neural networks
        url: https://arxiv.org/abs/1312.6120
        locator: Abstract
    source:
      id: neuromatch-dl
      ref: W1D2_LinearDeepLearning/W1D2_Tutorial2#think1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-053
    type: single
    difficulty: hard
    tags:
      - learning-rate
      - depth
      - linear-networks
    question: |
      A deep narrow linear network $\hat{y} = x\,w_1 w_2 \cdots w_L$ (one unit per layer) is trained by gradient descent. For
      deeper networks, the learning rate that gives fast but stable training is smaller. Why?
    options:
      - text: A step moves all $L$ weights, each by a gradient that is a product of the other $L - 1$, so the output shifts more
        correct: true
      - text: Deeper networks have more data to fit, so each step must be smaller to avoid overfitting that data
        why: The data is the same for every depth; the constraint is the stability of the updates, not overfitting.
      - text: The loss of a deeper linear network is convex, and convex losses always need smaller steps
        why: Products of weights make the loss non-convex (it has saddle points); convexity is not the reason.
      - text: PyTorch optimizers automatically lower their default learning rate as the number of layers grows
        why: An optimizer knows nothing about the depth of the network; its default learning rate is the same for any model.
    explanation: |
      With $\hat{y} = x\prod_i w_i$, the gradient for $w_k$ is the loss gradient times $x\prod_{i \neq k} w_i$, a product of $L - 1$
      weights that can explode or vanish [^1]. One gradient step changes all $L$ weights at once, so to first order the
      prediction moves by $-\eta\,\frac{\partial L}{\partial \hat{y}}\sum_k (\partial\hat{y}/\partial w_k)^2$, a sum of $L$ terms: with weights
      near 1 the output moves about $L$ times further than with a single weight. Keeping that step stable needs a learning
      rate that shrinks roughly like $1/L$; NMA's widget exercise finds the optimal learning rate falling with depth, and
      shows that it interacts with the initialization [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 2, Sections 2.1–2.3 (effect of depth, choosing a learning rate, Interactive Demo 2.3 Depth and Learning Rate)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
      - source: neuromatch-dl
        locator: W1D2 Tutorial 2, Section 2.4 Why initialization is important
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
    source:
      id: neuromatch-dl
      ref: W1D2_LinearDeepLearning/W1D2_Tutorial2#think2.3
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-054
    type: single
    difficulty: medium
    tags:
      - learning-dynamics
      - svd
      - linear-networks
    question: |
      A deep linear network is trained from very small random weights on hierarchically structured data (items such as
      canary, robin, goldfish, tuna and plants, with their features). The training loss shows a series of plateaus,
      each followed by a sudden drop. What happens at each drop?
    options:
      - text: The network picks up one more singular mode of the input–output map, the strongest (e.g. animal vs plant) first
        correct: true
      - text: A learning-rate schedule lowers the learning rate, which produces a sudden improvement
        why: The drops appear with a constant learning rate; they come from the dynamics of the weights themselves.
      - text: The network memorizes one more training example at each drop
        why: Each drop corresponds to a whole dimension of the input–output structure, shared by many items, not to a single example.
      - text: Random noise in the weights occasionally kicks the network out of a bad local minimum
        why: The plateaus are saddle regions that gradient descent leaves by itself; their timing follows the strengths of the modes.
    explanation: |
      A linear network computes $\mathbf{W}_{\text{tot}} = \mathbf{W}_L \cdots \mathbf{W}_1$, and its learning dynamics decouple along the
      singular vectors of the input–output correlations [^1][^2]. From small initial weights each mode stays near zero for
      a while, a plateau near a saddle, and then grows quickly, and modes with larger singular values are learned
      earlier [^1][^2]. With hierarchical data the strongest mode is the broadest distinction, so the network learns
      coarse categories before fine ones; with large initial weights the bumps disappear [^1].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 3, Section 1 Deep Linear Neural Nets (Interactive Demo 1, Think!) and Section 2 Singular Value Decomposition
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial3.ipynb
      - title: Saxe, McClelland and Ganguli (2013), Exact solutions to the nonlinear dynamics of learning in deep linear neural networks
        url: https://arxiv.org/abs/1312.6120
        locator: Abstract
    source:
      id: neuromatch-dl
      ref: W1D2_LinearDeepLearning/W1D2_Tutorial3#think1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial3.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-055
    type: single
    difficulty: medium
    tags:
      - early-stopping
      - learning-dynamics
      - illusory-correlation
    question: |
      A deep linear network learns the features of items from a hierarchy: canary, robin, shark and tuna (animals) and
      several plants. The feature "has bones" is true for canary, robin and tuna, but false for the shark and for all
      plants. Training is stopped early, while the loss is still on an intermediate plateau. What does the network most
      likely predict for "shark has bones"?
    options:
      - text: That the shark has bones, because so far it has learned only the broad animal-versus-plant distinction
        correct: true
      - text: That the shark has no bones, because item-specific facts are learned before broad categories
        why: 'The order is the reverse: the strongest, broadest modes are learned first and item-specific details last.'
      - text: Something close to the plant value, because sharks and plants are both unlike birds
        why: In the hierarchy the shark is an animal; the first distinction learned puts it with the other animals.
      - text: A value unrelated to the other items, because nothing has been learned yet
        why: By an intermediate plateau the strongest modes are already learned, so predictions follow the category.
    explanation: |
      Deep linear networks learn the strongest modes of the data first, so the animal-versus-plant distinction is
      learned before the details that set the shark apart [^1][^2]. While only that coarse mode is learned, the shark is
      represented like the other animals and inherits their "has bones" feature, an illusory correlation that never
      appears in the data [^1]. Training longer removes it, a warning against stopping on a plateau [^1].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 3, Section 4 Illusory Correlations
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial3.ipynb
      - title: Saxe, McClelland and Ganguli (2013), Exact solutions to the nonlinear dynamics of learning in deep linear neural networks
        url: https://arxiv.org/abs/1312.6120
        locator: Abstract
    source:
      id: neuromatch-dl
      ref: W1D2_LinearDeepLearning/W1D2_Tutorial3#ex4
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial3.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-056
    type: short_answer
    difficulty: medium
    tags:
      - rmsprop
      - adaptive-learning-rate
      - optimizers
    question: |
      RMSprop updates $v_t = \alpha v_{t-1} + (1 - \alpha)\,g_t^2$ and $w_{t+1} = w_t - \eta\,g_t/\sqrt{v_t + \epsilon}$ (element-wise). With
      $\alpha = 0.8$, $\eta = 10^{-3}$, $\epsilon = 10^{-8}$ and $v_0 = 0$, the first gradient of some weight is $g_1 = 50$. By how
      much does that weight change in the first step (magnitude)?
    answer:
      numeric: 0.002236
      tolerance: 0.00001
      hint: a number, e.g. 0.001234
      model: $v_1 = 0.2 \cdot 2500 = 500$; step $= 10^{-3} \cdot 50/\sqrt{500} = 10^{-3}/\sqrt{0.2} \approx 0.002236$
    explanation: |
      After one step $v_1 = (1 - \alpha)\,g_1^2$, so the update is $\eta\,g_1/\sqrt{(1 - \alpha)g_1^2} = \eta/\sqrt{1 - \alpha} \approx 2.24\,\eta$,
      whatever the size of $g_1$ [^1][^2]. Dividing by the running root-mean-square of the gradient makes the step depend on
      the gradient relative to its recent history, which equalizes progress across parameters with very different
      curvature, the poor-conditioning problem RMSprop addresses [^1][^2]. Because $v_0 = 0$ underestimates $v$ early on, the
      first steps are larger than later ones; Adam's bias correction fixes this start-up effect [^3].
    references:
      - source: neuromatch-dl
        locator: W1D4 Tutorial 1, Section 7 Adaptive methods, Coding Exercise 7 Implement RMSprop
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 12.8 RMSProp
        url: https://d2l.ai/chapter_optimization/rmsprop.html
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
    source:
      id: neuromatch-dl
      ref: W1D4_Optimization/W1D4_Tutorial1#ex7
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-057
    type: single
    difficulty: medium
    tags:
      - gradient-descent
      - random-search
      - high-dimensions
    question: |
      Starting from the same weights of an MLP with tens of thousands of parameters, you compare one small
      gradient-descent step with 100 random perturbations of similar size. The gradient step reduces the loss; almost
      none of the random perturbations do. Why?
    options:
      - text: The gradient is the steepest-descent direction, and a random direction in many dimensions is nearly orthogonal to it
        correct: true
      - text: Random perturbations are always larger than gradient steps, so they overshoot the minimum
        why: The comparison uses steps of similar size; the difference is the direction, not the length.
      - text: Random search only works on convex losses, and the loss of an MLP is not convex
        why: Random search struggles even on convex functions in high dimensions; the issue is how rarely a random direction aligns with the gradient.
      - text: Only the gradient step uses the labels, so random changes of the weights cannot affect the loss
        why: Any change of the weights changes the loss; random changes just do not reliably make it smaller.
    explanation: |
      For a small step $\boldsymbol\delta$ the loss changes by about $\nabla L \cdot \boldsymbol\delta$ [^1][^2]. The gradient step
      $\boldsymbol\delta = -\eta\nabla L$ makes this $-\eta\lVert\nabla L\rVert^2 < 0$, so with a suitable step size it reliably improves the loss
      [^1][^2]. A random direction in $d$ dimensions has a cosine with the gradient of order $1/\sqrt{d}$, so its first-order
      effect is tiny and curvature decides the outcome; near a minimum that mostly increases the loss. NMA also finds
      the gradient's improvement much larger at initialization than later in training, closer to an optimum [^1].
    references:
      - source: neuromatch-dl
        locator: W1D4 Tutorial 1, Section 3 High dimensional search, Think! 3 Gradient descent vs. random search
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 12.3.1 One-Dimensional Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html#one-dimensional-gradient-descent
    source:
      id: neuromatch-dl
      ref: W1D4_Optimization/W1D4_Tutorial1#think3
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-058
    type: single
    difficulty: medium
    tags:
      - overparameterization
      - non-convexity
      - overfitting
    question: |
      NMA trains MLPs of different widths and depths from several slightly perturbed initializations. Larger networks
      reach a low training loss faster and more consistently across initializations. What is a real downside of relying
      on this overparameterization?
    options:
      - text: More memory and compute per step, and a higher risk of overfitting that must be checked on held-out data
        correct: true
      - text: Larger networks always end up in worse local minima than smaller ones
        why: 'The observation is the opposite: larger networks reach a low training loss more reliably.'
      - text: Overparameterized networks can no longer be trained with gradient descent
        why: They are trained with gradient descent in the same experiment, and they train faster.
      - text: Larger networks make the loss convex, which removes the benefit of momentum
        why: Adding units does not make the loss convex; NMA's point is that good solutions become plentiful and easy to reach.
    explanation: |
      With many more parameters there are many weight configurations that reach a low loss, and an initialization is
      more likely to lie close to one of them, so training is faster and less sensitive to the starting point [^1]. The
      costs are more memory and computation per step, and a model large enough to fit the training data easily can also
      overfit it, so validation or cross-validation remains necessary [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W1D4 Tutorial 1, Section 5 Non-convexity, Interactive Demo 5 and Think! 5.1 Width and depth of the network
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
