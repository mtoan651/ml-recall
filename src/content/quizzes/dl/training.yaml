  - id: training-045
    type: multiple
    difficulty: medium
    tags:
      - batch-normalization
      - minibatches
      - prediction-mode
    question: |
      Suppose a nonlinearity normalizes each hidden unit using the mean and variance of the current
      minibatch, as batch normalization does. Which problems does this cause? Select all that apply.
    options:
      - text: With minibatches of size 1, every normalized activation is 0, so nothing can be learned
        correct: true
      - text: Prediction needs fixed statistics, such as averages from training, so outputs do not depend on the batch
        correct: true
      - text: Gradients can no longer be computed by backpropagation
        why: The batch mean and variance are differentiable functions of the batch, so backpropagation passes through them [^3].
      - text: The network can no longer be trained with minibatch SGD
        why: Batch normalization is designed for minibatch SGD; it only needs minibatches large enough for stable statistics [^1][^3].
      - text: An example's output depends on which other examples share its minibatch
        correct: true
    explanation: |
      Batch statistics couple the examples: the same input is normalized differently in different
      minibatches, which injects noise that partly acts as a regularizer [^1]. With a single example the
      mean equals the value itself, so every activation becomes 0 after subtracting it and nothing can
      be learned [^1]. And since a prediction for one input should not depend on what else is in the
      batch (and there may be no batch at all), batch normalization switches to fixed statistics
      estimated on the training data in prediction mode [^2]. Backpropagation itself is unaffected:
      the batch mean and variance are differentiable, and d2l trains its from-scratch batch
      normalization layer with ordinary autograd and minibatch SGD [^3].
    references:
      - source: d2l
        locator: Sec. 8.5.1 Training Deep Networks
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#training-deep-networks
      - source: d2l
        locator: Sec. 8.5.2.4 Batch Normalization During Prediction
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#batch-normalization-during-prediction
      - source: d2l
        locator: Sec. 8.5.3 Implementation from Scratch
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#implementation-from-scratch
      - source: d2l
        locator: Sec. 5.1.4 Exercises, Exercise 6
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/mlp#ex6
      url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: training-046
    type: single
    difficulty: medium
    tags:
      - initialization
      - symmetry
      - softmax-regression
    question: |
      In a one-hidden-layer MLP, setting all weights to the same constant is fatal, because the hidden
      units stay identical. Can you instead initialize all weights of softmax regression, which has no
      hidden layer, to the same constant?
    options:
      - text: Only if the constant is zero, since nonzero constants saturate the softmax
        why: Equal weights give equal logits and a uniform softmax whatever the constant, which is far from saturated.
      - text: 'No: equal logits make the cross-entropy loss undefined'
        why: Equal logits give the probabilities $1/q$ and a finite loss of $\log q$.
      - text: "Yes: each output's gradient $(\\hat y_k - y_k)\\mathbf{x}$ differs between classes"
        correct: true
      - text: 'No: the rows of the weight matrix stay identical forever, like hidden units in an MLP'
        why: 'Hidden units are interchangeable, but outputs are not: each belongs to its own class, and the label term $y_k$ makes their gradients differ [^1].'
    explanation: |
      With all weights equal, every logit is the same and the softmax is uniform, $\hat y_k = 1/q$. The
      gradient for output $k$'s weights is $(\hat y_k - y_k)\mathbf{x}$, since
      $\partial l / \partial o_k = \hat y_k - y_k$ [^1]: negative for the true class and positive for
      the others, so the rows of $\mathbf{W}$ separate after the first update. The symmetry problem
      arises only for hidden units, whose roles are interchangeable and which therefore receive
      identical gradients [^2]. Linear regression has no symmetry problem either, because each weight's
      gradient is scaled by its own feature.
    references:
      - source: d2l
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#softmax-and-cross-entropy-loss
      - source: d2l
        locator: Sec. 5.4.1.3 Breaking the Symmetry
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#breaking-the-symmetry
      - source: d2l
        locator: Sec. 5.4.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/numerical-stability-and-init#ex2
      url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: training-047
    type: single
    difficulty: easy
    tags:
      - early-stopping
      - compute
    question: Besides often improving generalization, what other practical benefit does early stopping have?
    options:
      - text: It makes training deterministic, so that every single run can be reproduced exactly
        why: Early stopping only decides when to stop; it does not remove the randomness of initialization or minibatch order.
      - text: It removes the need for a separate validation set during training
        why: 'The opposite: the stopping criterion is computed on the validation error [^1].'
      - text: It allows much larger learning rates without any risk of divergence
        why: Stopping early does not keep a too-large learning rate from diverging in the epochs that do run.
      - text: It saves compute, since training ends once the validation error stops improving
        correct: true
    explanation: |
      Early stopping monitors the validation error, typically once per epoch, and ends training when
      it has not improved by more than a small amount for some number of epochs, the patience [^1].
      Every epoch that is not run is saved compute: for large models trained for days on many GPUs,
      d2l notes that well-tuned early stopping can save days of time and thousands of dollars [^1]. Its
      other role is regularization, since it limits how long the model can fit noisy labels [^1].
    references:
      - source: d2l
        locator: Sec. 5.5.3 Early Stopping
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
      - source: d2l
        locator: Sec. 5.5.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/generalization-deep#ex5
      url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#exercises
