  - id: training-061
    type: short_answer
    difficulty: easy
    tags:
      - memorization
      - random-labels
      - generalization
    question: |
      A large network is trained on an image dataset with 3 balanced classes (cat, dog, wild animal) after the labels
      were randomly shuffled, so labels are unrelated to images. It reaches 100% training accuracy. About what validation
      accuracy, in percent, should you expect on correctly labelled validation images?
    answer:
      numeric: 33.3
      tolerance: 3
      hint: a percentage, e.g. 50
      model: 'Chance level: $100\%/3 \approx 33\%$'
    explanation: |
      With shuffled labels there is no relation between images and labels to learn, so 100% training accuracy can only
      come from memorizing every training example [^1][^2]. On new images the memorized labels carry no information, so
      predictions are no better than guessing among 3 balanced classes, about 33% [^1]. Training accuracy alone therefore
      says little about generalization [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W2D1 Tutorial 1, Section 3 Memorization
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D1_Regularization/instructor/W2D1_Tutorial1.ipynb
      - title: Zhang et al. (2017), Understanding deep learning requires rethinking generalization
        url: https://arxiv.org/abs/1611.03530
        locator: Sec. 2 Effective capacity of neural networks
