  - id: training-098
    type: single
    difficulty: hard
    tags:
      - layer-normalization
      - autograd
      - numerical-stability
      - epsilon
    question: |
      A hand-written layer normalization puts its smoothing term outside the square root. What does
      the last line print?

      ```python
      import torch

      x = torch.tensor([2.0, 2.0, 2.0], requires_grad=True)   # all features equal
      mean = x.mean()
      var = x.var(correction=0)
      z = (x - mean) / (torch.sqrt(var) + 1e-3)
      z.sum().backward()
      print(x.grad)
      ```
    options:
      - text: '`tensor([nan, nan, nan])`'
        correct: true
      - text: '`tensor([0., 0., 0.])`'
        why: 'That is what you get with `torch.sqrt(var + 1e-3)`: the square root is then differentiated at 0.001, not at 0.'
      - text: '`tensor([inf, inf, inf])`'
        why: The infinite derivative of `sqrt` at 0 is multiplied by zero factors of the chain rule, and inf × 0 gives nan, not inf.
      - text: A `ZeroDivisionError` is raised
        why: The forward pass divides by 0 + 0.001, which is fine; and a floating-point tensor divided by zero gives inf or nan rather than raising an exception.
    explanation: |
      The forward pass is fine: the variance is 0, the denominator is $0 + 0.001$ and `z` is all
      zeros. In the backward pass, autograd multiplies local derivatives along the path
      `x → var → sqrt(var) → z`: the derivative of $\sqrt{v}$ is $1/(2\sqrt{v})$, which is infinite
      at $v = 0$, while the other factors on that path are 0 (the gradient arriving from `z` is
      proportional to $x_i - \bar{x} = 0$, and so is $\partial v/\partial x_i = 2(x_i - \bar{x})/n$).
      In floating point $\infty \times 0 = \text{nan}$, and the nan spreads to every gradient, so
      training breaks as soon as one instance has constant features. The handson-ml3 solution
      therefore computes $\sqrt{\sigma^2 + \varepsilon}$ instead of $\sqrt{\sigma^2} + \varepsilon$
      [^1], which is also the formula of `nn.LayerNorm` [^2]; with it the same code prints
      `tensor([0., 0., 0.])`.
    references:
      - source: handson-ml3
        locator: 12_custom_models_and_training_with_tensorflow.ipynb, Exercises, 12. Implement a custom layer that performs Layer Normalization
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/12_custom_models_and_training_with_tensorflow.ipynb
      - title: 'PyTorch documentation: torch.nn.LayerNorm'
        locator: LayerNorm (formula and eps parameter)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.LayerNorm.html
    source:
      id: handson-ml3
      ref: 12_custom_models_and_training_with_tensorflow#ex12
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/12_custom_models_and_training_with_tensorflow.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-099
    type: single
    difficulty: medium
    tags:
      - quantization
      - quantization-aware-training
      - deployment
    question: |
      A model loses too much accuracy when its weights are quantized to 8 bits after training, so
      you switch to quantization-aware training. What does quantization-aware training do?
    options:
      - text: It simulates 8-bit rounding in the forward pass while training, so the weights adapt to it
        correct: true
      - text: It quantizes the trained float model once at the end, calibrating ranges on a small dataset
        why: That describes post-training quantization, the approach that already lost too much accuracy here.
      - text: It trains with 8-bit integer weights, gradients and optimizer states from the start
        why: In quantization-aware training, weights and gradients stay in floating point so they can be nudged by small updates; only the forward pass simulates the rounding.
      - text: It prunes the weights that would round to zero and then retrains the remaining weights
        why: That is pruning, a different compression technique; it does not make the model robust to quantization noise.
    explanation: |
      Quantization-aware training simulates quantized inference in the forward pass ("fake
      quantization" of weights and activations, implemented in floating point), while
      backpropagation and the stored weights stay in floating point [^2]. The model therefore
      learns weights that are robust to the quantization noise, so the final conversion to 8-bit
      integers costs much less accuracy [^1]. The paper introducing the integer-only inference scheme notes that
      simple post-training quantization works for large models but causes significant accuracy
      drops for small ones, which motivates training with simulated quantization [^2].
    references:
      - source: handson-ml3
        locator: 19_training_and_deploying_at_scale.ipynb, Exercise Solutions, 6.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/19_training_and_deploying_at_scale.ipynb
      - title: 'Jacob et al. (2018): Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference'
        locator: Sec. 3 Training with simulated quantization
        url: https://arxiv.org/abs/1712.05877
    source:
      id: handson-ml3
      ref: 19_training_and_deploying_at_scale#ex6
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/19_training_and_deploying_at_scale.ipynb
