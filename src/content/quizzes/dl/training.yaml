  - id: training-090
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - regularization-strength
      - underfitting
    question: |
      You raise the L2 regularization strength $\lambda$ far above the value that gave the best
      validation loss. What do you expect to see?
    options:
      - text: Training and validation losses both increase, because the model underfits
        correct: true
      - text: Training loss falls while validation loss rises, because the model overfits
        why: That pattern belongs to too little regularization; a large penalty restricts the model instead.
      - text: Both losses fall toward zero, because smaller weights always generalize better
        why: Beyond some point small weights cannot represent the data's structure, so even the training fit gets worse.
      - text: Only the validation loss changes; the training loss is unaffected by λ
        why: The penalty is part of the training objective, so it directly changes the fit to the training data.
    explanation: |
      $\lambda$ trades fitting the data against keeping weights small [^1]. Too small a value
      leaves the model free to overfit; too large a value forces the weights toward zero, so the
      model can no longer capture important patterns and both training and validation errors rise
      — underfitting [^2][^3]. $\lambda$ is a hyperparameter, chosen with validation data or
      cross-validation.
    references:
