  - id: training-106
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - momentum
      - optimizers
    question: |
      An optimizer updates every parameter $\theta$ with
      $$v_t = \beta\,v_{t-1} + (1 - \beta)\,g_t, \qquad \theta \leftarrow \theta - \eta\,v_t,$$
      where $g_t$ is the current gradient and $\beta \approx 0.9$. Which optimizer is this?
    options:
      - text: Momentum
        correct: true
      - text: RMSProp
        why: RMSProp averages squared gradients and divides the step by their root.
      - text: AdaGrad
        why: AdaGrad sums all squared gradients and divides the step by the root of that sum.
      - text: Adam
        why: Adam keeps this average too, but also divides by the root of an average of squared gradients, with bias correction.
    explanation: |
      $v_t$ is a velocity: a running average of past gradients in which older gradients count
      geometrically less, and the parameters move along it — the momentum method [^1]. d2l writes the same idea without the factor $(1 - \beta)$, as
      $v_t = \beta v_{t-1} + g_t$; in both forms consistent gradient directions add up while oscillating
      components cancel [^2].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 16; Lecture 3, slides 37–38
      - source: d2l
        locator: Sec. 12.6.1.3 The Momentum Method
        url: https://d2l.ai/chapter_optimization/momentum.html#the-momentum-method
    source:
      id: ncu-intro-dl
      ref: exercise-03/q16-v2
    status: reviewed
    reviewed_by: claude
  - id: training-107
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - adam
      - optimizers
    question: Adam combines the ideas of which two earlier optimizers?
    options:
      - text: Momentum and RMSProp
        correct: true
      - text: AdaGrad and Nesterov momentum
        why: Adam averages squared gradients with decay like RMSProp, not AdaGrad's growing sum, and uses plain momentum.
      - text: Mini-batch SGD and early stopping
        why: Early stopping is a regularization procedure, not part of an update rule.
      - text: Dropout and batch normalization
        why: These are layers used for regularization and normalization, not optimizers.
    explanation: |
      Adam keeps an exponential moving average of the gradients (the first moment, as in momentum) and of
      the squared gradients (the second moment, as in RMSProp), corrects both for their zero
      initialization, and scales each parameter's step by $\hat m_t / \sqrt{\hat v_t}$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 17; Lecture 3, slide 46
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
