  - id: training-091
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - batch-normalization
    question: |
      In training mode, a batch-normalization layer sees one feature with the mini-batch values
      $[1, 2, 3, 6]$. It normalizes with the batch mean and the variance computed by dividing by
      $n$ (ignore $\varepsilon$), then applies $\gamma = 2$ and $\beta = 0.5$. What is the output for
      the value 6? Give 3 decimals.
    answer:
      numeric: 3.707
      tolerance: 0.002
      hint: 3 decimals
      model: $\mu = 3$, $\sigma^2 = (4 + 1 + 0 + 9)/4 = 3.5$; $\hat x = 3/\sqrt{3.5} \approx 1.604$; $y = 2(1.604) + 0.5 \approx 3.707$.
    explanation: |
      Batch normalization standardizes each feature with the current mini-batch's mean and variance,
      $\hat x = (x - \mu_B)/\sqrt{\sigma_B^2 + \varepsilon}$, and then rescales and shifts it with the
      learned $\gamma$ and $\beta$ [^1][^2]. Here $\mu_B = 3$ and $\sigma_B^2 = 3.5$, so
      $\hat x \approx 1.604$ and the output is $\approx 3.707$. PyTorch uses this biased (divide by
      $n$) variance for normalizing in training, while its running variance is updated with the
      unbiased estimate [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 69
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html
        locator: Sec. 8.5.1 Training Deep Networks, Eqs. (8.5.1)–(8.5.2)
      - title: torch.nn.BatchNorm1d (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm1d.html
        locator: Class description (biased variance in training; unbiased running variance)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q21
    status: reviewed
    reviewed_by: claude
  - id: training-092
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - batch-normalization
    question: Which statements about batch normalization are accurate? Select all that apply.
    options:
      - text: During training, each feature is normalized with its mean and variance over the current mini-batch
        correct: true
      - text: In evaluation mode, PyTorch normalizes with running averages of the mean and variance collected during training
        correct: true
      - text: The scale γ and shift β are fixed at 1 and 0 so that outputs stay exactly standardized
        why: γ and β are learned parameters (only initialized to 1 and 0), so the layer can undo the normalization if that helps.
      - text: Each example is normalized over its own features, independently of the other examples in the batch
        why: That describes layer normalization; batch normalization computes each feature's statistics across the examples of the mini-batch.
    explanation: |
      During training BN standardizes each feature with statistics of the current mini-batch and
      then applies the learned scale $\gamma$ and shift $\beta$, which keep the layer expressive
      [^1][^2]. At prediction time batch statistics would make an example's output depend on the
      other examples in its batch, so running averages estimated during training are used instead
      [^2][^3]. Normalizing each example over its own features is layer normalization [^2]. BN was
      originally motivated by reducing "internal covariate shift", but that explanation is disputed:
      experiments found its benefit has little to do with stabilizing layer-input distributions and
      pointed to a smoother optimization landscape instead [^4]. BN is used because it speeds up and
      stabilizes training and often regularizes a little.
    references:
