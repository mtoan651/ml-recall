  - id: training-097
    type: multiple
    difficulty: hard
    tags:
      - selu
      - self-normalizing-networks
      - initialization
    question: |
      You replace batch normalization in a deep stack of dense layers by SELU activations and want
      the network to self-normalize. Which of these are required? Select all that apply.
    options:
      - text: Standardize the input features (mean 0, standard deviation 1)
        correct: true
      - text: Initialize the weights with LeCun normal initialization (variance 1/fan-in)
        correct: true
      - text: Initialize the weights with He initialization (variance 2/fan-in)
        why: The factor 2 of He initialization compensates for ReLU zeroing half its inputs. With SELU it inflates the variance layer after layer; SNNs need variance 1/fan-in.
      - text: Keep a batch-normalization layer after each SELU layer
        why: The point of SELU networks is that activations converge to zero mean and unit variance on their own, without explicit normalization layers.
    explanation: |
      Self-normalizing networks rely on a fixed point at zero mean and unit variance: if the
      inputs to a layer are standardized and the weights have zero mean and variance $1/n$
      (LeCun normal), SELU keeps the activations near mean 0 and variance 1 through many layers,
      with no batch norm needed [^2]. The paper contrasts this with the "MSRA" (He) initialization,
      whose variance $2/n$ is meant for ReLU [^2]; PyTorch's docs likewise tell you to use
      `nonlinearity='linear'` (not the ReLU gain) with Kaiming init for SNNs [^3]. The handson-ml3
      CIFAR-10 exercise lists the conditions: standardized inputs, LeCun normal initialization and
      a plain sequence of dense layers [^1]. You can check it with 50 dense SELU layers of width 100
      on standard-normal inputs: with LeCun normal init the activations stay close to mean 0 and
      standard deviation 1, while with He init their standard deviation grows layer after layer to
      far above 1 (the exact value depends on the random seed).
    references:
      - source: handson-ml3
        locator: 11_training_deep_neural_networks.ipynb, Exercises, 8. Deep Learning on CIFAR10, d.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/11_training_deep_neural_networks.ipynb
      - title: 'Klambauer et al. (2017): Self-Normalizing Neural Networks'
        locator: Section "Self-normalizing Neural Networks (SNNs)", paragraph "Initialization"; Abstract
        url: https://arxiv.org/abs/1706.02515
      - title: 'PyTorch documentation: torch.nn.SELU'
        locator: Warning (initialization for Self-Normalizing Neural Networks)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.SELU.html
    source:
