  - id: training-070
    type: single
    difficulty: medium
    tags:
      - adam
      - sign-descent
      - steepest-descent
      - norms
    question: |
      Switch off Adam's moving averages and its $\epsilon$ ($\beta_1 = \beta_2 = \epsilon = 0$). Each
      weight then moves by $-\eta\, g_i / \sqrt{g_i^2} = -\eta\,\mathrm{sign}(g_i)$. This update direction
      is steepest descent under which norm of the weight change?
    options:
      - text: The max norm $\ell_\infty$
        correct: true
      - text: The Euclidean $\ell_2$ norm
        why: Steepest descent under $\ell_2$ moves along $-g$ itself, which is plain gradient descent [^1].
      - text: The $\ell_1$ norm
        why: Under $\ell_1$ the best unit step puts all of its length on the coordinate with the largest $\lvert g_i \rvert$, which is coordinate descent.
      - text: The spectral norm
        why: The spectral norm is a matrix norm; steepest descent under it orthogonalizes the gradient matrix to $UV^\top$ rather than taking elementwise signs [^2].
    explanation: |
      Steepest descent minimizes $g^\top \Delta w + \tfrac{\lambda}{2}\lVert \Delta w \rVert^2$; its
      direction is the unit vector $t$ that minimizes $g^\top t$ [^1]. Under the max norm every
      coordinate may move by up to 1, so the best $t$ is $-\mathrm{sign}(g)$, and the step length is the
      dual norm $\lVert g \rVert_1$ divided by $\lambda$. With the moving averages off, Adam's
      $\hat m_t / \sqrt{\hat v_t}$ is exactly $\mathrm{sign}(g)$ [^3], which is why Adam is described as
      steepest descent under an $\ell_\infty$-type norm [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Steepest descent, Problems 1–3
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: Bernstein & Newhouse (2024), Old Optimizer, New Norm — An Anthology, arXiv:2409.20325
        locator: Story I, Adam as steepest descent under the max-of-max norm
        url: https://arxiv.org/abs/2409.20325
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm, Eqs. (12.10.1)–(12.10.3)
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q3c
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: training-071
    type: single
    difficulty: hard
    tags:
      - steepest-descent
      - spectral-norm
      - orthogonalized-updates
      - svd
    question: |
      A layer's gradient matrix has the reduced SVD $G = U \Sigma V^\top$. Steepest descent under the
      spectral norm $\lVert \cdot \rVert_2$ (the largest singular value) solves
      $$\operatorname*{arg\,min}_{\Delta W}\Big[\operatorname{tr}(G^\top \Delta W) + \tfrac{\lambda}{2}\lVert \Delta W \rVert_2^2\Big].$$
      Which update is the solution?
    options:
      - text: $-\frac{\operatorname{tr}\Sigma}{\lambda}\, U V^\top$
        correct: true
      - text: $-\frac{1}{\lambda}\, U \Sigma V^\top$
        why: That is $-G/\lambda$, plain gradient descent, which is steepest descent under the Frobenius norm.
      - text: $-\frac{\sigma_{\max}}{\lambda}\, U V^\top$
        why: The direction is right, but the step length is the dual norm of $G$, the nuclear norm $\operatorname{tr}\Sigma$ (sum of singular values), not its largest singular value.
      - text: $-\frac{\operatorname{tr}\Sigma}{\lambda}\, \mathrm{sign}(G)$
        why: Elementwise signs are steepest descent under a max-of-entries norm; under the spectral norm the update sets all singular values equal instead [^2].
    explanation: |
      As for vectors, the solution is $-\frac{\lVert G \rVert^\dagger}{\lambda}$ times the unit-norm
      matrix $T$ that maximizes $\operatorname{tr}(G^\top T)$, where $\lVert \cdot \rVert^\dagger$ is the
      dual norm [^1]. Over matrices with spectral norm 1 the maximum is $\operatorname{tr}\Sigma$,
      reached at $T = UV^\top$, so the dual norm is the nuclear norm and the step is
      $-\frac{\operatorname{tr}\Sigma}{\lambda} UV^\top$ [^1]. The update keeps the gradient's singular
      vectors but sets every singular value to the same size; Shampoo without accumulation takes
      exactly this direction [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Steepest descent, Problem 4
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: Bernstein & Newhouse (2024), Old Optimizer, New Norm — An Anthology, arXiv:2409.20325
        locator: Story II, Shampoo as steepest descent under the spectral norm (Eq. 16)
        url: https://arxiv.org/abs/2409.20325
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q4b
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: training-072
    type: short_answer
    difficulty: medium
    tags:
      - initialization
      - spectral-norm
      - hyperparameter-transfer
    question: |
      A layer maps $d_{\text{in}} = 1024$ inputs to $d_{\text{out}} = 256$ outputs. It is initialized as
      $W = \sqrt{d_{\text{out}} / d_{\text{in}}}\; M$, where $M \in \mathbb{R}^{256 \times 1024}$ is a random
      semi-orthogonal matrix (orthonormal rows). What is the spectral norm of $W$?
    answer:
      numeric: 0.5
      tolerance: 0.001
      hint: a number
      model: All singular values of $M$ are 1, so $\lVert W \rVert_2 = \sqrt{256/1024} = 0.5$
    explanation: |
      A semi-orthogonal matrix has all its singular values equal to 1, so $W$'s singular values are all
      $\sqrt{256/1024} = 0.5$ [^1]. The factor is chosen so that an input whose entries have RMS size 1,
      $\lVert x \rVert_2 = \sqrt{1024} = 32$, gives an output whose entries have RMS size at most 1,
      $\lVert Wx \rVert_2 \le 0.5 \times 32 = 16 = \sqrt{256}$, with equality along the top singular
      directions [^2]. Initializing and updating every layer at this scale is what lets a learning rate
      tuned on a narrow network transfer to a wide one [^1][^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Hyperparameter transfer, Problems 7 and 9
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: Yang, Simon & Bernstein (2023), A Spectral Condition for Feature Learning, arXiv:2310.17813
        locator: Abstract and Sec. 1 (spectral scaling condition)
        url: https://arxiv.org/abs/2310.17813
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q9
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: training-073
    type: single
    difficulty: easy
    tags:
      - weight-decay
      - svd
      - regularization
    question: |
      After every gradient step you apply weight decay $W \leftarrow 0.999\,W$. Write
      $W = \sum_i \sigma_i u_i v_i^\top$ (its singular value decomposition). What does one decay step do?
    options:
      - text: Multiplies every $\sigma_i$ by 0.999 and leaves the singular vectors unchanged
        correct: true
      - text: Subtracts 0.001 from every $\sigma_i$ and leaves the singular vectors unchanged
        why: Subtracting a constant is soft-thresholding; weight decay is a multiplication, so each $\sigma_i$ shrinks in proportion to its size.
      - text: Shrinks the small $\sigma_i$ much faster than the large ones
        why: All singular values are multiplied by the same factor, so their ratios stay the same.
      - text: Shortens the singular vectors $u_i$ and $v_i$ by the factor 0.999
        why: Singular vectors have unit length by definition; the scaling goes into the $\sigma_i$.
    explanation: |
      $0.999\,W = \sum_i (0.999\,\sigma_i)\,u_i v_i^\top$, and the $u_i$, $v_i$ remain unit-length and
      orthonormal, so this is again an SVD [^1]. Weight decay therefore shrinks the whole matrix
      uniformly toward zero without rotating it; it is the multiplicative form of an $L_2$ penalty on the
      weights [^2]. Only the gradient steps change the directions.
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Hyperparameter transfer, Problem 11
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q11
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: training-074
    type: short_answer
    difficulty: medium
    tags:
      - dropout
      - inverted-dropout
    question: |
      `nn.Dropout(p=0.1)` is followed directly by `nn.Dropout(p=0.2)`. Both use inverted dropout, as in
      PyTorch: an element is zeroed with probability $p$ and otherwise scaled by $1 / (1 - p)$. The pair
      behaves exactly like a single `nn.Dropout(p)`. What is $p$? Give 2 decimals.
    answer:
      numeric: 0.28
      tolerance: 0.005
      hint: a probability, 2 decimals
      model: $1 - (1 - 0.1)(1 - 0.2) = 1 - 0.72 = 0.28$
    explanation: |
      The two masks are independent, so an element survives both layers with probability
      $0.9 \cdot 0.8 = 0.72$ and is zeroed with probability 0.28 [^1]. A survivor is scaled by
      $\frac{1}{0.9} \cdot \frac{1}{0.8} = \frac{1}{0.72}$, which is exactly the scaling of a single
      inverted dropout with $p = 0.28$ [^2][^3]. In general two dropout layers with rates $p$ and $q$
      equal one with rate $1 - (1 - p)(1 - q)$ [^1].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-235, pp. 267–268; Solution SOL-235, Eq. (8.75), p. 321
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction, definition of $h'$)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - title: torch.nn.Dropout (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: Class description (outputs scaled by 1/(1-p) during training)
    source:
      id: dl-interviews
      ref: ch8#prb235
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: training-075
    type: multiple
    difficulty: hard
    tags:
      - dropout
      - activation-functions
    question: |
      With inverted dropout, a unit $h$ becomes 0 with probability $p$ and $h / (1 - p)$ otherwise. For
      which activation functions $\varphi$ does applying dropout before $\varphi$ always give the same
      result as applying it after $\varphi$ (with the same random mask)? Select all that apply.
    options:
      - text: ReLU, $\max(0, x)$
        correct: true
      - text: Leaky ReLU, $\max(0.01x, x)$
        correct: true
      - text: Sigmoid, $1 / (1 + e^{-x})$
        why: A dropped unit gives $\sigma(0) = 0.5$ when dropout comes first, but 0 when it comes after the sigmoid [^3].
      - text: Hyperbolic tangent, $\tanh x$
        why: $\tanh 0 = 0$ handles dropped units, but $\tanh\!\big(h / (1 - p)\big) \ne \tanh(h) / (1 - p)$ for kept ones [^3].
    explanation: |
      The two orders agree for every mask exactly when $\varphi(0) = 0$ (dropped units) and
      $\varphi(c h) = c\,\varphi(h)$ for $c = 1 / (1 - p) > 0$ (kept units) [^2]. Piecewise-linear
      functions through the origin, such as ReLU and leaky ReLU, are positively homogeneous and satisfy
      both, so the book's claim that the order does not matter holds for them [^1]. Saturating functions
      such as sigmoid and tanh are not homogeneous, and for them the order changes the output [^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-244, p. 276; Solution SOL-244, p. 326
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction, definition of $h'$)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - source: d2l
        locator: Sec. 5.1.2 Activation Functions
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#activation-functions
    source:
      id: dl-interviews
      ref: ch8#prb244
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: training-076
    type: single
    difficulty: medium
    tags:
      - dropout
      - inference
    question: |
      In the original form of dropout, units are dropped with probability $p = 0.2$ during training and
      the kept units are *not* rescaled. At test time all units are kept. What must be done then?
    options:
      - text: Scale each unit's outgoing weights by 0.8, its retention probability
        correct: true
      - text: Multiply each unit's outgoing weights by 0.2, the dropout probability
        why: On average a fraction $1 - p = 0.8$ of the units was active during training, not $p$ [^2].
      - text: Multiply each unit's outgoing weights by 1.25, which is $1/(1 - p)$
        why: $1 / (1 - p) = 1.25$ is the training-time scaling of *inverted* dropout; at test time it would inflate the outputs [^3].
      - text: Nothing, since the expected input to the next layer already matches
        why: Without rescaling, the next layer sees all units at test time but only 80% of them on average during training [^2].
    explanation: |
      Each unit was present with probability $1 - p = 0.8$ during training, so the next layer learned to
      expect 80% of its inputs on average. Scaling the outgoing weights by the retention probability at
      test time keeps the expected input the same and approximates averaging the predictions of all
      thinned networks [^2]. Modern libraries use inverted dropout instead: they scale by $1 / (1 - p)$
      during training and leave the network untouched at test time [^3]. Both views connect dropout to
      model averaging, as in bagging [^1].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-234 part 2, p. 267; Solution SOL-234 part 2, p. 320
        url: https://arxiv.org/abs/2201.00650v2
      - title: Srivastava et al. (2014), Dropout, a Simple Way to Prevent Neural Networks from Overfitting (JMLR)
        locator: Sec. 1 Introduction and Fig. 2
        url: https://jmlr.org/papers/v15/srivastava14a.html
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction) and 5.6.1 Dropout in Practice
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout-in-practice
    source:
      id: dl-interviews
      ref: ch8#prb234
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: training-077
    type: short_answer
    difficulty: easy
    tags:
      - memory
      - batch-size
      - out-of-memory
    question: |
      A pipeline trains on $1024 \times 1024$ RGB images with batch size 1024, stored as 32-bit floats.
      How much memory does one input batch alone take, in GiB ($2^{30}$ bytes)?
    answer:
      numeric: 12
      tolerance: 0.01
      hint: a number of GiB
      model: $1024 \cdot 3 \cdot 1024 \cdot 1024 \cdot 4 \text{ bytes} = 12 \cdot 2^{30}$ bytes $= 12$ GiB
    explanation: |
      The batch holds $2^{10} \cdot 3 \cdot 2^{20} = 3 \cdot 2^{30}$ numbers of 4 bytes each, i.e.
      12 GiB, before the network has computed anything [^1][^2]. Every layer then stores activations of a
      similar size for backpropagation, so such a pipeline fails with an out-of-memory error on typical
      GPUs [^1]. Smaller batches with gradient accumulation, lower resolution or mixed precision fix it.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-251, pp. 280–281; Solution SOL-251, pp. 327–328
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Single-precision floating-point format'
        url: https://en.wikipedia.org/wiki/Single-precision_floating-point_format
        locator: Introduction (a float32 value occupies 32 bits, i.e. 4 bytes)
    source:
      id: dl-interviews
      ref: ch8#prb251
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: training-078
    type: single
    difficulty: hard
    tags:
      - initialization
      - symmetry
      - tanh
    shuffle: false
    question: |
      A network computes $\hat y = \mathbf{w}_2^\top \tanh(\mathbf{W}_1\mathbf{x} + \mathbf{b}_1) + b_2$
      and is trained by gradient descent on the squared error. All weights and biases start at 0. Which
      parameters ever change during training?
    options:
      - text: Only $b_2$, so the network learns a constant output
        correct: true
      - text: All of them, but the hidden units stay identical to each other
        why: That happens for a nonzero constant initialization; here $\tanh 0 = 0$ also blocks the gradients of $\mathbf{w}_2$, $\mathbf{W}_1$ and $\mathbf{b}_1$ [^2].
      - text: $\mathbf{w}_2$ and $b_2$, but not $\mathbf{W}_1$ and $\mathbf{b}_1$
        why: The gradient for $\mathbf{w}_2$ is the output error times the hidden activations, which are $\tanh 0 = 0$ [^3].
      - text: None, so the loss never changes
        why: The gradient for $b_2$ is the output error itself, which is nonzero as long as the targets are not all 0 [^3].
    explanation: |
      With zero weights the hidden activations are $\mathbf{h} = \tanh(\mathbf{0}) = \mathbf{0}$, so the
      gradient $\partial L / \partial \mathbf{w}_2 = \delta\,\mathbf{h}$ vanishes, and the error passed
      back to the hidden layer, $\delta\,\mathbf{w}_2$, is zero as well, so $\mathbf{W}_1$ and
      $\mathbf{b}_1$ get no gradient [^1][^3]. Only $\partial L / \partial b_2 = \delta$ is nonzero, and
      since $\mathbf{h}$ stays 0 forever, nothing else ever starts to move. Random initialization breaks
      this symmetry [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-222, p. 258; Solution SOL-222, p. 314
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 5.4.1.3 Breaking the Symmetry
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#breaking-the-symmetry
      - source: d2l
        locator: Sec. 5.3.3 Backpropagation
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
    source:
      id: dl-interviews
      ref: ch8#prb222
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: training-079
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - epochs
      - mini-batch
    question: |
      A training set of 2,000 examples is processed in mini-batches of 128, and the last, smaller
      batch of each epoch is kept. Training stops after 1,000 parameter updates. How many complete
      epochs have been finished?
    answer:
      numeric: 62
      tolerance: 0
      hint: an integer
      model: $\lceil 2000/128 \rceil = 16$ updates per epoch (15 full batches and one of 80); $62 \cdot 16 = 992 \le 1000 < 63 \cdot 16$, so 62 complete epochs.
    explanation: |
      Each mini-batch gives one parameter update, and an epoch is one pass over the whole training
      set [^1][^2]. Fifteen batches of 128 cover 1,920 examples and a sixteenth holds the remaining
      80, so one epoch takes 16 updates. After 1,000 updates, $\lfloor 1000/16 \rfloor = 62$ epochs
      are complete (992 updates) and the 63rd has just started. Counting $2000/128 = 15.625$ updates
      per epoch would give 64, but the partial batch still costs a whole update; only with
      `drop_last=True` in a PyTorch `DataLoader` is it skipped [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 54
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html
        locator: Sec. 3.4.4 Training
      - title: torch.utils.data (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/data.html
        locator: torch.utils.data.DataLoader — parameter drop_last
    source:
      id: ncu-intro-dl
      ref: lecture-01/q07
    status: reviewed
    reviewed_by: claude
  - id: training-080
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - dropout
    question: |
      A layer uses inverted dropout with drop probability $p = 0.25$. A hidden activation equals 6.
      During training, if this unit is kept, its output is {{1}}; in evaluation mode its output is
      {{2}}.
    answer:
      blanks:
        - numeric: 8
          tolerance: 0.001
          hint: a number
        - numeric: 6
          tolerance: 0.001
          hint: a number
      model: When kept in training, $6/(1 - 0.25) = 8$; in evaluation dropout is off, so the output is 6.
    explanation: |
      Inverted dropout zeroes each unit with probability $p$ and divides the kept ones by $1 - p$,
      so the expected activation is unchanged: $0.25 \cdot 0 + 0.75 \cdot 8 = 6$ [^1][^2]. Because
      the rescaling already happens during training, nothing needs to be rescaled at test time;
      dropout is simply switched off and the full network is used [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 84–85
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
        locator: Sec. 5.6 Dropout (introduction, Eq. (5.6.1)); Sec. 5.6.1 Dropout in Practice
      - title: torch.nn.Dropout (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: Class description (outputs scaled by 1/(1-p) during training; identity in evaluation)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q17
    status: reviewed
    reviewed_by: claude
  - id: training-081
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - data-augmentation
      - data-leakage
    question: Which of these data-augmentation setups are flawed? Select all that apply.
    options:
      - text: Random horizontal flips for a handwriting model that must tell the letters "b" and "d" apart
        correct: true
      - text: Augmenting all photos first, then randomly splitting the originals and their copies into training and test sets
        correct: true
      - text: Small random changes in brightness and contrast for a model that detects scratches on polished metal parts
        why: A mild lighting change keeps a scratched part scratched and a clean part clean, so the labels stay valid.
      - text: Random crops that always keep the whole animal in view, for an animal-species classifier
        why: The animal, and hence its class, is still fully visible after cropping.
    explanation: |
      Augmentation adds transformed copies of training inputs and assumes that every copy keeps the
      original label [^1][^2]. A mirrored "b" looks like a "d", so the flip creates examples with
      wrong labels. Augmenting before splitting puts near-copies of the same photo into both
      training and test data, so the test score partly measures memorization — the same leakage as
      a random split over repeated items [^3]. Split the original items first and augment only the
      training data.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 86
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html
        locator: Sec. 14.1 Image Augmentation (introduction); Sec. 14.1.1.1 Flipping and Cropping
      - title: 'Wikipedia: Leakage (machine learning)'
        url: https://en.wikipedia.org/wiki/Leakage_(machine_learning)
        locator: Training example leakage
    source:
      id: ncu-intro-dl
      ref: lecture-01/q18
    status: reviewed
    reviewed_by: claude
  - id: training-082
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - memory
      - adam
    question: |
      A model has 25 million parameters, each a 32-bit float. During training with Adam you must
      hold the weights, their gradients and Adam's two moment estimates per parameter. Ignoring
      activations and other buffers, how many megabytes ($1\ \text{MB} = 10^6$ bytes) does this
      take?
    answer:
      numeric: 400
      tolerance: 0.5
      hint: a number of MB
      model: 25,000,000 × 4 bytes = 100 MB per copy; weights + gradients + 2 Adam moments = 4 copies = 400 MB.
    explanation: |
      A 32-bit float takes 4 bytes, so one copy of 25 million values is 100 MB [^1][^2]. Training
      needs a gradient for every weight, and Adam keeps a running first-moment and second-moment
      estimate per parameter [^3], so there are four copies: 400 MB. Activations stored for the
      backward pass come on top and grow with the batch size, which is why a model that fits for
      inference can run out of memory in training.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 100
