  - id: training-030
    type: single
    difficulty: easy
    question: What's the best batch size when using mini-batch SGD?
    options:
      - text: It depends
        correct: true
      - text: 10 examples per batch
        why: Small batches behave like SGD, with cheap but noisy updates; that suits some problems but not all [^1].
      - text: 100 examples per batch
        why: Larger batches give smoother gradients, but whether 100 is best depends on the data and on the available memory and compute [^1].
    explanation: |
      The ideal batch size depends on the dataset and the available compute resources [^1]. Small
      batches behave like SGD, with cheap but noisy updates, and large batches behave like full-batch
      gradient descent, with smoother but more expensive ones [^1]. Some noise can even help the model
      generalize, so the batch size is a hyperparameter to tune together with the learning rate [^1].
    references:
      - source: google-mlcc
