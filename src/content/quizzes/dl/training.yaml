  - id: training-031
    type: single
    difficulty: easy
    question: Which of the following statements is true?
    options:
      - text: Larger batches are unsuitable for data with many outliers.
        why: This statement is false. By averaging more gradients together, larger batch sizes can help reduce the negative effects of having outliers in the data.
      - text: Doubling the learning rate can slow down training.
        correct: true
    explanation: |
      "Doubling the learning rate can slow down training" is true: if the doubled rate is too large,
      the weights bounce around the minimum and convergence takes longer, or fails [^1]. The other
      statement is false: averaging the gradients of more examples dilutes the effect of individual
      outliers, so larger batches can help with outlier-heavy data [^1]. As always, the best
      hyperparameters depend on the dataset and the available compute [^1].
    references:
      - source: google-mlcc
        locator: 'Linear regression: Hyperparameters'
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters
