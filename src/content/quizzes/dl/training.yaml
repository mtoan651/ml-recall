  - id: training-124
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - regularization-strength
      - model-selection
    question: |
      An L2 penalty is tuned over five strengths:

      | $\lambda$ | 0 | 0.0001 | 0.001 | 0.01 | 0.1 |
      |---|---|---|---|---|---|
      | Training loss | 0.05 | 0.12 | 0.25 | 0.36 | 0.70 |
      | Validation loss | 0.61 | 0.52 | 0.44 | 0.49 | 0.73 |

      Which $\lambda$ should be chosen?
    options:
      - text: $\lambda = 0.001$, which has the lowest validation loss
        correct: true
      - text: $\lambda = 0$, which has the lowest training loss
        why: Without the penalty the model overfits; its low training loss comes with a high validation loss.
      - text: $\lambda = 0.1$, which has the smallest gap between training and validation loss
        why: A small gap with both losses high is underfitting; the aim is a low validation loss, not a small gap.
      - text: $\lambda = 0.0001$, since the weakest penalty changes the model least
        why: Its validation loss of 0.52 is clearly worse than the 0.44 reached at $\lambda = 0.001$.
    explanation: |
      $\lambda$ sets how strongly the weights are pushed toward zero: too small and the model
      overfits (low training loss, high validation loss), too large and it underfits (both losses
      high) [^1][^2]. Such hyperparameters are chosen by the loss on validation data, or by
      cross-validation, and the test set is used only once at the end [^3]. Here the validation loss
      is lowest at $\lambda = 0.001$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 65
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-selection
        locator: Sec. 3.6.3 Model Selection
    source:
      id: ncu-intro-dl
      ref: lecture-03/q64
    status: reviewed
    reviewed_by: claude
  - id: training-125
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - data-augmentation
    question: |
      Name the regularization technique that enlarges the training set with label-preserving,
      randomly transformed copies of existing examples, such as flipped, cropped or rotated images.
    answer:
      accept:
        - data augmentation
        - augmentation
        - image augmentation
        - data augmentations
        - augmenting the data
        - augmenting the training data
        - augmenting training data
        - training data augmentation
      hint: a two-word term
      model: Data augmentation.
    explanation: |
      Data augmentation applies random changes that keep the label, such as flips, crops, rotations
      or colour shifts for images, to create new variants of the training examples [^1][^2]. The
      model sees more variation of each class and relies less on incidental details such as an
      object's exact position or colour, which reduces overfitting, especially on small datasets
      [^2][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 68
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html
        locator: Sec. 14.1 Image Augmentation (introduction)
      - title: 'Wikipedia: Data augmentation'
        url: https://en.wikipedia.org/wiki/Data_augmentation
        locator: Introduction
    source:
      id: ncu-intro-dl
      ref: lecture-03/q66
    status: reviewed
    reviewed_by: claude
  - id: training-126
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - data-augmentation
      - overfitting
    question: |
      A team trains a CNN on only 1,500 labelled photos of plant leaves and cannot collect more.
      Training accuracy quickly approaches 100%, while validation accuracy stalls near 70%. Which
      regularization technique tackles the shortage of training data itself?
    options:
      - text: Random flips, crops and colour shifts of the training photos
        correct: true
      - text: Adding an L2 penalty to the weights of every layer
        why: It restrains the weights and can narrow the gap, but the network still learns from the same 1,500 images.
      - text: Stopping training at the epoch with the best validation accuracy
        why: Early stopping limits how long the network fits the same images; it adds no new variation to learn from.
      - text: Applying dropout to the units of the fully connected layers
        why: Dropout injects noise into the network's units, not into the data; the set of training images stays the same.
    explanation: |
      The large gap between training and validation accuracy signals overfitting, and its root cause
      here is the small dataset [^1][^2]. An L2 penalty, early stopping and dropout restrain the model
      and can shrink the gap, but only data augmentation works on the data: it creates new,
      label-preserving variants of each photo every epoch, so the network sees more variety and
      depends less on incidental details such as position or lighting [^1][^3]. Augmentation is
      applied to the training data only; validation and test images stay unchanged [^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 68, 72–73
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#underfitting-or-overfitting
        locator: Sec. 3.6.2 Underfitting or Overfitting?
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html
        locator: Sec. 14.1 Image Augmentation (introduction)
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html#training-with-image-augmentation
        locator: Sec. 14.1.2 Training with Image Augmentation
    source:
      id: ncu-intro-dl
      ref: lecture-03/q67
    status: reviewed
    reviewed_by: claude
  - id: training-127
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - batch-normalization
    question: |
      In evaluation mode, a batch-normalization layer uses the running estimates collected during
      training. For one feature these are a mean of 2 and a variance of 4 (ignore $\varepsilon$), and
      the learned scale and shift are $\gamma = 1.5$ and $\beta = -1$. What does the layer output for
      the input $x = 5$?
    options:
      - text: '1.25'
        correct: true
      - text: '0.125'
        why: This divides by the variance 4 instead of the standard deviation 2.
      - text: '1.5'
        why: That is the normalized value; the layer still applies the scale and the shift.
      - text: '0.75'
        why: The scale multiplies the normalized value before the shift is added, $1.5 \cdot 1.5 - 1$, not $(1.5 - 1) \cdot 1.5$.
    explanation: |
      At prediction time, batch statistics would make an example's output depend on the other
      examples in its batch, so batch normalization switches to fixed estimates gathered during
      training [^2][^3]. The output is
      $\gamma(x - \mu)/\sqrt{\sigma^2 + \varepsilon} + \beta = 1.5 \cdot (5 - 2)/2 - 1 = 1.25$. In
      training mode the same layer would instead normalize with statistics computed from the
      current mini-batch [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 69
      - title: 'PyTorch documentation: torch.nn.BatchNorm1d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm1d.html
        locator: Description (running estimates used during evaluation)
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#batch-normalization-during-prediction
        locator: Sec. 8.5.2.4 Batch Normalization During Prediction
    source:
      id: ncu-intro-dl
      ref: lecture-03/q68
    status: reviewed
    reviewed_by: claude
  - id: training-128
    type: true_false
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - batch-normalization
      - internal-covariate-shift
    question: |
      Batch normalization was introduced as a way to reduce *internal covariate shift*, the change in
      each layer's input distribution during training. True or false: later controlled experiments
      confirmed that reducing this shift is the main reason batch normalization speeds up training.
    options:
      - text: 'True'
        why: Experiments found that stabilizing the layers' input distributions has little to do with batch normalization's success.
      - text: 'False'
        correct: true
    explanation: |
      The original paper motivated batch normalization by reducing internal covariate shift [^1][^2].
      Santurkar et al. found that this distributional stability has little to do with its success
      and argued that batch normalization mainly makes the optimization landscape smoother, giving
      more predictive gradients and allowing faster training [^3]. The practical effects are not in
      doubt, faster and more stable training and a mild regularizing effect [^2], but the
      explanation remains debated [^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 69
      - title: 'Ioffe & Szegedy (2015), Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift, arXiv:1502.03167'
        url: https://arxiv.org/abs/1502.03167
        locator: Abstract
      - title: Santurkar et al. (2018), How Does Batch Normalization Help Optimization?, arXiv:1805.11604
        url: https://arxiv.org/abs/1805.11604
        locator: Abstract
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#discussion
        locator: Sec. 8.5.6 Discussion
    source:
      id: ncu-intro-dl
      ref: lecture-03/q69
    status: reviewed
    reviewed_by: claude
  - id: training-129
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - regularization
      - dropout
    question: Which pairing of a regularization method with its main effect is correct?
    options:
      - text: Dropout — no unit can count on particular other units being present
        correct: true
      - text: L2 penalty — many weights become exactly zero, so irrelevant features drop out of the model
        why: Exact zeros and feature selection are the effect of L1; L2 shrinks weights smoothly.
      - text: Early stopping — the training data gain more variety
        why: Adding variety is data augmentation; early stopping limits how long the model trains.
      - text: Max-norm — each layer's inputs are normalized over the mini-batch
        why: Normalizing layer inputs is batch normalization; max-norm caps the length of each weight vector.
    explanation: |
      Each regularizer limits overfitting in its own way [^1]: L1 removes features and L2 shrinks all
      weights [^2], dropout randomly removes units so that no unit can depend on specific others
      (breaking co-adaptation) [^3], early stopping halts training at the right time, data
      augmentation adds variety, batch normalization stabilizes layer inputs and max-norm keeps
      weight vectors from growing too large. Knowing these effects is what lets you pick a suitable
      combination for a problem.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 71–72
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
        locator: Sec. 5.6 Dropout (introduction) and 5.6.1 Dropout in Practice
    source:
      id: ncu-intro-dl
      ref: lecture-03/q70
    status: reviewed
    reviewed_by: claude
