    reviewed_by: claude
  - id: training-062
    type: single
    difficulty: medium
    tags:
      - dropout
      - regularization
    question: Which of these is a sound guideline for using dropout?
    options:
      - text: Avoid it right before the output layer, and expect it to hurt a small model that is not overfitting
        correct: true
      - text: Keep it active at test time as well, so that training and test conditions match
        why: Dropout is used only during training; at test time the full network is used, which is why `model.eval()` matters.
      - text: Halve the number of hidden units when adding it, since dropout adds capacity
        why: Dropout removes capacity during training; NMA suggests widening layers (e.g. doubling the units at rate 0.5), not shrinking them.
      - text: Expect it to speed up early training, so its benefit is largest after a few epochs
        why: Dropout usually slows early training; its benefit shows in the final, converged error.
    explanation: |
      Dropout zeroes random units during training and is switched off at test time, so `model.eval()` must be called
      before testing [^1][^2]. Because it reduces capacity, it helps networks that overfit and can hurt a small model; wider
      layers are often used with it [^1]. Dropout right before the last layer leaves no later layer to compensate for the
      dropped units, and it usually hurts early in training while lowering the final error after convergence [^1].
    references:
      - source: neuromatch-dl
        locator: W2D1 Tutorial 2, Section 2 Dropout, Section 2.1 Dropout Implementation Caveats and Think 2.2 Dropout caveats
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D1_Regularization/instructor/W2D1_Tutorial2.ipynb
      - source: d2l
        locator: Sec. 5.6 Dropout
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
    source:
      id: neuromatch-dl
      ref: W2D1_Regularization/W2D1_Tutorial2#think2.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D1_Regularization/instructor/W2D1_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: training-063
    type: single
    difficulty: easy
    tags:
      - regularization
      - model-capacity
      - overparameterization
    question: Why does common practice prefer a large, regularized network over a small network that is unable to overfit?
    options:
      - text: Regularization can only reduce effective complexity; it cannot help a model too small to describe the data
        correct: true
      - text: Small networks train more slowly, because each of their parameters receives a larger gradient
        why: 'The issue is capacity, not speed: if the model cannot represent the function, no training trick fixes it.'
      - text: Regularization adds parameters, so it turns a small network into a large one
        why: L1/L2 penalties, dropout and early stopping add no parameters; they constrain the existing ones.
      - text: Large networks never overfit when they are trained with SGD
        why: Large networks can even memorize random labels; regularization is what keeps them from overfitting.
    explanation: |
      Penalties such as L1/L2, dropout, data augmentation and early stopping all work by limiting the effective
      complexity of a model [^1]. If the starting model is too simple to capture the data, the remedy is more complexity,
      which regularization cannot provide; a large model can instead be regularized down to the right complexity [^1].
      Large networks are also easier to optimize, as NMA's overparameterization experiments show [^2].
    references:
      - source: neuromatch-dl
        locator: W2D1 Tutorial 2, Section 3 Data Augmentation, Think! 3.2 Overparameterized vs. Small NN
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D1_Regularization/instructor/W2D1_Tutorial2.ipynb
