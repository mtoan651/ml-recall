    question: |
      A training run made 1,500 parameter updates in 5 epochs, using mini-batches of 40 examples (every
      batch is full, one update per batch). How many examples does the training set contain?
    answer:
      numeric: 12000
      tolerance: 0
      hint: an integer
      model: $1500 / 5 = 300$ updates per epoch, i.e. 300 batches of 40, so $300 \times 40 = 12{,}000$ examples.
    explanation: |
      An epoch is one full pass over the training set, and mini-batch training makes one update per batch
      [^1][^2]. So each epoch had $1500 / 5 = 300$ batches, and the training set holds
      $300 \times 40 = 12{,}000$ examples.
