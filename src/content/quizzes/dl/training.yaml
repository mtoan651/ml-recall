  - id: training-100
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - gradient-descent
      - learning-rate
    question: |
      A weight $w = 1$ has the gradient $\partial L / \partial w = -6$. One gradient-descent step with
      $\eta = 0.1$ moves it to $w = 1.6$. Where does the same step move it with $\eta = 0.3$?
    options:
      - text: '2.8'
        correct: true
      - text: '1.6'
        why: The learning rate scales the step, so a larger $\eta$ gives a larger move for the same gradient.
      - text: −0.8
        why: 'Sign error: subtracting $\eta$ times a negative gradient increases $w$.'
      - text: '1.8'
        why: That is the size of the step, $0.3 \times 6$, not the new value of $w$.
    explanation: |
      $w \leftarrow w - \eta \, \partial L / \partial w = 1 - 0.3 \cdot (-6) = 2.8$ [^1]. For a fixed
      gradient the step is proportional to $\eta$: tripling $\eta$ triples the move from 0.6 to 1.8. Too
      large a step can overshoot the minimum [^2].
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 15; Lecture 1, slides 52–53
      - source: d2l
        locator: Sec. 12.3.1.1 Learning Rate
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
