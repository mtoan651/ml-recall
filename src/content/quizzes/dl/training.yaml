  - id: training-110
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l01
      - ce6146-l03
      - dropout
    question: |
      True or false: dropout picks one random subset of units at the start of training and keeps exactly
      those units switched off for the whole training run.
    options:
      - text: 'True'
        why: A new random mask is drawn at every training step, so each unit is dropped in some steps and kept in others.
      - text: 'False'
        correct: true
    explanation: |
      During each training iteration dropout zeroes every unit independently with probability $p$, so the
      dropped subset changes from step to step [^1][^2]. Because any unit may be missing, no unit can rely
      on particular others, which is what reduces overfitting; a fixed subset would merely give a smaller
      network. At evaluation time no unit is dropped, and PyTorch's `nn.Dropout` computes the identity [^3].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 20; Lecture 1, slide 85; Lecture 3, slide 66
      - source: d2l
        locator: Sec. 5.6 Dropout (opening paragraphs, units zeroed on each iteration); 5.6.1 Dropout in Practice
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout
      - title: PyTorch documentation
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: torch.nn.Dropout
    source:
      id: ncu-intro-dl
      ref: exercise-03/q20-v2
    status: reviewed
    reviewed_by: claude
  - id: training-111
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - early-stopping
    question: |
      A run that was allowed to train for 8 epochs logged these validation losses for epochs 1–8:

      $$0.92,\quad 0.75,\quad 0.61,\quad 0.62,\quad 0.58,\quad 0.60,\quad 0.63,\quad 0.55$$

      With early stopping and a patience of 2 (stop as soon as the validation loss has failed to
      beat its best value for 2 epochs in a row, then restore the best checkpoint), training would
      have stopped after epoch {{1}}, and the weights of epoch {{2}} would be restored.
    answer:
      blanks:
        - numeric: 7
          tolerance: 0
          hint: an epoch number
        - numeric: 5
          tolerance: 0
          hint: an epoch number
      model: Best 0.61 (epoch 3); epoch 4 no gain; epoch 5 new best 0.58; epochs 6 and 7 no gain → stop after epoch 7, restore epoch 5. Epoch 8 is never run.
    explanation: |
      Early stopping monitors the validation loss and halts when it has not improved for a set
      number of epochs, the patience [^2]; the best checkpoint is then kept or restored [^1].
      Epoch 4 (0.62) does not beat 0.61, but epoch 5 sets a new best (0.58) and resets the count;
      epochs 6 and 7 do not beat 0.58, so training stops after epoch 7 and the weights of epoch 5
      are restored. The lower loss of epoch 8 is never seen, which is the price of a small patience.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 83–84
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
        locator: Sec. 5.5.3 Early Stopping
    source:
      id: ncu-intro-dl
      ref: lecture-01/q81
    status: reviewed
    reviewed_by: claude
  - id: training-112
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - memory
      - checkpointing
    question: |
      Training a deep network runs out of GPU memory because the activations cached for
      backpropagation are too large. Which technique trades extra computation for less memory?
    options:
      - text: Keep only some activations and recompute the others during the backward pass
        correct: true
      - text: Double the batch size so that fewer optimizer steps are needed per epoch
        why: A larger batch means more cached activations per step, so memory use grows.
      - text: Run the backward pass before the forward pass so nothing has to be cached
        why: The backward pass needs the forward values and the loss, so it cannot come first.
      - text: Raise the learning rate so that training finishes in fewer epochs
        why: The learning rate does not change how much is cached in each step.
    explanation: |
      Backpropagation reuses forward values instead of recomputing them, but the cache costs memory
      that grows with depth and batch size [^1]. Activation (gradient) checkpointing stores only
      selected tensors and re-runs parts of the forward computation during the backward pass [^2];
      for an $n$-layer network this can cut the memory to $O(\sqrt n)$ for about one extra forward
      pass per mini-batch [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 89
      - title: torch.utils.checkpoint (PyTorch documentation)
        url: https://docs.pytorch.org/docs/2.14/checkpoint.html
        locator: Page description (trades compute for memory)
      - title: Chen et al. (2016), Training Deep Nets with Sublinear Memory Cost, arXiv:1604.06174
        url: https://arxiv.org/abs/1604.06174
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-02/q95
    status: reviewed
    reviewed_by: claude
  - id: training-113
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - vanishing-gradients
      - relu
    question: Which statement about ReLU and the stability of gradients in deep networks is correct?
    options:
      - text: ReLU has slope 1 on active units, yet gradients can still vanish or explode through the weights
        correct: true
      - text: ReLU has derivative 1 everywhere, so a ReLU network cannot suffer from vanishing gradients
        why: The slope is 0 for negative inputs, so inactive units block the gradient completely.
      - text: ReLU is bounded, so a ReLU network cannot suffer from exploding gradients at all
        why: ReLU is unbounded above, and large weights can still amplify the backward products.
      - text: Sigmoid units avoid vanishing gradients, because their derivative is never exactly 0
        why: The sigmoid derivative is at most 0.25 and tiny in saturation, so products of many of them shrink fast.
    explanation: |
      A backpropagated gradient is a product of weight matrices and activation derivatives across the
      layers [^1][^2]. Saturating sigmoid and tanh units shrink it, which is why ReLU, with slope 1
      when active, helps; but inactive ReLUs pass nothing, a unit that is inactive on every input is
      dead, and the weight factors can still make the product explode or vanish [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 91
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#vanishing-and-exploding-gradients
        locator: Sec. 5.4.1 Vanishing and Exploding Gradients
    source:
      id: ncu-intro-dl
      ref: lecture-02/q97
    status: reviewed
    reviewed_by: claude
  - id: training-114
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - vanishing-gradients
      - exploding-gradients
    question: |
      In a scalar chain, each of $k$ local derivatives equals $q$, so the input gradient is $q^k$ times
      the upstream gradient. With $q = 0.5$ it first falls below $10^{-6}$ times the upstream gradient
      after $k =$ {{1}} layers; with $q = 1.5$ it first exceeds $10^{6}$ times the upstream gradient
      after $k =$ {{2}} layers.
    answer:
      blanks:
        - numeric: 20
          tolerance: 0
          hint: an integer
        - numeric: 35
          tolerance: 0
          hint: an integer
      model: '$\log_{10}|g| = k\log_{10} q$ must pass $\mp 6$: $k > 6/\log_{10} 2 \approx 19.9$, so 20 ($0.5^{20} \approx 9.5 \times 10^{-7}$); $k > 6/\log_{10} 1.5 \approx 34.1$, so 35 ($1.5^{35} \approx 1.46 \times 10^{6}$).'
    explanation: |
      On a log scale the gradient changes linearly with depth, $\log_{10}|g| = k\log_{10} q$ [^1]. To
      reach $10^{-6}$ with $q = 0.5$ needs $k \log_{10} 2 > 6$, i.e. $k > 19.9$, so 20 layers
      ($0.5^{19} \approx 1.9 \times 10^{-6}$ is not yet below); to reach $10^{6}$ with $q = 1.5$ needs
      $k > 6/\log_{10} 1.5 \approx 34.1$, so 35 layers. Per-layer factors only moderately different
      from 1 change the gradient by many orders of magnitude over a few dozen layers — vanishing below
      1, exploding above [^2][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 91–92
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#vanishing-and-exploding-gradients
        locator: Sec. 5.4.1 Vanishing and Exploding Gradients
      - title: 'Wikipedia: Vanishing gradient problem'
        url: https://en.wikipedia.org/wiki/Vanishing_gradient_problem
        locator: Lead
    source:
      id: ncu-intro-dl
      ref: lecture-02/q98
    status: reviewed
    reviewed_by: claude
  - id: training-115
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - inference
      - learning-rate
    question: |
      A trained network is used for inference on new inputs, with its parameters fixed. Which setting
      chosen during training has no effect on how it computes its predictions?
    options:
      - text: The learning rate
        correct: true
      - text: The activation function of the hidden layer
        why: The hidden activation is part of the function $f(x; \theta)$ evaluated at inference.
      - text: The number of hidden units
        why: The width is part of the architecture, so it shapes every forward computation.
      - text: The activation function of the output layer
        why: The output activation determines what the prediction means, e.g. a probability.
    explanation: |
      Inference only evaluates $f(x; \theta)$ with the fitted parameters [^1]. The learning rate
      belongs to the update procedure: it scaled each parameter step during training (and so
      influenced which $\theta$ was reached) but plays no part in evaluating the trained network
      [^2]. Activations and widths define $f$ itself.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 93
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent (learning rate as a hyperparameter); Sec. 3.1.1.5 Predictions
    source:
      id: ncu-intro-dl
      ref: lecture-02/q99
    status: reviewed
    reviewed_by: claude
  - id: training-116
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - training-loop
    question: In what order does one training iteration of a feedforward network proceed?
    options:
      - text: Forward pass, loss, backward pass for the gradients, parameter update
        correct: true
      - text: Backward pass for the gradients, forward pass, loss, parameter update
        why: The backward pass needs the cached forward values and the loss, so it cannot come first.
      - text: Forward pass, parameter update, loss, backward pass for the gradients
        why: The update needs the gradients, which only the backward pass provides.
      - text: Loss, forward pass, parameter update, backward pass for the gradients
        why: The loss compares predictions with targets, so the forward pass must come before it.
    explanation: |
      The forward pass computes the prediction $\hat y = f(x; \theta)$, the loss compares it with the
      target, backpropagation uses the chain rule to obtain $\nabla_\theta L$, and only then does
      the optimizer update $\theta$ [^1][^2]. Each stage needs the result of the one before it.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 70, 94
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#training-neural-networks
        locator: Sec. 5.3.4 Training Neural Networks
    source:
      id: ncu-intro-dl
      ref: lecture-02/q100
    status: reviewed
    reviewed_by: claude
  - id: training-117
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - mini-batch
      - epoch
    question: |
      A training set has 12,800 examples. How many parameter updates does one epoch take with
      full-batch gradient descent, with SGD (one example per update) and with mini-batch gradient
      descent using batches of 64, respectively?
    options:
      - text: 1, 12,800 and 200
        correct: true
      - text: 12,800, 1 and 200
        why: Full-batch gradient descent makes a single update per pass over the data, while SGD makes one per example.
      - text: 1, 12,800 and 64
        why: The number of mini-batch updates is the dataset size divided by the batch size, $12{,}800/64$, not the batch size itself.
      - text: 1, 200 and 12,800
        why: SGD updates after every single example, so it makes the most updates per epoch; the mini-batch method makes 200.
    explanation: |
      All three variants apply the same update rule and differ only in how many examples go into
      each gradient estimate [^1]. Full-batch gradient descent averages over all 12,800 examples and
      updates once per epoch; SGD updates after every example, 12,800 times; mini-batch gradient
      descent updates once per batch, $12{,}800/64 = 200$ times [^2]. More frequent updates are
      cheaper and noisier, fewer updates are costlier and more stable [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 29–34
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters
        locator: Linear regression — Hyperparameters, secs. Batch size and Epochs
      - source: d2l
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
        locator: Sec. 12.5.2 Minibatches
    source:
      id: ncu-intro-dl
      ref: lecture-03/q39
    status: reviewed
    reviewed_by: claude
  - id: training-118
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - vanishing-gradients
      - training-challenges
    question: |
      A 20-layer network with sigmoid activations is being trained. Logging the gradient norm of each
      layer's weights gives about $10^{-1}$ for the last layer, $10^{-4}$ for a middle layer and
      $10^{-8}$ for the first layer, whose weights barely change. Which training challenge is this?
    options:
      - text: Vanishing gradients
        correct: true
      - text: Exploding gradients
        why: Exploding gradients grow on their way back to the first layers and make the updates there huge and unstable, not tiny.
      - text: A saddle point or plateau
        why: Near a saddle point the whole gradient is small; here the last layer still gets sizable gradients and only the early layers starve.
      - text: A non-stationary objective
        why: Drifting data move the best parameters over time; they do not make the gradients shrink layer by layer toward the input.
    explanation: |
      Backpropagation multiplies the gradient by each layer's local derivatives on its way to the
      input, and the sigmoid's derivative is at most 0.25, so over many layers the product shrinks
      geometrically [^2][^3]. The earliest layers then receive gradients many orders of magnitude
      smaller than the last ones, and their parameters hardly move [^2]. Deep networks and recurrent
      networks unrolled over long sequences are prone to this [^1]. ReLU activations, careful
      initialization, batch normalization and residual connections reduce it; the mirror image,
      exploding gradients, is usually tamed by gradient clipping [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 52
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#vanishing-and-exploding-gradients
        locator: Sec. 5.4.1 Vanishing and Exploding Gradients, 5.4.1.1 Vanishing Gradients
      - title: 'Wikipedia: Vanishing gradient problem'
        url: https://en.wikipedia.org/wiki/Vanishing_gradient_problem
        locator: Introduction; Solutions
    source:
      id: ncu-intro-dl
      ref: lecture-03/q54
    status: reviewed
    reviewed_by: claude
  - id: training-119
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - regularization
      - weight-decay
    question: Which regularization technique works by adding an explicit term to the training objective?
    options:
      - text: L2 regularization
        correct: true
      - text: Dropout
        why: Dropout randomly zeroes units during training; it is a stochastic method that leaves the loss formula unchanged.
      - text: Data augmentation
        why: Augmentation changes the training data, not the objective.
      - text: Early stopping
        why: Early stopping limits how many epochs are trained; it is a procedural control, not a term in the loss.
    explanation: |
      Regularizers differ in how they restrict the model. Explicit penalties such as L2 (or L1) add a
      term like $\lambda\sum_i w_i^2$ to the loss, so the optimizer trades data fit against weight
      size [^1][^2][^4]. Dropout and data augmentation act through randomness in the network or the
      data, and early stopping constrains the number of training epochs instead of the weights [^3];
      they restrict the learned function only implicitly [^1][^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 59
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
        locator: Sec. 5.5.3 Early Stopping
      - title: 'Wikipedia: Regularization (mathematics)'
        url: https://en.wikipedia.org/wiki/Regularization_(mathematics)
        locator: Introduction (explicit vs implicit regularization)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q59
    status: reviewed
    reviewed_by: claude
  - id: training-120
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - regularization
      - overfitting
    question: |
      True or false: adding a weight penalty such as L2 regularization aims to push the training
      loss below what the unpenalized model reaches.
    options:
      - text: 'True'
        why: The penalty restrains how closely the model can fit the training data; its target is a lower error on unseen data.
      - text: 'False'
        correct: true
    explanation: |
      Overfitting means fitting the noise and quirks of the training sample, so that a small
      training error comes with a large error on new data [^1]. A penalty discourages the large
      weights such a fit needs, so with it the training error usually ends up somewhat *higher*,
      while the validation and test error fall [^2]. Judging a regularizer by its training loss
      would therefore always favour using none; it is judged on held-out data.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 60, 64, 74
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#using-weight-decay
        locator: Sec. 3.7.3.3 Training without Regularization; Sec. 3.7.3.4 Using Weight Decay
    source:
      id: ncu-intro-dl
      ref: lecture-03/q60
    status: reviewed
    reviewed_by: claude
  - id: training-121
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - l1-regularization
      - l2-regularization
      - sparsity
    question: |
      A weight $w = 0.1$ currently gets zero gradient from the data loss. One SGD step with
      $\eta = 0.5$ is taken on the penalized loss. With the L1 penalty $\lambda\sum_i |w_i|$ and
      $\lambda = 0.05$, the weight becomes {{1}}; with the L2 penalty $\lambda\sum_i w_i^2$ and the
      same $\lambda$, it becomes {{2}}.
    answer:
      blanks:
        - numeric: 0.075
          tolerance: 0.0005
          hint: a number
        - numeric: 0.095
          tolerance: 0.0005
          hint: a number
      model: 'L1: $0.1 - 0.5 \cdot 0.05 \cdot \operatorname{sign}(0.1) = 0.075$. L2: $0.1 - 0.5 \cdot 2 \cdot 0.05 \cdot 0.1 = 0.095$.'
    explanation: |
      The L1 penalty's (sub)gradient is $\lambda\,\operatorname{sign}(w)$, a constant pull of $0.05$
      however small the weight is, while the L2 penalty's gradient $2\lambda w = 0.01$ shrinks in
      proportion to the weight [^1]. For this small weight, L1 therefore moves it five times farther
      toward zero. Repeated over many steps, L1 drives unhelpful weights to exactly zero, which
      selects features, whereas L2 only makes them small [^2][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 62, 71
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - title: 'Wikipedia: Regularization (mathematics)'
        url: https://en.wikipedia.org/wiki/Regularization_(mathematics)
        locator: Regularization in machine learning — L1 and L2 regularization
    source:
      id: ncu-intro-dl
      ref: lecture-03/q61
    status: reviewed
    reviewed_by: claude
  - id: training-122
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - l1-regularization
      - feature-selection
    question: |
      A model predicts machine failures from 400 sensor features. The engineers believe that only a
      handful of sensors matter and want a model that ignores the rest. Which regularizer fits best?
    options:
      - text: L1 regularization (lasso)
        correct: true
      - text: L2 regularization (ridge)
        why: L2 shrinks all weights but rarely makes any exactly zero, so every sensor stays in the model.
      - text: Dropout on the input layer
        why: Dropout randomly hides features during training but removes none of them from the final model.
      - text: A max-norm constraint
        why: Max-norm caps the length of weight vectors; it does not make individual weights zero.
    explanation: |
      The L1 penalty $\lambda\sum_i |w_i|$ pulls every weight toward zero with a constant force, so
      the weights of unhelpful features end up exactly zero and those features drop out of the model:
      L1 performs feature selection [^1][^2]. L2, in contrast, spreads weight evenly over many
      features [^2]. When several useful sensors are strongly correlated, elastic net (L1 plus L2) is
      a common compromise [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 62–63, 71, 73
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - title: 'Wikipedia: Regularization (mathematics)'
        url: https://en.wikipedia.org/wiki/Regularization_(mathematics)
        locator: Regularizers for sparsity (elastic net paragraph)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q62
    status: reviewed
    reviewed_by: claude
  - id: training-123
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - l2-regularization
      - overfitting
    question: |
      A degree-15 polynomial is fitted to 30 noisy points, once without regularization and once with
      an L2 penalty:

      | Model | Training RMSE | Test RMSE |
      |---|---|---|
      | Unpenalized | 0.09 | 3.4 |
      | L2-penalized | 0.24 | 0.47 |

      What is the best interpretation?
    options:
      - text: The penalty gave up a little training fit for a smoother curve that generalizes far better
        correct: true
      - text: The penalty failed, because it made the training error higher
        why: A slightly higher training error is the expected price of a penalty; what matters is the large drop in test error.
      - text: The penalized model underfits, since its training error is the higher of the two
        why: Underfitting means high error on training and test data alike; the penalized model has by far the lower test error.
      - text: The unpenalized model learned the true function more accurately, as its training error shows
        why: Its tiny training error comes from fitting the noise; its huge test error shows the curve is far from the true function.
    explanation: |
      Without a penalty, a degree-15 polynomial can bend through almost every noisy point, giving a
      tiny training error and wild swings between the points: overfitting [^2]. The L2 penalty keeps
      the coefficients small, which yields a smoother function; it fits the training points slightly
      worse, but the test error drops from 3.4 to 0.47 [^3]. The benefit of regularization is judged
      by comparing penalized and unpenalized models on held-out data [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 64
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#polynomial-curve-fitting
        locator: Sec. 3.6.2.1 Polynomial Curve Fitting
      - source: d2l
