    question: |
      One parameter update computed from a single mini-batch is called a step or an {{1}}. With 1,200
      training examples and mini-batches of 100, one epoch consists of {{2}} of them.
    answer:
      blanks:
        - accept:
            - iteration
            - iterations
            - training iteration
          hint: one word
        - numeric: 12
          tolerance: 0
          hint: an integer
      model: An iteration (training step); one epoch over 1,200 examples in batches of 100 takes $1200/100 = 12$ iterations.
    explanation: |
      An iteration (or step) is one execution of the update rule, usually on one mini-batch, while an
      epoch is a complete sweep over all training examples [^1][^2]. Covering 1,200 examples in batches of 100
      takes $1200 / 100 = 12$ iterations per epoch.
