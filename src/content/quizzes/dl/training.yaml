schema_version: 1
domain: dl
topic: training
title: Training Deep Networks
questions:
  - id: training-001
    type: single
    difficulty: easy
    question: What does `fp16=True` in TrainingArguments enable?
    options:
      - text: 16-bit integer weights and activations for faster training.
        why: fp16 refers to floating-point precision, not integer precision.
      - text: Mixed precision training with 16-bit floating-point numbers.
        correct: true
      - text: Training for exactly 16 epochs with the default batch size.
        why: fp16 has nothing to do with the number of epochs.
      - text: Distributed data-parallel training across 16 GPUs.
        why: The number of GPUs is not controlled by the fp16 parameter.
    explanation: |
      `fp16=True` turns on mixed precision training, which makes training faster and reduces memory
      use [^1]. "Mixed" means that not every operation runs in 16 bits: operations such as linear
      layers and convolutions are much faster in float16, while operations such as reductions need the
      wider range of float32, so each operation runs in the type that suits it [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/3#advanced-training-features
        locator: 'Chapter 3, Fine-tuning a model with the Trainer API: Advanced Training Features'
      - title: Automatic Mixed Precision package - torch.amp (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/amp.html
        locator: Introduction
    source:
      id: hf-llm-course
      ref: chapter3/3#q3
      url: https://huggingface.co/learn/llm-course/chapter3/3
    status: draft
  - id: training-002
    type: single
    difficulty: easy
    question: What is gradient accumulation and how do you enable it?
    options:
      - text: It saves gradients to disk, enabled with `save_gradients=True`.
        why: Gradient accumulation doesn't involve saving gradients to disk.
      - text: It accumulates gradients over multiple batches before updating, enabled with `gradient_accumulation_steps`.
        correct: true
      - text: It speeds up gradient computation, enabled automatically with `fp16`.
        why: While fp16 can speed up training, gradient accumulation is a separate technique.
      - text: It prevents gradient overflow, enabled with `gradient_clipping=True`.
        why: That describes gradient clipping, not gradient accumulation.
    explanation: |
      Gradient accumulation adds up the gradients of several batches and updates the weights only once
      after them, which simulates a larger batch when GPU memory is limited [^1]. In the Trainer it is
      set with `gradient_accumulation_steps`: a per-device batch size of 4 with 4 accumulation steps
      gives an effective batch size of 16 [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/3#advanced-training-features
        locator: 'Chapter 3, Fine-tuning a model with the Trainer API: Advanced Training Features'
    source:
      id: hf-llm-course
      ref: chapter3/3#q6
      url: https://huggingface.co/learn/llm-course/chapter3/3
    status: draft
  - id: training-003
    type: single
    difficulty: medium
    question: What is the main difference between Adam and AdamW optimizers?
    options:
      - text: AdamW uses a different learning rate schedule.
        why: Learning rate scheduling is separate from the optimizer choice.
      - text: AdamW includes decoupled weight decay regularization.
        correct: true
      - text: AdamW only works with transformer models.
        why: AdamW can be used with any model architecture, not just transformers.
      - text: AdamW requires less memory than Adam.
        why: Both optimizers have similar memory requirements.
    explanation: |
      AdamW separates weight decay from the gradient-based parameter updates, leading to better
      regularization [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/4#prepare-for-training
        locator: 'Chapter 3, A full training loop: Prepare for training'
    source:
      id: hf-llm-course
      ref: chapter3/4#q1
      url: https://huggingface.co/learn/llm-course/chapter3/4
    status: draft
  - id: training-004
    type: single
    difficulty: medium
    question: In a training loop that uses a learning-rate scheduler, what is the correct order of operations for each batch?
    options:
      - text: Forward pass → Backward pass → Scheduler step → Optimizer step → Zero gradients
        why: The scheduler should step after the optimizer. In PyTorch, calling the scheduler before the optimizer's update skips the first value of the learning-rate schedule.
      - text: Forward pass → Backward pass → Optimizer step → Scheduler step → Zero gradients
        correct: true
      - text: Zero gradients → Forward pass → Optimizer step → Backward pass
        why: The optimizer step comes before the backward pass here, so it cannot use the gradients of the current batch.
      - text: Forward pass → Backward pass → Zero gradients → Optimizer step → Scheduler step
        why: Zeroing the gradients between the backward pass and the optimizer step wipes out the gradients that were just computed.
    explanation: |
      The forward pass computes the loss, the backward pass fills in the gradients, and the optimizer
      step uses them to update the parameters; the course's loop then steps the learning-rate scheduler
      and clears the gradients [^1]. PyTorch also requires the scheduler to be stepped after the
      optimizer's update [^2]. PyTorch adds each new gradient to the one already stored [^3], so the
      gradients are cleared once per batch, but never between the backward pass and the optimizer
      step: either at the end, as here, or at the start of the next iteration, as in PyTorch's own
      examples [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/4#the-training-loop
        locator: 'Chapter 3, A full training loop: The training loop'
      - title: torch.optim (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/optim.html#how-to-adjust-learning-rate
        locator: Taking an optimization step; How to adjust learning rate
        quote: Learning rate scheduling should be applied after optimizer’s update
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
        locator: Sec. 2.5.1 A Simple Function
        quote: Instead, the new gradient is added to the already-stored gradient.
    source:
      id: hf-llm-course
      ref: chapter3/4#q2
      url: https://huggingface.co/learn/llm-course/chapter3/4
    status: draft
  - id: training-005
    type: single
    difficulty: easy
    question: What does it typically mean when training loss decreases but validation loss starts increasing?
    options:
      - text: The model is learning successfully and will continue to improve.
        why: If validation loss is increasing while training loss decreases, this indicates a problem, not success.
      - text: The model is overfitting to the training data.
        correct: true
      - text: The learning rate is too low.
        why: A low learning rate would cause slow learning, not the divergence between training and validation performance.
      - text: The dataset is too small.
        why: While small datasets can contribute to overfitting, this specific pattern is the definition of overfitting regardless of dataset size.
    explanation: |
      This is a classic sign of overfitting: the model performs well on training data but poorly on
      unseen validation data [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/5#overfitting
        locator: 'Chapter 3, Understanding Learning Curves: Overfitting'
    source:
      id: hf-llm-course
      ref: chapter3/5#q1
      url: https://huggingface.co/learn/llm-course/chapter3/5
    status: draft
  - id: training-006
    type: single
    difficulty: medium
    question: Why do accuracy curves often show a "steppy" or plateau-like pattern rather than smooth increases?
    options:
      - text: There is a bug in how the accuracy is being calculated.
        why: The steppy pattern is normal and expected, not an error.
      - text: Accuracy changes only when a prediction flips to another class.
        correct: true
      - text: The model is not learning effectively between the jumps.
        why: Steppy accuracy curves are normal even when the model is learning well.
      - text: The batch size is too small to give stable gradient estimates.
        why: Batch size affects training stability but doesn't explain the inherently discrete nature of accuracy metrics.
    explanation: |
      Unlike loss, accuracy depends on discrete prediction decisions, so small improvements in
      confidence may not change the final accuracy until a threshold is crossed [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/5#accuracy-curves
        locator: 'Chapter 3, Understanding Learning Curves: Accuracy Curves'
    source:
      id: hf-llm-course
      ref: chapter3/5#q2
      url: https://huggingface.co/learn/llm-course/chapter3/5
    status: draft
  - id: training-007
    type: single
    difficulty: easy
    question: What is the best approach when you observe erratic, highly fluctuating learning curves?
    options:
      - text: Increase the learning rate to speed up convergence.
        why: Increasing the learning rate would likely make the fluctuations worse.
      - text: Reduce the learning rate and possibly increase the batch size.
        correct: true
      - text: Stop training immediately as the model won't improve.
        why: Erratic curves can often be fixed with hyperparameter adjustments.
      - text: Switch to a completely different model architecture.
        why: This is premature - erratic curves are usually fixable with hyperparameter tuning.
    explanation: Lower learning rates and larger batch sizes typically lead to more stable training [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/5#erratic-learning-curves
        locator: 'Chapter 3, Understanding Learning Curves: Erratic Learning Curves'
    source:
      id: hf-llm-course
      ref: chapter3/5#q3
      url: https://huggingface.co/learn/llm-course/chapter3/5
    status: draft
  - id: training-008
    type: single
    difficulty: easy
    question: When should you consider using early stopping?
    options:
      - text: Always, as it prevents any form of overfitting.
        why: Early stopping is useful but not always necessary, especially if other regularization methods are working.
      - text: When validation performance stops improving or starts degrading.
        correct: true
      - text: Only when training loss is still decreasing rapidly.
        why: If training loss is decreasing rapidly and validation performance is good, you might want to continue training.
      - text: Never, as it prevents the model from reaching its full potential.
        why: Early stopping is a valuable technique that often improves final model performance by preventing overfitting.
    explanation: |
      Early stopping helps prevent overfitting by stopping training when the model no longer
      generalizes better, i.e. when validation performance stops improving [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/5#overfitting
        locator: 'Chapter 3, Understanding Learning Curves: Overfitting (solutions)'
    source:
      id: hf-llm-course
      ref: chapter3/5#q4
      url: https://huggingface.co/learn/llm-course/chapter3/5
    status: draft
  - id: training-009
    type: single
    difficulty: easy
    question: What indicates that your model might be underfitting?
    options:
      - text: Training accuracy is much higher than validation accuracy.
        why: This describes overfitting, not underfitting.
      - text: Both training and validation performance are poor and plateau early.
        correct: true
      - text: The learning curves are very smooth with no fluctuations.
        why: Smooth curves are generally good and don't indicate underfitting.
      - text: Validation loss is decreasing faster than training loss.
        why: This would actually be a positive sign, not a problem.
    explanation: |
      Underfitting occurs when the model lacks capacity to learn the patterns, resulting in poor
      performance on both training and validation data [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/5#underfitting
        locator: 'Chapter 3, Understanding Learning Curves: Underfitting'
    source:
      id: hf-llm-course
      ref: chapter3/5#q5
      url: https://huggingface.co/learn/llm-course/chapter3/5
    status: draft
  - id: training-010
    type: single
    difficulty: easy
    question: Which pattern in the loss curves indicates potential overfitting?
    options:
      - text: Validation loss increases while training loss continues to decrease
        correct: true
      - text: Both training and validation loss decrease steadily
        why: This pattern actually indicates healthy training.
      - text: Training loss remains constant while validation loss decreases
        why: This would be an unusual pattern and doesn't indicate overfitting.
    explanation: This divergence between training and validation loss is a classic sign of overfitting [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3
        locator: 'Chapter 11, Supervised Fine-Tuning: Metrics to Monitor'
    source:
      id: hf-llm-course
      ref: chapter11/3#q2
      url: https://huggingface.co/learn/llm-course/chapter11/3
    status: draft
  - id: training-011
    type: single
    difficulty: easy
    question: What is `gradient_accumulation_steps` used for?
    options:
      - text: To increase effective batch size without using more memory
        correct: true
      - text: To save checkpoints during training
        why: This is handled by the `save_steps` and `save_strategy` parameters.
      - text: To control the learning rate schedule
        why: Learning rate scheduling is controlled by `learning_rate` and `warmup_ratio`.
    explanation: |
      It accumulates gradients across multiple forward and backward passes before updating the
      weights, which enables larger effective batch sizes [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3
        locator: 'Chapter 11, Supervised Fine-Tuning: Training Configuration (Batch Size Parameters)'
    source:
      id: hf-llm-course
      ref: chapter11/3#q3
      url: https://huggingface.co/learn/llm-course/chapter11/3
    status: draft
  - id: training-012
    type: single
    difficulty: easy
    question: What indicates healthy convergence during training?
    options:
      - text: A small gap between training and validation loss
        correct: true
      - text: Training loss reaching zero
        why: Extremely low loss values might indicate memorization rather than learning.
      - text: Validation loss being lower than training loss
        why: This would be unusual and might indicate problems with the validation set.
    explanation: |
      A small gap between training and validation loss indicates that the model is learning
      generalizable patterns rather than memorizing specific examples [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter11/3
        locator: 'Chapter 11, Supervised Fine-Tuning: The Path to Convergence'
    source:
      id: hf-llm-course
      ref: chapter11/3#q5
      url: https://huggingface.co/learn/llm-course/chapter11/3
    status: draft
  - id: training-013
    type: single
    difficulty: medium
    question: Overfitting occurs because of ____
    options:
      - text: Not enough testing data
        why: Test data is only used to measure the finished model, so its size does not change what the model learns.
      - text: Too powerful model
        correct: true
      - text: Too much training data
        why: More training data makes overfitting less likely; adding data is one of the lesson's remedies.
    explanation: |
      A model with more parameters than the data can support can pass through every training point
      (training error 0) while its validation error is high. The lesson lists "too powerful model"
      as a cause of overfitting, next to too little training data and noisy input data [^1]. More
      training data works the other way: increasing the amount of training data is one of the
      lesson's ways to prevent overfitting [^1]. Test data is held out and only used to measure an
      already-trained, fixed model, so having little of it does not cause overfitting [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#why-overfitting-occurs
        locator: 'Lesson: Neural Network Frameworks, Overfitting (Why overfitting occurs; How to prevent overfitting)'
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html
        locator: Sec. 3.6.1 Training Error and Generalization Error
    source:
      id: ms-ai-for-beginners
      ref: quiz-105/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
    status: draft
  - id: training-014
    type: single
    difficulty: easy
    question: Which of these is not a normalization technique?
    options:
      - text: height normalization
        correct: true
      - text: weight normalization
      - text: layer normalization
    explanation: |
      Weight normalization and layer normalization are real normalization techniques, listed in the
      course next to the most widely used one, batch normalization [^1]. Layer normalization, for
      example, standardizes each example's activations with that example's own mean and standard
      deviation [^2]. "Height normalization" is not a technique.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#batch-normalization
        locator: Deep Learning Training Tricks, Batch Normalization
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
        locator: Sec. 8.5.2.3 Layer Normalization
    source:
      id: ms-ai-for-beginners
      ref: quiz-108/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: draft
  - id: training-015
    type: single
    difficulty: easy
    question: We choose Stochastic Gradient Descent (SGD) in deep learning because classical gradient descent can be ____
    options:
      - text: fast
      - text: slow
        correct: true
    explanation: |
      The course notes that classical gradient descent can be too slow, so deep learning uses SGD,
      which applies gradient descent to randomly chosen minibatches [^1]. Full-batch gradient descent
      has to go through the whole training set for every single update, so each step costs
      $\mathcal{O}(n)$ and grows with the dataset [^2]. A stochastic gradient costs $\mathcal{O}(1)$
      per example and is still correct on average (an unbiased estimate of the full gradient) [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#optimizers--training-algorithms
        locator: Deep Learning Training Tricks, Optimizers / Training Algorithms
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
        locator: Sec. 12.4.1 Stochastic Gradient Updates
    source:
      id: ms-ai-for-beginners
      ref: quiz-108/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: draft
  - id: training-016
    type: single
    difficulty: easy
    question: Dropout layers act as a ____ technique
    options:
      - text: gradient boosting
      - text: training
      - text: regularization
        correct: true
    explanation: |
      Dropout zeroes a random fraction of neurons (typically 10-50%) at each training step [^1]. The
      course presents it as a regularization technique against overfitting [^2], and d2l calls it
      standard dropout regularization [^3]. The injected noise stops the next layer from relying on
      any single unit, and dropout is normally turned off at test time, so it is not just another
      "training" step and has nothing to do with gradient boosting [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#dropout
        locator: Deep Learning Training Tricks, Dropout
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#how-to-prevent-overfitting
        locator: 'Lesson: Neural Network Frameworks, How to prevent overfitting'
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout-in-practice
        locator: Sec. 5.6 Dropout and Sec. 5.6.1 Dropout in Practice
    source:
      id: ms-ai-for-beginners
      ref: quiz-208/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: draft
  - id: training-017
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** A neural network's convergence depends on the learning rate.

      **Statement 2.** Dropout multiplies randomly chosen activation values by zero.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is true: a learning rate that is too small makes gradient descent crawl, and one
      that is too large overshoots the minimum and can diverge, so whether and how fast training
      converges depends on it [^1]. Statement 2 is true: during training, dropout zeroes each
      activation with probability $p$ and rescales the survivors by $1/(1-p)$ [^2][^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
        locator: Sec. 5.6 Dropout, Eq. (5.6.1)
      - title: torch.nn.Dropout (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: Class description
    source:
      id: mmlu-redux
      ref: machine_learning/4
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=4
    status: draft
  - id: training-018
    type: single
    difficulty: medium
    question: Which is true about Batch Normalization?
    options:
      - text: After applying batch normalization, the layer’s activations will follow a standard Gaussian distribution.
      - text: The bias parameter of affine layers becomes redundant if a batch normalization layer follows immediately afterward.
        correct: true
      - text: The standard weight initialization must be changed when using Batch Normalization.
      - text: Batch Normalization is equivalent to Layer Normalization for convolutional neural networks.
    explanation: |
      When batch normalization normalizes $Wu + b$, subtracting the mini-batch mean cancels $b$, and
      BN's learned shift $\beta$ takes over its role, so the affine layer's bias is redundant [^1].
      The other options fail. BN standardizes only the mean and variance and then applies a learned
      scale and shift; the authors stress the normalized values are not guaranteed to be Gaussian
      [^1]. BN makes training less sensitive to the scale of the weights rather than demanding a new
      initialization scheme [^1]. Layer normalization normalizes each example on its own instead of
      across the mini-batch, so it is not the same operation [^2].
    references:
      - title: 'Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift (Ioffe & Szegedy, 2015)'
        url: https://arxiv.org/abs/1502.03167
        locator: Sec. 3 (Alg. 1), Sec. 3.2 Batch-Normalized Convolutional Networks, Sec. 3.3
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
        locator: Sec. 8.5.2.3 Layer Normalization
    source:
      id: mmlu-redux
      ref: machine_learning/30
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=30
    status: draft
  - id: training-019
    type: single
    difficulty: medium
    question: If your training loss increases with number of epochs, which of the following could be a possible issue with the learning process?
    options:
      - text: Regularization is too low and model is overfitting
      - text: Regularization is too high and model is underfitting
      - text: Step size is too large
        correct: true
      - text: Step size is too small
    explanation: |
      Rising training loss means the updates are making things worse, which is what a step size
      that is too large does: each update overshoots the minimum and the iterates can diverge [^1].
      A step size that is too small only makes the loss fall slowly [^1]. Over- or
      under-regularization shows up differently: underfitting keeps training and validation error
      both high, and overfitting gives low training error with a large gap to validation error [^2].
      Neither makes the training loss climb epoch after epoch.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#underfitting-or-overfitting
        locator: Sec. 3.6.2 Underfitting or Overfitting?
    source:
      id: mmlu-redux
      ref: machine_learning/95
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=95
    status: draft
  - id: training-020
    type: short_answer
    difficulty: easy
    tags:
      - normalization
    question: Name the technique that standardizes a layer's inputs using the mean and variance of the current minibatch and then applies a learnable scale and shift.
    answer:
      accept:
        - batch normalization
        - batch normalisation
        - batchnorm
        - BN
      model: Batch normalization
    explanation: Batch normalization normalizes each feature with minibatch statistics, then rescales it with a learnable scale $\gamma$ and shift $\beta$ so the layer keeps its expressiveness [^1].
    references:
      - source: d2l
        locator: Sec. 8.5 Batch Normalization
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html
    source:
      id: original
      ref: training-020
    status: reviewed
  - id: training-021
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - gradient-descent
      - learning-rate
    question: In the gradient-descent update $\theta \leftarrow \theta - \eta \, \nabla_\theta L$, what does the learning rate $\eta$ control?
    options:
      - text: How many input features the model has
        why: That is fixed by the data.
      - text: The target value of each example
        why: Targets come from the data.
      - text: The share of examples kept for testing
        why: That is part of the data split.
      - text: How large a step is taken for a given gradient
        correct: true
    explanation: '$\eta$ scales the gradient in every update: a larger value takes bigger steps and can overshoot, a smaller value converges slowly [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 52–53
      - source: d2l
        locator: Sec. 12.3 Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html
        quote: the direction of steepest descent is given by the negative gradient
    source:
      id: ncu-intro-dl
      ref: exercise-01/q15
    status: reviewed
  - id: training-022
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - epoch
      - mini-batch
    question: A training set has 10,000 examples and the mini-batch size is 100. How many parameter updates happen in one epoch?
    options:
      - text: '10'
      - text: '100'
        correct: true
      - text: 1,000
      - text: 10,000
        why: That would be one update per example (batch size 1).
    explanation: 'One epoch is one pass over all the data: $10{,}000 / 100 = 100$ mini-batches, with one update per mini-batch [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 54
      - source: d2l
        locator: Sec. 12.5 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html
