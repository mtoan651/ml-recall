  - id: training-083
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - dead-relu
      - vanishing-gradients
    question: |
      After some training, a ReLU unit in the first hidden layer has a negative pre-activation for
      every training example. What happens to it under further gradient descent on the training
      set?
    options:
      - text: All of its weights and its bias get zero gradient, so it stays inactive
        correct: true
      - text: Its gradients explode, because the ReLU function is unbounded above
        why: On the inactive side the ReLU slope is 0, so the unit passes no gradient at all.
      - text: It behaves like a linear unit with slope 1 until it becomes active again
        why: Slope 1 applies only to positive pre-activations; here the slope is 0 on every example.
      - text: Its outgoing weight keeps growing until the unit becomes active again
        why: The outgoing weight's gradient is the unit's output (0) times the upstream gradient, so it does not change.
    explanation: |
      For an inactive ReLU the local derivative is 0, so the gradients of its incoming weights and
      bias ($x_i\delta$ and $\delta$) vanish, and its outgoing weight's gradient is its activation,
      0, times the upstream gradient [^1][^2]. If this holds on every example the unit is "dead":
      its inputs are the fixed training data, so nothing can make its pre-activation positive
      again (a unit in a deeper layer can still be revived when the layers below it change). Too
      large a learning rate makes this more likely; leaky variants keep a small slope on the
      negative side so that some gradient always flows [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 77, 91
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
        locator: Sec. 5.1.2.1 ReLU Function
      - title: 'Wikipedia: Rectified linear unit'
        url: https://en.wikipedia.org/wiki/Rectified_linear_unit
        locator: Potential problems (dying ReLU)
