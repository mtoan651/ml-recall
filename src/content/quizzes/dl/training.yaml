  - id: training-024
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-ex03
      - early-stopping
      - regularization
    question: Name the technique that halts training once validation performance stops improving, in order to limit overfitting.
    answer:
      accept:
        - early stopping
        - early-stopping
      model: Early stopping.
    explanation: Early stopping checks validation performance after each epoch and stops when it no longer improves (or gets worse), even if the training loss is still falling [^1][^2].
    references:
