  - id: training-026
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex03
      - momentum
      - optimizers
    question: How does momentum change gradient-based updates?
    options:
      - text: It only looks at the current loss value.
      - text: It accumulates past gradients into a velocity that steers each update.
        correct: true
      - text: It removes the bias terms.
        why: Momentum changes how updates are computed, not which parameters the model has.
      - text: It guarantees reaching the global minimum.
        why: No optimizer guarantees this for non-convex losses.
    explanation: Momentum keeps a velocity $v_t = \beta v_{t-1} + g_t$ that averages recent gradients and updates with $x_t = x_{t-1} - \eta v_t$, which damps oscillations and speeds up progress along consistent directions [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 37
      - source: d2l
        locator: Sec. 12.6 Momentum
        url: https://d2l.ai/chapter_optimization/momentum.html
    source:
      id: ncu-intro-dl
      ref: exercise-03/q16
    status: reviewed
  - id: training-027
    type: single
    difficulty: medium
    tags:
      - adam
      - ce6146
      - ce6146-ex03
      - optimizers
    question: Which description fits the Adam optimizer?
    options:
      - text: It looks at the test set before every update.
        why: The test set must never influence training.
      - text: It updates only the biases.
      - text: It does not use gradient information.
      - text: It keeps running estimates of the first and second moments of the gradients.
        correct: true
    explanation: Adam keeps an exponential moving average of the gradients ($m_t$, as in momentum) and of the squared gradients ($v_t$, as in RMSProp), bias-corrects both, and scales each parameter's step accordingly [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 46
      - source: d2l
        locator: Sec. 12.10 Adam
        url: https://d2l.ai/chapter_optimization/adam.html
    source:
      id: ncu-intro-dl
      ref: exercise-03/q17
    status: reviewed
