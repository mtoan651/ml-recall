  - id: training-065
    type: multiple
    difficulty: medium
    tags:
      - sgd
      - learning-rate
      - batch-size
    question: |
      You train a linear model with minibatch SGD and vary the learning rate and the batch size.
      Which statements are true? Select all that apply.
    options:
      - text: Smaller batches give noisier weight updates and noisier loss curves
        correct: true
      - text: With a smaller learning rate, the network needs more minibatches before its weights converge
        correct: true
      - text: Too large a learning rate can make the training fail completely
        correct: true
      - text: Larger batches give noisier loss curves, because each step uses more data
        why: A larger batch is a larger sample of the data, so its gradient estimate is less noisy, not more [^2].
      - text: A smaller learning rate makes each training step take longer to compute
        why: The learning rate only scales the size of the update; a step costs the same, there are just more of them [^1].
    explanation: |
      Each minibatch is a random sample of the data, and smaller samples give noisier estimates, so
      small batches make noisier updates and loss curves [^2]. The learning rate sets how far the
      weights move toward each batch's solution: a smaller rate needs more minibatches to converge
      [^1], while a large one speeds training but does not settle into a minimum as well, and a rate
      that is too large can make training fail [^2]. Adam adapts the learning rate itself, which is
      why it works well without tuning [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 3 Stochastic Gradient Descent — tutorial, Learning Rate and Batch Size
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/tut3.ipynb
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 3 exercise, Question 4 Learning Rate and Batch Size (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/deep_learning_intro/ex3.py
    source:
      id: kaggle-learn
      ref: deep_learning_intro/ex3#q4
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/ex3.ipynb
