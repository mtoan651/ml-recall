  - id: training-086
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - l2-regularization
      - weight-decay
    question: |
      A network is trained by SGD on the penalized loss $L_{\text{new}} = L + \lambda\sum_i w_i^2$
      with $\lambda = 0.005$ and $\eta = 0.1$. For a weight $w = 3$ whose data-loss gradient is
      $\partial L/\partial w = 0.5$, what is $w$ after one step?
    answer:
      numeric: 2.947
      tolerance: 0.0005
      hint: a number
      model: $w \leftarrow w - \eta(\partial L/\partial w + 2\lambda w) = (1 - 2\eta\lambda)w - \eta\,\partial L/\partial w = 0.999 \cdot 3 - 0.05 = 2.947$
    explanation: |
      The penalty adds $2\lambda w$ to the gradient, so one SGD step is
      $w \leftarrow (1 - 2\eta\lambda)w - \eta\,\partial L/\partial w$ [^1]: the weight is first
      shrunk by the factor $0.999$ and then moved by the data gradient, giving $2.997 - 0.05 =
      2.947$. This multiplicative shrinkage is why the L2 penalty is called weight decay; with the
      common convention $\tfrac{\lambda}{2}\lVert w\rVert^2$ the factor is $1 - \eta\lambda$
      [^2]. The equivalence holds for plain SGD only: with adaptive optimizers such as Adam, an L2
      penalty and a direct (decoupled) weight decay behave differently [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 59, 62
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html
        locator: Sec. 3.7.1 Norms and Weight Decay, Eq. (3.7.3)
      - title: Loshchilov & Hutter (2019), Decoupled Weight Decay Regularization, arXiv:1711.05101
        url: https://arxiv.org/abs/1711.05101
        locator: Abstract; Sec. 2 Decoupling the weight decay from the gradient-based update
    source:
      id: ncu-intro-dl
      ref: lecture-03/q15
    status: reviewed
    reviewed_by: claude
  - id: training-087
    type: true_false
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - weight-decay
      - adam
      - adamw
    question: |
      True or false: with plain SGD, adding an L2 penalty $\lambda\lVert w\rVert^2$ to the loss is
      equivalent to weight decay (shrinking the weights by a constant factor each step), but with
      Adam it is not.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: For Adam the penalty's gradient is divided by the adaptive per-parameter scale, so the shrinkage differs from parameter to parameter; only SGD gives the plain constant-factor decay.
    explanation: |
      With SGD the penalty's gradient $2\lambda w$ simply shrinks each weight by $1 - 2\eta\lambda$,
      which is weight decay [^1]. With Adam the penalty's gradient passes through the adaptive
      per-parameter scaling, so weights with large gradient history are decayed less than intended
      [^2]. Decoupled weight decay (AdamW) applies the shrinkage directly to the weights, outside the
      adaptive step, restoring the intended behaviour [^2]. Calling L2 regularization "weight decay"
      is therefore exact only for plain SGD.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 62
      - title: Loshchilov & Hutter (2019), Decoupled Weight Decay Regularization, arXiv:1711.05101
        url: https://arxiv.org/abs/1711.05101
        locator: Sec. 1 Introduction; Sec. 2 Decoupling the weight decay from the gradient-based update
    source:
      id: ncu-intro-dl
      ref: lecture-03/q16
    status: reviewed
    reviewed_by: claude
  - id: training-088
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - l1-regularization
      - sparsity
    question: |
      Why does an L1 penalty $\lambda\sum_i |w_i|$ tend to drive some weights exactly to zero,
      while an L2 penalty $\lambda\sum_i w_i^2$ only makes them small?
    options:
      - text: L1 pushes each nonzero weight toward 0 with constant force λ; the L2 push 2λw fades near 0
        correct: true
      - text: The L1 penalty punishes large weights more strongly than the L2 penalty does
        why: It is the reverse — squaring makes L2 grow faster for large weights; L1 is relatively stronger for small weights.
      - text: The L1 penalty is applied only to biases, and units whose bias reaches zero are then pruned
        why: Both penalties are normally applied to weights; sparsity concerns the weights themselves.
      - text: The L1 penalty makes the loss non-convex, and non-convex losses have minima at zero
        why: The L1 penalty is convex; sparsity comes from its kink at zero, not from non-convexity.
    explanation: |
      The (sub)gradient of $\lambda|w|$ has constant magnitude $\lambda$ for every $w \neq 0$, so
      small weights keep being pushed toward zero until they reach it; the kink at 0 lets them
      stay there [^1][^2]. The L2 gradient $2\lambda w$ becomes tiny for small weights, which are
      shrunk but rarely become exactly zero. L1 therefore acts as feature selection, while L2
      spreads weight across many features [^3]; elastic net combines both.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 62–63, 71
      - title: 'Wikipedia: Lasso (statistics)'
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)
        locator: Basic form — Orthonormal covariates (soft thresholding); Interpretations — Geometric interpretation
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html
        locator: Sec. 3.7.1 Norms and Weight Decay
    source:
      id: ncu-intro-dl
      ref: lecture-03/q17
    status: reviewed
    reviewed_by: claude
  - id: training-089
