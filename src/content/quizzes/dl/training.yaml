  - id: training-103
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l01
      - ce6146-l03
      - early-stopping
      - patience
    question: |
      Early stopping ends training once the validation loss has not improved for a number of epochs
      called the patience, and then restores the best checkpoint. What changes if the patience is raised
      from 2 to 10 epochs?
    options:
      - text: Short plateaus no longer end training, so it may run more epochs
        correct: true
      - text: Training ends sooner, because ten epochs are now checked at once
        why: A longer patience waits longer for an improvement, so training stops at the same epoch or later.
      - text: The restored checkpoint can only have a higher validation loss
        why: The best validation loss is taken over at least as many epochs, so it can only stay the same or get lower.
      - text: The model can no longer overfit during the extra epochs it trains
        why: The extra epochs can still overfit; restoring the best checkpoint is what discards them.
    explanation: |
      Early stopping monitors the validation loss after each epoch and stops once it has not improved
      for the patience window, keeping the best checkpoint [^1][^2]. A patience of 2 can end training
      during a brief plateau or bump although the loss would improve again later; a patience of 10 rides
      through such stretches, at the cost of more epochs before stopping. Either way, the restored
      weights are those with the lowest validation loss seen.
    references:
      - source: ncu-intro-dl
        locator: Exercise 2, question 19; Lecture 1, slide 83; Lecture 3, slides 58, 67
      - source: d2l
        locator: Sec. 5.5.3 Early Stopping
