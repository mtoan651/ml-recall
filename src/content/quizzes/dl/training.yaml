  - id: training-108
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - regularization
      - underfitting
      - dropout
    question: |
      A network has 30% training error and 31% validation error, far worse than similar models reach on
      this task. A teammate proposes adding dropout. What is the most likely result?
    options:
      - text: No real gain; the model underfits, and dropout restricts it further
        correct: true
      - text: A clear gain, because dropout lowers the validation error of any model
        why: Regularization helps only when the model overfits; it does not improve a model that is already too restricted.
      - text: Lower training error, because dropout makes the network more flexible
        why: Dropout restrains the network during training, so the training error usually rises.
      - text: A clear gain, because a 1-point gap is a strong sign of overfitting
        why: Overfitting means a low training error with a much higher validation error; here both are high.
    explanation: |
      Regularization such as dropout restrains effective model capacity to reduce overfitting and improve
      generalization [^1][^2]. With 30% training and 31% validation error the model is not overfitting
      but underfitting — it does not even fit the training data — so restraining it further brings no
      real gain; more capacity, longer training or better features address underfitting [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 18; Lecture 3, slides 59–60, 65
      - source: d2l
        locator: Sec. 3.7.5 Summary
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#summary
      - source: d2l
        locator: Sec. 3.6.2 Underfitting or Overfitting?
