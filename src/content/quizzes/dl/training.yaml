  - id: training-031
    type: single
    question: Which of the following statements is true?
    options:
      - text: Larger batches are unsuitable for data with many outliers.
        why: This statement is false. By averaging more gradients together, larger batch sizes can help reduce the negative effects of having outliers in the data.
      - text: Doubling the learning rate can slow down training.
        correct: true
    explanation: This statement is true. Doubling the learning rate can result in a learning rate that is too large, and therefore cause the weights to "bounce around," increasing the amount of time needed to converge. As always, the best hyperparameters depend on your dataset and available compute resources. [^1]
    references:
      - source: google-mlcc
