    question: |
      Max-norm regularization caps the Euclidean length of every unit's incoming weight vector at $c = 2$:
      after an update, a vector whose norm exceeds $c$ is rescaled to norm $c$. An update leaves the
      weights $w = (3, 4)$. After the constraint is applied, the first weight is {{1}} and the
      second is {{2}}.
    answer:
      blanks:
        - numeric: 1.2
          tolerance: 0.001
          hint: a number
        - numeric: 1.6
          tolerance: 0.001
          hint: a number
      model: $\lVert w\rVert_2 = 5 > 2$, so $w \leftarrow w \cdot 2/5 = (1.2, 1.6)$.
    explanation: |
      The norm of $(3, 4)$ is 5, above the cap, so the vector is divided by $5/2$: its direction is
      kept and its length becomes exactly 2 [^1][^2]. Vectors already within the cap are left
      unchanged. Unlike a penalty, the constraint bounds the weights however large an update is,
      which is why it combines well with dropout and large learning rates [^2].
