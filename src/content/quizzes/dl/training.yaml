  - id: training-109
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - early-stopping
    question: 'True or false: early stopping halts training as soon as the training loss stops decreasing.'
    options:
      - text: 'True'
        why: Early stopping watches validation performance; the training loss often keeps falling while the model starts to overfit.
      - text: 'False'
        correct: true
    explanation: |
      Early stopping evaluates the model on validation data, typically after every epoch, and stops when
      validation performance has not improved for a set number of epochs — even if the training loss is
      still decreasing [^1][^2]. Only the validation curve reveals overfitting.
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 19; Lecture 3, slide 67
      - source: d2l
        locator: Sec. 5.5.3 Early Stopping
