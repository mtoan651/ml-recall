      id: ncu-intro-dl
      ref: lecture-02/q27
    status: reviewed
    reviewed_by: claude
  - id: training-084
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - momentum
      - pytorch
    question: |
      `torch.optim.SGD` implements momentum without the $(1 - \beta)$ factor of the moving-average
      form: with momentum $\beta$ it keeps a buffer $b_t = \beta\,b_{t-1} + g_t$ (starting with
      $b_1 = g_1$) and updates $w \leftarrow w - \eta\,b_t$. What does this code print?

      ```python
      import torch
      w = torch.tensor(1.0, requires_grad=True)
      opt = torch.optim.SGD([w], lr=0.1, momentum=0.9)
      for _ in range(2):
          opt.zero_grad()
          loss = w ** 2
          loss.backward()
          opt.step()
      print(round(w.item(), 4))
      ```
    answer:
      numeric: 0.46
      tolerance: 0.0002
      hint: a number with up to 4 decimals
      model: $b_t = 0.9\,b_{t-1} + g_t$ with $b_1 = g_1$. Step 1 — $g = 2$, $b = 2$, $w = 0.8$. Step 2 — $g = 1.6$, $b = 1.8 + 1.6 = 3.4$, $w = 0.8 - 0.34 = 0.46$.
    explanation: |
      With its default dampening of 0, `torch.optim.SGD` keeps the buffer
      $b_t = \beta b_{t-1} + g_t$, with $b_1 = g_1$, and steps $w \leftarrow w - \eta\,b_t$ [^2].
      With $g = 2w$, step 1 gives $b = 2$ and $w = 0.8$; step 2 gives $g = 1.6$,
      $b = 0.9 \cdot 2 + 1.6 = 3.4$ and $w = 0.8 - 0.34 = 0.46$. The moving-average form
      $v_t = \beta v_{t-1} + (1 - \beta)g_t$ [^1] would give $0.9424$ with the same $\eta$: it
      scales each gradient by $1 - \beta$, so PyTorch's version moves about $1/(1 - \beta) = 10$
      times further once the buffer has built up [^3]. The two forms are equivalent once $\eta$ is
      rescaled by that factor.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 37
      - title: torch.optim.SGD (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html
        locator: Algorithm (momentum buffer, dampening)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html
        locator: Sec. 12.6.1.4 Effective Sample Weight
    source:
      id: ncu-intro-dl
      ref: lecture-03/q07
    status: reviewed
    reviewed_by: claude
  - id: training-085
    type: multiple
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l03
      - optimizers
      - momentum
      - adam
      - rmsprop
      - adagrad
    question: |
      Two parameters receive gradients of the same size: one always gets $+1$, the other alternates
      $+1, -1, +1, -1, \dots$, as when the iterates zig-zag across a narrow valley. With the usual
      settings (momentum coefficient and decay rates around 0.9 or above), which optimizers end up
      moving the alternating parameter by much smaller steps than the steady one? Select all that
      apply.
    options:
      - text: SGD with momentum
        correct: true
      - text: Adam
        correct: true
      - text: RMSProp
        why: It divides each gradient by the root of a moving average of squared gradients, which tends to 1 for both parameters, so both keep steps of about η.
      - text: AdaGrad
        why: Both parameters accumulate the same sum of squared gradients, so their step sizes shrink in exactly the same way.
    explanation: |
      Momentum steps along a running average of the gradients themselves [^1][^2]: for a constant
      gradient the velocity builds up, while alternating signs largely cancel, so the zig-zag
      direction is damped and the consistent one is not — about 19 times smaller steps here with
      coefficient 0.9. Adam's first moment is the same kind of average, so it damps the
      oscillation as well [^3]. RMSProp and AdaGrad only rescale each step by the size of past
      gradients — squaring removes the sign — and the two parameters have gradients of identical
      size, so they get identical step sizes [^1][^4][^5].
