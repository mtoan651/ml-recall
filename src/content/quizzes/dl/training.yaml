  - id: training-094
    type: single
    difficulty: easy
    tags:
      - learning-rate
      - divergence
      - learning-curves
    question: |
      From the very first epochs, the validation error goes up after every epoch. You look at the
      training error and see that it goes up after every epoch too. What is the most likely cause?
    options:
      - text: The learning rate is too high and training diverges
        correct: true
      - text: The model is overfitting the training set
        why: Overfitting shows a training error that keeps going down while the validation error goes up; here both rise.
      - text: The model is too simple for the data
        why: An underfitting model has errors that stay high, but training still makes them go down or level off rather than rise every epoch.
      - text: The validation set comes from a different distribution than the training set
        why: A distribution mismatch would hurt validation performance only; it cannot make the training error grow.
    explanation: |
      Gradient descent should lower the training loss at almost every epoch. If the *training*
      error itself climbs steadily, the steps are overshooting: with an excessively large learning
      rate the update jumps past the minimum and the iterates can diverge [^2]. The fix is a smaller
      learning rate. If only the validation error rose while the training error kept falling, the
      diagnosis would instead be overfitting, and you would stop training early [^1].
    references:
      - source: handson-ml3
        locator: 04_training_linear_models.ipynb, Exercise solutions, 5.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/04_training_linear_models.ipynb
