        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
      - source: d2l
        locator: Sec. 4.5.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#exercises
