  - id: training-064
    type: multiple
    difficulty: easy
    tags:
      - underfitting
      - model-capacity
      - transfer-learning
    question: |
      Your image classifier underfits: training and validation accuracy are both low. Which changes are
      likely to help? Select all that apply.
    options:
      - text: Add more layers or hidden units
        correct: true
      - text: Train for more epochs
        correct: true
      - text: Start from a pretrained model (transfer learning)
        correct: true
      - text: Raise the dropout probability
        why: Dropout is a regularizer that fights overfitting; it makes fitting the training data harder, not easier [^2].
      - text: Increase the weight-decay coefficient
        why: Stronger weight decay further restricts the model, which worsens underfitting [^2].
    explanation: |
      Underfitting means the model has too little predictive power for the training data, so the cure
      is to increase it: a larger model, features transferred from a pretrained model, or simply more
      training time [^1]. Regularizers such as dropout and weight decay do the opposite — they restrain
      the model to reduce overfitting [^2].
    references:
      - source: learn-pytorch
        locator: 04 PyTorch Custom Datasets exercise solutions, Exercise 1 (methods for preventing underfitting)
        url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/04_pytorch_custom_datasets_exercise_solutions.ipynb
