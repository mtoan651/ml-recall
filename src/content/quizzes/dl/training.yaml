  - id: training-066
    type: single
    difficulty: easy
    tags:
      - learning-curves
      - underfitting
      - capacity
    question: |
      A linear model predicting song popularity gives learning curves in which the training and
      validation loss level off close to each other, the validation loss never rises, and both stay
      well above the loss that larger networks reach. What should you try next?
    options:
      - text: It underfits, so add capacity with wider or deeper layers
        correct: true
      - text: It is overfitting, so add an early-stopping callback
        why: Overfitting shows as a validation loss that rises while the training loss keeps falling; here it never rises [^1].
      - text: It is overfitting, so remove units from the model
        why: The small gap between the curves means the model has learned little noise; removing capacity would make it worse [^1].
      - text: It fits well, because the two learning curves stay close together
        why: A small gap only means little noise was learned; a loss that stays high means the model has not learned enough signal [^1].
    explanation: |
      The gap between the training and validation curves shows how much noise the model has learned,
      and underfitting means the loss is not as low as it could be because the model has not learned
      enough signal [^1]. Close curves, a validation loss that never increases and a high final loss
      point to underfitting, which the exercise's solution diagnoses for the linear baseline [^2]. The
      remedy is more capacity, by making the network wider or deeper [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 4 Overfitting and Underfitting — tutorial, Interpreting the Learning Curves; Capacity
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/tut4.ipynb
      - source: kaggle-learn
        locator: Intro to Deep Learning, Lesson 4 exercise, Question 1 Evaluate Baseline (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/deep_learning_intro/ex4.py
    source:
      id: kaggle-learn
      ref: deep_learning_intro/ex4#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/deep_learning_intro/raw/ex4.ipynb
