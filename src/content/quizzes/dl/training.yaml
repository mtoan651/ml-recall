  - id: training-095
    type: short_answer
    difficulty: medium
    tags:
      - learning-rate-finder
      - lr-scheduler
      - exponential-lr
    question: |
      To find a good learning rate, you train for 500 iterations while growing the learning rate
      exponentially, record the loss at each iteration, and later look for where the loss shoots
      up:

      ```python
      opt = torch.optim.SGD(model.parameters(), lr=1e-5)
      sched = torch.optim.lr_scheduler.ExponentialLR(opt, gamma=g)
      for step in range(500):
          ...                # train on one batch, record the loss
          opt.step()
          sched.step()
      ```

      Which value of `g` makes the learning rate reach 10 after the 500 scheduler steps? Give 4
      decimals.
    answer:
      numeric: 1.0280
      tolerance: 0.0005
      hint: A number with 4 decimals, e.g. 1.0123
      model: $g = (10 / 10^{-5})^{1/500} = 10^{6/500} \approx 1.0280$
    explanation: |
      `ExponentialLR` multiplies the learning rate by `gamma` at every `sched.step()` [^2], so after
      500 steps the rate is $10^{-5} g^{500}$. Setting this to 10 gives
      $g = (10^6)^{1/500} = 10^{0.012} \approx 1.0280$ (running the loop confirms a final rate of
      10.0). Growing the rate geometrically spends the same number of iterations on each order of
      magnitude, from $10^{-5}$ to 10. Plotting the loss against the learning rate (log scale) and
      picking a rate somewhat below the point where the loss shoots up is the approach of the
      handson-ml3 MNIST exercise [^1]; it is a variant of Smith's "LR range test", which increases
      the rate linearly during a short run [^3].
    references:
      - source: handson-ml3
        locator: 10_neural_nets_with_keras.ipynb, Exercise solutions, 10.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/10_neural_nets_with_keras.ipynb
