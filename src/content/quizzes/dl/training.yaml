  - id: training-048
    type: short_answer
    difficulty: medium
    tags:
      - dropout
      - variance
      - noise-injection
    question: |
      With dropout probability $p = 0.2$, a hidden activation $h = 3$ is replaced by $h' = 0$ with
      probability $p$ and by $h' = h / (1 - p)$ otherwise. What is the variance of $h'$?
    answer:
      numeric: 2.25
      tolerance: 0.001
      hint: a number
      model: $h^2\dfrac{p}{1 - p} = 9 \times \dfrac{0.2}{0.8} = 2.25$
    explanation: |
      The rescaling makes dropout unbiased: $E[h'] = (1 - p)\frac{h}{1 - p} = h$ [^1]. The second
      moment is $E[h'^2] = (1 - p)\frac{h^2}{(1 - p)^2} = \frac{h^2}{1 - p}$, so
      $\mathrm{Var}[h'] = E[h'^2] - E[h']^2 = h^2\frac{p}{1 - p}$ [^2], here $11.25 - 9 = 2.25$. The
      noise grows with $p$ (at $p = 0.5$ the variance equals $h^2$) and is absent without dropout,
      which is why hidden activations fluctuate more in training mode than at test time.
    references:
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction), Eq. (5.6.1)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - source: d2l
        locator: Sec. 2.6.6 Expectations (variance)
        url: https://d2l.ai/chapter_preliminaries/probability.html#expectations
      - source: d2l
        locator: Sec. 5.6.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/dropout#ex3
      url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: training-049
    type: single
    difficulty: easy
    tags:
      - dropout
      - inference
      - mc-dropout
    question: Why is dropout usually switched off at test time?
    options:
      - text: The rescaling already makes the full network give the expected activations, so dropout is unneeded
        correct: true
      - text: Dropout layers learn their own weights during training, and those weights are discarded afterwards
        why: Dropout has no weights; it only zeroes and rescales activations [^1].
      - text: Without dropout, every activation must instead be multiplied by $1 - p$ at test time
        why: With this (inverted) dropout the rescaling by $1/(1 - p)$ happens during training, so nothing needs rescaling at test time [^1].
      - text: Keeping dropout at test time would leak information about the test labels into the model
        why: Dropout does not use labels at all; at test time it would only add random noise to the predictions.
    explanation: |
      During training each activation is zeroed with probability $p$ and the survivors are divided by
      $1 - p$, so the expected activation equals the one the full network computes [^1]. At test time
      we therefore use the full network without dropping or rescaling anything, and the same input
      always gets the same prediction [^1]. One exception: running many stochastic passes with dropout
      switched on gives a spread of predictions that can serve as an uncertainty estimate (Monte Carlo
      dropout) [^2].
    references:
      - source: d2l
        locator: Sec. 5.6.1 Dropout in Practice
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout-in-practice
      - title: Gal and Ghahramani (2016), Dropout as a Bayesian Approximation, arXiv:1506.02142
        locator: Abstract and Sec. 4
        url: https://arxiv.org/abs/1506.02142
      - source: d2l
        locator: Sec. 5.6.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/dropout#ex4
      url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: training-050
    type: multiple
    difficulty: medium
    tags:
      - dropout
      - regularization
      - bagging
      - ensembles
    question: |
      Goodfellow et al. compare dropout with bagging. Which statements about dropout in a neural
      network are true? Select all that apply.
    options:
      - text: It can be seen as cheaply training an ensemble of many subnetworks that share parameters, similar to bagging
        correct: true
      - text: It is normally switched off at test time, so predictions use the full network
        correct: true
      - text: Like bagging, every subnetwork is trained to convergence on its own data sample
        why: In dropout the subnetworks share weights and each sampled subnetwork typically receives only a single gradient step [^2].
      - text: It makes a network more likely to overfit the training data
        why: Dropout is a regulariser; randomly dropping units prevents co-adaptation and reduces overfitting [^1][^3].
    explanation: |
      Each training step samples a random subnetwork by dropping units, so training implicitly fits an
      exponentially large ensemble whose members share parameters; Goodfellow et al. describe dropout
      as a practical approximation to bagging [^2][^3]. At test time dropout is usually disabled and
      the full network is used, with activations scaled so their expectations match training
      (inverted dropout does this scaling during training) [^1][^3]. Unlike bagging, the members are
      not trained independently to convergence.
    references:
      - source: d2l
        locator: Sec. 5.6.1 Dropout in Practice
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout-in-practice
      - title: Goodfellow, Bengio and Courville (2016), Deep Learning
        url: https://www.deeplearningbook.org/contents/regularization.html
        locator: Sec. 7.12 Dropout
      - title: 'Srivastava et al. (2014), Dropout: A Simple Way to Prevent Neural Networks from Overfitting, JMLR 15'
        url: https://jmlr.org/papers/v15/srivastava14a.html
        locator: Abstract and Sec. 4 Model Description
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/dl.yml#q2
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/dl.yml
