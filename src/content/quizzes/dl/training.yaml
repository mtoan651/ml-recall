  - id: training-043
    type: single
    difficulty: medium
    tags:
      - mixed-precision
      - bfloat16
      - floating-point
      - overflow
    question: |
      Mixed-precision training often uses bfloat16 rather than float16, although bfloat16 has fewer
      mantissa bits. Why is bfloat16 safer for operations such as the $\exp$ inside a softmax?
    options:
      - text: It has more mantissa bits than float16, so large exponentials are rounded more precisely
        why: bfloat16 has fewer mantissa bits than float16 (7 versus 10), so it is less precise, not more [^1].
      - text: It saturates at its largest finite value instead of overflowing to infinity
        why: bfloat16 overflows to infinity like the other IEEE-style formats, only much later than float16 [^1].
      - text: It stores the logarithm of each number, so softmax never needs to exponentiate
        why: 'bfloat16 is an ordinary floating-point format: a sign, an exponent and a shortened float32 mantissa [^1].'
      - text: It keeps float32's 8 exponent bits, so $\exp$ overflows only above about 88.7, not 11.1
        correct: true
    explanation: |
      A floating-point format's range is set by its exponent bits, its precision by its mantissa bits.
      bfloat16 keeps float32's 8-bit exponent and cuts the mantissa to 7 bits [^1], so its largest value
      is about $3.4 \times 10^{38}$ and $\exp$ overflows only beyond $\ln(3.4 \times 10^{38}) \approx 88.7$,
      while float16's 5-bit exponent caps its values at 65504, i.e. $\exp$ overflows above about 11.1
      [^2]. In training, range matters more than the last digits, because overflowing values turn into
      `inf` and then `NaN` [^3].
    references:
      - title: 'Wikipedia: bfloat16 floating-point format'
        locator: Introduction and bfloat16 floating-point format
        url: https://en.wikipedia.org/wiki/Bfloat16_floating-point_format#bfloat16_floating-point_format
        quote: It preserves the approximate dynamic range of 32-bit floating-point numbers by retaining 8 exponent bits
      - title: 'Wikipedia: Half-precision floating-point format'
        locator: Half precision examples (largest normal number, smallest normal and subnormal numbers)
        url: https://en.wikipedia.org/wiki/Half-precision_floating-point_format#Half_precision_examples
      - source: d2l
        locator: Sec. 4.5.2 Softmax Revisited
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
      - source: d2l
        locator: Sec. 4.5.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#exercises
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression-concise#ex1-b
      url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#exercises
