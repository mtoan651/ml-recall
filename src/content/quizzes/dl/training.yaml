  - id: training-059
    type: single
    difficulty: medium
    tags:
      - minibatch-size
      - sgd
      - learning-rate
    question: |
      Under a fixed wall-clock time budget, you train the same MLP with SGD using small and large minibatches. Which
      statement describes the trade-off?
    options:
      - text: Larger batches give less noisy gradients and allow a larger learning rate, but fewer updates fit into the budget
        correct: true
      - text: Larger batches give noisier gradient estimates but allow more parameter updates per second
        why: Averaging over more examples reduces the gradient variance, and each forward and backward pass takes longer, so there are fewer updates.
      - text: The batch size has no effect on how training progresses; only the learning rate matters here
        why: NMA's comparison shows clearly different training curves for different batch sizes under the same time budget.
      - text: Very small batches are slow to compute, but they give the most accurate gradient estimates
        why: Small batches are fast to compute but represent the data poorly, giving high-variance gradient estimates.
    explanation: |
      The cost of a forward and backward pass grows roughly linearly with the number of examples, so larger minibatches
      mean fewer parameter updates in a fixed time [^1]. In exchange, the average gradient over more examples is a more
      confident estimate of the direction to move, so a larger learning rate can be used, while tiny minibatches are
      cheap but give high-variance estimates [^1][^2]. The learning rate therefore has to be tuned together with the batch
      size [^1].
    references:
      - source: neuromatch-dl
        locator: W1D4 Tutorial 1, Section 6 Full gradients are expensive (Interactive Demos 6.1 and 6.2)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 12.5 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html
    source:
      id: neuromatch-dl
      ref: W1D4_Optimization/W1D4_Tutorial1#sec6.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
