  - id: training-060
    type: true_false
    difficulty: easy
    tags:
      - minibatch-sampling
      - sampling-with-replacement
      - numpy
    question: |
      A helper draws a minibatch with
      ```python
      batch_indices = np.random.choice(len(input_data), num_points)
      batch_inputs = input_data[batch_indices]
      ```
      True or false: a minibatch drawn this way can contain the same training example more than once.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: '`np.random.choice` samples with replacement by default (`replace=True`), so repeated indices are possible.'
    explanation: |
      `np.random.choice(n, size)` draws indices independently and uniformly, with replacement unless `replace=False` is
      passed [^1]. NMA uses it to sample i.i.d. minibatches [^2]. Sampling with replacement matches the i.i.d. picture
      behind SGD, but a batch can repeat examples and a pass of such batches misses some examples entirely; in practice
      one usually shuffles once per epoch and goes through the data without replacement [^3].
    references:
      - title: 'NumPy documentation: numpy.random.choice'
        url: https://numpy.org/doc/stable/reference/random/generated/numpy.random.choice.html
        locator: Parameters (replace, default True)
      - source: neuromatch-dl
        locator: W1D4 Tutorial 1, Coding Exercise 6 Implement minibatch sampling
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D4_Optimization/instructor/W1D4_Tutorial1.ipynb
