    question: What is the ideal learning rate?
    options:
      - text: It is problem-dependent.
        correct: true
      - text: 0.01, a common default
        why: 0.01 is a common starting point, but the best value differs from one model and dataset to another.
      - text: 1.0, so that training converges fastest
        why: A learning rate that is too large makes the weights bounce around and can slow down or prevent convergence.
    explanation: Each model and dataset will have its own ideal learning rate. [^1]
