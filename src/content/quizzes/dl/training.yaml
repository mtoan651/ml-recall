    status: draft
  - id: training-011
    type: single
    question: What is gradient_accumulation_steps used for?
    options:
      - text: To increase effective batch size without using more memory
        correct: true
      - text: To save checkpoints during training
        why: This is handled by save_steps and save_strategy parameters.
      - text: To control the learning rate schedule
        why: Learning rate scheduling is controlled by learning_rate and warmup_ratio.
    explanation: Correct! It accumulates gradients across multiple forward passes before updating weights. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 11: Fine-tune Large Language Models'
        url: https://huggingface.co/learn/llm-course/chapter11/1
