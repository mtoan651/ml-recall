  - id: training-096
    type: multiple
    difficulty: medium
    tags:
      - dropout
      - mc-dropout
      - inference-cost
    question: Which statements about the computational cost of dropout are true? Select all that apply.
    options:
      - text: Dropout usually slows down training, since the network needs more epochs to converge
        correct: true
      - text: Standard dropout adds no cost at prediction time, because it is switched off in evaluation mode
        correct: true
      - text: MC Dropout averaging 10 stochastic forward passes makes each prediction roughly 10 times slower
        correct: true
      - text: At prediction time standard dropout must rescale every activation by the keep probability, which slows inference down
        why: In the usual (inverted) implementation the rescaling by 1/(1 − p) happens during training, so in evaluation mode the layer is just the identity.
    explanation: |
      Dropout slows down training, typically by roughly a factor of two, because the noisier
      network takes longer to converge [^1]. It costs nothing at inference: `nn.Dropout` scales the kept units
      by $1/(1 - p)$ during training, so in evaluation mode it computes the identity function [^2].
      MC Dropout keeps dropout active at test time and averages many stochastic forward passes to
      get better predictions and an uncertainty estimate [^3]; with 10 passes each prediction costs
      about 10 forward passes [^1].
