  - id: training-020
    type: short_answer
    difficulty: easy
    tags:
      - normalization
    question: Name the technique that standardizes a layer's inputs using the mean and variance of the current minibatch and then applies a learnable scale and shift.
    answer:
      accept:
        - batch normalization
        - batch normalisation
        - batchnorm
        - BN
      model: Batch normalization
    explanation: Batch normalization normalizes each feature with minibatch statistics, then rescales it with a learnable scale $\gamma$ and shift $\beta$ so the layer keeps its expressiveness [^1].
    references:
      - source: d2l
        locator: Sec. 8.5 Batch Normalization
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html
