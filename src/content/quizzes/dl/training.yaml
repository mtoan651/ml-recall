  - id: training-041
    type: single
    difficulty: medium
    tags:
      - sgd
      - shuffling
      - minibatches
    question: |
      Your regression data are stored sorted by the label $y$, and you run minibatch SGD without ever
      shuffling them. What goes wrong?
    options:
      - text: Training stops with an error, because each minibatch must contain several distinct labels
        why: Nothing in SGD requires distinct labels; the algorithm runs, it just optimizes badly.
      - text: Each minibatch holds similar labels, so successive updates are biased and the fit drifts
        correct: true
      - text: Nothing changes, because each epoch still visits every example once and adds up the same gradients
        why: The full gradient is the same, but SGD updates after every minibatch, and each update follows a biased local subset [^1].
      - text: The fit improves, because sorted labels make neighbouring minibatches agree with each other
        why: 'Agreement between neighbouring minibatches is the problem: successive updates all push the same way, then all the other way.'
    explanation: |
      Minibatch SGD relies on each minibatch being a random sample, so that its gradient is a noisy but
      unbiased estimate of the full gradient [^1]. With label-sorted data, early minibatches contain
      only small $y$ and pull the predictions down, later ones only large $y$ and pull them up, so the
      parameters chase one part of the data after another and end each epoch fitted to its last part.
      An adversary could even order the examples so that the updates cycle without converging.
      Reshuffling every epoch, as d2l's training data loader does, avoids this [^2].
    references:
      - source: d2l
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
      - source: d2l
        locator: Sec. 3.3.2 Reading the Dataset
        url: https://d2l.ai/chapter_linear-regression/synthetic-regression-data.html#reading-the-dataset
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 9
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex9
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    status: draft
  - id: training-042
    type: multiple
    difficulty: easy
    tags:
      - overfitting
      - regularization
      - dropout
      - early-stopping
      - data-augmentation
    question: |
      Besides weight decay, more training data and a model of suitable size, which of these help
      against overfitting? Select all that apply.
    options:
      - text: Early stopping based on the validation error
        correct: true
      - text: Data augmentation, such as random crops and flips of the training images
        correct: true
      - text: Training for many more epochs, until the training loss reaches zero
        why: Driving the training loss to zero makes the model fit the noise as well; early stopping does the opposite [^2].
      - text: Adding higher-degree polynomial features of the inputs
        why: Higher-degree features raise the model's complexity, which makes overfitting more likely [^4].
      - text: Dropout on the hidden layers
        correct: true
    explanation: |
      Dropout injects noise into the hidden layers so that no unit can rely on a specific pattern of
      others [^1], early stopping limits the number of training epochs and with it how far the model can
      fit noise [^2], and data augmentation enlarges the training set with label-preserving changes
      [^3]. Training until the training loss reaches zero does the opposite: on noisy data the model
      ends up interpolating the noise [^2]. Raising the polynomial degree increases the model's
      complexity, which leads to overfitting on small datasets [^4].
    references:
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - source: d2l
        locator: Sec. 5.5.3 Early Stopping
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
      - source: d2l
        locator: Sec. 14.1 Image Augmentation (introduction)
        url: https://d2l.ai/chapter_computer-vision/image-augmentation.html
      - source: d2l
        locator: Sec. 3.6.2.1 Polynomial Curve Fitting
        url: https://d2l.ai/chapter_linear-regression/generalization.html#polynomial-curve-fitting
      - source: d2l
        locator: Sec. 3.7.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/weight-decay#ex5
      url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
