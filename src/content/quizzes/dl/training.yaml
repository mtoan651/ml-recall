    question: |
      An elastic-net penalty $\lambda_1\sum_i |w_i| + \lambda_2\sum_i w_i^2$ uses $\lambda_1 = 0.1$
      and $\lambda_2 = 0.05$. What is its value for the weights $w = (3, -1, 0, 2)$?
    answer:
      numeric: 1.3
      tolerance: 0.001
      hint: a number
      model: $0.1(3 + 1 + 0 + 2) + 0.05(9 + 1 + 0 + 4) = 0.6 + 0.7 = 1.3$
    explanation: |
      Elastic net adds an L1 term (sum of absolute values, which encourages sparsity) and an L2
      term (sum of squares, which shrinks large weights) to the loss [^1][^2]. Here
      $\sum|w_i| = 6$ and $\sum w_i^2 = 14$, so the penalty is $0.6 + 0.7 = 1.3$. Note that the
      $-1$ contributes positively to both terms.
