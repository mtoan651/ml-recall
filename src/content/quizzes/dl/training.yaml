  - id: training-032
    type: single
    difficulty: easy
    question: |
      `trainer.train()` (🤗 Transformers `Trainer`) fails with a cryptic error that doesn't say where
      it comes from. The `Trainer` turns datasets into dataloaders, feeds batches to the model,
      computes gradients, updates the weights and evaluates. Where should you look first?
    options:
      - text: The optimization step, where gradients are computed and the weights updated
        why: Bugs can hide there, but it comes several steps into the pipeline, so check the earlier stages first.
      - text: The evaluation step, where the metrics are computed
        why: Evaluation usually runs after a full epoch of training, so check something earlier in the pipeline first.
      - text: The training dataset itself, by inspecting and decoding a few examples
        correct: true
      - text: The dataloader that collates examples into batches
        why: Very close, but the dataloader is built from the dataset; if the data is corrupted it cannot form batches, so check the dataset first.
    explanation: |
      An error in `trainer.train()` can come from the dataset, the batching, the model, the optimizer
      or the metric, so the best approach is to walk through the pipeline in order [^1]. The first
      stop is the data: if it is corrupted, the `Trainer` cannot even form batches, so look inside
      `trainer.train_dataset` and decode a few inputs and labels [^1]. Only then move on to the
      dataloader, the model's forward pass, the optimization step and finally evaluation [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter8/4#check-your-data
        locator: 'Chapter 8.4: Debugging the training pipeline, secs. Debugging the training pipeline and Check your data'
    source:
      id: hf-llm-course
      ref: chapter8/7#q4
      url: https://huggingface.co/learn/llm-course/chapter8/7
    status: reviewed
    reviewed_by: claude
  - id: training-033
    type: single
    difficulty: medium
    question: When a model doesn't seem to train properly, why is overfitting a single batch a good debugging test?
    options:
      - text: It isn't; overfitting is always bad and should be avoided
        why: On the full dataset overfitting is a sign of poor generalization, but in this test you train on one batch on purpose.
      - text: 'It checks that the model can learn at all: the loss on that batch should drop to near zero'
        correct: true
      - text: It checks that the tensor shapes of the inputs and labels match what the model expects
        why: With misaligned shapes you could not train even on one batch; the test assumes training already runs.
      - text: It gives a quick estimate of the validation accuracy the full model will reach
        why: A model that memorizes one batch tells you nothing about how well it generalizes.
    explanation: |
      Training again and again on one batch tests whether the problem, as you framed it, can be solved
      by the model you are training, and it also shows whether the initial learning rate is too high
      [^1]. A working setup reaches near-perfect results on that batch (e.g. 100% accuracy); if it
      can't, something is wrong with how the problem or the data is framed, and only after passing the
      test can you be sure the model can learn [^1]. The memorized batch says nothing about
      generalization, and shape errors would stop training before this test.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter8/4#overfit-your-model-on-one-batch
        locator: 'Chapter 8.4: Debugging the training pipeline, sec. Overfit your model on one batch'
    source:
      id: hf-llm-course
      ref: chapter8/7#q7
      url: https://huggingface.co/learn/llm-course/chapter8/7
    status: reviewed
    reviewed_by: claude
  - id: training-034
    type: single
    difficulty: medium
    question: Why do deep networks use batch normalization even when their weights were initialized carefully?
    options:
      - text: During training, weights can drift and push signals out of a good range; normalizing per minibatch brings them back
        correct: true
      - text: Careful initialization is only possible with batch normalization, because without it every weight must start at zero
        why: Initialization schemes such as Xavier work with or without batch normalization, and nothing forces weights to start at zero [^1].
      - text: It replaces the activation function, so the network no longer needs a nonlinearity
        why: The batch normalization layer is placed before the activation function and keeps it; the network still needs its nonlinearity [^1].
      - text: It normalizes each example on its own, so training no longer needs minibatches
        why: That describes layer normalization; batch normalization computes its statistics over the minibatch [^2].
    explanation: |
      Good initialization keeps values in a reasonable range at the start, but during training the
      weights can become arbitrarily big or small and drive the signals out of that range [^1].
      Batch normalization brings them back: it subtracts the mean and divides by the standard
      deviation computed over the current minibatch, as a layer placed after the weights and before
      the activation function, usually giving faster training and higher accuracy [^1]. It works
      together with initialization schemes such as Xavier and keeps the activation function [^1].
      Normalizing each example on its own, without the minibatch, is layer normalization [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#batch-normalization
        locator: Deep Learning Training Tricks, secs. Initial Weight Initialization and Batch Normalization
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
        locator: Sec. 8.5.2.3 Layer Normalization
    source:
      id: ms-ai-for-beginners
      ref: quiz-208/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: reviewed
    reviewed_by: claude
  - id: training-035
    type: short_answer
    difficulty: medium
    tags:
      - batch-normalization
      - bias
      - parameter-count
    question: |
      A model contains `nn.Conv2d(3, 64, kernel_size=3)` followed directly by `nn.BatchNorm2d(64)`.
      How many of the convolution's parameters can you remove (by passing `bias=False`) without
      changing which functions the model can represent?
    answer:
      numeric: 64
      tolerance: 0
      hint: a whole number
      model: The 64 convolution biases. Batch normalization subtracts each channel's mean, which cancels any constant added to that channel, and its own shift $\beta$ takes over the bias's role.
    explanation: |
      For convolutional layers, batch normalization standardizes each channel over all examples and
      positions of the minibatch, and each channel has its own scale and shift [^1]. A convolution bias
      adds the same constant $b_c$ to every value of channel $c$, so it raises the channel mean by
      exactly $b_c$ and the mean subtraction removes it; the original paper notes that the bias can be
      dropped because the learned shift $\beta$ subsumes it [^2]. That makes all 64 biases redundant,
      which is why d2l's DCGAN blocks use `bias=False` in front of batch normalization [^3].
    references:
      - source: d2l
        locator: Sec. 8.5.2.2 Convolutional Layers
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#convolutional-layers
      - title: 'Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift (Ioffe & Szegedy, 2015)'
        locator: Sec. 3.2 Batch-Normalized Convolutional Networks
        url: https://arxiv.org/abs/1502.03167
      - source: d2l
        locator: Sec. 20.2.2 The Generator (G_block with bias=False)
        url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#the-generator
      - source: d2l
        locator: Sec. 8.5.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#exercises
    source:
      id: d2l
      ref: chapter_convolutional-modern/batch-norm#ex1
      url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#exercises
    status: reviewed
    reviewed_by: claude
