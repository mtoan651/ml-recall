  - id: training-105
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - learning-rate
    question: |
      From the first epoch on, a network's training loss jumps up and down and then grows to very large
      values. Which change is the most likely fix?
    options:
      - text: Lower the learning rate
        correct: true
      - text: Raise the learning rate
        why: Larger steps overshoot even more.
      - text: Train for more epochs
        why: A run that diverges only gets worse with more steps.
      - text: Use a larger validation set
        why: The validation set does not affect the training updates.
    explanation: |
      The learning rate sets the step size: if it is too large, updates overshoot the minimum, so the loss
      oscillates or diverges, and reducing it is the first fix to try [^1][^2][^3]. A rate that is too
      small converges slowly but stays stable.
    references:
