  - id: transfer-learning-014
    type: single
    difficulty: medium
    tags:
      - self-supervised-learning
      - few-shot
      - simclr
    question: |
      On a shape-classification task, NMA trains a linear classifier on top of different encoders (all with the same
      architecture) while keeping only a fraction of the labels. With 5% of the labels, the classifier on a SimCLR
      encoder (pretrained without labels on all images) stays above 90% accuracy, while an encoder trained jointly with
      the classifier on the labelled images drops to about 45%. What explains the gap?
    options:
      - text: SimCLR pretraining uses every image without labels, so the classifier only has to map useful features to classes
        correct: true
      - text: SimCLR encoders have more parameters than supervised ones, so they need fewer labels
        why: The encoders share the same architecture; the difference is the data and the objective used to train them.
      - text: The supervised encoder sees augmented images, which confuse it when labels are scarce
        why: 'The issue is the amount of training signal: with 5% of the labels, the supervised encoder has only 5% of the examples to learn from.'
      - text: A contrastive loss acts like label smoothing, which makes any classifier more accurate
        why: A contrastive loss compares augmented views of images; it neither uses nor smooths labels.
    explanation: |
      The supervised encoder learns only from labelled examples, so cutting the labels to 5% cuts its training set to
      5%, and its features stop generalizing [^1]. The SimCLR objective needs no labels: the encoder is pretrained on all
      images to give two augmented views of the same image similar features and different images different features
      [^1][^2]. If those features already separate shapes, a linear classifier can be fitted from very few labels, which
      is why self-supervised pretraining helps most when labels are scarce [^1].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Bonus 3 Good representations enable few-shot learning (Bonus Discussion 3.1.1)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - title: Chen et al. (2020), A Simple Framework for Contrastive Learning of Visual Representations (SimCLR)
        url: https://arxiv.org/abs/2002.05709
        locator: Sec. 2.1 The Contrastive Learning Framework
    source:
