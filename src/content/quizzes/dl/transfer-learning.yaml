  - id: transfer-learning-018
    type: single
    difficulty: medium
    tags:
      - feature-extraction
      - frozen-base
      - fine-tuning
    question: |
      You attach a new, randomly initialized dense head to a convolutional base pretrained on
      ImageNet, to classify cars and trucks. Why set `pretrained_base.trainable = False` before
      training?
    options:
      - text: The random head's large gradients would wreck the pretrained features
        correct: true
      - text: A pretrained base cannot be trained any further once its weights have been loaded
        why: The base can be trained further with fine-tuning; it is just risky to do it with a random head attached [^1].
      - text: Freezing the base makes it learn new features suited to the cars and trucks
        why: A frozen base learns nothing new; it keeps extracting the features it learned during pretraining [^2].
      - text: The sigmoid output needs frozen layers below it to produce valid probabilities
        why: The sigmoid turns any real output into a probability; freezing has nothing to do with it [^3].
    explanation: |
      When doing transfer learning, retraining the whole base is generally not a good idea at first:
      the random weights of the head create large gradient updates that propagate back into the base
      and destroy much of the pretraining [^1]. So the base is frozen, it keeps doing the feature
      extraction it learned on ImageNet, and only the head learns which class goes with which
      features [^2]. Because the head is small, accurate classifiers can be trained from relatively
      little data. Training the base further, fine-tuning, is possible later but needs care [^1].
    references:
      - source: kaggle-learn
        locator: Computer Vision, Lesson 1 exercise, Question 1 Define Pretrained Base (correct-answer message)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/computer_vision/ex1.py
