  - id: transfer-learning-015
    type: short_answer
    difficulty: medium
    tags:
      - simclr
      - contrastive-loss
      - code-reading
    question: |
      A SimCLR loss builds a $2N \times 2N$ cosine-similarity matrix `sim` for $N$ images, each seen in two augmented views
      (rows $i$ and $i + N$ are the two views of image $i$):
      ```python
      pos = torch.roll(torch.eye(2 * N), N, 1)      # 1 where the column is the other view
      neg = torch.ones(2 * N) - torch.eye(2 * N)    # 1 everywhere except the diagonal
      numerator = torch.exp(sim / T)[pos.bool()]
      denominator = torch.sum(torch.exp(sim / T) * neg, dim=1)
      loss = torch.mean(-torch.log(numerator / denominator))
      ```
      With a batch of $N = 4$ images, how many terms are summed in each row of `denominator`?
    answer:
      numeric: 7
      tolerance: 0
      hint: an integer
      model: '$2N - 1 = 7$: every view except the anchor itself (its positive plus $2N - 2 = 6$ views of other images)'
    explanation: |
      `neg` broadcasts to a $2N \times 2N$ matrix of ones with a zero diagonal, so each row of the denominator sums
      $\exp(\mathrm{sim}/T)$ over all $2N - 1 = 7$ other views [^1]. One of them is the positive, the other view of the same
      image, picked out by the rolled identity matrix; the remaining $2N - 2 = 6$ are negatives [^1][^2]. The loss is
      thus a softmax cross-entropy asking the positive to win against the negatives; with too few negatives, NMA shows
      that the features partially collapse toward being all alike [^1].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Section 6 Coding Exercise 6.1.1 Complete a SimCLR loss function, and Bonus 2 Avoiding representational collapse
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - title: Chen et al. (2020), A Simple Framework for Contrastive Learning of Visual Representations (SimCLR)
        url: https://arxiv.org/abs/2002.05709
        locator: Sec. 2.1 The Contrastive Learning Framework, Eq. (1)
    source:
      id: neuromatch-dl
      ref: W3D3_UnsupervisedAndSelfSupervisedLearning/W3D3_Tutorial1#ex6.1.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-016
    type: single
    difficulty: medium
    tags:
      - simclr
      - contrastive-learning
      - representational-collapse
    question: |
      A SimCLR encoder is pretrained once with the usual many negative pairs per image and once with only 2. With few
      negatives, the features of most images become highly similar to each other, and a shape classifier on top can no
      longer tell ovals from squares. What role do the negative pairs play?
    options:
      - text: They push the features of different images apart; without enough of them, mapping everything alike satisfies the loss
        correct: true
      - text: They provide labels for the classifier, so fewer negatives means fewer labelled examples
        why: SimCLR never uses labels; negatives are simply the other images in the batch.
      - text: They are extra augmentations, so fewer negatives means fewer augmented views of each image
        why: Each image still gets its two augmented views; negatives only change what the anchor is contrasted against.
      - text: They only speed up training; after enough epochs two negatives give the same features
        why: 'NMA reports a different solution, not a slower one: too few negatives give a partially collapsed feature space.'
    explanation: |
      The positive term rewards giving two views of the same image the same features, which a constant encoder would
      achieve trivially [^1]. Negative pairs counter this by asking that other images be encoded differently; with only
      2 negatives that estimate is poor, and the feature space partially collapses, with pairwise similarities piling up
      near 1 [^1]. In the loss, the negatives are the terms in the softmax denominator that the positive must beat [^2].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Bonus 2 Avoiding representational collapse (Bonus Discussion 2.1.1)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - title: Chen et al. (2020), A Simple Framework for Contrastive Learning of Visual Representations (SimCLR)
        url: https://arxiv.org/abs/2002.05709
        locator: Sec. 2.1 The Contrastive Learning Framework, Eq. (1)
    source:
      id: neuromatch-dl
      ref: W3D3_UnsupervisedAndSelfSupervisedLearning/W3D3_Tutorial1#think-bonus2.1.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-017
    type: single
    difficulty: medium
    tags:
      - feature-extraction
      - fine-tuning
      - small-dataset
    question: |
      You have 300 labelled photos of everyday objects, similar to ImageNet, and an ImageNet-pretrained
      CNN. Which strategy is usually the safest first choice?
    options:
      - text: Fine-tune all layers with a large learning rate so they adapt quickly
        why: With so few examples, updating millions of weights with large steps quickly overfits and destroys the useful pretrained features.
      - text: Keep the old 1,000-class output layer and map its predictions to your classes by hand
        why: The new classes need a new output layer; reusing ImageNet's labels only works if the classes coincide.
      - text: Freeze the pretrained layers and train only a new classifier on top of their features
        correct: true
      - text: Train the same architecture from scratch, since pretrained weights encode other classes
        why: 300 images are far too few to learn good features from scratch; the pretrained features transfer well to similar images.
    explanation: |
      When the new dataset is small and similar to the original one, the pretrained features are
      already relevant and fine-tuning the whole network risks overfitting, so training a linear
      classifier on the frozen features is the recommended start [^1]. With more data, or data that
      differ more, you fine-tune the pretrained layers too, using a smaller learning rate than for the
      new output layer [^2][^3].
    references:
      - title: 'CS231n course notes: Transfer Learning'
        url: https://cs231n.github.io/transfer-learning/
        locator: Section "When and how to fine-tune?" (new dataset small and similar)
