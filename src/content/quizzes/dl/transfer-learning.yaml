  - id: transfer-learning-025
    type: single
    difficulty: medium
    tags:
      - feature-extraction
      - fine-tuning
      - dataset-size
      - domain-similarity
    question: |
      You have 500 labeled microscope images of cells, which look nothing like ImageNet photos, and a
      CNN pretrained on ImageNet. Following the usual rules of thumb for transfer learning, what should
      you try first?
    options:
      - text: Train the same architecture from scratch, since pretrained features cannot help on such data
        why: Training from scratch is an option only for a large dataset, and even then pretrained initialization usually helps [^1]; features from a distant task still beat random ones [^2].
      - text: Freeze the network and train a linear classifier on the features just before its old output layer
        why: Those top features are the most specific to ImageNet's classes; this is the recipe for a small dataset that is *similar* to ImageNet [^1].
      - text: Freeze the network and train a linear classifier on activations from an earlier layer
        correct: true
      - text: Fine-tune every layer end to end, since only full fine-tuning can adapt to such different images
        why: With only a few hundred images, fine-tuning the whole network is likely to overfit [^1].
    explanation: |
      The choice depends mainly on the size of the new dataset and its similarity to the original one
      [^1]. A small dataset rules out fine-tuning because of overfitting, so a linear classifier on
      frozen features is the safe choice. Early layers compute generic features such as edge and color
      blob detectors, while later layers become specific to the original classes [^1][^2]. For a small
      and very different dataset, the classifier should therefore be trained on activations from
      somewhere earlier in the network rather than from the top [^1].
    references:
      - title: 'Stanford CS231n notes: Transfer Learning'
        url: https://cs231n.github.io/transfer-learning/#tf
        locator: Transfer Learning, "When and how to fine-tune?" (the four scenarios)
      - title: Yosinski et al. (2014), How transferable are features in deep neural networks?
        url: https://arxiv.org/abs/1411.1792
        locator: Abstract; Sec. 4.3 Random Weights
    source:
      id: original
      ref: transfer-learning-025
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-026
    type: multiple
    difficulty: hard
    tags:
      - feature-generality
      - co-adaptation
      - layer-transfer
    question: |
      Yosinski et al. measured how well the features of each layer of an ImageNet-trained CNN transfer to
      another task. Which findings did they report? Select all that apply.
    options:
      - text: Transfer gets worse as the base and target tasks grow apart, but distant-task features still beat random ones
        correct: true
      - text: First-layer features such as Gabor-like filters and color blobs are general and transfer almost perfectly
        correct: true
      - text: After fine-tuning on the target data, a transferred initialization does no better than a random one
        why: The opposite was found; initializing with transferred features gives a boost to generalization that lingers even after fine-tuning [^1].
      - text: The top layers are the most general, so they are the ones to reuse when the tasks differ
        why: Features go from general in the first layers to specific in the last ones, so the top layers are the most task-specific [^1][^2].
      - text: Freezing copied middle layers hurt even when retraining on the original task, because co-adapted neurons were split
        correct: true
    explanation: |
      Transferability suffers from two separate effects: higher-layer neurons specialize to the original
      task, and splitting the network between co-adapted neurons creates optimization difficulties [^1].
      The second effect appeared when the first $n$ layers of a network were copied, frozen, and the
      rest retrained on the *same* task: performance dropped for layers 3–5, while letting the copied
      layers fine-tune removed the drop [^2]. Layers 1 and 2 transferred almost perfectly between tasks
      [^2], and even features from a dissimilar task beat random weights [^1].
    references:
      - title: Yosinski et al. (2014), How transferable are features in deep neural networks?
        url: https://arxiv.org/abs/1411.1792
        locator: Abstract; Sec. 5 Conclusions
      - title: Yosinski et al. (2014), How transferable are features in deep neural networks?
        url: https://arxiv.org/abs/1411.1792
        locator: Sec. 4.1 Similar Datasets, Figure 2 and interpretations 2–4
    source:
      id: original
      ref: transfer-learning-026
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-027
    type: short_answer
    difficulty: easy
    tags:
      - ulmfit
      - discriminative-fine-tuning
      - learning-rate
    question: |
      ULMFiT fine-tunes each layer with its own learning rate (discriminative fine-tuning). It first
      picks the rate $\eta^L$ of the last layer and then sets $\eta^{l-1} = \eta^{l}/2.6$ for each lower
      layer. If $\eta^L = 0.01$, what learning rate does layer $L-3$ get?
    answer:
      numeric: 0.000569
      tolerance: 0.0000015
      hint: a number with 3 significant figures, e.g. 0.000123
      model: $\eta^{L-3} = 0.01 / 2.6^3 = 0.01 / 17.576 \approx 0.000569$
    explanation: |
      Different layers capture different types of information, so ULMFiT tunes them to different
      extents: the last layer with $\eta^L$ and each lower layer with a rate 2.6 times smaller [^1].
      Three layers down, the rate is $0.01/2.6^3 \approx 5.7 \times 10^{-4}$, so the general features of
      the lower layers change slowly [^2]. ULMFiT combines this with slanted triangular learning rates (a
      short linear increase, then a long linear decay) [^1] and with gradual unfreezing from the last
      layer down, which avoids the risk of catastrophic forgetting when all layers are fine-tuned at
      once [^3].
    references:
      - title: Howard & Ruder (2018), Universal Language Model Fine-tuning for Text Classification
        url: https://arxiv.org/abs/1801.06146
        locator: Sec. 3.2 Target task LM fine-tuning, "Discriminative fine-tuning" Eq. (2) and "Slanted triangular learning rates"
      - title: Yosinski et al. (2014), How transferable are features in deep neural networks?
        url: https://arxiv.org/abs/1411.1792
        locator: Abstract
      - title: Howard & Ruder (2018), Universal Language Model Fine-tuning for Text Classification
        url: https://arxiv.org/abs/1801.06146
        locator: Sec. 3.3 Target task classifier fine-tuning, "Gradual unfreezing"
    source:
      id: original
      ref: transfer-learning-027
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-028
    type: single
    difficulty: medium
    tags:
      - distribution-shift
      - label-shift
      - domain-shift
    question: |
      A pneumonia classifier was trained on chest X-rays from a hospital where 10% of patients have
      pneumonia. It is deployed at a clinic during flu season, where 40% do. How pneumonia looks on an
      X-ray is the same in both places. Which kind of distribution shift is this, and what is the
      matching correction?
    options:
      - text: Label shift; reweight by $p(y)/q(y)$, estimating the new $p(y)$ with a confusion matrix
        correct: true
      - text: Concept shift; relabel the clinic's data, since the definition of pneumonia has changed
        why: Concept shift means the definitions of the labels change; here pneumonia means the same thing and only its frequency differs [^1].
      - text: Covariate shift; reweight by $p(\mathbf{x})/q(\mathbf{x})$ estimated with a domain classifier
        why: Covariate shift assumes $P(y \mid \mathbf{x})$ stays fixed. Here the prevalence changes, so the same X-ray has a different chance of showing pneumonia; what stays fixed is $P(\mathbf{x} \mid y)$ [^1].
      - text: No shift, because each class looks the same in both places, so no correction is needed
        why: An unchanged class-conditional distribution is exactly the label-shift assumption; the prior $P(y)$ still changes, so the model's predicted probabilities are off [^1][^2].
    explanation: |
      Label shift means the label distribution $P(y)$ changes while the class-conditional distribution
      $P(\mathbf{x} \mid y)$ stays fixed; it is the natural assumption when $y$ causes $\mathbf{x}$, as
      diseases cause symptoms [^1]. The correction weights each training example by
      $\beta_i = p(y_i)/q(y_i)$, here $0.4/0.1 = 4$ for pneumonia and $0.6/0.9 \approx 0.67$ for healthy
      patients [^2]. In practice the new prior is unknown: average the model's predictions on test
      inputs, $\mu(\hat{\mathbf{y}})$, and solve $\mathbf{C}\,p(\mathbf{y}) = \mu(\hat{\mathbf{y}})$ with
      the confusion matrix $\mathbf{C}$ from validation data [^2].
    references:
      - source: d2l
        locator: Sec. 4.7.1 Types of Distribution Shift (4.7.1.1 Covariate Shift, 4.7.1.2 Label Shift, 4.7.1.3 Concept Shift)
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#label-shift
      - source: d2l
        locator: Sec. 4.7.3.3 Label Shift Correction
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#label-shift-correction
    source:
      id: original
      ref: transfer-learning-028
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-029
    type: short_answer
    difficulty: hard
    tags:
      - fine-tuning
      - parameter-count
      - resnet
      - batch-normalization
      - code-reading
    question: |
      You fine-tune only the last stage and the new head of a torchvision ResNet-18:

      ```python
      model = torchvision.models.resnet18(weights="IMAGENET1K_V1")
      model.fc = nn.Linear(512, 2)
      for name, p in model.named_parameters():
          p.requires_grad = name.startswith(("layer4.", "fc."))
      n = sum(p.numel() for p in model.parameters() if p.requires_grad)
      ```

      `layer4` has two residual blocks. Block 1: a 3×3 conv 256→512 (stride 2), BatchNorm(512), a 3×3
      conv 512→512, BatchNorm(512), and a shortcut made of a 1×1 conv 256→512 and BatchNorm(512).
      Block 2: two 3×3 convs 512→512, each followed by BatchNorm(512). All convolutions have
      `bias=False`; each BatchNorm has a learnable scale and shift per channel. What is `n`?
    answer:
      numeric: 8394754
      tolerance: 0
      hint: a whole number
      model: 'block 1: $1\,179\,648 + 2\,359\,296 + 131\,072 + 3 \times 1024 = 3\,673\,088$; block 2: $2 \times (2\,359\,296 + 1024) = 4\,720\,640$; `fc`: $512 \times 2 + 2 = 1026$; total $8\,394\,754$'
    explanation: |
      A $k \times k$ convolution from $c_i$ to $c_o$ channels has $c_o c_i k^2$ weights [^1], and
      torchvision builds these convolutions without bias [^5]:
      $3 \cdot 3 \cdot 256 \cdot 512 = 1\,179\,648$, $3 \cdot 3 \cdot 512 \cdot 512 = 2\,359\,296$, and
      $256 \cdot 512 = 131\,072$ for the 1×1 shortcut. Each BatchNorm adds a learnable $\gamma$ and
      $\beta$ per channel, 1024 parameters [^2]; its running mean and variance are buffers, not
      parameters, so they are not counted [^3]. `layer4` alone has 8,393,728 parameters, about 72% of
      the 11.7 million in ResNet-18 [^4], so unfreezing just the last stage already trains most of the
      weights. Note that freezing does not stop the BatchNorm layers of the frozen stages from updating
      their running statistics in training mode [^2].
    references:
      - source: d2l
        locator: Sec. 7.4 Multiple Input and Multiple Output Channels
        url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html
      - title: 'PyTorch docs: torch.nn.BatchNorm2d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html
        locator: Class description (learnable γ and β of size C; running estimates kept during training)
      - title: 'PyTorch docs: torch.nn.Module.register_buffer'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html#torch.nn.Module.register_buffer
        locator: register_buffer ("BatchNorm's running_mean is not a parameter")
      - title: 'torchvision docs: resnet18'
        url: https://docs.pytorch.org/vision/stable/models/generated/torchvision.models.resnet18.html
        locator: ResNet18_Weights.IMAGENET1K_V1 (num_params 11689512)
      - title: 'torchvision source: models/resnet.py'
        url: https://github.com/pytorch/vision/blob/main/torchvision/models/resnet.py
        locator: conv3x3 / conv1x1 (bias=False), BasicBlock, ResNet._make_layer (downsample shortcut)
    source:
      id: original
      ref: transfer-learning-029
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-030
    type: single
    difficulty: hard
    tags:
      - linear-probing
      - fine-tuning
      - lp-ft
      - out-of-distribution
    question: |
      A model with good pretrained features is adapted to a task whose test data come from a shifted
      distribution. Kumar et al. compare full fine-tuning (randomly initialized head, all layers
      trained) with linear probing (frozen features, only the head trained), and recommend LP-FT:
      linear probing first, then full fine-tuning. Why does LP-FT help?
    options:
      - text: Linear probing reaches the better in-distribution accuracy, which fine-tuning then keeps
        why: Full fine-tuning is usually more accurate in-distribution than linear probing; linear probing can win out-of-distribution [^1].
      - text: LP-FT can use a much larger learning rate, which lets the backbone escape the pretrained solution
        why: The goal is to stay close to the good pretrained features; with a random head, features get distorted even with an infinitesimally small learning rate [^2].
      - text: Linear probing shrinks the backbone's weights first, which regularizes the later fine-tuning
        why: Linear probing does not touch the backbone at all; it trains only the head on frozen features [^1].
      - text: Starting from a trained head, fine-tuning distorts the pretrained features less
        correct: true
    explanation: |
      Across ten distribution-shift benchmarks, fine-tuning was about 2% more accurate than linear
      probing in-distribution but 7% less accurate out-of-distribution [^1]. With a random head, the head
      and the feature extractor change together: the features of the training data get distorted while
      those of OOD inputs change less, and the head fits only the distorted features [^2]. A
      linear-probed head is already well aligned, so fine-tuning from it updates the features without
      raising the OOD error much [^3]. Empirically LP-FT was about 1% better ID and 10% better OOD than
      full fine-tuning [^1].
    references:
      - title: Kumar et al. (2022), Fine-Tuning can Distort Pretrained Features and Underperform Out-of-Distribution
        url: https://arxiv.org/abs/2202.10054
        locator: Abstract
      - title: Kumar et al. (2022), Fine-Tuning can Distort Pretrained Features and Underperform Out-of-Distribution
        url: https://arxiv.org/abs/2202.10054
        locator: Sec. 1 Introduction
      - title: Kumar et al. (2022), Fine-Tuning can Distort Pretrained Features and Underperform Out-of-Distribution
        url: https://arxiv.org/abs/2202.10054
        locator: 'Sec. 3.4 Linear probing then fine-tuning: a simple variant to mitigate tradeoffs'
    source:
      id: original
      ref: transfer-learning-030
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-031
    type: multiple
    difficulty: medium
    tags:
      - feature-extraction
      - vgg
      - feature-vector
    question: |
      A pretrained VGG-19 receives $224 \times 224$ RGB images. Its convolutional part ends with a
      max-pooling layer that outputs a $512 \times 7 \times 7$ map, which is flattened and fed to fc6
      (4096 units), fc7 (4096 units) and a 1000-way output layer. The convolution conv4_3 sits in the
      fourth block, where the feature maps are $28 \times 28$ and have 512 channels. You want fixed
      feature vectors for a new classifier. Which statements are correct? Select all that apply.
    options:
      - text: The fc7 activations give a 4096-dimensional feature vector
        correct: true
      - text: The 1000 class scores of the output layer can serve as a 1000-dimensional feature vector
        correct: true
      - text: Flattening the last pooled map gives a 25,088-dimensional feature vector
        correct: true
      - text: The conv4_3 output is a 512-dimensional feature vector as it stands
        why: conv4_3 outputs $512 \times 28 \times 28 = 401{,}408$ values. You get 512 numbers only after pooling each channel, for example with global average pooling [^2].
      - text: The fc6 output is a 25,088-dimensional feature vector
        why: 25,088 is the size of fc6's input, the flattened $512 \times 7 \times 7$ map; fc6 itself has 4096 outputs [^2].
    explanation: |
      Fixed feature extraction runs the pretrained network and reads the activations of a chosen layer
      instead of its ImageNet prediction [^1]. Any layer works, and the vector length is the number of
      values that layer produces: 4096 for fc6 or fc7, 1000 for the output layer, and
      $512 \cdot 7 \cdot 7 = 25{,}088$ for the last pooled map [^2]. A convolutional layer inside the
      network produces a whole feature map, so conv4_3 gives $512 \times 28 \times 28$ values unless
      you pool them; which layer works best for the new task has to be found by experiment [^1].
    references:
      - source: dl-interviews
        locator: Ch. 7 (CNN Feature Extraction), Problem PRB-164, p. 208; Solution SOL-164, p. 218
        url: https://arxiv.org/abs/2201.00650v2
      - title: Simonyan & Zisserman (2014), Very Deep Convolutional Networks for Large-Scale Image Recognition
        locator: Sec. 2.1 Architecture and Table 1 (configuration E)
        url: https://arxiv.org/abs/1409.1556
    source:
      id: dl-interviews
      ref: ch7#prb164
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-032
    type: single
    difficulty: easy
    tags:
      - feature-extraction
      - linear-classifier
      - small-data
    question: |
      You have 4,000 labelled histopathology images in three classes and an ImageNet-pretrained
      VGG-19. Which procedure uses the network as a *fixed feature extractor*?
    options:
      - text: Store each image's fc7 activations once and train a linear classifier on them
        correct: true
      - text: Replace the output layer by a 3-way layer and train all layers with a small learning rate
        why: That is fine-tuning, which changes the pretrained weights [^2].
      - text: Label each image with the ImageNet class that gets the highest score from the network
        why: The 1000 ImageNet classes have nothing to do with the three tissue classes; a new classifier must be trained on the target labels [^1].
      - text: Train the convolutional layers on the new images and keep the fully connected layers frozen
        why: Updating the convolutional weights is (partial) fine-tuning, not fixed feature extraction [^2].
    explanation: |
      In fixed feature extraction the CNN is never trained again: every image goes through the
      pretrained network once, the activations of a chosen layer are stored as its feature vector, and
      a simple classifier such as an SVM or softmax regression is trained on these vectors instead of
      on the pixels [^1]. This is cheap and works with few labels, and off-the-shelf CNN features with a
      linear SVM are a strong baseline [^3]. Fine-tuning instead keeps training the copied layers on
      the target data [^2].
    references:
      - source: dl-interviews
        locator: Ch. 7 (CNN Feature Extraction), Problem PRB-164, p. 208; Solution SOL-164 parts 1 and 3, pp. 218–219
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 14.2.1 Steps
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
      - title: Sharif Razavian et al. (2014), CNN Features off-the-shelf, an Astounding Baseline for Recognition
        locator: Abstract and Sec. 2 (linear SVM on OverFeat features)
        url: https://arxiv.org/abs/1403.6382
    source:
      id: dl-interviews
      ref: ch7#prb164-2
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-033
    type: single
    difficulty: medium
    tags:
      - feature-extraction
      - ensembles
      - imagenet
    question: |
      For fixed feature extraction you can take VGG-19's fc7 activations (4096 values) or its 1000
      ImageNet class scores. A colleague prefers the class scores because they make it easy to
      combine several pretrained CNNs, such as ResNet-152, DenseNet-161 and VGG-19. Why do they?
    options:
      - text: All ImageNet classifiers score the same 1000 classes, so the vectors line up
        correct: true
      - text: The class scores carry more information about the image than the fc7 activations
        why: The scores are computed from fc7, so they cannot contain information that fc7 lacks [^2].
      - text: The output layer is the one layer that fine-tuning never changes in any network
        why: Fine-tuning usually replaces or retrains the output layer first; it is irrelevant to fixed extraction anyway [^3].
      - text: Class scores are never negative, which linear classifiers require
        why: Logits can be negative, and linear classifiers accept features of any sign.
    explanation: |
      Penultimate-layer features differ in size and meaning from one architecture to the next (512
      values for ResNet-34, 2048 for ResNet-152, 4096 for VGG), but every ImageNet classifier ends in the
      same 1000 classes. Taking the output layer therefore gives vectors whose $k$-th entry means the
      same thing for every network, which makes averaging or stacking several CNNs straightforward [^1].
      The price is that the 1000 scores are a processed summary of the penultimate layer and cannot add
      information to it [^2].
    references:
      - source: dl-interviews
        locator: Ch. 7 (CNN Feature Extraction), Problem PRB-165, p. 210; Solution SOL-165, p. 219
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Data processing inequality'
        locator: Statement
        url: https://en.wikipedia.org/wiki/Data_processing_inequality
      - source: d2l
        locator: Sec. 14.2.1 Steps
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
    source:
      id: dl-interviews
      ref: ch7#prb165
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: transfer-learning-034
    type: short_answer
    difficulty: medium
    tags:
      - feature-extraction
      - vgg
      - pytorch
      - tensor-shapes
    question: |
      torchvision's `vgg19().classifier` is
      `Sequential(Linear(25088, 4096), ReLU, Dropout, Linear(4096, 4096), ReLU, Dropout, Linear(4096, 1000))`.
      This module turns a pretrained VGG-19 into a feature extractor:

      ```python
      import torch, torchvision

      class VGG19FE(torch.nn.Module):
          def __init__(self, original):
              super().__init__()
              self.features = original.features            # (N, 512, 7, 7) for 224 x 224 inputs
              self.classifier = torch.nn.Sequential(
                  *list(original.classifier.children())[:-1])

          def forward(self, x):
              f = self.features(x)
              f = f.view(f.size(0), -1)
              return self.classifier(f)

      fe = VGG19FE(torchvision.models.vgg19(weights="IMAGENET1K_V1")).eval()
      out = fe(torch.rand(8, 3, 224, 224))
      ```

      What is the shape of `out`?
    answer:
      accept:
        - (8, 4096)
      pattern: (torch\.size)?\s*[\(\[]*\s*8\s*[,x×*]\s*4096\s*[\)\]]*
      hint: Two dimensions, e.g. (2, 10)
      model: $(8, 4096)$, one fc7 feature vector per image
    explanation: |
      `children()` lists the seven modules of the classifier, and `[:-1]` drops only the last one, the
      $4096 \to 1000$ output layer [^1]. The flattened $512 \cdot 7 \cdot 7 = 25{,}088$ values per image
      therefore pass through fc6 and fc7 and leave as 4096 features, so a batch of 8 images gives
      $8 \times 4096$ [^2]. In evaluation mode the remaining dropout layers pass their input through
      unchanged, so the features are deterministic [^3].
    references:
      - source: dl-interviews
        locator: Ch. 7 (CNN Feature Extraction), Problem PRB-166, p. 210; Solution SOL-166, pp. 219–220
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 8.2.2 VGG Network
        url: https://d2l.ai/chapter_convolutional-modern/vgg.html#vgg-network
      - title: torch.nn.Dropout (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: Class description
