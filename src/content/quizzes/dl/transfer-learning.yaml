schema_version: 1
domain: dl
topic: transfer-learning
title: Transfer Learning
questions:
  - id: transfer-learning-001
    type: single
    difficulty: easy
    question: What does "transfer learning" mean?
    options:
      - text: Transferring the knowledge of a pretrained model to a new model by training it on the same dataset.
        why: No, that would be two versions of the same model.
      - text: Transferring the knowledge of a pretrained model to a new model by initializing the second model with the first model's weights.
        correct: true
      - text: Transferring the knowledge of a pretrained model to a new model by building the second model with the same architecture as the first model.
        why: The architecture is just the way the model is built; there is no knowledge shared or transferred in this case.
    explanation: |
      Transfer learning starts from a pretrained model and continues training it on a new,
      task-specific dataset (fine-tuning). Because the second model starts from the first model's
      weights rather than random ones, what was learned during pretraining is carried over, or
      *transferred* [^1]. Training again on the same dataset transfers nothing to a new task, and
      copying only the architecture copies no knowledge: the architecture is just the skeleton of
      layers, while the learned knowledge lives in the weights (the checkpoint) [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
        locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#architecture-vs-checkpoints
        locator: Chapter 1.4 How do Transformers work?, sec. Architectures vs. checkpoints
    source:
      id: hf-llm-course
      ref: chapter1/7#q5
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transfer-learning-002
    type: single
    difficulty: easy
    question: What does "domain adaptation" mean?
    options:
      - text: It's when we run a model on a dataset and get the predictions for each sample in that dataset.
        why: No, this is just running inference.
      - text: It's when we train a model on a dataset.
        why: No, this is training a model; there is no adaptation here.
      - text: It's when we fine-tune a pretrained model on a new dataset, and it gives predictions that are more adapted to that dataset
        correct: true
      - text: It's when we add misclassified samples to a dataset to make our model more robust.
        why: That's certainly something you should do if you retrain your model regularly, but it's not domain adaptation.
    explanation: |
      Domain adaptation means fine-tuning a pretrained model on in-domain data so that it fits that
      domain better. For example, a model pretrained on Wikipedia treats the specialised words of
      legal contracts or scientific articles as rare tokens until it is further trained on such
      text [^1]. The course fine-tunes DistilBERT's masked language model on IMDb movie reviews so
      that it adapts from Wikipedia's factual style to the more subjective language of reviews
      [^1]. Running inference, training a model from scratch and adding misclassified samples to
      the data are all useful steps, but none of them adapts a pretrained model to a new domain.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/3
        locator: Chapter 7.3 Fine-tuning a masked language model (introduction and the IMDb dataset)
    source:
      id: hf-llm-course
      ref: chapter7/9#q4
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: draft
  - id: transfer-learning-003
    type: true_false
    difficulty: easy
    question: Transfer learning approach uses untrained models for classification
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Transfer learning starts from a pre-trained model, usually trained on a large dataset such as
      ImageNet, and reuses the features it has already learned, often just training a new classifier
      on top [^1]. When fine-tuning, only the new output layer starts from random weights; every other
      layer starts from the source model's trained parameters [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/README.md
        locator: 'Lesson: Pre-trained Networks and Transfer Learning (introduction; Pre-Trained Models as Feature Extractors)'
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
        locator: Sec. 14.2.1 Steps (Fine-Tuning)
    source:
      id: ms-ai-for-beginners
      ref: quiz-108/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: draft
  - id: transfer-learning-004
    type: multiple
    difficulty: medium
    question: Which of the following freeze the weights of a pretrained convolutional feature extractor, so that training only updates the new classifier on top?
    options:
      - text: In PyTorch, setting `requires_grad` to `False` on all of the feature extractor's parameters
        correct: true
      - text: In Keras/TensorFlow, setting the feature extractor's `trainable` attribute to `False`
        correct: true
      - text: In PyTorch, calling `.eval()` on the feature extractor
        why: '`eval()` only switches layers such as dropout and batch normalization to their evaluation behaviour. It does not stop gradient computation, so the optimizer still updates the weights [^5].'
      - text: Training the whole network with a 10 times lower learning rate
        why: A lower learning rate makes the updates smaller, but the pretrained weights still change. Retraining everything with a very low learning rate is what the Keras guide calls fine-tuning, the step that comes after training with frozen layers [^4].
    explanation: |
      Both settings freeze the feature extractor; they are the PyTorch and the Keras/TensorFlow way
      of doing the same thing. In the PyTorch notebook the feature extractor is frozen by setting
      `requires_grad = False` on all its parameters [^1], which keeps them out of the backward graph
      so they get no gradient updates [^3]. In the TensorFlow notebook the pre-trained VGG16 layer
      gets `trainable = False` [^2], which moves its weights from the trainable to the
      non-trainable list, so training leaves them unchanged [^4]. Evaluation mode and a smaller
      learning rate freeze nothing: the weights still receive updates [^4][^5].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TransferLearningPyTorch.ipynb
        locator: 'Notebook: Transfer Learning - PyTorch (freezing the convolutional feature extractor)'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TransferLearningTF.ipynb
        locator: 'Notebook: Transfer Learning - TensorFlow (freezing the convolutional feature extractor)'
      - title: Autograd mechanics (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#setting-requires-grad
        locator: Locally disabling gradient computation, Setting requires_grad
        quote: To freeze parts of your model, simply apply .requires_grad_(False) to the parameters that you don’t want updated.
      - title: Transfer learning & fine-tuning (Keras developer guide)
        url: https://keras.io/guides/transfer_learning/#freezing-layers-understanding-the-trainable-attribute
        locator: 'Sections "Freezing layers: understanding the trainable attribute" and "Fine-tuning"'
      - title: Autograd mechanics (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#evaluation-mode-nn-module-eval
        locator: Locally disabling gradient computation, Evaluation Mode (nn.Module.eval())
        quote: Evaluation mode is not a mechanism to locally disable gradient computation.
    source:
      id: ms-ai-for-beginners
      ref: quiz-208/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-8.json
    status: draft
  - id: transfer-learning-005
    type: single
    difficulty: easy
    tags:
      - fine-tuning
      - learning-rate
      - pretrained-models
    question: |
      d2l fine-tunes an ImageNet-pretrained ResNet-18 on a small hot-dog dataset, with a learning rate
      of $5 \times 10^{-5}$ for the pretrained layers and 10 times that for the new output layer. What
      do you expect if you keep increasing the learning rate of the pretrained layers?
    options:
      - text: Accuracy keeps rising, since the pretrained layers can then adapt to hot dogs more quickly
        why: The pretrained parameters are already good; large steps move them far from that starting point instead of refining it [^1].
      - text: Accuracy stays the same, since pretrained layers have converged and receive no gradient anymore
        why: On the new dataset the pretrained layers do receive nonzero gradients, and larger learning rates change them more.
      - text: Accuracy stays the same, since only the new output layer's learning rate matters for the result
        why: All layers are updated, each with its own learning rate, so the rate of the pretrained layers matters too.
      - text: Accuracy eventually drops, since large updates destroy the useful pretrained features
        correct: true
    explanation: |
      The pretrained parameters already extract general features such as edges, textures and shapes,
      so d2l fine-tunes them with a small learning rate, while the randomly initialized output layer gets
      a learning rate 10 times larger [^1]. A large learning rate for the pretrained layers takes big
      steps away from that initialization and overwrites the transferred knowledge, so the model drifts
      toward what training from scratch gives on a small dataset, or training becomes unstable [^1][^2].
    references:
      - source: d2l
        locator: Sec. 14.2.2.2 Defining and Initializing the Model
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#defining-and-initializing-the-model
      - source: d2l
        locator: Sec. 14.2.3 Summary
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#summary
      - source: d2l
        locator: Sec. 14.2.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/fine-tuning#ex1
      url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    status: draft
  - id: transfer-learning-006
    type: single
    difficulty: medium
    tags:
      - fine-tuning
      - freezing
      - requires-grad
      - code-reading
    question: |
      Following d2l, you build `finetune_net` from a pretrained ResNet-18, replace its output layer, and
      then try to freeze the pretrained layers:

      ```python
      finetune_net = torchvision.models.resnet18(weights="IMAGENET1K_V1")
      finetune_net.fc = nn.Linear(finetune_net.fc.in_features, 2)
      for param in finetune_net.parameters():
          param.requires_grad = False
      ```

      You meant to train only the new output layer. What happens when training starts?
    options:
      - text: All layers still train, because `requires_grad` only matters for layers created after it is set
        why: Setting `requires_grad = False` on a tensor stops autograd from computing gradients for it, whenever the layer was created [^2].
      - text: The first `loss.backward()` raises an error, because the new `fc` layer is frozen too
        correct: true
      - text: Only the new `fc` layer is trained, exactly as intended
        why: The loop runs after `fc` was replaced, so it also sets `requires_grad = False` on `fc.weight` and `fc.bias`.
      - text: Training runs without errors, but no weight changes, so accuracy stays where it started
        why: In PyTorch the loss then has no gradient history at all, so `backward()` raises a RuntimeError instead of silently doing nothing.
    explanation: |
      The loop visits every parameter, including those of the `fc` layer created one line earlier. With
      no parameter requiring a gradient, the output and the loss have no `grad_fn`, and `backward()`
      fails with "element 0 of tensors does not require grad and does not have a grad_fn" [^2]. The fix
      is to freeze before replacing `fc`, or to call `finetune_net.fc.requires_grad_(True)` afterwards [^2].
      Then only the new output layer learns on top of the frozen pretrained features [^1].
    references:
      - source: d2l
        locator: Sec. 14.2.2.2 Defining and Initializing the Model
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#defining-and-initializing-the-model
      - title: Autograd mechanics (PyTorch documentation)
        locator: Locally disabling gradient computation, Setting requires_grad
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#setting-requires-grad
      - source: d2l
        locator: Sec. 14.2.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/fine-tuning#ex3
      url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    status: draft
  - id: transfer-learning-007
    type: short_answer
    difficulty: easy
    tags:
      - fine-tuning
      - feature-extraction
      - parameter-count
    question: |
      You freeze every pretrained layer of a ResNet-18 and train only its new output layer,
      `nn.Linear(512, 2)`, which maps the 512 pooled features to the classes "hot dog" and "not hot
      dog". How many trainable parameters remain?
    answer:
      numeric: 1026
      tolerance: 0
      hint: a whole number
      model: $512 \times 2 + 2 = 1026$, out of about 11.2 million in the whole network.
    explanation: |
      ResNet-18's feature layers end in global average pooling with 512 channels, and the output layer
      `fc` maps them to the target classes [^1]. A $512 \to 2$ linear layer has $512 \times 2$ weights and
      2 biases, 1026 parameters. Training only this layer on frozen features is the cheapest form of
      transfer learning; d2l's default instead fine-tunes all layers, the pretrained ones with a small
      learning rate [^1], and the exercise asks how much accuracy the cheaper option gives up [^2].
    references:
      - source: d2l
        locator: Sec. 14.2.2.2 Defining and Initializing the Model
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#defining-and-initializing-the-model
      - source: d2l
        locator: Sec. 14.2.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/fine-tuning#ex3-b
      url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    status: draft
  - id: transfer-learning-008
    type: single
    difficulty: medium
    tags:
      - fine-tuning
      - output-layer
      - initialization
    question: |
      A fine-tuned ResNet-18 gets a new output layer with two units, "hot dog" and "not hot dog", that
      is initialized randomly. ImageNet already has a "hotdog" class: row 934 of the pretrained output
      layer's weight, which has shape $1000 \times 512$. How can that row help?
    options:
      - text: It cannot help, since an output layer is tied to its own labels and its weights never carry over
        why: d2l drops the source output layer because its labels usually differ, but here a source class matches a target class over the same 512 features [^1].
      - text: Use row 934 and its bias to initialize the new layer's "hot dog" unit
        correct: true
      - text: Use row 934 to initialize the first convolution, so the network looks for hot-dog shapes early
        why: The row is a 512-dimensional weight vector over the final pooled features; it does not fit, or mean anything, as a first-layer kernel.
      - text: Copy row 934 into both units of the new layer, so that each starts out as a hot-dog detector
        why: Identical rows give both classes the same logit, so the model starts at 50/50 for every image and the hot-dog knowledge does not break the tie.
    explanation: |
      Fine-tuning normally copies everything except the output layer, because that layer belongs to the
      source labels, and initializes a new output layer randomly [^1]. Here one source class is exactly
      a target class, and the target model computes the same 512 pooled features as the source model [^2].
      Row 934 and its bias are therefore a ready-made hot-dog score for these features. Using them to
      initialize the "hot dog" unit gives fine-tuning a much better starting point than random weights.
    references:
      - source: d2l
        locator: Sec. 14.2.1 Steps
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
      - source: d2l
        locator: Sec. 14.2.2.2 Defining and Initializing the Model
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#defining-and-initializing-the-model
      - source: d2l
        locator: Sec. 14.2.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    source:
      id: d2l
      ref: chapter_computer-vision/fine-tuning#ex4
      url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#exercises
    status: draft
  - id: transfer-learning-009
    type: single
    difficulty: hard
    tags:
      - vgg16
      - freezing
      - fine-tuning
      - code-reading
    question: |
      Transfer learning with VGG-16 for 5 flower classes:

      ```python
      vgg16 = models.vgg16(pretrained=True)
      for param in vgg16.features.parameters():
          param.requires_grad = False
      vgg16.classifier[6] = nn.Linear(4096, 5)
      optimizer = optim.SGD(vgg16.classifier.parameters(), lr=0.001)
      ```

      `vgg16.classifier` holds three fully connected layers, the last of which was just replaced.
      Which parameters change during training?
    options:
      - text: All three fully connected layers of the classifier
        correct: true
      - text: Only the new `nn.Linear(4096, 5)` layer
        why: Only `features` was frozen; the first two classifier layers keep `requires_grad=True` and are passed to the optimizer too [^1].
      - text: All layers, including the convolutional features
        why: The feature parameters have `requires_grad=False` and are not in the optimizer, so they get no updates [^1].
      - text: None of the pretrained layers, plus the new layer only after the first epoch
        why: There is no warm-up rule in this code; every parameter in the optimizer is updated from the first step [^1].
    explanation: |
      Setting `requires_grad = False` freezes only the convolutional `features` block, which then
      acts as a fixed feature extractor [^1]. The new output layer and the two pretrained fully
      connected layers before it still require gradients, and `vgg16.classifier.parameters()` hands
      all of them to SGD, so the whole classifier is fine-tuned [^1]. Fine-tuning the top layers on
      the new data while reusing pretrained low-level features is the usual recipe [^2].
    references:
      - source: udacity-dl-pytorch
        locator: Transfer Learning notebook, Define the Model (Freeze training for all features layers; Final Classifier Layer; Specify Loss Function and Optimizer)
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/transfer-learning/Transfer_Learning_Solution.ipynb
      - source: d2l
        locator: Sec. 14.2.1 Steps (fine-tuning)
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
    source:
      id: udacity-dl-pytorch
      ref: transfer-learning/Transfer_Learning_Solution.ipynb#which-layers-train
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/transfer-learning/Transfer_Learning_Solution.ipynb
    status: draft
  - id: transfer-learning-010
    type: short_answer
    difficulty: easy
    tags:
      - vgg16
      - output-layer
      - parameter-count
    question: |
      VGG-16's last layer, `classifier[6]`, maps 4096 features to the 1000 ImageNet classes. You
      replace it with a new layer for 5 flower classes. How many parameters (weights and biases)
      does the new layer have?
    answer:
      numeric: 20485
      tolerance: 0
      hint: a whole number
      model: $4096 \times 5 + 5 = 20{,}485$
    explanation: |
      The new layer keeps the 4096 inputs that the unchanged part of the network produces and needs
      one output per flower class, `nn.Linear(4096, 5)` [^1]: $4096 \cdot 5 = 20{,}480$ weights plus
      5 biases. Only this new layer starts from random weights; the pretrained layers below it are
      reused, which is why fine-tuning works with a small target dataset [^2].
    references:
      - source: udacity-dl-pytorch
        locator: Transfer Learning notebook, Final Classifier Layer
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/transfer-learning/Transfer_Learning_Solution.ipynb
      - source: d2l
        locator: Sec. 14.2.2.2 Defining and Initializing the Model
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#defining-and-initializing-the-model
    source:
      id: udacity-dl-pytorch
      ref: transfer-learning/Transfer_Learning_Solution.ipynb#new-output-layer
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/transfer-learning/Transfer_Learning_Solution.ipynb
    status: draft
  - id: transfer-learning-011
    type: single
    difficulty: easy
    tags:
      - normalization
      - imagenet
      - preprocessing
    question: |
      Before feeding images to an ImageNet-pretrained DenseNet, the notebook normalizes each colour
      channel with the means `[0.485, 0.456, 0.406]` and standard deviations
      `[0.229, 0.224, 0.225]`. Why these particular values?
    options:
      - text: The pretrained model was trained on inputs normalized this way
        correct: true
      - text: They are the statistics of the new cat-and-dog images
        why: They are fixed ImageNet values; the point is to give the pretrained weights inputs on the scale they were trained on [^1].
      - text: They make every pixel lie exactly in $[0, 1]$
        why: Subtracting a mean and dividing by a standard deviation centres the values around 0; it does not map them into $[0, 1]$ [^1].
      - text: They remove colour information so that the model focuses on shapes
        why: Each channel is shifted and scaled separately; the colour information stays in the image [^1].
    explanation: |
      Most pretrained torchvision models expect $224 \times 224$ inputs normalized per channel
      exactly as during their ImageNet training, so the notebook uses those means and standard
      deviations for both training and test transforms [^1]. Feeding differently scaled inputs
      would shift every activation away from what the pretrained filters learned to respond to,
      which is also why d2l reuses the ImageNet statistics when fine-tuning [^2].
    references:
      - source: udacity-dl-pytorch
        locator: Intro to PyTorch, Part 8 - Transfer Learning (Solution), data transforms
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/intro-to-pytorch/Part%208%20-%20Transfer%20Learning%20(Solution).ipynb
      - source: d2l
        locator: Sec. 14.2.1 Steps (fine-tuning)
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
    source:
      id: udacity-dl-pytorch
      ref: intro-to-pytorch/Part 8 - Transfer Learning (Solution).ipynb#imagenet-normalization
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/intro-to-pytorch/Part%208%20-%20Transfer%20Learning%20(Solution).ipynb
    status: draft
  - id: transfer-learning-012
    type: single
    difficulty: medium
    tags:
      - fine-tuning
      - linear-probe
      - pretrained-models
    question: |
      You adapt an ImageNet-pretrained ResNet to a new image task in two ways: fine-tuning all layers, or freezing the
      network and training only a new final linear layer (a linear readout). When should you expect the two to
      perform about equally well?
    options:
      - text: When the new images are close to the pretraining domain, so the frozen features already suit the task
        correct: true
      - text: When the new dataset is very large, since the frozen layers then adapt to it on their own
        why: Frozen layers never change, whatever the dataset size; with plenty of target data, full fine-tuning tends to pull ahead.
      - text: When the new images come from a very different domain, such as medical scans
        why: A distant domain is where frozen ImageNet features fit worst and fine-tuning the whole network helps most.
      - text: 'Never: training only the last layer is always clearly worse than full fine-tuning'
        why: When source and target domains are close, the readout performs similarly while being much cheaper to train.
    explanation: |
      Fine-tuning can adjust every weight to the new data, while a linear readout keeps the pretrained features and only
      learns how to combine them [^1]. If the target images resemble the pretraining data, those features are already
      suitable and the readout does about as well, at a fraction of the training cost [^1][^2]. Fine-tuning the whole
      network pays off more as the domains drift apart, because more of the weights then need to change [^1].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 1, Section 5 Transfer Learning, Exercise 5.5.2 Training only the classification layer
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 14.2 Fine-Tuning
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html
    source:
      id: neuromatch-dl
      ref: W2D2_Convnets/W2D2_Tutorial1#ex5.5.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
    status: draft
  - id: transfer-learning-013
    type: single
    difficulty: medium
    tags:
      - pretraining
      - domain-shift
      - ossification
    question: |
      Pretraining on ImageNet and then fine-tuning usually beats training from scratch on a small dataset. In which
      situation is pretraining least likely to help, and may even hurt?
    options:
      - text: The target domain is very different from the pretraining data and plenty of target data is available
        correct: true
      - text: The target dataset is small and its images resemble the pretraining images
        why: 'This is the classic case where pretraining helps most: the features transfer and there is too little data to learn them from scratch.'
      - text: The model is large and the pretraining dataset is very large
        why: NMA lists larger models and more pretraining data among the conditions that make pretraining work better.
      - text: The target task uses ImageNet classes, but the images have a lower resolution
        why: A close domain with the same classes is a favourable case for transfer, not an unfavourable one.
    explanation: |
      Pretraining works better the closer the pretraining and target domains are, the more pretraining data there is,
      and the larger the model that can use it [^1]. If the source domain is very different, the pretrained features
      may be unhelpful, and with a lot of target data, starting from pretrained weights can even leave the model in a
      worse solution than training from scratch [^1]. The Scaling Laws for Transfer paper calls this effect
      ossification: pretraining can make the weights adapt less well to the fine-tuning distribution in the high-data
      regime [^2].
    references:
      - source: neuromatch-dl
        locator: W2D2 Tutorial 1, Exercise 5.5.1 Pretrained ResNet vs. ResNet trained from scratch
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
      - title: Hernandez et al. (2021), Scaling Laws for Transfer
        url: https://arxiv.org/abs/2102.01293
        locator: Sec. 3.1 Ossification – can pre-training harm performance?
    source:
      id: neuromatch-dl
      ref: W2D2_Convnets/W2D2_Tutorial1#ex5.5.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D2_Convnets/instructor/W2D2_Tutorial1.ipynb
