  - id: transfer-learning-024
    type: single
    difficulty: medium
    tags:
      - contrastive-learning
      - data-augmentation
      - invariance
    question: |
      Images show one coloured shape each. For contrastive learning, a positive pair is two augmented
      copies of the same image; the augmentation moves the shape to a random location and gives it a
      random colour, but never changes the shape. Negatives are augmented copies of other images. What
      should the learned representation be?
    options:
      - text: Invariant to location and colour, sensitive to shape
        correct: true
      - text: Invariant to shape, sensitive to location and colour
        why: This reverses the roles; the factors that vary inside a positive pair are the ones the encoder learns to ignore.
      - text: Invariant to location, colour and shape
        why: Then every image would get the same code and could not be told apart from its negatives.
      - text: Sensitive to location, colour and shape
        why: Location and colour differ between the two copies of a positive pair, and the alignment term pulls such copies together.
    explanation: |
      The positive pairs define what the encoder should ignore: whatever changes between two views of
      the same image is pulled to the same code [^1]. Everything else, here the shape, is what separates
      an image from its negatives, so the encoder stays sensitive to it [^1]. Choosing the
      augmentations is therefore choosing the invariances, which is why the augmentation recipe
      matters so much in SimCLR [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 4, Problem 8(b)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw4_pdf/
      - title: Chen et al. (2020), A Simple Framework for Contrastive Learning of Visual Representations, arXiv:2002.05709
        locator: Sec. 3 Data Augmentation for Contrastive Representation Learning
        url: https://arxiv.org/abs/2002.05709
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw4#q8b
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw4_pdf/
    status: reviewed
