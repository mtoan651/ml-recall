  - id: rnn-022
    type: short_answer
    difficulty: medium
    tags:
      - lstm
      - gru
      - computational-cost
    question: |
      For the same input size $d$ and hidden size $h$, every gate or candidate state of a recurrent
      layer costs one block $\mathbf{X}_t\mathbf{W}_{\textrm{x}\cdot} + \mathbf{H}_{t-1}\mathbf{W}_{\textrm{h}\cdot} + \mathbf{b}_\cdot$
      of matrix products. Per time step, a GRU layer needs about {{1}} times and an LSTM layer about
      {{2}} times the multiply-adds of a vanilla RNN layer.
    answer:
      blanks:
        - numeric: 3
          tolerance: 0
          hint: a whole number
        - numeric: 4
          tolerance: 0
          hint: a whole number
      model: GRU 3× (reset gate, update gate, candidate state), LSTM 4× (input, forget and output gates, input node)
    explanation: |
      A vanilla RNN computes one such block, the new hidden state. A GRU computes three: the reset
      gate, the update gate and the candidate hidden state [^1]; the final interpolation is only
      elementwise. An LSTM computes four: the input, forget and output gates and the input node [^2].
      The same 1 : 3 : 4 ratio holds for the parameter counts, $h(d + h + 1)$ per block, and for the
      backward pass, so it applies to both training and inference; none of the three removes the
      step-by-step sequential dependence.
    references:
      - source: d2l
        locator: Sec. 10.2.1 Reset Gate and Update Gate; 10.2.2 Candidate Hidden State
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#reset-gate-and-update-gate
      - source: d2l
        locator: Sec. 10.1.1.2 Input Gate, Forget Gate, and Output Gate; 10.1.1.3 Input Node
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-gate-forget-gate-and-output-gate
      - source: d2l
        locator: Sec. 10.1.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/lstm#ex3
      url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    status: draft
  - id: rnn-023
    type: short_answer
    difficulty: medium
    tags:
      - lstm
      - parameter-count
    question: |
      An LSTM layer has $d = 28$ inputs and $h = 32$ hidden units. Count the weights and biases of the
      input, forget and output gates and of the input node exactly as in the equations
      $\mathbf{I}_t = \sigma(\mathbf{X}_t\mathbf{W}_\textrm{xi} + \mathbf{H}_{t-1}\mathbf{W}_\textrm{hi} + \mathbf{b}_\textrm{i})$
      and so on, with one bias vector each. How many parameters does the layer have?
    answer:
      numeric: 7808
      tolerance: 0
      hint: a whole number
      model: $4 \times (28 \cdot 32 + 32 \cdot 32 + 32) = 4 \times 1952 = 7808$
    explanation: |
      Each of the four blocks has $\mathbf{W}_\textrm{x\cdot} \in \mathbb{R}^{d \times h}$,
      $\mathbf{W}_\textrm{h\cdot} \in \mathbb{R}^{h \times h}$ and a bias in $\mathbb{R}^h$
      [^1][^2], i.e. $32 \times (28 + 32 + 1) = 1952$ parameters, so the layer has
      $4 \times 1952 = 7808$. A vanilla RNN layer of the same size has 1952 and a GRU layer 5856.
      PyTorch's `nn.LSTM` keeps two bias vectors per gate (`bias_ih` and `bias_hh`), so it reports
      $4 \times 32 = 128$ more, 7936 [^3].
    references:
      - source: d2l
        locator: Sec. 10.1.1.2 Input Gate, Forget Gate, and Output Gate
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-gate-forget-gate-and-output-gate
      - source: d2l
        locator: Sec. 10.1.1.3 Input Node
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-node
      - title: 'PyTorch documentation: torch.nn.LSTM'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.LSTM.html
        locator: Variables (weight_ih_l[k], weight_hh_l[k], bias_ih_l[k], bias_hh_l[k])
      - source: d2l
        locator: Sec. 10.1.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/lstm#ex3-b
      url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    status: draft
  - id: rnn-024
    type: single
    difficulty: medium
    tags:
      - lstm
      - memory-cell
      - tanh
    question: |
      In an LSTM the input node $\tilde{\mathbf{C}}_t = \tanh(\cdot)$ already lies in $(-1, 1)$. Why
      is $\tanh$ applied again in $\mathbf{H}_t = \mathbf{O}_t \odot \tanh(\mathbf{C}_t)$?
    options:
      - text: The cell state $\mathbf{C}_t$ is a running sum over time steps and can leave $(-1, 1)$
        correct: true
      - text: The output gate $\mathbf{O}_t$ can be negative, and the second $\tanh$ flips the sign back
        why: All three gates use a sigmoid, so $\mathbf{O}_t$ lies in $(0, 1)$ [^2].
      - text: Without the second $\tanh$, the gradient through the memory cell would always be zero
        why: The gradient along the cell path is scaled by $\mathbf{F}_t$, not zero; the second $\tanh$ is about the range of $\mathbf{H}_t$.
      - text: It turns $\mathbf{H}_t$ into a probability distribution over the hidden units
        why: $\tanh$ outputs lie in $(-1, 1)$ and are not normalized to sum to 1.
    explanation: |
      The memory cell is a running sum,
      $\mathbf{C}_t = \mathbf{F}_t \odot \mathbf{C}_{t-1} + \mathbf{I}_t \odot \tilde{\mathbf{C}}_t$:
      with $\mathbf{F}_t \approx 1$, $\mathbf{I}_t \approx 1$ and
      $\tilde{\mathbf{C}}_t \approx 0.9$ for two steps from a zero cell, $\mathbf{C}_t$ already reaches about 1.8 [^1].
      Applying $\tanh$ before the output gate brings $\mathbf{H}_t$ back into $(-1, 1)$, so the next
      layer and the gates of the next step see bounded inputs [^2]. The cell state itself is left
      unsquashed, which is what lets it carry information across many steps [^1].
    references:
      - source: d2l
        locator: Sec. 10.1.1.4 Memory Cell Internal State
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#memory-cell-internal-state
      - source: d2l
        locator: Sec. 10.1.1.5 Hidden State
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#hidden-state
      - source: d2l
        locator: Sec. 10.1.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/lstm#ex4
      url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    status: draft
  - id: rnn-025
    type: single
    difficulty: hard
    tags:
      - gru
      - reset-gate
      - update-gate
    question: |
      A GRU computes
      $\tilde{\mathbf{H}}_s = \tanh(\mathbf{X}_s\mathbf{W}_\textrm{xh} + (\mathbf{R}_s \odot \mathbf{H}_{s-1})\mathbf{W}_\textrm{hh} + \mathbf{b}_\textrm{h})$
      and $\mathbf{H}_s = \mathbf{Z}_s \odot \mathbf{H}_{s-1} + (1 - \mathbf{Z}_s) \odot \tilde{\mathbf{H}}_s$.
      You want its output at step $t$ to depend only on the input $\mathbf{X}_{t'}$ at an earlier step
      $t' < t$. Which gate values achieve this?
    options:
      - text: 'At $t^\prime$: $\mathbf{R} = 0$, $\mathbf{Z} = 0$; at every step after $t^\prime$ up to $t$: $\mathbf{Z} = 1$'
        correct: true
      - text: 'At $t^\prime$: $\mathbf{R} = 1$, $\mathbf{Z} = 1$; at every step after $t^\prime$ up to $t$: $\mathbf{Z} = 0$'
        why: $\mathbf{Z} = 1$ at $t^\prime$ copies the old state and ignores $\mathbf{X}_{t^\prime}$, and $\mathbf{Z} = 0$ later overwrites the state with new inputs.
      - text: 'At $t^\prime$: $\mathbf{R} = 0$, $\mathbf{Z} = 1$; at every step after $t^\prime$ up to $t$: $\mathbf{R} = 0$'
        why: $\mathbf{Z} = 1$ at $t^\prime$ ignores $\mathbf{X}_{t^\prime}$, and $\mathbf{R} = 0$ later does not stop new inputs from entering through $\tilde{\mathbf{H}}_s$.
      - text: 'At $t^\prime$: $\mathbf{R} = 0$, $\mathbf{Z} = 0$; at every step after $t^\prime$ up to $t$: $\mathbf{R} = 0$, $\mathbf{Z} = 0$'
        why: $\mathbf{Z} = 0$ after $t^\prime$ replaces the state by $\tilde{\mathbf{H}}_s$, which is built from the later input $\mathbf{X}_s$.
    explanation: |
      At $t'$, $\mathbf{Z} = 0$ makes $\mathbf{H}_{t'} = \tilde{\mathbf{H}}_{t'}$, and $\mathbf{R} = 0$
      removes $\mathbf{H}_{t'-1}$ from the candidate, so the state is built from $\mathbf{X}_{t'}$
      alone [^1]. For $t' < s \le t$, $\mathbf{Z} = 1$ copies the state forward and ignores
      $\mathbf{X}_s$, effectively skipping those steps [^2]; the reset gate does not matter then, and
      neither do the steps before $t'$. Real gates are sigmoids, so they only approach 0 and 1.
    references:
      - source: d2l
        locator: Sec. 10.2.2 Candidate Hidden State
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#candidate-hidden-state
      - source: d2l
        locator: Sec. 10.2.3 Hidden State
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#hidden-state
      - source: d2l
        locator: Sec. 10.2.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/gru#ex1
      url: https://d2l.ai/chapter_recurrent-modern/gru.html#exercises
    status: draft
  - id: rnn-026
    type: single
    difficulty: medium
    tags:
      - gru
      - update-gate
      - long-term-dependencies
    question: |
      You build a stripped-down GRU that keeps only one of its two gates. Which gate should you keep
      if the task needs information carried across many time steps?
    options:
      - text: The update gate, because $\mathbf{Z}_t \approx 1$ copies the old state forward almost unchanged
        correct: true
      - text: The reset gate, because $\mathbf{R}_t \approx 1$ lets the whole old state into the update
        why: Without an update gate, $\mathbf{H}_t = \tilde{\mathbf{H}}_t$ is rewritten through $\tanh$ and $\mathbf{W}_\textrm{hh}$ at every step, like a vanilla RNN [^1].
      - text: Either one, because the two gates become interchangeable once they are trained
        why: They play different roles; d2l links reset gates to short-term and update gates to long-term dependencies [^2].
      - text: Neither, because a recurrent unit with only one gate has no hidden state at all
        why: With no gates at all the unit is a vanilla RNN, which still has a hidden state.
    explanation: |
      The update gate forms the convex combination
      $\mathbf{H}_t = \mathbf{Z}_t \odot \mathbf{H}_{t-1} + (1 - \mathbf{Z}_t) \odot \tilde{\mathbf{H}}_t$:
      with $\mathbf{Z}_t$ near 1 the old state passes through untouched, a shortcut along which
      information and gradients survive many steps [^1]. A reset-only unit has no such path; its
      reset gate only masks $\mathbf{H}_{t-1}$ inside the candidate, so it captures short-term
      dependencies [^2].
    references:
      - source: d2l
        locator: Sec. 10.2.3 Hidden State
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#hidden-state
      - source: d2l
        locator: Sec. 10.2.3 Hidden State (summary bullets) and 10.2.6 Summary
        url: https://d2l.ai/chapter_recurrent-modern/gru.html#summary
      - source: d2l
        locator: Sec. 10.2.7 Exercises, Exercise 4
