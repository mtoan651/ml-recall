  - id: rnn-035
    type: short_answer
    difficulty: medium
    tags:
      - rnn
      - parameter-count
    question: |
      A vanilla RNN has input vectors of size 200, a hidden state of size 100 and an output layer of
      size 200. It has the weight matrices $W$ (input to hidden), $U$ (hidden to hidden) and $V$
      (hidden to output), one bias vector for the hidden layer and one for the output layer. How many
      trainable parameters does it have?
    answer:
      numeric: 50300
      tolerance: 0
      pattern: 50,?300
      accept:
        - '50300'
        - 50,300
      hint: an integer
      model: $W$ 100·200 = 20,000; $U$ 100·100 = 10,000; $V$ 200·100 = 20,000; biases 100 + 200 = 300; total 50,300
    explanation: |
      The weight shapes are $W: d_h \times d_{in} = 100 \times 200$, $U: d_h \times d_h = 100 \times 100$
      and $V: d_{out} \times d_h = 200 \times 100$ [^1], which gives $20{,}000 + 10{,}000 + 20{,}000$
      weights, plus $100 + 200$ biases, 50,300 parameters in total. Because all weights are shared
      across time steps, this count is the same for a sequence of 5 tokens or of 500 [^1].
      (Implementations that use two hidden biases, such as PyTorch's `nn.RNN`, add another 100.)
    references:
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 2.2 Parameter sharing (dimensionality of weight matrices)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/06_intro-to-transformers.ipynb#ex6.1b
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
