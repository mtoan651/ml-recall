  - id: rnn-029
    type: single
    difficulty: easy
    tags:
      - encoder-decoder
      - seq2seq
      - applications
    question: |
      Besides machine translation, which of these tasks is the most natural fit for an
      encoder–decoder architecture?
    options:
      - text: Summarizing a news article as a short headline
        correct: true
      - text: Tagging each word of a sentence with its part of speech
        why: The input and output are aligned, one tag per token, so an encoder with a per-token output layer suffices [^1].
      - text: Classifying a movie review as positive or negative
        why: The output is one fixed-size label; an encoder followed by a classifier suffices.
      - text: Predicting tomorrow's temperature from last week's readings
        why: The output is a single number, a job for an autoregressive regression model [^1].
    explanation: |
      Encoder–decoder models are the standard tool when input and output are both variable-length
      and *unaligned* [^1][^2]. A summary is much shorter than its article and need not follow its
      word order, like a translation. Other examples from d2l are mapping dialogue prompts to replies
      and questions to answers [^3].
    references:
      - source: d2l
        locator: Sec. 9.1 Working with Sequences (introduction, aligned vs. unaligned)
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html
