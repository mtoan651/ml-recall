  - id: rnn-016
    type: short_answer
    difficulty: hard
    tags:
      - bptt
      - eigenvalues
      - power-iteration
      - exploding-gradients
    question: |
      The symmetric matrix
      $\mathbf{M} = \begin{bmatrix} 1.25 & 0.75 \\ 0.75 & 1.25 \end{bmatrix}$ has eigenvalues 2 and
      0.5. Starting from $\mathbf{x} = (1, 0)^\top$, what is the first entry of
      $\mathbf{M}^{10}\mathbf{x}$? Round to one decimal.
    answer:
      numeric: 512.0
      tolerance: 0.1
      hint: a number, 1 decimal
      model: $\mathbf{x} = \tfrac12(1, 1) + \tfrac12(1, -1)$, so $\mathbf{M}^{10}\mathbf{x} = \tfrac12 2^{10}(1, 1) + \tfrac12 0.5^{10}(1, -1) \approx (512.0, 512.0)$
    explanation: |
      The eigenvectors are $(1, 1)/\sqrt2$ for $\lambda = 2$ and $(1, -1)/\sqrt2$ for $\lambda = 0.5$,
      and $\mathbf{M}^k$ has the same eigenvectors with eigenvalues $\lambda_i^k$. Writing
      $\mathbf{x} = \tfrac12(1, 1) + \tfrac12(1, -1)$, the first part grows like $2^{10} = 1024$ and
      the second shrinks like $0.5^{10} \approx 0.001$, so $\mathbf{M}^{10}\mathbf{x} \approx
      (512.0005, 511.9995)$: almost exactly parallel to the top eigenvector, as in power iteration
      [^2]. Backpropagation through time multiplies gradients by powers of
      $\mathbf{W}_\textrm{hh}^\top$, so they too line up with its top eigenvector and their size
      scales like $|\lambda_1|^k$: exploding for $|\lambda_1| > 1$, vanishing for $|\lambda_1| < 1$
      [^1].
    references:
      - source: d2l
        locator: Sec. 9.7.2 Backpropagation Through Time in Detail
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#backpropagation-through-time-in-detail
      - title: 'Wikipedia: Power iteration'
        url: https://en.wikipedia.org/wiki/Power_iteration
        locator: The method; Analysis
      - source: d2l
        locator: Sec. 9.7.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/bptt#ex1
      url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#exercises
    status: draft
  - id: rnn-017
    type: multiple
    difficulty: medium
    tags:
      - bptt
      - exploding-gradients
      - truncated-bptt
    question: |
      Besides gradient clipping, which of these help against exploding gradients when an RNN is
      trained with backpropagation through time? Select all that apply.
    options:
      - text: Truncating backpropagation after a fixed number of time steps (detaching the hidden state)
        correct: true
      - text: Lowering the learning rate, which shrinks every update $\eta\mathbf{g}$
        correct: true
      - text: Backpropagating through the full sequence instead of truncating it
        why: The full computation is where gradients blow up; d2l notes it is almost never used in practice [^1].
      - text: Initializing $\mathbf{W}_\textrm{hh}$ with eigenvalues well above 1, so the signal does not fade
        why: Powers of eigenvalues above 1 are exactly what make gradients explode [^3].
    explanation: |
      Truncated backpropagation through time stops the gradient sum after $\tau$ steps, which keeps
      the products of Jacobians short and biases the model toward simpler, more stable short-range
      dependencies [^1]. A smaller learning rate bounds the change in the objective, at most
      $L\eta\lVert\mathbf{g}\rVert$, but it slows every step just to guard against rare large
      gradients, which is why clipping is usually preferred [^2]. Large eigenvalues of
      $\mathbf{W}_\textrm{hh}$ make the powers $(\mathbf{W}_\textrm{hh}^\top)^k$ diverge [^3].
    references:
      - source: d2l
        locator: Sec. 9.7.1 Analysis of Gradients in RNNs (Full Computation, Truncating Time Steps)
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#analysis-of-gradients-in-rnns
      - source: d2l
        locator: Sec. 9.5.3 Gradient Clipping
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#gradient-clipping
      - source: d2l
        locator: Sec. 9.7.2 Backpropagation Through Time in Detail
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#backpropagation-through-time-in-detail
      - source: d2l
        locator: Sec. 9.7.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/bptt#ex2
      url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#exercises
    status: draft
  - id: rnn-018
    type: single
    difficulty: easy
    tags:
      - gradient-clipping
      - exploding-gradients
      - training
    question: |
      You train an RNN language model with backpropagation through time but switch off gradient
      clipping. What should you expect?
    options:
      - text: Rare huge gradient steps that make the loss spike or diverge, undoing earlier progress
        correct: true
      - text: Slower but smoother training, because clipping only adds noise to the gradients
        why: Clipping adds no noise; it only shrinks the rare oversized gradients and keeps their direction [^1].
      - text: No change, because tanh keeps the hidden state, and hence its gradient, in $(-1, 1)$
        why: A bounded state does not bound the gradient, which is a product of many Jacobians through $\mathbf{W}_\textrm{hh}$ [^2].
      - text: Worse vanishing gradients, because clipping is what keeps small gradients alive
        why: Clipping only ever shrinks large gradients; it never enlarges small ones [^1].
    explanation: |
      Backpropagating through many time steps multiplies many matrices, so the gradient norm can
      occasionally become huge; one such step can undo thousands of iterations of progress, and
      training then diverges or shows massive loss spikes [^1]. Clipping projects the gradient onto a
      ball of radius $\theta$, keeping its direction [^1]; d2l calls it vital for stable RNN training
      [^2].
    references:
      - source: d2l
        locator: Sec. 9.5.3 Gradient Clipping
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#gradient-clipping
      - source: d2l
        locator: Sec. 9.7 Backpropagation Through Time (introduction)
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 9
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/rnn-scratch#ex9
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    status: draft
  - id: rnn-019
    type: short_answer
    difficulty: easy
    tags:
      - gradient-clipping
      - training
    question: |
      Gradient clipping rescales the gradient as
      $\mathbf{g} \leftarrow \min\left(1, \theta / \lVert\mathbf{g}\rVert\right)\mathbf{g}$, where
      $\mathbf{g}$ concatenates the gradients of all parameters. With $\theta = 1$ and
      $\mathbf{g} = (3, 4)$, what is the first component after clipping?
    answer:
      numeric: 0.6
      tolerance: 0.001
      hint: a number, 1 decimal
      model: $\lVert\mathbf{g}\rVert = 5$, so $\mathbf{g} \leftarrow \tfrac15(3, 4) = (0.6, 0.8)$
    explanation: |
      The norm is $\sqrt{3^2 + 4^2} = 5 > \theta$, so the gradient is scaled by $1/5$ to
      $(0.6, 0.8)$. Its norm becomes exactly $\theta$ and its direction is unchanged, while a gradient
      with norm at most $\theta$ passes untouched [^1]. d2l's implementation computes one norm over
      all parameters together, treating them as one long vector [^1].
    references:
      - source: d2l
        locator: Sec. 9.5.3 Gradient Clipping, Eq. (9.5.3)
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#gradient-clipping
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 9
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/rnn-scratch#ex9-b
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    status: draft
  - id: rnn-020
    type: single
    difficulty: medium
    tags:
      - relu
      - gradient-clipping
      - exploding-gradients
    question: |
      You replace $\tanh$ by ReLU in a vanilla RNN,
      $\mathbf{H}_t = \mathrm{ReLU}(\mathbf{X}_t\mathbf{W}_\textrm{xh} + \mathbf{H}_{t-1}\mathbf{W}_\textrm{hh} + \mathbf{b}_\textrm{h})$.
      Do you still need gradient clipping?
    options:
      - text: 'Yes: ReLU is unbounded, and on active units it passes gradients through powers of $\mathbf{W}_\textrm{hh}$ undamped'
        correct: true
      - text: 'No: the derivative of ReLU is always either 0 or 1, so the gradient can never grow from one time step to the next'
        why: A derivative of 1 means nothing damps the factor $\mathbf{W}_\textrm{hh}^\top$, which can still grow the gradient at every step [^2].
      - text: 'No: ReLU cures vanishing gradients, and vanishing and exploding are the same problem'
        why: They are opposite failure modes of the same matrix powers [^2].
      - text: Only for sequences shorter than the hidden size; longer ones are safe
        why: Longer sequences mean more factors in the product, which makes explosion more likely, not less.
    explanation: |
      Each backward step through time multiplies the gradient by
      $\mathbf{W}_\textrm{hh}^\top$ and the activation's derivative. $\tanh' \le 1$ damps this
      product, while ReLU's derivative is exactly 1 on active units, so an eigenvalue of
      $\mathbf{W}_\textrm{hh}$ above 1 makes the gradient grow geometrically [^2]. ReLU also leaves the
      hidden state itself unbounded. d2l notes that even modern RNNs often suffer from exploding
      gradients and use clipping as the standard remedy [^1].
    references:
      - source: d2l
        locator: Sec. 9.5.3 Gradient Clipping
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#gradient-clipping
      - source: d2l
        locator: Sec. 9.7.2 Backpropagation Through Time in Detail
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#backpropagation-through-time-in-detail
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 10
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/rnn-scratch#ex10
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    status: draft
  - id: rnn-021
    type: single
    difficulty: easy
    tags:
      - lstm
      - word-level
      - tokenization
    question: |
      A character-level LSTM language model generates strings such as "the tiee traveller", with
      misspelled words. You want it to produce only real words. What is the main change?
    options:
      - text: Tokenize the text into words, so its inputs and outputs range over a word vocabulary
        correct: true
      - text: Add more LSTM layers, so that the model memorizes the spelling of every word
        why: A deeper character model may misspell less often, but nothing restricts its outputs to real words.
      - text: Always pick the most likely next character, so that no unlikely letters are generated
        why: Greedy decoding over characters can still string letters into non-words.
      - text: Increase `num_steps`, so that every training window contains only whole words
        why: A longer window adds context but still predicts one character at a time.
    explanation: |
      A word-level model predicts one vocabulary entry per step, so every token it emits is a word it
      has seen [^1]. The price is a much larger vocabulary, tens of thousands of words instead of a
      few dozen characters, with a larger embedding and output layer, and rare words must be mapped to
      `<unk>` [^1][^2]. Subword tokenizations such as byte pair encoding are the usual compromise
      between the two [^3].
    references:
      - source: d2l
        locator: Sec. 9.2.2 Tokenization
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#tokenization
      - source: d2l
        locator: Sec. 10.5.3 Loading Sequences of Fixed Length
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#loading-sequences-of-fixed-length
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
      - source: d2l
        locator: Sec. 10.1.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/lstm#ex2
      url: https://d2l.ai/chapter_recurrent-modern/lstm.html#exercises
