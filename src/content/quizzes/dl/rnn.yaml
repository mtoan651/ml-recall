topic: rnn
title: Recurrent Neural Networks
questions:
  - id: rnn-001
    type: single
    difficulty: easy
    question: RNN is short for?
    options:
      - text: regression neural network
      - text: recurrent neural network
        correct: true
      - text: re-iterative neural network
    explanation: |
      RNN stands for recurrent neural network. It reads a sequence one token at a time and passes the
      state it produces back into the network along with the next token [^1]. That loop is the
      "recurrence": the hidden state at step $t$ is computed from the input at step $t$ and the hidden
      state at step $t-1$ [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md
        locator: 'Lesson: Recurrent Neural Networks (introduction)'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
        locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States
    source:
      id: ms-ai-for-beginners
      ref: quiz-116/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-16.json
    status: draft
  - id: rnn-002
    type: single
    difficulty: easy
    question: A simple RNN cell has two weight _____
    options:
      - text: matrices
        correct: true
      - text: vectors
      - text: scalars
    explanation: |
      A simple RNN cell holds two weight matrices: $W$ transforms the current input $X_i$ and $H$
      transforms the previous state $S_{i-1}$, and the new state is $\sigma(W X_i + H S_{i-1} + b)$
      [^1]. With embedding size `emb_size` and state size `hid_size`, $W$ is
      `emb_size` × `hid_size` and $H$ is `hid_size` × `hid_size` [^1]; only the bias $b$ is a
      vector. d2l writes the same update as $H_t = \phi(X_t W_{xh} + H_{t-1} W_{hh} + b_h)$, with an
      input-to-hidden and a hidden-to-hidden matrix [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#anatomy-of-an-rnn-cell
        locator: 'Lesson: Recurrent Neural Networks, Anatomy of an RNN Cell'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
        locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States, Eq. (9.4.5)
    source:
      id: ms-ai-for-beginners
      ref: quiz-116/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-16.json
    status: draft
  - id: rnn-003
    type: single
    difficulty: easy
    question: _____ takes some information from the input and hidden vector, and inserts it into state
    options:
      - text: forget gate
      - text: output gate
      - text: input gate
        correct: true
    explanation: |
      In an LSTM the input gate takes information from the current input and the hidden vector and
      writes it into the cell state [^1]. The forget gate decides which parts of the state to keep or
      erase, and the output gate decides how much of the cell's memory shows up in the output at this
      step [^1][^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#long-short-term-memory-lstm
        locator: 'Lesson: Recurrent Neural Networks, Long Short Term Memory (LSTM)'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-gate-forget-gate-and-output-gate
        locator: Sec. 10.1.1.2 Input Gate, Forget Gate, and Output Gate
    source:
      id: ms-ai-for-beginners
      ref: quiz-216/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-16.json
    status: draft
  - id: rnn-004
    type: true_false
    difficulty: easy
    question: When an RNN layer is unrolled over a sequence, the cells at all time steps share the same weights.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      An RNN applies the same block at every time step, so all the unrolled cells share one set of
      weights and are trained end to end with a single backpropagation pass [^1]. That sharing is
      why an RNN's parameter count does not grow with the length of the sequence [^2]. Stacked
      layers are different: in a deep (multi-layer) RNN each layer $l$ has its own weights
      $W_{xh}^{(l)}$ and $W_{hh}^{(l)}$ [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md
        locator: 'Lesson: Recurrent Neural Networks (introduction)'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
        locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-modern/deep-rnn.html
        locator: Sec. 10.3 Deep Recurrent Neural Networks, Eq. (10.3.1)
    source:
      id: ms-ai-for-beginners
      ref: quiz-216/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-16.json
    status: draft
  - id: rnn-005
    type: single
    difficulty: easy
    question: _____ is a traditional neural network with one input and one output
    options:
      - text: one-to-one
        correct: true
      - text: sequence-to-sequence
      - text: one-to-many
    explanation: |
      In the lesson's map of recurrent architectures, one-to-one is the ordinary neural network with
      a single input and a single output [^1]. One-to-many turns one input into a sequence (for
      example image captioning), and sequence-to-sequence (many-to-many) maps an input sequence to an
      output sequence, as in machine translation [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
        locator: 'Lesson: Generative networks (architecture patterns)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-117/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-17.json
    status: draft
  - id: rnn-006
    type: true_false
    difficulty: easy
    question: RNN generates texts by generating next output token for each input token
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      A generative RNN is trained to output, for each input character, the next character of the
      text, so the target sequence is the input shifted by one position [^1][^2]. To generate, it
      starts from a prompt and produces one character at a time, feeding each new character and the
      state back in to get the next one [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
        locator: 'Lesson: Generative networks (training and inference)'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#rnn-based-character-level-language-models
        locator: Sec. 9.4.3 RNN-Based Character-Level Language Models
    source:
      id: ms-ai-for-beginners
      ref: quiz-117/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-17.json
    status: draft
  - id: rnn-007
    type: true_false
    difficulty: easy
    question: When generating text with an RNN, always picking the character with the highest probability guarantees meaningful text.
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Always taking the most probable character often makes the generated text cycle through the
      same phrases. The top few probabilities can also be nearly equal, so the runner-up character
      may be just as sensible [^1]. The lesson therefore samples from the predicted distribution,
      with a temperature to control how random the choice is [^1]. More generally, picking the most
      likely token at every step does not guarantee the most likely sequence overall [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md#soft-text-generation-and-temperature
        locator: 'Lesson: Generative networks, Soft text generation and temperature'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#greedy-search
        locator: Sec. 10.8.1 Greedy Search
    source:
      id: ms-ai-for-beginners
      ref: quiz-217/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-17.json
    status: draft
  - id: rnn-008
    type: single
    difficulty: easy
    question: Many-to-many can also be referred to as _____
    options:
      - text: sequence-to-vector
      - text: sequence-to-sequence
        correct: true
      - text: vector-to-sequence
    explanation: |
      The lesson calls the many-to-many pattern sequence-to-sequence: one RNN collects the whole
      input sequence into a hidden state and a second RNN unrolls that state into the output
      sequence, as in machine translation [^1]. Sequence-to-vector is the many-to-one pattern: a
      whole sequence goes in and a single output comes out, as in text classification or sentiment
      analysis [^1][^2]. Vector-to-sequence is one-to-many: a single input, such as an image, is
      turned into a sequence, as in image captioning [^1][^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
        locator: 'Lesson: Generative networks (architecture patterns)'
      - title: Karpathy, The Unreasonable Effectiveness of Recurrent Neural Networks (2015)
        url: http://karpathy.github.io/2015/05/21/rnn-effectiveness/
        locator: Sec. Recurrent Neural Networks, figure of input/output patterns and its caption
    source:
