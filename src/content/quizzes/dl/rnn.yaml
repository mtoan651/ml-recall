  - id: rnn-034
    type: multiple
    difficulty: medium
    tags:
      - rnn
      - weight-shapes
      - bidirectional-rnn
      - vanishing-gradients
    question: |
      You train a vanilla RNN with one hidden layer: the input vectors have size 200, the output
      layer has size 200 and the hidden size is 100. Which statements are true? Select all that
      apply.
    options:
      - text: The matrix $U$ between the hidden states of consecutive time steps has shape $200 \times 200$
        why: $U$ maps a hidden state to the next hidden state, so its shape is hidden size × hidden size, $100 \times 100$ [^1].
      - text: The hidden state $h_t = \tanh(W_{xh}x_t + W_{hh}h_{t-1} + b)$ is a 100-dimensional vector
        correct: true
      - text: If a bidirectional RNN combines its forward and backward hidden states by element-wise addition, both RNNs need the same hidden size
        correct: true
      - text: The word2vec skip-gram model is likely to suffer from vanishing gradients
        why: Skip-gram is a shallow model with no recurrence; vanishing gradients come from multiplying many derivatives through long chains of time steps [^3].
      - text: In the forward pass, the hidden state at each step is computed by multiplying the input $x_t$ by $W$ and applying a nonlinearity
        why: This leaves out the recurrent term; the previous hidden state, multiplied by $U$ (here $W_{hh}$), is added before the nonlinearity [^1].
    explanation: |
      With input size $d_{in}$, hidden size $d_h$ and output size $d_{out}$, the weights have shapes
      $W: d_h \times d_{in}$, $U: d_h \times d_h$ and $V: d_{out} \times d_h$, so here $U$ is
      $100 \times 100$ and $h_t$ has 100 entries; $h_t$ combines $W x_t$ and $U h_{t-1}$ before the
      nonlinearity [^1]. A bidirectional RNN combines a forward and a backward hidden state by
      concatenation, element-wise addition or multiplication, and the element-wise options need
      vectors of equal size [^2]. Vanishing gradients arise in the backward pass through many time
      steps, a problem of RNNs, not of a shallow model like skip-gram [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 2.2 Parameter sharing (dimensionality of weight matrices); 3.1 Computing the new state h_t'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 6.2 Bidirectional RNNs'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 1.2 Problems with RNNs'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/06_intro-to-transformers.ipynb#ex6.1
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
