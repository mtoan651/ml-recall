  - id: rnn-030
    type: single
    difficulty: medium
    tags:
      - seq2seq
      - masking
      - padding
      - loss
    question: |
      In seq2seq training, target sentences are padded with `<pad>` up to `num_steps` tokens. What
      goes wrong if the cross-entropy loss is averaged over all positions, padding included?
    options:
      - text: The easy `<pad>` targets count as real tokens, diluting the loss and wasting gradient on padding
        correct: true
      - text: 'Nothing: `<pad>` has a fixed index, so its cross-entropy term is always exactly zero'
        why: Each padding position is still a prediction with a nonzero loss unless it is masked [^1].
      - text: The encoder can no longer read the source sentence, because the padding hides its final hidden state
        why: The question is about the target-side loss; the source side tracks valid lengths separately [^2].
      - text: Training stops with a shape error, because padded and unpadded targets differ in length
        why: Padding exists precisely so that all targets in a minibatch have the same shape [^2].
    explanation: |
      Padding tokens only make sequences the same length; their predictions should be excluded from
      the loss, which d2l does by multiplying them by zero [^1]. Without the mask, short sentences
      contribute many trivial `<pad>` targets, so the reported loss looks better than the model's
      real quality on words, and part of every gradient goes into learning to predict padding rather
      than translation [^1][^2].
    references:
      - source: d2l
        locator: Sec. 10.7.5 Loss Function with Masking
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#loss-function-with-masking
      - source: d2l
        locator: Sec. 10.5.3 Loading Sequences of Fixed Length
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#loading-sequences-of-fixed-length
      - source: d2l
        locator: Sec. 10.7.10 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/seq2seq#ex2
      url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    status: draft
  - id: rnn-031
    type: single
    difficulty: medium
    tags:
      - seq2seq
      - decoder
      - initialization
    question: |
      An RNN decoder that copies the encoder's final hidden state as its initial state needs the same
      number of layers and hidden units as the encoder. Your encoder has 2 layers of 256 units and your
      decoder 1 layer of 512 units. How can you initialize the decoder's state?
    options:
      - text: Map the encoder state to the decoder's shape with a learned layer, e.g. $\tanh(\mathbf{W}\mathbf{h})$
        correct: true
      - text: Copy the state as it is; the framework broadcasts the 256 hidden units to the 512 the decoder expects
        why: Hidden states are not broadcast across different sizes; the shapes must match exactly.
      - text: You cannot; an encoder and a decoder must always have identical layer shapes
        why: Identical shapes are only needed for copying the state directly [^1].
      - text: Use the input embedding of the last source token as the decoder's initial state
        why: A single token's embedding does not summarize the source sentence.
    explanation: |
      d2l's decoder copies the encoder's final state, which is why it requires matching shapes [^1].
      A learned projection removes that constraint: Bahdanau et al. initialize the decoder with
      $\mathbf{s}_0 = \tanh(\mathbf{W}_s \overleftarrow{\mathbf{h}}_1)$, computed from an encoder
      state [^2]. Another option is to start from zeros and rely on the context vector, which d2l's
      decoder also concatenates to the input at every step [^1].
    references:
      - source: d2l
        locator: Sec. 10.7.3 Decoder
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#decoder
      - title: Bahdanau, Cho & Bengio (2014), Neural Machine Translation by Jointly Learning to Align and Translate
        url: https://arxiv.org/abs/1409.0473
        locator: Appendix A.2.2 Decoder
      - source: d2l
        locator: Sec. 10.7.10 Exercises, Exercise 3
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/seq2seq#ex3
      url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    status: draft
  - id: rnn-032
    type: single
    difficulty: medium
    tags:
      - teacher-forcing
      - exposure-bias
      - seq2seq
    question: |
      During seq2seq training you replace teacher forcing by feeding the decoder its own prediction
      from the previous step. What is the main trade-off?
    options:
      - text: Training matches test-time use, but the decoder first learns from its own errors, so learning is slower
        correct: true
      - text: Training gets faster, because the decoder no longer needs the target sentence
        why: The targets are still needed for the loss at every step, and conditioning on poor early predictions slows learning.
      - text: Nothing changes, because the decoder sees exactly the same tokens whenever its predictions are correct
        why: Early in training most predictions are wrong, so the decoder sees very different inputs.
      - text: The decoder can now look at future target tokens, which lowers the training loss
        why: In neither setup does the decoder see future target tokens.
    explanation: |
      Teacher forcing feeds `<bos>` plus the ground-truth target, shifted by one, as decoder input
      [^1], while at test time the decoder is fed its own previous prediction [^2]. This mismatch
      between training and inference lets errors accumulate along a generated sequence. Feeding
      predictions during training removes the mismatch, but early predictions are poor, so the decoder
      learns from noisy inputs. Scheduled sampling is a curriculum that moves gradually from true to
      generated tokens [^3].
    references:
      - source: d2l
        locator: Sec. 10.7.1 Teacher Forcing
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#teacher-forcing
      - source: d2l
        locator: Sec. 10.7.7 Prediction
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#prediction
      - title: Bengio, Vinyals, Jaitly & Shazeer (2015), Scheduled Sampling for Sequence Prediction with Recurrent Neural Networks
        url: https://arxiv.org/abs/1506.03099
        locator: Abstract; Sec. 1 Introduction
      - source: d2l
        locator: Sec. 10.7.10 Exercises, Exercise 4
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/seq2seq#ex4
      url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#exercises
    status: draft
  - id: rnn-033
    type: multiple
    difficulty: medium
    tags:
      - rnn
      - hidden-state
      - parameter-sharing
    question: |
      A simple RNN has input-to-hidden weights $W$, hidden-to-hidden weights $U$ and
      hidden-to-output weights $V$. Which statements about RNNs are true? Select all that apply.
    options:
      - text: RNNs pass information from one time step to the next through their hidden states
        correct: true
      - text: RNNs are appropriate only for text data
        why: RNNs process sequential data in general, for example time series or sequences of audio frames; text is just the course's main example [^4].
      - text: At each time step an RNN has its own hidden state $h_t$ and input $x_t$, but reuses the same matrix $U$
        correct: true
      - text: The number of parameters of an RNN language model grows with the number of time steps
        why: All weights are shared across time steps, so a longer sequence reuses the same $W$, $U$ and $V$ rather than adding parameters [^2].
      - text: The hidden state at the current step is computed directly from just two things, the current input and the previous hidden state
        correct: true
    explanation: |
      An RNN keeps a hidden state that acts as memory: it is passed from one time step to the next,
      so it can carry information from the beginning of the sequence [^1]. The new state is
      $h_t = g(U h_{t-1} + W x_t + b)$, computed directly from the previous state and the current
      input only (through $h_{t-1}$ it still depends on all earlier inputs) [^3]. The key point of
      RNNs is that all weights between time steps are shared, which lets the model learn patterns
      independent of their position and keeps the number of parameters fixed [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 1.2 RNNs introduction'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 2.2 Parameter sharing'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — 3.1 Computing the new state h_t'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 5: Introduction to Recurrent Neural Networks (RNNs) — Final comments and summary (Important ideas to know)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/05_intro-to-RNNs.ipynb#ex5.1
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/05_intro-to-RNNs.ipynb
