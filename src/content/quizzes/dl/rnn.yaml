        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html
      - source: d2l
        locator: Sec. 10.6.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-modern/encoder-decoder.html#exercises
