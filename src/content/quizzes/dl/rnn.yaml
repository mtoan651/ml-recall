  - id: rnn-027
    type: short_answer
    difficulty: easy
    tags:
      - bidirectional-rnn
      - tensor-shapes
    question: |
      A bidirectional RNN layer uses $h_f = 32$ hidden units in the forward direction and $h_b = 16$
      in the backward direction. For a minibatch of $n = 4$ sequences, what is the shape of the
      concatenated hidden state $\mathbf{H}_t$ at one time step?
    answer:
      accept:
        - (4, 48)
      pattern: '[(\[]?\s*4\s*[,x×]\s*48\s*[)\]]?'
      hint: two dimensions, e.g. (8, 64)
      model: $(4, 48)$, i.e. $n \times (h_f + h_b)$
    explanation: |
      The layer concatenates the forward state $\overrightarrow{\mathbf{H}}_t \in \mathbb{R}^{4 \times 32}$
      and the backward state $\overleftarrow{\mathbf{H}}_t \in \mathbb{R}^{4 \times 16}$ along the
      feature axis, giving $4 \times 48$ [^1]. The output layer's weight $\mathbf{W}_\textrm{hq}$ then
      needs $h_f + h_b = 48$ rows instead of $2h$. Different sizes for the two directions are allowed
      but rarely used in practice [^1].
    references:
      - source: d2l
        locator: Sec. 10.4 Bidirectional Recurrent Neural Networks (introduction)
        url: https://d2l.ai/chapter_recurrent-modern/bi-rnn.html
      - source: d2l
        locator: Sec. 10.4.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-modern/bi-rnn.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/bi-rnn#ex1
      url: https://d2l.ai/chapter_recurrent-modern/bi-rnn.html#exercises
    status: draft
  - id: rnn-028
    type: true_false
    difficulty: easy
    tags:
      - encoder-decoder
      - architecture
    shuffle: false
    question: |
      True or false: in an encoder–decoder model, the encoder and the decoder must be the same type of
      neural network, for example both RNNs.
    options:
      - text: 'True'
        why: The interface only asks the encoder for a state that the decoder can be initialized from; a CNN encoder with an RNN decoder, as in image captioning, works fine [^1][^3].
      - text: 'False'
        correct: true
    explanation: |
      In d2l's interface the encoder maps a variable-length input to an encoded state, and the decoder
      turns that state, through its `init_state` method, into a variable-length output [^1]. Nothing
      ties the two to the same architecture. Even in the Transformer the decoder differs from the
      encoder, with an extra encoder–decoder attention sublayer [^2], and tasks with a fixed input
      such as image captioning naturally pair an image encoder with a text decoder [^3].
    references:
      - source: d2l
        locator: Sec. 10.6.1 Encoder; 10.6.2 Decoder
        url: https://d2l.ai/chapter_recurrent-modern/encoder-decoder.html#decoder
      - source: d2l
        locator: Sec. 11.7.1 Model
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#model
      - source: d2l
        locator: Sec. 9.1 Working with Sequences (introduction)
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html
      - source: d2l
        locator: Sec. 10.6.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-modern/encoder-decoder.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/encoder-decoder#ex1
      url: https://d2l.ai/chapter_recurrent-modern/encoder-decoder.html#exercises
