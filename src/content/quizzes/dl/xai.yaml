  - id: xai-015
    type: single
    difficulty: medium
    tags:
      - shap
      - linear-shap
    question: |
      A linear model $f(x) = 2x_1 - 3x_2 + 1$ is explained with SHAP, assuming independent features.
      On the background data $\mathbb{E}[x_1] = 1$ and $\mathbb{E}[x_2] = 3$. For the input
      $x = (4, 1)$, what is the SHAP value of $x_2$?
    options:
      - text: $+6$
        correct: true
      - text: $-3$
        why: That is $w_2 x_2$, the contribution measured from $x_2 = 0$; SHAP measures it from the average input [^1].
      - text: $-6$
        why: This flips the sign, computing $w_2(\mathbb{E}[x_2] - x_2)$ instead of $w_2(x_2 - \mathbb{E}[x_2])$ [^1].
      - text: $-9$
        why: That is $w_2\,\mathbb{E}[x_2]$, the feature's average contribution, not how this input deviates from it [^1].
    explanation: |
      For a linear model with independent features, SHAP values are
      $\phi_i = w_i(x_i - \mathbb{E}[x_i])$ [^1], so $\phi_2 = -3 \cdot (1 - 3) = +6$: the weight is
      negative, but $x_2$ is below its average, which pushes the prediction *up*. With
      $\phi_1 = 2 \cdot (4 - 1) = 6$, the values add up to $f(x) - \mathbb{E}[f(X)] = 6 - (-6) = 12$,
      as local accuracy requires when the base value is $\phi_0 = \mathbb{E}[f(X)] = f(1, 3) = -6$
      [^1]. (The paper's Corollary 1 writes $\phi_0 = b$, which equals this base value only when
      $\sum_j w_j \mathbb{E}[x_j] = 0$.)
    references:
      - title: Lundberg & Lee (2017), A Unified Approach to Interpreting Model Predictions, arXiv:1705.07874
        url: https://arxiv.org/abs/1705.07874
        locator: Sec. 3, Property 1 (Local accuracy); Sec. 4, Figure 1 (base value E[f(z)]); Sec. 4.2 Model-Specific Approximations, Corollary 1 (Linear SHAP)
    source:
      id: original
      ref: xai-015
    status: reviewed
    reviewed_by: claude
  - id: xai-016
    type: short_answer
    difficulty: medium
    tags:
      - saliency-map
      - gradients
      - code-reading
    question: |
      What does this code print?

      ```python
      import torch
      import torch.nn as nn

      lin = nn.Linear(3, 2, bias=False)
      with torch.no_grad():
          lin.weight.copy_(torch.tensor([[1.0, -2.0, 0.5],
                                         [0.3, 0.7, -1.5]]))
      x = torch.tensor([[5.0, 1.0, 0.2]], requires_grad=True)
      score = lin(x)[0, 1]
      score.backward()
      sal = x.grad.abs()
      print(sal.argmax().item())
      ```
    answer:
      numeric: 2
      tolerance: 0
      hint: an integer index
      model: '`x.grad` is row 1 of the weight matrix, $(0.3, 0.7, -1.5)$; its absolute values $(0.3, 0.7, 1.5)$ peak at index 2'
    explanation: |
      For a linear class score $S_c(x) = w_c^\top x$ the gradient with respect to the input is just
      $w_c$, whatever the input; a vanilla saliency map reads the magnitude of this gradient [^1].
      Here the score of class 1 gives `x.grad` $= (0.3, 0.7, -1.5)$, so the largest magnitude is at
      index 2. The input values do not matter: *input × gradient* would give $(1.5, 0.7, -0.3)$ and
      pick index 0 [^2], and using class 0's row would pick index 1.
    references:
      - title: Simonyan, Vedaldi & Zisserman (2014), Deep Inside Convolutional Networks, arXiv:1312.6034
        url: https://arxiv.org/abs/1312.6034
        locator: Sec. 3 Image-Specific Class Saliency Visualisation, Eqs. (2)–(4)
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Saliency; Input X Gradient
    source:
      id: original
      ref: xai-016
    status: reviewed
    reviewed_by: claude
  - id: xai-017
    type: single
    difficulty: easy
    tags:
      - saliency-map
      - gradients
    question: |
      In the saliency map of Simonyan et al., the class score $S_c$ is differentiated with respect to
      an RGB image. At one pixel the derivatives for the R, G and B channels are $0.12$, $-0.45$ and
      $0.30$. What saliency value does this pixel get?
    options:
      - text: $0.45$
        correct: true
      - text: $0.30$
        why: That is the largest signed derivative; the map uses magnitudes, since a large negative derivative also means high sensitivity [^1].
      - text: $0.29$
        why: That is the mean of the three magnitudes; the method keeps the largest one instead of averaging [^1].
      - text: $0.87$
        why: That sums the magnitudes over the channels; the method takes their maximum [^1].
    explanation: |
      For an RGB image the derivative has three entries per pixel, one per colour channel, and
      Simonyan et al. reduce them to one number by taking the largest magnitude:
      $M_{ij} = \max_k |w_{h(i,j,k)}|$ with $w = \partial S_c / \partial I$ at the image $I_0$ [^1].
      Here $\max(0.12, 0.45, 0.30) = 0.45$; the sign is dropped because a large negative derivative
      also means the score is sensitive to that pixel, following a first-order Taylor expansion of
      $S_c$ around $I_0$ [^1][^2]. Summing (0.87) or averaging (0.29) the magnitudes would be other
      possible choices, but not the one this method makes.
    references:
      - title: Simonyan, Vedaldi & Zisserman (2014), Deep Inside Convolutional Networks, arXiv:1312.6034
        url: https://arxiv.org/abs/1312.6034
        locator: Sec. 3 Image-Specific Class Saliency Visualisation (Eqs. 3–4); Sec. 3.1 Class Saliency Extraction
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Saliency
    source:
      id: original
      ref: xai-017
    status: reviewed
    reviewed_by: claude
  - id: xai-018
    type: single
    difficulty: medium
    tags:
      - integrated-gradients
      - saturation
      - gradients
    question: |
      A one-input network computes $f(x) = 4 - \mathrm{ReLU}(4 - 2x)$, which equals $\min(2x, 4)$.
      For the input $x = 3$ and the baseline $x' = 0$, what attributions do the plain gradient and
      integrated gradients give to $x$?
    options:
      - text: Gradient 0, integrated gradients 4
        correct: true
      - text: Gradient 2, integrated gradients 4
        why: At $x = 3$ the function is flat because $2x > 4$; the slope 2 only holds for $x < 2$ [^1].
      - text: Gradient 0, integrated gradients 0
        why: Integrated gradients accumulates the gradient along the whole path from 0 to 3, where the slope is 2 for the first two thirds [^1].
      - text: Gradient 0, integrated gradients 6
        why: That assumes a slope of 2 along the whole path; the function stops rising at $x = 2$, so the path integral is only $3 \times \frac{2}{3} \times 2 = 4$ [^1].
    explanation: |
      The function saturates for $x \ge 2$, so the gradient at $x = 3$ is 0 although the output rose
      from 0 to 4 — gradients violate the *sensitivity* axiom, as in the paper's example
      $f(x) = 1 - \mathrm{ReLU}(1 - x)$ [^1]. Integrated gradients,
      $(x - x')\int_0^1 f'(x' + \alpha(x - x'))\,d\alpha = 3 \cdot \frac{2}{3} \cdot 2 = 4$, equals
      $f(x) - f(x')$ as *completeness* requires [^1][^2].
    references:
      - title: Sundararajan, Taly & Yan (2017), Axiomatic Attribution for Deep Networks, arXiv:1703.01365
        url: https://arxiv.org/abs/1703.01365
        locator: Sec. 2.1 Axiom Sensitivity(a) ("Gradients violate Sensitivity"); Sec. 3 Our Method (Eq. 1, Completeness)
      - title: Sturmfels, Lundberg & Lee (2020), Visualizing the Impact of Feature Attribution Baselines, Distill
        url: https://distill.pub/2020/attribution-baselines/
        locator: A Better Understanding of Integrated Gradients (saturation)
    source:
      id: original
      ref: xai-018
    status: reviewed
    reviewed_by: claude
  - id: xai-019
    type: short_answer
    difficulty: hard
    tags:
      - integrated-gradients
      - completeness
    question: |
      For the model $F(x_1, x_2) = x_1^2 x_2$, the input $x = (2, 3)$ and the all-zero baseline,
      what is the integrated-gradients attribution of $x_1$?
    answer:
      numeric: 8
      tolerance: 0.001
      hint: a number
      model: 'On the path $\alpha x$: $\partial F / \partial x_1 = 2x_1x_2 = 12\alpha^2$, so $\mathrm{IG}_1 = 2\int_0^1 12\alpha^2\,d\alpha = 8$ (and $\mathrm{IG}_2 = 3\int_0^1 4\alpha^2\,d\alpha = 4$)'
    explanation: |
      Integrated gradients is
      $\mathrm{IG}_i(x) = (x_i - x'_i)\int_0^1 \frac{\partial F(x' + \alpha(x - x'))}{\partial x_i}\,d\alpha$
      [^1]. On the straight path from 0 to $(2, 3)$ the point is $(2\alpha, 3\alpha)$, so
      $\partial F/\partial x_1 = 2 \cdot 2\alpha \cdot 3\alpha = 12\alpha^2$ and
      $\mathrm{IG}_1 = 2 \cdot 4 = 8$; likewise $\mathrm{IG}_2 = 4$. They add up to
      $F(x) - F(x') = 12$ (completeness) [^1]. By contrast, the plain gradient at $x$ is $(12, 4)$
      and gradient × input is $(24, 12)$, which sums to 36 rather than 12 [^2].
    references:
      - title: Sundararajan, Taly & Yan (2017), Axiomatic Attribution for Deep Networks, arXiv:1703.01365
        url: https://arxiv.org/abs/1703.01365
        locator: 'Sec. 3 Our Method: Integrated Gradients (Eq. 1, Axiom Completeness)'
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Integrated Gradients; Saliency; Input X Gradient
    source:
      id: original
      ref: xai-019
    status: reviewed
    reviewed_by: claude
  - id: xai-020
    type: single
    difficulty: medium
    tags:
      - integrated-gradients
      - completeness
      - riemann-sum
    question: |
      You compute integrated gradients with a Riemann sum of $m = 20$ steps. The attributions add up
      to 0.62, but $F(x) - F(x')$ is 0.87. What should you do?
    options:
      - text: Increase $m$ until the sum is close to $F(x) - F(x')$
        correct: true
      - text: Rescale all attributions by the same factor so that they add up to 0.87
        why: Rescaling hides the error of the integral instead of fixing it; each feature's attribution stays wrong [^1].
      - text: Nothing, since integrated gradients need not add up to $F(x) - F(x')$
        why: Completeness is a defining property of integrated gradients; a gap shows that the integral is approximated poorly [^1].
      - text: Switch to the plain gradient at $x$, which needs no integral at all
        why: Plain gradients satisfy neither completeness nor sensitivity, so they would be a worse explanation [^1].
    explanation: |
      Integrated gradients satisfy completeness: the attributions sum to $F(x) - F(x')$ [^1]. In
      practice the path integral is replaced by a sum over $m$ points between the baseline and the
      input; the authors found 20–300 steps usually enough to be within 5%, and recommend checking
      the sum and increasing $m$ when it is off [^1]. Libraries such as Captum offer Riemann or
      Gauss–Legendre rules for this approximation [^2].
    references:
      - title: Sundararajan, Taly & Yan (2017), Axiomatic Attribution for Deep Networks, arXiv:1703.01365
        url: https://arxiv.org/abs/1703.01365
        locator: Sec. 3 (Axiom Completeness); Sec. 5 Applying Integrated Gradients (Computing Integrated Gradients, Eq. 3)
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Integrated Gradients
    source:
      id: original
      ref: xai-020
    status: reviewed
    reviewed_by: claude
  - id: xai-021
    type: single
    difficulty: medium
    tags:
      - integrated-gradients
      - baseline
    question: |
      Integrated gradients with an all-black baseline image (every channel 0) explains a classifier's
      prediction on a photo of a pure-black cat lying on a white sofa. Which pixels are guaranteed to
      get zero attribution?
    options:
      - text: The cat's black pixels, because they equal the baseline
        correct: true
      - text: The white sofa pixels, because they are the farthest from the baseline
        why: A large difference $x_i - x'_i$ allows a large attribution; it does not force zero [^1].
      - text: The pixels whose gradient at the input image is zero
        why: Integrated gradients sums gradients along the whole path, so a zero gradient at the input does not imply zero attribution [^1].
      - text: None, because completeness gives every pixel a nonzero share
        why: Completeness fixes the sum of the attributions, not the value of each pixel [^1].
    explanation: |
      Each attribution has the factor $(x_i - x'_i)$, so a pixel equal to the baseline gets exactly
      zero, whatever the model does [^1]. With a black baseline, integrated gradients is therefore
      blind to black pixels even when they make up the object; this motivates other baselines
      (blurred, uniform, Gaussian noise) or averaging over many baselines [^2].
    references:
      - title: Sundararajan, Taly & Yan (2017), Axiomatic Attribution for Deep Networks, arXiv:1703.01365
        url: https://arxiv.org/abs/1703.01365
        locator: Sec. 3 Our Method (Eq. 1); Sec. 5 Applying Integrated Gradients (Selecting a Benchmark)
      - title: Sturmfels, Lundberg & Lee (2020), Visualizing the Impact of Feature Attribution Baselines, Distill
        url: https://distill.pub/2020/attribution-baselines/
        locator: Game Theory and Missingness; Alternative Baseline Choices; Averaging Over Multiple Baselines
    source:
      id: original
      ref: xai-021
    status: reviewed
    reviewed_by: claude
  - id: xai-022
    type: short_answer
    difficulty: easy
    tags:
      - smoothgrad
    question: |
      SmoothGrad states its noise level as $\sigma / (x_{\max} - x_{\min})$. For images with pixel
      values in $[0, 255]$, which standard deviation $\sigma$ gives a noise level of 15%?
    answer:
      numeric: 38.25
      tolerance: 0.06
      hint: a number
      model: $\sigma = 0.15 \times (255 - 0) = 38.25$
    explanation: |
      SmoothGrad averages the gradient maps of $n$ noisy copies $x + \mathcal{N}(0, \sigma^2)$, and
      reports the noise as a fraction of the input range, $\sigma/(x_{\max} - x_{\min})$ [^1]. The
      authors found 10–20% noise a good balance between a sharp map and keeping the image's
      structure, so $\sigma = 0.15 \times 255 = 38.25$ is a typical choice for 8-bit images (0.15 for
      images scaled to $[0, 1]$) [^1].
    references:
      - title: 'Smilkov et al. (2017), SmoothGrad: removing noise by adding noise, arXiv:1706.03825'
        url: https://arxiv.org/abs/1706.03825
        locator: Sec. 2.2 Smoothing noisy gradients; Sec. 3.2 Effect of noise level and sample size (Fig. 3 caption)
    source:
      id: original
      ref: xai-022
    status: reviewed
    reviewed_by: claude
  - id: xai-023
    type: single
    difficulty: easy
    tags:
      - smoothgrad
      - saliency-map
    question: What does SmoothGrad compute to reduce the visual noise of a gradient saliency map?
    options:
      - text: The average of the gradient maps of many copies of the input with Gaussian noise added
        correct: true
      - text: The gradient map of a model that was retrained with Gaussian noise added to its training images
        why: Training with noise is a separate idea the paper also tries; SmoothGrad itself explains a fixed trained model [^1].
      - text: The integral of the gradients along a straight path from a baseline to the input
        why: That is integrated gradients, which targets saturation rather than noisy maps [^1].
      - text: The gradient map of a Gaussian-blurred version of the input image
        why: SmoothGrad does not blur the image; it averages gradients taken at many noisy points around it [^1].
    explanation: |
      SmoothGrad computes $\hat{M}_c(x) = \frac{1}{n}\sum_{i=1}^{n} M_c(x + \mathcal{N}(0, \sigma^2))$
      [^1]. Raw gradients fluctuate sharply at small scales, so a local average of gradients is more
      meaningful than the gradient at one point; the authors saw little change beyond about
      $n = 50$ samples [^1]. Captum's NoiseTunnel offers the same averaging on top of any attribution
      method [^2].
    references:
      - title: 'Smilkov et al. (2017), SmoothGrad: removing noise by adding noise, arXiv:1706.03825'
        url: https://arxiv.org/abs/1706.03825
        locator: Sec. 2.1 Previous work; Sec. 2.2 Smoothing noisy gradients; Sec. 3.2; Sec. 3.5 Adding noise during training
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Noise Tunnel
    source:
      id: original
      ref: xai-023
    status: reviewed
    reviewed_by: claude
  - id: xai-024
    type: short_answer
    difficulty: medium
    tags:
      - grad-cam
    question: |
      A convolutional layer has two $2 \times 2$ feature maps $A^1, A^2$. The gradients of the class
      score $y^c$ (before the softmax) with respect to them are given next to them:

      $$A^1 = \begin{pmatrix} 1 & 2 \\ 0 & 4 \end{pmatrix}, \quad \frac{\partial y^c}{\partial A^1} = \begin{pmatrix} 0.1 & 0.3 \\ 0.2 & 0.2 \end{pmatrix}, \quad A^2 = \begin{pmatrix} 2 & 0 \\ 1 & 1 \end{pmatrix}, \quad \frac{\partial y^c}{\partial A^2} = \begin{pmatrix} -0.1 & 0.1 \\ -0.2 & -0.2 \end{pmatrix}$$

      What is the Grad-CAM value at the bottom-right position?
    answer:
      numeric: 0.7
      tolerance: 0.001
      hint: a number, 1 decimal
      model: '$\alpha_1 = 0.8/4 = 0.2$, $\alpha_2 = -0.4/4 = -0.1$; bottom-right: $\mathrm{ReLU}(0.2 \cdot 4 - 0.1 \cdot 1) = 0.7$'
    explanation: |
      Grad-CAM weights each channel by its global-average-pooled gradient,
      $\alpha_k^c = \frac{1}{Z}\sum_{i,j} \partial y^c / \partial A^k_{ij}$, and outputs
      $L^c = \mathrm{ReLU}(\sum_k \alpha_k^c A^k)$ [^1]. Here $\alpha_1 = 0.2$ and $\alpha_2 = -0.1$,
      so the map is $\begin{pmatrix} 0 & 0.4 \\ 0 & 0.7 \end{pmatrix}$ (the bottom-left value $-0.1$
      is cut by the ReLU). Summing instead of averaging the gradients would give 2.8 here; the average
      over positions is what Captum's implementation uses too [^2].
    references:
      - title: 'Selvaraju et al. (2017), Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization, arXiv:1610.02391'
        url: https://arxiv.org/abs/1610.02391
        locator: Sec. 3 Grad-CAM, Eqs. (1)–(2)
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Layer Attribution – GradCAM
    source:
      id: original
      ref: xai-024
    status: reviewed
    reviewed_by: claude
  - id: xai-025
    type: single
    difficulty: easy
    tags:
      - grad-cam
    question: Why is Grad-CAM usually computed at the last convolutional layer of a CNN?
    options:
      - text: It still keeps spatial layout but already encodes high-level concepts
        correct: true
      - text: It has the most channels, so the resulting heatmap has the highest resolution
        why: Resolution is the spatial size of the maps, which is small there (e.g. 14 × 14 for VGG), so the heatmap is coarse and must be upsampled [^1].
      - text: It is the only layer whose gradients survive the ReLU activations
        why: Back-propagation gives gradients for every layer; nothing restricts them to the last convolutional one.
      - text: Its activations are already class probabilities, so no gradients are needed
        why: Convolutional activations are features, not probabilities, and Grad-CAM explicitly uses gradients of the class score [^1].
    explanation: |
      Two things are wanted at once: features that mean something at the level of objects, which
      emerge in the deeper layers, and a spatial grid, which is lost once the fully connected layers
      flatten the maps. The last convolutional layer is where both are still available, so
      Grad-CAM takes its gradients and activations there [^1]. The price is resolution: the map is as
      small as that layer's feature maps (14 × 14 for VGG-16) and has to be upsampled to the image
      size before it is laid over the image [^1][^2].
    references:
      - title: 'Selvaraju et al. (2017), Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization, arXiv:1610.02391'
        url: https://arxiv.org/abs/1610.02391
        locator: Sec. 3 Grad-CAM; Sec. 3.2 Guided Grad-CAM (bilinear upsampling)
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Layer Attribution – GradCAM
    source:
      id: original
      ref: xai-025
    status: reviewed
    reviewed_by: claude
  - id: xai-026
    type: single
    difficulty: medium
    tags:
      - grad-cam
    question: |
      Grad-CAM applies a ReLU to the weighted sum of feature maps,
      $L^c = \mathrm{ReLU}\left(\sum_k \alpha_k^c A^k\right)$. What is the purpose of this ReLU?
    options:
      - text: To keep only the regions whose evidence raises the score of class $c$
        correct: true
      - text: To make the heatmap differentiable so that it can be back-propagated through
        why: The heatmap is an output for people to look at; nothing is back-propagated through it, and a ReLU adds no differentiability.
      - text: To rescale the heatmap into the range $[0, 1]$ before it is overlaid on the image
        why: A ReLU only sets negative values to zero; scaling to $[0, 1]$ is a separate display step.
      - text: To undo the global average pooling that was applied to the gradients
        why: Pooling the gradients produces the channel weights $\alpha_k^c$; the ReLU does not invert it [^1].
    explanation: |
      A positive value of $\sum_k \alpha_k^c A^k$ marks a location that pushes the score $y^c$ up; a
      negative value marks evidence against $c$, which usually comes from other objects in the
      image. Setting the negative part to zero keeps the map about class $c$ alone; the authors
      report that without it the maps spill over onto other classes and localise the object less
      well [^1]. Flipping the sign of the gradients instead gives Grad-CAM's "counterfactual" maps,
      which show the regions whose removal would make the model more sure of its prediction [^1].
    references:
      - title: 'Selvaraju et al. (2017), Grad-CAM: Visual Explanations from Deep Networks via Gradient-based Localization, arXiv:1610.02391'
        url: https://arxiv.org/abs/1610.02391
        locator: Sec. 3 Grad-CAM (Eq. 2 and the paragraph after it); Sec. 3.3 Counterfactual Explanations
    source:
      id: original
      ref: xai-026
    status: reviewed
    reviewed_by: claude
  - id: xai-027
    type: short_answer
    difficulty: medium
    tags:
      - occlusion
      - perturbation
    question: |
      To build an occlusion map for a $32 \times 32$ image, you slide an $8 \times 8$ grey patch over
      it with a stride of 4 pixels in both directions, keeping the patch inside the image, and run the
      classifier once per patch position. How many occluded images are evaluated?
    answer:
      numeric: 49
      tolerance: 0
      hint: a whole number
      model: $(32 - 8)/4 + 1 = 7$ positions per direction, $7 \times 7 = 49$
    explanation: |
      Occlusion sensitivity hides one part of the image at a time behind a grey square and watches
      the classifier's output: the correct class loses probability when the object itself is hidden
      [^1]. The window fits $(32 - 8)/4 + 1 = 7$ times along each axis, and each position needs its
      own forward pass, so $7 \times 7 = 49$ occluded images (plus one pass for the original image).
      Where windows overlap, a pixel's attribution averages the output differences of the windows
      covering it [^2]. Using only forward passes makes occlusion model-agnostic, but it is far more
      expensive than a gradient map, which needs a single backward pass.
    references:
      - title: Zeiler & Fergus (2014), Visualizing and Understanding Convolutional Networks, arXiv:1311.2901
        url: https://arxiv.org/abs/1311.2901
        locator: Sec. 4.2 Occlusion Sensitivity
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Occlusion; Feature Ablation
    source:
      id: original
