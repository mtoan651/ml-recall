schema_version: 1
domain: dl
topic: xai
title: Explainable AI
questions:
  - id: xai-001
    type: single
    difficulty: medium
    tags:
      - why-explain
      - incompleteness
    question: |
      Doshi-Velez and Kim argue that not every machine learning system needs to explain itself. In
      which situation is an explanation most clearly needed?
    options:
      - text: When goals like fairness or safety cannot be fully put into the loss
        correct: true
      - text: When wrong outputs have no significant consequences, as for an ad server
        why: Their ad-server example needs no explanation precisely because a bad output there costs little [^1].
      - text: When the uncertainty of each prediction can be quantified precisely
        why: They separate quantified uncertainty, which can be reasoned about formally, from incompleteness of the problem statement; only the latter calls for explanations [^1].
      - text: When the system has been validated extensively in real use for years
        why: A well-studied and validated system is trusted even without explanations, which is their second example of a system that does not need them [^1].
    explanation: |
      Doshi-Velez and Kim argue that explanations are needed when the problem statement is
      *incomplete*: some goals (scientific understanding, safety, ethics such as non-discrimination)
      cannot be written fully into the objective, so humans must check them by looking at how the
      model decides [^1]. Uncertainty that can be quantified, low-stakes outputs and thoroughly
      validated systems do not create this need [^1]. The same gap is why explanations are used to
      build trust, catch models that learned unintended rules, and meet regulation such as the
      GDPR [^2].
    references:
      - title: Doshi-Velez & Kim (2017), Towards A Rigorous Science of Interpretable Machine Learning, arXiv:1702.08608
        url: https://arxiv.org/abs/1702.08608
        locator: Sec. 2 Why interpretability? Incompleteness
      - title: 'Wikipedia: Explainable artificial intelligence'
        url: https://en.wikipedia.org/wiki/Explainable_artificial_intelligence
        locator: Goals; Regulation
    source:
      id: original
      ref: xai-001
    status: reviewed
    reviewed_by: claude
  - id: xai-002
    type: single
    difficulty: easy
    tags:
      - local-explanation
      - global-explanation
      - regulation
    question: |
      A bank uses a neural network to decide on loans and must tell each rejected applicant why
      their own application was refused. What kind of explanation does this call for?
    options:
      - text: A local explanation of that applicant's individual prediction
        correct: true
      - text: A global explanation of how the model behaves on average over all applicants
        why: Global methods such as permutation importance or partial dependence summarise the model over a whole dataset; they do not say why this applicant was refused [^1].
      - text: A higher test accuracy reported on a held-out set of past applicants
        why: Accuracy says how often the model is right, not why it made a particular decision.
      - text: A sanity check showing that the network's saliency maps depend on its weights
        why: A sanity check tests whether an explanation method can be trusted; it does not itself explain any decision.
    explanation: |
      A local method accounts for a single prediction, whereas a global method summarises the
      model's behaviour over a whole dataset, e.g. the average effect of each feature [^1]. The
      applicant needs the former: the GDPR's right to explanation likewise covers only this local
      aspect of an automated decision about one person [^2]. A typical local answer is a
      counterfactual, e.g. "with a higher income the loan would have been approved" [^3].
    references:
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/overview.html
        locator: Ch. 4 Methods Overview (local vs global model-agnostic post-hoc methods)
      - title: 'Wikipedia: Explainable artificial intelligence'
        url: https://en.wikipedia.org/wiki/Explainable_artificial_intelligence
        locator: Regulation
      - title: Wachter, Mittelstadt & Russell (2017), Counterfactual Explanations without Opening the Black Box, arXiv:1711.00399
        url: https://arxiv.org/abs/1711.00399
        locator: Sec. II Counterfactuals
    source:
      id: original
      ref: xai-002
    status: reviewed
    reviewed_by: claude
  - id: xai-003
    type: single
    difficulty: easy
    tags:
      - intrinsic-interpretability
      - post-hoc
    question: |
      A hospital replaces a deep network, which it explained with saliency maps, by a sparse logistic
      regression whose few coefficients doctors can read directly. How is this change best described?
    options:
      - text: From post-hoc explanation to an interpretable-by-design model
        correct: true
      - text: From a local post-hoc method to a global post-hoc method
        why: After the switch no separate method explains the model afterwards; the readable coefficients of the model itself are the explanation [^1].
      - text: From a model-agnostic to a model-specific explanation method
        why: Saliency maps are already model-specific, since they need the network's gradients; the change concerns the model, not the explainer [^1].
      - text: From a faithful explanation to a merely plausible explanation
        why: The opposite holds — an interpretable model's own parameters describe exactly how it computes, so its explanation is faithful by construction [^2].
    explanation: |
      Interpretability by design (intrinsic interpretability) restricts learning to models whose
      structure people can read, such as sparse linear models or short trees; post-hoc methods are
      applied to a model after it has been trained [^1]. Rudin argues that for high-stakes decisions
      such inherently interpretable models should be preferred, because a post-hoc explanation of a
      black box can never be perfectly faithful to what the black box computes [^2].
    references:
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/overview.html
        locator: Ch. 4 Methods Overview (Interpretable models by design; Post-hoc interpretability)
      - title: Rudin (2019), Stop Explaining Black Box Machine Learning Models for High Stakes Decisions and Use Interpretable Models Instead, arXiv:1811.10154
        url: https://arxiv.org/abs/1811.10154
        locator: Sec. 2 Key Issues with Explainable ML
    source:
      id: original
      ref: xai-003
    status: reviewed
    reviewed_by: claude
  - id: xai-004
    type: multiple
    difficulty: medium
    tags:
      - model-agnostic
      - model-specific
      - post-hoc
    question: |
      Which of these explanation methods are both post-hoc and model-agnostic, i.e. they only need to
      query a trained model's outputs? Select all that apply.
    options:
      - text: LIME
        correct: true
      - text: Permutation feature importance
        correct: true
      - text: Grad-CAM
        why: Grad-CAM is post-hoc but model-specific; it needs the activations and gradients of a convolutional layer [^2].
      - text: A vanilla gradient saliency map
        why: It needs the gradient of the class score with respect to the input, so it only works for differentiable models such as neural networks [^2].
    explanation: |
      Model-agnostic methods treat the trained model as a black box: they change the inputs and
      watch how the outputs change [^1]. LIME fits a local surrogate to the model's outputs on
      perturbed samples, and permutation importance compares the model's score before and after a
      feature is shuffled; neither looks inside the model [^1][^3]. Gradient saliency maps and
      Grad-CAM read gradients and layer activations, so they are specific to neural networks [^2].
    references:
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/overview.html
        locator: Ch. 4 Methods Overview (Post-hoc interpretability; Model-agnostic post-hoc methods)
      - title: 'Captum docs: Algorithm Descriptions'
        url: https://github.com/meta-pytorch/captum/blob/7aefa21cf9c3f1fb8bae757fd4f3a5fdc3c400a6/docs/attribution_algorithms.md
        locator: Primary Attribution (Saliency, Lime); Layer Attribution (GradCAM)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/permutation_importance.html
        locator: Sec. 5.2 Permutation feature importance
    source:
      id: original
      ref: xai-004
    status: reviewed
    reviewed_by: claude
  - id: xai-005
    type: short_answer
    difficulty: easy
    tags:
      - permutation-importance
    question: |
      A classifier has validation accuracy 0.92. You shuffle the column `age` three times, each time
      re-scoring the model on the shuffled validation set, and get accuracies 0.81, 0.84 and 0.78.
      What is the permutation importance of `age`?
    answer:
      numeric: 0.11
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $0.92 - \frac{0.81 + 0.84 + 0.78}{3} = 0.92 - 0.81 = 0.11$
    explanation: |
      Permutation importance is the reference score minus the mean score over the $K$ shuffles,
      $i_j = s - \frac{1}{K}\sum_k s_{k,j}$ [^1], here $0.92 - 0.81 = 0.11$ (not the largest single
      drop, 0.14). Shuffling breaks the link between the feature and the target, so the drop measures
      how much *this model* relies on the feature; computed on held-out data it shows which features
      matter for generalisation [^1].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/permutation_importance.html
        locator: Sec. 5.2 Permutation feature importance; Sec. 5.2.1 Outline of the permutation importance algorithm
    source:
      id: original
      ref: xai-005
    status: reviewed
    reviewed_by: claude
  - id: xai-006
    type: short_answer
    difficulty: medium
    tags:
      - partial-dependence
      - ice
    question: |
      A fitted regression model computes $f(x_1, x_2) = 3x_1 - x_1 x_2 + x_2^2$. The data used for
      the plot has three rows, with $x_2 = 0$, $x_2 = 1$ and $x_2 = 2$ (their $x_1$ values do not
      matter here). What is the partial dependence of the prediction on $x_1$ at $x_1 = 2$? Round to
      2 decimals.
    answer:
      numeric: 5.67
      tolerance: 0.01
      hint: a number, 2 decimals
      model: $\frac{f(2,0) + f(2,1) + f(2,2)}{3} = \frac{6 + 5 + 6}{3} \approx 5.67$
    explanation: |
      The partial dependence at $x_S$ is estimated by fixing the feature of interest and averaging
      the predictions over the observed values of the other features,
      $\frac{1}{n}\sum_i f(x_S, x_C^{(i)})$ [^1]. Each term $f(2, x_2^{(i)})$ is one ICE curve
      evaluated at $x_1 = 2$ (6, 5 and 6), and the PDP is the average of the ICE curves [^1][^2].
      It is not $f(2, \bar{x}_2) = f(2, 1) = 5$: because $f$ is nonlinear in $x_2$, averaging the
      predictions differs from predicting at the average.
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/partial_dependence.html
        locator: Sec. 5.1.3 Mathematical Definition; Sec. 5.1.4 Computation methods
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/pdp.html
        locator: Ch. 19 Partial Dependence Plot, Definition and estimation
    source:
      id: original
      ref: xai-006
    status: reviewed
    reviewed_by: claude
  - id: xai-007
    type: single
    difficulty: medium
    tags:
      - ice
      - partial-dependence
      - interactions
    question: |
      The partial dependence plot of a feature $x_j$ is almost flat, but you suspect that $x_j$
      raises the prediction for some rows and lowers it for others. Which plot shows this directly?
    options:
      - text: An ICE plot, with one curve per row as $x_j$ is varied
        correct: true
      - text: The same PDP recomputed on a much finer grid of $x_j$ values
        why: A finer grid still plots the average over rows, so opposite effects keep cancelling out [^1].
      - text: A bar chart of permutation importances of all features
        why: It gives one number per feature; it can show that $x_j$ matters, but not in which direction for which rows [^2].
      - text: A histogram of the observed values of $x_j$
        why: A histogram describes the data, not how the model's prediction responds to $x_j$.
    explanation: |
      An individual conditional expectation (ICE) plot draws one line per sample,
      $f(x_j, x_C^{(i)})$ as $x_j$ varies, and the PDP is the average of these lines [^1]. When
      interactions make the effect differ between rows, the average can hide them (here it is
      nearly flat), while the ICE lines show the heterogeneous, even opposite, effects [^1].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/partial_dependence.html
        locator: Sec. 5.1.2 Individual conditional expectation (ICE) plot; Sec. 5.1.4 Computation methods
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/permutation_importance.html
        locator: Sec. 5.2 Permutation feature importance
    source:
      id: original
      ref: xai-007
    status: reviewed
    reviewed_by: claude
  - id: xai-008
    type: true_false
    difficulty: medium
    tags:
      - partial-dependence
      - correlated-features
    question: |
      True or false: a partial dependence plot stays trustworthy when the feature of interest is
      strongly correlated with the other features, because the other features are averaged over
      their observed values.
    options:
      - text: 'True'
        why: Averaging over the observed values of the other features pairs them with values of the feature of interest that never occur together, so the plot is built on unrealistic inputs [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      PDPs (and ICE plots) assume that the features of interest are independent of the others [^1].
      With correlated features, setting $x_S$ to a grid value while keeping each row's other features
      creates combinations that never occur (e.g. a one-room flat with 300 m² of floor space when
      rooms and area are correlated), and the model's predictions on those points can distort the
      curve [^1][^2].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/partial_dependence.html
        locator: Sec. 5.1 Partial Dependence and Individual Conditional Expectation plots (introduction)
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/pdp.html
        locator: Ch. 19 Partial Dependence Plot, Limitations
    source:
      id: original
      ref: xai-008
    status: reviewed
    reviewed_by: claude
  - id: xai-009
    type: single
    difficulty: easy
    tags:
      - lime
      - local-surrogate
    question: How does LIME explain the prediction of a black-box classifier for one input $x$?
    options:
      - text: It fits a proximity-weighted simple model to the outputs on perturbed copies of $x$
        correct: true
      - text: It back-propagates the class score and uses the input gradient at $x$ as the explanation
        why: That is a gradient saliency map; LIME never needs gradients, it only queries the model [^1].
      - text: It averages each feature's marginal contribution over all possible orderings of the features
        why: That is the definition of the Shapley value, which SHAP estimates [^2].
      - text: It trains one global decision tree that imitates the black box on the whole training set
        why: That is a global surrogate; LIME is local, weighting samples by their closeness to $x$ [^1].
    explanation: |
      LIME (Local Interpretable Model-agnostic Explanations) samples perturbed instances around $x$,
      gets the black box's predictions for them, weights them by a proximity kernel $\pi_x$, and fits
      an interpretable model, usually a sparse linear model, that is faithful in that neighbourhood:
      $\xi(x) = \operatorname*{arg\,min}_{g} L(f, g, \pi_x) + \Omega(g)$ [^1]. Because it only
      queries the model, it works with any classifier [^1].
    references:
      - title: 'Ribeiro, Singh & Guestrin (2016), "Why Should I Trust You?": Explaining the Predictions of Any Classifier, arXiv:1602.04938'
        url: https://arxiv.org/abs/1602.04938
        locator: Sec. 3.2 Fidelity-Interpretability Trade-off; Sec. 3.3 Sampling for Local Exploration
      - title: Lundberg & Lee (2017), A Unified Approach to Interpreting Model Predictions, arXiv:1705.07874
        url: https://arxiv.org/abs/1705.07874
        locator: Sec. 4, Figure 1 caption (SHAP values average over all feature orderings)
    source:
      id: original
      ref: xai-009
    status: reviewed
    reviewed_by: claude
  - id: xai-010
    type: single
    difficulty: hard
    tags:
      - lime
      - kernel-width
      - local-fidelity
    question: |
      LIME weights each perturbed sample $z$ by $\pi_x(z) = \exp(-D(x, z)^2 / \sigma^2)$ before
      fitting its linear surrogate. What is the main risk of choosing a very large kernel width
      $\sigma$?
    options:
      - text: Distant samples count almost fully, so the fit can miss or flip the local effect
        correct: true
      - text: All samples get weights close to zero, so the surrogate has almost no data left to fit
        why: Large $\sigma$ pushes the weights towards 1, not 0; it is a very small width that makes distant samples negligible [^1].
      - text: The surrogate becomes a nonlinear model, which makes the explanation harder to read
        why: The surrogate family (e.g. sparse linear models) is chosen separately; the kernel width only changes the sample weights [^1].
      - text: The black-box model has to be retrained on the newly weighted perturbed samples
        why: LIME never retrains the black box; it only queries it for predictions on the samples [^1].
    explanation: |
      The kernel $\pi_x$ defines what "local" means in LIME's loss $L(f, g, \pi_x)$ [^1]. With a very
      wide kernel, distant samples weigh almost as much as nearby ones, so the linear surrogate tracks
      the model's global trend rather than its behaviour around $x$; Molnar shows that changing the
      width can turn an explanation around, and calls the choice of neighbourhood LIME's biggest
      problem for tabular data [^2]. For example, $f(x) = 0.5x + \sin 3x$ has local slope
      $0.5 + 3\cos 3 \approx -2.5$ at $x = 1$; with perturbations spread widely around $x$, a
      surrogate fitted with a narrow kernel ($\sigma = 0.1$) finds a slope of about $-2.4$, but one
      fitted with a very wide kernel finds the global trend $+0.5$.
    references:
      - title: 'Ribeiro, Singh & Guestrin (2016), "Why Should I Trust You?": Explaining the Predictions of Any Classifier, arXiv:1602.04938'
        url: https://arxiv.org/abs/1602.04938
        locator: Sec. 3.2 Fidelity-Interpretability Trade-off; Sec. 3.4 Sparse Linear Explanations
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/lime.html
        locator: Ch. 14 LIME, LIME for tabular data (kernel width, Figure 14.2); Limitations
    source:
      id: original
      ref: xai-010
    status: reviewed
    reviewed_by: claude
  - id: xai-011
    type: single
    difficulty: medium
    tags:
      - lime
      - superpixels
      - images
    question: |
      When LIME explains a prediction of an image classifier, what are the input features of its
      interpretable surrogate model?
    options:
      - text: Whether each super-pixel is kept or greyed out (1 or 0)
        correct: true
      - text: The raw RGB colour values of every pixel in the image
        why: LIME switches to an interpretable representation; per-pixel colour values are far too many to read and are what the classifier uses, not the explanation [^1].
      - text: The activations of the network's last convolutional layer
        why: Reading internal activations is what model-specific methods such as Grad-CAM do; LIME only queries the classifier [^2].
      - text: The gradients of the class score with respect to each pixel
        why: LIME computes no gradients; it learns its weights from the model's outputs on perturbed images [^1].
    explanation: |
      LIME separates the model's features from an interpretable representation
      $x' \in \{0, 1\}^{d'}$. For images it is a binary vector saying, for each super-pixel (a
      connected region of similar-coloured pixels), whether it is kept [^1]. Perturbed samples grey
      out random subsets of super-pixels, the classifier scores them, and the weights of a sparse
      linear model on these indicators show which super-pixels support the class [^1][^2].
    references:
      - title: 'Ribeiro, Singh & Guestrin (2016), "Why Should I Trust You?": Explaining the Predictions of Any Classifier, arXiv:1602.04938'
        url: https://arxiv.org/abs/1602.04938
        locator: Sec. 3.1 Interpretable Data Representations; Sec. 3.4 Sparse Linear Explanations
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/lime.html
        locator: Ch. 14 LIME, LIME for image data
    source:
      id: original
      ref: xai-011
    status: reviewed
    reviewed_by: claude
  - id: xai-012
    type: single
    difficulty: easy
    tags:
      - lime
      - shortcut-learning
      - clever-hans
      - debugging
    question: |
      A classifier separates photos of huskies from photos of wolves with high accuracy, but LIME
      explanations of its "wolf" predictions mostly highlight the snowy background instead of the
      animal. What is the most likely cause?
    options:
      - text: Training photos of wolves showed snow, so snow became a shortcut
        correct: true
      - text: LIME cannot handle images, so its highlights carry no information
        why: LIME explains images through super-pixels; in its original paper it exposed exactly this kind of flaw [^1].
      - text: The model is underfitting and would focus on the animal after more epochs
        why: Accuracy is already high on photos with the same bias; the problem is which cue the model uses, and more training on those photos does not remove it [^2].
      - text: The explanation is unfaithful, because the model really looks at the animal
        why: In Ribeiro et al.'s experiment the classifier did predict "wolf" whenever there was snow, so the highlight was faithful to it [^1].
    explanation: |
      Ribeiro et al. deliberately trained a classifier on hand-picked photos in which every wolf
      stood in snow and no husky did; it then called any snowy picture "wolf", and LIME's
      explanations made this visible to users [^1]. Such a shortcut is a decision rule that works on
      data with the same bias but fails under other conditions, e.g. a wolf on grass [^2]; spotting
      it is a typical debugging use of explanations.
    references:
      - title: 'Ribeiro, Singh & Guestrin (2016), "Why Should I Trust You?": Explaining the Predictions of Any Classifier, arXiv:1602.04938'
        url: https://arxiv.org/abs/1602.04938
        locator: Sec. 6.4 Do explanations lead to insights?
      - title: Geirhos et al. (2020), Shortcut Learning in Deep Neural Networks, arXiv:2004.07780
        url: https://arxiv.org/abs/2004.07780
        locator: Abstract (definition of shortcuts)
    source:
      id: original
      ref: xai-012
    status: reviewed
    reviewed_by: claude
  - id: xai-013
    type: short_answer
    difficulty: medium
    tags:
      - shapley-values
      - shap
    question: |
      A model computes $f(x_1, x_2) = 3x_1 + 2x_1 x_2$. You explain the input $x = (2, 1)$ with exact
      Shapley values; a feature outside a coalition is set to the baseline value 0. What is the
      Shapley value $\phi_1$ of feature 1?
    answer:
      numeric: 8
      tolerance: 0
      hint: a whole number
      model: $v(\emptyset) = 0$, $v(\{1\}) = 6$, $v(\{2\}) = 0$, $v(\{1,2\}) = 10$; $\phi_1 = \frac{1}{2}[(6 - 0) + (10 - 0)] = 8$ and $\phi_2 = 2$
    explanation: |
      A Shapley value averages a feature's marginal contribution over all coalitions $S$ of the other
      features, with weights $\frac{|S|!(M - |S| - 1)!}{M!}$ [^1][^2]; with two features that is
      $\frac{1}{2}$ for $S = \emptyset$ and $\frac{1}{2}$ for $S = \{2\}$. Feature 1 adds 6 alone and
      10 when feature 2 is present, so $\phi_1 = 8$; the interaction term $2x_1x_2 = 4$ is split
      equally between the two features. The values add up to $f(x) - f(\text{baseline}) = 10$
      (efficiency / local accuracy) [^1][^2].
    references:
      - title: Lundberg & Lee (2017), A Unified Approach to Interpreting Model Predictions, arXiv:1705.07874
        url: https://arxiv.org/abs/1705.07874
        locator: Sec. 2.4 Classic Shapley Value Estimation, Eq. (4); Sec. 3, Property 1 (Local accuracy)
      - title: 'Wikipedia: Shapley value'
        url: https://en.wikipedia.org/wiki/Shapley_value
        locator: Definition; Properties – Efficiency
    source:
      id: original
      ref: xai-013
    status: reviewed
    reviewed_by: claude
  - id: xai-014
    type: short_answer
    difficulty: hard
    tags:
      - shapley-values
      - shap
    question: |
      A model computes $f(x_1, x_2, x_3) = \max(x_1, x_2) + x_1 x_3$. You explain the input
      $x = (3, 2, 1)$ with exact Shapley values; features outside a coalition are set to the baseline
      value 0. What is $\phi_1$?
    answer:
      numeric: 3.5
      tolerance: 0.001
      hint: a number, 1 decimal
      model: $\phi_1 = \frac{1}{3}(3 - 0) + \frac{1}{6}(3 - 2) + \frac{1}{6}(6 - 0) + \frac{1}{3}(6 - 2) = 3.5$ (and $\phi_2 = 1$, $\phi_3 = 1.5$)
    explanation: |
      With $M = 3$ features the weights $\frac{|S|!(M-|S|-1)!}{M!}$ are $\frac{1}{3}$ for
      $S = \emptyset$, $\frac{1}{6}$ for each one-feature coalition and $\frac{1}{3}$ for
      $S = \{2, 3\}$ [^1][^2]. The coalition values are $v(\{1\}) = 3$, $v(\{2\}) = 2$,
      $v(\{3\}) = 0$, $v(\{1,2\}) = 3$, $v(\{1,3\}) = 6$, $v(\{2,3\}) = 2$ and $v(\{1,2,3\}) = 6$.
      Feature 1 adds 3, 1, 6 and 4 to these coalitions, giving $\phi_1 = 3.5$. Feature 2 only helps
      when feature 1 is absent ($\phi_2 = 1$), and $\phi_3 = 1.5$; the three sum to
      $f(x) - f(0) = 6$, as efficiency requires [^2].
    references:
      - title: Lundberg & Lee (2017), A Unified Approach to Interpreting Model Predictions, arXiv:1705.07874
        url: https://arxiv.org/abs/1705.07874
        locator: Sec. 2.4 Classic Shapley Value Estimation, Eq. (4); Sec. 3, Theorem 1
