  - id: xai-028
    type: single
    difficulty: medium
    tags:
      - attention
      - faithfulness
    question: |
      Jain and Wallace tested whether the attention weights of recurrent (BiLSTM) text classifiers
      explain their predictions. What did they find?
    options:
      - text: Permuted or adversarial attention weights often left the prediction almost unchanged
        correct: true
      - text: Attention weights agreed closely with gradient-based and leave-one-out importance scores
        why: They found these correlations to be weak and inconsistent for recurrent encoders [^1].
      - text: Removing the attention layer always destroyed accuracy, which proves attention is the explanation
        why: They did not test this, and a layer that helps accuracy need not explain which inputs drove a prediction [^1].
      - text: Attention became a reliable explanation once its weights were normalised by a softmax
        why: Attention weights are already softmax-normalised distributions over the inputs; this is exactly what they examined [^1].
    explanation: |
      Jain and Wallace measured how attention correlates with gradient and leave-one-out importance
      (weakly) and built counterfactual attention: randomly permuted weights and adversarial
      distributions far from the original that keep the prediction within a small $\epsilon$ [^1].
      Such distributions were easy to find, so an attention heatmap is not a unique, faithful account
      of the prediction [^1]. Faithfulness means accurately reflecting the model's true reasoning [^2].
    references:
      - title: Jain & Wallace (2019), Attention is not Explanation, arXiv:1902.10186
        url: https://arxiv.org/abs/1902.10186
        locator: Sec. 1 Introduction (summary of findings); Sec. 4.1 Correlation Between Attention and Feature Importance Measures; Sec. 4.2 Counterfactual Attention Weights
      - title: 'Jacovi & Goldberg (2020), Towards Faithfully Interpretable NLP Systems: How should we define and evaluate faithfulness?, arXiv:2004.03685'
        url: https://arxiv.org/abs/2004.03685
        locator: Sec. 2 Faithfulness vs. Plausibility
    source:
      id: original
      ref: xai-028
    status: reviewed
    reviewed_by: claude
  - id: xai-029
    type: single
    difficulty: medium
    tags:
      - sanity-checks
      - saliency-map
    question: |
      A saliency method produces almost the same maps for a trained CNN and for the same architecture
      with randomly re-initialised weights. What does this sanity check tell you?
    options:
      - text: The method ignores what the model learned, so it is useless for debugging
        correct: true
      - text: The model is robust, because its explanations survive changes to its weights
        why: The test is about the explanation method; a random network has learned nothing, yet the maps did not change [^1].
      - text: The method is faithful, since stable explanations are a sign of reliability
        why: Staying the same when the model is destroyed is insensitivity to the model, the opposite of faithfulness [^1].
      - text: The randomly initialised network must already compute the same features
        why: Random weights encode nothing from the data; similar maps show that the method mostly reflects the input, much like an edge detector [^1].
    explanation: |
      In the model parameter randomization test, maps from the trained model are compared with maps
      from a randomly initialised copy; if they are similar, the method does not depend on the learned
      parameters and is useless for model debugging [^1]. Adebayo et al. found that gradients and
      Grad-CAM pass, while Guided Backprop and Guided Grad-CAM are largely invariant to the higher
      layers' weights and resemble edge detectors, so visual appeal alone is a poor guide [^1].
    references:
      - title: Adebayo et al. (2018), Sanity Checks for Saliency Maps, arXiv:1810.03292
        url: https://arxiv.org/abs/1810.03292
        locator: Sec. 1 Introduction (contributions, Fig. 1); Sec. 3 Model Parameter Randomization Test
    source:
      id: original
      ref: xai-029
    status: reviewed
    reviewed_by: claude
  - id: xai-030
    type: true_false
    difficulty: medium
    tags:
      - sanity-checks
      - data-randomization
    question: |
      True or false: in the data randomization test, a network is trained on the same images with
      randomly permuted labels; an explanation method passes if its maps for this network differ
      clearly from those of the network trained on the true labels.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: If the maps stayed the same after the labels were scrambled, the method could not be explaining anything about the link between images and labels [^1].
    explanation: |
      Permuting the labels destroys the relationship between inputs and labels; the network can only
      memorise them [^1]. An explanation method that depends on what the model learned from that
      relationship should therefore produce clearly different maps; one that does not change cannot
      explain the input–label mechanism [^1]. Gradients and SmoothGrad changed substantially, while
      Guided Backprop still highlighted plausible-looking parts of the digits [^1].
    references:
      - title: Adebayo et al. (2018), Sanity Checks for Saliency Maps, arXiv:1810.03292
        url: https://arxiv.org/abs/1810.03292
        locator: Sec. 1 Introduction; Sec. 4 Data Randomization Test
    source:
      id: original
      ref: xai-030
    status: reviewed
    reviewed_by: claude
  - id: xai-031
    type: short_answer
    difficulty: easy
    tags:
      - counterfactual-explanations
    question: |
      A loan model approves an application when
      $0.05 \cdot \text{income} + 0.8 \cdot \text{years employed} - 4 \ge 0$, with income in thousands.
      An applicant with income 50 and 1 year of employment is rejected. Keeping years employed fixed,
      what is the smallest income (in thousands) that would get the loan approved?
    answer:
      numeric: 64
      tolerance: 0.01
      hint: a number (in thousands)
      model: $0.05 \cdot I + 0.8 \cdot 1 - 4 \ge 0 \iff I \ge 64$
    explanation: |
      The current score is $2.5 + 0.8 - 4 = -0.7$, so income must add $0.7$ more, i.e. rise by
      $0.7 / 0.05 = 14$ thousand to 64. Such a statement — "had your income been 64 instead of 50,
      the loan would have been approved" — is a counterfactual explanation: the smallest change that
      produces the desired outcome, the "closest possible world" [^1]. It can be found by querying
      the model's outputs alone (any optimiser works; gradients are optional), so it explains a
      decision without opening the black box [^1][^2].
    references:
      - title: Wachter, Mittelstadt & Russell (2017), Counterfactual Explanations without Opening the Black Box, arXiv:1711.00399
        url: https://arxiv.org/abs/1711.00399
        locator: Sec. II Counterfactuals; Sec. III Generating Counterfactuals
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/counterfactual.html
        locator: Ch. 15 Counterfactual Explanations (introduction; Method by Wachter et al.)
    source:
      id: original
      ref: xai-031
    status: reviewed
    reviewed_by: claude
  - id: xai-032
    type: single
    difficulty: medium
    tags:
      - counterfactual-explanations
      - mad
    question: |
      Wachter et al. search for a counterfactual $x'$ close to the input $x$, measuring closeness by
      an L1 distance in which each feature's change is divided by that feature's median absolute
      deviation (MAD). What reasons do the authors give for this choice?
    options:
      - text: L1 favours changing few features; MAD puts features on comparable scales
        correct: true
      - text: The L1 norm is differentiable everywhere, which makes the search easier than with L2
        why: The L1 norm is not differentiable at zero; it is chosen for the sparse solutions it induces [^1].
      - text: Dividing by the MAD forces the counterfactual to stay inside the training data
        why: The MAD only rescales the distance; making sure that $x'$ is a valid data point is a separate challenge the authors discuss [^1].
      - text: MAD weighting makes features with a large spread expensive to change
        why: Dividing by a large MAD makes changes in volatile features *cheap*, which matches how much they vary in the data [^1].
    explanation: |
      The counterfactual minimises $\lambda (f(x') - y')^2 + d(x, x')$ with
      $d(x, x') = \sum_k |x_k - x'_k| / \mathrm{MAD}_k$ [^1][^2]. The MAD reflects how much each
      feature naturally varies and, unlike the standard deviation, is robust to outliers; the L1 norm
      tends to produce sparse changes, so the counterfactual alters only a few variables and is easy
      to communicate [^1]. (Molnar notes that the distance alone treats one large change and many
      small ones alike [^2]; the few-feature solutions appear once it is minimised together with the
      prediction loss, e.g. for a linear model only the feature with the largest
      $|w_k| \cdot \mathrm{MAD}_k$ changes.)
    references:
      - title: Wachter, Mittelstadt & Russell (2017), Counterfactual Explanations without Opening the Black Box, arXiv:1711.00399
        url: https://arxiv.org/abs/1711.00399
        locator: Sec. III Generating Counterfactuals (Eqs. 2–4)
      - title: Molnar, Interpretable Machine Learning (3rd ed., CC BY-NC-SA 4.0)
        url: https://christophm.github.io/interpretable-ml-book/counterfactual.html
        locator: Ch. 15 Counterfactual Explanations, Method by Wachter et al.
    source:
      id: original
      ref: xai-032
    status: reviewed
    reviewed_by: claude
  - id: xai-033
    type: single
    difficulty: medium
    tags:
      - faithfulness
      - plausibility
      - ablation-test
    question: |
      Doctors find a saliency map convincing because it highlights the tumour. Yet deleting the
      highlighted pixels barely changes the model's prediction, while blanking a small corner patch
      changes it a lot. How is this explanation best described?
    options:
      - text: Plausible but not faithful
        correct: true
      - text: Faithful but not plausible
        why: This swaps the terms; convincing people is plausibility, matching the model's actual reasoning is faithfulness [^1].
      - text: Both faithful and plausible
        why: The ablation shows the model relies on the corner, not the highlighted region, so the map does not reflect its reasoning [^2].
      - text: Neither faithful nor plausible
        why: The doctors find it convincing, which is exactly what plausibility means [^1].
    explanation: |
      Plausibility is how convincing an explanation is to humans; faithfulness is how accurately it
      reflects the model's true reasoning, and one can hold without the other [^1]. Ablation tests
      check faithfulness: removing the features ranked most important should lower the output the
      most [^2]. Here it does not, and the corner patch suggests a shortcut, much like the decoy
      MNIST example where a corner encodes the label [^2].
    references:
      - title: 'Jacovi & Goldberg (2020), Towards Faithfully Interpretable NLP Systems: How should we define and evaluate faithfulness?, arXiv:2004.03685'
        url: https://arxiv.org/abs/2004.03685
        locator: Sec. 2 Faithfulness vs. Plausibility
      - title: Sturmfels, Lundberg & Lee (2020), Visualizing the Impact of Feature Attribution Baselines, Distill
        url: https://distill.pub/2020/attribution-baselines/
        locator: Comparing Saliency Methods (The Dangers of Qualitative Assessment; Top K Ablation Tests)
    source:
      id: original
      ref: xai-033
    status: reviewed
    reviewed_by: claude
  - id: xai-034
    type: true_false
    difficulty: easy
    tags:
      - clever-hans
      - shortcut-learning
      - debugging
    question: |
      True or false: if an image classifier reaches high accuracy on a held-out test set drawn from
      the same data collection as its training set, it cannot be relying on a spurious cue such as a
      watermark.
    options:
      - text: 'True'
        why: The test set shares the artefacts of the collection, so a classifier that uses the watermark scores well there too [^1].
      - text: 'False'
        correct: true
    explanation: |
      Lapuschkin et al. examined a Fisher-vector image classifier (not a deep network) trained on
      PASCAL VOC 2007 with excellent test accuracy on the "horse" class, yet its relevance heatmaps
      pointed at a source tag (a copyright watermark) present on about a fifth of the horse photos.
      Cutting the tag out weakened the "horse" decision, and pasting it onto a car photo turned the
      prediction into "horse"; a fine-tuned deep network on the same data looked at the horse and
      rider instead [^1]. Such "Clever Hans" behaviour stays hidden as long as the cue is present
      and fails once it is absent; explanation methods help to detect it [^2].
    references:
      - title: Lapuschkin et al. (2019), Unmasking Clever Hans Predictors and Assessing What Machines Really Learn, arXiv:1902.10178
        url: https://arxiv.org/abs/1902.10178
        locator: Results, "Identifying valid and invalid problem-solving behaviors" (Fig. 2a)
      - title: 'Wikipedia: Clever Hans'
        url: https://en.wikipedia.org/wiki/Clever_Hans
        locator: Clever Hans effect in artificial intelligence
    source:
      id: original
      ref: xai-034
    status: reviewed
    reviewed_by: claude
