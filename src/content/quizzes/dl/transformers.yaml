  - id: transformers-041
    type: single
    difficulty: medium
    tags:
      - attention
      - complexity
      - encoder-decoder
    question: |
      An encoder–decoder transformer reads $n$ input words and generates $m$ output words, with key/query/value
      dimension $p$. Counting the attention computations (encoder self-attention, decoder self-attention over the
      output prefix, and encoder–decoder attention), what is the time complexity of encoding the input and generating
      the whole output?
    options:
      - text: $\mathcal{O}(p\,(n^2 + m^2 + nm))$
        correct: true
      - text: $\mathcal{O}(p\,(n + m))$
        why: Each attention layer compares every query with every key, which is quadratic in the sequence lengths, not linear.
      - text: $\mathcal{O}(p\,nm)$
        why: This counts only the encoder–decoder attention and leaves out self-attention over the input ($n^2$) and over the output ($m^2$).
      - text: $\mathcal{O}(p^2\,(n + m)^2)$
        why: A dot product of two $p$-dimensional vectors costs $\mathcal{O}(p)$, not $\mathcal{O}(p^2)$; the attention scores are linear in $p$.
    explanation: |
      Attention appears at three points [^1]. Self-attention among the $n$ input words compares $n$ queries with $n$ keys
      using $p$-dimensional dot products, $\mathcal{O}(n^2 p)$ [^2]; self-attention among the $m$ output words costs
      $\mathcal{O}(m^2 p)$, assuming each output position's attention is computed once as the sequence grows; and attention
      from output words to input words costs $\mathcal{O}(nmp)$ [^1]. The total is $\mathcal{O}(p(n^2 + m^2 + nm))$ [^1]. The
      linear projections and feed-forward layers add $\mathcal{O}((n + m)p^2)$, which this count of attention leaves out.
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 5 Transformer overview II, Think! 5 Complexity of decoding
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 11.6.2 Comparing CNNs, RNNs, and Self-Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#comparing-cnns-rnns-and-self-attention
    source:
      id: neuromatch-dl
      ref: W3D1_AttentionAndTransformers/W3D1_Tutorial1#think5
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: transformers-042
    type: short_answer
    difficulty: medium
    tags:
      - multi-head-attention
      - parameter-count
    question: |
      The multi-head self-attention layer of the Neuromatch Academy (NMA) transformer tutorial gives
      every head the full embedding size `k`:
      ```python
      class SelfAttention(nn.Module):
          def __init__(self, k, heads=8):
              super().__init__()
              self.to_keys = nn.Linear(k, k * heads, bias=False)
              self.to_queries = nn.Linear(k, k * heads, bias=False)
              self.to_values = nn.Linear(k, k * heads, bias=False)
              self.unify_heads = nn.Linear(k * heads, k)
      ```
      How many learnable parameters does `SelfAttention(k=64, heads=8)` have?
    answer:
      numeric: 131136
      tolerance: 0
      hint: an integer
      model: $3 \cdot 64 \cdot 512 + 512 \cdot 64 + 64 = 131136$
    explanation: |
      Each of the three projections is a bias-free $64 \to 512$ map with $64 \cdot 512 = 32768$ weights, and `unify_heads`
      maps $512 \to 64$ with $32768$ weights plus 64 biases [^1]. The total is $4 \cdot 32768 + 64 = 131136$. The original
      transformer instead splits the model dimension across the heads (each head gets $k/h$ dimensions), so multi-head
      attention costs about as much as one full-width head [^2][^3]; in this "wide" version the parameter count grows
      linearly with the number of heads.
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 3 Multihead attention, Coding Exercise 3 Q, K, V attention
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 11.5.1 Model
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html#model
      - title: Vaswani et al. (2017), Attention Is All You Need
        url: https://arxiv.org/abs/1706.03762
        locator: Sec. 3.2.2 Multi-Head Attention
