    question: |
      A ViT turns $224 \times 224$ RGB images into patch embeddings with
      `nn.Conv2d(in_channels=3, out_channels=768, kernel_size=16, stride=16)`, which embeds each
      $16 \times 16$ patch into a 768-dimensional vector. How many parameters does this layer have?
    answer:
