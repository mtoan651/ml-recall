  - id: transformers-040
    type: short_answer
    difficulty: medium
    tags:
      - dot-product-attention
      - softmax
      - numerical-stability
    question: |
      A decoder scores four encoder states by dot product and gets the raw scores
      $(927, 397, 148, 929)$. What attention weight does the softmax give to the first encoder
      state?
    answer:
      numeric: 0.119
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\frac{e^{927}}{e^{927} + e^{397} + e^{148} + e^{929}} \approx \frac{1}{1 + e^{2}} \approx 0.119$
    explanation: |
      Dividing numerator and denominator by $e^{929}$ gives $e^{-2}/(e^{-2} + e^{-532} + e^{-781} + 1)
      \approx 0.119$, and the fourth state gets about 0.881 [^1]. A score difference of only 2
      already splits the weight 12/88, and states 2 and 3 are effectively ignored [^1]. Computing
      `np.exp(929)` directly overflows float64 to `inf`, which is why softmax implementations
      subtract the maximum score first [^2].
    references:
      - source: udacity-dl-pytorch
        locator: Attention Basics notebook, Attention Scoring; Softmax
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/attention/Attention_Basics_Solution.ipynb
      - source: d2l
        locator: Sec. 4.5.2 Softmax Revisited (overflow, subtracting the maximum)
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
    source:
      id: udacity-dl-pytorch
      ref: attention/Attention_Basics_Solution.ipynb#softmax-weights
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/attention/Attention_Basics_Solution.ipynb
