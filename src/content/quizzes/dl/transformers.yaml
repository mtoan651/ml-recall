  - id: transformers-035
    type: multiple
    difficulty: medium
    tags:
      - self-attention
      - positional-embeddings
      - multi-head-attention
      - long-range-dependencies
    question: |
      Transformers have replaced RNNs in most language models. Which statements about the design
      choices behind them are true? Select all that apply.
    options:
      - text: Self-attention can model long-range dependencies better than RNNs, because information does not have to flow step by step through the sequence
        correct: true
      - text: Transformers add positional embeddings because self-attention alone does not encode the order of the tokens
        correct: true
      - text: Multi-head self-attention lets the model attend to different kinds of relations, with a separate set of projections in each head
        correct: true
      - text: Self-attention relates the parts of the input by computing weighted combinations of all tokens, with weights from learned similarity scores
        correct: true
      - text: All heads of a multi-head attention layer share the same query, key and value weights, so they learn the same relations
        why: Each head has its own parameters, which is what lets different heads learn different aspects of the relations between tokens [^3].
    explanation: |
      In an RNN, information from an early token reaches a late one only through every intermediate
      hidden state, whereas self-attention connects any two tokens directly, which helps with
      long-range dependencies [^1]. Without extra information, self-attention treats its input like
      a bag of words: the attention weights depend on the tokens' contents, not on where they
      stand, so positional embeddings are added to the token embeddings to inject order [^2]. A multi-head layer runs several attention heads in parallel,
      each with its own query, key and value projections, and concatenates their outputs [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 1.2 Problems with RNNs; 2.1 Intuition'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 3. Positional embeddings'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 4. Multi-head attention'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
    source:
