  - id: transformers-043
    type: single
    difficulty: medium
    tags:
      - transformer-block
      - layer-normalization
      - residual-connections
    question: |
      A transformer encoder block is written as
      ```python
      def forward(self, x):
          attended = self.attention(x)
          x = self.norm_1(attended + x)
          feedforward = self.mlp(x)
          x = self.norm_2(feedforward + x)
          return x
      ```
      Which description matches it?
    options:
      - text: Each sublayer output is added to its input and the sum is layer-normalized ("add & norm" after each sublayer)
        correct: true
      - text: Each sublayer receives a layer-normalized input, and the raw input is added back afterwards
        why: That is the pre-norm variant, `x = x + sublayer(norm(x))`; here the norm is applied after the addition.
      - text: Attention and the MLP both read the raw input `x` in parallel, and their outputs are summed
        why: '`self.mlp` is applied to the updated `x = norm_1(attended + x)`, so the two sublayers run one after the other.'
      - text: 'The block has no residual connections: sublayer outputs replace their inputs'
        why: Each line adds the sublayer output to its own input (`attended + x`, `feedforward + x`) before normalizing.
    explanation: |
      The block has two sublayers, self-attention and a position-wise MLP, each followed by "add & norm": its output is
      added to its input through a residual connection and the sum goes through `nn.LayerNorm` [^1]. This is the
      original transformer's post-norm arrangement, $\mathrm{LayerNorm}(x + \mathrm{Sublayer}(x))$ [^2][^3]. Many later models
      move the normalization in front of each sublayer (pre-norm), which tends to make deep stacks easier to train [^4];
      the code here is not that variant.
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 4 Transformer overview I, Coding Exercise 4 Transformer encoder
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 11.7.1 Model and Sec. 11.7.3 Residual Connection and Layer Normalization
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#residual-connection-and-layer-normalization
      - title: Vaswani et al. (2017), Attention Is All You Need
        url: https://arxiv.org/abs/1706.03762
        locator: Sec. 3.1 Encoder and Decoder Stacks
      - title: Xiong et al. (2020), On Layer Normalization in the Transformer Architecture
        url: https://arxiv.org/abs/2002.04745
        locator: Abstract
    source:
      id: neuromatch-dl
      ref: W3D1_AttentionAndTransformers/W3D1_Tutorial1#ex4
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
