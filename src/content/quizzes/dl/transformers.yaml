      ref: lectures/notes/07_more-transformers.ipynb#ex7.2
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
    status: reviewed
    reviewed_by: claude
  - id: transformers-036
    type: multiple
    difficulty: easy
    tags:
      - transformer-block
      - residual-connections
      - layer-normalization
    question: Which of these are typical components of a transformer block? Select all that apply.
    options:
      - text: A multi-head self-attention layer
        correct: true
      - text: A feedforward layer applied to each token separately
        correct: true
      - text: Residual connections and layer normalization
        correct: true
      - text: A recurrent connection that passes a hidden state from one token to the next
        why: Transformers eliminate recurrence; tokens interact only through attention, which is what lets them be processed in parallel [^1].
      - text: A pooling layer that halves the sequence length after each block
        why: A block keeps one output vector per input token, so blocks can be stacked and every token keeps its own contextual representation [^1].
    explanation: |
      A transformer block combines a multi-head self-attention layer, which learns relationships
      between tokens, a feedforward layer applied independently to each token, residual connections
      that preserve information and improve gradient flow, and layer normalization that stabilizes
      training [^1]. Stacking many such blocks refines one contextual representation per token [^1].
      The same ingredients appear in the library layers for encoders and decoders, decoders adding
      masking and, in encoder-decoder models, cross-attention [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 1.3 The Big Picture: Transformers (Zooming in: the transformer block); 5. Transformer blocks'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 7: More transformers — Implementing transformer blocks with PyTorch'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/07_more-transformers.ipynb#ex7.3
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
    status: reviewed
    reviewed_by: claude
  - id: transformers-037
    type: multiple
    difficulty: medium
    tags:
      - decoder-only
      - encoder-only
      - encoder-decoder
      - masked-language-modeling
    question: |
      Which statements about the three families of transformer language models are true? Select all
      that apply.
    options:
      - text: Decoder-only models such as GPT are designed for text generation
        correct: true
      - text: Decoder-only models are trained with masked language modeling
        why: Masked language modeling, predicting hidden tokens from both sides, is how encoder-only models such as BERT are trained; decoder-only models predict the next token [^2].
      - text: Encoder-only models such as BERT are used for understanding tasks such as classification and named-entity recognition
        correct: true
      - text: Decoder-only models are trained to predict the next token
        correct: true
      - text: In an encoder-decoder model, the decoder generates each token from the previously generated tokens and the encoder's outputs
        correct: true
    explanation: |
      Decoder-only models (GPT) use causal masking, so each position sees only earlier tokens; they
      are trained with a cross-entropy loss on the next token and generate text autoregressively [^1].
      Encoder-only models (BERT, RoBERTa) use bidirectional attention and are trained by masked
      language modeling, which makes them good at analysing text, for example for classification or
      named-entity recognition [^2]. Encoder-decoder models (T5, BART) add cross-attention, so the
      decoder attends to the encoder's outputs while generating, which suits translation and
      summarization [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 7: More transformers — 1. Decoder-only architecture'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 7: More transformers — 2. Encoder-only architecture'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 7: More transformers — 3. Encoder-decoder architecture (high-level)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
    source:
