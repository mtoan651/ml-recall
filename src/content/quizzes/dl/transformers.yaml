  - id: transformers-033
    type: single
    difficulty: medium
    tags:
      - vision-transformer
      - pooling
      - pytorch
    question: |
      A vision Transformer ends its forward pass like this:

      ```python
      for blk in self.blks:
          X = blk(X)    # X: (batch_size, 1 + num_patches, num_hiddens), <cls> first
      return self.head(X[:, 0])
      ```

      `self.head` is a `LayerNorm` followed by `Linear(num_hiddens, num_classes)`. Which return
      statement classifies from the average of the patch representations instead of the `<cls>`
      token?
    options:
      - text: '`return self.head(X[:, 1:].mean(dim=1))`'
        correct: true
      - text: '`return self.head(X[:, 1:].mean(dim=2))`'
        why: This averages over the hidden features, giving one number per patch instead of a `num_hiddens` vector.
      - text: '`return self.head(X.mean(dim=0))`'
        why: This averages over the batch, mixing different images together.
      - text: '`return self.head(X[:, 0].mean(dim=1))`'
        why: This averages the features of the `<cls>` vector, giving one number per image.
    explanation: |
      Dimension 1 indexes the tokens: `X[:, 1:]` drops the `<cls>` token at position 0, and
      `.mean(dim=1)` averages the patch vectors into a (batch_size, num_hiddens) tensor, the shape the
      head expects [^1]. The `<cls>` token works as a summary because it attends to all patches
      through self-attention; average pooling instead summarizes the patches directly [^1].
    references:
      - source: d2l
        locator: Sec. 11.8.1 Model; 11.8.4 Putting It All Together
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#putting-it-all-together
      - source: d2l
        locator: Sec. 11.8.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/vision-transformer#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-034
    type: multiple
    difficulty: medium
    tags:
      - self-attention
      - query-key-value
      - complexity
    question: |
      Self-attention builds a new representation of each token from the tokens of its sequence.
      Which statements about this mechanism are true? Select all that apply.
    options:
      - text: Unlike RNNs, self-attention lets a model process all tokens of a sequence at once, without recurrent connections
        correct: true
      - text: In self-attention without a causal mask (as in an encoder), every token can influence the representation of every other token through learned attention weights
        correct: true
      - text: Self-attention computes a weighted sum of value vectors, with weights based on the similarity between query and key vectors
        correct: true
      - text: The cost of self-attention grows quadratically with the sequence length, because it scores every pair of tokens
        correct: true
      - text: A self-attention layer outputs a single scalar for each token
        why: Each output $y_i$ is a weighted sum of value vectors, so it is a vector with the dimension of the values, not a scalar [^2].
    explanation: |
      Transformers eliminate recurrence and process all tokens simultaneously, which makes them easy
      to parallelize [^1]. Each token is projected into a query, a key and a value; the scores
      $QK^\top / \sqrt{d_k}$ compare every query with every key, a softmax turns them into weights, and
      each output is the weighted sum of the value vectors [^2]. The score matrix is $N \times N$
      for $N$ tokens, hence the quadratic cost [^2]. A decoder masks future tokens so that a token
      only attends to earlier ones; without the mask, attention runs in both directions [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 1.3 The Big Picture: Transformers'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 6: Introduction to self-attention and transformers — 2.2 The key operations in self-attention; 2.3 Query, Key, and Value Roles; 2.4 Efficient attention weight computation'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/06_intro-to-transformers.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 7: More transformers — 1. Decoder-only architecture (causal masking); 2. Encoder-only architecture'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/07_more-transformers.ipynb
    source:
