  - id: transformers-049
    type: single
    difficulty: easy
    tags:
      - attention-mask
      - softmax
    question: |
      In self-attention, $A = \mathrm{softmax}(QK^\top / \sqrt{d_k})$ row by row, and token $i$ must not
      attend to token $j$. What do you do to the score in row $i$, column $j$ so that $A_{ij} = 0$ and
      every row of $A$ still sums to 1?
    options:
      - text: Set it to $-\infty$ before the softmax
        correct: true
      - text: Set it to $0$ before the softmax
        why: A score of 0 still gets the weight $e^0 / \sum_k e^{s_k} > 0$, so token $j$ keeps influencing token $i$.
      - text: Set $A_{ij}$ to 0 after the softmax
        why: The row then sums to less than 1 unless it is renormalized, which is what the $-\infty$ score does automatically.
      - text: Set the value vector of token $j$ to zero instead
        why: The weight $A_{ij}$ stays positive and its mass is wasted, and the value of token $j$ is still needed by the tokens allowed to see it.
    explanation: |
      The softmax maps a score of $-\infty$ (in practice a very large negative number) to zero weight, and the other weights in the row
      are renormalized among themselves, so they still sum to 1 [^1]. Implementations use a large
      negative constant such as $-10^6$, whose exponential underflows to 0 [^1]. The same trick builds
      the causal mask of a decoder and hides padding tokens [^2].
    references:
      - source: d2l
        locator: Sec. 11.3.2.1 Masked Softmax Operation
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#masked-softmax-operation
      - source: mit-ocw-67960
        locator: Homework 3, Problem 2(a)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw3_pdf/
