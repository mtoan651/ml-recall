title: Attention & Transformers
questions:
  - id: transformers-001
    type: single
    question: Which of these types of models would you use for completing prompts with generated text?
    options:
      - text: An encoder model
        why: An encoder model generates a representation of the whole sentence that is better suited for tasks like classification.
      - text: A decoder model
        correct: true
      - text: A sequence-to-sequence model
        why: Sequence-to-sequence models are better suited for tasks where you want to generate sentences in relation to the input sentences, not a given prompt.
    explanation: Decoder models are perfectly suited for text generation from a prompt. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 1: Transformer models'
        url: https://huggingface.co/learn/llm-course/chapter1/1
    source:
      id: hf-llm-course
      ref: chapter1/7#q8
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-002
    type: single
    question: Which of those types of models would you use for summarizing texts?
    options:
      - text: An encoder model
        why: An encoder model generates a representation of the whole sentence that is better suited for tasks like classification.
      - text: A decoder model
        why: Decoder models are good for generating output text (like summaries), but they don't have the ability to exploit a context like the whole text to summarize.
      - text: A sequence-to-sequence model
        correct: true
    explanation: Sequence-to-sequence models are perfectly suited for a summarization task. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 1: Transformer models'
        url: https://huggingface.co/learn/llm-course/chapter1/1
    source:
      id: hf-llm-course
      ref: chapter1/7#q9
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-003
    type: single
    question: Which of these types of models would you use for classifying text inputs according to certain labels?
    options:
      - text: An encoder model
        correct: true
      - text: A decoder model
        why: Decoder models are good for generating output texts, not extracting a label out of a sentence.
      - text: A sequence-to-sequence model
        why: Sequence-to-sequence models are better suited for tasks where you want to generate text based on an input sentence, not a label.
    explanation: An encoder model generates a representation of the whole sentence which is perfectly suited for a task like classification. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 1: Transformer models'
        url: https://huggingface.co/learn/llm-course/chapter1/1
    source:
      id: hf-llm-course
      ref: chapter1/7#q10
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-004
    type: single
    question: How many dimensions does the tensor output by the base Transformer model have, and what are they?
    options:
      - text: '2: The sequence length and the batch size'
        why: 'False! The tensor output by the model has a third dimension: hidden size.'
      - text: '2: The sequence length and the hidden size'
        why: False! All Transformer models handle batches, even with a single sequence; that would be a batch size of 1!
      - text: '3: The sequence length, the batch size, and the hidden size'
        correct: true
    explanation: Nicely done! [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 2: Using 🤗 Transformers'
        url: https://huggingface.co/learn/llm-course/chapter2/1
    source:
      id: hf-llm-course
      ref: chapter2/9#q2
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-005
    type: single
    question: What is a model head?
    options:
      - text: A component of the base Transformer network that redirects tensors to their correct layers
        why: There's no such component.
      - text: Also known as the self-attention mechanism, it adapts the representation of a token according to the other tokens of the sequence
        why: The self-attention layer does contain attention "heads," but these are not adaptation heads.
      - text: An additional component, usually made up of one or a few layers, to convert the transformer predictions to a task-specific output
        correct: true
    explanation: "That's right. Adaptation heads, also known simply as heads, come up in different forms: language modeling heads, question answering heads, sequence classification heads... [^1]"
    references:
      - source: hf-llm-course
        locator: 'Chapter 2: Using 🤗 Transformers'
        url: https://huggingface.co/learn/llm-course/chapter2/1
    source:
      id: hf-llm-course
      ref: chapter2/9#q4
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-006
    type: multiple
    question: What are the techniques to be aware of when batching sequences of different lengths together?
    options:
      - text: Truncating
        correct: true
      - text: Returning tensors
        why: While the other techniques allow you to return rectangular tensors, returning tensors isn't helpful when batching sequences together.
      - text: Padding
        correct: true
      - text: Attention masking
        correct: true
    explanation: Yes, truncation is a correct way of evening out sequences so that they fit in a rectangular shape. Is it the only one, though? Yes, padding is a correct way of evening out sequences so that they fit in a rectangular shape. Is it the only one, though? Absolutely! Attention masks are of prime importance when handling sequences of different lengths. That's not the only technique to be aware of, however. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 2: Using 🤗 Transformers'
        url: https://huggingface.co/learn/llm-course/chapter2/1
    source:
      id: hf-llm-course
      ref: chapter2/9#q6
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-007
    type: single
    question: What does the `token_type_ids` field represent in BERT tokenization?
    options:
      - text: The position of each token in the sequence.
        why: That would be position embeddings, not token_type_ids.
      - text: Which sentence each token belongs to when processing sentence pairs.
        correct: true
      - text: The attention mask for each token.
        why: The attention mask is a separate field that indicates which tokens to attend to.
      - text: The vocabulary ID of each token.
        why: That's the input_ids field, not token_type_ids.
    explanation: Correct! token_type_ids distinguish between the first sentence (0) and second sentence (1) in sentence pair tasks. [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 3: Fine-tuning a pretrained model'
        url: https://huggingface.co/learn/llm-course/chapter3/1
    source:
      id: hf-llm-course
      ref: chapter3/2#q3
      url: https://huggingface.co/learn/llm-course/chapter3/2
    status: draft
