  - id: transformers-030
    type: single
    difficulty: medium
    tags:
      - additive-attention
      - dot-product-attention
      - transformer
    question: |
      Would it be a good idea to replace scaled dot-product attention in a Transformer with additive
      attention, $\mathbf{w}_v^\top\tanh(\mathbf{W}_q\mathbf{q} + \mathbf{W}_k\mathbf{k})$?
    options:
      - text: 'No: queries and keys already share a dimension, and dot products run as fast matrix multiplications'
        correct: true
      - text: 'Yes: additive attention is the only scoring function that stays accurate for large key dimensions $d$'
        why: Scaling the dot product by $1/\sqrt{d}$ already fixes its problem with large $d$ [^1].
      - text: 'Yes: the Transformer needs additive attention to combine its attention heads'
        why: The heads are combined by concatenation and the output projection $\mathbf{W}_o$.
      - text: 'No: additive attention cannot be masked, so the decoder would see future tokens'
        why: Any score can be masked before the softmax.
    explanation: |
      Vaswani et al. note that the two have similar theoretical complexity, but dot-product attention
      is much faster and more space-efficient in practice because it uses highly optimized matrix
      multiplication; additive attention only beats the *unscaled* dot product for large $d_k$, which
      the $1/\sqrt{d_k}$ scaling fixes [^1]. Additive attention's main advantage is handling queries
      and keys of different lengths [^2], but a Transformer projects all of them to the same width.
    references:
      - title: Vaswani et al. (2017), Attention Is All You Need
        url: https://arxiv.org/abs/1706.03762
        locator: Sec. 3.2.1 Scaled Dot-Product Attention
      - source: d2l
        locator: Sec. 11.3.4 Additive Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#additive-attention
      - source: d2l
        locator: Sec. 11.7.8 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/transformer#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-031
    type: single
    difficulty: easy
    tags:
      - self-attention
      - long-sequences
      - complexity
    question: Why do Transformers struggle with very long input sequences?
    options:
      - text: 'Each position attends to every other: $O(n^2 d)$ compute and an $n \times n$ weight matrix per head'
        correct: true
      - text: Information has to pass through $O(n)$ sequential steps, so it fades over long distances
        why: That describes RNNs; in self-attention any two positions are connected in one step [^1].
      - text: The sinusoidal positional encoding repeats after 512 positions, so positions become ambiguous
        why: Its wavelengths range from $2\pi$ to $10000 \cdot 2\pi$, with no period of 512.
      - text: The number of weight parameters grows with the length of the input sequence
        why: The same weights are applied at every position, whatever the sequence length.
    explanation: |
      Self-attention multiplies an $n \times d$ query matrix by a $d \times n$ key matrix and the
      resulting $n \times n$ weights by an $n \times d$ value matrix, so its cost is $O(n^2 d)$; the
      quadratic dependence on sequence length makes it prohibitively slow for very long sequences, even
      though its path length between positions is $O(1)$ [^1]. The same issue makes vision Transformers
      costly at high image resolution [^2].
    references:
      - source: d2l
        locator: Sec. 11.6.2 Comparing CNNs, RNNs, and Self-Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#comparing-cnns-rnns-and-self-attention
      - source: d2l
        locator: Sec. 11.8.6 Summary and Discussion
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#summary-and-discussion
      - source: d2l
        locator: Sec. 11.7.8 Exercises, Exercise 4
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/transformer#ex4
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-032
    type: short_answer
    difficulty: medium
    tags:
      - vision-transformer
      - patches
      - complexity
    question: |
      A vision Transformer splits square images into $16 \times 16$ patches. You raise `img_size`
      from 96 to 192 pixels and keep everything else fixed. Ignoring the `<cls>` token, by what factor
      does the cost of computing the self-attention score matrices $\mathbf{Q}\mathbf{K}^\top$ in each
      layer grow?
    answer:
      numeric: 16
      tolerance: 0
      hint: a whole number
      model: Patches $(96/16)^2 = 36 \to (192/16)^2 = 144$, and the cost grows with their square, $4^2 = 16$
    explanation: |
      An $h \times w$ image gives $m = hw/p^2$ patches [^1]: 36 at 96 pixels and 144 at 192, four
      times as many. The score matrix is $m \times m$, so its cost grows $4^2 = 16$-fold [^2], while
      the patch embedding and the MLPs grow only linearly in $m$, 4-fold. Training time therefore grows
      between 4× and 16×; with the `<cls>` token the attention factor is $(145/37)^2 \approx 15.4$.
      This quadratic cost is why plain ViTs suit high-resolution images poorly [^3].
    references:
      - source: d2l
        locator: Sec. 11.8.1 Model
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#model
      - source: d2l
        locator: Sec. 11.6.2 Comparing CNNs, RNNs, and Self-Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#comparing-cnns-rnns-and-self-attention
      - source: d2l
        locator: Sec. 11.8.6 Summary and Discussion
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#summary-and-discussion
      - source: d2l
        locator: Sec. 11.8.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html#exercises
