schema_version: 1
domain: dl
topic: transformers
title: Attention & Transformers
questions:
  - id: transformers-001
    type: single
    difficulty: easy
    question: Which of these types of models would you use for completing prompts with generated text?
    options:
      - text: An encoder model
        why: An encoder model generates a representation of the whole sentence that is better suited for tasks like classification.
      - text: A decoder model
        correct: true
      - text: A sequence-to-sequence model
        why: Sequence-to-sequence models are better suited for tasks where you want to generate sentences in relation to the input sentences, not a given prompt.
    explanation: |
      Decoder models are pretrained to predict the next word, and at each position the attention
      layers can only see the words before it. That makes them best suited to text generation,
      such as continuing a prompt [^1]. Encoder models read the whole sentence in both directions
      and suit understanding tasks such as classification, and sequence-to-sequence models suit
      generating a new text from a given input, such as a translation or a summary [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/6#decoder-models
        locator: Chapter 1.6 Transformer Architectures, secs. Encoder models, Decoder models, Sequence-to-sequence models and Choosing the right architecture
    source:
      id: hf-llm-course
      ref: chapter1/7#q8
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-002
    type: single
    difficulty: easy
    question: You want to fine-tune a dedicated summarization model, which reads a whole document and then writes a shorter text. Which type of Transformer model is the standard choice?
    options:
      - text: An encoder-only model
        why: An encoder model generates a representation of the whole sentence that is better suited for tasks like classification.
      - text: A decoder-only model
        why: Decoder-only LLMs can summarize a text placed in their prompt, but each token attends only to the tokens before it. Models built specifically for summarization, such as BART and T5, are encoder-decoders [^1].
      - text: A sequence-to-sequence model
        correct: true
    explanation: |
      Sequence-to-sequence (encoder-decoder) models are best suited to generating a new text from
      a given input, such as a summary or a translation. The encoder reads the whole input with
      bidirectional attention, and the decoder then generates the output text [^1]. The course's
      guide to choosing an architecture lists encoder-decoder models such as BART and T5 for
      summarization [^1]. Modern decoder-only LLMs can summarize as well [^1], but they are
      general-purpose text generators, not the dedicated architecture for this task.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/6#sequence-to-sequence-models
        locator: Chapter 1.6 Transformer Architectures, secs. Sequence-to-sequence models, Modern Large Language Models (LLMs) and Choosing the right architecture
    source:
      id: hf-llm-course
      ref: chapter1/7#q9
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-003
    type: single
    difficulty: easy
    question: Which of these types of models would you use for classifying text inputs according to certain labels?
    options:
      - text: An encoder model
        correct: true
      - text: A decoder model
        why: Decoder models are good for generating output texts, not extracting a label out of a sentence.
      - text: A sequence-to-sequence model
        why: Sequence-to-sequence models are better suited for tasks where you want to generate text based on an input sentence, not a label.
    explanation: |
      Encoder models use bidirectional attention, so each token's representation reflects the
      whole sentence. That is what sentence classification needs, and the course suggests encoder
      models such as BERT and RoBERTa for text classification [^1]. Decoder models are built for
      generating text, and sequence-to-sequence models for turning an input text into a new output
      text, not for extracting a label [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/6#encoder-models
        locator: Chapter 1.6 Transformer Architectures, secs. Encoder models and Choosing the right architecture
    source:
      id: hf-llm-course
      ref: chapter1/7#q10
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: transformers-004
    type: single
    difficulty: easy
    question: How many dimensions does the tensor output by the base Transformer model have, and what are they?
    options:
      - text: '2: The sequence length and the batch size'
        why: 'False! The tensor output by the model has a third dimension: hidden size.'
      - text: '2: The sequence length and the hidden size'
        why: False! All Transformer models handle batches, even with a single sequence; that would be a batch size of 1!
      - text: '3: The sequence length, the batch size, and the hidden size'
        correct: true
    explanation: |
      The base model (`AutoModel`) outputs hidden states with three dimensions: the batch size
      (how many sequences are processed at once), the sequence length, and the hidden size (the
      vector dimension of each input token) [^1]. In the course example, two sentences of 16 tokens
      give `last_hidden_state.shape == torch.Size([2, 16, 768])` [^1]. The batch dimension is
      always there: a single sentence is sent as a batch of one sequence [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/2#a-high-dimensional-vector
        locator: Chapter 2.2 Behind the pipeline, sec. A high-dimensional vector?
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/5#models-expect-a-batch-of-inputs
        locator: Chapter 2.5 Handling multiple sequences, sec. Models expect a batch of inputs
    source:
      id: hf-llm-course
      ref: chapter2/9#q2
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-005
    type: single
    difficulty: easy
    question: What is a model head?
    options:
      - text: A component of the base Transformer network that redirects tensors to their correct layers
        why: There's no such component.
      - text: Also known as the self-attention mechanism, it adapts the representation of a token according to the other tokens of the sequence
        why: The self-attention layer does contain attention "heads," but these are not adaptation heads.
      - text: An additional component, usually made up of one or a few layers, to convert the transformer predictions to a task-specific output
        correct: true
    explanation: |
      The base Transformer outputs high-dimensional hidden states. A head is an extra component,
      usually one or a few linear layers, that projects those vectors onto a task-specific output,
      for example two logits for positive/negative sentence classification [^1]. The same base
      model can carry different heads, such as `*ForSequenceClassification`,
      `*ForTokenClassification`, `*ForQuestionAnswering` or `*ForCausalLM` [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/2#model-heads-making-sense-out-of-numbers
        locator: 'Chapter 2.2 Behind the pipeline, sec. Model heads: Making sense out of numbers'
    source:
      id: hf-llm-course
      ref: chapter2/9#q4
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-006
    type: multiple
    difficulty: medium
    question: What are the techniques to be aware of when batching sequences of different lengths together?
    options:
      - text: Truncating
        correct: true
      - text: Returning tensors
        why: While the other techniques allow you to return rectangular tensors, returning tensors isn't helpful when batching sequences together.
      - text: Padding
        correct: true
      - text: Attention masking
        correct: true
    explanation: |
      A batch must be a rectangular tensor, so sequences of different lengths have to be evened
      out. Padding adds a padding token to the shorter sequences [^1]. An attention mask (1 for
      real tokens, 0 for padding) then tells the attention layers to ignore the padding; without
      it, the padded sequence gets different outputs than it would on its own [^1]. Sequences
      longer than the model's maximum length must be truncated [^1]. Returning tensors
      (`return_tensors="pt"`) only chooses the type of the output, PyTorch tensors or NumPy arrays,
      and does nothing about the different lengths [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/5#padding-the-inputs
        locator: Chapter 2.5 Handling multiple sequences, secs. Padding the inputs, Attention masks and Longer sequences
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/6
        locator: Chapter 2.6 Putting it all together (return_tensors)
    source:
      id: hf-llm-course
      ref: chapter2/9#q6
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: transformers-007
    type: single
    difficulty: easy
    question: What does the `token_type_ids` field represent in BERT tokenization?
    options:
      - text: The position of each token in the sequence.
        why: That would be position embeddings, not token_type_ids.
      - text: Which sentence each token belongs to when processing sentence pairs.
        correct: true
      - text: The attention mask for each token.
        why: The attention mask is a separate field that indicates which tokens to attend to.
      - text: The vocabulary ID of each token.
        why: That's the input_ids field, not token_type_ids.
    explanation: |
      For a sentence pair, BERT's tokenizer builds `[CLS] sentence1 [SEP] sentence2 [SEP]`, and
      `token_type_ids` says which part each token belongs to: 0 for `[CLS] sentence1 [SEP]` and 1
      for `sentence2 [SEP]` [^1]. BERT uses them because it was pretrained with next sentence
      prediction on sentence pairs; checkpoints that weren't, such as DistilBERT, don't return
      them [^1]. The vocabulary IDs and the padding information are separate fields, `input_ids`
      and `attention_mask` [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/2#preprocessing-a-dataset
        locator: Chapter 3.2 Processing the data, sec. Preprocessing a dataset
    source:
      id: hf-llm-course
      ref: chapter3/2#q3
      url: https://huggingface.co/learn/llm-course/chapter3/2
    status: draft
  - id: transformers-008
    type: single
    difficulty: easy
    question: Attention mechanism provides a means of _____ the impact of an input vector on an output prediction of an RNN
    options:
      - text: weighting
        correct: true
      - text: training
      - text: testing
    explanation: |
      Attention lets the decoder use all encoder hidden states $h_i$ when producing output $y_t$, each
      with its own weight $\alpha_{t,i}$, so it weights how much each input vector influences each
      output prediction [^1]. In Bahdanau attention the context vector is exactly such a weighted sum,
      $c_{t'} = \sum_t \alpha(s_{t'-1}, h_t)\, h_t$ [^2]. Training and testing are stages of building
      a model, not something attention does.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md
        locator: 'Lesson: Attention Mechanisms and Transformers (introduction)'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/bahdanau-attention.html#model
        locator: Sec. 11.4.1 Model (Bahdanau Attention), Eq. (11.4.1)
    source:
      id: ms-ai-for-beginners
      ref: quiz-118/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-009
    type: single
    difficulty: easy
    question: BERT is an acronym for
    options:
      - text: Bidirectional Encoded Representations From Transformers
      - text: Bidirectional Encoder Representations From Transformers
        correct: true
      - text: Bidirectional Encoder Representatives of Transformers
    explanation: |
      BERT stands for Bidirectional Encoder Representations from Transformers [^1][^2]. It is a stack
      of Transformer encoder layers (12 in BERT-base, 24 in BERT-large), pre-trained on a large text
      corpus by predicting masked words [^1][^2]. The distractors change "Encoder" to "Encoded" or
      "Representations" to "Representatives".
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#bert
        locator: 'Lesson: Attention Mechanisms and Transformers, BERT'
      - source: d2l
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html
        locator: Sec. 15.8 Bidirectional Encoder Representations from Transformers (BERT)
    source:
      id: ms-ai-for-beginners
      ref: quiz-118/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-010
    type: single
    difficulty: easy
    question: Multi-head attention is used in transformers to give the network the power to capture _____ of dependencies
    options:
      - text: different types
        correct: true
      - text: a single type
      - text: only short-range types
    explanation: |
      Multi-head attention runs several attention heads in parallel, each with its own learned
      projections of the queries, keys and values, and concatenates their outputs [^2]. Each head
      can therefore pick up a different kind of dependency, such as long-range versus short-range
      word relations or co-reference, which is the lesson's reason for using several heads
      [^1][^2]. A single type would need only one head, and the heads are not limited to short
      range: long-range relations are among the dependencies they capture [^1][^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#multi-head-self-attention
        locator: 'Lesson: Attention Mechanisms and Transformers, Multi-Head Self-Attention'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html
        locator: Sec. 11.5 Multi-Head Attention
    source:
      id: ms-ai-for-beginners
      ref: quiz-218/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-011
    type: multiple
    difficulty: medium
    question: Suppose a Transformer is trained on a billion documents, including thousands of documents containing at least one instance of the word *elephant*. Which of the following statements are probably true?
    options:
      - text: "*Acacia trees*, an important part of an elephant's diet, will gradually gain a high self-attention score with the word *elephant*."
        correct: true
      - text: The Transformer will associate the word *elephant* with various idioms that contain the word *elephant*.
        correct: true
      - text: The Transformer will gradually learn to ignore any sarcastic or ironic uses of the word *elephant* in training data.
        why: Sufficiently large Transformers trained on a sufficiently broad training set become quite adept at recognizing sarcasm, humor, and irony. So, rather than ignoring sarcasm and irony, the Transformer learns from it.
    explanation: |
      For each token, self-attention works out how much every other token in the context should
      shape its interpretation, and the heads learn these relationships through their trained
      parameters [^1]. Across thousands of documents, *acacia* keeps appearing in passages about
      what elephants eat, and the other words of idioms such as "the elephant in the room" keep
      appearing next to *elephant*. So the trained model learns to give these pairs high attention
      when they occur together, which is what lets it answer diet questions or read an idiom
      correctly [^1]. Attention weights are computed afresh for each input (the page's "it … tired"
      versus "it … wide" example), so "gaining a high score" means the model tends to assign that
      weight whenever the words co-occur. Sarcasm and irony are not filtered out: large models
      trained on broad data become good at recognising them and learn from them [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm/transformers#what_is_self-attention
        locator: "LLMs: What's a large language model?, sections 'What is self-attention?', 'What is multi-head multi-layer self-attention?' and the closing exercise"
    source:
      id: google-mlcc
      ref: llm/transformers#q1
      url: https://developers.google.com/machine-learning/crash-course/llm/transformers
    status: draft
  - id: transformers-012
    type: single
    difficulty: medium
    question: Why does a transformer need positional encoding, while an RNN does not?
    options:
      - text: Self-attention handles all tokens in parallel and ignores order; an RNN gets order from its steps
        correct: true
      - text: Self-attention cannot handle sequences longer than the embedding size unless positions are encoded
      - text: Positional encoding replaces the token embeddings, which a transformer does not use at all
      - text: It adds the recurrent connection between time steps that a transformer would otherwise lack
    explanation: |
      In an RNN the relative position of tokens is given by the number of steps, so it need not be
      represented explicitly; once we switch to attention, the positions must be supplied [^1]. Self-
      attention trades sequential processing for parallel computation and by itself does not preserve
      the order of the sequence, so positional encodings are added as an extra input for each token
      [^2]. They are added to the token embeddings, not used instead of them [^1][^2], and the
      transformer stays non-recurrent, which is why it parallelizes better [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#positional-encodingembedding
        locator: 'Lesson: Attention Mechanisms and Transformers, sec. Positional Encoding/Embedding'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
        locator: Sec. 11.6.3 Positional Encoding
    source:
      id: ms-ai-for-beginners
      ref: quiz-118/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-013
    type: single
    difficulty: medium
    question: In a transformer with *trainable* positional embeddings, how is the input vector of each token built?
    options:
      - text: Token and position each get an embedding of the same size, and the two vectors are added
        correct: true
      - text: The position number is appended to the token embedding as one extra dimension at the end of the vector
      - text: The token embedding is multiplied by the token's position index
      - text: Only the position is embedded; the token itself stays one-hot encoded
    explanation: |
      The sequence of tokens is paired with the sequence of their positions $0, 1, \dots$. With trainable
      positional embedding, embedding layers are applied to both tokens and positions, giving vectors of
      the same dimension that are then added, so the result embeds both the token and its position [^1].
      The original transformer uses a fixed sine/cosine encoding instead, but it is added to the token
      embeddings in the same way, $\mathbf{X} + \mathbf{P}$ [^2]. A single extra number or a scaling by
      the index would give the position little room to be represented.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#positional-encodingembedding
        locator: 'Lesson: Attention Mechanisms and Transformers, sec. Positional Encoding/Embedding'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
        locator: Sec. 11.6.3 Positional Encoding
    source:
      id: ms-ai-for-beginners
      ref: quiz-218/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-014
    type: single
    difficulty: medium
    question: In an encoder-decoder transformer for machine translation, which attention lets the decoder use the encoded source sentence?
    options:
      - text: 'Encoder-decoder attention: queries come from the decoder, keys and values from the encoder outputs'
        correct: true
      - text: Self-attention inside the encoder, applied to the source tokens
      - text: Masked self-attention inside the decoder, applied to the tokens generated so far
      - text: 'None: the encoder hands over only its final hidden state, exactly as in an RNN encoder-decoder without attention'
    explanation: |
      Transformers use attention in two ways: self-attention captures patterns within one text, and the
      attention layer between encoder and decoder performs the translation, much like attention in RNN
      encoder-decoders [^1]. In this encoder-decoder attention the queries come from the decoder's
      self-attention sublayer and the keys and values from the encoder outputs [^2]. Encoder
      self-attention only looks at the source, and the decoder's masked self-attention only at the
      output tokens generated so far [^2]. Squeezing the source into one final state is the RNN approach
      whose weaknesses attention was introduced to fix [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#encoder-decoder-attention
        locator: 'Lesson: Attention Mechanisms and Transformers, introduction and sec. Encoder-Decoder Attention'
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#model
        locator: Sec. 11.7.1 Model (Transformer decoder)
    source:
      id: ms-ai-for-beginners
      ref: quiz-218/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-18.json
    status: draft
  - id: transformers-015
    type: single
    question: |
      A pretrained Whisper model expects log-mel spectrograms as input. You have raw 16 kHz
      waveforms. What is the most reliable way to compute the model's input features?
    options:
      - text: Use the feature extractor released with that checkpoint, which repeats the pretraining settings
        correct: true
      - text: Compute a mel spectrogram with a signal-processing library's default settings
        why: Default settings (number of mel bins, window and hop length, log scaling, normalisation, padding to 30 s) rarely match what the model saw in training, so the inputs would be out of distribution.
      - text: Feed the raw waveform, since the encoder computes the spectrogram internally
        why: Whisper's encoder takes log-mel features as input. The conversion from waveform to features is done by the preprocessor, not by the network.
      - text: Let the dataset library compute the features when it decodes the audio
        why: A dataset library decodes and resamples audio, but it does not know a model's feature settings. Feature extraction belongs to the model's preprocessor.
    explanation: |
      A pretrained model only works well on inputs prepared exactly as during pretraining [^1].
      Whisper uses 80-channel log-magnitude mel spectrograms computed on 25 ms windows with a 10 ms
      stride, scaled to a fixed range and padded or trimmed to 30-second chunks [^2]. The
      checkpoint's own feature extractor reproduces those settings.
    references:
      - source: hf-audio-course
        locator: Unit 1. Working with audio data
        url: https://huggingface.co/learn/audio-course/chapter1/introduction
      - title: Radford et al. (2022), Robust Speech Recognition via Large-Scale Weak Supervision
        locator: Sec. 2.2 Model
        url: https://arxiv.org/abs/2212.04356
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q4
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: draft
  - id: transformers-016
    type: single
    question: How can you convert a spectrogram generated by a machine learning model into a waveform?
    options:
      - text: We can use a neural network called a vocoder to reconstruct a waveform from the spectrogram.
        correct: true
      - text: We can use the inverse STFT to convert the generated spectrogram into a waveform
        why: A generated spectrogram is missing phase information that is required to use the inverse STFT.
      - text: You can't convert a spectrogram generated by a machine learning model into a waveform.
        why: It is possible. A vocoder network, or the classic Griffin–Lim algorithm, which estimates the missing phase, can reconstruct a waveform.
    explanation: Since the phase information is missing in this case, we need to use a vocoder, or the classic Griffin-Lim algorithm to reconstruct the waveform. [^1]
    references:
      - source: hf-audio-course
        locator: Unit 1. Working with audio data
        url: https://huggingface.co/learn/audio-course/chapter1/introduction
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q7
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: draft
  - id: transformers-017
    type: single
    question: What is a vocoder?
    options:
      - text: An additional neural network that turns the spectrogram output of a transformer into a waveform.
        correct: true
      - text: A type of transformer layer that is responsible for creating audio embeddings.
        why: Audio embeddings come from the model's own encoder layers. A vocoder works after the model, on its spectrogram output.
      - text: An additional neural network that preprocesses speech audio to remove background noise
        why: Removing background noise is speech enhancement, a preprocessing step. A vocoder is a postprocessing network that synthesises the waveform.
    explanation: |
      Text-to-speech transformers usually predict a (mel) spectrogram rather than raw audio. A
      spectrogram has no phase information, so a separate neural network, the vocoder (for
      example HiFi-GAN), is trained to turn it into a waveform [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q1
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
  - id: transformers-018
    type: single
    question: Wav2Vec2, fine-tuned for speech recognition, is an example of which architecture?
    options:
      - text: Seq2Seq architecture
        why: Sequence-to-sequence models such as Whisper have a decoder that generates the transcript token by token. Wav2Vec2 has no decoder.
      - text: CNN architecture
        why: Wav2Vec2 does begin with a convolutional feature encoder, but its core is a transformer encoder trained for speech recognition with a CTC head.
      - text: CTC architecture
        correct: true
    explanation: |
      Wav2Vec2 turns the waveform into frame features with a small CNN, contextualises them with
      a transformer encoder, and predicts one character per frame with a linear layer. It is
      fine-tuned for speech recognition with the connectionist temporal classification (CTC)
      loss, so it is a CTC (encoder-only) architecture [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q2
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
  - id: transformers-019
    type: single
    question: What does a blank token in CTC algorithm do?
    options:
      - text: It marks the breaks between the individual words of the sentence
        why: Word breaks are marked by a separate word-delimiter token (Wav2Vec2 uses `|`), not by the blank.
      - text: It separates groups of characters, so that repeats can be merged safely
        correct: true
      - text: It stands for sounds that match no vocabulary token, like an unknown token
        why: The blank is not an "unknown" token. It is a structural token that lets the model output "no new character" for a frame.
    explanation: |
      A CTC model predicts one token per audio frame, so a character that lasts several frames is
      predicted several times. Decoding first merges consecutive duplicates and then removes the
      blanks. A blank between two identical characters (as in `l _ l` for the double l of
      "hello") keeps them as two letters [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q3
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
  - id: transformers-020
    type: single
    question: Which of the following statements about CTC models is FALSE?
    options:
      - text: CTC models use only the encoder part of the transformer architecture.
        why: True. CTC models such as Wav2Vec2 and HuBERT are encoder-only, with a linear classification head on top.
      - text: Wav2Vec2 & HuBERT use the exact same architecture but are trained differently.
        why: True. Both use the same encoder architecture; they differ in the self-supervised pretraining objective.
      - text: CTC models tend to perform best for speech recognition compared to other architectures.
        correct: true
    explanation: |
      This statement is false. CTC models are fast and simple, but each frame is predicted
      independently, so outputs can sound right yet be misspelled, and they often need an
      external language model. Sequence-to-sequence models such as Whisper, whose decoder acts as
      a language model, usually reach lower error rates [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q4
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
  - id: transformers-021
    type: single
    question: Which kind of speech-recognition architecture does Whisper use?
    options:
      - text: Seq2Seq architecture
        correct: true
      - text: CNN architecture
        why: Whisper has two convolution layers at its input, but the model itself is an encoder–decoder transformer.
      - text: CTC architecture
        why: CTC models are encoder-only and predict one token per frame. Whisper's decoder generates the transcript token by token.
    explanation: |
      Whisper is an encoder–decoder (sequence-to-sequence) transformer. The encoder reads the
      log-mel spectrogram, and the decoder generates the text tokens autoregressively, attending
      to the encoder output through cross-attention [^1] [^2].
    references:
      - source: hf-audio-course
        locator: Unit 3. Transformer architectures for audio
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
      - title: Radford et al. (2022), Robust Speech Recognition via Large-Scale Weak Supervision
        locator: Sec. 2.2 Model
        url: https://arxiv.org/abs/2212.04356
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q5
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: draft
