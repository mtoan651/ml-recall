  - id: transformers-016
    type: single
    difficulty: easy
    question: How can you convert a spectrogram generated by a machine learning model into a waveform?
    options:
      - text: We can use a neural network called a vocoder to reconstruct a waveform from the spectrogram.
        correct: true
      - text: We can use the inverse STFT to convert the generated spectrogram into a waveform
        why: A generated spectrogram is missing phase information that is required to use the inverse STFT.
      - text: You can't convert a spectrogram generated by a machine learning model into a waveform.
        why: It is possible. A vocoder network, or the classic Griffin–Lim algorithm, which estimates the missing phase, can reconstruct a waveform.
    explanation: |
      The inverse STFT turns a spectrogram back into a waveform only if it has the phase as well as the
      amplitudes, and a spectrogram generated by a model typically holds only the amplitudes [^1]. The
      missing phase has to be reconstructed, classically with the Griffin–Lim algorithm, or with a
      neural network called a vocoder, the usual choice in text-to-speech models [^1][^2].
    references:
      - source: hf-audio-course
        locator: Unit 1, Introduction to audio data, sec. Spectrogram
        url: https://huggingface.co/learn/audio-course/chapter1/audio_data
      - source: hf-audio-course
        locator: Unit 3, Transformer architectures for audio, sec. Model outputs (Spectrogram output)
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q7
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-017
    type: single
    difficulty: easy
    question: What is a vocoder?
    options:
      - text: An additional neural network that turns the spectrogram output of a transformer into a waveform.
        correct: true
      - text: A type of transformer layer that is responsible for creating audio embeddings.
        why: Audio embeddings come from the model's own encoder layers. A vocoder works after the model, on its spectrogram output.
      - text: An additional neural network that preprocesses speech audio to remove background noise
        why: Removing background noise is speech enhancement, a preprocessing step. A vocoder is a postprocessing network that synthesises the waveform.
    explanation: |
      Text-to-speech transformers such as SpeechT5 usually predict a (mel) spectrogram rather than raw
      audio, and an additional neural network, the vocoder, turns this spectrogram into a waveform [^1].
      The vocoder is not part of the sequence-to-sequence model and is trained separately [^2]. Removing
      background noise would be a preprocessing step, and audio embeddings come from the model's own
      encoder layers.
    references:
      - source: hf-audio-course
        locator: Unit 3, Transformer architectures for audio, sec. Model outputs (Spectrogram output)
        url: https://huggingface.co/learn/audio-course/chapter3/introduction
      - source: hf-audio-course
        locator: Unit 3, Seq2Seq architectures, sec. Text-to-speech
        url: https://huggingface.co/learn/audio-course/chapter3/seq2seq
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q1
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-018
    type: single
    difficulty: easy
    question: Wav2Vec2, fine-tuned for speech recognition, is an example of which architecture?
    options:
      - text: Seq2Seq architecture
        why: Sequence-to-sequence models such as Whisper have a decoder that generates the transcript token by token. Wav2Vec2 has no decoder.
      - text: CNN architecture
        why: Wav2Vec2 does begin with a convolutional feature encoder, but its core is a transformer encoder trained for speech recognition with a CTC head.
      - text: CTC architecture
        correct: true
    explanation: |
      Wav2Vec2 turns the waveform into frame features with a small CNN, contextualises them with
      a transformer encoder, and predicts one character per frame with a linear layer. It is
      fine-tuned for speech recognition with the connectionist temporal classification (CTC)
      loss, so it is a CTC (encoder-only) architecture [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3, CTC architectures, secs. Dude, where's my alignment? and The CTC algorithm
        url: https://huggingface.co/learn/audio-course/chapter3/ctc
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q2
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-019
    type: single
    difficulty: medium
    question: What does a blank token in CTC algorithm do?
    options:
      - text: It marks the breaks between the individual words of the sentence
        why: Word breaks are marked by a separate word-delimiter token (Wav2Vec2 uses `|`), not by the blank.
      - text: It separates groups of characters, so that repeats can be merged safely
        correct: true
      - text: It stands for sounds that match no vocabulary token, like an unknown token
        why: The blank is not an "unknown" token. It is a structural token that lets the model output "no new character" for a frame.
    explanation: |
      A CTC model predicts one token per audio frame, so a character that lasts several frames is
      predicted several times. Decoding first merges consecutive duplicates and then removes the
      blanks. A blank between two identical characters (as in `l _ l` for the double l of
      "hello") keeps them as two letters [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3, CTC architectures, sec. The CTC algorithm
        url: https://huggingface.co/learn/audio-course/chapter3/ctc
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q3
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-020
    type: single
    difficulty: medium
    question: Which of the following statements about CTC models is FALSE?
    options:
      - text: CTC models use only the encoder part of the transformer architecture.
        why: True. CTC models such as Wav2Vec2 and HuBERT are encoder-only, with a linear classification head on top.
      - text: Wav2Vec2 & HuBERT use the exact same architecture but are trained differently.
        why: True. Both use the same encoder architecture; they differ in the self-supervised pretraining objective.
      - text: CTC models tend to perform best for speech recognition compared to other architectures.
        correct: true
    explanation: |
      This statement is false. A CTC head only looks at individual characters, so the output can sound
      right yet be misspelled, and an external language model is often added as a spellchecker [^1].
      A sequence-to-sequence model such as Whisper, whose decoder plays the role of a language model,
      is a more powerful approach, even compared with CTC plus an external language model [^2]. The
      other two statements are true: CTC models are encoder-only, and Wav2Vec2 and HuBERT share one
      architecture but are pretrained differently [^1].
    references:
      - source: hf-audio-course
        locator: Unit 3, CTC architectures, secs. The CTC algorithm and What's the difference between Wav2Vec2, HuBERT, M-CTC-T, …?
        url: https://huggingface.co/learn/audio-course/chapter3/ctc
      - source: hf-audio-course
        locator: Unit 3, Seq2Seq architectures, sec. Automatic speech recognition
        url: https://huggingface.co/learn/audio-course/chapter3/seq2seq
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q4
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-021
    type: single
    difficulty: easy
    question: Which kind of speech-recognition architecture does Whisper use?
    options:
      - text: Seq2Seq architecture
        correct: true
      - text: CNN architecture
        why: Whisper has two convolution layers at its input, but the model itself is an encoder–decoder transformer [^2].
      - text: CTC architecture
        why: CTC models are encoder-only and predict one token per frame. Whisper's decoder generates the transcript token by token [^1].
    explanation: |
      Whisper is an encoder–decoder (sequence-to-sequence) transformer. The encoder reads the
      log-mel spectrogram, and the decoder generates the text tokens autoregressively, attending
      to the encoder output through cross-attention [^1][^2].
    references:
      - source: hf-audio-course
        locator: Unit 3, Seq2Seq architectures, sec. Automatic speech recognition
        url: https://huggingface.co/learn/audio-course/chapter3/seq2seq
      - title: Radford et al. (2022), Robust Speech Recognition via Large-Scale Weak Supervision
        locator: Sec. 2.2 Model
        url: https://arxiv.org/abs/2212.04356
    source:
      id: hf-audio-course
      ref: chapter3/quiz#q5
      url: https://huggingface.co/learn/audio-course/chapter3/quiz
    status: reviewed
    reviewed_by: claude
  - id: transformers-022
    type: short_answer
    difficulty: hard
    tags:
      - attention
      - softmax
      - gradient
    question: |
      Scalar attention with keys equal to values: $\mathcal{D} = \{(k_i, v_i)\} = \{(0, 0), (1, 1), (2, 2)\}$,
      score $a(q, k_i) = q\,k_i$ and softmax weights, so
      $\mathrm{Attention}(q) = \sum_i \mathrm{softmax}_i(q k_i)\, k_i$. What is the derivative
      $\frac{d}{dq}\mathrm{Attention}(q)$ at $q = 0$? Round to 3 decimals.
    answer:
      numeric: 0.667
      tolerance: 0.002
      hint: a number, 3 decimals
      model: 'The variance of the keys under the attention weights: $\tfrac{0 + 1 + 4}{3} - 1^2 = \tfrac23$'
    explanation: |
      With $p_i = \mathrm{softmax}_i(q k_i)$ one gets $\partial p_i/\partial q = p_i(k_i - \sum_j p_j k_j)$,
      so the derivative is $\sum_i p_i k_i^2 - (\sum_i p_i k_i)^2$, the variance of the keys under
      the attention distribution [^1]. This is the scalar case of the identity
      $\nabla_{\mathbf{q}}\mathrm{Attention} = \mathrm{Cov}_{p(\mathbf{k}_i;\mathbf{q})}[\mathbf{k}_i]$
      for softmax attention with keys equal to values, which d2l asks you to prove [^3]. At $q = 0$ the
      weights are uniform, the mean key is 1 and the mean squared key $5/3$, giving $2/3$. The gradient
      vanishes when the weights concentrate on one key, one reason why dot-product scores are scaled to
      keep the softmax out of saturation [^2].
    references:
      - source: d2l
        locator: Sec. 11.1 Queries, Keys, and Values (softmax attention weights)
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html
      - source: d2l
        locator: Sec. 11.3.1 Dot Product Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#dot-product-attention
      - source: d2l
        locator: Sec. 11.1.3 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/queries-keys-values#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-023
    type: single
    difficulty: medium
    tags:
      - dot-product-attention
      - gaussian-kernel
      - nadaraya-watson
    question: |
      All queries and keys lie on the unit sphere, $\lVert\mathbf{x}\rVert = \lVert\mathbf{x}_i\rVert = 1$.
      What do the normalized Gaussian-kernel weights
      $\exp(-\tfrac12\lVert\mathbf{x} - \mathbf{x}_i\rVert^2) / \sum_j \exp(-\tfrac12\lVert\mathbf{x} - \mathbf{x}_j\rVert^2)$
      simplify to?
    options:
      - text: $\mathrm{softmax}_i(\mathbf{x}^\top\mathbf{x}_i)$, i.e. dot-product attention
        correct: true
      - text: $\mathrm{softmax}_i(-\mathbf{x}^\top\mathbf{x}_i)$, which favors the least similar keys
        why: The exponent is $-\tfrac12(2 - 2\mathbf{x}^\top\mathbf{x}_i) = \mathbf{x}^\top\mathbf{x}_i - 1$, so the dot product enters with a plus sign.
      - text: Uniform weights $1/n$, because all points on the sphere are equally far apart
        why: Distances on the sphere depend on the angle between the points.
      - text: $\mathrm{softmax}_i(\lVert\mathbf{x} - \mathbf{x}_i\rVert)$, a softmax of the distances
        why: That would favor the farthest keys; the kernel decreases with distance.
    explanation: |
      On the unit sphere $\lVert\mathbf{x} - \mathbf{x}_i\rVert^2 = 2 - 2\mathbf{x}^\top\mathbf{x}_i$,
      so each kernel value is $e^{-1}\exp(\mathbf{x}^\top\mathbf{x}_i)$ and the common factor $e^{-1}$
      cancels in the normalization [^1][^2]. What remains is a softmax over dot products, the
      attention scoring function behind Transformers; d2l makes the same argument for keys of
      constant norm, as produced by layer normalization [^2]. A kernel width σ turns this into
      $\mathrm{softmax}_i(\mathbf{x}^\top\mathbf{x}_i/\sigma^2)$, a softmax with temperature σ².
    references:
      - source: d2l
        locator: Sec. 11.2.2 Attention Pooling via Nadaraya–Watson Regression
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#attention-pooling-via-nadaraya-watson-regression
      - source: d2l
        locator: Sec. 11.3.1 Dot Product Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#dot-product-attention
      - source: d2l
        locator: Sec. 11.2.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-pooling#ex3
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-024
    type: single
    difficulty: medium
    tags:
      - attention-scoring
      - softmax
      - distance-attention
    shuffle: false
    question: |
      You implement distance-based attention with the score
      $a(\mathbf{q}, \mathbf{k}_i) = -\tfrac12\lVert\mathbf{q} - \mathbf{k}_i\rVert^2 = \mathbf{q}^\top\mathbf{k}_i - \tfrac12\lVert\mathbf{k}_i\rVert^2 - \tfrac12\lVert\mathbf{q}\rVert^2$,
      followed by a softmax over the keys. Which term can you drop without changing any attention
      weight?
    options:
      - text: $-\tfrac12\lVert\mathbf{q}\rVert^2$, because it is the same for every key of a given query
        correct: true
      - text: $-\tfrac12\lVert\mathbf{k}_i\rVert^2$, because the softmax normalizes away the key norms
        why: This term differs from key to key, so dropping it changes the weights unless all keys have the same norm [^1].
      - text: $\mathbf{q}^\top\mathbf{k}_i$, because the distance information is already in the norms
        why: It is the only term that couples the query with the key.
      - text: None of them, because a softmax changes when a constant is added to its inputs
        why: A softmax is unchanged when the same constant is added to all of its inputs.
    explanation: |
      $\mathrm{softmax}(\mathbf{a} + c) = \mathrm{softmax}(\mathbf{a})$ for a constant $c$, so the
      term that depends only on the query disappears [^1]. An efficient implementation therefore needs
      the batch product $\mathbf{Q}\mathbf{K}^\top$ plus the squared key norms
      $\lVert\mathbf{k}_i\rVert^2$, computed once and broadcast over the queries. When all keys have
      the same norm, for example after layer normalization, that term can go too, leaving
      dot-product attention [^1].
    references:
      - source: d2l
        locator: Sec. 11.3.1 Dot Product Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#dot-product-attention
      - source: d2l
        locator: Sec. 11.3.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-scoring-functions#ex1
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-025
    type: short_answer
    difficulty: easy
    tags:
      - attention-scoring
      - bilinear-attention
      - parameter-count
    question: |
      Queries are 20-dimensional and keys 2-dimensional. Instead of additive attention you score them
      with the bilinear form $a(\mathbf{q}, \mathbf{k}) = \mathbf{q}^\top\mathbf{M}\mathbf{k}$. How
      many learnable entries does $\mathbf{M}$ have?
    answer:
      numeric: 40
      tolerance: 0
      hint: a whole number
      model: $\mathbf{M} \in \mathbb{R}^{20 \times 2}$, so 40 entries
    explanation: |
      For $\mathbf{q}^\top\mathbf{M}\mathbf{k}$ to be a scalar, $\mathbf{M}$ must be
      $20 \times 2$, i.e. 40 parameters; d2l mentions this matrix as the simple way to handle queries
      and keys of different lengths [^1]. It is equivalent to projecting each key to 20 dimensions with
      $\mathbf{M}\mathbf{k}$ and then taking a dot product. Additive attention
      $\mathbf{w}_v^\top\tanh(\mathbf{W}_q\mathbf{q} + \mathbf{W}_k\mathbf{k})$ with hidden size $h$
      would need $20h + 2h + h$ parameters, 184 for $h = 8$ [^2].
    references:
      - source: d2l
        locator: Sec. 11.3.3 Scaled Dot Product Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#scaled-dot-product-attention
      - source: d2l
        locator: Sec. 11.3.4 Additive Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#additive-attention
      - source: d2l
        locator: Sec. 11.3.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-scoring-functions#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-026
    type: single
    difficulty: medium
    tags:
      - attention
      - computational-complexity
      - memory
    question: |
      Scaled dot-product attention computes $\mathrm{softmax}(\mathbf{Q}\mathbf{K}^\top/\sqrt{d})\,\mathbf{V}$
      for $n$ queries and $m$ key–value pairs, with queries and keys of length $d$ and values of length
      $v$. How do its compute and its intermediate memory scale?
    options:
      - text: Compute $O(nm(d + v))$, and it stores an $n \times m$ matrix of weights
        correct: true
      - text: Compute $O((n + m)(d + v))$, and its memory stays linear in $n + m$
        why: Every query is compared with every key, which takes $nm$ dot products.
      - text: Compute $O(nmdv)$, and it stores an $n \times m \times d$ tensor of products
        why: The two matrix products run one after the other, so their costs add, and $\mathbf{Q}\mathbf{K}^\top$ is only $n \times m$.
      - text: Compute $O(nm)$ whatever $d$ and $v$ are, with memory of $O(d + v)$
        why: Each of the $nm$ scores is a length-$d$ dot product, and each output sums $m$ vectors of length $v$.
    explanation: |
      $\mathbf{Q}\mathbf{K}^\top$ multiplies an $n \times d$ by a $d \times m$ matrix, $nmd$
      multiply-adds; the softmax costs $O(nm)$; multiplying the $n \times m$ weights by the
      $m \times v$ values costs $nmv$ [^1]. For self-attention, $n = m$, this is the familiar
      $O(n^2 d)$ [^2]. The $n \times m$ weight matrix must be written and read back, so for long
      sequences its memory traffic, not just its arithmetic, limits speed; optimized attention kernels
      are a key area of work [^1].
    references:
      - source: d2l
        locator: Sec. 11.3.3 Scaled Dot Product Attention; 11.3.5 Summary
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#scaled-dot-product-attention
      - source: d2l
        locator: Sec. 11.6.2 Comparing CNNs, RNNs, and Self-Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#comparing-cnns-rnns-and-self-attention
      - source: d2l
        locator: Sec. 11.3.6 Exercises, Exercise 3
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-scoring-functions#ex3
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-027
    type: single
    difficulty: medium
    tags:
      - multi-head-attention
      - pruning
      - ablation
    question: |
      You want to prune the least important heads of a trained multi-head attention model to speed
      up prediction. Which experiment measures one head's importance most directly?
    options:
      - text: Mask that head's output at test time and measure how much the validation score drops
        correct: true
      - text: Rank heads by how uniform their attention weights are, calling the most uniform the most important
        why: Uniform weights just average the values; how spread a head's weights are says nothing direct about the model's accuracy.
      - text: Rank heads by position, since later heads in the concatenation contribute less to $\mathbf{W}_o$
        why: The heads are interchangeable; their order in the concatenation is arbitrary [^2].
      - text: Measure the norm of each head's query projection $\mathbf{W}_i^{(q)}$ at initialization
        why: At initialization the weights are random and carry no information about the trained model.
    explanation: |
      Michel et al. multiply each head's output by a mask variable $\xi_h \in \{0, 1\}$; setting
      $\xi_h = 0$ removes head $h$ at test time, and the change in BLEU or accuracy measures its
      importance [^1]. They found many heads can be removed with little loss [^1]. The heads run in
      parallel and are concatenated before the output projection $\mathbf{W}_o$, so a masked head
      simply contributes a zero block [^2].
    references:
      - title: Michel, Levy & Neubig (2019), Are Sixteen Heads Really Better than One?
        url: https://arxiv.org/abs/1905.10650
        locator: Sec. 2.3 Masking Attention Heads; Sec. 3.2 Ablating One Head
      - source: d2l
        locator: Sec. 11.5.1 Model
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html#model
      - source: d2l
        locator: Sec. 11.5.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/multihead-attention#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: transformers-028
    type: single
    difficulty: medium
    tags:
      - positional-encoding
      - learned-embeddings
      - extrapolation
    question: |
      Instead of the fixed sinusoidal positional encoding, you add a learnable table
      $\mathbf{P} \in \mathbb{R}^{512 \times d}$ of position embeddings to the token embeddings, as
      BERT does. What is the main limitation compared with the sinusoidal version?
    options:
      - text: It has no row for positions past 512, while the sinusoidal formula works for any position
        correct: true
      - text: It cannot be trained, because positions are integers and their embeddings receive no gradient
        why: The rows of the table are trained by gradient descent, just like word embeddings.
      - text: It makes self-attention depend on word order, which hurts translation
        why: Making the model order-aware is the purpose of every positional encoding [^1].
      - text: It adds one parameter per pair of positions, $O(n^2)$ in total
        why: The table has $512 \times d$ entries, linear in the maximum length.
    explanation: |
      Positional encodings can be fixed or learned [^1], and BERT uses learnable ones [^2]. A learned
      table only covers the positions it has rows for, and rows for rarely seen long positions are
      poorly trained. Vaswani et al. found learned and sinusoidal encodings to perform nearly the
      same, but chose the sinusoidal version because it may extrapolate to sequences longer than those
      seen in training [^3].
    references:
      - source: d2l
        locator: Sec. 11.6.3 Positional Encoding
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
      - source: d2l
        locator: Sec. 15.8.4 Input Representation
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html#input-representation
      - title: Vaswani et al. (2017), Attention Is All You Need
        url: https://arxiv.org/abs/1706.03762
        locator: Sec. 3.5 Positional Encoding
      - source: d2l
        locator: Sec. 11.6.5 Exercises, Exercise 2
