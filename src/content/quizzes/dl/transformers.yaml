  - id: transformers-038
    type: short_answer
    difficulty: easy
    tags:
      - causal-mask
      - masked-self-attention
      - gpt
    question: |
      A GPT-style decoder applies left-to-right (causal) masking to a sequence of 6 tokens: token
      $t$ may attend only to tokens $1, \dots, t$. How many of the 36 entries of the
      $6 \times 6$ attention-weight matrix can be non-zero?
    answer:
      numeric: 21
      tolerance: 0
      hint: a whole number
      model: 'Row $t$ has $t$ allowed entries: $1 + 2 + \dots + 6 = 21$'
    explanation: |
      The mask is lower-triangular: $\text{mask}[t_x, t_z] = 1$ if $t_z \le t_x$ and 0 otherwise,
      so row $t$ keeps $t$ entries [^1]. For $\ell = 6$ that is $6 \cdot 7 / 2 = 21$ entries, the
      other 15 (the future tokens) get weight exactly 0. This is what lets the output at position
      $t$ depend only on $\mathbf{X}[1{:}t]$ and be trained to predict token $t + 1$ [^1].
    references:
      - source: trusthlt-nlp
        locator: Lecture 9 slides, frames 'Uni-directional masking for self-attention' and 'Left-to-right masked self-attention'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture09/pdf/nlpwdl2025-lecture09-handout.pdf
    source:
      id: trusthlt-nlp
      ref: lectures/lecture09/nlpwdl2025-lecture09.tex#causal-mask
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture09/pdf/nlpwdl2025-lecture09-handout.pdf
    status: reviewed
    reviewed_by: claude
  - id: transformers-039
    type: single
    difficulty: medium
    tags:
      - causal-mask
      - softmax
      - masked-self-attention
    question: |
      To stop tokens from attending to future positions, a decoder sets the scaled scores of future
      positions to $-\infty$ **before** the row-wise softmax. Why not instead compute the softmax
      normally and then set the future weights to 0?
    options:
      - text: Each row's weights would no longer sum to 1
        correct: true
      - text: The softmax of $-\infty$ is undefined, so the masking must happen afterwards
        why: $e^{-\infty} = 0$, so masked positions simply get weight 0 and the rest is renormalized; this is exactly why $-\infty$ is used [^1].
      - text: Both ways give exactly the same attention weights
        why: Zeroing after the softmax leaves the remaining weights unchanged, so they sum to less than 1 and differ from the renormalized ones [^1].
      - text: Future tokens would still change the value vectors of earlier positions
        why: Value vectors are computed per token from its own input; the problem is only in the weights, which would not be renormalized [^1].
    explanation: |
      The masked scores are replaced by $-\infty$ so that the softmax assigns them exactly zero
      probability while the allowed positions share all of the probability mass [^1]. Zeroing after
      the softmax would leave weights that were normalized over all positions, including the future
      ones, so each row would sum to less than 1 and the output would be a shrunken average.
    references:
