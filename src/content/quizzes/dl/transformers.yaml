  - id: transformers-044
    type: short_answer
    difficulty: easy
    tags:
      - pooling
      - text-classification
      - tensor-shapes
    question: |
      A transformer classifier turns the encoder output `x`, of shape `(b, t, k)` (batch, tokens, embedding size),
      into one vector per sentence by averaging over the tokens. Fill in the non-negative dimension index so that
      `sequence_avg` has shape `(b, k)`: `sequence_avg = x.mean(dim=`{{1}}`)`
    answer:
      blanks:
        - numeric: 1
          tolerance: 0
          hint: an integer
      model: '`x.mean(dim=1)` averages over the $t$ token positions'
    explanation: |
      Averaging over a dimension removes it, so the token dimension, index 1 in `(b, t, k)`, must be averaged away to
      leave `(b, k)` [^1]. The Neuromatch Academy (NMA) classifier does exactly this: the encoder outputs one vector
      per token, the mean over tokens gives a sentence embedding, and a linear layer with `log_softmax` turns it into
      class log-probabilities [^1]. (`dim=-2` would also work; `dim=2` would average over the embedding instead,
      leaving `(b, t)`.) A common alternative is to use the output of a special classification token instead of the
      mean, as BERT does [^2].
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 7 Training Transformers, Coding Exercise 7 Transformer Architecture for classification
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 11.9.1.2 Fine-Tuning BERT
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#fine-tuning-bert
