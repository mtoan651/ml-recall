  - id: transformers-029
    type: short_answer
    difficulty: medium
    tags:
      - relative-position
      - positional-encoding
      - self-attention
    question: |
      Relative position representations (Shaw et al., 2018) learn one embedding per query–key
      offset $j - i$, with the offset clipped to $[-k, k]$. With clipping distance $k = 4$, how many
      distinct offset embeddings does a layer learn for its keys, whatever the sequence length?
    answer:
      numeric: 9
      tolerance: 0
      hint: a whole number
      model: Offsets $-4, \ldots, 4$, i.e. $2k + 1 = 9$
    explanation: |
      Shaw et al. use $\mathbf{a}^K_{ij} = \mathbf{w}^K_{\mathrm{clip}(j-i,\,k)}$ with
      $\mathrm{clip}(x, k) = \max(-k, \min(k, x))$, so there are $2k + 1 = 9$ embeddings, added to
      the keys inside the attention score [^1]. Every query–key pair with the same offset shares an
      embedding, and clipping lets the model handle sequence lengths not seen in training [^1]. The
      sinusoidal encoding also supports relative positions, since position $i + \delta$ is a fixed
      linear map of position $i$ [^2].
    references:
      - title: Shaw, Uszkoreit & Vaswani (2018), Self-Attention with Relative Position Representations
        url: https://arxiv.org/abs/1803.02155
        locator: Sec. 3.2 Relative Position Representations
      - source: d2l
        locator: Sec. 11.6.3.2 Relative Positional Information
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#relative-positional-information
      - source: d2l
        locator: Sec. 11.6.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#exercises
