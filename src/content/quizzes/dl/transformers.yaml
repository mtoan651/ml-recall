  - id: transformers-048
    type: multiple
    difficulty: medium
    tags:
      - self-attention
      - rnn
      - complexity
      - parallelism
    question: |
      A sequence has length $T$. Compare one RNN layer with one self-attention layer, counting only how
      the cost grows with $T$. Select all statements that are true.
    options:
      - text: The RNN's forward pass needs $O(T)$ operations
        correct: true
      - text: The self-attention forward pass needs $O(T^2)$ operations, one score per pair of positions
        correct: true
      - text: The RNN can process all $T$ positions in parallel, because its weights are shared across time
        why: Each $h_t$ needs $h_{t-1}$, so the RNN takes $T$ sequential steps; sharing weights does not remove that dependency [^1].
      - text: Self-attention needs $O(T)$ sequential steps, one per query
        why: All queries use the same keys and values and do not depend on each other, so they are computed at once; only $O(1)$ sequential steps are needed [^1].
    explanation: |
      An RNN does a constant amount of work per step but has to take the $T$ steps one after another
      [^1]. Self-attention compares every query with every key, $O(T^2)$ work, yet all of it can run in
      parallel, so with enough parallel hardware a transformer's forward pass is faster [^1][^2]. For
      very long sequences the quadratic time and memory of attention become the bottleneck, while an
      RNN keeps a fixed-size state.
    references:
      - source: d2l
        locator: Sec. 11.6.2 Comparing CNNs, RNNs, and Self-Attention
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#comparing-cnns-rnns-and-self-attention
      - source: mit-ocw-67960
