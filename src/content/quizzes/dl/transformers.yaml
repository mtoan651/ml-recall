      A convolution has $c_o \times c_i \times k_h \times k_w$ weights plus one bias per output channel
      [^1]: $768 \cdot 3 \cdot 16 \cdot 16 + 768 = 590{,}592$. With kernel size equal to stride, the
      patches do not overlap, so this is the same as flattening each patch to $3 \cdot 16 \cdot 16 = 768$
      numbers and applying one shared linear layer; the image becomes $14 \times 14 = 196$ patch tokens
      [^2][^3].
