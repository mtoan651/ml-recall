  - id: transformers-045
    type: short_answer
    difficulty: medium
    tags:
      - positional-encoding
      - sinusoidal
    question: |
      The sinusoidal positional encoding is $PE_{(pos,\,2i)} = \sin(pos/10000^{2i/d})$ and
      $PE_{(pos,\,2i+1)} = \cos(pos/10000^{2i/d})$. With $d = 4$, what is the entry in dimension 2 (counting from 0) of
      the encoding of position $pos = 2$?
    answer:
      numeric: 0.020
      tolerance: 0.0005
      hint: a number, 3 decimals
      model: 'Dimension 2 is $2i$ with $i = 1$: $\sin(2/10000^{2/4}) = \sin(0.02) \approx 0.020$'
    explanation: |
      Dimension 2 is even, $2i = 2$, so $i = 1$ and the frequency is $1/10000^{2/4} = 1/100$; the entry is
      $\sin(2/100) = \sin(0.02) \approx 0.020$ [^1][^2]. Dimensions 0 and 1 use frequency 1 ($\sin 2 \approx 0.909$,
      $\cos 2 \approx -0.416$): low dimensions oscillate fast and high dimensions slowly, a continuous analogue of
      binary counting [^2]. The Neuromatch Academy tutorial adds this fixed encoding to the token embeddings because
      self-attention by itself ignores word order [^1].
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 6 Positional encoding
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - source: d2l
        locator: Sec. 11.6.3 Positional Encoding
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
    source:
