  - id: transformers-050
    type: short_answer
    difficulty: easy
    tags:
      - multi-head-attention
      - parameter-count
    question: |
      Multi-head attention concatenates the outputs of $n = 8$ heads, each of dimension $d_k = 64$,
      and projects the result back to the model dimension $d = 512$:
      $\mathrm{MultiHead}(x) = \mathrm{Concat}(\mathrm{head}_1, \ldots, \mathrm{head}_8)\, W_O$.
      How many weights does $W_O$ have (no bias)?
    answer:
      numeric: 262144
      tolerance: 0
      hint: a whole number
      model: $W_O \in \mathbb{R}^{(8 \cdot 64) \times 512} = \mathbb{R}^{512 \times 512}$, so $262{,}144$ weights
    explanation: |
      The concatenation has $n d_k = 8 \times 64 = 512$ entries per token, and $W_O$ maps them to the
      model dimension, so it is $512 \times 512$ [^1]. Choosing $d_k = d / n$ is the usual design: the
      total cost of all heads is then about that of one full-width head, and $W_O$ is square [^2]. Its
      job is to mix the information the separate heads gathered.
    references:
