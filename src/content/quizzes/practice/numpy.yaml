  - id: numpy-008
    type: short_answer
    difficulty: easy
    question: |
      Find the indices of the non-zero elements of `[1,2,0,0,4,0]`:
      `nz = np.`{{1}}`([1,2,0,0,4,0])` gives the indices 0, 1 and {{2}}.
    answer:
      blanks:
        - accept:
            - nonzero
            - np.nonzero
            - numpy.nonzero
            - flatnonzero
            - np.flatnonzero
            - argwhere
            - np.argwhere
            - where
            - np.where
            - numpy.where
          hint: a NumPy function name
        - numeric: 4
          hint: a number
      model: |
        ```python
        nz = np.nonzero([1,2,0,0,4,0])
        print(nz)
        ```
    explanation: |
      `np.nonzero` returns the indices of the non-zero elements as a tuple of arrays, one per
      dimension [^2]; for this 1-D input that is `(array([0, 1, 4]),)`, the numpy-100 answer [^1].
      Indices are zero-based, so the value 4 sits at index 4. `np.flatnonzero` returns the same
      indices as a single array, and `np.argwhere` groups them by element, one row each [^2].
      `np.where` called with only a condition is a shorthand for `np.nonzero` and gives the same
      result [^3].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 10
      - title: numpy.nonzero (NumPy documentation)
        url: https://numpy.org/doc/stable/reference/generated/numpy.nonzero.html
        locator: Function description (argwhere); See also (flatnonzero)
      - title: numpy.where (NumPy documentation)
        url: https://numpy.org/doc/stable/reference/generated/numpy.where.html
        locator: Note (only condition provided)
        quote: When only condition is provided, this function is a shorthand for np.asarray(condition).nonzero().
    source:
      id: numpy-100
      ref: q10
      url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
