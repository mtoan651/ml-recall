  - id: numpy-041
    type: short_answer
    difficulty: hard
    question: |
      Consider a vector `Z = np.ones(10)` and an index vector `I = np.random.randint(0, len(Z), 20)`;
      add 1 to each element indexed by `I`, counting repeated indices. Complete either solution:
      `Z += np.`{{1}}`(I, minlength=len(Z))`, or in place `np.add.`{{2}}`(Z, I, 1)`.
    answer:
      blanks:
        - accept:
            - bincount
          hint: a NumPy function name
        - accept:
            - at
          hint: a ufunc method name
      model: |
        ```python
        # Author: Brett Olsen

        Z = np.ones(10)
        I = np.random.randint(0,len(Z),20)
        Z += np.bincount(I, minlength=len(Z))
        print(Z)

        # Another solution
        # Author: Bartosz Telenczuk
        np.add.at(Z, I, 1)
        print(Z)
        ```
    explanation: |
      Plain `Z[I] += 1` adds 1 only once per distinct index: the indexed values are copied to a
      temporary, incremented, and written back [^4]. `np.bincount(I, minlength=len(Z))` counts how
      often each index occurs, with at least `len(Z)` bins, so adding it applies every repetition
      [^2]. `np.add.at` is the unbuffered in-place form of `+=` that accumulates results for indices
      that appear more than once [^3]. Both solutions come from numpy-100 [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 64
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.bincount.html
        locator: 'API reference: numpy.bincount'
        quote: Count number of occurrences of each value in array of non-negative ints.
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.ufunc.at.html
        locator: 'API reference: numpy.ufunc.at'
        quote: For example, a[[0,0]] += 1 will only increment the first element once because of buffering, whereas add.at(a, [0,0], 1) will increment the first element twice.
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/user/basics.indexing.html#assigning-values-to-indexed-arrays
        locator: 'User guide: Indexing on ndarrays, Assigning values to indexed arrays'
        quote: a new array is extracted from the original (as a temporary) containing the values at 1, 1, 3, 1, then the value 1 is added to the temporary, and then the temporary is assigned back to the original array.
    source:
