    type: short_answer
    difficulty: hard
    question: |
      How do you get the diagonal of a dot product `np.dot(A, B)` of two 5×5 matrices without
      computing the whole product? Complete the code: `np.sum(A * B.`{{1}}`, axis=`{{2}}`)`
    answer:
      blanks:
        - accept:
            - T
          hint: an array attribute
        - accept:
            - '1'
            - '-1'
          hint: an axis number
      model: |
        ```python
        # Author: Mathieu Blondel

        A = np.random.uniform(0,1,(5,5))
        B = np.random.uniform(0,1,(5,5))

        # Slow version
        np.diag(np.dot(A, B))

        # Fast version
        np.sum(A * B.T, axis=1)

        # Faster version
        np.einsum("ij,ji->i", A, B)
        ```
    explanation: |
      The i-th diagonal entry of $AB$ is $\sum_j A_{ij} B_{ji}$, row i of A times column i of B [^1].
      `B.T` is the transposed view of `B` [^2], so `A * B.T` holds the products $A_{ij} B_{ji}$
      element-wise, and summing along axis 1 adds them up within each row. This needs only $n^2$
      multiplications instead of $n^3$; `np.einsum("ij,ji->i", A, B)` does the same [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
