          hint: an axis number
        - accept:
            - keepdims
          hint: a keyword argument
      model: |
        ```python
        # Author: Warren Weckesser

        X = np.random.rand(5, 10)

        # Recent versions of numpy
        Y = X - X.mean(axis=1, keepdims=True)

        # Older versions of numpy
        Y = X - X.mean(axis=1).reshape(-1, 1)

        print(Y)
        ```
    explanation: |
      A row mean averages across the columns, i.e. along axis 1 (the last axis, so -1 works too). With
      `keepdims=True` the reduced axis is kept with size one, so the means have shape (5, 1) instead
      of (5,) [^2]. A (5, 1) array broadcasts
      against the (5, 10) matrix, so each row's mean is subtracted from every element of that row
      [^3]. Older code gets the same shape with `X.mean(axis=1).reshape(-1, 1)` [^1].
