    type: short_answer
    difficulty: hard
    question: |
      Given an arbitrary number of vectors, build the cartesian product (every combination of every
      item):

      ```python
      def cartesian(arrays):
          arrays = [np.asarray(a) for a in arrays]
          shape = (len(x) for x in arrays)
          ix = ...                                   # line (1)
          ix = ix.reshape(len(arrays), -1).T
          for n, arr in enumerate(arrays):
              ix[:, n] = arrays[n][ix[:, n]]
          return ix
      ```

      Line (1) is `ix = np.`{{1}}`(shape, dtype=int)`, and `cartesian(([1, 2, 3], [4, 5], [6, 7]))`
      returns an array with {{2}} rows.
    answer:
      blanks:
        - accept:
            - indices
          hint: a NumPy function name
        - numeric: 12
          hint: a number
      model: |
        ```python
        # Author: Stefan Van der Walt

        def cartesian(arrays):
            arrays = [np.asarray(a) for a in arrays]
            shape = (len(x) for x in arrays)

            ix = np.indices(shape, dtype=int)
            ix = ix.reshape(len(arrays), -1).T

            for n, arr in enumerate(arrays):
                ix[:, n] = arrays[n][ix[:, n]]

            return ix

        print (cartesian(([1, 2, 3], [4, 5], [6, 7])))
        ```
    explanation: |
      `np.indices(shape)` returns one grid of index values per dimension, stacked into an array of
      shape `(len(shape),) + shape` [^2]. Reshaping it to `(len(arrays), -1)` and transposing gives one
      row per combination of indices, and the loop replaces each index by the item it points to in its
      vector [^1]. The number of combinations is the product of the lengths, 3 × 2 × 2 = 12.
    references:
