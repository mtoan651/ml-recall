    question: |
      Given two arrays, X and Y, construct the Cauchy matrix C, $C_{ij} = 1/(x_i - y_j)$: with
      `X = np.arange(8)` and `Y = X + 0.5`, `C = 1.0 / np.`{{1}}`.`{{2}}`(X, Y)`. The entry
      `C[0, 0]` equals {{3}}.
    answer:
      blanks:
        - accept:
            - subtract
            - np.subtract
            - numpy.subtract
          hint: a NumPy ufunc name
        - accept:
            - outer
          hint: a ufunc method name
        - numeric: -2
          hint: a number
      model: |
        ```python
        # Author: Evgeni Burovski

        X = np.arange(8)
        Y = X + 0.5
        C = 1.0 / np.subtract.outer(X, Y)
        print(np.linalg.det(C))
        ```
    explanation: |
      The ufunc method `outer` applies the operation to every pair `(a, b)` with `a` in `A` and `b`
      in `B`, so for 1-D inputs `r[i, j] = op(A[i], B[j])` [^2]. With the ufunc `np.subtract` this
      gives the 8x8 matrix of differences $x_i - y_j$, and `1.0 /` turns it into the Cauchy matrix,
      the numpy-100 solution [^1]. For the first entry, $1/(0 - 0.5) = -2$.
    references:
