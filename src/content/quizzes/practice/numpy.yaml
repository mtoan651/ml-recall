  - id: numpy-061
    type: short_answer
    difficulty: hard
    question: |
      Convert a vector of ints into a matrix binary representation. For
      `I = np.array([0, 1, 2, 3, 15, 16, 32, 64, 128], dtype=np.uint8)`, complete
      `B = np.`{{1}}`(I[:, np.newaxis], axis=1)`; `B` has 9 rows and {{2}} columns.
    answer:
      blanks:
        - accept:
            - unpackbits
          hint: a NumPy function name
        - numeric: 8
          hint: a number
      model: |
        ```python
        # Author: Warren Weckesser

        I = np.array([0, 1, 2, 3, 15, 16, 32, 64, 128])
        B = ((I.reshape(-1,1) & (2**np.arange(8))) != 0).astype(int)
        print(B[:,::-1])

        # Author: Daniel T. McDonald

        I = np.array([0, 1, 2, 3, 15, 16, 32, 64, 128], dtype=np.uint8)
        print(np.unpackbits(I[:, np.newaxis], axis=1))
        ```
    explanation: |
      `np.unpackbits` expands each `uint8` element into its binary digits along the given axis, most
      significant bit first by default, like `bin(val)` [^2]. A byte has 8 bits, so the (9, 1) input
      becomes a (9, 8) array; 15, for example, becomes `[0, 0, 0, 0, 1, 1, 1, 1]`. For other integer
      types, numpy-100 tests each bit with `I.reshape(-1, 1) & (2**np.arange(8))` [^1].
    references:
