  - id: numpy-062
    type: short_answer
    difficulty: hard
    question: |
      Given a two-dimensional array `Z`, how do you extract its unique rows? Complete
      `uZ = np.`{{1}}`(Z, axis=`{{2}}`)`
    answer:
      blanks:
        - accept:
            - unique
          hint: a NumPy function name
        - accept:
            - '0'
          hint: an axis number
      model: |
        ```python
        # Author: Jaime Fernández del Río

        Z = np.random.randint(0,2,(6,3))
        T = np.ascontiguousarray(Z).view(np.dtype((np.void, Z.dtype.itemsize * Z.shape[1])))
        _, idx = np.unique(T, return_index=True)
        uZ = Z[idx]
        print(uZ)

        # Author: Andreas Kouzelis
        # NumPy >= 1.13
        uZ = np.unique(Z, axis=0)
        print(uZ)
        ```
    explanation: |
      With an integer `axis`, `np.unique` treats each subarray along that axis as one element, so
      `axis=0` compares whole rows and drops the duplicates [^2]. The remaining rows come back sorted
      in lexicographic order [^2]. Before `axis` existed (NumPy 1.13), the trick was to view each row
      as a single `np.void` item and call `np.unique(..., return_index=True)` [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
