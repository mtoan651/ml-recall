  - id: numpy-011
    type: short_answer
    difficulty: easy
    question: |
      Create a 10x10 array with random values and find the minimum and maximum values:
      `Z = np.random.random((10,10))`, then `Zmin, Zmax = Z.`{{1}}`(), Z.`{{2}}`()`
    answer:
      blanks:
        - accept:
            - min
          hint: an ndarray method name
        - accept:
            - max
          hint: an ndarray method name
      model: |
        ```python
        Z = np.random.random((10,10))
        Zmin, Zmax = Z.min(), Z.max()
        print(Zmin, Zmax)
        ```
    explanation: |
      The ndarray methods `min` and `max` return the minimum and maximum along an axis and are the
      method forms of `np.amin` and `np.amax` [^2] [^3]. With no axis given, the flattened array is
      used, so each returns a single value for the whole 10x10 array [^4] [^5]. This is the
      numpy-100 solution [^1].
