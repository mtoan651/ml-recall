      model: |
        ```python
        Z = np.random.random((5,5))
        Z = (Z - np.mean (Z)) / (np.std (Z))
        print(Z)
        ```
    explanation: |
      Subtracting the mean and dividing by the standard deviation standardises the values. `np.mean`
      computes the arithmetic mean of the flattened array by default [^2], and `np.std` the standard
      deviation of the flattened array [^3], so the result has mean 0 and standard deviation 1, as in
      the numpy-100 solution [^1]. Without weights, `np.average` gives the same mean, since every
      value then has weight one [^4].
