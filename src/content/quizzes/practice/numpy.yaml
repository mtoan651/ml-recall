    question: |
      Considering a 1-D vector `D`, compute the means of subsets of `D` using a vector `S` of the same
      size that gives each element's subset index. Complete the code:
      `D_sums = np.bincount(S, `{{1}}`=D)`, `D_counts = np.bincount(S)`,
      `D_means = D_sums / D_counts`. For `D = np.array([1., 2., 3., 4.])` and
      `S = np.array([0, 1, 0, 1])`, `D_means[1]` is {{2}}.
    answer:
      blanks:
        - accept:
            - weights
          hint: a keyword argument
        - numeric: 3
          hint: a number
      model: |
        ```python
        # Author: Jaime Fernández del Río

        D = np.random.uniform(0,1,100)
        S = np.random.randint(0,10,100)
        D_sums = np.bincount(S, weights=D)
        D_counts = np.bincount(S)
        D_means = D_sums / D_counts
        print(D_means)

        # Pandas solution as a reference due to more intuitive code
        import pandas as pd
        print(pd.Series(D).groupby(S).mean())
        ```
    explanation: |
      With `weights=D`, `bincount` adds `D[i]` to bin `S[i]` instead of 1, so it returns the sum of
      each subset; without weights it counts the elements of each subset [^2]. Dividing the sums by
      the counts gives the means: subset 1 holds 2 and 4, so its mean is 3. The pandas equivalent is
      `pd.Series(D).groupby(S).mean()` [^1].
