questions:
  - id: numpy-001
    type: single
    difficulty: medium
    question: You have 100 friends and you want to represent the information on how frequently they take pictures with each other. Which data structure would you use?
    options:
      - text: Numpy array
        correct: true
      - text: Pandas DataFrame
      - text: Pandas Series
    explanation: |
      The data is a $100 \times 100$ table of numbers: entry $(i, j)$ counts how often friends $i$ and
      $j$ are in a picture together. NumPy arrays are multi-dimensional arrays whose values all share
      one type, with more mathematical operations and less overhead than a DataFrame [^1], which fits
      a square matrix of counts. A Pandas Series is one-dimensional, a sequence of values with an
      index [^1], so it cannot hold the pairwise table directly.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#tabular-data-and-dataframes
        locator: 'Lesson: Working with Data: Python and the Pandas Library, Tabular Data and Dataframes; Series'
    source:
