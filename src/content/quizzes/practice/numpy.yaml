        ```python
        Z = np.arange(100)
        v = np.random.uniform(0,100)
        index = (np.abs(Z-v)).argmin()
        print(Z[index])
        ```
    explanation: |
      `np.abs`, the short name of `np.absolute`, turns `Z - v` into the distance from every element to
      `v` [^2]. `argmin` then returns the index of the smallest distance, which is the position of the
      closest value; if several elements are equally close, the first one wins [^3]. Indexing `Z` with
      that position gives the answer, as in the numpy-100 solution [^1].
