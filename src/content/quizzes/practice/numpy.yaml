  - id: numpy-007
    type: short_answer
    difficulty: easy
    question: 'Create a 3x3 matrix with values ranging from 0 to 8: `Z = np.arange(`{{1}}`).`{{2}}`(3, 3)`'
    answer:
      blanks:
        - numeric: 9
          hint: a number
        - accept:
            - reshape
          hint: an ndarray method name
      model: |
        ```python
        Z = np.arange(9).reshape(3, 3)
        print(Z)
        ```
    explanation: |
      `np.arange(9)` gives the nine values 0 to 8, because the stop value is excluded [^2]. The
      `reshape` method returns the same data with a new shape, and unlike the function
      `np.reshape` it accepts the dimensions as separate arguments, so `reshape(3, 3)` equals
      `reshape((3, 3))` [^3]. The 9 elements fill the 3x3 shape exactly, as in the numpy-100
      solution [^1].
