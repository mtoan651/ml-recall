    type: short_answer
    difficulty: hard
    question: |
      Consider an array `A` of shape (5, 5, 3); how do you multiply it by an array `B` of shape
      (5, 5)? Complete the code: `A * B[:, :, `{{1}}`]`, where the indexed `B` has shape {{2}}.
    answer:
      blanks:
        - accept:
            - None
            - np.newaxis
            - newaxis
          hint: an indexing object
        - accept:
            - (5, 5, 1)
          pattern: \(?\s*5\s*[,x×]\s*5\s*[,x×]\s*1\s*\)?
          hint: a shape, e.g. (2, 3, 4)
      model: |
        ```python
        A = np.ones((5,5,3))
        B = 2*np.ones((5,5))
        print(A * B[:,:,None])
        ```
    explanation: |
      Broadcasting compares shapes from the trailing dimension, so (5, 5, 3) against (5, 5) fails: 3
      and 5 differ and neither is 1 [^2]. Indexing with `None`, of which `np.newaxis` is an alias,
      inserts a length-1 axis at that position, turning `B` into shape (5, 5, 1) [^3]. Now the last
      dimensions are 3 and 1, so `B` is stretched along it and the product has shape (5, 5, 3) [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
