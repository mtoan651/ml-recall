  - id: numpy-060
    type: short_answer
    difficulty: hard
    question: |
      Considering a 10×3 matrix `Z = np.random.randint(0, 5, (10, 3))`, extract the rows with unequal
      values (e.g. `[2, 2, 3]`). Complete `E = np.`{{1}}`(Z[:, 1:] == Z[:, :-1], axis=1)` and
      `U = Z[~E]`, or, for numeric arrays only, `U = Z[Z.max(axis=1) != Z.`{{2}}`(axis=1), :]`.
    answer:
      blanks:
        - accept:
            - all
          hint: a NumPy function name
        - accept:
            - min
          hint: an array method name
      model: |
        ```python
        # Author: Robert Kern

        Z = np.random.randint(0,5,(10,3))
        print(Z)
        # solution for arrays of all dtypes (including string arrays and record arrays)
        E = np.all(Z[:,1:] == Z[:,:-1], axis=1)
        U = Z[~E]
        print(U)
        # soluiton for numerical arrays only, will work for any number of columns in Z
        U = Z[Z.max(axis=1) != Z.min(axis=1),:]
        print(U)
        ```
    explanation: |
      `Z[:, 1:] == Z[:, :-1]` compares each element with its left neighbour, and the logical AND along
      axis 1 is True only for rows whose values are all equal [^2]. `~E` keeps the other rows; this
      version works for any dtype, including strings [^1]. For numbers, a row has unequal values
      exactly when its maximum differs from its minimum, which `Z.min(axis=1)` gives per row [^3].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
