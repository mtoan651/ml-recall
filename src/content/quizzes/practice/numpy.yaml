  - id: numpy-022
    type: short_answer
    difficulty: medium
    question: |
      Given a 1D array, negate all elements which are between 3 and 8, in place: for
      `Z = np.arange(11)`, the statement `Z[(3 < Z)` {{1}} `(Z < 8)] *= -1` negates {{2}} elements.
    answer:
      blanks:
        - accept:
            - '&'
            - '*'
          pattern: '&|\*'
          hint: an operator symbol
        - numeric: 4
          hint: a number
      model: |
        ```python
        # Author: Evgeni Burovski

        Z = np.arange(11)
        Z[(3 < Z) & (Z < 8)] *= -1
        print(Z)
        ```
    explanation: |
      The `&` operator is shorthand for `np.bitwise_and` on ndarrays, which on boolean arrays gives
      an element-wise AND [^2]. The parentheses are needed because `&` binds more tightly than
      comparisons in Python [^3]. Python's `and` cannot be used: it asks each whole array for a single
      truth value, which NumPy refuses with a ValueError. The boolean mask selects 4, 5, 6 and 7, and
      the augmented assignment through the mask changes those elements of `Z` itself [^4], as in the
      numpy-100 solution [^1]. Multiplying the two boolean masks with `*` also gives their AND.
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
