        url: https://numpy.org/doc/stable/user/basics.indexing.html#slicing-and-striding
        locator: Basic indexing, Slicing and striding (zero-based and negative indices)
      - title: numpy.zeros (NumPy documentation)
        url: https://numpy.org/doc/stable/reference/generated/numpy.zeros.html
        locator: Function description
