            - np.eye
            - numpy.eye
            - identity
            - np.identity
            - numpy.identity
          hint: a NumPy function name
      model: |
        ```python
        Z = np.eye(3)
        print(Z)
        ```
    explanation: |
      `np.eye(N)` returns a 2-D array with ones on the diagonal and zeros elsewhere; its optional `M`
