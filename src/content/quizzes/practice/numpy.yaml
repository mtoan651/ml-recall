  - id: numpy-014
    type: short_answer
    difficulty: easy
    question: |
      Add a border (filled with 0's) around an existing array: for `Z = np.ones((5,5))`,
      `Z = np.`{{1}}`(Z, pad_width=1, mode='constant', constant_values=0)`. The result has {{2}}
      rows.
    answer:
      blanks:
        - accept:
            - pad
            - np.pad
            - numpy.pad
          hint: a NumPy function name
        - numeric: 7
          hint: a number
      model: |
        ```python
        Z = np.ones((5,5))
        Z = np.pad(Z, pad_width=1, mode='constant', constant_values=0)
        print(Z)

        # Not a solution to this problem but good to know: using fancy indexing for in-place edit
        Z[:, [0, -1]] = 0
        Z[[0, -1], :] = 0
        print(Z)
        ```
    explanation: |
      `np.pad` pads an array; an integer `pad_width` adds that many values before and after along
      every axis, and mode `'constant'` fills them with `constant_values` [^2]. One row is added above
      and one below the 5 rows, so the result is 7x7. numpy-100 also shows fancy indexing
      (`Z[:, [0, -1]] = 0`, `Z[[0, -1], :] = 0`), which overwrites the outer ring in place instead of
      adding a new border [^1].
    references:
      - source: numpy-100
