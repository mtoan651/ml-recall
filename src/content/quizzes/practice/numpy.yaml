  - id: numpy-017
    type: short_answer
    difficulty: easy
    question: |
      Create a 8x8 matrix and fill it with a checkerboard pattern: after
      `Z = np.zeros((8,8),dtype=int)` and `Z[1::2,::2] = 1` (odd rows, even columns), the even rows
      and odd columns are set with `Z[::2,`{{1}}`] = 1`. In total {{2}} cells hold a 1.
    answer:
      blanks:
        - accept:
            - 1::2
            - 1:8:2
          pattern: 1\s*:\s*(8\s*)?:\s*2
          hint: a slice start:stop:step
        - numeric: 32
          hint: a number
      model: |
        ```python
        Z = np.zeros((8,8),dtype=int)
        Z[1::2,::2] = 1
        Z[::2,1::2] = 1
        print(Z)
        ```
    explanation: |
      The slice `i:j:k` selects i, i + k, i + 2k, … below the stop, and an omitted stop defaults to the
      axis length when the step is positive [^2]. So `1::2` picks the odd indices 1, 3, 5, 7 and `::2`
      the even indices 0, 2, 4, 6. Each assignment sets $4 \times 4 = 16$ cells, 32 in total, which
      is half of the 64 squares, as in the numpy-100 solution [^1].
    references:
      - source: numpy-100
