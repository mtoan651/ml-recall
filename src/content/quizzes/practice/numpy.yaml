    question: |
      How do you compute averages using a sliding window over an array? Complete the code:
      `np.lib.stride_tricks.`{{1}}`(Z, window_shape=3).mean(axis=-1)`; for `Z = np.arange(20)` it
      returns {{2}} averages.
    answer:
      blanks:
        - accept:
            - sliding_window_view
          hint: a function name
        - numeric: 18
          hint: a number
      model: |
        ```python
        # Author: Jaime Fernández del Río

        def moving_average(a, n=3) :
            ret = np.cumsum(a, dtype=float)
            ret[n:] = ret[n:] - ret[:-n]
            return ret[n - 1:] / n
        Z = np.arange(20)
        print(moving_average(Z, n=3))

        # Author: Jeff Luo (@Jeff1999)
        # make sure your NumPy >= 1.20.0

        from numpy.lib.stride_tricks import sliding_window_view

        Z = np.arange(20)
        print(sliding_window_view(Z, window_shape=3).mean(axis=-1))
        ```
    explanation: |
      `sliding_window_view` returns a view holding the array at every window position, with the
      window dimension added at the end [^2]. Each axis is shortened by the window size minus one, so
      20 elements give 20 − 2 = 18 windows of length 3, and `.mean(axis=-1)` averages each window
      [^2]. The older numpy-100 solution subtracts a cumulative sum from itself shifted by `n` to get
      each window's sum [^1].
