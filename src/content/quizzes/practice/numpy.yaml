    type: short_answer
    difficulty: medium
    question: |
      Compute `((A+B)*(-A/2))` in place (without copy), starting from `A = np.ones(3)*1` and
      `B = np.ones(3)*2`: `np.add(A,B,`{{1}}`=B)`, `np.divide(A,2,out=A)`, `np.`{{2}}`(A,out=A)`,
      `np.multiply(A,B,out=A)`. Afterwards every element of `A` equals {{3}}.
    answer:
      blanks:
        - accept:
            - out
          hint: a keyword argument name
        - accept:
            - negative
            - np.negative
            - numpy.negative
          hint: a NumPy function name
        - numeric: -1.5
          hint: a number
      model: |
        ```python
        A = np.ones(3)*1
        B = np.ones(3)*2
        np.add(A,B,out=B)
        np.divide(A,2,out=A)
        np.negative(A,out=A)
        np.multiply(A,B,out=A)
        ```
    explanation: |
      Every ufunc accepts an `out` argument, the array where the result is stored; when it is given,
      no new array is allocated, which saves memory on large calculations [^2]. `np.negative` is
      element-wise numerical negation [^3]. Step by step: `B` becomes 1 + 2 = 3, then `A` becomes
      1/2 = 0.5, then -0.5, and finally $-0.5 \times 3 = -1.5$, the numpy-100 sequence [^1].
    references:
