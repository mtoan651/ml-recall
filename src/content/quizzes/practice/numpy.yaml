  - id: numpy-004
    type: short_answer
    difficulty: easy
    question: |
      Create a null vector of size 10 but the fifth value which is 1: after `Z = np.zeros(10)`,
      set `Z[`{{1}}`] = 1`.
    answer:
      blanks:
        - accept:
            - '4'
            - '-6'
          pattern: 4|-6
          hint: an integer index
      model: |
        ```python
        Z = np.zeros(10)
        Z[4] = 1
        print(Z)
        ```
    explanation: |
      NumPy indices are zero-based: for a dimension of length 10 the valid indices are 0 to 9, so the
      fifth element has index 4 [^2]. Negative indices count from the end ($n_i + d_i$), so `Z[-6]`
      reaches the same element [^2]. `np.zeros(10)` supplies the ten zeros to start from [^3], as in
      the numpy-100 solution [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
