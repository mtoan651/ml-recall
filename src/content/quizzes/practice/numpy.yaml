  - id: numpy-040
    type: short_answer
    difficulty: medium
    question: |
      How do you tell if a 2D array `Z = np.random.randint(0, 3, (3, 10))` has null (all-zero)
      columns? Complete the code: `print((~Z.`{{1}}`(axis=`{{2}}`)).any())`
    answer:
      blanks:
        - accept:
            - any
          hint: an array method name
        - accept:
            - '0'
          hint: an axis number
      model: |
        ```python
        # Author: Warren Weckesser

        # null : 0
        Z = np.random.randint(0,3,(3,10))
        print((~Z.any(axis=0)).any())

        # null : np.nan
        Z=np.array([
            [0,1,np.nan],
            [1,2,np.nan],
            [4,5,np.nan]
        ])
        print(np.isnan(Z).all(axis=0))
        ```
    explanation: |
      `Z.any(axis=0)` performs a logical OR down each column, so it is False only for a column whose
      entries are all zero [^2]. The `~` turns that into True for the null columns, and the final
      `.any()` reports whether at least one exists [^1]. When "null" means NaN, use
      `np.isnan(Z).all(axis=0)`, a logical AND down each column of the NaN mask [^3].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
