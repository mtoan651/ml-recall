  - id: numpy-023
    type: short_answer
    difficulty: medium
    question: |
      What are the results of the following expressions? Answer a number or `nan`.

      - `np.array(0) / np.array(0)` → {{1}}
      - `np.array(0) // np.array(0)` → {{2}}

      (The third numpy-100 expression, `np.array([np.nan]).astype(int).astype(float)`, has no
      meaningful value: NaN has no integer representation, and on x86-64 it gives
      `array([-9.22337204e+18])`.)
    answer:
      blanks:
        - accept:
            - nan
            - np.nan
          hint: a number or nan
        - numeric: 0
          accept:
            - '0'
          hint: a number or nan
      model: |
        ```python
        print(np.array(0) / np.array(0))
        print(np.array(0) // np.array(0))
        print(np.array([np.nan]).astype(int).astype(float))
        ```
    explanation: |
      NumPy does not raise on division by zero: by default it only emits a RuntimeWarning for
      `invalid` (an operation that produces NaN) and for `divide` errors, and integer division by
      zero goes through the same machinery [^2]. True division 0/0 is invalid and gives `nan`, while
      integer floor division by zero returns 0 together with a "divide by zero" warning. `astype`
      uses `'unsafe'` casting by default, which allows any conversion [^3], so casting NaN to an
      integer silently produces a meaningless number. numpy-100 lists all three [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
