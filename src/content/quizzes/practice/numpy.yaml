    type: short_answer
    difficulty: medium
    question: |
      Consider a random 10x2 matrix representing cartesian coordinates, convert them to polar
      coordinates: with `X,Y = Z[:,0], Z[:,1]`, `R = np.`{{1}}`(X**2+Y**2)` and
      `T = np.`{{2}}`(Y,X)`. For the point (X, Y) = (-1, 0), `T` is {{3}} radians.
    answer:
      blanks:
        - accept:
            - sqrt
            - np.sqrt
            - numpy.sqrt
          hint: a NumPy function name
        - accept:
            - arctan2
            - np.arctan2
            - atan2
            - np.atan2
          hint: a NumPy function name
        - numeric: 3.14159
          tolerance: 0.005
          accept:
            - pi
            - π
            - np.pi
          hint: a number, 2 or more decimals
      model: |
        ```python
        Z = np.random.random((10,2))
        X,Y = Z[:,0], Z[:,1]
        R = np.sqrt(X**2+Y**2)
        T = np.arctan2(Y,X)
        print(R)
        print(T)
        ```
    explanation: |
      The radius is the non-negative square root of $x^2 + y^2$ [^2]. `np.arctan2(x1, x2)` returns
      the signed angle of the point (x2, x1), so the y-coordinate comes first, and it picks the
      quadrant correctly, giving angles in $[-\pi, \pi]$ [^3]. The point (-1, 0) lies on the negative
      x-axis, so its angle is $\pi \approx 3.14159$, whereas a plain `arctan(Y/X)` would give 0.
      numpy-100 uses exactly these two calls [^1].
