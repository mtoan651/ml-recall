    question: |
      Compute a matrix rank. Complete `np.linalg.`{{1}}`(Z)`; for `Z = np.arange(16).reshape(4, 4)`
      it returns {{2}}.
    answer:
      blanks:
        - accept:
            - matrix_rank
          hint: a function name
        - numeric: 2
          hint: a number
      model: |
        ```python
        # Author: Stefan van der Walt

        Z = np.random.uniform(0,1,(10,10))
        U, S, V = np.linalg.svd(Z) # Singular Value Decomposition
        threshold = len(S) * S.max() * np.finfo(S.dtype).eps
        rank = np.sum(S > threshold)
        print(rank)

        # alternative solution:
        # Author: Jeff Luo (@Jeff1999)

        rank = np.linalg.matrix_rank(Z)
        print(rank)
        ```
    explanation: |
      `np.linalg.matrix_rank` computes the singular values and counts those above a tolerance, by
      default `S.max() * max(M, N) * eps` [^2]. Row k of `np.arange(16).reshape(4, 4)` is
      `[0, 1, 2, 3] + 4k * [1, 1, 1, 1]`, so all rows lie in the span of two vectors and the rank is 2.
      The numpy-100 solution does the same by hand with `np.linalg.svd` and a threshold [^1].
