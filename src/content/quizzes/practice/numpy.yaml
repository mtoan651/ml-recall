    question: |
      Consider the vector `Z = np.array([1, 2, 3, 4, 5])`; build a new vector with `nz = 3`
      consecutive zeros interleaved between each value. Complete the code:
      `Z0 = np.zeros(`{{1}}`)`, then `Z0[::`{{2}}`] = Z`.
    answer:
      blanks:
        - numeric: 17
          hint: a number
        - numeric: 4
          accept:
            - nz+1
            - 1+nz
          hint: the slice step
      model: |
        ```python
        # Author: Warren Weckesser

        Z = np.array([1,2,3,4,5])
        nz = 3
        Z0 = np.zeros(len(Z) + (len(Z)-1)*(nz))
        Z0[::nz+1] = Z
        print(Z0)
        ```
    explanation: |
      Five values with three zeros in each of the four gaps need $5 + 4 \times 3 = 17$ slots, which is
      `len(Z) + (len(Z) - 1) * nz` [^1]. A slice `i:j:k` selects the elements i, i + k, i + 2k, … [^2],
      so `Z0[::4]` addresses positions 0, 4, 8, 12 and 16; assigning `Z` there leaves three zeros
      between neighbouring values.
