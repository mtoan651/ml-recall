    question: |
      Consider a 1-D array `a`; build a 2-D array whose first row is `(a[0], a[1], a[2])` and each
      subsequent row is shifted by 1 (the last row is `(a[-3], a[-2], a[-1])`). With
      `shape = (a.size - window + 1, window)` and `strides = (a.strides[0], a.strides[0])`, complete
      `stride_tricks.`{{1}}`(a, shape=shape, strides=strides)`; for `a = np.arange(10)` and
      `window = 3` the result has {{2}} rows.
    answer:
      blanks:
        - accept:
            - as_strided
          hint: a function name
        - numeric: 8
          hint: a number
      model: |
        ```python
        # Author: Joe Kington / Erik Rigtorp
        from numpy.lib import stride_tricks

        def rolling(a, window):
            shape = (a.size - window + 1, window)
            strides = (a.strides[0], a.strides[0])
            return stride_tricks.as_strided(a, shape=shape, strides=strides)
        Z = rolling(np.arange(10), 3)
        print(Z)

        # Author: Jeff Luo (@Jeff1999)

        Z = np.arange(10)
        print(sliding_window_view(Z, window_shape=3))
        ```
    explanation: |
      `as_strided` creates a view of the same memory with exactly the shape and strides you pass,
      without copying [^2]. Strides are the bytes to step in each dimension [^3]; using the element
      stride `a.strides[0]` for both axes means one step down a column or along a row advances by one
      element, so row r starts at `a[r]`. Ten elements with windows of 3 give 10 − 3 + 1 = 8 rows;
      `sliding_window_view(a, window_shape=3)` is the safer modern equivalent [^1].
