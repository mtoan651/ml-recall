      `argsort` returns the indices that would sort an array, not the sorted values [^2]. Column 1
      holds 9, 2 and 6, so `Z[:, 1].argsort()` is `[1, 2, 0]`; indexing `Z` with it reorders whole
      rows, and the first row of the result is `[8, 2, 5]` [^1].
