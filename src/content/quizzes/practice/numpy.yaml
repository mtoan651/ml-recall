  - id: numpy-043
    type: short_answer
    difficulty: hard
    question: |
      Considering a four-dimensional array `A = np.random.randint(0, 10, (3, 4, 3, 4))`, how do you
      get the sum over the last two axes at once? Complete `A.sum(axis=`{{1}}`)`, which returns an
      array of shape (3, 4).
    answer:
      blanks:
        - accept:
            - (-2, -1)
            - (2, 3)
          pattern: \(\s*((2|-2)\s*,\s*(3|-1)|(3|-1)\s*,\s*(2|-2))\s*,?\s*\)
          hint: a tuple of two axis numbers, e.g. (0, 1)
      model: |
        ```python
        A = np.random.randint(0,10,(3,4,3,4))
        # solution by passing a tuple of axes (introduced in numpy 1.7.0)
        sum = A.sum(axis=(-2,-1))
        print(sum)
        # solution by flattening the last two dimensions into one
        # (useful for functions that don't accept tuples for axis argument)
        sum = A.reshape(A.shape[:-2] + (-1,)).sum(axis=-1)
        print(sum)
        ```
    explanation: |
      The `axis` argument of `sum` may be a tuple of ints, and the sum is then taken over every axis
      in the tuple at once [^2]. Negative axes count from the last one, so `(-2, -1)` and `(2, 3)`
      name the same two trailing axes of a 4-D array, leaving shape (3, 4) [^2]. For functions that
      accept only one axis, numpy-100 flattens the last two dimensions with
      `A.reshape(A.shape[:-2] + (-1,))` and sums over `axis=-1` [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 67
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.sum.html
        locator: 'API reference: numpy.sum (axis)'
        quote: If axis is negative it counts from the last to the first axis. If axis is a tuple of ints, a sum is performed on all of the axes specified in the tuple
    source:
