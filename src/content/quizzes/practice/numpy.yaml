  - id: numpy-010
    type: short_answer
    difficulty: easy
    question: |
      Create a 3x3x3 array with random values: `Z = np.random.`{{1}}`((3,3,3))` fills it with
      floats drawn uniformly from the half-open interval [0.0, {{2}}).
    answer:
      blanks:
        - accept:
            - random
            - random_sample
            - sample
            - ranf
          hint: a function name in np.random
        - numeric: 1
          hint: a number
      model: |
        ```python
        Z = np.random.random((3,3,3))
        print(Z)
        ```
    explanation: |
      `np.random.random(size)` returns random floats in the half-open interval [0.0, 1.0); it is an
      alias of `random_sample` [^2]. A size tuple `(m, n, k)` draws $m \cdot n \cdot k$ samples in
      that shape, so `(3,3,3)` gives 27 values in a 3x3x3 array [^3]. This is the numpy-100
      solution [^1]; new code should prefer the `random` method of a Generator, e.g.
      `np.random.default_rng().random((3,3,3))` [^3].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
