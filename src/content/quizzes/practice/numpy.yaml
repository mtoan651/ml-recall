  - id: numpy-037
    type: short_answer
    difficulty: medium
    question: |
      Generate a generic 2D Gaussian-like array on a 10×10 grid over $[-1, 1]^2$. Complete the code:
      `X, Y = np.`{{1}}`(np.linspace(-1, 1, 10), np.linspace(-1, 1, 10))`, then
      `G = np.`{{2}}`(-((X - mu)**2 + (Y - mu)**2) / (2.0 * sigma**2))` with `sigma, mu = 1.0, 0.0`.
    answer:
      blanks:
        - accept:
            - meshgrid
          hint: a NumPy function name
        - accept:
            - exp
          hint: a NumPy function name
      model: |
        ```python
        X, Y = np.meshgrid(np.linspace(-1, 1, 10), np.linspace(-1, 1, 10))
        sigma, mu = 1.0, 0.0
        G = np.exp(-((X - mu) ** 2 + (Y - mu) ** 2) / (2.0 * sigma**2))
        print(G)

        # Another solution using the fact that a 2D Gaussian is separable
        # Author: Nin17
        x = np.linspace(-1, 1, 10)
        y = np.linspace(-1, 1, 10)
        gx = np.exp(-((x - mu) ** 2 / (2.0 * sigma**2)))
        gy = np.exp(-((y - mu) ** 2 / (2.0 * sigma**2)))
        G = gy[:, None] * gx[None, :]
        print(G)
        ```
    explanation: |
      `np.meshgrid` turns the two 1-D coordinate vectors into 2-D coordinate matrices `X` and `Y`, each
      of shape (10, 10), so the formula can be evaluated at every grid point at once [^2]. `np.exp` is
      applied element-wise to $-\frac{(X-\mu)^2 + (Y-\mu)^2}{2\sigma^2}$, giving a bump centred at
      $(\mu, \mu)$ [^3]. Because a 2-D Gaussian is separable, the same array is also the outer product
      of two 1-D Gaussians [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 56
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.meshgrid.html
        locator: 'API reference: numpy.meshgrid'
        quote: Return a tuple of coordinate matrices from coordinate vectors.
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.exp.html
        locator: 'API reference: numpy.exp'
        quote: Calculate the exponential of all elements in the input array.
    source:
