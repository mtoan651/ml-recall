    explanation: |
      Given a 1-D array `v`, `np.diag(v, k)` builds a 2-D array with `v` on the k-th diagonal, and
      `k < 0` selects a diagonal below the main one [^2]. `1+np.arange(4)` is `[1, 2, 3, 4]`; placed on
      the first sub-diagonal (`k=-1`) it needs a 5x5 matrix, as in the numpy-100 solution [^1].
      `np.diagflat` with the same arguments gives the same matrix [^3].
