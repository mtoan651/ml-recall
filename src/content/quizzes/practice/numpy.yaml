    question: |
      How do you swap two rows of an array? For `A = np.arange(25).reshape(5, 5)`, complete
      `A[[0, 1]] = A[`{{1}}`]`; afterwards `A[0, 0]` is {{2}}.
    answer:
      blanks:
        - accept:
            - '[1, 0]'
          pattern: \[\s*1\s*,\s*0\s*,?\s*\]
          hint: a list of row indices, e.g. [2, 3]
        - numeric: 5
          hint: a number
      model: |
        ```python
        # Author: Eelco Hoogendoorn

        A = np.arange(25).reshape(5,5)
        A[[0,1]] = A[[1,0]]
        print(A)
        ```
    explanation: |
      Indexing with a list of integers is advanced indexing, which always returns a copy of the data
      [^2]. So `A[[1, 0]]` first copies rows 1 and 0, and the assignment writes them into rows 0 and
      1, swapping them without a temporary variable [^1]. Row 1 was `[5, 6, 7, 8, 9]`, so `A[0, 0]`
      becomes 5.
