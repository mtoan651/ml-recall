        locator: 'API reference: numpy.all'
        quote: Test whether all array elements along a given axis evaluate to True.
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.min.html
        locator: 'API reference: numpy.min'
        quote: Return the minimum of an array or minimum along an axis.
