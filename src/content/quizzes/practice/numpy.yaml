  - id: numpy-035
    type: short_answer
    difficulty: medium
    question: |
      Consider a random array `Z = np.random.random((10, 2))` of 2-D coordinates; find the
      point-by-point distances. Complete the code: `X, Y = np.`{{1}}`(Z[:, 0], Z[:, 1])` turns each
      coordinate column into a row of shape (1, 10), and `D = np.sqrt((X - X.T)**2 + (Y - Y.T)**2)`
      then has shape {{2}}.
    answer:
      blanks:
        - accept:
            - atleast_2d
          hint: a NumPy function name
        - accept:
            - (10, 10)
          pattern: \(?\s*10\s*[,x×]\s*10\s*\)?
          hint: a shape, e.g. (3, 4)
      model: |
        ```python
        Z = np.random.random((10,2))
        X,Y = np.atleast_2d(Z[:,0], Z[:,1])
        D = np.sqrt( (X-X.T)**2 + (Y-Y.T)**2)
        print(D)

        # Much faster with scipy
        import scipy
        # Thanks Gavin Heverly-Coulson (#issue 1)
        import scipy.spatial

        Z = np.random.random((10,2))
        D = scipy.spatial.distance.cdist(Z,Z)
        print(D)
        ```
    explanation: |
      `np.atleast_2d` views each 1-D input as an array with at least two dimensions, so a column of 10
      coordinates becomes a row of shape (1, 10) [^2]. In `X - X.T` the shapes (1, 10) and (10, 1) are
      compatible because one of each pair of dimensions is 1; both are stretched, giving a (10, 10)
      array whose entry `[i, j]` involves points `i` and `j` [^3]. `scipy.spatial.distance.cdist(Z, Z)`
      computes the same matrix faster [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
