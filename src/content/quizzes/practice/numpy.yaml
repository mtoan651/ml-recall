  - id: numpy-042
    type: short_answer
    difficulty: hard
    question: |
      How do you accumulate the elements of a vector `X` into an array `F` based on an index list
      `I`? With `X = [1, 2, 3, 4, 5, 6]` and `I = [1, 3, 9, 3, 4, 1]`, complete
      `F = np.`{{1}}`(I, X)`; then `F[1]` is {{2}}.
    answer:
      blanks:
        - accept:
            - bincount
          hint: a NumPy function name
        - numeric: 7
          hint: a number
      model: |
        ```python
        # Author: Alan G Isaac

        X = [1,2,3,4,5,6]
        I = [1,3,9,3,4,1]
        F = np.bincount(I,X)
        print(F)
        ```
    explanation: |
      The second argument of `np.bincount` is `weights`: for every position `i` it adds `X[i]` to bin
      `I[i]` instead of adding 1, and the output has `max(I) + 1` bins [^2]. Index 1 occurs at
      positions 0 and 5, so `F[1] = 1 + 6 = 7`, and the whole result is
      `[0, 7, 0, 6, 5, 0, 0, 0, 0, 3]` [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 65
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.bincount.html
        locator: 'API reference: numpy.bincount'
        quote: If weights is specified the input array is weighted by it, i.e. if a value n is found at position i, out[n] += weight[i] instead of out[n] += 1.
