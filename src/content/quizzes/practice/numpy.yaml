    question: |
      How do you get the n largest values of an array? With `Z = np.arange(10000)` shuffled by
      `np.random.shuffle(Z)` and `n = 5`, complete `Z[np.`{{1}}`(-Z, n)[:n]]`; the smallest value in
      the result is {{2}}.
    answer:
      blanks:
        - accept:
            - argpartition
          hint: a NumPy function name
        - numeric: 9995
          hint: a number
      model: |
        ```python
        Z = np.arange(10000)
        np.random.shuffle(Z)
        n = 5

        # Slow
        print (Z[np.argsort(Z)[-n:]])

        # Fast
        print (Z[np.argpartition(-Z,n)[:n]])
        ```
    explanation: |
      `np.argpartition(a, kth)` returns indices that put the k-th element in its sorted position, with
      all smaller elements before it and all larger ones after, without sorting the rest [^2].
      Partitioning `-Z` at `n` moves the n smallest values of `-Z`, which are the n largest of `Z`,
      into the first n positions, so the result holds 9995 to 9999 in no guaranteed order [^2]. This is
      faster than the full sort `Z[np.argsort(Z)[-n:]]` [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
