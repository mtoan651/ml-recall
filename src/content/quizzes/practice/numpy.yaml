    type: short_answer
    difficulty: easy
    question: |
      Multiply a 5x3 matrix by a 3x2 matrix (real matrix product):
      `Z = np.`{{1}}`(np.ones((5,3)), np.ones((3,2)))`, or with an operator,
      `Z = np.ones((5,3))` {{2}} `np.ones((3,2))`. Every entry of the 5x2 result equals {{3}}.
    answer:
      blanks:
        - accept:
            - matmul
            - np.matmul
            - numpy.matmul
            - dot
            - np.dot
            - numpy.dot
          hint: a NumPy function name
        - accept:
            - '@'
          pattern: '@'
          hint: an operator symbol
        - numeric: 3
          hint: a number
      model: |
        ```python
        Z = np.matmul(np.ones((5, 3)), np.ones((3, 2)))
        print(Z)

        # Alternative solution, in Python 3.5 and above
        Z = np.ones((5,3)) @ np.ones((3,2))
        print(Z)
        ```
    explanation: |
      `np.matmul` computes the matrix product, and the `@` operator is its shorthand on ndarrays [^2].
      Each entry of the result sums the products along the shared dimension of length 3, so with all
      ones every entry is $1 \cdot 1 + 1 \cdot 1 + 1 \cdot 1 = 3$. numpy-100 gives both forms [^1].
      For 2-D arrays `np.dot` is also matrix multiplication, though `matmul` or `@` is
      preferred [^3].
