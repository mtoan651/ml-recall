  - id: numpy-018
    type: short_answer
    difficulty: medium
    question: |
      Consider a (6,7,8) shape array, what is the index (x,y,z) of the 100th element?
      `np.`{{1}}`(99, (6,7,8))` returns {{2}}.
    answer:
      blanks:
        - accept:
            - unravel_index
            - np.unravel_index
            - numpy.unravel_index
          hint: a NumPy function name
        - accept:
            - (1, 5, 3)
          pattern: \(?\s*1\s*,\s*5\s*,\s*3\s*\)?
          hint: three integers, e.g. (0, 2, 6)
      model: |
        ```python
        print(np.unravel_index(99,(6,7,8)))
        ```
    explanation: |
      `np.unravel_index` converts a flat index into a tuple of coordinates for a given shape,
      row-major (C order) by default [^2]. The 100th element has flat index 99, since indexing is
      zero-based, and in C order the last index changes fastest [^3]. With strides of $7 \cdot 8 = 56$
      and 8, $99 = 1 \cdot 56 + 5 \cdot 8 + 3$, so the index is (1, 5, 3), as numpy-100 prints [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
