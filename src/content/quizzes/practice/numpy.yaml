        url: https://numpy.org/doc/stable/user/basics.indexing.html#slicing-and-striding
        locator: Basic indexing, Slicing and striding (i:j:k, negative k, defaults)
      - title: numpy.flip (NumPy documentation)
        url: https://numpy.org/doc/stable/reference/generated/numpy.flip.html
        locator: Returns; Notes (flip(m) corresponds to m[::-1, ...])
    source:
