  - id: numpy-063
    type: short_answer
    difficulty: hard
    question: |
      Considering two vectors `A` and `B`, write the einsum equivalents of sum, mul, inner and outer:
      `np.sum(A)` is `np.einsum('`{{1}}`', A)`, `A * B` is `np.einsum('`{{2}}`', A, B)`,
      `np.inner(A, B)` is `np.einsum('`{{3}}`', A, B)`, and `np.outer(A, B)` is
      `np.einsum('`{{4}}`', A, B)`.
    answer:
      blanks:
        - accept:
            - i->
          hint: einsum subscripts with the label i
          pattern: i\s*->
        - accept:
            - i,i->i
          hint: einsum subscripts with the label i
          pattern: i\s*,\s*i\s*->\s*i
        - accept:
            - i,i
            - i,i->
          hint: einsum subscripts with the label i
          pattern: i\s*,\s*i(\s*->)?
        - accept:
            - i,j->ij
            - i,j
          hint: einsum subscripts with the labels i and j
          pattern: i\s*,\s*j(\s*->\s*ij)?
      model: |
        ```python
        # Author: Alex Riley
        # Make sure to read: http://ajcr.net/Basic-guide-to-einsum/

        A = np.random.uniform(0,1,10)
        B = np.random.uniform(0,1,10)

        np.einsum('i->', A)       # np.sum(A)
        np.einsum('i,i->i', A, B) # A * B
        np.einsum('i,i', A, B)    # np.inner(A, B)
        np.einsum('i,j->ij', A, B)    # np.outer(A, B)
        ```
    explanation: |
      A label repeated across operands is summed, so `'i,i'` is the inner product, while a label that
      appears only once is kept, so `'i'` alone just returns `A` [^2]. An explicit `->` fixes the
      output labels: `'i->'` has none and sums everything, and `'i,i->i'` keeps `i`, giving the
      element-wise product [^2]. `'i,j->ij'` uses two different labels, so nothing is summed and every
      pair is multiplied, which is the outer product [^1].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 97
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.einsum.html
        locator: 'API reference: numpy.einsum (Notes)'
        quote: Whenever a label is repeated it is summed, so np.einsum('i,i', a, b) is equivalent to np.inner(a,b). If a label appears only once, it is not summed
    source:
      id: numpy-100
      ref: q97
      url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
    status: draft
  - id: numpy-064
    type: short_answer
    difficulty: hard
    question: |
      Compute bootstrapped 95% confidence intervals for the mean of a 1-D array `X`: resample the
      elements with replacement N times, compute the mean of each sample, then take percentiles of the
      means.

      ```python
      X = np.random.randn(100)  # random 1D array
      N = 1000                  # number of bootstrap samples
      idx = np.random.randint(0, X.size, (N, X.size))
      means = X[idx].mean(axis=1)
      ```

      Complete the last line: `confint = np.`{{1}}`(means, [`{{2}}`, `{{3}}`])`
    answer:
      blanks:
        - accept:
            - percentile
          hint: a NumPy function name
        - numeric: 2.5
          hint: a number
        - numeric: 97.5
          hint: a number
      model: |
        ```python
        # Author: Jessica B. Hamrick

        X = np.random.randn(100) # random 1D array
        N = 1000 # number of bootstrap samples
        idx = np.random.randint(0, X.size, (N, X.size))
        means = X[idx].mean(axis=1)
        confint = np.percentile(means, [2.5, 97.5])
        print(confint)
        ```
    explanation: |
      Each row of `idx` holds `X.size` positions drawn with replacement, so `X[idx]` is an (N, 100)
      array of bootstrap samples and `.mean(axis=1)` gives N sample means [^1]. A central 95% interval
      leaves 2.5% in each tail, so its ends are the 2.5th and 97.5th percentiles of those means.
      `np.percentile` takes percentages between 0 and 100; `np.quantile` is the same with q in [0, 1],
      i.e. 0.025 and 0.975 [^2].
    references:
      - source: numpy-100
        url: https://github.com/rougier/numpy-100/blob/8ca28aaefca69a32ad3ccbbd01c7c9a785c2d5c1/100_Numpy_exercises_with_solutions.md
        locator: Exercise 100
      - title: NumPy documentation (v2.5)
        url: https://numpy.org/doc/stable/reference/generated/numpy.percentile.html
        locator: 'API reference: numpy.percentile'
        quote: Percentage or sequence of percentages for the percentiles to compute. Values must be between 0 and 100 inclusive.
