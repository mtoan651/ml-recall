        ```
    explanation: |
      `np.power(x, 3)` raises each element to the third power [^2]. In `einsum`, a label repeated
      across operands is normally summed, but the explicit output `->i` keeps it, so the three
      operands are multiplied element-wise; plain `'i,i,i'` would return the scalar sum of the cubes
      [^3]. numpy-100 compares the speed of the three versions with `%timeit` [^1].
