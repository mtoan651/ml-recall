    type: short_answer
    difficulty: hard
    question: |
      Consider a set of p matrices of shape (n, n) and a set of p vectors of shape (n, 1); compute
      the sum of the p matrix products at once (the result has shape (n, 1)). With `p, n = 10, 20`,
      `M = np.ones((p, n, n))` and `V = np.ones((p, n, 1))`, complete
      `S = np.`{{1}}`(M, V, axes=[[0, 2], [0, 1]])`; every entry of `S` is then {{2}}.
    answer:
      blanks:
        - accept:
            - tensordot
          hint: a NumPy function name
        - numeric: 200
          hint: a number
      model: |
        ```python
        # Author: Stefan van der Walt

        p, n = 10, 20
        M = np.ones((p,n,n))
        V = np.ones((p,n,1))
        S = np.tensordot(M, V, axes=[[0, 2], [0, 1]])
        print(S)

        # It works, because:
        # M is (p,n,n)
        # V is (p,n,1)
        # Thus, summing over the paired axes 0 and 0 (of M and V independently),
        # and 2 and 1, to remain with a (n,1) vector.
        ```
    explanation: |
      `np.tensordot` multiplies the elements of the two arrays and sums over the axes listed for each
      operand [^2]. Pairing axis 0 of both (the p items) and axis 2 of `M` with axis 1 of `V` (the
      matrix–vector product) leaves axis 1 of `M` and axis 2 of `V`, so `S` has shape (n, 1) and equals
      $\sum_k M_k V_k$ [^1]. With all-ones inputs, each entry adds up $p \times n = 10 \times 20 = 200$
      products of ones.
