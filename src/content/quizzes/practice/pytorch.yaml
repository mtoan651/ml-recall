  - id: pytorch-057
    type: short_answer
    difficulty: medium
    tags:
      - cross-entropy
      - initial-loss
      - sanity-check
    question: |
      A freshly initialized 3-class classifier outputs logits that are all (close to) 0. What value of
      `nn.CrossEntropyLoss()` should you expect at the very first training step? Give 3 decimals.
    answer:
      numeric: 1.099
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $-\ln(1/3) = \ln 3 \approx 1.099$
    explanation: |
      Equal logits give the uniform distribution $1/3$ over the classes, so the cross-entropy of any
      label is $-\ln(1/3) = \ln 3 \approx 1.099$ [^1][^2]. Checking that the first loss is near
      $\ln K$ for $K$ classes (0.693 for two classes) is a quick sanity test of a training loop [^3]. A
      first loss far above $\ln K$ means the untrained model is already confident about some classes,
      a sign that its last layer is not initialized well [^3].
    references:
      - title: torch.nn.CrossEntropyLoss (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
        locator: torch.nn.CrossEntropyLoss (loss for class-index targets)
      - source: d2l
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
      - title: Karpathy (2019), A Recipe for Training Neural Networks
        url: http://karpathy.github.io/2019/04/25/recipe/
        locator: Sec. 2 "Set up the end-to-end training/evaluation skeleton + get dumb baselines", tip "verify loss @ init"
