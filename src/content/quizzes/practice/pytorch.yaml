  - id: pytorch-060
    type: short_answer
    difficulty: medium
    tags:
      - cnn
      - flatten
      - tensor-shapes
      - tinyvgg
    question: |
      A TinyVGG-style model gets RGB images of $64 \times 64$ pixels. It has two blocks, each made of two
      `nn.Conv2d(..., out_channels=10, kernel_size=3, stride=1, padding=1)` + ReLU followed by
      `nn.MaxPool2d(kernel_size=2)`. Then `nn.Flatten()` feeds an `nn.Linear(in_features=?, 10)`.
      What must `in_features` be?
    answer:
      numeric: 2560
      tolerance: 0
      hint: a whole number
      model: $64 \to 32 \to 16$ after the two poolings, so $10 \cdot 16 \cdot 16 = 2560$
    explanation: |
      A $3 \times 3$ convolution with padding 1 and stride 1 keeps the height and width, and each
      $2 \times 2$ max-pooling halves them: $64 \to 32 \to 16$ [^1]. The last block outputs
      $10 \times 16 \times 16$, which `Flatten` turns into $2560$ features per image [^1][^2]. For
      $28 \times 28$ MNIST images the same model needs $10 \cdot 7 \cdot 7 = 490$.
    references:
      - source: d2l
        locator: Sec. 7.3 Padding and Stride; Sec. 7.5 Pooling
        url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html
