  - id: pytorch-026
    type: single
    difficulty: medium
    tags:
      - stack
      - indexing
      - tensor-shapes
    question: |
      `A`, `B` and `C` are tensors of shape (100, 200), and `X = torch.stack([A, B, C], dim=2)`. What is
      `X.shape`, and which expression returns `B`?
    options:
      - text: (100, 200, 3), and `X[:, :, 1]`
        correct: true
      - text: (3, 100, 200), and `X[1]`
        why: That is `torch.stack` with the default `dim=0`; here the new axis is inserted at position 2 [^1].
      - text: (100, 200, 3), and `X[:, :, 2]`
        why: Indices start at 0, so the second entry along the new axis is index 1; index 2 gives `C` [^2].
      - text: (300, 200), and `X[100:200]`
        why: That is `torch.cat` along axis 0, which joins along an existing axis; `stack` creates a new one [^1].
    explanation: |
      `torch.stack` joins tensors of equal shape along a new axis inserted at position `dim` [^1], so
      stacking three (100, 200) matrices with `dim=2` gives shape (100, 200, 3). The third axis then
      indexes the three matrices, and its second coordinate, index 1, recovers `B` as `X[:, :, 1]`
      [^2]. With the default `dim=0` the result would be (3, 100, 200) and `B` would be `X[1]`. The
      d2l exercise leaves the stacking axis open, so this question fixes it [^3].
    references:
      - title: 'PyTorch documentation: torch.stack'
