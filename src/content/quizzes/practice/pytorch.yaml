  - id: pytorch-051
    type: short_answer
    difficulty: medium
    tags:
      - squeeze
      - tensor-shapes
    question: |
      ```python
      x = torch.rand(1, 1, 1, 10)
      a = x.squeeze()
      b = x.squeeze(0)
      ```
      `a` has shape `(10,)`. What is the shape of `b`?
    answer:
      accept:
        - (1, 1, 10)
      pattern: (?:torch\.size\(\s*)?[(\[]?\s*1(?:\s*[,x×*]\s*|\s+)1(?:\s*[,x×*]\s*|\s+)10\s*[)\]]?\s*\)?
      hint: Three dimensions, e.g. (2, 3, 4)
      model: $(1, 1, 10)$ — only dimension 0 is removed
    explanation: |
      `squeeze()` without arguments removes *every* dimension of size 1, giving `(10,)` [^1]. With a
      dimension argument it removes only that dimension (if its size is 1), so `squeeze(0)` turns
      `(1, 1, 1, 10)` into `(1, 1, 10)` [^1][^2]. Passing the dimension explicitly is safer in models,
      because a plain `squeeze()` also removes a batch dimension that happens to be 1.
    references:
      - title: torch.squeeze (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.squeeze.html
        locator: torch.squeeze (parameter `dim`)
