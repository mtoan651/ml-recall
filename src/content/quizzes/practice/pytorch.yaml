  - id: pytorch-037
    type: short_answer
    difficulty: easy
    tags:
      - data-loader
      - drop-last
      - minibatches
    question: |
      `loader = torch.utils.data.DataLoader(dataset, batch_size=64, shuffle=True, drop_last=True)`
      serves a dataset of 1000 examples. How many minibatches does one epoch contain?
    answer:
      numeric: 15
      tolerance: 0
      hint: an integer
      model: $\lfloor 1000/64 \rfloor = 15$; the incomplete 16th batch of 40 examples is dropped.
    explanation: |
      By default `DataLoader` keeps the incomplete last batch, so 1000 examples give 16 batches, the
      last with 40 examples [^1]. `drop_last=True` drops that batch, which keeps every minibatch the
      same size, at the cost of skipping 40 examples per epoch [^1]. With `shuffle=True` different
      examples are skipped in each epoch, so none is ignored for good. `len(loader)` reports the number
      of batches [^2].
    references:
      - title: 'PyTorch documentation: torch.utils.data.DataLoader'
        locator: Parameter drop_last
        url: https://docs.pytorch.org/docs/stable/data.html#torch.utils.data.DataLoader
        quote: set to True to drop the last incomplete batch, if the dataset size is not divisible by the batch size.
      - source: d2l
        locator: Sec. 3.3.3 Concise Implementation of the Data Loader
        url: https://d2l.ai/chapter_linear-regression/synthetic-regression-data.html#concise-implementation-of-the-data-loader
      - source: d2l
        locator: Sec. 3.3.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-regression/synthetic-regression-data.html#exercises
