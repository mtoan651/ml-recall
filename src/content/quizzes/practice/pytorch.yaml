  - id: pytorch-053
    type: short_answer
    difficulty: hard
    tags:
      - l1-loss
      - gradients
      - sgd
    question: |
      A linear model `y_pred = w * X + b` starts at $w = 0.3367$, $b = 0.1288$ and is trained with
      `nn.L1Loss()` and `torch.optim.SGD(lr=0.01)` on data from $y = 0.3x + 0.9$ with $x \in [0, 0.8)$.
      At the start every prediction is *below* its target. What is $b$ after the first optimizer step?
      Give 4 decimals.
    answer:
      numeric: 0.1388
      tolerance: 0.00005
      hint: a number, 4 decimals
      model: $\partial L/\partial b = \frac1n\sum \operatorname{sign}(\hat y_i - y_i) = -1$, so $b = 0.1288 + 0.01 = 0.1388$
    explanation: |
      The L1 loss is the mean of $|\hat y_i - y_i|$, whose derivative with respect to $\hat y_i$ is the
      sign of the error [^1]. With all predictions too low, every sign is $-1$, so
      $\partial L/\partial b = -1$ and SGD adds $\text{lr} \cdot 1 = 0.01$ to $b$ [^2]. Unlike the squared
      loss, the step size does not shrink as the error shrinks, which is why L1 training with a constant
      learning rate tends to jitter around the optimum [^1].
    references:
      - title: torch.nn.L1Loss (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.nn.L1Loss.html
        locator: torch.nn.L1Loss (mean absolute error)
      - source: learn-pytorch
        locator: 01 PyTorch Workflow exercise solutions, Exercises 2–3 (model, L1 loss, SGD with lr = 0.01)
        url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/01_pytorch_workflow_exercise_solutions.ipynb
    source:
      id: learn-pytorch
      ref: extras/solutions/01_pytorch_workflow_exercise_solutions.ipynb#ex3
      url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/01_pytorch_workflow_exercise_solutions.ipynb
