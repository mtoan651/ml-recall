  - id: pytorch-056
    type: true_false
    difficulty: easy
    tags:
      - softmax
      - argmax
      - predictions
    question: |
      For a multi-class model, `torch.softmax(logits, dim=1).argmax(dim=1)` and
      `logits.argmax(dim=1)` can return different predicted labels.
    options:
      - text: 'True'
        why: Softmax is strictly increasing in each logit within a row, so it never changes which entry is largest [^1].
      - text: 'False'
        correct: true
    explanation: |
      Softmax exponentiates and normalizes each row, a strictly monotonic transformation that keeps the
      order of the logits [^1]. The largest logit therefore always has the largest probability, so both
      expressions give the same labels; the softmax is only needed when you want the probabilities
      themselves [^1][^2].
    references:
      - source: d2l
        locator: Sec. 4.1.1.2 The Softmax (softmax preserves the ordering of its arguments)
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
