  - id: pytorch-066
    type: multiple
    difficulty: medium
    tags:
      - autograd
      - custom-function
      - tanh
    question: |
      A custom autograd function implements tanh:

      ```python
      class TanhFunction(torch.autograd.Function):
          @staticmethod
          def forward(ctx, x):
              ctx.save_for_backward(x)
              return x.tanh()

          @staticmethod
          def backward(ctx, grad_output):
              x, = ctx.saved_tensors
              return ...
      ```

      Which expressions are correct return values for `backward`? Select all that apply.
    options:
      - text: '`grad_output * (1 - x.tanh() ** 2)`'
        correct: true
      - text: '`grad_output / x.cosh() ** 2`'
        correct: true
      - text: '`1 - x.tanh() ** 2`'
        why: '`backward` must return the gradient of the loss, so the local derivative has to be multiplied by `grad_output` (chain rule) [^2].'
      - text: '`grad_output * (1 - x ** 2)`'
        why: $1 - y^2$ is the derivative written in terms of the *output* $y = \tanh x$; the saved tensor here is the input $x$ [^3].
    explanation: |
      `backward` receives $\partial L / \partial y$ and must return $\partial L / \partial x =
      \partial L / \partial y \cdot \tanh'(x)$ [^2]. The derivative of tanh is
      $1 - \tanh^2 x = 1/\cosh^2 x$ [^3], so both the first and the second expression are correct; the solution in *Deep Learning Interviews* uses the cosh form [^1]. Saving the output $y$ instead of $x$ would allow the
      cheaper `grad_output * (1 - y ** 2)`.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-218, p. 256; Solution SOL-218, Fig. 8.69, p. 312
        url: https://arxiv.org/abs/2201.00650v2
      - title: Extending torch.autograd (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/notes/extending.html
        locator: Extending torch.autograd (backward returns one gradient per input)
      - source: d2l
        locator: Sec. 5.1.2.3 Tanh Function
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#tanh-function
    source:
      id: dl-interviews
      ref: ch8#prb218
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: pytorch-067
    type: short_answer
    difficulty: easy
    tags:
      - distance
      - tensors
      - code-reading
    question: |
      This snippet was meant to compute the Manhattan distance between two vectors:

      ```python
      x1 = torch.tensor([6., 1., 4., 5.])
      x2 = torch.tensor([2., 8., 3., -1.])
      dist = torch.sqrt(torch.pow(x1 - x2, 2).sum())
      print(dist)
      ```

      What does it print? Round to 2 decimals.
    answer:
      numeric: 10.10
      tolerance: 0.01
      hint: a number, 2 decimals
      model: $\sqrt{4^2 + 7^2 + 1^2 + 6^2} = \sqrt{102} \approx 10.10$
    explanation: |
      The code squares the differences, sums them and takes the square root, so it computes the
      Euclidean ($L_2$) distance $\sqrt{16 + 49 + 1 + 36} = \sqrt{102} \approx 10.10$ [^1]. The Manhattan
      ($L_1$) distance adds absolute differences, `(x1 - x2).abs().sum()`, which gives
      $4 + 7 + 1 + 6 = 18$ [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-264 and PRB-265, pp. 288–289; Solutions SOL-264 and SOL-265, pp. 333–334
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Taxicab geometry'
        url: https://en.wikipedia.org/wiki/Taxicab_geometry
        locator: Formal definition
    source:
      id: dl-interviews
      ref: ch8#prb265
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
