  - id: pytorch-045
    type: single
    difficulty: medium
    tags:
      - permute
      - image-tensors
      - matplotlib
    question: |
      `image` is a CIFAR-10 image tensor of shape `(3, 32, 32)` (channels, height, width), as produced by
      `transforms.ToTensor()`. `plt.imshow(image)` fails. Which call displays the image correctly?
    options:
      - text: '`plt.imshow(image.permute(1, 2, 0))`'
        correct: true
      - text: '`plt.imshow(image.permute(2, 1, 0))`'
        why: This also gives shape (32, 32, 3) but swaps height and width, so the picture appears transposed.
      - text: '`plt.imshow(image.reshape(32, 32, 3))`'
        why: '`reshape` keeps the memory order, so it regroups the numbers instead of moving the channel axis; pixels and colours get scrambled.'
      - text: '`plt.imshow(image.permute(0, 2, 1))`'
        why: This only swaps height and width; the channel axis stays first, which `imshow` still rejects.
    explanation: |
      Matplotlib's `imshow` expects a colour image as (height, width, channels), while PyTorch image tensors are
      (channels, height, width) [^1][^2]. `permute(1, 2, 0)` builds the new order from old dimensions 1, 2 and 0, giving
      $(32, 32, 3)$ [^1]. NMA's text says that `imshow` expects C×H×W; in fact it is the tensor that has this layout, and
      `imshow` wants H×W×C, which is why the permutation is needed [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W1D1 Tutorial 1, Section 2.3 (Permutation) and Coding Exercise 2.5 Display an image from the dataset
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D1_BasicsAndPytorch/instructor/W1D1_Tutorial1.ipynb
