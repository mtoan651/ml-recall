  - id: pytorch-047
    type: true_false
    difficulty: easy
    tags:
      - eval-mode
      - train-mode
    question: |
      An MLP is built only from `nn.Linear` and `nn.ReLU` layers. True or false: calling `net.eval()` before computing
      its test predictions changes the predictions compared with leaving it in training mode.
    options:
      - text: 'True'
        why: '`eval()` only changes layers whose behaviour differs between training and testing, such as dropout and batch normalization; this net has none.'
      - text: 'False'
        correct: true
    explanation: |
      `net.eval()` sets the module and its children to evaluation mode, which matters only for layers with
      mode-dependent behaviour, such as `nn.Dropout` and `nn.BatchNorm` [^1][^2]. Linear and ReLU layers compute the same
      function in both modes, so the predictions are identical [^1]. Calling `eval()` (and `train()` again before
      training) is still good practice, because adding dropout or batch normalization later would otherwise change the
      results silently [^1]. `eval()` also does not turn off gradient tracking; that is what `torch.no_grad()` does [^2].
    references:
      - source: neuromatch-dl
        locator: W1D3 Tutorial 1, Section 2.3 Training and Evaluation, Think! 2.3.1 What's the point of .eval() and .train()?
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D3_MultiLayerPerceptrons/instructor/W1D3_Tutorial1.ipynb
