  - id: pytorch-043
    type: short_answer
    difficulty: easy
    tags:
      - tensor-creation
      - arange
    question: |
      NMA asks for "a 1D tensor containing the even numbers between 4 and 40 inclusive" and gives
      `D = torch.arange(4, 41, step=2)`. How many elements does `D` have?
    answer:
      numeric: 19
      tolerance: 0
      hint: an integer
      model: '$4, 6, \dots, 40$: $(40 - 4)/2 + 1 = 19$; the end value 41 is excluded'
    explanation: |
      `torch.arange(start, end, step)` returns the values from `start` up to but not including `end`, so its size is
      $\lceil (\text{end} - \text{start})/\text{step} \rceil = \lceil 37/2 \rceil = 19$ [^1][^2]. With end 41 the last value is 40, so
      the tensor holds $4, 6, \dots, 40$ [^1]. Writing `torch.arange(4, 40, step=2)` would silently drop 40, a common
      off-by-one error.
    references:
      - source: neuromatch-dl
        locator: W1D1 Tutorial 1, Section 2.1 Creating Tensors, Coding Exercise 2.1
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D1_BasicsAndPytorch/instructor/W1D1_Tutorial1.ipynb
