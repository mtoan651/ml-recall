  - id: pytorch-059
    type: single
    difficulty: easy
    tags:
      - image-tensors
      - chw
      - permute
      - matplotlib
    question: |
      `img` is an RGB image tensor of shape `(3, 64, 64)` in PyTorch's channels-first layout.
      `plt.imshow` expects height × width × channels. Which call gives a correct picture?
    options:
      - text: '`plt.imshow(img.reshape(64, 64, 3))`'
        why: '`reshape` keeps the memory order, so it mixes values from different channels into each pixel instead of moving the channel axis [^2].'
      - text: '`plt.imshow(img.squeeze())`'
        why: '`squeeze` only removes size-1 dimensions; it works for a `(1, 28, 28)` grayscale image but leaves `(3, 64, 64)` unchanged.'
      - text: '`plt.imshow(img.permute(1, 2, 0))`'
        correct: true
      - text: '`plt.imshow(img.permute(2, 0, 1))`'
        why: This gives shape `(64, 3, 64)`, which is not an image layout at all.
    explanation: |
      PyTorch stores images as (channels, height, width), while Matplotlib wants (height, width,
      channels) [^1]. `permute(1, 2, 0)` reorders the axes to $(64, 64, 3)$ and keeps each pixel's three
      color values together [^2]. A `reshape` to the same shape would scramble the pixels, because it
      reinterprets the data in memory order instead of swapping axes [^2].
    references:
      - source: learn-pytorch
        locator: 03 PyTorch Computer Vision exercise solutions, Exercises 5–6 (CHW vs HWC note)
        url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/03_pytorch_computer_vision_exercise_solutions.ipynb
