  - id: pytorch-013
    type: single
    difficulty: easy
    tags:
      - lazy-initialization
      - nn-lazylinear
    shuffle: false
    question: |
      ```python
      net = nn.Sequential(nn.Linear(20, 256), nn.ReLU(), nn.LazyLinear(10))
      ```

      Before any data has passed through `net`, which parameters have been initialized?
    options:
      - text: All of them, because `LazyLinear` uses a default input size of 1 until real data arrives
        why: There is no default size. The weight is an `UninitializedParameter`, and even reading its shape raises an error [^2].
      - text: Only the first layer's; the `LazyLinear` weights stay uninitialized until the first forward pass
        correct: true
      - text: All of them, because once the first layer's input size is known PyTorch infers the rest at once
        why: PyTorch infers the missing shapes only when data flows through the layer; it does not trace shapes when the model is built [^1].
      - text: None of them, because a single lazy layer makes the whole network wait for the first forward pass
        why: '`nn.Linear(20, 256)` knows both of its sizes, so it creates and initializes its weights in its constructor.'
    explanation: |
      d2l explains that the framework defers initialization, waiting until data first passes through the
      model to infer the missing sizes [^1]. A layer whose sizes are all given, such as
      `nn.Linear(20, 256)`, initializes its weights right away. The weight of `nn.LazyLinear(10)` stays an
      `UninitializedParameter` until the first call, when it sees 256 input features and becomes a
      $10 \times 256$ matrix [^2].
