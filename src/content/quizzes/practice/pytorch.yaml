  - id: pytorch-048
    type: short_answer
    difficulty: medium
    tags:
      - lr-scheduler
      - steplr
      - learning-rate-decay
    question: |
      ```python
      optimizer = torch.optim.SGD(model.parameters(), lr=0.1)
      scheduler = torch.optim.lr_scheduler.StepLR(optimizer, step_size=30, gamma=0.1)
      for epoch in range(100):
          train_one_epoch(model, optimizer)
          scheduler.step()
      ```
      What learning rate does the optimizer use during the epoch with `epoch == 65`?
    answer:
      numeric: 0.001
      tolerance: 0.0000001
      hint: a number, e.g. 0.05
      model: $0.1 \cdot 0.1^{\lfloor 65/30 \rfloor} = 0.1 \cdot 0.01 = 0.001$
    explanation: |
      `StepLR` multiplies the learning rate by `gamma` every `step_size` calls of `scheduler.step()`,
      so after 65 epochs it has decayed $\lfloor 65/30\rfloor = 2$ times: $0.1 \to 0.01 \to 0.001$ [^1].
      The epochs 0–29 use 0.1, 30–59 use 0.01 and 60–89 use 0.001. Starting large and decaying the
      learning rate in steps is a classic schedule: big steps make fast progress early, small steps let
      the parameters settle later [^2].
    references:
      - title: torch.optim.lr_scheduler.StepLR (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.optim.lr_scheduler.StepLR.html
        locator: StepLR (parameters `step_size`, `gamma`)
      - source: d2l
        locator: Sec. 12.11.3.2 Multi Factor Scheduler
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html#multi-factor-scheduler
    source:
      id: ds-interviews
      ref: theory.md#q102
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#optimization-in-neural-networks
    status: reviewed
    reviewed_by: claude
  - id: pytorch-049
    type: short_answer
    difficulty: easy
    tags:
      - matmul
      - tensor-shapes
      - transpose
    question: |
      ```python
      X = torch.rand(7, 7)
      Y = torch.rand(1, 7)
      Z = torch.matmul(X, Y.T)
      ```
      `torch.matmul(X, Y)` would raise a shape error. What is the shape of `Z`?
    answer:
      accept:
        - (7, 1)
      pattern: (?:torch\.size\(\s*)?[(\[]?\s*7(?:\s*[,x×*]\s*|\s+)1\s*[)\]]?\s*\)?
      hint: Two dimensions, e.g. (3, 4)
      model: $(7, 1)$ — $(7 \times 7) \cdot (7 \times 1)$
    explanation: |
      A matrix product needs the inner dimensions to match: $(7 \times 7)$ times $(1 \times 7)$ fails
      because $7 \neq 1$ [^1]. Transposing `Y` gives shape $(7, 1)$, so the product is
      $(7 \times 7)(7 \times 1) = (7 \times 1)$ [^1][^2]. Checking the inner and outer dimensions is the
      quickest way to debug most shape errors.
    references:
      - title: torch.matmul (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.matmul.html
        locator: torch.matmul (2-D × 2-D is the matrix-matrix product)
