  - id: pytorch-036
    type: short_answer
    difficulty: easy
    tags:
      - data-loader
      - minibatches
      - batch-size
    question: |
      This generator serves one epoch of training data. With `num_train = 1000` and `batch_size = 64`,
      how many examples are in the last minibatch?

      ```python
      indices = list(range(num_train))
      random.shuffle(indices)
      for i in range(0, num_train, batch_size):
          batch = indices[i : i + batch_size]
          yield X[batch], y[batch]
      ```
    answer:
      numeric: 40
      tolerance: 0
      hint: an integer
      model: '16 batches: 15 full ones (960 examples) and a last one with $1000 - 960 = 40$.'
    explanation: |
      The slice `indices[i : i + batch_size]` simply stops at the end of the list, so when the number of
      examples is not divisible by the batch size, the last minibatch is smaller [^1]; here
      $1000 = 15 \times 64 + 40$. Every example is still used once per epoch, but the last update
      averages over only 40 examples, so its gradient is noisier. PyTorch's `DataLoader` behaves the
      same way by default and drops the incomplete batch with `drop_last=True` [^2].
    references:
      - source: d2l
        locator: Sec. 3.3.2 Reading the Dataset
        url: https://d2l.ai/chapter_linear-regression/synthetic-regression-data.html#reading-the-dataset
      - title: 'PyTorch documentation: torch.utils.data.DataLoader'
        locator: Parameter drop_last
        url: https://docs.pytorch.org/docs/stable/data.html#torch.utils.data.DataLoader
        quote: If False and the size of dataset is not divisible by the batch size, then the last batch will be smaller.
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 7
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex7
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
