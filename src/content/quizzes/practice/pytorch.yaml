  - id: pytorch-044
    type: short_answer
    difficulty: easy
    tags:
      - indexing
      - tensor-shapes
    question: '`x = torch.rand(1, 2, 3, 4, 5)`. What is `x[0][0][0].shape`?'
    answer:
      accept:
        - (4, 5)
      pattern: (torch\.size\()?[\(\[]*\s*4\s*[,x×]\s*5\s*[\)\]]*
      hint: Two numbers, e.g. (2, 3)
      model: '$(4, 5)$: each `[0]` removes the leading dimension'
    explanation: |
      Indexing a tensor with a single integer selects along its first dimension and drops that dimension, as in NumPy
      [^1][^2]. Three successive `[0]` remove the dimensions of size 1, 2 and 3, leaving shape $(4, 5)$ [^1]. Indexing does
      not squeeze any other singleton dimensions: if `x` had shape $(1, 10)$, `x[0]` would be the whole row of 10 values,
      not its first number [^1].
