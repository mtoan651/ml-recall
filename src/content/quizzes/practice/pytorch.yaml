      - dtype
    question: |
      A spiral dataset has 240 training points in 3 classes. The model returns logits of shape
      `(240, 3)` and you use `nn.CrossEntropyLoss()` with class-index targets. What must the target
      tensor `y` look like?
    options:
      - text: Shape `(240,)` with integer (`torch.long`) class indices 0, 1 or 2
        correct: true
      - text: Shape `(240, 1)` with float values 0.0, 1.0 or 2.0
        why: Class-index targets are a 1-D tensor of integers; float targets are interpreted as class probabilities of shape `(240, 3)` [^1].
      - text: Shape `(240, 3)` holding the softmax probabilities predicted by the model
        why: The targets come from the labels, not from the model; and the loss applies log-softmax to the raw logits itself [^1].
      - text: Shape `(3,)` holding the number of examples in each class
        why: The loss needs one target per example, not class counts.
    explanation: |
      For class-index targets, `CrossEntropyLoss` expects input of shape $(N, C)$ with raw logits and a
      target of shape $(N,)$ with integer class indices in $[0, C)$ [^1]. That is why the Learn PyTorch exercise solution casts
      the labels with `torch.from_numpy(y).type(torch.LongTensor)` [^2]. The loss applies log-softmax
      internally, so the model must not end with a softmax layer.
    references:
      - title: torch.nn.CrossEntropyLoss (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
        locator: Shape section (Input $(N, C)$, Target $(N)$ with class indices)
