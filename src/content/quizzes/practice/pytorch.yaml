  - id: pytorch-039
    type: single
    difficulty: easy
    tags:
      - data-loader
      - batch-size
      - throughput
    question: |
      You read Fashion-MNIST's 60,000 training images with a PyTorch `DataLoader`. What happens to the
      time one pass over the data takes if you reduce `batch_size` from 256 to 1?
    options:
      - text: It drops, because single images fit into the CPU cache better than whole minibatches
        why: Cache effects cannot outweigh paying the loop and collation overhead once per image; batching exists to amortize it.
      - text: The loader raises an error, since collating a batch needs at least two examples
        why: A batch of one example is valid; its tensors simply have a leading dimension of size 1.
      - text: 'It grows a lot: the per-batch overhead is paid 60,000 times, not about 235'
        correct: true
      - text: It stays about the same, since the same number of bytes is read from disk in total
        why: Each minibatch has a fixed cost (indices, collating, a loop iteration) on top of the bytes, and that cost is now paid for every image [^1].
    explanation: |
      A data loader does fixed work for every minibatch: it draws the indices, fetches the examples and
      collates them into tensors, plus one Python loop iteration [^1]. With 256 images per batch this
      cost is paid $\lceil 60000/256 \rceil = 235$ times per epoch; with batch size 1 it is paid 60,000
      times, so reading gets much slower although the data are the same. Computation behaves alike:
      processing one example at a time wastes the speed of vectorized operations [^2]. Even at its
      usual batch size, d2l finds the built-in loader not blazingly fast [^3].
    references:
      - title: 'PyTorch documentation: torch.utils.data'
        locator: Automatic batching and DataLoader parameters
        url: https://docs.pytorch.org/docs/stable/data.html#torch.utils.data.DataLoader
      - source: d2l
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
      - source: d2l
        locator: Sec. 4.2.2 Reading a Minibatch
        url: https://d2l.ai/chapter_linear-classification/image-classification-dataset.html#reading-a-minibatch
      - source: d2l
        locator: Sec. 4.2.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-classification/image-classification-dataset.html#exercises
