  - id: pytorch-014
    type: single
    difficulty: easy
    tags:
      - shape-mismatch
      - nn-linear
      - debugging
    question: |
      ```python
      net = nn.Sequential(nn.Linear(20, 256), nn.ReLU(), nn.Linear(128, 10))
      X = torch.rand(2, 20)
      ```

      The second linear layer expects 128 inputs, but the first one produces 256. What happens?
    options:
      - text: Building `net` already raises an error, because `nn.Sequential` checks neighbouring layers
        why: '`nn.Sequential` only stores the layers; no shapes are checked until tensors flow through them.'
      - text: '`net(X)` runs, because PyTorch resizes the second layer to 256 inputs as a lazy layer would'
        why: Only lazy modules such as `nn.LazyLinear` infer their input size; a layer built with explicit sizes keeps them [^1].
      - text: '`net(X)` runs, and PyTorch silently uses only the first 128 of the 256 hidden values'
        why: The matrix product needs matching inner dimensions; PyTorch never truncates a tensor to make it fit.
      - text: Building `net` works; calling `net(X)` raises a shape-mismatch error at the second layer
        correct: true
    explanation: |
      PyTorch checks shapes only when tensors meet. The model is built without complaint, and the first
      forward pass fails at the second layer with an error like "mat1 and mat2 shapes cannot be
      multiplied (2x256 and 128x10)" [^2]. With lazy layers this kind of mistake cannot happen, because
      the input sizes are inferred from the data; d2l counts this among the benefits of lazy
      initialization [^1].
    references:
      - source: d2l
        locator: Sec. 6.4.1 Summary
        url: https://d2l.ai/chapter_builders-guide/lazy-init.html#summary
      - title: torch.nn.Linear (PyTorch documentation)
        locator: Shape
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html
      - source: d2l
        locator: Sec. 6.4.2 Exercises, Exercise 2
        url: https://d2l.ai/chapter_builders-guide/lazy-init.html#exercises
    source:
      id: d2l
      ref: chapter_builders-guide/lazy-init#ex2
      url: https://d2l.ai/chapter_builders-guide/lazy-init.html#exercises
    status: draft
  - id: pytorch-015
    type: single
    difficulty: medium
    tags:
      - custom-layer
      - einsum
      - code-reading
    question: |
      A custom layer computes $y_k = \sum_{i,j} W_{ijk}\, x_i x_j$ for every example, with a parameter
      `W` of shape `(d, d, m)`. For a batch `X` of shape `(n, d)`, which line returns the `(n, m)` output?
    options:
      - text: '`torch.einsum("ni,nj,ijk->nk", X, X, W)`'
        correct: true
      - text: '`torch.einsum("ni,nj,ijk->k", X, X, W)`'
        why: Leaving `n` out of the output sums over the batch, giving one vector of shape `(m,)` for the whole batch [^2].
      - text: '`torch.einsum("ni,ni,iik->nk", X, X, W)`'
        why: Repeating the index `i` keeps only the diagonal terms $W_{iik} x_i^2$ and drops all products $x_i x_j$ with $i \ne j$.
      - text: '`torch.einsum("ni,ijk->nk", X, W)`'
        why: This uses $x_i$ only once and sums $W$ over $j$, so the result is linear in $\mathbf{x}$, not quadratic.
    explanation: |
      In `einsum`, indices that appear in the output are kept and all others are summed over [^2]. The
      output needs the batch index `n` and the output index `k`, while `i` and `j` are summed, and both
      factors $x_i$ and $x_j$ must come from the same example, hence `"ni,nj,ijk->nk"`. In a d2l-style
      custom layer, `W` is created as an `nn.Parameter` in `__init__` and used in `forward` [^1].
    references:
      - source: d2l
        locator: Sec. 6.5.2 Layers with Parameters
        url: https://d2l.ai/chapter_builders-guide/custom-layer.html#layers-with-parameters
      - title: torch.einsum (PyTorch documentation)
        locator: Function description
        url: https://docs.pytorch.org/docs/stable/generated/torch.einsum.html
      - source: d2l
        locator: Sec. 6.5.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_builders-guide/custom-layer.html#exercises
    source:
      id: d2l
      ref: chapter_builders-guide/custom-layer#ex1
      url: https://d2l.ai/chapter_builders-guide/custom-layer.html#exercises
    status: draft
  - id: pytorch-016
    type: multiple
    difficulty: easy
    tags:
      - checkpointing
      - state-dict
      - saving-models
    question: |
      Even if a model will never be deployed anywhere else, why save its parameters (its `state_dict`)
      to disk during and after training? Select all that apply.
    options:
      - text: To store the model's code as well, so the architecture can be rebuilt without its class definition
        why: A state dict holds only the parameter tensors; the architecture has to be recreated in code before loading them [^2].
      - text: To reuse the trained layers later, for example as the starting point for fine-tuning
        correct: true
      - text: To resume a long training run from the last checkpoint after a crash or power cut
        correct: true
      - text: To keep the best checkpoint seen so far, for example the one with the lowest validation loss
        correct: true
      - text: To make the forward pass faster, because loaded weights come back already compiled
        why: Loading copies tensor values into the model; it has no effect on how fast the forward pass runs.
    explanation: |
      d2l recommends saving intermediate results periodically (checkpointing), so a long run does not
      lose days of computation [^1]. The saved file contains parameters, not the model: to reload it you
      build the architecture in code and then load the parameters into it [^2]. Saved parameters are what
      fine-tuning starts from [^3], and keeping the checkpoint with the best validation score lets you
      return to it, as in early stopping [^4].
    references:
      - source: d2l
        locator: Sec. 6.6 File I/O (introduction)
        url: https://d2l.ai/chapter_builders-guide/read-write.html
      - source: d2l
        locator: Sec. 6.6.2 Loading and Saving Model Parameters
        url: https://d2l.ai/chapter_builders-guide/read-write.html#loading-and-saving-model-parameters
      - source: d2l
        locator: Sec. 14.2.1 Steps
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
      - source: d2l
        locator: Sec. 5.5.3 Early Stopping
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
      - source: d2l
        locator: Sec. 6.6.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_builders-guide/read-write.html#exercises
    source:
      id: d2l
      ref: chapter_builders-guide/read-write#ex1
      url: https://d2l.ai/chapter_builders-guide/read-write.html#exercises
    status: draft
  - id: pytorch-017
    type: single
    difficulty: hard
    tags:
      - state-dict
      - load-state-dict
      - transfer-learning
      - code-reading
    question: |
      A trained model was saved with `torch.save(old.state_dict(), "mlp.params")`. Its class is:

      ```python
      class MLP(nn.Module):
          def __init__(self, num_outputs=10):
              super().__init__()
              self.hidden = nn.Linear(20, 256)
              self.output = nn.Linear(256, num_outputs)

          def forward(self, X):
              return self.output(torch.relu(self.hidden(X)))
      ```

      You build `new = MLP(num_outputs=5)` and load `sd = torch.load("mlp.params")`. Which call copies
      the trained hidden layer into `new` and leaves the new 5-class output layer at its random
      initialization?
    options:
      - text: '`new.load_state_dict(sd)`'
        why: The file holds a $10 \times 256$ `output.weight` while `new` has a $5 \times 256$ one, so loading fails with a size-mismatch error.
      - text: '`new.load_state_dict(sd, strict=False)`'
        why: '`strict=False` only tolerates missing or unexpected keys; the size mismatch of `output.weight` and `output.bias` still raises an error.'
      - text: '`new.load_state_dict({k: v for k, v in sd.items() if "hidden" in k}, strict=False)`'
        correct: true
      - text: '`new.hidden.load_state_dict({k: v for k, v in sd.items() if k.startswith("hidden.")})`'
        why: Inside the submodule the keys are `weight` and `bias`, but the filtered dictionary still uses `hidden.weight` and `hidden.bias`, so the keys do not match and loading fails.
    explanation: |
      A state dict maps parameter names such as `hidden.weight` and `output.bias` to tensors, and loading
      it into a freshly built architecture restores the parameters [^1]. With `strict=False` PyTorch
      accepts a dictionary that lacks some keys, which is the documented way to warm-start a model from
      part of another one [^2], so the filtered call loads `hidden.*` and reports `output.*` as missing.
      Shape mismatches are a different check: they raise an error even with `strict=False`. Loading into
      the submodule also works if the `hidden.` prefix is stripped from the keys first.
    references:
      - source: d2l
        locator: Sec. 6.6.2 Loading and Saving Model Parameters
        url: https://d2l.ai/chapter_builders-guide/read-write.html#loading-and-saving-model-parameters
      - title: Saving and Loading Models (PyTorch tutorial)
        locator: Warmstarting Model Using Parameters from a Different Model
        url: https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html#warmstarting-model-using-parameters-from-a-different-model
      - source: d2l
        locator: Sec. 6.6.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_builders-guide/read-write.html#exercises
    source:
      id: d2l
      ref: chapter_builders-guide/read-write#ex2
      url: https://d2l.ai/chapter_builders-guide/read-write.html#exercises
    status: draft
