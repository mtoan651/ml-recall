  - id: pytorch-050
    type: short_answer
    difficulty: easy
    tags:
      - argmax
      - flattened-index
      - code-reading
    question: |
      ```python
      C = torch.tensor([[0.36, 0.47],
                        [0.52, 0.56]])
      print(torch.argmax(C))
      ```
      What number does `torch.argmax(C)` return?
    answer:
      numeric: 3
      tolerance: 0
      hint: a whole number
      model: 3 — without `dim`, argmax indexes the flattened tensor `[0.36, 0.47, 0.52, 0.56]`
    explanation: |
      Without a `dim` argument, `torch.argmax` returns the index of the maximum in the *flattened*
      tensor [^1]. Flattened row by row, `C` is `[0.36, 0.47, 0.52, 0.56]`, so the answer is 3, not the
      pair (1, 1). Use `dim=0` or `dim=1` to get per-column or per-row indices, as when picking the
      predicted class of each example with `logits.argmax(dim=1)` [^1][^2].
    references:
      - title: torch.argmax (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.argmax.html
