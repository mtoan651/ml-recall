  - id: pytorch-046
    type: single
    difficulty: medium
    tags:
      - gpu
      - performance
    question: |
      You time a function that multiplies small matrices many times, once on the CPU and once on a GPU. As you shrink the
      matrices and increase the number of iterations, the CPU version eventually becomes faster. What is the main
      reason?
    options:
      - text: Each GPU operation has a fixed overhead (kernel launch, synchronization, data transfer) that dominates tiny workloads
        correct: true
      - text: GPUs switch to lower precision for small matrices, which forces extra correction steps
        why: Precision is set by the tensor dtype, not by matrix size; the slowdown comes from per-operation overhead.
      - text: Small matrices do not fit into GPU memory, so they are swapped out to the CPU
        why: Small matrices fit easily; it is large ones that can exhaust GPU memory.
      - text: The CPU caches the result of the first iteration and skips the remaining ones
        why: PyTorch recomputes every operation; it does not memoize results across calls.
    explanation: |
      A GPU wins by running thousands of arithmetic operations in parallel, but every operation also pays fixed costs:
      launching a kernel, synchronizing with the CPU and moving data between host and device memory [^1][^2]. For large
      matrices these costs are negligible next to the arithmetic; for tiny ones they dominate, and the CPU, with fast
      cores and no transfers, finishes first [^1]. Fusing or batching many small operations into fewer large ones is the
      usual remedy [^2].
    references:
      - source: neuromatch-dl
