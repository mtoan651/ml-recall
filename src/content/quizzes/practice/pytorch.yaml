  - id: pytorch-052
    type: single
    difficulty: medium
    tags:
      - device
      - tensor-to
      - module-to
      - code-reading
    question: |
      On a machine with a GPU:

      ```python
      t = torch.rand(2, 3)
      t.to("cuda")
      model = nn.Linear(3, 1)
      model.to("cuda")
      print(t.device, next(model.parameters()).device)
      ```
      What is printed?
    options:
      - text: '`cuda:0 cuda:0`'
        why: '`Tensor.to` returns a new tensor and leaves `t` unchanged; you must write `t = t.to("cuda")` [^1].'
      - text: '`cpu cuda:0`'
        correct: true
      - text: '`cpu cpu`'
        why: "`nn.Module.to` moves the module's parameters in place, so the model is on the GPU even without reassignment [^2]."
      - text: '`cuda:0 cpu`'
        why: It is the other way round; only the module call works in place [^1][^2].
    explanation: |
      `Tensor.to(device)` returns a copy on the target device and does not change the original tensor,
      so the result must be assigned [^1]. `nn.Module.to(device)` modifies the module in place (and
      returns it for convenience), so its parameters do move [^2]. That asymmetry explains why
      solution code writes `X = X.to(device)` for data but often just `model.to(device)` [^3].
    references:
      - title: torch.Tensor.to (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.Tensor.to.html
        locator: torch.Tensor.to (returns a tensor; `self` if already on the device)
      - title: torch.nn.Module (PyTorch documentation)
        url: https://pytorch.org/docs/stable/generated/torch.nn.Module.html#torch.nn.Module.to
        locator: Module.to ("This method modifies the module in-place.")
      - source: learn-pytorch
        locator: 00 PyTorch Fundamentals exercise solutions, Exercise 6; 01 PyTorch Workflow exercise solutions, Exercise 2
        url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/00_pytorch_fundamentals_exercise_solutions.ipynb
