  - id: pytorch-018
    type: short_answer
    difficulty: easy
    tags:
      - tensors
      - elementwise-operations
      - comparison
    question: |
      What does the last line print?

      ```python
      import torch
      X = torch.arange(12, dtype=torch.float32).reshape(3, 4)
      Y = torch.tensor([[2.0, 1, 4, 3], [1, 2, 3, 4], [4, 3, 2, 1]])
      print((X < Y).sum().item())
      ```
    answer:
      numeric: 2
      tolerance: 0
      hint: an integer
      model: '`X < Y` is a (3, 4) boolean tensor that is `True` only at positions (0, 0) and (0, 2), so the count is 2.'
    explanation: |
      Comparison operators such as `==`, `<` and `>` work elementwise, like the arithmetic operators,
      and return a tensor of the same shape that is true where the comparison holds [^1]. `X` holds
      0 to 11 row by row, so only the first row, $(0, 1, 2, 3)$ against $(2, 1, 4, 3)$, has smaller
      entries: $0 < 2$ and $2 < 4$. Summing the boolean tensor counts its `True` entries, giving 2
      [^1]. With `X > Y` the count would be 8, and with `X == Y` it would be 2.
    references:
      - source: d2l
        locator: Sec. 2.1.3 Operations
        url: https://d2l.ai/chapter_preliminaries/ndarray.html#operations
      - source: d2l
        locator: Sec. 2.1.8 Exercises, Exercise 1
        url: https://d2l.ai/chapter_preliminaries/ndarray.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/ndarray#ex1
      url: https://d2l.ai/chapter_preliminaries/ndarray.html#exercises
