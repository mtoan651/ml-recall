  - id: pytorch-021
    type: multiple
    difficulty: medium
    tags:
      - tensors
      - len
      - tensor-shapes
    question: For a PyTorch tensor `X`, which statements about `len(X)` are true? Select all that apply.
    options:
      - text: It always refers to the last axis, such as the feature dimension
        why: It refers to the first axis, whose entries are the sub-tensors `X[0]`, `X[1]`, ...
      - text: It equals `X.shape[0]` whenever `X` has at least one axis
        correct: true
      - text: For a 0-d tensor such as `torch.tensor(3.0)` it raises a `TypeError`
        correct: true
      - text: It equals `X.numel()`, the total number of elements
        why: 'Only for 1-d tensors: for shape (2, 3, 4), `len` is 2 while `numel()` is 24.'
      - text: It equals `X.ndim`, the number of axes
        why: The number of axes is `X.ndim` (or `len(X.shape)`); `len(X)` is the length of axis 0.
    explanation: |
      `len(X)` counts the entries along axis 0, so it equals `X.shape[0]`, just as the length of a
      vector is its number of elements [^1]. A 0-d tensor (a scalar) has no axis at all, and PyTorch
      raises `TypeError: len() of a 0-d tensor` (checked with PyTorch 2.11). The total number of
      elements is `X.numel()`, and the number of axes is `X.ndim` or `len(X.shape)`, where the shape is
      the tuple of lengths along all axes [^1].
    references:
      - source: d2l
        locator: Sec. 2.3.2 Vectors (len and shape)
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#vectors
