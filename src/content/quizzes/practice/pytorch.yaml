  - id: pytorch-035
    type: short_answer
    difficulty: medium
    tags:
      - broadcasting
      - loss-function
      - silent-bugs
    question: |
      In a minibatch of 32 examples, `y_hat` has shape (32, 1) but the labels `y` have shape (32,).
      What is the shape of `l` in this loss?

      ```python
      l = (y_hat - y) ** 2 / 2
      ```
    answer:
      accept:
        - (32, 32)
      pattern: (torch\.size)?\(?\[?\s*32\s*[,x×]\s*32\s*\]?\)?
      hint: Two dimensions, e.g. (8, 8)
      model: '(32, 32): `y` is read as (1, 32) and broadcast against the (32, 1) column.'
    explanation: |
      Broadcasting lines shapes up from the last axis, so `y` with shape (32,) acts like (1, 32), and a
      (32, 1) column minus a (1, 32) row is a (32, 32) matrix of all pairwise differences [^1][^2]. No
      error is raised, and the mean of this matrix compares every prediction with every label, so
      training silently fits the wrong objective. That is why the labels have to be brought into the
      shape of the predictions, for example with `y.reshape(y_hat.shape)`, before subtracting [^3].
    references:
      - source: d2l
        locator: Sec. 2.1.4 Broadcasting
        url: https://d2l.ai/chapter_preliminaries/ndarray.html#broadcasting
      - title: 'PyTorch documentation: Broadcasting semantics'
        locator: General semantics
