  - id: pytorch-042
    type: true_false
    difficulty: medium
    tags:
      - numpy-interop
      - memory-sharing
    question: |
      ```python
      x = torch.zeros(3)      # a CPU tensor
      y = x.numpy()
      x[0] = 5.0
      ```
      True or false: after the last line, `y[0]` is also `5.0`.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: '`Tensor.numpy()` returns an array that shares storage with the CPU tensor, so in-place changes to one are visible in the other.'
    explanation: |
      For a CPU tensor, `Tensor.numpy()` returns a NumPy array that shares the tensor's storage, so changing `x` in place
      also changes `y` [^1][^2]. NMA's tutorial states that the converted result does not share memory; that holds for
      `torch.tensor(y)`, which always copies, but not for `.numpy()` or `torch.from_numpy` [^1][^3]. Use `x.numpy().copy()`
      or `x.clone().numpy()` when you need an independent array.
    references:
      - title: 'PyTorch documentation: torch.Tensor.numpy'
        url: https://docs.pytorch.org/docs/stable/generated/torch.Tensor.numpy.html
