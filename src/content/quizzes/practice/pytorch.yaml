  - id: pytorch-065
    type: single
    difficulty: easy
    tags:
      - cross-entropy
      - labels
      - classification
    question: |
      A skin-lesion classifier has seven classes (MEL, NV, BCC, AKIEC, BKL, DF, VASC) and is trained
      with `nn.CrossEntropyLoss` on logits of shape `(N, 7)`. Which target tensor is the standard
      choice?
    options:
      - text: A LongTensor of shape `(N,)` holding class indices from 0 to 6
        correct: true
      - text: A LongTensor of shape `(N,)` holding class indices from 1 to 7
        why: Class indices must lie in $[0, C)$; index 7 is out of range for 7 classes [^2].
      - text: A Python list with the class names, such as `'MEL'`
        why: The loss works on tensors of numbers, so the names must first be mapped to indices [^1].
      - text: A FloatTensor of shape `(N,)` holding $k/6$ for class $k$
        why: A single number per example is read neither as a class index nor as a probability vector of shape `(N, 7)` [^2].
    explanation: |
      The categories have to be represented numerically, for example `{'MEL': 0, 'NV': 1, ...,
      'VASC': 6}` [^1]. `nn.CrossEntropyLoss` expects the raw logits of shape $(N, C)$ and, as target,
      either class indices in $[0, C)$ of shape $(N,)$ or class probabilities of shape $(N, C)$ [^2].
      Integer indices from 0 to 6 are the usual choice.
    references:
      - source: dl-interviews
        locator: Ch. 7 (CNN Feature Extraction), Problem PRB-171 part 1, p. 213; Solution SOL-171, Code 7.1, p. 223
        url: https://arxiv.org/abs/2201.00650v2
      - title: torch.nn.CrossEntropyLoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
        locator: Shape (Target)
