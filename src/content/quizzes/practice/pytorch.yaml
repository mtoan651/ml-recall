  - id: pytorch-020
    type: short_answer
    difficulty: easy
    tags:
      - tensors
      - len
      - tensor-shapes
    question: |
      What does `len(X)` return?

      ```python
      X = torch.arange(24).reshape(2, 3, 4)
      ```
    answer:
      numeric: 2
      tolerance: 0
      hint: an integer
      model: 2, the length of axis 0 (`X.shape[0]`)
    explanation: |
      For a vector, `len` returns its number of elements, the length of its only axis [^1]. For a
      tensor with more axes, `len` counts the entries along the first axis, just as for a list of
      lists: `X` holds 2 matrices of shape (3, 4), so `len(X)` is 2, the same as `X.shape[0]` [^2].
      It is neither the number of elements (`X.numel()` is 24) nor the number of axes (`X.ndim` is
      3).
