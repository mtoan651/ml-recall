  - id: pytorch-055
    type: single
    difficulty: medium
    tags:
      - tanh
      - overflow
      - float32
      - numerical-stability
    question: |
      ```python
      x = torch.arange(-100, 100)          # integers -100 ... 99
      def tanh(x):
          return (torch.exp(x) - torch.exp(-x)) / (torch.exp(x) + torch.exp(-x))
      y = tanh(x)
      ```
      What does `y` contain at `x = 99` and at `x = -100`, where `torch.tanh` would give 1 and −1?
    options:
      - text: Exactly 1 and −1, as with `torch.tanh`
        why: '`torch.exp(99)` exceeds the largest float32 value (about $3.4 \times 10^{38}$) and becomes `inf`; `inf/inf` is `nan` [^1][^2].'
      - text: '`nan` at both ends'
        correct: true
      - text: '`inf` and `-inf`'
        why: The numerator and the denominator both overflow, and dividing infinity by infinity gives `nan`, not `inf` [^2].
      - text: 0 at both ends, because the exponentials underflow
        why: $e^{-99} \approx 10^{-43}$ is tiny but still representable, while $e^{99}$ overflows, so the ratio is `inf/inf`.
    explanation: |
      `torch.exp` of an integer tensor returns float32, whose largest value is about $3.4 \times 10^{38}$,
      so $e^{x}$ overflows to `inf` once $x \ge 89$ [^1]. For $x = 99$ the formula computes
      $(\infty - \varepsilon)/(\infty + \varepsilon) = \infty/\infty = \text{nan}$ with a tiny
      $\varepsilon = e^{-99}$, and symmetrically for $x = -100$ [^2]. Library functions
      such as `torch.tanh` use numerically stable formulations and saturate correctly at ±1 [^3].
    references:
      - title: 'Wikipedia: Single-precision floating-point format'
        url: https://en.wikipedia.org/wiki/Single-precision_floating-point_format
        locator: Introduction (largest finite value $\approx 3.4028235 \times 10^{38}$)
      - title: 'Wikipedia: NaN'
        url: https://en.wikipedia.org/wiki/NaN#Operations_generating_NaN
        locator: Section "Operations generating NaN" ($\infty/\infty$)
      - source: learn-pytorch
        locator: 02 PyTorch Classification exercise solutions, Exercise 6 (replicate tanh in pure PyTorch)
        url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/02_pytorch_classification_exercise_solutions.ipynb
    source:
      id: learn-pytorch
      ref: extras/solutions/02_pytorch_classification_exercise_solutions.ipynb#ex6
      url: https://github.com/mrdbourke/pytorch-deep-learning/blob/a16552001d963d078390d5bbdfc321e7e7c94bd1/extras/solutions/02_pytorch_classification_exercise_solutions.ipynb
    status: reviewed
