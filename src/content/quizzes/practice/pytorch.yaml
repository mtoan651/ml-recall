  - id: pytorch-024
    type: single
    difficulty: easy
    tags:
      - reduction
      - tensor-shapes
    question: |
      `X` has shape (2, 3, 4). What are the shapes of `X.sum(axis=0)`, `X.sum(axis=1)` and
      `X.sum(axis=2)`, in that order?
    options:
      - text: (2,), (3,) and (4,)
        why: A sum over one axis removes only that axis; the other two remain [^1].
      - text: (1, 3, 4), (2, 1, 4) and (2, 3, 1)
        why: That is what `keepdims=True` returns; by default the reduced axis disappears [^1][^2].
      - text: (2, 3), (2, 4) and (3, 4)
        why: 'The order is reversed: summing over axis 0 removes the 2, leaving (3, 4).'
      - text: (3, 4), (2, 4) and (2, 3)
        correct: true
    explanation: |
      Summing along an axis reduces it, so that axis is missing from the shape of the output [^1].
      Removing axis 0, 1 or 2 from (2, 3, 4) leaves (3, 4), (2, 4) and (2, 3). Passing
      `keepdims=True` keeps the reduced axis with length 1 instead, which is what you want when the
      result is broadcast back against `X` [^2].
    references:
      - source: d2l
        locator: Sec. 2.3.6 Reduction
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#reduction
      - source: d2l
