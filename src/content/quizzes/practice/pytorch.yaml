    question: |
      ```python
      class MoonModel(nn.Module):
          def __init__(self):
              super().__init__()
              self.layer1 = nn.Linear(2, 10)
              self.layer2 = nn.Linear(10, 10)
              self.layer3 = nn.Linear(10, 1)
              self.relu = nn.ReLU()
          def forward(self, x):
              return self.layer3(self.relu(self.layer2(self.relu(self.layer1(x)))))
      ```
      How many trainable parameters does `MoonModel()` have?
    answer:
      numeric: 151
      tolerance: 0
      hint: a whole number
      model: $(2\cdot10+10) + (10\cdot10+10) + (10\cdot1+1) = 30 + 110 + 11 = 151$
    explanation: |
      An `nn.Linear(in, out)` layer has an `out × in` weight matrix plus `out` biases [^1]. The three
      layers have $30 + 110 + 11 = 151$ parameters, and `nn.ReLU` has none [^1][^2]. The single `relu`
      module can be reused between layers because it holds no state.
