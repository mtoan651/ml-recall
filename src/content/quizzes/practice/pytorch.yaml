  - id: pytorch-022
    type: single
    difficulty: medium
    tags:
      - broadcasting
      - reduction
      - keepdims
    question: |
      What happens when the last line runs?

      ```python
      A = torch.arange(6, dtype=torch.float32).reshape(2, 3)
      A / A.sum(axis=1)
      ```
    options:
      - text: Each column of `A` is divided by its own sum, so every column of the result sums to 1
        why: Column sums come from `axis=0` and have shape (3,); here the vector holds the 2 row sums [^1].
      - text: The whole matrix is divided by the sum of all its entries, which is 15
        why: A reduction over `axis=1` keeps one sum per row; only `A.sum()` without an axis returns the total [^1].
      - text: 'A `RuntimeError`: the (2,) row sums are lined up with the last axis, which has size 3'
        correct: true
      - text: Each row of `A` is divided by its own sum, so that every row of the result sums to exactly 1
        why: That needs the sums as a (2, 1) column, e.g. `A.sum(axis=1, keepdims=True)` [^3]; a (2,) vector lines up with the columns instead [^2].
    explanation: |
      `A.sum(axis=1)` removes axis 1 and returns the row sums $(3, 12)$ with shape (2,) [^1].
      Broadcasting compares shapes from the last axis, so this (2,) vector is matched against the 3
      columns of `A`; the sizes 2 and 3 differ and neither is 1, so PyTorch raises a size-mismatch
      `RuntimeError` [^2]. Keeping the reduced axis with `A.sum(axis=1, keepdims=True)` gives shape
      (2, 1), which broadcasts across the columns and divides each row by its own sum, so every row
      then sums to 1 [^3].
    references:
      - source: d2l
        locator: Sec. 2.3.6 Reduction
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#reduction
      - title: 'PyTorch documentation: Broadcasting semantics'
        locator: General semantics
        url: https://docs.pytorch.org/docs/stable/notes/broadcasting.html#general-semantics
      - source: d2l
        locator: Sec. 2.3.7 Non-Reduction Sum
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#non-reduction-sum
      - source: d2l
        locator: Sec. 2.3.13 Exercises, Exercise 6
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/linear-algebra#ex6
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
