schema_version: 1
domain: practice
topic: pytorch
title: PyTorch
questions:
  - id: pytorch-001
    type: single
    difficulty: easy
    question: Why do we move batches to the device in a training loop?
    options:
      - text: To make each training step run faster.
        why: While it can affect speed, the main reason is compatibility.
      - text: Because the model and the data must be on the same device.
        correct: true
      - text: To reduce how much memory each batch uses.
        why: Moving to device doesn't inherently save memory.
      - text: Because the DataLoader only accepts batches that are on the GPU.
        why: DataLoader doesn't require specific device placement.
    explanation: |
      The training loop picks a device (the GPU if there is one, since on a CPU training can take hours
      instead of minutes), moves the model there, and then moves every batch to the same device with
      `batch = {k: v.to(device) for k, v in batch.items()}` before calling the model [^1]. PyTorch
      doesn't run an operation on tensors that live on different devices; it raises an error [^2]. So
      the move is needed for the forward pass to run at all: it doesn't shrink the batch, and the
      speed-up comes from the GPU, not from the move itself.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/4#the-training-loop
        locator: Chapter 3.4 A full training loop, sec. The training loop
      - title: PyTorch documentation, CUDA semantics
        url: https://docs.pytorch.org/docs/stable/notes/cuda.html#cuda-semantics
        locator: CUDA semantics (introduction)
        quote: Unless you enable peer-to-peer memory access, any attempts to launch ops on tensors spread across different devices will raise an error.
    source:
      id: hf-llm-course
      ref: chapter3/4#q4
      url: https://huggingface.co/learn/llm-course/chapter3/4
    status: draft
  - id: pytorch-002
    type: single
    difficulty: easy
    question: What does `model.eval()` do before evaluation?
    options:
      - text: It freezes the model parameters so they can't be updated.
        why: model.eval() doesn't freeze parameters - that would be done by setting requires_grad=False.
      - text: It switches layers like dropout and batch norm to inference behavior.
        correct: true
      - text: It enables gradient computation for evaluation metrics.
        why: Actually, we typically use torch.no_grad() during evaluation to disable gradient computation.
      - text: It automatically calculates evaluation metrics.
        why: model.eval() only changes layer behavior - you still need to implement metric calculation separately.
    explanation: |
      `model.eval()` (equivalent to `model.train(False)`) puts the module in evaluation mode, which
      only affects layers that behave differently during training, such as dropout and batch
      normalization [^1]. In evaluation mode dropout passes its input through unchanged [^2], and
      batch norm normalizes with the running mean and variance collected during training instead of
      the current batch's statistics [^3]. It has nothing to do with gradients: it neither freezes
      parameters nor turns gradient tracking on or off, which is the job of `requires_grad` and
      `torch.no_grad()` [^4].
    references:
      - title: torch.nn.Module (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html#torch.nn.Module.eval
        locator: Module.eval()
      - title: torch.nn.Dropout (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Dropout.html
        locator: Class description
        quote: This means that during evaluation the module simply computes an identity function.
      - title: torch.nn.BatchNorm2d (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html
        locator: Class description (running estimates)
      - title: Autograd mechanics (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#evaluation-mode-nn-module-eval
        locator: Locally disabling gradient computation, Evaluation Mode (nn.Module.eval())
        quote: Evaluation mode is not a mechanism to locally disable gradient computation.
    source:
      id: hf-llm-course
      ref: chapter3/4#q5
      url: https://huggingface.co/learn/llm-course/chapter3/4
    status: draft
  - id: pytorch-003
    type: single
    difficulty: easy
    question: What is the purpose of `torch.no_grad()` during evaluation?
    options:
      - text: To prevent the model from making predictions.
        why: torch.no_grad() doesn't prevent predictions, just gradient computation.
      - text: To skip gradient tracking, which saves memory and computation.
        correct: true
      - text: To enable evaluation mode for the model.
        why: Evaluation mode is enabled with model.eval(), not torch.no_grad().
      - text: To ensure consistent results across runs.
        why: Reproducibility is handled by setting random seeds, not torch.no_grad().
    explanation: |
      Inside `torch.no_grad()`, autograd does not record operations, and every result has
      `requires_grad=False` even when its inputs require gradients [^1]. Evaluation never calls
      `backward()`, so there is no need to build the graph or keep the intermediate values it stores;
      skipping it reduces memory use and saves that bookkeeping work [^1]. The forward pass still
      runs, so predictions are made as usual, and switching dropout and batch norm to inference
      behavior is the separate job of `model.eval()` [^2].
    references:
      - title: torch.no_grad (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.no_grad.html
        locator: Class description
        quote: Disabling gradient calculation is useful for inference, when you are sure that you will not call Tensor.backward(). It will reduce memory consumption for computations that would otherwise have requires_grad=True.
      - title: Autograd mechanics (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/notes/autograd.html#evaluation-mode-nn-module-eval
        locator: Locally disabling gradient computation, Evaluation Mode (nn.Module.eval())
        quote: Functionally, module.eval() (or equivalently module.train(False)) are completely orthogonal to no-grad mode and inference mode.
    source:
      id: hf-llm-course
      ref: chapter3/4#q6
      url: https://huggingface.co/learn/llm-course/chapter3/4
    status: draft
  - id: pytorch-004
    type: single
    difficulty: medium
    question: Which PyTorch 1.8 command(s) produce a $10\times 5$ Gaussian matrix with each entry i.i.d. sampled from $\mathcal{N}(\mu=5,\sigma^2=16)$ and a $10\times 10$ uniform matrix with each entry i.i.d. sampled from $U[-1,1)$?
    options:
      - text: '`5 + torch.randn(10,5) * 16` ; `torch.rand(10,10,low=-1,high=1)`'
      - text: '`5 + torch.randn(10,5) * 16` ; `(torch.rand(10,10) - 0.5) / 0.5`'
      - text: '`5 + torch.randn(10,5) * 4` ; `2 * torch.rand(10,10) - 1`'
        correct: true
      - text: '`torch.normal(torch.ones(10,5)*5,torch.ones(5,5)*16)` ; `2 * torch.rand(10,10) - 1`'
    explanation: |
      `torch.randn` draws from $\mathcal{N}(0, 1)$ [^1], and $\text{Var}(aX+b) = a^2\,\text{Var}(X)$
      [^2], so variance 16 needs a scale of $\sqrt{16} = 4$: `5 + torch.randn(10,5) * 4`.
      `torch.rand` draws from $U[0, 1)$ [^3], so `2 * torch.rand(10,10) - 1` stretches and shifts it
      to $U[-1, 1)$. Scaling by 16 gives variance 256, which sinks both "`* 16`" options (the
      `(torch.rand(10,10) - 0.5) / 0.5` part is actually fine). `torch.rand` has no `low`/`high`
      arguments [^3]. `torch.normal` takes standard deviations, not variances, and here its std tensor
      has 25 elements while the mean has 50 [^4].
    references:
      - title: torch.randn (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.randn.html
        locator: Function description
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances
      - title: torch.rand (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.rand.html
        locator: Function description and keyword arguments
      - title: torch.normal (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.normal.html
        locator: Parameters (mean, std) and shape note
    source:
      id: mmlu-redux
      ref: machine_learning/72
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=72
    status: draft
  - id: pytorch-005
    type: short_answer
    difficulty: easy
    tags:
      - conv2d
      - tensor-shapes
    question: A mini-batch of 32 RGB images, each $64 \times 64$ pixels, is passed to `nn.Conv2d` in PyTorch's default layout. What is the shape of the input tensor?
    answer:
      accept:
        - (32, 3, 64, 64)
      pattern: '[(\[]?\s*32(?:\s*[,x×*]\s*|\s+)3(?:\s*[,x×*]\s*|\s+)64(?:\s*[,x×*]\s*|\s+)64\s*[)\]]?'
      hint: Four dimensions in order, e.g. (8, 1, 28, 28) or 8×1×28×28
      model: $(32, 3, 64, 64)$ — (batch size, channels, height, width)
    explanation: Convolutional layers take channel-first input with shape (batch size, channels, height, width) [^1]. An RGB image has 3 channels, so the batch has shape $32 \times 3 \times 64 \times 64$.
    references:
      - source: d2l
        locator: Sec. 7.6 Convolutional Neural Networks (LeNet)
        url: https://d2l.ai/chapter_convolutional-neural-networks/lenet.html
        quote: shape given by (batch size, number of channel, height, width)
    source:
      id: original
      ref: pytorch-005
    status: draft
  - id: pytorch-006
    type: single
    difficulty: medium
    question: Your PyTorch training code fails on the GPU with a CUDA error that is **not** an out-of-memory error. What is usually the best way to debug it?
    options:
      - text: Post the error message on the forums or on GitHub
        why: CUDA error messages are usually very uninformative, so others can do little with them either.
      - text: Run the same code on the CPU to get an informative error
        correct: true
      - text: Read the traceback to find the line that caused the error
        why: GPU operations are asynchronous, so the error is raised at a later synchronization point, far from the operation that caused it.
      - text: Reduce the batch size
        why: That is the usual fix for CUDA out-of-memory errors, not for other CUDA errors.
      - text: Restart the Jupyter kernel and run the code again
        why: A CUDA error does break the kernel, so you must restart it, but running the same code again gives the same error.
    explanation: |
      GPU operations run asynchronously: when one fails, the error only surfaces at a later
      synchronization, so the traceback points somewhere unrelated, e.g. at the backward pass for a
      bug in the forward pass [^1] [^2]. Unless it is an out-of-memory error, the course's advice is to
      go back to the CPU, where the same bug gives a precise error message [^1]. PyTorch can also
      force synchronous execution with `CUDA_LAUNCH_BLOCKING=1`, so that the stack trace shows where
      the error happened [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter8/4#going-through-the-model
        locator: 'Chapter 8.4: Debugging the training pipeline, sec. Going through the model'
      - title: CUDA semantics (PyTorch documentation)
        url: https://docs.pytorch.org/docs/2.14/notes/cuda.html#asynchronous-execution
        locator: Asynchronous execution
    source:
      id: hf-llm-course
      ref: chapter8/7#q5
      url: https://huggingface.co/learn/llm-course/chapter8/7
    status: draft
  - id: pytorch-007
    type: single
    difficulty: medium
    question: |
      A $28 \times 28$ RGB image loaded with PIL is passed through
      `torchvision.transforms.ToTensor()`. What comes out?
    options:
      - text: A float tensor of shape (3, 28, 28) with values scaled to [0, 1]
        correct: true
      - text: A float tensor of shape (28, 28, 3) with values from 0 to 255
      - text: An integer tensor of shape (3, 28, 28) with values from 0 to 255
      - text: A float tensor of shape (3, 28, 28) standardized to mean 0 and standard deviation 1
    explanation: |
      A network trains on tensors, and a colour image is a 3D tensor with a colour-depth dimension
      [^1]. `ToTensor` converts a PIL image or a `uint8` NumPy array of shape (H, W, C) with values in
      [0, 255] into a `FloatTensor` of shape (C, H, W) with values in [0.0, 1.0] [^2]. It moves the
      channels first and rescales, but it does not standardize; subtracting a mean and dividing by a
      standard deviation per channel is the separate `Normalize` transform [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/README.md
        locator: 'Lesson: Convolutional Neural Networks, introduction'
      - title: torchvision documentation
        url: https://docs.pytorch.org/vision/stable/generated/torchvision.transforms.ToTensor.html
        locator: torchvision.transforms.ToTensor
      - title: torchvision documentation
        url: https://docs.pytorch.org/vision/stable/generated/torchvision.transforms.Normalize.html
        locator: torchvision.transforms.Normalize
    source:
      id: ms-ai-for-beginners
      ref: quiz-207/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-7.json
