    reviewed_by: claude
  - id: pytorch-019
    type: short_answer
    difficulty: medium
    tags:
      - broadcasting
      - tensor-shapes
    question: |
      What is the shape of `c`?

      ```python
      a = torch.arange(8).reshape(2, 1, 4)
      b = torch.arange(3).reshape(3, 1)
      c = a + b
      ```
    answer:
      accept:
        - (2, 3, 4)
      pattern: (torch\.size)?\(?\[?\s*2\s*[,x×]\s*3\s*[,x×]\s*4\s*\]?\)?
      hint: Three dimensions in order, e.g. (5, 6, 7)
      model: '$(2, 3, 4)$: `b` is treated as shape (1, 3, 1), and every axis of length 1 is stretched to match.'
    explanation: |
      Broadcasting lines the shapes up from the last axis and prepends axes of length 1 to the tensor
      with fewer axes, so `b`'s shape (3, 1) is read as (1, 3, 1) [^2]. Then every axis of length 1
      is expanded by copying to match the other operand [^1]: axis 0 takes 2 from `a`, axis 1 takes 3
      from `b`, and axis 2 takes 4 from `a`. The result has shape (2, 3, 4), with
      `c[i, j, k] = a[i, 0, k] + b[j, 0]`. Two sizes that differ and are both larger than 1, such as
      3 and 4 on the same axis, would raise an error instead [^2].
    references:
      - source: d2l
        locator: Sec. 2.1.4 Broadcasting
        url: https://d2l.ai/chapter_preliminaries/ndarray.html#broadcasting
      - title: 'PyTorch documentation: Broadcasting semantics'
        locator: General semantics
        url: https://docs.pytorch.org/docs/stable/notes/broadcasting.html#general-semantics
      - source: d2l
        locator: Sec. 2.1.8 Exercises, Exercise 2
        url: https://d2l.ai/chapter_preliminaries/ndarray.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/ndarray#ex2
      url: https://d2l.ai/chapter_preliminaries/ndarray.html#exercises
