  - id: pytorch-025
    type: short_answer
    difficulty: medium
    tags:
      - norms
      - frobenius-norm
      - linalg
    question: What does `torch.linalg.norm(torch.ones(2, 3, 4))` return? Round to 3 decimals.
    answer:
      numeric: 4.899
      tolerance: 0.001
      hint: a number, 3 decimals
      model: '$\sqrt{24} \approx 4.899$: the tensor is flattened and its $\ell_2$ norm is taken.'
    explanation: |
      When neither `dim` nor `ord` is given, `torch.linalg.norm` flattens its input into a vector and
      returns that vector's 2-norm [^1]. So for a tensor with any number of axes it computes the square
      root of the sum of all squared entries, the same idea as the Frobenius norm of a matrix, which
      behaves like an $\ell_2$ norm of a matrix-shaped vector [^2]. Here there are 24 ones, giving
      $\sqrt{24} \approx 4.899$.
    references:
      - title: 'PyTorch documentation: torch.linalg.norm'
        locator: Function description
        url: https://docs.pytorch.org/docs/stable/generated/torch.linalg.norm.html
