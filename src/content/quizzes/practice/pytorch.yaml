  - id: pytorch-034
    type: short_answer
    difficulty: easy
    tags:
      - autograd
      - parameters
      - nn-linear
    question: |
      What is the shape of `net.weight.grad` after this code runs?

      ```python
      net = nn.Linear(2, 1)
      X, y = torch.randn(8, 2), torch.randn(8, 1)
      loss = nn.MSELoss()(net(X), y)
      loss.backward()
      ```
    answer:
      accept:
        - (1, 2)
      pattern: (torch\.size)?\(?\[?\s*1\s*[,x×]\s*2\s*\]?\)?
      hint: Two dimensions, e.g. (3, 4)
      model: (1, 2), the shape of `net.weight`, which is (out_features, in_features)
    explanation: |
      After `backward()`, the gradient of each parameter is stored in its `.grad` attribute, a tensor
      with the same shape as the parameter; before the first backward pass it is `None` [^1].
      `nn.Linear` stores its weight with shape (out_features, in_features) [^2], here (1, 2), so
      `net.weight.grad` has shape (1, 2) and `net.bias.grad` has shape (1,). The batch size 8 does not
      appear: the loss averages over the examples, and their contributions are summed into one gradient
      per parameter.
    references:
      - source: d2l
        locator: Sec. 2.5.1 A Simple Function
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
