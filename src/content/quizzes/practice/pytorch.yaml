  - id: pytorch-027
    type: single
    difficulty: hard
    tags:
      - autograd
      - norms
      - differentiability
      - nan
    question: |
      Mathematically, $f(\mathbf{x}) = \lVert\mathbf{x}\rVert_2$ has the gradient
      $\mathbf{x}/\lVert\mathbf{x}\rVert_2$ for $\mathbf{x} \neq \mathbf{0}$. What does `x.grad` contain
      after this code runs at $\mathbf{x} = \mathbf{0}$?

      ```python
      x = torch.zeros(3, requires_grad=True)
      f = torch.sqrt((x ** 2).sum())
      f.backward()
      ```
    options:
      - text: '`[1., 1., 1.]`, the limit of $\mathbf{x}/\lVert\mathbf{x}\rVert_2$ as $\mathbf{x}$ approaches $\mathbf{0}$'
        why: '$\mathbf{x}/\lVert\mathbf{x}\rVert_2$ has no limit at $\mathbf{0}$: it is a unit vector pointing in whatever direction you come from.'
      - text: A `RuntimeError`, because the norm is not differentiable at 0
        why: Autograd does not check differentiability; it evaluates each local derivative, which here produces $0 \cdot \infty$.
      - text: '`[nan, nan, nan]`: the chain rule multiplies 0 by the infinite slope of $\sqrt{u}$ at 0'
        correct: true
      - text: '`[0., 0., 0.]`, because 0 is the minimum of the norm'
        why: Zero is a valid subgradient there, and `torch.linalg.norm` returns it, but this hand-written version follows the chain rule literally [^1].
    explanation: |
      Autograd applies the chain rule one operation at a time [^1]: the derivative of $\sqrt{u}$ is
      $\frac{1}{2\sqrt{u}}$, infinite at $u = 0$, and the derivative of $u = \sum_i x_i^2$ is
      $2\mathbf{x} = \mathbf{0}$, so every entry becomes $0 \cdot \infty$, which is `nan`. This mirrors
      the math: away from $\mathbf{0}$ the gradient is $\mathbf{x}/\lVert\mathbf{x}\rVert_2$ [^3], but at
      $\mathbf{0}$ the norm has a cone-shaped kink, like $|t|$ at 0, and no gradient [^2]. Library
      functions choose a subgradient at such points: `torch.linalg.norm` returns zeros there (checked
      with PyTorch 2.11), one reason to prefer built-in norms over hand-written ones.
    references:
      - source: d2l
        locator: Sec. 2.5.1 A Simple Function
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation (differentiability)
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
      - source: d2l
        locator: Sec. 2.4.3 Partial Derivatives and Gradients
        url: https://d2l.ai/chapter_preliminaries/calculus.html#partial-derivatives-and-gradients
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 8
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex8
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-028
    type: single
    difficulty: medium
    tags:
      - autograd
      - second-derivatives
      - hessian
    question: |
      Why is the full matrix of second derivatives (the Hessian) of a loss with $n$ parameters much
      more expensive to get from an autograd framework than its gradient?
    options:
      - text: Autograd only knows first-order rules, so second derivatives always fall back to finite differences
        why: Autograd can differentiate its own backward pass when that pass is recorded (`create_graph=True` in PyTorch) [^2]; no finite differences are needed.
      - text: The forward pass has to be rerun from scratch once for every pair of parameters $(i, j)$
        why: The extra cost comes from differentiating the gradient computation, not from rerunning the forward pass per parameter pair.
      - text: Backpropagation needs a scalar output, so second derivatives cannot be computed at all
        why: Each entry of the gradient is a scalar, so it can be backpropagated; it just has to be done many times.
      - text: The backward pass is recorded and differentiated again, once per gradient entry, for $n^2$ numbers
        correct: true
    explanation: |
      Autograd records the forward computation as a graph and gets the whole gradient from one
      backward pass through it [^1]. For second derivatives, the backward pass itself has to be
      recorded as a new graph (in PyTorch, `backward(create_graph=True)`) and then differentiated
      again [^2]. Each such extra pass yields one row of the Hessian, so the full $n \times n$ matrix
      needs about $n$ of them, and its $n^2$ entries are far too many to store for a network with
      millions of parameters.
    references:
      - source: d2l
        locator: Sec. 2.5 Automatic Differentiation (introduction)
        url: https://d2l.ai/chapter_preliminaries/autograd.html
      - title: 'PyTorch documentation: torch.Tensor.backward'
        locator: Parameters retain_graph and create_graph
        url: https://docs.pytorch.org/docs/stable/generated/torch.Tensor.backward.html
      - source: d2l
        locator: Sec. 2.5.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/autograd#ex1
      url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-029
    type: single
    difficulty: medium
    tags:
      - autograd
      - backward
      - retain-graph
    question: |
      What happens when the last line runs?

      ```python
      x = torch.arange(4.0, requires_grad=True)
      y = 2 * torch.dot(x, x)
      y.backward()
      y.backward()
      ```
    options:
      - text: A `RuntimeError`, since the first call freed the values the graph saved
        correct: true
      - text: '`x.grad` becomes `[0., 8., 16., 24.]`, because the second call adds to the first'
        why: This happens only with `y.backward(retain_graph=True)` in the first call; by default the graph is freed after one backward pass [^1].
      - text: '`x.grad` stays `[0., 4., 8., 12.]`, because the second call overwrites it'
        why: 'PyTorch never overwrites `.grad`: when a second backward pass does run, it adds to the stored gradient [^2].'
      - text: Nothing, because PyTorch skips a repeated backward call on the same output
        why: PyTorch does not cache backward calls; it tries to run the pass again and fails because the saved values are gone [^1].
    explanation: |
      By default, `backward` frees the graph and the intermediate values saved for it once the
      gradients are computed [^1]. `torch.dot` saved `x` for its backward rule, so the second call
      raises "Trying to backward through the graph a second time". With `retain_graph=True` in the
      first call the second one would run, and because PyTorch adds new gradients to the stored ones
      instead of resetting them, `x.grad` would double from $4\mathbf{x}$ to $8\mathbf{x}$ [^2]. An
      output whose backward rule saves nothing, such as `x.sum()`, can even be backpropagated twice
      without it.
    references:
      - title: 'PyTorch documentation: torch.Tensor.backward'
        locator: Parameter retain_graph
        url: https://docs.pytorch.org/docs/stable/generated/torch.Tensor.backward.html
        quote: If False, the graph used to compute the grads will be freed.
      - source: d2l
        locator: Sec. 2.5.1 A Simple Function
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
      - source: d2l
        locator: Sec. 2.5.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/autograd#ex2
      url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-030
    type: single
    difficulty: hard
    tags:
      - autograd
      - control-flow
      - non-scalar-backward
    question: |
      `f` doubles its input until the norm reaches 1000 and multiplies by 100 if the sum is not
      positive. Now `a` is a vector:

      ```python
      def f(a):
          b = a * 2
          while b.norm() < 1000:
              b = b * 2
          if b.sum() > 0:
              c = b
          else:
              c = 100 * b
          return c

      a = torch.randn(3, requires_grad=True)
      d = f(a)
      ```

      Which statement is correct?
    options:
      - text: After `d.sum().backward()`, each entry of `a.grad` has a different value, one per entry of `a`
        why: The loop and the sign test look at the whole vector, so all entries share one scale $k$ and $\mathbf{d} = k\mathbf{a}$.
      - text: '`d.backward()` fails; after `d.sum().backward()`, all entries of `a.grad` equal `d[0] / a[0]`'
        correct: true
      - text: '`d.backward()` works and fills `a.grad` with the 3 × 3 Jacobian matrix of `d` with respect to `a`'
        why: '`a.grad` always has the shape of `a`, and PyTorch refuses `backward` on a non-scalar output without a `gradient` argument [^1].'
      - text: No gradient exists, because the number of loop iterations and the branch both depend on `a`
        why: Autograd records whichever branch and number of iterations actually ran, so the control flow is no obstacle [^2].
    explanation: |
      `f` only multiplies its input by a scale $k$ (a power of 2, times 100 in the second branch), and
      the norm and the sum look at the whole vector, so for a given input $\mathbf{d} = k\mathbf{a}$
      with one shared $k$ [^2]. `d` is a vector, and PyTorch refuses `backward` on a non-scalar unless
      it gets a `gradient` vector or the output is reduced first, e.g. with `.sum()` [^1]. The gradient
      of $\sum_i d_i = k \sum_i a_i$ is $k$ in every coordinate, so `a.grad` equals `d / a` entrywise,
      as in the scalar case [^2].
    references:
      - source: d2l
        locator: Sec. 2.5.2 Backward for Non-Scalar Variables
        url: https://d2l.ai/chapter_preliminaries/autograd.html#backward-for-non-scalar-variables
      - source: d2l
        locator: Sec. 2.5.4 Gradients and Python Control Flow
        url: https://d2l.ai/chapter_preliminaries/autograd.html#gradients-and-python-control-flow
      - source: d2l
        locator: Sec. 2.5.6 Exercises, Exercise 3
        url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/autograd#ex3
      url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-031
    type: short_answer
    difficulty: medium
    tags:
      - autograd
      - chain-rule
      - derivatives
    question: |
      What does the last line print? Round to 3 decimals.

      ```python
      x = torch.tensor(1.0, requires_grad=True)
      f = torch.log(x ** 2) * torch.sin(x) + 1 / x
      f.backward()
      print(x.grad)
      ```
    answer:
      numeric: 0.683
      tolerance: 0.002
      hint: a number, 3 decimals
      model: "$f'(x) = \\frac{2}{x}\\sin x + \\log(x^2)\\cos x - \\frac{1}{x^2}$; at $x = 1$: $2\\sin 1 - 1 \\approx 0.683$"
    explanation: |
      `backward` applies the chain rule through the recorded operations, so `x.grad` holds $f'(1)$
      [^1]. By hand, the product rule gives
      $\frac{d}{dx}[\log(x^2)\sin x] = \frac{2}{x}\sin x + \log(x^2)\cos x$, using
      $\frac{d}{dx}\log(x^2) = \frac{2x}{x^2} = \frac{2}{x}$ from the chain rule, and
      $\frac{d}{dx}x^{-1} = -x^{-2}$ [^2]. At $x = 1$ the logarithm is 0, which leaves
      $2\sin 1 - 1 \approx 0.683$.
    references:
      - source: d2l
        locator: Sec. 2.5.1 A Simple Function
        url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation (rules)
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
      - source: d2l
        locator: Sec. 2.5.6 Exercises, Exercise 6
        url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/autograd#ex6
      url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-032
    type: single
    difficulty: medium
    tags:
      - autograd
      - reverse-mode
      - forward-mode
    question: |
      PyTorch's autograd computes gradients in reverse mode, from the loss back to the inputs. Why
      does this suit training a network with millions of parameters better than forward mode?
    options:
      - text: Forward mode cannot pass derivatives through nonlinear functions such as ReLU or softmax
        why: Both modes apply the same chain rule to the same elementary operations; they differ only in the order of the products [^1].
      - text: Reverse mode gives exact derivatives, while forward mode only gives approximations
        why: Both modes compute exact derivatives, up to rounding; neither uses finite differences [^1].
      - text: One backward pass gives all parameter derivatives; forward mode needs one pass per parameter
        correct: true
      - text: Reverse mode needs to store fewer intermediate values of the forward computation than forward mode
        why: "The opposite: reverse mode must keep the forward pass's intermediate values until the backward pass is done [^2]."
    explanation: |
      For a function $f: \mathbb{R}^n \to \mathbb{R}^m$, forward mode pushes derivatives from the
      inputs to the outputs and gets one column of the Jacobian per pass, while reverse mode pulls them
      from the outputs back and gets one row per pass [^1]. Training has $n$ in the millions and a
      single scalar loss ($m = 1$), so one reverse pass yields the whole gradient [^1]. The price is
      memory: reverse mode has to keep the intermediate values of the forward pass until
      backpropagation is done [^2]. Forward mode wins in the opposite case, with few inputs and many
      outputs.
    references:
      - title: 'Wikipedia: Automatic differentiation'
        locator: Forward and reverse accumulation
        url: https://en.wikipedia.org/wiki/Automatic_differentiation#Forward_and_reverse_accumulation
      - source: d2l
        locator: Sec. 5.3.4 Training Neural Networks
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#training-neural-networks
      - source: d2l
        locator: Sec. 2.5.6 Exercises, Exercise 8
        url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/autograd#ex8
      url: https://d2l.ai/chapter_preliminaries/autograd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: pytorch-033
    type: short_answer
    difficulty: medium
    tags:
      - loss-reduction
      - learning-rate
      - mse-loss
    question: |
      Training with `nn.MSELoss()` (the default `reduction='mean'`) and `torch.optim.SGD` with
      `lr=0.03` works well on minibatches of 64 examples. You switch to
      `nn.MSELoss(reduction='sum')`. Which learning rate gives exactly the same parameter updates?
    answer:
      numeric: 0.000469
      tolerance: 5e-06
      hint: a number, e.g. 0.0012
      model: '$0.03 / 64 \approx 0.000469$: the summed loss, and so its gradient, is 64 times the mean.'
    explanation: |
      With `reduction='mean'` the summed loss is divided by the number of elements, with `'sum'` it is
      not [^1], so the summed loss and its gradient are $|\mathcal{B}| = 64$ times larger. An SGD step
      is the learning rate times the gradient, so dividing the learning rate by 64 compensates exactly.
      d2l's update rule averages over the minibatch, which is why its learning rate does not have to be
      adjusted to the batch size [^2]; with a summed loss, the effective step would change whenever the
      batch size does.
    references:
      - title: 'PyTorch documentation: torch.nn.MSELoss'
        locator: Parameter reduction
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.MSELoss.html
      - source: d2l
        locator: Sec. 3.4.3 Defining the Optimization Algorithm
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#defining-the-optimization-algorithm
      - source: d2l
        locator: Sec. 3.5.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-regression/linear-regression-concise.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-concise#ex1
      url: https://d2l.ai/chapter_linear-regression/linear-regression-concise.html#exercises
