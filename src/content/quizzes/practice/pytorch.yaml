  - id: pytorch-041
    type: short_answer
    difficulty: medium
    tags:
      - lstm
      - reshape
      - shapes
      - code-reading
    question: |
      A character-level LSTM with `batch_first=True` and `n_hidden = 256` processes a batch of 10
      sequences of 50 characters over a vocabulary of 83 characters:

      ```python
      r_output, hidden = self.lstm(x, hidden)          # r_output: (10, 50, 256)
      out = r_output.contiguous().view(-1, self.n_hidden)
      out = self.fc(out)                               # fc = nn.Linear(256, 83)
      ```

      What is the shape of `out`?
    answer:
      accept:
        - (500, 83)
      pattern: (?:torch\.size\(\s*)?[(\[]?\s*500\s*[,x×]\s*83\s*[)\]]?\s*\)?
      hint: two numbers, e.g. (64, 10)
      model: '`view(-1, 256)` stacks all $10 \times 50 = 500$ time steps: $(500, 256) \to$ `fc` $\to (500, 83)$'
    explanation: |
      `view(-1, n_hidden)` stacks the outputs of every time step of every sequence into rows,
      $10 \cdot 50 = 500$ rows of 256 values (`contiguous()` is needed first because the LSTM output
      may not be stored contiguously) [^1]. The linear layer maps each row to 83 character scores,
      so one cross-entropy loss covers all 500 next-character predictions, with the targets flattened
      the same way [^1].
