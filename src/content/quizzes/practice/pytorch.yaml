  - id: pytorch-040
    type: single
    difficulty: medium
    tags:
      - log-softmax
      - nll-loss
      - cross-entropy-loss
      - code-reading
    question: |
      A pretrained DenseNet gets a new classifier and loss:

      ```python
      model.classifier = nn.Sequential(nn.Linear(1024, 256), nn.ReLU(), nn.Dropout(0.2),
                                       nn.Linear(256, 2), nn.LogSoftmax(dim=1))
      criterion = nn.NLLLoss()
      ```

      Why is `NLLLoss` the right loss here rather than `nn.CrossEntropyLoss`?
    options:
      - text: The outputs are already log-probabilities; `CrossEntropyLoss` would normalize again
        correct: true
      - text: '`CrossEntropyLoss` only works for more than two classes'
        why: '`CrossEntropyLoss` works for any number of classes, two included [^1].'
      - text: '`NLLLoss` applies the softmax that the model is missing'
        why: '`NLLLoss` applies no softmax; it just picks the negative log-probability of the true class from its input [^1].'
      - text: '`CrossEntropyLoss` needs one-hot encoded targets, while `NLLLoss` takes class indices'
        why: Both accept class-index targets [^1].
    explanation: |
      `CrossEntropyLoss` combines `LogSoftmax` and `NLLLoss` and expects raw logits [^1]. The
      classifier here ends in `LogSoftmax`, so its outputs are already log-probabilities, and
      `NLLLoss` completes the cross-entropy; `torch.exp(output)` recovers probabilities for
      accuracy [^2]. Feeding log-probabilities to `CrossEntropyLoss` would normalize twice.
    references:
      - title: 'PyTorch documentation: CrossEntropyLoss'
        url: https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
        locator: description (input is unnormalized logits; LogSoftmax + NLLLoss)
      - source: udacity-dl-pytorch
        locator: Intro to PyTorch, Part 8 - Transfer Learning (Solution), classifier and training loop
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/intro-to-pytorch/Part%208%20-%20Transfer%20Learning%20(Solution).ipynb
