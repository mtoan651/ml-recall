  - id: huggingface-037
    type: single
    difficulty: easy
    question: |
      In a PyTorch training loop for a 🤗 Transformers model you can write

      ```py
      outputs = model(**batch)
      loss = outputs.loss
      loss.backward()
      ```

      without defining a loss function yourself. Why?
    options:
      - text: Transformer models are trained without supervision, so they need no loss function
        why: Every model trained by gradient descent needs a loss; here the model computes it internally.
      - text: When the batch contains `labels`, the model computes the loss itself and returns it
        correct: true
      - text: '`outputs.loss` is the metric that `compute_metrics()` returns after each evaluation'
        why: '`compute_metrics()` reports evaluation metrics; it is not run in the forward pass and is not what gets back-propagated.'
      - text: The optimizer computes the loss from the gradients during `optimizer.step()`
        why: It is the other way round. The loss comes first, `backward()` turns it into gradients, and the optimizer only uses them to update the weights.
    explanation: |
      All 🤗 Transformers models return the loss when `labels` are provided, alongside the logits [^1].
      A manual training loop therefore takes `outputs.loss`, calls `backward()` on it and then steps
      the optimizer [^1]. The loss is handled by the model, while `compute_metrics()` only computes
      evaluation metrics such as accuracy or F1 [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/4#prepare-for-training
        locator: 'Chapter 3.4: A full training loop, secs. Prepare for training and The training loop'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter3/3
        locator: 'Chapter 3.3: Fine-tuning a model with the Trainer API, section quiz on compute_metrics'
    source:
      id: hf-llm-course
      ref: chapter7/9#q9
      url: https://huggingface.co/learn/llm-course/chapter7/9
