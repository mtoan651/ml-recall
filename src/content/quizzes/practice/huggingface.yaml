  - id: huggingface-032
    type: single
    difficulty: easy
    question: 🤗 Datasets treats each dataset as a memory-mapped file. What is memory mapping?
    options:
      - text: A mapping between CPU RAM and GPU memory
        why: Memory mapping is about RAM and files on disk, not about moving data to the GPU.
      - text: A mapping between RAM and filesystem storage
        correct: true
      - text: A mapping between two files in the 🤗 Datasets cache
        why: It maps a file on disk into memory, not one file onto another.
      - text: A mapping from each token to its ID in the vocabulary
        why: That is the tokenizer's vocabulary, which has nothing to do with how the dataset is stored.
    explanation: |
      🤗 Datasets treats each dataset as a memory-mapped file, which provides a mapping between RAM and
      filesystem storage [^1]. The library can then access and operate on elements of the dataset
      without loading all of it into memory, which is how a dataset of almost 20 GB can be used with
      far less RAM [^1]. It has nothing to do with GPU memory or with a tokenizer's vocabulary.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
        locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. The magic of memory mapping'
    source:
      id: hf-llm-course
      ref: chapter5/8#q4
      url: https://huggingface.co/learn/llm-course/chapter5/8
    status: draft
  - id: huggingface-033
    type: multiple
    difficulty: medium
    question: What are the main benefits of the memory mapping used by 🤗 Datasets?
    options:
      - text: Several processes can share one memory-mapped file, so `Dataset.map()` can run in parallel without copying the data
        correct: true
      - text: Programs can access parts of an extremely large file without first reading the whole file into RAM
        correct: true
      - text: The whole dataset is read into RAM once, so that later accesses never touch the disk
        why: It is the opposite. Memory mapping avoids loading the whole dataset into RAM.
      - text: The dataset is compressed, so that it takes up much less space on disk
        why: Memory mapping changes how a file is accessed, not how big it is on disk.
    explanation: |
      A memory-mapped dataset can be accessed and operated on without being fully loaded into memory
      [^1]. Memory-mapped files can also be shared across processes, so methods like `Dataset.map()`
      can be parallelized without moving or copying the dataset [^1]. Memory mapping neither loads
      everything into RAM up front nor compresses the data; for corpora too large even for the disk,
      the course turns to streaming [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
        locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, secs. The magic of memory mapping and Streaming datasets'
    source:
      id: hf-llm-course
      ref: chapter5/8#q5
      url: https://huggingface.co/learn/llm-course/chapter5/8
    status: draft
  - id: huggingface-034
    type: single
    difficulty: easy
    question: |
      With `streaming=True`, `load_dataset()` does not download the whole dataset first:

      ```py
      from datasets import load_dataset

      dataset = load_dataset("allocine", streaming=True, split="train")
      ```

      Why can't you get the first review with `dataset[0]`, as you could without streaming?
    options:
      - text: It is too large to fit in RAM, so streaming refuses to return single elements
        why: Streamed datasets are decompressed on the fly, so you can process terabyte-sized datasets with very little RAM.
      - text: Streaming returns an `IterableDataset`, which has no random access by index
        correct: true
      - text: The `allocine` dataset has no `train` split
        why: It has train, validation and test splits; the problem is the type of object that streaming returns.
      - text: Streamed examples arrive as token IDs and must be decoded before they can be read
        why: Streamed examples are ordinary dicts of raw fields, as in a regular dataset; tokenizing is a separate `map()` step.
    explanation: |
      With `streaming=True`, `load_dataset()` returns an `IterableDataset` instead of a `Dataset`, and
      its elements are accessed by iterating over it, e.g. `next(iter(dataset))` [^1]. Streaming is
      meant precisely for corpora too large for RAM or even the disk, because entries are read on the
      fly [^1]. To pick examples from a stream you use `take()` and `skip()` rather than indices [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter5/4#streaming-datasets
        locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. Streaming datasets'
    source:
      id: hf-llm-course
      ref: chapter5/8#q6
      url: https://huggingface.co/learn/llm-course/chapter5/8
    status: draft
  - id: huggingface-035
    type: multiple
    difficulty: easy
    question: Which of the following are the main benefits of writing a dataset card for a dataset you share on the Hub?
    options:
      - text: It tells others the intended use and supported tasks, so they can decide whether the dataset suits them
        correct: true
      - text: It draws attention to the biases present in the corpus
        correct: true
      - text: It makes it more likely that others in the community will use the dataset
        correct: true
      - text: It removes the biases in the corpus by documenting them
        why: Documenting a bias helps users evaluate the risks, but it does not change the data.
    explanation: |
      A dataset card, the repository's README.md, gives users the context to decide whether the
      dataset is relevant to their task and to evaluate potential biases or risks in using it [^1].
      Well-documented datasets are also more likely to be useful to others, including your future self
      [^1]. Writing down a bias does not remove it from the data, though.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter5/5#creating-a-dataset-card
        locator: 'Chapter 5.5: Creating your own dataset, sec. Creating a dataset card'
