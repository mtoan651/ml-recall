  - id: autoencoders-020
    type: single
    difficulty: medium
    tags:
      - vae
      - representation-learning
      - rsa
    question: |
      NMA trains a VAE on dSprites: white shapes (heart, square or oval) with random scale, orientation and
      position. Its reconstructions keep these factors fairly well. But comparing the encoder's features across
      images shows that only images with similar positions get similar features; shape barely matters, and a linear
      shape classifier on these features does poorly. What does this show?
    options:
      - text: Good reconstruction does not guarantee a feature space organized by the factors a downstream task needs
        correct: true
      - text: The VAE must be undertrained, since a well-trained VAE encodes every factor in its own dimension
        why: Nothing in the reconstruction objective forces the latent space to align with shape; a space organized mostly by position satisfies it.
      - text: The decoder, not the encoder, stores the shape information, so classify the decoder weights instead
        why: A classifier works on the encoder features of each image; the finding is that these features are not organized by shape.
      - text: Feature similarity cannot be measured for generative models, so the comparison is meaningless
        why: Cosine similarities between encoder features can be computed for any encoder; NMA does so for supervised, random, VAE and SimCLR encoders.
    explanation: |
      Reconstruction only requires that the image can be recovered from the code; it says nothing about how the code
      space is organized [^1]. NMA's representational similarity matrices show that the VAE's features are structured
      mostly by `posX` and `posY`, not by `shape`, so a linear shape classifier does poorly even though the decoded images
      look right [^1]. A supervised encoder trained on shape labels groups images by shape, and a contrastive SimCLR
      encoder recovers shape without labels [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Section 4 Generative approaches to representation learning can fail (Discussions 4.1.1 and 4.1.2)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Bonus 1 Self-supervised networks learn representation invariance
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
