topic: autoencoders
title: Autoencoders & VAEs
questions:
  - id: autoencoders-001
    type: single
    difficulty: easy
    question: Self-supervised learning uses ____ data for training
    options:
      - text: pre-trained
      - text: raw
        correct: true
      - text: labeled
    explanation: |
      Self-supervised learning trains on raw, unlabeled data. The training targets come from the
      data itself, so an autoencoder can use each image as both its input and its target [^1].
      This is why autoencoders count as self-supervised rather than truly unsupervised: they are
      a form of supervised learning whose targets are generated from the inputs [^2]. Labeled
      data would make it ordinary supervised learning. "Pre-trained" describes a model, not a
      kind of training data.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
        locator: Lesson 9 "Autoencoders", introduction
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "So what's the big deal with autoencoders?"
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-002
    type: true_false
    difficulty: easy
    question: Encoder Network coverts input images into latent spaces
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      An autoencoder is made of two networks. The encoder maps the input image to a latent
      space, normally a much smaller vector, and the decoder tries to rebuild the original image
      from that vector [^1]. In a variational autoencoder the encoder still maps into the latent
      space, but it outputs the parameters of a distribution there (a mean and a log-sigma)
      instead of a single point [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
        locator: Lesson 9 "Autoencoders", introduction
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "Variational autoencoder (VAE)"
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-003
    type: single
    difficulty: easy
    question: VAE is short for?
    options:
      - text: Variable AutoEncoding
      - text: Variational autoencoder
        correct: true
      - text: Variational automated encoders
    explanation: |
      VAE stands for variational autoencoder: an autoencoder whose encoder predicts a
      distribution over the latent vector, from which the decoder's input is sampled [^1]. The
      "variational" part comes from variational inference. Kingma and Welling fit an approximate
      posterior (the encoder, or recognition model) by optimizing a variational lower bound on
      the data likelihood [^2]. The other two options are made-up expansions.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#variational-autoencoders-vae
        locator: Lesson 9 "Autoencoders", section "Variational Autoencoders (VAE)"
      - title: Kingma & Welling (2013), Auto-Encoding Variational Bayes
        url: https://arxiv.org/abs/1312.6114
        locator: Abstract; Sec. 2.2 The variational bound
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
