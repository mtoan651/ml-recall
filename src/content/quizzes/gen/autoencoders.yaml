  - id: autoencoders-016
    type: single
    difficulty: medium
    tags:
      - convolutional-autoencoder
      - bias
      - pca
    question: |
      NMA's convolutional autoencoder for grayscale images starts its encoder and ends its decoder with a custom
      `BiasLayer` that adds a learnable offset to every pixel. Why add it, when `nn.Conv2d` already has a bias?
    options:
      - text: A convolution has one bias per output channel, shared by all pixels, so it cannot store a mean image the way PCA centering does
        correct: true
      - text: '`nn.Conv2d` has no bias by default, so without the custom layer the network would have no offsets at all'
        why: '`nn.Conv2d` has `bias=True` by default; the issue is that its bias is per channel, not per pixel.'
      - text: A per-pixel bias makes the encoder invariant to translations of the digit within the image
        why: A fixed offset per pixel location ties values to positions, like a mean image; it adds no translation invariance.
      - text: It doubles the effective learning rate of the first layer, which speeds up training
        why: 'Its purpose is representational: it lets the network model the average image, leaving the other layers to fit finer structure.'
    explanation: |
      PCA subtracts the mean image before encoding and adds it back after decoding, and an `nn.Linear` decoder can
      learn the same thing through its bias, one per output pixel [^1]. A convolution applies the same bias at every
      location, so for a one-channel output `Conv2d` learns a single bias for the whole image [^1][^2]. The `BiasLayer`
      restores a per-pixel offset at both ends, so the convolutional layers can spend their capacity on finer
      structure [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 3.2 Building a nonlinear convolutional autoencoder (side note on biases)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: 'PyTorch documentation: torch.nn.Conv2d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html
        locator: Variables (bias of shape out_channels)
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#sec3.2-bias
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
