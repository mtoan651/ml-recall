topic: autoencoders
title: Autoencoders & VAEs
questions:
  - id: autoencoders-001
    type: single
    difficulty: easy
    question: Self-supervised learning uses ____ data for training
    options:
      - text: pre-trained
      - text: raw
        correct: true
      - text: labeled
    explanation: |
      Self-supervised learning trains on raw, unlabeled data. The training targets come from the
      data itself, so an autoencoder can use each image as both its input and its target [^1].
      This is why autoencoders count as self-supervised rather than truly unsupervised: they are
      a form of supervised learning whose targets are generated from the inputs [^2]. Labeled
      data would make it ordinary supervised learning. "Pre-trained" describes a model, not a
      kind of training data.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
        locator: Lesson 9 "Autoencoders", introduction
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "So what's the big deal with autoencoders?"
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-002
    type: true_false
    difficulty: easy
    question: An autoencoder's encoder network maps input images into a latent space.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      An autoencoder is made of two networks. The encoder maps the input image to a latent
      space, normally a much smaller vector, and the decoder tries to rebuild the original image
      from that vector [^1]. In a variational autoencoder the encoder still maps into the latent
      space, but it outputs the parameters of a distribution there (a mean and a log-sigma)
      instead of a single point [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
        locator: Lesson 9 "Autoencoders", introduction
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "Variational autoencoder (VAE)"
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-003
    type: single
    difficulty: easy
    question: VAE is short for?
    options:
      - text: Variable AutoEncoding
      - text: Variational autoencoder
        correct: true
      - text: Variational automated encoders
    explanation: |
      VAE stands for variational autoencoder: an autoencoder whose encoder predicts a
      distribution over the latent vector, from which the decoder's input is sampled [^1]. The
      "variational" part comes from variational inference. Kingma and Welling fit an approximate
      posterior (the encoder, or recognition model) by optimizing a variational lower bound on
      the data likelihood [^2]. The other two options are made-up expansions.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#variational-autoencoders-vae
        locator: Lesson 9 "Autoencoders", section "Variational Autoencoders (VAE)"
      - title: Kingma & Welling (2013), Auto-Encoding Variational Bayes
        url: https://arxiv.org/abs/1312.6114
        locator: Abstract; Sec. 2.2 The variational bound
    source:
      id: ms-ai-for-beginners
      ref: quiz-109/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-004
    type: multiple
    difficulty: easy
    question: Which of the following are properties of autoencoders?
    options:
      - text: 'They are data-specific: they work well only on data similar to their training data'
        correct: true
      - text: They can be trained on unlabeled data
        correct: true
      - text: 'They are lossless: the reconstruction is an exact copy of the input'
        why: Autoencoders are lossy. The reconstruction is close to the input but degraded, and the loss function decides what is lost [^1][^2].
    explanation: |
      Autoencoders are data-specific: they only work well on data like their training set. An
      autoencoder trained on faces, for instance, does a poor job on pictures of trees [^1][^2].
      They also train on unlabeled data, because the input itself serves as the target [^1][^2].
      They are lossy rather than lossless, so the reconstruction is never exactly the original
      [^1][^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#properties-of-autoencoders
        locator: Lesson 9 "Autoencoders", section "Properties of Autoencoders"
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "What are autoencoders?"
    source:
      id: ms-ai-for-beginners
      ref: quiz-209/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-005
    type: true_false
    difficulty: easy
    question: Auto encoders can be used to effectively remove noise from images
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Denoising is one of the main uses of autoencoders. The network is given artificially noised
      images as input and the clean originals as targets. Noise carries a lot of useless
      information that does not fit through the small latent space, so the autoencoder learns to
      keep only the important content of the image [^1]. The Keras tutorial does exactly this
      with a convolutional autoencoder that maps noisy digit images to clean ones [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#scenarios-for-using-autoencoders
        locator: Lesson 9 "Autoencoders", section "Scenarios for using Autoencoders" (Denoising)
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "Application to image denoising"
    source:
      id: ms-ai-for-beginners
      ref: quiz-209/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-9.json
    status: draft
  - id: autoencoders-006
    type: single
    difficulty: easy
    question: Which of these is not part of a variational autoencoder's loss function?
    options:
      - text: reconstruction loss
      - text: KL loss
      - text: adversarial loss
        correct: true
    explanation: |
      A VAE's loss has two parts. The reconstruction loss (for example MSE) measures how close the
      decoded image is to the input. The KL loss keeps the learned latent distribution close to
      the prior normal distribution [^1][^2]. In the original paper's objective, the KL term acts
      as a regularizer and the other term is an expected negative reconstruction error [^3].
      An adversarial loss belongs to GANs, where a discriminator is trained to tell real images
      from generated ones and the generator is trained to fool it [^4]; a plain VAE has no
      discriminator.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#variational-autoencoders-vae
        locator: Lesson 9 "Autoencoders", section "Variational Autoencoders (VAE)"
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "Variational autoencoder (VAE)"
      - title: Kingma & Welling (2013), Auto-Encoding Variational Bayes
        url: https://arxiv.org/abs/1312.6114
        locator: Sec. 2.3 The SGVB estimator and AEVB algorithm (discussion of Eq. 7)
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#training-the-gan
        locator: Lesson 10 "Generative Adversarial Networks", section "Training the GAN"
    source:
