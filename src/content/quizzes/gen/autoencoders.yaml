  - id: autoencoders-018
    type: single
    difficulty: medium
    tags:
      - vae
      - generative-models
      - latent-space
    question: |
      You train a plain convolutional autoencoder and a VAE with the same $K$-dimensional bottleneck on MNIST, then
      feed both decoders random codes $\mathbf{z} \sim \mathcal{N}(\mathbf{0}, I)$. Only the VAE's outputs look like
      handwritten digits. Why?
    options:
      - text: Its KL term keeps codes near the prior $\mathcal{N}(0, I)$, so prior samples fall where the decoder was trained
        correct: true
      - text: The VAE decoder has more capacity, so it can turn any random code into a plausible-looking digit
        why: Both decoders can have the same architecture; the difference comes from how training shapes the latent space.
      - text: The plain decoder ignores its input after training and always outputs the average training image
        why: A trained autoencoder reconstructs its inputs well; it fails on random codes because they fall outside the region its encoder uses.
      - text: Only the VAE rescales its decoder outputs to the range of real pixel values, between 0 and 1
        why: Output scaling is not the issue; the plain autoencoder never constrained its codes to follow any particular distribution.
    explanation: |
      A plain autoencoder only learns to reconstruct, so its codes can occupy an oddly shaped region of $\mathbb{R}^K$, and
      random $\mathcal{N}(\mathbf{0}, I)$ codes mostly fall where the decoder was never trained [^1]. A VAE's encoder outputs a
      distribution $q(\mathbf{z}\mid\mathbf{x})$; its loss, the negative ELBO, contains a KL term that keeps these distributions
      close to the prior $p(\mathbf{z}) = \mathcal{N}(\mathbf{0}, I)$, and its reconstruction term must work on average over
      samples of $\mathbf{z}$ [^1][^2]. Prior samples therefore produce codes the decoder knows how to turn into digits,
      which is what makes a VAE a generative model [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 4 Variational Auto-Encoders, Think! 4.2 AutoEncoders vs. Variational AutoEncoders
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: Kingma and Welling (2013), Auto-Encoding Variational Bayes
        url: https://arxiv.org/abs/1312.6114
        locator: Sec. 2.2 The variational bound
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#think4.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
    status: draft
  - id: autoencoders-019
    type: short_answer
    difficulty: medium
    tags:
      - probabilistic-pca
      - latent-variable-models
      - covariance
    question: |
      Two noisy thermometers in the same room are modelled with probabilistic PCA:
      $\mathbf{x} = \boldsymbol\mu + \mathbf{w}z + \boldsymbol\epsilon$, with one latent temperature deviation $z \sim \mathcal{N}(0, 8)$,
      loading $\mathbf{w} = [1, 1]^\top/\sqrt{2}$ (the identity line) and independent sensor noise
      $\boldsymbol\epsilon \sim \mathcal{N}(\mathbf{0}, I)$. What correlation between the two readings does this model imply?
    answer:
      numeric: 0.8
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $\mathrm{Cov}(\mathbf{x}) = 8\,\mathbf{w}\mathbf{w}^\top + I = \begin{bmatrix}5 & 4\\ 4 & 5\end{bmatrix}$, so $\rho = 4/5 = 0.8$
    explanation: |
      In the generative model $\mathbf{x} = \boldsymbol\mu + \mathbf{w}z + \boldsymbol\epsilon$, independence of $z$ and
      $\boldsymbol\epsilon$ gives $\mathrm{Cov}(\mathbf{x}) = \mathrm{Var}(z)\,\mathbf{w}\mathbf{w}^\top + \sigma^2 I$ [^1]. Here
      $\mathbf{w}\mathbf{w}^\top$ has all entries $\tfrac12$, so the shared latent adds $8 \cdot \tfrac12 = 4$ to each variance and to the
      covariance, while the noise adds 1 to each variance only; the correlation is $4/\sqrt{5 \cdot 5} = 0.8$. Unlike
      plain PCA, this model can generate new readings: sample $z$ and $\boldsymbol\epsilon$, then compute
      $\boldsymbol\mu + \mathbf{w}z + \boldsymbol\epsilon$ [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 2 Latent Variable Models, (Bonus) Coding Exercise 2 pPCA
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#ex2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
    status: draft
  - id: autoencoders-020
    type: single
    difficulty: medium
    tags:
      - vae
      - representation-learning
      - rsa
    question: |
      NMA trains a VAE on dSprites: white shapes (heart, square or oval) with random scale, orientation and
      position. Its reconstructions keep these factors fairly well. But comparing the encoder's features across
      images shows that only images with similar positions get similar features; shape barely matters, and a linear
      shape classifier on these features does poorly. What does this show?
    options:
      - text: Good reconstruction does not guarantee a feature space organized by the factors a downstream task needs
        correct: true
      - text: The VAE must be undertrained, since a well-trained VAE encodes every factor in its own dimension
        why: Nothing in the reconstruction objective forces the latent space to align with shape; a space organized mostly by position satisfies it.
      - text: The decoder, not the encoder, stores the shape information, so classify the decoder weights instead
        why: A classifier works on the encoder features of each image; the finding is that these features are not organized by shape.
      - text: Feature similarity cannot be measured for generative models, so the comparison is meaningless
        why: Cosine similarities between encoder features can be computed for any encoder; NMA does so for supervised, random, VAE and SimCLR encoders.
    explanation: |
      Reconstruction only requires that the image can be recovered from the code; it says nothing about how the code
      space is organized [^1]. NMA's representational similarity matrices show that the VAE's features are structured
      mostly by `posX` and `posY`, not by `shape`, so a linear shape classifier does poorly even though the decoded images
      look right [^1]. A supervised encoder trained on shape labels groups images by shape, and a contrastive SimCLR
      encoder recovers shape without labels [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Section 4 Generative approaches to representation learning can fail (Discussions 4.1.1 and 4.1.2)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Bonus 1 Self-supervised networks learn representation invariance
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
    source:
      id: neuromatch-dl
      ref: W3D3_UnsupervisedAndSelfSupervisedLearning/W3D3_Tutorial1#think4.1.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
