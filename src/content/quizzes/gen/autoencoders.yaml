  - id: autoencoders-024
    type: single
    difficulty: hard
    tags:
      - variational-inference
      - partition-function
      - lower-bound
    question: |
      A distribution $p(x) = \tilde{p}(x) / Z$ has an intractable normaliser $Z$. Variational
      inference picks a tractable $q$ and minimises
      $$J(q) = \sum_x q(x) \log \frac{q(x)}{\tilde{p}(x)}.$$
      What does $J(q)$ tell you about $\log Z$?
    options:
      - text: $\log Z \ge -J(q)$, with equality when $q = p$
        correct: true
      - text: $\log Z \ge J(q)$, with equality when $q = p$
        why: 'Since $J(q) = \mathrm{KL}(q \,\|\, p) - \log Z$, the bound has the opposite sign: it is $-J(q)$ that lies below $\log Z$.'
      - text: $\log Z \le -J(q)$, so $-J(q)$ is an upper bound
        why: $\log Z = -J(q) + \mathrm{KL}(q \,\|\, p)$ and the KL term is non-negative, so $-J(q)$ is a lower bound.
      - text: $\log Z = -J(q)$ for every choice of $q$
        why: Equality holds only when $\mathrm{KL}(q \,\|\, p) = 0$, i.e. when $q = p$.
    explanation: |
      Substituting $\tilde{p} = Z p$ gives $J(q) = \sum_x q \log (q / p) - \log Z = \mathrm{KL}(q \,\|\, p) -
      \log Z$ [^1]. As the KL divergence is non-negative, $\log Z = \mathrm{KL}(q \,\|\, p) - J(q) \ge
      -J(q)$, so minimising $J$ both tightens this lower bound and pulls $q$ toward $p$ in reverse KL
      [^1][^2]. In a VAE the same identity with $\tilde{p}(z) = p(x, z)$ and $Z = p(x)$ makes $-J$ the
      evidence lower bound (ELBO) [^2].
    references:
      - source: nptel-deep-learning-2
        locator: Assignment 6, Q3–Q4 (goal of variational inference; lower bound on log Z(θ))
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106201/noc19_cs18-assessmentid-73.pdf
      - title: 'Wikipedia: Evidence lower bound'
        url: https://en.wikipedia.org/wiki/Evidence_lower_bound#Deriving_the_ELBO
        locator: Motivation — Deriving the ELBO; Maximizing the ELBO
    source:
      id: nptel-deep-learning-2
      ref: deep-learning-2/assignment6#q4
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106201/noc19_cs18-assessmentid-73.pdf
