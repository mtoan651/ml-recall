  - id: autoencoders-007
    type: single
    difficulty: medium
    tags:
      - kl-divergence
      - variational-inference
      - elbo
      - mode-seeking
    question: |
      Maximising the ELBO over a variational density $q$ minimises $\mathrm{KL}(q \,\|\, p) =
      \mathbb{E}_q[\log q(x) - \log p(x)]$ to the true posterior $p$; this is also what trains the
      encoder of a VAE. Suppose $p$ is bimodal with two well-separated modes, but $q$ can only be
      unimodal (e.g. Gaussian). What does the optimal $q$ typically look like?
    options:
      - text: It sits on one of the two modes and largely ignores the other
        correct: true
      - text: It spreads over both modes, with its peak in the low-density gap between them
        why: That is the mass-covering behaviour of $\mathrm{KL}(p \,\|\, q)$; here mass in the gap, where $p \approx 0$, is heavily penalised [^1][^2].
      - text: It matches the overall mean and variance of $p$
        why: Moment matching is what minimising $\mathrm{KL}(p \,\|\, q)$ over Gaussians gives, not $\mathrm{KL}(q \,\|\, p)$ [^2].
      - text: It equals $p$, since the KL divergence is minimal at zero
        why: A unimodal family cannot contain a bimodal $p$, so the minimum of the divergence is positive [^1].
    explanation: |
      In $\mathrm{KL}(q \,\|\, p)$ the expectation is under $q$ and $p$ is in the denominator of the
      log ratio [^1]. Where $p$ is near zero, any mass of $q$ costs a lot, so $q$ must avoid the gap
      between the modes. Regions where $p$ has mass but $q$ is zero cost nothing, so leaving out a
      mode is cheap: reverse KL is "mode seeking" [^1][^2]. This is one reason VAE posteriors tend to
      be too narrow.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.3 (a) Variational posterior approximation I
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Kullback–Leibler divergence'
        url: https://en.wikipedia.org/wiki/Kullback%E2%80%93Leibler_divergence
        locator: Properties (asymmetry) and Relation to other quantities
    source:
      id: gutmann-pen-paper
      ref: variational-inference#variational-posterior-approximation-i-a
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: autoencoders-008
    type: short_answer
    difficulty: hard
    tags:
      - kl-divergence
      - variational-inference
      - gaussian
      - harmonic-mean
    question: |
      The true posterior is $p(x_1, x_2) = \mathcal{N}(x_1; 0, \sigma_1^2)\,\mathcal{N}(x_2; 0,
      \sigma_2^2)$ with $\sigma_1^2 = 1$ and $\sigma_2^2 = 4$. The variational family is isotropic,
      $q(x_1, x_2) = \mathcal{N}(x_1; 0, \lambda^2)\,\mathcal{N}(x_2; 0, \lambda^2)$. Which value of
      $\lambda^2$ minimises $\mathrm{KL}(q \,\|\, p)$?
    answer:
      numeric: 1.6
      tolerance: 0.001
      hint: a number, 1 decimal
      model: $J(\lambda) = -2\log\lambda + \lambda^2\left(\tfrac{1}{2\sigma_1^2} + \tfrac{1}{2\sigma_2^2}\right) + \text{const}$; $\lambda^2 = \frac{2\sigma_1^2\sigma_2^2}{\sigma_1^2 + \sigma_2^2} = 8/5 = 1.6$
    explanation: |
      Up to constants, $\mathrm{KL}(q \,\|\, p) = -2\log\lambda + \lambda^2(\frac{1}{2\sigma_1^2} +
      \frac{1}{2\sigma_2^2})$, and setting the derivative to zero gives $1/\lambda^2 = \frac12(1/\sigma_1^2 + 1/\sigma_2^2)$ [^1]. The optimal precision is the average of the two precisions, so $\lambda^2$
      is the harmonic mean $2 \cdot 1 \cdot 4 / 5 = 1.6$, much closer to the smaller variance [^1].
      The compromise trades a too-narrow fit along $x_2$ against putting mass where $p$ is small along
      $x_1$, which reverse KL penalises more [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.4 (a)–(b) Variational posterior approximation II
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Kullback–Leibler divergence'
        url: https://en.wikipedia.org/wiki/Kullback%E2%80%93Leibler_divergence
        locator: Multivariate normal distributions
    source:
      id: gutmann-pen-paper
      ref: variational-inference#variational-posterior-approximation-ii-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: autoencoders-009
    type: short_answer
    difficulty: easy
    tags:
      - linear-autoencoder
      - parameter-count
      - bottleneck
    question: |
      A linear autoencoder for flattened $28 \times 28$ MNIST images has an encoder
      `nn.Linear(784, 32)` and a decoder `nn.Linear(32, 784)`. How many trainable parameters does it
      have in total?
    answer:
      numeric: 50992
      tolerance: 0
      hint: a whole number
      model: $784 \cdot 32 + 32 + 32 \cdot 784 + 784 = 25{,}120 + 25{,}872 = 50{,}992$
    explanation: |
      Each linear layer has $n_\text{in} \times n_\text{out}$ weights plus $n_\text{out}$ biases:
      $25{,}088 + 32$ for the encoder and $25{,}088 + 784$ for the decoder [^2]. The 32 units in the
      middle are the compressed representation; the targets are the inputs themselves, and a sigmoid
      on the decoder output matches the $[0, 1]$ pixel range [^1].
    references:
      - source: udacity-dl-pytorch
        locator: Simple Autoencoder notebook, Linear Autoencoder
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/linear-autoencoder/Simple_Autoencoder_Solution.ipynb
      - title: 'PyTorch documentation: Linear'
        url: https://pytorch.org/docs/stable/generated/torch.nn.Linear.html
        locator: weight of shape (out_features, in_features) and bias of shape (out_features)
    source:
      id: udacity-dl-pytorch
      ref: autoencoder/linear-autoencoder/Simple_Autoencoder_Solution.ipynb#parameter-count
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/linear-autoencoder/Simple_Autoencoder_Solution.ipynb
    status: draft
  - id: autoencoders-010
    type: short_answer
    difficulty: medium
    tags:
      - convolutional-autoencoder
      - compression
      - shapes
    question: |
      A convolutional autoencoder's encoder is:

      ```python
      x = F.relu(nn.Conv2d(1, 16, 3, padding=1)(x))   # input: 1 × 28 × 28
      x = nn.MaxPool2d(2, 2)(x)
      x = F.relu(nn.Conv2d(16, 4, 3, padding=1)(x))
      x = nn.MaxPool2d(2, 2)(x)                        # compressed representation
      ```

      How many numbers does the compressed representation of one image contain?
    answer:
      numeric: 196
      tolerance: 0
      hint: a whole number
      model: $1 \times 28 \times 28 \to 16 \times 14 \times 14 \to 4 \times 7 \times 7 = 196$
    explanation: |
      The padded $3 \times 3$ convolutions keep the spatial size, and each $2 \times 2$ max-pool
      halves it, $28 \to 14 \to 7$ [^1][^2]. The last convolution has 4 channels, so the code is
      $4 \times 7 \times 7 = 196$ numbers, a quarter of the 784 input pixels. The decoder must undo
      this, here with two transposed convolutions of kernel size and stride 2 [^1].
    references:
      - source: udacity-dl-pytorch
        locator: Convolutional Autoencoder notebook, Encoder; Decoder
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/convolutional-autoencoder/Convolutional_Autoencoder_Solution.ipynb
      - source: d2l
        locator: Sec. 7.5.2 Padding and Stride
        url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#padding-and-stride
    source:
      id: udacity-dl-pytorch
      ref: autoencoder/convolutional-autoencoder/Convolutional_Autoencoder_Solution.ipynb#compressed-representation
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/convolutional-autoencoder/Convolutional_Autoencoder_Solution.ipynb
    status: draft
  - id: autoencoders-011
    type: short_answer
    difficulty: medium
    tags:
      - transposed-convolution
      - decoder
      - shapes
    question: |
      A denoising autoencoder's encoder pools a $28 \times 28$ image three times with
      `nn.MaxPool2d(2, 2)`, giving $28 \to 14 \to 7 \to 3$. Its decoder starts with
      `nn.ConvTranspose2d(8, 8, kernel_size=3, stride=2)` (no padding). What is the spatial size
      of this layer's output for a $3 \times 3$ input?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: $(3 - 1) \cdot 2 - 2 \cdot 0 + 3 = 7$
    explanation: |
      A transposed convolution produces $(H_\text{in} - 1) \cdot s - 2p + k$ outputs per side
      [^2]; with $H_\text{in} = 3$, $s = 2$, $k = 3$ this is 7. Pooling 7 down to 3 floors away a
      row and a column, so a kernel of 2 would only give 6; the notebook uses kernel size 3 for this
      first layer to get back to $7 \times 7$, then two layers with kernel and stride 2 give 14 and
      28 [^1].
    references:
      - source: udacity-dl-pytorch
        locator: "Denoising Autoencoder notebook, Denoising (ConvDenoiser: t_conv1 'kernel_size=3 to get to a 7x7 image output')"
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb
      - title: 'PyTorch documentation: ConvTranspose2d'
        url: https://pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html
        locator: Shape (H_out formula)
    source:
      id: udacity-dl-pytorch
      ref: autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb#transpose-conv-size
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb
    status: draft
  - id: autoencoders-012
    type: single
    difficulty: easy
    tags:
      - denoising-autoencoder
      - reconstruction-loss
    question: |
      You train a denoising autoencoder on MNIST by adding Gaussian noise to each batch,
      `noisy = clip(images + 0.5 * randn)`. What do you feed into the model, and what do you
      compare its output with in the MSE loss?
    options:
      - text: Feed the noisy images; compare the output with the clean images
        correct: true
      - text: Feed the clean images; compare the output with the noisy images
        why: That would train the network to add noise, the opposite of denoising [^1].
      - text: Feed the noisy images; compare the output with the noisy images
        why: Reconstructing its own noisy input teaches the network to copy the noise, not remove it [^1].
      - text: Feed the noisy images; compare the output with the noise that was added
        why: That trains a noise estimator, not a model whose output is a clean image [^1].
    explanation: |
      A denoising autoencoder uses noisy images as input and the original, clean images as
      targets, so the loss rewards outputs that remove the noise [^1]. Because pixel values are
      compared as quantities, a regression loss such as `MSELoss` fits, and the noise is regenerated
      for every batch, so the network cannot memorize it [^1].
    references:
      - source: udacity-dl-pytorch
        locator: Denoising Autoencoder notebook, Denoising; Training
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb
    source:
      id: udacity-dl-pytorch
      ref: autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb#inputs-and-targets
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/denoising-autoencoder/Denoising_Autoencoder_Solution.ipynb
    status: draft
  - id: autoencoders-013
    type: single
    difficulty: medium
    tags:
      - transposed-convolution
      - upsampling
      - checkerboard-artifacts
    question: |
      The reconstructions of a convolutional autoencoder whose decoder uses transposed convolutions
      show checkerboard-like artifacts. Which decoder change addresses this?
    options:
      - text: Nearest-neighbour upsampling followed by ordinary convolutions
        correct: true
      - text: Transposed convolutions with a kernel larger than the stride, e.g. kernel 3 and stride 2
        why: Kernels larger than the stride make neighbouring outputs overlap unevenly, which is exactly what causes checkerboard patterns [^1].
      - text: Max pooling at the end of the decoder
        why: Pooling shrinks the image; the decoder needs to enlarge the compressed representation [^1].
      - text: A softmax over the pixels in the output layer
        why: Softmax makes the pixels compete and sum to 1; it does not affect how the image is upsampled [^1].
    explanation: |
      Transposed convolutions can produce checkerboard artifacts because their kernels overlap
      unevenly; choosing the stride equal to the kernel size avoids the overlap [^1]. The alternative
      in the notebooks, following the Distill article, resizes the feature map with nearest-neighbour
      upsampling and then applies a normal convolution, so every output pixel gets the same number
      of contributions [^1][^2].
    references:
      - source: udacity-dl-pytorch
        locator: Convolutional Autoencoder notebook, Transpose Convolutions, Decoder; Upsampling notebook (decoder with upsampling and convolutional layers)
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/convolutional-autoencoder/Upsampling_Solution.ipynb
      - title: Odena, Dumoulin & Olah (2016), Deconvolution and Checkerboard Artifacts, Distill
        url: https://distill.pub/2016/deconv-checkerboard/
        locator: Overlap & Artifacts; Better Upsampling
    source:
      id: udacity-dl-pytorch
      ref: autoencoder/convolutional-autoencoder/Upsampling_Solution.ipynb#checkerboard
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/autoencoder/convolutional-autoencoder/Upsampling_Solution.ipynb
    status: draft
  - id: autoencoders-014
    type: single
    difficulty: medium
    tags:
      - linear-autoencoder
      - pca
      - dimensionality-reduction
    question: |
      A linear autoencoder maps 784-pixel images to $K = 20$ hidden units and back with two `nn.Linear` layers and no
      nonlinearity, trained to minimize the mean squared reconstruction error. Compared with projecting onto the top
      20 principal components (PCA), what does it learn at the optimum?
    options:
      - text: The same 20-dimensional subspace as PCA, though its 20 weight vectors need not be the orthogonal principal axes
        correct: true
      - text: A better reconstruction than PCA, because gradient descent can discover nonlinear features
        why: Without activation functions the whole network is linear, and among linear rank-20 maps PCA already gives the lowest squared error.
      - text: A worse reconstruction than PCA in every case, because it has no centering step
        why: The biases of the `nn.Linear` layers can absorb the mean, as PCA's centering does; at the optimum the error matches PCA.
      - text: Exactly the top 20 principal axes, sorted by explained variance
        why: Any invertible mixing of the hidden units gives the same reconstructions, so training pins down the subspace, not the individual ordered axes.
    explanation: |
      With squared-error loss and a linear encoder and decoder, the best rank-$K$ reconstruction is the projection onto
      the top-$K$ principal subspace, so a trained linear autoencoder spans the same subspace as PCA [^1][^2]. NMA's
      comparison shows reconstructions of similar quality, both getting worse as $K$ shrinks [^1]. The weights are
      defined only up to an invertible $K \times K$ transformation, so they are generally not orthogonal and not equal
      to the principal components [^2]. Nonlinearities and convolutions are what let an autoencoder beat PCA at the
      same $K$ [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 3.1 Conceptual introduction to AutoEncoders, Think! 3.1 PCA vs. Linear autoencoder
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: 'Wikipedia: Autoencoder'
        url: https://en.wikipedia.org/wiki/Autoencoder
        locator: Applications, Dimensionality reduction, Principal component analysis
