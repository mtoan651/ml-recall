  - id: autoencoders-018
    type: single
    difficulty: medium
    tags:
      - vae
      - generative-models
      - latent-space
    question: |
      You train a plain convolutional autoencoder and a VAE with the same $K$-dimensional bottleneck on MNIST, then
      feed both decoders random codes $\mathbf{z} \sim \mathcal{N}(\mathbf{0}, I)$. Only the VAE's outputs look like
      handwritten digits. Why?
    options:
      - text: Its KL term keeps codes near the prior $\mathcal{N}(0, I)$, so prior samples fall where the decoder was trained
        correct: true
      - text: The VAE decoder has more capacity, so it can turn any random code into a plausible-looking digit
        why: Both decoders can have the same architecture; the difference comes from how training shapes the latent space.
      - text: The plain decoder ignores its input after training and always outputs the average training image
        why: A trained autoencoder reconstructs its inputs well; it fails on random codes because they fall outside the region its encoder uses.
      - text: Only the VAE rescales its decoder outputs to the range of real pixel values, between 0 and 1
        why: Output scaling is not the issue; the plain autoencoder never constrained its codes to follow any particular distribution.
    explanation: |
      A plain autoencoder only learns to reconstruct, so its codes can occupy an oddly shaped region of $\mathbb{R}^K$, and
      random $\mathcal{N}(\mathbf{0}, I)$ codes mostly fall where the decoder was never trained [^1]. A VAE's encoder outputs a
      distribution $q(\mathbf{z}\mid\mathbf{x})$; its loss, the negative ELBO, contains a KL term that keeps these distributions
      close to the prior $p(\mathbf{z}) = \mathcal{N}(\mathbf{0}, I)$, and its reconstruction term must work on average over
      samples of $\mathbf{z}$ [^1][^2]. Prior samples therefore produce codes the decoder knows how to turn into digits,
      which is what makes a VAE a generative model [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 4 Variational Auto-Encoders, Think! 4.2 AutoEncoders vs. Variational AutoEncoders
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: Kingma and Welling (2013), Auto-Encoding Variational Bayes
        url: https://arxiv.org/abs/1312.6114
        locator: Sec. 2.2 The variational bound
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#think4.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
