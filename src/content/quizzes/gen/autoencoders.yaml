  - id: autoencoders-004
    type: single
    difficulty: easy
    shuffle: false
    question: Properties of autoencoders include
    options:
      - text: it is data Specific
      - text: works on unlabeled data
      - text: all of the above
        correct: true
    explanation: |
      Both statements are properties of autoencoders. They are data-specific: they only work
      well on data like their training set. An autoencoder trained on faces, for instance, does a
      poor job on pictures of trees [^1][^2]. They also train on unlabeled data, because the
      input itself serves as the target [^1][^2]. The lesson adds a third property: they are
      lossy, so the reconstruction is never exactly the original [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#properties-of-autoencoders
        locator: Lesson 9 "Autoencoders", section "Properties of Autoencoders"
      - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
        url: https://blog.keras.io/building-autoencoders-in-keras.html
        locator: Section "What are autoencoders?"
    source:
