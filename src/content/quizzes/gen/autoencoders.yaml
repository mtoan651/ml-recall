  - id: autoencoders-022
    type: multiple
    difficulty: hard
    tags:
      - vae
      - aggregate-posterior
      - latent-space
    question: |
      A VAE with encoder $q_\phi(z \mid x) = \mathcal{N}(\mu(x), \sigma^2(x) I)$ is trained perfectly:
      the aggregate posterior $q_\phi(z) = \mathbb{E}_{x \sim p_{\text{data}}}[q_\phi(z \mid x)]$ equals the
      prior $\mathcal{N}(0, I)$, and the model's marginal $p_\theta(x)$ equals $p_{\text{data}}$. Which
      statements follow? Select all that apply.
    options:
      - text: Decoding samples $z \sim \mathcal{N}(0, I)$ gives samples from $p_{\text{data}}$
        correct: true
      - text: The encoder means $\mu(x)$, for $x \sim p_{\text{data}}$, are distributed as $\mathcal{N}(0, I)$
        why: Only the mixture of the Gaussians $\mathcal{N}(\mu(x), \sigma^2(x)I)$ is $\mathcal{N}(0, I)$; the means alone can follow a non-Gaussian distribution [^1].
      - text: Decoding only the means $\mu(x)$ of the data reproduces $p_{\text{data}}$
        why: The means alone need not cover the latent space; the variances fill the rest, so dropping them misses part of the distribution [^1].
      - text: Every individual posterior $q_\phi(z \mid x)$ equals $\mathcal{N}(0, I)$
        why: Then $z$ would carry no information about $x$ (posterior collapse); only their average over the data has to match the prior.
    explanation: |
      $p_\theta(x) = \int p(z)\,p_\theta(x \mid z)\,dz$ with $p(z) = \mathcal{N}(0, I)$, so if it equals
      $p_{\text{data}}$, decoding prior samples generates data [^2]. The prior constrains only the
      mixture of the encoder's Gaussians [^1]. For example, if half the data have
      $\sigma^2 = 0.5$ with means spread as $\mathcal{N}(0, 0.5)$ and the other half $\sigma^2 = 0.9$
      with means spread as $\mathcal{N}(0, 0.1)$, each half gives $z \sim \mathcal{N}(0, 1)$, yet the means
      follow a mixture of two different Gaussians, which is not Gaussian.
    references:
      - source: mit-ocw-67960
        locator: Homework 5 solutions, Problem 2(a)–(b)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw5_sol_pdf/
      - title: Kingma & Welling (2019), An Introduction to Variational Autoencoders, arXiv:1906.02691
        locator: Sec. 2.2 Evidence Lower Bound (ELBO)
        url: https://arxiv.org/abs/1906.02691
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw5_sol#q2
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw5_sol_pdf/
    status: draft
  - id: autoencoders-023
    type: true_false
    difficulty: medium
    tags:
      - autoencoder
      - generative-model
      - latent-space
    shuffle: false
    question: |
      A deterministic autoencoder reconstructs its data perfectly, $g(f(x)) = x$. True or false:
      decoding random codes $z \sim \mathcal{N}(0, I)$ with $g$ then produces samples from the data
      distribution.
    options:
      - text: 'True'
        why: Nothing in the reconstruction loss makes the codes $f(x)$ follow $\mathcal{N}(0, I)$, so most Gaussian samples land where $g$ was never trained [^1].
      - text: 'False'
        correct: true
    explanation: |
      A plain autoencoder only learns to invert its own codes; the codes of the training data can sit
      in any region and in any shape [^1]. Gaussian samples usually fall into gaps between them, and
      the decoder's output there is arbitrary. A VAE adds the KL term toward the prior
      $\mathcal{N}(0, I)$, which shapes the codes so that sampling the prior is meaningful [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 5 solutions, Problem 3
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw5_sol_pdf/
