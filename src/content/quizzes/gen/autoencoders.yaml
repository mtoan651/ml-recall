  - id: autoencoders-015
    type: short_answer
    difficulty: easy
    tags:
      - convolutional-autoencoder
      - output-shape
    question: |
      A convolutional autoencoder encodes a $1 \times 28 \times 28$ MNIST image with `nn.Conv2d(1, 32, 5)` + ReLU and
      `nn.Conv2d(32, 32, 5)` + ReLU (stride 1, no padding), then flattens the result and applies
      `nn.Linear(flat, K)`. What is `flat`, the number of input features of that linear layer?
    answer:
      numeric: 12800
      tolerance: 0
      hint: an integer
      model: $28 \to 24 \to 20$, so $32 \times 20 \times 20 = 12800$
    explanation: |
      A 5×5 convolution without padding shrinks each side by 4, so the feature maps are $24 \times 24$ and then
      $20 \times 20$, with 32 channels [^1][^2]. Flattening gives $32 \cdot 20 \cdot 20 = 12800$ features, which the encoder's
      linear layer compresses to $K$ numbers [^1]. The decoder mirrors this: `nn.Linear(K, 12800)`, an `nn.Unflatten`
      back to $(32, 20, 20)$, and two 5×5 `ConvTranspose2d` layers that grow the maps back to $28 \times 28$ [^1].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Coding Exercise 3.2 Fill in code for the ConvAutoEncoder module
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
