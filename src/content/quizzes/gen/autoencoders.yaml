  - id: autoencoders-021
    type: multiple
    difficulty: hard
    tags:
      - autoencoder
      - representation-learning
      - generalization
    question: |
      An encoder $f^\ast$ and decoder $g^\ast$ reconstruct every image of a finite training set of
      distinct images of coloured shapes perfectly: $g^\ast(f^\ast(x_i)) = x_i$. Nothing else is known
      about them. Which statements are guaranteed? Select all that apply.
    options:
      - text: The index $i$ of a training image can be recovered from its code $f^\ast(x_i)$
        correct: true
      - text: The colour of a training image can be recovered from its code $f^\ast(x_i)$
        correct: true
      - text: Two red training images have closer codes than a red and a blue training image
        why: Reconstruction only needs distinct codes; nothing ties distances in code space to colour.
      - text: The colour of a new image $x$ from the same distribution can be recovered from $f^\ast(x)$
        why: The objective constrains $f^\ast$ only on the training images; on new images it can map anything anywhere.
    explanation: |
      Perfect reconstruction makes $f^\ast$ injective on the training set: decoding the code gives back
      $x_i$, from which both its index and its colour can be read off [^1]. The objective says nothing
      about the geometry of the code space, so similar images need not get nearby codes, and it says
      nothing about images outside the training set [^1]. Any grouping seen in practice comes from the
      inductive biases of the architecture and optimizer, or from added regularizers such as the
      variational autoencoder's prior [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 4, Problem 7(a) and 7(d)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw4_pdf/
      - title: Kingma & Welling (2019), An Introduction to Variational Autoencoders, arXiv:1906.02691
        locator: Sec. 2 Variational Autoencoders
        url: https://arxiv.org/abs/1906.02691
