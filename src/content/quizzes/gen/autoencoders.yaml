  - id: autoencoders-017
    type: true_false
    difficulty: easy
    tags:
      - transposed-convolution
      - decoder
    question: |
      True or false: `nn.ConvTranspose2d` computes the mathematical inverse of the corresponding `nn.Conv2d`, so a
      decoder built from it undoes the encoder exactly.
    options:
      - text: 'True'
        why: It is the gradient (adjoint) of the convolution with respect to its input, also called a fractionally strided convolution; it restores the shape, not the values.
      - text: 'False'
        correct: true
    explanation: |
      `ConvTranspose2d` can be seen as the gradient of `Conv2d` with respect to its input; it is also called a
      fractionally strided convolution or "deconvolution", although it is not an actual deconvolution [^1][^2]. It maps
      a small feature map back to the larger shape, but its weights are learned separately, so a mirrored decoder
      only approximately inverts the encoder after training [^1]. A downsampling convolution maps many inputs to the
      same output, so an exact inverse does not exist in general.
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 3.2 (ConvTranspose2d note)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: 'PyTorch documentation: torch.nn.ConvTranspose2d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html
        locator: Description
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#sec3.2-deconv
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
