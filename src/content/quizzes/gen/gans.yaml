  - id: gans-023
    type: single
    difficulty: medium
    tags:
      - latent-space
      - interpolation
      - memorization
    question: |
      You interpolate linearly between the latent codes (and class vectors) of a BigGAN "German shepherd" sample and a
      "jellyfish" sample. Every intermediate image looks like a plausible blend, with no sudden jumps. What does this
      suggest about the generator?
    options:
      - text: It has learned a smooth latent space rather than memorizing training images
        correct: true
      - text: It has stored a training image for every point along the path
        why: Blends of a dog and a jellyfish do not exist in the training set, so they cannot have been memorized.
      - text: Its latent space is split into one isolated region per class
        why: A smooth path with gradual changes between classes shows a continuous space, not isolated class regions.
      - text: It has overfit, since realistic interpolations need very little data
        why: Memorization would show up as implausible images or sharp transitions along the path; smooth blends point the other way.
    explanation: |
      If a generator only reproduced training images, a path between two very different samples would pass through
      implausible images or jump abruptly from one memorized image to the next [^1][^2]. Convincing interpolations,
      together with samples whose nearest training neighbours look different, suggest that the model learned how
      images vary rather than storing them [^1]. Walking the latent space this way is a standard check: sharp
      transitions are a sign of memorization [^2].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 1.2 Interpolating Images with BigGAN, Think! 1.2
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
