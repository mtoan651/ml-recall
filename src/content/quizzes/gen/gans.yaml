  - id: gans-022
    type: single
    difficulty: easy
    tags:
      - biggan
      - truncation-trick
      - sample-quality
    question: |
      BigGAN draws its latent vector $\mathbf{z}$ from a truncated normal distribution: values beyond a threshold are
      redrawn. What happens to the generated images when you lower this truncation threshold?
    options:
      - text: 'They become more realistic but more alike: variety drops'
        correct: true
      - text: They become more varied but less realistic
        why: 'That is what raising the threshold does: codes from the tails of the distribution add variety at the cost of quality.'
      - text: They become sharper and more varied at once, at no cost
        why: Truncation trades one for the other; keeping codes near the centre gives the best but most similar samples.
      - text: They ignore the class label, so all categories look the same
        why: The class still conditions the generator; truncation only limits the magnitude of $\mathbf{z}$.
    explanation: |
      Truncation limits the magnitude of $\mathbf{z}$, keeping codes near the centre of the latent distribution [^1][^2].
      NMA's demo shows that low truncation values give realistic but similar images and high values give varied but
      less realistic ones [^1]. The threshold thus selects a trade-off between sample quality (fidelity) and variety
      after training, which is how the BigGAN paper presents its "truncation trick" [^2].
    references:
      - source: neuromatch-dl
        locator: W2D3 Tutorial 1, Section 1.1 Generating Images from BigGAN, Think! 1.1 Generated images
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
      - title: Brock, Donahue and Simonyan (2018), Large Scale GAN Training for High Fidelity Natural Image Synthesis
        url: https://arxiv.org/abs/1809.11096
        locator: Sec. 3.1 Trading off variety and fidelity with the Truncation Trick
    source:
      id: neuromatch-dl
      ref: W2D3_GenerativeModelsAndDeepLearningDiscussion1/W2D3_Tutorial1#think1.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D3_GenerativeModelsAndDeepLearningDiscussion1/instructor/W2D3_Tutorial1.ipynb
