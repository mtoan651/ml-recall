  - id: gans-021
    type: short_answer
    difficulty: medium
    tags:
      - cyclegan
      - cycle-consistency
      - l1-loss
    question: |
      A CycleGAN translates a real image $x$ to the other domain and back, giving $\hat{x}$. Its
      cycle-consistency loss is $\lambda$ times the mean absolute pixel difference, with
      $\lambda = 10$. For a toy 4-pixel image $x = (0.5, -0.2, 0.1, 0.0)$ and reconstruction
      $\hat{x} = (0.4, -0.2, 0.3, 0.1)$, what is the loss?
    answer:
      numeric: 1.0
      tolerance: 0.001
      hint: a number, e.g. 0.5
      model: $10 \times (0.1 + 0 + 0.2 + 0.1)/4 = 10 \times 0.1 = 1.0$
    explanation: |
      With unpaired data there is no target image for a translation, so CycleGAN adds cycle
      consistency: translating to the other domain and back should return the original [^1]. The
      notebook computes `lambda_weight * torch.mean(torch.abs(real_im - reconstructed_im))` with
      `lambda_weight=10`, the value used in the CycleGAN paper [^1][^2]. Here the mean absolute
      difference is 0.1, so the loss is 1.0; it is added to both generators' adversarial losses.
    references:
      - source: udacity-dl-pytorch
        locator: CycleGAN notebook, Generator Losses — Cycle Consistency Loss; training loop
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/cycle-gan/CycleGAN_Solution.ipynb
      - title: Zhu et al. (2017), Unpaired Image-to-Image Translation using Cycle-Consistent Adversarial Networks
        url: https://arxiv.org/abs/1703.10593
        locator: Sec. 3.2 Cycle Consistency Loss; Sec. 4 Implementation (λ = 10)
