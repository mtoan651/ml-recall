title: Generative Adversarial Networks
questions:
  - id: gans-001
    type: single
    difficulty: easy
    question: GANs is short for?
    options:
      - text: General adversarial networks
      - text: Generative advisor networks
      - text: Generative adversarial networks
        correct: true
    explanation: |
      GAN stands for generative adversarial network. "Generative" because the goal is to produce
      new data that looks like the training set. "Adversarial" because two networks are trained
      against each other [^1]. Goodfellow et al. framed this as a minimax two-player game. A
      generator $G$ tries to capture the data distribution, while a discriminator $D$ estimates
      whether a sample came from the real data or from $G$ [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
        locator: Lesson 10 "Generative Adversarial Networks", introduction and section "Training the GAN"
      - title: Goodfellow et al. (2014), Generative Adversarial Networks
        url: https://arxiv.org/abs/1406.2661
        locator: Abstract; Sec. 3 Adversarial nets
    source:
      id: ms-ai-for-beginners
      ref: quiz-110/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-002
    type: single
    difficulty: easy
    question: GAN uses ____ neural networks
    options:
      - text: '1'
      - text: '2'
        correct: true
      - text: '3'
    explanation: |
      A GAN has two networks trained against each other [^1]. The generator turns a random
      vector into an image. The discriminator is a binary classifier that decides whether an
      image is real (from the training set) or produced by the generator [^1][^2]. The
      generator tries to fool the discriminator, and the discriminator adapts to the new fakes,
      which in turn pushes the generator to improve [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
        locator: Lesson 10 "Generative Adversarial Networks", introduction and vocabulary note
      - source: d2l
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html
        locator: Sec. 20.1 Generative Adversarial Networks (introduction, Fig. 20.1.1)
    source:
      id: ms-ai-for-beginners
      ref: quiz-110/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-003
    type: single
    difficulty: easy
    question: Deep Convolutional GAN uses convolutional layers for ____ and ____
    options:
      - text: generator, discriminator
        correct: true
      - text: CNN, generator
        why: A CNN is a kind of network, not a component of a GAN. In a DCGAN both components, the generator and the discriminator, are convolutional [^2].
      - text: training, testing
    explanation: |
      A DCGAN is a GAN built from convolutional networks [^1], so both of its networks are
      convolutional. The generator stacks transposed-convolution blocks that grow a latent vector
      into an image, and the discriminator is a strided convolutional classifier that mirrors
      it [^2]. In the original DCGAN design, pooling is replaced by strided convolutions in the
      discriminator and fractionally-strided convolutions in the generator [^3]. Training and
      testing are phases, not parts of the network, and "CNN, generator" is not a pair of GAN
      components.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#discriminator
        locator: Lesson 10 "Generative Adversarial Networks", sections "Discriminator" and "Generator"
      - source: d2l
        url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#the-generator
        locator: Sec. 20.2 Deep Convolutional Generative Adversarial Networks (20.2.2 The Generator, 20.2.3 Discriminator, 20.2.5 Summary)
      - title: Radford, Metz & Chintala (2015), Unsupervised Representation Learning with Deep Convolutional GANs
        url: https://arxiv.org/abs/1511.06434
        locator: Sec. 3 Approach and Model Architecture
    source:
      id: ms-ai-for-beginners
      ref: quiz-210/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-004
    type: multiple
    difficulty: easy
    question: Which of the following are known problems of GAN training?
    options:
      - text: Sensitivity to hyperparameters
        correct: true
      - text: Keeping a balance between the generator and the discriminator
        correct: true
      - text: 'Mode collapse: the generator keeps producing the same few images'
        correct: true
      - text: Every training image needs a human-annotated class label
        why: A plain GAN learns from unlabeled images. The discriminator's targets are created automatically, 1 for training images and 0 for generated ones [^1].
    explanation: |
      All three are well-known difficulties of GAN training [^1]. On balance: if the
      discriminator gets too good too fast, its loss drops to zero and the generator stops
      learning. If the generator is trained too long without the discriminator being updated, it
      can collapse many inputs onto the same output [^1][^2]. That is mode collapse: the generator
      finds one image that fools the discriminator instead of producing a variety [^1]. On
      hyperparameters: GANs often fail to converge until the learning rate is changed. The DCGAN
      authors, for example, found that Adam's default learning rate was too high and that
      $\beta_1 = 0.9$ made training oscillate, so they used 0.0002 and 0.5 [^1][^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#problems-with-gan-training
        locator: Lesson 10 "Generative Adversarial Networks", sections "Training the GAN" and "Problems with GAN training"
      - title: Goodfellow et al. (2014), Generative Adversarial Networks
        url: https://arxiv.org/abs/1406.2661
        locator: Sec. 6 Advantages and disadvantages
      - title: Radford, Metz & Chintala (2015), Unsupervised Representation Learning with Deep Convolutional GANs
        url: https://arxiv.org/abs/1511.06434
        locator: Sec. 4 Details of Adversarial Training
    source:
      id: ms-ai-for-beginners
      ref: quiz-210/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-005
    type: true_false
    difficulty: medium
    question: 'The discriminator network and generator network influence each other solely through the data produced by the generator and the labels produced by the discriminator. When it comes to backpropagation, they are separate networks.'
    options:
      - text: 'True'
        why: 'Incorrect: during generator training, gradients propagate through the discriminator network to the generator network (although the discriminator does not update its weights during generator training).'
      - text: 'False'
        correct: true
    explanation: |
      During generator training, gradients propagate through the discriminator network to the
      generator network, although the discriminator does not update its weights during generator
      training [^1]. The generator's loss is computed from the discriminator's output, so
      backpropagation starts there and flows back through the discriminator into the generator;
      only the generator's weights are then changed [^2]. So the weights in the discriminator
      network influence the updates to the generator network.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/check
        locator: 'Check Your Understanding: GAN Anatomy'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/generator#using-the-discriminator-to-train-the-generator
        locator: The Generator, sec. Using the Discriminator to Train the Generator
    source:
      id: google-ml-courses
      ref: gan/check#q1
      url: https://developers.google.com/machine-learning/gan/check
    status: draft
  - id: gans-006
    type: true_false
    difficulty: easy
    question: 'A typical GAN trains the generator and the discriminator simultaneously.'
    options:
      - text: 'True'
        why: Incorrect. A typical GAN alternates between training the discriminator and training the generator. There is some [research](https://arxiv.org/abs/1706.04156) on training the generator and discriminator simultaneously.
      - text: 'False'
        correct: true
    explanation: |
      A typical GAN alternates between training the discriminator and training the generator
      [^1]. The discriminator trains for one or more epochs while the generator is held constant,
      then the generator trains while the discriminator is held constant, and the two steps
      repeat [^2].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/check
        locator: 'Check Your Understanding: GAN Anatomy'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/training#alternating-training
        locator: GAN Training, sec. Alternating Training
    source:
      id: google-ml-courses
      ref: gan/check#q2
      url: https://developers.google.com/machine-learning/gan/check
    status: draft
  - id: gans-007
    type: true_false
    difficulty: medium
    question: 'A GAN always uses the same loss function for both discriminator and generator training.'
    options:
      - text: 'True'
        why: Incorrect. While it's possible for a GAN to use the same loss for both generator and discriminator training (or the same loss differing only in sign), it's not required. In fact it's more common to use different losses for the discriminator and the generator.
      - text: 'False'
        correct: true
    explanation: |
      It's possible for a GAN to use the same loss for both generator and discriminator training
      (or the same loss differing only in sign), but it's not required. In fact it's more common
      to use different losses for the discriminator and the generator [^1]. Even in the minimax
      and Wasserstein schemes, where both losses derive from a single distance measure, the
      generator can only affect the term for the generated data, so the two losses end up
      looking different [^2].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/check
        locator: 'Check Your Understanding: GAN Anatomy'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/gan/loss#one-loss-function-or-two
        locator: Loss Functions, sec. One Loss Function or Two?
    source:
      id: google-ml-courses
      ref: gan/check#q3
      url: https://developers.google.com/machine-learning/gan/check
    status: draft
  - id: gans-008
    type: single
    difficulty: medium
    question: |
      You have IQ scores for 1000 people. You model the distribution of IQ scores with the following procedure:

      1. Roll three six-sided dice.
      2. Multiply the roll by a constant w.
      3. Repeat 100 times and take the average of all the results.

      You try different values for w until the result of your procedure equals the average of the real IQ scores. Is your model a generative model or a discriminative model?
    options:
      - text: Generative model
        correct: true
      - text: Discriminative model
        why: 'Incorrect: an analogous discriminative model would try to discriminate between different kinds of IQ scores. For example, a discriminative model might try to classify an IQ as fake or real.'
      - text: Not enough information to tell.
        why: This model does indeed fit the definition of one of our two kinds of models.
    explanation: 'With every roll you are effectively generating the IQ of an imaginary person, so the procedure is a generative model of IQ scores. Furthermore, your generative model captures the fact that IQ scores are distributed normally (that is, on a bell curve). [^1]'
    references:
      - source: google-ml-courses
        locator: 'Background: What is a Generative Model?'
        url: https://developers.google.com/machine-learning/gan/generative
    source:
      id: google-ml-courses
      ref: gan/generative#q1
      url: https://developers.google.com/machine-learning/gan/generative
    status: draft
  - id: gans-009
    type: single
    difficulty: medium
    question: A model returns a probability when you give it a data instance. Is this model a generative model or a discriminative model?
    options:
      - text: Generative model
        why: A generative model can estimate the probability of the instance, and also the probability of a class label.
      - text: Discriminative model
        why: A discriminative model can estimate the probability that an instance belongs to a class.
      - text: Not enough information to tell.
        correct: true
    explanation: Both generative and discriminative models can estimate probabilities (but they don't have to). [^1]
    references:
      - source: google-ml-courses
        locator: 'Background: What is a Generative Model?'
        url: https://developers.google.com/machine-learning/gan/generative
    source:
      id: google-ml-courses
      ref: gan/generative#q2
      url: https://developers.google.com/machine-learning/gan/generative
    status: draft
  - id: gans-010
    type: single
    difficulty: easy
    question: In a generative adversarial network (GAN), what does the generator take as input and what does it produce?
    options:
      - text: A random latent vector; a synthetic sample, such as an image
        correct: true
      - text: An image; the probability that the image is real
      - text: An image; a compressed latent vector describing it
      - text: A random latent vector; the class label of that vector
    explanation: |
      The generator takes a random vector and turns it into a generated sample, e.g. an image; it
      works like a reversed classifier, starting from a latent vector and upsampling it, much like
      the decoder of an autoencoder [^1]. Taking an image and saying whether it is real or generated
      is the discriminator's job [^1], and compressing an image into a latent vector is what an
      encoder does. The generator outputs data, not labels.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md
        locator: 'Lesson: Generative Adversarial Networks, introduction and secs. Discriminator and Generator'
    source:
      id: ms-ai-for-beginners
      ref: quiz-110/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-011
    type: single
    difficulty: medium
    question: Deep convolutional GANs (DCGANs) add batch normalization to the generator and the discriminator. What does it do for GAN training?
    options:
      - text: It normalizes each unit's input, which stabilizes learning and helps deep generators avoid collapsing to one output
        correct: true
      - text: It works best when applied to every layer, including the generator's output layer and the discriminator's input layer
      - text: It makes the generator and discriminator losses both decrease steadily to zero
      - text: It lets the generator be trained without a discriminator
    explanation: |
      DCGAN uses batch normalization in both networks: normalizing the input of each unit to zero mean
      and unit variance stabilizes learning, eases poor initialization and helps gradients flow, and
      it was critical for deep generators to start learning without collapsing all samples to a
      single point [^1]. Applying it to every layer caused oscillation and instability, so DCGAN
      leaves out the generator's output layer and the discriminator's input layer [^1]. Even with it,
      GAN losses do not go steadily down but oscillate as the two networks compete, and the generator
      is always trained through the discriminator's judgement [^2].
    references:
      - title: Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks (Radford, Metz & Chintala, 2015)
        url: https://arxiv.org/abs/1511.06434
        locator: Sec. 3 Approach and Model Architecture
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#training-the-gan
        locator: 'Lesson: Generative Adversarial Networks, sec. Training the GAN'
    source:
      id: ms-ai-for-beginners
      ref: quiz-210/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-10.json
    status: draft
  - id: gans-012
    type: short_answer
    difficulty: medium
    tags:
      - gan
      - discriminator
      - equilibrium
    question: |
      In a GAN, suppose the generator wins: its samples follow exactly the data distribution,
      $p_g = p_{\text{data}}$. What value does the optimal discriminator $D(\mathbf{x})$, its probability
      that $\mathbf{x}$ is real, output for every input?
    answer:
      numeric: 0.5
      tolerance: 0.001
      hint: a probability
      model: $D^*(\mathbf{x}) = \frac{p_{\text{data}}(\mathbf{x})}{p_{\text{data}}(\mathbf{x}) + p_g(\mathbf{x})} = \frac{1}{2}$
    explanation: |
      The discriminator is a binary classifier trained with cross-entropy to tell real from generated
      data, a two-sample test turned into a training signal [^1]. For a fixed generator the optimal
      discriminator is $D^*(\mathbf{x}) = p_{\text{data}}(\mathbf{x}) / (p_{\text{data}}(\mathbf{x}) + p_g(\mathbf{x}))$,
      so when the two densities are equal it outputs $1/2$ everywhere: the generator wins and the
      discriminator can only guess [^2]. Goodfellow et al. show that this is the global optimum of the
      minimax game [^2]. On a finite training set a flexible discriminator can still memorize the real
      samples, so in practice the equilibrium is only approximate.
    references:
      - source: d2l
        locator: Sec. 20.1 Generative Adversarial Networks (introduction)
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html
      - title: Generative Adversarial Nets (Goodfellow et al., 2014)
        locator: Sec. 4.1 Global Optimality of p_g = p_data (Proposition 1, Theorem 1)
        url: https://arxiv.org/abs/1406.2661
      - source: d2l
        locator: Sec. 20.1.6 Exercises
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#exercises
    source:
      id: d2l
      ref: chapter_generative-adversarial-networks/gan#ex1
      url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#exercises
    status: draft
  - id: gans-013
    type: short_answer
    difficulty: medium
    tags:
      - gan
      - discriminator-loss
      - cross-entropy
    question: |
      d2l trains the discriminator on a real and a fake batch with the binary cross-entropy averaged over
      the two, $\frac{1}{2}\left[-\log D(\mathbf{x}) - \log\left(1 - D(G(\mathbf{z}))\right)\right]$ per
      pair of examples. At the equilibrium where the discriminator outputs 0.5 for every input, what is
      this loss (natural logarithm)?
    answer:
      numeric: 0.693
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\frac{1}{2}\left[-\ln 0.5 - \ln 0.5\right] = \ln 2 \approx 0.693$
    explanation: |
      d2l's `update_D` adds the cross-entropy of the real batch with label 1 and of the fake batch with
      label 0, and divides by 2 [^1]. With $D = 0.5$ both terms equal $-\ln 0.5 = \ln 2$, so the average is
      $\ln 2 \approx 0.693$ per example. This matches the optimum of the original minimax value,
      $-\log 4 = 2 \log \tfrac{1}{2}$, reached when $p_g = p_{\text{data}}$ [^2]. A discriminator loss
      hovering around 0.69 therefore means it can no longer tell real from fake, while a loss near 0
      means it wins easily.
    references:
      - source: d2l
        locator: Sec. 20.1.4 Training (update_D)
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#training
      - title: Generative Adversarial Nets (Goodfellow et al., 2014)
        locator: Sec. 4.1 Global Optimality of p_g = p_data (Theorem 1)
        url: https://arxiv.org/abs/1406.2661
      - source: d2l
        locator: Sec. 20.1.6 Exercises
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#exercises
    source:
      id: d2l
      ref: chapter_generative-adversarial-networks/gan#ex1-b
      url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#exercises
    status: draft
  - id: gans-014
    type: single
    difficulty: medium
    tags:
      - dcgan
      - leaky-relu
      - dying-relu
    question: |
      DCGAN's discriminator uses leaky ReLU, with slope $\alpha = 0.2$ for negative inputs. What is the
      main risk of using a standard ReLU there instead?
    options:
      - text: The discriminator can no longer output probabilities, because ReLU outputs have no upper bound
        why: The probability comes from a sigmoid on the final logit, not from the hidden activations [^1].
      - text: The discriminator becomes a linear function of its input, so it cannot separate real from fake
        why: ReLU is nonlinear; a network of convolutions and ReLUs is piecewise linear, not linear.
      - text: Units whose inputs stay negative output 0 with zero gradient, stop learning, and pass the generator less signal
        correct: true
      - text: Negative pixel values of the generated images are clipped to 0 before the discriminator sees them
        why: The activations act on the discriminator's internal feature maps, after convolutions, not on the input image.
    explanation: |
      Leaky ReLU gives a small nonzero output, and gradient, for negative inputs. d2l explains that it
      fixes the "dying ReLU" problem: a unit whose input is always negative outputs 0 and, since the
      ReLU gradient there is 0, can never recover [^1]. In a GAN the generator is trained only through
      gradients that flow back through the discriminator [^2], so dead discriminator units also cut off
      part of the generator's learning signal. The DCGAN authors recommend leaky ReLU in all layers of the
      discriminator [^3].
    references:
      - source: d2l
        locator: Sec. 20.2.3 Discriminator
        url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#discriminator
      - source: d2l
        locator: Sec. 20.1.4 Training (update_G)
        url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html#training
      - title: Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks (Radford et al., 2016)
        locator: Sec. 3 Approach and Model Architecture (architecture guidelines)
        url: https://arxiv.org/abs/1511.06434
      - source: d2l
        locator: Sec. 20.2.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#exercises
    source:
      id: d2l
      ref: chapter_generative-adversarial-networks/dcgan#ex1
      url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#exercises
    status: draft
