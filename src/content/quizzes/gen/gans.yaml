  - id: gans-018
    type: single
    difficulty: medium
    tags:
      - bce-with-logits
      - sigmoid
      - discriminator
    question: |
      A GAN discriminator's forward pass ends with `out = torch.sigmoid(self.fc4(x))`, and its loss
      is `nn.BCEWithLogitsLoss()`. What is wrong?
    options:
      - text: The sigmoid is applied twice, so outputs never drop below 0.5
        correct: true
      - text: Nothing; `BCEWithLogitsLoss` detects probabilities and skips its own sigmoid
        why: '`BCEWithLogitsLoss` always applies a sigmoid to its input; it cannot tell logits from probabilities [^2].'
      - text: The loss becomes negative and training diverges
        why: Binary cross-entropy stays non-negative; the problem is that the outputs are squashed into $(0.5, 0.73)$ [^2].
      - text: '`BCEWithLogitsLoss` needs a softmax output, not a sigmoid'
        why: It is meant for raw logits of a binary task; it applies the sigmoid itself [^2].
    explanation: |
      The notebooks leave the discriminator's last layer without an activation because
      `BCEWithLogitsLoss` combines the sigmoid and the binary cross-entropy in one numerically
      stable function [^1][^2]. With an extra sigmoid, the loss sees $\sigma(\sigma(z))$, which lies
      in $(0.5, 0.73)$: "fake" can never be predicted with confidence, and the gradients are
      distorted. Use either raw logits with `BCEWithLogitsLoss`, or a sigmoid with `BCELoss`.
    references:
      - source: udacity-dl-pytorch
        locator: MNIST GAN notebook, Discriminator — Sigmoid Output
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/gan-mnist/MNIST_GAN_Solution.ipynb
      - title: 'PyTorch documentation: BCEWithLogitsLoss'
        url: https://pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html
        locator: '"This loss combines a Sigmoid layer and the BCELoss in one single class"'
    source:
      id: udacity-dl-pytorch
      ref: gan-mnist/MNIST_GAN_Solution.ipynb#sigmoid-output
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/gan-mnist/MNIST_GAN_Solution.ipynb
