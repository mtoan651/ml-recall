  - id: gans-027
    type: short_answer
    difficulty: hard
    tags:
      - jensen-shannon
      - minimax-value
      - disjoint-support
    question: |
      For the original GAN, the value of the game at the optimal discriminator is
      $C(G) = \max_D V(D, G) = -\log 4 + 2\,\mathrm{JSD}(p_{\text{data}} \,\|\, p_g)$ (natural log).
      Its minimum, $-\log 4$, is reached when $p_g = p_{\text{data}}$. What is $C(G)$ when
      $p_{\text{data}}$ and $p_g$ have disjoint supports?
    answer:
      numeric: 0
      tolerance: 0.001
      hint: a number
      model: $\mathrm{JSD} = \log 2$, so $C(G) = -\log 4 + 2\log 2 = 0$
    explanation: |
      The Jensen–Shannon divergence is symmetric and bounded by $\log 2$, a value it reaches when the
      two distributions do not overlap [^1][^3]. Then $C(G) = -\log 4 + 2 \log 2 = 0$: the optimal
      discriminator outputs 1 on real and 0 on generated data, and both log terms vanish [^2]. Because
      $C(G)$ is then the same constant for every such generator, it gives no signal on how close
      $p_g$ is to $p_{\text{data}}$, one explanation of vanishing generator gradients when the
      discriminator is too good [^3].
    references:
      - source: nptel-deep-learning-2
        locator: Assignment 8, Q6–Q7 (minimum loss −log 4 at the optimal generator; KL vs JSD symmetry)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106201/noc19_cs18-assessmentid-84.pdf
      - title: Goodfellow et al. (2014), Generative Adversarial Nets, arXiv:1406.2661
        url: https://arxiv.org/abs/1406.2661
        locator: Sec. 4.1 Global Optimality of p_g = p_data (Theorem 1)
      - title: 'Wikipedia: Generative adversarial network'
        url: https://en.wikipedia.org/wiki/Generative_adversarial_network#Vanishing_gradient
        locator: Mathematical properties — Main theorems for GAN game; Training — Vanishing gradient
    source:
      id: nptel-deep-learning-2
      ref: deep-learning-2/assignment8#q6
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106201/noc19_cs18-assessmentid-84.pdf
