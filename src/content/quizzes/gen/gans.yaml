  - id: gans-028
    type: multiple
    difficulty: medium
    tags:
      - gan-properties
      - implicit-density
      - markov-chains
    question: Which statements about the original GAN framework are true? Select all that apply.
    options:
      - text: The generator never writes down $p_g(x)$; it only produces samples
        correct: true
      - text: The discriminator must be kept well synchronized with the generator during training
        correct: true
      - text: No Markov chains are needed, neither to train the model nor to draw samples
        correct: true
      - text: Drawing a sample from a trained generator requires running a Markov chain to convergence
        why: Sampling is a single forward pass of the generator on a noise vector [^2].
      - text: Training also yields an encoder that maps each data point back to its latent code $z$
        why: A vanilla GAN learns only $x = G(z)$; inferring $z$ from $x$ needs an extension such as an extra encoder network [^2].
    explanation: |
      Goodfellow et al. list the trade-offs: the model has no explicit representation of $p_g(x)$, and
      $D$ must be synchronised with $G$ (if $G$ is trained too much without updating $D$, it can
      collapse many $z$ onto one $x$) [^2]. On the plus side, only backpropagation is needed and no
      Markov chains, unlike Boltzmann machines [^1][^2]. A GAN is a pure sampler: it generates, but it
      cannot map an image back to its latent code, which the NPTEL course calls "abstraction" and
      which RBMs and VAEs provide [^1].
    references:
      - source: nptel-deep-learning-2
        locator: Assignment 8, Q3 and Q8 (statements about GANs; models capable of abstraction and generation)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106201/noc19_cs18-assessmentid-84.pdf
      - title: Goodfellow et al. (2014), Generative Adversarial Nets, arXiv:1406.2661
        url: https://arxiv.org/abs/1406.2661
        locator: Sec. 6 Advantages and disadvantages; Sec. 7 Conclusions and future work
    source:
