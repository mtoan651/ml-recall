  - id: gans-019
    type: short_answer
    difficulty: medium
    tags:
      - dcgan
      - strided-convolution
      - shapes
    question: |
      A DCGAN discriminator for $32 \times 32 \times 3$ images has three convolutions
      with `kernel_size=4, stride=2, padding=1` and 32, 64 and 128 output channels, then flattens
      the result into one `nn.Linear(?, 1)` layer. How many input features does that linear layer
      need?
    answer:
      numeric: 2048
      tolerance: 0
      hint: a whole number
      model: '$32 \to 16 \to 8 \to 4$ pixels per side, 128 channels: $128 \times 4 \times 4 = 2048$'
    explanation: |
      Each strided convolution gives $\lfloor (W - F + 2P)/S \rfloor + 1 = (W - 4 + 2)/2 + 1 = W/2$,
      so the side length halves: 32, 16, 8, 4 [^2]. The last feature map is $128 \times 4 \times 4$,
      flattened to 2048 features, as in the notebook's `nn.Linear(conv_dim*4*4*4, 1)` with
      `conv_dim = 32` [^1]. DCGAN downsamples with strided convolutions instead of max pooling [^1].
    references:
      - source: udacity-dl-pytorch
        locator: DCGAN notebook, Discriminator (helper conv function, Discriminator class)
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/dcgan-svhn/DCGAN_Solution.ipynb
