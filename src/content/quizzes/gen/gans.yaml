  - id: gans-020
    type: short_answer
    difficulty: medium
    tags:
      - lsgan
      - least-squares-loss
      - cyclegan
    question: |
      A CycleGAN discriminator is trained with the least-squares (LSGAN) loss: the real loss is
      the mean of $(D(x) - 1)^2$ over real images and the fake loss the mean of $D(G(z))^2$ over
      fakes; the discriminator loss is their sum. For two real images the outputs are 0.8 and 0.6,
      for two fakes 0.3 and 0.1. What is the discriminator loss?
    answer:
      numeric: 0.15
      tolerance: 0.001
      hint: a number, 2 decimals
      model: 'real: $((-0.2)^2 + (-0.4)^2)/2 = 0.10$; fake: $(0.3^2 + 0.1^2)/2 = 0.05$; total $0.15$'
    explanation: |
      LSGAN replaces the sigmoid cross-entropy with mean squared errors to the targets 1 (real)
      and 0 (fake); the notebook's `real_mse_loss` is `torch.mean((D_out-1)**2)` and its
      `fake_mse_loss` is `torch.mean(D_out**2)` [^1]. Here $0.10 + 0.05 = 0.15$. Squared errors
      keep penalizing fakes that are on the right side of the decision boundary but far from the
      real data, which counters vanishing gradients and stabilizes training [^1][^2].
    references:
      - source: udacity-dl-pytorch
        locator: CycleGAN notebook, Least Squares GANs — Discriminator Losses
        url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/cycle-gan/CycleGAN_Solution.ipynb
      - title: Mao et al. (2017), Least Squares Generative Adversarial Networks
        url: https://arxiv.org/abs/1611.04076
        locator: Abstract and Sec. 3.2 Least Squares GANs
    source:
      id: udacity-dl-pytorch
      ref: cycle-gan/CycleGAN_Solution.ipynb#lsgan-discriminator-loss
      url: https://github.com/udacity/deep-learning-v2-pytorch/blob/c9404fc86181fc3f0906b368697268257f348535/cycle-gan/CycleGAN_Solution.ipynb
