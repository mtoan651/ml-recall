  - id: diffusion-010
    type: single
    difficulty: medium
    tags:
      - denoising-score-matching
      - training-objective
      - noise-scale
    question: |
      When training a score model with denoising score matching, the time is sampled as
      `t = torch.rand(B) * (1 - eps) + eps`, i.e. uniformly from $[\epsilon, 1]$ with a small $\epsilon > 0$ such as
      $10^{-3}$, instead of from $[0, 1]$. Why are the times near 0 left out?
    options:
      - text: 'As $t \to 0$, $\sigma_t \to 0$: the target $-\mathbf{z}/\sigma_t$ blows up and the score of almost clean data is too irregular'
        correct: true
      - text: At $t = 0$ the forward process has already turned the data into pure noise, so there is nothing left to learn
        why: 'It is the other way round: at $t = 0$ the data is clean; pure noise is reached at $t = 1$.'
      - text: Times near 0 would make some examples in a batch share a noise level, which biases the gradient
        why: Each example draws its own $t$ from a continuous distribution; sharing noise levels is not the issue.
      - text: The diffusion coefficient $g(t) = \lambda^t$ is undefined at $t = 0$, so the forward process cannot start there
        why: $g(0) = \lambda^0 = 1$ is well defined; the problem is $\sigma_0 = 0$, not $g$.
    explanation: |
      The noise scale $\sigma_t^2 = \int_0^t g^2\,d\tau$ goes to 0 as $t \to 0$ [^1]. The denoising target $-\mathbf{z}/\sigma_t$ then
      becomes arbitrarily large, and the score of nearly clean data is very sharp around each training point, so NMA
      truncates the time range at $\epsilon$ for numerical stability and to avoid learning the highly irregular score of
      a tiny noise scale [^1][^2]. The sampler likewise stops at $t = \epsilon$ rather than 0 [^2].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Bonus The Math behind Score Matching Objective
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Coding Exercise 2 Defining the loss function (Tips) and the Euler–Maruyama sampler
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
