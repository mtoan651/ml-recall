  - id: diffusion-005
    type: short_answer
    difficulty: medium
    tags:
      - forward-process
      - noise-schedule
      - sde
    question: |
      A variance-exploding forward process $d\mathbf{x} = g(t)\,d\mathbf{w}$ uses the diffusion coefficient
      $g(t) = \lambda^t$ with $\lambda = 25$, for $t \in [0, 1]$. Given $\mathbf{x}_0$, the noisy state is
      $\mathbf{x}_t \sim \mathcal{N}(\mathbf{x}_0, \sigma_t^2 I)$ with $\sigma_t^2 = \int_0^t g(\tau)^2\,d\tau$. What is the noise
      standard deviation $\sigma_1$ at the end of the process?
    answer:
      numeric: 9.85
      tolerance: 0.02
      hint: a number, 2 decimals
      model: $\sigma_1^2 = \frac{\lambda^2 - 1}{2\ln\lambda} = \frac{624}{2\ln 25} \approx 96.93$, so $\sigma_1 \approx 9.85$
    explanation: |
      Integrating $g(\tau)^2 = \lambda^{2\tau} = e^{2\tau\ln\lambda}$ gives $\sigma_t^2 = (\lambda^{2t} - 1)/(2\ln\lambda)$ [^1].
      At $t = 1$ this is $(625 - 1)/(2 \times 3.219) \approx 96.9$, so $\sigma_1 \approx 9.85$; the noise is scaled by
      this standard deviation, the square root of the variance, not by the variance itself [^1]. MNIST pixels lie in
      $[0, 1]$, so noise with a standard deviation near 10 drowns the digit, which is why the sampler can start from
      pure noise $\mathcal{N}(\mathbf{0}, \sigma_1^2 I)$ [^2].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Coding Exercise 1 Train Diffusion for MNIST (Math Recap for Forward Processes, `marginal_prob_std`)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Train and Test the Diffusion Model (Euler–Maruyama sampler, initial noise)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial2#ex1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-006
    type: single
    difficulty: medium
    tags:
      - reverse-sde
      - sampling
    question: |
      The forward process $d\mathbf{x} = g(t)\,d\mathbf{w}$ is simulated backwards in time with step $\Delta t$, using the
      score $\mathbf{s}(\mathbf{x}, t) = \nabla_\mathbf{x}\log p_t(\mathbf{x})$ and fresh noise $\mathbf{z}_t \sim \mathcal{N}(\mathbf{0}, I)$.
      Which update is one step of the reverse-time SDE?
    options:
      - text: $\mathbf{x}_{t-\Delta t} = \mathbf{x}_t + g(t)^2\,\mathbf{s}(\mathbf{x}_t, t)\,\Delta t + g(t)\sqrt{\Delta t}\,\mathbf{z}_t$
        correct: true
      - text: $\mathbf{x}_{t-\Delta t} = \mathbf{x}_t - g(t)^2\,\mathbf{s}(\mathbf{x}_t, t)\,\Delta t + g(t)\sqrt{\Delta t}\,\mathbf{z}_t$
        why: Subtracting the score moves samples downhill in density, away from the data, so the noise would never be removed.
      - text: $\mathbf{x}_{t-\Delta t} = \mathbf{x}_t + g(t)\,\mathbf{s}(\mathbf{x}_t, t)\,\Delta t + g(t)^2\sqrt{\Delta t}\,\mathbf{z}_t$
        why: 'The powers are swapped: the drift carries $g(t)^2$ and the noise term $g(t)$, as in the forward step $\mathbf{x}_{t+\Delta t} = \mathbf{x}_t + g(t)\sqrt{\Delta t}\,\mathbf{z}_t$.'
      - text: $\mathbf{x}_{t-\Delta t} = \mathbf{x}_t - g(t)\sqrt{\Delta t}\,\mathbf{z}_t$, with no score term at all
        why: Fresh noise cannot cancel the noise added earlier; without the score term the samples just keep diffusing.
    explanation: |
      Anderson's reverse-time result says that the time reversal of $d\mathbf{x} = g(t)\,d\mathbf{w}$ is
      $d\mathbf{x} = -g(t)^2\nabla_\mathbf{x}\log p_t(\mathbf{x})\,dt + g(t)\,d\mathbf{w}$, with time running backwards [^1][^2].
      Because $dt$ is negative going backwards, a step of size $\Delta t$ adds $+g(t)^2\,\mathbf{s}\,\Delta t$: the score
      term pushes each sample uphill in density, while the noise term keeps the samples spread as in the forward
      process. This Euler–Maruyama step is the simplest sampling equation of a diffusion model [^1].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Section 1.3 Reverse Diffusion and Bonus Exercise 1.3 Score enables reversal of diffusion
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - title: Song et al. (2021), Score-Based Generative Modeling through Stochastic Differential Equations
        locator: Sec. 3.2 Generating samples by reversing the SDE, Eq. (6)
        url: https://arxiv.org/abs/2011.13456
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial1#ex1.3
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-007
    type: multiple
    difficulty: hard
    tags:
      - reverse-sde
      - probability-flow-ode
      - sampling
    question: |
      For a forward SDE $d\mathbf{x} = \mathbf{f}(\mathbf{x}, t)\,dt + g(t)\,d\mathbf{w}$, a diffusion model can sample either with
      the reverse SDE $d\mathbf{x} = [\mathbf{f} - g^2\,\nabla_\mathbf{x}\log p_t]\,dt + g\,d\mathbf{w}$ or with the probability-flow
      ODE $d\mathbf{x} = [\mathbf{f} - \tfrac12 g^2\,\nabla_\mathbf{x}\log p_t]\,dt$. Which statements are true? Select all that apply.
    options:
      - text: Both, started from $p_T$ and run from $t = T$ back to 0, pass through the same marginals $p_t$ as the forward process
        correct: true
      - text: The ODE has no noise term, so a given starting point is always mapped to the same sample
        correct: true
      - text: Apart from $\mathbf{f}$ and $g$, both need only the score $\nabla_\mathbf{x}\log p_t$, which a network learns by denoising
        correct: true
      - text: The ODE uses half the score weight because it takes twice as many steps as the SDE
        why: The factor $\tfrac12$ gives the deterministic flow the same marginals as the stochastic one; it has nothing to do with the number of steps.
      - text: Only the reverse SDE can generate samples; the ODE can only evaluate likelihoods
        why: Simulating either the SDE or the ODE samples from the model [^1].
    explanation: |
      Solving either the reverse SDE or the probability-flow ODE backwards in time from $p_T$ reproduces the
      forward process's marginals $p_t$, so both can turn noise into data [^1][^2]. The ODE replaces the noise by an
      extra half-weight score drift, so its trajectories are deterministic [^2]. In both, the only unknown is the
      time-dependent score, which is learned with denoising score matching [^1].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Summary (general reverse SDE and probability-flow ODE)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - title: Song et al. (2021), Score-Based Generative Modeling through Stochastic Differential Equations
        locator: Sec. 4.3 Probability flow and connection to neural ODEs
        url: https://arxiv.org/abs/2011.13456
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial1#sec-summary
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-008
    type: single
    difficulty: hard
    tags:
      - u-net
      - score-network
      - noise-scale
    question: |
      A time-dependent U-Net score model for MNIST ends its forward pass with
      `h = h / marginal_prob_std(t)[:, None, None, None]`, i.e. it divides its output by $\sigma_t$. It is trained so
      that $\mathbf{s}_\theta(\mathbf{x} + \sigma_t\mathbf{z}, t) \approx -\mathbf{z}/\sigma_t$. What is the main benefit and the main
      cost of this design?
    options:
      - text: The layers before the division only need to output about $-\mathbf{z}$, of unit scale at every $t$; but errors are amplified when $\sigma_t$ is small
        correct: true
      - text: It normalizes the input image, so the network sees pixel values in $[0, 1]$ at every noise level; but it slows down every training step
        why: The division acts on the output, not on the input; its effect is on the scale of what the network must produce.
      - text: It turns the score into a probability distribution whose entries sum to one; but it makes the sampler nondeterministic
        why: A score is a gradient of $\log p$, not a probability; dividing by $\sigma_t$ only rescales it.
      - text: It removes the need for a time embedding, since $t$ now enters only through $\sigma_t$; but it doubles the parameter count
        why: The U-Net still adds a time embedding in every block, and the division adds no parameters at all.
    explanation: |
      The target $-\mathbf{z}/\sigma_t$ changes scale by orders of magnitude, from about $0.1$ at $t = 1$ ($\sigma_1$ near 10)
      to huge values as $t \to 0$ [^1]. Dividing by $\sigma_t$ inside the model means the layers before it only predict
      $-\mathbf{z}$, whose variance is about 1 at every $t$, which is easier to learn [^1]. The price is that any error is
      multiplied by $1/\sigma_t$ in the low-noise regime; the loss weighting $\gamma_t = \sigma_t^2$ counteracts this by
      down-weighting the small-$\sigma_t$ times [^1][^2].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Section 1 Neural Network Architecture, Think! 1 U-Net Architecture (item 5)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Coding Exercise 2 Defining the loss function (weighting $\gamma_t = \sigma_t^2$)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial2#think1-q5
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
