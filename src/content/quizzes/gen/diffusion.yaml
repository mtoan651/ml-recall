title: Diffusion Models
questions:
  - id: diffusion-001
    type: single
    difficulty: easy
    tags:
      - score-function
      - diffusion-models
    question: |
      Diffusion models work with the score of a density, $\mathbf{s}(\mathbf{x}) = \nabla_{\mathbf{x}} \log p(\mathbf{x})$.
      For a single Gaussian $p = \mathcal{N}(\boldsymbol\mu, \sigma^2 I)$, what do the direction and the length
      of the score tell you at a point $\mathbf{x}$?
    options:
      - text: 'Direction: toward the mode (uphill in density). Length: larger the farther $\mathbf{x}$ is from the mode'
        correct: true
      - text: 'Direction: away from the mode (downhill in density). Length: larger the closer $\mathbf{x}$ is to the mode'
        why: The score is a gradient of $\log p$, so it points uphill, toward higher density; for this Gaussian it is $-(\mathbf{x}-\boldsymbol\mu)/\sigma^2$.
      - text: 'Direction: toward the mode. Length: largest at the mode itself and shrinking with the distance'
        why: At the mode the gradient of $\log p$ is zero; the length $\lVert\mathbf{x}-\boldsymbol\mu\rVert/\sigma^2$ grows with the distance.
      - text: 'Direction: along the contour lines of the density. Length: the same everywhere'
        why: A gradient is perpendicular to the contour lines, not along them, and here its length depends on the distance from the mode.
    explanation: |
      The score is the gradient of the log density, so it points in the direction in which the
      probability of the data increases fastest [^1]. For $\mathcal{N}(\boldsymbol\mu, \sigma^2 I)$,
      $\log p(\mathbf{x}) = -\lVert\mathbf{x}-\boldsymbol\mu\rVert^2/(2\sigma^2) + \text{const}$, so
      $\mathbf{s}(\mathbf{x}) = -(\mathbf{x}-\boldsymbol\mu)/\sigma^2$: it points back to the mean, and its length is
      proportional to the distance from it, zero at the mode [^1]. Reverse diffusion follows this field (plus
      noise) to move noisy samples back toward regions of high data density [^2].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Section 1.2 What is Score, Think! 1.2 What does score tell us?
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - title: Song et al. (2021), Score-Based Generative Modeling through Stochastic Differential Equations
        locator: Sec. 3.2 Generating samples by reversing the SDE
        url: https://arxiv.org/abs/2011.13456
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial1#think1.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-002
    type: short_answer
    difficulty: medium
    tags:
      - score-function
      - gaussian-mixture
    question: |
      A 1-D Gaussian mixture is $p(x) = \tfrac12\,\mathcal{N}(x; -1, 1) + \tfrac12\,\mathcal{N}(x; 1, 1)$. Its score is the
      average of the component scores $-(x - \mu_k)$, weighted by how much each component contributes to the
      density at $x$. What is the score $\frac{d}{dx}\log p(x)$ at $x = 1$?
    answer:
      numeric: -0.238
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $w_1 \cdot (-2) + w_2 \cdot 0$ with $w_1 = e^{-2}/(1 + e^{-2}) \approx 0.119$, so $\approx -0.238$
    explanation: |
      Differentiating $\log \sum_k \pi_k p_k(x)$ gives $\sum_k w_k(x)\,\frac{d}{dx}\log p_k(x)$ with
      $w_k(x) = \pi_k p_k(x)/p(x)$, the posterior probability that $x$ came from component $k$ [^1]. At $x = 1$ the
      right component's score is $0$ ($x$ is its mean) and the left one's is $-(1 - (-1)) = -2$. The weights are
      proportional to $e^{-(1+1)^2/2} = e^{-2}$ and $e^{0} = 1$, so $w_1 = e^{-2}/(1 + e^{-2}) \approx 0.119$ and the
      score is $\approx -0.238$, a small pull toward the far mode. The nearest mode dominates the score, which is
      the intuition the Neuromatch Academy tutorial draws from its Gaussian-mixture example [^1].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Coding Exercise 1.2 Score for Gaussian Mixtures and Think! 1.2
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial1#ex1.2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-003
    type: single
    difficulty: medium
    tags:
      - denoising-score-matching
      - training-objective
    question: |
      Denoising score matching trains a score network by minimizing
      $\mathbb{E}\,\lVert \sigma_t\,\mathbf{s}_\theta(\mathbf{x} + \sigma_t \mathbf{z}, t) + \mathbf{z}\rVert^2$ over clean training
      points $\mathbf{x}$ and Gaussian noise $\mathbf{z}$. With two or more distinct training points, can a flexible
      enough network drive this loss to zero?
    options:
      - text: 'No: one noisy input can arise from different clean points with different noise, so the best output is an average'
        correct: true
      - text: 'Yes: a network with enough capacity can memorize the noise that was added to every training example'
        why: The network sees only the noisy input, not which clean point and noise produced it; the same noisy input has several possible targets.
      - text: Yes, but only if every training example is noised with the same noise level $\sigma_t$
        why: Even at one fixed $\sigma_t$, Gaussian noise lets two different clean points reach the same noisy input, so the targets still conflict.
      - text: No, because the loss always contains the term $\lVert\mathbf{z}\rVert^2$, which does not depend on $\theta$
        why: An output of exactly $-\mathbf{z}/\sigma_t$ would make each term zero; the obstacle is that $\mathbf{z}$ cannot be read off the noisy input.
    explanation: |
      Gaussian noise lets two clean points $\mathbf{x}_1 \neq \mathbf{x}_2$ produce the same noisy input,
      $\mathbf{x}_1 + \sigma_t\mathbf{z}_1 = \mathbf{x}_2 + \sigma_t\mathbf{z}_2$, while the targets $-\mathbf{z}_1/\sigma_t$ and
      $-\mathbf{z}_2/\sigma_t$ differ [^1]. A function of the noisy input can output only one value there, so the
      minimizer is the conditional average of the targets, and that average is the true score of the noised data
      distribution [^1][^2]. The leftover variance keeps the loss above zero. The averaging mirrors the way the score
      of a mixture is a weighted average of the component scores [^1].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Section 2 Learning the score by denoising, Think! 2 Denoising objective
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - title: Vincent (2011), A Connection Between Score Matching and Denoising Autoencoders
        url: https://www.iro.umontreal.ca/~vincentp/Publications/smdae_techreport.pdf
        locator: Denoising score matching and its equivalence to explicit score matching
    source:
      id: neuromatch-dl
      ref: W2D4_DiffusionGenerativeModels/W2D4_Tutorial1#think2
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: diffusion-004
    type: true_false
    difficulty: medium
    tags:
      - denoising-score-matching
      - score-function
    question: |
      A "dataset" holds the single point $\mathbf{x}_0 = \mathbf{0}$. After noising, $\tilde{\mathbf{x}} = \sigma_t \mathbf{z}$
      with $\mathbf{z} \sim \mathcal{N}(\mathbf{0}, I)$, and the exact score of the noised distribution is
      $\mathbf{s}(\tilde{\mathbf{x}}, t) = -\tilde{\mathbf{x}}/\sigma_t^2$. True or false: plugging this exact score into
      the denoising loss $\lVert \sigma_t\,\mathbf{s}(\tilde{\mathbf{x}}, t) + \mathbf{z}\rVert^2$ gives exactly $0$ for every
      noise sample $\mathbf{z}$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: $\sigma_t \cdot (-\sigma_t\mathbf{z}/\sigma_t^2) + \mathbf{z} = -\mathbf{z} + \mathbf{z} = \mathbf{0}$ for every $\mathbf{z}$.
    explanation: |
      With one data point there is no doubt about where a noisy input came from: $\tilde{\mathbf{x}} = \sigma_t\mathbf{z}$
      fixes $\mathbf{z} = \tilde{\mathbf{x}}/\sigma_t$. The noised distribution is $\mathcal{N}(\mathbf{0}, \sigma_t^2 I)$, whose
      score is $-\tilde{\mathbf{x}}/\sigma_t^2$, and $\sigma_t\mathbf{s} + \mathbf{z} = -\mathbf{z} + \mathbf{z} = \mathbf{0}$. The
      Neuromatch Academy tutorial uses exactly this case to unit-test a loss implementation: a correct loss returns
      zero for the analytic score [^1]. With two or more data points the loss cannot reach zero, because different
      points produce overlapping noisy inputs [^2].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Coding Exercise 2 Implementing Denoising Score Matching Objective (test with a single 0 data point)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
      - source: neuromatch-dl
        locator: W2D4 Tutorial 1, Think! 2 Denoising objective
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial1.ipynb
    source:
