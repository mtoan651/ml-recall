  - id: diffusion-009
    type: short_answer
    difficulty: medium
    tags:
      - u-net
      - transposed-convolution
      - skip-connections
    question: |
      The encoder of a diffusion U-Net for $28 \times 28$ MNIST images applies 3×3 convolutions without padding:
      stride 1 ($28 \to 26$), stride 2 ($26 \to 12$), stride 2 ($12 \to 5$) and stride 2 ($5 \to 2$). The decoder mirrors
      it with 3×3 transposed convolutions of stride 2 and concatenates each output with the encoder map of the same
      size. The first one turns $2 \times 2$ into $5 \times 5$. What height would the next one,
      `nn.ConvTranspose2d(256, 64, 3, stride=2)` without `output_padding`, produce from the $5 \times 5$ map?
    answer:
      numeric: 11
      tolerance: 0
      hint: an integer
      model: $(5 - 1) \times 2 + 3 = 11$, one short of the encoder's 12, hence `output_padding=1`
    explanation: |
      Without padding, a transposed convolution produces $(n - 1)\cdot\text{stride} + k$ rows [^1], here
      $(5 - 1)\cdot 2 + 3 = 11$. The encoder went $12 \to 5$ because $\lfloor (12 - 3)/2 \rfloor + 1 = 5$, and a stride-2
      convolution maps both 11 and 12 to 5, so the size cannot be inverted uniquely [^1]. The skip connection
      concatenates with the $12 \times 12$ encoder map, so NMA's U-Net passes `output_padding=1` to add the missing row
      and column [^2]. Concatenating encoder features into the decoder is the U-Net's skip connection [^2].
    references:
      - title: 'PyTorch documentation: torch.nn.ConvTranspose2d'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html
        locator: Shape (output size formula) and the note on output_padding
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Network architecture (time-dependent U-Net) and Think! 1 (items 2–3)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
