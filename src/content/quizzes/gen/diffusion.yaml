  - id: diffusion-011
    type: single
    difficulty: medium
    tags:
      - u-net
      - time-embedding
      - score-network
    question: |
      In the diffusion U-Net of the Neuromatch Academy (NMA) tutorial, the time $t$ is first embedded as a vector:
      $\sin$ and $\cos$ of $2\pi\omega_i t$ for fixed random frequencies $\omega_i$, followed by a learned linear layer.
      How does this embedding reach a convolutional feature map `h` of shape (B, C, H, W) inside a block?
    options:
      - text: A linear layer maps it to $C$ numbers per example, which are added at every spatial position of their channel
        correct: true
      - text: It is written into the input image as an extra row of pixels before the first convolution
        why: The embedding is injected in every block as per-channel values, not by editing the image.
      - text: It is multiplied with the convolution kernels, giving each time step its own set of weights
        why: The kernels are shared across all $t$; time enters additively through a learned `Dense(embed_dim, C)` output shaped (B, C, 1, 1).
      - text: It replaces the normalization statistics of each layer with values computed from $t$
        why: The network uses ordinary GroupNorm layers; time is added before the normalization as a per-channel offset.
    explanation: |
      Each block computes `h = conv(h_prev) + t_mod(embed)`, where `t_mod` is a linear layer whose output is reshaped to
      (B, C, 1, 1), so broadcasting adds the same value at every pixel of a channel [^1]. The embedding itself is
      $[\sin(2\pi\omega t), \cos(2\pi\omega t)]$ with frequencies drawn once and frozen (`requires_grad=False`), followed by
      a learned linear layer [^1]. A time-dependent shift per channel lets the same convolution weights behave
      differently at different noise levels, which a score that depends on $t$ requires [^1].
    references:
      - source: neuromatch-dl
        locator: W2D4 Tutorial 2, Network architecture (time embedding and modulation) and Think! 1 (item 4)
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D4_DiffusionGenerativeModels/instructor/W2D4_Tutorial2.ipynb
    source:
