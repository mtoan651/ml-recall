  - id: knowledge-rep-024
    type: single
    difficulty: hard
    tags:
      - propositional-logic
      - equivalence
      - tautology
    question: |
      Compare $S_1 = (U \to (X \lor X)) \lor U$ and $S_2 = \lnot(X \land (X \land U))$. Which
      statement is correct?
    options:
      - text: 'They are equivalent: both are false only when $U$ and $X$ are true'
        why: '$S_1$ is never false: if $U$ is true its right disjunct is true, and if $U$ is false $U \to X$ is true.'
      - text: 'They are not equivalent: they differ only when $U$ and $X$ are true'
        correct: true
      - text: 'They are not equivalent: they differ only when $U$ and $X$ are false'
        why: With $U$ and $X$ false, $S_2 = \lnot F$ is true and $S_1$ is true (it is a tautology), so they agree there.
      - text: 'They are equivalent: each of them is true on all four rows'
        why: $S_2$ is equivalent to $\lnot(X \land U)$, which is false when $X$ and $U$ are both true.
    explanation: |
      $S_1$ is a tautology: with $U$ true the disjunct $U$ is true, and with $U$ false $U \to X$ is
      true. $S_2$ simplifies to $\lnot(X \land U)$, which is false exactly when $X$ and $U$ are both
      true. Equivalence needs agreement on every row, but one disagreeing row shows non-equivalence [^1],
      and here there is exactly one such row [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Equivalence"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px3
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part F, item 6
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-F6
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
