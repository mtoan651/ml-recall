  - id: knowledge-rep-041
    type: true_false
    difficulty: medium
    tags:
      - first-order-logic
      - background-knowledge
      - symbolization
    shuffle: false
    question: |
      "Every fox is cute; therefore all vixens are cute" is valid in English, because every vixen is
      necessarily a fox. Its FOL symbolization $\forall x\,(F(x) \to C(x)) \ \therefore\ \forall x\,(V(x) \to C(x))$
      has a counter-model. True or false: that counter-model shows the English argument is invalid.
    options:
      - text: 'True'
        why: The counter-model treats $V$ and $F$ as unrelated, e.g. it contains a $V$ that is not $F$ and not $C$. That case is impossible for the English words, so it says nothing about the English argument.
      - text: 'False'
        correct: true
    explanation: |
      FOL only sees the logical form; it knows nothing about the meanings of "fox" and "vixen", so a
      counter-model can make something a vixen without making it a fox [^1]. The book warns that it
      would be wrong to infer the invalidity of the English argument from such a counter-model; one
      has to argue that the symbolization loses nothing important [^1]. For a knowledge base the
      lesson is that background knowledge must be stated: adding $\forall x\,(V(x) \to F(x))$ as a
      premise makes the FOL argument valid [^1][^2].
    references:
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, §33.3 Validity, entailment and satisfiability (fox/vixen example)
        url: https://forallx.openlogicproject.org/html/Ch33.html#S3
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (adding a symbolized property as a premise)
        url: https://forallx.openlogicproject.org/html/Ch35.html
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-s3-fox-vixen
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
