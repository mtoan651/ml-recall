  - id: knowledge-rep-053
    type: single
    difficulty: hard
    tags:
      - backward-chaining
      - variable-binding
      - rule-based-systems
    question: |
      With the same rules and assertions —

      ```text
      P0: IF ?x is ambitious AND ?x is a squib              THEN ?x has a bad term
      P5: IF ?x snogs ?y AND ?x lives in Gryffindor Tower
             AND ?y lives in Slytherin dungeon              THEN ?x has a bad term
      (P1–P4 as before; no other rule concludes "has a bad term")

      A0: Millicent lives in Slytherin dungeon      A1: Millicent is ambitious
      A2: Seamus lives in Gryffindor Tower          A3: Seamus snogs Millicent
      ```

      — what does backward chaining conclude for the hypothesis "Millicent has a bad term"?
    options:
      - text: It fails, because backward chaining cannot use P2 to show that she is ambitious
        why: Ambition is asserted directly (A1); the failure is in the squib and snogging antecedents.
      - text: It succeeds through P5, with ?y bound to Seamus via A3
        why: Matching the consequent binds ?x = Millicent, so the antecedent is "Millicent snogs ?y"; A3 has the roles the other way round.
      - text: It succeeds through P0, because A1 says Millicent is ambitious
        why: P0 is an AND; "Millicent is a squib" is neither asserted nor concluded by any rule.
      - text: It fails; P0 needs a squib, and P5 needs "Millicent snogs ?y"
        correct: true
    explanation: |
      Backward chaining binds variables by matching the hypothesis against a rule's consequent, and
      those bindings carry into the antecedents [^1]. For P5 that gives "Millicent snogs ?y", which no
      assertion matches; A3 would only help prove "Seamus has a bad term". P0 fails on "Millicent is a
      squib", so the hypothesis cannot be shown [^2]. Forward chaining, in contrast, does derive
      "Seamus has a bad term" from P5.
    references:
      - title: 'Wikipedia: Backward chaining'
        url: https://en.wikipedia.org/wiki/Backward_chaining
        locator: Introduction (goal-driven inference)
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 1 Rule Systems, Part B More Backward Chaining
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2009#q1b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
