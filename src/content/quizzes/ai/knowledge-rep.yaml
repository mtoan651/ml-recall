  - id: knowledge-rep-027
    type: single
    difficulty: medium
    tags:
      - cnf
      - de-morgan
      - normal-forms
    question: |
      Rewrite $\lnot(A \land \lnot C) \land (\lnot A \to \lnot B)$ into CNF using the conditional law,
      De Morgan's law and double negation. Which result is equivalent to the original?
    options:
      - text: $(\lnot A \lor C) \land (A \lor \lnot B)$
        correct: true
      - text: $(\lnot A \lor C) \land (\lnot A \lor \lnot B)$
        why: The conditional law turns $\lnot A \to \lnot B$ into $\lnot\lnot A \lor \lnot B$, i.e. $A \lor \lnot B$; the double negation on $A$ was dropped wrongly.
      - text: $(\lnot A \lor \lnot C) \land (A \lor \lnot B)$
        why: De Morgan gives $\lnot A \lor \lnot\lnot C$, and the double negation cancels to $C$, not $\lnot C$.
      - text: $(A \lor C) \land (A \lor \lnot B)$
        why: De Morgan negates each conjunct of $A \land \lnot C$, so the first clause must contain $\lnot A$, not $A$.
    explanation: |
      The book's chain: the conditional law turns $\lnot A \to \lnot B$ into $\lnot\lnot A \lor \lnot B$,
      double negation gives $A \lor \lnot B$, De Morgan turns $\lnot(A \land \lnot C)$ into
      $\lnot A \lor \lnot\lnot C$, and double negation gives $\lnot A \lor C$ [^1]. The result
      $(\lnot A \lor C) \land (A \lor \lnot B)$ is a conjunction of clauses, i.e. in CNF; the book then
      applies distributivity to reach a DNF [^1]. Each step replaces a part by an equivalent part,
      which keeps the whole sentence equivalent [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 47 Proving equivalences, §47.3 Finding equivalent normal forms (worked example)
        url: https://forallx.openlogicproject.org/html/Ch47.html#S3
      - source: forallx-yyc
        locator: Ch. 47 Proving equivalences, §47.1 Substitutability of equivalents
        url: https://forallx.openlogicproject.org/html/Ch47.html#S1
    source:
      id: forallx-yyc
      ref: forallx-yyc-metatheory.tex#ch.proving-equivalences-s3-worked-example
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-metatheory.tex
    status: draft
  - id: knowledge-rep-028
    type: short_answer
    difficulty: hard
    tags:
      - cnf
      - normal-forms
      - truth-tables
    question: |
      The truth-table method for conjunctive normal form writes one clause for each row of the truth
      table on which the sentence is false. How many clauses does it produce for
      $$\lnot(A \lor B) \leftrightarrow ((\lnot C \land \lnot A) \to \lnot B)?$$
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number from 0 to 8
      model: The sentence is true on 3 of the 8 rows and false on 5, so 5 clauses
    explanation: |
      For each row where the sentence is false, the method writes a disjunction of (possibly negated)
      letters that is false on that row only, and conjoins them [^1]. The left side
      $\lnot(A \lor B)$ is true only when $A$ and $B$ are false; then $\lnot B$ is true, so the right
      side is true and the sentence holds (2 rows, $C$ either way). Otherwise the left side is false,
      and the sentence holds only if the right side is false: $\lnot C \land \lnot A$ true and
      $\lnot B$ false, i.e. $A$ false, $B$ true, $C$ false (1 row). So 3 true rows, 5 false rows and
      5 clauses [^2]. Because the table has $2^n$ rows, chains of equivalences usually give shorter
      normal forms [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 45 Normal forms, §45.3 Conjunctive normal form
        url: https://forallx.openlogicproject.org/html/Ch45.html#S3
      - source: forallx-yyc
        locator: Ch. 45 Normal forms, Practice exercises, Part A, item 5
        url: https://forallx.openlogicproject.org/html/Ch45.html#Sx1
      - source: forallx-yyc
        locator: Ch. 47 Proving equivalences, §47.3 Finding equivalent normal forms
        url: https://forallx.openlogicproject.org/html/Ch47.html#S3
    source:
      id: forallx-yyc
      ref: forallx-yyc-metatheory.tex#ch.normal-forms-A5
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-metatheory.tex
    status: draft
  - id: knowledge-rep-029
    type: single
    difficulty: medium
    tags:
      - functional-completeness
      - connectives
    question: |
      A set of connectives is *functionally complete* if every possible truth table is the truth
      table of some sentence that uses only those connectives. Which set is **not** functionally
      complete?
    options:
      - text: $\{\lnot, \land, \lor\}$
        why: 'Complete: the DNF construction writes a sentence with any given truth table using only $\lnot$, $\land$ and $\lor$.'
      - text: $\{\land, \lor, \to\}$
        correct: true
      - text: $\{\lnot, \to\}$
        why: 'Complete: $A \lor B$ is $\lnot A \to B$ and $A \land B$ is $\lnot(A \to \lnot B)$.'
      - text: $\{\uparrow\}$ (NAND)
        why: 'Complete on its own: $\lnot A$ is $A \uparrow A$ and $A \lor B$ is $(A \uparrow A) \uparrow (B \uparrow B)$.'
    explanation: |
      Each of $\land, \lor, \to$ (and $\leftrightarrow$) yields true when both inputs are true, so any
      sentence built only from them is true on the row where every letter is true. No such sentence can
      have the truth table of $\lnot A$, which is false on that row [^1]. With negation added the DNF (or CNF)
      construction expresses every truth table, and NAND or NOR alone already suffices [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 46 Functional completeness, §46.2 Failures of functional completeness
        url: https://forallx.openlogicproject.org/html/Ch46.html#S2
      - source: forallx-yyc
        locator: Ch. 46 Functional completeness (Functional Completeness Theorem) and §46.1 Individually functionally complete connectives
        url: https://forallx.openlogicproject.org/html/Ch46.html#S1
      - title: 'Wikipedia: Functional completeness'
        url: https://en.wikipedia.org/wiki/Functional_completeness
        locator: Introduction
