      ref: forallx-yyc-metatheory.tex#ch.functional-completeness-s2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-metatheory.tex
