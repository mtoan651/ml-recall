    question: |
      With the same rule base —

      ```text
      P1: IF ?x is a businessman                        THEN ?x makes millions
      P2: IF ?x is in the mob                           THEN ?x has low taxes
      P3: IF ?x has low taxes AND ?x makes millions     THEN ?x embezzles money
      P4: IF ?x embezzles money                         THEN ?x is a criminal
      P5: IF ?x knows ?y AND ?x makes millions
             AND ?y is in the mob                       THEN ?x has low taxes, ?x gets out of jail

      Facts: Gotti is in the mob; Cagoni is a businessman; Cagoni knows Gotti
      ```

      — backward chaining cannot prove "Gotti is a criminal". Which single extra fact makes the proof
      go through?
    options:
      - text: Gotti knows Cagoni
        why: That only opens P5 for Gotti, which itself needs "Gotti makes millions" and Cagoni in the mob.
      - text: Gotti is a businessman
        correct: true
      - text: Cagoni is also in the mob
        why: That concerns Cagoni; nothing connects it to Gotti making millions.
      - text: Gotti has low taxes
        why: P2 already proves this from "Gotti is in the mob"; the missing branch is "Gotti makes millions".
    explanation: |
      The goal tree is: criminal ← embezzles money (P4) ← low taxes AND makes millions (P3) [^1].
      Low taxes holds through P2, but "Gotti makes millions" has only one route, P1, which needs
      "Gotti is a businessman" [^2]. Adding that fact completes the AND node, and the proof succeeds.
    references:
      - title: 'Wikipedia: Backward chaining'
        url: https://en.wikipedia.org/wiki/Backward_chaining
        locator: Introduction (goal-driven inference)
      - source: mit-ocw-6034
        locator: Quiz 1 (2007), Question 1, Section 1.1 Backward Chaining
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2007#q1.1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
