  - id: knowledge-rep-045
    type: single
    difficulty: medium
    tags:
      - relations
      - transitivity
      - background-knowledge
    question: |
      Read $R(x,y)$ as "$x$ is older than $y$". The FOL argument $R(r,k),\ R(k,j) \ \therefore\ R(r,j)$
      is invalid, although the English argument is fine. Adding which premise makes the FOL argument
      valid?
    options:
      - text: $\forall x\, \forall y\, \forall z\,((R(x,y) \land R(x,z)) \to R(y,z))$
        why: 'Counter-model on $\{r, k, j\}$: $R$ = $\{\langle r,k\rangle, \langle k,k\rangle, \langle k,j\rangle, \langle j,k\rangle, \langle j,j\rangle\}$ satisfies this premise and both facts, but not $R(r,j)$.'
      - text: $\forall x\, \forall y\,(R(x,y) \to R(y,x))$
        why: 'Counter-model: $R$ = $\{\langle r,k\rangle, \langle k,r\rangle, \langle k,j\rangle, \langle j,k\rangle\}$ is symmetric and contains both facts, but not $\langle r,j\rangle$.'
      - text: $\forall x\, \forall y\, \forall z\,((R(x,y) \land R(y,z)) \to R(x,z))$
        correct: true
      - text: $\forall x\, \forall y\,(R(x,y) \to \lnot R(y,x))$
        why: $R$ = $\{\langle r,k\rangle, \langle k,j\rangle\}$ already satisfies this asymmetry premise and both facts, while $R(r,j)$ is false.
    explanation: |
      The English argument is valid because of a property of "older than", transitivity, which FOL
      does not know unless it is stated [^1]. With the transitivity axiom as a premise, $R(r,k)$ and
      $R(k,j)$ give $R(r,j)$ by instantiating $x, y, z$ as $r, k, j$ [^1]. Knowledge bases encode
      such properties of relations as axioms for the same reason [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (older-than example)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - title: 'Wikipedia: Transitive relation'
        url: https://en.wikipedia.org/wiki/Transitive_relation
        locator: Introduction
