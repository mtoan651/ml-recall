  - id: knowledge-rep-052
    type: single
    difficulty: medium
    tags:
      - backward-chaining
      - goal-tree
      - rule-based-systems
    question: |
      Rules and assertions:

      ```text
      P0: IF ?x is ambitious AND ?x is a squib              THEN ?x has a bad term
      P1: IF ?x lives in Gryffindor Tower                   THEN ?x is a protagonist
      P2: IF ?x lives in Slytherin dungeon                  THEN ?x is a villain, ?x is ambitious
      P3: IF (?x is a protagonist OR ?x is a villain)
             AND ?x is ambitious                            THEN ?x studies a lot
      P4: IF ?x studies a lot AND ?x is a protagonist       THEN ?x becomes Hermione's friend
      P5: IF ?x snogs ?y AND ?x lives in Gryffindor Tower
             AND ?y lives in Slytherin dungeon              THEN ?x has a bad term

      A0: Millicent lives in Slytherin dungeon      A1: Millicent is ambitious
      A2: Seamus lives in Gryffindor Tower          A3: Seamus snogs Millicent
      ```

      You want "Millicent becomes Hermione's friend" to be provable. What is the smallest set of new
      assertions, none of which may match the consequent of a rule?
    options:
      - text: '{Millicent snogs Seamus}'
        why: Snogging only matters for P5 (a bad term); P4 needs her to be a protagonist.
      - text: '{Millicent is a protagonist}'
        why: That matches the consequent of P1, which the task rules out; the underlying fact is where she lives.
      - text: '{Millicent lives in Gryffindor Tower, Millicent studies a lot}'
        why: P3 already derives "studies a lot" (she is a villain and ambitious), and it is a rule consequent anyway.
      - text: '{Millicent lives in Gryffindor Tower}'
        correct: true
    explanation: |
      The goal tree for P4 needs "Millicent studies a lot", which P3 already proves through P2
      (villain) and A1 (ambitious), and "Millicent is a protagonist", which only P1 can give [^1][^2].
      So one assertion suffices: Millicent lives in Gryffindor Tower. It creates an odd world in which
      she lives in both houses and is both a villain and a protagonist; the rules happily allow it,
      because nothing says the houses exclude each other.
    references:
      - title: 'Wikipedia: Backward chaining'
        url: https://en.wikipedia.org/wiki/Backward_chaining
        locator: Introduction (goal-driven inference)
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 1 Rule Systems, Parts A1–A3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
