      - rule-based-systems
      - variable-binding
    question: |
      Rules:

      ```text
      P0: IF (?x is a noob) OR (?x is disenchanted)        THEN ?x visits The Oracle
      P1: IF ?x visits The Oracle                          THEN ?x picks The One
      P2: IF ?x is a noob AND ?x visits The Oracle         THEN The Oracle says ?x is not The One,
                                                                ?x is disenchanted
      P4: IF ?x is disenchanted AND ?x loves ?y            THEN ?x proclaims love for ?y
      P5: IF The Oracle says ?x is not The One
             AND ?y proclaims love for ?x
             AND ?y picks The One                          THEN ?x is The One
      ```

      The assertions are now: Trinity is a noob; Trinity loves Neo; Neo is a noob. Forward chaining
      concludes "Neo is The One" but not "Trinity is The One". Which single extra assertion makes it
      conclude "Trinity is The One" as well?
    options:
      - text: Neo is disenchanted
        why: P2 already derives this for Neo; what is missing is someone who proclaims love for Trinity.
      - text: Neo visits The Oracle
        why: P0 already derives this, and with P1 "Neo picks The One"; the missing antecedent is a proclamation of love for Trinity.
      - text: Neo loves Trinity
        correct: true
      - text: Trinity is disenchanted
        why: P2 already derives this for Trinity; it lets her proclaim love for Neo, not the reverse.
    explanation: |
      P5 with ?x = Trinity needs "The Oracle says Trinity is not The One" (P2 gives it, since she is a
      noob who visits The Oracle), some ?y who proclaims love for Trinity, and that ?y picking The One
      [^1]. Neo picks The One (P0, P1) and is disenchanted (P2), so P4 makes him proclaim love for
      Trinity as soon as "Neo loves Trinity" is asserted [^2].
