  - id: knowledge-rep-030
    type: multiple
    difficulty: medium
    tags:
      - exclusive-or
      - connectives
      - equivalence
    question: |
      Which sentences are true exactly when **one but not both** of $A$ and $B$ is true (exclusive
      or)? Select all that apply.
    options:
      - text: $\lnot(A \leftrightarrow B)$
        correct: true
      - text: $\lnot A \leftrightarrow \lnot B$
        why: 'This is equivalent to $A \leftrightarrow B$: true when $A$ and $B$ have the same value, the opposite of exclusive or.'
      - text: $(A \lor B) \land \lnot(A \land B)$
        correct: true
      - text: $A \leftrightarrow \lnot B$
        correct: true
      - text: $(A \lor B) \land (\lnot A \lor B)$
        why: This is equivalent to $B$ alone, so it is true when $A$ and $B$ are both true.
    explanation: |
      The book symbolizes "you get either soup or salad, but not both" as
      $(A \lor B) \land \lnot(A \land B)$, and its exercise asks for a version with only two
      connectives [^1][^2]. $\lnot(A \leftrightarrow B)$ is one: a biconditional is true when the
      values agree, so its negation is true when they differ; $A \leftrightarrow \lnot B$ says the
      same [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 5 Connectives, §5.3 Disjunction
        url: https://forallx.openlogicproject.org/html/Ch5.html#S3
