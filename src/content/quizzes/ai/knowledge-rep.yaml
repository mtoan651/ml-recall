title: Knowledge Representation & Reasoning
questions:
  - id: knowledge-rep-001
    type: single
    difficulty: easy
    question: 'The top-down approach to creating intelligent systems was based on:'
    options:
      - text: knowledge seeking and reading
      - text: knowledge representation and reasoning
        correct: true
      - text: knowledge reasoning and seeking
    explanation: |
      In the early days of AI the top-down approach was popular: extract knowledge from people into
      a machine-readable form, then use it to solve problems automatically. The lesson says it rested
      on two big ideas, knowledge representation and reasoning [^1]. The introductory lesson puts it
      the same way: symbolic AI depends on representing an expert's knowledge in the computer and on
      modelling reasoning there [^2]. "Seeking" and "reading" knowledge are not part of either
      description.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md
        locator: 'Lesson: Knowledge Representation and Expert Systems, introduction'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#the-top-down-approach
        locator: 'Lesson: Introduction to AI, sec. The Top-Down Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-102/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-002
    type: true_false
    difficulty: easy
    question: Knowledge is the same as information
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      In the DIKW pyramid, data is what is recorded on a physical medium, information is how we
      interpret that data in our head, and knowledge is information integrated into our model of the
      world [^1]. Knowledge comes from an active learning process that links pieces of information,
      for example knowing how a computer works and what it costs, not just recognising the word
      "computer" [^1]. Knowledge therefore sits one level above information; the two are not the same.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
        locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (DIKW pyramid)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-102/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-003
    type: single
    difficulty: easy
    question: |
      In the DIKW (data, information, knowledge, wisdom) pyramid used in symbolic AI, how does
      information become knowledge?
    options:
      - text: Through an active learning process that integrates the information into our model of the world
        correct: true
      - text: By being recorded on a physical medium, such as written text, so that it can be passed between people
      - text: Passively, the moment we read or hear it, without connecting it to anything we already know
      - text: By adding meta-knowledge about how and when the knowledge should be used
    explanation: |
      Knowledge is what we hold in our head as our understanding of the world, and it is obtained by
      an active learning process that integrates the information we receive into our model of the
      world [^1]. Something recorded on a physical medium and passed between people is *data*, the
      bottom level, and merely interpreting what we read or hear gives only *information* [^1].
      Meta-knowledge about how and when to use knowledge is the level above it, *wisdom* [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
        locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (DIKW pyramid)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-102/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-004
    type: single
    difficulty: medium
    question: |
      Knowledge representations can be arranged on a spectrum, from forms that a computer can use
      directly to forms that are very expressive but hard to reason with automatically. Which
      representation sits at the simple end of this spectrum?
    options:
      - text: 'Algorithmic: the knowledge is written directly as a computer program'
        correct: true
      - text: Natural-language text, such as a textbook that explains the domain to people
      - text: Frames with slots, default values and inheritance
    explanation: |
      The simplest representation is algorithmic: the knowledge is encoded as a computer program,
      which a computer can use directly but which is inflexible, because the knowledge in our heads is
      often not algorithmic [^1]. Natural-language text is the other end of the spectrum: the most
      powerful form, but one that cannot be used for automatic reasoning [^1]. Frames sit in between:
      a hierarchical representation in which objects have slots with default values or restrictions,
      organised like classes in object-oriented programming [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
        locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (spectrum)'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#classifying-computer-knowledge-representations
        locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Classifying Computer Knowledge Representations'
    source:
      id: ms-ai-for-beginners
      ref: quiz-202/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-005
    type: single
    difficulty: medium
    question: In knowledge representation, what is a *scenario*?
    options:
      - text: A special kind of frame that represents a complex situation unfolding in time
        correct: true
      - text: An if-then production rule that draws a conclusion when its condition holds
      - text: A list of object-attribute-value triplets that encodes a semantic network
      - text: A Horn clause, the subset of predicate logic used in Prolog
    explanation: |
      Scenarios belong to the hierarchical representations: they are a special kind of frame (an
      object with slots) used for complex situations that can unfold in time [^1]. Production rules
      are procedural representations, object-attribute-value triplets are a way to store a network
      (semantic-net) representation, and Horn clauses are the computable subset of predicate logic
      used by Prolog [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#classifying-computer-knowledge-representations
        locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Classifying Computer Knowledge Representations'
    source:
      id: ms-ai-for-beginners
      ref: quiz-202/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-006
    type: single
    difficulty: medium
    question: How does *forward* inference work in a rule-based expert system?
    options:
      - text: It starts from the facts in working memory and keeps firing rules whose conditions hold, adding conclusions, until the goal is known
        correct: true
      - text: It starts from the goal, picks a rule that concludes it and tries to prove that rule's conditions as sub-goals, asking the user for missing values
      - text: It asks the user for the value of every attribute first and then looks the answer up in a table of all cases
      - text: It adjusts a weight for each rule by gradient descent on solved example cases
    explanation: |
      Forward inference starts with the initial data in working memory and loops: stop if the target
      attribute is present, otherwise collect the rules whose conditions are satisfied (the conflict
      set), pick one by a conflict-resolution strategy, apply it and add the new fact [^1]. Starting
      from the goal and recursively proving the conditions of a rule that concludes it, asking the
      user when no rule applies, is backward inference [^1]. An expert system's knowledge base is
      extracted from human experts rather than learned by gradient descent, and it reasons with rules
      instead of looking answers up in a table [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#forward-vs-backward-inference
        locator: 'Lesson: Knowledge Representation and Expert Systems, secs. Expert Systems and Forward vs. Backward Inference'
    source:
      id: ms-ai-for-beginners
      ref: quiz-202/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-2.json
    status: draft
  - id: knowledge-rep-007
    type: single
    difficulty: medium
    question: $S(n)$ is a statement about positive integers $n$ such that whenever $S(k)$ is true, $S(k + 1)$ must also be true. Furthermore, there exists some positive integer $n_0$ such that $S(n_0)$ is not true. Of the following, which is the strongest conclusion that can be drawn?
    options:
      - text: $S(n_0 + 1)$ is not true.
      - text: $S(n_0 - 1)$ is not true.
      - text: $S(n)$ is not true for any $n \le n_0$.
        correct: true
      - text: $S(n)$ is not true for any $n \ge n_0$.
    explanation: "The hypothesis is the implication $S(k) \\Rightarrow S(k+1)$ for every $k$, which is logically equivalent to its contrapositive $\\neg S(k+1) \\Rightarrow \\neg S(k)$ [^1]. Starting from $\\neg S(n_0)$ and applying the contrapositive again and again gives $\\neg S(n_0 - 1)$, $\\neg S(n_0 - 2)$, and so on down to $n = 1$: the induction 'dominoes' fall backwards [^2]. So $S(n)$ fails for every $n \\le n_0$, which includes the weaker claim about $n_0 - 1$. Nothing follows for $n > n_0$, because a false $S(n_0)$ says nothing about $S(n_0 + 1)$."
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_logic-proofs.html
        locator: Sec. 3.2 Proofs, Proof by Contrapositive
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_seq-induction.html
        locator: Sec. 2.5 Induction
    source:
      id: mmlu-redux
      ref: college_mathematics/12
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=12
    status: draft
  - id: knowledge-rep-008
    type: single
    difficulty: medium
    tags:
      - propositional-logic
      - tautology
      - truth-tables
    question: |
      Which of these sentences of propositional logic is a **tautology**, that is, true on every
      valuation of its sentence letters?
    options:
      - text: $[(A \to B) \to A] \to A$
        correct: true
      - text: $(A \to B) \leftrightarrow (B \to A)$
        why: With $A$ true and $B$ false, $A \to B$ is false but $B \to A$ is true, so the biconditional is false on that row. It is contingent.
      - text: $\lnot(A \land B) \leftrightarrow A$
        why: 'With $A$ and $B$ both true, the left side is false and $A$ is true, so the sentence is false. It is true only when $A$ is true and $B$ false: contingent.'
      - text: $(A \land B) \lor (A \lor B)$
        why: 'With $A$ and $B$ both false, both disjuncts are false. The sentence is true on the other three rows: contingent.'
    explanation: |
      A tautology is a sentence that is true on every valuation, i.e. on every row of its complete
      truth table [^1]. For $[(A \to B) \to A] \to A$ (Peirce's law), the only way to make it false is
      to make $A$ false; but then $A \to B$ is true and $(A \to B) \to A$ is false, so the
      antecedent is false and the whole conditional is true [^2][^4]. Each of the other sentences has
      a falsifying row, and one such row (a one-line partial truth table) is all it takes to show that
      a sentence is *not* a tautology [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.1 Tautologies and contradictions
        url: https://forallx.openlogicproject.org/html/Ch12.html#S1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part E, item 3
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Tautology"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px1
      - title: "Wikipedia: Peirce's law"
        url: https://en.wikipedia.org/wiki/Peirce%27s_law
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-E3
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-009
    type: single
    difficulty: medium
    tags:
      - propositional-logic
      - contradiction
      - truth-tables
    question: Which of these sentences is a **contradiction**, that is, false on every valuation?
    options:
      - text: $\lnot(A \lor A)$
        why: $A \lor A$ is equivalent to $A$, so the sentence is equivalent to $\lnot A$ and is true whenever $A$ is false. It is contingent.
      - text: $[(A \land B) \leftrightarrow B] \to (A \to B)$
        why: 'It is false only when $A$ is true and $B$ false, and true on the other three rows: contingent.'
      - text: $(A \land \lnot A) \to (B \lor C)$
        why: The antecedent $A \land \lnot A$ is false on every row, so the conditional is true on every row. It is a tautology.
      - text: $A \leftrightarrow [A \to (B \land \lnot B)]$
        correct: true
    explanation: |
      A contradiction is false on every valuation [^1]. Since $B \land \lnot B$ is always false,
      $A \to (B \land \lnot B)$ always has the truth value of $\lnot A$, so the sentence behaves like
      $A \leftrightarrow \lnot A$, which no valuation makes true [^2]. Showing that something *is* a
      contradiction needs every row (or an argument covering every row), while one true row is enough
      to show that a sentence is *not* one [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.1 Tautologies and contradictions
        url: https://forallx.openlogicproject.org/html/Ch12.html#S1
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part D, item 5
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Contradictions"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px2
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-D5
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-010
    type: short_answer
    difficulty: hard
    tags:
      - propositional-logic
      - truth-tables
      - biconditional
    question: |
      The sentence $(B \land D) \leftrightarrow [A \leftrightarrow (A \lor C)]$ has four sentence
      letters, so its complete truth table has 16 rows. On how many of those rows is the sentence
      **true**?
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number from 0 to 16
      model: $A \leftrightarrow (A \lor C)$ is equivalent to $C \to A$; the sides agree on $1 \times 3 + 3 \times 1 = 6$ rows
    explanation: |
      Work on the parts first, as the truth-table shortcuts suggest [^2]. If $A$ is true, both sides
      of $A \leftrightarrow (A \lor C)$ are true; if $A$ is false, $A \lor C$ is just $C$, so the
      biconditional is true exactly when $C$ is false. Hence it is equivalent to $C \to A$, true on 3
      of the 4 combinations of $A, C$, while $B \land D$ is true on 1 of the 4 combinations of $B, D$.
      A biconditional is true when its sides agree [^1]: both true on $1 \times 3 = 3$ rows, both false
      on $3 \times 1 = 3$ rows, so 6 rows in total and the sentence is contingent [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 9 Characteristic truth tables (biconditional)
        url: https://forallx.openlogicproject.org/html/Ch9.html
      - source: forallx-yyc
        locator: Ch. 14 Truth table shortcuts, §14.1 Working through truth tables
        url: https://forallx.openlogicproject.org/html/Ch14.html#S1
      - source: forallx-yyc
        locator: Ch. 14 Truth table shortcuts, Practice exercises, Part A, item 9
        url: https://forallx.openlogicproject.org/html/Ch14.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.truth-table-shortcuts-A9
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-011
    type: short_answer
    difficulty: medium
    tags:
      - propositional-logic
      - truth-tables
      - partial-truth-tables
    question: |
      On how many of the 16 rows of its truth table is
      $(A \land B) \to [(A \land C) \lor (B \land D)]$ **false**?
    answer:
      numeric: 1
      tolerance: 0
      hint: a whole number from 0 to 16
      model: 'Only $A, B$ true and $C, D$ false: the antecedent is true and $C \lor D$ is false'
    explanation: |
      A conditional is false only when its antecedent is true and its consequent false [^1]. The
      antecedent $A \land B$ forces $A$ and $B$ to be true; the consequent then reduces to $C \lor D$,
      which is false only when $C$ and $D$ are both false. So exactly one row falsifies the sentence.
      That single row is a one-line partial truth table showing the sentence is not a tautology, and
      any one of the other 15 rows shows it is not a contradiction, so it is contingent [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Tautology"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part D, item 10
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
      - source: forallx-yyc
        locator: Solutions booklet, Ch. 15 Partial truth tables, Part D, item 10
        url: https://forallx.openlogicproject.org/forallxyyc-solutions.pdf
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-D10
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-012
    type: multiple
    difficulty: medium
    tags:
      - propositional-logic
      - satisfiability
      - consistency
    question: |
      Which of these sets of sentences are **jointly satisfiable**, i.e. made true all together by
      at least one valuation? Select all that apply.
    options:
      - text: $\{\lnot(\lnot A \lor B),\ A \to \lnot C,\ A \to (B \to C)\}$
        correct: true
      - text: $\{A \to B,\ B \to C,\ \lnot(A \to C)\}$
        why: $\lnot(A \to C)$ forces $A$ true and $C$ false; then $A \to B$ forces $B$ true and $B \to C$ forces $C$ true. No valuation works.
      - text: $\{A \land (B \lor C),\ \lnot(A \land C),\ \lnot(B \land C)\}$
        correct: true
      - text: $\{A \lor B,\ \lnot B,\ \lnot B \to \lnot A\}$
        why: $\lnot B$ makes $B$ false, $\lnot B \to \lnot A$ then makes $A$ false, and $A \lor B$ is false. No valuation works.
      - text: $\{(A \lor B) \lor C,\ \lnot A \lor \lnot B,\ \lnot C \lor \lnot B\}$
        correct: true
    explanation: |
      Sentences are jointly satisfiable iff some valuation makes all of them true [^1]. One row is
      enough to show satisfiability, while unsatisfiability needs every row [^2]. Witnesses: the set
      containing $\lnot(\lnot A \lor B)$ (which says $A \land \lnot B$) is satisfied by $A$ true and
      $B, C$ false; the set containing $A \land (B \lor C)$ by $A, B$ true and $C$ false; the set
      containing $(A \lor B) \lor C$ by $A, C$ true and $B$ false [^3]. Deciding
      whether a formula is satisfiable is the Boolean satisfiability (SAT) problem, usually posed for
      formulas in conjunctive normal form [^4].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.3 Satisfiability
        url: https://forallx.openlogicproject.org/html/Ch12.html#S3
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Joint satisfiability"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px4
      - source: forallx-yyc
        locator: Ch. 12 Practice exercises, Parts G (item 3) and H (items 3, 5); Ch. 15 Practice exercises, Part B (items 5, 6)
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - title: 'Wikipedia: Boolean satisfiability problem'
        url: https://en.wikipedia.org/wiki/Boolean_satisfiability_problem#Definitions
        locator: Introduction and Definitions (conjunctive normal form)
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-G3
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-013
    type: single
    difficulty: medium
    tags:
      - propositional-logic
      - satisfiability
      - models
    question: |
      Exactly one valuation makes all three sentences
      $A \leftrightarrow (B \lor C)$, $C \to \lnot A$ and $A \to \lnot B$ true. Which one?
    options:
      - text: $A$ true, $B$ false, $C$ true
        why: $C$ and $A$ are both true, so $C \to \lnot A$ is false.
      - text: $A$ true, $B$ true, $C$ false
        why: $A$ and $B$ are both true, so $A \to \lnot B$ is false.
      - text: $A$ false, $B$ true, $C$ false
        why: $B \lor C$ is true while $A$ is false, so $A \leftrightarrow (B \lor C)$ is false.
      - text: $A$ false, $B$ false, $C$ false
        correct: true
    explanation: |
      Suppose $A$ were true. Then $C \to \lnot A$ forces $C$ false and $A \to \lnot B$ forces $B$
      false, so $B \lor C$ is false and $A \leftrightarrow (B \lor C)$ fails. So $A$ must be false, and
      then the biconditional forces $B \lor C$ false, i.e. $B$ and $C$ false. With everything false,
      all three sentences are true, so the set is jointly satisfiable [^1], with exactly this one
      model [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.3 Satisfiability
        url: https://forallx.openlogicproject.org/html/Ch12.html#S3
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part B, item 4
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - source: forallx-yyc
        locator: Solutions booklet, Ch. 12 Part B, item 4 ("jointly satisfiable, see line 8")
        url: https://forallx.openlogicproject.org/forallxyyc-solutions.pdf
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-B4
