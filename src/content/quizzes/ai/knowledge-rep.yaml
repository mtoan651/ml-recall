  - id: knowledge-rep-047
    type: single
    difficulty: hard
    shuffle: false
    question: |
      Resolution theorem proving for showing that a formula of propositional logic is not satisfiable has which of the following properties?

      I. It is *sound*: there is no resolution proof of the unsatisfiability of a satisfiable formula.

      II. It is *complete*: every unsatisfiable formula of propositional logic has a resolution proof of unsatisfiability.

      III. It is *succinct*: whenever an unsatisfiable formula $F$ has a resolution proof, $F$ also has one whose length is polynomial in the length of $F$.
    options:
      - text: I only
      - text: III only
      - text: I and II only
        correct: true
      - text: I and III only
    explanation: 'Resolution is sound — every resolvent follows from its parent clauses, so deriving the empty clause proves unsatisfiability — and refutation-complete: from every unsatisfiable set of clauses the empty clause can be derived [^2]. It is not succinct: Haken (1985) proved that formulas expressing the pigeonhole principle need resolution proofs of exponential length [^3]. This lower bound also limits SAT solvers based on resolution [^1].'
    references:
      - source: mmlu-redux
        locator: college_computer_science row 51
      - title: 'Wikipedia: Resolution (logic)'
