  - id: knowledge-rep-054
    type: multiple
    difficulty: medium
    tags:
      - forward-chaining
      - rule-based-systems
    question: |
      Run forward chaining (fire rules until nothing new can be added) on these rules and
      assertions:

      ```text
      P0: IF ?x is ambitious AND ?x is a squib              THEN ?x has a bad term
      P1: IF ?x lives in Gryffindor Tower                   THEN ?x is a protagonist
      P2: IF ?x lives in Slytherin dungeon                  THEN ?x is a villain, ?x is ambitious
      P3: IF (?x is a protagonist OR ?x is a villain)
             AND ?x is ambitious                            THEN ?x studies a lot
      P4: IF ?x studies a lot AND ?x is a protagonist       THEN ?x becomes Hermione's friend
      P5: IF ?x snogs ?y AND ?x lives in Gryffindor Tower
             AND ?y lives in Slytherin dungeon              THEN ?x has a bad term

      A0: Millicent lives in Slytherin dungeon      A1: Millicent is ambitious
      A2: Seamus lives in Gryffindor Tower          A3: Seamus snogs Millicent
      ```

      Which assertions are added? Select all that apply.
    options:
      - text: Seamus studies a lot
        why: Seamus is a protagonist (P1) but nothing makes him ambitious, which P3 requires.
      - text: Millicent studies a lot
        correct: true
      - text: Millicent becomes Hermione's friend
        why: P4 also needs "Millicent is a protagonist", and only P1 (living in Gryffindor Tower) could add it.
      - text: Millicent is a villain
        correct: true
      - text: Seamus has a bad term
        correct: true
    explanation: |
      Forward chaining starts from the facts and fires every rule whose antecedents are satisfied
      [^1]. P1 adds "Seamus is a protagonist", P2 adds "Millicent is a villain" ("ambitious" is
      already there), P3 then adds "Millicent studies a lot", and P5 matches with ?x = Seamus,
      ?y = Millicent and adds "Seamus has a bad term" [^2]. After that no rule can add anything new.
    references:
      - title: 'Wikipedia: Forward chaining'
        url: https://en.wikipedia.org/wiki/Forward_chaining
        locator: Example
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 1 Rule Systems, Part C Forward Chaining
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
