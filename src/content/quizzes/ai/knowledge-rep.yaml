  - id: knowledge-rep-046
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Two expressions $E$ and $F$ are *unifiable* if some substitution for their variables makes them lexically identical. In the three expressions below, only $w$, $x$, $y$ and $z$ are variables ($1$ is a constant and $f$, $g$ are function symbols).

      I. $f(w, w)$

      II. $f(x, 1)$

      III. $f(y, g(z))$

      Which pairs of these expressions are unifiable?
    options:
      - text: (I, II) only
        why: (I, III) unify too, with $\{w \mapsto g(z),\ y \mapsto g(z)\}$.
      - text: (I, III) only
        why: (I, II) unify too, with $\{w \mapsto 1,\ x \mapsto 1\}$.
      - text: (II, III) only
        why: (II, III) would need the constant $1$ to equal the compound term $g(z)$, which no substitution achieves.
      - text: (I, II) and (I, III) only
        correct: true
    explanation: '(I, II): the arguments give $w = x$ and $w = 1$, solved by $\{w \mapsto 1, x \mapsto 1\}$. (I, III): $w = y$ and $w = g(z)$, solved by $\{w \mapsto g(z), y \mapsto g(z)\}$. (II, III) fails on the second argument, because a constant never unifies with a term built from a different symbol such as $g(z)$ — a symbol clash [^2][^1].'
    references:
      - source: mmlu-redux
        locator: college_computer_science row 31
      - title: 'Wikipedia: Unification (computer science)'
        url: https://en.wikipedia.org/wiki/Unification_(computer_science)
        locator: Syntactic unification of first-order terms (Conflict rule)
