  - id: knowledge-rep-048
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Which of the following conditions can be expressed by a Boolean formula in the Boolean variables $p_1, p_2, p_3, p_4$ using only the connectives $\land$ and $\lor$ (without $\neg$)?

      I. At least three of $p_1, p_2, p_3, p_4$ are true.

      II. Exactly three of $p_1, p_2, p_3, p_4$ are true.

      III. An even number of $p_1, p_2, p_3, p_4$ are true.
    options:
      - text: I only
        correct: true
      - text: II only
      - text: III only
      - text: I and III
    explanation: 'Formulas built from $\land$ and $\lor$ alone define exactly the monotone Boolean functions: switching an input from false to true can never switch the output from true to false [^2]. "At least three" is monotone — it is the $\lor$ over the four triples of the $\land$ of each triple. "Exactly three" is not monotone (making the fourth variable true breaks it), and neither is "an even number" (going from zero true variables to one) [^1].'
    references:
      - source: mmlu-redux
        locator: college_computer_science row 64
      - title: 'Wikipedia: Monotonic function'
        url: https://en.wikipedia.org/wiki/Monotonic_function#In_Boolean_functions
        locator: In Boolean functions
    source:
      id: mmlu-redux
      ref: college_computer_science/64
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_computer_science/test?row=64
