    question: |
      Same rules as before:

      ```text
      P0: IF (?x is a noob) OR (?x is disenchanted)        THEN ?x visits The Oracle
      P1: IF ?x visits The Oracle                          THEN ?x picks The One
      P2: IF ?x is a noob AND ?x visits The Oracle         THEN The Oracle says ?x is not The One,
                                                                ?x is disenchanted
      P3: IF (?x is disenchanted OR ?x is a noob)
             AND The Oracle says ?x is not The One         THEN ?x practices Kung Fu
      P4: IF ?x is disenchanted AND ?x loves ?y            THEN ?x proclaims love for ?y
      P5: IF The Oracle says ?x is not The One
             AND ?y proclaims love for ?x
             AND ?y picks The One                          THEN ?x is The One
      ```

      Assertions: Neo is a noob; Trinity is disenchanted; Trinity loves Neo; Trinity proclaims love
      for Neo. True or false: forward chaining eventually adds "Trinity practices Kung Fu".
    options:
      - text: 'True'
        why: P3 also needs "The Oracle says Trinity is not The One", which only P2 can add, and P2 requires Trinity to be a noob.
      - text: 'False'
        correct: true
    explanation: |
      Forward chaining fires rules until nothing new can be added [^1]. Trinity gets "visits The
      Oracle" (P0) and "picks The One" (P1), but P2 never matches her because she is not a noob, so
      the second antecedent of P3 never appears. Neo, on the other hand, does end up practicing Kung
      Fu and being The One [^2].
