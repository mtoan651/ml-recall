  - id: knowledge-rep-036
    type: multiple
    difficulty: hard
    tags:
      - first-order-logic
      - quantifiers
      - prenex-normal-form
      - equivalence
    question: |
      $F$ and $P$ are one-place predicates and $G(a)$ is a sentence that does not contain $x$. Which
      pairs are logically equivalent? Select all that apply.
    options:
      - text: $\forall x\,(F(x) \to G(a))$ and $\exists x\, F(x) \to G(a)$
        correct: true
      - text: $\forall x\,(F(x) \to G(a))$ and $\forall x\, F(x) \to G(a)$
        why: 'Domain $\{1, 2\}$, $F$ true of 1 only, $G(a)$ false: the left side fails for $x = 1$, while the right side is true because its antecedent is false.'
      - text: $\exists x\,(F(x) \to G(a))$ and $\forall x\, F(x) \to G(a)$
        correct: true
      - text: $\lnot\forall x\, F(x)$ and $\exists x\, \lnot F(x)$
        correct: true
      - text: $\exists x\,(F(x) \land P(x))$ and $\exists x\, F(x) \land \exists x\, P(x)$
        why: 'Domain $\{1, 2\}$, $F$ true of 1 only and $P$ of 2 only: the right side is true, but no single object is both $F$ and $P$.'
    explanation: |
      A quantifier that moves out of the antecedent of a conditional flips: $F(x) \to G(a)$ is
      $\lnot F(x) \lor G(a)$, and $\forall x\, \lnot F(x)$ is $\lnot\exists x\, F(x)$, so
      $\forall x(F(x) \to G(a))$ matches $\exists x\, F(x) \to G(a)$, and dually for $\exists$ [^1][^3].
      $\lnot\forall x\, F(x) \Leftrightarrow \exists x\, \lnot F(x)$ is a conversion-of-quantifiers
      rule [^2]. Applied repeatedly, these "prenexing" equivalences pull every quantifier to the front
      of a sentence, giving prenex normal form [^1][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 38 Conversion of quantifiers, Practice exercises, Part C (prenexing rules)
        url: https://forallx.openlogicproject.org/html/Ch38.html#Sx1
      - source: forallx-yyc
        locator: Ch. 38 Conversion of quantifiers (rules CQ)
        url: https://forallx.openlogicproject.org/html/Ch38.html
      - title: 'Wikipedia: Prenex normal form'
        url: https://en.wikipedia.org/wiki/Prenex_normal_form#Implication
        locator: Conversion to prenex form, Implication
    source:
      id: forallx-yyc
      ref: forallx-yyc-prooffol.tex#ch.conversion-of-quantifiers-C4
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-prooffol.tex
    status: draft
  - id: knowledge-rep-037
    type: single
    difficulty: hard
    tags:
      - first-order-logic
      - validity
      - empty-domain
    question: Which of these first-order sentences is a **validity**, i.e. true in every interpretation?
    options:
      - text: $\forall x\, J(x) \leftrightarrow \exists x\, J(x)$
        why: Domain $\{1, 2\}$ with $J$ true of 1 only makes $\exists x\, J(x)$ true and $\forall x\, J(x)$ false.
      - text: $\exists x\,(G(x) \to \forall y\, M(y))$
        why: A one-object domain where $G$ is true of the object and $M$ is empty makes it false. It is true in other interpretations, so it is contingent.
      - text: $\forall x\,(A(x) \to B(x)) \to \exists x\, B(x)$
        why: If $A$ and $B$ are both empty, $\forall x(A(x) \to B(x))$ is vacuously true and $\exists x\, B(x)$ is false.
      - text: $\forall x\, J(x) \to \exists x\, J(x)$
        correct: true
    explanation: |
      A validity is true in every interpretation [^1]. FOL interpretations always have a non-empty
      domain [^2], so if every object is $J$, at least one object is $J$ and the conditional cannot be
      false. Its converse direction fails, so the biconditional is only contingent [^3]. A universal
      conditional with an empty antecedent predicate is vacuously true, which is why
      $\forall x(A(x) \to B(x))$ does not entail $\exists x\, B(x)$ [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 32 Semantic concepts, §32.1 Validities, entailment, etc.
        url: https://forallx.openlogicproject.org/html/Ch32.html#S1
      - source: forallx-yyc
        locator: Ch. 30 Extensionality, §30.5 Interpretations (a non-empty domain)
        url: https://forallx.openlogicproject.org/html/Ch30.html#S5
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, Practice exercises, Part A (items 4, 6) and Part D (item 1)
        url: https://forallx.openlogicproject.org/html/Ch33.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-A4
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-038
    type: single
    difficulty: medium
    tags:
      - first-order-logic
      - counter-model
      - open-world
    question: |
      The argument $N(a) \land N(b) \land N(c) \ \therefore\ \forall x\, N(x)$ is invalid in
      first-order logic. Which feature of interpretations makes a counter-model possible?
    options:
      - text: The domain may contain objects that none of $a$, $b$, $c$ names
        correct: true
      - text: The names $a$, $b$, $c$ may all refer to the very same object
        why: 'Co-reference alone does not help: if the domain held only named objects, all of them $N$, the conclusion would be true. The counter-model needs an unnamed object outside $N$.'
      - text: The extension of $N$ is allowed to be empty
        why: The premise puts the referents of $a$, $b$, $c$ into the extension of $N$, so it cannot be empty in any model of the premise.
      - text: No finite set of premises entails a universal
        why: 'False in general: $\forall x\,(N(x) \land M(x)) \models \forall x\, N(x)$. What fails here is that the premises only talk about three named objects.'
    explanation: |
      An interpretation specifies a domain and assigns each name some object in it; nothing requires
      every object to have a name [^1]. So domain $\{1, 2, 3, 4\}$ with $a, b, c$ naming 1, 2, 3 and
      $N$ true of 1, 2, 3 makes the premise true and $\forall x\, N(x)$ false [^2]. A knowledge base
      that lists facts about named individuals therefore does not entail generalizations about
      everything. Databases often reason as if the recorded individuals and facts were complete
      (closed-world reasoning), but first-order entailment makes no such assumption: lack of
      knowledge does not imply falsity [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 30 Extensionality, §30.5 Interpretations
        url: https://forallx.openlogicproject.org/html/Ch30.html#S5
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, Practice exercises, Part D, item 4
        url: https://forallx.openlogicproject.org/html/Ch33.html#Sx1
      - title: 'Wikipedia: Closed-world assumption'
        url: https://en.wikipedia.org/wiki/Closed-world_assumption
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-D4
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-039
    type: short_answer
    difficulty: medium
    tags:
      - first-order-logic
      - identity
      - domain-size
    question: |
      How many objects must the domain contain for both of these sentences to be true?
      $$\forall x\, \forall y\, \forall z\,[(x = y \lor y = z) \lor x = z] \qquad \exists x\, \exists y\, \lnot x = y$$
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: 'The first sentence allows at most 2 objects, the second demands at least 2: exactly 2'
    explanation: |
      The identity sign has a fixed meaning: each object is identical to itself and only to itself [^1].
      The first sentence says that among any three choices of objects two are the same, so the domain
      has at most two objects; the second says there are two different objects, so at least two. Both
      are true exactly in two-object domains, which is what shows the pair jointly satisfiable [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 30 Extensionality, §30.5 Interpretations (identity has a fixed meaning)
        url: https://forallx.openlogicproject.org/html/Ch30.html#S5
      - source: forallx-yyc
        locator: Ch. 26 Identity, §26.3–26.5 There are at least / at most / exactly …
        url: https://forallx.openlogicproject.org/html/Ch26.html
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, Practice exercises, Part C, item 12
        url: https://forallx.openlogicproject.org/html/Ch33.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-C12
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-040
    type: single
    difficulty: medium
    tags:
      - first-order-logic
      - validity
      - decidability
    question: |
      In propositional logic a complete truth table decides whether a sentence is a tautology. Why
      is there no analogous table-based test for validity in first-order logic?
    options:
      - text: A sentence has infinitely many interpretations, which cannot be checked one by one
        correct: true
      - text: One counter-interpretation is not enough to show a sentence is not a validity
        why: 'It is enough: one interpretation that makes the sentence false refutes validity. The hard direction is showing truth in *every* interpretation.'
      - text: An FOL sentence can be true in one interpretation and false in another one
        why: Contingent TFL sentences behave the same way across valuations; that is not the obstacle.
      - text: With $n$ predicates a truth table would need $2^n$ rows, too many to write
        why: A $2^n$-row table is finite and would be checkable. The problem is that domains can have any size, even infinite, so there are infinitely many interpretations.
    explanation: |
      A truth table has finitely many rows, but a first-order sentence has infinitely many
      interpretations (domains of every size, with every choice of extensions), so we must reason about
      all of them rather than list them [^1]. Only the "no" answers (not a validity, invalid,
      satisfiable) can be shown with a single interpretation [^1]. Church and Turing proved in 1936
      that no algorithm decides first-order validity in general [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 34 Reasoning about interpretations, §34.1 Validities and contradictions and §34.2 Other cases (summary table)
        url: https://forallx.openlogicproject.org/html/Ch34.html#S2
      - title: 'Wikipedia: Entscheidungsproblem'
        url: https://en.wikipedia.org/wiki/Entscheidungsproblem
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.reasoning-about-interpretations-s2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-041
    type: true_false
    difficulty: medium
    tags:
      - first-order-logic
      - background-knowledge
      - symbolization
    shuffle: false
    question: |
      "Every fox is cute; therefore all vixens are cute" is valid in English, because every vixen is
      necessarily a fox. Its FOL symbolization $\forall x\,(F(x) \to C(x)) \ \therefore\ \forall x\,(V(x) \to C(x))$
      has a counter-model. True or false: that counter-model shows the English argument is invalid.
    options:
      - text: 'True'
        why: The counter-model treats $V$ and $F$ as unrelated, e.g. it contains a $V$ that is not $F$ and not $C$. That case is impossible for the English words, so it says nothing about the English argument.
      - text: 'False'
        correct: true
    explanation: |
      FOL only sees the logical form; it knows nothing about the meanings of "fox" and "vixen", so a
      counter-model can make something a vixen without making it a fox [^1]. The book warns that it
      would be wrong to infer the invalidity of the English argument from such a counter-model; one
      has to argue that the symbolization loses nothing important [^1]. For a knowledge base the
      lesson is that background knowledge must be stated: adding $\forall x\,(V(x) \to F(x))$ as a
      premise makes the FOL argument valid [^1][^2].
    references:
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, §33.3 Validity, entailment and satisfiability (fox/vixen example)
        url: https://forallx.openlogicproject.org/html/Ch33.html#S3
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (adding a symbolized property as a premise)
        url: https://forallx.openlogicproject.org/html/Ch35.html
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-s3-fox-vixen
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-042
    type: single
    difficulty: easy
    tags:
      - first-order-logic
      - expressibility
      - relations
    question: |
      In an interpretation whose domain is people, $W(x)$ means "$x$ is a woman" and $O(x, y)$ means
      "$x$ is an offspring of $y$". Which formula expresses "$x$ is $y$'s mother"?
    options:
      - text: $W(x) \land O(x,y)$
        why: "This says $x$ is a woman who is an offspring of $y$: $x$ is $y$'s daughter."
      - text: $W(y) \land O(y,x)$
        why: "This says $y$ is a woman who is an offspring of $x$: $y$ is $x$'s daughter."
      - text: $W(y) \land O(x,y)$
        why: "This says $x$ is an offspring of the woman $y$: $y$ is $x$'s mother, the roles reversed."
      - text: $W(x) \land O(y,x)$
        correct: true
    explanation: |
      $x$ is $y$'s mother when $y$ is an offspring of $x$, i.e. $O(y,x)$, and $x$ is a woman,
      $W(x)$ [^1][^2]. The order of arguments matters: swapping the variables in $O$ expresses the
      converse relation [^1]. Formulas with free variables like this one define relations that have
      no predicate of their own, the way a knowledge base defines new concepts from primitive ones [^1].
    references:
      - source: forallx-yyc
        locator: Ch. 32 Semantic concepts, §32.2 Expressibility
        url: https://forallx.openlogicproject.org/html/Ch32.html#S2
      - source: forallx-yyc
        locator: Ch. 32 Semantic concepts, Practice exercises, Part A, item 2 (solutions booklet)
        url: https://forallx.openlogicproject.org/html/Ch32.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.semantic-concepts-A2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-043
    type: single
    difficulty: medium
    tags:
      - relations
      - symmetry
      - anti-symmetry
    question: On the domain $\{1, 2, 3\}$, which relation is **both** symmetric and anti-symmetric?
    options:
      - text: $\{\langle 1,2\rangle, \langle 2,1\rangle\}$
        why: Symmetric, but 1 and 2 are different objects related both ways, which anti-symmetry forbids.
      - text: $\{\langle 1,1\rangle, \langle 2,2\rangle\}$
        correct: true
      - text: $\{\langle 1,2\rangle, \langle 2,3\rangle\}$
        why: 'Anti-symmetric, but not symmetric: $\langle 2,1\rangle$ and $\langle 3,2\rangle$ are missing.'
      - text: $\{\langle 1,1\rangle, \langle 1,2\rangle, \langle 2,1\rangle\}$
        why: Symmetric, but the different objects 1 and 2 are related in both directions, so not anti-symmetric.
    explanation: |
      $R$ is symmetric if $R(x,y)$ always brings $R(y,x)$, and anti-symmetric if no two *different*
      objects are related in both directions [^1]. A relation that relates objects only to
      themselves satisfies both: symmetry holds trivially for self-pairs, and anti-symmetry never
      applies. The book's exercise asks for exactly such an interpretation; the solutions booklet uses
      a one-object domain with $\langle 0,0\rangle$ [^2]. In general a relation is both symmetric and
      anti-symmetric only if it is coreflexive (relates objects at most to themselves); note that
      anti-symmetry is weaker than asymmetry, which also forbids $R(x,x)$ [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (definitions of symmetric and anti-symmetric)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations, Practice exercises, Part B (solutions booklet)
        url: https://forallx.openlogicproject.org/html/Ch35.html#Sx1
      - title: 'Wikipedia: Antisymmetric relation'
        url: https://en.wikipedia.org/wiki/Antisymmetric_relation
        locator: Introduction and Properties
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.properties-of-relations-B
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-044
    type: true_false
    difficulty: hard
    tags:
      - relations
      - reflexivity
      - transitivity
    shuffle: false
    question: |
      A relation $R$ is symmetric and transitive, and every object bears $R$ to at least one object
      ($\forall x\, \exists y\, R(x,y)$). True or false: $R$ must be reflexive.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Take any $x$ and some $y$ with $R(x,y)$. Symmetry gives $R(y,x)$, and transitivity applied to $R(x,y)$ and $R(y,x)$ gives $R(x,x)$.
    explanation: |
      By the definitions [^1], for any $x$ pick $y$ with $R(x,y)$; symmetry gives $R(y,x)$ and
      transitivity then gives $R(x,x)$. So a symmetric, transitive relation can fail to be reflexive
      only at objects related to nothing, e.g. $R = \{\langle 1,1\rangle\}$ on $\{1, 2\}$, which is the
      kind of example the book's exercise "transitive, symmetric, but not reflexive" calls for [^2].
      Such relations are called partial equivalence relations; whenever $R(x,y)$ holds, $R(x,x)$ and
      $R(y,y)$ hold too [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (definitions)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations, Practice exercises, Part A, item 3
        url: https://forallx.openlogicproject.org/html/Ch35.html#Sx1
      - title: 'Wikipedia: Partial equivalence relation'
        url: https://en.wikipedia.org/wiki/Partial_equivalence_relation
        locator: Definition and properties (quasi-reflexivity)
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.properties-of-relations-A3
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-045
    type: single
    difficulty: medium
    tags:
      - relations
      - transitivity
      - background-knowledge
    question: |
      Read $R(x,y)$ as "$x$ is older than $y$". The FOL argument $R(r,k),\ R(k,j) \ \therefore\ R(r,j)$
      is invalid, although the English argument is fine. Adding which premise makes the FOL argument
      valid?
    options:
      - text: $\forall x\, \forall y\, \forall z\,((R(x,y) \land R(x,z)) \to R(y,z))$
        why: 'Counter-model on $\{r, k, j\}$: $R$ = $\{\langle r,k\rangle, \langle k,k\rangle, \langle k,j\rangle, \langle j,k\rangle, \langle j,j\rangle\}$ satisfies this premise and both facts, but not $R(r,j)$.'
      - text: $\forall x\, \forall y\,(R(x,y) \to R(y,x))$
        why: 'Counter-model: $R$ = $\{\langle r,k\rangle, \langle k,r\rangle, \langle k,j\rangle, \langle j,k\rangle\}$ is symmetric and contains both facts, but not $\langle r,j\rangle$.'
      - text: $\forall x\, \forall y\, \forall z\,((R(x,y) \land R(y,z)) \to R(x,z))$
        correct: true
      - text: $\forall x\, \forall y\,(R(x,y) \to \lnot R(y,x))$
        why: $R$ = $\{\langle r,k\rangle, \langle k,j\rangle\}$ already satisfies this asymmetry premise and both facts, while $R(r,j)$ is false.
    explanation: |
      The English argument is valid because of a property of "older than", transitivity, which FOL
      does not know unless it is stated [^1]. With the transitivity axiom as a premise, $R(r,k)$ and
      $R(k,j)$ give $R(r,j)$ by instantiating $x, y, z$ as $r, k, j$ [^1]. Knowledge bases encode
      such properties of relations as axioms for the same reason [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (older-than example)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - title: 'Wikipedia: Transitive relation'
        url: https://en.wikipedia.org/wiki/Transitive_relation
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.properties-of-relations-s0-older-than
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
