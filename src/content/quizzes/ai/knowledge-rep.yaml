  - id: knowledge-rep-062
    type: single
    difficulty: medium
    tags:
      - arch-learning
      - near-miss
      - require-link
    question: |
      The model of TABLE LAMP includes "flat base". You want the arch learner to conclude that a
      table lamp *requires* a base. Which example should you show?
    options:
      - text: A positive example with a clamp instead of a flat base
        why: That generalizes the kind of base (climb tree), it does not make the base mandatory.
      - text: A positive example identical to the model except that it has no base
        why: 'A hit without a base teaches the opposite: the base link would be dropped as inessential.'
      - text: A near miss identical to the model except that it has no base
        correct: true
      - text: A near miss with no base that is also 60" tall
        why: With two differences the learner cannot tell which one made it a non-lamp, so it learns nothing reliable.
    explanation: |
      Require link is learned from a near miss that lacks a feature the model has: since that single
      missing feature turned a lamp into a non-lamp, it must be essential [^1]. The teacher's job is to
      choose near misses that differ in exactly one feature, so the learner knows what to blame [^1][^2].
    references:
      - source: mit-ocw-6034
        locator: Lecture 15, Learning — Near Misses, Felicity Conditions (video)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/lecture-15-learning-near-misses-felicity-conditions/
      - source: mit-ocw-6034
        locator: Final exam (2007), Quiz 5 Question 1 Near-Miss, Part B
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2007/
