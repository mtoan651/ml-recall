  - id: knowledge-rep-061
    type: single
    difficulty: easy
    tags:
      - arch-learning
      - near-miss
      - forbid-link
    question: |
      An arch learner's model of a GOOD DOG is: male, Bouvier, intelligent, no exceptional quality.
      The teacher then shows a near miss, labeled bad: male, Bouvier, intelligent, and nasty. What is
      learned?
    options:
      - text: Require link — a good dog must be intelligent
        why: Intelligence is the same in the model and the near miss, so this example says nothing about it.
      - text: Nothing, because negative examples never change the model
        why: Near misses are exactly the negative examples that specialize the model.
      - text: Drop link — the breed does not matter
        why: The breed did not change; only the extra feature "nasty" did.
      - text: Forbid link — a good dog must not be nasty
        correct: true
    explanation: |
      A near miss differs from the model in exactly one respect and is labeled negative, so that
      difference must be what spoils it [^1]. Here the near miss has an extra feature (nasty) that the
      model lacks, so the learner adds a must-not link, forbidding it; a near miss that lacked a
      feature of the model would instead require that feature [^1][^2].
    references:
      - source: mit-ocw-6034
        locator: Lecture 15, Learning — Near Misses, Felicity Conditions (video)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/lecture-15-learning-near-misses-felicity-conditions/
      - source: mit-ocw-6034
        locator: Final exam (2009), Quiz 5 Problem 1, Part A (third example)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_final_2009#q5.1a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
