  - id: knowledge-rep-059
    type: single
    difficulty: medium
    tags:
      - arch-learning
      - near-miss
      - concept-learning
    question: |
      In Winston-style arch learning, the current model of TABLE LAMP is: incandescent bulb, height
      between 11" and 24", flat base, electricity, shade. The teacher now shows a positive example
      (a hit): incandescent bulb, height 11.5", flat base, electricity, and no shade. Which heuristic
      applies?
    options:
      - text: Forbid link — a table lamp must not have a shade
        why: Forbid link is learned from a near miss (a negative example) that has an extra feature; here the example is positive.
      - text: Close interval — the height range is widened
        why: 11.5" already lies inside the range from 11" to 24".
      - text: Drop link — the shade is not essential
        correct: true
      - text: Require link — the shade becomes mandatory
        why: A lamp without a shade was just accepted as a table lamp, so the shade cannot be required.
    explanation: |
      Hits generalize the model and near misses specialize it [^1][^2]. A hit that lacks a feature
      the model has shows that the feature is optional, so its link is dropped; the height 11.5" is
      already covered by the interval, so nothing else changes. Require link and forbid link come
      from near misses: an example that differs from the model in one feature and is labeled
      negative [^1].
    references:
      - source: mit-ocw-6034
        locator: Lecture 15, Learning — Near Misses, Felicity Conditions (video)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/lecture-15-learning-near-misses-felicity-conditions/
      - source: mit-ocw-6034
        locator: Final exam (2007), Quiz 5 Question 1 Near-Miss, Part A (Example 2)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2007/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_final_2007#q5.1a-ex2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2007/
    status: draft
  - id: knowledge-rep-060
    type: single
    difficulty: medium
    tags:
      - arch-learning
      - climb-tree
      - class-hierarchy
    question: |
      A class hierarchy for supports is: support → {base-support, wire-support}; base-support →
      {flat, clamp, legs}; legs → {flat-bottomed legs, wheeled legs}. The model of TABLE LAMP has a
      flat base. A new positive example is identical except that its base is wheeled legs. Using the
      climb-tree heuristic, what does the model's base become?
    options:
      - text: base-support
        correct: true
      - text: legs
        why: Flat bases are not a kind of legs, so legs does not cover the old value.
      - text: wheeled legs
        why: That would forget that flat bases are fine too; a hit can only generalize the model.
      - text: support
        why: Climb tree stops at the lowest class that covers both values; support also admits wire supports, which no example has shown.
    explanation: |
      Climb tree replaces a value by the most specific class in the hierarchy that covers both the
      model's value and the new example's value [^1]. Flat and wheeled legs meet first at
      base-support, so the model now accepts any base support (flat, clamp or legs) but still not a
      wire support [^1][^2].
    references:
      - source: mit-ocw-6034
        locator: Lecture 15, Learning — Near Misses, Felicity Conditions (video)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/lecture-15-learning-near-misses-felicity-conditions/
      - source: mit-ocw-6034
        locator: Final exam (2007), Quiz 5 Question 1 Near-Miss, Part A (Example 5)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2007/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_final_2007#q5.1a-ex5
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2007/
