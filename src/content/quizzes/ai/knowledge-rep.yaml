  - id: knowledge-rep-031
    type: multiple
    difficulty: easy
    tags:
      - first-order-logic
      - interpretations
      - quantifiers
    question: |
      An interpretation has the domain {Corwin, Benedict}. $A(x)$ is true of both of them, $B(x)$
      of Benedict only, and $N(x)$ of no one. Which sentences are true in this interpretation?
      Select all that apply.
    options:
      - text: $\forall x\, A(x)$
        correct: true
      - text: $\exists x\,(A(x) \to N(x))$
        why: Each object is $A$ and no object is $N$, so $A(x) \to N(x)$ is false of both objects and no witness exists.
      - text: $\exists x\,(A(x) \land B(x))$
        correct: true
      - text: $\forall x\, \lnot B(x)$
        why: Benedict is $B$, so not every object satisfies $\lnot B(x)$.
      - text: $\exists x\, B(x) \to \forall x\, A(x)$
        correct: true
    explanation: |
      $\forall x\, \mathcal{A}(x)$ is true iff every object in the domain satisfies $\mathcal{A}(x)$,
      and $\exists x\, \mathcal{A}(x)$ iff at least one does [^1]. Both objects are $A$, so
      $\forall x\, A(x)$ is true; Benedict is $A$ and $B$, a witness for the existential; the
      conditional $\exists x\, B(x) \to \forall x\, A(x)$ has a true consequent, so it is true [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, §31.3 When the main logical operator is a quantifier
        url: https://forallx.openlogicproject.org/html/Ch31.html#S3
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, Practice exercises, Part A (solutions booklet)
        url: https://forallx.openlogicproject.org/html/Ch31.html#Sx1
    source:
