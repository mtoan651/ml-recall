  - id: knowledge-rep-057
    type: single
    difficulty: medium
    tags:
      - forward-chaining
      - consistency
      - rule-based-systems
    question: |
      A detective's rule base:

      ```text
      P1: IF ?x is a businessman                        THEN ?x makes millions
      P2: IF ?x is in the mob                           THEN ?x has low taxes
      P3: IF ?x has low taxes AND ?x makes millions     THEN ?x embezzles money
      P4: IF ?x embezzles money                         THEN ?x is a criminal
      P5: IF ?x knows ?y AND ?x makes millions
             AND ?y is in the mob                       THEN ?x has low taxes, ?x gets out of jail
      P6: IF ?x gets out of jail                        THEN ?x is not a criminal

      Facts: Gotti is in the mob; Cagoni is a businessman; Cagoni knows Gotti
      ```

      Run forward chaining to completion. What problem shows up?
    options:
      - text: It wrongly concludes that Gotti is a criminal
        why: Gotti has low taxes (P2) but nothing says he makes millions, so P3 never fires for him.
      - text: It adds both "Cagoni is a criminal" and "Cagoni is not a criminal"
        correct: true
      - text: P6 never fires, because P4 has already decided that Cagoni is a criminal
        why: Forward chaining does not let one conclusion block another rule; P6 fires as soon as "Cagoni gets out of jail" is present.
      - text: It loops forever, because P5 and P3 keep re-firing each other
        why: A rule fires only when it adds a new assertion; after six additions nothing new can be added and the run stops.
    explanation: |
      Cagoni makes millions (P1); with "Cagoni knows Gotti" and Gotti in the mob, P5 adds his low
      taxes and his release; P3 and P4 make him a criminal, and P6 adds "Cagoni is not a criminal"
      [^1]. The rule system treats the two statements as unrelated strings, so it records a
      contradiction without noticing it; detecting it needs an explicit consistency check or rules
      that retract assertions [^2].
    references:
      - source: mit-ocw-6034
        locator: Quiz 1 (2007), Question 1, Section 1.2 Forward Chaining
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
      - title: 'Wikipedia: Forward chaining'
        url: https://en.wikipedia.org/wiki/Forward_chaining
        locator: Example
    source:
