  - id: knowledge-rep-055
    type: single
    difficulty: hard
    tags:
      - forward-chaining
      - negation-as-failure
      - conflict-resolution
    question: |
      Forward chaining with rule-ordering conflict resolution (each step fires the first rule, in list
      order, that can add something new):

      ```text
      P0: IF ?x has sharp teeth                              THEN ?x is a carnivore
      P1: IF ?x has three horns                              THEN ?x is a Triceratops
      P2: IF ?x is a carnivore AND ?x has big arms           THEN ?x is a Deinonychus
      P3: IF ?x is a carnivore AND ?x hunts ?y               THEN ?x is a TRex
      P4: IF ?x has sharp teeth AND NOT(?x is a Deinonychus)
             AND ?y is a Triceratops                         THEN ?x hunts ?y

      Assertions: Spike has three horns; Fido has sharp teeth; Fido has big arms;
                  Rover has sharp teeth; Spike has flat teeth
      ```

      NOT matches only if no matching assertion is present at that moment. With this order the run
      ends with Fido a Deinonychus and Rover a TRex that hunts Spike. What changes if P4 is moved to
      the front of the list?
    options:
      - text: Rover no longer hunts Spike, because P4 fires before Spike is a Triceratops
        why: P4 cannot match until P1 has added "Spike is a Triceratops"; after that it matches Rover as before.
      - text: Fido hunts Spike before becoming a Deinonychus, so he also becomes a TRex
        correct: true
      - text: Fido is never concluded to be a Deinonychus
        why: P2 still fires for Fido later; the difference is that "Fido hunts Spike" has already been added by then.
      - text: Nothing; forward chaining reaches the same conclusions in any rule order
        why: That holds for monotonic rules, but NOT is checked against the current assertions, so the order of firing matters.
    explanation: |
      In the original order P2 makes Fido a Deinonychus before P4 is ever tried, so the NOT blocks
      Fido and only Rover hunts Spike [^1]. With P4 first, as soon as Spike is a Triceratops, P4 fires
      for Fido (not yet a Deinonychus) and for Rover; P2 then makes Fido a Deinonychus, but the
      assertion "Fido hunts Spike" stays, and P3 makes both carnivores TRexes. Negation as failure
      makes forward chaining non-monotonic, so conflict resolution changes the result [^2].
    references:
      - source: mit-ocw-6034
        locator: Quiz 1 (2008), Problem 1 Rule Systems, Parts A1–A2
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
      - title: 'Wikipedia: Negation as failure'
        url: https://en.wikipedia.org/wiki/Negation_as_failure
        locator: Introduction (non-monotonic reasoning)
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2008#q1a2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
    status: draft
  - id: knowledge-rep-056
    type: single
    difficulty: medium
    tags:
      - backward-chaining
      - rule-based-systems
    question: |
      Rules and assertions:

      ```text
      P0: IF ?x has sharp teeth                              THEN ?x is a carnivore
      P1: IF ?x has three horns                              THEN ?x is a Triceratops
      P2: IF ?x is a carnivore AND ?x has big arms           THEN ?x is a Deinonychus
      P5: IF ?x has three horns OR ?x is a Deinonychus       THEN ?x is dangerous

      Assertions: Spike has three horns; Fido has sharp teeth; Fido has big arms;
                  Rover has sharp teeth; Spike has flat teeth
      ```

      What does backward chaining conclude for "Rover is dangerous", first with these rules and then
      after adding `P6: IF ?x has sharp teeth THEN ?x is a Deinonychus`?
    options:
      - text: Provable before, because P0 shows that Rover is a carnivore
        why: Being a carnivore is not enough; P2 also needs "Rover has big arms", which is missing.
      - text: Not provable before; provable after adding P6
        correct: true
      - text: Not provable either way, because Rover has no big arms
        why: P6 gives a second way to be a Deinonychus that needs only sharp teeth.
      - text: Provable before, but no longer after adding P6
        why: Adding a rule only adds ways to prove things; these rules have no NOT, so nothing can be lost.
    explanation: |
      P5 needs Rover to have three horns or be a Deinonychus [^1]. Without P6 the only route is P2,
      which needs "Rover has big arms" and fails, so the hypothesis is false. With P6 the chainer
      tries P2, fails, then tries P6: "Rover has sharp teeth" is an assertion, so Rover is a
      Deinonychus and therefore dangerous [^2].
    references:
      - title: 'Wikipedia: Backward chaining'
        url: https://en.wikipedia.org/wiki/Backward_chaining
        locator: Introduction (goal-driven inference)
      - source: mit-ocw-6034
