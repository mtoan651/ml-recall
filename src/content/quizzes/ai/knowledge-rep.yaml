  - id: knowledge-rep-049
    type: single
    difficulty: hard
    tags:
      - backward-chaining
      - rule-based-systems
      - goal-tree
    question: |
      A rule system has these rules (`?x`, `?y` are variables) and assertions:

      ```text
      P0: IF (?x is a noob) OR (?x is disenchanted)        THEN ?x visits The Oracle
      P1: IF ?x visits The Oracle                          THEN ?x picks The One
      P2: IF ?x is a noob AND ?x visits The Oracle         THEN The Oracle says ?x is not The One,
                                                                ?x is disenchanted
      P3: IF (?x is disenchanted OR ?x is a noob)
             AND The Oracle says ?x is not The One         THEN ?x practices Kung Fu
      P4: IF ?x is disenchanted AND ?x loves ?y            THEN ?x proclaims love for ?y
      P5: IF The Oracle says ?x is not The One
             AND ?y proclaims love for ?x
             AND ?y picks The One                          THEN ?x is The One

      A0: Neo is a noob            A1: Trinity is disenchanted
      A2: Trinity loves Neo        A3: Trinity proclaims love for Neo
      ```

      A backward chainer checks the assertions first, then tries rules whose consequent matches, in
      order, and evaluates antecedents in order with short-circuiting. What happens with the
      hypothesis "Neo is The One"?
    options:
      - text: It fails, because Trinity is not a noob, so P0 cannot show that she visits The Oracle
        why: P0's antecedent is an OR; "Trinity is disenchanted" (A1) satisfies it.
      - text: It succeeds via P5 with ?y = Trinity, who picks The One since she is disenchanted
        correct: true
      - text: It succeeds directly, because assertion A3 matches the hypothesis
        why: A3 says Trinity proclaims love for Neo; it matches only P5's second antecedent, not the hypothesis.
      - text: It fails, because nothing establishes that Neo picks The One
        why: P5 needs ?y, the one who proclaims love, to pick The One, and ?y is Trinity, not Neo.
    explanation: |
      The goal matches P5 with ?x = Neo [^1][^2]. Its first antecedent comes from P2 (Neo is a noob,
      and P0 shows he visits The Oracle); the second, "?y proclaims love for Neo", matches A3 and binds
      ?y = Trinity; the third, "Trinity picks The One", follows from P1 and P0, because Trinity is
      disenchanted. All three antecedents hold, so the hypothesis is proven.
    references:
      - title: 'Wikipedia: Backward chaining'
        url: https://en.wikipedia.org/wiki/Backward_chaining
        locator: Introduction (goal-driven inference)
      - source: mit-ocw-6034
        locator: Quiz 1 (2010), Problem 1 Rule Systems, Part A Backward Chaining
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2010#q1a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
