  - id: knowledge-rep-032
    type: single
    difficulty: easy
    tags:
      - first-order-logic
      - interpretations
      - quantifiers
    question: |
      The domain is {Lemmy, Courtney, Eddy}. $G(x)$ is true of all three, $H(x)$ of Courtney only,
      and $M(x)$ of Lemmy and Eddy only. Which sentence is **false** in this interpretation?
    options:
      - text: $\forall x\,(H(x) \lor M(x))$
        why: 'Courtney is $H$ and Lemmy and Eddy are $M$, so every object satisfies $H(x) \lor M(x)$: true.'
      - text: $\forall x\,(H(x) \leftrightarrow \lnot M(x))$
        why: 'Every object is exactly one of $H$ and $M$, so the biconditional holds of each: true.'
      - text: $\exists x\, G(x) \land \exists x\, \lnot G(x)$
        correct: true
      - text: $\forall x\, \exists y\,(G(x) \land H(y))$
        why: 'Every $x$ is $G$, and for each $x$ we can pick $y$ = Courtney, who is $H$: true.'
    explanation: |
      The second conjunct $\exists x\, \lnot G(x)$ needs an object that is not $G$, but $G$ is true of
      every object, so the conjunction is false [^1][^2]. In $\forall x\, \exists y\,(G(x) \land H(y))$
      the quantifiers are evaluated from the outside in: for each choice of $x$ we look for some $y$,
      and Courtney serves every time [^1].
    references:
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, §31.3 When the main logical operator is a quantifier
        url: https://forallx.openlogicproject.org/html/Ch31.html#S3
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, Practice exercises, Part B, items 11, 13, 14 and 15
        url: https://forallx.openlogicproject.org/html/Ch31.html#Sx1
