  - id: knowledge-rep-025
    type: multiple
    difficulty: medium
    tags:
      - propositional-logic
      - single-row-test
      - partial-truth-tables
    question: |
      For which of these claims about propositional sentences is a **single valuation** (one row of
      a truth table, chosen well) enough to establish the claim? Select all that apply.
    options:
      - text: A given sentence is not a tautology
        correct: true
      - text: Two given sentences are logically equivalent
        why: Equivalence says the sentences agree on every valuation, so every row must be checked; one row can only refute it.
      - text: Some given sentences are jointly satisfiable
        correct: true
      - text: Some given sentences are jointly unsatisfiable
        why: Unsatisfiability says no valuation makes them all true, which needs every row (on each row, at least one sentence is false).
      - text: A given argument is invalid
        correct: true
    explanation: |
      Claims of the form "there is a valuation such that …" need just one witness row: a row making
      the sentence false (not a tautology), a row making all the sentences true (satisfiable), or a row
      making the premises true and the conclusion false (invalid) [^1]. Claims about *every* valuation
      (tautology, contradiction, equivalence, unsatisfiability, validity, entailment) need the complete
      table [^1][^2].
    references:
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, summary table (complete vs. one-line partial)
        url: https://forallx.openlogicproject.org/html/Ch15.html
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraphs "Joint satisfiability" and "Validity and entailment"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px4
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-summary-table
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
