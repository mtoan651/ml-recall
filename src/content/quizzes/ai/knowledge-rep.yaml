  - id: knowledge-rep-014
    type: short_answer
    difficulty: medium
    tags:
      - propositional-logic
      - satisfiability
      - entailment
    question: |
      How many of the 8 valuations of $A$, $B$, $C$ make all three of $A \lor B$, $A \to C$ and
      $B \to C$ true?
    answer:
      numeric: 3
      tolerance: 0
      hint: a whole number from 0 to 8
      model: $C$ must be true (both cases of $A \lor B$ lead to $C$); then any of the 3 rows with $A \lor B$ true works
    explanation: |
      Whichever of $A$, $B$ is true, the matching conditional makes $C$ true, so every satisfying
      valuation has $C$ true. With $C$ true both conditionals hold, and only $A \lor B$ constrains
      the rest: 3 of the 4 combinations of $A, B$. So the set is jointly satisfiable [^1][^2]. Because
      $C$ is true in every model of the set, the set entails $C$ (reasoning by cases), and adding
      $\lnot C$ makes it unsatisfiable [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.3 Satisfiability
        url: https://forallx.openlogicproject.org/html/Ch12.html#S3
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part B, item 2
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part G, items 3 and 4
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-B2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-015
    type: single
    difficulty: medium
    tags:
      - entailment
      - satisfiability
      - refutation
      - resolution
    question: |
      A knowledge base is a set of sentences $KB = \{P_1, \dots, P_n\}$ and $\alpha$ is a query.
      Which condition is equivalent to $KB \models \alpha$ ($KB$ entails $\alpha$)?
    options:
      - text: The set $KB \cup \{\alpha\}$ is jointly satisfiable
        why: That only says $\alpha$ is consistent with the KB. For example $\{A\} \cup \{B\}$ is satisfiable, but $A \not\models B$.
      - text: The set $KB \cup \{\lnot\alpha\}$ is jointly satisfiable
        why: A valuation that makes the KB true and $\alpha$ false is exactly a counterexample, so this condition means the entailment fails.
      - text: The set $KB \cup \{\lnot\alpha\}$ is jointly unsatisfiable
        correct: true
      - text: The sentence $\alpha \to (P_1 \land \dots \land P_n)$ is a tautology
        why: This says that $\alpha$ entails the KB, the converse direction. The KB entails $\alpha$ iff $(P_1 \land \dots \land P_n) \to \alpha$ is a tautology.
    explanation: |
      $KB \models \alpha$ means that no valuation (or, in first-order logic, no interpretation) makes
      every sentence of the KB true and $\alpha$ false [^1]. Such a valuation would be exactly one that
      makes all of $KB \cup \{\lnot\alpha\}$ true; the book records this: a counter-interpretation to an
      argument shows that the premises together with the negated conclusion are jointly satisfiable [^2].
      So entailment reduces to unsatisfiability, which is how resolution provers answer queries: they
      add the negated query to the KB in clause form and try to derive the empty clause [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.4 Entailment and validity
        url: https://forallx.openlogicproject.org/html/Ch12.html#S4
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, §33.3 Validity, entailment and satisfiability (box after the third example)
        url: https://forallx.openlogicproject.org/html/Ch33.html#S3
      - title: 'Wikipedia: Resolution (logic)'
        url: https://en.wikipedia.org/wiki/Resolution_(logic)#A_resolution_technique
        locator: A resolution technique
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-s3-counter-interpretation
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
    status: draft
  - id: knowledge-rep-016
    type: single
    difficulty: easy
    tags:
      - propositional-logic
      - validity
      - arguments
    question: |
      Which of these arguments is **valid**, i.e. has no valuation that makes all premises true and
      the conclusion false? ($\therefore$ marks the conclusion.)
    options:
      - text: $A \lor B,\ B \lor C,\ \lnot A \ \therefore\ B \land C$
        why: $A$ false, $B$ true, $C$ false makes all three premises true and $B \land C$ false.
      - text: $A \lor B,\ B \lor C,\ \lnot B \ \therefore\ A \land C$
        correct: true
      - text: $A \to B,\ \lnot A \ \therefore\ \lnot B$
        why: 'This is denying the antecedent: $A$ false and $B$ true make both premises true and $\lnot B$ false.'
      - text: $A \to B,\ A \to C \ \therefore\ B \to C$
        why: $A$ false, $B$ true, $C$ false makes both conditionals true (false antecedent) and $B \to C$ false.
    explanation: |
      An argument is valid iff no valuation makes all its premises true and its conclusion false [^1].
      In the valid one, $\lnot B$ makes $B$ false, so $A \lor B$ forces $A$ true and $B \lor C$ forces
      $C$ true, and the conclusion $A \land C$ must hold [^2]. Each other argument has a "bad" row
      with true premises and a false conclusion, and one such row is enough to show invalidity [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.4 Entailment and validity
        url: https://forallx.openlogicproject.org/html/Ch12.html#S4
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Parts C (item 4), I (item 3) and J (items 2, 3)
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Validity and entailment"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px5
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-J2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-017
    type: multiple
    difficulty: hard
    tags:
      - propositional-logic
      - validity
      - monotonicity
    question: Which of these arguments are valid? Select all that apply.
    options:
      - text: $A \land B,\ \lnot A \to \lnot C,\ B \to \lnot D \ \therefore\ A \lor B$
        correct: true
      - text: $A \to B \ \therefore\ (A \land B) \lor (\lnot A \land \lnot B)$
        why: $A$ false and $B$ true make $A \to B$ true, but neither disjunct of the conclusion is true.
      - text: $A \to B,\ \lnot B \lor A \ \therefore\ A \leftrightarrow B$
        correct: true
      - text: $\lnot(\lnot A \lor \lnot B),\ A \to \lnot C \ \therefore\ A \to (B \to C)$
        why: The first premise says $A \land B$. With $A, B$ true and $C$ false both premises are true, but $A \to (B \to C)$ is false.
      - text: $A \lor B,\ A \to B,\ B \to A \ \therefore\ A \land B$
        correct: true
    explanation: |
      Validity means no valuation makes the premises true and the conclusion false [^1]. The premise
      $A \land B$ alone guarantees $A \lor B$; the two extra premises cannot spoil that, because adding
      premises never destroys an entailment (monotonicity) [^3]. The premise $\lnot B \lor A$ is
      equivalent to $B \to A$, and with $A \to B$ it gives $A \leftrightarrow B$. In the argument with
      conclusion $A \land B$, the two conditionals give $A$ and $B$ the same value and $A \lor B$ makes
      one of them true, so both are [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.4 Entailment and validity
        url: https://forallx.openlogicproject.org/html/Ch12.html#S4
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part H (items 4, 6, 8, 9) and Part I (item 5)
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
      - title: 'Wikipedia: Monotonicity of entailment'
        url: https://en.wikipedia.org/wiki/Monotonicity_of_entailment
        locator: Introduction and Non-monotonic logics
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-H8
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-018
    type: single
    difficulty: medium
    tags:
      - entailment
      - conditional
      - deduction-theorem
    question: |
      For sentences $P$, $Q$ and $R$, the entailment $P, Q \models R$ holds exactly when which
      sentence is a tautology?
    options:
      - text: $(P \lor Q) \to R$
        why: 'Too strong: it needs $R$ whenever just one premise is true. $A, B \models A \land B$ holds, but $(A \lor B) \to (A \land B)$ is not a tautology.'
      - text: $R \to (P \land Q)$
        why: This is the converse, $R \models P \land Q$. $A, B \models A \lor B$ holds, but $(A \lor B) \to (A \land B)$ is not a tautology.
      - text: $(P \land Q) \to R$
        correct: true
      - text: $(P \land Q) \land R$
        why: This would require all three sentences to be true on every valuation; $A, B \models A$ holds although $(A \land B) \land A$ is not a tautology.
    explanation: |
      $\mathcal{A} \models \mathcal{C}$ holds iff no valuation makes $\mathcal{A}$ true and
      $\mathcal{C}$ false, and that is exactly when $\mathcal{A} \to \mathcal{C}$ is false on no
      valuation, i.e. a tautology [^1]. A valuation makes both $P$ and $Q$ true iff it makes $P \land Q$
      true, so $P, Q \models R$ iff $(P \land Q) \to R$ is a tautology; the book's exercise uses the same
      link: if $(P \land Q) \to R$ is not a tautology, the argument $P, Q \therefore R$ is invalid [^2].
      Keep the levels apart: $\to$ is a connective inside the language, $\models$ is a claim about
      sentences [^1]; the proof-theoretic counterpart is the deduction theorem [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.6 '⊨' versus '→'
        url: https://forallx.openlogicproject.org/html/Ch12.html#S6
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part K, item 2
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - title: 'Wikipedia: Deduction theorem'
        url: https://en.wikipedia.org/wiki/Deduction_theorem
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-K2
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-019
    type: true_false
    difficulty: medium
    tags:
      - entailment
      - double-turnstile
      - open-world
    shuffle: false
    question: |
      True or false: for any sentences $P$ and $Q$, if $P \not\models Q$ ($P$ does not entail $Q$),
      then $P \models \lnot Q$.
    options:
      - text: 'True'
        why: $P \not\models Q$ only says that *some* valuation makes $P$ true and $Q$ false. Another valuation may make $P$ and $Q$ both true, and then $P \not\models \lnot Q$ either. For two sentence letters, $P$ entails neither $Q$ nor $\lnot Q$.
      - text: 'False'
        correct: true
    explanation: |
      $P \not\models Q$ means there is at least one valuation that makes $P$ true and $Q$ false; it does
      not say that every valuation making $P$ true makes $Q$ false [^1]. The book's example is two
      sentence letters: $P \not\models Q$ and also $P \not\models \lnot Q$ [^1]. In knowledge
      representation terms, a knowledge base may settle neither a query nor its negation; that a
      sentence is not entailed does not make it false, which is the open-world reading of a KB [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.5 The double turnstile
        url: https://forallx.openlogicproject.org/html/Ch12.html#S5
      - title: 'Wikipedia: Closed-world assumption'
        url: https://en.wikipedia.org/wiki/Closed-world_assumption
        locator: Introduction (closed- vs. open-world assumption)
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-s5-slashed-turnstile
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-020
    type: short_answer
    difficulty: hard
    tags:
      - propositional-logic
      - validity
      - counterexample
    question: |
      Consider the argument with five sentence letters
      $$A \to C,\quad E \to (D \lor B),\quad B \to \lnot D \quad \therefore \quad (A \lor C) \lor (B \to (E \land D))$$
      How many of the 32 valuations make all three premises true and the conclusion false?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number from 0 to 32
      model: $A, C, D$ false and $B$ true are forced; $E$ can be either, so 2 valuations
    explanation: |
      Start from the conclusion, the shortcut for validity tests [^1]. The conclusion is false only if
      $A$ and $C$ are false and $B \to (E \land D)$ is false, i.e. $B$ true and $E \land D$ false. The
      premise $B \to \lnot D$ then forces $D$ false, which already makes $E \land D$ false; $A \to C$
      holds because $A$ is false, and $E \to (D \lor B)$ holds because $B$ is true. So $E$ is free and
      there are 2 counterexample valuations; either one alone shows the argument invalid [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 14 Truth table shortcuts, §14.2 Testing for validity and entailment
        url: https://forallx.openlogicproject.org/html/Ch14.html#S2
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, paragraph "Validity and entailment"
        url: https://forallx.openlogicproject.org/html/Ch15.html#S0.SS0.SSS0.Px5
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part I, item 3
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.partial-truth-tables-I3
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-021
    type: true_false
    difficulty: medium
    tags:
      - validity
      - satisfiability
      - explosion
    shuffle: false
    question: |
      True or false: if the premises of an argument are jointly unsatisfiable, the argument is valid
      whatever its conclusion is. (For example: $\lnot(A \land B),\ A \lor B,\ A \leftrightarrow B \ \therefore\ C$.)
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: An argument is invalid only if some valuation makes all premises true and the conclusion false. If no valuation makes the premises all true, no such valuation exists, whatever the conclusion says.
    explanation: |
      Validity fails only on a row where every premise is true and the conclusion false [^1]. In the
      example, $A \leftrightarrow B$ gives $A$ and $B$ the same value, $A \lor B$ then makes both true,
      and that contradicts $\lnot(A \land B)$; no row makes the premises true, so the argument is valid
      although $C$ is unrelated [^2]. This is the principle of explosion, and it is why an inconsistent
      knowledge base is useless: it entails every query [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.4 Entailment and validity
        url: https://forallx.openlogicproject.org/html/Ch12.html#S4
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part J, item 5 and Part K, item 4
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - title: 'Wikipedia: Principle of explosion'
        url: https://en.wikipedia.org/wiki/Principle_of_explosion
        locator: Introduction
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-J5
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-022
    type: multiple
    difficulty: medium
    tags:
      - propositional-logic
      - equivalence
    question: |
      Which of these pairs of sentences are logically equivalent (same truth value on every
      valuation)? Select all that apply.
    options:
      - text: $A \to B$ and $\lnot B \to \lnot A$
        correct: true
      - text: $\lnot(A \to B)$ and $\lnot A \to \lnot B$
        why: With $A$ and $B$ both true, $\lnot(A \to B)$ is false but $\lnot A \to \lnot B$ is true.
      - text: $A \lor B$ and $\lnot A \to B$
        correct: true
      - text: $(A \to B) \to C$ and $A \to (B \to C)$
        why: With $A$ false, $B$ true and $C$ false, the first is false ($T \to F$) and the second is true (false antecedent). The conditional is not associative.
      - text: $(A \leftrightarrow B) \leftrightarrow C$ and $A \leftrightarrow (B \leftrightarrow C)$
        correct: true
    explanation: |
      Two sentences are equivalent iff no valuation gives them different truth values [^1]. $A \to B$
      and its contrapositive $\lnot B \to \lnot A$ are both false exactly when $A$ is true and $B$
      false, and $\lnot A \to B$ is false exactly when $A$ and $B$ are both false, like $A \lor B$ [^2].
      The biconditional is associative: both bracketings are true exactly when an even number of
      $A, B, C$ are false, whereas the conditional is not associative [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, §12.2 Equivalence
        url: https://forallx.openlogicproject.org/html/Ch12.html#S2
      - source: forallx-yyc
        locator: Ch. 12 Semantic concepts, Practice exercises, Part F, items 2, 3 and 4
        url: https://forallx.openlogicproject.org/html/Ch12.html#Sx1
      - source: forallx-yyc
        locator: Ch. 11 Complete truth tables, Practice exercises, Part B, items 4 and 5
        url: https://forallx.openlogicproject.org/html/Ch11.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-truthtables.tex#ch.semantic-concepts-F3
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-truthtables.tex
    status: draft
  - id: knowledge-rep-023
    type: single
    difficulty: easy
    tags:
      - propositional-logic
      - equivalence
      - conditional
    question: Which sentence is logically equivalent to $A \to B$?
    options:
      - text: $A \lor \lnot B$
        why: This is equivalent to $B \to A$. With $A$ false and $B$ true it is false, while $A \to B$ is true.
      - text: $B \to A$
        why: This is the converse. With $A$ true and $B$ false, $A \to B$ is false but $B \to A$ is true.
      - text: $\lnot A \to \lnot B$
        why: This is the inverse, equivalent to the converse $B \to A$; it is true when $A$ is true and $B$ false, where $A \to B$ is false.
      - text: $\lnot A \lor B$
        correct: true
    explanation: |
      $A \to B$ is false only when $A$ is true and $B$ false, and so is $\lnot A \lor B$; this is the
      law $(P \to Q) \Leftrightarrow (\lnot P \lor Q)$ in the book's table of basic equivalences [^1].
      It is the first step when a sentence is rewritten into conjunctive normal form: every
      $P \to Q$ is replaced by $\lnot P \lor Q$ [^2][^3]. The book's exercise contrasts $A \to B$ with
      $A \lor \lnot B$, which differs on the row $A$ false, $B$ true [^4].
    references:
      - source: forallx-yyc
        locator: Ch. 47 Proving equivalences, §47.2 Chains of equivalences (Table "Basic equivalences", Cond)
        url: https://forallx.openlogicproject.org/html/Ch47.html#S2
      - source: forallx-yyc
        locator: Ch. 47 Proving equivalences, §47.3 Finding equivalent normal forms
        url: https://forallx.openlogicproject.org/html/Ch47.html#S3
      - title: 'Wikipedia: Conjunctive normal form'
        url: https://en.wikipedia.org/wiki/Conjunctive_normal_form#Converting_from_first-order_logic
        locator: Converting from first-order logic (eliminate implications)
      - source: forallx-yyc
        locator: Ch. 15 Partial truth tables, Practice exercises, Part A, item 4
        url: https://forallx.openlogicproject.org/html/Ch15.html#Sx1
