  - id: knowledge-rep-033
    type: multiple
    difficulty: medium
    tags:
      - first-order-logic
      - interpretations
      - quantifier-order
    question: |
      The domain is $\{1, 2, 3, 4, 5\}$ and the two-place predicate $R(x, y)$ is true of exactly
      these ordered pairs: $\langle 1,1\rangle$, $\langle 1,2\rangle$, $\langle 1,3\rangle$, $\langle 1,4\rangle$,
      $\langle 1,5\rangle$, $\langle 2,5\rangle$, $\langle 4,1\rangle$ and $\langle 5,5\rangle$.
      Which sentences are true? Select all that apply.
    options:
      - text: $\exists x\, \forall y\, R(x,y)$
        correct: true
      - text: $\exists x\, \forall y\, R(y,x)$
        why: 'No object has every object bearing $R$ to it: object 3 bears $R$ to nothing, so every candidate fails at $y = 3$.'
      - text: $\exists x\, \forall y\, \lnot R(x,y)$
        correct: true
      - text: $\forall x\, \exists y\, R(x,y)$
        why: Object 3 bears $R$ to nothing, so it has no $y$ with $R(3, y)$.
      - text: $\forall x\,(\exists y\, R(x,y) \to \exists y\, R(y,x))$
        correct: true
    explanation: |
      Object 1 bears $R$ to every object, so $\exists x \forall y\, R(x,y)$ is true with witness 1, and
      object 3 bears $R$ to nothing, so $\exists x \forall y\, \lnot R(x,y)$ is true with witness 3 [^1].
      The same object 3 makes $\forall x \exists y\, R(x,y)$ false. The last sentence holds because
      every object with an outgoing pair (1, 2, 4, 5) also has an incoming one, and 3 satisfies the
      conditional vacuously [^2].
    references:
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, §31.3 When the main logical operator is a quantifier
        url: https://forallx.openlogicproject.org/html/Ch31.html#S3
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, Practice exercises, Part C, items 3, 4, 7 and 8 (solutions booklet)
        url: https://forallx.openlogicproject.org/html/Ch31.html#Sx1
