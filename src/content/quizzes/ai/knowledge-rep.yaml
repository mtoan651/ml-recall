  - id: knowledge-rep-034
    type: single
    difficulty: medium
    tags:
      - first-order-logic
      - transitivity
      - relations
    question: |
      Let $R$ on the domain $\{1,2,3,4,5\}$ hold of exactly
      $\langle 1,1\rangle$, $\langle 1,2\rangle$, $\langle 1,3\rangle$, $\langle 1,4\rangle$,
      $\langle 1,5\rangle$, $\langle 2,5\rangle$, $\langle 4,1\rangle$ and $\langle 5,5\rangle$.
      The relation is not transitive. Which triple
      $(x, y, z)$ shows this, with $R(x,y)$ and $R(y,z)$ true but $R(x,z)$ false?
    options:
      - text: $x = 4,\ y = 1,\ z = 2$
        correct: true
      - text: $x = 1,\ y = 2,\ z = 5$
        why: $R(1,5)$ is in the list, so transitivity is respected for this triple.
      - text: $x = 2,\ y = 5,\ z = 5$
        why: $R(2,5)$ is in the list, so this triple does not break transitivity.
      - text: $x = 1,\ y = 4,\ z = 1$
        why: $R(1,1)$ is in the list, so this triple does not break transitivity.
    explanation: |
      $R$ is transitive iff $\forall x \forall y \forall z((R(x,y) \land R(y,z)) \to R(x,z))$ holds
      [^1]. A counterexample needs a two-step path without the shortcut: $4 \to 1 \to 2$ uses
      $R(4,1)$ and $R(1,2)$, but $\langle 4,2\rangle$ is not in the list. The solutions booklet marks
      the transitivity sentence false in this interpretation [^2]; the other triples with
      $x = 4, y = 1$ ($z = 3, 4, 5$) are counterexamples too.
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (definition of transitivity)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - source: forallx-yyc
        locator: Ch. 31 Truth in FOL, Practice exercises, Part C, item 5 (solutions booklet)
        url: https://forallx.openlogicproject.org/html/Ch31.html#Sx1
