  - id: knowledge-rep-026
    type: single
    difficulty: medium
    tags:
      - cnf
      - normal-forms
      - equivalence
    question: |
      Which sentence is in **conjunctive normal form** (CNF) *and* logically equivalent to
      $\lnot(A \leftrightarrow B)$?
    options:
      - text: $(A \land \lnot B) \lor (\lnot A \land B)$
        why: 'It is equivalent, but it is a disjunction of conjunctions: disjunctive normal form, not CNF.'
      - text: $(A \lor \lnot B) \land (\lnot A \lor B)$
        why: It is in CNF, but it is equivalent to $A \leftrightarrow B$, not to its negation.
      - text: $(A \lor B) \land \lnot(A \land B)$
        why: 'It is equivalent, but not in CNF: the negation applies to a conjunction instead of a single sentence letter.'
      - text: $(A \lor B) \land (\lnot A \lor \lnot B)$
        correct: true
    explanation: |
      A sentence is in CNF when it uses only $\lnot, \land, \lor$, every $\lnot$ applies directly to a
      sentence letter, and no $\land$ occurs inside a $\lor$: a conjunction of clauses [^1]. The
      truth-table method writes one clause for each row where the sentence is false;
      $\lnot(A \leftrightarrow B)$ is false when $A, B$ are both true (clause $\lnot A \lor \lnot B$) and when
      both are false (clause $A \lor B$) [^1][^2]. CNF is the canonical form for SAT problems, and
      resolution provers treat a CNF sentence as a set of clauses [^3][^4].
    references:
      - source: forallx-yyc
        locator: Ch. 45 Normal forms, §45.3 Conjunctive normal form
        url: https://forallx.openlogicproject.org/html/Ch45.html#S3
      - source: forallx-yyc
        locator: Solutions booklet, Ch. 45 Normal forms, Part A, item 2
        url: https://forallx.openlogicproject.org/forallxyyc-solutions.pdf
      - title: 'Wikipedia: Conjunctive normal form'
        url: https://en.wikipedia.org/wiki/Conjunctive_normal_form#First-order_logic
        locator: Definition and First-order logic (clause sets for resolution)
      - title: 'Wikipedia: Boolean satisfiability problem'
        url: https://en.wikipedia.org/wiki/Boolean_satisfiability_problem#Conjunctive_normal_form_2
        locator: Special instances of 3SAT, Conjunctive normal form
