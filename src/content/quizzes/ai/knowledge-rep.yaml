  - id: knowledge-rep-044
    type: true_false
    difficulty: hard
    tags:
      - relations
      - reflexivity
      - transitivity
    shuffle: false
    question: |
      A relation $R$ is symmetric and transitive, and every object bears $R$ to at least one object
      ($\forall x\, \exists y\, R(x,y)$). True or false: $R$ must be reflexive.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Take any $x$ and some $y$ with $R(x,y)$. Symmetry gives $R(y,x)$, and transitivity applied to $R(x,y)$ and $R(y,x)$ gives $R(x,x)$.
    explanation: |
      By the definitions [^1], for any $x$ pick $y$ with $R(x,y)$; symmetry gives $R(y,x)$ and
      transitivity then gives $R(x,x)$. So a symmetric, transitive relation can fail to be reflexive
      only at objects related to nothing, e.g. $R = \{\langle 1,1\rangle\}$ on $\{1, 2\}$, which is the
      kind of example the book's exercise "transitive, symmetric, but not reflexive" calls for [^2].
      Such relations are called partial equivalence relations; whenever $R(x,y)$ holds, $R(x,x)$ and
      $R(y,y)$ hold too [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations (definitions)
        url: https://forallx.openlogicproject.org/html/Ch35.html
      - source: forallx-yyc
        locator: Ch. 35 Properties of relations, Practice exercises, Part A, item 3
        url: https://forallx.openlogicproject.org/html/Ch35.html#Sx1
      - title: 'Wikipedia: Partial equivalence relation'
        url: https://en.wikipedia.org/wiki/Partial_equivalence_relation
        locator: Definition and properties (quasi-reflexivity)
    source:
