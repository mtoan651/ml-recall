title: Knowledge Representation & Reasoning
questions:
  - id: knowledge-rep-001
    type: single
    difficulty: easy
    question: 'The top-down approach to creating intelligent systems was based on:'
    options:
      - text: knowledge seeking and reading
      - text: knowledge representation and reasoning
        correct: true
      - text: knowledge reasoning and seeking
    explanation: |
      In the early days of AI the top-down approach was popular: extract knowledge from people into
      a machine-readable form, then use it to solve problems automatically. The lesson says it rested
      on two big ideas, knowledge representation and reasoning [^1]. The introductory lesson puts it
      the same way: symbolic AI depends on representing an expert's knowledge in the computer and on
      modelling reasoning there [^2]. "Seeking" and "reading" knowledge are not part of either
      description.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md
        locator: 'Lesson: Knowledge Representation and Expert Systems, introduction'
