  - id: knowledge-rep-039
    type: short_answer
    difficulty: medium
    tags:
      - first-order-logic
      - identity
      - domain-size
    question: |
      How many objects must the domain contain for both of these sentences to be true?
      $$\forall x\, \forall y\, \forall z\,[(x = y \lor y = z) \lor x = z] \qquad \exists x\, \exists y\, \lnot x = y$$
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: 'The first sentence allows at most 2 objects, the second demands at least 2: exactly 2'
    explanation: |
      The identity sign has a fixed meaning: each object is identical to itself and only to itself [^1].
      The first sentence says that among any three choices of objects two are the same, so the domain
      has at most two objects; the second says there are two different objects, so at least two. Both
      are true exactly in two-object domains, which is what shows the pair jointly satisfiable [^2][^3].
    references:
      - source: forallx-yyc
        locator: Ch. 30 Extensionality, §30.5 Interpretations (identity has a fixed meaning)
        url: https://forallx.openlogicproject.org/html/Ch30.html#S5
      - source: forallx-yyc
        locator: Ch. 26 Identity, §26.3–26.5 There are at least / at most / exactly …
        url: https://forallx.openlogicproject.org/html/Ch26.html
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, Practice exercises, Part C, item 12
        url: https://forallx.openlogicproject.org/html/Ch33.html#Sx1
    source:
      id: forallx-yyc
      ref: forallx-yyc-interpretations.tex#ch.using-interpretations-C12
      url: https://github.com/rzach/forallx-yyc/blob/63c92e8cf4bc0714e4b53e38dbf7b6c7d00fccd0/forallx-yyc-interpretations.tex
