  - id: knowledge-rep-035
    type: single
    difficulty: medium
    tags:
      - first-order-logic
      - quantifier-order
      - entailment
    question: |
      $L(x, y)$ is a two-place predicate. Which of these entailments holds in first-order logic,
      i.e. every interpretation that makes the left side true also makes the right side true?
    options:
      - text: $\forall x\, \exists y\, L(x,y) \models \exists y\, \forall x\, L(x,y)$
        why: 'Counter-model: Karl loves Imre, Imre loves Juan, Juan loves Karl. Everyone loves someone, but no one is loved by everyone.'
      - text: $\forall x\, \exists y\, L(x,y) \models \forall x\, \exists y\, L(y,x)$
        why: 'Counter-model: domain $\{1, 2\}$ with $L$ true of $\langle 1,2\rangle$ and $\langle 2,2\rangle$; everyone bears $L$ to something, but nothing bears $L$ to 1.'
      - text: $\exists y\, \forall x\, L(x,y) \models \forall x\, \exists y\, L(x,y)$
        correct: true
      - text: $\forall x\, \exists y\, L(x,y) \models \exists x\, L(x,x)$
        why: 'Counter-model: domain $\{1, 2\}$ with $L$ true of $\langle 1,2\rangle$ and $\langle 2,1\rangle$ only.'
    explanation: |
      If some single $y$ is loved by every $x$, then every $x$ loves something, namely that $y$, so
      the $\exists\forall$ sentence entails the $\forall\exists$ one [^1]. The converse is the
      quantifier shift fallacy: in the book's love triangle each person loves someone, but no one is
      loved by all [^2]. A single counter-interpretation suffices to refute an entailment [^3].
    references:
      - source: forallx-yyc
        locator: Ch. 32 Semantic concepts, §32.1 Validities, entailment, etc.
        url: https://forallx.openlogicproject.org/html/Ch32.html#S1
      - source: forallx-yyc
        locator: Ch. 25 Multiple generality, §25.3 The order of quantifiers
        url: https://forallx.openlogicproject.org/html/Ch25.html#S3
      - source: forallx-yyc
        locator: Ch. 33 Using interpretations, §33.3 and Practice exercises, Part B, items 8 and 9
        url: https://forallx.openlogicproject.org/html/Ch33.html#S3
