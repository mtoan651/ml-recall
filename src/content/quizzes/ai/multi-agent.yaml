  - id: multi-agent-025
    type: true_false
    difficulty: medium
    tags:
      - game-theory
      - correlated-equilibrium
      - dominated-strategies
    shuffle: false
    question: |
      In a correlated equilibrium a mediator draws a joint action and privately recommends each player
      their part; no player can gain by deviating after seeing their recommendation. True or false: in
      a correlated equilibrium, a player never plays a strictly dominated action with positive
      probability.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: If a dominated action were ever recommended, the player could replace it by the dominating action whenever it is recommended and strictly gain, which the equilibrium condition forbids [^1].
    explanation: |
      The correlated-equilibrium condition must hold for every way of remapping recommendations [^2].
      Remap the dominated action $a_i'$ to the action $a_i^\ast$ that dominates it and leave all others
      alone: whenever $a_i'$ is recommended, the player now earns strictly more, whatever the others do,
      so a positive probability on $a_i'$ would make this deviation profitable [^1]. Coarse correlated
      equilibria only guard against committing to one action in advance, and they can put weight on
      dominated actions [^1].
    references:
      - source: mit-ocw-6s890
        locator: Homework 1 reference solution, Problem 5.1
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
      - title: 'Wikipedia: Correlated equilibrium'
        locator: Formal definition
        url: https://en.wikipedia.org/wiki/Correlated_equilibrium
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset1#p5.1
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-026
    type: short_answer
    difficulty: hard
    tags:
      - game-theory
      - coarse-correlated-equilibrium
      - dominated-strategies
    question: |
      In a two-player game, player 1 has these payoffs (player 2 always gets 0):

      | | left | right |
      | --- | --- | --- |
      | top | 6 | 0 |
      | middle | 0 | 6 |
      | bottom | 2 | 8 |

      A joint distribution $\mu$ puts probability $\tfrac12$ on (top, left) and $\tfrac12$ on (middle, right),
      so player 1 earns 6 on average. If player 1 instead commits in advance to one fixed action while
      player 2 keeps following $\mu$, what is the best expected payoff player 1 can get?
    answer:
      numeric: 5
      tolerance: 0.001
      hint: a number
      model: 'top: $\tfrac12(6) + \tfrac12(0) = 3$; middle: $3$; bottom: $\tfrac12(2) + \tfrac12(8) = 5$; best is 5'
    explanation: |
      Against player 2's marginal (left or right with probability $\tfrac12$) the fixed actions earn 3, 3 and
      5, all below 6, so $\mu$ is a coarse correlated equilibrium [^1]. Yet middle is strictly dominated
      by bottom ($2 > 0$ and $8 > 6$) and is played half the time. $\mu$ is not a correlated equilibrium:
      a player told "middle" knows player 2 plays right and gains by switching to bottom, $8 > 6$ [^1][^2].
      No-regret learners converge to the larger set of coarse correlated equilibria, which can contain
      such outcomes.
    references:
      - source: mit-ocw-6s890
        locator: Homework 1 reference solution, Problem 5.2
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
      - title: 'Wikipedia: Correlated equilibrium'
        locator: Formal definition
        url: https://en.wikipedia.org/wiki/Correlated_equilibrium
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset1#p5.2
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-027
    type: true_false
    difficulty: hard
    tags:
      - game-theory
      - zero-sum
      - coarse-correlated-equilibrium
      - nash-equilibrium
    shuffle: false
    question: |
      In a two-player zero-sum game, take any coarse correlated equilibrium $\mu$ (a distribution over
      joint actions from which no player gains by committing to a fixed action in advance) and form
      its marginal strategies $x_1$ and $x_2$. True or false: $(x_1, x_2)$ is always a Nash equilibrium.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: In zero-sum games the two players' no-deviation conditions combine into a chain of inequalities showing that each marginal is a best response to the other [^1].
    explanation: |
      Because $u_1 = -u_2$, player 1's coarse-equilibrium condition bounds player 2's payoff from below
      and player 2's bounds it from above; combining them shows that each marginal strategy is a best
      response to the other [^1]. This fails in general-sum games. It matters for learning: no-regret
      algorithms such as multiplicative weights reach approximate coarse correlated equilibria on
      average, so in zero-sum games their average strategies approach a Nash equilibrium [^1][^2].
    references:
      - source: mit-ocw-6s890
        locator: Homework 1 reference solution, Problem 4.2
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
      - title: 'Wikipedia: Multiplicative weight update method'
        locator: Applications — Solving zero-sum games approximately (Oracle algorithm)
        url: https://en.wikipedia.org/wiki/Multiplicative_weight_update_method
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset1#p4.2
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-028
    type: true_false
    difficulty: hard
    tags:
      - game-theory
      - nash-equilibrium
      - computation
    shuffle: false
    question: |
      True or false: every finite game whose payoffs are all rational numbers has a Nash equilibrium in
      which every player's mixed strategy uses only rational probabilities.
    options:
      - text: 'True'
        why: This holds for two-player games, but there is a three-player game with rational payoffs whose only Nash equilibrium involves $\sqrt{601}$ [^1].
      - text: 'False'
        correct: true
    explanation: |
      For two players, finding a Nash equilibrium reduces to a linear complementarity problem, which
      always has a rational solution when the payoffs are rational [^1]. With three players the
      indifference conditions become polynomial: in the MIT 6.S890 homework example (each player has
      two actions) the unique equilibrium has $z = (\sqrt{601} - 23)/4 \approx 0.379$ and similar
      irrational values for the others [^1]. The hard part is guessing which actions are in the
      support; once it is known, the equilibrium solves a system of polynomial equations.
    references:
      - source: mit-ocw-6s890
        locator: Homework 1 reference solution, Problems 3.1–3.2
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    source:
      id: mit-ocw-6s890
