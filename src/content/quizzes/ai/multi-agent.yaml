schema_version: 1
domain: ai
topic: multi-agent
title: Multi-Agent Systems
questions:
  - id: multi-agent-001
    type: single
    difficulty: easy
    question: 'An agent is:'
    options:
      - text: an entity that lives alone
      - text: an entity that lives in an environment
        correct: true
      - text: an entity that is intelligent
    explanation: |
      Multi-agent systems define an agent as an entity that lives in some environment, which it can
      perceive and act upon [^1]. The definition is deliberately broad. Agents usually share their
      environment with other agents, so they do not live alone, and they need not be intelligent:
      simple reactive agents with request-response behaviour count too [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
        locator: 'Lesson: Multi-Agent Systems, introduction (definition and types of agents)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-223/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-23.json
    status: draft
  - id: multi-agent-002
    type: single
    difficulty: easy
    question: 'Reactive agents usually have:'
    options:
      - text: simple request-response behavior
        correct: true
      - text: complex, planning-based behavior
      - text: no behavior at all
    explanation: |
      Classified by their ability to reason, reactive agents usually have simple request-response
      behaviour, while deliberative agents use logical reasoning or planning [^1]. Complex planning
      and reasoning is the mark of cognitive agents, not reactive ones [^1]. Even passive agents,
      which have no goals of their own, still react to external stimuli, so "no behaviour" fits no
      type of agent [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
        locator: 'Lesson: Multi-Agent Systems, introduction (types of agents)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-223/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-23.json
    status: draft
  - id: multi-agent-003
    type: single
    difficulty: easy
    question: |
      Choose the option that fits best when comparing different types of multi-agent environments.

      - Your agents aim to maximize common benefits in ____ environments
      - Your agents aim to maximize common benefits while minimizing the opponent's in ____ environments
    options:
      - text: competitive, cooperative
        why: You maximize common benefit in cooperative, while in competitive you also aim to reduce opponent's score
      - text: cooperative, competitive
        correct: true
    explanation: |
      In cooperative environments agents must maximise a common benefit, like warehouse robots
      working together to load and unload packages as fast as possible [^1]. In competitive
      (adversarial) environments each agent maximises its own benefit by minimising the opponent's,
      as in tennis [^1]. Environments can also mix both, as in 2-vs-2 soccer, where teammates
      cooperate to beat the other team [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/introduction-to-marl#different-types-of-multi-agent-environments
        locator: Unit 7, An introduction to Multi-Agents Reinforcement Learning (MARL), sec. Different types of multi-agent environments
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q1
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-004
    type: multiple
    difficulty: medium
    question: Which of the following statements are true about `decentralized` learning?
    options:
      - text: Each agent is trained independently from the others
        correct: true
      - text: Inputs from other agents are just considered environment data
        correct: true
      - text: Considering other agents part of the environment makes the environment stationary
        why: In decentralized learning, agents ignore the existence of other agents and consider them part of the environment. However, this means the environment is in constant change, becoming non-stationary.
    explanation: |
      In decentralized learning each agent is trained independently, as if it were alone, and treats
      the other agents as part of the environment dynamics rather than as agents [^1]. The catch is
      that those other agents keep learning and changing, so the underlying MDP shifts over time: the
      environment becomes non-stationary, not stationary [^1]. Many RL algorithms then cannot
      guarantee convergence to a global optimum [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/multi-agent-setting#decentralized-system
        locator: Unit 7, Designing Multi-Agents systems, sec. Decentralized system
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-005
    type: multiple
    difficulty: medium
    question: Which of the following statements are true about `centralized` learning?
    options:
      - text: It learns one common policy based on the learnings from all agents' interactions
        correct: true
      - text: The reward is global
        correct: true
      - text: The environment with this approach is stationary
        correct: true
    explanation: |
      In the centralized approach a high-level process gathers all agents' experiences in a shared
      buffer and learns one common policy from them [^1]. The policy takes the current state of the
      environment and outputs joint actions, and the reward is global [^1]. Because the agents are
      treated as one larger entity and each knows how the others' policy changes (it is the same
      policy), the environment is stationary, unlike in decentralized learning [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/multi-agent-setting#centralized-approach
        locator: Unit 7, Designing Multi-Agents systems, sec. Centralized approach
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q3
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-006
    type: short_answer
    difficulty: easy
    question: |
      Complete the definition. In {{1}}, an agent in an adversarial game trains against former
      copies of its own {{2}} as opponents. The opponent is therefore always at about the agent's
      level, and it is replaced by a more recent copy as the agent improves.
    answer:
      blanks:
        - accept:
            - self-play
          hint: name of the approach
        - accept:
            - policy
            - policies
            - model
          hint: one word
    explanation: |
      An opponent that is far stronger teaches the agent nothing, and one that is far weaker teaches
      it habits that fail against better players, so the ideal opponent is at the agent's own level
      [^1]. Self-play gets this by starting from a copy of the agent and periodically swapping in a
      newer copy of the training policy as the agent gets better [^1]. The idea goes back to Arthur
      Samuel's checkers program and Tesauro's TD-Gammon, and ML-Agents exposes hyperparameters that
      trade training stability against overfitting to a narrow pool of opponents [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/self-play#what-is-self-play
        locator: Unit 7, Self-Play, secs. What is Self-Play? and Self-Play in MLAgents
        quote: In self-play, the agent uses former copies of itself (of its policy) as an opponent.
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q4
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-007
    type: multiple
    difficulty: medium
    question: What are the main motivations to use an Elo rating score?
    options:
      - text: The score takes into account the difference in skill between you and your opponent
        correct: true
      - text: Although more points can be exchanged depending on the result of the match and given the levels of the agents, the sum is always the same
        correct: true
      - text: It's easy for an agent to keep a high score rate
        why: 'That is called the `Rating deflation`: keeping a high rate requires much skill over time'
      - text: It works well calculating the individual contributions of each player in a team
        why: ELO uses the score achieved by the whole team, but individual contributions are not calculated
    explanation: |
      Elo measures relative skill. The expected score $E_A = 1/\left(1+10^{(R_B-R_A)/400}\right)$
      depends on the rating gap, and the update $R_A + K(S_A - E_A)$ means a favourite who wins gains
      only a few points while an upset transfers many [^1]. It is also zero-sum: the winner takes
      points from the loser, so more points move after an unexpected result but the total stays the
      same [^1]. Keeping a high rating is in fact hard (rating deflation), and in team games Elo uses
      the team average without measuring each player's contribution [^1].
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/self-play#the-elo-score-to-evaluate-our-agent
        locator: Unit 7, Self-Play, secs. The ELO Score to evaluate our agent, Example, The Advantages, The Disadvantages
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q6
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-008
    type: single
    difficulty: medium
    question: |
      In self-play, the agent trains against a pool of saved snapshots of its own past policy.
      Implementations such as Unity ML-Agents let you tune how many snapshots the pool keeps, how
      often a new snapshot is saved and how often the opponent is swapped. What trade-off do these
      settings control?
    options:
      - text: 'Stability versus generality: a small, slowly changing pool trains more stably, but the agent may overfit to those few opponents'
        correct: true
      - text: 'Speed versus memory: a larger pool only costs more storage, while the learned policy stays exactly the same'
        why: The pool decides which opponents the agent faces, so it changes what the policy learns, not just how much is stored.
      - text: 'Exploration versus exploitation: a larger pool makes the agent itself take more random actions in each game'
        why: Opponent diversity is not the agent's own action randomness; exploration comes from the agent's policy, not from the opponent pool.
      - text: 'Reward versus penalty: swapping the opponent more often raises the reward the agent receives for each win'
        why: The reward function is set by the environment. Swapping opponents changes who the agent plays, not what a win is worth.
    explanation: |
      The self-play settings trade the skill level and generality of the final policy against the
      stability of learning [^1]. Training against slowly changing or unchanging opponents with low
      diversity is more stable, but if they change too slowly the agent overfits to them [^1]. A
      larger pool keeps policies from earlier in training, so it holds a wider diversity of
      behaviours, and saving snapshots further apart gives opponents that cover a wider range of
      skill levels [^1]. The pool only decides who the agent plays: it is not the agent's own
      exploration, and it does not change the reward function.
    references:
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/self-play#self-play-in-mlagents
        locator: Unit 7, Self-Play, sec. Self-Play in MLAgents
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q5
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-009
    type: single
    difficulty: easy
    question: |
      In a flocking simulation, each bird only sees its near neighbours and follows three rules:
      alignment, cohesion and separation. What does the realistic flock that appears show about
      multi-agent systems?
    options:
      - text: Complex group behaviour can emerge from simple agents following local rules, with no central controller
        correct: true
      - text: A flock needs a leader bird that computes the path for all the others
      - text: Each bird must reason about and plan the movement of the whole flock, so the agents are deliberative ones
      - text: Simple agents can only ever produce simple, easily predictable system behaviour
    explanation: |
      The emergent (synergetic) approach rests on the idea that the combined behaviour of many simple
      agents can produce more complex behaviour of the system as a whole [^1]. In flocking, each bird
      only observes birds within a short distance and steers by alignment, cohesion and separation, yet
      the flock moves as if it followed a collective algorithm [^1]. No bird leads or plans: these are
      reactive agents, whereas deliberative agents reason and plan their actions [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md#flocking
        locator: 'Lesson: Multi-Agent Systems, introduction and secs. Flocking and Deliberative Agents'
    source:
      id: ms-ai-for-beginners
      ref: quiz-123/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-23.json
    status: draft
  - id: multi-agent-010
    type: multiple
    difficulty: easy
    question: Which of these are typical applications of multi-agent systems? Select all that apply.
    options:
      - text: Controlling the non-player characters of a computer game
        correct: true
      - text: Rendering film scenes with large crowds
        correct: true
      - text: Simulating how a disease spreads through a population
        correct: true
      - text: Solving a system of linear equations exactly
      - text: Compressing a photo into a JPEG file
    explanation: |
      Multi-agent systems are used in games, where non-player characters act as intelligent agents; in
      video production, where crowd scenes are rendered by multi-agent simulation; in systems modelling,
      e.g. simulating the spread of COVID-19 or city traffic; and in automation, where each device acts
      as an independent agent [^1]. Solving linear equations and compressing an image are single,
      fixed computations with no interacting agents.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
        locator: 'Lesson: Multi-Agent Systems, introduction (applications)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-223/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-23.json
    status: draft
  - id: multi-agent-011
    type: single
    difficulty: easy
    tags:
      - multi-agent-design
      - specialization
      - coordination
    question: Which scenario is the strongest fit for a multi-agent system?
    options:
      - text: A refund process whose fraud, payment and compliance checks each need their own tools and must be coordinated
        correct: true
      - text: A support bot that answers common questions from one knowledge base, using a small set of tools
        why: One set of instructions and tools covers it, so a single agent is simpler to test and operate [^2].
      - text: The same simple classification request, arriving many thousands of times per hour from different users
        why: High volume of identical requests is a scaling concern; you can run more copies of one agent [^2].
      - text: A chatbot that must always reply in the user's own language, which can be any one of three supported languages
        why: Answering in several languages is a capability of one model; it needs no specialist roles or handoffs.
    explanation: |
      Multiple agents pay off when a task has distinct specialist roles with their own tools or
      permissions and clear handoffs that need coordination, as in the refund process [^1][^2].
      Specialization keeps each agent focused, and the system becomes more modular and easier to scale
      and maintain than one monolithic agent [^1]. Simple or merely high-volume tasks are usually better
      served by a single agent [^2].
    references:
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 08: Multi-agent design patterns, Scenarios Where Multi-Agents Are Applicable; Scenario: Refund process'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/README.md#scenarios-where-multi-agents-are-applicable
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 08: Knowledge Check Answers, Question 1'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/solution/solution-quiz.md
    source:
      id: ms-ai-agents-for-beginners
      ref: 08-multi-agent#q1
      url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/README.md#knowledge-checks
    status: draft
  - id: multi-agent-012
    type: single
    difficulty: easy
    tags:
      - single-agent
      - multi-agent-design
    question: When is a single agent usually the better choice than several agents?
    options:
      - text: When the agent needs access to more than one tool
        why: One agent can use many tools; several tools alone do not call for several agents [^1].
      - text: When the workflow needs separate roles with different permissions and independent audit trails
        why: Separate roles, permissions and audit requirements are exactly what can justify a multi-agent design [^1].
      - text: When one set of instructions and tools can handle the task, without specialist handoffs
        correct: true
      - text: When one failing step must not bring down the rest of the system
        why: Fault tolerance (other agents keep working if one fails) is listed as an advantage of multiple agents [^2].
    explanation: |
      A single agent is easier to test, observe and operate, so it is the default whenever one set of
      instructions and tools covers the task [^1]. Multiple agents add value through specialization,
      scalability and fault tolerance, and when roles need separate permissions and audit trails [^1][^2].
    references:
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 08: Knowledge Check Answers, Question 2'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/solution/solution-quiz.md
      - source: ms-ai-agents-for-beginners
        locator: 'Lesson 08: Multi-agent design patterns, Advantages of Using Multi-Agents Over a Singular Agent'
        url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/README.md#advantages-of-using-multi-agents-over-a-singular-agent
    source:
      id: ms-ai-agents-for-beginners
      ref: 08-multi-agent#q2
      url: https://github.com/microsoft/ai-agents-for-beginners/blob/ff2ba665e088bf51d9959126c5893e089b50da30/08-multi-agent/README.md#knowledge-checks
    status: draft
  - id: multi-agent-013
    type: single
    difficulty: medium
    tags:
      - alpha-beta
      - iterative-deepening
      - game-search
    question: |
      Alpha-beta search normally explores a game tree depth-first down to a fixed depth and applies a
      static evaluator there. Which statement is correct?
    options:
      - text: It returns the correct minimax value only if it searches down to the end of the game
        why: Minimax and alpha-beta work with any depth limit; the static evaluator scores the positions at the cutoff.
      - text: It can be run breadth-first, level by level, with the same pruning and the same result
        why: A cutoff needs the finished minimax value of an earlier sibling subtree, which a level-by-level search does not have yet.
      - text: With progressive deepening most of the time goes into repeating the shallow searches
        why: With a branching factor $b$, the last level holds about a fraction $(b-1)/b$ of all nodes, so the repeated work is small.
      - text: Progressive deepening works and returns the minimax value for each depth
        correct: true
    explanation: |
      Progressive deepening simply runs the depth-limited alpha-beta search again with a larger
      limit, so each run returns the exact minimax value for its depth, and a move is always ready
      when time runs out [^1][^2]. Alpha-beta itself depends on depth-first order: it prunes a node
      only after the values of its earlier siblings' subtrees are known [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 1.1 Games
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Improvements_over_naive_minimax
        locator: Improvements over naive minimax (iterative deepening, move ordering)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q1.1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: draft
  - id: multi-agent-014
    type: short_answer
    difficulty: medium
    tags:
      - alpha-beta
      - move-ordering
      - minimax
    question: |
      A MAX root has three moves L, M, R, each leading to a MIN node with two leaves (values for
      MAX): L → (2, 3), M → (1, 2), R → (4, 6). Run alpha-beta, but examine every node's children
      from right to left (R first, and the right leaf of each MIN node first). How many leaves are
      never examined?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: R gives 4 (both leaves), then M's 2 and L's 3 are each ≤ 4, cutting off M's 1 and L's 2.
    explanation: |
      The minimax value is 4 (move R). Examined right to left, R's leaves 6 and 4 give 4 first; under
      M the leaf 2 is already ≤ 4, so MIN would pick at most 2 and the leaf 1 is pruned; under L the
      leaf 3 ≤ 4 prunes the leaf 2 [^1]. Left to right only one leaf (M's 2) would be pruned: alpha-
      beta prunes most when the best moves are examined first [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 6 Game Search, part 4
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Improvements_over_naive_minimax
        locator: Improvements over naive minimax (move ordering)
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q6-sp04
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    status: draft
  - id: multi-agent-015
    type: short_answer
    difficulty: easy
    tags:
      - minimax
      - game-tree
    question: |
      In the game tree below, MAX chooses at A and the levels alternate MAX/MIN as labeled; the
      numbers are static values of the leaves. What is the minimax value of A?
    figure:
      src: ./multi-agent/multi-agent-015.svg
      alt: 'Game tree: A (MAX) has children B, C, D (MIN). B: E, F=7. C: G, H=3, I. D: J=4, K. E: L=5, M. G: N, O=7. I: P=6, Q. K: R, S=6. M: T=2, U=10. N: V=4, W=9. Q: X=2, Y=8. R: Z=7, Omega=3.'
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: B = min(E = 5, F = 7) = 5, C = min(G = 7, H = 3, I = 6) = 3, D = min(J = 4, K = 6) = 4, so A = 5 (move B).
    explanation: |
      Back up the values from the leaves: M = min(2, 10) = 2 and E = max(5, 2) = 5; N = 4, G = 7,
      Q = 2, I = 6; R = 3 and K = 6 [^1]. Then B = min(5, 7) = 5, C = min(7, 3, 6) = 3,
      D = min(4, 6) = 4, and MAX takes B for a value of 5 [^2].
    references:
      - title: 'Wikipedia: Minimax'
        url: https://en.wikipedia.org/wiki/Minimax#Minimax_algorithm_with_alternate_moves
        locator: Minimax algorithm with alternate moves
      - source: mit-ocw-6034
        locator: Quiz 2 (2008), Problem 1 Games, Part A
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2008/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz2_2008#q1a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2008/
    status: draft
  - id: multi-agent-016
    type: short_answer
    difficulty: hard
    tags:
      - alpha-beta
      - static-evaluation
      - game-tree
    question: |
      Run alpha-beta (children left to right) on the game tree below, where MAX chooses at A. Plain
      minimax statically evaluates all 15 leaves. How many leaves does alpha-beta statically
      evaluate?
    figure:
      src: ./multi-agent/multi-agent-016.svg
      alt: 'Game tree: A (MAX) has children B, C, D (MIN). B: E, F=7. C: G, H=3, I. D: J=4, K. E: L=5, M. G: N, O=7. I: P=6, Q. K: R, S=6. M: T=2, U=10. N: V=4, W=9. Q: X=2, Y=8. R: Z=7, Omega=3.'
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: L, T, F, V, O, H, J
    explanation: |
      Under B: L = 5, then T = 2 ≤ 5 cuts off U, so E = 5, and F = 7 gives B = 5 ($\alpha = 5$ at A)
      [^1]. Under C: V = 4 ≤ 5 cuts off W, O = 7 makes G = 7, then H = 3 ≤ 5 cuts off the whole of I.
      Under D: J = 4 ≤ 5 cuts off all of K. The evaluated leaves are L, T, F, V, O, H, J, 7 of 15
      [^2].
    references:
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Pseudocode
        locator: Pseudocode
