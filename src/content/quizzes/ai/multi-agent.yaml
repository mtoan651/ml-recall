  - id: multi-agent-024
    type: short_answer
    difficulty: hard
    tags:
      - alpha-beta
      - static-evaluation
      - game-tree
    question: |
      Run alpha-beta (children left to right, no reordering) on the game tree below, where MAX chooses
      at A. Of the 13 leaves, how many are statically evaluated?
    figure:
      src: ./multi-agent/multi-agent-024.svg
      alt: 'Game tree: A (MAX) has children B, C, D (MIN). B: E, F (MAX). E: leaf 1 and H (MIN) with leaves 18, 10. F: leaf 9 and I (MIN) with leaves 7, 11. C: leaves 0, 15. D: G (MAX) and leaf 4. G: J (MIN) with leaves 6, 13 and K (MIN) with leaves 12, 19.'
    answer:
      numeric: 10
      tolerance: 0
      hint: a whole number
      model: Evaluated 1, 18, 10, 9, 7, 0, 6, 12, 19, 4; pruned 11 (under I), 15 (under C), 13 (under J).
    explanation: |
      Under B: E needs 1, 18 and 10 (E = 10, so $\beta = 10$ at B); in F, 9 then I's first leaf 7 ≤ 9
      cuts off 11, giving B = 9 and $\alpha = 9$ at A [^1]. C's first leaf 0 ≤ 9 cuts off 15. Under
      D, J's first leaf 6 ≤ 9 cuts off 13, K needs both 12 and 19, and the last leaf 4 is evaluated
      too: 10 leaves in all. Placing D's leaf 4 before G would have cut off G entirely, which is why
      move ordering matters [^2].
    references:
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Pseudocode
        locator: Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 2 (2010), Problem 1 Games, Part A (minimax tree)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2010/
