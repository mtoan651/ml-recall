  - id: multi-agent-017
    type: single
    difficulty: medium
    tags:
      - alpha-beta
      - iterative-deepening
      - move-ordering
    question: |
      With progressive deepening you reorder each node's children by the values found at the previous
      depth before running alpha-beta one level deeper. Ignoring the cost of the shallower searches,
      is the deeper alpha-beta search guaranteed to prune at least as much as it would on the
      original order?
    options:
      - text: No — shallow values only estimate deeper ones, so the order can get worse
        correct: true
      - text: No — reordering children never changes how much alpha-beta prunes
        why: Move ordering is exactly what decides how much alpha-beta prunes; it changes the work, not the result.
      - text: Yes — alpha-beta always prunes at least as much after any reordering
        why: Pruning depends heavily on order; a bad order can remove all pruning.
      - text: Yes — the previous depth's values are exact minimax values for the deeper tree
        why: They are minimax values of a shallower tree; one more level of search can change them and their ranking.
    explanation: |
      Ordering children best-first maximizes pruning, and the previous iteration's values are usually
      a good guess of that order [^1][^2]. But they come from a shallower search, so the true ranking
      at the new depth can differ, and some nodes were pruned before and have no value at all. The
      reordering therefore usually helps but guarantees nothing [^2].
    references:
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Improvements_over_naive_minimax
        locator: Improvements over naive minimax (move ordering, iterative deepening)
      - source: mit-ocw-6034
        locator: Tutorial 2 notes (Games and CSP), G — alpha-beta + progressive deepening + tree-rotation optimizer, Note
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_tutor02/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz2_2008#q1c
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2008/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-018
    type: short_answer
    difficulty: medium
    tags:
      - minimax
      - complexity
      - move-generation
    question: |
      In a game program, static evaluation is essentially free, but generating the moves below a node
      is expensive. A full minimax search (no pruning) goes to depth $d = 4$ in a tree with branching
      factor $b = 3$. How many nodes need their moves generated?
    answer:
      numeric: 40
      tolerance: 0
      hint: a whole number
      model: $1 + 3 + 9 + 27 = (3^4 - 1)/(3 - 1) = 40$; the 81 leaves need no move generation.
    explanation: |
      Moves are generated at every node above the leaves: one root, $b$ nodes on level 1, $b^2$ on
      level 2 and $b^3$ on level 3, in total $(b^d - 1)/(b - 1)$, which is 40 for $b = 3$, $d = 4$
      [^1]. The 27 nodes of the last generating level are about two thirds of them, so, as with
      static evaluations, most of the work is done at the deepest level [^2].
    references:
      - source: mit-ocw-6034
        locator: Quiz 2 (2008), Problem 1 Games, Part D
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2008/
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Properties
        locator: Properties ("most of the total effort is in exploring the states at depth d")
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz2_2008#q1d
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2008/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-019
    type: short_answer
    difficulty: hard
    tags:
      - alpha-beta
      - static-evaluation
      - game-tree
    question: |
      Run alpha-beta (children left to right) on the game tree below, where MAX chooses at A; the
      numbers are static values of the leaves. List the leaves in the order they are statically
      evaluated.
    figure:
      src: ./multi-agent/multi-agent-019.svg
      alt: 'Game tree: A (MAX) has children B, C, D (MIN). B: E=2, F. C: G, H=6. D: I=1, J. F (MAX): K=3, L=0. G (MAX): M, N=7. J (MAX): O=2, P=20. M (MIN): Q=1, R=10.'
    answer:
      accept:
        - E K Q N H I
      pattern: E\W*K\W*Q\W*N\W*H\W*I
      hint: Leaf letters in order, e.g. E F G
      model: E, K (cuts off L), Q (cuts off R), N, H, I (cuts off J)
    explanation: |
      Under B: E = 2 sets $\beta = 2$, and in F the first leaf K = 3 ≥ 2 cuts off L, so B = 2 and
      $\alpha = 2$ at A [^1]. Under C: in G, M's first leaf Q = 1 ≤ 2 cuts off R; N = 7 makes G = 7,
      then H = 6 gives C = 6 and $\alpha = 6$. Under D: I = 1 ≤ 6 cuts off J. MAX moves to C with
      value 6, after evaluating 6 of the 10 leaves [^2].
    references:
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Pseudocode
        locator: Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 2 (2007), Problem 1 Games, Parts A–B
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2007/
