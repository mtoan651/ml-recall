  - id: multi-agent-003
    type: single
    question: |
      Chose the option which fits better when comparing different types of multi-agent environments

      - Your agents aim to maximize common benefits in ____ environments
      - Your agents aim to maximize common benefits while minimizing opponent's in ____ environments
    options:
      - text: competitive, cooperative
        why: You maximize common benefit in cooperative, while in competitive you also aim to reduce opponent's score
      - text: cooperative, competitive
        correct: true
    references:
