  - id: multi-agent-004
    type: multiple
    question: Which of the following statements are true about `decentralized` learning?
    options:
      - text: Each agent is trained independently from the others
        correct: true
      - text: Inputs from other agents are just considered environment data
        correct: true
      - text: Considering other agents part of the environment makes the environment stationary
        why: In decentralized learning, agents ignore the existence of other agents and consider them part of the environment. However, this means the environment is in constant change, becoming non-stationary.
    references:
      - source: hf-deep-rl-course
        locator: Unit 7. Introduction to Multi-Agents and AI vs AI
        url: https://huggingface.co/learn/deep-rl-course/unit7/introduction
    source:
      id: hf-deep-rl-course
      ref: unit7/quiz#q2
      url: https://huggingface.co/learn/deep-rl-course/unit7/quiz
    status: draft
  - id: multi-agent-005
    type: multiple
    question: Which of the following statements are true about `centralized` learning?
    options:
      - text: It learns one common policy based on the learnings from all agents' interactions
        correct: true
      - text: The reward is global
        correct: true
      - text: The environment with this approach is stationary
        correct: true
    references:
