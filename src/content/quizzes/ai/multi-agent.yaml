  - id: multi-agent-029
    type: single
    difficulty: medium
    tags:
      - multiplicative-weights
      - ftrl
      - entropy
      - softmax
    question: |
      A learner keeps cumulative utilities $g \in \mathbb{R}^n$ for its $n$ actions and plays
      $x = \operatorname*{arg\,max}_{x \in \Delta_n}\big[\langle g, x \rangle - \psi(x)\big]$, with the negative
      entropy $\psi(x) = \sum_i x_i \log x_i$ as regularizer and $\Delta_n$ the probability simplex. What is $x$?
    options:
      - text: The softmax, $x_i = e^{g_i} / \sum_j e^{g_j}$
        correct: true
      - text: All mass on the action with the largest $g_i$
        why: That is follow-the-leader, the solution without a regularizer; the entropy term keeps every action's probability positive.
      - text: The normalized utilities, $x_i = g_i / \sum_j g_j$
        why: This is not the maximizer and is not even a distribution when some $g_i$ are negative.
      - text: The uniform distribution, $x_i = 1/n$
        why: The uniform distribution minimizes $\psi$ alone; it ignores the utilities, which is the solution only when all $g_i$ are equal.
    explanation: |
      Setting the gradient of the Lagrangian to zero gives $g_i - 1 - \log x_i - \alpha = 0$, so
      $x_i \propto e^{g_i}$, and normalizing yields the softmax [^1]. With a step size $\eta$ the play is
      $\mathrm{softmax}(\eta g)$, so each new round multiplies the previous weights by $e^{\eta u_i}$: this is
      the multiplicative-weights (Hedge) algorithm [^2]. Seen this way, MWU is follow-the-regularized-leader
      with entropy regularization, which is where its regret guarantees come from [^1].
    references:
      - source: mit-ocw-6s890
        locator: Homework 2 reference solution, Problems 1.3–1.5
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset2_solution_pdf/
      - title: 'Wikipedia: Multiplicative weight update method'
        locator: Applications — Machine learning — Hedge algorithm
        url: https://en.wikipedia.org/wiki/Multiplicative_weight_update_method
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset2#p1.5
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset2_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-030
    type: short_answer
    difficulty: medium
    tags:
      - multiplicative-weights
      - dominated-strategies
      - no-regret
    question: |
      A player uses multiplicative weights, $x^{(t)}(a) \propto \exp\big(\eta \sum_{\tau < t} u^{(\tau)}(a)\big)$,
      starting from the uniform distribution. In every round, action $a^\ast$ earns at least $\varepsilon = 0.4$
      more than action $a$, whatever the opponents do. With $\eta = 0.1$, what is the largest possible
      value of the ratio $x(a) / x(a^\ast)$ after 50 rounds?
    answer:
      numeric: 0.135
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\exp(-\eta t \varepsilon) = \exp(-0.1 \times 50 \times 0.4) = e^{-2} \approx 0.135$
    explanation: |
      The normalizing constant cancels in the ratio, so $x(a)/x(a^\ast) = \exp\big(\eta \sum_\tau (u^{(\tau)}(a) - u^{(\tau)}(a^\ast))\big)$ [^1].
      Each round contributes at most $-\varepsilon$ to the sum, so after 50 rounds the ratio is at most
      $e^{-0.1 \cdot 50 \cdot 0.4} = e^{-2} \approx 0.135$. It shrinks exponentially, so MWU stops playing
      dominated actions [^1], even though such actions can survive in coarse correlated equilibria.
    references:
      - source: mit-ocw-6s890
        locator: Homework 1 reference solution, Problem 5.3
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset1#p5.3
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset1_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-031
    type: single
    difficulty: hard
    tags:
      - multiplicative-weights
      - regret-bound
      - dual-norm
    question: |
      The negative entropy is 1-strongly convex on the simplex with respect to both the $\ell_2$ and the
      $\ell_1$ norm. The regret bound of (optimistic) multiplicative weights involves the strong-convexity
      norm and its dual norm applied to the utility vectors. Which choice gives the stronger bound?
    options:
      - text: '$\ell_1$: the dual norm $\ell_\infty$ of the utilities is never larger than their $\ell_2$ norm'
        correct: true
      - text: $\ell_2$, because the $\ell_2$ norm of a utility vector is never larger than its $\ell_\infty$ norm
        why: The inequality goes the other way, $\lVert g \rVert_\infty \le \lVert g \rVert_2$, and the gap can be a factor $\sqrt{n}$.
      - text: Both give the same bound, because the strong-convexity constant is 1 in both cases
        why: The constant is the same, but the norms in which the utilities are measured differ, and so do the bounds.
      - text: $\ell_2$, because its unit ball is smaller than the $\ell_1$ unit ball
        why: The $\ell_2$ unit ball contains the $\ell_1$ unit ball; in any case the bound depends on the dual norm of the utilities.
    explanation: |
      With the $\ell_1$ norm the bound measures utility changes in the dual norm $\ell_\infty$, and
      $\lVert g \rVert_\infty \le \lVert g \rVert_2$; the bound's negative stability term uses $\lVert \cdot \rVert_1 \ge \lVert \cdot \rVert_2$,
      which also helps [^1][^2]. So the $\ell_1$ analysis is never worse and can be better by a factor
      $\sqrt{n}$; it leaves the number of actions in the bound only through the range term $\log n$ [^1].
    references:
      - source: mit-ocw-6s890
        locator: Homework 2 reference solution, Problems 1.7–1.8
        url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset2_solution_pdf/
      - title: 'Wikipedia: Dual norm'
        locator: Examples — Finite-dimensional spaces; Lp and ℓp spaces
        url: https://en.wikipedia.org/wiki/Dual_norm
    source:
      id: mit-ocw-6s890
      ref: mit6_s890_f24_pset2#p1.7
      url: https://ocw.mit.edu/courses/6-s890-topics-in-multiagent-learning-fall-2024/resources/mit6_s890_f24_pset2_solution_pdf/
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-032
    type: single
    difficulty: easy
    tags:
      - game-theory
      - prisoners-dilemma
      - dominant-strategy
    question: |
      Two suspects are questioned separately. If exactly one confesses, the confessor pays a fine of 5
      and the other 90; if both confess, each pays 60; if both deny, each pays 30. Each wants to
      minimise only their own fine. What do two rational suspects do?
    options:
      - text: Both confess
        correct: true
      - text: Both deny, since that gives the smallest total fine
        why: 'Denying is not stable: either suspect can cut their own fine from 30 to 5 by confessing instead.'
      - text: One confesses and the other denies
        why: The one who denies would pay 90 and can drop to 60 by also confessing, so this is not stable.
      - text: The outcome is undetermined, since each must guess the other's move
        why: Confessing is better for a suspect whatever the other does, so no guessing is needed.
    explanation: |
      For each suspect, confessing is a dominant strategy: if the other confesses, confessing costs 60
      instead of 90; if the other denies, it costs 5 instead of 30 [^1]. So both confess and pay 60
      each, the unique Nash equilibrium, even though both denying (30 each) would be better for both
      [^2]. This gap between individually rational and collectively good choices is the point of the
      prisoner's dilemma.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 8, Q12 (prisoner's dilemma with fines 5/90, 60/60, 30/30)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
      - title: "Wikipedia: Prisoner's dilemma"
        url: https://en.wikipedia.org/wiki/Prisoner%27s_dilemma#Premise
        locator: Premise; Strategy for the prisoner's dilemma
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment8#q12
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-033
    type: single
    difficulty: easy
    tags:
      - game-theory
      - nash-equilibrium
    question: |
      In a game between several agents, what makes a strategy profile (one strategy per player) a Nash
      equilibrium?
    options:
      - text: No player can get a better payoff by changing only their own strategy
        correct: true
      - text: The total payoff of all players together is as large as it can possibly be
        why: That is social optimality; in the prisoner's dilemma the equilibrium has a worse total than mutual cooperation [^2].
      - text: Every player gets the same payoff
        why: Payoffs in an equilibrium can be very unequal; only unilateral deviations matter [^2].
      - text: One player wins and the others lose
        why: That describes a zero-sum outcome, not the stability condition of an equilibrium.
    explanation: |
      A Nash equilibrium is a profile in which each player's strategy is a best response to the
      others' strategies, so no one gains by deviating alone [^1][^2]. It describes the rational
      choices of each player given the others, and it need not maximise the total payoff, as the
      prisoner's dilemma shows [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 8, Q10 (what a Nash equilibrium depicts)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Definitions
        locator: Introduction; Definitions
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment8#q10
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-034
    type: single
    difficulty: medium
    tags:
      - game-theory
      - nash-equilibrium
      - payoff-matrix
    question: |
      Two players move at the same time. Row picks T, M or B; Column picks L, C or R. Each cell
      lists (Row's payoff, Column's payoff).

      |       | L    | C    | R    |
      | ----- | ---- | ---- | ---- |
      | **T** | 3, 3 | 0, 4 | 1, 1 |
      | **M** | 4, 0 | 2, 2 | 0, 1 |
      | **B** | 1, 1 | 1, 0 | 2, 3 |

      Which cells are pure-strategy Nash equilibria?
    options:
      - text: (M, C) and (B, R)
        correct: true
      - text: None, because neither player has a dominant strategy
        why: An equilibrium does not need dominant strategies, only strategies that are best replies to each other, as in (M, C) and (B, R) [^1].
      - text: Only (T, L), the cell with the highest total payoff
        why: From (T, L), Row gains by switching to M (4 > 3) and Column by switching to C (4 > 3). A high total does not make a cell stable [^1].
      - text: Only (M, C), since a game has exactly one equilibrium
        why: A game can have several equilibria [^3]. At (B, R), B is Row's best reply to R (2 beats 1 and 0) and R is Column's best reply to B (3 beats 1 and 0).
    explanation: |
      A strategy profile is a Nash equilibrium if no player can do better by changing only their
      own strategy [^1]. In a payoff matrix, a cell is an equilibrium when Row's payoff is the largest
      in its column and Column's payoff is the largest in its row [^2]. (M, C) = (2, 2) and
      (B, R) = (2, 3) pass both tests, while every other cell has a profitable deviation; from (T, L),
      for example, Row moves to M. Like the coordination game, this game has two pure equilibria [^3].
    references:
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Definitions
        locator: Definitions
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Nash_equilibria_in_a_payoff_matrix
        locator: Examples, Nash equilibria in a payoff matrix
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Coordination_game
        locator: Examples, Coordination game
    source:
      id: original
      ref: multi-agent-034
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-035
    type: multiple
    difficulty: medium
    tags:
      - game-theory
      - prisoners-dilemma
      - dominant-strategy
      - pareto-optimality
    question: |
      A prisoner's dilemma: each player chooses C (cooperate) or D (defect), and each cell lists
      (Row's payoff, Column's payoff).

      |       | C    | D    |
      | ----- | ---- | ---- |
      | **C** | 3, 3 | 0, 5 |
      | **D** | 5, 0 | 1, 1 |

      Which statements are true? Select all that apply.
    options:
      - text: (C, C) is an equilibrium, because it has the largest total payoff
        why: At (C, C) each player gains by switching to D (5 > 3). An equilibrium is about one-player deviations, not about the total [^3].
      - text: D strictly dominates C for both players
        correct: true
      - text: (C, D) is Pareto optimal, although it is unfair to Row
        correct: true
      - text: (D, D) is the only pure-strategy Nash equilibrium
        correct: true
      - text: (D, D) is Pareto optimal, because it is an equilibrium
        why: (C, C) gives both players 3 instead of 1, a Pareto improvement, so this equilibrium is not Pareto efficient [^1][^2].
    explanation: |
      Whatever the other player does, D pays more than C (5 > 3 and 1 > 0), so D is strictly dominant
      for both players and mutual defection is the only equilibrium [^1]. An outcome is Pareto
      optimal if no other outcome makes one player better off without making another worse off [^2].
      (D, D) fails this test because (C, C) is better for both: the equilibrium is not Pareto
      efficient [^1]. The other three outcomes are all Pareto optimal; any move away from (C, D), for
      instance, lowers Column's payoff of 5, the most Column can get.
    references:
      - title: "Wikipedia: Prisoner's dilemma"
        url: https://en.wikipedia.org/wiki/Prisoner%27s_dilemma#Strategy_for_the_prisoner's_dilemma
        locator: Strategy for the prisoner's dilemma
      - title: 'Wikipedia: Pareto efficiency'
        url: https://en.wikipedia.org/wiki/Pareto_efficiency#Overview
        locator: Introduction and Overview (Pareto improvement, Pareto efficient)
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Rationality
        locator: Definitions and Rationality (a Nash equilibrium is not necessarily Pareto optimal)
    source:
      id: original
      ref: multi-agent-035
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-036
    type: single
    difficulty: hard
    tags:
      - game-theory
      - iterated-elimination
      - dominated-strategy
    question: |
      Each cell lists (Row's payoff, Column's payoff).

      |       | L    | C    | R    |
      | ----- | ---- | ---- | ---- |
      | **T** | 2, 3 | 3, 4 | 5, 1 |
      | **M** | 1, 2 | 2, 4 | 3, 5 |
      | **B** | 4, 3 | 4, 2 | 1, 0 |

      You apply iterated elimination of strictly dominated strategies until nothing more can be
      removed. Which strategy profile is left?
    options:
      - text: (B, L)
        correct: true
      - text: All nine, since neither player has a strictly dominant strategy
        why: Elimination needs a strictly dominated strategy, not a dominant one, and M is dominated by T from the start [^1].
      - text: (M, R), the cell with the highest total payoff
        why: M is strictly dominated by T (2 > 1, 3 > 2, 5 > 3), so it is removed in the first round [^1].
      - text: (T, C), since T beats M and C is Column's best reply to T
        why: Removing M is only the first round. Without M, R is dominated for Column, and then B dominates T for Row [^1].
    explanation: |
      A strategy is strictly dominated if another strategy pays strictly more against every choice of
      the opponent; the procedure removes such strategies and repeats on the smaller game [^1].
      Round 1: T dominates M. Round 2: against T and B, L (3, 3) and C (4, 2) both beat R (1, 0) for
      Column. Round 3: against L and C, B (4, 4) beats T (2, 3). Round 4: against B, Column prefers
      L (3) to C (2). Strictly dominated strategies cannot be part of a Nash equilibrium [^1], so
      (B, L), with payoffs (4, 3), is the game's only one.
    references:
      - title: 'Wikipedia: Strategic dominance'
        url: https://en.wikipedia.org/wiki/Strategic_dominance#Iterated_elimination_of_strictly_dominated_strategies
        locator: Terminology; Dominance and Nash equilibria; Iterated elimination of strictly dominated strategies
    source:
      id: original
      ref: multi-agent-036
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-037
    type: short_answer
    difficulty: medium
    tags:
      - game-theory
      - zero-sum
      - minimax
      - saddle-point
    question: |
      In a two-player zero-sum game the table lists Row's payoff; Column gets the negative of each
      entry, so Row wants it large and Column wants it small.

      |       | L    | C   | R    |
      | ----- | ---- | --- | ---- |
      | **T** | 5    | 1   | $-3$ |
      | **M** | 2    | 0   | 4    |
      | **B** | 3    | 2   | 6    |

      What is the value of the game, Row's payoff when both players play optimally?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: $\max_i \min_j a_{ij} = \max(-3, 0, 2) = 2$ and $\min_j \max_i a_{ij} = \min(5, 2, 6) = 2$, a saddle point at (B, C).
    explanation: |
      Row's maximin value is the most it can be sure to get: the best of the row minima
      $(-3, 0, 2)$, which is 2 with B [^1]. Column's minimax value is the least it can hold Row to:
      the smallest of the column maxima $(5, 2, 6)$, which is 2 with C [^1]. The two agree, so
      (B, C) is a saddle point, an entry that is the largest in its column and the smallest in its
      row [^2], and neither player gains by deviating. Games without a saddle point, such as matching
      pennies, need mixed strategies; the minimax theorem guarantees a value in mixed strategies [^1][^3].
    references:
      - title: 'Wikipedia: Minimax'
        url: https://en.wikipedia.org/wiki/Minimax#In_zero-sum_games
        locator: Game theory, In general games (maximin and minimax values) and In zero-sum games
      - title: 'Wikipedia: Saddle point'
        url: https://en.wikipedia.org/wiki/Saddle_point#Other_uses
        locator: Other uses (saddle point of a matrix)
      - title: 'Wikipedia: Zero-sum game'
        url: https://en.wikipedia.org/wiki/Zero-sum_game#Solution
        locator: Definition and Solution
    source:
      id: original
      ref: multi-agent-037
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-038
    type: true_false
    difficulty: easy
    tags:
      - game-theory
      - nash-equilibrium
      - matching-pennies
      - mixed-strategy
    shuffle: false
    question: |
      True or false: every finite two-player game has at least one Nash equilibrium in pure
      strategies.
    options:
      - text: 'True'
        why: Matching pennies has none, because in every cell the losing player gains by switching. Nash's theorem only guarantees an equilibrium that may be mixed [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      In matching pennies one player wins when the two coins match and the other wins when they
      differ, so in every cell the loser wants to switch: there is no pure-strategy Nash
      equilibrium [^1]. Nash's existence result says that every such game has at least one
      equilibrium, but it may be a probability distribution over strategies [^2]. In matching pennies
      the only equilibrium has each player choose heads or tails with probability 1/2, which gives
      both players an expected payoff of 0 [^1].
    references:
      - title: 'Wikipedia: Matching pennies'
        url: https://en.wikipedia.org/wiki/Matching_pennies#Theory
        locator: Introduction and Theory
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Existence
        locator: Existence
    source:
      id: original
      ref: multi-agent-038
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-039
    type: short_answer
    difficulty: hard
    tags:
      - game-theory
      - mixed-strategy
      - nash-equilibrium
      - indifference
    question: |
      Each cell lists (Row's payoff, Column's payoff). The game has no pure-strategy Nash
      equilibrium.

      |       | L    | R    |
      | ----- | ---- | ---- |
      | **U** | 2, 0 | 0, 3 |
      | **D** | 0, 1 | 1, 0 |

      In its mixed-strategy Nash equilibrium, with what probability does Row play U?
    answer:
      numeric: 0.25
      tolerance: 0.005
      hint: a probability, 2 decimals
      model: "Row's $p$ must make Column indifferent: L pays Column $1 - p$, R pays $3p$, so $p = 1/4$."
    explanation: |
      A player is willing to randomise only if every pure strategy in the mix gives the same expected
      payoff [^1]. So Row's probability $p$ of U is fixed by Column's payoffs: L earns Column
      $0 \cdot p + 1 \cdot (1 - p)$ and R earns $3p$, which are equal at $p = 1/4$. In the same way,
      Column's probability $q$ of L makes Row indifferent, $2q = 1 - q$, so $q = 1/3$. Solving Row's
      own indifference and answering 1/3 is the usual trap. Matching pennies is solved the same way and
      gives 1/2 for both players [^1].
    references:
      - title: 'Wikipedia: Nash equilibrium'
        url: https://en.wikipedia.org/wiki/Nash_equilibrium#Computing_Nash_equilibria
        locator: Computing Nash equilibria, and its Examples (matching pennies)
    source:
      id: original
      ref: multi-agent-039
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-040
    type: short_answer
    difficulty: easy
    tags:
      - game-theory
      - mixed-strategy
      - expected-payoff
    question: |
      The table lists Row's payoffs in a $2 \times 2$ game.

      |       | L | R    |
      | ----- | - | ---- |
      | **U** | 4 | $-1$ |
      | **D** | 0 | 2    |

      Row plays U with probability 0.3 and D with probability 0.7. Independently, Column plays L with
      probability 0.6 and R with probability 0.4. What is Row's expected payoff?
    answer:
      numeric: 1.16
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $0.3 \cdot 0.6 \cdot 4 + 0.3 \cdot 0.4 \cdot (-1) + 0.7 \cdot 0.6 \cdot 0 + 0.7 \cdot 0.4 \cdot 2 = 1.16$
    explanation: |
      A mixed strategy is a probability distribution over pure strategies, and its payoff is an
      expected payoff [^1]. Because the players choose independently, each cell occurs with the
      product of the two probabilities, so the expected payoff is
      $0.72 - 0.12 + 0 + 0.56 = 1.16$; in matrix form it is $\mathbf{x}^\top A \mathbf{y}$ with
      $\mathbf{x} = (0.3, 0.7)$ and $\mathbf{y} = (0.6, 0.4)$. The same computation gives the
      expected payoff of each pure reply, as in the penalty-kick illustration [^2]. The plain average
      of the four entries, 1.25, would be right only if both players mixed 50/50.
    references:
      - title: 'Wikipedia: Strategy (game theory)'
        url: https://en.wikipedia.org/wiki/Strategy_(game_theory)#Pure_and_mixed_strategies
        locator: Pure and mixed strategies
      - title: 'Wikipedia: Strategy (game theory)'
        url: https://en.wikipedia.org/wiki/Strategy_(game_theory)#Illustration
        locator: Mixed strategy, Illustration
    source:
      id: original
      ref: multi-agent-040
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-041
    type: single
    difficulty: medium
    tags:
      - marl
      - non-stationarity
      - independent-learners
      - experience-replay
    question: |
      Two agents learn at the same time with independent deep Q-learning. Each treats the other as
      part of the environment and trains on its own experience-replay buffer. Why can transitions
      that agent 1 stored a while ago mislead its updates?
    options:
      - text: The agents share one team reward, so agent 1 cannot tell which agent earned it
        why: That is the credit-assignment problem of cooperative tasks. It exists even without replay and does not make old transitions outdated [^4].
      - text: Agent 2 has changed its policy since, so they show dynamics that no longer hold
        correct: true
      - text: With two agents acting, the buffer fills faster and old transitions are overwritten too soon
        why: Buffer capacity is not the issue. The problem is that the old transitions are stale, not that too few of them are kept [^1].
      - text: Agent 1's own policy has changed since, and Q-learning cannot use another policy's data
        why: Q-learning is off-policy and copes with changes in the agent's own policy. The trouble is the change in the other agent, which agent 1 can neither see nor explain [^1].
    explanation: |
      An independent learner counts the other agents as part of the environment, but they keep
      learning, so from its point of view the transition and reward dynamics change over time: the
      environment is non-stationary [^1][^2]. This breaks the Markov assumption behind the
      convergence of Q-learning, and stored transitions describe an environment that no longer exists,
      which prevents the straightforward use of experience replay [^1]. Foerster et al. disabled
      experience replay in their RIAL agents for this reason [^3]. MADDPG's critics avoid the problem
      by conditioning on the actions of all agents [^1].
    references:
      - title: Lowe et al. (2017), Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments
        url: https://arxiv.org/abs/1706.02275
        locator: Sec. 1 Introduction; Sec. 3 Background, Q-Learning and Deep Q-Networks (DQN); Sec. 4.1 Multi-Agent Actor Critic
      - source: hf-deep-rl-course
        url: https://huggingface.co/learn/deep-rl-course/unit7/multi-agent-setting#decentralized-system
        locator: Unit 7, Designing Multi-Agents systems, sec. Decentralized system
      - title: Foerster, Assael, de Freitas & Whiteson (2016), Learning to Communicate with Deep Multi-Agent Reinforcement Learning
        url: https://arxiv.org/abs/1605.06676
        locator: Sec. 5.1 Reinforced Inter-Agent Learning
      - title: Foerster et al. (2017), Counterfactual Multi-Agent Policy Gradients
        url: https://arxiv.org/abs/1705.08926
        locator: Sec. 1 Introduction (multi-agent credit assignment)
    source:
      id: original
      ref: multi-agent-041
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-042
    type: single
    difficulty: medium
    tags:
      - marl
      - maddpg
      - centralized-training-decentralized-execution
      - actor-critic
    question: |
      MADDPG trains $N$ agents with centralised training and decentralised execution. What does agent
      $i$'s critic receive, and what is used once training is over?
    options:
      - text: The critic sees all agents' observations and actions; afterwards each actor uses only its own observation
        correct: true
      - text: One critic shared by all agents sees the global state, so MADDPG needs a common team reward
        why: Each agent learns its own critic $Q_i$, so agents can have different and even conflicting rewards; MADDPG also handles competitive and mixed settings [^1].
      - text: The critic sees only agent $i$'s observation and action, and the actors share observations when acting
        why: It is the other way round. The extra information goes to the critic during training, while the actors use only local observations at execution [^1].
      - text: Critic and actor both see every agent's observations and actions, in training and in execution
        why: The critic is only needed for training. At execution each actor acts on its own observation, so the agents need no global information then [^1].
    explanation: |
      Agent $i$ learns a centralised action-value function $Q_i^{\pi}(\mathbf{x}, a_1, \ldots, a_N)$,
      where $\mathbf{x}$ can hold the observations of all agents, while its policy is conditioned only
      on its own observation $o_i$ [^1]. If the actions of all agents are known, the environment is
      stationary from the critic's point of view even as the policies change [^1]. After training only
      the local actors are used, so execution is decentralised. Because each $Q_i$ is learned
      separately, the agents can have arbitrary reward structures, including conflicting ones [^1].
    references:
      - title: Lowe et al. (2017), Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments
        url: https://arxiv.org/abs/1706.02275
        locator: Sec. 1 Introduction; Sec. 4.1 Multi-Agent Actor Critic, Eqs. (4)-(6)
    source:
      id: original
      ref: multi-agent-042
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-043
    type: multiple
    difficulty: hard
    tags:
      - marl
      - value-decomposition
      - vdn
      - qmix
      - cooperative
    question: |
      In a fully cooperative task all agents receive one shared team reward. VDN and QMIX learn a joint
      value $Q_{tot}$ from per-agent utilities $Q_a(\tau^a, u^a)$, where $\tau^a$ is agent $a$'s own
      action-observation history. Which statements are true? Select all that apply.
    options:
      - text: QMIX can represent any joint value, even one where an agent's best action depends on the others' actions
        why: A monotonic mixing cannot represent value functions in which an agent's best action depends on the other agents' actions at the same time step [^1].
      - text: VDN sets $Q_{tot}$ to the sum of the agents' $Q_a$
        correct: true
      - text: QMIX requires $\partial Q_{tot} / \partial Q_a \ge 0$, so the agents' greedy actions together maximise $Q_{tot}$
        correct: true
      - text: QMIX keeps the mixing weights non-negative, using hypernetworks that take the state $s$
        correct: true
      - text: At execution each agent needs the global state, since the mixing network uses it
        why: The mixing network is only used in centralised training. At execution each agent acts greedily on its own $Q_a$, which depends only on its own history [^1].
    explanation: |
      VDN decomposes the joint action-value additively, $Q_{tot} = \sum_a Q_a(\tau^a, u^a)$ [^2].
      QMIX allows any mixing that is monotonic in each $Q_a$, $\partial Q_{tot}/\partial Q_a \ge 0$,
      which is enough for $\operatorname*{arg\,max}_{\mathbf{u}} Q_{tot}$ to equal the tuple of the
      individual argmaxes, so decentralised greedy execution agrees with the centralised value [^1].
      It enforces this by making the mixing network's weights (not its biases) non-negative; the
      weights come from hypernetworks fed with the state $s$, so $Q_{tot}$ may depend on $s$ in
      non-monotonic ways [^1]. The cost is expressiveness: value functions in which an agent's best
      action depends on what the others do at the same time cannot be represented exactly [^1].
    references:
      - title: 'Rashid et al. (2018), QMIX: Monotonic Value Function Factorisation for Deep Multi-Agent Reinforcement Learning'
        url: https://arxiv.org/abs/1803.11485
        locator: Sec. 3 Background; Sec. 4 QMIX, Eqs. (4)-(5); Sec. 4.1 Representational Complexity
      - title: Sunehag et al. (2017), Value-Decomposition Networks For Cooperative Multi-Agent Learning
        url: https://arxiv.org/abs/1706.05296
        locator: Sec. 3 A Deep-RL Architecture for Coop-MARL (additive decomposition)
    source:
      id: original
      ref: multi-agent-043
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-044
    type: single
    difficulty: medium
    tags:
      - marl
      - communication
      - dial
      - rial
      - commnet
    question: |
      Foerster et al. (2016) proposed two ways for agents to learn a communication protocol, RIAL and
      DIAL. What does DIAL do that RIAL does not?
    options:
      - text: Each agent receives the average of the other agents' hidden states, so the number of agents may vary
        why: That describes CommNet, which averages the other agents' hidden states into a continuous communication vector [^2].
      - text: In centralised training it sends real-valued messages and passes gradients from receiver to sender
        correct: true
      - text: It keeps exchanging real-valued messages and gradients between agents at execution time
        why: At execution DIAL discretises each message and sends it over the limited channel; gradients only flow during centralised learning [^1].
      - text: It picks each message as a discrete action and learns it by Q-learning inside each agent
        why: That is RIAL. Its Q-network outputs values for environment actions and for messages, and no gradients pass between agents [^1].
    explanation: |
      Both methods use centralised learning with decentralised execution [^1]. In RIAL each agent's
      Q-network outputs Q-values for environment actions and for discrete messages, and the gradients
      stay inside one agent's network [^1]. DIAL replaces the message during centralised learning by a
      real-valued one, so gradients flow back through the channel from the receiving agent to the
      sender, giving end-to-end backpropagation across agents [^1]. A discretise/regularise unit adds
      noise during training and discretises the message at execution [^1]. CommNet also learns
      continuous communication by backpropagation, by averaging the other agents' hidden states [^2].
    references:
      - title: Foerster, Assael, de Freitas & Whiteson (2016), Learning to Communicate with Deep Multi-Agent Reinforcement Learning
        url: https://arxiv.org/abs/1605.06676
        locator: Sec. 5.1 Reinforced Inter-Agent Learning; Sec. 5.2 Differentiable Inter-Agent Learning
      - title: Sukhbaatar, Szlam & Fergus (2016), Learning Multiagent Communication with Backpropagation
        url: https://arxiv.org/abs/1605.07736
        locator: Sec. 2.1 Model, Eqs. (1)-(2)
    source:
      id: original
      ref: multi-agent-044
    status: reviewed
    reviewed_by: claude
  - id: multi-agent-045
    type: short_answer
    difficulty: hard
    tags:
      - marl
      - coma
      - credit-assignment
      - counterfactual-baseline
    question: |
      In a cooperative task all agents receive one shared team reward, and COMA gives each agent its
      own advantage through a counterfactual baseline. Agent $a$ has three actions. With the other
      agents' actions $\mathbf{u}^{-a}$ held fixed, the centralised critic and agent $a$'s policy give:

      | agent $a$'s action $u'^a$ | $u_1$ | $u_2$ | $u_3$ |
      | --- | --- | --- | --- |
      | $Q(s, (\mathbf{u}^{-a}, u'^a))$ | 4.0 | 6.0 | 1.0 |
      | $\pi^a(u'^a \mid \tau^a)$ | 0.2 | 0.5 | 0.3 |

      Agent $a$ actually took $u_2$. What is its COMA advantage?
    answer:
      numeric: 1.9
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $6.0 - (0.2 \cdot 4.0 + 0.5 \cdot 6.0 + 0.3 \cdot 1.0) = 6.0 - 4.1 = 1.9$
    explanation: |
      With a shared reward, the global return says little about one agent's contribution; this is
      the multi-agent credit assignment problem [^1]. COMA compares the critic's value of the joint
      action with a baseline that averages out only agent $a$'s action under its current policy,
      keeping the other agents' actions fixed:
      $A^a = Q(s, \mathbf{u}) - \sum_{u'^a} \pi^a(u'^a \mid \tau^a)\, Q(s, (\mathbf{u}^{-a}, u'^a))$ [^1].
      Here the baseline is $0.8 + 3.0 + 0.3 = 4.1$, so the advantage is $6.0 - 4.1 = 1.9$: $u_2$ did
      better than agent $a$'s average behaviour. Unlike difference rewards, this needs no simulator or
      default action, and the critic outputs the Q-values of all of agent $a$'s actions in one
      forward pass [^1].
    references:
      - title: Foerster et al. (2017), Counterfactual Multi-Agent Policy Gradients
        url: https://arxiv.org/abs/1705.08926
        locator: Sec. 1 Introduction; Sec. 4 Methods, Counterfactual Multi-Agent Policy Gradients, Eq. (4)
    source:
      id: original
      ref: multi-agent-045
    status: reviewed
    reviewed_by: claude
