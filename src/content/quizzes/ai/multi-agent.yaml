  - id: multi-agent-021
    type: single
    difficulty: medium
    tags:
      - alpha-beta
      - static-evaluation
      - monotonic-transform
    question: |
      You replace the static evaluator $S$ by $S_1 = 42\,S + 1000$ or by $S_2 = -42\,S + 1000$.
      Which statement about the leaves that alpha-beta statically evaluates (same tree, same order)
      holds for every possible set of leaf values?
    options:
      - text: Both $S_1$ and $S_2$ can change which leaves are evaluated
        why: $S_1$ is strictly increasing, so every comparison between values, and hence every cutoff, is unchanged.
      - text: $S_1$ never changes the evaluated leaves; $S_2$ can change them
        correct: true
      - text: $S_2$ never changes which leaves are evaluated; $S_1$ can change them
        why: It is the other way round; only an order-preserving transform keeps alpha-beta's decisions.
      - text: Neither $S_1$ nor $S_2$ ever changes which leaves are evaluated
        why: $S_2$ reverses every comparison, so MAX now prefers what MIN preferred; cutoffs move.
    explanation: |
      Alpha-beta only takes maxima and minima and compares values with $\alpha$ and $\beta$, which
      are themselves earlier values [^1]. A strictly increasing transform such as $42S + 1000$
      preserves every one of these comparisons, so the same leaves are evaluated and the same move is
      chosen. Multiplying by $-42$ reverses the order, which in general changes the backed-up values
      and the cutoffs [^2].
    references:
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Pseudocode
        locator: Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 2 (2009), Problem 1 Games, Part A4
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz2_2009#q1a4
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2009/
    status: draft
  - id: multi-agent-022
    type: short_answer
    difficulty: hard
    tags:
      - alpha-beta
      - best-case
      - complexity
    question: |
      A uniform game tree has branching factor $b = 3$ and depth $d = 4$ (81 leaves). If the children
      are ordered perfectly (best move first everywhere), how many leaves does alpha-beta statically
      evaluate?
    answer:
      numeric: 17
      tolerance: 0
      hint: a whole number
      model: $b^{\lceil d/2 \rceil} + b^{\lfloor d/2 \rfloor} - 1 = 9 + 9 - 1 = 17$
    explanation: |
      With perfect ordering alpha-beta evaluates $b^{\lceil d/2 \rceil} + b^{\lfloor d/2 \rfloor} - 1$
      leaves (Knuth and Moore), which for even $d$ is $2b^{d/2} - 1$ [^1][^2]. For $b = 3$, $d = 4$
      that is $2 \cdot 9 - 1 = 17$ of 81 leaves: roughly the square root of minimax's work, so the
      same time budget reaches about twice the depth.
    references:
      - source: mit-ocw-6034
        locator: Tutorial 2 notes (Games and CSP), E — Theoretical Pruning Bounds for Alpha Beta Search
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_tutor02/
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Improvements_over_naive_minimax
        locator: Improvements over naive minimax (best case $O(b^{d/2})$)
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_tutor02#e
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_tutor02/
    status: draft
  - id: multi-agent-023
    type: short_answer
    difficulty: easy
    tags:
      - minimax
      - game-tree
    question: |
      Apply plain minimax (no pruning) to the game tree below: the root A is a MAX node, the levels
      alternate as labeled, and only the leaves carry static values. What value is backed up to A?
    figure:
      src: ./multi-agent/multi-agent-023.svg
      alt: 'Game tree: A (MAX) has children B, C, D (MIN). B: E, F (MAX). E: leaf 1 and H (MIN) with leaves 18, 10. F: leaf 9 and I (MIN) with leaves 7, 11. C: leaves 0, 15. D: G (MAX) and leaf 4. G: J (MIN) with leaves 6, 13 and K (MIN) with leaves 12, 19.'
    answer:
      numeric: 9
      tolerance: 0
      hint: a whole number
      model: E = max(1, 10) = 10, F = max(9, 7) = 9, B = 9; C = 0; G = max(6, 12) = 12, D = min(12, 4) = 4; A = max(9, 0, 4) = 9.
    explanation: |
      Back up from the leaves: H = min(18, 10) = 10 and E = 10; I = 7 and F = max(9, 7) = 9, so
      B = min(10, 9) = 9 [^1]. C = min(0, 15) = 0. J = 6 and K = 12 give G = 12, and D = min(12, 4)
      = 4. MAX picks B with value 9 [^2].
