  - id: multi-agent-006
    type: short_answer
    question: Explain in your own words what is the `Self-Play` approach
    answer:
      model: '`Self-play` is an approach to instantiate copies of agents with the same policy as your as opponents, so that your agent learns from agents with same training level.'
    references:
      - source: hf-deep-rl-course
        locator: Unit 7. Introduction to Multi-Agents and AI vs AI
        url: https://huggingface.co/learn/deep-rl-course/unit7/introduction
    source:
