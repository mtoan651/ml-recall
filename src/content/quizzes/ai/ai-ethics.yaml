      ref: quiz-224/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-004
    type: single
    difficulty: medium
    question: Accountability of an AI system means that
    options:
      - text: there should be a human being involved in taking decisions, who can take responsibility
        correct: true
      - text: AI system should be held responsible for its actions
      - text: AI system developers should be held responsible
    explanation: |
      The lesson defines accountability as knowing where responsibility for an AI decision lies,
      and says the usual way to secure it is to keep human beings in the loop for important
      decisions, so that actual people are accountable [^1]. The AI system itself cannot carry
      responsibility: it is a tool built from matrix arithmetic, with no intentions of its own [^1].
      Developers do share responsibility (Microsoft's principle says the people who design and deploy
      AI systems must be accountable [^2]), but blaming developers alone misses the core idea that a
      responsible person must take part where each decision is made.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Accountability)'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#accountability
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Accountability'
