schema_version: 1
domain: ai
topic: ai-ethics
title: Responsible AI & Fairness
questions:
  - id: ai-ethics-001
    type: multiple
    question: What possible source can the bias observed in a model have?
    options:
      - text: The model is a fine-tuned version of a pretrained model and it picked up its bias from it.
        correct: true
      - text: The data the model was trained on is biased.
        correct: true
      - text: The metric the model was optimizing for is biased.
        correct: true
    explanation: |
      All three are real sources of bias. Pretrained models are often trained on text scraped from
      the internet, and even BERT, trained on seemingly neutral Wikipedia and BookCorpus text,
      completes `This woman works as a [MASK].` with gender-stereotyped jobs. Fine-tuning on your own
      data does not make this intrinsic bias disappear, so a fine-tuned model inherits it [^1].
      Biased training data is the most obvious source, but not the only one. A less obvious one is
      the way the model is trained: it blindly optimizes whatever metric you chose, so a biased
      metric gives a biased model [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/9
        locator: 'Chapter 1: Bias and limitations'
        quote: Fine-tuning the model on your data won't make this intrinsic bias disappear.
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/7
        locator: 'Chapter 1: Ungraded quiz, question 11 (answer notes)'
    source:
      id: hf-llm-course
      ref: chapter1/7#q11
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: ai-ethics-002
    type: single
    difficulty: easy
    question: Which of these is an example of interpretable AI?
    options:
      - text: Expert system
        correct: true
      - text: Neural network
      - text: Image classifier
    explanation: |
      An expert system stores knowledge as explicit if-then rules taken from human experts and
      applies them with an inference engine, so you can always trace which rules led to each
      decision [^2]. That is the kind of interpretable system the transparency principle of
      Responsible AI recommends wherever possible [^1]. A neural network instead encodes what it
      learned in a large number of numeric weights, which is why ML models are often called black
      boxes whose outcomes are hard to explain [^3]. Image classifiers are usually exactly such
      networks (convolutional neural networks) [^4], so they are not the interpretable example.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Transparency)'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#expert-systems
        locator: "Lesson: Knowledge Representation and Expert Systems, sec. Expert Systems and the note in 'Exercise: Animal Inference'"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#debugging-with-responsible-ai
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Debugging with responsible AI'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#recent-ai-research
        locator: 'Lesson: Introduction to AI, sec. Recent AI Research'
    source:
      id: ms-ai-for-beginners
      ref: quiz-124/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-003
    type: single
    difficulty: easy
    question: Why can an AI model discriminate?
    options:
      - text: Because it may become unfriendly
      - text: Because datasets were not properly balanced
        correct: true
      - text: Because developers programmed it in such a way
    explanation: |
      A model reproduces the patterns in its training data, so if some groups are under- or
      over-represented its predictions favour the majority. The lesson's example is a hiring model
      that prefers men simply because its data was skewed towards male candidates; the remedy is to
      balance the data and inspect the model [^1]. The Gender Shades study showed this in practice:
      two face benchmarks were 79.6% and 86.2% lighter-skinned, and commercial gender classifiers
      misclassified darker-skinned women up to 34.7% of the time versus at most 0.8% for
      lighter-skinned men [^2]. A model is just large-scale matrix arithmetic with no emotions, so it
      cannot "become unfriendly" [^1], and bias usually enters unintentionally through the data rather
      than being deliberately programmed [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Fairness)'
      - title: 'Buolamwini & Gebru, Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification (FAT* 2018, PMLR 81)'
        url: https://proceedings.mlr.press/v81/buolamwini18a.html
        locator: Abstract
        quote: We find that these datasets are overwhelmingly composed of lighter-skinned subjects (79.6% for IJB-A and 86.2% for Adience)
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
    source:
      id: ms-ai-for-beginners
      ref: quiz-224/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-004
    type: single
    difficulty: medium
    question: Accountability of an AI system means that
    options:
      - text: there should be a human being involved in taking decisions, who can take responsibility
        correct: true
      - text: the AI system itself should be held responsible for its own actions
      - text: only the developers of the AI system should be held responsible
    explanation: |
      The lesson defines accountability as knowing where responsibility for an AI decision lies,
      and says the usual way to secure it is to keep human beings in the loop for important
      decisions, so that actual people are accountable [^1]. The AI system itself cannot carry
      responsibility: it is a tool built from matrix arithmetic, with no intentions of its own [^1].
      Developers do share responsibility (Microsoft's principle says the people who design and deploy
      AI systems must be accountable [^2]), but blaming developers alone misses the core idea that a
      responsible person must take part where each decision is made.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Accountability)'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#accountability
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Accountability'
    source:
      id: ms-ai-for-beginners
      ref: quiz-224/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-005
    type: single
    difficulty: easy
    question: Model fairness is related to
    options:
      - text: Interpretability
      - text: Biases
        correct: true
      - text: Accountability
    explanation: |
      The Responsible AI principles tie fairness directly to model bias: a model trained on biased
      data can favour one group, so the data must be balanced and the model examined [^1]. The ML
      lesson says the same from the other side: human biases end up in training data, and a fair
      system gives the same recommendation to people in similar situations [^2]. Interpretability
      belongs to the transparency principle, and accountability is a separate principle about who
      answers for a decision [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
    source:
      id: ms-ai-for-beginners
      ref: quiz-224/q4
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-006
    type: single
    difficulty: easy
    question: "The term 'unfairness' in ML connotes:"
    options:
      - text: harms for a group of people
        correct: true
      - text: harm to one person
      - text: harms for the majority of people
    explanation: |
      The lesson defines "unfairness" as negative impacts, or harms, for a group of people, such as
      groups defined by race, gender, age or disability status [^1]. Its five harm types
      (allocation, quality of service, denigration, over- or under-representation, stereotyping)
      all describe a whole group being treated worse, not a single person's bad outcome [^1]. The
      harmed groups are typically under-represented communities whose data is likely to be biased,
      rather than the majority [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Inclusiveness)'
    source:
      id: ms-ml-for-beginners
      ref: quiz-5/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-007
    type: single
    difficulty: easy
    shuffle: false
    question: The 'Gender Shades Study' focused on
    options:
      - text: transforming gender discourse
      - text: the biases inherent in facial analytics
        correct: true
      - text: neither of these
    explanation: |
      Gender Shades (Buolamwini and Gebru, 2018) evaluated the bias in automated facial analysis
      algorithms and datasets with respect to gender and skin type [^1][^2]. The authors built a
      benchmark balanced by gender and skin type, tested three commercial gender classifiers
      (Microsoft, IBM, Face++), and found the most errors on darker-skinned women, up to 34.7%,
      against at most 0.8% for lighter-skinned men [^1][^2]. Gender classification was only the test
      case used to show why AI products that analyse people need transparent performance reporting;
      the project was not about gender discourse [^3].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/6-Data-Science-In-Wild/20-Real-World-Examples/README.md#data-science--research
        locator: 'Lesson: Data Science in the Real World, sec. Data Science + Research'
      - title: 'Buolamwini & Gebru, Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification (FAT* 2018, PMLR 81)'
        url: https://proceedings.mlr.press/v81/buolamwini18a.html
        locator: Abstract
      - title: Gender Shades project site
        url: http://gendershades.org/overview.html
        locator: Overview page (introduction)
    source:
      id: ms-ds-for-beginners
      ref: quiz-38/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-6.json
    status: draft
  - id: ai-ethics-008
    type: true_false
    question: 'It is impossible for a binary classification model to satisfy both demographic parity and equality of opportunity on the same set of predictions.'
    options:
      - text: 'True'
        why: It's possible for a model's predictions to satisfy both demographic parity and equality of opportunity. See if you can think of a scenario where both metrics are satisfied; the explanation gives one.
      - text: 'False'
        correct: true
    explanation: |
      It's possible for a model's predictions to satisfy both demographic parity and equality of opportunity.

      For example, let's say a binary classifier (whose preferred label is the positive class) is evaluated on 100 examples, with results shown in the following confusion matrices, broken out by demographic group (majority and minority):

      |  | Majority group | | Minority group | |
      | --- | --- | --- | --- | --- |
      |  | Predicted positive | Predicted negative | Predicted positive | Predicted negative |
      | **Actual positive** | 6 | 12 | 3 | 6 |
      | **Actual negative** | 10 | 36 | 6 | 21 |
      |  | $\text{Positive Rate} = \frac{6+10}{6+10+12+36} = \frac{16}{64} = \text{25\%}$  $\text{True Positive Rate} = \frac{6}{6+12} = \frac{6}{18} = \text{33\%}$ | | $\text{Positive Rate} = \frac{3+6}{3+6+6+21} = \frac{9}{36} = \text{25\%}$  $\text{True Positive Rate} = \frac{3}{3+6} = \frac{3}{9} = \text{33\%}$ | |

      Both majority and minority groups have a positive prediction rate of 25%, satisfying demographic parity, and a true positive rate (percentage of examples with the preferred label that are correctly classified) of 33%, satisfying equality of opportunity. [^1]
    references:
      - source: google-mlcc
        locator: 'Fairness: Equality of opportunity'
        url: https://developers.google.com/machine-learning/crash-course/fairness/equality-of-opportunity
    source:
      id: google-mlcc
      ref: fairness/equality-of-opportunity#q1
      url: https://developers.google.com/machine-learning/crash-course/fairness/equality-of-opportunity
    status: draft
  - id: ai-ethics-009
    type: multiple
    question: |
      You're training a model to predict adoptability of rescue dogs based on a variety of features, including breed, age, weight, temperament, and quantity of fur shed each day. Your goal is to ensure the model performs equally well on all types of dogs, irrespective of their physical or behavioral characteristics.

      You discover that 1,500 of the 5,000 examples in the training set are missing temperament values. Which of the following are potential sources of bias you should investigate?
    options:
      - text: Temperament data is more likely to be missing for certain breeds of dogs.
        correct: true
      - text: Temperament data is more likely to be missing for dogs under 12 months in age.
        correct: true
      - text: Temperament data is missing for all dogs rescued from big cities.
        correct: true
      - text: Temperament data is missing from the dataset at random.
        why: If temperament data is truly missing at random, then that would not be a potential source of bias. However, it's possible temperament data might appear to be missing at random, but further investigation might reveal an explanation for the discrepancy. So it's important to do a thorough review to rule out other possibilities, rather than assume data gaps are random.
    explanation: If the availability of temperament data correlates with dog breed, then this might result in less accurate adoptability predictions for certain dog breeds. If the availability of temperament data correlates with age, then this might result in less accurate adoptability predictions for puppies versus adult dogs. At first glance, it might not appear that this is a potential source of bias, since the missing data would affect all dogs from big cities equally, irrespective of their breed, age, weight, etc. However, we still need to consider that the location a dog is from might effectively serve as a proxy for these physical characteristics. For example, if dogs from big cities are significantly more likely to be smaller than dogs from more rural areas, that could result in less accurate adoptability predictions for lower-weight dogs or certain small-dog breeds. [^1]
    references:
      - source: google-mlcc
        locator: 'Fairness: Identifying bias'
        url: https://developers.google.com/machine-learning/crash-course/fairness/identifying-bias
    source:
      id: google-mlcc
      ref: fairness/identifying-bias#q1
      url: https://developers.google.com/machine-learning/crash-course/fairness/identifying-bias
    status: draft
  - id: ai-ethics-010
    type: single
    shuffle: false
    question: In the set of predictions shown below, which of the following pairs of identical (excluding group membership) examples received predictions that violate counterfactual fairness?
    figure:
      src: ./ai-ethics/ai-ethics-010.svg
      alt: 'Two groups of circles. Negative predictions: 50 circles in a 5 × 10 grid, 8 blue (majority group), 3 orange (minority group) and 39 gray (group unknown); one orange and one blue circle are labelled A, and one blue circle is labelled C. Positive predictions: 15 circles in a 3 × 5 grid, 3 blue, 2 orange and 10 gray; one orange and one blue circle are labelled B, and one blue circle is labelled C.'
    options:
      - text: Pair A
        why: Pair A's predictions satisfy counterfactual fairness, as both the example in the majority group (blue) and the example in the minority group (orange) received the same prediction (Negative).
      - text: Pair B
        why: Pair B's predictions satisfy counterfactual fairness, as both the example in the majority group (blue) and the example in the minority group (orange) received the same prediction (Positive).
      - text: Pair C
        why: Pair C's predictions are for two examples that both belong to the majority group (blue). The fact that the model produced different predictions for these identical examples suggests that there may be broader performance issues with the model that should be investigated. However, this result does not violate counterfactual fairness, whose conditions only apply in cases where the two identical examples are each drawn from different groups.
      - text: None of these pairs violate counterfactual fairness
        correct: true
    explanation: The predictions for Pairs A and B satisfy counterfactual fairness because in both cases, the example in the majority group and the example in the minority group receive the same prediction. Pair C's examples both belong to the same group (the majority group), so counterfactual fairness is not applicable in this case. [^1]
    references:
      - source: google-mlcc
        locator: 'Fairness: Counterfactual fairness'
        url: https://developers.google.com/machine-learning/crash-course/fairness/counterfactual-fairness
    source:
      id: google-mlcc
      ref: fairness/counterfactual-fairness#q1
      url: https://developers.google.com/machine-learning/crash-course/fairness/counterfactual-fairness
    status: draft
  - id: ai-ethics-011
    type: single
    difficulty: medium
    question: |
      Data ownership, informed consent and intellectual-property rights are data-ethics
      challenges. In which kind of activity do they mainly arise?
    options:
      - text: Collecting personal data from people
        correct: true
      - text: Choosing a model's algorithm and hyperparameters
      - text: Tuning a database so that queries run faster
      - text: Converting a chart's colors for color-blind readers
    explanation: |
      The lesson sorts data actions into two categories, data collection and algorithm design [^1].
      Collecting data usually involves personal data about identifiable people, so its challenges
      are about privacy, who owns the data, whether people gave informed consent, and who holds
      intellectual-property rights in it [^1]. Algorithm design (curating datasets and training
      models on them) raises other challenges, such as dataset bias, data quality, unfairness and
      misrepresentation [^1]. Database tuning and chart colors are technical choices that do not
      raise consent or ownership questions.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#2-ethics-challenges
        locator: 'Lesson 2: Introduction to Data Ethics, sec. 2. Ethics Challenges'
    source:
      id: ms-ds-for-beginners
      ref: quiz-2/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-012
    type: single
    difficulty: medium
    question: |
      Data ethics separates *principles* (shared values to uphold, such as those of a
      responsible-AI framework) from *challenges* (situations where an action may conflict with
      those values). Which of these is a challenge rather than a principle?
    options:
      - text: Transparency
      - text: Reliability and safety
      - text: Informed consent
        correct: true
      - text: Accountability
    explanation: |
      Microsoft's responsible-AI framework, the lesson's example of ethics principles, lists
      accountability, transparency, fairness, reliability and safety, privacy and security, and
      inclusiveness [^1]. Informed consent is one of the ethics challenges: it asks whether users
      agreed to an action such as data collection with a full understanding of its purpose, risks
      and alternatives [^1]. Transparency, accountability and reliability and safety are values to
      uphold, so they are principles [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#ethics-concepts
        locator: 'Lesson 2: Introduction to Data Ethics, sec. 1. Ethics Principles and 2.2 Informed Consent'
    source:
      id: ms-ds-for-beginners
      ref: quiz-2/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-013
    type: true_false
    difficulty: easy
    question: Data ethics also includes AI and machine learning algorithms
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Data ethics is the branch of ethics that studies and evaluates moral problems related to
      data, algorithms and the corresponding practices, where "algorithms" covers AI, agents,
      machine learning and robots [^1]. The models trained on data are therefore within its scope,
      and challenges such as dataset bias and algorithm fairness are core data-ethics topics [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#basic-definitions
        locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions'
    source:
      id: ms-ds-for-beginners
      ref: quiz-2/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-014
    type: single
    difficulty: medium
    question: What distinguishes applied ethics from ethics in general?
    options:
      - text: Applied ethics only means following the laws that regulate data
      - text: Applied ethics defines the shared values, and ethics then puts them into practice
      - text: Applied ethics investigates ethical issues in real products and processes and corrects them
        correct: true
    explanation: |
      Ethics in general is about shared values and moral principles, widely accepted norms of
      right and wrong rather than laws [^1]. Applied ethics is the practical application of these
      moral considerations: actively investigating ethical issues in real-world actions, products
      and processes, and taking corrective measures so that they stay aligned with the defined
      values [^1]. Following the law is compliance, a separate idea, and the reversed description
      swaps the roles, since ethics defines the values and applied ethics acts on them [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#basic-definitions
        locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions and 3. Ethics Regulations'
    source:
      id: ms-ds-for-beginners
      ref: quiz-3/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-015
    type: single
    difficulty: easy
    question: What is the difference between ethics regulations and ethics principles?
    options:
      - text: Ethics principles are legally binding, while regulations are voluntary guidelines
      - text: There is no difference
      - text: Ethics principles do not relate to a particular law, while regulations do
        correct: true
    explanation: |
      Ethics principles are shared values that an organization adopts voluntarily, for example in
      a responsible-AI framework; ethics rests on accepted norms of right and wrong, not on laws
      [^1]. Regulations such as GDPR, HIPAA or CCPA are government-mandated rules that an
      organization must comply with in the regions where it operates [^1]. So the binding part is
      the regulation, and the two clearly differ: ethics means doing the right thing voluntarily,
      compliance means following the law [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#3-ethics-regulations
        locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions and 3. Ethics Regulations'
    source:
      id: ms-ds-for-beginners
      ref: quiz-3/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-016
    type: multiple
    difficulty: medium
    question: Which of these are practices for applying data-ethics principles in real projects? Select all that apply.
    options:
      - text: Adopting a professional code of conduct for the team
        correct: true
      - text: Running an ethics checklist, such as Deon, before each release
        correct: true
      - text: Complying with data-protection regulations such as GDPR
        correct: true
      - text: Collection bias in the training data
    explanation: |
      The applied-ethics section names concrete practices: professional codes that guide members'
      decisions, ethics checklists that turn principles into yes/no tasks tracked in the release
      workflow (Deon is one), and compliance with data-protection regulations such as GDPR, CCPA
      or HIPAA [^1]. Collection bias is not a practice but one of the ethics challenges: selecting a
      non-representative subset of data, which can make outcomes unfair for some groups [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#applied-ethics
        locator: 'Lesson 2: Introduction to Data Ethics, sec. Applied Ethics and 2.6 Dataset Bias'
    source:
      id: ms-ds-for-beginners
      ref: quiz-3/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: ai-ethics-017
    type: single
    difficulty: easy
    question: Why do we need principles of responsible AI, given that today's AI is essentially large-scale matrix arithmetic?
    options:
      - text: It is a powerful tool that can be misused, by accident or on purpose, e.g. a biased model
        correct: true
      - text: AI systems may develop emotions and goals of their own and decide to rebel against the people who built them
      - text: AI models never make mistakes, so nobody can question or correct their decisions
      - text: Only because laws require it; a model trained on real data carries no risk
    explanation: |
      The AI in this course has no emotions or intentions; it is a powerful tool, and like any powerful
      tool it can be used for good or bad and can be misused [^1]. The principles of responsible AI exist
      to avoid accidental or deliberate misuse; for example, a model trained on biased data can prefer
      one group of people [^1]. Science-fiction rebellion assumes emotions that matrix arithmetic does
      not have, and models do make mistakes, which is why reliability and safety is itself a principle
      [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md
        locator: 'Lesson: Ethical and Responsible AI, introduction and sec. Principles of Responsible AI'
    source:
      id: ms-ai-for-beginners
      ref: quiz-124/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-018
    type: single
    difficulty: easy
    question: |
      A model suggests medical diagnoses from scans. Like every model, it has some precision and recall
      and will sometimes be wrong. Which principle of responsible AI is about understanding such errors
      to prevent the harm that wrong advice can cause?
    options:
      - text: Reliability and safety
        correct: true
      - text: Inclusiveness
      - text: Privacy and security
      - text: Transparency
    explanation: |
      Reliability and safety starts from the fact that AI models make mistakes: a network returns
      probabilities, every model has some precision and recall, and we must take that into account to
      prevent harm from wrong advice [^1]. Inclusiveness is about augmenting people and handling
      under-represented communities, privacy and security about the data a model was trained on, and
      transparency about being clear that AI is used and preferring interpretable models [^1]. Using AI
      in medicine is not unethical in itself; using it without accounting for its errors would be.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, sec. Principles of Responsible AI'
    source:
      id: ms-ai-for-beginners
      ref: quiz-124/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-019
    type: single
    difficulty: easy
    question: |
      Which principle of responsible AI says that AI should augment people rather than replace them,
      and that under-represented communities must be included and handled correctly?
    options:
      - text: Inclusiveness
        correct: true
      - text: Fairness
      - text: Accountability
      - text: Transparency
    explanation: |
      Inclusiveness means building AI to augment people and make their work more creative, not to
      replace them; it is linked to fairness because data about under-represented communities is
      likely to be biased, and those communities must be included and handled correctly [^1]. Fairness
      itself is about model bias caused by biased training data, accountability about who is
      responsible for AI decisions, and transparency about being clear that AI is used [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
        locator: 'Lesson: Ethical and Responsible AI, sec. Principles of Responsible AI'
    source:
      id: ms-ai-for-beginners
      ref: quiz-224/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-24.json
    status: draft
  - id: ai-ethics-020
    type: multiple
    difficulty: medium
    question: |
      MinDiff and counterfactual logit pairing (CLP) are two bias-mitigation techniques that change
      the loss used during training. Which of the following statements about bias mitigation are
      true? Select all that apply.
    options:
      - text: Both MinDiff and CLP penalize discrepancies in model performance tied to sensitive attributes
        correct: true
        why: Both add a penalty to the training loss for prediction errors tied to how sensitive attributes are represented in the training data.
      - text: MinDiff penalizes differences in the overall distribution of predictions for different slices of data, whereas CLP penalizes discrepancies in predictions for individual pairs of examples.
        correct: true
        why: MinDiff aligns the score distributions of two subgroups; CLP makes sure an individual example is not treated differently only because of its subgroup.
      - text: Adding more examples to the training dataset will always help counteract bias in a model's predictions.
        why: Adding more training examples is an effective strategy for mitigating bias, but the composition of the new training data matters. If the additional training examples exhibit similar imbalances to the original data, they probably won't help mitigate the existing bias.
      - text: If you are mitigating bias by adding more training data, you shouldn't also apply MinDiff or CLP during training.
        why: Augmenting training data and applying techniques like MinDiff or CLP can be complementary. For example, an ML engineer might be able to collect enough additional training data to reduce a discrepancy in performance by 30%, and then use MinDiff to further reduce the discrepancy by another 50%.
    explanation: |
      Bias can be mitigated by augmenting the training data or by adjusting the loss. Plain log loss
      ignores subgroup membership, so a fairness-aware penalty is added instead [^1]. MinDiff penalizes
      differences between the *distributions* of predictions for two slices of data, while CLP
      penalizes different predictions for a *pair* of examples that are identical except for a
      sensitive attribute [^1]. More data helps only if its composition fixes the imbalance; data that
      repeats the old skew will not. Augmenting the data and MinDiff or CLP can be combined, e.g. more
      data removes 30% of a performance gap and MinDiff a further 50% [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/fairness/mitigating-bias
        locator: 'Fairness: Mitigating bias'
    source:
      id: google-mlcc
      ref: fairness/mitigating-bias#q1
      url: https://developers.google.com/machine-learning/crash-course/fairness/mitigating-bias
    status: draft
  - id: ai-ethics-021
    type: multiple
    difficulty: medium
    question: |
      A university's admissions committee uses an ML model to select applicants for its computer
      science program. The model was built by current students of the university, who curated and
      feature-engineered the training data: the records of students admitted over the past 20
      years. Its predictions turn out to be skewed against some groups of applicants. Which types of
      bias could have contributed to the skewed predictions? Select all that apply.
    options:
      - text: Historical bias
        correct: true
        why: Records from the past 20 years can carry past inequities; if minority students were under-represented then, the model reproduces that.
      - text: In-group bias
        correct: true
        why: Students who built the model may unconsciously prefer applicants with backgrounds like their own when curating data or choosing features.
      - text: Confirmation bias
        correct: true
        why: Students who built the model may hold beliefs about which qualifications predict success and shape the data so that the model confirms them.
      - text: Automation bias
        why: Automation bias might explain why the admissions committee chose to use an ML model to make admissions decisions; they might have believed an automated system would produce better results than decisions made by humans. However, automation bias doesn't provide any insight into why the model's predictions ended up being skewed.
    explanation: |
      Historical bias occurs when historical data reflects inequities of its time, and 20 years of
      admission records can encode them [^1]. In-group bias is a preference for people of one's own
      group, and confirmation bias means processing data in ways that affirm existing beliefs; both can
      enter through how the student builders curated the data and engineered features [^1]. Automation
      bias, favouring automated results over human ones regardless of error rates, might explain why
      the committee chose a model at all, but not why the model's predictions are skewed [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/fairness/types-of-bias
        locator: 'Fairness: Types of bias'
    source:
      id: google-mlcc
      ref: fairness/types-of-bias#q1
      url: https://developers.google.com/machine-learning/crash-course/fairness/types-of-bias
    status: draft
  - id: ai-ethics-022
    type: multiple
    difficulty: easy
    question: |
      You're developing a model to quickly approve auto loans. Which of these are *ethical*
      questions you should ask about it, rather than engineering ones? Select all that apply.
    options:
      - text: Does the model perpetuate existing biases or stereotypes?
        correct: true
      - text: Are applicants' names left out of the features, so the model cannot link names to repayment?
        correct: true
      - text: Has personally identifiable information been removed from the training data?
        correct: true
      - text: Does the model serve predictions with low enough latency?
      - text: Can the model be deployed to devices, like phones?
    explanation: |
      ML systems should not perpetuate or reinforce biases and should not use personal data
      irresponsibly [^1]. For fairness, the course warns against features with little explanatory power
      in high-impact areas such as finance: in a loan model, an applicant's name is irrelevant but could
      let the model correlate male names with repayment [^1]. For privacy, personally identifiable
      information should be removed from datasets [^1]. Latency and on-device deployment matter for
      serving the model, but they are engineering requirements, not ethical ones.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/ethics
        locator: 'Managing ML Projects: AI and ML ethics and safety (Fairness, Privacy)'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/ethics#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/ethics
    status: draft
  - id: ai-ethics-023
    type: true_false
    difficulty: easy
    question: 'True or false: an ML model can only be unfair if someone built it with the intention to discriminate.'
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      False. People carry inherited biases that show up in the data used to train AI systems, and
      this often happens unintentionally, without anyone noticing [^1]. That is why Fairlearn defines
      unfair behaviour by its impact on people, the harms, rather than by its causes or by anyone's
      intent: societal biases reflected in the training data, too few data points about some group,
      or properties of the system itself can all produce it [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
      - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
        url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#fairness-of-ai-systems
        locator: Sec. Fairness of AI systems
    source:
      id: ms-ml-for-beginners
      ref: quiz-5/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-024
    type: single
    difficulty: easy
    question: Which list names the main types of fairness-related harms that an ML system can cause?
    options:
      - text: Allocation, quality of service, stereotyping, denigration, over- or under-representation
        correct: true
      - text: Reliability and safety, inclusiveness, security and privacy, transparency, accountability
      - text: Overfitting, underfitting, data leakage, label noise, concept drift
    explanation: |
      The lesson lists five fairness-related harms: allocation (favouring one group, e.g. in who
      gets a loan), quality of service (working worse for some people), denigration, over- or
      under-representation and stereotyping [^1]. Fairlearn's user guide describes allocation and
      quality-of-service harms the same way and adds others, such as erasure [^2]. Reliability and
      safety, inclusiveness, security and privacy, transparency and accountability are the
      responsible-AI principles that the same lesson covers next, not harms [^1]. Overfitting, data
      leakage and the like are technical problems of a model or its data; they can lead to harm, but
      they are not the harm types.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness (and the principle sections after it)'
      - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
        url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#types-of-harms
        locator: Sec. Types of harms
    source:
      id: ms-ml-for-beginners
      ref: quiz-5/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-025
    type: single
    difficulty: easy
    question: Which of these can make an ML model unfair?
    options:
      - text: Over-reliance on historical data that reflects past inequities
        correct: true
      - text: Under-reliance on historical data
      - text: Scaling all features to the same range before training the model
    explanation: |
      Historical bias occurs when historical data reflects inequities that existed in the world at
      the time; a model trained on such records, for example 20 years of past admissions, can
      reproduce the same inequities in its predictions [^1]. The lesson makes the same point: the
      biases people carry show up in the data used to train AI systems [^2]. Relying less on such
      data does not create this problem. Feature scaling is a routine preprocessing step that puts
      features on comparable scales [^3]; it does not add or remove any group's disadvantage.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/fairness/types-of-bias#historical_bias
        locator: 'Fairness: Types of bias, Historical bias'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
      - title: 'scikit-learn User Guide: Preprocessing data'
        url: https://scikit-learn.org/stable/modules/preprocessing.html#standardization-or-mean-removal-and-variance-scaling
        locator: Sec. 8.3.1 Standardization, or mean removal and variance scaling
    source:
      id: ms-ml-for-beginners
      ref: quiz-6/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-026
    type: multiple
    difficulty: medium
    question: Which of these are steps of a fairness assessment, the starting point for mitigating unfairness in an ML model? Select all that apply.
    options:
      - text: Identify the types of harm the system could cause and the groups that might be harmed
        correct: true
      - text: Define metrics that quantify those harms and compare them across the groups
        correct: true
      - text: Drop sensitive features such as gender, which guarantees that the model is fair
      - text: Check only the model's overall accuracy on the test set
    explanation: |
      Fairlearn describes a fairness assessment as four steps: identify the types of harm, identify
      the groups that might be harmed, quantify the harms with metrics, and compare those numbers
      across the groups [^1]. Dropping a sensitive feature guarantees nothing: unfairness can come
      from societal biases in the training data or from too few data points about some group, and
      Fairlearn notes that "sensitive" does not mean a feature must be left out; sometimes it is
      better to include it [^2]. A single overall accuracy is an aggregate, and the lesson warns
      that such aggregate metrics are not enough to see how a model treats different groups [^3].
    references:
      - title: 'Fairlearn User Guide (v0.13): Performing a Fairness Assessment'
        url: https://fairlearn.org/v0.13/user_guide/assessment/perform_fairness_assessment.html
        locator: Steps of the assessment (identify harms, identify groups, quantify, compare)
      - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
        url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#group-fairness-sensitive-features
        locator: Secs. Fairness of AI systems and Group fairness, sensitive features
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#debugging-with-responsible-ai
        locator: 'Lesson: Building ML solutions with responsible AI, sec. Debugging with responsible AI'
    source:
      id: ms-ml-for-beginners
      ref: quiz-6/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-027
    type: single
    difficulty: easy
    question: What can an open-source fairness toolkit such as Fairlearn do for you?
    options:
      - text: Compute fairness and performance metrics for each group, so you can compare models
        correct: true
      - text: Pick the most accurate model for your application automatically, with no input from you
      - text: Decide for you what counts as fair in your application
    explanation: |
      Fairlearn turns common scikit-learn accuracy and error metrics into group metrics, computed
      on the whole dataset and on each group, and reports the differences and ratios between groups
      [^1]. That lets you compare models on fairness and performance side by side. Choosing which
      model and which trade-off to accept stays with you: fairness is a contested,
      context-dependent idea, mathematical fairness metrics capture only some aspects of it, and you
      have to decide which metrics suit the situation at hand [^2].
    references:
      - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
        url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#disparity-metrics-group-metrics
        locator: Sec. Disparity metrics, group metrics
      - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
        url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#the-formalism-trap
        locator: Sec. The Formalism Trap
    source:
      id: ms-ml-for-beginners
      ref: quiz-6/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-ethics-028
    type: single
    difficulty: medium
    tags:
      - bias-measurement
      - language-models
      - crows-pairs
    question: |
      To test a masked language model for bias, you compare the probabilities it assigns to two sentences that differ
      in one word: "The tigers are looking for their prey in the jungles." versus "The compsognathus are looking for
      their prey in the jungles." The first gets a much higher probability. Why is this weak evidence that the model is
      biased against long-extinct animals?
    options:
      - text: The swapped words differ in how common they are, and raw sentence probability rewards frequent words
        correct: true
      - text: Masked language models cannot score whole sentences, so the comparison is invalid
        why: A masked model can score a sentence, e.g. by masking tokens one at a time and summing their log-probabilities, as CrowS-Pairs does.
      - text: The second sentence is ungrammatical, and ungrammatical sentences get probability zero
        why: Language models give unlikely sentences small, not zero, probability; the confound here is word frequency.
      - text: Bias can only be measured for social attributes such as gender, so animals are out of scope
        why: Bias tests can target any attribute; the problem with this test is that word frequency confounds it.
    explanation: |
      A rare word such as "compsognathus" lowers a sentence's probability simply because the model has seen it rarely
      (and it may be split into several unlikely subword tokens), whatever the model "thinks" about the referent [^1].
      The CrowS-Pairs metric therefore masks the tokens the two sentences share, one at a time, and sums their
      log-probabilities given the rest, so the differing words are conditioned on rather than scored [^1][^2]. NMA's
      simplified demo uses raw probabilities, which is acceptable only because its word pairs were chosen with similar
      frequencies [^1].
    references:
      - source: neuromatch-dl
        locator: W3D1 Tutorial 1, Section 8 Ethics in language models, Think! 8.1 Problems of this approach
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
      - title: 'Nangia et al. (2020), CrowS-Pairs: A Challenge Dataset for Measuring Social Biases in Masked Language Models'
        url: https://aclanthology.org/2020.emnlp-main.154/
        locator: Bias metric (pseudo-log-likelihood over the unmodified tokens)
    source:
      id: neuromatch-dl
      ref: W3D1_AttentionAndTransformers/W3D1_Tutorial1#think8.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D1_AttentionAndTransformers/instructor/W3D1_Tutorial1.ipynb
    status: draft
  - id: ai-ethics-029
    type: single
    difficulty: medium
    tags:
      - dataset-bias
      - shortcut-learning
      - self-supervised-learning
    question: |
      In a biased training set every square appears on the left of the image and every heart on the right; the test
      set has both shapes everywhere. A supervised shape classifier drops to chance on the test set, while a linear
      classifier on a SimCLR encoder (pretrained without labels, with random translations among its augmentations)
      stays accurate. Why?
    options:
      - text: The supervised model can use horizontal position as a shortcut; translation augmentations make SimCLR features ignore position
        correct: true
      - text: SimCLR was pretrained on the test images, so it has seen every shape at every position
        why: SimCLR is pretrained on augmented training images and never sees the test set; the augmentations create the robustness.
      - text: The supervised model has too few parameters to recognize shapes, so it falls back on guessing
        why: The same model classifies shapes well on unbiased data; on biased data, position is simply an easier cue for the label.
      - text: Linear classifiers cannot overfit, so any linear probe is robust to biases in its training data
        why: A linear classifier on position-sensitive features would learn the same shortcut; robustness comes from features that ignore position.
    explanation: |
      In the biased training set position perfectly predicts shape, so a supervised network can learn "left means
      square" instead of the shape itself, and that rule fails on the test set [^1]. SimCLR is pretrained to give two
      augmented views of the same image similar features; since the views differ by random translations, the encoder
      becomes insensitive to position and cannot pass the shortcut to the classifier [^1][^2]. Choosing such
      augmentations requires knowing which factors the task should ignore, which is easy in this toy setting and hard
      with real data, so reducing bias in data collection still matters [^1].
    references:
      - source: neuromatch-dl
        locator: W3D3 Tutorial 1, Section 7 Ethical considerations for self-supervised learning from biased datasets, Discussion 7.1.1
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W3D3_UnsupervisedAndSelfSupervisedLearning/instructor/W3D3_Tutorial1.ipynb
      - title: Chen et al. (2020), A Simple Framework for Contrastive Learning of Visual Representations (SimCLR)
        url: https://arxiv.org/abs/2002.05709
        locator: Sec. 2.1 The Contrastive Learning Framework
    source:
