topic: ai-intro
title: AI Foundations & History
questions:
  - id: ai-intro-001
    type: true_false
    difficulty: easy
    question: Weak AI is a system designed to solve many tasks
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Weak (narrow) AI is designed and trained for one specific task or a narrow set of tasks, such
      as a voice assistant or a recommendation algorithm, so the statement is false [^1]. A system
      able to take on any intellectual task a human can is called strong AI, or artificial general
      intelligence, and it remains a theoretical goal [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
        locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
    source:
      id: ms-ai-for-beginners
      ref: quiz-101/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: draft
  - id: ai-intro-002
    type: single
    difficulty: easy
    question: A top-down approach to AI is a model of reasoning called
    options:
      - text: strategic reasoning
      - text: symbolic reasoning
        correct: true
      - text: synergistic reasoning
    explanation: |
      The top-down approach models the way a person reasons: it extracts knowledge from human
      experts, represents it in a computer-readable form and adds a mechanism for reasoning over it.
      This is called symbolic reasoning [^1]. Its counterpart, the bottom-up approach, models the
      brain with neural networks instead [^1]. "Strategic" and "synergistic" reasoning are not names
      of AI approaches; the similar-sounding synergetic approach is the emergent, multi-agent one, in
      which intelligence arises from many simple interacting agents [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#different-approaches-to-ai
        locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and The Top-Down Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: draft
  - id: ai-intro-003
    type: true_false
    difficulty: easy
    question: A bottom-up approach to AI is based on neural networks
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      The bottom-up approach copies the brain's structure rather than its conscious reasoning: it
      builds a network of many simple artificial neurons, each acting like a weighted average of its
      inputs, and trains the network on example data [^1]. The top-down approach is the opposite: it
      encodes human knowledge and reasoning as symbols and rules [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#bottom-up-approach
        locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and Bottom-Up Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: draft
  - id: ai-intro-004
    type: single
    difficulty: easy
    question: The AI Winter occurred in this era
    options:
      - text: 1950s
      - text: 1960s
      - text: 1970s
        correct: true
    explanation: |
      Early AI relied on symbolic expert systems, but extracting knowledge from experts and keeping
      knowledge bases accurate turned out to be too complex and expensive, which led to the AI Winter
      of the 1970s [^1]. The ML history lesson dates it to 1974–1980, when compute was too limited,
      problems exploded combinatorially and funding dried up [^2]. The 1950s and 1960s were the
      founding years and the optimistic, well-funded "golden years", not a downturn [^2]. A second,
      milder slump, the "AI chill", came later, in 1987–1993 [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
        locator: 'Lesson: Introduction to AI, sec. A Brief History of AI'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, secs. 1956 - 1974 "The golden years" and 1974 - 1980 "AI Winter"'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: draft
  - id: ai-intro-005
    type: single
    difficulty: easy
    question: Approximately when was the term 'artificial intelligence' coined?
    options:
      - text: 1980s
      - text: 1950s
        correct: true
      - text: 1930s
    explanation: |
      The phrase "artificial intelligence" appears in the proposal McCarthy, Minsky, Rochester and
      Shannon wrote on 31 August 1955 for a summer study at Dartmouth College [^2]. That 1956
      Dartmouth Summer Research Project is where the field got its name [^1][^3], so the answer is the
      1950s. The 1930s predate the field, and the 1980s are known for the spread of commercial
      expert systems [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
        locator: 'Lesson: History of machine learning, sec. 1956: Dartmouth Summer Research Project'
      - title: McCarthy, Minsky, Rochester & Shannon, A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence (1955)
        url: http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf
        locator: Title page and p. 1
      - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
        url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
        locator: Page text (1956)
    source:
      id: ms-ml-for-beginners
      ref: quiz-3/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-intro-006
    type: single
    difficulty: easy
    question: What is one of the reasons that advancement in AI slowed in the 1970s?
    options:
      - text: Limited compute power
        correct: true
      - text: Not enough skilled engineers
      - text: Conflicts between countries
    explanation: |
      By the mid-1970s it was clear that building intelligent machines was harder than promised,
      and the first limitation the lesson lists is that compute power was too limited [^1]. Related
      problems were combinatorial explosion (the parameters needed grew exponentially while computing
      power did not keep up) and a lack of data, so funding dried up [^1]. A shortage of engineers or
      conflicts between countries are not among the causes the lesson gives [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
    source:
      id: ms-ml-for-beginners
      ref: quiz-3/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-intro-007
    type: single
    difficulty: easy
    question: Which event was foundational in the creation and expansion of the field of artificial intelligence?
    options:
      - text: Turing Test
      - text: Dartmouth Summer Research Project
        correct: true
      - text: AI Winter
    explanation: |
      The 1956 Dartmouth Summer Research Project is called a seminal event for AI as a field: the
      term "artificial intelligence" was coined there, and it started discussions on symbolic methods
      and early expert systems [^1][^2]. Turing's test (1950) proposed a way to judge whether a machine
      can think; it shaped the idea of AI but was not the event that founded the field [^1]. The AI
      Winter was a later period of lost funding and confidence, the opposite of expansion [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
        locator: 'Lesson: History of machine learning, secs. 1950: Machines that think, 1956: Dartmouth Summer Research Project, 1974 - 1980: "AI Winter"'
      - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
        url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
        locator: Page text (1956)
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-intro-008
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - deep-learning
    question: How is deep learning related to machine learning and AI?
    options:
      - text: It is the entire field of AI, covering every kind of intelligent method.
        why: AI is the broad field; deep learning is only one part of machine learning inside it.
      - text: It is a rule-based approach in which experts hand-code every decision.
        why: Hand-written rules are the opposite of learning from data.
      - text: It is a branch of machine learning that learns representations through many stacked layers.
        correct: true
      - text: It is a technique that can only group unlabeled data.
        why: That describes clustering; deep learning also does classification, regression and generation.
    explanation: AI is the broad field, machine learning is the part of AI that learns patterns from data, and deep learning is the part of machine learning that uses multi-layer neural networks to learn features automatically [^1]. This layered representation learning is what the 'deep' refers to [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 5–6
      - source: d2l
        locator: Ch. 1 Introduction
        url: https://d2l.ai/chapter_introduction/index.html
        quote: It is deep in precisely the sense that its models learn many layers of transformations.
    source:
      id: ncu-intro-dl
      ref: exercise-01/q01
    status: reviewed
  - id: ai-intro-009
    type: single
    difficulty: easy
    question: |
      A customer-service chatbot holds fluent text conversations, and some users cannot tell it
      apart from a human. Is it a truly intelligent system in the sense of strong AI?
    options:
      - text: 'No: it is narrow AI built for one task, and fooling some people does not prove general intelligence'
        correct: true
      - text: 'Yes: any program that some people mistake for a human has passed the Turing test and is therefore strong AI'
      - text: 'Yes: chatbots follow explicit rules, and a rule-following program counts as strong AI'
      - text: 'No: chatbots can only be built from hand-written rules, never from neural networks'
    explanation: |
      Weak (narrow) AI is designed and trained for a specific task; the lesson's own examples include
      virtual assistants and chatbots built for specific customer-service tasks. Strong AI (AGI) would
      handle any intellectual task a human can, and no system has reached it yet [^1]. Fooling some
      judges is not proof either: the chatbot Eugene Goostman convinced 30% of judges in 5-minute chats
      by pretending to be a 13-year-old boy, yet that did not mean an intelligent system had been built;
      its creators, not the program, fooled the judges [^2]. Following rules does not make a system
      strong AI, and modern assistants are in fact hybrids that use neural networks to recognise
      speech and intent [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
        locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#the-definition-of-intelligence-and-the-turing-test
        locator: 'Lesson: Introduction to AI, sec. The Definition of Intelligence and the Turing Test'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
        locator: 'Lesson: Introduction to AI, sec. A Brief History of AI ("talking programs")'
    source:
      id: ms-ai-for-beginners
      ref: quiz-101/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: draft
  - id: ai-intro-010
    type: single
    difficulty: medium
    question: Early AI systems such as ELIZA and SHRDLU are often called 'scruffy'. What distinguished 'scruffy' from 'neat' AI?
    options:
      - text: Scruffy labs tweaked programs by hand until they behaved as desired; neat labs relied on logic and formal problem solving
        correct: true
      - text: Scruffy systems learned their behaviour from large collections of data, while neat systems followed rules written by hand
      - text: Scruffy systems ran on cheap hardware; neat systems needed supercomputers
    explanation: |
      In the 1970s, AI split into two schools: "scruffy" labs tweaked their programs for hours
      until they got the results they wanted, while "neat" labs focused on logic and formal problem
      solving. ELIZA and SHRDLU were well-known scruffy systems [^1]. The split was about method,
      not data or hardware: ELIZA, for example, worked by spotting keywords and rearranging the
      user's words into canned replies, with no learning from data [^2], and data was scarce in that
      era anyway [^1]. In the 1980s, as demand grew for reproducible systems, the neat approach
      gained ground because its results are easier to explain [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#developing-eliza
        locator: 'Lesson: Introduction to natural language processing, sec. Developing Eliza'
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-intro-011
    type: single
    difficulty: easy
    question: In AI research of the 1960s and 1970s, what was the 'blocks world'?
    options:
      - text: A simple micro-world of blocks to stack and sort, for testing decision-making and language programs like SHRDLU
        correct: true
      - text: A 3D video game used since the 2010s to benchmark deep reinforcement learning agents
      - text: A large dataset of photographs of toy blocks, collected in the 1970s to train the first object detectors for robots
    explanation: |
      During the "golden years" (1956–1974), researchers created "micro-worlds", simple settings in
      which tasks were carried out from plain-language instructions [^1]. The blocks world was one:
      blocks could be stacked and sorted, which made it a testbed for teaching machines to make
      decisions, and programs such as SHRDLU built for it helped push language processing forward
      [^1]. It was a symbolic simulation, not a photo dataset and not a deep reinforcement learning
      benchmark, which came decades later; the lack of data was in fact one of the problems of that
      era [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956---1974-the-golden-years
        locator: 'Lesson: History of machine learning, secs. 1956 - 1974: "The golden years" and 1974 - 1980: "AI Winter"'
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ai-intro-012
    type: single
    difficulty: medium
    question: What did Alan Turing's 'Turing test' check about a computer?
    options:
      - text: Whether a human judge, chatting by text, could not tell its replies from a person's
        correct: true
      - text: Whether it truly understands the meaning of the sentences it reads and writes
      - text: Whether it can solve arithmetic problems faster and more accurately than a human expert
    explanation: |
      Turing considered the question "can machines think?" too vague to discuss and replaced it with
      a more precise one: can a computer do well in the imitation game [^1]? In the test, a human
      exchanges typed messages and must decide whether the replies come from a person or a
      machine; the machine counts as intelligent if the human finds them hard to tell apart
      [^2][^3]. The test looks at behaviour only. Whether passing it shows real understanding is
      what critics dispute: the Chinese-room argument holds that a program may appear to understand
      language without understanding it [^4]. Speed at arithmetic was never the criterion.
    references:
      - title: 'Stanford Encyclopedia of Philosophy: The Turing Test'
        url: https://plato.stanford.edu/entries/turing-test/
        locator: Introduction (preamble)
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#roots
        locator: Sec. 1.4 Roots
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#the-turing-test
        locator: "Lesson: Introduction to natural language processing, secs. The 'Turing test' and The inspiration - 'the imitation game'"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter" (Chinese room)'
