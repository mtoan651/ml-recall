schema_version: 1
domain: ai
topic: ai-intro
title: AI Foundations & History
questions:
  - id: ai-intro-001
    type: true_false
    difficulty: easy
    question: Weak AI is a system designed to solve many tasks
    options:
      - text: 'True'
        why: Weak (narrow) AI is built for one task or a narrow set of tasks; handling any task a human can is the aim of strong AI.
      - text: 'False'
        correct: true
    explanation: |
      Weak (narrow) AI is designed and trained for one specific task or a narrow set of tasks, such
      as a voice assistant or a recommendation algorithm, so the statement is false [^1]. A system
      able to take on any intellectual task a human can is called strong AI, or artificial general
      intelligence, and it remains a theoretical goal [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
        locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
    source:
      id: ms-ai-for-beginners
      ref: quiz-101/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-002
    type: single
    difficulty: easy
    question: A top-down approach to AI is a model of reasoning called
    options:
      - text: strategic reasoning
        why: This is not the name of an AI approach; modelling human reasoning top-down is called symbolic reasoning.
      - text: symbolic reasoning
        correct: true
      - text: synergistic reasoning
        why: This is not an AI approach; the similar-sounding synergetic approach is the emergent, multi-agent one, not the top-down one.
    explanation: |
      The top-down approach models the way a person reasons: it extracts knowledge from human
      experts, represents it in a computer-readable form and adds a mechanism for reasoning over it.
      This is called symbolic reasoning [^1]. Its counterpart, the bottom-up approach, models the
      brain with neural networks instead [^1]. "Strategic" and "synergistic" reasoning are not names
      of AI approaches; the similar-sounding synergetic approach is the emergent, multi-agent one, in
      which intelligence arises from many simple interacting agents [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#different-approaches-to-ai
        locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and The Top-Down Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-003
    type: true_false
    difficulty: easy
    question: A bottom-up approach to AI is based on neural networks
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The bottom-up approach models the brain's neurons with artificial neural networks trained on example data.
    explanation: |
      The bottom-up approach copies the brain's structure rather than its conscious reasoning: it
      builds a network of many simple artificial neurons, each acting like a weighted average of its
      inputs, and trains the network on example data [^1]. The top-down approach is the opposite: it
      encodes human knowledge and reasoning as symbols and rules [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#bottom-up-approach
        locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and Bottom-Up Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-004
    type: single
    difficulty: easy
    question: The AI Winter occurred in this era
    options:
      - text: 1950s
        why: The 1950s were the founding years of the field, including the 1956 Dartmouth workshop.
      - text: 1960s
        why: The 1960s fell in the optimistic, well-funded "golden years" (1956–1974).
      - text: 1970s
        correct: true
    explanation: |
      Early AI relied on symbolic expert systems, but extracting knowledge from experts and keeping
      knowledge bases accurate turned out to be too complex and expensive, which led to the AI Winter
      of the 1970s [^1]. The ML history lesson dates it to 1974–1980, when compute was too limited,
      problems exploded combinatorially and funding dried up [^2]. The 1950s and 1960s were the
      founding years and the optimistic, well-funded "golden years", not a downturn [^2]. A second,
      milder slump, the "AI chill", came later, in 1987–1993 [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
        locator: 'Lesson: Introduction to AI, sec. A Brief History of AI'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, secs. 1956 - 1974 "The golden years" and 1974 - 1980 "AI Winter"'
    source:
      id: ms-ai-for-beginners
      ref: quiz-201/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-005
    type: single
    difficulty: easy
    question: Approximately when was the term 'artificial intelligence' coined?
    options:
      - text: 1980s
        why: By the 1980s the field was well established; that decade is known for commercial expert systems.
      - text: 1950s
        correct: true
      - text: 1930s
        why: The 1930s predate the field; the term first appears in a 1955 proposal for a Dartmouth workshop.
    explanation: |
      The phrase "artificial intelligence" appears in the proposal McCarthy, Minsky, Rochester and
      Shannon wrote on 31 August 1955 for a summer study at Dartmouth College [^2]. That 1956
      Dartmouth Summer Research Project is where the field got its name [^1][^3], so the answer is the
      1950s. The 1930s predate the field, and the 1980s are known for the spread of commercial
      expert systems [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
        locator: 'Lesson: History of machine learning, sec. 1956: Dartmouth Summer Research Project'
      - title: McCarthy, Minsky, Rochester & Shannon, A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence (1955)
        url: http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf
        locator: Title page and p. 1
      - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
        url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
        locator: Page text (1956)
    source:
      id: ms-ml-for-beginners
      ref: quiz-3/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-006
    type: single
    difficulty: easy
    question: What is one of the reasons that advancement in AI slowed in the 1970s?
    options:
      - text: Limited compute power
        correct: true
      - text: Not enough skilled engineers
        why: The lesson names limited compute, combinatorial explosion and a lack of data, not a shortage of engineers.
      - text: Conflicts between countries
        why: Political conflicts are not among the causes given; the slowdown came from technical limits and the loss of funding that followed.
    explanation: |
      By the mid-1970s it was clear that building intelligent machines was harder than promised,
      and the first limitation the lesson lists is that compute power was too limited [^1]. Related
      problems were combinatorial explosion (the parameters needed grew exponentially while computing
      power did not keep up) and a lack of data, so funding dried up [^1]. A shortage of engineers or
      conflicts between countries are not among the causes the lesson gives [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
    source:
      id: ms-ml-for-beginners
      ref: quiz-3/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-007
    type: single
    difficulty: easy
    question: Which event was foundational in the creation and expansion of the field of artificial intelligence?
    options:
      - text: Turing's 1950 paper proposing the Turing test
        why: Turing's paper shaped the idea of machine intelligence, but the field was founded and named at Dartmouth six years later.
      - text: Dartmouth Summer Research Project
        correct: true
      - text: The funding collapse of the AI Winter
        why: The AI Winter was a later period of lost funding and confidence, the opposite of expansion.
    explanation: |
      The 1956 Dartmouth Summer Research Project is called a seminal event for AI as a field: the
      term "artificial intelligence" was coined there, and it started discussions on symbolic methods
      and early expert systems [^1][^2]. Turing's test (1950) proposed a way to judge whether a machine
      can think; it shaped the idea of AI but was not the event that founded the field [^1]. The AI
      Winter was a later period of lost funding and confidence, the opposite of expansion [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
        locator: 'Lesson: History of machine learning, secs. 1950: Machines that think, 1956: Dartmouth Summer Research Project, 1974 - 1980: "AI Winter"'
      - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
        url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
        locator: Page text (1956)
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-008
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - deep-learning
    question: How is deep learning related to machine learning and AI?
    options:
      - text: It is the entire field of AI, covering every kind of intelligent method.
        why: AI is the broad field; deep learning is only one part of machine learning inside it.
      - text: It is a rule-based approach in which experts hand-code every decision.
        why: Hand-written rules are the opposite of learning from data.
      - text: It is a branch of machine learning that learns representations through many stacked layers.
        correct: true
      - text: It is a technique that can only group unlabeled data.
        why: That describes clustering; deep learning also does classification, regression and generation.
    explanation: AI is the broad field, machine learning is the part of AI that learns patterns from data, and deep learning is the part of machine learning that uses multi-layer neural networks to learn features automatically [^1]. This layered representation learning is what the 'deep' refers to [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 5–6
      - source: d2l
        locator: Ch. 1 Introduction
        url: https://d2l.ai/chapter_introduction/index.html
        quote: It is deep in precisely the sense that its models learn many layers of transformations.
    source:
      id: ncu-intro-dl
      ref: exercise-01/q01
    status: reviewed
    reviewed_by: owner
  - id: ai-intro-009
    type: single
    difficulty: easy
    question: |
      A customer-service chatbot holds fluent text conversations, and some users cannot tell it
      apart from a human. Is it a truly intelligent system in the sense of strong AI?
    options:
      - text: 'No: it is narrow AI built for one task, and fooling some people does not prove general intelligence'
        correct: true
      - text: 'Yes: any program that some people mistake for a human has passed the Turing test and is therefore strong AI'
        why: 'Fooling some judges does not prove intelligence: Eugene Goostman convinced 30% of judges with a persona trick.'
      - text: 'Yes: chatbots follow explicit rules, and a rule-following program counts as strong AI'
        why: Following rules says nothing about general intelligence; strong AI would handle any intellectual task a human can.
      - text: 'No: chatbots can only be built from hand-written rules, never from neural networks'
        why: 'The "No" is right but the reason is wrong: modern assistants use neural networks to recognize speech and intent.'
    explanation: |
      Weak (narrow) AI is designed and trained for a specific task; the lesson's own examples include
      virtual assistants and chatbots built for specific customer-service tasks. Strong AI (AGI) would
      handle any intellectual task a human can, and no system has reached it yet [^1]. Fooling some
      judges is not proof either: the chatbot Eugene Goostman convinced 30% of judges in 5-minute chats
      by pretending to be a 13-year-old boy, yet that did not mean an intelligent system had been built;
      its creators, not the program, fooled the judges [^2]. Following rules does not make a system
      strong AI, and modern assistants are in fact hybrids that use neural networks to recognise
      speech and intent [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
        locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#the-definition-of-intelligence-and-the-turing-test
        locator: 'Lesson: Introduction to AI, sec. The Definition of Intelligence and the Turing Test'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
        locator: 'Lesson: Introduction to AI, sec. A Brief History of AI ("talking programs")'
    source:
      id: ms-ai-for-beginners
      ref: quiz-101/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-1.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-010
    type: single
    difficulty: medium
    question: Early AI systems such as ELIZA and SHRDLU are often called 'scruffy'. What distinguished 'scruffy' from 'neat' AI?
    options:
      - text: Scruffy labs tweaked programs by hand until they behaved as desired; neat labs relied on logic and formal problem solving
        correct: true
      - text: Scruffy systems learned their behaviour from large collections of data, while neat systems followed rules written by hand
        why: Neither school learned from large data, which was scarce at the time; ELIZA, for example, used hand-written keyword rules.
      - text: Scruffy systems ran on cheap hardware; neat systems needed supercomputers
        why: The split was about method (hand-tweaking versus formal logic), not about hardware.
    explanation: |
      In the 1970s, AI split into two schools: "scruffy" labs tweaked their programs for hours
      until they got the results they wanted, while "neat" labs focused on logic and formal problem
      solving. ELIZA and SHRDLU were well-known scruffy systems [^1]. The split was about method,
      not data or hardware: ELIZA, for example, worked by spotting keywords and rearranging the
      user's words into canned replies, with no learning from data [^2], and data was scarce in that
      era anyway [^1]. In the 1980s, as demand grew for reproducible systems, the neat approach
      gained ground because its results are easier to explain [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#developing-eliza
        locator: 'Lesson: Introduction to natural language processing, sec. Developing Eliza'
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-011
    type: single
    difficulty: easy
    question: In AI research of the 1960s and 1970s, what was the 'blocks world'?
    options:
      - text: A simple micro-world of blocks to stack and sort, for testing decision-making and language programs like SHRDLU
        correct: true
      - text: A 3D video game used since the 2010s to benchmark deep reinforcement learning agents
        why: The blocks world dates from the 1960s and 1970s, decades before deep reinforcement learning.
      - text: A large dataset of photographs of toy blocks, collected in the 1970s to train the first object detectors for robots
        why: It was a symbolic micro-world, not a photo dataset; data was in fact scarce in that era.
    explanation: |
      During the "golden years" (1956–1974), researchers created "micro-worlds", simple settings in
      which tasks were carried out from plain-language instructions [^1]. The blocks world was one:
      blocks could be stacked and sorted, which made it a testbed for teaching machines to make
      decisions, and programs such as SHRDLU built for it helped push language processing forward
      [^1]. It was a symbolic simulation, not a photo dataset and not a deep reinforcement learning
      benchmark, which came decades later; the lack of data was in fact one of the problems of that
      era [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956---1974-the-golden-years
        locator: 'Lesson: History of machine learning, secs. 1956 - 1974: "The golden years" and 1974 - 1980: "AI Winter"'
    source:
      id: ms-ml-for-beginners
      ref: quiz-4/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-012
    type: single
    difficulty: medium
    question: What did Alan Turing's 'Turing test' check about a computer?
    options:
      - text: Whether a human judge, chatting by text, could not tell its replies from a person's
        correct: true
      - text: Whether it truly understands the meaning of the sentences it reads and writes
        why: The test looks only at behaviour; whether passing it shows real understanding is exactly what the Chinese-room argument disputes.
      - text: Whether it can solve arithmetic problems faster and more accurately than a human expert
        why: Arithmetic speed was never the criterion; the test is a text conversation judged by a human.
    explanation: |
      Turing considered the question "can machines think?" too vague to discuss and replaced it with
      a more precise one: can a computer do well in the imitation game [^1]? In the test, a human
      exchanges typed messages and must decide whether the replies come from a person or a
      machine; the machine counts as intelligent if the human finds them hard to tell apart
      [^2][^3]. The test looks at behaviour only. Whether passing it shows real understanding is
      what critics dispute: the Chinese-room argument holds that a program may appear to understand
      language without understanding it [^4]. Speed at arithmetic was never the criterion.
    references:
      - title: 'Stanford Encyclopedia of Philosophy: The Turing Test'
        url: https://plato.stanford.edu/entries/turing-test/
        locator: Introduction (preamble)
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#roots
        locator: Sec. 1.4 Roots
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#the-turing-test
        locator: "Lesson: Introduction to natural language processing, secs. The 'Turing test' and The inspiration - 'the imitation game'"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter" (Chinese room)'
    source:
      id: ms-ml-for-beginners
      ref: quiz-31/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-013
    type: single
    difficulty: easy
    tags:
      - definitions-of-ai
      - rational-agent
    question: |
      One textbook definition says AI is the study of agents that, given what they perceive and
      know, choose the action expected to achieve the best outcome. Which of the four classic
      approaches to defining AI does this follow?
    options:
      - text: Acting rationally (the rational-agent approach)
        correct: true
      - text: Acting humanly (the Turing-test approach)
        why: Acting humanly judges a system by whether its behaviour is indistinguishable from a person's, not by whether it achieves the best outcome.
      - text: Thinking humanly (the cognitive-modelling approach)
        why: Thinking humanly compares a program's internal steps with how people think; the definition here is about choosing actions.
      - text: Thinking rationally (the "laws of thought" approach)
        why: Thinking rationally is about correct logical inference; the definition here is about acting to achieve the best expected outcome.
    explanation: |
      Definitions of AI are traditionally sorted along two axes: thinking versus acting, and
      measuring against human performance versus against an ideal of rationality, giving four
      approaches [^1]. In the agent-based view, an agent senses its environment and acts on it, and
      a rational agent picks whichever action it expects to score best on its performance measure,
      given what it has perceived so far and what it already knows [^2]. That is the "acting
      rationally" approach [^1][^2].
    references:
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 1 Introduction'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 1.1 What Is AI? (1.1.1 Acting humanly to 1.1.4 Acting rationally)
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Agent-based_definition_of_artificial_intelligence
        locator: Agent-based definition of artificial intelligence
    source:
      id: original
      ref: ai-intro-013
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-014
    type: single
    difficulty: medium
    tags:
      - turing-test
      - critique
    question: |
      Russell and Norvig compare the Turing test to an aeronautics that would define its goal as
      building machines that fly so much like pigeons that other pigeons are fooled. What criticism
      of the test does the analogy make?
    options:
      - text: It rewards imitating humans instead of testing intelligent behaviour on the task itself
        correct: true
      - text: It is too easy, because human judges are always fooled by chatbots
        why: The analogy is about what the test measures (imitation), not about how easy it is to pass.
      - text: Machines can never think, so any behavioural test of thinking is pointless
        why: The analogy does not deny that machines can be intelligent; Russell and Norvig accept judging intelligence by external behaviour.
      - text: The test should use spoken conversation instead of typed text, since speech is harder to fake
        why: The analogy says nothing about the channel; it questions imitation as the goal.
    explanation: |
      An aircraft is judged on its flying, not on how bird-like it is. Likewise, AI
      researchers test their programs directly on the tasks they target, such as object
      recognition or logistics, rather than on whether they pass as human; Russell and Norvig note
      that little research effort goes into passing the Turing test [^1]. A related weakness is
      that the test measures human-likeness, not intelligence: it requires imitating unintelligent
      human behaviour and cannot measure intelligence beyond the human level [^1]. Russell and
      Norvig still agree with Turing that intelligence should be judged by behaviour [^2].
    references:
      - title: 'Wikipedia: Turing test'
        url: https://en.wikipedia.org/wiki/Turing_test#Weaknesses
        locator: 'Weaknesses: Human intelligence vs. intelligence in general; Impracticality and irrelevance: the Turing test and AI research'
      - title: 'Wikipedia: Artificial intelligence'
        url: https://en.wikipedia.org/wiki/Artificial_intelligence#Defining_artificial_intelligence
        locator: Philosophy, Defining artificial intelligence
    source:
      id: original
      ref: ai-intro-014
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-015
    type: multiple
    difficulty: hard
    tags:
      - turing-test
      - critique
    question: |
      Which of these are weaknesses of the standard (text-only) Turing test as a measure of machine
      intelligence? Select all that apply.
    options:
      - text: To pass, a machine must also imitate unintelligent human habits, such as typing errors
        correct: true
      - text: A machine far smarter than any human would have to hide its abilities to pass
        correct: true
      - text: It demands vision and the ability to handle objects, which chatbots lack
        why: The standard test is a typed conversation; perception and manipulation are added only in Harnad's "Total Turing test" variant.
      - text: Only a program whose internal reasoning copies the human brain can pass it
        why: The test looks only at external behaviour; it says nothing about how the program works inside.
    explanation: |
      The Turing test checks whether a machine behaves like a human, and human behaviour is not the
      same as intelligent behaviour [^1]. It requires unintelligent human behaviour too: the first
      Loebner Prize winner succeeded partly by imitating typing errors. And it cannot reward
      intelligence beyond the human level, since a machine that solved problems no person could
      solve would give itself away [^1]. The test is purely behavioural, so it makes no demand on the
      program's internals; perception and object manipulation are extra requirements of the Total
      Turing test proposed by Harnad [^1]. Naive interrogators are another weakness: simple
      programs like ELIZA have fooled people who did not expect a machine [^1].
    references:
      - title: 'Wikipedia: Turing test'
        url: https://en.wikipedia.org/wiki/Turing_test#Weaknesses
        locator: 'Weaknesses (Naïveté of interrogators; Human intelligence vs. intelligence in general); Variations: Total Turing test'
    source:
      id: original
      ref: ai-intro-015
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-016
    type: true_false
    difficulty: medium
    tags:
      - chinese-room
      - turing-test
      - strong-ai
    question: |
      True or false: Searle's Chinese room argument claims that no computer program could ever
      answer questions in Chinese as well as a native speaker.
    options:
      - text: 'True'
        why: The thought experiment assumes a program whose Chinese answers are indistinguishable from a native speaker's; it disputes understanding, not performance.
      - text: 'False'
        correct: true
    explanation: |
      Searle imagines a program that answers Chinese questions so well that people cannot tell it
      from a Chinese speaker, then imagines himself following the same program by hand without
      understanding a word [^1]. His conclusion is that running a program, however human-like its
      behaviour, does not give a computer understanding or a mind, so passing the Turing test would
      not prove that a machine thinks [^1][^2]. The argument therefore sets no limit on how
      intelligently a machine can behave, which is why many computer scientists do not see it as an
      argument against the goals of mainstream AI research [^1].
    references:
      - title: 'Wikipedia: Chinese room'
        url: https://en.wikipedia.org/wiki/Chinese_room
        locator: Introduction
      - title: 'Wikipedia: Turing test'
        url: https://en.wikipedia.org/wiki/Turing_test#The_Chinese_room
        locator: History, The Chinese room
    source:
      id: original
      ref: ai-intro-016
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-017
    type: single
    difficulty: easy
    tags:
      - peas
      - task-environment
      - agents
    question: |
      In a PEAS description (Performance measure, Environment, Actuators, Sensors) of an e-mail
      spam filter, which item belongs to the **actuators**?
    options:
      - text: Moving a message into the spam folder
        correct: true
      - text: The text and headers of each incoming message
        why: This is what the filter perceives, so it belongs to the sensors.
      - text: The share of spam caught without losing legitimate mail
        why: This is how success is judged, so it is the performance measure.
      - text: The mail server, the user and the people who send messages
        why: This is the world the filter works in, so it is the environment.
    explanation: |
      An agent takes in its environment through sensors and changes it through actuators, and a
      performance measure says how well it is doing [^1]. PEAS lists these four parts to specify a
      task environment before designing the agent [^2]. For the spam filter, the action it takes on
      its environment is filing a message (into the inbox or the spam folder); the message content is
      a percept, and the catch rate without false alarms is the performance measure [^1][^2].
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Agent-based_definition_of_artificial_intelligence
        locator: Agent-based definition of artificial intelligence (sensors, actuators, performance measure)
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.1 Specifying the task environment (PEAS)
    source:
      id: original
      ref: ai-intro-017
