    reviewed_by: claude
  - id: ai-intro-018
    type: single
    difficulty: easy
    tags:
      - task-environment
      - episodic
      - sequential
    question: |
      Which of these tasks is **episodic**, i.e. made of separate decisions, none of which
      affects the later ones?
    options:
      - text: A plant app names the species shown in each uploaded photo
        correct: true
      - text: A chess program chooses its next move in a game
        why: Each move changes the position and so the options later in the game; chess is sequential.
      - text: A robot vacuum decides where to move next while cleaning a house
        why: Where it moves now determines where it can go and what is left to clean later; this is sequential.
      - text: A chatbot chooses its next reply in a multi-turn conversation
        why: Each reply shapes the rest of the conversation, so the task is sequential.
    explanation: |
      Episodicity asks whether what an agent does in one period of time influences later periods
      [^1]. When it does not, the task falls apart into self-contained rounds and each decision can
      be made on its own; when it does, the task is sequential and a choice now can constrain
      everything that follows [^1][^2]. Naming the plant in one photo changes neither the next photo
      nor the next answer, so the identification task is episodic.
      Moves in a game, steps of a robot and turns in a dialogue all shape what comes later, so an
      agent in those tasks must plan ahead [^2].
    references:
      - title: 'Wikipedia: Multi-agent system'
        url: https://en.wikipedia.org/wiki/Multi-agent_system#Concept
        locator: Concept (environment properties, including episodicity)
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.2 Properties of task environments (episodic vs. sequential)
    source:
      id: original
      ref: ai-intro-018
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-019
    type: multiple
    difficulty: hard
    tags:
      - task-environment
      - observability
      - multi-agent
      - stochastic
    question: |
      A program plays Texas hold'em poker against other players. The deck is shuffled before every
      hand, and the shared cards are dealt between the betting rounds. Classify its task environment
      on the usual dimensions; select all that apply.
    options:
      - text: Partially observable
        correct: true
      - text: Multi-agent
        correct: true
      - text: Stochastic
        correct: true
      - text: Continuous
        why: Cards, bets and game states come from finite sets, so the environment is discrete.
    explanation: |
      The program cannot see its opponents' cards, so it never knows the full state of the game;
      in game-theory terms poker is a game of imperfect information, unlike chess [^1][^2]. That
      makes the environment partially observable. Other players act in it with goals that compete
      with the program's, so it is multi-agent [^2][^4]. Which cards come next is decided by the
      shuffle, not by the current state and the program's bet, so the same action in the same
      situation can lead to different next states: chance makes it stochastic, regardless of how one
      treats the opponents' choices [^2][^3]. Cards and chip amounts form finite sets, so it is
      discrete [^3][^4].
    references:
      - title: 'Wikipedia: Perfect information'
        url: https://en.wikipedia.org/wiki/Perfect_information
        locator: Introduction (hidden cards in poker make it a game of imperfect information)
      - title: 'Wikipedia: Poker'
        url: https://en.wikipedia.org/wiki/Poker#Artificial_intelligence
        locator: Introduction (each hand involves chance); Artificial intelligence (the computer does not know the other players' cards)
      - title: 'Wikipedia: Multi-agent system'
        url: https://en.wikipedia.org/wiki/Multi-agent_system#Concept
        locator: Concept (accessibility, determinism, discreteness of environments)
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.2 Properties of task environments
    source:
      id: original
      ref: ai-intro-019
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-020
    type: single
    difficulty: medium
    tags:
      - task-environment
      - environment-properties
    question: |
      Which description fits the task environment of a program that solves Sudoku puzzles by
      filling in one digit at a time?
    options:
      - text: Fully observable, deterministic, sequential, static, discrete, single-agent
        correct: true
      - text: Partially observable, deterministic, sequential, static, discrete, single-agent
        why: The whole grid is visible at every step, so nothing relevant is hidden from the agent.
      - text: Fully observable, stochastic, sequential, static, discrete, single-agent
        why: Writing a digit has exactly one, known effect on the grid; nothing random happens.
      - text: Fully observable, deterministic, episodic, static, discrete, single-agent
        why: Each digit constrains the later ones, so earlier choices affect later decisions; the task is sequential.
    explanation: |
      Nothing about the puzzle is hidden from the solver, since the whole grid is in view (fully
      observable) [^1][^2]. Writing a digit in a cell has exactly one predictable result, so the
      next state follows from the current grid and the move (deterministic) [^1][^2]. Each digit
      narrows the options for the digits placed after it (sequential), the grid waits while the
      program thinks (static), there are finitely many grids and moves (discrete), and no other agent
      takes part (single-agent) [^1][^2][^3]. This makes Sudoku one of the simplest kinds of task
      environment; driving a car, by contrast, is partially observable, stochastic, dynamic,
      continuous and shared with other agents [^3].
    references:
      - title: 'Wikipedia: Multi-agent system'
        url: https://en.wikipedia.org/wiki/Multi-agent_system#Concept
        locator: Concept (accessibility, determinism, dynamics, discreteness, episodicity of environments)
      - title: 'Poole & Mackworth, Artificial Intelligence: Foundations of Computational Agents, 3rd ed. (2023), Ch. 1'
        url: https://artint.info/3e/html/ArtInt3e.Ch1.S5.html
        locator: Sec. 1.5.6 Uncertainty (sensing and effect uncertainty); Sec. 1.5.8 Number of Agents
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.2 Properties of task environments
    source:
      id: original
      ref: ai-intro-020
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-021
    type: true_false
    difficulty: medium
    tags:
      - task-environment
      - deterministic
      - partial-observability
    question: |
      True or false: an agent acting in a deterministic environment never has to deal with
      uncertainty.
    options:
      - text: 'True'
        why: Determinism removes chance from the world's dynamics, but a partially observable agent still does not know exactly which state it is in, so it remains unsure what its actions will bring.
      - text: 'False'
        correct: true
    explanation: |
      Determinism describes the dynamics: the same action taken in the same state always leads to
      the same next state [^1][^2]. Whether the agent can tell which state it is in is a separate
      dimension, sensing uncertainty. If the environment is only partially observable, the agent has
      to reason over several possible current states, so it cannot be sure what its action will lead
      to even though the world itself involves no chance [^1][^3]. Other agents are a further source
      of uncertainty: the rules of chess are deterministic, yet a player cannot know the opponent's
      next move [^4]. So determinism removes randomness from the dynamics, not every kind of
      uncertainty.
    references:
      - title: 'Poole & Mackworth, Artificial Intelligence: Foundations of Computational Agents, 3rd ed. (2023), Ch. 1'
        url: https://artint.info/3e/html/ArtInt3e.Ch1.S5.html
        locator: Sec. 1.5.6 Uncertainty (sensing uncertainty vs. effect uncertainty)
      - title: 'Wikipedia: Multi-agent system'
        url: https://en.wikipedia.org/wiki/Multi-agent_system#Concept
        locator: Concept (determinism, accessibility)
      - title: 'Wikipedia: Partially observable Markov decision process'
        url: https://en.wikipedia.org/wiki/Partially_observable_Markov_decision_process
        locator: Introduction (the agent cannot observe the underlying state directly)
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.2 Properties of task environments (deterministic vs. nondeterministic; observability)
    source:
      id: original
      ref: ai-intro-021
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-022
    type: short_answer
    difficulty: easy
    tags:
      - task-environment
      - deterministic
      - episodic
    question: |
      If taking a given action in a given state always leads to the same next state, the
      environment is called {{1}}. If the task splits into separate rounds and what the agent does
      in one round has no influence on later rounds, the environment is called {{2}}.
    answer:
      blanks:
        - accept:
            - deterministic
          hint: one word
        - accept:
            - episodic
          hint: one word
      model: deterministic (vs. stochastic / nondeterministic); episodic (vs. sequential)
    explanation: |
      Both are standard dimensions for classifying task environments, next to fully vs. partially
      observable, single- vs. multi-agent, static vs. dynamic and discrete vs. continuous [^1][^2][^3].
      In a deterministic environment the result of an action follows from the action and the state
      it was taken in; in a stochastic one there is a probability distribution over results [^2].
      In an episodic environment each round can be decided on its own, because actions in one
      period do not influence other periods; otherwise the environment is sequential and the agent
      has to plan ahead [^1][^3].
    references:
      - title: 'Wikipedia: Multi-agent system'
        url: https://en.wikipedia.org/wiki/Multi-agent_system#Concept
        locator: Concept (determinism, episodicity and other environment properties)
      - title: 'Poole & Mackworth, Artificial Intelligence: Foundations of Computational Agents, 3rd ed. (2023), Ch. 1'
        url: https://artint.info/3e/html/ArtInt3e.Ch1.S5.html
        locator: Sec. 1.5.6 Uncertainty (effect uncertainty, deterministic or stochastic)
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.3.2 Properties of task environments
    source:
      id: original
      ref: ai-intro-022
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-023
    type: single
    difficulty: easy
    tags:
      - agent-types
      - simple-reflex-agent
    question: |
      An automatic door opens whenever its motion sensor detects movement and closes otherwise.
      Which type of agent is it?
    options:
      - text: A simple reflex agent
        correct: true
      - text: A model-based reflex agent
        why: A model-based agent keeps an internal state about parts of the world it cannot see; the door keeps no state.
      - text: A goal-based agent
        why: A goal-based agent compares possible futures against a goal; the door just maps its current reading to an action.
      - text: A learning agent
        why: The door's rule is fixed; nothing in it improves from feedback.
    explanation: |
      A simple reflex agent decides from the current percept alone, without memory of earlier
      percepts, using condition–action rules of the form "if condition, then action" [^1]. The
      door's single rule ("motion → open") fits exactly; a home thermostat is the usual example [^1]. Such agents work
      only when the right action can be decided from the current percept, i.e. when the relevant
      part of the environment is fully observable [^1][^2].
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Simple_reflex_agents
        locator: Classes of intelligent agents, Simple reflex agents
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.4.2 Simple reflex agents
    source:
      id: original
      ref: ai-intro-023
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-024
    type: single
    difficulty: medium
    tags:
      - agent-types
      - model-based-agent
      - partial-observability
    question: |
      A robot vacuum works in two rooms and senses only whether its *current* room is dirty. Its
      rules are "if dirty, suck; otherwise move to the other room". Once both rooms are clean it
      keeps moving back and forth forever. Which change lets it stop?
    options:
      - text: Remember which rooms it has found clean (a model-based agent)
        correct: true
      - text: Add more condition–action rules that test the current percept
        why: The current percept never shows the other room, so no rule over it can tell that the whole house is clean.
      - text: Choose each move at random instead of always switching rooms
        why: Randomness can break some loops, but the agent still cannot know when everything is clean, so it keeps wandering.
      - text: Replace the dirt sensor with a more accurate one
        why: Accuracy is not the problem; the agent only perceives the room it is in.
    explanation: |
      A simple reflex agent acts on the current percept alone, and in a partially observable
      environment it can fall into infinite loops; randomizing actions may help it escape them,
      but not decide when to stop [^1]. A model-based reflex agent keeps an internal state, built
      from the percept history, about the parts of the world it cannot see now [^1][^2]. Remembering
      that the other room was found clean lets the vacuum stop once both rooms are done.
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Model-based_reflex_agents
        locator: Classes of intelligent agents, Simple reflex agents and Model-based reflex agents
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.4.3 Model-based reflex agents
    source:
      id: original
      ref: ai-intro-024
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-025
    type: single
    difficulty: medium
    tags:
      - agent-types
      - utility-based-agent
      - goal-based-agent
    question: |
      A navigation app knows several routes that all reach the destination and must trade off
      travel time, tolls and the risk of traffic jams. Which agent design fits this best?
    options:
      - text: A utility-based agent
        correct: true
      - text: A goal-based agent
        why: Every route reaches the goal, and a goal test only separates goal from non-goal states, so it cannot rank the routes.
      - text: A simple reflex agent
        why: Choosing among whole routes requires looking ahead, not reacting to the current percept with a fixed rule.
      - text: A model-based reflex agent
        why: An internal model of the world alone does not say which of several good outcomes is preferable.
    explanation: |
      Goal-based agents only distinguish goal states from non-goal states [^1]. A utility-based agent
      adds a utility function that measures how desirable a state is, so it can compare outcomes that
      all satisfy the goal and trade off conflicting objectives [^1][^2]. Under uncertainty, such as
      the risk of a jam, a rational utility-based agent picks the action with the highest expected
      utility over the possible outcomes [^1].
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Utility-based_agents
        locator: Classes of intelligent agents, Goal-based agents and Utility-based agents
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.4.4 Goal-based agents; Sec. 2.4.5 Utility-based agents
    source:
      id: original
      ref: ai-intro-025
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-026
    type: single
    difficulty: medium
    tags:
      - agent-types
      - learning-agent
    question: |
      A learning agent has four parts. Which part judges the agent's behaviour against a fixed
      performance standard and passes that feedback to the learning element?
    options:
      - text: The critic
        correct: true
      - text: The performance element
        why: The performance element chooses the external actions; it does not judge them.
      - text: The learning element
        why: The learning element makes the improvements; it relies on the critic's feedback to decide them.
      - text: The problem generator
        why: The problem generator suggests new, informative actions to explore; it does not evaluate performance.
    explanation: |
      In a learning agent, the performance element chooses actions (it is what used to be the whole
      agent), the learning element improves it, the critic gives the learning element feedback on how
      well the agent is doing, and the problem generator suggests exploratory actions that lead to
      new, informative experiences [^1][^2].
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Learning_agents
        locator: Classes of intelligent agents, Learning agents
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.4.6 Learning agents
    source:
      id: original
      ref: ai-intro-026
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-027
    type: single
    difficulty: medium
    tags:
      - rational-agent
      - rationality
      - omniscience
    question: |
      A delivery drone checks the forecast (no storm expected), flies, and is damaged by a freak
      hailstorm that nothing in its data predicted. Was its decision to fly irrational?
    options:
      - text: No, rationality is judged by the expected outcome given what it knew, not by the actual result
        correct: true
      - text: Yes, a rational agent maximizes the performance it actually achieves, and this flight lowered it
        why: Rationality maximizes *expected* performance given the available information; judging by the actual result would demand omniscience.
      - text: Yes, a rational agent must foresee the outcomes of all its actions
        why: That would be omniscience, which rationality does not require.
      - text: No, rationality only asks whether the drone followed its programmed rules, whatever they are
        why: Following rules is not enough; rationality is defined with respect to the performance measure.
    explanation: |
      A rational agent chooses, among the actions available to it, the one it expects to do best on
      its performance measure, given everything it has perceived and what it already knew [^1].
      It is not required to be omniscient or always successful; what counts is the expected
      outcome on the information it had when it acted [^1][^2]. With a clear forecast, flying had a
      high expected value; the unforeseen hailstorm does not make the decision irrational.
      (Gathering information first, such as checking the forecast, is itself part of acting
      rationally [^2].)
    references:
      - title: 'Wikipedia: Intelligent agent'
        url: https://en.wikipedia.org/wiki/Intelligent_agent#Agent-based_definition_of_artificial_intelligence
        locator: Agent-based definition of artificial intelligence
      - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed. (2020), Ch. 2 Intelligent Agents'
        url: https://aima.cs.berkeley.edu/contents.html
        locator: Sec. 2.2.2 Rationality; Sec. 2.2.3 Omniscience, learning, and autonomy
    source:
      id: original
      ref: ai-intro-027
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-028
    type: single
    difficulty: medium
    tags:
      - history-of-ai
      - dartmouth-workshop
      - symbolic-ai
    question: |
      The 1955 proposal for the Dartmouth summer project, which gave AI its name, rested on a
      conjecture. Which statement captures it?
    options:
      - text: Any feature of intelligence can in principle be specified precisely enough for a machine to simulate it
        correct: true
      - text: Intelligence can arise only in biological brains, so machines can at best imitate it
        why: The proposal assumed the opposite, that a machine can be made to simulate intelligence.
      - text: Machines should learn everything from data, so no aspect of intelligence ever needs to be described by hand
        why: The conjecture is about describing intelligence precisely; large-scale learning from data came much later.
      - text: A machine counts as intelligent once it beats a human champion at chess
        why: The proposal named broad goals (language, abstraction, problem solving, self-improvement), not a chess criterion.
    explanation: |
      McCarthy, Minsky, Rochester and Shannon proposed a two-month study of artificial intelligence
      for the summer of 1956. It rested on the conjecture that learning, and every other feature of
      intelligence, can in principle be specified precisely enough for a machine to simulate it
      [^1]. The goals were to get machines to use language, build abstractions and concepts, solve
      problems then left to people, and improve themselves [^1]. The workshop is widely seen as
      the founding event of AI as a field [^1][^2].
    references:
      - title: 'Wikipedia: Dartmouth workshop'
        url: https://en.wikipedia.org/wiki/Dartmouth_workshop#Background
        locator: Introduction and Background (the proposal)
      - title: 'Wikipedia: History of artificial intelligence'
        url: https://en.wikipedia.org/wiki/History_of_artificial_intelligence#Dartmouth_Workshop
        locator: Birth of artificial intelligence (1941–1956), Dartmouth Workshop
    source:
      id: original
      ref: ai-intro-028
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-029
    type: single
    difficulty: medium
    tags:
      - history-of-ai
      - expert-systems
      - ai-winter
    question: |
      Expert systems such as XCON were a commercial success in the early 1980s, yet many were
      abandoned by the early 1990s. What was the main reason?
    options:
      - text: They were costly to maintain, could not learn, and failed badly on unusual inputs
        correct: true
      - text: They needed GPUs to run their neural networks, and in the 1980s GPUs did not exist yet
        why: Expert systems were rule-based programs, not neural networks; they ran on ordinary computers.
      - text: They learned from data and overfitted the small datasets available
        why: Expert systems did not learn from data; their rules were written by hand from expert knowledge.
      - text: Governments banned them after a series of accidents
        why: No ban ended them; they were dropped for practical and economic reasons.
    explanation: |
      The first commercial successes such as XCON became too costly to keep running by the early
      1990s: updating them was hard, they could not learn, and they were "brittle", failing badly
      on inputs outside what their rules anticipated [^1]. Extracting knowledge from experts and keeping large
      knowledge bases accurate was difficult, which contributed to the second AI winter [^1][^2]. The
      collapse of the specialized LISP-machine market in 1987 added to the downturn [^1].
    references:
      - title: 'Wikipedia: AI winter'
        url: https://en.wikipedia.org/wiki/AI_winter#Slowdown_in_deployment_of_expert_systems
        locator: The setbacks of the late 1980s and early 1990s (LISP machines; Slowdown in deployment of expert systems)
      - title: 'Wikipedia: Symbolic artificial intelligence'
        url: https://en.wikipedia.org/wiki/Symbolic_artificial_intelligence
        locator: Introduction (knowledge acquisition, maintenance, brittleness)
    source:
      id: original
      ref: ai-intro-029
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-030
    type: single
    difficulty: medium
    tags:
      - history-of-ai
      - perceptron
      - connectionism
    question: |
      Minsky and Papert's 1969 book *Perceptrons* stressed what single-layer perceptrons cannot do,
      and funding for neural networks dried up. Why did this not end neural-network research for
      good?
    options:
      - text: Multi-layer networks escape those limits, and backpropagation later made them trainable
        correct: true
      - text: The book's proofs about single-layer perceptrons were later shown to be wrong
        why: The limits of single-layer perceptrons are real; the way out was adding layers, not overturning the proofs.
      - text: Single-layer perceptrons turned out to overcome the limits when given much more training data
        why: More data does not change what a single-layer perceptron can represent.
      - text: Symbolic AI adopted single-layer perceptrons as its standard reasoning engine
        why: Symbolic AI worked with explicit symbols and rules, not with perceptrons.
    explanation: |
      It was already known that multilayer perceptrons are not subject to the book's criticism, but
      in the 1960s nobody knew how to train them; backpropagation was still years away [^1]. In the
      1980s, Hopfield's and Hinton's results and the popularization of backpropagation by Rumelhart
      and Hinton (1986) revived neural networks under the name connectionism [^2]. The winter of
      the neural-network approach thus ended in the mid-1980s [^1].
    references:
      - title: 'Wikipedia: AI winter'
        url: https://en.wikipedia.org/wiki/AI_winter#The_failure_of_single-layer_neural_networks_in_1969
        locator: Early episodes, The failure of single-layer neural networks in 1969
      - title: 'Wikipedia: History of artificial intelligence'
        url: https://en.wikipedia.org/wiki/History_of_artificial_intelligence#Revival_of_neural_networks:_%22connectionism%22
        locator: 'New directions in the 1980s, Revival of neural networks: "connectionism"'
    source:
      id: original
      ref: ai-intro-030
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-031
    type: single
    difficulty: easy
    tags:
      - history-of-ai
      - deep-learning
      - imagenet
    question: |
      Multi-layer neural networks had been known for decades, yet around 2012 deep networks such
      as AlexNet suddenly beat other image-recognition methods by a wide margin. What changed?
    options:
      - text: Large labelled datasets such as ImageNet and fast GPU computing became available
        correct: true
      - text: Backpropagation was invented, so deep networks could be trained for the first time
        why: Backpropagation had been popularized in 1986; what was missing was data and compute.
      - text: Expert systems began to supply hand-written rules to the networks
        why: Deep learning replaced hand-crafted features and rules; it did not rely on expert systems.
      - text: Networks were made shallower, which made them much easier to train
        why: The breakthrough came from deeper networks, made trainable by more data and compute.
    explanation: |
      Multi-layer networks only pay off with fast hardware and a lot of training data; until both
      existed, image recognition depended on features designed by hand [^1].
      ImageNet supplied millions of labelled images, and GPUs, originally built for gaming, made
      training large networks feasible [^1][^2]. In 2012 AlexNet won the ImageNet challenge with far
      fewer errors than the runner-up, and the field quickly switched to deep learning [^1][^3].
    references:
      - title: 'Wikipedia: History of artificial intelligence'
        url: https://en.wikipedia.org/wiki/History_of_artificial_intelligence#Deep_learning
        locator: Big data, deep learning, AGI (2005–2017), Big data and big machines; Deep learning
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#the-road-to-deep-learning
        locator: Sec. 1.5 The Road to Deep Learning
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#recent-ai-research
        locator: 'Lesson: Introduction to AI, sec. Recent AI Research'
    source:
      id: original
      ref: ai-intro-031
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-032
    type: single
    difficulty: medium
    tags:
      - history-of-ai
      - moravecs-paradox
      - symbolic-ai
    question: |
      Early AI programs proved theorems, solved geometry problems and played decent chess, but
      could not recognize a face or cross a room without bumping into things. What did this
      contrast reveal?
    options:
      - text: Tasks easy for people, like perception and movement, can be the hardest to program with symbolic rules
        correct: true
      - text: Chess and theorem proving need far more computation than vision, so they should have been solved later
        why: The opposite happened; the "intelligent" tasks were solved first and perception lagged far behind.
      - text: Robots of the time lacked batteries strong enough to move around
        why: The failure was in perceiving and acting intelligently, not in hardware power supply.
      - text: Perception becomes easy once enough logical rules have been written down
        why: Researchers concluded that symbolic reasoning is unsuited to perceptual and sensorimotor tasks.
    explanation: |
      This is Moravec's paradox: early AI succeeded at "intelligent" tasks such as proving theorems
      and playing chess, and researchers thought the problem was largely solved, but made almost no
      progress on "unintelligent" tasks such as recognizing a face or crossing a room [^1]. By the
      1980s they realized that symbolic reasoning was unsuited to perception and sensorimotor
      control [^1]. Such tasks were later tackled by learning from data, the bottom-up approach [^2].
    references:
      - title: 'Wikipedia: History of artificial intelligence'
        url: https://en.wikipedia.org/wiki/History_of_artificial_intelligence#Problems
        locator: First AI winter (1974–1980), Problems (Moravec's paradox)
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#different-approaches-to-ai
        locator: 'Lesson: Introduction to AI, secs. Different Approaches to AI (Bottom-Up Approach) and A Brief History of AI'
    source:
      id: original
      ref: ai-intro-032
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-033
    type: single
    difficulty: medium
    tags:
      - symbolic-ai
      - neuro-symbolic-ai
      - deep-learning
    question: |
      Kautz, Rossi and Selman argue for combining neural and symbolic AI by analogy with Kahneman's
      "System 1" (fast, intuitive) and "System 2" (slow, deliberate) thinking. Which mapping do they
      propose?
    options:
      - text: Deep learning models System 1 pattern recognition; symbolic reasoning models System 2 planning and deduction
        correct: true
      - text: Symbolic reasoning models System 1 pattern recognition; deep learning models System 2 planning and deduction
        why: The mapping is the other way round; pattern recognition is the strength of deep learning.
      - text: Both systems are best modelled by symbolic rules, run at different speeds
        why: The argument is for a synthesis; it does not propose symbolic rules for fast pattern recognition.
      - text: Both systems are best modelled by deep learning, so symbolic reasoning is unnecessary
        why: The authors argue that both kinds of thinking are needed, which is the case for neuro-symbolic AI.
    explanation: |
      System 1 is fast, automatic and intuitive and is used for pattern recognition; System 2 is
      slow, step-by-step and explicit and suits planning, deduction and deliberate thinking [^1].
      In the proposed view, deep learning best models the first and symbolic reasoning the second,
      and both are needed, which motivates neuro-symbolic AI [^1]. This mirrors the two classic
      routes to AI: bottom-up neural networks and top-down symbolic reasoning [^2].
    references:
      - title: 'Wikipedia: Symbolic artificial intelligence'
        url: https://en.wikipedia.org/wiki/Symbolic_artificial_intelligence#Neuro-symbolic_AI:_integrating_neural_and_symbolic_approaches
        locator: 'Deep learning and neuro-symbolic AI 2011–now, Neuro-symbolic AI: integrating neural and symbolic approaches'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#different-approaches-to-ai
        locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI'
    source:
      id: original
      ref: ai-intro-033
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-034
    type: single
    difficulty: hard
    tags:
      - symbolic-ai
      - physical-symbol-system
    question: |
      Newell and Simon's physical symbol system hypothesis claims that a physical symbol system is
      both *necessary* and *sufficient* for general intelligent action. What does the "necessary"
      half commit them to?
    options:
      - text: Human thinking must itself be a form of symbol manipulation
        correct: true
      - text: A suitably programmed machine can be intelligent
        why: That follows from the "sufficient" half; "necessary" is about every intelligent system, humans included.
      - text: Neural networks can never be built in hardware
        why: The hypothesis is about what intelligence requires, not about which hardware can be built.
      - text: Symbols must be grounded in perception before they can mean anything
        why: Symbol grounding is a later objection to symbolic AI, not part of the hypothesis.
    explanation: |
      If a symbol system is *necessary* for general intelligence, then any intelligent system,
      including the human mind, must be one, so human thinking is a kind of symbol manipulation [^1].
      If it is *sufficient*, a machine running the right symbol system can be intelligent [^1].
      The hypothesis underlies classical symbolic AI. Critics argue that the brain does not always
      use symbols and that sub-symbolic systems such as neural networks also produce intelligent
      behaviour [^1][^2].
    references:
      - title: 'Wikipedia: Physical symbol system'
        url: https://en.wikipedia.org/wiki/Physical_symbol_system
        locator: Introduction; Evidence against the hypothesis
      - title: 'Wikipedia: Symbolic artificial intelligence'
        url: https://en.wikipedia.org/wiki/Symbolic_artificial_intelligence
        locator: Introduction (symbolic vs subsymbolic approaches)
    source:
      id: original
      ref: ai-intro-034
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-035
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - deep-learning
    question: |
      A speech recognizer uses a 12-layer neural network that learns its own features from thousands of
      hours of recorded speech. How is this system classified?
    options:
      - text: Deep learning, and therefore also machine learning and AI
        correct: true
      - text: Deep learning, but not machine learning, since it learns its own features
        why: Learning features from data is still learning from data; deep learning is a part of machine learning.
      - text: Machine learning, but not AI, since AI means hand-written rules
        why: AI is the broad field; it contains rule-based systems and machine learning alike.
      - text: AI, but not machine learning, since no features were designed by hand
        why: Hand-designed features are not what makes a system machine learning; fitting parameters to data is.
    explanation: |
      The three fields are nested: AI is the broad field of methods for intelligent behaviour, machine
      learning is the part of AI whose systems improve by learning from data, and deep learning is the
      part of machine learning that learns representations with multi-layer networks [^1][^2]. A
      12-layer network that learns its features from recorded speech is deep learning, so it is also
      machine learning and AI.
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 1; Lecture 1, slides 5–6
      - title: 'Wikipedia: Machine learning'
        url: https://en.wikipedia.org/wiki/Machine_learning#Artificial_intelligence
        locator: Relationships to other fields — Artificial intelligence
    source:
      id: ncu-intro-dl
      ref: exercise-01/q01-v2
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-036
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l01
      - deep-learning
    question: |
      An analyst designs input features such as distance and hour of day by hand, and a decision tree
      then learns from past trips how to predict journey times from them. How is this system classified?
    options:
      - text: Machine learning, but not deep learning
        correct: true
      - text: Deep learning, because it learns from data
        why: Learning from data makes it machine learning; deep learning also needs stacked layers that learn their own features.
      - text: AI, but not machine learning, because the features are designed by hand
        why: The tree's decision rules are still fitted to data, so it is machine learning.
      - text: Not AI, because a decision tree is only a statistical model
        why: Machine learning methods, decision trees included, are part of AI.
    explanation: |
      The tree's decision rules are fitted to data, so the system is machine learning [^2]. It is not deep
      learning: there are no stacked layers that learn their own feature representations — the features
      are engineered by the analyst [^1]. Every deep learning model is a machine learning model, and every
      machine learning model is AI, but not the other way round [^2].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 1; Lecture 1, slides 5–6, 10
      - title: 'Wikipedia: Machine learning'
        url: https://en.wikipedia.org/wiki/Machine_learning#Artificial_intelligence
        locator: Relationships to other fields — Artificial intelligence; Models — Decision trees
    source:
      id: ncu-intro-dl
      ref: exercise-03/q01-v2
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-037
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - ai-ml-dl
    question: |
      Which of these systems is an example of artificial intelligence that does **not** use
      machine learning?
    options:
      - text: A route planner that searches a road map with a hand-written shortest-path algorithm
        correct: true
      - text: A model that estimates journey times after being fitted to thousands of logged trips
        why: Its behaviour is estimated from past data, which is exactly what machine learning means.
      - text: A network that recognizes objects directly from the pixels of a photo
        why: This is deep learning, a subset of machine learning, so it does use machine learning.
      - text: A spam filter whose word weights are estimated from emails labeled by users
        why: The weights are learned from labeled examples, so this is (supervised) machine learning.
    explanation: |
      AI is the broad field of methods that produce intelligent behaviour. It includes search and
      planning methods that follow a hand-written procedure and learn nothing from data [^1][^2].
      Machine learning is the part of AI whose systems learn patterns from data, and deep learning
      is the part of machine learning that learns several layers of representations [^1][^3]. A
      planner that runs a fixed search over a map is AI without learning; the other three systems
      all fit their behaviour to data.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 5–6
      - title: 'Wikipedia: Artificial intelligence'
        url: https://en.wikipedia.org/wiki/Artificial_intelligence#State_space_search
        locator: Techniques > Search and optimisation > State space search
      - title: 'Wikipedia: Machine learning'
        url: https://en.wikipedia.org/wiki/Machine_learning#Artificial_intelligence
        locator: Lead; Relationships to other fields > Artificial intelligence
    source:
      id: ncu-intro-dl
      ref: lecture-01/q29
    status: reviewed
    reviewed_by: claude
  - id: ai-intro-038
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - generative-ai
    question: Which of these systems is an example of generative AI?
    options:
      - text: A model that writes a draft product description from a few keywords
        correct: true
      - text: A fraud detector that flags suspicious card transactions
        why: It assigns a label or risk score to an existing transaction; it does not create new content.
      - text: A face-recognition system that decides whether two photos show the same person
        why: It makes a same/different decision about given images rather than producing new ones.
      - text: A medical-imaging model that marks the regions of a scan likely to contain a tumour
        why: It labels parts of an existing image (detection or segmentation); no new content is produced.
    explanation: |
      Generative AI refers to models, today mostly deep networks, that learn the patterns of their
      training data and use them to produce new content such as text, images or audio [^1][^2].
      Writing a new product description is generation. Fraud detection, face recognition and medical
      image analysis are also deep-learning applications, but they predict labels, scores or
      locations for inputs that already exist [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 6, 11
      - title: 'Wikipedia: Generative artificial intelligence'
        url: https://en.wikipedia.org/wiki/Generative_artificial_intelligence
        locator: Lead section
    source:
      id: ncu-intro-dl
      ref: lecture-01/q30
    status: reviewed
    reviewed_by: claude
