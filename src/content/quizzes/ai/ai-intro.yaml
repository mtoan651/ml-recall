  - id: ai-intro-008
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - deep-learning
    question: How is deep learning related to machine learning and AI?
    options:
      - text: It is the entire field of AI, covering every kind of intelligent method.
        why: AI is the broad field; deep learning is only one part of machine learning inside it.
      - text: It is a rule-based approach in which experts hand-code every decision.
        why: Hand-written rules are the opposite of learning from data.
      - text: It is a branch of machine learning that learns representations through many stacked layers.
        correct: true
      - text: It is a technique that can only group unlabeled data.
        why: That describes clustering; deep learning also does classification, regression and generation.
    explanation: AI is the broad field, machine learning is the part of AI that learns patterns from data, and deep learning is the part of machine learning that uses multi-layer neural networks to learn features automatically [^1]. This layered representation learning is what the 'deep' refers to [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 5–6
      - source: d2l
        locator: Ch. 1 Introduction
        url: https://d2l.ai/chapter_introduction/index.html
        quote: It is deep in precisely the sense that its models learn many layers of transformations.
    source:
      id: ncu-intro-dl
      ref: exercise-01/q01
    status: reviewed
