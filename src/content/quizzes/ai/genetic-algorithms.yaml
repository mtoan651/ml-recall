  - id: genetic-algorithms-017
    type: single
    difficulty: medium
    tags:
      - fitness-function
      - representation
      - knapsack
    question: |
      A genetic algorithm solves a 0/1 knapsack problem with capacity 12. Each chromosome is a bit
      string whose $i$-th bit says whether item $i$ is packed. The fitness is the total value of the
      packed items if their total weight fits, and 0 otherwise.

      | Item | 1 | 2 | 3 | 4 | 5 |
      | --- | --- | --- | --- | --- | --- |
      | Value | 10 | 7 | 4 | 9 | 3 |
      | Weight | 5 | 4 | 2 | 6 | 1 |

      Which chromosome has the highest fitness?
    options:
      - text: '`01110`'
        why: It is valid (weight 4 + 2 + 6 = 12) but worth only 7 + 4 + 9 = 20.
      - text: '`11101`'
        correct: true
      - text: '`10011`'
        why: It is valid (weight 5 + 6 + 1 = 12) but worth only 10 + 9 + 3 = 22.
      - text: '`11010`'
        why: Items 1, 2 and 4 are worth 26 but weigh 15 > 12, so the string is invalid and its fitness is 0 [^1].
    explanation: |
      The fitness function is defined over the genetic representation and is problem-dependent; for
      the knapsack, a standard choice is the packed value for a valid bit string and 0 for an
      overweight one [^1]. `11101` packs items 1, 2, 3 and 5, weighing 5 + 4 + 2 + 1 = 12 and worth
      24, the best of all 32 strings. `11010` has the largest raw value, 26, but weighs 15, so its
      fitness is 0. Fixed-length bit arrays are the standard representation because their parts stay
      aligned, which makes crossover simple [^2].
    references:
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Selection
        locator: Methodology > Selection (knapsack fitness example)
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Optimization_problems
        locator: Methodology > Optimization problems (bit-array representation)
