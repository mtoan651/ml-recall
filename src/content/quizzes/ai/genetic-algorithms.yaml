  - id: genetic-algorithms-016
    type: single
    difficulty: easy
    tags:
      - ant-colony-optimization
      - pheromone
      - tsp
    question: |
      In ant colony optimisation for the TSP, each ant builds a tour and then deposits pheromone on
      the edges it used. How much pheromone does an ant deposit per edge?
    options:
      - text: An amount inversely proportional to the length of its tour
        correct: true
      - text: An amount proportional to the length of its tour
        why: Long tours would then attract more ants, the opposite of what the search needs [^2].
      - text: The same amount for every ant, whatever the length of its tour
        why: Then pheromone would reflect only how often an edge is used, not how good the tours through it are [^2].
      - text: An amount inversely proportional to that edge's own length
        why: Edge length enters the ants' choice as the heuristic visibility $1/d_{ij}$, not the deposit, which depends on the whole tour [^2].
    explanation: |
      In the Ant System an ant $k$ that completes a tour of length $L_k$ adds
      $\Delta\tau_{ij}^k = Q / L_k$ to every edge $(i, j)$ of its tour, and all pheromone evaporates a
      little each round [^2]. Edges that lie on short tours therefore build up more pheromone, and
      later ants, which choose edges with a probability that grows with pheromone and with $1/d_{ij}$,
      are pulled toward good tours [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q8–Q9 (how ants build tours; pheromone deposit)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
      - title: 'Wikipedia: Ant colony optimization algorithms'
        url: https://en.wikipedia.org/wiki/Ant_colony_optimization_algorithms#Pheromone_update
        locator: Algorithm and formula — Edge selection; Pheromone update
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment5#q9
