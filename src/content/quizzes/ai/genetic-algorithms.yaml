  - id: genetic-algorithms-028
    type: short_answer
    difficulty: hard
    tags:
      - crossover
      - one-point-crossover
      - code-reading
      - aima-python
    question: |
      This one-point crossover is adapted from aima-python:

      ```python
      import random

      def recombine(x, y):
          n = len(x)
          c = random.randrange(0, n)    # c is one of 0, 1, ..., n - 1
          return x[:c] + y[c:]
      ```

      For `x = [1, 0, 1, 1, 0, 1]` and `y = [0, 0, 1, 0, 1, 1]`, how many *distinct* children can
      `recombine(x, y)` return?
    answer:
      numeric: 4
      tolerance: 0
      hint: a whole number
      model: '$c = 0, \dots, 5$ give `001011`, `101011`, `101011`, `101011`, `101111`, `101101`: 4 distinct children.'
    explanation: |
      The cut point $c$ takes the 6 values 0 to 5, and the child is the part of `x` before $c$
      followed by the part of `y` from $c$ on [^1]. With $c = 0$ the child is simply a copy of `y`.
      The parents agree at positions 2, 3 and 6, and moving the cut across a position where they agree
      changes nothing, so $c = 1, 2, 3$ all give `101011`. The six cut points therefore give only four
      strings, `001011`, `101011`, `101111` and `101101`, the last one equal to `x`. One-point
      crossover swaps the genes on one side of a random point [^2], so it can create new strings only
      where the parents differ.
    references:
      - title: 'aima-python (MIT licence), search.py: recombine'
        url: https://github.com/aimacode/aima-python/blob/f104e03fdc1582f014b3a4c93f1a9b7d2da70114/aima/search.py#L1436-L1441
        locator: aima/search.py lines 1436–1441, commit f104e03
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#One-point_crossover
        locator: Crossover for binary arrays > One-point crossover
    source:
      id: original
      ref: genetic-algorithms-028
    status: reviewed
    reviewed_by: claude
  - id: genetic-algorithms-029
    type: short_answer
    difficulty: medium
    tags:
      - mutation
      - bit-flip
      - mutation-rate
    question: |
      Bit-flip mutation flips each bit of a chromosome independently with probability $p_m$, and a
      common default is $p_m = 1/l$ for chromosomes of length $l$. For $l = 20$, what is the
      probability that an offspring passes through mutation completely unchanged?
    answer:
      numeric: 0.36
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $(1 - 1/20)^{20} = 0.95^{20} \approx 0.358$
    explanation: |
      Each bit stays as it is with probability $1 - p_m = 0.95$, independently of the others, so all
      20 stay with probability $0.95^{20} \approx 0.36$. The expected number of flips is
      $l \cdot p_m = 1$, which is why $p_m = 1/l$ amounts to a mutation rate of one per individual [^1].
      As $l$ grows, $(1 - 1/l)^l$ approaches $e^{-1} \approx 0.37$, so roughly a third of the
      offspring are not mutated at all. Mutation exists to keep diversity in the population [^1], and
      its rate trades exploration against keeping good solutions [^2].
    references:
      - title: 'Wikipedia: Mutation (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Mutation_(evolutionary_algorithm)#Bit_string_mutation
        locator: Introduction and Bit string mutation
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Genetic_operators
        locator: Methodology > Genetic operators (parameter tuning paragraph)
    source:
      id: original
      ref: genetic-algorithms-029
    status: reviewed
    reviewed_by: claude
  - id: genetic-algorithms-030
    type: short_answer
    difficulty: medium
    tags:
      - crossover
      - uniform-crossover
    question: |
      Uniform crossover builds a child by taking each bit from parent 1 or parent 2 with equal
      probability, independently for every position. How many distinct children can it produce from
      the parents `10110010` and `10011110`?
    answer:
      numeric: 8
      tolerance: 0
      hint: a whole number
      model: The parents differ only at positions 3, 5 and 6, so there are $2^3 = 8$ children.
    explanation: |
      Uniform crossover treats each gene separately, like a coin flip per position [^1]. Where both
      parents carry the same bit, the child gets that bit either way, so only the 3 positions where
      they differ (3, 5 and 6) create choices: $2^3 = 8$ children, each with probability $1/8$,
      including copies of both parents. Because it mixes genes position by position instead of in
      long segments, uniform crossover is listed among the ways to counter premature convergence [^2].
    references:
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Uniform_crossover
        locator: Crossover for binary arrays > Uniform crossover
      - title: 'Wikipedia: Premature convergence'
        url: https://en.wikipedia.org/wiki/Premature_convergence#Strategies_for_preventing_premature_convergence
        locator: Strategies for preventing premature convergence
    source:
      id: original
      ref: genetic-algorithms-030
    status: reviewed
    reviewed_by: claude
  - id: genetic-algorithms-031
    type: true_false
    difficulty: easy
    tags:
      - crossover
      - mutation
      - diversity
    shuffle: false
    question: |
      Every individual in a genetic algorithm's population has become the same bit string. True or
      false: one-point, two-point or uniform crossover can still produce an individual that is not
      already in the population.
    options:
      - text: 'True'
        why: Crossover only recombines genes the parents already carry, so two identical parents give a child identical to them [^1].
      - text: 'False'
        correct: true
    explanation: |
      Each of these operators copies every gene of the child from one of the two parents [^2], so
      crossing two identical strings returns that same string, whatever the cut points. Wikipedia
      notes that commonly used crossover operators cannot change any uniform population, and that
      mutation alone can make the process ergodic, i.e. able to reach every point of the search space
      [^1]. This is why diversity matters: crossing over a homogeneous population yields no new
      solutions [^3].
    references:
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Problem_domains
        locator: Problem domains
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Crossover_for_binary_arrays
        locator: Crossover for binary arrays
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Limitations
        locator: Limitations (convergence to local optima, diversity)
    source:
