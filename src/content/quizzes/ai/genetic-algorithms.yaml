schema_version: 1
domain: ai
topic: genetic-algorithms
title: Genetic Algorithms
questions:
  - id: genetic-algorithms-001
    type: single
    difficulty: easy
    question: Genetic Algorithms are based on which of the following?
    options:
      - text: Mutations, without selection
      - text: Selection, without mutations
      - text: Both mutations and selection
        correct: true
    explanation: |
      A genetic algorithm evolves a population of candidate solutions. Selection keeps the better
      solutions according to a fitness function, and mutations randomly change genes to push the
      search out of local minima [^1]. Crossover, which combines two parent solutions into a new
      one, is the third ingredient [^1]. Since the method relies on both selection and mutation,
      neither option on its own is complete.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (list of ideas and algorithm outline)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-121/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-002
    type: true_false
    difficulty: easy
    question: Crossover allows us to combine two solutions together to obtain a new valid solution
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Crossover is defined as a map from two genes to one, $\mathrm{crossover}: \Gamma^2 \to \Gamma$,
      that combines two parent solutions into a new valid solution [^1]. At each step the algorithm
      either applies crossover to two randomly chosen genes, keeping the child if it scores better
      than a parent, or mutates a single gene [^1]. When genes are stored as bit vectors or numeric
      sequences, crossover is usually a simple operation on those sequences [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (ideas, requirements and algorithm steps 2-4)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-121/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-003
    type: single
    difficulty: easy
    question: Valid solutions in a genetic algorithm can be represented as _____
    options:
      - text: genes
        correct: true
      - text: neurons
      - text: cells
    explanation: |
      The first step in building a genetic algorithm is to choose a way to code every candidate
      solution as a gene $g \in \Gamma$, often a bit vector or a sequence of numbers, so that
      crossover and mutation can act on it and a fitness function can score it [^1]. Neurons are the
      building blocks of the neural-network (bottom-up) approach, a different branch of AI [^2], and
      "cells" is only biological imagery with no role in the method.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (ideas and implementation requirements)'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#bottom-up-approach
        locator: 'Lesson: Introduction to AI, sec. Bottom-Up Approach'
    source:
      id: ms-ai-for-beginners
      ref: quiz-121/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-004
    type: single
    difficulty: easy
    question: What makes a problem a good fit for a genetic algorithm?
    options:
      - text: Candidate solutions can be coded as genes and scored by a fitness function, e.g. scheduling
        correct: true
      - text: A dataset of inputs labelled with the correct outputs is available, as in image classification
      - text: An exact algorithm that runs in polynomial time is already known, as for sorting a list
      - text: The answer can be read straight from a formula, so no search over candidates is needed
    explanation: |
      To apply a genetic algorithm you need a way to code solutions as genes, a fitness function that
      scores them, and crossover and mutation operations; the population then evolves towards better
      solutions [^1]. Typical tasks are therefore optimisation and search problems such as schedule
      optimisation, optimal packing, optimal cutting and speeding up exhaustive search [^1]. Learning
      from labelled examples is supervised learning, and when an exact efficient algorithm or a closed
      formula exists there is nothing to gain from an evolutionary search.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md#typical-tasks
        locator: 'Lesson: Genetic Algorithms, introduction and sec. Typical Tasks'
    source:
      id: ms-ai-for-beginners
      ref: quiz-221/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-005
    type: single
    difficulty: easy
    question: Once solutions are encoded as genes and a fitness function is defined, what is the first step of a genetic algorithm's main loop?
    options:
      - text: Create an initial population of candidate solutions
        correct: true
      - text: Pick two genes at random and cross them over
      - text: Mutate every gene of the population once
      - text: Compute the gradient of the fitness function
    explanation: |
      The algorithm first selects an initial population $G \subset \Gamma$ of genes. Only then does it
      repeat its step: randomly choose crossover or mutation, where crossover picks two genes of the
      population and mutation replaces one gene by a mutated copy, until the fitness is small enough or
      a step limit is reached [^1]. Choosing two genes therefore happens inside the loop, after the
      population exists. Genetic algorithms do not use gradients; they improve solutions by selection
      with the fitness function [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (overall structure)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-221/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-006
    type: single
    difficulty: easy
    question: In a genetic algorithm, how do crossover and mutation differ?
    options:
      - text: Crossover merges two parents into a new solution; mutation randomly alters one solution to escape local minima
        correct: true
      - text: Crossover randomly alters a single solution to escape local minima; mutation merges two parent solutions into one
      - text: Crossover scores the solutions with the fitness function; mutation keeps only the best ones
      - text: Both combine two solutions, but mutation always keeps the child even when it is worse
    explanation: |
      Crossover is a map $\Gamma^2 \to \Gamma$ that combines two genes (solutions) into a new valid
      solution, while mutation $\Gamma \to \Gamma$ changes one gene; mutations destabilize the
      optimisation and help it leave a local minimum [^1]. Scoring solutions is the job of the fitness
      function, and keeping the better ones is selection [^1]. In the lesson's loop, a crossover child
      replaces a parent only if it has a better (smaller) fitness value [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction'
    source:
      id: ms-ai-for-beginners
      ref: quiz-221/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-007
    type: single
    difficulty: medium
    tags:
      - mutation
      - hill-climbing
      - search
    question: |
      A genetic algorithm keeps a population, mutates individuals at random and selects the fitter
      ones, but never applies crossover. Which description fits it best?
    options:
      - text: A parallel form of hill climbing on the fitness landscape
        correct: true
      - text: Gradient ascent on the fitness function
        why: It needs no gradient; it only compares fitness values of random variants.
      - text: Means–ends analysis, reducing the difference to a goal state
        why: There is no explicit goal state or difference measure, only a fitness score.
      - text: An exhaustive search that eventually tries every possible genome
        why: Selection keeps only the fitter variants; nothing systematically enumerates the space.
    explanation: |
      Each mutation is a small random step from a current individual, and selection keeps the steps
      that improve fitness, which is local hill climbing run in parallel over the population [^1].
      Without crossover, nothing combines information from different individuals, so the population
      can get stuck on local optima just as a single hill climber does [^2].
    references:
      - source: mit-ocw-6034
        locator: Final exam (2009), Quiz 5 Problem 4 (genetic algorithms without crossover)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Problem_domains
        locator: Problem domains (mutation and crossover vs. hill climbing)
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_final_2009#q5.4a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
    status: draft
  - id: genetic-algorithms-008
    type: single
    difficulty: medium
    tags:
      - crossover
      - local-optima
    question: What is crossover mainly good for in a genetic algorithm?
    options:
      - text: Making a small random change to one individual so that the search keeps exploring
        why: That describes mutation, which acts on a single individual.
      - text: Combining parts of different parents, which can escape a local maximum
        correct: true
      - text: Copying the fittest individual unchanged into the next generation
        why: That is elitism, a selection policy; it creates nothing new.
      - text: Turning raw fitness into selection probabilities, for example by rank
        why: That is the selection scheme (fitness-proportional or rank-based), not crossover.
    explanation: |
      Crossover builds a child from pieces of two parents, so features that evolved separately can be
      combined in one step [^1]. Together with mutation this lets the population jump to regions that
      a single hill climber would not reach, which is why crossover is described as a way to escape
      local maxima [^1][^2]. It only helps when the encoding keeps useful pieces together.
    references:
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Problem_domains
        locator: Problem domains (mutation and crossover vs. hill climbing)
      - source: mit-ocw-6034
        locator: Final exam (2009), Quiz 5 Problem 4 (crossover)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_final_2009#q5.4b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_final_2009/
    status: draft
  - id: genetic-algorithms-009
    type: single
    difficulty: medium
    tags:
      - fitness-function
      - plateau
    question: |
      A genetic algorithm evolves randomly initialized neural networks that should recognize a secret
      knock pattern, given as a 0/1 sequence $k_1 \ldots k_n$. Which fitness function would leave the
      algorithm stuck on a fitness plateau from the very first generation?
    options:
      - text: The number of positions $k_i$ that are classified correctly
        why: Almost every change in behavior changes this count, so it gives selection a gradient to follow.
      - text: The number of correctly classified subsequences $k_i \ldots k_j$
        why: This also rewards partial success and varies smoothly across the population.
      - text: 1 if the whole pattern is classified correctly, 0 otherwise
        correct: true
      - text: The length of the prefix $k_1 \ldots k_t$ that is classified correctly
        why: Partial progress raises this score, so selection can tell slightly better networks from worse ones.
    explanation: |
      Selection can only prefer individuals whose fitness differs [^1]. Random networks essentially
      never get the whole pattern right, so an all-or-nothing score gives every individual 0, and the
      search becomes blind random sampling. Scores that reward partial correctness give a slope to
      climb [^1][^2].
    references:
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Limitations
        locator: Limitations (fitness functions that give only pass/fail)
      - source: mit-ocw-6034
        locator: Quiz 3 (2009), Question 2 Part C, item 3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2009#q2c3
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    status: draft
  - id: genetic-algorithms-010
    type: single
    difficulty: easy
    tags:
      - fitness-function
      - training-data
      - negative-examples
    question: |
      A friend uses a genetic algorithm to train a door-unlocking network on the secret knock
      sequence. It reliably says "open" for the secret knock, but once installed the door also opens
      when someone simply runs past. What was missing from the training data?
    options:
      - text: More repeated examples of the secret knock
        why: More copies of the same positive example still never penalize a network that opens for everything.
      - text: A higher mutation rate in the GA
        why: The search found exactly what the fitness rewarded; the problem is what the fitness measured.
      - text: Many more generations of evolution
        why: Longer evolution only optimizes the same flawed objective further.
      - text: Negative (non-knock) sequences
        correct: true
    explanation: |
      If fitness is measured only on the secret knock, a network that outputs "open" for every input
      gets a perfect score, so evolution finds it [^1]. The fitness function must also reward
      rejecting other sequences; a GA optimizes exactly the fitness it is given, no more [^2].
    references:
      - source: mit-ocw-6034
        locator: Quiz 3 (2009), Question 2 Part C, item 5
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
      - title: 'Wikipedia: Genetic algorithm'
        url: https://en.wikipedia.org/wiki/Genetic_algorithm#Optimization_problems
        locator: Optimization problems (the fitness function defines what is optimized)
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2009#q2c5
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2009/
    status: draft
  - id: genetic-algorithms-011
    type: single
    difficulty: medium
    tags:
      - crossover
      - permutation-encoding
      - tsp
    question: |
      A genetic algorithm for an 8-city TSP stores each tour as the list of cities in visiting order
      (path representation). Single-point crossover after position 5 is applied to the parents
      $P_1 = (2, 7, 8, 4, 6, 3, 1, 5)$ and $P_2 = (1, 4, 7, 8, 6, 2, 3, 5)$: each child takes the
      first five genes of one parent and the last three of the other. What do you get?
    options:
      - text: Neither child is a valid tour
        correct: true
      - text: Both children are valid tours
        why: The first child is $(2,7,8,4,6,2,3,5)$, which visits city 2 twice and never visits city 1.
      - text: Only the child that starts with $P_1$'s genes is valid
        why: That child, $(2,7,8,4,6,2,3,5)$, repeats city 2 and misses city 1.
      - text: Only the child that starts with $P_2$'s genes is valid
        why: That child, $(1,4,7,8,6,3,1,5)$, repeats city 1 and misses city 2.
    explanation: |
      The children are $(2,7,8,4,6 \mid 2,3,5)$ and $(1,4,7,8,6 \mid 3,1,5)$ [^1]. Each repeats one
      city and leaves another out, so neither is a permutation. In the path representation a gene's
      meaning depends on the other genes, and ordinary one-point crossover does not preserve the
      permutation property; this is why TSP genetic algorithms use permutation operators such as PMX,
      order crossover or cycle crossover, or a different encoding [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q10 (single-point crossover of two path-represented tours)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Crossover_for_permutations
        locator: Crossover for permutations
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment5#q10
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
    status: draft
  - id: genetic-algorithms-012
    type: short_answer
    difficulty: medium
    tags:
      - adjacency-representation
      - tsp
      - encoding
    question: |
      In the adjacency representation of a TSP tour, position $i$ of the list holds the city that is
      visited right after city $i$. Write the adjacency representation of the tour
      1 → 3 → 2 → 5 → 4 → 6 → 7 → 8 → (back to 1).
    answer:
      accept:
        - 3,5,2,6,4,7,8,1
      pattern: \(?\s*3\s*[,;\s]\s*5\s*[,;\s]\s*2\s*[,;\s]\s*6\s*[,;\s]\s*4\s*[,;\s]\s*7\s*[,;\s]\s*8\s*[,;\s]\s*1\s*\)?
      hint: eight numbers separated by commas, e.g. 2,4,6,8,1,3,5,7
      model: (3, 5, 2, 6, 4, 7, 8, 1)
    explanation: |
      Read off each city's successor: 1 → 3, 2 → 5, 3 → 2, 4 → 6, 5 → 4, 6 → 7, 7 → 8 and 8 → 1, which
      gives (3, 5, 2, 6, 4, 7, 8, 1) [^1]. Unlike the path representation, each tour has a single
      adjacency list (once the direction is fixed), but not every permutation is a tour: a list can
      describe several disjoint sub-cycles, so crossover operators for this encoding must avoid them
      [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q7 and Q11 (adjacency representation of tours)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Crossover_for_permutations
        locator: Crossover for permutations (order-based and adjacency-based problems)
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment5#q11
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
    status: draft
  - id: genetic-algorithms-013
    type: short_answer
    difficulty: hard
    tags:
      - ordinal-representation
      - tsp
      - encoding
    question: |
      The ordinal representation encodes a tour against a reference list, here (A, B, C, D, E, F, G,
      H). For each city of the tour in turn, write its 1-based position in the current reference
      list, then delete that city from the list. Encode the tour (A, D, C, G, H, B, E, F).
    answer:
      accept:
        - 1,3,2,4,4,1,1,1
      pattern: \(?\s*1\s*[,;\s]\s*3\s*[,;\s]\s*2\s*[,;\s]\s*4\s*[,;\s]\s*4\s*[,;\s]\s*1\s*[,;\s]\s*1\s*[,;\s]\s*1\s*\)?
      hint: eight numbers separated by commas, e.g. 2,1,3,1,2,1,1,1
      model: (1, 3, 2, 4, 4, 1, 1, 1)
    explanation: |
      A is 1st in (A…H); D is 3rd in (B, C, D, E, F, G, H); C is 2nd in (B, C, E, F, G, H); G is 4th
      in (B, E, F, G, H); H is 4th in (B, E, F, H); then B, E and F are each 1st of what remains [^1].
      The $k$-th gene can be any number from 1 to $9 - k$ and every such string decodes to a valid
      tour, so plain one-point crossover never produces an invalid child in this encoding, unlike
      the path representation [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q13–Q14 (ordinal representation, reference list A–H)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Crossover_for_permutations
        locator: Crossover for permutations
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment5#q13
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
    status: draft
  - id: genetic-algorithms-014
    type: single
    difficulty: hard
    tags:
      - pmx
      - partially-mapped-crossover
      - tsp
    question: |
      Partially mapped crossover (PMX) is applied to $P_1 = (2, 7, 8, 4, 6, 3, 1, 5)$ and
      $P_2 = (1, 4, 7, 8, 6, 2, 3, 5)$ with cut points after positions 3 and 6. The child keeps $P_2$'s
      middle segment $(8, 6, 2)$ in positions 4–6 and takes the other positions from $P_1$, resolving
      duplicates through the mapping between the two middle segments. Which child results?
    options:
      - text: (3, 7, 4, 8, 6, 2, 1, 5)
        correct: true
      - text: (2, 7, 8, 8, 6, 2, 1, 5)
        why: This copies $P_1$'s outer genes without the mapping, so 2 and 8 appear twice and 3 and 4 are missing.
      - text: (1, 8, 7, 4, 6, 3, 2, 5)
        why: This is the sibling, which keeps $P_1$'s middle segment $(4, 6, 3)$ and takes the rest from $P_2$.
      - text: (7, 4, 3, 8, 6, 2, 1, 5)
        why: This is order crossover, which fills the free positions in $P_1$'s cyclic order after the second cut instead of using the mapping.
    explanation: |
      The two middle segments define the mapping $8 \leftrightarrow 4$, $6 \leftrightarrow 6$,
      $2 \leftrightarrow 3$ [^2]. Copying $P_1$'s outer genes $(2, 7, 8)$ and $(1, 5)$ around
      $(8, 6, 2)$ would duplicate 2 and 8, so 2 is replaced by its partner 3 and 8 by 4, giving
      $(3, 7, 4, 8, 6, 2, 1, 5)$ [^1]. The child keeps absolute positions from both parents and is
      always a valid permutation.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q15 (PMX with cuts after the 3rd and 6th city)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
      - title: 'Wikipedia: Crossover (evolutionary algorithm)'
        url: https://en.wikipedia.org/wiki/Crossover_(evolutionary_algorithm)#Partially_mapped_crossover_(PMX)
        locator: Partially mapped crossover (PMX)
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment5#q15
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
    status: draft
  - id: genetic-algorithms-015
    type: single
    difficulty: hard
    tags:
      - cycle-crossover
      - tsp
      - permutation-encoding
    question: |
      Cycle crossover (CX) is applied to $P_1 = (2, 7, 8, 4, 6, 3, 1, 5)$ and
      $P_2 = (1, 4, 7, 8, 6, 2, 3, 5)$. The positions are split into cycles (start at position 1, look
      up the value of $P_2$ there, find that value's position in $P_1$, and repeat until back at the
      start). Child $C_1$ takes the first cycle from $P_1$, the second from $P_2$, the third from
      $P_1$, and so on. What is $C_1$?
    options:
      - text: (2, 4, 7, 8, 6, 3, 1, 5)
        correct: true
      - text: (1, 7, 8, 4, 6, 2, 3, 5)
        why: This is the sibling $C_2$, which starts by taking the first cycle from $P_2$.
      - text: (2, 7, 8, 4, 6, 2, 3, 5)
        why: This is one-point crossover after position 5; it repeats city 2, while CX always yields a permutation.
      - text: (3, 7, 4, 8, 6, 2, 1, 5)
        why: This is the PMX child for cuts after positions 3 and 6; CX copies whole cycles, so position 1 keeps the 2 of $P_1$.
    explanation: |
      Position 1 holds 2 in $P_1$ and 1 in $P_2$; 1 sits at position 7 of $P_1$, where $P_2$ has 3;
      3 sits at position 6, where $P_2$ has 2, closing the first cycle {1, 6, 7} with values 2, 3, 1
      [^1]. Starting at position 2 gives the second cycle {2, 3, 4} (values 7, 8, 4 in $P_1$), and
      positions 5 and 8 agree in both parents. $C_1$ takes cycle 1 from $P_1$ and cycle 2 from $P_2$:
      $(2, 4, 7, 8, 6, 3, 1, 5)$. Every city keeps the position it had in one of the parents, and the
      result is always a permutation [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 5, Q17–Q20 (cycle crossover; accepted C1 = 2,4,7,8,6,3,1,5)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_05_Assignment_05.pdf
