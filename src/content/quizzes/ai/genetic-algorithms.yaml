topic: genetic-algorithms
title: Genetic Algorithms
questions:
  - id: genetic-algorithms-001
    type: single
    difficulty: easy
    shuffle: false
    question: Genetic Algorithms are based on which of the following?
    options:
      - text: mutations
      - text: Selection
      - text: both a and b
        correct: true
    explanation: |
      A genetic algorithm evolves a population of candidate solutions. Selection keeps the better
      solutions according to a fitness function, and mutations randomly change genes to push the
      search out of local minima [^1]. Crossover, which combines two parent solutions into a new
      one, is the third ingredient [^1]. Since the method relies on both selection and mutation,
      neither option on its own is complete.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (list of ideas and algorithm outline)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-121/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-002
    type: true_false
    difficulty: easy
    question: Crossover allows us to combine two solutions together to obtain a new valid solution
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Crossover is defined as a map from two genes to one, $\mathrm{crossover}: \Gamma^2 \to \Gamma$,
      that combines two parent solutions into a new valid solution [^1]. At each step the algorithm
      either applies crossover to two randomly chosen genes, keeping the child if it scores better
      than a parent, or mutates a single gene [^1]. When genes are stored as bit vectors or numeric
      sequences, crossover is usually a simple operation on those sequences [^1].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
        locator: 'Lesson: Genetic Algorithms, introduction (ideas, requirements and algorithm steps 2-4)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-121/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-21.json
    status: draft
  - id: genetic-algorithms-003
    type: single
    difficulty: easy
    question: Valid solutions to genetic algorithm can be represented as _____
    options:
      - text: genes
        correct: true
      - text: neurons
      - text: cells
    explanation: |
      The first step in building a genetic algorithm is to choose a way to code every candidate
      solution as a gene $g \in \Gamma$, often a bit vector or a sequence of numbers, so that
      crossover and mutation can act on it and a fitness function can score it [^1]. Neurons are the
      building blocks of the neural-network (bottom-up) approach, a different branch of AI [^2], and
      "cells" is only biological imagery with no role in the method.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
