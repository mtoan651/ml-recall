  - id: search-078
    type: multiple
    difficulty: hard
    tags:
      - planning
      - forward-search
      - backward-search
      - plan-space-planning
    question: |
      A problem's solution needs several actions. Compare the first action that each planner adds to
      its plan with the position of that action in the final plan. Which statements are true? Select
      all that apply.
    options:
      - text: The first action chosen by forward state-space planning is the first one executed
        correct: true
      - text: The first action chosen by backward state-space planning is the last one executed
        correct: true
      - text: The first action added by plan-space planning can end up first, last or in between
        correct: true
      - text: The first action chosen by backward state-space planning is the first one executed
        why: Backward search regresses from the goal, so its first choice is the action that achieves the goal, executed last.
      - text: In plan-space planning, the order of actions is fixed when each action is added
        why: Plan-space planning adds actions with only the ordering constraints it needs, so the final position stays open [^2].
    explanation: |
      Forward search grows the plan from the start state, so each new action is appended at the end
      and the first one chosen runs first [^1]. Backward search grows it from the goal, so its first
      choice runs last. Plan-space planning works on a partial order: an action is inserted with only
      the ordering constraints that causal links and threats demand, so the action added first may be
      executed at any point of the final linearization [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: 'Assignment 12, Q8–Q10 (FSSP, BSSP and PSP: first action selected vs executed)'
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_12_Assignment_12.pdf
      - title: 'Wikipedia: Partial-order planning'
        url: https://en.wikipedia.org/wiki/Partial-order_planning#Partial-order_vs._total-order_planning
        locator: Partial-order vs. total-order planning
