  - id: search-084
    type: short_answer
    difficulty: medium
    tags:
      - uniform-cost-search
      - node-expansion
    question: |
      Uniform-cost search runs as a graph search from S to G on an undirected graph with these edge
      costs. The goal test is applied when a node is taken off the frontier, and ties are broken
      alphabetically.

      | Edge | S–A | S–B | A–C | A–D | B–C | B–D | C–E | D–G | E–G |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | Cost | 2 | 3 | 4 | 7 | 2 | 5 | 3 | 3 | 4 |

      How many nodes does UCS expand before it takes G off the frontier? Count S, but not G.
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: S (0), A (2), B (3), C (5), D (8), E (8) are expanded; G is popped at cost 11.
    explanation: |
      UCS expands nodes in order of their path cost $g$ and stops only when the goal is popped [^1].
      From S it reaches A (2) and B (3); B lowers C to 5 and D to 8 (via A they would cost 6 and 9).
      C adds E at 8. D and E both cost 8, less than G's 11, so both are expanded before G: all six
      other nodes. With the consistent heuristic $h$ = (S 10, A 9, B 7, C 7, D 3, E 4), A* expands
      only S, B, A and D on this graph, because it never expands a node with $f > C^* = 11$ [^2].
    references:
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
