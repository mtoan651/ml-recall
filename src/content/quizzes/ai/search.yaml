domain: ai
topic: search
title: Search & Planning
questions:
  - id: search-001
    type: single
    difficulty: easy
    question: A graph is complete if there is an edge connecting every pair of vertices. How many edges does a complete graph with 10 vertices have?
    options:
      - text: '10'
        why: That is the number of vertices, not the number of pairs of vertices.
      - text: '20'
        why: That would give each vertex only 4 edges on average; in $K_{10}$ every vertex has 9.
      - text: '25'
        why: $25 = 5 \cdot 5$ is the edge count of the complete bipartite graph $K_{5,5}$, not of $K_{10}$.
      - text: '45'
        correct: true
    explanation: An edge is fixed by choosing its 2 endpoints, and in a complete graph every pair of vertices is joined, so the complete graph $K_n$ has $\binom{n}{2} = n(n-1)/2$ edges [^1]. For $n = 10$ that is $\binom{10}{2} = 45$. Counting the 9 edges at each of the 10 vertices gives 90, which counts every edge twice.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_gt-intro.html
        locator: Sec. 4.1 Definitions (complete graphs K_n)
    source:
      id: mmlu-redux
      ref: college_mathematics/9
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=9
    status: reviewed
    reviewed_by: claude
  - id: search-002
    type: single
    difficulty: medium
    question: A tree is a connected graph with no cycles. How many nonisomorphic trees with 5 vertices exist?
    options:
      - text: '1'
        why: The star and the path on 5 vertices are already two different trees.
      - text: '2'
        why: Besides the star and the path there is a third tree, whose largest degree is 3.
      - text: '3'
        correct: true
      - text: '4'
        why: Largest degree 4, 3 and 2 each give exactly one tree, so there is no fourth.
    explanation: A tree with 5 vertices has exactly 4 edges [^1], so its vertex degrees add up to 8, and two trees count as the same if one is a relabeling of the other [^2]. Sort the trees by their largest degree. Largest degree 4 gives the star, largest degree 2 gives the path, and largest degree 3 forces one vertex with three neighbours, one of which has the fifth vertex attached. So there are exactly 3 trees up to isomorphism.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_trees.html
        locator: Sec. 4.2 Trees, Proposition 4.2.4
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_gt-intro.html
        locator: Sec. 4.1 Definitions (isomorphic graphs)
    source:
      id: mmlu-redux
      ref: college_mathematics/50
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=50
    status: reviewed
    reviewed_by: claude
  - id: search-003
    type: short_answer
    difficulty: medium
    tags:
      - beam-search
      - exhaustive-search
      - decoding
    question: |
      Beam search keeps the $k$ most probable prefixes at each step. Ignore `<eos>` and the length
      penalty, so every output has exactly $T' = 3$ tokens from a vocabulary of $|\mathcal{Y}| = 5$.
      What is the smallest beam size $k$ that *guarantees* beam search returns the most probable
      sequence, i.e. makes it an exhaustive search?
    answer:
      numeric: 25
      tolerance: 0
      hint: a whole number
      model: $k = |\mathcal{Y}|^{T'-1} = 5^2 = 25$
    explanation: |
      The best sequence may start with a prefix that ranks low after step 2, so a guarantee requires
      keeping all $5^2 = 25$ length-2 prefixes. Step 3 then scores all $25 \times 5 = 125$ complete
      sequences, and the best one is among the 25 kept. With $k = 24$ one prefix is pruned, and it
      may be the prefix of the best sequence. In general $k = |\mathcal{Y}|^{T'-1}$ turns beam search
      into exhaustive search with cost $\mathcal{O}(|\mathcal{Y}|^{T'})$, the opposite end of the
      spectrum from greedy search, $k = 1$ [^1][^2]. With an unbounded beam nothing is pruned at all
      [^3].
    references:
      - source: d2l
        locator: Sec. 10.8.2 Exhaustive Search
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exhaustive-search
      - source: d2l
        locator: Sec. 10.8.3 Beam Search
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#id1
      - title: 'Wikipedia: Beam search'
        url: https://en.wikipedia.org/wiki/Beam_search#Details
        locator: Details
      - source: d2l
        locator: Sec. 10.8.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/beam-search#ex1
      url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: search-004
    type: single
    difficulty: hard
    tags:
      - beam-search
      - beam-size
      - decoding
    question: |
      You raise the beam size of a translation decoder from $k$ to $2k$ (output vocabulary
      $\mathcal{Y}$, maximum output length $T'$). What happens?
    options:
      - text: Decoding work roughly doubles; the output is usually as likely or likelier, but that is not guaranteed
        correct: true
      - text: Decoding work roughly doubles, and the output is guaranteed to be at least as likely as before
        why: A wider beam can prune the path that a narrower beam kept, so its final output can be less likely (see the example in the explanation).
      - text: Decoding work grows by a factor of $|\mathcal{Y}|$, because each beam is expanded over the vocabulary
        why: Each kept prefix was already expanded over the vocabulary with beam size $k$; the cost $\mathcal{O}(k|\mathcal{Y}|T')$ is linear in $k$ [^1].
      - text: Decoding work stays the same, because only the final ranking of the candidates changes
        why: Twice as many prefixes are expanded and scored at every step [^1].
    explanation: |
      Beam search costs $\mathcal{O}(k|\mathcal{Y}|T')$, so doubling $k$ roughly doubles the work
      [^1]. Beam search is not optimal [^2], and a wider beam is not even monotonically better.
      Example with tokens A, B, C: $P(A) = 0.5$, $P(B) = 0.45$; after A the best next token has
      probability 0.4, and AA is then always followed by A; after B, A and B each have probability
      0.5, and every continuation of BA or BB has probability at most 0.34. Beam size 1 follows A, AA,
      AAA with probability 0.2. Beam size 2 keeps BA and BB (0.225 each) instead of AA (0.2) and ends
      with at most $0.225 \times 0.34 = 0.0765$.
    references:
      - source: d2l
        locator: Sec. 10.8.3 Beam Search
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#id1
      - title: 'Wikipedia: Beam search'
        url: https://en.wikipedia.org/wiki/Beam_search#Details
        locator: Details
      - source: d2l
        locator: Sec. 10.8.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/beam-search#ex2
      url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: search-005
    type: single
    difficulty: easy
    tags:
      - greedy-search
      - decoding
      - language-model
    question: |
      This loop generates text from a trained character-level RNN language model after reading a
      user-supplied prefix:

      ```python
      for i in range(len(prefix) + num_preds - 1):
          X = torch.tensor([[outputs[-1]]])
          rnn_outputs, state = self.rnn(self.one_hot(X), state)
          if i < len(prefix) - 1:      # warm-up: feed the prefix
              outputs.append(vocab[prefix[i + 1]])
          else:                        # generate the next character
              Y = self.output_layer(rnn_outputs)
              outputs.append(int(Y.argmax(dim=2).reshape(1)))
      ```

      Which decoding strategy does it use?
    options:
      - text: Greedy search, which is beam search with a beam size of 1
        correct: true
      - text: Beam search with a beam as large as the whole vocabulary
        why: Only one sequence is ever kept, the one extended by the argmax token.
      - text: Exhaustive search over every continuation of length `num_preds`
        why: That would require scoring $|\mathcal{Y}|^{\text{num\_preds}}$ sequences.
      - text: Random sampling from the predicted distribution at each step
        why: '`argmax` is deterministic; sampling would draw from the softmax of `Y`.'
    explanation: |
      After the warm-up on the prefix, every step appends the single most probable character, which
      is greedy search [^1][^2]. Greedy search is cheap but does not maximize the probability of the
      whole sequence; beam search with $k > 1$ trades extra computation for more probable outputs
      [^2], and sampling, possibly sharpened, gives more varied text [^1].
    references:
      - source: d2l
        locator: Sec. 9.5.5 Decoding
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#decoding
      - source: d2l
        locator: Sec. 10.8.1 Greedy Search; 10.8.3 Beam Search
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#greedy-search
      - source: d2l
        locator: Sec. 10.8.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/beam-search#ex3
      url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: search-006
    type: single
    difficulty: medium
    question: Let $G = (V, E)$ be a connected, undirected graph, and let $a$ and $b$ be two distinct vertices in $V$. Let $P_1$ be the problem of finding a shortest simple path between $a$ and $b$, and let $P_2$ be the problem of finding a longest simple path between $a$ and $b$. Which of the following statements about $P_1$ and $P_2$ is true?
    options:
      - text: Both $P_1$ and $P_2$ can be solved in polynomial time.
        why: No polynomial algorithm is known for the longest simple path; the problem is NP-hard.
      - text: $P_1$ can be solved in polynomial time but $P_2$ is not known to be solvable in polynomial time.
        correct: true
      - text: $P_1$ is not known to be solvable in polynomial time but $P_2$ can be solved in polynomial time.
        why: This is reversed — shortest paths are easy, longest simple paths are hard.
      - text: It is not known whether either $P_1$ or $P_2$ can be solved in polynomial time.
        why: Shortest paths are solvable in polynomial time, e.g. by breadth-first search on an unweighted graph.
    explanation: "A shortest path is found in polynomial time — by breadth-first search when edges are unweighted, or by Dijkstra's algorithm for non-negative weights. A longest simple path is NP-hard: asking for a simple path through all $\\lvert V \\rvert$ vertices is the Hamiltonian path problem, so no polynomial-time algorithm is known [^2][^1]."
    references:
      - source: mmlu-redux
        locator: college_computer_science row 22
      - title: 'Wikipedia: Longest path problem'
        url: https://en.wikipedia.org/wiki/Longest_path_problem
        locator: Introduction; NP-hardness
    source:
      id: mmlu-redux
      ref: college_computer_science/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_computer_science/test?row=22
    status: reviewed
    reviewed_by: claude
  - id: search-007
    type: single
    difficulty: hard
    shuffle: false
    question: |
      Let $T$ be a depth-first search tree of a connected undirected graph $G$. For each vertex $v$ of $T$, let $\mathrm{pre}(v)$ be the number of nodes visited up to and including $v$ during a preorder traversal of $T$, and $\mathrm{post}(v)$ the number of nodes visited up to and including $v$ during a postorder traversal of $T$. The lowest common ancestor of vertices $u$ and $v$ in $T$ is a vertex $w$ of $T$ such that $w$ is an ancestor of both $u$ and $v$, and no child of $w$ is an ancestor of both. Let $(u, v)$ be an edge of $G$ that is not in $T$, with $\mathrm{pre}(u) < \mathrm{pre}(v)$. Which of the following statements about $u$ and $v$ must be true?

      I. $\mathrm{post}(u) < \mathrm{post}(v)$

      II. $u$ is an ancestor of $v$ in $T$.

      III. If $w$ is the lowest common ancestor of $u$ and $v$ in $T$, then $w = u$.
    options:
      - text: I only
        why: Postorder finishes $v$ before its ancestor $u$, so $\mathrm{post}(v) < \mathrm{post}(u)$ and I is false.
      - text: II only
        why: II is true, but III follows from it; if $u$ is an ancestor of $v$, their lowest common ancestor is $u$.
      - text: III only
        why: III holds because II does; with no cross edges in an undirected DFS, $u$ must be an ancestor of $v$.
      - text: II and III
        correct: true
    explanation: In a depth-first search of an undirected graph every edge is either a tree edge or a back edge joining a vertex to one of its ancestors; there are no cross edges [^2]. Since $u$ was visited first, $u$ is the ancestor of $v$ (II), so the lowest common ancestor is $u$ itself (III). Postorder finishes descendants before their ancestors, so $\mathrm{post}(v) < \mathrm{post}(u)$ and I is false [^1].
    references:
      - source: mmlu-redux
        locator: college_computer_science row 56
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search
        locator: Output of a depth-first search
    source:
      id: mmlu-redux
      ref: college_computer_science/56
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_computer_science/test?row=56
    status: reviewed
    reviewed_by: claude
  - id: search-008
    type: single
    difficulty: medium
    tags:
      - iterative-deepening
      - uninformed-search
      - memory
    question: |
      A path-search problem has a very large branching factor, all actions cost the same, and every
      solution is a fairly short (but unknown) number of steps. You want a path with the fewest
      steps and memory is the bottleneck. Which search fits best?
    options:
      - text: Breadth-first search with a visited list
        why: It also finds a fewest-steps path, but it keeps the whole frontier, about $b^d$ paths, in memory; with a huge $b$ that is the problem.
      - text: Uniform-cost search with a strict expanded list
        why: With equal action costs it behaves like breadth-first search, with the same memory use plus the overhead of a priority queue.
      - text: Depth-first search with a visited list
        why: Depth-first search returns the first path it stumbles on, not necessarily the shortest one.
      - text: Iterative deepening with no visited list
        correct: true
    explanation: |
      Iterative deepening runs depth-limited depth-first searches with limits 0, 1, 2, … It finds a
      path with the fewest steps, like breadth-first search, while storing only the current path, like
      depth-first search [^1][^2]. Re-searching the shallow levels costs little when the branching
      factor is large, because most nodes are on the deepest level. A visited list would cost as much
      memory as breadth-first search and throw away the reason for choosing iterative deepening [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 1.2 Algorithms, part 1
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search
        locator: Properties (asymptotic analysis)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q1.2a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: reviewed
    reviewed_by: claude
  - id: search-009
    type: single
    difficulty: easy
    tags:
      - uniform-cost-search
      - optimal-search
      - path-cost
    question: |
      A path-search problem has a very large branching factor and fairly short solutions, but the
      actions have widely varying costs and you have no useful heuristic. You need a minimum-cost
      path. Which search should you use?
    options:
      - text: Breadth-first search with a visited list
        why: Breadth-first search ignores link costs and returns a path with the fewest links.
      - text: Greedy best-first search on the cost of the last action
        why: Greedy choices on single steps give no optimality guarantee for the total path cost.
      - text: Uniform-cost search (branch and bound on path cost)
        correct: true
      - text: Iterative deepening on the number of steps
        why: It returns the path with the fewest steps, which need not be the cheapest one when costs vary.
    explanation: |
      Uniform-cost search always extends the cheapest partial path, so the first path it removes from
      the agenda that ends at the goal is a cheapest one [^1][^2]. Widely varying costs even help it:
      expensive subtrees are pushed to the back of the queue and often never explored. Without a
      heuristic, A* reduces to exactly this search [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 1.2 Algorithms, part 2
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Practical optimizations and infinite graphs (uniform-cost search)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q1.2b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: reviewed
    reviewed_by: claude
  - id: search-010
    type: short_answer
    difficulty: medium
    tags:
      - a-star
      - admissibility
      - expanded-list
    question: |
      In the directed graph below (link costs on the arrows) you search from A to the goal G with A*
      and a strict expanded list (a state is never extended twice). The heuristic is

      | state | A | B | C | D | G |
      |---|---|---|---|---|---|
      | $h_1$ | 3 | 6 | 4 | 3 | 0 |

      What is the total cost of the path that A* returns?
    figure:
      src: ./search/search-010.svg
      alt: 'Directed graph: A to B cost 1, B to A cost 2, A to D cost 3, B to D cost 4, B to C cost 5, B to G cost 6, D to C cost 1, C to G cost 1, D to G cost 3.'
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: A* extends A, then D ($f = 3 + 3 = 6$), and pops A–D–G with $f = 6 + 0$; the optimal path A–D–C–G costs 5.
    explanation: |
      From A, the paths A–B and A–D get $f = 1 + 6 = 7$ and $f = 3 + 3 = 6$, so D is extended. That
      gives A–D–C with $f = 4 + 4 = 8$ and A–D–G with $f = 6 + 0 = 6$, and A–D–G is removed first and
      returned with cost 6. The cheapest path is A–D–C–G with cost 5, but $h_1(C) = 4$ overestimates
      C's true distance 1, so $h_1$ is not admissible and A* loses its guarantee [^1][^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 5 Search traces (tree G3)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Admissibility
        locator: Admissibility
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q5-g3
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: reviewed
    reviewed_by: claude
  - id: search-011
    type: single
    difficulty: medium
    tags:
      - admissibility
      - consistency
      - heuristics
    question: |
      For the directed graph below (link costs on the arrows, goal G), consider the heuristic

      | state | A | B | C | D | G |
      |---|---|---|---|---|---|
      | $h_2$ | 3 | 3 | 0 | 2 | 0 |

      Which statement about $h_2$ is correct?
    figure:
      src: ./search/search-011.svg
      alt: 'Directed graph: A to B cost 1, B to A cost 2, A to D cost 3, B to D cost 4, B to C cost 5, B to G cost 6, D to C cost 1, C to G cost 1, D to G cost 3.'
    options:
      - text: Admissible but not consistent (link D→C)
        correct: true
      - text: Neither admissible nor consistent
        why: Every value is at most the true distance to G (A 5, B 6, C 1, D 2), so $h_2$ is admissible.
      - text: Consistent, and therefore also admissible
        why: On the link D→C of cost 1 the heuristic drops from 2 to 0; a consistent heuristic may drop by at most the link cost.
      - text: Not admissible, because $h_2(A) = 3$ is too large
        why: The cheapest path from A, A–D–C–G, costs 5, so 3 is an underestimate.
    explanation: |
      Admissible means $h(n) \le h^*(n)$, the true remaining cost; here $h^* = (5, 6, 1, 2, 0)$ for
      A, B, C, D, G, and every $h_2$ value is below it [^1][^2]. Consistent means
      $h(n) \le c(n, n') + h(n')$ on every link, and D→C violates it: $2 > 1 + 0$ [^3]. A* with
      $h_2$ and a strict expanded list still happens to return the optimal path A–D–C–G here, but
      only consistency guarantees that in general.
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 5 Search traces (tree G6)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Admissible heuristic'
        url: https://en.wikipedia.org/wiki/Admissible_heuristic
        locator: Search algorithms
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Introduction (definition of a consistent heuristic)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q5-g6
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: reviewed
    reviewed_by: claude
  - id: search-012
    type: single
    difficulty: medium
    tags:
      - admissibility
      - heuristics
      - problem-formulation
    question: |
      A Mars rover must collect one rock of each of 10 types and return to the lander; the path cost
      is the distance driven (plus a weight penalty that is never negative). Several map squares hold
      each rock type. With $l$ types already collected, which heuristic is admissible for A*?
    options:
      - text: The distance from the rover back to the lander
        correct: true
      - text: The sum of the distances from the rover to the $10 - l$ closest squares of missing types
        why: The rover can visit several of those squares in one sweep, so summing separate distances from its current position can exceed the real remaining cost.
      - text: The length of the shortest tour through the $10 - l$ closest squares of missing types
        why: An optimal plan may collect a missing type at a different square than the closest one, so this tour can be longer than the real remaining cost; it is also expensive to compute.
      - text: The number of missing rock types times the largest distance on the map
        why: That bound is far above typical remaining distances, so it overestimates.
    explanation: |
      Whatever else it does, the rover must still drive back to the lander, so the distance to the
      lander never exceeds the remaining cost: it is admissible, though weak [^1]. The sum and the
      tour fix particular squares or add up distances that a single route would share, and the count
      times the largest distance is far too large, so all three can overestimate. A* needs an
      admissible heuristic to guarantee an optimal plan [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 4 Search problem formulation, part 5
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Admissible heuristic'
        url: https://en.wikipedia.org/wiki/Admissible_heuristic
        locator: Search algorithms
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q4.5
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: reviewed
    reviewed_by: claude
  - id: search-013
    type: short_answer
    difficulty: medium
    tags:
      - uniform-cost-search
      - expansion-order
      - tree-search
    question: |
      Run uniform-cost search on the tree below (arc lengths on the edges) from A to the goal G, with
      no visited or expanded list. Ties in path cost are broken alphabetically by state name. List
      the states in the order they are expanded, ending with G.
    figure:
      src: ./search/search-013.svg
      alt: 'Tree rooted at A: A-B 1, A-C 3; B-D 1, B-E 1; C-G 1, C-H 2; D-F 1; H-I 1, H-J 1; F-K 2, F-L 2.'
    answer:
      accept:
        - A B D E C F G
      pattern: A\W*B\W*D\W*E\W*C\W*F\W*G
      hint: State letters in order, e.g. A B C D
      model: A(0), B(1), D(2), E(2), C(3), F(3), G(4)
    explanation: |
      Uniform-cost search always extends the cheapest path on the agenda [^1][^2]. The path costs
      are B 1, D 2, E 2, C 3, F 3, G 4 and H 5, so after A it extends B, then D and E (both 2), then
      C and F (both 3, C first by name), and finally removes G with cost 4. Breadth-first search
      would have reached G earlier (A B C D E G) and depth-first search later, after the whole
      D–F–K–L branch [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 1 Tree Search
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Practical optimizations and infinite graphs (uniform-cost search)
