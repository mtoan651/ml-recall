    reviewed_by: claude
  - id: search-069
    type: short_answer
    difficulty: hard
    tags:
      - alpha-beta-pruning
      - minimax
      - game-tree
    question: |
      A game tree has a MAX root with three MIN children. Each MIN child has three MAX children, each
      of those has two MIN children, and each of those has two leaves. The table lists the leaf values
      from left to right; a cell is one MAX node, written as its two MIN nodes' leaf pairs.

      | MIN child | 1st MAX node | 2nd MAX node | 3rd MAX node |
      | --- | --- | --- | --- |
      | 1 | (50, 12) (40, 30) | (40, 60) (80, 90) | (70, 25) (20, 60) |
      | 2 | (55, 25) (60, 57) | (17, 13) (60, 70) | (75, 80) (77, 88) |
      | 3 | (45, 35) (20, 80) | (25, 60) (32, 33) | (28, 99) (40, 38) |

      Alpha–beta pruning searches the children of every node from left to right. How many of the 36
      leaves does it evaluate?
    answer:
      numeric: 20
      tolerance: 0
      hint: a whole number of leaves
      model: 20 leaves; the minimax value is 57
    explanation: |
      Minimax gives the three MIN children the values 25, 57 and 32, so the root's value is 57 [^1].
      Alpha–beta skips a subtree once it cannot change the decision at an ancestor [^2]. Under the
      first MIN child it evaluates 9 leaves; for example, its second MAX node is abandoned after
      (40, 60), because that MAX node is already worth at least 40 while MIN can hold it to 30. The
      second MIN child costs 9 more leaves and raises $\alpha$ to 57. Under the third MIN child, each
      MIN node stops after its first leaf (45, then 20), both below $\alpha = 57$; the first MAX node
      is then worth 45, so the whole third subtree is worth at most 45 and is cut after 2 leaves.
      That makes $9 + 9 + 2 = 20$ leaves, against 25 when the search runs right to left [^1].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 9, Q5–Q12 (Minimax and AlphaBeta on Fig. 9.1)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_09_Assignment_09.pdf
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning#Core_idea
        locator: Core idea; Pseudocode
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment9#q9
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_09_Assignment_09.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-070
    type: single
    difficulty: medium
    tags:
      - minimax
      - alpha-beta-pruning
      - sss-star
    question: |
      Minimax, alpha–beta and SSS* search the same game tree to the same depth. Let MM, AB and SSS be
      the numbers of leaves each one evaluates. Which statement is true?
    options:
      - text: All three return the same value, and MM ≥ AB ≥ SSS
        correct: true
      - text: All three return the same value, and MM ≤ AB ≤ SSS
        why: Minimax evaluates every leaf, so it can never evaluate fewer than a pruning algorithm.
      - text: SSS* evaluates fewest leaves because it settles for an approximate value
        why: SSS* returns the exact minimax value; it saves work by searching best-first [^2].
      - text: Alpha–beta evaluates fewest leaves, and SSS* returns a different value
        why: SSS* never examines a node that alpha–beta prunes, and it returns the minimax value [^2].
    explanation: |
      Alpha–beta prunes only subtrees that cannot affect the result, so it returns the minimax value
      while evaluating at most as many leaves as full minimax [^1]. SSS* is a best-first algorithm that
      never examines a node that alpha–beta would prune and may prune more, and it also returns the
      minimax value [^2]. Its cost is memory: it keeps and sorts an OPEN list of nodes, which is why
      alpha–beta remains the common choice [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 9, Q3–Q4 (MM ≥ AB ≥ SSS; all compute the same minimax value)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_09_Assignment_09.pdf
      - title: 'Wikipedia: SSS*'
        url: https://en.wikipedia.org/wiki/SSS*
        locator: Introduction; Algorithm
