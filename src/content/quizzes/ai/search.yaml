  - id: search-083
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - heuristic
      - expansion-order
    question: |
      A* runs as a graph search from S to G on the undirected graph below. The goal test is applied
      when a node is taken off the frontier, and ties in $f = g + h$ are broken alphabetically.

      | Edge | S–A | S–B | A–C | A–D | B–C | B–D | C–E | D–G | E–G |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | Cost | 2 | 3 | 4 | 7 | 2 | 5 | 3 | 3 | 4 |

      | Node | S | A | B | C | D | E | G |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | $h$ | 10 | 9 | 7 | 7 | 3 | 4 | 0 |

      A* expands S first, then {{1}}, then {{2}}, then {{3}}, and then takes the goal G off the
      frontier. The path it returns costs {{4}}.
    answer:
      blanks:
        - accept:
            - B
          hint: one node letter
        - accept:
            - A
          hint: one node letter
        - accept:
            - D
          hint: one node letter
        - numeric: 11
          tolerance: 0
          hint: a whole number
      model: S ($f = 10$), B ($3 + 7 = 10$), A ($2 + 9 = 11$, tie with D broken alphabetically), D ($8 + 3 = 11$), then G ($f = 11$); the path is S–B–D–G with cost 11.
    explanation: |
      A* always expands the frontier node with the lowest $f(n) = g(n) + h(n)$ and stops when the
      goal is taken off the frontier [^1]. After S the frontier holds A ($2 + 9 = 11$) and B
      ($3 + 7 = 10$), so B goes next and adds C ($5 + 7 = 12$) and D ($8 + 3 = 11$). A and D tie at
      11 and A goes first; it finds no cheaper route to C or D. D then adds G with $f = 11$, which is
      popped before C ($f = 12$). This $h$ is consistent, so the first path to G that is popped is
      optimal: S–B–D–G with cost 11 [^2]. Nodes with $f > C^* = 11$, such as C, are never expanded [^3].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Description
        locator: Description
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic#Consequences_of_monotonicity
        locator: Consequences of monotonicity
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Worst_case
        locator: Complexity > Worst case
