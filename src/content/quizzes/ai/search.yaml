  - id: search-014
    type: short_answer
    difficulty: medium
    tags:
      - iterative-deepening
      - expansion-order
      - tree-search
    question: |
      Run progressive (iterative) deepening on the tree below from A to the goal G: depth-first
      searches with depth limits 0, 1, 2, …, children taken alphabetically, no visited list, and the
      search stops when G is expanded. List every expansion in order, repeats included.
    figure:
      src: ./search/search-014.svg
      alt: 'Tree rooted at A: A-B 1, A-C 3; B-D 1, B-E 1; C-G 1, C-H 2; D-F 1; H-I 1, H-J 1; F-K 2, F-L 2.'
    answer:
      accept:
        - A A B C A B D E C G
      pattern: A\W*A\W*B\W*C\W*A\W*B\W*D\W*E\W*C\W*G
      hint: State letters in order, repeats included, e.g. A A B
      model: Limit 0 — A; limit 1 — A B C; limit 2 — A B D E C G
    explanation: |
      Each iteration restarts from the root and runs depth-first search down to the current limit
      [^1][^2]. Limit 0 expands only A, limit 1 expands A, B, C, and limit 2 expands A, B, D, E, then
      C and its first child G, the goal. The repeated shallow expansions are the price of the low
      memory use; the deep F–K–L branch is never touched [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 1 Tree Search
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search
        locator: Algorithm for directed graphs; Example
