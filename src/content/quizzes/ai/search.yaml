  - id: search-075
    type: single
    difficulty: medium
    tags:
      - planning
      - sussman-anomaly
      - linear-planning
    question: |
      In the Sussman anomaly, block C is on A, A and B are on the table, and the goal is
      on(A, B) ∧ on(B, C). What goes wrong for a linear planner that achieves the two subgoals one
      after the other?
    options:
      - text: Whichever subgoal it achieves first, achieving the second one undoes it
        correct: true
      - text: Neither subgoal can be achieved on its own, starting from the initial state
        why: 'Each subgoal alone is easy: e.g. put C on the table and stack A on B; the trouble is combining them.'
      - text: The goal is unreachable, so every planner fails on it
        why: A plan exists (C to the table, B on C, A on B); interleaving the subgoals finds it [^2].
      - text: It succeeds only if it achieves on(B, C) before on(A, B)
        why: Stacking B on C first leaves C on A, and clearing A then means removing B and C again; neither order works.
    explanation: |
      A linear planner solves one subgoal completely before the next. If it first achieves on(A, B),
      it must later unstack A to put B on C; if it first achieves on(B, C), A is buried under C and B
      [^2]. The subgoals are not serializable, so the solution must interleave work on them: move C to
      the table, stack B on C, then A on B [^1][^2]. Partial-order planners handle this naturally.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 11, Q5 (Sussman's anomaly)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_11_Assignment_11.pdf
      - title: 'Wikipedia: Sussman anomaly'
        url: https://en.wikipedia.org/wiki/Sussman_anomaly
        locator: Introduction
