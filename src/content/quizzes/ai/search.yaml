  - id: search-035
    type: short_answer
    difficulty: medium
    tags:
      - breadth-first-search
      - word-ladder
      - state-space
    question: |
      A word game starts from the word O and adds or removes one letter per move; every intermediate
      word must be in the list. The moves allowed are the edges O–ON, O–OW, ON–ONE, ON–TON, OW–TOW,
      ONE–TONE, TON–TONE, TON–TONS, TON–TOWN, TOW–TOWN, TOW–TOWS, TOW–TROW, TONE–TONES, TONS–TONES,
      TONS–TOWNS, TOWN–TOWNS, TOWS–TOWNS, TOWS–TROWS, TROW–TROWS, TROW–THROW, THROW–THROWS and
      TROWS–THROWS. Run breadth-first search with an extended list from O to THROWS, taking
      neighbors in dictionary order. Which path is found?
    answer:
      accept:
        - O OW TOW TOWS TROWS THROWS
      pattern: O\W+OW\W+TOW\W+TOWS\W+TROWS\W+THROWS
      hint: Words along the path separated by spaces or dashes, e.g. O ON TON
      model: O – OW – TOW – TOWS – TROWS – THROWS (5 moves)
    explanation: |
      THROWS is 5 moves from O on every shortest route (one letter per move, through the TOW branch);
      breadth-first search returns the first such path it builds [^1]. TOW's neighbors are taken in
      dictionary order TOWN, TOWS, TROW, so the path through TOWS reaches TROWS, and then THROWS,
      before the path through TROW and THROW does. The ON branch reaches only TONE, TONS, TOWN, TONES
      and TOWNS, none of which leads to THROWS faster [^2].
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search
        locator: Introduction; Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 1 (2007), Question 2, Part 1A (breadth-first search on the word graph)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2007#q2.1a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
    status: draft
  - id: search-036
    type: single
    difficulty: easy
    tags:
      - csp
      - forward-checking
      - graph-coloring
    question: |
      Five squares of a board must be colored red (R) or black (B) so that squares sharing a side
      differ. The constraints are 1–2, 2–3, 1–4, 2–5 and 4–5 (squares 1, 2, 3 form the top row and
      4, 5 sit under 1 and 2). All domains are {R, B}. You assign 1 = R and run forward checking.
      What are the domains of squares 2, 3, 4, 5 afterwards?
    options:
      - text: 2 = {B}, 3 = {R}, 4 = {B}, 5 = {R}
        why: That is the result of full propagation; forward checking only prunes the direct neighbors of the variable just assigned.
      - text: 2 = {B}, 3 = {B}, 4 = {B}, 5 = {B}
        why: Squares 3 and 5 are not neighbors of square 1, and 3 must differ from 2 anyway.
      - text: 2 = {B}, 3 = {R, B}, 4 = {B}, 5 = {R, B}
        correct: true
      - text: 2 = {R, B}, 3 = {R, B}, 4 = {R, B}, 5 = {R, B}
        why: Forward checking does remove R from the neighbors 2 and 4 of square 1.
    explanation: |
      Forward checking runs one step of propagation: after assigning a variable, it removes the
      conflicting values only from the domains of its unassigned neighbors [^1][^2]. Square 1's
      neighbors are 2 and 4, so both lose R; squares 3 and 5 keep {R, B} until a neighbor of theirs
      is assigned. Full arc consistency would go on to fix 3 = R and 5 = R.
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 2 Constraints, part 3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Look-ahead (backtracking)'
        url: https://en.wikipedia.org/wiki/Look-ahead_(backtracking)
        locator: Look ahead techniques (forward checking)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q2.3
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: draft
  - id: search-037
    type: short_answer
    difficulty: medium
    tags:
      - csp
      - backtracking
      - forward-checking
    question: |
      Same board-coloring CSP: constraints 1–2, 2–3, 1–4, 2–5 and 4–5 (neighbors differ), domains
      {R, B} except square 5, whose domain is {B}. Run backtracking with forward checking, assigning
      variables in the order 1, 2, 3, 4, 5 and trying R before B. An assignment fails when forward
      checking empties some domain. How many assignments are attempted in total, counting failed
      ones, until a solution is found?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: 1=R, 2=B (fails, domain of 5 becomes empty), 1=B, 2=R, 3=B, 4=R, 5=B
    explanation: |
      After 1 = R, forward checking leaves 2 = {B}; assigning 2 = B removes B from square 5, whose
      domain becomes empty, so 2 = B fails and, with no value left for 2, the search backtracks to
      1 [^1][^2]. With 1 = B, the remaining assignments 2 = R, 3 = B, 4 = R, 5 = B all succeed: 7
      attempts in total. Plain backtracking would only notice the conflict at square 5 and needs 14
      attempts.
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 2 Constraints, part 5
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Look-ahead (backtracking)'
        url: https://en.wikipedia.org/wiki/Look-ahead_(backtracking)
        locator: Look ahead techniques (forward checking)
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q2.5
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
    status: draft
  - id: search-038
    type: single
    difficulty: medium
    tags:
      - csp
      - arc-consistency
      - constraint-propagation
    question: |
      Variables A, B, C, D each have domain {1, 2}. The allowed value pairs are
      A–B: (1,1), (2,1), (2,2); A–C: (1,2), (2,1); A–D: (2,2); B–C: (1,2), (2,1); B–D: (2,2);
      C–D: (1,1), (1,2). What are the domains after full constraint propagation (arc consistency)?
    options:
      - text: Every domain stays {1, 2}
        why: The single-pair constraints A–D and B–D already remove values on the first pass.
      - text: A = {2}, B = {1, 2}, C = {1}, D = {2}
        why: Once D = {2}, B = 1 has no support on B–D (only (2,2) is allowed), so B shrinks to {2}.
      - text: A = {2}, B = {2}, C = {1}, D = {2}
        correct: true
      - text: A = {1, 2}, B = {2}, C = {1}, D = {2}
        why: A = 1 has no partner in A–D, whose only allowed pair is (2,2).
    explanation: |
      Arc consistency removes a value when some constraint gives it no supporting value in the
      neighbor's domain, and repeats until nothing changes [^1]. A–D and B–D allow only (2,2), so A,
      B and D become {2}; then A = 2 allows only C = 1 on A–C, and C = 1 is consistent with B = 2 and
      D = 2. Here propagation alone solves the problem: A = 2, B = 2, C = 1, D = 2 [^2].
    references:
      - title: 'Wikipedia: Local consistency'
        url: https://en.wikipedia.org/wiki/Local_consistency#Arc_consistency
        locator: Arc consistency
      - source: mit-ocw-6034-s05
