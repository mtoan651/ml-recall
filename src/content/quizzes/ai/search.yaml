  - id: search-044
    type: single
    difficulty: hard
    tags:
      - planning
      - graphplan
      - mutex
    question: |
      In a GraphPlan planning graph, level 0 holds the initial facts, including `(in R2 C)`. Two
      level-1 actions are `(move-left R2 C B)` (precondition `(in R2 C)`; effects `(in R2 B)`,
      delete `(in R2 C)`) and `(carry-left R2 B1 C B)` (preconditions `(in R2 C)`, `(in B1 C)`;
      effects `(in R2 B)`, `(in B1 B)`, delete `(in R2 C)`, delete `(in B1 C)`). Why are these two
      actions mutex?
    options:
      - text: One adds `(in R2 B)` while the other deletes it (inconsistent effects)
        why: Both actions add `(in R2 B)`; neither deletes it.
      - text: They are not mutex, because both can be done by robot R2 at once
        why: A robot cannot move and carry at the same step here; formally, each action destroys a precondition of the other.
      - text: Each deletes `(in R2 C)`, a precondition of the other (interference)
        correct: true
      - text: Their preconditions are mutex at level 0 (competing needs)
        why: Level 0 holds the initial facts, which are all true together, so no two of them are mutex.
    explanation: |
      Two actions at the same level are mutex if one deletes a precondition or an effect of the other
      (interference / inconsistent effects) or if their preconditions are mutex (competing needs)
      [^1]. Both actions need `(in R2 C)` and both delete it, so neither can follow or run alongside
      the other within the step [^1][^2].
    references:
      - title: Blum and Furst (1997), Fast Planning Through Planning Graph Analysis
        url: https://www.cs.cmu.edu/~avrim/Papers/graphplan.pdf
        locator: Sec. 2.2 Exclusion Relations Among Planning Graph Nodes
      - source: mit-ocw-16410
        locator: Sample Midterm solutions, Problem 4.B.2 Mutex for the Plan Graph
        url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
