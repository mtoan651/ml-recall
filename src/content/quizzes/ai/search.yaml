  - id: search-039
    type: short_answer
    difficulty: hard
    tags:
      - csp
      - forward-checking
      - graph-coloring
    question: |
      Graph coloring: variables 1–5 with edges 1–2, 1–3, 2–3, 2–4, 3–4, 3–5, 4–5 (neighbors must
      differ). Domains: 1 = {R}, 2 = {R, G, B}, 3 = {R, G, B}, 4 = {R, G, B}, 5 = {R, B}. Run
      backtracking with forward checking, variables in numerical order, values in the order listed.
      How many assignments are attempted, counting ones that fail, until the first solution?
    answer:
      numeric: 8
      tolerance: 0
      hint: a whole number
      model: 1R, 2G, 3B, 4R (5's domain becomes empty), 2B, 3G, 4R, 5B
    explanation: |
      Forward checking prunes the neighbors after each assignment [^1]. 1 = R removes R from 2 and 3;
      2 = G leaves 3 = {B} and 4 = {R, B}; 3 = B leaves 4 = {R} and 5 = {R}; then 4 = R empties 5's
      domain and fails. 3 and 4 have no other values left, so the search returns to 2 = B, after
      which 3 = G, 4 = R and 5 = B succeed: 8 attempts. Plain backtracking would need 17 [^2].
    references:
      - title: 'Wikipedia: Look-ahead (backtracking)'
        url: https://en.wikipedia.org/wiki/Look-ahead_(backtracking)
        locator: Look ahead techniques (forward checking)
      - source: mit-ocw-6034-s05
