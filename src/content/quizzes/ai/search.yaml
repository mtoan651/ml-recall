  - id: search-018
    type: short_answer
    difficulty: medium
    tags:
      - a-star
      - consistency
      - expanded-list
    question: |
      An undirected graph has the links A–B (cost 2), A–C (5), B–C (2), B–G (6) and C–G (2). The
      heuristic is $h(A) = 5$, $h(B) = 4$, $h(C) = 0$, $h(G) = 0$. Run A* from A to G with a strict
      expanded list. What is the cost of the path it returns?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: A* extends A, then C via A–C ($f = 5$), then B ($f = 6$) and returns A–C–G with cost 7; the optimum A–B–C–G costs 6.
    explanation: |
      From A, A–C has $f = 5 + 0 = 5$ and A–B has $f = 2 + 4 = 6$, so C is extended first, through
      the expensive link. Extending B then finds A–B–C with cost 4, but C is already on the expanded
      list, so A–C–G ($f = 7$) is returned. The heuristic is admissible (true distances 6, 4, 2, 0)
      but not consistent: it drops by 4 from B to C over a link of cost 2 [^1][^2]. Uniform-cost
      search on the same graph returns A–B–C–G with cost 6.
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2003, Problems 2 Graph Search and 3 A* Algorithm
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Consequences of monotonicity
