  - id: search-037
    type: short_answer
    difficulty: medium
    tags:
      - csp
      - backtracking
      - forward-checking
    question: |
      A board-coloring CSP has squares 1–5 with the constraints 1–2, 2–3, 1–4, 2–5 and 4–5 (neighbors
      must differ). The domains are {R, B}, except square 5, whose domain is {B}. Run backtracking
      with forward checking, assigning variables in the order 1, 2, 3, 4, 5 and trying R before B.
      An assignment fails when forward checking empties some domain. How many assignments are
      attempted in total, counting failed ones, until a solution is found?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number
      model: 1=R, 2=B (fails, domain of 5 becomes empty), 1=B, 2=R, 3=B, 4=R, 5=B
    explanation: |
      After 1 = R, forward checking leaves 2 = {B}; assigning 2 = B removes B from square 5, whose
      domain becomes empty, so 2 = B fails and, with no value left for 2, the search backtracks to
      1 [^1][^2]. With 1 = B, the remaining assignments 2 = R, 3 = B, 4 = R, 5 = B all succeed: 7
      attempts in total. Plain backtracking would only notice the conflict at square 5 and needs 14
      attempts.
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 2 Constraints, part 5
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
