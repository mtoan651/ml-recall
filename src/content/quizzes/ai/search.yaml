  - id: search-049
    type: single
    difficulty: medium
    tags:
      - minimax
      - adversarial-search
      - opponent-model
    question: |
      A minimax agent assumes its opponent plays optimally (with respect to the heuristic and a
      tree of limited depth). In the competition it mostly meets weak opponents that often pick
      poor moves. What should you expect?
    options:
      - text: It still plays well, though it may take longer to win
        correct: true
      - text: It plays badly, because its model of the opponent is wrong on most turns
        why: A wrong opponent model only makes minimax cautious; its choice still guards against the strongest reply [^1].
      - text: Its guaranteed minimum score no longer holds against such an opponent
        why: The minimax value is a worst case over all replies, so any other opponent can only do as well or better for the agent [^2].
      - text: It must switch to averaging over replies, or it will lose most games
        why: Averaging would help exploit a random opponent, but minimax already beats such opponents, as the tutorial's games against a random agent show [^1].
    explanation: |
      Assuming an optimal opponent overestimates a weak one but does not break the algorithm [^1]. The
      score minimax secures is a lower bound against every opponent within the searched tree, so weak
      replies can only help the agent [^2]. The cost is that the agent wins more slowly than it could:
      for instance, it would not stack three discs in one column in its first moves, because it
      expects the opponent to block, though that is a fine opening against a random player [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 4 Examine the assumptions (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/game_ai/ex3.py
      - title: 'Wikipedia: Minimax'
        url: https://en.wikipedia.org/wiki/Minimax#Game_theory
        locator: Game theory — the maximin value is the highest value a player can be sure to get
