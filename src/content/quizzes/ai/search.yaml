  - id: search-015
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - consistency
      - expanded-list
    question: |
      In the undirected graph below, numbers on the links are costs and $h$ is the heuristic. Run A*
      from A to G with a strict expanded list (once a state has been extended it is never extended
      again). What is the cost of the path A* returns?
    figure:
      src: ./search/search-015.svg
      alt: 'Undirected graph: A-B 1, A-C 3, B-C 1, B-G 9, C-G 5, C-H 2, G-H 1; heuristic A 5, B 4, C 1, G 0, H 1.'
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: A, C (via A–C, f = 4), B (f = 5), H (f = 6), then G via A–C–H–G with cost 6; the optimum A–B–C–H–G costs 5.
    explanation: |
      A* extends A, then C through A–C ($f = 3 + 1 = 4$), then B ($f = 1 + 4 = 5$). From B it finds
      the cheaper route A–B–C of cost 2, but C is already on the expanded list, so that path is
      dropped. It then extends H ($f = 6$) and returns A–C–H–G with cost 6, while A–B–C–H–G costs 5.
      The heuristic is admissible but not consistent: from A to C it drops by 4 on a link of cost 3
      (and from B to C by 3 on a link of cost 1), and only a consistent heuristic makes a strict
      expanded list safe [^1][^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problems 2 Graph Search and 3 Heuristics and A*
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Consequences of monotonicity
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q2-sp04
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
