  - id: search-058
    type: single
    difficulty: medium
    tags:
      - hill-climbing
      - heuristic
      - 8-puzzle
    question: |
      Hill climbing solves the 8-puzzle by always moving to the neighbour with the fewest misplaced
      tiles (blank not counted). From the start state below, which move does it make first?

      | Start | | | | Goal | | |
      | --- | --- | --- | --- | --- | --- | --- |
      | 6 | _ | 2 | | 1 | 2 | 3 |
      | 1 | 8 | 4 | | 8 | _ | 4 |
      | 7 | 3 | 5 | | 7 | 6 | 5 |
    options:
      - text: Tile 2 slides left into the blank
        correct: true
      - text: Tile 6 slides right into the blank
        why: Tile 6 is still out of place after this move, so five tiles remain misplaced; no improvement.
      - text: Tile 8 slides up into the blank
        why: Tile 8 is out of place before and after the move, so the count stays at five.
      - text: None, since no neighbour improves the heuristic
        why: Sliding tile 2 left puts it in its goal square and lowers the count from 5 to 4.
    explanation: |
      The start state has five misplaced tiles (6, 2, 1, 8 and 3) [^1]. The blank has three
      neighbours: moving 6 right or 8 up leaves five tiles misplaced, while moving 2 left puts tile 2
      on its goal square, giving 4. Hill climbing takes the best neighbour if it improves on the
      current state, so it moves tile 2 [^2]. With the Manhattan heuristic (9 at the start) moving 2 or
      6 both give 8, a tie that the tie-breaking rule must settle.
    references:
      - source: nptel-ai-search-methods
