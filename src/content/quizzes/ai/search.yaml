  - id: search-060
    type: short_answer
    difficulty: medium
    tags:
      - tsp
      - nearest-neighbour
      - constructive-heuristic
    question: |
      Six cities have the symmetric distances below. The nearest-neighbour heuristic starts at A,
      repeatedly goes to the closest unvisited city, and finally returns to A. What is the length of
      the tour it builds?

      | | B | C | D | E | F |
      | --- | --- | --- | --- | --- | --- |
      | A | 10 | 20 | 30 | 40 | 50 |
      | B | | 31 | 21 | 51 | 41 |
      | C | | | 12 | 59 | 100 |
      | D | | | | 5 | 8 |
      | E | | | | | 69 |
    answer:
      numeric: 245
      tolerance: 0
      hint: a whole number
      model: 'A→B (10) → D (21) → E (5) → C (59) → F (100) → A (50): 245'
    explanation: |
      From A the closest city is B (10), from B it is D (21), from D it is E (5), from E the closest
      unvisited city is C (59), and F is left (100), before the return F→A (50); the total is 245 [^1].
      The greedy choices force the expensive edges C–E and C–F at the end. The greedy-edge heuristic,
      which adds the shortest edges that keep a valid tour (D–E, D–F, A–B, A–C, B–F, C–E), finds
      the tour A, B, F, D, E, C of length 143, which is optimal here. Nearest neighbour is fast but
      can be far from optimal [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 4, Q12–Q14 (greedy and nearest-neighbour tours on Table 4.1)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_04_Assignment_04.pdf
      - title: 'Wikipedia: Nearest neighbour algorithm'
        url: https://en.wikipedia.org/wiki/Nearest_neighbour_algorithm#Algorithm
        locator: Algorithm
