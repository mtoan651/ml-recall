  - id: search-045
    type: short_answer
    difficulty: easy
    tags:
      - game-tree
      - minimax
      - branching-factor
      - connect-four
    question: |
      A minimax agent plans its first move in Connect Four on an empty board with 6 rows and 7
      columns. It builds a game tree of depth 3: its own move, the opponent's reply, and its own next
      move. How many leaf nodes does the tree have?
    answer:
      numeric: 343
      tolerance: 0
      hint: a whole number
      model: $7 \times 7 \times 7 = 7^3 = 343$
    explanation: |
      A move is valid as long as its column has room, and no column of a 6-row board can fill up in
      three moves, so every ply branches 7 ways [^1]. Each of the 7 first moves has 7 replies, and
      each reply 7 continuations: $7^3 = 343$ leaves, the key of the exercise [^2]. The tutorial's toy
      tree with two moves per turn and the same depth has only $2^3 = 8$ leaves [^3]. Leaves grow
      exponentially with depth, which is why the agent scores a shallow tree with a heuristic instead
      of searching the complete game tree of over 4 trillion boards [^4].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 1 Play the Game — tutorial, valid moves and `config`
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut1.ipynb
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 2 Count the leaves (solution `num_leaves = 7*7*7`)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/game_ai/ex3.py
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 N-Step Lookahead — tutorial, Minimax
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut3.ipynb
