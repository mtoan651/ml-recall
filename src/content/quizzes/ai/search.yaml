  - id: search-071
    type: single
    difficulty: medium
    tags:
      - game-tree
      - and-or-tree
      - strategy
    question: |
      A game tree can be read as an AND/OR tree in which a solution is a strategy that wins for MAX.
      Which reading is right?
    options:
      - text: MAX nodes are OR nodes and MIN nodes are AND nodes
        correct: true
      - text: MAX nodes are AND nodes and MIN nodes are OR nodes
        why: MAX picks its own move, so one good child suffices; that is an OR node.
      - text: All nodes are OR nodes, because both players choose a move
        why: MAX does not control MIN's choice, so a strategy must handle every MIN reply; those nodes are AND nodes.
      - text: All nodes are AND nodes, because every move must be explored
        why: At its own nodes MAX needs only one winning move, so they are OR nodes.
    explanation: |
      A strategy for MAX fixes one move at each MAX node but must answer every possible move at each
      MIN node [^1]. So a MAX node is solved if any child is solved (OR), and a MIN node only if all
      children are solved (AND) [^2]. Seen this way, a winning strategy is a solution subtree of the
      AND/OR tree, the same structure that AO* and SSS* work with.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 9, Q1 (game tree as an AND/OR tree)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_09_Assignment_09.pdf
      - title: 'Wikipedia: And–or tree'
        url: https://en.wikipedia.org/wiki/And%E2%80%93or_tree#Relationship_with_two-player_games
        locator: Relationship with two-player games
