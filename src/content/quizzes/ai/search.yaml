  - id: search-076
    type: multiple
    difficulty: hard
    tags:
      - plan-space-planning
      - causal-link
      - threat
    question: |
      In plan-space (partial-order) planning, a causal link $(a_2, P, a_3)$ records that action $a_2$
      produces the condition $P$ for action $a_3$. Which conditions are required for another action
      $a_1$ in the partial plan to be a threat to this link? Select all that apply.
    options:
      - text: $a_1$ has an effect $\lnot Q$ where $Q$ can be unified with $P$
        correct: true
      - text: $a_1$ can be ordered after $a_2$
        correct: true
      - text: $a_1$ can be ordered before $a_3$
        correct: true
      - text: $a_1$ also produces $P$
        why: Producing $P$ cannot break the link; only deleting it can [^2].
      - text: $a_1$ must already be ordered before $a_2$
        why: If $a_1$ is forced before $a_2$, then $a_2$ re-establishes $P$ afterwards, so there is no threat.
    explanation: |
      A threat is an action that could delete $P$ in the interval between producer and consumer [^2].
      That needs an effect $\lnot Q$ unifiable with $P$, and an ordering that allows $a_1$ to fall
      between $a_2$ and $a_3$ [^1]. The planner resolves a threat by promotion (order $a_1$ after
      $a_3$), demotion (before $a_2$) or by binding constraints that keep $Q$ from unifying with $P$
      [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 12, Q12 (necessary conditions for a threat to a causal link)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_12_Assignment_12.pdf
      - title: 'Wikipedia: Partial-order planning'
        url: https://en.wikipedia.org/wiki/Partial-order_planning#Threats
        locator: Partial-order planner — Threats
    source:
