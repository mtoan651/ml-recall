  - id: search-042
    type: single
    difficulty: medium
    tags:
      - csp
      - variable-ordering
      - most-constrained-variable
    question: |
      Seven speakers (T, L, B, C, S, P, N) each get one of four slots, 1–4 pm. These pairs may not
      share a slot: every pair within {B, C, N}, within {L, P, N}, within {T, L, N}, and the pairs
      S–P, L–C and C–P. No speaker has a fixed slot, so all seven domains are equal. Which speaker
      should be assigned first to find a solution quickly?
    options:
      - text: Turing, because he comes first in the speaker list
        why: With equal domains, the order of the list says nothing about difficulty; Turing is in only two constraints.
      - text: Socrates, who is in a single constraint
        why: Least-constrained variables are best left for last; they almost always have a free slot.
      - text: Curie, who is in four constraints
        why: Curie conflicts with B, N, L and P, but Newton is in five constraints (B, C, L, P, T).
      - text: Newton, who is in five constraints
        correct: true
    explanation: |
      With equal domain sizes, the most-constrained-variable rule falls back on the degree heuristic:
      pick the variable involved in the most constraints with unassigned variables [^1]. Newton
      conflicts with Bohr, Curie, Lovelace, Pythagoras and Turing, more than anyone else, so
      assigning him first exposes failures early and prunes the most [^1][^2].
    references:
      - title: 'Wikipedia: Backtracking'
        url: https://en.wikipedia.org/wiki/Backtracking#Constraint_satisfaction
