  - id: search-034
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - admissibility
      - expanded-list
    question: |
      Run A* with an extended list on the graph below from S to G (link costs on the edges, heuristic
      $h$ next to each state, ties broken alphabetically). What is the cost of the path A* returns?
    figure:
      src: ./search/search-034.svg
      alt: 'Undirected graph: S-A 10, S-C 8, S-B 3, A-C 3, B-C 3, C-D 3, C-G 12, C-E 4, D-G 10, E-G 4. Heuristic: S 0, A 5, B 10, C 7, D 0, E 9, G 0.'
    answer:
      numeric: 18
      tolerance: 0
      hint: a whole number
      model: S, B (f 13), C via S–B–C (f 13), D (f 9), A (f 14), then S–B–C–G (f 18) is returned; the optimum S–B–C–E–G costs 14.
    explanation: |
      After S, B ($f = 3 + 10 = 13$) and then S–B–C ($f = 6 + 7 = 13$) are extended. C's children
      get $f$ values D $9 + 0 = 9$, A $9 + 5 = 14$, G $18 + 0 = 18$ and E $10 + 9 = 19$, so A* tries D
      and A, then removes S–B–C–G with cost 18 before ever extending E. The optimal path
      S–B–C–E–G costs 14, but $h(E) = 9$ overestimates E's true distance 4, so the heuristic is not
      admissible [^1]. Branch and bound with an extended list returns the cost-14 path [^2].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Admissibility
        locator: Admissibility
      - source: mit-ocw-6034
        locator: Quiz 1 (2007), Question 2, Part 2 Optimal Search (Fig 2)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2007/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2007#q2.2
