  - id: search-055
    type: single
    difficulty: medium
    tags:
      - depth-first-search
      - graph-search
      - closed-list
    question: |
      A graph is given by its MoveGen function, which lists the neighbours of each node in order:

      | Node | MoveGen |
      | --- | --- |
      | S | A, B |
      | A | C, S |
      | B | D, S |
      | C | E, D, A |
      | D | C, E, B, G |
      | E | C, D, G |
      | G | D, E |

      Depth-first search starts at S with goal G. OPEN is a stack: the new neighbours are put on top
      in MoveGen order, so the first one is picked next. A node already on OPEN or CLOSED is not added
      again, and the goal test is applied when a node is picked from OPEN. Which path does the search
      return?
    options:
      - text: S → A → C → E → G
        correct: true
      - text: S → B → D → G
        why: That is the path breadth-first search returns; DFS commits to A first and never returns to B before reaching G.
      - text: S → A → C → D → G
        why: C's neighbours are E then D, so DFS goes on to E, and E already reaches G.
      - text: S → A → C → E → D → G
        why: When E is expanded, G is one of its new neighbours and is picked next, so D is never needed on the path.
    explanation: |
      DFS picks S, puts A and B on OPEN, and takes A (its first neighbour) [^2]. From A only C is new
      (S is closed); from C the new nodes are E and D, and E comes first. E's neighbour D is already on
      OPEN, so only G is added, and G is picked next. Following the parent pointers gives
      S → A → C → E → G, a 4-edge path, although S → B → D → G has only 3 edges: DFS returns the first
      path it finds, not the shortest [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 2, Q11 (DFS on the MoveGen graph, accepted answer S,A,C,E,G)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search
        locator: Properties; Pseudocode
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment2#q11
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-056
    type: single
    difficulty: hard
    tags:
      - iterative-deepening
      - depth-first-search
      - closed-list
      - optimality
    question: |
      On a graph whose shortest S-to-G route is S → B → D → G (3 edges), depth-first iterative
      deepening (DFID) runs depth-bounded DFS with bound 0, 1, 2, … In each pass it keeps a CLOSED
      list and never adds a node that is already on OPEN or CLOSED. The neighbour lists are
      S: A, B; A: C, S; B: D, S; C: E, D, A; D: C, E, B, G. In the depth-3 pass, DFS reaches D first
      through S → A → C. DFID ends up returning S → A → C → E → G (4 edges). Why does the depth-3
      pass miss the 3-edge path?
    options:
      - text: D was closed at depth 3 via A and C, so the route via B never adds it
        correct: true
      - text: DFID always returns the path that plain depth-first search would return
        why: DFID with a fresh search per bound normally returns a shortest path in edges; here it fails only because of the CLOSED-list pruning.
      - text: The depth bound counts path cost, and the route through B is more expensive
        why: The bound counts edges, and all edges here count equally; S → B → D → G is the shorter route.
      - text: DFID is incomplete on graphs with cycles, so it can skip paths at random
        why: DFID is complete on finite graphs; the miss is deterministic and caused by never re-opening D.
    explanation: |
      Without pruning, DFID explores every path up to the bound, so it finds a goal at the smallest
      depth where one exists [^2]. In this pass, though, D is first generated as a child of C at depth
      3, where the bound forbids expanding it, and it goes to CLOSED. When the search later reaches B
      (depth 1), D is already closed and is not added again, so the 3-edge route through B is lost. The
      goal is found only in the depth-4 pass, through E [^1]. To keep the shortest-path guarantee, a
      depth-bounded search must re-open a node that it reaches again at a smaller depth, or not prune
      against CLOSED at all.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 2, Q14–Q15 (DFID on the MoveGen graph, accepted answer S,A,C,E,G)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Properties
        locator: Properties
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment2#q15
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-057
    type: short_answer
    difficulty: easy
    tags:
      - heuristic
      - manhattan-distance
      - 8-puzzle
    question: |
      In the 8-puzzle below, `_` is the blank. What is the Manhattan-distance heuristic of the start
      state, i.e. the sum over the eight tiles (not the blank) of the horizontal plus vertical distance
      between each tile's position and its goal position?

      | Start | | | | Goal | | |
      | --- | --- | --- | --- | --- | --- | --- |
      | 6 | _ | 2 | | 1 | 2 | 3 |
      | 1 | 8 | 4 | | 8 | _ | 4 |
      | 7 | 3 | 5 | | 7 | 6 | 5 |
    answer:
      numeric: 9
      tolerance: 0
      hint: a whole number
      model: '6: 3, 2: 1, 1: 1, 8: 1, 3: 3, tiles 4, 7, 5: 0, so the sum is 9'
    explanation: |
      Tiles 4, 7 and 5 are already in place. Tile 6 must move two rows down and one column right
      (3), tile 3 two rows up and one column right (3), and tiles 2, 1 and 8 one step each, so the sum
      is 9 [^1]. The simpler "misplaced tiles" heuristic counts five tiles out of place, giving 5.
      Both heuristics are admissible, because every misplaced tile needs at least one move and at
      least its Manhattan distance in moves; Manhattan distance is the larger, better-informed of the
      two [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 3, Q3–Q4 (8-puzzle heuristics h1 = 5, h2 = 9)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_03_Assignment_03.pdf
      - title: 'Wikipedia: Admissible heuristic'
        url: https://en.wikipedia.org/wiki/Admissible_heuristic#Examples
        locator: Examples (fifteen puzzle, Hamming and Manhattan distance)
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment3#q4
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_03_Assignment_03.pdf
    status: reviewed
