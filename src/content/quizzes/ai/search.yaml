  - id: search-074
    type: single
    difficulty: medium
    tags:
      - planning
      - blocks-world
      - regression
      - backward-search
    question: |
      In the blocks world, Stack(X, Y) has preconditions holding(X), clear(Y); add effects on(X, Y),
      clear(X), AE; delete effects holding(X), clear(Y). Backward state-space planning starts from the
      goal $G = \{on(A, B), on(B, C)\}$. What is the subgoal $G'$ obtained by regressing $G$ through
      Stack(A, B)?
    options:
      - text: $\{on(B, C), holding(A), clear(B)\}$
        correct: true
      - text: $\{holding(A), clear(B)\}$
        why: The goal on(B, C) is not achieved by Stack(A, B), so it stays in the regressed goal.
      - text: $\{on(A, B), on(B, C), holding(A), clear(B)\}$
        why: on(A, B) is achieved by the action itself, so it is removed from the goal.
      - text: Stack(A, B) is not relevant to $G$
        why: It adds on(A, B), a goal, and deletes neither goal, so it is relevant.
    explanation: |
      Stack(A, B) is relevant because it adds on(A, B) and deletes neither goal [^1]. Regression
      removes what the action achieves and adds its preconditions:
      $G' = (G \setminus \{on(A,B), clear(A), AE\}) \cup \{holding(A), clear(B)\} =
      \{on(B, C), holding(A), clear(B)\}$ [^1][^2]. The other relevant action here is Stack(B, C).
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 11, Q12 and Q14 (BSSP regression through Stack(A,B); relevant actions)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_11_Assignment_11.pdf
