        locator: Intro to Game AI and RL, Lesson 2 exercise, Question 2 Does the agent win? (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/game_ai/ex2.py
    source:
