  - id: search-050
    type: single
    difficulty: medium
    tags:
      - heuristic
      - one-step-lookahead
      - connect-four
    question: |
      A Connect Four agent scores each valid move by applying a heuristic to the board right after its
      own move, and plays the highest-scoring move (random among ties). The heuristic counts windows
      of four cells holding three of one player's discs and one empty cell. Why can this agent pick a
      move that lets the opponent win on the very next turn?
    options:
      - text: It ignores the opponent's reply, so a losing move can tie with a safe one
        correct: true
      - text: The heuristic only counts horizontal windows, so diagonal threats stay invisible
        why: The heuristic scans horizontal, vertical and both diagonal windows of four [^2].
      - text: It chooses uniformly at random among all valid moves whenever no win is available
        why: It picks at random only among the moves that share the best heuristic score [^2].
      - text: It maximizes the opponent's score, because the heuristic subtracts the opponent's threes
        why: Subtracting the opponent's threes penalizes boards good for the opponent; the agent still maximizes its own score [^2].
    explanation: |
      One-step lookahead scores only the boards one move into the future [^1]. A move that fills the
      cell just below the opponent's winning cell can get the same score as a safe move, because the
      damage shows up only after the opponent replies. In the tutorial's example, the agent picks
      column 5 or 6 with 50% probability each, although column 5 lets the opponent win in one more
      turn [^1]. The exercise shows a board where the same tie gives the agent a coin flip between a
      sure win and a likely loss; searching deeper with minimax fixes this [^3].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 N-Step Lookahead — tutorial, Introduction
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut3.ipynb
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 2 One-Step Lookahead — tutorial, Heuristics and Code
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut2.ipynb
