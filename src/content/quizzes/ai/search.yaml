  - id: search-077
    type: single
    difficulty: medium
    tags:
      - plan-space-planning
      - partial-plan
      - initial-plan
    question: |
      Plan-space planning starts from a partial plan with two dummy actions, $A_0$ and $A_\infty$.
      What are they?
    options:
      - text: $A_0$ has the start state as its effects; $A_\infty$ has the goal as its preconditions
        correct: true
      - text: $A_0$ has the goal as its effects; $A_\infty$ has the start state as its preconditions
        why: The plan must start from the start state and end in the goal, so the roles are the other way round.
      - text: Both have no preconditions and no effects; they only mark the start and end
        why: 'Their conditions are what makes the search work: open preconditions of $A_\infty$ are the initial flaws [^2].'
      - text: $A_0$ holds every action applicable in the start state, $A_\infty$ every relevant action
        why: The initial plan contains just these two actions; real actions are added later to fix flaws.
    explanation: |
      The empty plan is $\{A_0 \prec A_\infty\}$ [^1]. $A_0$ has no preconditions and asserts the start
      state as its effects, and $A_\infty$ has no effects and requires the goal as its preconditions
      [^2]. Planning then repeatedly repairs flaws: an open precondition gets a causal link from an
      existing or new action, and threats are resolved by ordering constraints [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 12, Q4–Q6 (start node of plan-space search; A0 and A-infinity)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_12_Assignment_12.pdf
