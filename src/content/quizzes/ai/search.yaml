  - id: search-072
    type: single
    difficulty: medium
    tags:
      - planning
      - strips
      - regression
    question: |
      In STRIPS, an action $a$ has a precondition set $pre(a)$, an add set $add(a)$ and a delete set
      $del(a)$. Backward state-space planning regresses a goal set $g$ through an action $a$ that is
      relevant to it. Which formula gives the regressed goal $g'$?
    options:
      - text: $g' = (g \setminus add(a)) \cup pre(a)$
        correct: true
      - text: $g' = (g \setminus del(a)) \cup pre(a)$
        why: The goals that $a$ achieves are its add effects, so those are the ones removed from $g$.
      - text: $g' = (g \setminus del(a)) \cup add(a)$
        why: This is progression of a state through $a$, used in forward planning, not regression.
      - text: $g' = (g \setminus add(a)) \cap pre(a)$
        why: The preconditions must all be added as new subgoals, so they are joined with a union.
    explanation: |
      Forward planning progresses a state: $S' = (S \setminus del(a)) \cup add(a)$, applicable when
      $pre(a) \subseteq S$ [^1][^2]. Backward planning asks what must hold before $a$ so that $g$ holds
      after it: the goals that $a$ achieves ($g \cap add(a)$) are no longer needed, and $a$'s
      preconditions become new subgoals, so $g' = (g \setminus add(a)) \cup pre(a)$ [^1]. The action
      must be relevant: it achieves some goal and deletes none.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 11, Q6–Q9 (progression, relevant and applicable actions, regression)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_11_Assignment_11.pdf
      - title: 'Wikipedia: Stanford Research Institute Problem Solver'
        url: https://en.wikipedia.org/wiki/Stanford_Research_Institute_Problem_Solver#Definition
        locator: Definition (operators, state transition)
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment11#q9
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_11_Assignment_11.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-073
    type: multiple
    difficulty: medium
    tags:
      - planning
      - blocks-world
      - applicable-actions
    question: |
      Blocks world with STRIPS operators (AE = arm empty):

      - Pickup(X): pre ontable(X), clear(X), AE
      - Putdown(X): pre holding(X)
      - Unstack(X, Y): pre on(X, Y), clear(X), AE
      - Stack(X, Y): pre holding(X), clear(Y)

      The initial state is ontable(A), ontable(C), on(D, A), on(B, C), clear(D), clear(B), AE. Which
      actions are applicable in it? Select all that apply.
    options:
      - text: Unstack(D, A)
        correct: true
      - text: Unstack(B, C)
        correct: true
      - text: Pickup(A)
        why: A is on the table but D sits on it, so clear(A) is false.
      - text: Pickup(C)
        why: C is under B, so clear(C) is false.
      - text: Stack(B, D)
        why: Stack needs holding(B), but the arm is empty.
    explanation: |
      An action is applicable when all its preconditions are in the state, $pre(a) \subseteq S$
      [^1][^2]. D and B are the clear blocks, both resting on other blocks, and the arm is empty, so
      only Unstack(D, A) and Unstack(B, C) qualify. Picking up A or C needs them to be clear, and
      stacking needs a block in hand.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 11, Q8 and Q13 (applicable actions in the blocks-world problem)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_11_Assignment_11.pdf
      - title: 'Wikipedia: Stanford Research Institute Problem Solver'
        url: https://en.wikipedia.org/wiki/Stanford_Research_Institute_Problem_Solver#Definition
        locator: Definition
