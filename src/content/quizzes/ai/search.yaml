  - id: search-020
    type: single
    difficulty: medium
    tags:
      - uniform-cost-search
      - expanded-list
      - visited-list
    question: |
      The state graph has a manageable number of states but many cycles, links of varying cost, and
      no heuristic. You want shortest paths, and the running time should grow with the number of
      states rather than the number of paths. Which search fits?
    options:
      - text: Iterative deepening (depth-first) without any list
        why: Without a list, cycles make the number of paths explode, and the depth limit counts links rather than cost.
      - text: Uniform-cost search with a visited list
        why: A visited list blocks a state as soon as some path reaches it, so a cheaper path found later is thrown away and optimality is lost.
      - text: Breadth-first search with an expanded list
        why: Breadth-first search counts links, not link costs, so its path need not be the cheapest.
      - text: Uniform-cost search with a strict expanded list
        correct: true
    explanation: |
      Uniform-cost search extends paths in order of cost, so the first time it extends a state it
      has the cheapest path to that state; later paths to it can be dropped. That is exactly what a
      strict expanded list does, and it bounds the work by the number of states [^1][^2]. A visited
      list prunes at the moment a path is added, before its cost is known to be minimal, which breaks
      the guarantee [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Problem 1 Search, choosing a search for each situation (item 2)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Practical optimizations and infinite graphs (uniform-cost search)
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q1-situations-2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-021
    type: short_answer
    difficulty: medium
    tags:
      - a-star
      - expansion-order
      - consistency
    question: |
      An undirected graph has the links S–A (cost 3), S–B (1), B–C (1), A–C (2) and A–G (2). The
      heuristic is $h(S) = 5$, $h(A) = 2$, $h(B) = 3$, $h(C) = 2$, $h(G) = 0$. Run A* from S to G
      with no expanded list (paths with loops are discarded; ties broken alphabetically). List the
      states at the end of the extended paths in order, ending with G.
    answer:
      accept:
        - S B C A G
      pattern: S\W*B\W*C\W*A\W*G
      hint: State letters in order, e.g. S A B
      model: S (f 5), B (f 4), C (f 4), A via S–A (f 5), then S–A–G (f 5) is removed and returned.
    explanation: |
      A* orders paths by $f = g + h$ [^1]. From S: S–B has $f = 1 + 3 = 4$ and S–A has
      $f = 3 + 2 = 5$; S–B–C has $f = 2 + 2 = 4$; S–B–C–A has $f = 4 + 2 = 6$, so S–A ($f = 5$) is
      next, and its child S–A–G ($f = 5$) is removed and returned with cost 5. The heuristic is
      admissible but not consistent (it drops by 2 from S to B on a link of cost 1); without an
      expanded list that does not matter [^2].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Description
        locator: Description
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Problem 1 Search (30 points), A* without expanded list
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
