  - id: search-040
    type: single
    difficulty: hard
    tags:
      - csp
      - problem-formulation
      - constraints
    question: |
      $m$ scientists each request $n$ telescope observations (target, instrument, time slot). A
      schedule must satisfy C1: exactly two observations per scientist are made; C2: at most one
      observation per instrument per slot; C3: all observations in one slot share a target. In which
      CSP formulation is C1 satisfied automatically by the choice of variables and values?
    options:
      - text: Variables are the instrument/slot combinations; values are observations or "empty"
        why: Here C2 holds by construction (one value per instrument and slot), but "exactly two per scientist" needs a constraint over all variables at once.
      - text: Variables are the time slots; values are targets
        why: This drops which observations are made at all, so C1 cannot even be expressed directly, let alone hold automatically.
      - text: Variables are the scientists; values are pairs of their observations
        correct: true
      - text: Variables are the $mn$ requests; values are {granted, rejected}
        why: Nothing in this encoding limits how many of a scientist's requests are granted; C1 becomes a non-binary constraint.
    explanation: |
      If each scientist variable takes a value that is a pair of their own observations, every
      complete assignment schedules exactly two per scientist, so C1 needs no constraint; the domain
      has $\binom{n}{2} = n(n-1)/2$ values [^1]. C2 and C3 then become binary constraints between pairs
      of scientists. Choosing variables so that hard constraints hold by construction is a standard
      way to shrink a CSP [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 (Spring 2005) solutions, Problem 3 Constraint satisfaction, Formulation B
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
      - title: 'Wikipedia: Constraint satisfaction problem'
        url: https://en.wikipedia.org/wiki/Constraint_satisfaction_problem#Formal_definition
        locator: Formal definition
    source:
      id: mit-ocw-6034-s05
      ref: q1_soln#q3b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q1_soln/
