  - id: search-016
    type: single
    difficulty: hard
    tags:
      - consistency
      - admissibility
      - heuristics
    question: |
      In the undirected graph below, A* with a strict expanded list returns a suboptimal path from A
      to G. Which single change to the heuristic values makes the heuristic consistent (and still
      admissible)?
    figure:
      src: ./search/search-016.svg
      alt: 'Undirected graph: A-B 1, A-C 3, B-C 1, B-G 9, C-G 5, C-H 2, G-H 1; heuristic A 5, B 4, C 1, G 0, H 1.'
    options:
      - text: Raise $h(B)$ from 4 to 5
        why: B is only 4 away from G (B–C–H–G), so $h(B) = 5$ is not even admissible.
      - text: Lower $h(A)$ from 5 to 4
        why: The link B–C still breaks consistency, since $h$ drops from 4 to 1 across a link of cost 1.
      - text: Raise $h(C)$ from 1 to 3
        correct: true
      - text: Lower $h(H)$ from 1 to 0
        why: H is not involved in the violations; the links A–C and B–C still drop too fast.
    explanation: |
      Consistency requires $h(n) \le c(n, n') + h(n')$ on every link [^1]. The violations are A–C
      ($5 > 3 + 1$) and B–C ($4 > 1 + 1$), both caused by $h(C)$ being too small. With $h(C) = 3$
      both hold with equality, every other link is fine, and $h(C) = 3$ equals C's true distance
      C–H–G, so the heuristic stays admissible and A* with a strict expanded list then finds
      A–B–C–H–G of cost 5 [^2].
    references:
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Introduction (definition of a consistent heuristic)
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 3 Heuristics and A*, part 3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q3-sp04
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-017
    type: multiple
    difficulty: hard
    tags:
      - a-star
      - admissibility
      - consistency
      - expanded-list
    question: |
      A* is run on a graph with cycles. "Non-strict expanded list" means a state is extended again
      if it is reached by a cheaper path than the one that extended it before; "strict" means a
      state is never extended twice. Which combinations guarantee that A* returns an optimal path?
      Select all that apply.
    options:
      - text: Consistent heuristic, strict expanded list
        correct: true
      - text: Admissible heuristic, visited list (a state is skipped once it has been put on the agenda)
        why: A visited list blocks later, cheaper paths to a state even before the first one is extended, so even UCS breaks with it.
      - text: Admissible heuristic, no expanded list
        correct: true
      - text: Admissible heuristic, strict expanded list
        why: An admissible but inconsistent heuristic can make A* extend a state first along a costly path; a strict list then never repairs it.
      - text: Admissible heuristic, non-strict expanded list
        correct: true
    explanation: |
      With an admissible heuristic, A* is optimal as long as it may reconsider a state reached by a
      cheaper path: with no list at all, or with a list that allows re-extension [^1][^2]. With a
      consistent heuristic the first path that extends a state is already the cheapest one, so a
      strict expanded list is safe too [^3]. Pathmax does not change these answers, and a visited
      list is never safe for optimal search [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2003, Problem 3 A* Algorithm, part 1
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Admissibility
        locator: Admissibility; Optimality and consistency
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Consequences of monotonicity
    source:
