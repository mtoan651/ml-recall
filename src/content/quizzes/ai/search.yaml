  - id: search-062
    type: single
    difficulty: easy
    tags:
      - simulated-annealing
      - temperature
      - local-search
    question: |
      Simulated annealing picks a random neighbour and accepts a worse one with probability
      $e^{-\Delta E / T}$, where $\Delta E > 0$ is how much worse it is. How does it behave at the two
      extremes of the temperature $T$?
    options:
      - text: Very high $T$ acts like a random walk, $T \to 0$ like hill climbing
        correct: true
      - text: Very high $T$ acts like hill climbing, $T \to 0$ like a random walk
        why: At high $T$ the acceptance probability is close to 1 even for bad moves, which is a random walk, not hill climbing [^2].
      - text: Both extremes reduce it to exhaustive breadth-first search of the space
        why: Simulated annealing keeps a single current state and never enumerates the space systematically.
      - text: $T$ only scales the step size, so the behaviour is the same
        why: $T$ changes which worse moves are accepted, not how far a move goes [^2].
    explanation: |
      For large $T$, $e^{-\Delta E/T} \approx 1$, so almost every random neighbour is accepted and the
      search wanders like a random walk (pure exploration) [^1]. As $T \to 0$ the probability of
      accepting a worse move vanishes and only improving moves remain, which is hill climbing (pure
      exploitation) [^2]. Annealing lowers $T$ gradually so that early on it can escape local optima
      and later it settles into a good one.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 4, Q10 (simulated annealing at high and low temperature)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_04_Assignment_04.pdf
      - title: 'Wikipedia: Simulated annealing'
        url: https://en.wikipedia.org/wiki/Simulated_annealing#Acceptance_probabilities
        locator: Overview (Acceptance probability); Parameter selection — Acceptance probabilities
