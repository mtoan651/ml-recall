  - id: search-059
    type: single
    difficulty: hard
    tags:
      - hill-climbing
      - sat
      - local-search
    question: |
      A SAT formula over $a, b, c, d$ has six clauses:
      $(a \lor \lnot b)$, $(\lnot a \lor b \lor c)$, $(\lnot c \lor d)$, $(d)$,
      $(\lnot a \lor b \lor d)$, $(\lnot a \lor \lnot d)$.
      A state is a bit string $abcd$, its neighbours flip exactly one bit, and $h$ is the number of
      satisfied clauses. Steepest-ascent hill climbing starts at $1010$ and stops when no neighbour has
      a higher $h$. Where does it stop?
    options:
      - text: At $0011$, which satisfies all six clauses, after two moves
        correct: true
      - text: At $1011$, a local maximum with five satisfied clauses
        why: From $1011$ the neighbour $0011$ satisfies all six clauses, so the search moves on.
      - text: At $0001$, the other satisfying assignment, after three moves
        why: The first move goes to $1011$ ($h = 5$) and the second to $0011$ ($h = 6$); $0001$ is not on this path.
      - text: At $1010$, because every neighbour is worse
        why: The neighbour $1011$ satisfies five clauses against three for $1010$.
    explanation: |
      At $1010$ only three clauses hold. Its neighbours score $0010{:}\,4$, $1110{:}\,4$, $1000{:}\,3$ and
      $1011{:}\,5$, so hill climbing moves to $1011$ [^1]. From there $0011$ scores 6, the maximum, and
      no neighbour can beat it, so the search stops at a satisfying assignment. Hill climbing moves to
      the best neighbour only while it improves the objective, so on another formula the same
      procedure could stop at a local maximum below 6 [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 3, Q7–Q8 (SAT with h = number of satisfied clauses, start 1010)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_03_Assignment_03.pdf
      - title: 'Wikipedia: Hill climbing'
        url: https://en.wikipedia.org/wiki/Hill_climbing#Local_maxima
        locator: Problems — Local maxima
    source:
