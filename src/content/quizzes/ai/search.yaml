  - id: search-041
    type: single
    difficulty: hard
    tags:
      - csp
      - forward-checking
      - scheduling
    question: |
      Seven speakers — Turing (T), Lovelace (L), Bohr (B), Curie (C), Socrates (S), Pythagoras (P)
      and Newton (N) — get one of four slots, 1–4 pm. Turing must take 1 pm. These pairs may not
      share a slot: every pair within {B, C, N}, within {L, P, N}, within {T, L, N}, and the pairs
      S–P, L–C and C–P. Assign in the order T, L, B, C, S, P, N, always trying the earliest slot,
      with depth-first search plus forward checking. Who shares the 1 pm slot with Turing in the
      schedule found?
    options:
      - text: Bohr and Socrates
        why: With Socrates at 1 pm, Pythagoras and Newton would both be left with only 4 pm; forward checking detects this dead end and Socrates moves to 2 pm.
      - text: Bohr only
        why: After the backtrack on Socrates, Pythagoras can take 1 pm, since he conflicts with neither Turing nor Bohr.
      - text: Socrates and Pythagoras
        why: Socrates and Pythagoras may not share a slot.
      - text: Bohr and Pythagoras
        correct: true
    explanation: |
      T = 1 forces L and N off 1 pm; L takes 2, B takes 1 and C takes 3 (it conflicts with B and L),
      which leaves N only 4 pm and P only 1 or 4 pm. S = 1 would take P's last free slot other than
      4 pm, a dead end that forward checking detects, so S takes 2; then P = 1 and N = 4 [^1]. The schedule is 1 pm: Turing, Bohr, Pythagoras; 2 pm:
      Lovelace, Socrates; 3 pm: Curie; 4 pm: Newton. Forward checking detects the dead end two levels
      earlier than plain backtracking, which first tries every slot for Newton [^2].
    references:
      - source: mit-ocw-6034
        locator: Quiz 2 (2009), Problem 2 Time Travelers' Convention, Part C
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz2_2009/
      - title: 'Wikipedia: Look-ahead (backtracking)'
        url: https://en.wikipedia.org/wiki/Look-ahead_(backtracking)
        locator: Look ahead techniques (forward checking)
