  - id: search-079
    type: short_answer
    difficulty: easy
    tags:
      - bfs
      - complexity
      - branching-factor
    question: |
      Breadth-first search runs on a tree in which every node has exactly $b = 3$ children. The
      shallowest goal is at depth $d = 4$ and is the last node generated at that depth. BFS applies
      the goal test as soon as a node is generated. Counting the root, how many nodes has BFS
      generated when it finds the goal?
    answer:
      numeric: 121
      tolerance: 0
      hint: a whole number
      model: $1 + 3 + 9 + 27 + 81 = 121$
    explanation: |
      BFS generates every node at one depth before any node at the next depth [^1], so in the worst
      case it generates all $1 + b + b^2 + \dots + b^d$ nodes up to the goal depth:
      $1 + 3 + 9 + 27 + 81 = 121$, which is $O(b^d)$. If the goal test is applied only when a node
      is taken off the queue, BFS first expands the other 80 depth-4 nodes as well and generates
      their 240 children, 361 nodes in all, which matches the $O(b^{d+1})$ bound often quoted for
      BFS [^2].
      The aima-python breadth-first graph search applies the goal test to each child as it is
      generated [^3].
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search
        locator: Introduction (level-by-level exploration)
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search#Time_and_space_complexity
        locator: Analysis > Time and space complexity
      - title: 'aima-python (MIT licence), search.py: breadth_first_graph_search'
        url: https://github.com/aimacode/aima-python/blob/f104e03fdc1582f014b3a4c93f1a9b7d2da70114/aima/search.py#L251-L270
        locator: aima/search.py lines 251–270, commit f104e03
    source:
      id: original
      ref: search-079
    status: reviewed
    reviewed_by: claude
  - id: search-080
    type: short_answer
    difficulty: medium
    tags:
      - iterative-deepening
      - complexity
      - branching-factor
    question: |
      Iterative deepening search runs depth-limited DFS with limits 0, 1, 2, … on a tree in which
      every node has $b = 3$ children; the shallowest goal is at depth $d = 4$. The goal is the last
      depth-4 node to be visited, so every pass visits its whole tree. Counting every visit (the root
      is visited once per pass), how many node visits does iterative deepening make in total?
    answer:
      numeric: 179
      tolerance: 0
      hint: a whole number
      model: $\sum_{i=0}^{4} (5 - i)\,3^i = 5 + 12 + 27 + 54 + 81 = 179$
    explanation: |
      Nodes at depth $d$ are visited once, those at depth $d - 1$ twice, and so on up to the root,
      which is visited $d + 1$ times, giving $\sum_{i=0}^{d} (d + 1 - i)\,b^i$ [^1]. For $b = 3$,
      $d = 4$ that is $5 + 12 + 27 + 54 + 81 = 179$, against 121 for one breadth-first pass to the
      same depth: about 48% extra here, and only about 11% when $b = 10$ [^1]. In exchange, iterative
      deepening needs only $O(d)$ memory and still finds a goal with the fewest edges [^2].
    references:
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Time_complexity
        locator: Asymptotic analysis > Time complexity (proof and example)
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Properties
        locator: Properties; Asymptotic analysis > Space complexity
    source:
      id: original
      ref: search-080
    status: reviewed
    reviewed_by: claude
  - id: search-081
    type: multiple
    difficulty: medium
    tags:
      - bfs
      - dfs
      - uniform-cost-search
      - iterative-deepening
      - completeness
      - optimality
    question: |
      Which statements about uninformed search strategies are true? Assume a finite branching
      factor. Select all that apply.
    options:
      - text: Uniform-cost search expands nodes in order of path cost and returns a cheapest path when step costs are positive.
        correct: true
      - text: Depth-limited DFS needs memory exponential in the depth limit, just like BFS.
        why: It keeps only the current path, so its memory is proportional to the depth limit, far less than BFS needs [^2].
      - text: BFS returns a path with the fewest edges, so it is optimal when every step has the same cost.
        correct: true
      - text: DFS is complete even on infinite state spaces, because it backtracks whenever a branch ends.
        why: An infinite branch never ends, so DFS can follow it forever and never return [^1][^2].
      - text: Iterative deepening finds a goal with the fewest edges while using memory linear in the goal depth.
        correct: true
    explanation: |
      BFS explores level by level, so the first goal it reaches has the fewest edges [^1]. With
      unequal step costs that need not be the cheapest path; uniform-cost search, the AI form of
      Dijkstra's algorithm, guarantees it by always expanding the frontier node with the lowest path
      cost [^3]. DFS can get lost in an infinite branch, so it is not complete there [^1][^2].
      Depth-limited DFS stores only the current path [^2], and iterative deepening keeps that $O(d)$
      memory while, like BFS, returning a goal with the fewest edges [^4].
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search#Completeness
        locator: Introduction and Analysis > Completeness
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search#Properties
        locator: Properties
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Running time > Practical optimizations and infinite graphs (uniform-cost search)
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Properties
        locator: Properties; Asymptotic analysis > Space complexity
