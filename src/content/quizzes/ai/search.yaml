  - id: search-051
    type: single
    difficulty: medium
    tags:
      - connect-four
      - rule-based-agent
      - lookahead
    question: |
      A Connect Four agent plays a winning move whenever it has one. Otherwise it blocks any column
      where the opponent could win on its next move, and otherwise it plays a random valid move. It
      checks horizontal, vertical and diagonal lines. In which situation can it still lose?
    options:
      - text: The opponent has two winning columns at once; only one can be blocked
        correct: true
      - text: The opponent's winning line is diagonal and runs downward from left to right
        why: The win check tests both diagonal directions, so the agent sees and blocks such a threat [^2].
      - text: The agent can win this turn, but the opponent also threatens to win next turn
        why: The agent checks its own wins first and plays one, which ends the game before the opponent moves [^2].
      - text: The opponent has three discs stacked in one column with room above them
        why: That is a single threat; the agent blocks it by dropping a disc on top of the stack [^2].
    explanation: |
      Looking one move ahead lets the agent take wins and block single threats, but it can still lose
      in two ways [^1]. If the opponent creates two winning columns at once, blocking one leaves the
      other open. And if the only move left fills the cell just below a cell where the opponent would
      complete four, the agent's own move opens the win for the opponent [^1]. A random move can cause
      the same problem. Seeing such traps requires searching further ahead, which is what minimax
      adds in the next lesson [^3].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 1 exercise, Question 3 Looking ahead (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/game_ai/ex1.py
