  - id: search-047
    type: short_answer
    difficulty: medium
    tags:
      - alpha-beta-pruning
      - minimax
      - game-tree
    question: |
      A minimax agent with alpha-beta pruning searches two moves ahead: its own move, then the
      opponent's reply. It examines its moves in the order 3, 2, 1, and the replies of each move from
      left to right as listed:

      | Agent's move | Scores after each possible reply |
      |---|---|
      | 3 | 5, 9, 8 |
      | 2 | 4, 16 |
      | 1 | 30, −20, 5 |

      How many of the 8 leaf scores does it evaluate?
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: 3 (move 3) + 1 (move 2, cut after 4) + 2 (move 1, cut after −20) = 6
    explanation: |
      Without pruning, minimax evaluates every leaf; alpha-beta skips nodes that cannot affect the
      agent's choice [^1]. Move 3 is searched in full: its value is $\min(5, 9, 8) = 5$, so the agent
      is already guaranteed $\alpha = 5$ [^2]. In move 2 the first reply scores 4: the opponent can hold
      this move to at most 4, which is below 5, so the reply 16 is skipped. In move 1, 30 does not cut,
      but −20 does, so the last reply is skipped. That makes $3 + 1 + 2 = 6$ evaluations and the same
      choice as plain minimax, move 3 with value 5. In the order 1, 2, 3 nothing could be pruned,
      which is why good move ordering matters [^2].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 5 Submit to the competition (alpha-beta pruning)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/ex3.ipynb
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning
        locator: Core idea; Improvements over naive minimax (move ordering)
    source:
      id: kaggle-learn
      ref: game_ai/ex3#q5
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/ex3.ipynb
    status: draft
  - id: search-048
    type: single
    difficulty: easy
    tags:
      - alpha-beta-pruning
      - minimax
    question: |
      You add alpha-beta pruning to a depth-3 minimax agent and keep the same heuristic and depth.
      What changes?
    options:
      - text: It skips nodes that cannot affect the decision and picks the same move
        correct: true
      - text: It may now pick a slightly worse move, in exchange for a much faster search
        why: Pruning is exact; a branch is skipped only when it provably cannot change the minimax value at the root [^2].
      - text: It now assumes a random opponent, so unlikely replies can be ignored
        why: Alpha-beta keeps the minimax assumption of an optimal opponent; it skips replies that cannot matter, not unlikely ones [^1].
      - text: It searches deeper automatically, since pruned nodes free up time
        why: The depth is still set by the agent (`N_STEPS`); pruning only lets the same depth run faster, which you could then spend on a deeper search [^1].
    explanation: |
      Without alpha-beta pruning, minimax evaluates each leaf node; with it, minimax evaluates only
      nodes that could provide information that affects the agent's choice [^1]. The two values alpha
      and beta record the score the agent and the opponent can already guarantee, and a branch is cut
      as soon as it cannot beat them [^2]. The result is the same move and value as plain minimax, so
      the gain is speed only, which the exercise suggests spending on the competition agent [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 5 Submit to the competition
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/ex3.ipynb
      - title: 'Wikipedia: Alpha–beta pruning'
        url: https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning
        locator: Introduction; Core idea
    source:
      id: kaggle-learn
      ref: game_ai/ex3#q5-b
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/ex3.ipynb
