    reviewed_by: claude
  - id: search-082
    type: single
    difficulty: medium
    tags:
      - bfs
      - uniform-cost-search
      - step-costs
    question: |
      An undirected graph has the edges S–A (cost 2), S–B (6), A–C (3), B–G (9) and C–G (4). Starting
      at S with goal G, breadth-first search and uniform-cost search are both run as graph searches.
      Which paths do they return?
    options:
      - text: BFS returns S–B–G (cost 15); UCS returns S–A–C–G (cost 9)
        correct: true
      - text: BFS returns S–A–C–G (cost 9); UCS returns S–B–G (cost 15)
        why: The two are swapped. BFS reaches G first at depth 2 via B, while UCS finds the cheaper three-edge path [^1][^2].
      - text: Both return S–A–C–G (cost 9), the cheapest path
        why: BFS ignores step costs and returns the path with the fewest edges; S–B–G has 2 edges and S–A–C–G has 3 [^1].
      - text: Both return S–B–G (cost 15), the path with the fewest edges
        why: UCS expands in order of path cost, so it pops G at cost 9 via C before the cost-15 route is ever selected [^2].
    explanation: |
      BFS works level by level and stops at the shallowest goal; G is first reached at depth 2 via B,
      so it returns S–B–G with cost 6 + 9 = 15 whatever the step costs [^1]. UCS always expands the
      frontier node with the lowest path cost: S (0), A (2), C (5), B (6). G enters the frontier at
      cost 9 via C, and the route through B would cost 15, so G is popped at cost 9 and UCS returns
      S–A–C–G [^2]. BFS is optimal only when all steps cost the same, and UCS generalises it to
      unequal costs.
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search#Applications
        locator: Introduction and Applications (shortest path measured by number of edges)
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Running time > Practical optimizations and infinite graphs (uniform-cost search pseudocode)
