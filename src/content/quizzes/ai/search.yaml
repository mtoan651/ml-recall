  - id: search-067
    type: single
    difficulty: medium
    tags:
      - ida-star
      - memory
      - space-saving-search
    question: |
      Compared with A* using the same admissible heuristic, what does iterative deepening A* (IDA*)
      gain and what does it pay?
    options:
      - text: Memory linear in the path depth, paid for by re-expanding nodes
        correct: true
      - text: Fewer node expansions than A*, paid for by storing more nodes in memory
        why: IDA* repeats work across iterations, so it usually expands more nodes, while its memory is only linear in depth [^2].
      - text: No need for a heuristic, paid for by losing completeness
        why: IDA* uses the $f = g + h$ threshold, so it needs a heuristic, and it stays complete [^2].
      - text: Faster and smaller, paid for by possibly suboptimal paths
        why: With an admissible heuristic and thresholds raised to the next smallest $f$, IDA* stays optimal; it is usually slower than A* [^2].
    explanation: |
      IDA* runs depth-first searches bounded by a threshold on $f = g + h$, raising the threshold to the
      smallest $f$ that exceeded it in the previous pass [^2]. Being depth-first, it stores only the
      current path, so its memory is linear in the solution depth, while A* keeps all of OPEN and
      CLOSED. The price is time: every iteration re-expands the nodes of the previous ones [^1][^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 7, Q5–Q6 (space-saving versions of A*, IDA*)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_07_Assignment_07.pdf
      - title: 'Wikipedia: Iterative deepening A*'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_A*#Properties
        locator: Description; Properties
