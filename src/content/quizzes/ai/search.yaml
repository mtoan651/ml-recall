  - id: search-061
    type: multiple
    difficulty: medium
    tags:
      - tsp
      - 2-opt
      - local-search
      - neighbourhood
    question: |
      A TSP local search uses the 2-edge exchange (2-opt) neighbourhood: remove two edges of the
      closed tour and reconnect the two paths the other way. The current tour visits
      H, G, F, E, D, C, B, A and then returns to H. Which tours are neighbours of it? Select all that
      apply.
    options:
      - text: H, G, B, C, D, E, F, A
        correct: true
      - text: H, G, F, A, B, C, D, E
        correct: true
      - text: G, H, F, E, D, C, B, A
        correct: true
      - text: H, G, F, D, C, E, B, A
        why: This changes three edges (F–E, C–B and E–D are replaced), which is a 3-opt move.
      - text: H, B, F, E, G, C, D, A
        why: Swapping cities in this way replaces five edges of the tour, far more than two.
    explanation: |
      A 2-opt move deletes two edges and reverses the segment between them, so a neighbour is the old
      tour with one contiguous segment reversed [^2]. Reversing F…B gives H, G, B, C, D, E, F, A
      (edges G–F and B–A become G–B and F–A); reversing E…A gives H, G, F, A, B, C, D, E; reversing
      the segment H, G gives G, H, F, …, A (edges A–H and G–F become A–G and H–F). The other two tours
      differ from the current one in three and five edges [^1].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 4, Q11 (2-edge exchange neighbours of tour H,G,F,E,D,C,B,A)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_04_Assignment_04.pdf
