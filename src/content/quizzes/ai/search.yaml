questions:
  - id: search-001
    type: single
    difficulty: easy
    question: A graph is complete if there is an edge connecting every pair of vertices. How many edges does a complete graph with 10 vertices have?
    options:
      - text: '10'
      - text: '20'
      - text: '25'
      - text: '45'
        correct: true
    explanation: An edge is fixed by choosing its 2 endpoints, and in a complete graph every pair of vertices is joined, so the complete graph $K_n$ has $\binom{n}{2} = n(n-1)/2$ edges [^1]. For $n = 10$ that is $\binom{10}{2} = 45$. Counting the 9 edges at each of the 10 vertices gives 90, which counts every edge twice.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_gt-intro.html
        locator: Sec. 4.1 Definitions (complete graphs K_n)
    source:
      id: mmlu-redux
      ref: college_mathematics/9
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=9
    status: draft
  - id: search-002
    type: single
    difficulty: medium
    question: A tree is a connected graph with no cycles. How many nonisomorphic trees with 5 vertices exist?
    options:
      - text: '1'
      - text: '2'
      - text: '3'
        correct: true
      - text: '4'
    explanation: A tree with 5 vertices has exactly 4 edges [^1], so its vertex degrees add up to 8, and two trees count as the same if one is a relabeling of the other [^2]. Sort the trees by their largest degree. Largest degree 4 gives the star, largest degree 2 gives the path, and largest degree 3 forces one vertex with three neighbours, one of which has the fifth vertex attached. So there are exactly 3 trees up to isomorphism.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_trees.html
        locator: Sec. 4.2 Trees, Proposition 4.2.4
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_gt-intro.html
        locator: Sec. 4.1 Definitions (isomorphic graphs)
    source:
      id: mmlu-redux
      ref: college_mathematics/50
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=50
