  - id: search-053
    type: short_answer
    difficulty: medium
    tags:
      - state-space-search
      - breadth-first-search
      - water-jug
    question: |
      Three jugs hold at most 8, 5 and 3 litres. A state is $(a, b, c)$, the litres in the 8-, 5- and
      3-litre jugs, and the start state is $(8, 0, 0)$. A move pours water from one jug into another
      until the source is empty or the destination is full; no water is added or spilled. What is the
      smallest number of moves that reaches $(4, 4, 0)$?
    answer:
      numeric: 7
      tolerance: 0
      hint: a whole number of moves
      model: '$(8,0,0) \to (3,5,0) \to (3,2,3) \to (6,2,0) \to (6,0,2) \to (1,5,2) \to (1,4,3) \to (4,4,0)$: 7 moves'
    explanation: |
      The puzzle is a state-space search: MoveGen produces the states reachable by one pour, and
      breadth-first search explores the states level by level, so the first time it meets $(4,4,0)$ it
      has found a shortest sequence of moves [^1]. Only 16 states are reachable from $(8,0,0)$, and
      $(4,4,0)$ first appears at depth 7, e.g. via $(3,5,0), (3,2,3), (6,2,0), (6,0,2), (1,5,2),
      (1,4,3)$. This 8–5–3 instance is the standard example of the water pouring puzzle [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 2, Q1–Q2 (water jug problem, accepted answer 7)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
      - title: 'Wikipedia: Water pouring puzzle'
        url: https://en.wikipedia.org/wiki/Water_pouring_puzzle#Standard_example
        locator: Standard example
    source:
