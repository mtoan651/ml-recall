      - most-constrained-variable
    question: |
      In the convention scheduling CSP — four slots; forbidden shared slots for every pair within
      {B, C, N}, within {L, P, N}, within {T, L, N}, and for S–P, L–C, C–P — Turing is now free to
      take any slot, so all seven domains are equal. Which speaker should be assigned first to find a
      solution quickly?
    options:
      - text: Turing, because he was the first speaker so far
        why: With equal domains, the order of the guest list says nothing about difficulty; Turing is in only two constraints.
      - text: Socrates, who is in a single constraint
        why: Least-constrained variables are best left for last; they almost always have a free slot.
      - text: Curie, who appears in the most groups of students
        why: Curie is in four constraints (B, N, L, P); Newton is in five (B, C, L, P, T).
      - text: Newton, who is in five constraints
        correct: true
    explanation: |
      With equal domain sizes, the most-constrained-variable rule falls back on the degree heuristic:
      pick the variable involved in the most constraints with unassigned variables [^1]. Newton
      conflicts with Bohr, Curie, Lovelace, Pythagoras and Turing, more than anyone else, so
      assigning him first exposes failures early and prunes the most [^1][^2].
    references:
      - title: 'Wikipedia: Backtracking'
        url: https://en.wikipedia.org/wiki/Backtracking#Constraint_satisfaction
        locator: Constraint satisfaction (variable ordering)
