  - id: search-052
    type: single
    difficulty: medium
    tags:
      - heuristic
      - connect-four
      - one-step-lookahead
    question: |
      A one-step lookahead agent must choose between two columns. Call a window of four adjacent cells
      holding three discs of one player and one empty cell an "open three".

      - Column 2 blocks the opponent's open three; afterwards neither player has an open three.
      - Column 3 gives the agent a new open three, but the opponent's open three remains.

      Heuristic H1 adds 1 for each of the agent's open threes and −100 for each of the opponent's.
      Heuristic H2 adds 1 and −1 instead. Ties are broken at random. What does each agent do?
    options:
      - text: H1 always blocks; H2 ties the two columns at 0 and blocks half the time
        correct: true
      - text: Both always block, because blocking removes a threat under either heuristic
        why: Under H2, column 3 scores $1 - 1 = 0$, the same as column 2, so the agent picks column 3 half the time [^1].
      - text: H1 always blocks; H2 always plays column 3, since it gains an open three
        why: Under H2 the agent's new three (+1) is cancelled by the opponent's remaining three (−1), so the two columns tie [^1].
      - text: H1 plays column 3, because $1 + 100 = 101$ beats the 0 of column 2
        why: The opponent's open three counts −100, so column 3 scores $1 - 100 = -99$ [^1].
    explanation: |
      Scoring the two boards: under H1, column 2 gets 0 and column 3 gets $1 - 100 = -99$, so the
      agent always blocks; under H2 both columns get 0 and the agent picks either one with 50%
      probability [^1]. Weighting the opponent's threats far more heavily than your own makes blocking
      a sure win for the opponent a priority, which is why the tutorial's heuristic uses −100 against
      +1 [^2]. In general you cannot trust the simpler heuristic to block [^1].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 1 A closer look (hint and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/game_ai/ex3.py
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 2 One-Step Lookahead — tutorial, Heuristics
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut2.ipynb
