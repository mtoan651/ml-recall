  - id: search-046
    type: single
    difficulty: easy
    tags:
      - minimax
      - game-tree
      - adversarial-search
    question: |
      A minimax agent looks two moves ahead: its own move, then the opponent's reply. The heuristic
      scores of the resulting boards are:

      | Agent's move | Scores after each possible reply |
      |---|---|
      | 1 | 30, −20, 5 |
      | 2 | 4, 16 |
      | 3 | 5, 9, 8 |

      Which move does the agent select?
    options:
      - text: Move 3, because its worst-case score, 5, is the highest of the three
        correct: true
      - text: Move 1, because it is the only move that can reach the top score of 30
        why: The opponent chooses the reply, and after move 1 it would choose −20; minimax assumes the opponent forces the lowest score [^1].
      - text: Move 2, because its average score, 10, is the highest of the three
        why: Averaging the replies models a random opponent; minimax instead assumes the opponent picks the reply that is worst for the agent [^1].
      - text: Move 1, because its lowest score is the smallest and minimax minimizes
        why: Only the opponent minimizes; the agent maximizes over its moves the minimum the opponent can force, so −20 makes move 1 the worst choice [^1].
    explanation: |
      Minimax lets the agent choose moves to get a score as high as possible while assuming the
      opponent counters by forcing the score as low as possible [^1]. So each move is worth the
      minimum over the opponent's replies: move 1 is worth −20, move 2 is worth 4 and move 3 is worth
      5. The agent takes the maximum, move 3. It gives up the chance of 30 on move 1 in exchange for a
      guaranteed 5, the same trade as the tutorial's example, where the agent prefers a guaranteed +10
      to a risky +40 [^1]. The exercise asks the same question about a tree in a picture [^2].
    references:
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 N-Step Lookahead — tutorial, Minimax
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/tut3.ipynb
      - source: kaggle-learn
        locator: Intro to Game AI and RL, Lesson 3 exercise, Question 3 Which move will the agent select?
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/game_ai/raw/ex3.ipynb
    source:
