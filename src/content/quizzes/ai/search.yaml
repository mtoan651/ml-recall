  - id: search-019
    type: short_answer
    difficulty: medium
    tags:
      - greedy-best-first-search
      - expansion-order
      - tree-search
    question: |
      Run greedy best-first search (always extend the agenda path whose last state has the smallest
      $h$) on the tree below from A to the goal J, with no visited list. Arc lengths are on the
      edges; $h(B) = 1$, $h(C) = 6$, $h(D) = 3$ and every other state has $h = 0$. Ties are broken
      alphabetically. List the states in the order they are expanded, ending with J.
    figure:
      src: ./search/search-019.svg
      alt: 'Tree rooted at A: A-B 5, A-C 2, A-D 4; B-E 6, B-F 3, B-G 4; C-H 9; D-I 6, D-J 3. Heuristic h=1 at B, h=6 at C, h=3 at D.'
    answer:
      accept:
        - A B E F G D I J
      pattern: A\W*B\W*E\W*F\W*G\W*D\W*I\W*J
      hint: State letters in order, e.g. A B C
      model: A, B (h 1), E, F, G (h 0, dead ends), D (h 3), I, J
    explanation: |
      Greedy best-first search orders the whole agenda by $h$ alone and ignores arc lengths [^1].
      After A it picks B ($h = 1$), whose children E, F, G all have $h = 0$ and are expanded as dead
      ends; then D ($h = 3$) beats C ($h = 6$), and its children I and J ($h = 0$) follow. A* would
      add the path cost and expand only A, B, D, J [^2].
    references:
      - title: 'Wikipedia: Best-first search'
        url: https://en.wikipedia.org/wiki/Best-first_search#Greedy_BeFS
        locator: Greedy BeFS
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2003, Problem 1 Tree Search
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    source:
