  - id: search-064
    type: multiple
    difficulty: medium
    tags:
      - a-star
      - admissibility
      - completeness
    question: |
      A* expands nodes in order of $f(n) = g(n) + h(n)$. Which conditions together guarantee that it
      terminates with an optimal (least-cost) path whenever a path exists, even on an infinite graph?
      Select all that apply.
    options:
      - text: Every node has finitely many successors
        correct: true
      - text: Every edge costs at least some fixed $\varepsilon > 0$
        correct: true
      - text: $h(n)$ never exceeds the true cost $h^*(n)$ from $n$ to a goal
        correct: true
      - text: $h(n) \ge h^*(n)$ for every node, so that $h$ is never too optimistic
        why: An overestimating heuristic can make A* stop on a suboptimal path; admissibility needs $h \le h^*$ [^2].
      - text: The search space must be a tree rather than a graph
        why: A* works on graphs; it handles repeated states with its OPEN and CLOSED lists [^2].
    explanation: |
      With a finite branching factor and edge costs bounded away from zero, only finitely many nodes
      have $f$ below the optimal cost, so A* cannot run forever along an infinite path [^2]. If in
      addition $h(n) \le h^*(n)$ (an admissible heuristic), the goal cannot be picked from OPEN while a
      cheaper path is still pending, so the first goal expanded is optimal [^1][^2]. These are the
      three conditions of the admissibility theorem for A*.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 6, Q3–Q4 (conditions for the admissibility and termination of A*)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_06_Assignment_06.pdf
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Properties
        locator: Properties — Termination and completeness; Admissibility
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment6#q3
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_06_Assignment_06.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-065
    type: multiple
    difficulty: hard
    tags:
      - a-star
      - consistent-heuristic
      - monotone
    question: |
      A heuristic is consistent (monotone) if $h(m) \le c(m, n) + h(n)$ for every edge $m \to n$, and
      $h = 0$ at goal nodes. What follows when A* uses a consistent heuristic? Select all that apply.
    options:
      - text: When A* picks a node from OPEN, it has already found an optimal path to that node
        correct: true
      - text: The $f$-values of the nodes A* picks for expansion never decrease
        correct: true
      - text: The heuristic may still overestimate the cost to the goal at some nodes
        why: Summing the inequality along any path to a goal gives $h(n) \le h^*(n)$, so a consistent heuristic is admissible [^2].
      - text: Closed nodes must be re-opened whenever a cheaper path to them turns up
        why: With a consistent heuristic a cheaper path to a closed node never turns up, so no node is expanded twice [^2].
    explanation: |
      Along an edge $m \to n$, consistency gives $f(n) = g(m) + c(m,n) + h(n) \ge g(m) + h(m) = f(m)$,
      so $f$ never decreases along a path and A* picks nodes in non-decreasing order of $f$ [^1][^2].
      It follows that when a node is picked its $g$ value is already optimal, so A* never needs to
      re-open a closed node and expands each node at most once [^2]. Consistency also implies
      admissibility, so A* stays optimal.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 7, Q3–Q4 (monotone heuristics)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_07_Assignment_07.pdf
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic#Consequences_of_monotonicity
        locator: Introduction; Consequences of monotonicity
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment7#q4
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_07_Assignment_07.pdf
    status: reviewed
    reviewed_by: claude
  - id: search-066
    type: single
    difficulty: medium
    tags:
      - weighted-a-star
      - bounded-suboptimality
    question: |
      Weighted A* orders OPEN by $f(n) = g(n) + w \cdot h(n)$ with $w = 2$ and an admissible $h$.
      What is guaranteed about the cost of the path it returns, compared with the optimal cost $C^*$?
    options:
      - text: It is at most $2C^*$
        correct: true
      - text: It equals $C^*$, because $h$ is admissible
        why: Multiplying $h$ by 2 can make $w \cdot h$ overestimate, so optimality is lost; only a bound remains [^2].
      - text: It is at least $2C^*$
        why: The weight trades optimality for speed, but the returned path is often optimal or close to it; the guarantee is an upper bound.
      - text: Nothing; with $w > 1$ the path can be arbitrarily bad
        why: With an admissible $h$, weighted A* is $w$-admissible, so its path costs at most $w$ times the optimum [^2].
    explanation: |
      Inflating the heuristic makes A* greedier: it expands fewer nodes but may return a costlier
      path. In the NPTEL example, A* finds a path of cost 148, while weighted A* with $w = 2$ returns
      one of cost 153 [^1]. With an admissible $h$, the path returned by weighted A* costs at most
      $w \cdot C^*$, so here at most twice the optimum [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 6, Q5 and Assignment 7, Q7 (A* cost 148 vs weighted A* cost 153 on Fig. 3.2)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_07_Assignment_07.pdf
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Bounded_relaxation
        locator: Bounded relaxation (weighted A*)
    source:
