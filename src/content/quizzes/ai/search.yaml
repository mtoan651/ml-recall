  - id: search-022
    type: short_answer
    difficulty: easy
    tags:
      - state-space
      - problem-formulation
    question: |
      A rover must leave the lander, collect rock samples at three sites (in any order) and return.
      It can drive directly between any two of the four places, and travel times are known. A state
      records the rover's current location and, for each site, whether its rock has been collected.
      How many states does this state space have?
    answer:
      numeric: 32
      tolerance: 0
      hint: a whole number
      model: $4 \text{ locations} \times 2^3 \text{ rock flags} = 32$
    explanation: |
      The location takes 4 values (lander, site 1, 2 or 3) and each of the three "collected?" flags
      takes 2, so there are $4 \cdot 2^3 = 32$ states; the start is (lander, no, no, no) and the goal
      is (lander, yes, yes, yes) [^1]. Recording the path taken would be redundant, because the cost
      to go depends only on these variables. A state space this small can be searched with
      uniform-cost search or A* directly [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 4 Search problem formulation
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: State space search'
        url: https://en.wikipedia.org/wiki/State_space_search
        locator: Representation
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q4.1-sp04
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-023
    type: single
    difficulty: hard
    tags:
      - heuristics
      - admissibility
      - problem-formulation
    question: |
      A rover must visit three rock sites and return to the lander. Travel times are known between
      all four places, and driving directly is never slower than going through another place.
      "Time from the current place back to the lander" is an admissible but weak heuristic. Which
      heuristic is stronger and still admissible?
    options:
      - text: The max over uncollected sites $r$ of time(current, $r$) + time($r$, lander)
        correct: true
      - text: The sum of the times from the current place to every uncollected site
        why: Visiting the sites one after another can be much shorter than driving to each of them separately from here.
      - text: The sum, over uncollected sites $r$, of time(current, $r$) + time($r$, lander)
        why: One trip can visit several sites, so adding separate round trips counts shared driving more than once and overestimates.
      - text: The time of the longest link between any two of the four places
        why: Near the end of the task (e.g. one rock left next to the lander) the remaining time can be much shorter than the longest link.
    explanation: |
      Each uncollected site $r$ must still be visited, and afterwards the rover must reach the
      lander, so the remaining time is at least time(current, $r$) + time($r$, lander) for every such
      $r$ (triangle inequality on direct travel times) [^1]. The maximum of lower bounds is again a
      lower bound, so it is admissible and at least as large as the distance to the lander [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 1 review solutions — Quiz 1 Spring 2004, Problem 4 Search problem formulation, part 3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
      - title: 'Wikipedia: Admissible heuristic'
        url: https://en.wikipedia.org/wiki/Admissible_heuristic
        locator: Search algorithms
    source:
      id: mit-ocw-6034-s05
      ref: quiz1_review_sol#q4.3-sp04
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz1_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-024
    type: multiple
    difficulty: medium
    tags:
      - breadth-first-search
      - depth-first-search
      - completeness
      - optimality
    question: |
      All edges cost 1 and the state graph is finite but may contain cycles. A visited list means a
      state is never put on the queue twice; without one, the search does not check for repeated
      states at all. Which statements are true? Select all that apply.
    options:
      - text: Breadth-first search with a visited list is guaranteed to find a shortest path if one exists
        correct: true
      - text: Breadth-first search without a visited list is guaranteed to find a path if one exists
        correct: true
      - text: Depth-first search with a visited list is guaranteed to find a shortest path if one exists
        why: Depth-first search returns the first path it completes, which can be much longer than the shortest one.
      - text: Depth-first search without a visited list is guaranteed to find a path if one exists
        why: Without a visited list it can follow a cycle forever and never come back to try other branches.
      - text: Iterative deepening typically needs far less memory than breadth-first search
        correct: true
    explanation: |
      Breadth-first search explores level by level, so with unit costs the first goal it reaches is
      at minimum depth, and it reaches every finite depth even when cycles repeat states [^1][^2].
      Depth-first search commits to one branch; on a cycle without a visited list that branch never
      ends [^3]. Iterative deepening keeps only the current path in memory, $O(bd)$ instead of
      $O(b^d)$ [^4].
    references:
      - source: mit-ocw-16410
        locator: Sample Midterm solutions, Problem 1.B Search Issues
        url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search#Completeness
        locator: Completeness
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search#Properties
        locator: Properties
      - title: 'Wikipedia: Iterative deepening depth-first search'
        url: https://en.wikipedia.org/wiki/Iterative_deepening_depth-first_search#Asymptotic_analysis
        locator: Asymptotic analysis (space complexity)
    source:
      id: mit-ocw-16410
      ref: mit16_410f10_mid_sol#q1b
      url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-025
    type: short_answer
    difficulty: medium
    tags:
      - search-tree
      - complexity
      - branching-factor
    question: |
      A search tree of depth $d$ has a varying branching factor: every node on level $i$ (root on
      level 0) has $d - i$ children, so the root has $d$ children and the nodes on level $d$ have
      none. For $d = 4$, how many nodes does the tree have in total?
    answer:
      numeric: 65
      tolerance: 0
      hint: a whole number
      model: $T(d) = 1 + d\,T(d-1)$ with $T(0) = 1$, so $T(1) = 2$, $T(2) = 5$, $T(3) = 16$, $T(4) = 65$.
    explanation: |
      Level $m$ has $d(d-1)\cdots(d-m+1) = d!/(d-m)!$ nodes, so for $d = 4$ the levels hold
      1, 4, 12, 24 and 24 nodes, 65 in all [^1]. The same count follows from the recursion
      $T(d) = 1 + d\,T(d-1)$: the root plus $d$ subtrees of depth $d-1$. In the worst case
      breadth-first search generates every one of these nodes before reaching a goal on the last
      level [^1][^2].
    references:
      - source: mit-ocw-16410
        locator: Sample Midterm solutions, Problem 1.C Complexity Analysis
        url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search#Time_and_space_complexity
        locator: Time and space complexity
    source:
      id: mit-ocw-16410
      ref: mit16_410f10_mid_sol#q1c
      url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-026
    type: short_answer
    difficulty: medium
    tags:
      - depth-first-search
      - visited-list
      - expansion-order
    question: |
      A directed graph has the edges S→A, S→B, A→C, A→D, C→E, D→E and D→G. Run depth-first search
      from S to G with a visited list: a state is marked visited when a path to it is put on the
      queue and is never queued again. Children are queued alphabetically, and the search stops when
      G is expanded (taken off the queue). List the states in the order they are expanded.
    answer:
      accept:
        - S A C E D G
      pattern: S\W*A\W*C\W*E\W*D\W*G
      hint: State letters in order, e.g. S A B
      model: S, A, C, E (dead end), D (its child E is already visited), G
    explanation: |
      Expanding S queues A and B; A queues C and D in front of B; C queues E, which has no children
      [^1]. D's child E is already visited, so only G is queued, and G is expanded next, giving the
      path S–A–D–G; B is never expanded [^1][^2]. A visited list prunes at queueing time, which
      keeps DFS from revisiting states but would break optimal searches such as uniform-cost search.
    references:
      - source: mit-ocw-16410
        locator: Sample Midterm solutions, Problem 1.A Depth-first Search with a Visited List
        url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search#Pseudocode
        locator: Pseudocode (iterative version with a stack)
    source:
      id: mit-ocw-16410
      ref: mit16_410f10_mid_sol#q1a
      url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
    status: reviewed
    reviewed_by: claude
  - id: search-027
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - expanded-list
      - expansion-order
    question: |
      Run A* with an extended list (a state is extended at most once) on the undirected graph below,
      from H to the goal G. Link costs are on the edges and $h$ is the heuristic estimate. Ties in
      $f$ are broken alphabetically. List the states in the order they are extended (do not include
      G, which ends the search when its path is removed from the agenda).
    figure:
      src: ./search/search-027.svg
      alt: 'Undirected graph: H-F 4, H-C 3, H-D 3, H-B 2, D-C 4, D-B 3, F-C 3, C-B 3, F-A 3, F-E 3, A-E 3, E-G 3. Heuristic: H 5, F 5, C 4, D 5, B 2, A 5, E 3, G 0.'
    answer:
      accept:
        - H B C D F E
      pattern: H\W*B\W*C\W*D\W*F\W*E
      hint: State letters in order, e.g. H A B
      model: H (5), B (4), C (7), D (8), F (9), E (10); then H–F–E–G with f = 10 is returned.
    explanation: |
      From H the paths get $f = g + h$: B $2 + 2 = 4$, C $3 + 4 = 7$, D $3 + 5 = 8$, F $4 + 5 = 9$
      [^1]. B is extended first but only adds worse paths to C and D; then C (7) and D (8). At
      $f = 9$, H–B–C is skipped (C already extended) and F is extended, adding H–F–E with
      $f = 7 + 3 = 10$. E is extended next and H–F–E–G ($f = 10$) is returned, the optimal path of
      cost 10; A is never extended [^2].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Description
        locator: Description
      - source: mit-ocw-6034
        locator: Quiz 1 (2010), Problem 2 Part B2 A* + Extended List
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2010#q2b2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    status: reviewed
    reviewed_by: claude
  - id: search-028
    type: single
    difficulty: medium
    tags:
      - branch-and-bound
      - a-star
      - heuristics
    question: |
      On the graph below (from H to G, link costs on the edges, heuristic $h$), branch and bound
      with an extended list and A* with an extended list both return H–F–E–G. Which state does
      branch and bound extend that A* never extends?
    figure:
      src: ./search/search-028.svg
      alt: 'Undirected graph: H-F 4, H-C 3, H-D 3, H-B 2, D-C 4, D-B 3, F-C 3, C-B 3, F-A 3, F-E 3, A-E 3, E-G 3. Heuristic: H 5, F 5, C 4, D 5, B 2, A 5, E 3, G 0.'
    options:
      - text: D
        why: D is extended by both; for A* its $f = 3 + 5 = 8$ is below the final cost 10.
      - text: A
        correct: true
      - text: B
        why: B has the smallest $f$ after H ($2 + 2 = 4$), so A* extends it first, just as branch and bound does.
      - text: E
        why: E lies on the returned path H–F–E–G, so both searches extend it.
    explanation: |
      Branch and bound orders paths by cost alone and extends H, B, C, D, F, A, E: H–F–A costs 7,
      the same as H–F–E, and wins the tie alphabetically [^1]. A* adds $h$: H–F–A gets
      $f = 7 + 5 = 12$, above the optimal cost 10, so A* finishes before extending A [^2]. That is
      the point of an admissible heuristic: paths whose $f$ exceeds the optimal cost are never
      extended.
    references:
      - source: mit-ocw-6034
        locator: Quiz 1 (2010), Problem 2 Part B Optimal Searches (B1 Branch & Bound, B2 A*)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Properties
        locator: Properties
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2010#q2b1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    status: reviewed
    reviewed_by: claude
  - id: search-029
    type: short_answer
    difficulty: medium
    tags:
      - depth-first-search
      - expanded-list
      - backtracking
    question: |
      Run depth-first search with backtracking and an extended list on the graph below (ignore the
      costs and $h$ values), from H to the goal G. Neighbors are tried alphabetically and a path
      never revisits a state already on it. Which path is found?
    figure:
      src: ./search/search-029.svg
      alt: 'Undirected graph: H-F 4, H-C 3, H-D 3, H-B 2, D-C 4, D-B 3, F-C 3, C-B 3, F-A 3, F-E 3, A-E 3, E-G 3. Heuristic: H 5, F 5, C 4, D 5, B 2, A 5, E 3, G 0.'
    answer:
      accept:
        - H B C F A E G
      pattern: H\W*B\W*C\W*F\W*A\W*E\W*G
      hint: State letters along the path, e.g. H A B G
      model: H–B–C–F–A–E–G (D is a dead end, so the search backtracks to C)
    explanation: |
      Depth-first search always extends the newest path [^1]. From H it goes to B, then C, then D,
      whose neighbors B, C and H are all on the path, so it backtracks to C and tries F. From F it
      goes to A (alphabetically before E), then E, then G. The path has six links, while breadth-first
      search would return H–F–E–G with three [^2].
    references:
      - title: 'Wikipedia: Depth-first search'
        url: https://en.wikipedia.org/wiki/Depth-first_search#Properties
        locator: Properties
      - source: mit-ocw-6034
        locator: Quiz 1 (2010), Problem 2 Part A Depth First Search + Extended List
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2010#q2a
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2010/
    status: reviewed
    reviewed_by: claude
  - id: search-030
    type: short_answer
    difficulty: medium
    tags:
      - branch-and-bound
      - uniform-cost-search
      - shortest-path
    question: |
      The graph below shows streets with travel times on the edges (ignore the $h$ values). Using
      branch and bound with an extended list (no heuristic), what is the cost of the cheapest path
      from S to T?
    figure:
      src: ./search/search-030.svg
      alt: 'Undirected graph: S-B 10, S-A 2, A-F 4, B-F 2, B-C 5, C-E 5, C-J 12, J-L 4, L-T 5, J-K 1, K-T 7, F-H 8, D-H 3, H-K 5. Oracle estimates: S 10, A 6, B 5, C 2, E 1, F 100, J 3, L 4, T 0, D 5, H 2, K 100.'
    answer:
      numeric: 26
      tolerance: 0
      hint: a whole number
      model: S–A–F–H–K–T, $2 + 4 + 8 + 5 + 7 = 26$
    explanation: |
      Branch and bound extends the cheapest path first and stops when a path to T is removed from
      the agenda, so it returns a cheapest path [^1]. The candidates through F and H cost
      $2 + 4 + 8 + 5 + 7 = 26$; the northern route S–B–C–J–K–T costs $10 + 5 + 12 + 1 + 7 = 35$, and
      reaching B through A and F ($2 + 4 + 2 = 8$) does not make it cheaper than 26. Before it can
      stop, it must also extend every path cheaper than 26 [^2].
    references:
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Practical optimizations and infinite graphs (uniform-cost search)
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 2 Part B (branch and bound with an extended list)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2009#q2b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    status: reviewed
    reviewed_by: claude
  - id: search-031
    type: single
    difficulty: hard
    tags:
      - a-star
      - admissibility
      - heuristics
    question: |
      On the street graph below, A* with an extended list and the oracle estimates $h$ shown returns
      S–B–C–J–L–T with cost 36, although S–A–F–H–K–T costs 26. Why?
    figure:
      src: ./search/search-031.svg
      alt: 'Undirected graph: S-B 10, S-A 2, A-F 4, B-F 2, B-C 5, C-E 5, C-J 12, J-L 4, L-T 5, J-K 1, K-T 7, F-H 8, D-H 3, H-K 5. Oracle estimates: S 10, A 6, B 5, C 2, E 1, F 100, J 3, L 4, T 0, D 5, H 2, K 100.'
    options:
      - text: A* with an extended list never returns optimal paths on graphs with cycles
        why: With a consistent heuristic, A* with an extended list is optimal on any graph with non-negative costs.
      - text: Ties in $f$ were broken alphabetically, which hid the cheaper path
        why: The cheaper path is never even close in $f$; F alone gets $f = 6 + 100 = 106$.
      - text: $h$ overestimates at F and K (100 each), so it is not admissible
        correct: true
      - text: The estimate at S (10) is larger than the true distance from S to T
        why: The true distance from S is 26, so $h(S) = 10$ underestimates it.
    explanation: |
      A* is guaranteed optimal only when $h$ never overestimates the remaining cost [^1]. Here F's
      true distance to T is 20 and K's is 7, but both are estimated at 100, so every path through F
      or K gets a huge $f$ and is postponed; A* extends S, A, B, C, E, J, L and returns the path
      through L. Branch and bound, which ignores $h$, returns the cost-26 path [^2].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Admissibility
        locator: Admissibility
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 2 Part C (A* with an extended list and oracle estimates)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2009#q2c
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    status: reviewed
    reviewed_by: claude
  - id: search-032
    type: short_answer
    difficulty: medium
    tags:
      - breadth-first-search
      - expanded-list
    question: |
      An undirected graph has the edges S–A, S–B, S–C, A–D, B–H, C–E, E–F, F–H, F–J, H–I, I–J and
      I–G. Run breadth-first search with an extended list from S to the goal G, taking neighbors
      alphabetically. Which path is found?
    answer:
      accept:
        - S B H I G
      pattern: S\W*B\W*H\W*I\W*G
      hint: State letters along the path, e.g. S A D
      model: S–B–H–I–G (4 links; S–C–E–F–J–I–G would take 6)
    explanation: |
      Breadth-first search extends paths level by level, so it returns a path with the fewest links
      [^1]. Level 1 holds A, B, C; level 2 holds D (from A), H (from B) and E (from C); level 3 holds
      F and I (from H) and F again (from E, discarded by the extended list); level 4 reaches G from
      I. The result is S–B–H–I–G [^2].
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search
        locator: Introduction; Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 1 (2008), Problem 2 Part A3 (breadth-first search with an extended list)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2008#q2a3
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
    status: reviewed
    reviewed_by: claude
  - id: search-033
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - consistency
      - expanded-list
    question: |
      In the graph below, link lengths are on the edges and $h$ is a heuristic that never
      overestimates the distance to G. Run A* with an extended list (each state extended at most
      once) from S to G. What is the cost of the path it returns?
    figure:
      src: ./search/search-033.svg
      alt: 'Undirected graph: S-A 100, A-C 4, C-I 50, S-B 3, B-D 4, D-I 50, S-E 14, E-H 16, S-F 4, F-H 16, H-I 30, I-G 10. Heuristic: S 0, A 60, B 50, C 55, D 50, E 56, F 50, H 39, I 0, G 0.'
    answer:
      numeric: 67
      tolerance: 0
      hint: a whole number
      model: A* extends S, B, F, D, I (reached via S–B–D–I, f = 57), H; S–F–H–I is dropped because I is already extended, so S–B–D–I–G (67) is returned instead of S–F–H–I–G (60).
    explanation: |
      A* reaches I first along S–B–D–I ($g = 57$, $f = 57$) and extends it before H ($f = 59$).
      When H is extended, the cheaper path S–F–H–I ($g = 50$) arrives, but I is already on the
      extended list and the path is discarded, so S–B–D–I–G with cost 67 is returned. The heuristic
      is admissible but not consistent: $h(H) = 39 > c(H, I) + h(I) = 30$ [^1][^2]. Branch and
      bound (or A* without an extended list) returns S–F–H–I–G with cost 60.
    references:
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic
        locator: Consequences of monotonicity
      - source: mit-ocw-6034
        locator: Quiz 1 (2008), Problem 2 Part B Optimal Search (B1–B3)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2008#q2b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
