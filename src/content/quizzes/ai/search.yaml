  - id: search-054
    type: multiple
    difficulty: hard
    tags:
      - state-space-search
      - water-jug
      - reversibility
    question: |
      In the 8–5–3 litre jug puzzle, the state $(a, b, c)$ gives the litres in the 8-, 5- and
      3-litre jugs, the start is $(8, 0, 0)$, and a move pours from one jug into another until the
      source is empty or the destination is full. Consider the states reachable from the start.
      Select all that apply.
    options:
      - text: Every reachable state can be reached from every other reachable state
        correct: true
      - text: Each of the volumes 1, 2, …, 8 litres appears in some jug in some reachable state
        correct: true
      - text: Every move can be undone by a single move
        why: From $(6,2,0)$, pouring the 8-litre jug into the 5-litre jug gives $(3,5,0)$, and no single pour leads from $(3,5,0)$ back to $(6,2,0)$ [^2].
      - text: Some reachable states have no legal move at all
        why: The 8 litres always sit in at least one jug while another jug has room, so every state has a move out.
      - text: All 24 triples with $a + b + c = 8$ that fit the jugs are reachable
        why: Only 16 states are reachable; states such as $(4, 2, 2)$ never occur, because after each pour some jug is empty or full.
    explanation: |
      Running breadth-first search from every state of this space shows that it is strongly
      connected: 16 states are reachable and each can reach all the others, so every volume from 1 to
      8 litres can be measured [^1]. Connectivity does not mean that single moves are reversible. A
      pour stops when the source is empty or the destination is full, so undoing a pour sometimes
      needs a detour of several moves; Wikipedia discusses this asymmetry of actions [^2]. Every
      reachable state has at least one jug empty or full, which is why only 16 of the 24 candidate
      triples occur.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 2, Q3 and Q8 (properties of the water-jug state space)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_02_Assignment_02.pdf
      - title: 'Wikipedia: Water pouring puzzle'
        url: https://en.wikipedia.org/wiki/Water_pouring_puzzle#Reversibility_of_actions
        locator: Reversibility of actions
