  - id: search-063
    type: multiple
    difficulty: medium
    tags:
      - tabu-search
      - local-search
      - local-optimum
    question: Which statements about tabu search are true? Select all that apply.
    options:
      - text: It may move to the best neighbour even when that neighbour is worse than the current state
        correct: true
      - text: Recent moves are made tabu for a few iterations, so it does not drop straight back into the optimum it just left
        correct: true
      - text: With a fixed tie-breaking rule, the sequence of states it visits is deterministic
        correct: true
      - text: It never accepts a neighbour that is worse than the current state
        why: That is hill climbing; tabu search keeps moving to the best allowed neighbour even when it is worse [^2].
      - text: It accepts a random worse neighbour with a probability that falls over time
        why: That is simulated annealing; tabu search chooses the best non-tabu neighbour, without randomness [^2].
    explanation: |
      Tabu search is a local search that always moves to the best neighbour that is not tabu, even if
      it is worse, which lets it walk out of a local optimum [^2]. A short-term memory (the tabu list,
      with a tenure of a few moves) forbids undoing recent changes, so the search does not bounce
      straight back [^1][^2]. Nothing in this rule is random, so with fixed tie-breaking it is
      deterministic, unlike simulated annealing or random walk.
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 4, Q3 and Q6 (deterministic local search; properties of tabu search)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_04_Assignment_04.pdf
      - title: 'Wikipedia: Tabu search'
        url: https://en.wikipedia.org/wiki/Tabu_search#Basic_description
        locator: Basic description; Types of memory
    source:
