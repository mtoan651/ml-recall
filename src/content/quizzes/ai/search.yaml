  - id: search-031
    type: single
    difficulty: hard
    tags:
      - a-star
      - admissibility
      - heuristics
    question: |
      On the street graph below, A* with an extended list and the oracle estimates $h$ shown returns
      S–B–C–J–L–T with cost 36, although S–A–F–H–K–T costs 26. Why?
    figure:
      src: ./search/search-031.svg
      alt: 'Undirected graph: S-B 10, S-A 2, A-F 4, B-F 2, B-C 5, C-E 5, C-J 12, J-L 4, L-T 5, J-K 1, K-T 7, F-H 8, D-H 3, H-K 5. Oracle estimates: S 10, A 6, B 5, C 2, E 1, F 100, J 3, L 4, T 0, D 5, H 2, K 100.'
    options:
      - text: A* with an extended list never returns optimal paths on graphs with cycles
        why: With a consistent heuristic, A* with an extended list is optimal on any graph with non-negative costs.
      - text: Ties in $f$ were broken alphabetically, which hid the cheaper path
        why: The cheaper path is never even close in $f$; F alone gets $f = 6 + 100 = 106$.
      - text: $h$ overestimates at F and K (100 each), so it is not admissible
        correct: true
      - text: The estimate at S (10) is larger than the true distance from S to T
        why: The true distance from S is 26, so $h(S) = 10$ underestimates it.
    explanation: |
      A* is guaranteed optimal only when $h$ never overestimates the remaining cost [^1]. Here F's
      true distance to T is 20 and K's is 7, but both are estimated at 100, so every path through F
      or K gets a huge $f$ and is postponed; A* extends S, A, B, C, E, J, L and returns the path
      through L. Branch and bound, which ignores $h$, returns the cost-26 path [^2].
    references:
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Admissibility
        locator: Admissibility
      - source: mit-ocw-6034
        locator: Quiz 1 (2009), Problem 2 Part C (A* with an extended list and oracle estimates)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2009#q2c
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2009/
    status: draft
  - id: search-032
    type: short_answer
    difficulty: medium
    tags:
      - breadth-first-search
      - expanded-list
    question: |
      An undirected graph has the edges S–A, S–B, S–C, A–D, B–H, C–E, E–F, F–H, F–J, H–I, I–J and
      I–G. Run breadth-first search with an extended list from S to the goal G, taking neighbors
      alphabetically. Which path is found?
    answer:
      accept:
        - S B H I G
      pattern: S\W*B\W*H\W*I\W*G
      hint: State letters along the path, e.g. S A D
      model: S–B–H–I–G (4 links; S–C–E–F–J–I–G would take 6)
    explanation: |
      Breadth-first search extends paths level by level, so it returns a path with the fewest links
      [^1]. Level 1 holds A, B, C; level 2 holds D (from A), H (from B) and E (from C); level 3 holds
      F and I (from H) and F again (from E, discarded by the extended list); level 4 reaches G from
      I. The result is S–B–H–I–G [^2].
    references:
      - title: 'Wikipedia: Breadth-first search'
        url: https://en.wikipedia.org/wiki/Breadth-first_search
        locator: Introduction; Pseudocode
      - source: mit-ocw-6034
        locator: Quiz 1 (2008), Problem 2 Part A3 (breadth-first search with an extended list)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz1_2008#q2a3
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz1_2008/
