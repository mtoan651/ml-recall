  - id: search-068
    type: single
    difficulty: hard
    tags:
      - ao-star
      - and-or-graph
      - problem-decomposition
    question: |
      AO* searches an AND/OR graph. The root has heuristic value 39 and two ways to be solved: an OR
      edge to node X (heuristic 23), or an AND arc (hyperedge) that requires both node Y
      (heuristic 4) and node Z (heuristic 8). Every edge costs 10. Which node(s) can AO* expand
      (refine) next?
    options:
      - text: Y and Z, the leaves of the AND arc
        correct: true
      - text: X only, the leaf of the OR edge
        why: The OR option costs $10 + 23 = 33$, more than the AND arc's 32, so it is not on the best partial solution.
      - text: X, Y and Z, since all three are unexpanded leaves
        why: AO* only refines leaves of the currently best partial solution graph, not every open node.
      - text: The root again, because its value 39 overestimates both options
        why: The root's value is revised by backing up the children's costs; it is not re-expanded itself.
    explanation: |
      AO* keeps the best partial solution graph and refines one of its unsolved leaves [^1]. Here the
      OR edge costs $10 + 23 = 33$, while the AND arc must solve both children: $(10 + 4) + (10 + 8) =
      32$. The AND arc is cheaper, so the root's value is revised to 32 and the next node to refine is
      Y or Z [^1]. Had X's heuristic been 13, the OR edge (23) would beat the AND arc and X would be
      refined instead. An AND arc is solved only when all its children are, an OR choice when any one
      is, the usual structure of problem decomposition [^2].
    references:
      - source: nptel-ai-search-methods
        locator: Assignment 8, Q6–Q7 (AO* on Figs. 8.1 and 8.2)
        url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
      - title: 'Wikipedia: And–or tree'
        url: https://en.wikipedia.org/wiki/And%E2%80%93or_tree#Definitions
        locator: Definitions; Search strategies
    source:
      id: nptel-ai-search-methods
      ref: ai-search-methods/assignment8#q6
      url: https://archive.nptel.ac.in/content/storage2/courses/downloads_new/106106126/Week_08_Assignment_08.pdf
