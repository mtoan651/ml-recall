  - id: search-085
    type: short_answer
    difficulty: hard
    tags:
      - a-star
      - admissible-heuristic
      - consistent-heuristic
      - graph-search
    question: |
      A directed graph has the edges S→A (cost 1), S→B (3), A→B (1) and B→G (3). The heuristic is
      $h(S) = 0$, $h(A) = 4$, $h(B) = 0$, $h(G) = 0$: it never overestimates the true cost to G, but
      $h(A) > c(A, B) + h(B)$. A* runs as a graph search that never re-expands a node it has already
      expanded, with the goal test applied when a node is taken off the frontier. What is the cost of
      the path it returns?
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: A* expands S ($f = 0$), B ($f = 3$, $g = 3$), then A ($f = 5$); the cheaper route A→B ($g = 2$) is ignored because B is already expanded, and G is popped with $g = 6$. The optimal cost is 5.
    explanation: |
      The heuristic is admissible, since the true costs to G are 5, 4, 3 and 0 for S, A, B and G [^1],
      but it is not consistent, because $h(A) = 4 > c(A, B) + h(B) = 1$ [^2]. A* expands B through
      the direct edge ($f = 3 + 0$) before A ($f = 1 + 4 = 5$), so B is closed with $g = 3$; when A
      later reaches B at $g = 2$, the search discards it and returns S→B→G with cost 6 instead of the
      optimal S→A→B→G with cost 5. With a consistent heuristic, a node is always first expanded along
      its cheapest path, so skipping closed nodes is safe; an admissible but inconsistent heuristic
      requires re-expanding a node whenever a cheaper path to it is found [^2]. aima-python's
      best-first graph search, which its A* uses, never re-adds an explored state [^3].
    references:
      - title: 'Wikipedia: Admissible heuristic'
        url: https://en.wikipedia.org/wiki/Admissible_heuristic#Formulation
        locator: Formulation
      - title: 'Wikipedia: Consistent heuristic'
        url: https://en.wikipedia.org/wiki/Consistent_heuristic#Consequences_of_monotonicity
        locator: Introduction and Consequences of monotonicity
      - title: 'aima-python (MIT licence), search.py: best_first_graph_search and astar_search'
        url: https://github.com/aimacode/aima-python/blob/f104e03fdc1582f014b3a4c93f1a9b7d2da70114/aima/search.py#L273-L300
        locator: aima/search.py lines 273–300 and 459–465, commit f104e03
    source:
      id: original
      ref: search-085
    status: reviewed
    reviewed_by: claude
  - id: search-086
    type: true_false
    difficulty: medium
    tags:
      - uniform-cost-search
      - goal-test
      - optimality
    shuffle: false
    question: |
      Breadth-first search can apply the goal test when a node is generated, instead of when it is
      expanded, and still return a path with the fewest edges. True or false: uniform-cost search
      can make the same change and still always return a cheapest path.
    options:
      - text: 'True'
        why: 'Counter-example: edges S–G (10), S–A (1), A–G (2). Expanding S generates G at cost 10, and an early test would stop there, missing S–A–G with cost 3 [^1].'
      - text: 'False'
        correct: true
    explanation: |
      UCS takes the frontier node with the lowest path cost and applies the goal test only then [^1],
      because a goal found on generation may still be reachable more cheaply through a node not yet
      expanded. In the example S–G (10), S–A (1), A–G (2), the early test returns cost 10, while the
      late test expands S and A and pops G at cost 3. A* follows the same rule: a goal may sit in the
      frontier while nodes with lower $f$ are expanded first [^2]. For BFS the early test is safe,
      since every later node is at least as deep; aima-python's breadth-first graph search tests on
      generation, while its best-first search tests on removal [^3].
    references:
      - title: "Wikipedia: Dijkstra's algorithm"
        url: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm#Practical_optimizations_and_infinite_graphs
        locator: Running time > Practical optimizations and infinite graphs (uniform-cost search pseudocode)
      - title: 'Wikipedia: A* search algorithm'
        url: https://en.wikipedia.org/wiki/A*_search_algorithm#Description
        locator: Description (note on goal nodes passed over)
