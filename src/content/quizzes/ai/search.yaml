  - id: search-043
    type: single
    difficulty: medium
    tags:
      - csp
      - arc-consistency
      - constraint-propagation
    question: |
      Variables A, B, C, D have domains {1, 2}. Allowed pairs: A–B: (1,1), (2,1); A–C: (1,1), (2,2);
      B–D: (1,1), (1,2); C–D: (2,1), (2,2); B–C: (1,2); A–D: (2,2). What remains after constraint
      propagation (arc consistency)?
    options:
      - text: A = {1, 2}, B = {1}, C = {2}, D = {1, 2}
        why: This stops after the first round; C = {2} then forces A = 2 through A–C, and A = 2 forces D = 2.
      - text: Every domain stays {1, 2}
        why: B–C allows only (1,2), so B and C are reduced immediately.
      - text: A = {2}, B = {1}, C = {2}, D = {2}
        correct: true
      - text: A = {1}, B = {1}, C = {1}, D = {2}
        why: C = 1 has no support on C–D or B–C, which only allow C = 2.
    explanation: |
      Propagation repeatedly deletes values without support [^1]. B–C allows only (1,2), so B = {1}
      and C = {2}; A–C then allows only A = 2, and A–D with A = 2 allows only D = 2. The remaining
      values are mutually consistent, so search with forward checking finds A2 B1 C2 D2 after one
      failed try of A = 1 [^2].
    references:
      - title: 'Wikipedia: Local consistency'
        url: https://en.wikipedia.org/wiki/Local_consistency#Arc_consistency
        locator: Arc consistency
      - source: mit-ocw-16410
        locator: Sample Midterm solutions, Problem 3.B Constraint Satisfaction (3.B.1 propagation, 3.B.2 forward checking)
        url: https://ocw.mit.edu/courses/16-410-principles-of-autonomy-and-decision-making-fall-2010/resources/mit16_410f10_mid_sol/
