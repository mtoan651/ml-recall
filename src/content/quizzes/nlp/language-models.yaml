  - id: language-models-018
    type: single
    difficulty: medium
    tags:
      - decoding
      - sampling
      - temperature
      - top-p
    question: |
      A language model is used for two tasks: auto-generating legal contracts and writing poetry.
      Which choice of decoding strategy fits the two tasks best?
    options:
      - text: A high temperature for the contracts so the wording varies, greedy decoding for the poems so they stay coherent
        why: This is backwards. Contracts need precise, predictable wording, while poetry benefits from diversity [^1].
      - text: Greedy decoding for both, since it always produces the most accurate text
        why: Greedy decoding is accurate and coherent but repetitive and not very diverse, which suits contracts but not creative writing [^1].
      - text: Greedy decoding or a low temperature for the contracts, top-p sampling or a higher temperature for the poems
        correct: true
      - text: A high temperature for both, since it makes the model's output more accurate
        why: A higher temperature flattens the next-token distribution and adds randomness; it makes text more diverse, not more accurate [^1].
    explanation: |
      Greedy decoding always takes the most probable next token, which gives accurate, coherent but
      repetitive text [^1]. Temperature reshapes the softmax: $\tau < 1$ sharpens the distribution and
      behaves more like greedy decoding, $\tau > 1$ flattens it and increases diversity; top-$k$ and
      top-$p$ sampling restrict sampling to the most likely tokens while keeping some variety [^1].
      Legal contracts call for the deterministic end of this range and poetry for the creative end.
    references:
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — 2.1 Sampling techniques'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/02_LMs-text-preprocessing.ipynb#ex2.1
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
