  - id: language-models-019
    type: multiple
    difficulty: medium
    tags:
      - n-gram
      - markov-models
      - perplexity
      - stationary-distribution
    question: |
      In a Markov model of language, a state can be a longer context, such as the last few words or
      characters. Which statements about such n-gram models are true? Select all that apply.
    options:
      - text: Building the transition matrix amounts to counting how often each state follows each other state and normalizing the counts
        correct: true
      - text: In a character-level model whose state is the last 3 characters, each step predicts the next 3 characters at once
        why: Each step still predicts one character; the longer state only gives more context. The next state is the last 2 old characters plus the new one [^2].
      - text: Word n-gram models built on two corpora from completely different domains have the same stationary distribution
        why: The stationary distribution reflects how often each state occurs in the corpus, and word frequencies differ between domains [^3].
      - text: A character-level model over 100 distinct characters whose state is the last 4 characters has a $100 \times 100$ transition matrix
        why: With 4-character states there are $100^4$ possible states, so the transition matrix is indexed by those states, not by single characters [^2].
      - text: A longer context typically lowers perplexity on the training text, but too long a context can raise it on held-out text
        correct: true
    explanation: |
      Learning a Markov model is counting: a transition probability is the number of times $s_i$ is
      followed by $s_j$, divided by the number of times $s_i$ is followed by anything [^1].
      Incorporating more history means redefining the state as the last $n$ words or characters;
      the math stays the same, the state space explodes, and the estimates become sparse [^2]. More
      context usually means lower perplexity, but with too much the model overfits the training text
      and its perplexity on new text can rise [^4]. The stationary distribution corresponds to how
      often each state occurs in the corpus, so it differs between corpora [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — 1.1 Learning Markov models'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — 1.3 Incorporating more context; 1.5 Are n-grams a good model of language?'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — Stationary distribution in the context of text'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
      - source: ubc-dsci575
        locator: "Lecture 2: Applications of Markov Models and Text Preprocessing — 2.2 Evaluating language models; Exercise (iClicker), V's Solutions"
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
