  - id: language-models-021
    type: short_answer
    difficulty: easy
    tags:
      - n-gram
      - markov-assumption
      - long-range-dependencies
    question: |
      An $n$-gram language model predicts the next word from the previous $n - 1$ words. What is the
      smallest $n$ for which it can capture a dependency between the next word and the word 10
      positions before it?
    answer:
      numeric: 11
      tolerance: 0
      hint: a whole number
      model: 'The context must reach back 10 words, plus the predicted word: $n = 11$'
    explanation: |
      A $k$-th order Markov model conditions the next word on the last $k$ words only, which is an
      $n$-gram model with $n = k + 1$ [^1]. To see a word 10 positions back, the context needs
      $k = 10$ words, so the model must have observed the relevant 11-grams; this is the
      long-range-dependency shortcoming of $n$-gram models [^1]. Counts of 11-grams are
      astronomically sparse, which is why neural language models replace counting [^2].
    references:
      - source: trusthlt-nlp
        locator: Lecture 5 slides, frames 'Simplifications in classical language models' and 'Shortcomings of n-gram language models'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture05/pdf/nlpwdl2025-lecture05-handout.pdf
      - source: d2l
        locator: Sec. 9.3.1.3 Laplace Smoothing (limitations of n-gram counting)
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#laplace-smoothing
    source:
      id: trusthlt-nlp
      ref: lectures/lecture05/nlpwdl2025-lecture05.tex#ngram-shortcomings
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture05/pdf/nlpwdl2025-lecture05-handout.pdf
    status: reviewed
    reviewed_by: claude
  - id: language-models-022
    type: short_answer
    difficulty: medium
    tags:
      - neural-language-model
      - embedding-layer
      - parameter-count
    question: |
      A neural language model looks up 50-dimensional embeddings for the previous 3 words,
      concatenates them, applies a hidden layer $g(\mathbf{x}\mathbf{W}^1 + \mathbf{b}^1)$ with 100
      units, and then a softmax layer over a vocabulary of 10,000 words. How many parameters do
      $\mathbf{W}^1$ and $\mathbf{b}^1$ have together?
    answer:
      numeric: 15100
      tolerance: 0
      hint: a whole number
      model: '$\mathbf{x} \in \mathbb{R}^{3 \cdot 50 = 150}$: $150 \times 100 + 100 = 15{,}100$'
    explanation: |
      Each lookup returns a row of the embedding matrix $\mathbf{E} \in \mathbb{R}^{|V| \times 50}$,
      and concatenating three of them gives $\mathbf{x} \in \mathbb{R}^{150}$ [^1]. The hidden layer
      therefore has $150 \times 100$ weights plus 100 biases, 15,100 in all [^1]. For comparison,
      $\mathbf{E}$ has $500{,}000$ parameters and the output layer $100 \times 10{,}000 + 10{,}000$;
      the vocabulary size, not the context length, dominates, and adding a context word only adds
      $50 \times 100$ weights [^1].
    references:
      - source: trusthlt-nlp
        locator: "Lecture 5 slides, frames 'Network concatenating 3 words as embeddings (d_w = 50)', 'Embedding layer: Lookup operation', 'Some advantages of neural LMs'"
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture05/pdf/nlpwdl2025-lecture05-handout.pdf
    source:
      id: trusthlt-nlp
      ref: lectures/lecture05/nlpwdl2025-lecture05.tex#neural-lm-concat
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture05/pdf/nlpwdl2025-lecture05-handout.pdf
    status: reviewed
