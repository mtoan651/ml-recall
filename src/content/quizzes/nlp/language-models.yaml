  - id: language-models-015
    type: short_answer
    difficulty: medium
    tags:
      - sampling
      - temperature
      - decoding
    question: |
      A character model predicts the next-character probabilities $P = (0.5, 0.3, 0.2)$ for three
      candidates. Instead of taking the most likely one, you sample from
      $q \propto P^\alpha$ with $\alpha = 2$. With what probability is the most likely character
      sampled? Round to 3 decimals.
    answer:
      numeric: 0.658
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $q = (0.25, 0.09, 0.04)/0.38 \approx (0.658, 0.237, 0.105)$
    explanation: |
      Squaring gives $(0.25, 0.09, 0.04)$, which sums to $0.38$, so the top character gets
      $0.25/0.38 \approx 0.658$ instead of 0.5. Since $P^\alpha \propto \exp(\alpha \log P)$, this is a
      softmax of the log-probabilities at temperature $1/\alpha$: $\alpha > 1$ sharpens the
      distribution toward likely characters, $\alpha = 1$ is plain sampling, and $\alpha \to \infty$
      becomes the argmax used by d2l's `predict` method [^1]. Plain sampling gives varied but less
      coherent text; pure argmax decoding is deterministic and can get stuck repeating itself.
    references:
      - source: d2l
        locator: Sec. 9.5.5 Decoding
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#decoding
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 8
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/rnn-scratch#ex8
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: language-models-016
    type: single
    difficulty: easy
    tags:
      - transformer-decoder
      - causal-mask
      - gpt
    question: |
      You want a Transformer for plain language modeling: predict each next token of a text from the
      tokens before it. Which part of the architecture do you use?
    options:
      - text: The decoder alone, without cross-attention, with a causal mask on its self-attention
        correct: true
      - text: The encoder alone without masks, so every token can use the whole text
        why: Each position could then attend to the very token it must predict, which makes training trivial.
      - text: The full encoder–decoder, with the same text fed to both sides
        why: There is no separate source, and an encoder that sees the whole text would leak future tokens to the decoder.
      - text: The encoder alone, trained to predict tokens that were masked at random positions in the text
        why: That is masked language modeling as in BERT, which does not generate text left to right.
    explanation: |
      A decoder-only Transformer drops the encoder and the encoder–decoder attention sublayer; its
      masked self-attention lets each position attend only to earlier positions, and the target is the
      input shifted by one token, as in GPT [^1][^2]. The mask preserves the autoregressive property,
      so the prediction depends only on tokens already seen [^2].
    references:
      - source: d2l
        locator: Sec. 11.9.3 Decoder-Only; 11.9.3.1 GPT and GPT-2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#decoder-only
      - source: d2l
        locator: Sec. 11.7.5 Decoder
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#decoder
      - source: d2l
        locator: Sec. 11.7.8 Exercises, Exercise 3
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/transformer#ex3
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#exercises
