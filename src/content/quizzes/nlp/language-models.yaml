schema_version: 1
domain: nlp
topic: language-models
title: Language Modeling
questions:
  - id: language-models-001
    type: true_false
    difficulty: easy
    question: A language model usually does not need labels for its pretraining.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Pretraining labels are created automatically from the text itself (the next word, or a masked word), so no human labelling is needed.
    explanation: |
      Pretraining is usually *self-supervised*: the objective is computed automatically from the inputs,
      for example predicting the next word (causal language modeling) or filling in masked words (masked
      language modeling), so humans are not needed to label the data [^1]. Human-annotated labels come in
      later, when the pretrained model is fine-tuned on a specific task [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
        locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
        quote: Self-supervised learning is a type of training in which the objective is automatically computed from the inputs of the model. That means that humans are not needed to label the data!
    source:
      id: hf-llm-course
      ref: chapter1/7#q6
      url: https://huggingface.co/learn/llm-course/chapter1/7
    status: draft
  - id: language-models-002
    type: single
    difficulty: medium
    question: What are the labels in a masked language modeling problem?
    options:
      - text: Some of the tokens in the input sentence are randomly masked and the labels are the original input tokens.
        correct: true
      - text: Some of the tokens in the input sentence are randomly masked and the labels are the original input tokens, shifted to the left.
        why: No, shifting the labels to the left corresponds to predicting the next word, which is causal language modeling.
      - text: Some of the tokens in the input sentence are randomly masked, and the label is whether the sentence is positive or negative.
        why: That's a sequence classification problem with some data augmentation, not masked language modeling.
      - text: Some of the tokens in the two input sentences are randomly masked, and the label is whether the two sentences are similar or not.
        why: That's a sequence classification problem with some data augmentation, not masked language modeling.
    explanation: |
      In masked language modeling the labels are a copy of the input token IDs. A data collator then
      masks a random fraction of the tokens (15%, as for BERT), mostly by replacing them with `[MASK]`,
      and the model learns to predict the original tokens at those positions [^1]. Labels shifted by one position belong to
      causal language modeling, which predicts the next word [^2], and a sentiment or a
      sentence-similarity label turns the problem into sequence classification.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/3#preprocessing-the-data
        locator: Chapter 7.3 Fine-tuning a masked language model, secs. Preprocessing the data and Fine-tuning DistilBERT with the Trainer API
        quote: in masked language modeling the objective is to predict randomly masked tokens in the input batch
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
        locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
    source:
      id: hf-llm-course
      ref: chapter7/9#q5
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: draft
  - id: language-models-003
    type: multiple
    difficulty: medium
    question: When should you pretrain a new model?
    options:
      - text: When there is no pretrained model available for your specific language
        correct: true
      - text: When you have lots of data available, even if there is a pretrained model that could work on it
        why: In this case, you should probably use the pretrained model and fine-tune it on your data, to avoid huge compute costs.
      - text: When you have concerns about the bias of the pretrained model you are using
        correct: true
      - text: When the pretrained models available are just not good enough
        why: Poor results usually come from the fine-tuning setup (data, hyperparameters, bugs); debug that first, since pretraining from scratch costs far more.
    explanation: |
      Pretraining from scratch is expensive, so the default is to fine-tune an existing pretrained model,
      which needs far less data, time and compute [^1]. Pretraining a new model makes sense when no
      suitable model exists, for example none in your language, or when your data are very different
      from what the available models were trained on [^2][^3]. Bias is the other good reason: a
      pretrained model can produce sexist, racist or homophobic content, and fine-tuning on your data
      won't remove that intrinsic bias [^4], so you would pretrain on data you have curated, after making
      very sure they really are better. Having lots of data is not enough on its own when a pretrained
      model already fits it [^3].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
        locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/2
        locator: Chapter 6.2 Training a new tokenizer from an old one, introduction
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/6
        locator: Chapter 7.6 Training a causal language model from scratch, introduction
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/9
        locator: Chapter 1.9 Bias and limitations
    source:
      id: hf-llm-course
      ref: chapter7/9#q10
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: draft
  - id: language-models-004
    type: single
    difficulty: easy
    question: Why is it easy to pretrain a language model on lots and lots of texts?
    options:
      - text: Because there are plenty of texts available on the internet
        why: True, but raw text is only usable at that scale because nobody has to label it. If the objective needed human labels, the amount of text online would hardly help.
      - text: Because the pretraining objective does not require humans to label the data
        correct: true
      - text: Because the 🤗 Transformers library only requires a few lines of code to start the training
        why: True, but short training code isn't what makes huge corpora usable. The bottleneck would be labeling the data, and the self-supervised objective removes it.
    explanation: |
      Language models are trained in a self-supervised way: the objective (the next word, or a masked
      word) is computed automatically from the raw text, so no human has to label anything [^1]. That
      is what makes pretraining on huge amounts of text feasible [^1]. Plenty of text is indeed online
      and the training code is short, but without a self-supervised objective all that text would still
      need hand-made labels, which is the real bottleneck.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
        locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
    source:
      id: hf-llm-course
      ref: chapter7/9#q11
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: draft
  - id: language-models-005
    type: single
    difficulty: easy
    question: A language model should be able to ____ the next word in the sentence
    options:
      - text: use
      - text: predict
        correct: true
      - text: guess
    explanation: |
      A language model assigns a probability to each possible next word given the words so far, so
      its basic job is to predict the next word [^2]. GPT-style text generators do exactly this by
      modelling the conditional probability $P(w_N \mid w_{N-1}, \dots, w_1)$ [^3], and language
      models can also be trained to predict words masked out of a text [^1]. "Guess" sounds close,
      but the technical term is prediction from a learned probability distribution; "use" does not
      describe a modelling task at all.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
        locator: 'Lesson: Language Modeling, introduction'
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 3 N-gram Language Models
        url: https://web.stanford.edu/~jurafsky/slp3/3.pdf
        locator: Ch. 3 introduction (definition of a language model)
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#text-generation-and-perplexity
        locator: 'Lesson: Pre-Trained Large Language Models, sec. Text Generation and Perplexity'
    source:
      id: ms-ai-for-beginners
      ref: quiz-115/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-15.json
    status: draft
  - id: language-models-006
    type: single
    difficulty: easy
    question: Language models are trained on
    options:
      - text: language vocabulary
      - text: specially labeled data
      - text: any natural text
        correct: true
    explanation: |
      Language models are trained on unlabeled text in a self-supervised way: masking out a word and
      asking the model to predict it turns any text into training examples, and unlabeled text exists
      in huge amounts [^1]. The HF course says the same of GPT, BERT and T5: they are pretrained on
      large amounts of raw text, with the objective computed from the inputs, so no human labels are
      needed; labeled data comes in only later, for supervised fine-tuning on a specific task [^2]. A
      vocabulary is built from a corpus, not something the model is trained on [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
        locator: 'Lesson: Language Modeling, introduction'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
        locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#vocabulary
        locator: Sec. 9.2.3 Vocabulary
    source:
      id: ms-ai-for-beginners
      ref: quiz-115/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-15.json
    status: draft
  - id: language-models-007
    type: single
    difficulty: easy
    question: Which metric scores a language model by the probability it assigns to held-out text?
    options:
      - text: accuracy
      - text: recall
      - text: perplexity
        correct: true
    explanation: |
      Perplexity measures how well a model predicts held-out text. It is the inverse probability of
      the test set normalised by its length, $\mathrm{PPL}(W) = P(w_1,\dots,w_N)^{-1/N}$, so lower is
      better [^1][^2]. Equivalently it is the exponential of the average per-token cross-entropy: a
      perfect model scores 1, and one that predicts a uniform distribution scores the vocabulary size
      [^3]. It is an intrinsic metric that needs no task-specific dataset [^1][^2], whereas accuracy
      and recall evaluate a classifier by comparing its outputs with human gold labels [^4].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#text-generation-and-perplexity
        locator: 'Lesson: Pre-Trained Large Language Models, sec. Text Generation and Perplexity'
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 3 N-gram Language Models
        url: https://web.stanford.edu/~jurafsky/slp3/3.pdf
        locator: 'Sec. 3.3 Evaluating Language Models: Perplexity, Eq. 3.14'
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#perplexity
        locator: Sec. 9.3.2 Perplexity, Eqs. 9.3.7-9.3.8
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 4 Logistic Regression and Text Classification
        url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
        locator: 'Sec. 4.9 Evaluation: Precision, Recall, F-measure (Fig. 4.7)'
    source:
      id: ms-ai-for-beginners
      ref: quiz-220/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-20.json
    status: draft
  - id: language-models-008
    type: single
    difficulty: medium
    question: |
      Which language model makes better predictions for English text?

      * A language model based on 6-grams
      * A language model based on 5-grams
    options:
      - text: It depends on the size and diversity of the training set.
        correct: true
      - text: The 6-gram model, since it uses more context.
        why: This language model has more context, but unless this model has trained on a lot of documents, most of the 6-grams will be rare.
      - text: The 5-gram model, since its n-grams are less rare.
        why: Not in general. With a large, diverse training set the 6-gram model's extra context usually wins; the 5-gram model can do better only when the data are too small for most 6-grams to repeat.
    explanation: |
      Longer n-grams give more context, but as $N$ grows each n-gram occurs less often, and when $N$ is
      large most n-grams appear only once, which doesn't help predict the next token [^1]. So the answer
      depends on the data: if the training set spans millions of diverse documents, the 6-gram model will
      probably outperform the 5-gram model, while with a small training set most 6-grams are rare and the
      extra context does not pay off [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/llm
        locator: Introduction to Large Language Models, N-gram language models and exercise
    source:
      id: google-mlcc
      ref: llm#q1
      url: https://developers.google.com/machine-learning/crash-course/llm
    status: draft
  - id: language-models-009
    type: single
    difficulty: medium
    question: Which of these is trained with a language-modelling objective, predicting words from their context in unlabelled text?
    options:
      - text: Word2Vec's CBoW model, which predicts the middle word from its neighbours
        correct: true
      - text: An RNN that sorts news articles into topics from labelled examples
      - text: A TF-IDF vectorizer that weighs word counts by document frequency
      - text: An embedding layer trained as part of a sentiment classifier
    explanation: |
      Language models are trained on unlabelled text in a self-supervised way, for example by
      predicting missing words [^1]. Word2Vec's continuous bag-of-words (CBoW) predicts the middle
      token from the tokens around it, which is why semantic embeddings such as Word2Vec are called a
      first step towards language modelling [^1]. A topic or sentiment classifier learns from labelled
      examples instead, and an embedding layer trained inside such a classifier only learns what helps
      that task, which is why semantic embeddings are pre-trained on large text collections in a
      special way [^2]. TF-IDF only reweights word counts without learning to predict anything [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
        locator: 'Lesson: Language Modeling, introduction and sec. Training Embeddings'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md
        locator: 'Lesson: Embeddings, introduction'
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#bag-of-words-and-tfidf
        locator: 'Lesson: Representing Text as Tensors, sec. Bag-of-Words and TF/IDF'
    source:
      id: ms-ai-for-beginners
      ref: quiz-115/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-15.json
    status: draft
  - id: language-models-010
    type: short_answer
    difficulty: easy
    tags:
      - n-gram
      - sparsity
      - vocabulary
    question: |
      A word-level 4-gram language model uses a vocabulary of 100,000 words. In the worst case its
      table of 4-word counts $n(x, x', x'', x''')$ has $10^k$ entries. What is $k$?
    answer:
      numeric: 20
      tolerance: 0
      hint: a whole number (the exponent)
      model: $|\mathcal{V}|^4 = (10^5)^4 = 10^{20}$
    explanation: |
      Each of the four positions can hold any of the $10^5$ words, so there are
      $|\mathcal{V}|^4 = 10^{20}$ possible 4-grams; the smoothed estimates also need the trigram
      ($10^{15}$), bigram ($10^{10}$) and unigram ($10^5$) counts [^1]. d2l notes that an $n$-gram
      model must store $|\mathcal{V}|^n$ numbers, which is why longer contexts quickly become
      infeasible [^2]. In practice only the observed counts are stored, and almost all possible
      4-grams are never observed [^1].
    references:
      - source: d2l
        locator: Sec. 9.3.1.1 Markov Models and n-grams; 9.3.1.3 Laplace Smoothing
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#laplace-smoothing
      - source: d2l
        locator: Sec. 9.4 Recurrent Neural Networks (introduction)
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html
      - source: d2l
        locator: Sec. 9.3.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/language-model#ex1
      url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    status: draft
  - id: language-models-011
    type: short_answer
    difficulty: medium
    tags:
      - n-gram
      - sparsity
      - laplace-smoothing
    question: |
      A training corpus is one continuous text of 100,000 word tokens, drawn from a vocabulary of
      10,000 word types. At most how many *distinct* 4-grams can have a nonzero count?
    answer:
      numeric: 99997
      tolerance: 0
      hint: a whole number
      model: The text contains $100{,}000 - 3 = 99{,}997$ overlapping 4-gram positions
    explanation: |
      A text of $T$ tokens has exactly $T - 3$ positions where a 4-gram starts, so at most 99,997
      distinct 4-grams can be observed, against $10{,}000^4 = 10^{16}$ possible ones. More than
      $99.999999999\%$ of the 4-gram table is zero, so relative frequencies assign probability 0 to
      almost every plausible word sequence. That is why counting models need smoothing, and why d2l
      turns to neural language models that share statistical strength between similar contexts
      [^1][^2].
    references:
      - source: d2l
        locator: Sec. 9.3.1.2 Word Frequency and 9.3.1.3 Laplace Smoothing
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#laplace-smoothing
      - source: d2l
        locator: Sec. 9.2.5 Exploratory Language Statistics
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
      - source: d2l
        locator: Sec. 9.3.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/language-model#ex1-b
      url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    status: draft
  - id: language-models-012
    type: single
    difficulty: easy
    tags:
      - minibatch
      - padding
      - masking
    question: |
      You want every training example of a language model to be one complete sentence, instead of a
      fixed-length window cut from the running text. What problem does this create for minibatch
      training, and what is the usual fix?
    options:
      - text: Sentences differ in length and do not stack into one tensor; pad or truncate them to one length and mask the padding
        correct: true
      - text: Sentences overlap, so the same tokens appear in many examples; keep only every second sentence
        why: Complete sentences taken one after another do not overlap; the problem is their varying length.
      - text: The last token of a sentence has no target; append the first word of the next sentence to it
        why: An end-of-sequence token supplies that target; the real obstacle to batching is the varying length.
      - text: Sentences are too long for the hidden state to hold, so each word must be fed to the model separately and independently
        why: Treating words independently throws away the sequence; nothing here is about hidden-state capacity.
    explanation: |
      With fixed windows of `num_steps` tokens every minibatch has the same shape [^1]. Sentences vary
      in length, so d2l's translation pipeline appends `<pad>` tokens to short sequences and
      truncates long ones to a common `num_steps` [^2], and the loss masks the padding positions so
      they do not count as predictions [^3]. Bucketing sentences of similar length into the same
      minibatch reduces the computation wasted on padding [^4].
    references:
      - source: d2l
        locator: Sec. 9.3.3 Partitioning Sequences
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#partitioning-sequences
      - source: d2l
        locator: Sec. 10.5.3 Loading Sequences of Fixed Length
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#loading-sequences-of-fixed-length
      - source: d2l
        locator: Sec. 10.7.5 Loss Function with Masking
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#loss-function-with-masking
      - source: d2l
        locator: Sec. 10.5.5 Summary
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#summary
      - source: d2l
        locator: Sec. 9.3.5 Exercises, Exercise 5
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/language-model#ex5
      url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#exercises
    status: draft
  - id: language-models-013
    type: true_false
    difficulty: medium
    tags:
      - rnn
      - language-model
      - truncated-bptt
    shuffle: false
    question: |
      A character-level RNN language model is trained on random windows of `num_steps = 32`
      characters cut from a book, and every minibatch starts from a zero hidden state. True or false:
      in training it learns to predict each character from all the text before it, back to the first
      character of the book.
    options:
      - text: 'True'
        why: Each window starts from a fresh zero state, so at most the 31 earlier characters in the same window can influence a training prediction [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      The training data are length-`num_steps` subsequences [^1], and the RNN's forward pass starts
      from a zero state whenever no state is passed in [^2], so neither information nor gradients
      flow beyond 32 characters. At prediction time the state is carried through the whole prefix (the
      warm-up period) [^3], but the model was never trained to exploit context longer than
      `num_steps`, the hyperparameter that sets the length of history used in training.
    references:
      - source: d2l
        locator: Sec. 9.3.3 Partitioning Sequences
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#partitioning-sequences
      - source: d2l
        locator: Sec. 9.5.1 RNN Model
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#rnn-model
      - source: d2l
        locator: Sec. 9.5.5 Decoding
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#decoding
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/rnn-scratch#ex1
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
    status: draft
  - id: language-models-014
    type: single
    difficulty: easy
    tags:
      - rnn
      - language-model
      - hyperparameters
    question: |
      A character-level RNN language model is trained on minibatches of random text windows, each
      starting from a zero hidden state. Which hyperparameter sets how many earlier characters a
      training prediction can draw on?
    options:
      - text: '`num_steps`, the length of each training window'
        correct: true
      - text: '`num_hiddens`, the size of the hidden state'
        why: It sets how much the state can hold, not how many tokens are fed into it before a prediction.
      - text: '`batch_size`, the number of windows per minibatch'
        why: More windows are processed in parallel, but each is still only `num_steps` tokens long.
      - text: '`grad_clip_val`, the clipping threshold for gradients'
        why: It bounds the gradient norm; it does not change which tokens a prediction sees.
    explanation: |
      Each training example is a subsequence of `num_steps` tokens and its target is the same
      window shifted by one, so a prediction can use at most `num_steps` tokens of history [^1].
      The same length also truncates backpropagation through time, the "regular truncation" of
      d2l's comparison of strategies [^2].
    references:
      - source: d2l
        locator: Sec. 9.3.3 Partitioning Sequences
        url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#partitioning-sequences
      - source: d2l
        locator: Sec. 9.7.1.4 Comparing Strategies
        url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html#comparing-strategies
      - source: d2l
        locator: Sec. 9.5.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-neural-networks/rnn-scratch.html#exercises
