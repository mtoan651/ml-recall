  - id: language-models-020
    type: true_false
    difficulty: easy
    tags:
      - stationary-distribution
      - n-gram
      - word-frequency
    shuffle: false
    question: |
      True or false: in a word-level Markov model of a corpus, rare words get low probabilities in
      the stationary distribution, so the stationary distribution can help you spot rare words.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: In n-gram models of text the stationary distribution can be read as the long-run frequency of each word, which is exactly what is low for rare words [^1].
    explanation: |
      For n-gram models of language, the stationary distribution can be thought of as the long-term
      distribution of word (or character) frequencies, and it can be computed from how often each
      state occurs in the corpus [^1]. Rare words therefore get small stationary probabilities, and
      sorting the stationary distribution surfaces them [^2]. For the same reason, two corpora from
      different domains, such as song lyrics and biomedical text, have different stationary
      distributions [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — Stationary distribution in the context of text'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
