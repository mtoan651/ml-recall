      ref: quiz-36/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-018
    type: single
    difficulty: easy
    question: You run a sentiment analyzer on hotel reviews that also come with the reviewer's numeric score. What is a sensible way to check whether the analyzer works?
    options:
      - text: Compare its sentiment scores with the reviewers' own scores for the same reviews
        correct: true
      - text: Check that it returns a sentiment score for every single review in the dataset, with no gaps
        why: A score for every review only shows that the analyzer runs, not that its scores are right.
      - text: Check that it labels equally many reviews positive and negative
        why: Real reviews need not be half positive and half negative, so a balanced split says nothing about correctness.
    explanation: |
      Microsoft's hotel-review lesson tests its sentiment scores by comparing them with the reviewer's score for the same
      review: if the analyzer finds a review very positive but the reviewer gave the lowest possible
      score, either the text and the score disagree or the analyzer got it wrong [^1]. The human
      scores serve as the labels to check against, just as the ML approach to sentiment learns from
      human-scored texts [^2]. Some mismatches are expected, for example sarcasm read as praise [^1].
      Returning a score for every review says nothing about whether the scores are right, and real
      reviews need not be half positive and half negative.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/5-Hotel-Reviews-2/README.md#performing-sentiment-analysis
        locator: 'Lesson: Sentiment analysis with hotel reviews, sec. Performing sentiment analysis'
