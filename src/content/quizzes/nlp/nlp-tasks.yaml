  - id: nlp-tasks-016
    type: single
    difficulty: easy
    question: A word-by-word translator gets idioms wrong. What does an ML translation model gain by learning from a large corpus of texts and their human translations?
    options:
      - text: It can translate languages that it has never seen any example of
        why: It learns only from example translations, so a language it has no examples of is out of reach [^1].
      - text: It translates every word literally, one at a time, so that nothing in the text is lost
        why: Literal word-by-word output is the naive approach, which gets idioms and sentence structure wrong [^1].
      - text: It learns how whole phrases are usually translated, which improves accuracy
        correct: true
    explanation: |
      A naive translator converts words one by one and ignores sentence structure, which yields
      errors such as rendering "I feel happy" in Irish as the invalid "Mise bhraitheann athas" [^1].
      The ML approach detects patterns in a corpus of texts and their human translations: it can
      learn that "I have no money" is idiomatically translated as "Je n'ai pas d'argent", not with the
      false cognate "monnaie", and so improve accuracy [^1]. It learns only from such examples, so it
      cannot handle a language it has never seen, and literal word-for-word output is exactly the
      naive approach it improves on [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#machine-learning-approaches
        locator: 'Lesson: Translation and sentiment analysis with ML, secs. Translation and Machine learning approaches'
    source:
      id: ms-ml-for-beginners
      ref: quiz-35/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-017
    type: single
    difficulty: medium
    question: How does a machine-learning approach to sentiment analysis differ from scoring texts with a hand-made list of positive and negative words?
    options:
      - text: It uses a longer hand-made list of positive and negative words
        why: A longer list is still the hand-made, non-ML approach, and sarcasm still fools it [^1].
      - text: It learns which words and phrases go with positive or negative opinions from texts people have already scored
        correct: true
      - text: It clusters unlabeled texts into two groups and simply assumes that one group is positive and the other negative
        why: Clustering cannot tell which group, if any, is the positive one; the ML approach learns from texts people have already scored [^1].
    explanation: |
      The non-ML approach adds up the words a person has marked as positive or negative, which a
      sarcastic sentence easily fools [^1]. The ML approach starts from texts where a human has
      given both a score and a written opinion, such as movie reviews, and lets patterns emerge: for
      example, positive reviews contain "Oscar worthy" more often than negative ones [^1]. A longer
      word list is still the hand-made approach. Clustering unlabeled texts cannot tell you which
      group, if any, is the positive one; the ML approach relies on the human scores for that [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#ml-approaches
        locator: 'Lesson: Translation and sentiment analysis with ML, secs. Sentiment analysis and ML approaches'
    source:
