schema_version: 1
domain: nlp
topic: nlp-tasks
title: NLP Tasks
questions:
  - id: nlp-tasks-001
    type: multiple
    difficulty: hard
    question: How does the `token-classification` pipeline handle entities that span over several tokens?
    options:
      - text: The entities with the same label are merged into one entity.
        why: Too simple. Merging every run of tokens with the same entity type would fuse two adjacent entities of that type into one; the `B-` label exists to mark where a new entity starts.
      - text: There is a label for the beginning of an entity and a label for the continuation of an entity.
        correct: true
      - text: In a given word, as long as the first token has the label of the entity, the whole word is considered labeled with that entity.
        correct: true
      - text: When a token has the label of a given entity, any other following token with the same label is considered part of the same entity, unless it's labeled as the start of a new entity.
        correct: true
    explanation: |
      The model predicts one label per token, and entities are rebuilt from those labels. Labels come in
      pairs: `B-XXX` marks a token at the beginning of an entity of type XXX and `I-XXX` a token inside
      it [^1]. When grouping, consecutive tokens labelled `I-XXX` are added to the current entity, and the
      entity stops at an `O`, a different type, or a `B-XXX` that starts a new entity of the same type
      [^1]. With word-level strategies such as `aggregation_strategy="first"`, a word takes the tag of its
      first token, so its pieces cannot end up in different entities [^2]. Simply merging all tokens
      with the same label is an oversimplification: two adjacent entities of the same type would become
      one [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/3#grouping-entities
        locator: Chapter 6.3 Fast tokenizers' special powers, secs. From inputs to predictions and Grouping entities
      - title: Hugging Face Transformers documentation, Pipelines (TokenClassificationPipeline)
        url: https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.TokenClassificationPipeline
        locator: TokenClassificationPipeline, aggregation_strategy
        quote: Words will simply use the tag of the first token of the word when there is ambiguity.
    source:
      id: hf-llm-course
      ref: chapter6/10#q4
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-002
    type: single
    difficulty: medium
    question: How does the `question-answering` pipeline handle long contexts?
    options:
      - text: It doesn't really, as it truncates the long context at the maximum length accepted by the model.
        why: No, truncating could cut off the answer; the pipeline splits a long context into chunks instead.
      - text: It splits the context into several parts and averages the results obtained.
        why: No, it wouldn't make sense to average the results, as some parts of the context won't include the answer.
      - text: It splits the context into several parts (with overlap) and finds the maximum score for an answer in each part.
        correct: true
      - text: It splits the context into several parts (without overlap, for efficiency) and finds the maximum score for an answer in each part.
        why: No, it includes some overlap between the parts to avoid a situation where the answer would be split across two parts.
    explanation: |
      Truncating a long context could cut off the answer. Instead, the `question-answering` pipeline
      splits the context into chunks no longer than its maximum length (384 tokens), with some
      overlap (the `stride`) between consecutive chunks so that the answer is not split at exactly the
      wrong place [^1]. Every possible answer span in each chunk gets a score, the best span of each
      chunk is kept, and the candidate with the highest score is the answer [^1]. Averaging over chunks
      would make no sense, since most chunks do not contain the answer.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/3b#handling-long-contexts
        locator: Chapter 6.3b Fast tokenizers in the QA pipeline, sec. Handling long contexts
    source:
      id: hf-llm-course
      ref: chapter6/10#q5
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-003
    type: multiple
    difficulty: easy
    question: Which of the following tasks can be framed as a token classification problem?
    options:
      - text: Find the grammatical components in a sentence.
        correct: true
      - text: Find whether a sentence is grammatically correct or not.
        why: No, this is a sequence classification problem.
      - text: Find the persons mentioned in a sentence.
        correct: true
      - text: Find the chunk of words in a sentence that is the answer to a question.
        why: No, that would be a question answering problem.
    explanation: |
      Token classification gives a label to each token of a sentence [^1]. Finding the grammatical
      components is part-of-speech tagging, which marks every word as noun, verb, adjective and so on,
      and finding the persons is named entity recognition, which labels each token with an entity class
      or "no entity" [^1]. Deciding whether a whole sentence is grammatical needs one label for the
      sentence, so it is sequence classification. Finding the chunk that answers a question is
      extractive question answering, where the model predicts the start and end positions of the answer
      [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/2#token-classification
        locator: Chapter 7.2 Token classification, introduction
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/7#processing-the-training-data
        locator: Chapter 7.7 Question answering, sec. Processing the training data
    source:
      id: hf-llm-course
      ref: chapter7/9#q1
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-004
    type: multiple
    difficulty: hard
    question: Which parts of the preprocessing for token classification differ from the other preprocessing pipelines?
    options:
      - text: There is no need to do anything; the texts are already tokenized.
        why: The texts are indeed given as separate words, but we still need to apply the subword tokenization model.
      - text: The texts are given as words, so we only need to apply subword tokenization.
        correct: true
      - text: We use `-100` to label the special tokens.
        why: That's not specific to token classification -- we always use `-100` as the label for tokens we want to ignore in the loss.
      - text: We need to make sure to truncate or pad the labels to the same size as the inputs, when applying truncation/padding.
        correct: true
    explanation: |
      Token classification datasets such as CoNLL-2003 come already split into words, each with a label,
      so instead of the full tokenization pipeline we only apply subword tokenization, passing
      `is_split_into_words=True` to the tokenizer [^1]. The labels then have to follow the inputs: once
      they are aligned with the tokens, they must be padded exactly like the inputs so that both keep the
      same size, which `DataCollatorForTokenClassification` does with the value `-100` [^1]. The words
      still have to be tokenized into subwords, and labelling special tokens with `-100` is not specific
      to this task: `-100` is simply the index the cross-entropy loss ignores [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/2#processing-the-data
        locator: Chapter 7.2 Token classification, secs. Processing the data and Data collation
    source:
      id: hf-llm-course
      ref: chapter7/9#q2
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-005
    type: single
    difficulty: medium
    question: What problem arises when we tokenize the words in a token classification problem and want to label the tokens?
    options:
      - text: The tokenizer adds special tokens and we have no labels for them.
        why: We label these `-100` so they are ignored in the loss.
      - text: Each word can produce several tokens, so we end up with more tokens than we have labels.
        correct: true
      - text: The added tokens have no labels, so there is no problem.
        why: That's incorrect; we need as many labels as we have tokens or our models will error out.
    explanation: |
      The dataset gives one label per word, but the subword tokenizer can split a word into several
      tokens. In the first CoNLL-2003 sentence "lamb" becomes `la` and `##mb`, so 9 labels face 12
      tokens once `[CLS]` and `[SEP]` are added [^1]. The labels must therefore be aligned with the
      tokens: using `word_ids()`, each token gets the label of its word, with `B-` turned into `I-`
      inside a word [^1]. The special tokens are the easy part: they get the label `-100`, which the loss
      ignores [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/2#processing-the-data
        locator: Chapter 7.2 Token classification, sec. Processing the data
    source:
      id: hf-llm-course
      ref: chapter7/9#q3
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-006
    type: multiple
    difficulty: medium
    question: Which of these tasks can be seen as a sequence-to-sequence problem?
    options:
      - text: Writing short reviews of long documents
        correct: true
      - text: Answering questions about a document
        correct: true
      - text: Translating a text in Chinese into English
        correct: true
      - text: Fixing the messages sent by my nephew/friend so they're in proper English
        correct: true
    explanation: |
      A sequence-to-sequence task turns an input text into a new output text, which is what
      encoder-decoder models are built for: summarization, translation and generative question
      answering [^1]. Writing short reviews of long documents is summarization, translating Chinese into
      English is translation, answering questions about a document can be framed as generative question
      answering, and rewriting someone's messages in proper English is style transfer, a translation
      within one language [^2]. All four options are therefore sequence-to-sequence problems.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/6#sequence-to-sequence-models
        locator: Chapter 1.6 Transformer Architectures, sec. Sequence-to-sequence models
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/4#translation
        locator: Chapter 7.4 Translation, introduction
    source:
      id: hf-llm-course
      ref: chapter7/9#q6
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-007
    type: multiple
    difficulty: medium
    question: What are the main challenges when preprocessing data for a question answering task?
    options:
      - text: You need to tokenize the inputs.
        why: True, but every NLP task needs tokenized inputs, and it is a routine call to the tokenizer. The difficulties specific to QA are long contexts and locating the answer's tokens.
      - text: You need to deal with very long contexts, which give several training features that may or may not have the answer in them.
        correct: true
      - text: You need to tokenize the answers to the question as well as the inputs.
        why: No, unless you are framing your question answering problem as a sequence-to-sequence task.
      - text: From the answer span in the text, you have to find the start and end token in the tokenized input.
        correct: true
    explanation: |
      The labels for extractive QA are the indices of the tokens where the answer starts and ends, but
      the dataset gives the answer as a character position in the context, so the offset mapping is
      needed to turn that character span into start and end tokens [^1]. Long contexts are the other
      difficulty: one example becomes several training features through a sliding window, and features
      that do not contain the whole answer get the label `(0, 0)`, the `[CLS]` token [^1]. Tokenizing the
      inputs is routine, and the answers only need tokenizing when QA is framed as a generative,
      sequence-to-sequence task [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/7#processing-the-training-data
        locator: Chapter 7.7 Question answering, sec. Processing the training data
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/4#translation
        locator: Chapter 7.4 Translation, introduction (generative question answering)
    source:
      id: hf-llm-course
      ref: chapter7/9#q12
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-008
    type: single
    difficulty: hard
    question: How is post-processing usually done in question answering?
    options:
      - text: The model gives you the start and end positions of the answer, and you just have to decode the corresponding span of tokens.
        why: 'Too simple: one long example is split into several features, so the best-scoring candidate over all of them must be chosen, and its tokens mapped back to the context text [^1].'
      - text: The model gives you the start and end positions of the answer for each feature created by one example, and you just have to decode the corresponding span of tokens in the one that has the best score.
        why: Close, but the answer is not decoded from the tokens; the offset mapping is used to cut the matching span out of the original context text.
      - text: The model gives you the start and end positions of the answer for each feature created by one example, and you just have to match them to the span in the context for the one that has the best score.
        correct: true
      - text: The model generates an answer, and you just have to decode it.
        why: No, unless you are framing your question answering problem as a sequence-to-sequence task.
    explanation: |
      The model outputs start and end logits for every token, and one long example can produce several
      features [^1]. For each feature, valid (start, end) pairs inside the context are scored, and the
      best candidate over all the features of the example is kept [^1][^2]. Its token positions are then
      mapped to character positions with the offset mapping, and the answer is the matching span of the
      original context [^1][^2]. Generating the answer token by token only happens when QA is framed as
      a sequence-to-sequence task.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/7#post-processing
        locator: Chapter 7.7 Question answering, sec. Post-processing
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/3b#handling-long-contexts
        locator: Chapter 6.3b Fast tokenizers in the QA pipeline, sec. Handling long contexts
    source:
      id: hf-llm-course
      ref: chapter7/9#q13
      url: https://huggingface.co/learn/llm-course/chapter7/9
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-009
    type: single
    difficulty: easy
    question: What does NER stand for?
    options:
      - text: Nearest Estimated Region
        why: 'Not an NLP term: NER is Named Entity Recognition, finding names of people, places and other entities in text [^1].'
      - text: Nearest Entity Region
        why: An invented expansion; the R stands for Recognition, the task of finding spans that name entities and labelling their type [^2].
      - text: Named Entity Recognition
        correct: true
    explanation: |
      NER stands for Named Entity Recognition: finding specific entities in text, such as places,
      person names, date-time intervals or chemical formulae [^1]. Formally, it finds spans of text
      that are proper names and labels their type; the most common tags are PER (person), LOC
      (location), ORG (organization) and GPE (geo-political entity) [^2]. The other expansions are
      invented.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md
        locator: 'Lesson: Named Entity Recognition, introduction'
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
        url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
        locator: Sec. 18.3 Named Entities and Named Entity Tagging
    source:
      id: ms-ai-for-beginners
      ref: quiz-119/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-010
    type: true_false
    difficulty: easy
    question: An entity always consists of one token
    options:
      - text: 'True'
        why: Entities often span several tokens, such as "Tricuspid valve regurgitation" or "New York City"; BIO tags mark where each one starts and continues [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      An entity can span several tokens. In "Tricuspid valve regurgitation and lithium carbonate
      toxicity", the first disease name has three tokens and the chemical has two [^1]. That is why
      NER uses BIO tagging: B- marks the first token of an entity, I- the tokens inside it, and O all
      other tokens [^1][^2]. Proper names such as "New York City" or "Stanford University" are typical
      multiword entities [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
        locator: 'Lesson: Named Entity Recognition, sec. NER as Token Classification'
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
        url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
        locator: Ch. 18 introduction and Sec. 18.3 (BIO tagging)
    source:
      id: ms-ai-for-beginners
      ref: quiz-119/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-011
    type: single
    difficulty: easy
    question: To train an NER model, we need
    options:
      - text: Labeled dataset
        correct: true
      - text: Any natural text
        why: Unlabelled text is enough for a language model [^3], but an NER model is a supervised token classifier that needs every token labelled [^1].
      - text: Translated texts in two languages
        why: Pairs of translated texts are what machine translation learns from; they carry no entity labels [^4].
    explanation: |
      An NER model is a supervised token classifier, so it must learn from text in which every token
      already carries its entity label, usually in BIO format [^1]. Jurafsky and Martin note that,
      because these taggers are supervised, labelled data is essential for training and testing, and
      corpora such as OntoNotes supply named-entity annotations [^2]. Plain natural text is enough for
      a language model, which learns without labels [^3], and translated texts in two languages are
      what machine translation learns from [^4].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
        locator: 'Lesson: Named Entity Recognition, secs. NER as Token Classification and Training NER models'
      - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
        url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
        locator: Sec. 18.7 Further Details
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
        locator: 'Lesson: Language Modeling, introduction'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#machine-learning-approaches
        locator: 'Lesson: Translation and sentiment analysis with ML, sec. Machine learning approaches'
    source:
      id: ms-ai-for-beginners
      ref: quiz-119/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-012
    type: single
    difficulty: easy
    question: An NER model is essentially a ____ model
    options:
      - text: text classification
        why: Text classification gives one label to the whole text, such as a chatbot's intent; NER needs a label for every token [^1].
      - text: token classification
        correct: true
      - text: text regression
        why: Regression predicts one number per text, not a class label for each token.
    explanation: |
      NER models are token classification models: for each input token they decide whether it is
      part of an entity and, if so, of which class [^1]. The HF course defines token classification
      as attributing a label to each token in a sentence, with NER as its first example [^2]. Text
      classification gives one label to the whole text (for example a chatbot's intent) [^1], and text
      regression likewise outputs a single value per text, so neither yields the per-token labels NER
      needs.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
        locator: 'Lesson: Named Entity Recognition, secs. Example of Using NER and NER as Token Classification'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/2#token-classification
        locator: Chapter 7.2 Token classification, introduction
    source:
      id: ms-ai-for-beginners
      ref: quiz-219/q1
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-013
    type: single
    difficulty: easy
    question: Which neural network types can be used for NER?
    options:
      - text: Only RNNs, such as LSTMs
        why: Recurrent networks such as LSTMs do work, but so do Transformers such as BERT [^1][^2].
      - text: Only Transformers, such as BERT
        why: BERT works well for NER, but any network that outputs one prediction per token can do it, LSTMs included [^1].
      - text: Both RNNs and Transformers
        correct: true
    explanation: |
      Because NER is token classification, any network that outputs one prediction per token can do
      it. Microsoft's AI-for-Beginners NER lesson trains an LSTM, a recurrent network, and its assignment then moves on to the BERT
      Transformer [^1]. The HF course fine-tunes BERT for NER on the CoNLL-2003 dataset [^2], and d2l
      shows how BERT's representation of every token is fed into a shared output layer to tag it [^3].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#training-ner-models
        locator: 'Lesson: Named Entity Recognition, secs. Training NER models and Assignment'
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/2#the-conll-2003-dataset
        locator: Chapter 7.2 Token classification, introduction and sec. The CoNLL-2003 dataset
      - source: d2l
        url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#text-tagging
        locator: Sec. 16.6.3 Text Tagging
    source:
      id: ms-ai-for-beginners
      ref: quiz-219/q2
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-014
    type: single
    difficulty: medium
    question: An NER model is a good example of a ____ network architecture
    options:
      - text: one-to-one
        why: One-to-one maps a single input to a single output, as in image classification; NER reads a sequence and labels every token [^2].
      - text: one-to-many
        why: One-to-many turns one input into a sequence, as in image captioning; NER's input is already a sequence [^2].
      - text: many-to-many
        correct: true
    explanation: |
      NER outputs one tag for every input token, a one-to-one correspondence between input and output
      positions, so it fits the synchronised many-to-many pattern, the right-most architecture in
      Karpathy's diagram [^1][^2]. One-to-one maps a single fixed input to a single output (for
      example image classification), and one-to-many turns one input into a sequence (for example
      image captioning) [^2]. Machine translation is also many-to-many, but there the output sequence
      is produced after reading the input and is not aligned with it token by token [^2].
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
        locator: 'Lesson: Named Entity Recognition, sec. NER as Token Classification'
      - title: Karpathy, The Unreasonable Effectiveness of Recurrent Neural Networks (2015)
        url: http://karpathy.github.io/2015/05/21/rnn-effectiveness/
        locator: Sec. Recurrent Neural Networks, figure of input/output patterns and its caption
    source:
      id: ms-ai-for-beginners
      ref: quiz-219/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-19.json
    status: reviewed
    reviewed_by: claude
  - id: nlp-tasks-015
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** The BLEU metric for machine translation is built on $n$-gram precision, while the ROUGE metric for summarization is recall-oriented.

      **Statement 2.** Hidden Markov models were widely used to model the word sequences of English sentences, for example in part-of-speech tagging.
    options:
      - text: True, True
        correct: true
      - text: False, False
        why: 'Both statements are true: BLEU is precision-based and ROUGE recall-oriented [^1][^2], and HMMs were the classic model for tagging word sequences [^3].'
      - text: True, False
        why: 'Statement 2 is also true: the HMM, with tags as hidden states and words as observations, was the classic part-of-speech tagger [^3].'
      - text: False, True
        why: 'Statement 1 is also true: BLEU builds on n-gram precision [^1], and ROUGE is short for Recall-Oriented Understudy for Gisting Evaluation [^2].'
    explanation: 'Statement 1 is true. BLEU scores a candidate translation by its $n$-gram precision against the reference, with a penalty for outputs that are too short [^1]. ROUGE (Recall-Oriented Understudy for Gisting Evaluation) asks how much of the human reference summary the generated summary recovers, and precision is usually reported alongside it [^2]. Statement 2 is also true: the HMM is the classic generative sequence model for labeling the words of a sentence, with the tags as hidden states and the words as observations [^3].'
    references:
      - source: d2l
        url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html#evaluation-of-predicted-sequences
        locator: Sec. 10.7.8 Evaluation of Predicted Sequences (BLEU)
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter7/5#metrics-for-text-summarization
        locator: Chapter 7.5 Summarization, sec. Metrics for text summarization
      - title: 'Jurafsky and Martin: Speech and Language Processing (3rd ed. draft, Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities'
        url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
        locator: Sec. 18.4 HMM Part-of-Speech Tagging
    source:
