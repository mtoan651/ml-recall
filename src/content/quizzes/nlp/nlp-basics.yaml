    status: draft
  - id: nlp-basics-007
    type: single
    difficulty: easy
    question: ELIZA, a 1960s program, played the role of a computer therapist. How did it produce its replies?
    options:
      - text: By spotting keywords in the input and rearranging the user's words into canned replies
        correct: true
      - text: By generating each reply with a neural language model trained on transcripts of real therapy sessions
      - text: By looking up the medically correct answer in a database of diagnoses
    explanation: |
      Joseph Weizenbaum's ELIZA parsed a sentence for certain grammatical constructs and keywords
      and transformed them: "I am sad" could become "How long have you been sad?", and when no
      keyword matched it fell back on a generic reply [^1]. That gave the impression of
      understanding, but the program only changed tenses and added words, so "You are a bicycle"
      could get the answer "How long have I been a bicycle?" [^1]. It was a hand-tuned "scruffy"
      system of the 1960s, long before neural language models, and it held no medical knowledge
      [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#developing-eliza
        locator: 'Lesson: Introduction to natural language processing, sec. Developing Eliza'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
        locator: 'Lesson: History of machine learning, secs. 1956 - 1974: "The golden years" and 1974 - 1980: "AI Winter"'
    source:
      id: ms-ml-for-beginners
      ref: quiz-31/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: nlp-basics-008
    type: single
    difficulty: easy
    question: Which description fits the goal of natural language processing as a whole, rather than one particular task?
    options:
      - text: Sorting written texts into happy ones and sad ones, based on the words that each text contains
      - text: Getting computers to process and interpret human language, its meaning and sentiment
        correct: true
      - text: Finding reviews with unusual sentiment scores and examining them by hand
    explanation: |
      NLP is the field concerned with how computers can process "natural", that is human,
      languages, from parsing grammar to the harder problem of understanding the meaning and
      sentiment of a sentence [^1]. Its practical value is that a program can interpret large
      amounts of text, such as thousands of emails, so that no person has to read them all [^2].
      Sorting texts into positive and negative is sentiment analysis, one NLP task among many [^3],
      and examining unusual scores is one step of a particular analysis.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#computational-linguistics
        locator: 'Lesson: Introduction to natural language processing, secs. Computational linguistics and How is this technology made possible?'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#ml-approaches
        locator: 'Lesson: Translation and sentiment analysis with ML, sec. ML approaches (email example)'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#sentiment-analysis
        locator: 'Lesson: Common NLP tasks and techniques, sec. Sentiment analysis'
    source:
      id: ms-ml-for-beginners
      ref: quiz-38/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: nlp-basics-009
    type: single
    difficulty: easy
    tags:
      - stemming
      - lemmatization
      - preprocessing
    question: |
      After stemming, text can become hard to read: "located" turns into "locat" and "beautiful" into
      "beauti". Why does this happen?
    options:
      - text: Stemming maps each word to its dictionary base form, which drops tense and number
        why: That describes lemmatization, which converts inflected forms into base forms that are real words [^1].
      - text: Stemming crudely chops off affixes, and the stems it leaves are often not real words
        correct: true
      - text: Stemming removes stop words, so the sentence loses its function words
        why: Removing stop words is a separate preprocessing step; stemming changes the remaining words themselves [^1].
      - text: Stemming splits each word into subword tokens, which are then shown separately
        why: Subword tokenization keeps all the pieces; stemming throws the affixes away [^1].
    explanation: |
      Stemming and lemmatization both try to ignore morphological differences between words.
      Lemmatization converts inflected forms into their base form, a real word, while stemming is a
      crude chopping of affixes, and the resulting stems are usually not words themselves, so the
      text becomes hard to read [^1]. Popular stemmers such as the Porter stemmer can be quite
      aggressive [^1].
    references:
      - source: ubc-dsci575
        locator: "Lecture 2: Applications of Markov Models and Text Preprocessing — 4.3 Other commonly used preprocessing steps (lemmatization, stemming); Exercise: Discuss the following questions, V's Solutions"
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/02_LMs-text-preprocessing.ipynb#ex2.4
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    status: draft
  - id: nlp-basics-010
    type: single
    difficulty: easy
    tags:
      - named-entity-recognition
      - information-extraction
    question: |
      Named-entity recognition (NER) labels the spans of a text that name real-world entities, such
      as people, organizations, places or amounts of money. Which annotation of this sentence is the
      most reasonable?

      > The MadeUpOrg founder John Fakename lists his Point Grey penthouse for \$15 million.
    options:
      - text: MadeUpOrg = organization, founder = person, penthouse = location, \$15 million = money
        why: '"Founder" and "penthouse" are common nouns that describe a role and a thing; they do not name a specific entity [^1].'
      - text: MadeUpOrg = organization, John Fakename = person, Point Grey = location, \$15 million = money
        correct: true
      - text: John Fakename = person, Point Grey = person, MadeUpOrg = location
        why: Point Grey is a place (a neighbourhood) and MadeUpOrg is the organization John Fakename founded; the types must match what the names refer to [^1].
      - text: John Fakename = person only, because made-up names cannot be entities
        why: Whether a name is famous or invented does not matter; NER looks at how the span is used in the sentence [^1].
    explanation: |
      NER is one of the standard steps for extracting information from text, next to part-of-speech
      tagging, coreference resolution and dependency parsing [^1]. It marks spans that *name*
      something: an organization (MadeUpOrg), a person (John Fakename), a location (Point Grey) and
      an amount of money (\$15 million). The course's comparison is instructive: the off-the-shelf
      model it tried missed the made-up organization and the local place name, so NER models can
      fail on names they have not seen [^1].
    references:
      - source: ubc-dsci575
        locator: "Lecture 2: Applications of Markov Models and Text Preprocessing — 4.5 Other typical NLP tasks; Exercise: Discuss the following questions, V's Solutions"
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/02_LMs-text-preprocessing.ipynb#ex2.4b
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    status: draft
  - id: nlp-basics-011
    type: short_answer
    difficulty: easy
    tags:
      - bag-of-words
      - averaged-bow
      - one-hot
    question: |
      An averaged bag-of-words represents a document $D$ as
      $\mathbf{x} = \frac{1}{|D|}\sum_{i=1}^{|D|} \mathbf{x}^{D_{[i]}}$, the mean of the one-hot
      vectors of its tokens. For the document "the cat saw the dog", what is the entry of
      $\mathbf{x}$ for the word "the"?
    answer:
      numeric: 0.4
      tolerance: 0.001
      hint: a number, e.g. 0.25
      model: '"the" occurs 2 times among $|D| = 5$ tokens: $2/5 = 0.4$'
    explanation: |
      Summing the one-hot vectors counts how often each vocabulary word occurs, and dividing by the
      document length $|D|$ turns the counts into relative frequencies [^1]. "the" appears twice
      among five tokens, so its entry is 0.4, the other three words get 0.2 and all remaining
      vocabulary entries stay 0. The vector has one dimension per vocabulary word, whatever the
      document length, which gives the fixed-size input a linear classifier needs [^1].
    references:
      - source: trusthlt-nlp
        locator: Lecture 3 slides, frames '(Averaged) Bag-of-words' and 'Averaged bag-of-words example'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
    source:
      id: trusthlt-nlp
      ref: lectures/lecture03/nlpwdl2025-lecture03.tex#averaged-bow
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
    status: draft
  - id: nlp-basics-012
    type: short_answer
    difficulty: medium
    tags:
      - tf-idf
      - information-retrieval
      - term-weighting
    question: |
      A collection has 1,000 documents. The term "glacier" occurs 100 times in document $d$ and
      appears in 10 documents overall. With
      $\mathrm{tf}_{t,d} = 1 + \log_{10} \mathrm{count}(t, d)$ and
      $\mathrm{idf}_t = \log_{10}(N / \mathrm{df}_t)$, what is $\textrm{tf-idf}(\text{glacier}, d)$?
    answer:
      numeric: 6
      tolerance: 0.001
      hint: a number
      model: $\mathrm{tf} = 1 + \log_{10} 100 = 3$, $\mathrm{idf} = \log_{10}(1000/10) = 2$, product $= 6$
    explanation: |
      The log in tf damps raw counts: a word that appears 100 times is not 100 times more relevant
      than one that appears once, so the tf is only 3 [^1]. The idf rewards rare terms, $\log_{10}$
      of 100 here, and gives 0 to terms that occur in every document [^1]. The tf-idf weight is the
      product, $3 \times 2 = 6$; documents and queries are then compared by the cosine of their
      tf-idf vectors [^1].
    references:
      - source: trusthlt-nlp
        locator: Lecture 11 slides, frames 'Term frequency', 'Inverse document frequency', 'tf-idf', 'Document scoring'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture11/pdf/nlpwdl2025-lecture11-handout.pdf
    source:
      id: trusthlt-nlp
      ref: lectures/lecture11/nlpwdl2025-lecture11.tex#tf-idf
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture11/pdf/nlpwdl2025-lecture11-handout.pdf
    status: draft
  - id: nlp-basics-013
    type: single
    difficulty: easy
    tags:
      - discrete-symbols
      - word-representation
      - challenges-of-nlp
    question: |
      In computer vision two colours can be compared through continuous properties such as hue and
      intensity. Why is it harder to compare the *words* "red" and "pink" the same way?
    options:
      - text: Words are discrete symbols whose letters say nothing about meaning
        correct: true
      - text: Words are too short to carry enough information about their meaning
        why: Length is not the issue; "hamburger" and "pizza" are long words, yet nothing in their letters relates them [^1].
      - text: Word meanings change over time, so no comparison can be stable
        why: Language change exists but is slow; the basic problem is that symbols carry no inherent measure of similarity [^1].
      - text: Text has no numerical representation that a computer could compare
        why: Text can be encoded as numbers (e.g. one-hot vectors), but such codes put all words equally far apart [^1].
    explanation: |
      Characters and words are discrete symbols whose meaning is external to them: no inherent
      relation between "hamburger" and "pizza" can be read off the letters [^1]. For continuous
      signals such as colour there are simple operations (to grey-scale, compare hue), but there is
      no simple operation from "red" to "pink" without a large lookup table [^1]. Learned dense
      embeddings are the standard remedy [^2].
    references:
      - source: trusthlt-nlp
        locator: Lecture 1 slides, frames 'Language is symbolic and discrete' and 'Characters and words are discrete symbols'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture01/pdf/nlpwdl2025-lecture01-handout.pdf
      - source: d2l
        locator: Sec. 15.1.1 One-Hot Vectors Are a Bad Choice and 15.1.2 Self-Supervised word2vec
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/word2vec.html#one-hot-vectors-are-a-bad-choice
    source:
      id: trusthlt-nlp
      ref: lectures/lecture01/nlpwdl2025-lecture01.tex#discrete-symbols
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture01/pdf/nlpwdl2025-lecture01-handout.pdf
    status: draft
  - id: nlp-basics-014
    type: short_answer
    difficulty: easy
    tags:
      - bag-of-words
      - word-order
      - cosine-similarity
    question: |
      With a bag-of-words count representation (one dimension per vocabulary word), what is the cosine
      similarity between the vectors of "this is interesting" and "is this interesting"?
    answer:
      numeric: 1
      tolerance: 0.001
      hint: a number between -1 and 1
      model: 1 — both sentences contain the same words once each, so their count vectors are identical
    explanation: |
      Bag of words records only which words occur and how often, discarding their order [^1]. Both
      sentences contain "this", "is" and "interesting" once, so they map to the same vector and have
      cosine similarity 1, even though one is a statement and the other a question [^2]. Capturing such
      differences needs order-aware features (n-grams) or sequence models.
    references:
      - source: ds-interviews
        locator: theory.md, Text classification — "What are the advantages and disadvantages of bag of words?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#text-classification
      - title: 'Wikipedia: Bag-of-words model'
        url: https://en.wikipedia.org/wiki/Bag-of-words_model#Word_order
        locator: Sections "Definition" and "Word order"
    source:
      id: ds-interviews
      ref: theory.md#q121
