  - id: tokenization-032
    type: single
    difficulty: medium
    tags:
      - bpe
      - wordpiece
      - encoding
      - longest-match
    question: |
      Two tokenizers share the vocabulary {t, e, s, es, st, te}. The BPE tokenizer learned its
      merges in this order: (1) `e s` → `es`, (2) `s t` → `st`, (3) `t e` → `te`. The WordPiece-style
      tokenizer instead takes, again and again, the longest vocabulary entry that starts at the
      current position (ignore `##` prefixes). How do they tokenize "test"?
    options:
      - text: 'BPE: `t` `es` `t`; longest match: `te` `st`'
        correct: true
      - text: 'BPE: `te` `st`; longest match: `t` `es` `t`'
        why: The two results are swapped; BPE applies `e s` first, and longest match grabs `te` at the start.
      - text: 'Both: `te` `st`'
        why: BPE does not look for the longest entry; it replays its merges in order, and `e s` comes first.
      - text: 'Both: `t` `es` `t`'
        why: Longest match starts from the left and takes `te`, the longest entry beginning at position 0.
    explanation: |
      A BPE tokenizer splits a word into characters and applies the learned merges in the order
      they were learned [^1]. Merge 1 turns `t e s t` into `t es t`; then no `s t` or `t e` pair is
      left, so the result is `t es t`. WordPiece stores only the vocabulary and, from the start of
      the word, takes the longest subword in the vocabulary, then continues with the rest [^2].
      Here it takes `te`, then `st`. The same vocabulary can thus give different tokenizations;
      the Hugging Face course shows "hugs" becoming `hu ##gs` with BPE but `hug ##s` with WordPiece [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/5#tokenization-algorithm
        locator: Chapter 6.5 Byte-Pair Encoding tokenization, sec. Tokenization algorithm
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/6#tokenization-algorithm
        locator: Chapter 6.6 WordPiece tokenization, sec. Tokenization algorithm
