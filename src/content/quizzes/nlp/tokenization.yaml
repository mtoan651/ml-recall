title: Tokenization
questions:
  - id: tokenization-001
    type: multiple
    shuffle: false
    question: Which of the following is an example of subword tokenization?
    options:
      - text: WordPiece
        correct: true
      - text: Character-based tokenization
        why: Character-based tokenization is not a type of subword tokenization.
      - text: Splitting on whitespace and punctuation
        why: That's a word-based tokenization scheme!
      - text: BPE
        correct: true
      - text: Unigram
        correct: true
      - text: None of the above
        why: Wrong!
    explanation: Yes, that's one example of subword tokenization! Yes, that's one example of subword tokenization! Yes, that's one example of subword tokenization! [^1]
    references:
      - source: hf-llm-course
        locator: 'Chapter 2: Using 🤗 Transformers'
        url: https://huggingface.co/learn/llm-course/chapter2/1
    source:
