    reviewed_by: claude
  - id: tokenization-034
    type: single
    difficulty: medium
    tags:
      - wordpiece
      - unknown-token
      - out-of-vocabulary
    question: |
      A WordPiece tokenizer has the vocabulary
      `[UNK]`, `p`, `s`, `t`, `z`, `##i`, `##n`, `##s`, `##p`, `sp`, `spin`, `##in`, `pin`.
      It encodes "spins" as `spin ##s`. How does it encode "spit"?
    options:
      - text: '`[UNK]`'
        correct: true
      - text: '`sp` `##i` `[UNK]`'
        why: WordPiece does not mark only the missing piece; once no vocabulary entry fits, the whole word becomes `[UNK]`.
      - text: '`s` `##p` `##i` `[UNK]`'
        why: Longest match starts with `sp`, not `s`; and in any case WordPiece replaces the whole word, not one piece.
      - text: '`sp` `##i` `##t`'
        why: '`##t` is not in the vocabulary (only `t` at the start of a word is), so this split is impossible.'
    explanation: |
      WordPiece tokenizes by taking the longest vocabulary entry from the start of the word:
      `sp`, then `##i`; the rest, `##t`, is not in the vocabulary. When it reaches a point where no
      subword fits, WordPiece tokenizes the whole word as unknown [^1]. BPE differs here: it marks
      only the individual characters that are missing from its base vocabulary as unknown, so it keeps
      the known parts [^1][^2]. For "spins" every piece is found: `spin`, then `##s`.
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/6#tokenization-algorithm
        locator: Chapter 6.6 WordPiece tokenization, sec. Tokenization algorithm
