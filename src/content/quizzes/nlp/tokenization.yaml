  - id: tokenization-014
    type: single
    difficulty: medium
    tags:
      - bpe
      - subword
      - merges
    question: |
      Byte-pair encoding is trained on the toy corpus "this fat cat with the hat is in the cave of
      the thin bat", split into characters, counting adjacent pairs only inside words. The first
      merge is `t h` → `th` (6 times), the second `a t` → `at` (4 times). Which pair is merged
      third?
    options:
      - text: '`th e`, which occurs 3 times'
        correct: true
      - text: '`th i`, which occurs 2 times'
        why: '`th i` occurs only in "this" and "thin" (2 times), fewer than `th e` [^1].'
      - text: '`i s`, which occurs 2 times'
        why: '`i s` occurs in "this" and "is" (2 times), fewer than `th e` [^1].'
      - text: '`h e`, which occurs 3 times'
        why: After the first merge, every `h` that followed a `t` is part of `th`, so `h e` no longer occurs in "the"; it is now `th e` [^1].
    explanation: |
      BPE repeatedly merges the most frequent adjacent pair and adds it to the vocabulary [^1].
      After `th` and `at`, "the" appears three times as `th e`, more often than any other pair
      inside a word (`th i`, `i s` and `i n` occur twice), so the third merge creates `the` [^1].
      Frequent words thus end up as single tokens, while rare words stay split into subwords [^2].
    references:
      - source: trusthlt-nlp
        locator: "Lecture 3 slides, frames 'Subword units: Byte-pair encoding' and 'Byte-pair encoding example on a toy corpus (parts 1 and 2)'"
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
    source:
      id: trusthlt-nlp
      ref: lectures/lecture03/nlpwdl2025-lecture03.tex#bpe-toy-corpus
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
    status: reviewed
