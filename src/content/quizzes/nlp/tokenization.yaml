  - id: tokenization-031
    type: short_answer
    difficulty: hard
    tags:
      - bpe
      - merges
      - sequence-length
    question: |
      BPE is trained on a corpus with these word counts:

      | word | hat | hats | that | chat | chats | at |
      | --- | --- | --- | --- | --- | --- | --- |
      | count | 5 | 2 | 4 | 3 | 2 | 3 |

      Split into characters, the corpus is 67 tokens long. The first three merges are `a t` → `at`,
      `h at` → `hat` and `c hat` → `chat`. How many tokens long is the corpus after these three
      merges (counting every occurrence of every word)?
    answer:
      numeric: 27
      tolerance: 0
      hint: a whole number
      model: hat 5×1 + hats 2×2 (hat s) + that 4×2 (t hat) + chat 3×1 + chats 2×2 (chat s) + at 3×1 = 27
    explanation: |
      Each merge replaces every occurrence of a pair by one new symbol, so the corpus gets shorter
      by the pair's count: $67 - 19 = 48$ after `at`, $48 - 16 = 32$ after `hat`, and
      $32 - 5 = 27$ after `chat` [^1]. Counting directly gives the same: "hat" (1 token) × 5,
      "hats" (`hat s`) × 2, "that" (`t hat`) × 4, "chat" × 3, "chats" (`chat s`) × 2 and "at" × 3,
      that is $5 + 4 + 8 + 3 + 4 + 3 = 27$. Each merge also adds one symbol to the vocabulary, so
      BPE trades a bigger vocabulary for shorter sequences [^1][^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/5#training-algorithm
        locator: Chapter 6.5 Byte-Pair Encoding tokenization, sec. Training algorithm
      - title: 'Kudo (2018), Subword Regularization: Improving Neural Network Translation Models with Multiple Subword Candidates'
        url: https://arxiv.org/abs/1804.10959
        locator: Sec. 3.1 Byte-Pair-Encoding (BPE) (balances vocabulary size and number of tokens)
