  - id: tokenization-033
    type: single
    difficulty: hard
    tags:
      - wordpiece
      - merges
      - pair-score
    question: |
      WordPiece (as described in the Hugging Face course) splits each word into a first character
      and `##`-prefixed continuation characters, e.g. `s ##p ##i ##n`, and merges the pair with the
      highest

      $$\mathrm{score} = \frac{\mathrm{freq}(\text{pair})}{\mathrm{freq}(\text{first}) \times \mathrm{freq}(\text{second})}.$$

      The corpus has the word counts pin 6, pins 2, spin 3, tin 4 and zip 1. Which pair is merged
      first?
    options:
      - text: '`s` + `##p`'
        correct: true
      - text: '`##i` + `##n`'
        why: This is the most frequent pair (15 times), the one BPE would merge, but `##i` and `##n` are so frequent that its score is only $15/(16 \cdot 15) = 1/16$.
      - text: '`##n` + `##s`'
        why: Its score is $2/(15 \cdot 2) = 1/15$, lower than the $1/4$ of `s` + `##p`, because `##n` occurs 15 times.
      - text: '`p` + `##i`'
        why: '`##i` occurs 16 times, which pushes the score down to $8/(8 \cdot 16) = 1/16$.'
    explanation: |
      Unit frequencies: `p` 8, `##i` 16, `##n` 15, `##s` 2, `s` 3, `##p` 4, `t` 4, `z` 1. The pair
      `s ##p` occurs 3 times (in "spin"), so its score is $3/(3 \cdot 4) = 1/4$, the highest. The most
      frequent pair, `##i ##n` (15 times), scores only $15/(16 \cdot 15) = 1/16$ [^1]. Dividing by the
      frequencies of the parts favours pairs whose parts are rarely seen elsewhere, unlike BPE,
      which merges the most frequent pair [^1][^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/6#training-algorithm
        locator: Chapter 6.6 WordPiece tokenization, sec. Training algorithm
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
        locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview
    source:
      id: original
      ref: tokenization-033
