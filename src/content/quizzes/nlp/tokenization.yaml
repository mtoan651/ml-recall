  - id: tokenization-035
    type: single
    difficulty: medium
    tags:
      - unigram
      - sentencepiece
      - segmentation
      - viterbi
    question: |
      A Unigram tokenizer has these token probabilities:

      | token | s | e | a | t | se | at | sea | eat |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | $p$ | 0.03 | 0.1 | 0.1 | 0.02 | 0.02 | 0.1 | 0.05 | 0.03 |

      It picks the segmentation with the highest product of token probabilities. How does it
      segment "seat"?
    options:
      - text: '`se` `at`'
        correct: true
      - text: '`sea` `t`'
        why: This is the greedy longest-prefix split, but $0.05 \times 0.02 = 0.001$ is lower than $0.02 \times 0.1 = 0.002$.
      - text: '`s` `eat`'
        why: $0.03 \times 0.03 = 0.0009$, less than the 0.002 of `se` `at`.
      - text: '`s` `e` `at`'
        why: A third factor below 1 shrinks the product; $0.03 \times 0.1 \times 0.1 = 0.0003$.
    explanation: |
      A unigram model treats tokens as independent, so a segmentation's probability is the product
      of its token probabilities, and the tokenizer picks the most probable one (found with the
      Viterbi algorithm on longer words) [^1][^2]. Here: `se at` $= 0.002$, `sea t` $= 0.001$,
      `s eat` $= 0.0009$, `s e at` $= 0.0003$, and splits with more tokens are smaller still. Fewer
      tokens usually win, because every extra factor is below 1, but among two-token splits the
      probabilities decide, not the length of the first piece [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/7#tokenization-algorithm
        locator: Chapter 6.7 Unigram tokenization, sec. Tokenization algorithm
      - title: 'Kudo (2018), Subword Regularization: Improving Neural Network Translation Models with Multiple Subword Candidates'
        url: https://arxiv.org/abs/1804.10959
        locator: Sec. 3.2 Unigram language model (Eq. 7, Viterbi segmentation)
