    reviewed_by: claude
  - id: tokenization-020
    type: short_answer
    difficulty: medium
    tags:
      - pre-tokenization
      - normalization
      - huggingface-tokenizers
    question: |
      A WordPiece tokenizer is set up with this normalizer and pre-tokenizer (Hugging Face `tokenizers`):
      ```python
      tokenizer.normalizer = normalizers.Sequence([
          normalizers.Replace(Regex(r"[\s]"), " "),
          normalizers.Lowercase(), normalizers.NFD(), normalizers.StripAccents()])
      tokenizer.pre_tokenizer = pre_tokenizers.Sequence([
          pre_tokenizers.WhitespaceSplit(),
          pre_tokenizers.Digits(individual_digits=True),
          pre_tokenizers.Punctuation()])
      ```
      How many pre-tokens (pieces handed on to the WordPiece model) does the input `Don't stop at 23.5%` produce?
    answer:
      numeric: 10
      tolerance: 0
      hint: an integer
      model: "`don`, `'`, `t`, `stop`, `at`, `2`, `3`, `.`, `5`, `%`"
    explanation: |
      The normalizer lowercases and strips accents but keeps punctuation, giving `don't stop at 23.5%` [^1]. The
      pre-tokenizer then splits on whitespace (4 chunks), puts every digit in its own piece (`23.5` becomes `2`, `3`,
      `.`, `5`) and isolates every punctuation character (`don't` becomes `don`, `'`, `t`, and `%` stands alone), 10
      pre-tokens in total [^1][^2]. WordPiece then splits each piece further into vocabulary subwords, but never merges
      across these boundaries [^2].
    references:
      - source: neuromatch-dl
        locator: W2D5 Tutorial 2, Section 2 The NLP pipeline, Tokenizer Features
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
      - source: hf-llm-course
        locator: Chapter 6, Normalization and pre-tokenization
        url: https://huggingface.co/learn/llm-course/chapter6/4
    source:
      id: neuromatch-dl
      ref: W2D5_TimeSeriesAndNaturalLanguageProcessing/W2D5_Tutorial2#sec2-features
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: tokenization-021
    type: single
    difficulty: medium
    tags:
      - subword-tokenization
      - bpe
      - wordpiece
    question: |
      Someone proposes skipping trained subword tokenizers: just split text into two-character chunks and one-hot
      encode them, which also never meets an unknown word. What does a trained subword tokenizer such as BPE or
      WordPiece offer that this scheme lacks?
    options:
      - text: 'Units chosen from corpus frequencies: common words or pieces become single tokens, so sequences are shorter and more meaningful'
        correct: true
      - text: Dense vectors that capture meaning, whereas one-hot codes are sparse and carry no similarity
        why: A tokenizer only maps text to token ids; meaning-bearing dense vectors come from the embedding layer that follows it.
      - text: A guaranteed vocabulary smaller than the 676 possible two-letter combinations
        why: Subword vocabularies usually hold tens of thousands of tokens; a small vocabulary is not their advantage.
      - text: No need for an embedding layer, because the token ids can be fed to the model directly
        why: Token ids still have to be embedded; as the Neuromatch Academy tutorial puts it, the usual next step after a tokenizer is an embedder.
    explanation: |
      BPE starts from characters and repeatedly merges the most frequent adjacent pair, and WordPiece keeps substrings
      that occur often enough, so both build their units from corpus statistics [^1][^2]. Frequent words become single
      tokens and rare words split into a few recurring pieces, so sequences stay short, units carry reusable morphemes,
      and unknown words are still covered [^1]. Fixed two-letter chunks ignore these statistics: every word is cut the
      same arbitrary way, into about half as many tokens as it has letters. Either way, the ids still need an embedding
      layer afterwards [^1].
    references:
      - source: neuromatch-dl
        locator: W2D5 Tutorial 2, Section 2 Tokenizers (BPE and WordPiece), Think 2.1 Tokenizer good practices
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
      - source: hf-llm-course
        locator: Chapter 6, Byte-Pair Encoding tokenization
        url: https://huggingface.co/learn/llm-course/chapter6/5
    source:
      id: neuromatch-dl
      ref: W2D5_TimeSeriesAndNaturalLanguageProcessing/W2D5_Tutorial2#think2.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: tokenization-022
    type: single
    difficulty: medium
    tags:
      - tokenizer
      - vocabulary
      - pretrained-models
    question: |
      You load a pretrained GPT-2-style code model and want to use a different tokenizer with it. What must the
      replacement tokenizer satisfy for the pretrained model to work?
    options:
      - text: It must map text to the same token ids as the original vocabulary, since each id selects a learned embedding row
        correct: true
      - text: It must have been trained on the same amount of text, whatever its vocabulary looks like
        why: Corpus size is irrelevant; what matters is that id 1234 still means the token the model learned for id 1234.
      - text: It only needs to produce fewer tokens per sentence than the original tokenizer
        why: Shorter sequences do not help if the ids point to the wrong embedding rows; the model would read nonsense.
      - text: It must use the WordPiece algorithm, because GPT-style models cannot read BPE tokens
        why: GPT-2 itself uses byte-level BPE; any algorithm works as long as it yields the model's own token-to-id mapping.
    explanation: |
      A language model never sees text, only token ids, and each id indexes a row of the embedding matrix learned during
      pretraining [^1]. A tokenizer with another vocabulary, for example `bert-base-uncased` for a GPT-2 model as the
      Neuromatch Academy tutorial warns, would send ids whose learned meaning does not match the text [^1]. That is why
      preprocessing must be done exactly as when the model was pretrained, and why checkpoints are loaded together with
      their own tokenizer [^2].
    references:
      - source: neuromatch-dl
        locator: W2D5 Tutorial 2, Section 4 NLG with GPT, Think 4.1 Tokenizers
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
      - source: hf-llm-course
        locator: Chapter 2, Behind the pipeline (Preprocessing with a tokenizer)
        url: https://huggingface.co/learn/llm-course/chapter2/2
    source:
      id: neuromatch-dl
      ref: W2D5_TimeSeriesAndNaturalLanguageProcessing/W2D5_Tutorial2#think4.1
      url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W2D5_TimeSeriesAndNaturalLanguageProcessing/instructor/W2D5_Tutorial2.ipynb
