schema_version: 1
domain: nlp
topic: tokenization
title: Tokenization
questions:
  - id: tokenization-001
    type: multiple
    difficulty: easy
    question: Which of the following are examples of subword tokenization?
    options:
      - text: WordPiece
        correct: true
      - text: Character-based tokenization
        why: Character-based tokenization is not a type of subword tokenization.
      - text: Splitting on whitespace and punctuation
        why: That's a word-based tokenization scheme!
      - text: BPE
        correct: true
      - text: Unigram
        correct: true
      - text: Lowercasing the text and removing accents
        why: That's normalization, a cleanup step before the text is split; it produces no tokens.
    explanation: |
      Subword tokenization keeps frequent words whole and splits rare words into meaningful pieces, for
      example "tokenization" into "token" and "ization", which gives good coverage with a small
      vocabulary and almost no unknown tokens [^1]. BPE, WordPiece and Unigram are the three main
      subword algorithms, used by GPT-2, BERT and T5 respectively [^2]. Splitting on whitespace and
      punctuation is word-based tokenization, and character-based tokenization splits text into single
      characters [^1]. Lowercasing and removing accents is normalization, a cleanup step before any
      splitting [^2].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter2/4#subword-tokenization
        locator: Chapter 2.4 Tokenizers, secs. Word-based, Character-based and Subword tokenization
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
        locator: Chapter 6.4 Normalization and pre-tokenization, secs. Normalization and Algorithm overview
    source:
      id: hf-llm-course
      ref: chapter2/9#q3
      url: https://huggingface.co/learn/llm-course/chapter2/9
    status: draft
  - id: tokenization-002
    type: single
    difficulty: medium
    question: When should you train a new tokenizer?
    options:
      - text: When your dataset is similar to that used by an existing pretrained model, and you want to pretrain a new model
        why: In this case, to save time and compute resources, a better choice would be to use the same tokenizer as the pretrained model and fine-tune that model instead.
      - text: When your dataset is similar to that used by an existing pretrained model, and you want to fine-tune a new model using this pretrained model
        why: To fine-tune a model from a pretrained model, you should always use the same tokenizer.
      - text: When your dataset is different from the one used by an existing pretrained model, and you want to pretrain a new model
        correct: true
      - text: When your dataset is different from the one used by an existing pretrained model, but you want to fine-tune a new model using this pretrained model
        why: To fine-tune a model from a pretrained model, you should always use the same tokenizer.
    explanation: |
      Fine-tuning a pretrained model always uses the tokenizer that model was pretrained with [^1]. A new
      tokenizer is needed when you train a model from scratch on a corpus unlike the original one, such
      as another language or domain: a tokenizer trained on English, for instance, performs poorly on
      Japanese, where spaces and punctuation are used very differently [^1][^2]. If your data resemble
      the original corpus, it is cheaper to keep the pretrained model and its tokenizer and fine-tune
      [^3].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/1
        locator: Chapter 6.1 The 🤗 Tokenizers library, introduction
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/2
        locator: Chapter 6.2 Training a new tokenizer from an old one, introduction
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
        locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
    source:
      id: hf-llm-course
      ref: chapter6/10#q1
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-003
    type: single
    difficulty: easy
    question: What is normalization?
    options:
      - text: It's any cleanup the tokenizer performs on the texts in the initial stages.
        correct: true
      - text: It's a data augmentation technique that involves making the text more normal by removing rare words.
        why: No, normalization neither augments data nor removes rare words; it only cleans up the text (whitespace, case, accents).
      - text: It's the final post-processing step where the tokenizer adds the special tokens.
        why: That stage is simply called post-processing.
      - text: It's when the embeddings are made with mean 0 and standard deviation 1, by subtracting the mean and dividing by the std.
        why: That process is commonly called normalization when applied to pixel values in computer vision, but it's not what normalization means in NLP.
    explanation: |
      Normalization is the first step of the tokenization pipeline, before pre-tokenization: a general
      cleanup such as removing needless whitespace, lowercasing and/or removing accents, possibly with
      Unicode normalization such as NFC or NFKC [^1]. For example, the `bert-base-uncased` tokenizer
      lowercases the text and removes accents [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#normalization
        locator: Chapter 6.4 Normalization and pre-tokenization, introduction and sec. Normalization
        quote: The normalization step involves some general cleanup, such as removing needless whitespace, lowercasing, and/or removing accents.
    source:
      id: hf-llm-course
      ref: chapter6/10#q6
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-004
    type: single
    difficulty: medium
    question: What is pre-tokenization for a subword tokenizer?
    options:
      - text: It's the step before the tokenization, where data augmentation (like random masking) is applied.
        why: No, that step is part of the preprocessing.
      - text: It's the step before the tokenization, where the desired cleanup operations are applied to the text.
        why: No, that's the normalization step.
      - text: It's the step before the tokenizer model is applied, to split the input into words.
        correct: true
      - text: It's the step before the tokenizer model is applied, to split the input into tokens.
        why: No, splitting into tokens is the job of the tokenizer model.
    explanation: |
      Pre-tokenization comes after normalization and before the tokenizer model: a tokenizer cannot be
      trained on raw text alone, so the text is first split into small entities such as words, and these
      act as boundaries for the subwords the tokenizer learns [^1]. BERT's pre-tokenizer splits on
      whitespace and punctuation; GPT-2's does too but keeps the spaces as a `Ġ` symbol; T5's splits
      only on whitespace [^1]. Cleanup is the normalization step, and splitting words into subword tokens
      is the job of the tokenizer model itself [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#pre-tokenization
        locator: Chapter 6.4 Normalization and pre-tokenization, sec. Pre-tokenization
    source:
      id: hf-llm-course
      ref: chapter6/10#q7
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-005
    type: multiple
    difficulty: medium
    question: Select the sentences that apply to the BPE model of tokenization.
    options:
      - text: BPE is a subword tokenization algorithm that starts with a small vocabulary and learns merge rules.
        correct: true
      - text: BPE is a subword tokenization algorithm that starts with a big vocabulary and progressively removes tokens from it.
        why: No, that's the approach taken by a different tokenization algorithm.
      - text: BPE tokenizers learn merge rules by merging the pair of tokens that is the most frequent.
        correct: true
      - text: A BPE tokenizer learns a merge rule by merging the pair of tokens that maximizes a score that privileges frequent pairs with less frequent individual parts.
        why: No, that's the strategy applied by another tokenization algorithm.
      - text: BPE tokenizes words into subwords by splitting them into characters and then applying the merge rules.
        correct: true
      - text: BPE tokenizes words into subwords by finding the longest subword starting from the beginning that is in the vocabulary, then repeating the process for the rest of the text.
        why: No, that's another tokenization algorithm's way of doing things.
    explanation: |
      BPE starts from a small vocabulary, the symbols used to write the words of the corpus, and learns
      merge rules: at each step it merges the most frequent pair of tokens, until the vocabulary reaches
      the desired size [^1][^2]. To tokenize a new word, it splits the word into characters and applies
      the learned merges in order [^1][^2]. Starting from a big vocabulary and removing tokens is what
      Unigram does; scoring pairs so that pairs of rarer parts win, and encoding by the longest match
      from the start of the word, is WordPiece [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
        locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/5#training-algorithm
        locator: Chapter 6.5 Byte-Pair Encoding tokenization, secs. Training algorithm and Tokenization algorithm
    source:
      id: hf-llm-course
      ref: chapter6/10#q8
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-006
    type: multiple
    difficulty: hard
    question: Select the sentences that apply to the WordPiece model of tokenization.
    options:
      - text: WordPiece is a subword tokenization algorithm that starts with a small vocabulary and learns merge rules.
        correct: true
      - text: WordPiece is a subword tokenization algorithm that starts with a big vocabulary and progressively removes tokens from it.
        why: No, that's the approach taken by a different tokenization algorithm.
      - text: WordPiece tokenizers learn merge rules by merging the pair of tokens that is the most frequent.
        why: No, that's the strategy applied by another tokenization algorithm.
      - text: A WordPiece tokenizer learns a merge rule by merging the pair of tokens that maximizes a score that privileges frequent pairs with less frequent individual parts.
        correct: true
      - text: WordPiece tokenizes words into subwords by finding the most likely segmentation into tokens, according to the model.
        why: No, that's how another tokenization algorithm works.
      - text: WordPiece tokenizes words into subwords by finding the longest subword starting from the beginning that is in the vocabulary, then repeating the process for the rest of the text.
        correct: true
    explanation: |
      Like BPE, WordPiece starts from a small vocabulary (the special tokens and the initial alphabet)
      and learns merge rules [^2]. Instead of merging the most frequent pair, it merges the pair with
      the best score, $\text{score}(a, b) = \dfrac{\text{freq}(a, b)}{\text{freq}(a) \times \text{freq}(b)}$,
      which favours pairs whose individual parts are less frequent [^1][^2]. It keeps only the final
      vocabulary, and it encodes a word by repeatedly taking the longest subword from the start that is
      in the vocabulary [^1][^2]. Merging the most frequent pair is BPE; starting from a big vocabulary
      and choosing the most likely segmentation is Unigram [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
        locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/6#training-algorithm
        locator: Chapter 6.6 WordPiece tokenization, secs. Training algorithm and Tokenization algorithm
    source:
      id: hf-llm-course
      ref: chapter6/10#q9
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-007
    type: multiple
    difficulty: hard
    question: Select the sentences that apply to the Unigram model of tokenization.
    options:
      - text: Unigram is a subword tokenization algorithm that starts with a small vocabulary and learns merge rules.
        why: No, that's the approach taken by a different tokenization algorithm.
      - text: Unigram is a subword tokenization algorithm that starts with a big vocabulary and progressively removes tokens from it.
        correct: true
      - text: Unigram adapts its vocabulary by minimizing a loss computed over the whole corpus.
        correct: true
      - text: Unigram adapts its vocabulary by keeping the most frequent subwords.
        why: No, frequency alone does not decide which tokens stay; Unigram removes the tokens whose removal increases the corpus loss the least.
      - text: Unigram tokenizes words into subwords by finding the most likely segmentation into tokens, according to the model.
        correct: true
      - text: Unigram tokenizes words into subwords by splitting them into characters, then applying the merge rules.
        why: No, that's how another tokenization algorithm works.
    explanation: |
      Unigram works in the opposite direction to BPE and WordPiece: it starts from a big vocabulary and
      removes tokens until it reaches the desired size [^1][^2]. At each step it computes a loss over the
      whole corpus, the negative log-likelihood of the words under the unigram model, and removes the
      tokens whose removal increases that loss the least [^2]. To tokenize a word, it picks the most
      likely segmentation according to the token probabilities learned in training [^1][^2]. Learning
      merge rules, and splitting words into characters before applying merges, is what BPE does [^1].
    references:
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
        locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
      - source: hf-llm-course
        url: https://huggingface.co/learn/llm-course/chapter6/7#training-algorithm
        locator: Chapter 6.7 Unigram tokenization, secs. Training algorithm, Tokenization algorithm and Back to training
    source:
      id: hf-llm-course
      ref: chapter6/10#q10
      url: https://huggingface.co/learn/llm-course/chapter6/10
    status: draft
  - id: tokenization-008
    type: short_answer
    difficulty: easy
    tags:
      - vocabulary
      - min-freq
      - unk-token
    question: |
      A vocabulary class keeps every token that occurs at least `min_freq` times and always adds an
      unknown token:

      ```python
      counter = collections.Counter(tokens)
      self.idx_to_token = list(sorted(set(['<unk>'] + reserved_tokens + [
          token for token, freq in counter.items() if freq >= min_freq])))
      ```

      A word-level corpus has these counts: `the` 9, `time` 4, `machine` 3, `traveller` 3,
      `said` 2, `hour` 1, `glass` 1. How many entries does the vocabulary have with `min_freq=3` and
      no reserved tokens?
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: 4 words with count ≥ 3 (`the`, `time`, `machine`, `traveller`) plus `<unk>` = 5
    explanation: |
      Four words reach the threshold, and `<unk>` is always added, so the vocabulary has 5 entries;
      `said`, `hour` and `glass` will be mapped to `<unk>` [^1]. With `min_freq` of 0 or 1 all 7 words
      stay (8 entries). Raising `min_freq` can only shrink the vocabulary, and it shrinks fast,
      because word frequencies follow Zipf's law: most distinct words are rare [^2].
    references:
      - source: d2l
        locator: Sec. 9.2.3 Vocabulary
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#vocabulary
      - source: d2l
        locator: Sec. 9.2.5 Exploratory Language Statistics
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
      - source: d2l
        locator: Sec. 9.2.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/text-sequence#ex1
      url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exercises
    status: draft
  - id: tokenization-009
    type: single
    difficulty: easy
    tags:
      - vocabulary
      - min-freq
      - machine-translation
    question: |
      A translation dataset builds its source and target vocabularies from the first `max_examples`
      sentence pairs, keeping only the words that occur at least twice. What happens to the two
      vocabulary sizes as you raise `max_examples`?
    options:
      - text: 'Both grow or stay the same: new words appear and more rare words reach a count of 2'
        correct: true
      - text: Both shrink, because the counts are spread over more and more sentence pairs
        why: Counts only ever increase when more pairs are tokenized; no word drops out.
      - text: Only the source side grows; the target side is fixed by the size of its alphabet
        why: Both sides are tokenized into words, not characters [^1].
      - text: Neither changes, because the threshold of 2 already fixes the vocabulary size
        why: '`min_freq` is a count threshold, not a size limit; which words pass it depends on the data.'
    explanation: |
      Each side is tokenized into words and the vocabulary keeps words seen at least twice [^1][^2].
      Adding sentence pairs can only raise counts, so the set of words that pass the threshold can
      only grow. The growth slows down once the frequent words are in, but by Zipf's law the long tail
      of rare words keeps adding new entries [^3].
    references:
      - source: d2l
        locator: Sec. 10.5.2 Tokenization
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#tokenization
      - source: d2l
        locator: Sec. 10.5.3 Loading Sequences of Fixed Length
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#loading-sequences-of-fixed-length
      - source: d2l
        locator: Sec. 9.2.5 Exploratory Language Statistics
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
      - source: d2l
        locator: Sec. 10.5.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/machine-translation-and-dataset#ex1
      url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#exercises
    status: draft
  - id: tokenization-010
    type: single
    difficulty: easy
    tags:
      - word-tokenization
      - chinese
      - subword
    question: |
      Chinese and Japanese are written without spaces between words. Is splitting the text on
      whitespace a good word-level tokenizer for these languages?
    options:
      - text: 'No: a whole sentence would become one token; use a word segmenter or character or subword units'
        correct: true
      - text: 'Yes: in these languages every character is a word, so the split already gives words'
        why: Many words span several characters, and a whitespace split would not separate characters anyway.
      - text: Yes, as long as the text is lowercased and punctuation is set off by spaces first
        why: That preprocessing works for English because spaces already mark the words; here there are none.
      - text: No, because word-level tokenization only works for languages with a Latin alphabet
        why: Word-level tokenization works for any script in which word boundaries can be found.
    explanation: |
      The d2l translation pipeline lowercases the text, inserts spaces around punctuation and then
      splits on spaces, which relies on spaces marking word boundaries [^1]. Without them, words must
      first be found by a segmentation step, or the text can be tokenized into characters [^2] or into
      subword units learned from data, such as byte pair encoding [^3].
    references:
      - source: d2l
        locator: Sec. 10.5.1 Downloading and Preprocessing the Dataset; 10.5.2 Tokenization
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#tokenization
      - source: d2l
        locator: Sec. 9.2.2 Tokenization
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#tokenization
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
      - source: d2l
        locator: Sec. 10.5.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-modern/machine-translation-and-dataset#ex2
      url: https://d2l.ai/chapter_recurrent-modern/machine-translation-and-dataset.html#exercises
    status: draft
  - id: tokenization-011
    type: single
    difficulty: medium
    tags:
      - fasttext
      - subword
      - hashing
    question: |
      English has about $3 \times 10^8$ possible character 6-grams, and fastText represents every word
      by the sum of the vectors of its 3- to 6-grams. How does fastText keep its table of n-gram vectors
      bounded?
    options:
      - text: It hashes every n-gram into one of $2 \times 10^6$ buckets, so colliding n-grams share a vector
        correct: true
      - text: It keeps only the 3-grams, since there are few enough of those to store
        why: fastText uses all n-grams from 3 to 6 characters, plus the whole word [^1].
      - text: It stores vectors only for the n-grams seen at least 100 times in the corpus and drops all others
        why: fastText bounds memory by hashing, not by a frequency cutoff [^2].
      - text: It stores no n-gram vectors and computes them from character embeddings at run time
        why: The n-gram vectors $\mathbf{z}_g$ are learned parameters looked up in a table [^1].
    explanation: |
      With all 3- to 6-grams the subword vocabulary cannot be fixed in advance [^1]. To bound memory,
      Bojanowski et al. hash each n-gram (with FNV-1a) to an integer from 1 to $K$, with
      $K = 2 \times 10^6$ [^2]. Collisions make a few unrelated n-grams share a vector, but the table
      shrinks from about $3 \times 10^8$ to $2 \times 10^6$ rows, at 300 float32 dimensions from about
      360 GB to 2.4 GB.
    references:
      - source: d2l
        locator: Sec. 15.6.1 The fastText Model; 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#the-fasttext-model
      - title: Bojanowski, Grave, Joulin & Mikolov (2017), Enriching Word Vectors with Subword Information
        url: https://arxiv.org/abs/1607.04606
        locator: Sec. 3.2 Subword model (last paragraph)
      - source: d2l
        locator: Sec. 15.6.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-pretraining/subword-embedding#ex1
      url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    status: draft
  - id: tokenization-012
    type: short_answer
    difficulty: easy
    tags:
      - bpe
      - merges
      - vocabulary-size
    question: |
      A byte-level BPE tokenizer starts from the 256 possible byte values as its symbols and stops
      when the vocabulary holds 32,000 symbols. Each merge adds the merged pair as one new symbol and
      removes nothing. How many merges does it perform?
    answer:
      numeric: 31744
      tolerance: 0
      hint: a whole number
      model: $m - n = 32{,}000 - 256 = 31{,}744$
    explanation: |
      BPE repeatedly merges the most frequent pair of adjacent symbols into a new symbol, so each merge
      grows the vocabulary by exactly one: reaching $m$ symbols from $n$ takes $m - n$ merges [^1]. In
      d2l's example, 28 initial symbols (26 letters, `_` and `[UNK]`) plus 10 merges give 38 [^1].
      Unlike fastText's n-grams, the final vocabulary size is chosen in advance [^1].
    references:
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
      - source: d2l
        locator: Sec. 15.6.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-pretraining/subword-embedding#ex3
      url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    status: draft
  - id: tokenization-013
    type: single
    difficulty: medium
    tags:
      - bpe
      - phrases
      - merges
    question: |
      Byte pair encoding normally never merges symbols across word boundaries. How could you adapt it
      to extract multi-word phrases such as "new york"?
    options:
      - text: Use whole words as the starting symbols and let adjacent words merge, so frequent pairs become phrases
        correct: true
      - text: Run it on characters with many more merges, so that the learned subwords eventually grow into whole phrases
        why: Merges would still stop at word boundaries, so no symbol could ever span two words [^1].
      - text: Merge the *least* frequent adjacent pairs first, since phrases are rare in text
        why: What makes a phrase is that its words occur together often, so frequent pairs are the ones to merge.
      - text: Hash every pair of adjacent words into a fixed number of buckets, one per phrase
        why: Hashing bounds memory but does not decide which word pairs belong together.
    explanation: |
      BPE greedily merges the most frequent pair of consecutive symbols, and for efficiency it ignores
      pairs that cross word boundaries [^1]. Lifting that restriction and starting from words turns
      the same greedy procedure into a phrase extractor. Raw frequency alone would favor pairs like
      "of the", which is why word2vec's phrase detector divides by the words' own counts [^2].
    references:
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
      - title: Mikolov, Sutskever, Chen, Corrado & Dean (2013), Distributed Representations of Words and Phrases and their Compositionality
        url: https://arxiv.org/abs/1310.4546
        locator: Sec. 4 Learning Phrases
      - source: d2l
        locator: Sec. 15.6.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-pretraining/subword-embedding#ex4
      url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#exercises
    status: draft
