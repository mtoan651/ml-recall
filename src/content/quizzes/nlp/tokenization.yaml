  - id: tokenization-017
    type: single
    difficulty: medium
    tags:
      - bpe
      - merge-rules
      - segmentation
    question: |
      A BPE tokenizer learned these merges, in this order, from a corpus of "low", "lowest",
      "newer", "wider" and "new":

      1. `e r` → `er`
      2. `n e` → `ne`
      3. `ne w` → `new`
      4. `l o` → `lo`
      5. `lo w` → `low`
      6. `new er` → `newer`

      It tokenizes a new word by splitting it into characters and applying the merges in the order
      they were learned. How is the unseen word "lowered" tokenized?
    options:
      - text: '`low` `er` `e` `d`'
        correct: true
      - text: '`low` `e` `r` `e` `d`'
        why: Merge 1 joins the `e r` in "lower" into `er` before anything else [^1].
      - text: '`lo` `w` `er` `e` `d`'
        why: Merge 5 still applies after merge 4, turning `lo w` into `low` [^1].
      - text: '`low` `ere` `d`'
        why: No learned merge creates `ere`; only the six listed merges can be applied [^1].
    explanation: |
      BPE learns merges from the training corpus and applies them to new text in the order in which
      they were learned; this fixed order makes the tokenization deterministic [^1]. For
      l-o-w-e-r-e-d: merge 1 gives `l o w er e d`, merges 2, 3 and 6 do not apply, merges 4 and 5
      give `low er e d` [^1]. An unseen word is thus built from known subwords, as with "lower" =
      `low` + `er` [^1].
    references:
      - source: cortal-nlp
        locator: 'Tokenization and datasets slides, slides 15–20 (Tokenization: Byte-Pair Encoding; Applying BPE on an example; Sequence of merges)'
        url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/tokenization_and_datasets.pdf
    source:
      id: cortal-nlp
      ref: 1 - Tokenization and datasets/tokenization_and_datasets.pdf#bpe-apply-merges
      url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/tokenization_and_datasets.pdf
    status: reviewed
    reviewed_by: claude
  - id: tokenization-018
    type: short_answer
    difficulty: medium
    tags:
      - byte-level-bpe
      - merges
      - utf-8
    question: |
      A byte-level BPE tokenizer starts from the 256 byte values (ASCII: 116 = `t`, 104 = `h`,
      101 = `e`, 32 = space) and learned, among others, these merges:

      - `(101, 32)` → token 256
      - `(116, 104)` → token 259
      - `(259, 256)` → token 275

      How many bytes of text does token 275 stand for?
    answer:
      numeric: 4
      tolerance: 0
      hint: a whole number
      model: '259 = `th`, 256 = `e␣`, so 275 = `the␣`: 4 bytes'
    explanation: |
      Each merge replaces a pair of existing tokens by a new token id, starting at 256, and the
      vocabulary entry of the new token is the concatenation of the two byte strings [^1]. Token 256
      is "e" + space, token 259 is "th", so token 275 is "the " (with the trailing space), 4 bytes;
      merges of merges build ever longer frequent strings [^1]. The vocabulary size is 256 plus the
      number of merges [^1].
    references:
      - source: cortal-nlp
        locator: "Byte-pair encoding notebook (adapted from Karpathy's minbpe): training loop with vocab_size = 276, merges dict, decoding"
        url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/byte_pair_encoding_tokenization.ipynb
    source:
      id: cortal-nlp
      ref: 1 - Tokenization and datasets/byte_pair_encoding_tokenization.ipynb#token-275
      url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/byte_pair_encoding_tokenization.ipynb
    status: reviewed
    reviewed_by: claude
  - id: tokenization-019
    type: short_answer
    difficulty: easy
    tags:
      - byte-level-bpe
      - utf-8
      - unicode
    question: |
      Byte-level BPE first encodes the text as UTF-8 and starts from one token per byte. In UTF-8,
      ASCII letters take 1 byte and "é" takes 2 bytes. How many initial tokens does the word "café"
      produce, before any merge?
    answer:
      numeric: 5
      tolerance: 0
      hint: a whole number
      model: '`c a f` = 3 bytes, `é` = 2 bytes: 5 tokens'
    explanation: |
      Cortal's byte-pair encoding notebook (adapted from Karpathy's minbpe) converts text with
      `text.encode("utf-8")` into integers 0–255, so the initial tokens are bytes, not characters
      [^1]. ASCII characters need one byte each, but characters outside ASCII need two to four, so
      "café" has 4 characters but 5 byte tokens; the notebook's Korean-and-emoji example grows from 26
      code points to 39 bytes [^1]. Merges then shorten such sequences again.
    references:
      - source: cortal-nlp
        locator: Byte-pair encoding notebook, Unicode code points (ord) vs. UTF-8 bytes (encode)
        url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/byte_pair_encoding_tokenization.ipynb
    source:
      id: cortal-nlp
      ref: 1 - Tokenization and datasets/byte_pair_encoding_tokenization.ipynb#utf-8-bytes
      url: https://github.com/gustavecortal/natural-language-processing/blob/49945d346964022ea6003bf59a64e11966bbb863/1%20-%20Tokenization%20and%20datasets/byte_pair_encoding_tokenization.ipynb
