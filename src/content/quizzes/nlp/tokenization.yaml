  - id: tokenization-029
    type: single
    difficulty: medium
    tags:
      - tiktoken
      - special-tokens
      - llms-from-scratch
    question: |
      What happens when the last line runs?

      ```python
      import tiktoken

      tokenizer = tiktoken.get_encoding("gpt2")
      ids = tokenizer.encode("Hello <|endoftext|>")
      ```
    options:
      - text: It raises a `ValueError`
        correct: true
      - text: '`<|endoftext|>` is encoded as the single special id 50256'
        why: That needs `allowed_special={"<|endoftext|>"}`; by default no special token is allowed.
      - text: "`<|endoftext|>` is encoded as ordinary text pieces (`' <'`, `'|'`, `'end'`, …)"
        why: tiktoken does this only when you opt out of the check with `disallowed_special=()`.
      - text: The marker is silently dropped and only "Hello " is encoded
        why: tiktoken never drops input text; encoding is lossless.
    explanation: |
      By default `encode` uses `allowed_special=set()` and `disallowed_special="all"`, so any text
      that matches a special token raises `ValueError: Encountered text corresponding to disallowed
      special token '<|endoftext|>'` [^1]. This guards against user text injecting control tokens.
      You either allow the token explicitly, which the book does with
      `allowed_special={"<|endoftext|>"}` [^2], or pass `disallowed_special=()` to encode the
      characters as normal text [^1].
    references:
