  - id: tokenization-015
    type: single
    difficulty: medium
    tags:
      - sentencepiece
      - whitespace
      - detokenization
    question: |
      SentencePiece tokenizes "Hello world." as `[Hello] [▁wor] [ld] [.]`, writing the space before
      "world" as the symbol `▁` inside a token. What does keeping the whitespace as `▁` achieve?
    options:
      - text: The original text can be restored exactly
        correct: true
      - text: It stops words from being split into subwords
        why: Words are still split ("wor" + "ld"); `▁` only records where the spaces were [^1].
      - text: It removes spaces, which makes the vocabulary smaller
        why: The spaces are not removed but kept, as part of the tokens [^1].
      - text: It marks the end of every word for the decoder
        why: '`▁` stands for the space *before* a word piece; there is no end-of-word marker in this scheme [^1].'
    explanation: |
      Classic word-level BPE splits on whitespace first and marks word-internal splits (e.g.
      `Net@@ any@@ ahu`), so the exact spacing of the input is lost [^1]. SentencePiece treats the
      input as a raw character stream, escapes whitespace as `▁` and tokenizes it into an arbitrary
      subword sequence; detokenization is lossless, because concatenating the pieces and turning `▁`
      back into spaces reproduces the normalized text [^1][^2].
    references:
      - source: trusthlt-nlp
        locator: "Lecture 3 slides, frame 'SentencePiece: A variant of byte pair encoding'"
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
      - title: Kudo & Richardson (2018), SentencePiece — a simple and language independent subword tokenizer and detokenizer for neural text processing
        url: https://arxiv.org/abs/1808.06226
        locator: Sec. 3.1 Lossless Tokenization
    source:
      id: trusthlt-nlp
      ref: lectures/lecture03/nlpwdl2025-lecture03.tex#sentencepiece
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
    status: reviewed
    reviewed_by: claude
  - id: tokenization-016
    type: true_false
    difficulty: easy
    tags:
      - bpe
      - out-of-vocabulary
      - unk-token
    question: |
      A word-level vocabulary of the 3,000 most frequent words maps the unseen word "wampinuk" to
      `UNK`. True or false: a BPE tokenizer whose base vocabulary contains every character of the
      training corpus must also map "wampinuk" to a single `UNK` token.
    options:
      - text: 'True'
        why: BPE starts from single characters and only adds merged units, so any word over known characters can be written as a sequence of subwords [^1].
      - text: 'False'
        correct: true
    explanation: |
      A word-level vocabulary keeps only frequent words and replaces everything else by `UNK`,
      losing the word entirely [^1]. BPE starts from all characters and adds merged units, so an
      unseen word is split into known pieces, in the worst case single characters; over large
      multilingual corpora this prevents out-of-vocabulary tokens [^1]. Byte-level BPE goes further and starts
      from the 256 byte values, so no input can be unknown [^2].
    references:
      - source: trusthlt-nlp
        locator: "Lecture 3 slides, frames 'Out-of-vocabulary (UNK) tokens' and 'Subword units: Byte-pair encoding'"
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
      - source: d2l
        locator: Sec. 15.6.2 Byte Pair Encoding
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/subword-embedding.html#byte-pair-encoding
    source:
      id: trusthlt-nlp
      ref: lectures/lecture03/nlpwdl2025-lecture03.tex#unk-vs-bpe
      url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture03/pdf/nlpwdl2025-lecture03-handout.pdf
