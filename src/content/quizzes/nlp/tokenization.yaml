  - id: tokenization-030
    type: single
    difficulty: medium
    tags:
      - bpe
      - tiktoken
      - gpt-2
      - llms-from-scratch
    question: |
      What does the last line print?

      ```python
      import tiktoken

      tokenizer = tiktoken.get_encoding("gpt2")
      ids = tokenizer.encode("Hello world")
      print([tokenizer.decode([i]) for i in ids])
      ```
    options:
      - text: "`['Hello', ' world']`"
        correct: true
      - text: "`['Hello', ' ', 'world']`"
        why: GPT-2's pre-tokenizer attaches a single leading space to the word after it, so the space is not a token of its own here.
      - text: "`['Hello ', 'world']`"
        why: The space is glued to the *following* word, not to the end of the previous one.
      - text: "`['Hello', 'world']`"
        why: Byte-level BPE is lossless; the space must appear in some token, otherwise decoding could not restore the text.
    explanation: |
      GPT-2 splits text into words that keep their **leading** space (shown as `Ġ` in the byte-level
      vocabulary) before applying BPE [^1]. Both `Hello` and `Ġworld` are frequent enough to be
      single tokens, so the text becomes two ids, `[15496, 995]`, and decoding each id alone gives
      `'Hello'` and `' world'`. Keeping the spaces inside tokens is what lets `decode` reproduce the
      original string exactly [^1][^2].
    references:
      - source: hf-llm-course
        locator: Chapter 6.4, Pre-tokenization (GPT-2 example)
        url: https://huggingface.co/learn/llm-course/chapter6/4
