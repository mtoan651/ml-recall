      - regex
      - llms-from-scratch
    question: |
      What does the last line print?

      ```python
      import re

      text = "Hello, world. Is this-- a test?"
      result = re.split(r'([,.:;?_!"()\']|--|\s)', text)
      result = [item.strip() for item in result if item.strip()]
      print(len(result))
      ```
    answer:
      numeric: 10
      tolerance: 0
      hint: an integer
      model: "10: `['Hello', ',', 'world', '.', 'Is', 'this', '--', 'a', 'test', '?']`"
    explanation: |
      The whole pattern is a capturing group, so `re.split` returns the pieces *between* the
      delimiters and also the delimiters themselves [^1]: punctuation marks, the double dash `--` and
      single whitespace characters. The list comprehension then drops the empty strings and the
      whitespace-only items. What remains are 6 words (`Hello`, `world`, `Is`, `this`, `a`, `test`)
      and 4 punctuation tokens (`,`, `.`, `--`, `?`): 10 tokens. This simple word-level splitter is
      the first tokenizer the book builds before switching to BPE [^2]; splitting off punctuation
      and whitespace is the same idea as the pre-tokenization step of subword tokenizers [^3].
    references:
