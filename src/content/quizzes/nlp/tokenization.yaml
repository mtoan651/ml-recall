    question: |
      ```python
      import re

      text = "The cat sat. the cat ran!"
      tokens = re.split(r'([,.:;?_!"()\']|--|\s)', text)
      tokens = [t.strip() for t in tokens if t.strip()]
      vocab = {tok: i for i, tok in enumerate(sorted(set(tokens)))}
      print(len(vocab), vocab["the"])
      ```

      The last line prints {{1}} and {{2}}.
    answer:
      blanks:
        - numeric: 7
          hint: an integer
        - numeric: 6
          hint: an integer
      model: '`7 6`: the sorted vocabulary is `!`, `.`, `The`, `cat`, `ran`, `sat`, `the`.'
    explanation: |
      The text splits into 8 tokens, `The cat sat . the cat ran !`; `set` removes the repeated `cat`,
      leaving 7 distinct tokens. The vocabulary is built as in the book: sort the unique tokens and
      number them in that order [^1]. `sorted` compares strings by their Unicode code points [^2], so
      punctuation (`!` = 33, `.` = 46) comes first, then capitalised words (`T` = 84), then lowercase
      words. No lowercasing happens, so `The` (id 2) and `the` are different entries, and `the` is
      last, id 6.
