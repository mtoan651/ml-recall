schema_version: 1
domain: ml
topic: data-prep
title: Data & Features
questions:
  - id: data-prep-001
    type: single
    difficulty: easy
    question: 'A feature variable is:'
    options:
      - text: a quality of your data
      - text: a measurable property of your data
        correct: true
      - text: a row of your data
    explanation: |
      A feature is a measurable property of the data, usually a column such as date, size or color.
      The feature variable (written `X` in code) holds the inputs the model is trained on [^1]. In a
      data table each row is one example and each column is a potential feature or label, so a row
      is not a feature [^2]. "A quality of your data" is too vague: features can be numerical or
      categorical, but each one is an attribute recorded for every example [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#features-and-target
        locator: 'Lesson: Techniques of Machine Learning, Features and Target'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#types_of_data
        locator: 'Datasets: Data characteristics (introduction and Types of data)'
        quote: You can imagine each row of the table as an example and each column as a potential feature or label.
    source:
      id: ms-ml-for-beginners
      ref: quiz-7/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-002
    type: single
    difficulty: easy
    question: Which of these variables is a numeric variable?
    options:
      - text: Height
        correct: true
      - text: Gender
      - text: Hair Color
    explanation: |
      Height is measured on a numeric scale, so it is quantitative (numerical). The regression lesson
      uses predicting a person's height as its example of a numeric value [^1][^2], and statistics
      texts classify height as a continuous numerical variable [^3]. Gender and hair color sort
      people into groups, which makes them categorical (qualitative) variables. Adding or averaging
      their values has no meaning [^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
        locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Height varies continuously, so it is a continuous numerical variable.
    source:
      id: ms-ml-for-beginners
      ref: quiz-9/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-003
    type: single
    difficulty: easy
    question: Which of these variables is a categorical variable?
    options:
      - text: Heart Rate
      - text: Blood Type
        correct: true
      - text: Weight
    explanation: |
      Blood type (A, B, AB, O with Rh sign) puts each person into one of a fixed set of groups. A
      variable whose values are categories is categorical (qualitative), and arithmetic such as
      averaging makes no sense for it [^1][^2]. Heart rate and weight are measured as numbers that
      can be added and averaged, which makes them quantitative (numerical) [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Because the responses themselves are categories, state is called a categorical variable
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/categorical-data
        locator: Working with categorical data (introduction)
        quote: Categorical data has a specific set of possible values.
    source:
      id: ms-ml-for-beginners
      ref: quiz-9/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-004
    type: single
    difficulty: easy
    question: 'The process of identifying significant features from a set of features is called:'
    options:
      - text: Feature Extraction
      - text: Feature Dimensionality Reduction
      - text: Feature Selection
        correct: true
    explanation: |
      Feature selection keeps a subset of the original features, the ones that matter most, without
      changing them [^1][^2]. Feature extraction is different: it creates new features as functions
      of the original ones [^1]. Dimensionality reduction is the broader goal of working with fewer
      inputs. Both selection and extraction can serve that goal, so it is not the name for picking
      out the significant features [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#selecting-your-feature-variable
        locator: 'Lesson: Techniques of Machine Learning, Selecting your feature variable'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/feature_selection.html
        locator: Sec. 1.13 Feature selection
    source:
      id: ms-ml-for-beginners
      ref: quiz-10/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-005
    type: single
    difficulty: easy
    question: What's the best reason to balance your data?
    options:
      - text: Imbalanced data looks bad in charts and other visualizations
      - text: It yields better results because the model won't skew towards one class
        correct: true
      - text: Balancing your data always gives you more data points to train on
    explanation: |
      When one class dominates, a model sees many more examples of it and learns to predict it more
      often just because it is common. Balancing removes that skew so the minority classes are
      learned properly [^1][^2]. Balancing has nothing to do with how charts look. Its purpose is
      also not to gather more data: oversampling with SMOTE does add synthetic points, but only to
      equalize the classes [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
        locator: 'Lesson: Classification 1, Balance the dataset'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets#the_difficulty_of_training_severely_class-imbalanced_datasets
        locator: 'Datasets: Class-imbalanced datasets, The difficulty of training severely class-imbalanced datasets'
    source:
      id: ms-ml-for-beginners
      ref: quiz-20/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-006
    type: single
    difficulty: easy
    question: What is one example of a strategy for cleaning data?
    options:
      - text: removing columns/rows that aren't useful for answering a specific question
        correct: true
      - text: getting rid of verified values that don't fit your hypothesis
      - text: moving the outliers to a separate table and running the calculations for that table to see if they match
    explanation: |
      Dropping columns or rows that do not help answer the question at hand is a standard cleaning
      step. In the hotel-review lesson, columns such as `lat` and `lng` are dropped, and only the tags
      that help recommend a hotel are kept [^1]. Deleting verified values just because they
      contradict your hypothesis biases the analysis, and throwing away important examples hurts the
      model [^2]. Copying outliers into a separate table and rerunning the calculations is not a
      recognized cleaning strategy.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/5-Hotel-Reviews-2/README.md#exercise-a-bit-more-data-processing
        locator: 'Lesson: NLP 5, Exercise: a bit more data processing (and Filtering tags)'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#complete_vs_incomplete_examples
        locator: 'Datasets: Data characteristics, Complete vs. incomplete examples'
        quote: It's fine to delete useless or redundant examples, but it's bad to delete important examples.
    source:
      id: ms-ml-for-beginners
      ref: quiz-39/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-007
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - feature-scaling
    question: Why are input features normalized (rescaled) before training?
    options:
      - text: To create more training examples
        why: That is data augmentation.
      - text: To put the features on comparable scales
        correct: true
      - text: To split the data into training and test sets
        why: Splitting is a separate step.
      - text: To evaluate the model
        why: Evaluation uses metrics on held-out data.
    explanation: Standardizing each feature as $(x - \mu)/\sigma$, with $\mu$ and $\sigma$ estimated on the training data only, stops large-range features from dominating and makes optimization better behaved [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 61
      - source: d2l
        locator: Sec. 5.7 Predicting House Prices on Kaggle
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q03
    status: reviewed
  - id: data-prep-008
    type: single
    difficulty: easy
    question: Which of the following is an example of non-structured data?
    options:
      - text: List of students in class
      - text: Collection of student essays
        correct: true
      - text: Graph of friends of social network users
    explanation: |
      Essays are free text with no fixed rows and columns, which makes them unstructured data, like
      the text files and document shares in the lessons' examples [^1][^2]. A class list is
      structured: a table where every row has the same columns [^2]. A friendship graph sits in
      between, and the lesson lists social-network graphs as semi-structured data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#types-of-data
        locator: 'Lesson: Defining Data Science, Types of Data and Where to get Data'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#unstructured-data
        locator: 'Lesson: Defining Data, Structured Data and Unstructured Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-009
    type: single
    difficulty: easy
    question: Which of these could be quantitative data?
    options:
      - text: Photos of dogs
      - text: Hotel reviews
      - text: Student’s marks or grades
        correct: true
    explanation: |
      Quantitative data are numerical observations that can be measured and used in calculations, so
      numeric marks can be added, averaged and compared [^1][^2]. Photos and hotel reviews are images
      and free text. They describe qualities rather than measure amounts, so they count as
      qualitative data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data and Qualitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: it is sensible to add, subtract, or take averages with those values
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-010
    type: single
    difficulty: easy
    question: Which of these could be qualitative data?
    options:
      - text: List of employees' salaries
      - text: Hotel reviews
        correct: true
      - text: Students' exam scores out of 100
    explanation: |
      Qualitative data record qualities that cannot be measured objectively, and written comments
      such as hotel reviews are a typical example [^1]. Salaries and exam scores are numbers that
      you can sensibly add or average, so they are quantitative (numerical) [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#qualitative-data
        locator: 'Lesson: Defining Data, Qualitative Data and Quantitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-011
    type: single
    difficulty: easy
    question: A teacher is reviewing the number of correct answers each student got. What type of data is that?
    options:
      - text: Qualitative data
      - text: Quantitative data
        correct: true
      - text: Both qualitative and quantitative data
    explanation: |
      The number of correct answers is a count. Counts are numerical variables, more precisely
      discrete ones, because they take whole-number values on which arithmetic makes sense [^1].
      Numerical observations like these are what the lesson calls quantitative data [^2]. That rules
      out qualitative data, and "both" fails because this variable is not qualitative at all.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Because the number of siblings is a count, it is discrete.
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-012
    type: single
    difficulty: easy
    question: Which one of these is part of the data preparation process?
    options:
      - text: Model validation
      - text: Classification
      - text: Cleaning
        correct: true
    explanation: |
      Data preparation turns raw, "dirty" data into something usable, and cleaning (handling missing,
      inaccurate or duplicated values) is its core step [^1]. Classification and model validation come
      later. They belong to building and evaluating a model once the data are ready [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson: Data Preparation, introduction and Common cleaning goals and strategies'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#building-a-model
        locator: 'Lesson: Techniques of Machine Learning, Building a model / Evaluate the model'
    source:
      id: ms-ds-for-beginners
      ref: quiz-14/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-013
    type: true_false
    difficulty: easy
    question: Merging or joining two datasets into one can affect consistency in data
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      Datasets from different sources often follow different conventions, such as date formats,
      number formats or whitespace. Joining them can therefore produce inconsistent values unless each
      one is standardized first, and the lesson gives consistency as a reason to clean data for exactly
      this case [^1]. Joins can also bring in duplicate records, which is another cleaning problem [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#the-importance-of-cleaning-data
        locator: 'Lesson: Data Preparation, The importance of cleaning data (Consistency) and Common cleaning goals and strategies (Formatting, Duplications)'
    source:
      id: ms-ds-for-beginners
      ref: quiz-15/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-014
    type: single
    difficulty: easy
    question: What's the first thing that should be done when faced with missing data?
    options:
      - text: Delete it
      - text: Assess why it's missing
        correct: true
      - text: Try to fill in empty values
    explanation: |
      Data go missing for many reasons, and the right fix (reloading, filling in values, or removing
      rows) depends on how and why the values went missing [^1]. Deleting or imputing right away can
      bias the results or throw away important examples, so first find out why the data are missing
      [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson: Data Preparation, Common cleaning goals and strategies (Missing Data)'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#complete_vs_incomplete_examples
        locator: 'Datasets: Data characteristics, Complete vs. incomplete examples'
    source:
      id: ms-ds-for-beginners
      ref: quiz-15/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-015
    type: true_false
    question: 'A machine learning model can train *directly* on raw string values, like "Red" and "Black", without converting these values to numerical vectors.'
    options:
      - text: 'True'
        why: During training, a model can only manipulate floating-point numbers. The string `"Red"` is not a floating-point number. You must convert strings like `"Red"` to floating-point numbers.
      - text: 'False'
        correct: true
    explanation: A machine learning model can only train on features with floating-point values, so you'll need to convert those strings to floating-point values before training. [^1]
    references:
      - source: google-mlcc
        locator: 'Categorical data: Vocabulary and one-hot encoding'
        url: https://developers.google.com/machine-learning/crash-course/categorical-data/one-hot-encoding
    source:
      id: google-mlcc
      ref: categorical-data/one-hot-encoding#q1
      url: https://developers.google.com/machine-learning/crash-course/categorical-data/one-hot-encoding
    status: draft
  - id: data-prep-016
    type: single
    question: Which technique would be most suitable for normalizing a feature with the distribution shown below?
    figure:
      src: ./data-prep/data-prep-016.svg
      alt: Histogram of a feature whose values range from 0 to about 200,000, rising gradually to a peak around 100,000 and falling off gradually on the other side.
    options:
      - text: Z-score scaling
        correct: true
      - text: Linear scaling
        why: Linear scaling suits features spread roughly uniformly between stable bounds, such as age [^1]. This feature is bell-shaped.
      - text: Log scaling
        why: Log scaling suits power-law or heavily skewed features, such as book sales [^1]. This histogram is roughly symmetric.
      - text: Clipping
        why: Clipping caps extreme outliers [^1]. This feature has no extreme outliers, just a bell-shaped spread.
    explanation: |
      The histogram rises to a single peak near the middle and falls off about evenly on both
      sides, so the feature roughly follows a normal distribution. Z-score scaling,
      $(x - \mu)/\sigma$, is the technique for such features [^1]. It does not cap anything, but
      in a normal distribution about 99.7% of the values lie within three standard deviations of
      the mean, so after scaling almost all of them fall between $-3$ and $+3$ [^1].
    references:
      - source: google-mlcc
        locator: 'Numerical data: Normalization'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    source:
      id: google-mlcc
      ref: numerical-data/normalization#q1
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    status: draft
  - id: data-prep-017
    type: single
    question: |
      Suppose you are developing a model that predicts a data center's productivity based on the temperature measured inside the data center. Almost all of the `temperature` values in your dataset fall between 15 and 30 (Celsius), with the following exceptions:

      * Once or twice per year, on extremely hot days, a few values between
      31 and 45 are recorded in `temperature`.
      * Every 1,000th point in `temperature` is set to 1,000
      rather than the actual temperature.

      Which would be a reasonable normalization technique for `temperature`?
    options:
      - text: Clip the outlier values between 31 and 45, but delete the outliers with a value of 1,000
        correct: true
      - text: Clip all the outliers
      - text: Delete all the outliers
      - text: Delete the outlier values between 31 and 45, but clip the outliers with a value of 1,000.
    explanation: |
      The values of 1,000 are mistakes, and should be deleted rather than clipped.

      The values between 31 and 45 are legitimate data points. Clipping would probably be a good idea for these values, assuming the dataset doesn't contain enough examples in this temperature range to train the model to make good predictions. However, during inference, note that the clipped model would therefore make the same prediction for a temperature of 45 as for a temperature of 35. [^1]
    references:
      - source: google-mlcc
        locator: 'Numerical data: Normalization'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    source:
      id: google-mlcc
      ref: numerical-data/normalization#q2
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    status: draft
  - id: data-prep-018
    type: single
    question: The plot below shows the median home price for each 0.2 degrees of latitude in the mythical country of Freedonia. The relationship is nonlinear, so representing latitude as a single floating-point feature is unlikely to help a model make good predictions. Perhaps bucketing latitudes would be a better idea? What would be the best bucketing strategy?
    figure:
      src: ./data-prep/data-prep-018.svg
      alt: Scatter plot of median house value (about 330 to 710) against latitude from 41.0 to 44.8 in steps of 0.2. Values are low around 41, jump to about 700 near 42.2–42.4, drop to about 410 around 43, rise again to about 710 at 44.0 and end between 510 and 570.
    options:
      - text: Don't bucket.
        correct: true
      - text: |
          Create four buckets:

          * 41.0 to 41.8
          * 42.0 to 42.6
          * 42.8 to 43.4
          * 43.6 to 44.8
        why: It would be hard for a model to find a single predictive weight for all the homes in the second bin or the fourth bin, which contain few examples.
      - text: Make each data point its own bucket.
        why: This would only be helpful if the training set contains enough examples for each 0.2 degrees of latitude. In general, homes tend to cluster near cities and be relatively scarce in other places.
    explanation: Given the randomness of most of the plot, this is probably the best strategy. [^1]
    references:
      - source: google-mlcc
        locator: 'Numerical data: Binning'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/binning
    source:
      id: google-mlcc
      ref: numerical-data/binning#q1
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/binning
    status: draft
  - id: clustering-012
    type: single
    question: Assume you have enough data to create quantiles. How should you process the data distribution shown below?
    figure:
      src: ./data-prep/clustering-012.svg
      alt: Histogram that rises sharply to a peak at small values (around 3 to 4) and then falls off in a long tail to the right, reaching past 25.
    options:
      - text: Create quantiles.
        correct: true
      - text: Normalize.
        why: |
          You typically normalize data if:

          * The data distribution is Gaussian.
          * You have some insight into what the data represents in the real world that suggests the data shouldn't be transformed nonlinearly.

          Neither case applies here. The data distribution isn't Gaussian because it isn't symmetric. And you don't know what these values represent in the real world.
      - text: Log transform.
        why: This isn't a perfect power-law distribution, so don't use a log transform.
    explanation: Because the distribution does not match a standard data distribution, you should default to creating quantiles. [^1]
    references:
      - source: google-ml-courses
        locator: Data preparation
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
      ref: clustering/prepare-data#q1
      url: https://developers.google.com/machine-learning/clustering/prepare-data
    status: draft
  - id: clustering-013
    type: single
    question: Assume you have enough data to create quantiles. How would you process the data distribution shown below?
    figure:
      src: ./data-prep/clustering-013.svg
      alt: Histogram of a symmetric, bell-shaped distribution centred at 0, spanning about −15 to 15.
    options:
      - text: Normalize.
        correct: true
      - text: Create quantiles.
        why: Incorrect. Since this is a Gaussian distribution, the preferred transform is normalization.
      - text: Log transform.
        why: Incorrect. Only apply a log transform to power-law distributions.
    explanation: |
      The histogram is symmetric and bell-shaped, so the data are roughly Gaussian. For data shaped
      like a Gaussian, the recommended transform is normalization: compute z-scores [^1]. Quantiles
      are the default when the data do not match any known distribution, and a log transform is
      meant for data that follow a power law [^1].
    references:
      - source: google-ml-courses
        locator: Data preparation
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
      ref: clustering/prepare-data#q2
      url: https://developers.google.com/machine-learning/clustering/prepare-data
    status: draft
  - id: data-prep-019
    type: single
    difficulty: easy
    question: Why does the name *Data Science* contain the word *science*?
    options:
      - text: Because it uses scientific methods to analyze data
        correct: true
      - text: Because it only studies data produced by laboratory experiments
      - text: Because it is the branch of computer science that stores data
    explanation: |
      Data science is defined as a field that uses scientific methods, such as probability and
      statistics, to extract knowledge and insights from structured and unstructured data [^1].
      It is not limited to experimental data: it works across application domains such as
      finance, medicine or marketing, with data from surveys, sensors, texts or images [^1].
      Storing data is the concern of a related field, databases; data science is about drawing
      knowledge from the data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-is-data-science
        locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and Other Related Fields'
    source:
      id: ms-ds-for-beginners
      ref: quiz-0/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-020
    type: single
    difficulty: easy
    question: |
      Data science overlaps with several related fields. Which one deals with storing and
      processing very large quantities of data, usually with a simple structure, in a
      distributed way on a cluster of computers?
    options:
      - text: Big data
        correct: true
      - text: Machine learning
      - text: Artificial intelligence
      - text: Visualization
    explanation: |
      The lesson lists databases, big data, machine learning, artificial intelligence and
      visualization as fields related to data science [^1]. Big data is the one about storing and
      processing very large quantities of relatively simply structured data, distributed over a
      computer cluster; data lakes are a typical storage for it [^1]. Machine learning builds
      predictive models from data, AI builds high-complexity models that often turn unstructured
      data into structured insights, and visualization makes large data understandable to people,
      so none of them is defined by distributed storage [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#other-related-fields
        locator: 'Lesson 1: Defining Data Science, sec. Other Related Fields and What you can do with Data (Data Storage)'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-021
    type: single
    difficulty: easy
    question: What is the main goal of data science?
    options:
      - text: to collect as much data as possible
      - text: to convert data into a clean, structured form
      - text: to make decisions based on data
        correct: true
    explanation: |
      The lesson states that the ultimate goal of data science is to be able to make decisions
      based on data: it extracts knowledge from data and turns it into actionable insights that
      can be applied to real situations [^1]. Collecting data and processing it into a usable form
      are steps of the data journey (acquisition, storage, processing) that serve this goal, not
      the goal itself [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-you-can-do-with-data
        locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and What you can do with Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-022
    type: single
    difficulty: easy
    question: |
      Why do data scientists first classify a dataset's data, for example as quantitative or
      qualitative, and as structured, semi-structured or unstructured?
    options:
      - text: To compress it so that it takes less storage space
      - text: To give every column a proper name
      - text: To know how best to organize and analyze it
        correct: true
    explanation: |
      Raw data has to be organized into a form that people and tools can analyze, and its
      structure (structured, semi-structured or unstructured) describes how it is organized [^1].
      The type also tells you which operations make sense: quantitative data can be measured and
      used mathematically, while qualitative data is not, even when it consists of digits such as
      phone numbers [^1]. Classifying data neither compresses nor renames it; it guides how you
      organize and analyze it.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#how-data-is-described
        locator: 'Lesson 3: Defining Data, sec. How Data is Described'
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-023
    type: single
    difficulty: easy
    question: A company is collecting surveys from their customers to improve their products. What type of data source is this?
    options:
      - text: Primary
        correct: true
      - text: Secondary
      - text: Tertiary
    explanation: |
      Data generated by its own users, collected first-hand for the purpose at hand, is primary
      data; secondary data comes from a source that collected it for general use [^1]. The company
      designs and runs the survey itself, so the answers are primary data; they would be secondary
      data for another organization that later reused them [^1]. "Tertiary" is not one of the
      kinds of data source in this classification.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
        locator: 'Lesson 3: Defining Data, sec. Sources of Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-024
    type: single
    difficulty: easy
    question: |
      A student explores a data source by sending it SQL queries such as
      `SELECT name FROM students WHERE age > 20`. What kind of data source is it?
    options:
      - text: Local Files
      - text: API
      - text: Database
        correct: true
    explanation: |
      Databases are hosted by a database management system, and users explore them with commands
      called queries [^1]; SQL is the standard language for retrieving and modifying data in a
      relational database [^2]. Local files such as spreadsheets or images are opened directly, and
      an API shares data over the internet through requests defined by its provider rather than
      SQL statements [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
        locator: 'Lesson 3: Defining Data, sec. Sources of Data'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#retrieving-the-data
        locator: 'Lesson 5: Relational Databases, sec. Retrieving the data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: data-prep-025
    type: single
    difficulty: easy
    question: 'A relational database usually consists of:'
    options:
      - text: one table that holds all the data
      - text: one spreadsheet with several tabs
      - text: many tables linked to each other by keys
        correct: true
    explanation: |
      A relational database is built on tables of rows and columns, like a spreadsheet, but it
      spreads the information across multiple tables [^1]. The tables are linked through keys:
      each row has a primary key, and other tables refer to it with a foreign key, so the data can
      be joined back together for analysis [^1]. Keeping everything in one table repeats the same
      data on many rows, which is what splitting it into related tables avoids [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, introduction and sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-8/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-026
    type: single
    difficulty: easy
    question: |
      In a relational database, how do you avoid repeating the same information, such as a
      city's name and country, on many rows?
    options:
      - text: Split the data into tables that refer to each other through keys
        correct: true
      - text: Add a new column for every year instead of a new row
      - text: Keep all the data in one big table
      - text: Copy the data into several unrelated tables
    explanation: |
      Storing yearly rainfall for each city in one table repeats the city's name and country on
      every row, which wastes storage [^1]. Adding a column for each year avoids that repetition,
      but the table's structure must change every new year and calculations become harder [^1].
      The relational solution keeps the cities in their own table with an ID (the primary key) and
      stores the rainfall in a second table that refers to that ID (a foreign key), so each fact is
      stored once [^1]. Copying data into unrelated tables would still duplicate it.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-shortcomings-of-a-single-table-approach
        locator: 'Lesson 5: Relational Databases, sec. The shortcomings of a single table approach and The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-8/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-027
    type: single
    difficulty: easy
    question: 'In a relational database, a primary key is:'
    options:
      - text: a value used to identify one specific row in a table
        correct: true
      - text: a column whose values point to rows of another table
      - text: a value that sets the order in which the rows are stored
    explanation: |
      A primary key is a value used to identify one specific row in a table, usually an
      auto-generated number that never changes [^1]. A column whose values point to rows of
      another table is a foreign key, the primary key of another table used as a reference [^1].
      The primary key identifies rows; it does not define the order in which they are stored.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-9/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-028
    type: true_false
    difficulty: easy
    question: |
      An auto-generated numeric ID column is usually a better primary key than a descriptive
      value such as a city's name.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      A primary key could be based on a value itself, such as the city name, but it should almost
      always be a number or other identifier, and in most cases it is an auto-generated number [^1].
      The key must never change, because other tables refer to it and a change would break those
      relationships; names can change or be spelled differently, an auto-generated ID does not [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-9/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-029
    type: single
    difficulty: easy
    question: In a relational database, what is a foreign key?
    options:
      - text: A column whose values are the IDs (primary keys) of rows in another table
        correct: true
      - text: A column that copies text, such as names, from another table
      - text: A column that keeps the history of values that change over time
      - text: The column that identifies each row of its own table
    explanation: |
      In the rainfall example, the `city_id` column of the rainfall table holds values that
      reference the IDs in the cities table; such a column is a foreign key, the primary key of
      another table used as a pointer [^1]. It stores IDs instead of copying names, which is how
      the design avoids duplication, and it says nothing about history over time [^1]. The column
      that identifies each row of its own table is that table's primary key [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-9/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-030
    type: true_false
    difficulty: medium
    question: |
      A spreadsheet stores data in rows and columns, yet it counts as non-relational data
      rather than as a relational database.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      The non-relational-data lesson starts with spreadsheets: a spreadsheet is a file (a workbook)
      made of worksheets and cells, worked on with formulas and functions [^1]. A relational
      database, by contrast, spreads the data across several tables that are linked through primary
      and foreign keys and queried with SQL [^2]. Having rows and columns is not enough to be
      relational; a spreadsheet does not define such links between tables.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#spreadsheets
        locator: 'Lesson 6: Non-Relational Data, introduction and sec. Spreadsheets'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-10/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-031
    type: single
    difficulty: medium
    question: Which statement about relational and non-relational data is correct?
    options:
      - text: Relational databases always organize data into tables of rows and columns
        correct: true
      - text: Non-relational data stores never use columns
      - text: Non-relational databases can never be queried with SQL
    explanation: |
      A relational database is built on tables of columns and rows, spread across several related
      tables [^1]. Non-relational stores vary: a columnar store also organizes data into columns and
      rows, grouped into column families, so they do use columns [^2]. And the document database
      Cosmos DB is queried with SQL, which is why NoSQL is often read as "not only SQL" [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#it-all-starts-with-tables
        locator: 'Lesson 5: Relational Databases, sec. It all starts with tables'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
        locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
    source:
      id: ms-ds-for-beginners
      ref: quiz-10/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-032
    type: single
    difficulty: easy
    question: What does the term *NoSQL* refer to?
    options:
      - text: Non-relational data stores, often read as "not only SQL"
        correct: true
      - text: A newer version of the SQL query language
      - text: A relational database without primary keys
      - text: A database that forbids any query language
    explanation: |
      NoSQL is an umbrella term for the different ways of storing non-relational data, read as
      "non-SQL", "non-relational" or "not only SQL" [^1]. It covers key-value, graph, columnar and
      document stores, which favor flexible schemas and horizontal scale over relational tables
      [^1][^2]. Some of them can still be queried with SQL, as Cosmos DB's document database is,
      which is why "not only SQL" fits; NoSQL is neither a new version of SQL nor a relational
      database [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
        locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
      - title: 'Azure Architecture Center: Understand data models'
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
        locator: sec. Nonrelational data stores
    source:
      id: ms-ds-for-beginners
      ref: quiz-10/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-033
    type: single
    difficulty: easy
    question: |
      Which type of NoSQL database stores data as nodes (entities such as people or places) and
      edges (the relationships between them)?
    options:
      - text: Graph
        correct: true
      - text: Key-value
      - text: Columnar (column-family)
      - text: Document
    explanation: |
      A graph database represents data as a collection of nodes, the entities, and edges, the
      relationships between two entities; both can carry properties [^1][^2]. A key-value store pairs
      a unique key with a value, a document store holds JSON-like documents of fields and values,
      and a columnar store groups columns into column families; none of them models relationships
      as edges [^1][^2]. Graph stores suit relationship-heavy data such as social networks [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
        locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
      - title: 'Azure Architecture Center: Understand data models'
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
        locator: sec. Graph data stores, Key-value data stores, Document data stores
    source:
      id: ms-ds-for-beginners
      ref: quiz-11/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-034
    type: single
    difficulty: easy
    question: Documents in a document database, such as Azure Cosmos DB or MongoDB, are most similar to which data format?
    options:
      - text: Rows of a CSV file
      - text: Tables linked by foreign keys
      - text: JSON objects
        correct: true
    explanation: |
      A document is a collection of fields and values, and documents look like JavaScript Object
      Notation (JSON); APIs that return JSON can often be stored in a document database directly
      [^1]. Document stores keep semi-structured documents, often in JSON, whose values can be
      nested lists or child collections [^2]. CSV rows are flat, and tables linked by foreign keys
      are the relational model [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#json-and-documents
        locator: 'Lesson 6: Non-Relational Data, sec. JSON and Documents'
      - title: 'Azure Architecture Center: Understand data models'
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
        locator: sec. Document data stores and Relational data stores
    source:
      id: ms-ds-for-beginners
      ref: quiz-11/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-035
    type: single
    difficulty: easy
    question: |
      You want to hold a table of students with their name (text), group number and average
      grade, and select, filter and group its rows by column. Which Python library fits best?
    options:
      - text: NumPy
      - text: SciPy
      - text: Pandas
        correct: true
    explanation: |
      Pandas works with DataFrames, which are like relational tables: named columns that can
      hold different types, with operations on rows, columns and groups [^1][^2]. A NumPy array
      holds values of one underlying type and has no column names, so it suits a matrix of
      numbers, or a plain list of grades, rather than a mixed table [^1]. SciPy adds scientific
      functions such as statistical tests; it is not a library for tables [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#tabular-data-and-dataframes
        locator: 'Lesson 7: Python and the Pandas Library, sec. Tabular Data and Dataframes'
      - title: 'pandas documentation: Intro to data structures'
        url: https://pandas.pydata.org/docs/user_guide/dsintro.html#dataframe
        locator: sec. DataFrame
    source:
      id: ms-ds-for-beginners
      ref: quiz-13/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-036
    type: single
    difficulty: easy
    question: You have a DataFrame with a list of students, their group number, and average grade. Which operation would you use to compute the average grade per group?
    options:
      - text: '`mean`'
      - text: '`groupby`'
        correct: true
      - text: '`iloc`'
      - text: '`head`'
    explanation: |
      Grouping splits the rows by the values of a column, applies a function such as `mean` to each
      group and combines the results, as in `df.groupby('group')['grade'].mean()` [^1][^2]. Calling
      `mean` alone averages a whole column over all students, `iloc` selects rows by position and
      `head` prints the first rows, so none of them gives one average per group [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#dataframe
        locator: 'Lesson 7: Python and the Pandas Library, sec. DataFrame (grouping)'
      - title: 'pandas documentation: Group by: split-apply-combine'
        url: https://pandas.pydata.org/docs/user_guide/groupby.html
        locator: introduction and sec. Aggregation
    source:
      id: ms-ds-for-beginners
      ref: quiz-13/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-037
    type: single
    difficulty: easy
    question: Why is data preparation so important?
    options:
      - text: It makes models more accurate
        correct: true
      - text: It increases the number of rows available for training
      - text: It removes the need to explore the data first
    explanation: |
      Cleaning matters for ease of use and reuse, for consistency when datasets from different
      sources are merged, and for model accuracy, since cleaned data improves the accuracy of the
      models that rely on it [^1]. It does not add rows: removing duplicates or rows with missing
      values usually leaves fewer [^1]. And it does not replace exploration; exploring the dataset
      is how you discover what needs cleaning in the first place [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#the-importance-of-cleaning-data
        locator: 'Lesson 8: Data Preparation, sec. The importance of cleaning data and Common cleaning goals and strategies'
    source:
      id: ms-ds-for-beginners
      ref: quiz-14/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-038
    type: multiple
    difficulty: easy
    question: Which of these are goals of data cleaning? Select all that apply.
    options:
      - text: Fixing formatting problems such as stray whitespace or mixed date formats
        correct: true
      - text: Fixing columns stored with the wrong data type
        correct: true
      - text: Removing duplicate records
        correct: true
      - text: Removing correct values that contradict your hypothesis
    explanation: |
      Common cleaning goals are fixing formatting problems (whitespace, dates and data types),
      removing duplicates, which often appear after joining datasets, and handling missing data
      [^1]. Deleting correct values because they do not fit the hypothesis is not cleaning but
      manipulating the result; the ethics lesson calls selective reporting of this kind data
      misrepresentation [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson 8: Data Preparation, sec. Common cleaning goals and strategies'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#29-misrepresentation
        locator: 'Lesson 2: Introduction to Data Ethics, sec. 2.9 Misrepresentation'
    source:
      id: ms-ds-for-beginners
      ref: quiz-14/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-039
    type: multiple
    difficulty: easy
    question: Joining two datasets from different sources can introduce which problems? Select all that apply.
    options:
      - text: Duplicate records
        correct: true
      - text: Inconsistent formats, such as dates written differently in each source
        correct: true
      - text: Fewer columns than either dataset had on its own
    explanation: |
      Duplicates are common when two or more datasets are joined, and datasets from different
      sources follow different conventions for dates, numbers or whitespace, so each one must be
      standardized to stay consistent after the merge [^1]. A join brings the columns of both tables
      together, for example a city from one table with its rainfall from the other, so the result
      does not have fewer columns than its inputs [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson 8: Data Preparation, sec. The importance of cleaning data (Consistency) and Common cleaning goals and strategies (Duplications)'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#joining-data
        locator: 'Lesson 5: Relational Databases, sec. Joining data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-15/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: draft
  - id: data-prep-040
    type: single
    difficulty: easy
    question: What is the first step of the data science lifecycle?
    options:
      - text: 'Analysis: exploring the data and checking the model'
      - text: 'Processing: finding patterns and building models'
      - text: 'Capturing: defining the problem and acquiring the data'
        correct: true
    explanation: |
      The lifecycle has five stages: capturing, processing, analysis, communication and maintenance
      [^1]. Capturing comes first because every later stage depends on it; it combines defining the
      purpose and the problem with the stakeholders and identifying, collecting and exploring the
      data needed [^1]. Processing (finding patterns and modeling) and analysis (exploratory data
      analysis and checking the model) can only start once there is a defined problem and data to
      work with [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#capturing
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, introduction and sec. Capturing'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
        locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
    source:
      id: ms-ds-for-beginners
      ref: quiz-26/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-041
    type: true_false
    difficulty: easy
    question: Once the next step of the data science lifecycle is reached, you can't go back to previous steps
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      The lifecycle is a cycle, not a one-way pipeline: maintenance runs throughout the project, and
      what you discover in the data can lead you to change or redefine the goals set during
      capturing [^1]. The first lesson also notes that some steps may be skipped and others, such
      as data processing, repeated several times [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#maintaining
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Capturing and Maintaining'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-you-can-do-with-data
        locator: 'Lesson 1: Defining Data Science, sec. What you can do with Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-26/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-042
    type: multiple
    difficulty: easy
    question: Which of these belong to the maintenance stage of the data science lifecycle? Select all that apply.
    options:
      - text: Choosing how and where to store the data, such as hot or cold storage
        correct: true
      - text: Cleaning newly arriving data so that its quality stays consistent
        correct: true
      - text: Keeping the data secure, for example with encryption and limited access
        correct: true
      - text: Presenting the findings to stakeholders
    explanation: |
      Maintenance is the ongoing work of managing, storing and securing the data throughout the
      project [^1]. It covers storage decisions (on or off premise, hot or cold data), applying the
      same cleaning to new data so its quality stays consistent, and security measures such as
      encryption and removing access for people who left the project [^1]. Presenting findings
      belongs to the communication stage [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#maintaining
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Maintaining'
    source:
      id: ms-ds-for-beginners
      ref: quiz-26/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-043
    type: single
    difficulty: easy
    question: |
      The data science lifecycle has five stages: capturing, processing, analysis,
      communication and maintenance. In which stage is a model most likely to be built?
    options:
      - text: Processing
        correct: true
      - text: Maintenance
      - text: Capturing
    explanation: |
      The processing stage focuses on discovering patterns in the data and on modeling; it is where
      data science meets machine learning, with techniques such as classification, clustering and
      regression [^1]. Capturing defines the problem and acquires the data, and maintenance manages,
      stores and secures it; neither builds the model [^1]. The analysis stage then checks the data
      and confirms that the model addresses the questions [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#processing
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Processing'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
        locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
    source:
      id: ms-ds-for-beginners
      ref: quiz-27/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-044
    type: single
    difficulty: easy
    question: In the capturing stage of the data science lifecycle, which question is a data scientist most likely to ask?
    options:
      - text: What are the constraints?
        correct: true
      - text: Which algorithm reaches the best test accuracy?
      - text: Does the model make sense?
    explanation: |
      While capturing, the data scientist defines the goals with the stakeholders and asks whether
      the problem has been approached before, how to reduce ambiguity, what the constraints are and
      which resources are available [^1]. Comparing algorithms by test accuracy and judging whether a
      model makes sense come later, in processing and analysis, once a model exists [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#capturing
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Capturing and Processing'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
        locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
    source:
      id: ms-ds-for-beginners
      ref: quiz-27/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-045
    type: single
    difficulty: easy
    question: Which of these is a common technique in the processing stage of the data science lifecycle?
    options:
      - text: Clustering
        correct: true
      - text: Encrypting the stored data
      - text: Presenting the results to executives
    explanation: |
      Processing is about discovering patterns in the data and modeling, and the lesson names
      classification, clustering and regression as its common techniques [^1]. Encrypting the data
      is part of maintenance, which secures the data, and presenting results belongs to the
      communication stage [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#processing
        locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Processing and Maintaining'
    source:
      id: ms-ds-for-beginners
      ref: quiz-27/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-046
    type: single
    difficulty: easy
    question: |
      Which pandas method gives a basic profile of a DataFrame's numeric columns: count, mean,
      standard deviation, min, max and quartiles?
    options:
      - text: '`head()`'
      - text: '`isnull()`'
      - text: '`describe()`'
        correct: true
    explanation: |
      `describe()` generates descriptive statistics; for numeric data it reports the count, mean,
      standard deviation, min, max and the 25th, 50th and 75th percentiles [^1][^2]. `head()` only
      shows the first rows, and `isnull()` returns a Boolean mask marking missing values; both help
      exploration but do not summarize the columns [^3].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md#data-profiling-descriptive-statistics-and-pandas
        locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, sec. Data Profiling, Descriptive Statistics, and Pandas'
      - title: 'pandas documentation: pandas.DataFrame.describe'
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.describe.html
        locator: Notes
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#exploring-dataframe-information
        locator: 'Lesson 8: Data Preparation, sec. Exploring DataFrame information and Dealing with Missing Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-29/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
    status: draft
  - id: data-prep-047
    type: single
    difficulty: easy
    question: In a typical machine learning project, roughly what share of the time goes into constructing datasets and transforming data?
    options:
      - text: About 80%
        correct: true
      - text: About 50%
      - text: About 20%
      - text: About 5%
    explanation: |
      Practitioners spend most of an ML project building datasets and doing feature engineering;
      typically about 80% of the time goes into constructing and transforming data [^1]. The same
      module stresses why: the quality and size of the dataset matter much more than which algorithm
      is used [^1]. Shares of a half or less underestimate the data work, which is the most common
      planning mistake.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting
        locator: Datasets, generalization, and overfitting (module introduction)
    source:
      id: google-mlcc
      ref: overfitting#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting
    status: draft
  - id: data-prep-048
    type: multiple
    difficulty: easy
    question: Which of these can plotting your data before training help you discover? Select all that apply.
    options:
      - text: Outliers, values far from most of the others
        correct: true
      - text: Unbalanced classes or other potential causes of bias
        correct: true
      - text: The model's accuracy on the test set
      - text: The best learning rate for training
    explanation: |
      The lesson says visualizing the data can uncover hidden correlations, bias and unbalanced
      data [^1]. MLCC recommends plotting data before building features because plots reveal
      anomalies, including outliers: values distant from most others, which often cause problems in
      training [^2]. Test accuracy only exists after a model has been trained and evaluated on
      held-out data [^1]. A learning rate is a training hyperparameter, found by training and
      evaluating models, not something a plot of the raw data shows.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#visualize-your-data
        locator: 'Lesson: Techniques of Machine Learning, secs. Visualize your data and Evaluate the model'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/first-steps#visualize_your_data
        locator: 'Numerical data: First steps, Visualize your data and Find outliers'
    source:
      id: ms-ml-for-beginners
      ref: quiz-8/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-049
    type: single
    difficulty: medium
    question: A correlation heatmap shows only a weak linear correlation between Month and pumpkin Price, yet a bar chart of the mean price per month shows a clear peak in September and October. What explains this?
    options:
      - text: The correlation coefficient only measures straight-line relationships, so it misses the seasonal pattern
        correct: true
      - text: The bar chart must be misleading, because a weak correlation means Month and Price are unrelated
      - text: The data must first be split into training and test sets, because a correlation is only meaningful on the test set
    explanation: |
      In the lesson's pumpkin data, the heatmap shows only a weak linear correlation between Month
      and Price, although the bar chart of mean price per month has a clear peak in September and
      October [^1]. The lesson's conclusion: the correlation coefficient measures only straight-line
      relationships, so it can miss seasonal or other non-linear patterns, which is why you look at
      charts as well as the numbers [^1]. Statistics texts say the same: correlation quantifies the
      strength of a linear trend, and strong non-linear trends can produce correlations that do not
      reflect how strong the relationship is [^2]. So a weak correlation does not mean the variables
      are unrelated, and a train/test split has nothing to do with it.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/2-Data/README.md#heatmaps-to-show-correlations
        locator: 'Lesson: Prepare and visualize data for regression, secs. Bar charts to show distributions and Heatmaps to show correlations'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
        locator: Sec. 7.1.4 Describing linear relationships with correlation
    source:
      id: ms-ml-for-beginners
      ref: quiz-11/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: data-prep-050
    type: single
    difficulty: easy
    question: '`dataset` is a pandas DataFrame. Which call tells you how many values are missing in each column?'
    options:
      - text: '`dataset.isnull().sum()`'
        correct: true
      - text: '`dataset.isnull().any()`'
      - text: '`dataset.dropna()`'
      - text: '`dataset.fillna(0)`'
    explanation: |
      `isnull()`, an alias of `isna()`, returns a same-shaped table of booleans that is True
      wherever a value is missing [^1]; `.sum()` then adds up the Trues column by column, which gives
      the number of missing values per column. The pumpkin lesson runs `pumpkins.isnull().sum()` for
      exactly this check [^2]. `dropna()` drops the rows or columns that contain missing data and
      `fillna(0)` replaces missing values with 0 [^3]: both change the data instead of reporting how
      much is missing. `.any()` returns only whether each column has at least one True, so it tells
      you *whether* values are missing, not how many [^4].
    references:
      - title: 'pandas API reference: DataFrame.isnull'
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.isnull.html
        locator: DataFrame.isnull (alias of DataFrame.isna)
