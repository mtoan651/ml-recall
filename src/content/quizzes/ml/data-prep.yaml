  - id: data-prep-070
    type: single
    difficulty: easy
    tags:
      - feature-scaling
      - decision-trees
      - preprocessing
    question: Which of these methods does **not** need its input features to be scaled to comparable ranges?
    options:
      - text: Decision trees
        correct: true
      - text: Principal component analysis (PCA)
        why: PCA finds directions of maximal variance, so a feature measured on a larger scale dominates the components [^2].
      - text: Support vector machines (SVM)
        why: The margin and common kernels such as the RBF kernel depend on distances, which features with large ranges dominate [^2].
      - text: k-means clustering
        why: k-means assigns points by Euclidean distance, which is dominated by features with large ranges [^2].
    explanation: |
      A decision tree splits one feature at a time on a threshold, and any monotone rescaling of that
      feature just moves the threshold, so the tree's predictions do not change [^1]. Methods based on
      distances, variances or dot products (k-means, SVMs, PCA, gradient-based training) are
      sensitive to the units of the features and usually need standardisation [^2].
    references:
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html
        locator: 1.10 Decision Trees (advantages, little data preparation)
      - title: 'Wikipedia: Feature scaling'
        url: https://en.wikipedia.org/wiki/Feature_scaling
        locator: Motivation
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/ml.yml#q2
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
    status: draft
  - id: data-prep-071
    type: single
    difficulty: medium
    tags:
      - feature-selection
      - regularization
      - lasso
      - ridge
    question: |
      Which of the following is **not** suitable for selecting a subset of features before training
      a model?
    options:
      - text: Lasso regression
        why: The L1 penalty drives coefficients of irrelevant features exactly to zero, which selects features [^1].
      - text: Ridge regression
        correct: true
      - text: Chi-square test
        why: The chi-square statistic scores each (non-negative) feature by its dependence on the class label, a standard univariate filter [^2].
      - text: ANOVA F-test
        why: The F-test scores each feature by how well it separates the class means, another standard univariate filter [^2].
    explanation: |
      Ridge regression shrinks coefficients towards zero with an L2 penalty but practically never
      sets them exactly to zero, so all features stay in the model [^1]. The lasso's L1 penalty
      produces exact zeros and therefore performs selection, and filter methods such as the chi-square
      and ANOVA F-tests rank features by their relation to the target [^1][^2].
    references:
      - title: 'Wikipedia: Lasso (statistics)'
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)
        locator: Interpretations of lasso (geometric interpretation, comparison with ridge regression)
      - title: 'scikit-learn User Guide: Feature selection'
        url: https://scikit-learn.org/stable/modules/feature_selection.html
        locator: 1.13.2 Univariate feature selection (chi2, f_classif); 1.13.4 L1-based feature selection
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/ml.yml#q4
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
