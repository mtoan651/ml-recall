  - id: data-prep-068
    type: multiple
    difficulty: medium
    tags:
      - one-hot-encoding
      - bag-of-words
      - unknown-categories
      - cross-validation
    question: |
      Which statements about encoding categorical and text features are true? Select all that
      apply. One of them refers to this code:

      ```python
      pipe = make_pipeline(CountVectorizer(), SVC())
      cross_validate(pipe, X_train, y_train)
      ```
    options:
      - text: When a one-hot encoder represents unseen categories as all-zero rows (`handle_unknown="ignore"`), all unknown categories look the same to the model
        correct: true
      - text: Raising `max_features` of a bag-of-words vectorizer (keeping more words) is likely to raise the training score
        correct: true
      - text: A bag-of-words vectorizer fitted on the training split raises an error when a validation document contains a word it has never seen
        why: Words outside the learned vocabulary are simply ignored; there is no column for them [^2].
      - text: When this pipeline is cross-validated, different folds can end up with slightly different numbers of features
        correct: true
    explanation: |
      With `handle_unknown="ignore"`, every category not seen during `fit` is encoded as a row of
      zeros, so the model cannot tell different unknown categories apart [^1]. A bag-of-words
      vectorizer builds its vocabulary from the documents it is fit on: keeping more words means
      more features and a more complex model, which usually raises the training score, and words it
      never saw are dropped when it transforms new text [^2]. Inside cross-validation the pipeline
      refits the vectorizer on each training fold, so each fold can have a slightly different
      vocabulary and thus a different number of features [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 6: sklearn ColumnTransformer and Text Features — Dealing with unknown categories'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/06_column-transformer-text-feats.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 6: sklearn ColumnTransformer and Text Features — Bag of words (BOW) representation; Important hyperparameters of CountVectorizer'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/06_column-transformer-text-feats.ipynb
      - source: ubc-cpsc330
        locator: "Lecture 5: Preprocessing and sklearn pipelines — Let's try cross-validation with our pipeline"
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
