  - id: data-prep-081
    type: short_answer
    difficulty: easy
    tags:
      - one-hot-encoding
      - cardinality
    question: |
      A dataset has 10,000 rows and one categorical column with 100 distinct values. If you replace
      that column by its one-hot encoding, how many entries (cells) are added to the dataset?
    answer:
      numeric: 990000
      tolerance: 0
      hint: a whole number
      model: $10{,}000 \times 100 - 10{,}000 = 990{,}000$
    explanation: |
      One-hot encoding creates one column per category, so the encoding fills
      $10{,}000 \times 100 = 1{,}000{,}000$ cells, replacing the original 10,000: 990,000 added
      [^1]. An ordinal encoding would add none, since it replaces each category by one integer in the
      same column [^1]. This blow-up is why one-hot encoding is usually reserved for low-cardinality
      columns, with high-cardinality ones dropped or ordinal-encoded [^1][^2].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 3 exercise, Step 3 Investigating cardinality, Part B (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex3.py
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 3 Categorical Variables — tutorial, One-Hot Encoding
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/tut3.ipynb
    source:
      id: kaggle-learn
      ref: ml_intermediate/ex3#q3
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/ex3.ipynb
    status: reviewed
