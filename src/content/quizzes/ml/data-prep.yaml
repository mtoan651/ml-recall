  - id: data-prep-066
    type: multiple
    difficulty: medium
    tags:
      - pipelines
      - cross-validation
      - data-leakage
    question: |
      Which statements about machine learning pipelines (a chain of preprocessing steps ending with
      a model, as in scikit-learn's `Pipeline`) are true? Select all that apply.
    options:
      - text: A single pipeline can contain scaling of numeric features, one-hot encoding of categorical features and a final model
        correct: true
      - text: Once a pipeline ends with a model, you can call `fit`, `predict` and `score` on the whole pipeline
        correct: true
      - text: A pipeline can also take care of splitting the data into training and test sets
        why: Splitting comes first and happens outside the pipeline; the pipeline is then fit on the training split only [^1].
      - text: The order of the steps in a pipeline matters
        correct: true
      - text: When a pipeline is cross-validated, its transformers are fit on each training fold and only applied (`transform`) to the validation fold
        correct: true
    explanation: |
      A pipeline chains transformers with a final estimator: all steps but the last transform the
      data, and the last one is the model, so the whole pipeline behaves like a model with `fit`,
      `predict` and `score` [^2]. Different transformations for different column types are combined
      into one step with a column transformer, so scaling, one-hot encoding and a model can sit in
      one pipeline [^3]. Steps run in order, each on the previous step's output [^2]. Passing the
      pipeline to cross-validation is what prevents leakage: in every fold it fits the
      transformers on the training part only and just transforms the validation part [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Here is the workflow we will generally follow'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
      - source: ubc-cpsc330
        locator: "Lecture 5: Preprocessing and sklearn pipelines — Pipelines; Let's try cross-validation with our pipeline"
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 6: sklearn ColumnTransformer and Text Features — Training models with transformed data'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/06_column-transformer-text-feats.ipynb
    source:
