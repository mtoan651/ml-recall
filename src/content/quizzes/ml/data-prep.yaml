  - id: data-prep-079
    type: short_answer
    difficulty: medium
    tags:
      - target-encoding
      - m-estimate
      - smoothing
    question: |
      You target-encode the neighborhood of each house with an m-estimate, smoothing parameter
      $m = 5$. A rare neighborhood occurs in 3 houses of the encoding split, with a mean price of 200
      (thousand dollars); the overall mean price is 180. What is the neighborhood's encoded value?
    answer:
      numeric: 187.5
      tolerance: 0.05
      hint: thousand dollars, 1 decimal
      model: weight $= \frac{3}{3 + 5} = 0.375$; $0.375 \times 200 + 0.625 \times 180 = 187.5$
    explanation: "Smoothing blends the in-category average with the overall average: `encoding = weight * in_category + (1 - weight) * overall`, with the m-estimate $\\text{weight} = n / (n + m)$, where $n$ counts the category's occurrences [^1]. Here $3/8 = 0.375$, so the code is $0.375 \\cdot 200 + 0.625 \\cdot 180 = 187.5$, pulled more than halfway to the overall mean because three houses give an unreliable average [^1]. Larger $m$ puts more weight on the overall estimate, which suits noisy categories; Kaggle's Feature Engineering exercise applies an m-estimate encoder to nominal features with many rare categories, such as `Neighborhood` [^2]."
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 6 Target Encoding — tutorial, Smoothing
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut6.ipynb
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 6 exercise, Questions 1–2 Choose Features / Apply M-Estimate Encoding
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/ex6.ipynb
