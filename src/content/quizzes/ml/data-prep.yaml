      ref: ml_intermediate/ex7#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/ex7.ipynb
    status: reviewed
    reviewed_by: claude
  - id: data-prep-084
    type: single
    difficulty: hard
    tags:
      - data-leakage
      - target-leakage
      - train-test-contamination
    question: |
      To predict which patients get an infection after a rare surgery, you compute each surgeon's
      infection rate over all of their surgeries in the dataset, and use it as a feature for each
      patient. Which problems does this create?
    options:
      - text: Both target leakage and train-test contamination
        correct: true
      - text: Only train-test contamination
        why: Each patient's own outcome is part of the surgeon's rate, so the feature contains the target, which is target leakage [^1].
      - text: Only target leakage
        why: The rates also use the surgeries in the test set, so test data shapes the training features, which is train-test contamination [^1].
      - text: Neither, since the surgeon is known before the operation
        why: The surgeon is known in advance, but the rate is computed from outcomes, including this patient's and the test patients' [^1].
    explanation: |
      Target leakage arises because a patient's outcome contributes to their surgeon's infection rate,
      which is then fed back into the prediction for that patient; computing the rate only from
      surgeries before the one being predicted avoids it [^1]. Train-test contamination arises if the
      rate uses all surgeries, including the test set: the model then looks accurate on the test set
      without generalizing to new patients, defeating the purpose of a test set [^1][^2].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 exercise, Step 4 Preventing Infections (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex7.py
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 Data Leakage — tutorial, Target leakage; Train-Test Contamination
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/tut7.ipynb
    source:
