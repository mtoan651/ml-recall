  - id: data-prep-080
    type: single
    difficulty: medium
    tags:
      - target-encoding
      - overfitting
      - data-leakage
    question: |
      You add a feature `Count` with the values 0, 1, 2, … (a different value in every row, unrelated
      to price), mean-encode it with the target, and train XGBoost on the same rows used to fit the
      encoder. The training score is almost perfect. Why?
    options:
      - text: Each value occurs once, so its encoding equals that row's own target
        correct: true
      - text: The rows happen to be sorted by price, so the count was already informative
        why: The count is unrelated to the price; the raw count would not give a near-perfect fit, its encoding does [^1].
      - text: XGBoost can memorize any feature, so the encoding makes no difference
        why: Without the target-derived encoding the meaningless count gives XGBoost nothing to fit; the encoding is what leaks the target [^1].
      - text: Mean encoding smooths the target's noise away, which makes the model more accurate
        why: Nothing is smoothed here; with one row per value the "mean" is just the row's own target [^1].
    explanation: A mean encoding replaces a category by the average target of its rows. Since `Count` never repeats, every row's code equals its own `SalePrice`, turning a meaningless feature into a perfect one [^1]. This works only because the encoder and the model were fit on the same rows; on held-out data the "fake" relationship vanishes. So target encoders must be trained on a separate encoding split; Kaggle's target-encoding tutorial sets aside 25% of its data for this [^1][^2].
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 6 exercise, Question 3 Overfitting with Target Encoders (hint and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/feature_engineering_new/ex6.py
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 6 Target Encoding — tutorial, Smoothing; Example - MovieLens1M
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut6.ipynb
