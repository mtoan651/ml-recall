  - id: data-prep-060
    type: single
    difficulty: medium
    tags:
      - standardization
      - feature-scaling
      - weight-decay
    question: |
      You train a linear model with weight decay by SGD on house data but skip standardizing the
      numeric features: lot area is in the tens of thousands of square feet, while the number of
      bathrooms is between 1 and 4. What goes wrong?
    options:
      - text: The squared loss stops being convex in the weights, so SGD gets stuck in local minima
        why: The squared loss of a linear model is convex whatever the feature scales; the problem is conditioning, not local minima.
      - text: The one-hot encoded categorical columns no longer work together with the numeric ones
        why: One-hot columns are 0/1 and unaffected; the trouble comes from the large numeric columns.
      - text: Large-scale features dominate the gradients, and the penalty treats features unevenly
        correct: true
      - text: A linear model can no longer represent the same predictions as with standardized features
        why: Rescaling a feature only rescales its best weight; the set of linear functions stays the same.
    explanation: |
      d2l standardizes features to zero mean and unit variance for two reasons: it makes optimization
      easier, and it avoids penalizing the coefficients of some features more than those of others
      [^1]. A feature in the tens of thousands produces gradient components thousands of times larger
      than a single-digit feature, so a learning rate small enough to keep its weight stable barely
      moves the others; gradient descent converges much faster after feature scaling [^2]. And since
      such a feature needs only a tiny weight, the penalty $\frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$
      hardly constrains it while it restricts the small-scale features heavily [^2].
    references:
      - source: d2l
        locator: Sec. 5.7.4 Data Preprocessing
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#data-preprocessing
      - title: 'Wikipedia: Feature scaling'
        locator: Motivation
        url: https://en.wikipedia.org/wiki/Feature_scaling
        quote: gradient descent converges much faster with feature scaling than without it.
      - source: d2l
        locator: Sec. 5.7.10 Exercises, Exercise 5
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/kaggle-house-price#ex5
      url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: data-prep-061
    type: single
    difficulty: easy
    tags:
      - eda
      - feature-selection
      - feature-interactions
    question: |
      The figure shows histograms of one feature, `danceability`, for the two classes of a song
      dataset (0 = song not liked, 1 = song liked). The two distributions overlap a lot, so on its
      own the feature separates the classes poorly. Should you remove it from the model?
    figure:
      src: ./data-prep/data-prep-061.svg
      alt: Two overlapping histograms of danceability from 0.1 to 1.0. Class 0 (blue) peaks near 0.6, class 1 (orange) peaks near 0.7, and most of the two areas overlap.
    options:
      - text: No, because it could still be informative in combination with other features
        correct: true
      - text: Yes, because a feature that cannot separate the classes alone carries no information
        why: Weak separation on its own does not make a feature useless. A feature can matter only together with others, as in XOR, where neither input helps alone but their cross separates the classes [^1].
      - text: Yes, because the range of its values is too narrow to be useful
        why: The range of a feature says nothing about its relation to the target; scaling changes the range anyway [^3].
      - text: No, because a model simply ignores any feature that is not useful
        why: Models do not reliably ignore useless features. Irrelevant features can confuse distance-based models such as k-NN and add to overfitting [^4].
    explanation: |
      A histogram per class only shows how informative a feature is *by itself*. UBC's CPSC 330 notes warn that a feature is only relevant in the context of other features: adding or removing features
      can make a feature relevant or irrelevant [^2]. The XOR example makes this concrete: each
      input alone says nothing about the target, but their product makes the data linearly
      separable [^1]. So a feature with a weak marginal signal can still help in combination, and
      the decision to drop it should come from model-based checks (cross-validated feature
      selection), not from one histogram.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 13: Feature engineering and feature selection — Feature interactions and feature crosses'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/13_feature-engineering-selection.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 13: Feature engineering and feature selection — Warnings about feature selection'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/13_feature-engineering-selection.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Scaling'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Curse of dimensionality'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
