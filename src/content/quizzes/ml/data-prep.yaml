  - id: data-prep-083
    type: single
    difficulty: medium
    tags:
      - data-leakage
      - target-leakage
    question: |
      A model predicts how many shoelaces a shoe company will need each month. Its features are the
      month, last month's advertising spending, economic indicators at the start of the month, and the
      amount of leather used during the month. With the leather feature it is almost perfectly
      accurate. When is that feature a source of target leakage?
    options:
      - text: When the leather amount is only known after the prediction is made
        correct: true
      - text: Always, because leather and shoelaces both follow from the number of shoes produced
        why: A strong correlation with the target is not leakage by itself; the question is whether the value is available at prediction time [^2].
      - text: Never, because leather is a different material from shoelaces
        why: Leakage is about timing, not about what the feature measures; a value fixed only after the month cannot be used in advance [^2].
      - text: Only if the model is validated with cross-validation instead of a hold-out set
        why: Leaky features fool any validation that draws from the same data, cross-validation included [^2].
    explanation: |
      It depends on how the data is collected [^1]. If the amount of leather for the month is decided at
      its beginning, the feature is available when you predict and is fine. If it is determined during
      the month, or a guess made at the start is later revised, the actual amount used cannot be a
      feature, because it is not available at prediction time [^1]. Target leakage is defined by this
      chronology: predictors must not include data that will not be available when predictions are
      made [^2].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 exercise, Step 1 The Data Science of Shoelaces (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex7.py
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 Data Leakage — tutorial, Target leakage
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/tut7.ipynb
    source:
