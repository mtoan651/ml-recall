      ref: questions/ml.yml#q2
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
    status: reviewed
    reviewed_by: claude
  - id: data-prep-071
    type: single
    difficulty: medium
    tags:
      - feature-selection
      - regularization
      - lasso
      - ridge
    question: |
      Which of the following is **not** suitable for selecting a subset of features before training
      a model?
    options:
      - text: Lasso regression
        why: The L1 penalty drives coefficients of irrelevant features exactly to zero, which selects features [^1].
      - text: Ridge regression
        correct: true
      - text: Chi-square test
        why: The chi-square statistic scores each (non-negative) feature by its dependence on the class label, a standard univariate filter [^2].
      - text: ANOVA F-test
        why: The F-test scores each feature by how well it separates the class means, another standard univariate filter [^2].
    explanation: |
      Ridge regression shrinks coefficients towards zero with an L2 penalty but practically never
      sets them exactly to zero, so all features stay in the model [^1]. The lasso's L1 penalty
      produces exact zeros and therefore performs selection, and filter methods such as the chi-square
      and ANOVA F-tests rank features by their relation to the target [^1][^2].
    references:
      - title: 'Wikipedia: Lasso (statistics)'
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)
        locator: Interpretations of lasso (geometric interpretation, comparison with ridge regression)
      - title: 'scikit-learn User Guide: Feature selection'
        url: https://scikit-learn.org/stable/modules/feature_selection.html
        locator: 1.13.2 Univariate feature selection (chi2, f_classif); 1.13.4 L1-based feature selection
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/ml.yml#q4
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
    status: reviewed
    reviewed_by: claude
  - id: data-prep-072
    type: single
    difficulty: easy
    question: |
      A used-car dataset has the features make_model, year, color, miles, gearbox, tire_size,
      wheel_base and height. Which three are likely the strongest predictors of a car's price?
    options:
      - text: Make_model, year, miles.
        correct: true
      - text: Color, height, make_model.
        why: A car's height and color are not strong predictors for a car's price.
      - text: Miles, gearbox, make_model.
        why: The gearbox isn't a main predictor of price.
      - text: Tire_size, wheel_base, year.
        why: Tire size and wheel base aren't strong predictors for a car's price.
    explanation: |
      Google's introduction to ML picks make_model, year and miles: they say what the car is, how old
      it is and how much it has been driven, which drive most of its price [^1]. Color, height,
      gearbox, tire size and wheel base are, by comparison, weak predictors of price [^1].
