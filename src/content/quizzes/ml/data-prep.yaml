  - id: data-prep-085
    type: single
    difficulty: medium
    tags:
      - data-leakage
      - target-leakage
      - house-prices
    question: |
      A model runs on a listings website and predicts the price of each new house as soon as its
      description is added. It is trained on historical sales. Which candidate feature is most likely
      to be a source of leakage?
    options:
      - text: The average sale price of homes in the same neighborhood
        correct: true
      - text: The size of the house in square meters, as listed
        why: Size is known when the listing appears and is rarely changed after a sale, so it is safe [^1].
      - text: The latitude and longitude of the house's location on a map
        why: Location never changes and is known when the listing appears [^1].
      - text: Whether or not the house has a basement
        why: This does not change and is available at prediction time [^1].
    explanation: |
      If the neighborhood average is updated after a house is sold, and that sale is included in it,
      the feature contains the target: at the extreme, with only one sale in a neighborhood, the
      average is exactly the price being predicted [^1]. The model then does very well in training,
      especially for neighborhoods with few sales, but a new listing has not been sold yet, so in
      production the feature behaves differently [^1]. Any variable updated after the target is
      realized should be excluded [^2].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 exercise, Step 5 Housing Prices (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex7.py
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 Data Leakage — tutorial, Target leakage
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/tut7.ipynb
