  - id: data-prep-047
    type: single
    difficulty: easy
    question: In a typical machine learning project, roughly what share of the time goes into constructing datasets and transforming data?
    options:
      - text: About 80%
        correct: true
      - text: About 50%
        why: Half underestimates the data work; MLCC says to plan for more, typically 80% [^1].
      - text: About 20%
        why: "Far too low: most of a project's time goes into constructing datasets and transforming data [^1]."
      - text: About 5%
        why: "Far too low: building and transforming data typically takes about 80% of a project's time [^1]."
    explanation: |
      Machine Learning Crash Course (MLCC) notes that practitioners spend most of an ML project
      building datasets and doing feature engineering: typically about 80% of the time goes into
      constructing and transforming data [^1]. Its datasets module stresses why: the quality and size of
      the dataset matter much more than which algorithm is used [^1]. Planning for half of the time or
      less underestimates the data work; MLCC's advice is to plan for more [^1].
