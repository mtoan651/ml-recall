  - id: data-prep-052
    type: single
    difficulty: medium
    question: What does scikit-learn's `LabelEncoder().fit_transform(['pear', 'apple', 'fig', 'apple'])` return?
    options:
      - text: '`[2, 0, 1, 0]`'
        correct: true
      - text: '`[0, 1, 2, 1]`'
        why: That numbers the classes by first appearance; `LabelEncoder` sorts them, so apple = 0, fig = 1, pear = 2 [^1].
      - text: '`[[0, 0, 1], [1, 0, 0], [0, 1, 0], [1, 0, 0]]`'
        why: One binary column per class is one-hot encoding, `OneHotEncoder`'s job; `LabelEncoder` returns one integer per label [^3].
    explanation: |
      `LabelEncoder` encodes labels as integers from 0 to n_classes − 1 [^1]. The classes are kept in
      sorted order (`classes_` is `['apple', 'fig', 'pear']`), so apple → 0, fig → 1, pear → 2 and the
      list becomes `[2, 0, 1, 0]`. That is what the note in ML-For-Beginners' web-app lesson, "LabelEncoder encodes data alphabetically", means: the codes are numbers, assigned in alphabetical order [^2]. Numbering by
      first appearance would give `[0, 1, 2, 1]`, and one binary column per class is one-hot
      encoding, which is `OneHotEncoder`'s job [^3]. scikit-learn meant `LabelEncoder` for the target
      `y`, as in that lesson, where Country is the label [^1][^2].
    references:
      - title: 'scikit-learn API reference: LabelEncoder'
        url: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.LabelEncoder.html
        locator: Class description and classes_ attribute
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---clean-your-data
        locator: 'Lesson: Build a web app to use a ML model, secs. Exercise - clean your data and Exercise - build your model'
      - title: 'scikit-learn User Guide: Preprocessing data'
        url: https://scikit-learn.org/stable/modules/preprocessing.html#encoding-categorical-features
        locator: Sec. 8.3.4 Encoding categorical features
    source:
      id: ms-ml-for-beginners
      ref: quiz-18/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-053
    type: single
    difficulty: medium
    question: Before training a cuisine classifier, a dataset with 799 Korean but only 289 Thai recipes is balanced with SMOTE. How does SMOTE balance the classes?
    options:
      - text: It creates new synthetic examples of the smaller classes by interpolating between existing ones
        correct: true
      - text: It duplicates randomly chosen examples of the smaller classes until all of the class counts match
        why: That is naive random over-sampling, which repeats existing examples; SMOTE instead generates new samples by interpolation [^2].
      - text: It deletes examples of the largest class until every class is as small as the smallest one
        why: That is under-sampling, the opposite strategy, for example with `RandomUnderSampler` [^3].
    explanation: |
      ML-For-Beginners' introduction to classification first cleans the cuisine data and then balances it with SMOTE, the Synthetic
      Minority Over-sampling Technique, so that every cuisine ends up with 799 recipes [^1].
      imbalanced-learn explains the difference from naive over-sampling: random over-sampling
      duplicates some of the original minority samples, while SMOTE generates new samples by
      interpolation [^2]. Removing majority-class examples is the opposite strategy, under-sampling,
      for example a random subset with `RandomUnderSampler` [^3]. Balancing matters because a model
      trained on skewed data predicts the majority class more often simply because it has seen more
      of it [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
        locator: 'Lesson: Introduction to classification, sec. Balance the dataset'
      - title: 'imbalanced-learn User Guide: Over-sampling'
        url: https://imbalanced-learn.org/stable/over_sampling.html#smote-adasyn
        locator: Secs. 2.1.1 Naive random over-sampling to 2.1.3 Ill-posed examples
      - title: 'imbalanced-learn User Guide: Under-sampling'
        url: https://imbalanced-learn.org/stable/under_sampling.html#random-under-sampling
        locator: Sec. 3.2.1.1 Random under-sampling
    source:
      id: ms-ml-for-beginners
      ref: quiz-19/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-054
    type: single
    difficulty: easy
    question: What units is the sampling rate measured in?
    options:
      - text: dB
        why: Decibels (dB) measure the amplitude of a sound, which we hear as loudness, not how often samples are taken [^1].
      - text: Hz
        correct: true
      - text: bit
        why: Bits describe the bit depth, the precision with which each sample's amplitude is stored [^1].
    explanation: |
      The sampling rate is the number of samples taken in one second, so it is a frequency measured in
      hertz (Hz): CD audio uses 44,100 Hz, and speech models are commonly trained at 16,000 Hz [^1].
      Decibels measure the amplitude of the sound, and the bit depth says how precisely each sample's
      amplitude is recorded [^1].
    references:
      - source: hf-audio-course
        locator: 'Unit 1, Introduction to audio data: Sampling and sampling rate; Amplitude and bit depth'
        url: https://huggingface.co/learn/audio-course/chapter1/audio_data
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q1
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: reviewed
    reviewed_by: claude
  - id: data-prep-055
    type: single
    difficulty: easy
    question: What is a spectrogram?
    options:
      - text: A device used to digitize the audio that is first captured by a microphone, which converts the sound waves into an electrical signal.
        why: That device is an analog-to-digital converter (ADC). A spectrogram is a representation of the signal, not hardware.
      - text: A plot that shows how the amplitude of an audio signal changes over time. It is also known as the *time domain* representation of sound.
        why: That describes the waveform, the time-domain representation; a spectrogram shows how the frequency content changes over time [^1].
      - text: A visual representation of the frequency spectrum of a signal as it varies with time.
        correct: true
    explanation: |
      A spectrogram shows how the frequency content of a signal changes over time: time on the
      horizontal axis, frequency on the vertical axis, and colour for the amplitude (or energy) of
      each frequency. It is computed with the short-time Fourier transform, i.e. a Fourier
      transform over short, overlapping windows of the waveform [^1].
    references:
      - source: hf-audio-course
        locator: 'Unit 1, Introduction to audio data: Audio as a waveform; Spectrogram'
        url: https://huggingface.co/learn/audio-course/chapter1/audio_data
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q3
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: reviewed
    reviewed_by: claude
  - id: data-prep-056
    type: single
    difficulty: medium
    question: Your custom dataset contains high-quality audio with 32 kHz sampling rate. You want to train a speech recognition model that expects the audio examples to have a 16 kHz sampling rate. What should you do?
    options:
      - text: Use the examples as is, the model will easily generalize to higher quality audio examples.
        why: The model has only seen 16 kHz input. At 32 kHz the same sound is a sequence twice as long, and models generalize poorly across sampling rates [^1].
      - text: Resample the audio to 16 kHz with a proper resampling routine before training
        correct: true
      - text: Downsample by a factor 2x by throwing away every other sample.
        why: Dropping every other sample without first low-pass filtering folds frequencies above the new 8 kHz Nyquist limit back into the signal (aliasing). Proper resampling filters first [^2].
    explanation: |
      The sampling rate of your data should match the one the model was trained on: the same sound at
      a different rate is a sequence of a different length, and models generalize poorly across
      sampling rates [^1]. Downsampling from 32 kHz to 16 kHz must first filter out the frequencies
      above the new Nyquist limit of 8 kHz and only then keep every second sample; otherwise those
      frequencies come back as aliases. Doing this correctly is best left to well-tested libraries such
      as librosa or Hugging Face Datasets [^2].
    references:
      - source: hf-audio-course
        locator: 'Unit 1, Introduction to audio data: Sampling and sampling rate'
        url: https://huggingface.co/learn/audio-course/chapter1/audio_data
      - source: hf-audio-course
        locator: 'Unit 1, Preprocessing an audio dataset: Resampling the audio data (tip on downsampling)'
        url: https://huggingface.co/learn/audio-course/chapter1/preprocessing
    source:
      id: hf-audio-course
      ref: chapter1/quiz#q6
      url: https://huggingface.co/learn/audio-course/chapter1/quiz
    status: reviewed
    reviewed_by: claude
  - id: data-prep-057
    type: short_answer
    difficulty: easy
    tags:
      - pandas
      - memory
      - dtypes
    question: |
      pandas reads a whole CSV file into memory. A table has 10 million rows and 100 numeric columns,
      which pandas stores as 64-bit floats. About how many gigabytes ($10^9$ bytes) does the raw data
      take in memory?
    answer:
      numeric: 8
      tolerance: 0.1
      hint: a number of gigabytes
      model: $10^7 \times 100 \times 8$ bytes $= 8 \times 10^9$ bytes $= 8$ GB
    explanation: |
      Each 64-bit float takes 8 bytes, so $10^7 \times 100$ values need $8 \times 10^9$ bytes, before
      any copies made while processing. pandas keeps its data structures in memory, so datasets larger
      than the RAM, or even a sizable fraction of it, are hard to handle this way; its scaling guide
      suggests loading only the needed columns, using smaller dtypes (float32 halves the size) or
      reading in chunks [^1]. These limits of time, representation and memory are what d2l's exercise
      asks you to think through [^2].
    references:
      - title: 'pandas User Guide: Scaling to large datasets'
        locator: Scaling to large datasets (introduction; Use efficient datatypes)
        url: https://pandas.pydata.org/docs/user_guide/scale.html
        quote: pandas provides data structures for in-memory analytics, which makes using pandas to analyze datasets that are larger than memory somewhat tricky.
      - source: d2l
        locator: Sec. 2.2.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_preliminaries/pandas.html#exercises
