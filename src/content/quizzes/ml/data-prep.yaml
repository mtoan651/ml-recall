  - id: data-prep-054
    type: single
    difficulty: easy
    question: What units is the sampling rate measured in?
    options:
      - text: dB
        why: No, the amplitude is measured in decibels (dB).
      - text: Hz
        correct: true
      - text: bit
        why: Bits are used to describe bit depth, which refers to the number of bits of information used to represent each sample of an audio signal.
    explanation: The sampling rate is the number of samples taken in one second and is measured in hertz (Hz). [^1]
