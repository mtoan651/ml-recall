  - id: data-prep-045
    type: single
    difficulty: easy
    question: Which of these is a common technique in the processing stage of the data science lifecycle?
    options:
      - text: Clustering
        correct: true
      - text: Encrypting the stored data
        why: Securing the data, for example by encryption, belongs to the maintenance stage [^1].
      - text: Presenting the results to executives
        why: Presenting results belongs to the communication stage [^1].
    explanation: |
      Processing is about discovering patterns in the data and modeling, and Data Science for Beginners names classification, clustering and regression as its common techniques [^1]. Encrypting the data
      is part of maintenance, which secures the data, and presenting results belongs to the
      communication stage [^1].
