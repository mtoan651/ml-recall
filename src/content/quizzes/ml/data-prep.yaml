  - id: data-prep-067
    type: multiple
    difficulty: medium
    tags:
      - column-transformer
      - preprocessing
      - pipelines
    question: |
      A column transformer applies different preprocessing to different columns of a table (for
      example scikit-learn's `ColumnTransformer`). Which statements about it are true? Select all
      that apply.
    options:
      - text: It can scale the numeric columns, one-hot encode the categorical ones and leave other columns unchanged, all in one step
        correct: true
      - text: The columns of its output must come in the same order as in the original data
        why: The output columns follow the order of the transformers you specify, which can differ from the original order [^2].
      - text: Its output always has a different number of columns than its input
        why: Only some transformations add columns; if it just scales and imputes, the number of columns stays the same [^3].
      - text: On its own, without a model, it can be passed to cross-validation to get validation scores
        why: Cross-validation scores a model's predictions; a transformer predicts nothing, so it is put in a pipeline that ends with a model [^4].
    explanation: |
      Real datasets mix numeric, categorical, binary and ordinal columns, and a column transformer
      applies the right transformation to each group, including "no transformation" [^1]. Its output
      is assembled transformer by transformer, so the column order can change and new columns
      appear only where a transformation creates them, as one-hot encoding does [^2][^3]. Because
      it only transforms data, it is used as a step in a pipeline ending with a model, and that
      pipeline is what you cross-validate [^4].
    references:
      - source: ubc-cpsc330
        locator: "Lecture 6: sklearn ColumnTransformer and Text Features — sklearn's ColumnTransformer; Transformations on the toy data"
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/06_column-transformer-text-feats.ipynb
