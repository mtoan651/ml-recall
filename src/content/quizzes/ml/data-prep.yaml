  - id: data-prep-063
    type: single
    difficulty: easy
    tags:
      - preprocessing
      - one-hot-encoding
      - scaling
      - imputation
    question: |
      Which preprocessing step can change the number of columns of the data? (Assume no column is
      entirely empty.)
    options:
      - text: Standardizing the numeric columns
        why: Standardization rescales each column in place, so the number of features stays the same [^2].
      - text: Imputing missing values with the column median
        why: Imputation fills in the missing entries of existing columns; it adds no columns [^1].
      - text: Min-max scaling the numeric columns
        why: Like standardization, min-max scaling transforms each column in place [^2].
      - text: One-hot encoding a categorical column
        correct: true
    explanation: |
      One-hot encoding replaces a column with $c$ categories by $c$ new binary columns, one per
      category, so the number of columns grows [^1]. Scaling only changes the values within each
      column, and imputation only fills in missing entries, so both keep the shape; the course
      makes the same contrast: "scaling doesn't change the number of features", while "OHE
      increases the number of features" [^2]. (Some imputer implementations drop a column that is
      *entirely* missing, which is why the question rules that case out.)
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Imputation; One-hot encoding (OHE)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 18: Multi-class classification and introduction to computer vision — Introduction to neural networks'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/18_intro_to_computer-vision.ipynb
