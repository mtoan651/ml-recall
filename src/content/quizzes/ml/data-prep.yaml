  - id: data-prep-075
    type: single
    difficulty: easy
    tags:
      - target-transform
      - log-transform
      - skewness
    question: |
      You build a linear model to predict house prices. The prices are all positive and strongly
      right-skewed: most houses are cheap, a few are very expensive. What is the usual first
      preprocessing step for the *target*?
    options:
      - text: Fit the model to $\log(\text{price})$ and exponentiate its predictions
        correct: true
      - text: Replace the prices by one-hot encoded price bands
        why: That turns the regression into a classification problem and throws away the ordering and exact values of the target.
      - text: Delete every house priced above the 95th percentile, treating them as outliers
        why: Expensive houses are real data, not errors; dropping them biases the model and leaves it unable to price such houses.
      - text: Min-max scale the prices to the interval $[0, 1]$
        why: A linear rescaling changes the units but not the shape of the distribution, so the skew remains.
    explanation: |
      A log transform compresses the long right tail of a positive, skewed variable, so relative
      (percentage) differences count equally for cheap and expensive houses [^1]. d2l uses exactly this
      idea for Kaggle house prices: errors are measured on the logarithm of the price, because a
      \$100,000 error matters far more for a cheap house than for an expensive one [^2].
    references:
      - title: 'Wikipedia: Data transformation (statistics)'
        url: https://en.wikipedia.org/wiki/Data_transformation_(statistics)#Motivation
        locator: Section "Motivation"
      - source: d2l
        locator: Sec. 5.7 Predicting House Prices on Kaggle (5.7.6 Error Measure)
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html
    source:
      id: ds-interviews
      ref: theory.md#q7
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#linear-regression
    status: reviewed
    reviewed_by: claude
  - id: data-prep-076
    type: short_answer
    difficulty: easy
    tags:
      - one-hot-encoding
      - label-encoding
      - categorical-features
    question: |
      A categorical feature `color` takes the values red, green and blue. With label encoding
      (red = 1, green = 2, blue = 3) the distance between red and blue is twice that between red and
      green. With one-hot encoding instead, what is the Euclidean distance between the vectors of any two
      different colors? Give 3 decimals.
    answer:
      numeric: 1.414
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\lVert(1,0,0)-(0,0,1)\rVert = \sqrt{2} \approx 1.414$
    explanation: |
      One-hot vectors differ in exactly two positions, so every pair of categories is $\sqrt{1 + 1} =
      \sqrt{2}$ apart: no category is "closer" to another [^1]. Label encoding instead imposes an
      order and spacing that a linear or distance-based model will take literally [^1][^2]. The cost of
      one-hot encoding is one column per category, which becomes a problem for very high cardinality
      features such as customer IDs [^1].
    references:
      - source: ds-interviews
        locator: theory.md, Classification — "Why do we need one-hot encoding?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/preprocessing.html#encoding-categorical-features
        locator: Sec. 8.3.4 Encoding categorical features
    source:
      id: ds-interviews
      ref: theory.md#q38
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
    status: reviewed
    reviewed_by: claude
  - id: data-prep-077
    type: single
    difficulty: medium
    tags:
      - mutual-information
      - feature-selection
    question: |
      You rank three features of a house-price dataset by their mutual information (MI) with
      `SalePrice`:

      - `YearBuilt`: newer houses tend to sell for more, and knowing the year narrows the likely price range.
      - `MoSold` (month of sale): the price distribution looks the same in every month.
      - `ScreenPorch` (porch area): 0 for almost every house; the few houses with a porch sell for somewhat more.

      Which ranking, from highest to lowest MI, is most plausible?
    options:
      - text: '`YearBuilt` > `ScreenPorch` > `MoSold`'
        correct: true
      - text: '`YearBuilt` > `MoSold` > `ScreenPorch`'
        why: If the price distribution is the same in every month, knowing the month tells you nothing, so `MoSold` has MI near 0; `ScreenPorch` at least helps for the few houses with a porch [^2].
      - text: '`ScreenPorch` > `YearBuilt` > `MoSold`'
        why: MI averages the reduction in uncertainty over the feature's values, weighted by how often they occur; for most houses `ScreenPorch` is 0 and says little [^1].
      - text: '`MoSold` > `YearBuilt` > `ScreenPorch`'
        why: A feature whose values all give the same price distribution is independent of the price, which is MI of 0 [^1].
    explanation: |
      Mutual information measures how much knowing a feature reduces uncertainty about the target,
      averaged over the feature's values and weighted by their frequency; it is 0 when the two are
      independent [^1]. `YearBuilt` constrains `SalePrice` to a smaller range, so it scores highest;
      `ScreenPorch` is usually just one value, so on average it tells little, though more than
      `MoSold`, which tells nothing [^2].
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 2 Mutual Information — tutorial, Mutual Information and What it Measures; Interpreting Mutual Information Scores
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut2.ipynb
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 2 exercise, Question 1 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/feature_engineering_new/ex2.py
    source:
      id: kaggle-learn
      ref: feature_engineering_new/ex2#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/ex2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: data-prep-078
    type: single
    difficulty: medium
    tags:
      - mutual-information
      - interaction-features
    question: |
      The building type `BldgType` has a low mutual-information score with `SalePrice`. But when you
      plot `SalePrice` against living area separately for each building type, the trend lines have
      very different slopes. What should you conclude?
    options:
      - text: It interacts with living area, so keep it, e.g. as type × area features
        correct: true
      - text: The low score shows `BldgType` carries no information, so it can be dropped
        why: MI scores a feature on its own; it cannot detect that a feature changes how another one relates to the target [^1].
      - text: The differing slopes show living area is unreliable and should be replaced by `BldgType`
        why: Living area still drives the price within each type; the type changes how strongly, which calls for using both [^2].
      - text: The MI score must be miscomputed, because a useful feature always has a high score
        why: A feature can be very informative together with others but not alone; a low univariate score is expected here [^1].
    explanation: "MI is a univariate metric: it cannot detect interactions, so a feature may be informative in combination with others while scoring low alone [^1]. Clearly different trend lines within each category of `BldgType` show such an interaction, so Kaggle's solution to this exercise suggests keeping it [^2]. A follow-up exercise builds the interaction directly: one-hot encode `BldgType` and multiply the indicator columns by `GrLivArea` [^3]."
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 2 Mutual Information — tutorial, Interpreting Mutual Information Scores; Example (fuel_type)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut2.ipynb
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 2 exercise, Question 3 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/feature_engineering_new/ex2.py
