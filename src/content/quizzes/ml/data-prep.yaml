  - id: data-prep-064
    type: single
    difficulty: easy
    tags:
      - missing-values
      - target
      - data-cleaning
    question: |
      While preparing a supervised learning dataset, you find that some examples are missing their
      target value. What should you do?
    options:
      - text: Drop the rows whose target value is missing
        correct: true
      - text: Impute the missing targets, for example with the mean target
        why: Imputed targets are invented answers; training on them teaches the model the imputation rule, and scoring on them measures nothing real.
      - text: Drop the target column from the dataset
        why: Without the target column there is nothing left to predict.
      - text: Pick a different column to use as the target
        why: That silently changes the problem you were asked to solve.
    explanation: |
      Imputation is a tool for missing *feature* values: the model still learns from the true
      targets [^1]. A missing target means the example has no answer to learn from or to check
      against, so the usual fix is to drop those rows, which is what the course does with its
      weather data ("Some target values are also missing. I'm dropping these rows.") [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Imputation'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
