  - id: data-prep-058
    type: single
    difficulty: medium
    tags:
      - one-hot-encoding
      - categorical-features
      - identifiers
    question: |
      A customer table has a categorical column `customer_id` whose value differs in every row. You
      one-hot encode all categorical columns before training a model. What does this column do?
    options:
      - text: One indicator per row, which lets the model memorize rows but tells it nothing about new customers
        correct: true
      - text: It adds a single numeric column, because a column whose values are all unique is treated as an integer feature
        why: One-hot encoding creates one indicator column per distinct value [^1], so $n$ distinct IDs give $n$ columns.
      - text: It becomes the most informative feature, because it identifies every training example exactly
        why: Identifying a training row is not the same as predicting its label; a new customer's ID never appeared in training, so all its indicators are 0 [^2].
      - text: It is harmless, because a regularized model automatically ignores columns that do not help
        why: The model can still fit each training row through its own indicator, which is memorization, and the column adds as many features as there are rows.
    explanation: |
      One-hot encoding turns a categorical column into one 0/1 column per category [^1], so an
      all-unique column becomes as many columns as there are rows, each switched on for exactly one
      example. A model can use them to fit every training example individually, while a new customer's
      ID matches none of the columns. d2l removes the `Id` column of its house-price data for this
      reason: it identifies each example but carries no information for prediction [^2]. For columns
      with many but repeated categories, rare values can instead be grouped into one "infrequent"
      category [^3].
    references:
      - source: d2l
        locator: Sec. 2.2.2 Data Preparation
        url: https://d2l.ai/chapter_preliminaries/pandas.html#data-preparation
      - source: d2l
        locator: Sec. 5.7.4 Data Preprocessing
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#data-preprocessing
      - title: 'scikit-learn User Guide: Preprocessing data'
        locator: Sec. 8.3.4.1 Infrequent categories
        url: https://scikit-learn.org/stable/modules/preprocessing.html#infrequent-categories
      - source: d2l
        locator: Sec. 2.2.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_preliminaries/pandas.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/pandas#ex4
      url: https://d2l.ai/chapter_preliminaries/pandas.html#exercises
    status: draft
  - id: data-prep-059
    type: single
    difficulty: medium
    tags:
      - missing-values
      - imputation
      - mnar
    question: |
      A house-price table leaves `GarageArea` blank exactly for the houses that have no garage. Why is
      filling these blanks with the column mean a poor choice?
    options:
      - text: 'It is fine: mean imputation is unbiased whenever fewer than half of the values are missing'
        why: The fraction missing does not matter here; what matters is that the values are missing for a reason linked to their true value [^3].
      - text: 'They are not missing at random: the true value is 0, which the mean misstates'
        correct: true
      - text: Mean imputation shifts the column's mean, which biases every other house's prediction
        why: Filling blanks with the mean leaves the column mean unchanged; the damage is to the houses whose true value is 0.
      - text: pandas cannot compute a mean for a column that still contains blank values
        why: pandas skips missing values when computing the mean, as d2l's `fillna(inputs.mean())` relies on [^1].
    explanation: |
      d2l replaces missing numerical values by the column mean as a simple heuristic [^1][^2], which is
      reasonable when values are missing at random. Here they are missing not at random: the blank
      itself means "no garage", the true value is 0, and the mean (a typical garage) misstates exactly
      those houses [^3]. Better options are to fill in 0 or to add an indicator column marking which
      values were missing, so the model can learn from the missingness [^4].
    references:
      - source: d2l
        locator: Sec. 2.2.2 Data Preparation
        url: https://d2l.ai/chapter_preliminaries/pandas.html#data-preparation
      - source: d2l
        locator: Sec. 5.7.4 Data Preprocessing
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#data-preprocessing
      - title: 'Wikipedia: Missing data'
        locator: Missing not at random
        url: https://en.wikipedia.org/wiki/Missing_data#Missing_not_at_random
      - title: 'scikit-learn User Guide: Imputation of missing values'
        locator: Marking imputed values
        url: https://scikit-learn.org/stable/modules/impute.html#marking-imputed-values
      - source: d2l
        locator: Sec. 5.7.10 Exercises, Exercise 2
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#exercises
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/kaggle-house-price#ex2
      url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#exercises
