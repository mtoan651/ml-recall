  - id: data-prep-086
    type: short_answer
    difficulty: easy
    tags:
      - stratified-k-fold
      - cross-validation
      - class-imbalance
    question: |
      A data set has 90 negative and 10 positive examples. With stratified 5-fold cross-validation, how many
      positive examples does each validation fold contain?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: $10 / 5 = 2$ positives (and $90/5 = 18$ negatives) per fold
    explanation: |
      Stratification keeps the class proportions of the whole data set in every fold, here 10% positives
      [^1][^2]. Each fold has 20 examples, so it gets 2 positives and 18 negatives. Plain random folds could
      by chance contain no positive at all, which would make the recall of that fold undefined and the
      estimate noisy [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-178 and PRB-183, pp. 232–234; Solutions SOL-178 and SOL-183, pp. 289–290
        url: https://arxiv.org/abs/2201.00650v2
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/cross_validation.html#stratified-k-fold
        locator: Cross-validation iterators, Stratified k-fold
    source:
      id: dl-interviews
      ref: ch8#prb183
      url: https://arxiv.org/abs/2201.00650v2
