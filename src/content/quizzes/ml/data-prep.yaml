  - id: data-prep-062
    type: single
    difficulty: easy
    tags:
      - preprocessing
      - feature-transformations
    question: Which of these is NOT a preprocessing (feature transformation) step?
    options:
      - text: Scaling the numeric features
        why: Scaling numeric features is one of the three common preprocessing steps in UBC's CPSC 330 notes [^1].
      - text: Tuning the model's regularization hyperparameter
        correct: true
      - text: Imputing missing values
        why: Imputation, which fills in missing values, is a standard preprocessing step [^1].
      - text: One-hot encoding the categorical features
        why: One-hot encoding turns categories into numeric columns before modelling [^1].
    explanation: |
      Preprocessing changes how the *data* is represented before a model sees it: imputation for
      missing values, scaling for numeric features and one-hot encoding for categorical ones are the
      common examples [^1]. Tuning a regularization hyperparameter changes the *model*, not the
      data; it is hyperparameter optimization, done with cross-validation after the preprocessing
      has been set up in a pipeline [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Common preprocessing techniques'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
