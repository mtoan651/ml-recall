  - id: data-prep-065
    type: multiple
    difficulty: easy
    tags:
      - scaling
      - standardization
      - imputation
    question: Which statements about scaling and imputation are true? Select all that apply.
    options:
      - text: Standardization (subtracting the mean, dividing by the standard deviation) forces every feature into a fixed range such as [0, 1]
        why: Standardization sets each feature's mean to 0 and standard deviation to 1; its minimum and maximum are not fixed. A fixed range is what min-max scaling gives [^1].
      - text: Standardization computes the mean and standard deviation of each feature separately
        correct: true
      - text: It is usually a good idea to scale numeric features before training $k$-NN or RBF SVM models
        correct: true
      - text: After scaling, feature values can be hard for humans to interpret
        correct: true
      - text: Imputing missing values, for example with the column median, changes the shape of the data (assume no column is entirely missing)
        why: Imputation fills in the missing entries; the numbers of rows and columns stay the same [^3].
    explanation: |
      Standardization is applied column by column: each feature gets its own mean and standard
      deviation, so afterwards it has mean 0 and standard deviation 1 [^1]. Distance-based models
      such as $k$-NN and RBF SVMs are sensitive to feature scales, and the course's example shows a
      big improvement for $k$-NN after scaling [^2]. The price is interpretability: a value such as
      1.3 standard deviations above the mean is harder to read than the original units [^4].
      Imputation fills missing values in place [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Scaling (standardization table)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
