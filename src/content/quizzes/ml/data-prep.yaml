      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Imputation'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Importance of scaling'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
