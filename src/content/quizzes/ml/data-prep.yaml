  - id: data-prep-075
    type: single
    difficulty: easy
    tags:
      - target-transform
      - log-transform
      - skewness
    question: |
      You build a linear model to predict house prices. The prices are all positive and strongly
      right-skewed: most houses are cheap, a few are very expensive. What is the usual first
      preprocessing step for the *target*?
    options:
      - text: Fit the model to $\log(\text{price})$ and exponentiate its predictions
        correct: true
      - text: Replace the prices by one-hot encoded price bands
        why: That turns the regression into a classification problem and throws away the ordering and exact values of the target.
      - text: Delete every house priced above the 95th percentile, treating them as outliers
        why: Expensive houses are real data, not errors; dropping them biases the model and leaves it unable to price such houses.
      - text: Min-max scale the prices to the interval $[0, 1]$
        why: A linear rescaling changes the units but not the shape of the distribution, so the skew remains.
    explanation: |
      A log transform compresses the long right tail of a positive, skewed variable, so relative
      (percentage) differences count equally for cheap and expensive houses [^1]. d2l uses exactly this
      idea for Kaggle house prices: errors are measured on the logarithm of the price, because a
      \$100,000 error matters far more for a cheap house than for an expensive one [^2].
    references:
      - title: 'Wikipedia: Data transformation (statistics)'
        url: https://en.wikipedia.org/wiki/Data_transformation_(statistics)#Motivation
        locator: Section "Motivation"
      - source: d2l
        locator: Sec. 5.7 Predicting House Prices on Kaggle (5.7.6 Error Measure)
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html
    source:
      id: ds-interviews
      ref: theory.md#q7
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#linear-regression
    status: draft
  - id: data-prep-076
    type: short_answer
    difficulty: easy
    tags:
      - one-hot-encoding
      - label-encoding
      - categorical-features
    question: |
      A categorical feature `color` takes the values red, green and blue. With label encoding
      (red = 1, green = 2, blue = 3) the distance between red and blue is twice that between red and
      green. With one-hot encoding instead, what is the Euclidean distance between the vectors of any two
      different colors? Give 3 decimals.
    answer:
      numeric: 1.414
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\lVert(1,0,0)-(0,0,1)\rVert = \sqrt{2} \approx 1.414$
    explanation: |
      One-hot vectors differ in exactly two positions, so every pair of categories is $\sqrt{1 + 1} =
      \sqrt{2}$ apart: no category is "closer" to another [^1]. Label encoding instead imposes an
      order and spacing that a linear or distance-based model will take literally [^1][^2]. The cost of
      one-hot encoding is one column per category, which becomes a problem for very high cardinality
      features such as customer IDs [^1].
    references:
      - source: ds-interviews
        locator: theory.md, Classification — "Why do we need one-hot encoding?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/preprocessing.html#encoding-categorical-features
        locator: Sec. 8.3.4 Encoding categorical features
    source:
      id: ds-interviews
      ref: theory.md#q38
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
