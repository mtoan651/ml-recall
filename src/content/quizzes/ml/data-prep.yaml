  - id: data-prep-069
    type: multiple
    difficulty: medium
    tags:
      - feature-selection
      - rfe
      - model-based-selection
    question: |
      You want to keep only the most useful columns of a dataset with many features. Which
      statements about feature selection methods are true? Select all that apply.
    options:
      - text: Simple association-based selection, such as ranking features by their correlation with the target, ignores interactions between features
        correct: true
      - text: With a linear model on scaled features, you can select features by dropping those whose coefficients are close to zero
        correct: true
      - text: Recursive feature elimination removes features in the same order as one ranking of the full model's feature importances
        why: RFE refits the model after every removal and recomputes the importances, which is not the same as removing the least important features in one shot [^2].
      - text: Model-based feature selection can use a $k$-NN classifier to judge which features are important
        why: Model-based selection needs a model that reports feature importances or coefficients; $k$-NN does not [^3].
    explanation: |
      Looking at the correlation of each feature with the target considers one feature at a time,
      and only linear association, so it misses features that matter in combination [^1]. Linear
      models give one coefficient per feature, and on scaled data a coefficient near zero means the
      feature barely affects the prediction, so pruning such features is a simple model-based
      selection [^1][^3]. Recursive feature elimination fits a model, removes the least important
      feature, refits and repeats, so its order can differ from a single ranking [^2]. Model-based
      selection needs importances, which $k$-NN cannot provide [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 12: Feature importances and model transparency — Simple feature correlations; Feature importances in linear models'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/12_feat-importances.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 13: Feature engineering and feature selection — Recursive feature elimination (RFE); RFE algorithm'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/13_feature-engineering-selection.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 13: Feature engineering and feature selection — Model-based selection'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/13_feature-engineering-selection.ipynb
    source:
