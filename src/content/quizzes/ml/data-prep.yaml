  - id: data-prep-074
    type: multiple
    difficulty: medium
    tags:
      - feature-selection
      - forward-selection
      - rfe
    question: |
      You compare feature selection methods: forward selection, backward selection, recursive feature
      elimination (RFE) and exhaustive search. Which statements are true? Select all that apply.
    options:
      - text: Forward selection is guaranteed to find the best feature subset
        why: Forward selection is a greedy search that adds one feature at a time; it can miss the best subset [^1].
      - text: RFE drops the least important feature by the refitted model's importances; backward selection drops the one whose removal scores best
        correct: true
      - text: Exhaustive search over 10 features must score $2^{10} = 1024$ subsets
        correct: true
      - text: Search-and-score methods only work with models that provide feature importances
        why: Search-and-score methods only need a score for a feature set (e.g. cross-validation), so they also work for models without importances [^1].
    explanation: |
      Search-and-score methods define a score $f(S)$ for a feature set and search for the best $S$;
      trying every subset is intractable ($2^d$ sets), so greedy forward or backward selection add
      or remove one feature at a time based on the cross-validation score [^1]. RFE is different: it
      repeatedly fits a model and removes the least important feature according to `coef_` or
      `feature_importances_`, without scoring each candidate removal [^2].
    references:
      - source: ubc-dsci573
        locator: Lecture 4 notes, Search and score methods (General idea; Forward or backward selection)
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/04_feat-importances-selection.ipynb
      - source: ubc-dsci573
        locator: Lecture 4 notes, Recursive feature elimination (RFE); RFE algorithm
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/04_feat-importances-selection.ipynb
    source:
