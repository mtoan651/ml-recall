schema_version: 1
domain: ml
topic: data-prep
title: Data & Features
questions:
  - id: data-prep-001
    type: single
    difficulty: easy
    question: 'A feature variable is:'
    options:
      - text: a general quality of your data
        why: 'Too vague: a feature is a specific measurable attribute recorded for every example, such as a date, size or color [^1].'
      - text: a measurable property of your data
        correct: true
      - text: a single row of your data
        why: A row is one example; the features are the columns [^2].
    explanation: |
      A feature is a measurable property of the data, usually a column such as date, size or color.
      The feature variable (written `X` in code) holds the inputs the model is trained on [^1]. In a
      data table each row is one example and each column is a potential feature or label, so a row
      is not a feature [^2]. "A quality of your data" is too vague: features can be numerical or
      categorical, but each one is an attribute recorded for every example [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#features-and-target
        locator: 'Lesson: Techniques of Machine Learning, Features and Target'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#types_of_data
        locator: 'Datasets: Data characteristics (introduction and Types of data)'
        quote: You can imagine each row of the table as an example and each column as a potential feature or label.
    source:
      id: ms-ml-for-beginners
      ref: quiz-7/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-002
    type: single
    difficulty: easy
    question: Which of these variables is a numeric variable?
    options:
      - text: Height
        correct: true
      - text: Gender
        why: Gender sorts people into groups, so it is a categorical variable; averaging its values has no meaning [^3].
      - text: Hair Color
        why: Hair color names a category rather than measuring an amount, so it is categorical [^3].
    explanation: |
      Height is measured on a numeric scale, so it is quantitative (numerical). ML-For-Beginners' introduction to regression uses predicting a person's height as its example of a numeric value [^1][^2], and statistics
      texts classify height as a continuous numerical variable [^3]. Gender and hair color sort
      people into groups, which makes them categorical (qualitative) variables. Adding or averaging
      their values has no meaning [^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
        locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Height varies continuously, so it is a continuous numerical variable.
    source:
      id: ms-ml-for-beginners
      ref: quiz-9/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-003
    type: single
    difficulty: easy
    question: Which of these variables is a categorical variable?
    options:
      - text: Heart Rate
        why: Heart rate is a measured number of beats per minute, so it is numerical [^1].
      - text: Blood Type
        correct: true
      - text: Weight
        why: Weight is measured on a numeric scale and can be averaged, so it is numerical [^1].
    explanation: |
      Blood type (A, B, AB, O with Rh sign) puts each person into one of a fixed set of groups. A
      variable whose values are categories is categorical (qualitative), and arithmetic such as
      averaging makes no sense for it [^1][^2]. Heart rate and weight are measured as numbers that
      can be added and averaged, which makes them quantitative (numerical) [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Because the responses themselves are categories, state is called a categorical variable
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/categorical-data
        locator: Working with categorical data (introduction)
        quote: Categorical data has a specific set of possible values.
    source:
      id: ms-ml-for-beginners
      ref: quiz-9/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-004
    type: single
    difficulty: easy
    question: 'The process of identifying significant features from a set of features is called:'
    options:
      - text: Feature Extraction
        why: Feature extraction creates new features as functions of the original ones instead of keeping a subset [^1].
      - text: Feature Dimensionality Reduction
        why: Working with fewer inputs is the broader goal; selection and extraction are both ways to reach it [^2].
      - text: Feature Selection
        correct: true
    explanation: |
      Feature selection keeps a subset of the original features, the ones that matter most, without
      changing them [^1][^2]. Feature extraction is different: it creates new features as functions
      of the original ones [^1]. Dimensionality reduction is the broader goal of working with fewer
      inputs. Both selection and extraction can serve that goal, so it is not the name for picking
      out the significant features [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#selecting-your-feature-variable
        locator: 'Lesson: Techniques of Machine Learning, Selecting your feature variable'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/feature_selection.html
        locator: Sec. 1.13 Feature selection
    source:
      id: ms-ml-for-beginners
      ref: quiz-10/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-005
    type: single
    difficulty: easy
    question: What's the best reason to balance your data?
    options:
      - text: Imbalanced data looks bad in charts and other visualizations
        why: Balancing changes what the model learns from, not how the data looks in a chart [^1].
      - text: It yields better results because the model won't skew towards one class
        correct: true
      - text: Balancing your data always gives you more data points to train on
        why: Balancing can also remove majority-class examples (downsampling); even oversampling with SMOTE adds points only to equalize the classes [^1][^2].
    explanation: |
      When one class dominates, a model sees many more examples of it and learns to predict it more
      often just because it is common. Balancing removes that skew so the minority classes are
      learned properly [^1][^2]. Balancing has nothing to do with how charts look. Its purpose is
      also not to gather more data: oversampling with SMOTE does add synthetic points, but only to
      equalize the classes [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
        locator: 'Lesson: Classification 1, Balance the dataset'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets#the_difficulty_of_training_severely_class-imbalanced_datasets
        locator: 'Datasets: Class-imbalanced datasets, The difficulty of training severely class-imbalanced datasets'
    source:
      id: ms-ml-for-beginners
      ref: quiz-20/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-006
    type: single
    difficulty: easy
    question: What is one example of a strategy for cleaning data?
    options:
      - text: removing columns/rows that aren't useful for answering a specific question
        correct: true
      - text: getting rid of verified values that don't fit your hypothesis
        why: Deleting correct values because they contradict your hypothesis biases the analysis; it is not cleaning [^2].
      - text: moving the outliers to a separate table and running the calculations for that table to see if they match
        why: Copying the outliers into another table and rerunning the numbers neither fixes nor removes anything, so it does not clean the data.
    explanation: |
      Dropping columns or rows that do not help answer the question at hand is a standard cleaning
      step. In ML-For-Beginners' hotel-review NLP lesson, columns such as `lat` and `lng` are dropped, and only the tags
      that help recommend a hotel are kept [^1]. Deleting verified values just because they
      contradict your hypothesis biases the analysis, and throwing away important examples hurts the
      model [^2]. Copying outliers into a separate table and rerunning the calculations is not a
      recognized cleaning strategy.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/5-Hotel-Reviews-2/README.md#exercise-a-bit-more-data-processing
        locator: 'Lesson: NLP 5, Exercise: a bit more data processing (and Filtering tags)'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#complete_vs_incomplete_examples
        locator: 'Datasets: Data characteristics, Complete vs. incomplete examples'
        quote: It's fine to delete useless or redundant examples, but it's bad to delete important examples.
    source:
      id: ms-ml-for-beginners
      ref: quiz-39/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-007
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - feature-scaling
    question: Why are input features normalized (rescaled) before training?
    options:
      - text: To create more training examples
        why: That is data augmentation.
      - text: To put the features on comparable scales
        correct: true
      - text: To split the data into training and test sets
        why: Splitting is a separate step.
      - text: To evaluate the model
        why: Evaluation uses metrics on held-out data.
    explanation: Standardizing each feature as $(x - \mu)/\sigma$, with $\mu$ and $\sigma$ estimated on the training data only, stops large-range features from dominating and makes optimization better behaved [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 61
      - source: d2l
        locator: Sec. 5.7 Predicting House Prices on Kaggle
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q03
    status: reviewed
    reviewed_by: owner
  - id: data-prep-008
    type: single
    difficulty: easy
    question: Which of the following is an example of non-structured data?
    options:
      - text: List of students in class
        why: A class list is a table where every row has the same columns, which is structured data [^2].
      - text: Collection of student essays
        correct: true
      - text: Graph of friends of social network users
        why: A friendship graph has some structure, but one that varies between sources; Data Science for Beginners lists social-network graphs as semi-structured [^1].
    explanation: |
      Essays are free text with no fixed rows and columns, which makes them unstructured data, like
      the text files and shares of corporate documents that Data Science for Beginners gives as examples [^1][^2]. A class
      list is structured: a table where every row has the same columns [^2]. A friendship graph sits in
      between: the same course lists social-network graphs as semi-structured data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#types-of-data
        locator: 'Lesson: Defining Data Science, Types of Data and Where to get Data'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#unstructured-data
        locator: 'Lesson: Defining Data, Structured Data and Unstructured Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-009
    type: single
    difficulty: easy
    question: Which of these could be quantitative data?
    options:
      - text: A folder of photos of dogs
        why: Photos are images that capture qualities, not measured amounts, so they are qualitative [^1].
      - text: Written hotel reviews
        why: Reviews are free text, a typical example of qualitative data [^1].
      - text: Student’s marks or grades
        correct: true
    explanation: |
      Quantitative data are numerical observations that can be measured and used in calculations, so
      numeric marks can be added, averaged and compared [^1][^2]. Photos and hotel reviews are images
      and free text. They describe qualities rather than measure amounts, so they count as
      qualitative data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data and Qualitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: it is sensible to add, subtract, or take averages with those values
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-010
    type: single
    difficulty: easy
    question: Which of these could be qualitative data?
    options:
      - text: List of employees' salaries
        why: Salaries are numbers you can add and average, so they are quantitative [^1][^2].
      - text: Hotel reviews
        correct: true
      - text: Students' exam scores out of 100
        why: Scores out of 100 are numerical measurements, so they are quantitative [^1][^2].
    explanation: |
      Qualitative data record qualities that cannot be measured objectively, and written comments
      such as hotel reviews are a typical example [^1]. Salaries and exam scores are numbers that
      you can sensibly add or average, so they are quantitative (numerical) [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#qualitative-data
        locator: 'Lesson: Defining Data, Qualitative Data and Quantitative Data'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-011
    type: single
    difficulty: easy
    question: A teacher is reviewing the number of correct answers each student got. What type of data is that?
    options:
      - text: Qualitative data
        why: A count of correct answers is a number on which arithmetic makes sense, so it is not qualitative [^1].
      - text: Quantitative data
        correct: true
      - text: Both qualitative and quantitative data
        why: 'The count has no qualitative part: it is a discrete numerical variable [^1].'
    explanation: |
      The number of correct answers is a count. Counts are numerical variables, more precisely
      discrete ones, because they take whole-number values on which arithmetic makes sense [^1].
      Numerical observations like these are what Data Science for Beginners calls quantitative data [^2]. That rules
      out qualitative data, and "both" fails because this variable is not qualitative at all.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
        locator: Sec. 1.2.2 Types of variables
        quote: Because the number of siblings is a count, it is discrete.
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
        locator: 'Lesson: Defining Data, Quantitative Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-012
    type: single
    difficulty: easy
    question: Which one of these is part of the data preparation process?
    options:
      - text: Model validation
        why: Validation evaluates a trained model, which comes after the data has been prepared [^2].
      - text: Classification
        why: Classification is a modelling task carried out on prepared data, not a preparation step [^2].
      - text: Cleaning
        correct: true
    explanation: |
      Data preparation turns raw, "dirty" data into something usable, and cleaning (handling missing,
      inaccurate or duplicated values) is its core step [^1]. Classification and model validation come
      later. They belong to building and evaluating a model once the data are ready [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson: Data Preparation, introduction and Common cleaning goals and strategies'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#building-a-model
        locator: 'Lesson: Techniques of Machine Learning, Building a model / Evaluate the model'
    source:
      id: ms-ds-for-beginners
      ref: quiz-14/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-013
    type: true_false
    difficulty: easy
    question: Merging or joining two datasets into one can affect consistency in data
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Sources follow different conventions for dates, numbers and whitespace, and joins can bring in duplicates, so merging can create inconsistencies [^1].
    explanation: |
      Datasets from different sources often follow different conventions, such as date formats,
      number formats or whitespace. Joining them can therefore produce inconsistent values unless each
      one is standardized first, and Data Science for Beginners' data-preparation lesson gives consistency as a reason to clean data for exactly
      this case [^1]. Joins can also bring in duplicate records, which is another cleaning problem [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#the-importance-of-cleaning-data
        locator: 'Lesson: Data Preparation, The importance of cleaning data (Consistency) and Common cleaning goals and strategies (Formatting, Duplications)'
    source:
      id: ms-ds-for-beginners
      ref: quiz-15/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-014
    type: single
    difficulty: easy
    question: What's the first thing that should be done when faced with missing data?
    options:
      - text: Delete it
        why: Deleting right away can bias the results or throw away important examples; the right fix depends on why the values are missing [^1][^2].
      - text: Assess why it's missing
        correct: true
      - text: Try to fill in empty values
        why: Filling in values before you know why they are missing can introduce wrong values; the reason decides whether to fill, reload or remove [^1].
    explanation: |
      Data go missing for many reasons, and the right fix (reloading, filling in values, or removing
      rows) depends on how and why the values went missing [^1]. Deleting or imputing right away can
      bias the results or throw away important examples, so first find out why the data are missing
      [^1][^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
        locator: 'Lesson: Data Preparation, Common cleaning goals and strategies (Missing Data)'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#complete_vs_incomplete_examples
        locator: 'Datasets: Data characteristics, Complete vs. incomplete examples'
    source:
      id: ms-ds-for-beginners
      ref: quiz-15/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-015
    type: true_false
    difficulty: easy
    question: 'A machine learning model can train *directly* on raw string values, like "Red" and "Black", without converting these values to numerical vectors.'
    options:
      - text: 'True'
        why: During training, a model can only manipulate floating-point numbers. The string `"Red"` is not a floating-point number. You must convert strings like `"Red"` to floating-point numbers.
      - text: 'False'
        correct: true
    explanation: |
      A model can only manipulate floating-point numbers, so a string such as "Red" has to be
      converted before training [^1]. The usual route maps each possible string to an index in a
      vocabulary and then to a one-hot vector, and it is the one-hot vector that the model receives
      [^1]. Feeding in the bare index would not work well either: the model would treat it as a
      continuous value, as if one color were several times "larger" than another [^1].
    references:
      - source: google-mlcc
        locator: 'Categorical data: Vocabulary and one-hot encoding (Index numbers; One-hot encoding)'
        url: https://developers.google.com/machine-learning/crash-course/categorical-data/one-hot-encoding
    source:
      id: google-mlcc
      ref: categorical-data/one-hot-encoding#q1
      url: https://developers.google.com/machine-learning/crash-course/categorical-data/one-hot-encoding
    status: reviewed
    reviewed_by: claude
  - id: data-prep-016
    type: single
    difficulty: easy
    question: Which technique would be most suitable for normalizing a feature with the distribution shown below?
    figure:
      src: ./data-prep/data-prep-016.svg
      alt: Histogram of a feature whose values range from 0 to about 200,000, rising gradually to a peak around 100,000 and falling off gradually on the other side.
    options:
      - text: Z-score scaling
        correct: true
      - text: Linear scaling
        why: Linear scaling suits features spread roughly uniformly between stable bounds, such as age [^1]. This feature is bell-shaped.
      - text: Log scaling
        why: Log scaling suits power-law or heavily skewed features, such as book sales [^1]. This histogram is roughly symmetric.
      - text: Clipping
        why: Clipping caps extreme outliers [^1]. This feature has no extreme outliers, just a bell-shaped spread.
    explanation: |
      The histogram rises to a single peak near the middle and falls off about evenly on both
      sides, so the feature roughly follows a normal distribution. Z-score scaling,
      $(x - \mu)/\sigma$, is the technique for such features [^1]. It does not cap anything, but
      in a normal distribution about 99.7% of the values lie within three standard deviations of
      the mean, so after scaling almost all of them fall between $-3$ and $+3$ [^1].
    references:
      - source: google-mlcc
        locator: 'Numerical data: Normalization'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    source:
      id: google-mlcc
      ref: numerical-data/normalization#q1
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    status: reviewed
    reviewed_by: claude
  - id: data-prep-017
    type: single
    difficulty: medium
    question: |
      Suppose you are developing a model that predicts a data center's productivity based on the temperature measured inside the data center. Almost all of the `temperature` values in your dataset fall between 15 and 30 (Celsius), with the following exceptions:

      * Once or twice per year, on extremely hot days, a few values between
      31 and 45 are recorded in `temperature`.
      * Every 1,000th point in `temperature` is set to 1,000
      rather than the actual temperature.

      Which would be a reasonable normalization technique for `temperature`?
    options:
      - text: Clip the outlier values between 31 and 45, but delete the outliers with a value of 1,000
        correct: true
      - text: Clip all the outliers
        why: The values of 1,000 are recording errors, not temperatures; clipping would keep those examples with a made-up value, so they should be deleted [^1].
      - text: Delete all the outliers
        why: The 31–45 °C readings are real hot days; deleting them throws away legitimate data, and clipping them is enough [^1].
      - text: Delete the outlier values between 31 and 45, but clip the outliers with a value of 1,000
        why: 'This is backwards: the 31–45 values are legitimate and should be kept (clipped), while the 1,000 values are mistakes to delete [^1].'
    explanation: |
      Clipping caps extreme values at a chosen limit, which reduces their influence while keeping the
      examples [^1]. The values of 1,000 are mistakes, not temperatures, so they should be deleted
      rather than clipped [^1]. The values between 31 and 45 are legitimate data points; clipping them
      is reasonable when there are too few hot days to learn that range well, at the cost that the
      model then makes the same prediction for 45 °C as for 35 °C [^1].
    references:
      - source: google-mlcc
        locator: 'Numerical data: Normalization (Clipping; Exercise: Test your knowledge, question 2)'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    source:
      id: google-mlcc
      ref: numerical-data/normalization#q2
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
    status: reviewed
    reviewed_by: claude
  - id: data-prep-018
    type: single
    difficulty: medium
    question: The plot below shows the median home price for each 0.2 degrees of latitude in the mythical country of Freedonia. The relationship is nonlinear, so representing latitude as a single floating-point feature is unlikely to help a model make good predictions. Perhaps bucketing latitudes would be a better idea? What would be the best bucketing strategy?
    figure:
      src: ./data-prep/data-prep-018.svg
      alt: Scatter plot of median house value (about 330 to 710) against latitude from 41.0 to 44.8 in steps of 0.2. Values are low around 41, jump to about 700 near 42.2–42.4, drop to about 410 around 43, rise again to about 710 at 44.0 and end between 510 and 570.
    options:
      - text: Don't bucket.
        why: The stem itself says that a single floating-point latitude is unlikely to help, because the relationship is nonlinear. Leaving it unbucketed ignores the four flat regions the plot shows.
      - text: |
          Create four buckets:

          * 41.0 to 41.8
          * 42.0 to 42.6
          * 42.8 to 43.4
          * 43.6 to 44.8
        correct: true
      - text: Make each data point its own bucket.
        why: Twenty one-point buckets give the model a separate weight for every 0.2° strip, so it memorizes noise between neighbouring strips instead of learning the four regions, and it needs many examples in every strip.
    explanation: |
      Binning helps when the relationship between a feature and the label is nonlinear: each bin
      becomes its own feature with its own weight, so the model can learn a different value for
      each range [^1]. Here the median price is roughly flat within four latitude ranges — low
      from 41.0 to 41.8, high from 42.0 to 42.6, low again from 42.8 to 43.4 and high from 43.6 to
      44.8 — so four buckets with exactly those boundaries capture the pattern with only four
      weights. Google's own key for this quiz is "Don't bucket", arguing that the plot is mostly
      random and that some bins hold few examples; but each point is already a median over many
      homes, and the plot shows clear plateaus, so we key the four buckets. Each bucket still needs
      enough training examples, which is the caveat Google raises [^1].
    references:
      - source: google-mlcc
        locator: 'Numerical data: Binning'
        url: https://developers.google.com/machine-learning/crash-course/numerical-data/binning
    source:
      id: google-mlcc
      ref: numerical-data/binning#q1
      url: https://developers.google.com/machine-learning/crash-course/numerical-data/binning
    status: reviewed
    reviewed_by: claude
  - id: clustering-012
    type: single
    difficulty: medium
    question: Assume you have enough data to create quantiles. How should you process the data distribution shown below?
    figure:
      src: ./data-prep/clustering-012.svg
      alt: Histogram that rises sharply to a peak at small values (around 3 to 4) and then falls off in a long tail to the right, reaching past 25.
    options:
      - text: Create quantiles.
        correct: true
      - text: Normalize.
        why: |
          You typically normalize data if:

          * The data distribution is Gaussian.
          * You have some insight into what the data represents in the real world that suggests the data shouldn't be transformed nonlinearly.

          Neither case applies here. The data distribution isn't Gaussian because it isn't symmetric. And you don't know what these values represent in the real world.
      - text: Log transform.
        why: This isn't a perfect power-law distribution, so don't use a log transform.
    explanation: |
      The histogram rises steeply and then has a long right tail, so it is neither symmetric like a
      Gaussian nor a clean power law [^1]. Google's clustering course uses z-score normalization for
      roughly Gaussian data and a log transform only for data that follow a power law; when the data
      match no standard distribution, the default is to bin them into quantiles, which needs enough
      data (at least about 10 examples per quantile) [^1]. With quantiles, two examples are similar when
      few examples fall between them, whatever their raw values [^1].
    references:
      - source: google-ml-courses
        locator: Clustering, Data preparation (Quantiles; Check your understanding, question one)
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
      ref: clustering/prepare-data#q1
      url: https://developers.google.com/machine-learning/clustering/prepare-data
    status: reviewed
    reviewed_by: claude
  - id: clustering-013
    type: single
    difficulty: easy
    question: Assume you have enough data to create quantiles. How would you process the data distribution shown below?
    figure:
      src: ./data-prep/clustering-013.svg
      alt: Histogram of a symmetric, bell-shaped distribution centred at 0, spanning about −15 to 15.
    options:
      - text: Normalize.
        correct: true
      - text: Create quantiles.
        why: Quantiles are the default for data that match no standard distribution; this one is Gaussian, so normalization is preferred [^1].
      - text: Log transform.
        why: A log transform is only for power-law distributions, and this one is a symmetric bell [^1].
    explanation: |
      The histogram is symmetric and bell-shaped, so the data are roughly Gaussian. For data shaped
      like a Gaussian, the recommended transform is normalization: compute z-scores [^1]. Quantiles
      are the default when the data do not match any known distribution, and a log transform is
      meant for data that follow a power law [^1].
    references:
      - source: google-ml-courses
        locator: Clustering, Data preparation (Z-scores; Check your understanding, question two)
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
      ref: clustering/prepare-data#q2
      url: https://developers.google.com/machine-learning/clustering/prepare-data
    status: reviewed
    reviewed_by: claude
  - id: data-prep-019
    type: single
    difficulty: easy
    question: Why does the name *Data Science* contain the word *science*?
    options:
      - text: Because it uses scientific methods to analyze data
        correct: true
      - text: Because it only studies data produced by laboratory experiments
        why: Data science works with data from many domains and sources, such as surveys, sensors, texts or images, not only lab experiments [^1].
      - text: Because it is the branch of computer science that stores data
        why: Storing data is the concern of a related field, databases; data science is about extracting knowledge from data [^1].
    explanation: |
      Data science is defined as a field that uses scientific methods, such as probability and
      statistics, to extract knowledge and insights from structured and unstructured data [^1].
      It is not limited to experimental data: it works across application domains such as
      finance, medicine or marketing, with data from surveys, sensors, texts or images [^1].
      Storing data is the concern of a related field, databases; data science is about drawing
      knowledge from the data [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-is-data-science
        locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and Other Related Fields'
    source:
      id: ms-ds-for-beginners
      ref: quiz-0/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-020
    type: single
    difficulty: easy
    question: |
      Data science overlaps with several related fields. Which one deals with storing and
      processing very large quantities of data, usually with a simple structure, in a
      distributed way on a cluster of computers?
    options:
      - text: Big data
        correct: true
      - text: Machine learning
        why: Machine learning builds predictive models from data; it is not defined by distributed storage [^1].
      - text: Artificial intelligence
        why: AI builds high-complexity models, often to turn unstructured data into structured insights, rather than storing data at scale [^1].
      - text: Visualization
        why: Visualization makes large data understandable to people; it does not store or process the data on a cluster [^1].
    explanation: |
      Data Science for Beginners lists databases, big data, machine learning, artificial intelligence and
      visualization as fields related to data science [^1]. Big data is the one about storing and
      processing very large quantities of relatively simply structured data, distributed over a
      computer cluster; data lakes are a typical storage for it [^1]. Machine learning builds
      predictive models from data, AI builds high-complexity models that often turn unstructured
      data into structured insights, and visualization makes large data understandable to people,
      so none of them is defined by distributed storage [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#other-related-fields
        locator: 'Lesson 1: Defining Data Science, sec. Other Related Fields and What you can do with Data (Data Storage)'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-021
    type: single
    difficulty: easy
    question: What is the main goal of data science?
    options:
      - text: to collect as much data as possible
        why: Acquiring data is only the first step of the data journey; more data is not the goal in itself [^1].
      - text: to convert data into a clean, structured form
        why: Cleaning and structuring the data is processing, a step that serves the goal of data-driven decisions [^1].
      - text: to make decisions based on data
        correct: true
    explanation: |
      Data Science for Beginners states that the ultimate goal of data science is to be able to make decisions
      based on data: it extracts knowledge from data and turns it into actionable insights that
      can be applied to real situations [^1]. Collecting data and processing it into a usable form
      are steps of the data journey (acquisition, storage, processing) that serve this goal, not
      the goal itself [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-you-can-do-with-data
        locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and What you can do with Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-1/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-022
    type: single
    difficulty: easy
    question: |
      Why do data scientists first classify a dataset's data, for example as quantitative or
      qualitative, and as structured, semi-structured or unstructured?
    options:
      - text: To compress it so that it takes less storage space
        why: Classifying data by type and structure does not change how much space it takes.
      - text: To give every column a proper name
        why: Naming columns is a separate tidying task; classifying the data is about what kind of data you have and how it is organized [^1].
      - text: To know how best to organize and analyze it
        correct: true
    explanation: |
      Raw data has to be organized into a form that people and tools can analyze, and its
      structure (structured, semi-structured or unstructured) describes how it is organized [^1].
      The type also tells you which operations make sense: quantitative data can be measured and
      used mathematically, while qualitative data is not, even when it consists of digits such as
      phone numbers [^1]. Classifying data neither compresses nor renames it; it guides how you
      organize and analyze it.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#how-data-is-described
        locator: 'Lesson 3: Defining Data, sec. How Data is Described'
    source:
      id: ms-ds-for-beginners
      ref: quiz-4/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-023
    type: single
    difficulty: easy
    question: A company is collecting surveys from their customers to improve their products. What type of data source is this?
    options:
      - text: Primary
        correct: true
      - text: Secondary
        why: Secondary data was collected by someone else for general use; the company collected these answers itself [^1].
      - text: Tertiary
        why: Data Science for Beginners distinguishes only primary and secondary data sources [^1].
    explanation: |
      Data generated by its own users, collected first-hand for the purpose at hand, is primary
      data; secondary data comes from a source that collected it for general use [^1]. The company
      designs and runs the survey itself, so the answers are primary data; they would be secondary
      data for another organization that later reused them [^1]. "Tertiary" is not one of the
      kinds of data source in this classification.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
        locator: 'Lesson 3: Defining Data, sec. Sources of Data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-024
    type: single
    difficulty: easy
    question: |
      A student explores a data source by sending it SQL queries such as
      `SELECT name FROM students WHERE age > 20`. What kind of data source is it?
    options:
      - text: Local Files
        why: Local files such as spreadsheets or images are opened directly, not explored with SQL queries [^1].
      - text: API
        why: An API shares data over the internet through requests defined by its provider, not through SQL statements [^1].
      - text: Database
        correct: true
    explanation: |
      Databases are hosted by a database management system, and users explore them with commands
      called queries [^1]; SQL is the standard language for retrieving and modifying data in a
      relational database [^2]. Local files such as spreadsheets or images are opened directly, and
      an API shares data over the internet through requests defined by its provider rather than
      SQL statements [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
        locator: 'Lesson 3: Defining Data, sec. Sources of Data'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#retrieving-the-data
        locator: 'Lesson 5: Relational Databases, sec. Retrieving the data'
    source:
      id: ms-ds-for-beginners
      ref: quiz-5/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-025
    type: single
    difficulty: easy
    question: 'A relational database usually consists of:'
    options:
      - text: one table that holds all the data
        why: One table repeats the same information on many rows; a relational database spreads it over several tables [^1].
      - text: one spreadsheet with several tabs
        why: The tabs of a workbook are not linked through primary and foreign keys, which is what makes a database relational [^1].
      - text: many tables linked to each other by keys
        correct: true
    explanation: |
      A relational database is built on tables of rows and columns, like a spreadsheet, but it
      spreads the information across multiple tables [^1]. The tables are linked through keys:
      each row has a primary key, and other tables refer to it with a foreign key, so the data can
      be joined back together for analysis [^1]. Keeping everything in one table repeats the same
      data on many rows, which is what splitting it into related tables avoids [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, introduction and sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-8/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-026
    type: single
    difficulty: easy
    question: |
      In a relational database, how do you avoid repeating the same information, such as a
      city's name and country, on many rows?
    options:
      - text: Split the data into tables that refer to each other through keys
        correct: true
      - text: Add a new column for every year instead of a new row
        why: This avoids repeating the city, but the table's structure must change every new year and calculations become harder [^1].
      - text: Keep all the data in one big table
        why: One big table repeats the city's name and country on every row, which is exactly the problem [^1].
      - text: Copy the data into several unrelated tables
        why: Copies in unrelated tables still duplicate the data, and without keys they cannot be joined back [^1].
    explanation: |
      Storing yearly rainfall for each city in one table repeats the city's name and country on
      every row, which wastes storage [^1]. Adding a column for each year avoids that repetition,
      but the table's structure must change every new year and calculations become harder [^1].
      The relational solution keeps the cities in their own table with an ID (the primary key) and
      stores the rainfall in a second table that refers to that ID (a foreign key), so each fact is
      stored once [^1]. Copying data into unrelated tables would still duplicate it.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-shortcomings-of-a-single-table-approach
        locator: 'Lesson 5: Relational Databases, sec. The shortcomings of a single table approach and The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-8/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-027
    type: single
    difficulty: easy
    question: 'In a relational database, a primary key is:'
    options:
      - text: a value used to identify one specific row in a table
        correct: true
      - text: a column whose values point to rows of another table
        why: A column whose values point to rows of another table is a foreign key [^1].
      - text: a value that sets the order in which the rows are stored
        why: A primary key identifies one row; it does not decide the order in which rows are stored.
    explanation: |
      A primary key is a value used to identify one specific row in a table, usually an
      auto-generated number that never changes [^1]. A column whose values point to rows of
      another table is a foreign key, the primary key of another table used as a reference [^1].
      The primary key identifies rows; it does not define the order in which they are stored.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-9/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-028
    type: true_false
    difficulty: easy
    question: |
      An auto-generated numeric ID column is usually a better primary key than a descriptive
      value such as a city's name.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Names can change or be spelled differently, which would break every reference to them; an auto-generated ID never changes [^1].
    explanation: |
      A primary key could be based on a value itself, such as the city name, but it should almost
      always be a number or other identifier, and in most cases it is an auto-generated number [^1].
      The key must never change, because other tables refer to it and a change would break those
      relationships; names can change or be spelled differently, an auto-generated ID does not [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
      id: ms-ds-for-beginners
      ref: quiz-9/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-2.json
    status: reviewed
    reviewed_by: claude
  - id: data-prep-029
    type: single
    difficulty: easy
    question: In a relational database, what is a foreign key?
    options:
      - text: A column whose values are the IDs (primary keys) of rows in another table
        correct: true
      - text: A column that copies text, such as names, from another table
        why: Copying names would duplicate data; a foreign key stores the other table's ID instead [^1].
      - text: A column that keeps the history of values that change over time
        why: A foreign key links rows of two tables; it does not record how values change over time [^1].
      - text: The column that identifies each row of its own table
        why: The column that identifies each row of its own table is the primary key [^1].
    explanation: |
      In the rainfall example, the `city_id` column of the rainfall table holds values that
      reference the IDs in the cities table; such a column is a foreign key, the primary key of
      another table used as a pointer [^1]. It stores IDs instead of copying names, which is how
      the design avoids duplication, and it says nothing about history over time [^1]. The column
      that identifies each row of its own table is that table's primary key [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
        locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
    source:
