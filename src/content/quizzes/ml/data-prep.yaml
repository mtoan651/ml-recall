  - id: data-prep-082
    type: single
    difficulty: easy
    tags:
      - ordinal-encoding
      - unseen-categories
      - scikit-learn
    question: |
      You fit scikit-learn's `OrdinalEncoder` on the categorical columns of the training data and then
      call `transform` on the validation data, which raises an error. What is the most likely cause?
    options:
      - text: The validation data has categories never seen in training
        correct: true
      - text: The validation data has fewer rows than the training data had
        why: The encoder maps each value independently, so the number of rows does not matter [^1].
      - text: The categories have no natural order, which ordinal encoding requires
        why: The encoder assigns integers to any categories, ordered or not; it simply assumes an order [^2].
      - text: The encoder has to be fit on the validation data as well, separately
        why: Fitting a second encoder would map the same category to different integers in the two sets; preprocessing should be fit on training data only [^3].
    explanation: Fitting an ordinal encoder assigns an integer to each unique value that appears in the training data; a validation value that never appeared has no integer, so `transform` fails [^1]. In Kaggle's housing-price exercise, `'Condition2'` has values in the validation data that are absent from training [^1]. Simple fixes are dropping such columns or a custom encoder; `OneHotEncoder` offers `handle_unknown='ignore'` for the same problem [^2].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 3 exercise, Step 2 Ordinal encoding, Part A (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex3.py
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 3 Categorical Variables — tutorial, Ordinal Encoding; Score from Approach 3
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_intermediate/raw/tut3.ipynb
