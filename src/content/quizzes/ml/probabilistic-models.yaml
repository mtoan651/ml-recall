  - id: probabilistic-models-032
    type: single
    difficulty: medium
    tags:
      - hmm
      - viterbi
      - complexity
      - decoding
    question: |
      To decode an HMM with $n$ states and an observation sequence of length $T$, a brute-force
      method enumerates every hidden state sequence, scores each one by computing $P(O, Q)$, and keeps
      the best. What are the time complexities of this method and of the Viterbi algorithm, ignoring
      constants?
    options:
      - text: Brute force $O(n^2 T)$, Viterbi $O(T n^T)$
        why: This swaps the two. Enumerating sequences is the exponential method; Viterbi is the dynamic-programming one [^1].
      - text: Both $O(n^T)$, because Viterbi must also consider every hidden sequence
        why: Viterbi never lists whole sequences; at each step it keeps only the best path into each state [^1].
      - text: Brute force $O(T n^T)$, Viterbi $O(n^2 T)$
        correct: true
      - text: Brute force $O(T n^T)$, Viterbi $O(nT)$, since it keeps one best state per time step
        why: Viterbi keeps one best path per *state*, and finding it means comparing all $n$ predecessors for each of the $n$ states, which is $n^2$ work per step [^1].
    explanation: |
      There are $n^T$ hidden sequences and scoring one takes $O(T)$ multiplications, so brute force
      costs $O(T n^T)$ [^2]. Viterbi fills a trellis of $n \times T$ cells; each cell takes the
      maximum of $\delta_i(t-1)\,a_{ij}$ over the $n$ previous states, so the total is $O(n^2 T)$,
      the same order as the forward algorithm [^1][^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 4: More HMMs — 1.3 Viterbi: Induction; (Optional) Exercise 4.2: More practice questions'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
      - source: ubc-dsci575
