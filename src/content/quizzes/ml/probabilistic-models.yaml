  - id: probabilistic-models-016
    type: true_false
    difficulty: medium
    tags:
      - gaussian-processes
      - product-of-gaussians
      - kernels
    shuffle: false
    question: |
      True or false: if $f \sim \mathcal{GP}(m_1, k_1)$ and $g \sim \mathcal{GP}(m_2, k_2)$ are
      independent, then the product $u(x) = f(x)g(x)$ is also a Gaussian process.
    options:
      - text: 'True'
        why: Even at a single input, the product of two independent Gaussians is not Gaussian, so $u$ cannot be a GP [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      A GP needs every finite set of values to be jointly Gaussian. Already one value fails: for two
      independent standard normals, $XY$ has the density $K_0(|z|)/\pi$, peaked at 0 and
      heavy-tailed [^2]. The product does have a mean, $m_1 m_2$, and a covariance,
      $k_1 k_2 + m_1(x)m_1(x')\,k_2 + m_2(x)m_2(x')\,k_1$, but these do not make it Gaussian. For
      zero means the covariance is $k_1 k_2$, and the product of two kernels is a valid kernel, but
      the GP with that kernel is a different process from $fg$ [^1].
    references:
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 4.2.4 Making New Kernels from Old (product, footnote 8), p. 95
        url: http://gaussianprocess.org/gpml/chapters/RW4.pdf
      - title: 'Wikipedia: Product distribution'
        locator: Special cases, Independent central-normal distributions
        url: https://en.wikipedia.org/wiki/Product_distribution
      - source: d2l
        locator: Sec. 18.2.7 Exercises, Exercise 5
        url: https://d2l.ai/chapter_gaussian-processes/gp-priors.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-priors#ex5
      url: https://d2l.ai/chapter_gaussian-processes/gp-priors.html#exercises
