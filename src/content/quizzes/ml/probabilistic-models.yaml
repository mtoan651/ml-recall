  - id: probabilistic-models-025
    type: short_answer
    difficulty: medium
    tags:
      - markov-chains
      - stationary-distribution
    question: |
      In 1913 Markov modelled the letters of a novel as a two-state chain over {vowel, consonant},
      with transition probabilities (rows = current letter, columns = next letter):

      | | vowel | consonant |
      | --- | ---: | ---: |
      | **vowel** | 0.552 | 0.448 |
      | **consonant** | 0.365 | 0.635 |

      What is the stationary probability of a vowel?
    answer:
      numeric: 0.449
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $\pi_v \cdot 0.448 = \pi_c \cdot 0.365$ and $\pi_v + \pi_c = 1$, so $\pi_v = \frac{0.365}{0.448 + 0.365} \approx 0.449$
    explanation: |
      A stationary distribution satisfies $\pi T = \pi$ [^1]. For two states this reduces to a
      balance condition: in the long run the probability flow from vowels to consonants,
      $\pi_v \cdot 0.448$, equals the flow back, $\pi_c \cdot 0.365$. With $\pi_v + \pi_c = 1$ this
      gives $\pi_v = 0.365 / 0.813 \approx 0.449$ and $\pi_c \approx 0.551$, matching the
      distribution Markov derived from his letter counts [^2]. You can check it:
      $0.449 \cdot 0.552 + 0.551 \cdot 0.365 \approx 0.449$.
    references:
      - source: ubc-dsci575
        locator: 'Lecture 1: Markov Models — 4. Markov chains tasks: Stationary distribution'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/01_Markov-models.ipynb
