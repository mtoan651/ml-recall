  - id: probabilistic-models-026
    type: multiple
    difficulty: medium
    tags:
      - hmm
      - emission-probabilities
      - conditional-independence
    question: |
      An HMM models a person's mood (hidden states: happy, sad) from the activity they are observed
      doing (learn, eat, cry, social media). Which statements are true? Select all that apply.
    options:
      - text: The emission probabilities give the probability of being happy or sad given the observed activity
        why: It is the other way round. Emissions are $P(\text{activity} \mid \text{mood})$, for example $P(\text{learn} \mid \text{happy}) = 0.7$; the probability of a mood given activities is what we infer [^1].
      - text: The observation at time $t$ is conditionally independent of earlier observations and earlier hidden states, given the hidden state at time $t$
        correct: true
      - text: Given the hidden state at time $t-1$, the hidden state at time $t$ is conditionally independent of the earlier hidden states and observations
        correct: true
      - text: Each hidden state has a probability distribution over all possible observations
        correct: true
    explanation: |
      An HMM is specified by states, an output alphabet, an initial distribution $\pi$, a transition
      matrix $T$ and emission probabilities $b_i(o) = P(o \mid \text{state } i)$, one distribution over
      the observations for each hidden state [^1]. It makes two assumptions: a state depends only on
      the previous state, $P(q_i \mid q_0, \dots, q_{i-1}) = P(q_i \mid q_{i-1})$, and an observation
      depends only on the state that produced it, $P(o_i \mid q_0, \dots, q_i, o_0, \dots, o_{i-1}) = P(o_i \mid q_i)$ [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 2.2 HMM ingredients; Definition of an HMM'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 2.2 HMM assumptions'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
    source:
