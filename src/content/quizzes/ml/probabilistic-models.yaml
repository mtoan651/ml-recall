  - id: probabilistic-models-017
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - marginal-likelihood
      - local-optima
    question: |
      You learn $\ell$ and $\sigma^2$ of a GP regression model by maximizing the log marginal
      likelihood twice: once starting from a large $\ell$ with a large $\sigma^2$, once from a small
      $\ell$ with a small $\sigma^2$. The two runs end at different hyperparameters. What is the best
      explanation?
    options:
      - text: A slow function with much noise and a wiggly one with little noise both fit, giving separate local optima
        correct: true
      - text: The optimizer must be buggy, since the log marginal likelihood is a convex function of $(\ell, \sigma^2)$ with one optimum
        why: The marginal likelihood is not a convex function of the hyperparameters [^1].
      - text: The complexity term always prefers the smallest $\ell$, so the result only shows how long each run lasted
        why: The log-determinant (complexity) term penalizes overly flexible fits, which favours simpler, smoother explanations, not the smallest $\ell$ [^2].
      - text: Marginal likelihood can learn the noise variance but not the length-scale, so $\ell$ stays near its start
        why: The marginal likelihood is in fact good at learning length-scales; the trouble is that there can be more than one good one [^1].
    explanation: |
      The log marginal likelihood is not convex in the kernel hyperparameters [^1]. Data that vary a
      lot are consistent with a slowly varying function only if a large noise variance explains the
      variation, and with a quickly varying function if the noise is small; both can be local optima,
      and the start decides which one the optimizer finds [^1]. The objective splits into a data-fit
      term and a log-determinant complexity term, which favours the simplest fit consistent with the
      data [^2]. Trying several initializations, or a sensible prior, guards against a poor optimum.
    references:
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 2 (non-convex objective, interpretable local optima)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
      - source: d2l
        locator: Sec. 18.3.3 Interpreting Equations for Learning and Predictions (model fit and complexity terms)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#interpreting-equations-for-learning-and-predictions
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex2
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: draft
  - id: probabilistic-models-018
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - extrapolation
      - epistemic-uncertainty
      - aleatoric-uncertainty
    question: |
      A zero-mean GP with an RBF kernel (amplitude 1, learned length-scale well below 1) is fit to
      noisy samples of $f(x) = \sin x + \frac{1}{2}\sin 4x$, noise standard deviation about 0.25, with
      training inputs in $[0, 5]$. You now predict on $[6, 10]$. What happens there, and what would a
      band showing only the aleatoric uncertainty (mean $\pm 2\sigma$) look like?
    options:
      - text: The mean returns to 0 and the epistemic band widens to about $\pm 2$; a noise-only band stays near $\pm 0.5$ and misses much of $f$
        correct: true
      - text: The mean keeps following $\sin x + \frac{1}{2}\sin 4x$ there, because the GP has learned the frequency of the data
        why: An RBF kernel has no notion of periodicity; beyond a few length-scales from the data the posterior reverts to the prior mean 0 [^1][^2].
      - text: Both bands keep the width they have inside $[0, 5]$, because the noise level is the same at every input
        why: Only the aleatoric band has constant width; the epistemic band grows away from the data [^1].
      - text: The epistemic band grows without limit there, and the noise-only band also covers the true function
        why: The epistemic band levels off at the prior, $\pm 2a = \pm 2$, and a $\pm 0.5$ band around 0 cannot cover values of $f$ up to about 1.4 [^1].
    explanation: |
      Away from the data the kernel values $k(x, x_i)$ vanish, so the posterior mean returns to the
      prior mean 0 and the epistemic variance to the prior variance $a^2 = 1$, a band of about
      $\pm 2$ [^1][^2]. That band still covers the true function, whose values stay within about
      $\pm 1.4$ there. The aleatoric uncertainty is the noise variance, the same everywhere [^1]; a
      band of $\pm 2\sigma \approx \pm 0.5$ around a mean of 0 would look confident while missing
      the true curve over about half of $[6, 10]$. Representing epistemic uncertainty is what tells
      us that we know little there [^1].
    references:
      - source: d2l
        locator: Sec. 18.3.4 Worked Example from Scratch (epistemic versus aleatoric uncertainty, credible sets)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#worked-example-from-scratch
      - source: d2l
        locator: Sec. 18.1 Introduction to Gaussian Processes (uncertainty grows away from the data)
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex3
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: draft
  - id: probabilistic-models-019
    type: short_answer
    difficulty: medium
    tags:
      - gaussian-processes
      - predictive-distribution
      - aleatoric-uncertainty
    question: |
      At a test input, the GP posterior of the latent noise-free function has standard deviation
      $0.15$. The observation noise has standard deviation $\sigma = 0.2$. What is the half-width
      of the 95% band (mean $\pm 2$ standard deviations) for a new noisy observation $y_*$ at that
      input?
    answer:
      numeric: 0.5
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $2\sqrt{0.15^2 + 0.2^2} = 2\sqrt{0.0625} = 0.5$
    explanation: |
      A new observation is $y_* = f(x_*) + \epsilon$ with independent noise, so the variances add:
      $0.15^2 + 0.2^2 = 0.0625$, a standard deviation of $0.25$ and a band of $\pm 0.5$. The band for
      the latent function alone is only $\pm 0.3$. The d2l code forms the observed band exactly this
      way, adding the noise variance to the posterior variance before taking the square root [^1],
      and Rasmussen and Williams note that noisy test predictions just add $\sigma_n^2$ to the
      variance of $f_*$ [^2]. This is why the GPyTorch plot, drawn in observation space, shows a wider
      band than the from-scratch plot of the latent function [^1].
    references:
      - source: d2l
        locator: Sec. 18.3.4 Worked Example from Scratch (credible set for the observations) and Sec. 18.3.5 Making Life Easy with GPyTorch
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#worked-example-from-scratch
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 2.2, text after Algorithm 2.1, p. 19
        url: http://gaussianprocess.org/gpml/chapters/RW2.pdf
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 6
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex6
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
