  - id: probabilistic-models-029
    type: single
    difficulty: medium
    tags:
      - hmm
      - forward-algorithm
      - dynamic-programming
      - complexity
    question: |
      For an HMM with $n$ hidden states and $T$ observations, summing $P(O, Q)$ over all hidden
      sequences $Q$ takes about $(2T)\,n^T$ multiplications, but the forward algorithm needs only about
      $2n^2T$. Where does the saving come from?
    options:
      - text: Each $\alpha$ is computed once and reused by every path through that state
        correct: true
      - text: It follows only the most likely hidden sequence and ignores the others
        why: The forward algorithm is exact and sums over all paths; following only the best path would not give $P(O)$ [^1].
      - text: It leaves out the emission probabilities, which halves the work
        why: Every $\alpha_j(t+1)$ multiplies by the emission probability $b_j(o_{t+1})$; nothing is left out [^1].
      - text: It estimates $P(O)$ from a small random sample of hidden sequences
        why: There is no sampling; the forward algorithm computes the likelihood exactly [^1].
    explanation: |
      The naive sum has $n^T$ hidden sequences, and scoring each one costs about $2T$
      multiplications [^1]. The forward algorithm uses dynamic programming: $\alpha_j(t+1) = \sum_i
      \alpha_i(t)\, a_{ij}\, b_j(o_{t+1})$ reuses the stored values of the previous time step, so each
      step costs about $2n^2$ multiplications ($n$ target states, each summing over $n$ previous
      states), and $T$ steps cost about $2n^2T$ [^1]. For $n = 2$ and $T = 10$ that is 80 instead of
      about 20,000 multiplications.
    references:
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 3.2 Total probability of an observation sequence; 3.3 The forward procedure; Exercise 3.3'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/03_HMMs-intro.ipynb#ex3.3
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
    status: draft
  - id: probabilistic-models-030
    type: multiple
    difficulty: hard
    tags:
      - hmm
      - viterbi
      - decoding
    question: |
      The Viterbi algorithm stores, for each state $i$ and time $t$, a value $\delta_i(t)$ and a
      back-pointer $\psi_i(t)$. Which statements are true? Select all that apply.
    options:
      - text: $\delta_i(t)$ is the probability of the most probable path that accounts for the observations up to time $t$ and ends in state $i$
        correct: true
      - text: If state $i$ has the highest $\delta_i(t-1)$ at time $t-1$, then the path through $i$ is the best way to reach every state $j$ at time $t$
        why: The best predecessor of $j$ maximizes $\delta_i(t-1)\,a_{ij}$, so it also depends on the transition probabilities into $j$ [^1].
      - text: $\psi_j(t)$ stores the previous state $i$ that maximizes $\delta_i(t-1)\,a_{ij}$, so the best path can be traced back at the end
        correct: true
      - text: Picking, at each time step, the state with the largest forward value $\alpha$ gives the most likely hidden sequence
        why: Two individually likely states can be joined by a very unlikely transition, so the best sequence must be decoded as a whole, which is what Viterbi does [^2].
    explanation: |
      Viterbi decodes $Q^* = \arg\max_Q P(O, Q; \theta)$ with dynamic programming: $\delta_j(t) =
      \max_i \{\delta_i(t-1)\,a_{ij}\}\, b_j(o_t)$, and $\psi_j(t)$ records the maximizing $i$ [^1]. The
      maximum depends on both the previous $\delta$ values and the transition probabilities, so the
      best predecessor can differ from state to state [^1]. Following the back-pointers from the best
      final state recovers the best path; choosing the most probable state per time step from the
      $\alpha$ values can produce a sequence containing unlikely transitions [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 4: More HMMs — 1.2 Viterbi: Initialization; 1.3 Viterbi: Induction; 1.4 Viterbi conclusion'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 4: More HMMs — 1.1 Introduction (Can we use the forward algorithm for decoding?)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/04_More-HMMs.ipynb#ex4.1
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
