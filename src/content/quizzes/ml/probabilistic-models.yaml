  - id: probabilistic-models-027
    type: short_answer
    difficulty: medium
    tags:
      - hmm
      - forward-algorithm
      - likelihood
    question: |
      An HMM relates the weather of a day (hidden state HOT or COLD) to the number of ice creams a
      person eats that day (observation 1, 2 or 3). Its parameters are the initial probabilities
      $\pi$, the transition probabilities and the emission probabilities:

      | state | $\pi$ | to HOT | to COLD | P(1) | P(2) | P(3) |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: |
      | HOT | 0.7 | 0.8 | 0.2 | 0.1 | 0.3 | 0.6 |
      | COLD | 0.3 | 0.3 | 0.7 | 0.6 | 0.3 | 0.1 |

      Use the forward algorithm to compute the probability of observing 3 ice creams on day 0 and 1
      ice cream on day 1.
    answer:
      numeric: 0.0975
      tolerance: 0.0005
      hint: a probability, 4 decimals
      model: $\alpha_H(0) = 0.42$, $\alpha_C(0) = 0.03$; $\alpha_H(1) = (0.42 \cdot 0.8 + 0.03 \cdot 0.3) \cdot 0.1 = 0.0345$, $\alpha_C(1) = (0.42 \cdot 0.2 + 0.03 \cdot 0.7) \cdot 0.6 = 0.063$; sum $= 0.0975$
    explanation: |
      The parameters of an HMM are $\theta = \langle \pi, T, B \rangle$; here the ice-cream counts are
      the observations and HOT/COLD the hidden states [^1]. The forward algorithm starts with
      $\alpha_i(0) = \pi_i\, b_i(o_0)$, so $\alpha_H(0) = 0.7 \cdot 0.6 = 0.42$ and
      $\alpha_C(0) = 0.3 \cdot 0.1 = 0.03$. It then sums over the previous states,
      $\alpha_j(t+1) = \sum_i \alpha_i(t)\, a_{ij}\, b_j(o_{t+1})$, which gives $\alpha_H(1) = 0.0345$ and
      $\alpha_C(1) = 0.063$, and it ends by adding the last column: $P(O) = 0.0975$ [^2]. This equals
      the sum of $P(O, Q)$ over the four possible hidden sequences, without listing them [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 2.3 Three fundamental questions for an HMM; Exercise 3.2 (discussion)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 3.3 The forward procedure (initialization, induction, conclusion)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/03_HMMs-intro.ipynb#ex3.2-discussion
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
