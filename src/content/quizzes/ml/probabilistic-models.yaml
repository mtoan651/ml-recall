  - id: probabilistic-models-001
    type: single
    question: |
      Evaluate both statements.

      **Statement 1.** Density estimation (using say, the kernel density estimator) can be used to perform classification.

      **Statement 2.** The correspondence between logistic regression and Gaussian Naive Bayes (with identity class covariances) means that there is a one-to-one correspondence between the parameters of the two classifiers.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    source:
      id: mmlu-redux
      ref: machine_learning/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=6
    status: draft
  - id: probabilistic-models-002
    type: single
    shuffle: false
    question: 'Which of the following is the joint probability of H, U, P, and W described by the given Bayesian Network H -> U <- P <- W? [note: as the product of the conditional probabilities]'
    options:
      - text: P(H, U, P, W) = P(H) * P(W) * P(P) * P(U)
      - text: P(H, U, P, W) = P(H) * P(W) * P(P | W) * P(W | H, P)
      - text: P(H, U, P, W) = P(H) * P(W) * P(P | W) * P(U | H, P)
        correct: true
      - text: None of the above
    source:
      id: mmlu-redux
      ref: machine_learning/26
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=26
    status: draft
