title: Probabilistic & Graphical Models
questions:
  - id: probabilistic-models-001
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Density estimation (using say, the kernel density estimator) can be used to perform classification.

      **Statement 2.** The correspondence between logistic regression and Gaussian Naive Bayes (with identity class covariances) means that there is a one-to-one correspondence between the parameters of the two classifiers.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      Statement 1 is true. Fit a density estimate $\hat f_j(x)$, for example a kernel density
      estimate, separately for each class, combine it with the class priors, and apply Bayes'
      theorem to get $P(G = j \mid x)$. That posterior is a classifier [^1]. Statement 2 is false.
      Under the Gaussian Naive Bayes (GNB) assumptions, $P(y \mid x)$ takes the logistic form, with
      weights $w_i = (\mu_{i0} - \mu_{i1})/\sigma_i^2$ computed from the GNB parameters [^2]. The map
      only goes one way and is many-to-one. GNB has more parameters (two class means and a variance
      per feature, plus the prior), so many GNB settings give the same logistic weights. Logistic
      regression fitted directly can also reach weights that no GNB fit would produce [^2][^3].
    references:
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 6.6.2 Kernel Density Classification, p. 210
      - title: 'Mitchell, Generative and Discriminative Classifiers: Naive Bayes and Logistic Regression (draft chapter, 2017)'
        url: http://www.cs.cmu.edu/~tom/mlbook/NBayesLogReg.pdf
        locator: Sec. 3.1, pp. 8-10 (weights in terms of GNB parameters); Sec. 4, p. 14
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: 'Sec. 4.1.3 Discussion: GDA and logistic regression, p. 41'
    source:
      id: mmlu-redux
      ref: machine_learning/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=6
    status: draft
  - id: probabilistic-models-002
    type: single
    difficulty: medium
    question: 'Which of the following is the joint probability of $H$, $U$, $P$ and $W$ in the Bayesian network $H \to U \leftarrow P \leftarrow W$, written as a product of conditional probabilities?'
    options:
      - text: $P(H, U, P, W) = P(H)\,P(W)\,P(P)\,P(U)$
      - text: $P(H, U, P, W) = P(H)\,P(W)\,P(P \mid W)\,P(W \mid H, P)$
      - text: $P(H, U, P, W) = P(H)\,P(W)\,P(P \mid W)\,P(U \mid H, P)$
        correct: true
      - text: $P(H, U, P, W) = P(H)\,P(W)\,P(P \mid W)\,P(U \mid H)\,P(U \mid P)$
    explanation: |
      A Bayesian network factorises the joint distribution into one conditional distribution per
      node, each conditioned only on that node's parents: $p(x) = \prod_k p(x_k \mid \mathrm{pa}_k)$ [^1].
      In $H \to U \leftarrow P \leftarrow W$, the roots $H$ and $W$ have no parents, $P$ has parent
      $W$, and $U$ has parents $H$ and $P$. This gives
      $P(H,U,P,W) = P(H)\,P(W)\,P(P \mid W)\,P(U \mid H,P)$ [^1]. The product of four marginals
      would make all four variables independent, so it ignores the arrows. The candidate with
      $P(W \mid H, P)$ conditions $W$ on variables that are not its parents and has no factor for
      $U$. Splitting $U$'s factor into $P(U \mid H)\,P(U \mid P)$ does not work either: each node
      gets exactly one factor, conditioned on all of its parents together [^1].
    references:
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 8.1 Bayesian Networks, eq. (8.5), p. 362
    source:
      id: mmlu-redux
      ref: machine_learning/26
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=26
    status: draft
  - id: probabilistic-models-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Besides EM, gradient descent can be used to perform inference or learning on Gaussian mixture model.

      **Statement 2.** Assuming a fixed number of attributes, a Gaussian-based Bayes optimal classifier can be learned in time linear in the number of records in the dataset.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is true. The log-likelihood of a Gaussian mixture has no closed-form maximiser,
      and gradient-based optimisation is a workable alternative to EM for maximising it [^1].
      Statement 2 is also true. The maximum-likelihood estimates of a Gaussian class-conditional
      model are averages over the training records: the class prior, the class means and the
      covariance [^2]. For a fixed number of attributes $d$, they can be computed in one pass
      through the data, so the cost grows linearly with the number of records $n$ (roughly
      $O(n d^2)$, with $d$ held constant).
    references:
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 9.2.1 Maximum likelihood, p. 435
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 4.1.2 The Gaussian discriminant analysis model, p. 40
    source:
      id: mmlu-redux
      ref: machine_learning/27
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=27
    status: draft
  - id: probabilistic-models-004
    type: single
    difficulty: hard
    question: 'For a Gaussian Bayes classifier, which one of these structural assumptions is the one that most affects the trade-off between underfitting and overfitting:'
    options:
      - text: Whether we learn the class centers by Maximum Likelihood or Gradient Descent
      - text: Whether we assume full class covariance matrices or diagonal class covariance matrices
        correct: true
      - text: Whether we have equal class priors or priors estimated from the data
      - text: Whether we allow classes to have different mean vectors or we force them to share the same mean vector
    explanation: |
      The covariance assumption decides how many parameters each class has. A full covariance
      matrix has $d(d+1)/2$ free entries, a number that grows quadratically with $d$. A diagonal
      one has only $d$ entries and cannot represent correlations between features [^2]. With
      diagonal class covariances the features are treated as independent within each class, which
      turns the model into Gaussian Naive Bayes [^1]. That assumption adds bias but can save a lot
      of variance [^3]. Shrinking a covariance estimate toward its diagonal is also a standard way
      to generalise better when samples are few, and regularized discriminant analysis tunes a
      continuum of covariance structures by cross-validation [^1][^4]. The other choices matter
      much less. Maximum likelihood and gradient descent are two ways of optimising the same
      objective. The class priors only add a $\log P(y=k)$ term that shifts the boundary [^1].
      Forcing all classes to share one mean vector does not trade off complexity; it removes the
      main information that separates the classes.
    references:
      - title: 'scikit-learn User Guide: Linear and Quadratic Discriminant Analysis'
        url: https://scikit-learn.org/stable/modules/lda_qda.html#qda
        locator: Sec. 1.2.2.1 QDA (note on Gaussian Naive Bayes); Sec. 1.2.4 Shrinkage and Covariance Estimator
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 2.3 The Gaussian Distribution, pp. 83-84
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 6.6.3 The Naive Bayes Classifier, pp. 210-211
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 4.3.1 Regularized Discriminant Analysis, p. 112
    source:
