  - id: probabilistic-models-024
    type: multiple
    difficulty: medium
    tags:
      - markov-chains
      - stationary-distribution
      - absorbing-state
    question: |
      Which statements about Markov chains and their stationary distributions are true? Select all
      that apply.
    options:
      - text: To reach a stationary distribution, the initial distribution $\pi_0$ must itself satisfy $\pi_0 T = \pi_0$
        why: The stationary distribution $\pi$ is the one with $\pi T = \pi$. For an irreducible, aperiodic chain the state distribution converges to it from any $\pi_0$, so the long-run behaviour does not depend on the start [^1].
      - text: If a state has only one possible outgoing transition, that transition has probability 1
        correct: true
      - text: If every row of the transition matrix has exactly one nonzero entry, the chain moves deterministically once its start state is known
        correct: true
      - text: If state A has a self-loop with probability 1 and the chain reaches A, it stays in A forever
        correct: true
    explanation: |
      A stationary distribution is a distribution over states that does not change as time goes on,
      $\pi T = \pi$; if the chain is irreducible and aperiodic it is unique and the chain approaches
      it whatever the initial distribution [^1]. Each row of $T$ is a probability distribution [^2],
      so a single allowed transition must have probability 1, a chain with one nonzero entry per row
      has no randomness left after the first state, and a self-loop of probability 1 makes an
      absorbing state that the chain never leaves [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 1: Markov Models — 4. Stationary distribution; 4.2 Conditions for stationary distribution; 4.3 Irreducibility and aperiodicity'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/01_Markov-models.ipynb
