  - id: probabilistic-models-005
    type: single
    difficulty: medium
    question: Suppose you are given an EM algorithm that finds maximum likelihood estimates for a model with latent variables. You are asked to modify the algorithm so that it finds MAP estimates instead. Which step or steps do you need to modify?
    options:
      - text: Expectation
      - text: Maximization
        correct: true
      - text: No modification necessary
      - text: Both
    explanation: |
      For MAP estimation you maximise $\ln p(\theta \mid X)$, which equals the likelihood bound plus
      the log prior $\ln p(\theta)$, up to a constant [^1]. The prior does not involve the latent
      variables, so the E step (computing their posterior under the current parameters) stays
      exactly the same. Only the M step changes: it now maximises $Q(\theta, \theta^{\text{old}}) + \ln p(\theta)$
      instead of $Q$ alone [^1]. In practice this is usually a small change to the
      maximum-likelihood M-step updates [^1].
    references:
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 9.3, p. 441; Sec. 9.4 The EM Algorithm in General, eq. (9.77), p. 454
    source:
      id: mmlu-redux
      ref: machine_learning/43
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=43
    status: draft
  - id: probabilistic-models-006
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** In a Bayesian network, the inference results of the junction tree algorithm are the same as the inference results of variable elimination.

      **Statement 2.** If two random variable X and Y are conditionally independent given another random variable Z, then in the corresponding Bayesian network, the nodes for X and Y are d-separated given Z.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      Statement 1 is true. Variable elimination (VE) and the junction tree algorithm are both exact
      inference methods [^1][^3]. Running VE in an order that follows the junction tree computes
      exactly the junction-tree messages, so the resulting marginals are the same [^2]. The
      junction tree simply caches those messages so that many queries can be answered without
      starting over [^2]. Statement 2 is false because the implication only runs one way.
      d-separation in the graph guarantees conditional independence, but a distribution that
      factorises over the graph can have extra independences that the graph does not show. A fully
      factorised distribution, for example, is compatible with any graph [^3]. So $X$ and $Y$ can
      be conditionally independent given $Z$ even though the graph does not d-separate them.
    references:
      - title: 'Stanford CS228 Notes: Variable Elimination'
        url: https://ermongroup.github.io/cs228-notes/inference/ve/
        locator: Introduction
      - title: 'Stanford CS228 Notes: Junction Tree Algorithm'
        url: https://ermongroup.github.io/cs228-notes/inference/jt/#variable-elimination-over-a-junction-tree
        locator: Introduction; section 'Variable elimination over a junction tree'
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 8.2.2 D-separation, p. 382; Sec. 8.4.6 Exact inference in general graphs, p. 416
    source:
      id: mmlu-redux
      ref: machine_learning/48
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=48
    status: draft
  - id: probabilistic-models-007
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The log-likelihood of the data will always increase through successive iterations of the expectation maximation algorithm.

      **Statement 2.** One disadvantage of Q-learning is that it can only be used when the learner has prior knowledge of how its actions affect its environment.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is false because of the word "always". EM guarantees that the log-likelihood
      never decreases, $\ell(\theta^{(t)}) \le \ell(\theta^{(t+1)})$. Once it reaches a maximum,
      though, the parameters stop changing and the likelihood stays where it is [^1][^2].
      Statement 2 is also false. Q-learning is a model-free temporal-difference method: it learns
      action values directly from experienced transitions and rewards, with no model of how
      actions change the environment [^3].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 11.3 General EM algorithms, pp. 158-159
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 9.4 The EM Algorithm in General, p. 454
      - title: 'Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Ch. 6 introduction, p. 119; Sec. 6.5 Q-learning, p. 131; Sec. 6.9 Summary, p. 138
    source:
      id: mmlu-redux
      ref: machine_learning/64
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=64
    status: draft
  - id: probabilistic-models-008
    type: single
    difficulty: medium
    question: Consider the Bayesian network given below. How many independent parameters are needed for this Bayesian Network H -> U <- P <- W?
    options:
      - text: '2'
      - text: '4'
      - text: '8'
        correct: true
      - text: '16'
    explanation: |
      Assume every variable is binary (the question does not say, but the expected answer relies
      on it). A node with $K$ states needs $K - 1$ free parameters for each configuration of its
      parents, so a binary node needs one parameter per parent configuration [^1]. In
      H → U ← P ← W:
      - H and W have no parents: 1 parameter each.
      - P has one binary parent (W): $2^1 = 2$.
      - U has two binary parents (H, P): $2^2 = 4$.

      Total: $1 + 1 + 2 + 4 = 8$. An unrestricted joint over four binary variables would need
      $2^4 - 1 = 15$ parameters; the missing links are what reduce the count [^1].
    references:
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 8.1.3 Discrete variables, pp. 366-367
    source:
      id: mmlu-redux
      ref: machine_learning/68
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=68
    status: draft
  - id: probabilistic-models-009
    type: single
    difficulty: easy
    shuffle: false
    question: Which of the following best describes what discriminative approaches try to model? (w are the parameters in the model)
    options:
      - text: p(y|x, w)
        correct: true
      - text: p(y, x)
      - text: p(w|x, y)
      - text: None of the above
    explanation: |
      Discriminative approaches model the conditional distribution of the label given the input,
      $p(y \mid x; w)$, directly. Logistic regression is the standard example [^1][^2]. Modelling
      $p(x \mid y)$ and $p(y)$, and hence the joint $p(x, y)$, is what generative models such as GDA
      and naive Bayes do [^1][^2]. $p(w \mid x, y)$ is the Bayesian posterior over the parameters
      after seeing the data, not the quantity a classifier is built to model [^3].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Ch. 4 Generative learning algorithms (introduction), p. 35
      - title: 'Mitchell, Generative and Discriminative Classifiers: Naive Bayes and Logistic Regression (draft chapter, 2017)'
        url: http://www.cs.cmu.edu/~tom/mlbook/NBayesLogReg.pdf
        locator: Sec. 4 Relationship Between Naive Bayes Classifiers and Logistic Regression, p. 14
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 1.2.3 Bayesian probabilities, eq. (1.43), p. 22
    source:
      id: mmlu-redux
      ref: machine_learning/80
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=80
    status: draft
  - id: probabilistic-models-010
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** When learning an HMM for a fixed set of observations, assume we do not know the true number of hidden states (which is often the case), we can always increase the training data likelihood by permitting more hidden states.

      **Statement 2.** Collaborative filtering is often a useful model for modeling users' movie preference.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is true, read as "the likelihood never goes down". An HMM extends a mixture model:
      at each time step the observation comes from the emission distribution of one hidden state [^1].
      A model with more states can reproduce any model with fewer states, so its best achievable
      training likelihood can only stay the same or rise. Mixture models behave the same way: the
      maximum likelihood keeps rising with the number of components, which is why training
      likelihood cannot be used to choose model size [^2]. Statement 2 is true. Collaborative
      filtering recommends items using similarities between users and items learned from a
      user–item feedback matrix, and movie recommendation is the textbook example [^3].
    references:
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 13.2 Hidden Markov Models, p. 610
      - title: Bishop, Pattern Recognition and Machine Learning (2006)
        url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
        locator: Sec. 10.2.4 Determining the number of components, p. 484
      - title: 'Google Developers: Recommendation Systems course'
        url: https://developers.google.com/machine-learning/recommendation/collaborative/basics
        locator: Collaborative filtering, 'Movie recommendation example'
    source:
      id: mmlu-redux
      ref: machine_learning/94
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=94
