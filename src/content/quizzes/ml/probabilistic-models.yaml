  - id: probabilistic-models-015
    type: short_answer
    difficulty: medium
    tags:
      - gaussian-processes
      - posterior-variance
      - rbf-kernel
      - extrapolation
    question: |
      A zero-mean GP with RBF kernel
      $k(x, x') = a^2 \exp\left(-\frac{(x - x')^2}{2\ell^2}\right)$, $a = 2$, $\ell = 1$, is conditioned
      on noise-free observations with inputs in $[0, 5]$. As the test input moves far from the data
      (say $x = 50$), the posterior standard deviation of $f(x)$ stops growing. Which value does it
      approach?
    answer:
      numeric: 2
      tolerance: 0.01
      hint: a number
      model: $s^2 = k(x,x) - k(x, X) K^{-1} k(X, x) \to k(x,x) = a^2 = 4$, so $s \to a = 2$
    explanation: |
      The posterior variance is $k(x,x) - k(x, x_{1:n}) K^{-1} k(x_{1:n}, x)$ [^1]. Far from the
      data every $k(x, x_i)$ decays to 0, so the subtracted term vanishes and the variance returns to
      the prior variance $k(x, x) = a^2 = 4$, a standard deviation of $2$. The data carry no
      information there, so the posterior reverts to the prior: error bars far from the data reflect
      the prior standard deviation of the process [^2]. A stationary kernel has the same prior
      variance everywhere, hence the plateau.
    references:
      - source: d2l
        locator: Sec. 18.1 Introduction to Gaussian Processes (posterior variance $s^2$; uncertainty grows away from the data)
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 2.3 Varying the Hyperparameters, pp. 20–21 (error bars away from the data reflect the prior standard deviation)
        url: http://gaussianprocess.org/gpml/chapters/RW2.pdf
      - source: d2l
        locator: Sec. 18.1.2 Exercises, Exercise 7
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-intro#ex7
      url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
    status: draft
  - id: probabilistic-models-016
    type: true_false
    difficulty: medium
    tags:
      - gaussian-processes
      - product-of-gaussians
      - kernels
    shuffle: false
    question: |
      True or false: if $f \sim \mathcal{GP}(m_1, k_1)$ and $g \sim \mathcal{GP}(m_2, k_2)$ are
      independent, then the product $u(x) = f(x)g(x)$ is also a Gaussian process.
    options:
      - text: 'True'
        why: Even at a single input, the product of two independent Gaussians is not Gaussian, so $u$ cannot be a GP [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      A GP needs every finite set of values to be jointly Gaussian. Already one value fails: for two
      independent standard normals, $XY$ has the density $K_0(|z|)/\pi$, peaked at 0 and
      heavy-tailed [^2]. The product does have a mean, $m_1 m_2$, and a covariance,
      $k_1 k_2 + m_1(x)m_1(x')\,k_2 + m_2(x)m_2(x')\,k_1$, but these do not make it Gaussian. For
      zero means the covariance is $k_1 k_2$, and the product of two kernels is a valid kernel, but
      the GP with that kernel is a different process from $fg$ [^1].
    references:
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 4.2.4 Making New Kernels from Old (product, footnote 8), p. 95
        url: http://gaussianprocess.org/gpml/chapters/RW4.pdf
      - title: 'Wikipedia: Product distribution'
        locator: Special cases, Independent central-normal distributions
        url: https://en.wikipedia.org/wiki/Product_distribution
      - source: d2l
        locator: Sec. 18.2.7 Exercises, Exercise 5
        url: https://d2l.ai/chapter_gaussian-processes/gp-priors.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-priors#ex5
      url: https://d2l.ai/chapter_gaussian-processes/gp-priors.html#exercises
    status: draft
  - id: probabilistic-models-017
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - marginal-likelihood
      - local-optima
    question: |
      You learn $\ell$ and $\sigma^2$ of a GP regression model by maximizing the log marginal
      likelihood twice: once starting from a large $\ell$ with a large $\sigma^2$, once from a small
      $\ell$ with a small $\sigma^2$. The two runs end at different hyperparameters. What is the best
      explanation?
    options:
      - text: A slow function with much noise and a wiggly one with little noise both fit, giving separate local optima
        correct: true
      - text: The optimizer must be buggy, since the log marginal likelihood is a convex function of $(\ell, \sigma^2)$ with one optimum
        why: The marginal likelihood is not a convex function of the hyperparameters [^1].
      - text: The complexity term always prefers the smallest $\ell$, so the result only shows how long each run lasted
        why: The log-determinant (complexity) term penalizes overly flexible fits, which favours simpler, smoother explanations, not the smallest $\ell$ [^2].
      - text: Marginal likelihood can learn the noise variance but not the length-scale, so $\ell$ stays near its start
        why: The marginal likelihood is in fact good at learning length-scales; the trouble is that there can be more than one good one [^1].
    explanation: |
      The log marginal likelihood is not convex in the kernel hyperparameters [^1]. Data that vary a
      lot are consistent with a slowly varying function only if a large noise variance explains the
      variation, and with a quickly varying function if the noise is small; both can be local optima,
      and the start decides which one the optimizer finds [^1]. The objective splits into a data-fit
      term and a log-determinant complexity term, which favours the simplest fit consistent with the
      data [^2]. Trying several initializations, or a sensible prior, guards against a poor optimum.
    references:
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 2 (non-convex objective, interpretable local optima)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
      - source: d2l
        locator: Sec. 18.3.3 Interpreting Equations for Learning and Predictions (model fit and complexity terms)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#interpreting-equations-for-learning-and-predictions
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex2
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: draft
  - id: probabilistic-models-018
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - extrapolation
      - epistemic-uncertainty
      - aleatoric-uncertainty
    question: |
      A zero-mean GP with an RBF kernel (amplitude 1, learned length-scale well below 1) is fit to
      noisy samples of $f(x) = \sin x + \frac{1}{2}\sin 4x$, noise standard deviation about 0.25, with
      training inputs in $[0, 5]$. You now predict on $[6, 10]$. What happens there, and what would a
      band showing only the aleatoric uncertainty (mean $\pm 2\sigma$) look like?
    options:
      - text: The mean returns to 0 and the epistemic band widens to about $\pm 2$; a noise-only band stays near $\pm 0.5$ and misses much of $f$
        correct: true
      - text: The mean keeps following $\sin x + \frac{1}{2}\sin 4x$ there, because the GP has learned the frequency of the data
        why: An RBF kernel has no notion of periodicity; beyond a few length-scales from the data the posterior reverts to the prior mean 0 [^1][^2].
      - text: Both bands keep the width they have inside $[0, 5]$, because the noise level is the same at every input
        why: Only the aleatoric band has constant width; the epistemic band grows away from the data [^1].
      - text: The epistemic band grows without limit there, and the noise-only band also covers the true function
        why: The epistemic band levels off at the prior, $\pm 2a = \pm 2$, and a $\pm 0.5$ band around 0 cannot cover values of $f$ up to about 1.4 [^1].
    explanation: |
      Away from the data the kernel values $k(x, x_i)$ vanish, so the posterior mean returns to the
      prior mean 0 and the epistemic variance to the prior variance $a^2 = 1$, a band of about
      $\pm 2$ [^1][^2]. That band still covers the true function, whose values stay within about
      $\pm 1.4$ there. The aleatoric uncertainty is the noise variance, the same everywhere [^1]; a
      band of $\pm 2\sigma \approx \pm 0.5$ around a mean of 0 would look confident while missing
      the true curve over about half of $[6, 10]$. Representing epistemic uncertainty is what tells
      us that we know little there [^1].
    references:
      - source: d2l
        locator: Sec. 18.3.4 Worked Example from Scratch (epistemic versus aleatoric uncertainty, credible sets)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#worked-example-from-scratch
      - source: d2l
        locator: Sec. 18.1 Introduction to Gaussian Processes (uncertainty grows away from the data)
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex3
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: draft
  - id: probabilistic-models-019
    type: short_answer
    difficulty: medium
    tags:
      - gaussian-processes
      - predictive-distribution
      - aleatoric-uncertainty
    question: |
      At a test input, the GP posterior of the latent noise-free function has standard deviation
      $0.15$. The observation noise has standard deviation $\sigma = 0.2$. What is the half-width
      of the 95% band (mean $\pm 2$ standard deviations) for a new noisy observation $y_*$ at that
      input?
    answer:
      numeric: 0.5
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $2\sqrt{0.15^2 + 0.2^2} = 2\sqrt{0.0625} = 0.5$
    explanation: |
      A new observation is $y_* = f(x_*) + \epsilon$ with independent noise, so the variances add:
      $0.15^2 + 0.2^2 = 0.0625$, a standard deviation of $0.25$ and a band of $\pm 0.5$. The band for
      the latent function alone is only $\pm 0.3$. The d2l code forms the observed band exactly this
      way, adding the noise variance to the posterior variance before taking the square root [^1],
      and Rasmussen and Williams note that noisy test predictions just add $\sigma_n^2$ to the
      variance of $f_*$ [^2]. This is why the GPyTorch plot, drawn in observation space, shows a wider
      band than the from-scratch plot of the latent function [^1].
    references:
      - source: d2l
        locator: Sec. 18.3.4 Worked Example from Scratch (credible set for the observations) and Sec. 18.3.5 Making Life Easy with GPyTorch
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#worked-example-from-scratch
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 2.2, text after Algorithm 2.1, p. 19
        url: http://gaussianprocess.org/gpml/chapters/RW2.pdf
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 6
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex6
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: draft
  - id: probabilistic-models-020
    type: single
    difficulty: medium
    tags:
      - bayesian-networks
      - naive-bayes
      - xor
    question: |
      Naive Bayes fails on XOR data ($y = x_1 \oplus x_2$). A Bayesian network with the edges
      $y \to x_1$, $y \to x_2$ and $x_1 \to x_2$ classifies it perfectly. Why?
    options:
      - text: It models $p(x_2 \mid x_1, y)$, which can encode $x_2 = x_1 \oplus y$
        correct: true
      - text: The extra edge acts like a hidden layer, which makes the model nonlinear
        why: The network has no hidden variables; it only lets $x_2$ depend on $x_1$ as well as on $y$.
      - text: It smooths the counts for $x_2$, which breaks the ties of naive Bayes
        why: Smoothing XOR counts still gives every class-conditional probability $\frac{1}{2}$, so the ties remain.
      - text: It drops the prior $p(y)$, which pulled every posterior to one half
        why: The prior is $\frac{1}{2}$ for both classes and does not cause the ties; the factorization does.
    explanation: |
      By the chain rule, $p(\mathbf{x} \mid y) = p(x_1 \mid y)\, p(x_2 \mid x_1, y)$ holds exactly;
      naive Bayes replaces the second factor by $p(x_2 \mid y)$, assuming conditional independence
      [^1]. In XOR data $x_2 = x_1 \oplus y$, so the full conditional table puts probability 1 on the
      correct $x_2$. With the edge $x_1 \to x_2$ the network learns exactly that, every training
      input gets posterior 1 for its true label, and the classifier is perfect. Without the edge
      every factor is $\frac{1}{2}$ and all posteriors tie [^2].
    references:
      - source: d2l
        locator: Sec. 22.9.2 The Probabilistic Model for Classification (chain rule) and Sec. 22.9.3 The Naive Bayes Classifier
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#the-probabilistic-model-for-classification
      - source: d2l
        locator: Sec. 22.9.6 Exercises, Exercises 1 and 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/naive-bayes#ex3
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#exercises
    status: draft
  - id: probabilistic-models-021
    type: short_answer
    difficulty: medium
    tags:
      - markov-chain
      - conditional-independence
      - factorization
    question: |
      Binary variables form a chain $A \to B \to C$: $B$ depends only on $A$, and $C$ depends only on
      $B$. You know $P(A{=}1) = 0.4$, $P(B{=}1 \mid A{=}1) = 0.7$, $P(B{=}1 \mid A{=}0) = 0.2$,
      $P(C{=}1 \mid B{=}1) = 0.9$ and $P(C{=}1 \mid B{=}0) = 0.3$. What is
      $P(A{=}1, B{=}0, C{=}1)$?
    answer:
      numeric: 0.036
      tolerance: 0.0005
      hint: a probability, 3 decimals
      model: $P(A{=}1)\,P(B{=}0 \mid A{=}1)\,P(C{=}1 \mid B{=}0) = 0.4 \times 0.3 \times 0.3 = 0.036$
    explanation: |
      In general $P(A, B, C) = P(A)\,P(B \mid A)\,P(C \mid A, B)$ [^1]. Because $C$ depends only on
      $B$, it is conditionally independent of $A$ given $B$, so $P(C \mid A, B) = P(C \mid B)$ and the
      joint becomes $P(A)\,P(B \mid A)\,P(C \mid B)$, the factorization of a Markov chain [^1][^2].
      With $P(B{=}0 \mid A{=}1) = 1 - 0.7 = 0.3$, the answer is $0.4 \times 0.3 \times 0.3 = 0.036$.
      For binary variables the chain needs 5 numbers instead of the 7 of a general joint table.
    references:
      - source: d2l
        locator: Sec. 2.6.4 Multiple Random Variables
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
      - title: 'Wikipedia: Markov chain'
        locator: Definition (Markov property)
        url: https://en.wikipedia.org/wiki/Markov_chain
      - source: d2l
        locator: Sec. 2.6.8 Exercises, Exercise 6
        url: https://d2l.ai/chapter_preliminaries/probability.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/probability#ex6
      url: https://d2l.ai/chapter_preliminaries/probability.html#exercises
    status: draft
