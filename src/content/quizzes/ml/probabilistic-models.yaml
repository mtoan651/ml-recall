  - id: probabilistic-models-013
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - posterior-variance
      - conditioning
    question: |
      A noise-free GP has $k(x, x) = k(x_1, x_1) = k(x_2, x_2) = 1$ and $k(x, x_1) = 0.9$. Observing
      $f(x_1) = 1.2$ gives $f(x) \mid f(x_1) \sim \mathcal{N}(1.08,\ 0.19)$. You then also observe
      $f(x_2) = 1.4$, where $k(x, x_2) = 0.8$. How does the new posterior variance of $f(x)$ compare
      with $0.19$?
    options:
      - text: It is at most 0.19 whatever $k(x_1, x_2)$ is, since conditioning on more data never increases it
        correct: true
      - text: It is larger than 0.19, because the second value 1.4 disagrees with 1.08, the current mean of $f(x)$
        why: The posterior variance $k(x,x) - k(x, x_{1:n}) K^{-1} k(x_{1:n}, x)$ does not involve the observed values at all [^1][^2].
      - text: Even its direction cannot be determined without knowing $k(x_1, x_2)$
        why: The amount of the drop depends on $k(x_1, x_2)$, but the variance can only go down or stay the same [^3].
      - text: It depends on how close 1.4 is to 1.2, the first observed value
        why: Only the kernel values enter the variance; the observed numbers affect the mean, not the variance [^2].
    explanation: |
      The posterior variance is $s^2 = k(x,x) - k(x, x_{1:n})\, k(x_{1:n}, x_{1:n})^{-1} k(x_{1:n}, x)$
      [^1]. It depends only on the inputs through the kernel, not on the observed values [^2].
      Conditioning a Gaussian on an extra variable subtracts a positive semidefinite term from the
      covariance, so the variance of $f(x)$ can only drop or stay the same [^3]: we are at least as
      certain as before. Its exact value, and the new mean, need $k(x_1, x_2)$; with
      $k(x_1, x_2) = 0.8$, for example, the variance falls to about $0.17$.
    references:
      - source: d2l
        locator: Sec. 18.1 Introduction to Gaussian Processes (the posterior mean $m$ and variance $s^2$, the $f(x_1) = 1.2$ example)
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html
      - source: d2l
        locator: Sec. 18.3.3 Interpreting Equations for Learning and Predictions (the predictive variance does not depend on $\mathbf{y}$)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#interpreting-equations-for-learning-and-predictions
      - title: 'Wikipedia: Multivariate normal distribution'
        locator: Conditional distributions (the conditional covariance is a Schur complement)
        url: https://en.wikipedia.org/wiki/Multivariate_normal_distribution
      - source: d2l
        locator: Sec. 18.1.2 Exercises, Exercise 5
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-intro#ex5
      url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
