  - id: probabilistic-models-028
    type: multiple
    difficulty: medium
    tags:
      - hmm
      - forward-algorithm
      - viterbi
    question: |
      In the forward algorithm for an HMM, $\alpha_i(t)$ is the value stored for state $i$ at time
      $t$ in the trellis. Which statements are true? Select all that apply.
    options:
      - text: The forward algorithm assumes that the observation sequence and the model parameters are fixed and known
        correct: true
      - text: $\alpha_i(t)$ is the total probability of seeing the observations up to time $t$ and ending in state $i$ at time $t$, summed over all paths that lead there
        correct: true
      - text: $\alpha_i(t)$ uses no information about the observations after time $t$
        correct: true
      - text: The forward algorithm ends by summing the $\alpha$ values of the last time step
        correct: true
      - text: $\alpha_i(t)$ is the probability of the single most likely path that ends in state $i$ at time $t$
        why: That is the Viterbi quantity $\delta_i(t)$, which takes a maximum over paths; $\alpha_i(t)$ sums over all of them [^2].
    explanation: |
      The forward algorithm computes the likelihood $P(O; \theta)$ of a given, fixed observation
      sequence under known parameters [^1]. It fills a trellis left to right: $\alpha_i(t)$ adds up
      the probability of all paths that produce the first observations and end in state $i$, built
      only from $\alpha$ values of time $t-1$, so it knows nothing about later observations; the
      likelihood is the sum of the last column [^1]. Replacing the sum by a maximum gives the
      Viterbi algorithm's $\delta_i(t)$, the probability of the single best path [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 3.2 Total probability of an observation sequence; 3.3 The forward procedure; Recap: The forward algorithm'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 4: More HMMs — 1.1 Introduction (The Viterbi algorithm: Overview)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/03_HMMs-intro.ipynb#ex3.2
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
