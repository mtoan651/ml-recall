  - id: probabilistic-models-083
    type: single
    difficulty: medium
    tags:
      - hidden-markov-models
      - filtering
      - prediction
      - alpha-recursion
    question: |
      For an HMM $p(h_{1:d}, v_{1:d}) = p(h_1)p(v_1 \mid h_1)\prod_{i=2}^d p(h_i \mid h_{i-1})p(v_i
      \mid h_i)$ you observe only $v_{1:u}$ with $u < d$. After filtering up to time $u$, how do you
      continue to obtain $\alpha(h_s) \propto p(h_s \mid v_{1:u})$ for $s = u+1, \ldots, t$?
    options:
      - text: $\alpha(h_s) = p(v_s \mid h_s) \sum_{h_{s-1}} p(h_s \mid h_{s-1})\, \alpha(h_{s-1})$
        why: $v_s$ is not observed for $s > u$; summing $p(v_s \mid h_s)$ over $v_s$ gives 1, so the emission term drops out [^1].
      - text: $\alpha(h_s) = \sum_{h_{s-1}} p(h_s \mid h_{s-1})\, \alpha(h_{s-1})$
        correct: true
      - text: $\alpha(h_s) = \alpha(h_u)$ for all $s > u$
        why: The hidden state keeps evolving under the transition model even without new observations [^1].
      - text: $\alpha(h_s) = \sum_{h_{s+1}} p(h_{s+1} \mid h_s)\, \alpha(h_{s+1})$
        why: This runs backwards in time, like the beta recursion; prediction propagates forwards from $h_u$ [^1].
    explanation: |
      In the factor graph, the messages from unobserved $v_i$ (and from future time steps) are all
      ones because $p(v_i \mid h_i)$ and $p(h_i \mid h_{i-1})$ are normalised [^1]. What remains is a
      chain: filter up to $u$, then keep applying the transition matrix. Normalising $\alpha(h_t)$
      gives $p(h_t \mid v_{1:u})$, and the normaliser equals the likelihood $p(v_{1:u})$, because
      each prediction step preserves the total mass [^1][^2]. The predictive distribution of an
      observation follows as $p(v_t \mid v_{1:u}) = \sum_{h_t} p(v_t \mid h_t)\, p(h_t \mid
      v_{1:u})$.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.1 (a)–(b) Predictive distributions for hidden Markov models
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Forward algorithm'
        url: https://en.wikipedia.org/wiki/Forward_algorithm
        locator: Algorithm
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#predictive-distributions-for-hidden-markov-models-a
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: probabilistic-models-084
    type: single
    difficulty: medium
    tags:
      - hidden-markov-models
      - viterbi
      - max-sum
      - dynamic-programming
    question: |
      The Viterbi algorithm computes $\operatorname*{arg\,max}_{h_{1:t}} p(h_{1:t} \mid v_{1:t})$ for
      an HMM by max-sum message passing along the chain, starting from $V_1(h_1) = \log p(h_1) +
      \log p(v_1 \mid h_1)$. Which recursion does it use for $i = 2, \ldots, t$?
    options:
      - text: $V_i(h_i) = \log p(v_i \mid h_i) + \log \sum_{h_{i-1}} p(h_i \mid h_{i-1})\, e^{V_{i-1}(h_{i-1})}$
        why: Summing over $h_{i-1}$ gives the forward (filtering) recursion in the log domain, which computes marginals, not the most probable path [^1][^2].
      - text: $V_i(h_i) = \log p(v_i \mid h_i) + \max_{h_{i-1}} V_{i-1}(h_{i-1})$
        why: This drops the transition term, so the path would ignore how likely it is to move from $h_{i-1}$ to $h_i$ [^1].
      - text: $V_i(h_i) = \max_{h_i} \left[\log p(v_i \mid h_i) + \log p(h_i \mid h_{i-1})\right] + V_{i-1}(h_{i-1})$
        why: The maximisation must be over the previous state $h_{i-1}$, so that $V_i$ remains a function of $h_i$ for the next step [^1].
      - text: $V_i(h_i) = \log p(v_i \mid h_i) + \max_{h_{i-1}} \left[\log p(h_i \mid h_{i-1}) + V_{i-1}(h_{i-1})\right]$
        correct: true
    explanation: |
      With factors $\phi_i(h_{i-1}, h_i) = p(h_i \mid h_{i-1})p(v_i \mid h_i)$, the max-sum
      factor-to-variable message is $V_i(h_i) = \max_{h_{i-1}} [\log \phi_i(h_{i-1}, h_i) +
      V_{i-1}(h_{i-1})]$ [^1]. Alongside, the arg max over $h_{i-1}$ is stored for each $h_i$; after
      the last step one takes $\hat h_t = \operatorname*{arg\,max} V_t$ and backtracks through the
      stored tables [^1][^2]. With $K$ states each step costs $O(K^2)$, so the whole path costs
      $O(tK^2)$ instead of $K^t$.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.2 Viterbi algorithm
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Viterbi algorithm'
        url: https://en.wikipedia.org/wiki/Viterbi_algorithm
        locator: Algorithm
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#viterbi-algorithm
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: probabilistic-models-085
    type: single
    difficulty: hard
    tags:
      - hidden-markov-models
      - ffbs
      - posterior-sampling
      - alpha-recursion
    question: |
      Forward filtering backward sampling draws whole state trajectories from $p(h_{1:n} \mid
      v_{1:n})$: sample $h_n \propto \alpha(h_n)$, then go backwards with $p(h_{t-1} \mid h_t,
      v_{1:n})$. Here $\alpha(h_t) = p(h_t, v_{1:t})$ and $\beta(h_t) = p(v_{t+1:n} \mid h_t)$. Which
      quantities does the backward step $p(h_{t-1} \mid h_t, v_{1:n})$ need?
    options:
      - text: $\alpha(h_{t-1})$, $\alpha(h_t)$, $p(h_t \mid h_{t-1})$ and $p(v_t \mid h_t)$
        correct: true
      - text: $\alpha(h_{t-1})$, $\beta(h_t)$, the transition $p(h_t \mid h_{t-1})$ and the emission $p(v_t \mid h_t)$
        why: $\beta(h_t)$ appears in both $p(h_{t-1}, h_t \mid v_{1:n})$ and $p(h_t \mid v_{1:n})$ and cancels in their ratio [^1].
      - text: Only the filtering distributions $p(h_{t-1} \mid v_{1:t-1})$ for each $t$
        why: Sampling the filtering marginals independently ignores the coupling between consecutive states; the transition and the current emission are needed too [^1].
      - text: $\beta(h_{t-1})$, $\beta(h_t)$, the transition $p(h_t \mid h_{t-1})$ and the emission $p(v_{t-1} \mid h_{t-1})$
        why: The backward pass needs no beta messages at all; the step only uses forward quantities [^1].
    explanation: |
      Given all observations, the hidden states form a first-order Markov chain, so sampling
      $h_{t-1}$ given $h_t$ suffices [^1]. Message passing gives $p(h_{t-1}, h_t \mid v_{1:n})
      \propto \alpha(h_{t-1})\, p(h_t \mid h_{t-1})\, p(v_t \mid h_t)\, \beta(h_t)$ and $p(h_t \mid
      v_{1:n}) \propto \alpha(h_t)\beta(h_t)$ [^1]. Their ratio is $p(h_{t-1} \mid h_t, v_{1:n}) =
      \alpha(h_{t-1})\, p(h_t \mid h_{t-1})\, p(v_t \mid h_t) / \alpha(h_t)$: the beta messages cancel,
      so one forward pass and one backward sampling pass are enough [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.3 (a)–(c) Forward filtering backward sampling for hidden Markov models
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Forward–backward algorithm'
        url: https://en.wikipedia.org/wiki/Forward%E2%80%93backward_algorithm
        locator: Overview
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#ffbs-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: probabilistic-models-086
    type: short_answer
    difficulty: medium
    tags:
      - hidden-markov-models
      - prediction
      - message-passing
    question: |
      An HMM has binary hidden states $h_1, h_2, h_3$ and binary observations $v_1, v_2, v_3$, with
      $p(h_1 = 1) = 0.5$. The transition always flips the state: $p(h_{i+1} = 1 \mid h_i = 0) = 1$
      and $p(h_{i+1} = 0 \mid h_i = 1) = 1$. The emissions are $p(v_i = 1 \mid h_i = 0) = 0.4$ and
      $p(v_i = 1 \mid h_i = 1) = 0.6$. You observe $v_1 = 1$ (and nothing else). What is $p(v_3 = 1
      \mid v_1 = 1)$?
    answer:
      numeric: 0.52
      tolerance: 0.001
      hint: a probability, 2 decimals
      model: $p(h_1 \mid v_1 = 1) = (0.4, 0.6)$; two flips give $p(h_3 \mid v_1 = 1) = (0.4, 0.6)$; $0.4 \cdot 0.4 + 0.6 \cdot 0.6 = 0.52$
    explanation: |
      Filtering at $t = 1$ gives $\alpha(h_1) \propto (0.5 \cdot 0.4, 0.5 \cdot 0.6)$, i.e. $p(h_1
      \mid v_1 = 1) = (0.4, 0.6)$ [^1]. The unobserved $v_2$ sends a message of ones, so the state
      distribution is only propagated: one flip gives $(0.6, 0.4)$ for $h_2$, the next gives $(0.4,
      0.6)$ for $h_3$ [^1]. Finally $p(v_3 = 1 \mid v_1 = 1) = \sum_{h_3} p(v_3 = 1 \mid h_3)\, p(h_3
      \mid v_1 = 1) = 0.4 \cdot 0.4 + 0.6 \cdot 0.6 = 0.52$ [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.4 Prediction exercise
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Hidden Markov model'
        url: https://en.wikipedia.org/wiki/Hidden_Markov_model
        locator: Inference (filtering and prediction)
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#prediction-exercise-e
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: probabilistic-models-087
    type: single
    difficulty: medium
    tags:
      - maximum-likelihood
      - conditional-probability-tables
      - bayesian-networks
    question: |
      A DAG $a \to c \leftarrow s$ over binary variables has $p(c = 1 \mid a, s) = \theta_c^{as}$, one
      parameter per parent configuration. You observe five iid records $(a, s, c)$: $(0, 1, 1)$,
      $(0, 0, 0)$, $(1, 0, 1)$, $(0, 0, 0)$, $(0, 1, 0)$. What is the maximum likelihood estimate of
      $p(c = 1 \mid a = 1, s = 1)$?
    options:
      - text: $0$, because $c = 1$ never occurs together with $a = 1, s = 1$
        why: The estimate is a ratio of counts, $0/0$ here; the likelihood does not depend on this parameter at all [^1].
      - text: It is undefined, because no record has $a = 1, s = 1$
        correct: true
      - text: $0.5$, the value that maximises the uncertainty
        why: $0.5$ is what a uniform Beta prior gives as posterior mean when there are no data; maximum likelihood has no such default [^1].
      - text: $2/5$, the overall fraction of records with $c = 1$
        why: Each conditional is estimated only from the records with that parent configuration, not from all records [^1].
    explanation: |
      For fully observed DAGs the log-likelihood splits into one Bernoulli term per variable and parent
      configuration, so $\hat\theta = \#(c = 1, \text{parents} = s) / \#(\text{parents} = s)$ [^1][^2].
      Here $\hat\theta_c^{00} = 0/2$, $\hat\theta_c^{10} = 1/1$, $\hat\theta_c^{01} = 1/2$, and
      $\hat\theta_c^{11} = 0/0$ is undefined. The example shows two weaknesses of maximum likelihood
      with small data: extreme estimates (0 or 1) and undefined ones; a Beta prior fixes both [^1].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.3 (e) and Ex. 8.4 (b) Cancer-asbestos-smoking example, MLE
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Bayesian network'
        url: https://en.wikipedia.org/wiki/Bayesian_network
        locator: Inference and learning, Parameter learning
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#cancer-smoking-asbestos-mle-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: draft
  - id: probabilistic-models-088
    type: short_answer
    difficulty: medium
    tags:
      - bayesian-inference
      - beta-prior
      - conditional-probability-tables
      - additive-smoothing
    question: |
      A DAG over binary variables has $t \to s \leftarrow b$ and $t \to x$. Among ten iid fully
      observed records, exactly three have $t = 0, b = 0$, and all three of them have $s = 0$. Each entry of the table $p(s = 1 \mid t, b)$ gets an independent uniform prior
      on $(0, 1)$. What is the posterior mean of $p(s = 1 \mid t = 0, b = 0)$?
    answer:
      numeric: 0.2
      tolerance: 0.001
      hint: a probability, 1 decimal (a fraction like 1/3 also works)
      model: $\frac{\alpha_0 + n_{s=1}}{\alpha_0 + \beta_0 + n} = \frac{1 + 0}{1 + 1 + 3} = \frac{1}{5}$
    explanation: |
      A uniform prior is $\mathrm{Beta}(1, 1)$, and with $n_1$ ones and $n_0$ zeros the posterior is
      $\mathrm{Beta}(1 + n_1, 1 + n_0)$, whose mean is $(1 + n_1)/(2 + n_1 + n_0)$ [^1]. Only the
      three records with $t = 0, b = 0$ count, all with $s = 0$, so the posterior mean is $1/5$; the
      maximum likelihood estimate would be $0/3 = 0$ [^1]. The prior acts like pseudo-counts, which
      is additive (Laplace) smoothing and keeps estimates away from 0 and 1 [^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.8 (a)–(b) Learning parameters of a directed graphical model
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Additive smoothing'
        url: https://en.wikipedia.org/wiki/Additive_smoothing
        locator: Introduction (pseudocounts, Laplace smoothing)
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#learning-parameters-of-a-directed-graphical-model-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: draft
  - id: probabilistic-models-089
    type: true_false
    difficulty: medium
    tags:
      - score-matching
      - unnormalised-models
      - boltzmann-machine
    question: |
      The model $p(\mathbf{x}; A) \propto \exp(-\mathbf{x}^\top A \mathbf{x})$ over 100 **binary**
      variables $x_i \in \{0, 1\}$ has an intractable partition function. True or false: score
      matching is a convenient way to estimate $A$ in this case.
    options:
      - text: 'True'
        why: Score matching needs derivatives of $\log p$ with respect to $\mathbf{x}$, which do not exist for discrete $\mathbf{x}$ [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      For real-valued $\mathbf{x}$ the model is a Gaussian, whose partition function has a closed form,
      so maximum likelihood is easy [^1]. For binary $\mathbf{x}$ the partition function is a sum over
      $2^{100}$ states, which makes maximum likelihood very hard. Score matching avoids $Z$ by
      differentiating with respect to the data, so it cannot be applied to binary variables [^1][^2];
      other methods for unnormalised models are needed there.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.13 (b)–(c) Parameter estimation for unnormalised models
        url: https://arxiv.org/abs/2206.13446
      - title: Hyvärinen (2005), Estimation of Non-Normalized Statistical Models by Score Matching, JMLR 6
        url: https://jmlr.org/papers/v6/hyvarinen05a.html
        locator: Sec. 2 Score matching (continuous-valued data)
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#parameter-estimation-for-unnormalised-models-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: draft
  - id: probabilistic-models-090
    type: single
    difficulty: medium
    tags:
      - unnormalised-models
      - partition-function
      - maximum-likelihood
    question: |
      For $p(\mathbf{x}; A) \propto \exp(-\mathbf{x}^\top A \mathbf{x})$ with $A$ symmetric positive
      semi-definite, a friend estimates $A$ by maximising $J(A) = \prod_{k=1}^n \exp(-\mathbf{x}_k^\top
      A \mathbf{x}_k)$ over the data, i.e. the likelihood without the partition function. What goes
      wrong?
    options:
      - text: Nothing; $Z(A)$ is a constant and does not change the maximiser
        why: $Z(A)$ depends on the parameters; dropping it is only harmless when optimising over $\mathbf{x}$, not over $A$ [^1][^2].
      - text: $J$ is maximised by $A = 0$ whatever the data, so the estimate is meaningless
        correct: true
      - text: $J$ grows without bound as the entries of $A$ grow, so the estimate diverges
        why: Each factor is $\exp(-\mathbf{x}_k^\top A\mathbf{x}_k) \le 1$ for positive semi-definite $A$, so larger $A$ makes $J$ smaller, not larger [^1].
      - text: The maximiser exists but is very slow to compute
        why: The maximiser is trivial to find ($A = 0$); the problem is that it ignores the data [^1].
    explanation: |
      Because $\mathbf{x}_k^\top A \mathbf{x}_k \ge 0$, every factor of $J$ is at most 1 and equals 1
      for $A = 0$ [^1]. The unnormalised model can raise its value at the data simply by becoming flat
      everywhere; the partition function $Z(A)$ is what penalises this, since the density must
      integrate to one [^1][^2]. Maximum likelihood therefore needs $\log Z(A)$ or a method designed
      for unnormalised models.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.13 (a) Parameter estimation for unnormalised models
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Partition function (mathematics)'
        url: https://en.wikipedia.org/wiki/Partition_function_(mathematics)
        locator: Definition
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#parameter-estimation-for-unnormalised-models-a
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: draft
  - id: probabilistic-models-091
    type: single
    difficulty: medium
    tags:
      - gibbs-sampling
      - restricted-boltzmann-machine
      - mcmc
    question: |
      A restricted Boltzmann machine over binary visibles $\mathbf{v}$ and hiddens $\mathbf{h}$ has
      $p(\mathbf{v}, \mathbf{h}) \propto \exp(\mathbf{v}^\top W \mathbf{h} + \mathbf{a}^\top\mathbf{v} +
      \mathbf{b}^\top\mathbf{h})$. Its conditionals factorise:
      $p(h_i = 1 \mid \mathbf{v}) = \sigma(\sum_j v_j W_{ji} + b_i)$ and $p(v_i = 1 \mid \mathbf{h}) =
      \sigma(\sum_j W_{ij} h_j + a_i)$. How do you generate (approximate) samples from $p(\mathbf{v})$?
    options:
      - text: Sample each $v_i$ independently from its marginal $p(v_i)$
        why: The marginals $p(v_i)$ are not available in closed form, and the $v_i$ are not independent under $p(\mathbf{v})$ [^1].
      - text: Compute $p(\mathbf{v})$ exactly by summing over $\mathbf{h}$, then sample from it
        why: The normalising constant sums over all joint states of $\mathbf{v}$ and $\mathbf{h}$, which is intractable for realistic sizes [^1][^2].
      - text: 'Block Gibbs: alternately sample all $h_i$ given $\mathbf{v}$ and all $v_i$ given $\mathbf{h}$'
        correct: true
      - text: Sample $\mathbf{h}$ from its marginal $p(\mathbf{h})$, then $\mathbf{v}$ given $\mathbf{h}$
        why: This would be exact ancestral sampling, but $p(\mathbf{h})$ also needs the intractable sum over $\mathbf{v}$ [^1].
    explanation: |
      Gibbs sampling updates one variable at a time from its full conditional [^1]. In an RBM the
      hiddens are independent given the visibles and vice versa, so $p(h_i \mid \mathbf{h}_{\setminus
      i}, \mathbf{v}) = p(h_i \mid \mathbf{v})$ and the update can be done for a whole layer at once
      (block Gibbs sampling) [^1][^2]. Running the chain on $(\mathbf{v}, \mathbf{h})$ and discarding
      $\mathbf{h}$ yields samples from the marginal $p(\mathbf{v})$.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 9 Sampling and Monte Carlo Integration, Ex. 9.7 Sampling from a restricted Boltzmann machine
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Restricted Boltzmann machine'
        url: https://en.wikipedia.org/wiki/Restricted_Boltzmann_machine
        locator: Structure and Training algorithm (Gibbs sampling)
    source:
      id: gutmann-pen-paper
      ref: sampling-and-monte-carlo-integration#sampling-from-a-restricted-boltzmann-machine
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/sampling-and-monte-carlo-integration.tex
    status: draft
  - id: probabilistic-models-092
    type: single
    difficulty: hard
    tags:
      - variational-inference
      - mean-field
      - elbo
      - coordinate-ascent
    question: |
      Mean-field variational inference approximates $p(\mathbf{y} \mid \mathbf{x})$ by $q(\mathbf{y} \mid
      \mathbf{x}) = \prod_{i=1}^d q_i(y_i \mid \mathbf{x})$ and maximises the ELBO
      $\mathbb{E}_q[\log p(\mathbf{x}, \mathbf{y}) - \log q(\mathbf{y} \mid \mathbf{x})]$ one factor at a
      time. With $q_2, \ldots, q_d$ held fixed, what is the optimal $q_1(y_1 \mid \mathbf{x})$?
    options:
      - text: $q_1(y_1 \mid \mathbf{x}) = p(y_1 \mid \mathbf{x})$, the exact posterior marginal
        why: The update depends on the current $q_2, \ldots, q_d$; the exact marginal would need the intractable posterior that VI is trying to avoid [^1].
      - text: $q_1(y_1 \mid \mathbf{x}) \propto \exp(\mathbb{E}_{q_2 \cdots q_d}[\log p(\mathbf{x}, \mathbf{y})])$
        correct: true
      - text: $q_1(y_1 \mid \mathbf{x}) \propto \mathbb{E}_{q_2 \cdots q_d}\left[p(\mathbf{x}, \mathbf{y})\right]$
        why: The expectation is taken of the *log* joint, not of the joint; the two differ in general [^1][^2].
      - text: $q_1(y_1 \mid \mathbf{x}) \propto p(\mathbf{x}, y_1, \bar y_2, \ldots, \bar y_d)$ with $\bar y_i$ the means under $q_i$
        why: Plugging in means is a point approximation; the optimal factor averages $\log p$ over the other factors [^1].
    explanation: |
      Dropping terms that do not involve $q_1$, the ELBO becomes $\mathbb{E}_{q_1}[\log \bar p(y_1
      \mid \mathbf{x}) - \log q_1(y_1 \mid \mathbf{x})] + \text{const} = -\mathrm{KL}(q_1 \,\|\, \bar
      p) + \text{const}$, where $\log \bar p(y_1 \mid \mathbf{x}) = \mathbb{E}_{q_2 \cdots
      q_d}[\log p(\mathbf{x}, \mathbf{y})] + \text{const}$ [^1]. The KL divergence is minimised by
      $q_1 = \bar p$ [^1][^2]. Cycling through the factors gives coordinate ascent in function space,
      and each update can only increase the ELBO.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.1 (a)–(c) Mean field variational inference I
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Variational Bayesian methods'
        url: https://en.wikipedia.org/wiki/Variational_Bayesian_methods#Mean_field_approximation
        locator: Mean field approximation
    source:
      id: gutmann-pen-paper
      ref: variational-inference#mfvi-i-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: probabilistic-models-093
    type: short_answer
    difficulty: hard
    tags:
      - variational-inference
      - mean-field
      - gaussian
    question: |
      Let $y_1, y_2, n \sim \mathcal{N}(0, 1)$ independently and $x = y_1 + y_2 + n$. The joint
      density satisfies
      $$\log p(y_1, y_2, x) = -\tfrac{1}{2}\left(2y_1^2 + 2y_2^2 + x^2 + 2y_1 y_2 - 2y_1 x - 2y_2 x\right)
      + \text{const}.$$
      You approximate $p(y_1, y_2 \mid x)$ by mean-field VI, $q(y_1, y_2) = q_1(y_1)\, q_2(y_2)$, using
      the optimal update $\log q_1(y_1) = \mathbb{E}_{q_2}[\log p(y_1, y_2, x)] + \text{const}$. What
      is the variance of the optimal $q_1$?
    answer:
      numeric: 0.5
      tolerance: 0.001
      hint: a number, 1 decimal
      model: $\log q_1(y_1) = -\tfrac12(2y_1^2 - 2y_1(x - m_2)) + \text{const}$, a Gaussian with precision 2, i.e. variance $1/2$
    explanation: |
      Taking the expectation over $q_2$ replaces $y_2$ by its mean $m_2$ in the cross term and leaves
      $-\frac12(2y_1^2 - 2y_1(x - m_2))$, so $q_1$ is Gaussian with variance $1/2$ and mean $(x -
      m_2)/2$ [^1]. The update for $q_2$ gives $m_2 = (x - m_1)/2$ in the same way, and solving the two
      coupled equations yields $m_1 = m_2 = x/3$, the true posterior means [^1]. The true posterior marginal variance is $2/3$, so
      mean-field VI underestimates it, a known consequence of ignoring the posterior correlation
      [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.2 (b) Mean field variational inference II
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Variational Bayesian methods'
        url: https://en.wikipedia.org/wiki/Variational_Bayesian_methods#Mean_field_approximation
        locator: Mean field approximation
    source:
      id: gutmann-pen-paper
      ref: variational-inference#mean-field-variational-inference-ii-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: probabilistic-models-094
    type: single
    difficulty: medium
    tags:
      - variational-inference
      - mean-field
      - posterior-correlation
    question: |
      For $y_1, y_2, n \sim \mathcal{N}(0, 1)$ independently and $x = y_1 + y_2 + n$, the exact
      posterior is $p(y_1, y_2 \mid x) = \mathcal{N}\left(\tfrac{x}{3}(1, 1)^\top, \tfrac13
      \begin{pmatrix} 2 & -1 \\ -1 & 2 \end{pmatrix}\right)$. How does the optimal mean-field
      approximation $q_1(y_1)\,q_2(y_2)$ compare with it?
    options:
      - text: Same means and same marginal variances, only the correlation is dropped
        why: Mean-field VI matches the conditional precision of each variable, not its marginal variance, and so returns $1/2$ rather than $2/3$ [^1].
      - text: Same means, no correlation, and larger marginal variances, to cover the posterior
        why: Minimising $\mathrm{KL}(q \,\|\, p)$ penalises mass where $p$ is small, so the factorised $q$ shrinks rather than expands [^1][^2].
      - text: Different means, $x/2$ each, because each factor explains $x$ on its own
        why: Solving $m_1 = (x - m_2)/2$ and $m_2 = (x - m_1)/2$ jointly gives $m_1 = m_2 = x/3$, the exact means [^1].
      - text: Same means, no correlation, and smaller marginal variances ($1/2$ instead of $2/3$)
        correct: true
    explanation: |
      The optimal factors are $q_i = \mathcal{N}(x/3, 1/2)$: the means are exact, but the negative
      correlation (an increase in $y_1$ must be compensated by a decrease in $y_2$) is lost [^1]. The
      variance of each factor equals the inverse of the diagonal of the posterior precision matrix,
      $1/2$, which is smaller than the marginal variance $2/3$ [^1][^2]. Underestimated posterior
      uncertainty is typical for mean-field approximations of correlated posteriors.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.2 (b) Mean field variational inference II
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Variational Bayesian methods'
        url: https://en.wikipedia.org/wiki/Variational_Bayesian_methods#Further_discussion
        locator: Further discussion (most important points)
    source:
      id: gutmann-pen-paper
      ref: variational-inference#mean-field-variational-inference-ii-b-2
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
