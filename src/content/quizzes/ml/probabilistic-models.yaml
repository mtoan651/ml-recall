  - id: probabilistic-models-015
    type: short_answer
    difficulty: medium
    tags:
      - gaussian-processes
      - posterior-variance
      - rbf-kernel
      - extrapolation
    question: |
      A zero-mean GP with RBF kernel
      $k(x, x') = a^2 \exp\left(-\frac{(x - x')^2}{2\ell^2}\right)$, $a = 2$, $\ell = 1$, is conditioned
      on noise-free observations with inputs in $[0, 5]$. As the test input moves far from the data
      (say $x = 50$), the posterior standard deviation of $f(x)$ stops growing. Which value does it
      approach?
    answer:
      numeric: 2
      tolerance: 0.01
      hint: a number
      model: $s^2 = k(x,x) - k(x, X) K^{-1} k(X, x) \to k(x,x) = a^2 = 4$, so $s \to a = 2$
    explanation: |
      The posterior variance is $k(x,x) - k(x, x_{1:n}) K^{-1} k(x_{1:n}, x)$ [^1]. Far from the
      data every $k(x, x_i)$ decays to 0, so the subtracted term vanishes and the variance returns to
      the prior variance $k(x, x) = a^2 = 4$, a standard deviation of $2$. The data carry no
      information there, so the posterior reverts to the prior: error bars far from the data reflect
      the prior standard deviation of the process [^2]. A stationary kernel has the same prior
      variance everywhere, hence the plateau.
    references:
      - source: d2l
        locator: Sec. 18.1 Introduction to Gaussian Processes (posterior variance $s^2$; uncertainty grows away from the data)
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 2.3 Varying the Hyperparameters, pp. 20–21 (error bars away from the data reflect the prior standard deviation)
        url: http://gaussianprocess.org/gpml/chapters/RW2.pdf
      - source: d2l
        locator: Sec. 18.1.2 Exercises, Exercise 7
        url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-intro#ex7
      url: https://d2l.ai/chapter_gaussian-processes/gp-intro.html#exercises
