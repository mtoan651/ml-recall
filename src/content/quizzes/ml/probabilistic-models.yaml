  - id: probabilistic-models-031
    type: short_answer
    difficulty: medium
    tags:
      - hmm
      - pos-tagging
      - combinatorics
    question: |
      A part-of-speech tagger uses the tagset {noun, verb, determiner, preposition, punctuation} on
      the 10-token sentence "Will the chair chair the meeting from this chair ?". A table of possible
      word-tag combinations allows only these tags:

      | token | allowed tags |
      | --- | --- |
      | Will | noun, verb |
      | the | noun, determiner |
      | chair | noun, verb |
      | chair | noun, verb |
      | the | noun, determiner |
      | meeting | noun, verb |
      | from | preposition |
      | this | determiner |
      | chair | noun, verb |
      | ? | punctuation |

      Without the table, how many tag sequences (hidden state sequences) are possible for the
      sentence? {{1}} Restricted to the allowed tags, how many are possible? {{2}}
    answer:
      blanks:
        - numeric: 9765625
          tolerance: 0
          pattern: 9,?765,?625|5\s*\^\s*10|5\s*\*\*\s*10
          accept:
            - '9765625'
            - 9,765,625
            - 5^10
          hint: an integer or a power, e.g. 3^4
        - numeric: 128
          tolerance: 0
          pattern: 128|2\s*\^\s*7|2\s*\*\*\s*7
          accept:
            - '128'
            - 2^7
          hint: an integer or a power, e.g. 3^4
      model: $5^{10} = 9{,}765{,}625$ sequences in total; $2^7 \cdot 1^3 = 128$ with the allowed tags
    explanation: |
      Each of the 10 tokens can take any of the 5 tags, so there are $5^{10} = 9{,}765{,}625$ hidden
      state sequences, the $n^T$ growth that makes brute-force decoding infeasible [^1]. With the
      table, seven tokens allow two tags and three tokens (from, this, ?) allow one, so the count
      is $2^7 = 128$. Even then, brute force grows exponentially with sentence length, which is why
      HMM taggers decode with the Viterbi algorithm instead [^2].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 3: Introduction to Hidden Markov Models (HMMs) — 3.2 Total probability of an observation sequence (n^T hidden sequences)'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/03_HMMs-intro.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 4: More HMMs — (Optional) Exercise 4.2: More practice questions; 1. Decoding: The Viterbi algorithm'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/04_More-HMMs.ipynb#ex4.2
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/04_More-HMMs.ipynb
