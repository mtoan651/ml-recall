  - id: probabilistic-models-020
    type: single
    difficulty: medium
    tags:
      - bayesian-networks
      - naive-bayes
      - xor
    question: |
      Naive Bayes fails on XOR data ($y = x_1 \oplus x_2$). A Bayesian network with the edges
      $y \to x_1$, $y \to x_2$ and $x_1 \to x_2$ classifies it perfectly. Why?
    options:
      - text: It models $p(x_2 \mid x_1, y)$, which can encode $x_2 = x_1 \oplus y$
        correct: true
      - text: The extra edge acts like a hidden layer, which makes the model nonlinear
        why: The network has no hidden variables; it only lets $x_2$ depend on $x_1$ as well as on $y$.
      - text: It smooths the counts for $x_2$, which breaks the ties of naive Bayes
        why: Smoothing XOR counts still gives every class-conditional probability $\frac{1}{2}$, so the ties remain.
      - text: It drops the prior $p(y)$, which pulled every posterior to one half
        why: The prior is $\frac{1}{2}$ for both classes and does not cause the ties; the factorization does.
    explanation: |
      By the chain rule, $p(\mathbf{x} \mid y) = p(x_1 \mid y)\, p(x_2 \mid x_1, y)$ holds exactly;
      naive Bayes replaces the second factor by $p(x_2 \mid y)$, assuming conditional independence
      [^1]. In XOR data $x_2 = x_1 \oplus y$, so the full conditional table puts probability 1 on the
      correct $x_2$. With the edge $x_1 \to x_2$ the network learns exactly that, every training
      input gets posterior 1 for its true label, and the classifier is perfect. Without the edge
      every factor is $\frac{1}{2}$ and all posteriors tie [^2].
    references:
      - source: d2l
        locator: Sec. 22.9.2 The Probabilistic Model for Classification (chain rule) and Sec. 22.9.3 The Naive Bayes Classifier
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#the-probabilistic-model-for-classification
      - source: d2l
        locator: Sec. 22.9.6 Exercises, Exercises 1 and 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/naive-bayes#ex3
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#exercises
    status: draft
  - id: probabilistic-models-021
    type: short_answer
    difficulty: medium
    tags:
      - markov-chain
      - conditional-independence
      - factorization
    question: |
      Binary variables form a chain $A \to B \to C$: $B$ depends only on $A$, and $C$ depends only on
      $B$. You know $P(A{=}1) = 0.4$, $P(B{=}1 \mid A{=}1) = 0.7$, $P(B{=}1 \mid A{=}0) = 0.2$,
      $P(C{=}1 \mid B{=}1) = 0.9$ and $P(C{=}1 \mid B{=}0) = 0.3$. What is
      $P(A{=}1, B{=}0, C{=}1)$?
    answer:
      numeric: 0.036
      tolerance: 0.0005
      hint: a probability, 3 decimals
      model: $P(A{=}1)\,P(B{=}0 \mid A{=}1)\,P(C{=}1 \mid B{=}0) = 0.4 \times 0.3 \times 0.3 = 0.036$
    explanation: |
      In general $P(A, B, C) = P(A)\,P(B \mid A)\,P(C \mid A, B)$ [^1]. Because $C$ depends only on
      $B$, it is conditionally independent of $A$ given $B$, so $P(C \mid A, B) = P(C \mid B)$ and the
      joint becomes $P(A)\,P(B \mid A)\,P(C \mid B)$, the factorization of a Markov chain [^1][^2].
      With $P(B{=}0 \mid A{=}1) = 1 - 0.7 = 0.3$, the answer is $0.4 \times 0.3 \times 0.3 = 0.036$.
      For binary variables the chain needs 5 numbers instead of the 7 of a general joint table.
    references:
      - source: d2l
        locator: Sec. 2.6.4 Multiple Random Variables
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
      - title: 'Wikipedia: Markov chain'
        locator: Definition (Markov property)
        url: https://en.wikipedia.org/wiki/Markov_chain
      - source: d2l
        locator: Sec. 2.6.8 Exercises, Exercise 6
        url: https://d2l.ai/chapter_preliminaries/probability.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/probability#ex6
      url: https://d2l.ai/chapter_preliminaries/probability.html#exercises
    status: draft
  - id: probabilistic-models-022
    type: short_answer
    difficulty: easy
    tags:
      - markov-chains
      - conditional-probability
      - marginal-probability
      - mle
    question: |
      You observe four weather sequences, each giving consecutive days (day 0, day 1, ...) in a
      different place:

      1. HOT → HOT → WARM → COLD → WARM
      2. HOT → WARM → WARM → WARM
      3. COLD → COLD → WARM → WARM → WARM → HOT
      4. WARM → HOT → WARM → WARM → WARM → HOT

      By counting, estimate the probability that a day is HOT given that the day before was WARM:
      {{1}}. Also estimate the probability that day 1 is HOT, across the four sequences: {{2}}.
    answer:
      blanks:
        - numeric: 0.3
          tolerance: 0.001
          hint: a decimal, e.g. 0.25
        - numeric: 0.5
          tolerance: 0.001
          hint: a decimal, e.g. 0.25
      model: $P(\text{HOT} \mid \text{WARM}) = 3/10 = 0.3$; $P(\text{day 1 = HOT}) = 2/4 = 0.5$
    explanation: |
      A conditional probability is estimated from transition counts: WARM is followed by another
      day 10 times (6 times by WARM, 3 times by HOT, once by COLD), so
      $P(\text{HOT} \mid \text{WARM}) \approx 3/10$ [^1]. This "learning is counting" rule is the
      maximum-likelihood estimate of a Markov chain's transition probabilities [^2]. The marginal
      question ignores the previous day: day 1 is HOT in sequences 1 and 4 and WARM or COLD in the
      other two, so the estimate is $2/4$ [^1].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 1: Markov Models — Exercise 1.1 Conditioning and marginalization (revision), with answers'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/01_Markov-models.ipynb
      - source: ubc-dsci575
        locator: 'Lecture 2: Applications of Markov Models and Text Preprocessing — 1.1 Learning Markov models'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/02_LMs-text-preprocessing.ipynb
    source:
      id: ubc-dsci575
      ref: lectures/notes/01_Markov-models.ipynb#ex1.1-revision
      url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/01_Markov-models.ipynb
    status: draft
  - id: probabilistic-models-023
    type: multiple
    difficulty: medium
    tags:
      - markov-chains
      - markov-assumption
      - transition-matrix
    question: |
      A Markov chain has states $s_1, \dots, s_n$, an initial distribution $\pi_0$ (a row vector) and
      a transition matrix $T$ whose entry $a_{ij}$ is the probability of moving from $s_i$ to $s_j$.
      Which statements are true? Select all that apply.
    options:
      - text: Under the Markov assumption, the next state $s_{t+1}$ is independent of the earlier states $s_1, \dots, s_{t-1}$ even when the current state $s_t$ is unknown
        why: 'The Markov assumption is a *conditional* independence: the future is independent of the past *given the present*. Without $s_t$, earlier states still carry information about $s_{t+1}$ [^1].'
      - text: The probabilities of moving from a given state to every state, itself included, sum to 1
        correct: true
      - text: The self-loop probabilities of all the states sum to 1
        why: Each *row* of $T$ sums to 1; the diagonal entries come from different rows and can add up to anything between 0 and $n$ [^2].
      - text: The distribution over states at time step $k$ is $\pi_0 T^k$
        correct: true
    explanation: |
      The Markov assumption says the future is conditionally independent of the past given the
      present, $P(s_{t+1} \mid s_0, \dots, s_t) \approx P(s_{t+1} \mid s_t)$ [^1]. Row $i$ of $T$ is
      the distribution of the next state given $s_i$, so $\sum_j a_{ij} = 1$ for every $i$ [^2].
      Multiplying a state distribution by $T$ advances it one step, $\pi_t = \pi_{t-1}T$, so after
      $k$ steps $\pi_k = \pi_0 T^k$ [^3].
    references:
      - source: ubc-dsci575
        locator: 'Lecture 1: Markov Models — 2.3 Markov assumption'
        url: https://github.com/UBC-MDS/DSCI_575_adv-mach-learn/blob/af9d47c5fdaa26aa9a50e0f50cd991cf325f1972/lectures/notes/01_Markov-models.ipynb
