  - id: svm-005
    type: single
    question: |
      Evaluate both statements.

      **Statement 1.** The SVM learning algorithm is guaranteed to find the globally optimal hypothesis with respect to its object function.

      **Statement 2.** After being mapped into feature space Q through a radial basis kernel function, a Perceptron may be able to achieve better classification performance than in its original space (though we can’t guarantee this).
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    source:
      id: mmlu-redux
      ref: machine_learning/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=33
    status: draft
  - id: svm-006
    type: multiple
    question: What are support vectors?
    options:
      - text: The examples farthest from the decision boundary.
      - text: The only examples necessary to compute f(x) in an SVM.
        correct: true
      - text: The data centroid.
      - text: All the examples that have a non-zero weight αk in a SVM.
        correct: true
    explanation: Support vectors are exactly the training examples with non-zero dual weight $\alpha_k$. Since $f(x) = \sum_k \alpha_k y_k K(x_k, x) + b$, they are also the only examples needed to evaluate $f(x)$. MMLU-Redux experts noted that option D is correct as well as B [^1].
    references:
      - source: mmlu-redux
        locator: machine_learning row 34 — multiple_correct_answers
    source:
      id: mmlu-redux
      ref: machine_learning/34
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=34
    status: draft
