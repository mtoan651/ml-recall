  - id: svm-018
    type: short_answer
    difficulty: medium
    tags:
      - svm
      - lagrange-multipliers
      - support-vectors
    question: |
      For the hard-margin linear SVM on negatives $(1, 2)$, $(3, 5)$, $(3, 3)$ and positives
      $(5, 1)$, $(7, 2)$, the solution is $\mathbf{w} = (0.5, -0.5)$, $b = -1$. What is the Lagrange
      multiplier $\alpha$ of the support vector $(5, 1)$?
    answer:
      numeric: 0.25
      tolerance: 0.001
      hint: a decimal, e.g. 0.5
      model: $\mathbf{w} = \alpha(5, 1) - \alpha(3, 3) = \alpha(2, -2) = (0.5, -0.5)$, so $\alpha = 0.25$; all other points have $\alpha = 0$.
    explanation: |
      Only the support vectors $(3, 3)$ and $(5, 1)$ have nonzero $\alpha$, and $\sum_i \alpha_i y_i
      = 0$ forces their multipliers to be equal [^1]. Then $\mathbf{w} = \alpha \cdot (5, 1) - \alpha
      \cdot (3, 3) = (2\alpha, -2\alpha)$, which matches $(0.5, -0.5)$ for $\alpha = 0.25$. A new
      negative point far from the street, such as $(0, 6)$, would get $\alpha = 0$ and change nothing
      [^2].
    references:
      - title: 'Wikipedia: Support vector machine'
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Dual
        locator: Dual
      - source: mit-ocw-6034
        locator: Quiz 4 (2010), Problem 1 SVMs, Parts A2–A3
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz4_2010#q1a2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2010/
