  - id: svm-005
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The SVM learning algorithm is guaranteed to find the globally optimal hypothesis with respect to its objective function.

      **Statement 2.** After being mapped into feature space Q through a radial basis kernel function, a Perceptron may be able to achieve better classification performance than in its original space (though we can’t guarantee this).
    options:
      - text: True, True
        correct: true
      - text: False, False
        why: Both statements are true. SVM training is a convex problem whose optimum is global [^1][^2], and a kernelized perceptron can separate data that are not linearly separable in the input space [^1].
      - text: True, False
        why: Statement 2 is also true. The kernel trick applies to the perceptron, and a linear boundary in the RBF feature space is a non-linear boundary in the input space [^1][^2].
      - text: False, True
        why: Statement 1 is also true. The SVM objective is a convex quadratic program, so the solution that QP software finds is the global optimum [^1][^2].
    explanation: |
      Statement 1 is true. Training an SVM is a convex optimisation problem, a quadratic objective
      with linear constraints, and the maximum-margin hyperplane is a unique solution that standard
      QP software finds [^1][^2]. Statement 2 is also true. The kernel trick works for any algorithm
      written in terms of inner products, the perceptron included [^1]. A linear boundary in the
      enlarged feature space is a non-linear boundary in the original space, and it often separates
      the training classes better [^2]. Better test performance is not guaranteed, though: with
      enough basis functions the model can overfit [^2].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 5.4, p. 59 (kernel perceptron); Sec. 6.4 The optimal margin classifier, p. 66
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 4.5.2 Optimal Separating Hyperplanes, p. 132; Sec. 12.3 Support Vector Machines and Kernels, p. 423
    source:
      id: mmlu-redux
      ref: machine_learning/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=33
    status: reviewed
    reviewed_by: claude
  - id: svm-006
    type: multiple
    difficulty: medium
    question: What are support vectors?
    options:
      - text: The examples farthest from the decision boundary.
        why: Support vectors are the examples closest to the boundary, lying on the margin or on its wrong side.
      - text: The only examples necessary to compute $f(x)$ in an SVM.
        correct: true
      - text: The data centroid.
        why: The centroid is the mean of the data, not a training example, and the SVM decision function does not use it.
      - text: All the examples that have a non-zero weight $\alpha_k$ in an SVM.
        correct: true
    explanation: |
      Support vectors are the training examples with a non-zero dual weight $\alpha_k$; all other
      examples get $\alpha_k = 0$ at the optimum [^1]. The decision function is
      $f(x) = \sum_k \alpha_k y_k K(x_k, x) + b$, so only the support vectors appear in the sum, and
      they are the only examples needed to evaluate $f(x)$ [^1][^2]. They are the examples
      *closest* to the boundary, on the margin or inside it, not the farthest ones, and the centroid
      of the data plays no role.
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: 'Sec. 6.6 Optimal margin classifiers: the dual form, pp. 70-72'
      - title: 'scikit-learn User Guide: Support Vector Machines'
        url: https://scikit-learn.org/stable/modules/svm.html#svc
        locator: Sec. 1.4.7.1 SVC (decision function as a sum over the support vectors)
    source:
      id: mmlu-redux
      ref: machine_learning/34
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=34
    status: reviewed
    reviewed_by: claude
  - id: svm-007
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Support vector machines, like logistic regression models, give a probability distribution over the possible labels given an input example.

      **Statement 2.** We would expect the support vectors to remain the same in general as we move from a linear kernel to higher order polynomial kernels.
    options:
      - text: True, True
        why: Neither holds. An SVM outputs a score and a label, not a probability distribution [^1], and changing the kernel generally changes which points are support vectors [^3].
      - text: False, False
        correct: true
      - text: True, False
        why: Statement 1 is false. An SVM gives a signed score; probabilities need an extra calibration step such as Platt scaling [^1].
      - text: False, True
        why: Statement 2 is false. The dual problem sees the data only through the kernel values, so a new kernel generally picks different support vectors [^2][^3].
    explanation: |
      Statement 1 is false. An SVM outputs a score and a class label, not a probability
      distribution [^1]. scikit-learn can add probability estimates only by fitting an extra
      logistic model to the scores with internal cross-validation (Platt scaling). That step is
      expensive, and its probabilities can even disagree with the predicted labels [^1].
      Statement 2 is also false. The support vectors are the training points with non-zero dual
      weight $\alpha_i$ [^2], and the dual problem sees the data only through the kernel values
      $K(x_i, x_j)$ [^3]. Changing the kernel changes the optimisation problem and the boundary, so
      in general different points become support vectors. In ESL's mixture example, the degree-4
      polynomial and radial kernels left different fractions of the data, 42% and 45%, as
      non-support points [^3].
    references:
      - title: 'scikit-learn User Guide: Support Vector Machines'
        url: https://scikit-learn.org/stable/modules/svm.html#scores-and-probabilities
        locator: Sec. 1.4 (disadvantages); Sec. 1.4.1.2 Scores and probabilities
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: 'Sec. 6.6 Optimal margin classifiers: the dual form, p. 70'
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 12.3.1 Computing the SVM for Classification, eq. (12.19), p. 423; Sec. 12.3.3, p. 429
    source:
      id: mmlu-redux
      ref: machine_learning/35
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=35
    status: reviewed
    reviewed_by: claude
  - id: svm-008
    type: single
    difficulty: medium
    question: Which of the following can only be used when training data are linearly separable?
    options:
      - text: Linear hard-margin SVM.
        correct: true
      - text: Linear Logistic Regression.
        why: Logistic regression can be fitted whether or not the classes are separable; it needs no hyperplane that classifies every point correctly [^3].
      - text: Linear Soft margin SVM.
        why: Its slack variables let points violate the margin, which is exactly what makes it usable on non-separable data [^1][^2].
      - text: The centroid method.
        why: It assigns each point to the class with the nearest mean, which works for any data [^4].
    explanation: |
      A hard-margin SVM requires every training point to satisfy $y_i(w^\top x_i + b) \ge 1$. If
      the data are not linearly separable, no hyperplane meets these constraints, so the problem
      has no solution [^1]. The soft-margin SVM adds slack variables $\xi_i$, with a penalty
      $C\sum_i \xi_i$, precisely so that it works on non-separable data [^1][^2]. Logistic
      regression maximises the conditional likelihood, which can be done for any data set, and on
      separable data it still finds a separating hyperplane [^3]. The nearest-centroid method
      assigns each point to the class whose mean is closest, which needs no separability at all [^4].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 6.4, p. 66; Sec. 6.7 Regularization and the non-separable case, p. 73
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 12.2 The Support Vector Classifier, pp. 417-419
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 4.4.5, p. 127; Sec. 4.5.2, p. 134
      - title: 'scikit-learn User Guide: Nearest Neighbors'
        url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-centroid-classifier
        locator: Sec. 1.6.5 Nearest Centroid Classifier
    source:
      id: mmlu-redux
      ref: machine_learning/36
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=36
    status: reviewed
    reviewed_by: claude
  - id: svm-009
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** The maximum margin decision boundaries that support vector machines construct have the lowest generalization error among all linear classifiers.

      **Statement 2.** Any decision boundary that we get from a generative model with class-conditional Gaussian distributions could in principle be reproduced with an SVM and a polynomial kernel of degree less than or equal to three.
    options:
      - text: True, True
        why: Statement 1 is false. A large margin is a heuristic, and when the classes really are Gaussian with a shared covariance, LDA does better [^1].
      - text: False, False
        why: Statement 2 is true. Gaussian class-conditional densities give at most quadratic boundaries, which a degree-2 polynomial kernel can represent [^2][^3].
      - text: True, False
        why: Both verdicts are reversed. No linear classifier is guaranteed the lowest test error [^1], and a degree-2 kernel already covers every quadratic Gaussian boundary [^2][^3].
      - text: False, True
        correct: true
    explanation: |
      Statement 1 is false. A large margin is a well-motivated heuristic: the intuition is that a
      wide margin on the training data leads to good separation on test data. Nothing guarantees
      that it beats every other linear classifier [^1]. If the classes really are Gaussian with a
      shared covariance, LDA is optimal, and the separating hyperplane pays a price for focusing
      on the noisier points near the class boundaries [^1]. Statement 2 is true. With
      class-conditional Gaussians, the decision boundary is at most quadratic in $x$; QDA gives
      quadratic decision surfaces [^2]. A polynomial kernel $(x^\top z + c)^k$ corresponds to all
      monomials up to degree $k$ [^3]. A degree-2 kernel, which satisfies the "degree $\le 3$"
      condition, can therefore represent any such boundary.
    references:
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 4.5.2 Optimal Separating Hyperplanes, p. 134
      - title: 'scikit-learn User Guide: Linear and Quadratic Discriminant Analysis'
        url: https://scikit-learn.org/stable/modules/lda_qda.html#mathematical-formulation-of-the-lda-and-qda-classifiers
        locator: Sec. 1.2 (introduction); Sec. 1.2.2 Mathematical formulation of the LDA and QDA classifiers
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 5.4 Properties of kernels, p. 56
    source:
      id: mmlu-redux
      ref: machine_learning/47
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=47
    status: reviewed
    reviewed_by: claude
  - id: svm-010
    type: single
    difficulty: medium
    question: Which of the following is true regarding an SVM?
    options:
      - text: For two dimensional data points, the separating hyperplane learnt by a linear SVM will be a straight line.
        correct: true
      - text: In theory, a Gaussian kernel SVM cannot model any complex separating hyperplane.
        why: The Gaussian kernel corresponds to an infinite-dimensional feature space and can produce very flexible boundaries [^1][^2].
      - text: For every kernel function used in a SVM, one can obtain an equivalent closed form basis expansion.
        why: The Gaussian kernel's feature space is infinite-dimensional, so it has no equivalent finite basis expansion [^2].
      - text: Overfitting in an SVM is not a function of number of support vectors.
        why: The fraction of support vectors bounds the leave-one-out error, so many support vectors can signal overfitting [^1].
    explanation: |
      In two dimensions a hyperplane $\{x : w^\top x + b = 0\}$ is a straight line, so a linear
      SVM's decision boundary there is a line [^1]. The other statements are false:
      - A Gaussian (RBF) kernel corresponds to an infinite-dimensional feature map and can produce
        very flexible boundaries. On ESL's mixture data it came close to the Bayes-optimal
        boundary [^1][^2].
      - Because that feature space is infinite-dimensional, not every kernel has an equivalent
        finite, closed-form basis expansion [^1][^2].
      - The number of support vectors is linked to overfitting. The leave-one-out cross-validation
        error is bounded above by the fraction of training points that are support vectors [^1].
    references:
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 12.2, p. 418 (hyperplane); Sec. 12.2.2, p. 421 (leave-one-out bound); Sec. 12.3, pp. 423-424 (kernels)
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 5.4 Properties of kernels, p. 57
    source:
      id: mmlu-redux
      ref: machine_learning/69
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=69
    status: reviewed
    reviewed_by: claude
  - id: svm-011
    type: single
    difficulty: medium
    question: How does a support vector regressor (SVR) learn?
    options:
      - text: By fitting a hyperplane with an ε-wide tube around it and penalizing only the points outside the tube
        correct: true
      - text: By learning the full probability distribution that generated the training data, then sampling from it
        why: That describes a generative model. SVR fits a single regression function and models no distribution [^1].
      - text: By grouping the data points into clusters of similar values
        why: Grouping points into clusters is unsupervised clustering; SVR is a supervised regressor trained on target values [^2].
    explanation: |
      ε-SVR fits a function, a hyperplane in the kernel's feature space, and penalizes only samples
      whose prediction is at least ε away from their true target, that is, points that fall outside
      the "ε-tube" around the function [^1]. Because the cost ignores samples predicted within ε of
      their target, the model depends on only a subset of the training data, the support vectors
      [^2]. ML for Beginners describes SVR as finding the best-fit hyperplane that contains the
      maximum number of data points, a loose description of the same idea [^3]. SVR does not model
      the probability distribution of the data, and it is a supervised regressor, not a clustering
      method.
    references:
      - title: 'scikit-learn User Guide: Support Vector Machines'
        url: https://scikit-learn.org/stable/modules/svm.html#svr
        locator: Sec. 1.4.7.2 SVR (mathematical formulation)
      - title: 'scikit-learn User Guide: Support Vector Machines'
        url: https://scikit-learn.org/stable/modules/svm.html#svm-regression
        locator: Sec. 1.4.2 Regression
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
        locator: 'Lesson: Time series forecasting with Support Vector Regressor, sec. SVR in the context of time series'
    source:
      id: ms-ml-for-beginners
      ref: quiz-52/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: svm-012
    type: single
    difficulty: easy
    tags:
      - svm
      - rbf-kernel
      - gamma
      - model-complexity
    question: For an SVM with an RBF kernel, what is increasing the hyperparameter `gamma` most likely to do?
    options:
      - text: Make the model more sensitive to individual training points
        correct: true
      - text: Make the decision boundary closer to a straight line
        why: A smoother, flatter boundary comes from a *smaller* `gamma`, where each support vector influences a wide region [^2].
      - text: Reduce the complexity of the model
        why: Larger `gamma` gives a more complex model, not a simpler one [^1].
      - text: Lower the risk of overfitting
        why: Raising `gamma` raises complexity and with it the risk of overfitting [^1].
    explanation: |
      `gamma` controls the fundamental trade-off of an RBF SVM: larger `gamma` gives a more complex
      model, smaller `gamma` a simpler one [^1]. The reason is the kernel's reach: `gamma` sets how
      far the influence of a single training example extends, low values meaning far and high
      values meaning close [^2]. With a large `gamma` each support vector only affects its immediate
      neighbourhood, so the boundary can bend around individual points, which raises training
      accuracy and the risk of overfitting.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Relation of gamma and the fundamental trade-off'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
      - title: 'scikit-learn example: RBF SVM parameters'
        locator: Explanation of the gamma parameter
        url: https://scikit-learn.org/stable/auto_examples/svm/plot_rbf_parameters.html
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/midterm_prep.pdf#q14
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/midterm_prep.pdf
    status: reviewed
