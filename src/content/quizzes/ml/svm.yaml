title: Support Vector Machines
questions:
  - id: svm-001
    type: single
    difficulty: easy
    question: 'Support vector machines (SVMs) can be used for:'
    options:
      - text: classification but not regression
        why: SVMs also do regression. Support Vector Regression (SVR) fits a function and ignores training points whose prediction is already close to the target [^2].
      - text: regression but not classification
        why: Classification is the original use of SVMs; scikit-learn's SVC, NuSVC and LinearSVC are support-vector classifiers [^2].
      - text: both classification and regression
        correct: true
    explanation: |
      Support vector machines are a family of methods used for both classification and regression
      [^1][^2]. Support-vector classifiers such as scikit-learn's SVC, NuSVC and LinearSVC handle
      classification. The same method extended to regression is Support Vector Regression (SVR),
      which fits a function and ignores training points whose prediction is already close to the
      target [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#support-vector-classifier
