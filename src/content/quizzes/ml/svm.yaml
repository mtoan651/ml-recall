  - id: svm-014
    type: single
    difficulty: hard
    tags:
      - svm
      - margin
      - support-vectors
      - canonical-form
    question: |
      Training data: negatives $(-1, 0)$ and $(2, -2)$, positive $(1, 0)$ (labels $-1$ and $+1$).
      A linear SVM is written as $h(\mathbf{x}) = \mathbf{w} \cdot \mathbf{x} + b$ in canonical form:
      $y_i\,h(\mathbf{x}_i) \ge 1$ for all points, with equality for the support vectors, and
      $\lVert \mathbf{w} \rVert$ as small as possible. Which $(\mathbf{w}, b)$ is the SVM solution?
    options:
      - text: $\mathbf{w} = (1, 2)$, $b = 0$
        why: It separates the data, but $\lVert \mathbf{w} \rVert^2 = 5 > 3.25$, so its margin $2/\lVert \mathbf{w} \rVert$ is smaller.
      - text: $\mathbf{w} = (1, 1.5)$, $b = 0$
        correct: true
      - text: $\mathbf{w} = (1, 1)$, $b = 0$
        why: The point $(2, -2)$ gives $h = 0$; it lies on the boundary instead of on its gutter.
      - text: $\mathbf{w} = (2, 3)$, $b = 0$
        why: Same boundary line, but every $y_i h(\mathbf{x}_i)$ equals 2; dividing by 2 gives a smaller $\lVert \mathbf{w} \rVert$, so this is not the canonical solution.
    explanation: |
      With $\mathbf{w} = (1, 1.5)$, $b = 0$ all three points satisfy $y_i h(\mathbf{x}_i) = 1$, so all
      are support vectors, and the multipliers solving $\mathbf{w} = \sum_i \alpha_i y_i
      \mathbf{x}_i$, $\sum_i \alpha_i y_i = 0$ are $\alpha = (0.875, 0.75, 1.625)$, all positive, which
      confirms optimality [^1][^2]. Scaling $(\mathbf{w}, b)$ keeps the boundary but breaks the
      canonical condition, and $(1, 2)$ has a narrower street.
    references:
      - title: 'Wikipedia: Support vector machine'
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Hard-margin
        locator: Hard-margin
      - source: mit-ocw-6034-s05
        locator: Quiz 2 (Spring 2005) solutions, Problem 9 SVM, part 1
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    source:
