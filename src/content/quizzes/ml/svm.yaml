  - id: svm-015
    type: short_answer
    difficulty: medium
    tags:
      - svm
      - polynomial-kernel
      - dual-form
    question: |
      An SVM uses the kernel $K(\mathbf{u}, \mathbf{v}) = (1 + \mathbf{u} \cdot \mathbf{v})^2$. Its
      support vectors are $(-1, 2)$ with label $+1$ and $(1, 2)$ with label $-1$, both with
      $\alpha = 0.05$, and $b = 0$. What does $h(\mathbf{x}) = \sum_i \alpha_i y_i K(\mathbf{x}_i,
      \mathbf{x}) + b$ output for $\mathbf{x} = (1, 3)$?
    answer:
      numeric: -1.4
      tolerance: 0.001
      hint: a decimal, e.g. 0.75
      model: $0.05(1 + 5)^2 - 0.05(1 + 7)^2 = 1.8 - 3.2 = -1.4$
    explanation: |
      In the dual form the classifier is a weighted sum of kernel values with the support vectors
      [^1]. $(-1, 2) \cdot (1, 3) = 5$ and $(1, 2) \cdot (1, 3) = 7$, so $h = 0.05 \cdot 36 - 0.05
      \cdot 64 = -1.4$: class $-1$, outside the street. The same formula gives exactly $+1$ and $-1$
      at the two support vectors, which is why $b = 0$ [^2].
    references:
      - title: 'Wikipedia: Support vector machine'
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Kernel_trick
        locator: Kernel trick
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 7 SVMs
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q7
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: svm-016
    type: short_answer
    difficulty: medium
    tags:
      - svm
      - lagrange-multipliers
      - dual-form
    question: |
      A linear SVM is trained on two one-dimensional points: $x_1 = 0$ with label $+1$ and $x_2 = 4$
      with label $-1$. What is the Lagrange multiplier $\alpha_1$ (equal to $\alpha_2$) of the
      maximum-margin solution?
    answer:
      numeric: 0.125
      tolerance: 0.001
      hint: a decimal, e.g. 0.5
      model: $w = -0.5$, $b = 1$; $w = \sum_i \alpha_i y_i x_i = -4\alpha_2$ gives $\alpha_1 = \alpha_2 = 1/8$
    explanation: |
      The boundary lies halfway, at $x = 2$, with gutters at the two points: $w \cdot 0 + b = 1$ and
      $4w + b = -1$ give $b = 1$, $w = -0.5$ [^1]. The dual conditions $\sum_i \alpha_i y_i = 0$ and
      $w = \sum_i \alpha_i y_i x_i = \alpha_1 \cdot 0 - 4\alpha_2$ then give $\alpha_1 = \alpha_2 =
      1/8$ [^2].
    references:
      - title: 'Wikipedia: Support vector machine'
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Dual
        locator: Dual
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 4.4 SVM
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q4.4
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: svm-017
    type: short_answer
    difficulty: hard
    tags:
      - svm
      - margin
      - support-vectors
    question: |
      Negative points: $(1, 2)$, $(3, 5)$, $(3, 3)$. Positive points: $(5, 1)$, $(7, 2)$. What is the
      width of the street (the distance between the two gutters) of the hard-margin linear SVM? Round
      to 2 decimals.
    answer:
      numeric: 2.83
      tolerance: 0.01
      hint: a decimal, 2 decimal places
      model: Support vectors $(3, 3)$ and $(5, 1)$; $\mathbf{w} = (0.5, -0.5)$, $b = -1$; width $2/\lVert \mathbf{w} \rVert = 2\sqrt{2} \approx 2.83$
    explanation: |
      The closest opposite pair is $(3, 3)$ and $(5, 1)$, and the perpendicular bisector of that
      segment, $x - y = 2$, separates all points with room to spare: every other point is farther
      from it [^1]. In canonical form $\mathbf{w} = (0.5, -0.5)$, $b = -1$ puts both support vectors
      on the gutters, and the width is $2/\lVert \mathbf{w} \rVert = 2\sqrt{2} \approx 2.83$, the
      distance between the two support vectors [^2].
    references:
      - title: 'Wikipedia: Support vector machine'
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Hard-margin
        locator: Hard-margin
      - source: mit-ocw-6034
        locator: Quiz 4 (2010), Problem 1 SVMs, Part A1–A2
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz4_2010#q1a1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2010/
