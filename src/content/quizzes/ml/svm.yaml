  - id: svm-002
    type: single
    difficulty: easy
    question: SVM stands for
    options:
      - text: Statistical Vector Machine
      - text: Support Vector Machine
        correct: true
      - text: Statistical Vector Model
    explanation: |
      SVM stands for Support Vector Machine [^1]. The name comes from the support vectors: the
      decision function uses only this subset of the training points [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
