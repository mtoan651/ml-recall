  - id: svm-013
    type: multiple
    difficulty: medium
    tags:
      - svm
      - rbf-kernel
      - gamma
      - curse-of-dimensionality
      - support-vectors
    question: Which statements about $k$-NN and SVMs with an RBF kernel are true? Select all that apply.
    options:
      - text: $k$-NN may perform poorly in high-dimensional spaces (say, $d > 1000$)
        correct: true
      - text: In an RBF SVM, large values of `gamma` tend to give a higher training score but probably a lower validation score
        correct: true
      - text: If we increase both `gamma` and `C`, we cannot tell whether the model becomes more or less complex
        why: Both hyperparameters push the same way, since larger `gamma` and larger `C` each mean a more complex model, so increasing both certainly increases complexity [^2].
      - text: Like $k$-NN, an RBF SVM must keep every training example to make predictions
        why: An SVM only needs its support vectors; the decision boundary depends on them alone [^3].
    explanation: |
      $k$-NN suffers from the curse of dimensionality: with many (irrelevant) features, accidental
      similarity swamps meaningful similarity [^1]. For an RBF SVM, both `gamma` and `C` control
      the fundamental trade-off in the same direction, so large values give more complex models
      with higher training scores and a greater risk of overfitting [^2]. Unlike $k$-NN, the SVM
      remembers only the key examples, the support vectors, which alone define the decision
      boundary [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Curse of dimensionality'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
