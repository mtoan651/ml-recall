  - id: svm-019
    type: single
    difficulty: medium
    tags:
      - svm
      - rbf-kernel
      - overfitting
      - cross-validation
    question: |
      An SVM with a Gaussian (RBF) kernel of width $\sigma$ fits its training set perfectly but does
      poorly on new data. Which change is most likely to help?
    options:
      - text: Raise the bound $C$ on the multipliers so no training point can be misclassified
        why: Allowing larger multipliers lets the classifier chase every training point, which increases overfitting.
      - text: Choose a larger $\sigma$ (and the bound on the multipliers) by cross-validation
        correct: true
      - text: Choose a smaller $\sigma$ so that each training point is fit more precisely
        why: A narrower Gaussian around each point makes the boundary even more wiggly; small $\sigma$ is the overfitting direction.
      - text: Switch to a polynomial kernel of much higher degree
        why: High-degree polynomial kernels are another way to overfit, not a cure for it.
    explanation: |
      A small $\sigma$ gives each support vector a narrow bump, so the decision boundary can wrap
      tightly around individual training points; large multipliers have a similar effect [^1][^2].
      Picking $\sigma$ and the multiplier bound by cross-validation trades training fit for
      smoothness and usually improves accuracy on new data [^1].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 2 Overfitting, Part D SVM
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
      - title: 'Wikipedia: Radial basis function kernel'
        url: https://en.wikipedia.org/wiki/Radial_basis_function_kernel
        locator: Introduction (definition and the role of σ)
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q2d-sp-overfit
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: svm-020
    type: single
    difficulty: medium
    tags:
      - kernel-trick
      - feature-map
      - svm
    question: |
      One-dimensional data alternates between clusters of + and − points along the $x$ axis, so it is
      not linearly separable. A student separates it with an SVM using the kernel
      $$K(x_1, x_2) = \cos\tfrac{\pi x_1}{4} \cos\tfrac{\pi x_2}{4} + \sin\tfrac{\pi x_1}{4} \sin\tfrac{\pi x_2}{4}.$$
      Which feature map $\Phi$ satisfies $K(x_1, x_2) = \Phi(x_1) \cdot \Phi(x_2)$?
    options:
      - text: $\Phi(x) = \left(\cos^2\frac{\pi x}{4},\ \sin^2\frac{\pi x}{4}\right)$
        why: This gives $\cos^2 \cos^2 + \sin^2 \sin^2$, squares that do not appear in $K$.
      - text: $\Phi(x) = \left(x,\ \cos\frac{\pi x}{4}\right)$
        why: The product would contain $x_1 x_2$, which $K$ does not have.
      - text: $\Phi(x) = \left(\cos\frac{\pi x}{4} + \sin\frac{\pi x}{4}\right)$
        why: Its square would add cross terms $\cos\frac{\pi x_1}{4} \sin\frac{\pi x_2}{4}$ that are not in $K$.
      - text: $\Phi(x) = \left(\cos\frac{\pi x}{4},\ \sin\frac{\pi x}{4}\right)$
        correct: true
    explanation: |
      $K$ is literally a dot product of the two-component vectors $(\cos\frac{\pi x}{4},
      \sin\frac{\pi x}{4})$, and it simplifies to $\cos\frac{\pi (x_1 - x_2)}{4}$ [^1]. $\Phi$ wraps
      the line onto the unit circle with period 8, so points 4 apart land on opposite sides; clusters
      that alternate along the line can then be cut by a straight line in the plane [^1][^2].
    references:
      - title: 'Wikipedia: Kernel method'
        url: https://en.wikipedia.org/wiki/Kernel_method#Mathematics:_the_kernel_trick
        locator: 'Mathematics: the kernel trick'
      - source: mit-ocw-6034
        locator: Quiz 4 (2008), Problem 1 Support Vectors, Part B
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2008/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz4_2008#q1b
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz4_2008/
    status: reviewed
    reviewed_by: claude
  - id: svm-021
    type: single
    difficulty: medium
    tags:
      - polynomial-kernel
      - feature-map
      - svm
    question: |
      One-dimensional data: positives at $x = -1, 1$ and negatives at $x = -3, -2, 2, 3$. A linear SVM
      cannot separate them, but an SVM with $K(x, z) = (1 + xz)^2$ can. Why?
    options:
      - text: The kernel doubles every coordinate, which spreads the classes apart on the line
        why: Scaling the line does not change the order of the points, so they would still alternate.
      - text: In the feature space $(1, \sqrt{2}\,x, x^2)$ the classes split by $x^2$, e.g. at $x^2 = 2.5$
        correct: true
      - text: Any kernel can separate any data, so the degree does not matter
        why: A degree-1 polynomial kernel is just a linear SVM, which fails here.
      - text: The kernel ignores the sign of $x$, so it maps the data to $|x|$ on a line
        why: The feature map keeps the sign in the $\sqrt{2}\,x$ coordinate; it is the $x^2$ coordinate that separates.
    explanation: |
      Expanding $(1 + xz)^2 = 1 + 2xz + x^2 z^2$ shows that $K(x, z) = \Phi(x) \cdot \Phi(z)$ with
      $\Phi(x) = (1, \sqrt{2}\,x, x^2)$ [^1]. The positives have $x^2 = 1$ and the negatives $x^2 \ge 4$,
      so a line in feature space that ignores the middle coordinate, $x^2 = 2.5$, separates them with
      the widest margin [^1][^2].
    references:
      - title: 'Wikipedia: Polynomial kernel'
        url: https://en.wikipedia.org/wiki/Polynomial_kernel#Definition
        locator: Definition (explicit feature map for degree 2)
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 1 Classification, Part D (polynomial kernel, d = 2)
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q1d
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: svm-022
    type: short_answer
    difficulty: medium
    tags:
      - hard-margin
      - geometric-margin
      - convex-hull
    question: |
      A hard-margin linear SVM (with an offset) is trained on four points in the plane:
      positives $(0, 0)$ and $(2, 2)$, negatives $(0.5, 1)$ and $(0, 3)$. What is the geometric
      margin, i.e. the distance from the maximum-margin boundary to the closest training point?
    answer:
      numeric: 0.177
      tolerance: 0.002
      hint: a distance, 3 decimals
      model: $\frac{1 - 0.5}{2\sqrt{2}} \approx 0.177$
    explanation: |
      For separable data the maximum-margin boundary is the perpendicular bisector of the shortest
      segment between the two classes' convex hulls, so the margin is half the hull distance [^2].
      The positive hull is the segment from $(0,0)$ to $(2,2)$ on the line $x_2 = x_1$; the
      closest negative, $(0.5, 1)$, lies $|0.5 - 1|/\sqrt{2} \approx 0.354$ from it, and its
      projection $(0.75, 0.75)$ falls inside the segment. Half of that gives $0.177$. Moving the
      negative to $(h, 1)$ keeps the boundary's orientation (normal along $(1, -1)$) and shrinks
      the margin linearly to 0 at $h = 1$ [^1]. The MIT 6.867 solution reports the margin as
      $(1-h)/\sqrt{2}$, which is the full gap between the classes, $2/\lVert w \rVert$, rather than
      the distance from the boundary to the closest point asked for here [^1][^2].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2004) solutions, Problem 5, parts 1–3
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
      - title: 'Wikipedia: Support vector machine'
        locator: Linear SVM — Hard-margin (distance between the two margin hyperplanes is 2/‖w‖)
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Hard-margin
    source:
      id: mit-ocw-6867
      ref: midterm_f04soln#q5.3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-023
    type: short_answer
    difficulty: medium
    tags:
      - polynomial-kernel
      - separability
      - feature-map
    question: |
      Four one-dimensional training points are labelled $x = 0$: $+1$, $x = 1$: $-1$, $x = 2$: $+1$,
      $x = 3$: $-1$. An SVM uses the polynomial kernel $K(x, x') = (1 + x x')^p$. What is the
      smallest degree $p$ for which the points are separable?
    answer:
      numeric: 3
      tolerance: 0
      hint: an integer
      model: $p = 3$, e.g. $f(x) = -(x - 0.5)(x - 1.5)(x - 2.5)$
    explanation: |
      The kernel $(1 + x x')^p$ corresponds to the features $1, x, \dots, x^p$, so the decision
      function is a polynomial of degree at most $p$ [^2]. Along the line the labels go
      $+, -, +, -$: the sign changes three times, so the polynomial needs at least three real roots,
      which rules out $p = 1$ and $p = 2$. With $p = 3$ the cubic $-(x - 0.5)(x - 1.5)(x - 2.5)$ is
      positive at 0 and 2 and negative at 1 and 3. The MIT 6.867 exam gets these four labelled
      points by keeping only the second coordinate of four points in the plane, and its answer is
      also $p = 3$ [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2004) solutions, Problem 5, part 4
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
      - title: 'Wikipedia: Polynomial kernel'
        locator: Definition
        url: https://en.wikipedia.org/wiki/Polynomial_kernel#Definition
    source:
      id: mit-ocw-6867
      ref: midterm_f04soln#q5.4
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-024
    type: short_answer
    difficulty: medium
    tags:
      - feature-map
      - geometric-margin
    question: |
      Two training points on the real line, $x = 1$ with label $+1$ and $x = 3$ with label $-1$,
      give a hard-margin SVM margin of 1 when the input $x$ is used directly. What is the margin
      (distance from the maximum-margin boundary to either point, measured in feature space) when
      the SVM uses the feature vector $\phi(x) = [x, x^2]^\top$ instead?
    answer:
      numeric: 4.123
      tolerance: 0.005
      hint: a distance, 3 decimals
      model: $\tfrac{1}{2}\lVert(1,1) - (3,9)\rVert = \tfrac{\sqrt{68}}{2} = \sqrt{17} \approx 4.123$
    explanation: |
      With only two points, the maximum-margin boundary is the perpendicular bisector of the segment
      joining them, so the margin is half their distance [^2]. In feature space the points are
      $(1, 1)$ and $(3, 9)$, which are $\sqrt{4 + 64} = \sqrt{68}$ apart, so the margin is
      $\sqrt{17} \approx 4.12$, larger than the margin 1 in the input space [^1]. The bigger number
      says little about generalization: scaling the features to $[2x, 2x^2]$ doubles the margin
      again without moving the decision boundary [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2003) solutions, Problem 3, parts 3–5
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f03soln/
      - title: 'Wikipedia: Support vector machine'
        locator: Linear SVM — Hard-margin
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Hard-margin
    source:
      id: mit-ocw-6867
      ref: midterm_f03soln#q3.3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f03soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-025
    type: true_false
    difficulty: medium
    tags:
      - kernel
      - geometric-margin
      - generalization
    shuffle: false
    question: |
      Two SVMs with different kernels are trained on the same separable training set. The one that
      reaches the larger margin (measured in its own feature space) can be expected to generalize
      better.
    options:
      - text: 'True'
        why: Margins in different feature spaces are not comparable; multiplying a kernel by 4 doubles the margin without changing the classifier [^1].
      - text: 'False'
        correct: true
    explanation: |
      The margin is measured in each kernel's own feature space, so its raw size depends on the
      scale of that space. Scaling the feature vectors (for example $\phi(x) \to 2\phi(x)$, i.e.
      $K \to 4K$) doubles the margin while leaving the decision boundary, and hence the test error,
      unchanged [^1]. This follows from the margin being $1/\lVert w \rVert$: scaled features need
      a weight vector half as long to reach the same functional margin [^2]. A margin only says
      something about generalization once it is normalized, for example relative to the spread of
      the data in the same feature space [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2003) solutions, Problem 3, parts 4–5
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f03soln/
      - title: 'Wikipedia: Support vector machine'
        locator: Linear SVM — Hard-margin
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Hard-margin
    source:
      id: mit-ocw-6867
      ref: midterm_f03soln#q3.5
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f03soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-026
    type: single
    difficulty: hard
    tags:
      - dual
      - soft-margin
      - box-constraint
      - label-noise
    question: |
      The SVM dual maximizes $\sum_i \alpha_i - \frac{1}{2}\sum_{i,j}\alpha_i\alpha_j y_i y_j K(x_i, x_j)$
      subject to $\sum_i \alpha_i y_i = 0$ plus bounds on the $\alpha_i$. You have a few positive
      examples that are certainly labelled correctly and many negatives, some of them mislabelled.
      Positives must never violate the margin, while negatives may. Which bounds implement this?
    options:
      - text: $\alpha_i \ge 0$ for positives and $0 \le \alpha_i \le C$ for negatives
        correct: true
      - text: $0 \le \alpha_i \le C$ for positives and $\alpha_i \ge 0$ for negatives
        why: This is reversed. A capped $\alpha_i$ lets that example pay slack and violate its margin, so it would protect the noisy negatives instead.
      - text: $0 \le \alpha_i \le C$ for every example
        why: That is the ordinary soft-margin SVM, which lets the trusted positives violate the margin as well.
      - text: $\alpha_i = 0$ for every negative example
        why: Then $\sum_i \alpha_i y_i = 0$ forces all positive $\alpha_i$ to zero too, and no classifier is learned.
    explanation: |
      In the soft-margin dual, the upper bound $\alpha_i \le C$ comes from the slack penalty
      $C\xi_i$ in the primal: a capped multiplier means the constraint $y_i f(x_i) \ge 1 - \xi_i$
      can be bought off with slack [^2]. Leaving $\alpha_i$ unbounded is the hard-margin case, where
      the constraint must hold exactly. So the trusted positives keep $\alpha_i \ge 0$ only, and the
      negatives get $0 \le \alpha_i \le C$ (the source calls this constant $C^-$), which limits how
      strongly their margin constraints are enforced [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2006) solutions, Problem 3, part 1
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
      - title: 'Wikipedia: Support vector machine'
        locator: Computing the SVM classifier — Dual
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Dual
    source:
      id: mit-ocw-6867
      ref: midterm_f06soln#q3.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-027
    type: single
    difficulty: hard
    tags:
      - cross-validation
      - hyperparameters
      - label-noise
    question: |
      An SVM enforces the margin constraints of all positive examples exactly and caps the dual
      variables of the negative examples at $C^-$, because some negatives may be mislabelled. Which
      leave-one-out criterion is **not** a sensible way to choose $C^-$?
    options:
      - text: Leave out each negative example in turn and count how many of those are misclassified
        why: This works. The positives are already forced to be correct, and the negatives' held-out errors measure how well the chosen $C^-$ generalizes.
      - text: Leave out each positive example in turn and count how many of those are misclassified
        correct: true
      - text: Leave out every example in turn, positive or negative, and count all misclassifications
        why: This is ordinary leave-one-out cross-validation, and it works here as well.
    explanation: |
      Leave-one-out cross-validation estimates the test error by training on all but one example
      and testing on the held-out one [^2]. A criterion that tests only the positives rewards a
      $C^-$ that ignores the negatives: shrinking $C^-$ toward 0 removes the negatives' constraints,
      which can only help the positives, so the "optimal" setting is degenerate [^1]. Counting
      errors on held-out negatives, or on all examples, measures what $C^-$ actually controls.
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2006) solutions, Problem 3, part 2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
      - title: 'Wikipedia: Cross-validation (statistics)'
        locator: Exhaustive cross-validation — Leave-one-out cross-validation
        url: https://en.wikipedia.org/wiki/Cross-validation_(statistics)#Exhaustive_cross-validation
    source:
      id: mit-ocw-6867
      ref: midterm_f06soln#q3.2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-028
    type: single
    difficulty: medium
    tags:
      - rbf-kernel
      - decision-function
      - extrapolation
    question: |
      A trained SVM with the radial basis kernel $K(x, x') = \exp(-\lVert x - x' \rVert^2 / 2)$
      predicts with $f(x) = \sum_{j \in SV} y_j \hat\alpha_j K(x_j, x) + \hat w_0$. What happens to
      $f(x)$ at a test point $x$ that is very far from every training point?
    options:
      - text: It approaches 0, whatever the value of $\hat w_0$
        why: Only the kernel terms vanish; the offset $\hat w_0$ is added to every prediction.
      - text: It approaches $y_j \hat\alpha_j$ of the nearest support vector
        why: Far from all training points even the nearest support vector's kernel value is close to 0, so its term vanishes too.
      - text: It approaches the offset $\hat w_0$
        correct: true
      - text: It grows without bound with the distance
        why: The RBF kernel lies in $(0, 1]$ and decays with distance, so the sum of kernel terms stays bounded and shrinks.
    explanation: |
      The radial basis kernel decays to 0 as $\lVert x - x_j \rVert$ grows [^2], so every term of the
      sum over support vectors vanishes far from the data and only $\hat w_0$ remains [^1]. Far away
      the classifier therefore predicts the sign of $\hat w_0$, whatever the local structure of the
      data was. With $\hat w_0 = 0$ such a point would sit on the decision boundary, and if it were
      added to the training set it would have to become a support vector to satisfy its margin
      constraint [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2002) solutions, Problem 3, parts 1–3
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
      - title: 'Wikipedia: Radial basis function kernel'
        locator: Introduction (the kernel decreases with distance and ranges between zero and one)
        url: https://en.wikipedia.org/wiki/Radial_basis_function_kernel
    source:
      id: mit-ocw-6867
      ref: midterm_f02soln#q3.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-029
    type: single
    difficulty: hard
    tags:
      - kernel
      - normalized-kernel
      - decision-boundary
    question: |
      An SVM with an offset uses the normalized linear kernel
      $K(x, x') = \dfrac{x^\top x'}{\lVert x \rVert\,\lVert x' \rVert}$ on points $x \in \mathbb{R}^2$
      (none at the origin). What shape can its decision regions have in the original input plane?
    options:
      - text: Half-planes, because the kernel is still a linear kernel up to scaling
        why: The scaling depends on the point itself ($x / \lVert x \rVert$), so the map is not linear and the boundary is not a line in general.
      - text: Discs centred at the origin, since the feature map keeps only $\lVert x \rVert$
        why: It is the other way round; the feature map $x / \lVert x \rVert$ discards the norm and keeps only the direction.
      - text: Arbitrary curved regions, as with a radial basis kernel
        why: The discriminant depends only on the direction of $x$, so a region that contains $x$ contains the whole ray through it.
      - text: Wedges bounded by rays from the origin, since $f(sx) = f(x)$ for every $s > 0$
        correct: true
    explanation: |
      The kernel is an inner product of the feature vectors $\phi(x) = x / \lVert x \rVert$, which
      lie on the unit circle [^1][^2]. The discriminant $f(x) = w^\top \phi(x) + w_0$ therefore
      depends only on the direction of $x$: scaling a point by $s > 0$ does not change it. A line in
      feature space cuts the unit circle in at most two points, and the rays from the origin through
      those points form the decision boundary in the input plane [^1]. That is why points that are
      not linearly separable can be separated "with almost a linear kernel" [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2006) solutions, Problem 4
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
      - title: 'Wikipedia: Kernel method'
        locator: 'Mathematics: the kernel trick'
        url: https://en.wikipedia.org/wiki/Kernel_method#Mathematics:_the_kernel_trick
    source:
      id: mit-ocw-6867
      ref: midterm_f06soln#q4.5
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f06soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-030
    type: true_false
    difficulty: medium
    tags:
      - polynomial-kernel
      - gaussian-classifier
      - decision-boundary
    shuffle: false
    question: |
      A generative classifier with one Gaussian per class (each with its own unrestricted covariance
      matrix) has a decision boundary that an SVM with a polynomial kernel of degree 2 could, in
      principle, reproduce.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The Gaussian classifier's log-odds is a quadratic function of $x$, which is exactly what a degree-2 kernel can represent [^2].
    explanation: |
      With class-conditional Gaussians, the log posterior odds
      $\log \frac{p(y=1 \mid x)}{p(y=0 \mid x)}$ is a quadratic function of $x$ (it becomes linear
      only when the covariances are equal), so the boundary is a quadric [^2]. The degree-2
      polynomial kernel spans all monomials of degree at most 2, so a linear discriminant in its
      feature space can express any quadratic boundary [^1]. The SVM would choose its parameters by
      maximizing the margin rather than the likelihood, so it would not usually land on the same
      boundary, but it could represent it.
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2002) solutions, Problem 3, part 6
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
      - title: 'Wikipedia: Quadratic classifier'
        locator: Quadratic discriminant analysis
        url: https://en.wikipedia.org/wiki/Quadratic_classifier#Quadratic_discriminant_analysis
    source:
      id: mit-ocw-6867
      ref: midterm_f02soln#q3.6
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-031
    type: multiple
    difficulty: hard
    tags:
      - support-vectors
      - leave-one-out
      - outliers
    question: Which statements about hard-margin support vector machines are true? Select all that apply.
    options:
      - text: The leave-one-out error is at most the fraction of training points that are support vectors
        correct: true
      - text: The leave-one-out error of an SVM is always small
        why: That would mean SVMs always generalize well. Many support vectors can mean a high leave-one-out error [^1].
      - text: Switching from a linear to a polynomial kernel keeps the same support vectors
        why: The support vectors are the points that end up on the margin in the new feature space, and they can be quite different points [^1].
      - text: A single mislabelled outlier has little effect on the solution
        why: A hard-margin SVM must satisfy every margin constraint, so one outlier can move the boundary a lot or make the data inseparable [^2].
      - text: Removing a training point that is not a support vector leaves the solution unchanged
        correct: true
    explanation: |
      The solution depends only on the support vectors: a point with $\alpha_i = 0$ can be removed
      without changing $w$ or $w_0$, and since it was classified correctly, its leave-one-out test
      is correct too. Only support vectors can produce leave-one-out errors, so the error is at most
      their fraction (and can be much lower when many support vectors are not "essential") [^1].
      Support vectors are defined relative to a feature space, so they change with the kernel [^1].
      Hard-margin training has no slack, so a mislabelled outlier forces the margin to accommodate
      it [^2].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2002) solutions, Problem 3, part 4; Mid-term exam (Fall 2001) solutions, Problem 5, parts 1–2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
      - title: 'Wikipedia: Support vector machine'
        locator: Linear SVM — Soft-margin (the hinge loss is introduced for data that are not linearly separable)
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Soft-margin
    source:
      id: mit-ocw-6867
      ref: midterm_f02soln#q3.4
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
    status: reviewed
    reviewed_by: claude
  - id: svm-032
    type: multiple
    difficulty: medium
    tags:
      - kkt-conditions
      - dual
      - soft-margin
    question: |
      For a soft-margin SVM with dual variables $0 \le \alpha_i \le C$ and decision function $f$,
      the optimality (KKT) conditions link each $\alpha_i$ to the functional margin $y_i f(x_i)$.
      Which statements follow from them? Select all that apply.
    options:
      - text: If $\alpha_i = 0$, then $y_i f(x_i) \ge 1$
        correct: true
      - text: If $y_i f(x_i) > 1$, then $\alpha_i = C$
        why: A point strictly outside the margin has an inactive constraint, so complementary slackness forces $\alpha_i = 0$.
      - text: If $\alpha_i = C$, then $x_i$ is misclassified
        why: '$\alpha_i = C$ only gives $y_i f(x_i) \le 1$: the point is inside the margin, and it may still be on the correct side of the boundary.'
      - text: If $0 < \alpha_i < C$, then $y_i f(x_i) = 1$
        correct: true
    explanation: |
      Complementary slackness pairs $\alpha_i$ with the margin constraint
      $y_i f(x_i) \ge 1 - \xi_i$, and $C - \alpha_i$ with $\xi_i \ge 0$ [^1]. A point with
      $\alpha_i = 0$ lies on the correct side of the margin; $0 < \alpha_i < C$ forces $\xi_i = 0$
      and an active constraint, so the point sits exactly on the margin; $\alpha_i = C$ allows
      $\xi_i > 0$, so $y_i f(x_i) \le 1$ [^2]. The converse directions hold only up to boundary
      cases: a point exactly on the margin ($y_i f(x_i) = 1$) may have $\alpha_i = 0$ or $\alpha_i = C$ [^1].
    references:
      - source: mit-ocw-9520
        locator: Problem set 1, Problem 1.4 (reduced optimality conditions)
        url: https://ocw.mit.edu/courses/9-520-statistical-learning-theory-and-applications-spring-2003/resources/problem_set1/
      - title: 'Wikipedia: Support vector machine'
        locator: Computing the SVM classifier — Dual (c_i = 0 on the correct side of the margin, 0 < c_i < bound on the margin)
        url: https://en.wikipedia.org/wiki/Support_vector_machine#Dual
    source:
      id: mit-ocw-9520
      ref: problem_set1#q1.4
      url: https://ocw.mit.edu/courses/9-520-statistical-learning-theory-and-applications-spring-2003/resources/problem_set1/
    status: reviewed
    reviewed_by: claude
