  - id: ml-basics-125
    type: single
    difficulty: medium
    tags:
      - shap
      - interactions
      - dependence-plot
    question: |
      In a SHAP summary plot of a readmission model, both high and low values of `num_lab_procedures`
      appear on both sides of zero: for some patients they raise the prediction, for others they lower
      it. What is the most likely explanation?
    options:
      - text: It interacts with other features of the model
        correct: true
      - text: The feature has no effect on the model's predictions
        why: A feature without effect would have SHAP values clustered at zero, not spread to both sides [^1].
      - text: The SHAP values were estimated from too few samples to be trusted
        why: Jumbling is a pattern in the model's behaviour, not sampling noise; it shows the effect varies between rows [^1].
      - text: The feature was encoded with the wrong sign before training
        why: A sign error would flip the whole pattern, not mix positive and negative effects for the same values [^1].
    explanation: |
      When both high and low values of a feature can have both positive and negative effects, the most
      likely explanation is an interaction: for some diagnoses many lab procedures may be good, for
      others a sign of risk [^1]. SHAP dependence contribution plots, coloured by another feature,
      help find the partner; a model without interactions, such as a linear regression, would show a
      perfect line without this spread [^2].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 5 exercise, Question 4 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_explainability/ex5.py
