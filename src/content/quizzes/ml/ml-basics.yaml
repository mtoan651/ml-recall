  - id: ml-basics-137
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - data-splits
    question: |
      A team chooses its final model by validation accuracy (88%), then evaluates it once on the untouched
      test set and gets 84%. Which accuracy should it report as the estimate for new data?
    options:
      - text: 84%, since the 88% is optimistic after choosing the model with it
        correct: true
      - text: 88%, since the validation set was used more carefully than the test set
        why: The validation set took part in choosing the model, so the winner's validation score is biased upwards.
      - text: 86%, the average of both, since it is based on more data
        why: Averaging mixes in the optimistic validation score; only the test score is unbiased.
      - text: Neither yet; keep tuning until the test accuracy also reaches 88%
        why: Tuning on the test set would make it part of model selection, and its score would become optimistic too.
    explanation: |
      The training set fits the parameters, the validation set compares choices such as hyperparameters
      and architectures, and the test set, kept out of development, gives the final reported estimate
      [^1][^2]. Picking the best model by validation accuracy favours a model that happened to do well on
      that particular set, so its 88% is optimistic; the single test result, 84%, is the fair estimate.
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 17; Lecture 1, slide 79
      - source: d2l
        locator: Sec. 3.6.3 Model Selection
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-selection
