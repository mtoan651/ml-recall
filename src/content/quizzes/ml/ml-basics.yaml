  - id: ml-basics-022
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - self-supervised-learning
    question: A language model reads “The bus stops at the” and is trained to predict the word that actually follows in the original text. Which paradigm does this illustrate?
    options:
      - text: Self-supervised learning
        correct: true
      - text: Supervised learning with labels written by human annotators
        why: The target is taken from the text itself; nobody labels it.
      - text: Reinforcement learning
        why: There is no reward signal from an environment.
      - text: Clustering
        why: Nothing is being grouped.
    explanation: 'The training signal is cut out of the raw data: the preceding words form the input and the next observed word is the target [^1]. Using part of unlabeled data to supervise another part is self-supervised learning [^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 22, 25
      - source: d2l
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
