  - id: ml-basics-027
    type: single
    question: If you had to prioritize improving one of the following areas in your machine learning project, which would have the most impact?
    options:
      - text: Improving the quality of your dataset
        correct: true
      - text: Applying a more clever loss function to training your model
        why: True, a better loss function can help a model train faster, but it's still a distant second to another item in this list.
    explanation: Data trumps all. The quality and size of the dataset matters much more than which shiny algorithm you use to build your model. [^1]
    references:
      - source: google-mlcc
        locator: Datasets, generalization, and overfitting
        url: https://developers.google.com/machine-learning/crash-course/overfitting
    source:
      id: google-mlcc
      ref: overfitting#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting
    status: draft
  - id: ml-basics-028
    type: single
    difficulty: medium
    question: Suppose you train on the training set and evaluate on the test set over multiple rounds. In each round, you use the test set results to guide how to update hyperparameters and the feature set. Can you see anything wrong with this approach?
    options:
      - text: Doing many rounds of this procedure might cause the model to implicitly fit the peculiarities of the test set.
        correct: true
      - text: This approach is fine. After all, you're training on the training set and evaluating on a separate test set.
        why: A separate test set is not enough. Each round uses the test results to make a decision, so information about the test set leaks into the model, and after many rounds the test score no longer reflects performance on new data.
      - text: This approach is computationally inefficient. Don't change hyperparameters or feature sets after each round of testing.
        why: Frequent testing is expensive but critical. However, frequent testing is far less expensive than additional training. Optimizing hyperparameters and the feature set can dramatically improve model quality, so always budget time and computational resources to work on these.
    explanation: |
      Every time the test results decide a change to the hyperparameters or features, some information
      about the test set leaks into the model. Over many rounds the model ends up fitting the test set's
      peculiarities, like a teacher teaching to the test, and does worse on real-world data than the
      test score suggests [^1]. The remedy is a third split: tune against a validation set and use the
      test set only to confirm the final model [^1]. Tuning is worth the compute; the problem is which
      data the choices are based on, and even validation and test sets "wear out" with repeated use [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#training_validation_and_test_sets
        locator: 'Datasets: Dividing the original dataset, sec. Training, validation, and test sets'
    source:
      id: google-mlcc
      ref: overfitting/dividing-datasets#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    status: draft
  - id: ml-basics-029
    type: single
    difficulty: medium
    question: You shuffled all the examples in the dataset and divided the shuffled examples into training, validation, and test sets. However, the loss value on your test set is so staggeringly low that you suspect a mistake. What might have gone wrong?
    options:
      - text: Many of the examples in the test set are duplicates of examples in the training set.
        correct: true
      - text: Training and testing are nondeterministic. Sometimes, by chance, your test loss is incredibly low. Rerun the test to confirm the result.
        why: Although loss does vary a little on each run, it shouldn't vary so much that you think you won the machine learning lottery.
      - text: By chance, the test set just happened to contain examples that the model performed well on.
        why: The examples were well shuffled, so this is extremely unlikely.
    explanation: |
      A test loss that is too good to be true usually means the model is being tested on examples it
      has already seen. If the dataset has many redundant examples, shuffling and splitting puts copies
      of training examples into the test set; in MLCC's spam example, a model reached 99% precision on
      both sets because duplicates of the same spam emails had not been removed before the split [^1].
      The fix is to delete from the validation and test sets every example that duplicates a training
      example [^1]. Run-to-run randomness changes the loss only a little, and with well-shuffled data a
      lucky test set is extremely unlikely.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
        locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets'
    source:
      id: google-mlcc
      ref: overfitting/dividing-datasets#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    status: draft
  - id: ml-basics-030
    type: single
    question: Given a single dataset with a fixed number of examples, which of the following statements is true?
    options:
      - text: Every example used in testing the model is one less example used in training the model.
        correct: true
      - text: The number of examples in the test set must be greater than the number of examples in the validation set.
        why: In theory, the validation set and test set should contain the same number of examples or nearly so.
      - text: The number of examples in the test set must be greater than the number of examples in the validation set or training set.
        why: The number of examples in the training set is usually greater than the number of examples in the validation set or test set; however, there are no percentage requirements for the different sets.
    explanation: Dividing examples into train/test/validation sets is a zero-sum game. This is the central trade-off. [^1]
    references:
      - source: google-mlcc
        locator: 'Datasets: Dividing the original dataset'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    source:
      id: google-mlcc
      ref: overfitting/dividing-datasets#q3
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    status: draft
  - id: ml-basics-031
    type: single
    difficulty: easy
    question: Suppose your test set contains enough examples to perform a statistically significant test. Furthermore, testing against the test set yields low loss. However, the model performed poorly in the real world. What should you do?
    options:
      - text: Determine how the original dataset differs from real-life data.
        correct: true
      - text: Retest on the same test set. The test results might have been an anomaly.
        why: Although retesting might yield slightly different results, this tactic probably isn't very helpful.
    explanation: |
      A good test set must represent the dataset as a whole and also the real-world data the model will
      meet [^1]. Low loss on a large, statistically significant test set shows only that the test set
      resembles the training set. If the model still fails in production, the dataset itself differs
      from real-world data, for example because the world has changed since the data was collected;
      good generalization needs a stationary dataset whose partitions are statistically similar to
      real-world data [^2]. Find out how the data differs, then retrain and retest on data that matches
      reality; rerunning the same test would only reproduce the same misleading result.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
        locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets (criteria for a good test set)'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
        locator: Overfitting, sec. Generalization conditions
    source:
      id: google-mlcc
      ref: overfitting/dividing-datasets#q4
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    status: draft
  - id: ml-basics-032
    type: single
    difficulty: easy
    question: How many examples should the test set contain?
    options:
      - text: Enough examples to yield a statistically significant test.
        correct: true
      - text: At least 15% of the original dataset.
        why: 15% may or may not be enough examples.
    explanation: |
      A test set is there to estimate how well the model generalises, and how precise that
      estimate is depends on the absolute number of test examples, not on a fixed share of the
      data [^1][^2]. The standard error of a measured error rate shrinks like $1/\sqrt{n}$. To be
      about 95% sure that the test error is within $\pm 0.01$ of the true error, you need roughly
      10,000 examples [^2]. So 15% of a 2,000-example dataset (300 examples) is far too small,
      while 15% of 100 million examples is far more than needed. The course says there is no
      percentage requirement for the splits. You should find the number that gives a
      statistically meaningful result [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
        locator: "Datasets: Dividing the original dataset, 'Additional problems with test sets' and 'Exercises: Check your understanding'"
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
        locator: Sec. 4.6.1 The Test Set
    source:
      id: google-mlcc
      ref: overfitting/dividing-datasets#q5
      url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets
    status: draft
  - id: ml-basics-033
    type: single
    question: You are developing a physics equation. Which of the following formulas conforms more closely to Occam's Razor?
    options:
      - text: A formula with three variables.
        correct: true
      - text: A formula with twelve variables.
        why: Twelve variables seems overly complicated, doesn't it? The two most famous physics formulas of all time ($F = ma$ and $E = mc^2$) each involve only three variables.
    explanation: Three variables is more Occam-friendly than twelve variables. [^1]
    references:
      - source: google-mlcc
        locator: 'Overfitting: Model complexity'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    source:
      id: google-mlcc
      ref: overfitting/model-complexity#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    status: draft
  - id: ml-basics-034
    type: single
    question: You're on a brand-new machine learning project, about to select your first features. How many features should you pick?
    options:
      - text: Pick 1–3 features that seem to have strong predictive power.
        correct: true
      - text: Pick 4–6 features that seem to have strong predictive power.
        why: You might eventually use this many features, but it's still better to start with fewer. Fewer features usually means fewer unnecessary complications.
      - text: Pick as many features as you can, so you can start observing which features have the strongest predictive power.
        why: Start smaller. Every new feature adds a new dimension to your training dataset. When the dimensionality increases, the volume of the space increases so fast that the available training data become sparse. The sparser your data, the harder it is for a model to learn the relationship between the features that actually matter and the label. This phenomenon is called "the curse of dimensionality."
    explanation: It's best for your data collection pipeline to start with only one or two features. This will help you confirm that the ML model works as intended. Also, when you build a baseline from a couple of features, you'll feel like you're making progress! [^1]
    references:
      - source: google-mlcc
        locator: 'Overfitting: Model complexity'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    source:
      id: google-mlcc
      ref: overfitting/model-complexity#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    status: draft
  - id: ml-basics-035
    type: multiple
    question: Which of the following would be reasonable ways to measure a model's complexity?
    options:
      - text: Complexity is a function of the model's weights.
        correct: true
      - text: Complexity is a function of the square of the model's weights.
        correct: true
      - text: Complexity is a function of the biases of all the features in the model.
        why: Bias doesn't measure complexity.
    explanation: |
      Both statements about weights describe reasonable complexity measures, and each corresponds
      to a standard regularization penalty [^1]. Measuring complexity from the weights themselves
      (their absolute values) is what [L1 regularization](https://developers.google.com/machine-learning/glossary#L1_regularization)
      penalizes, and measuring it from the squares of the weights is what
      [L2 regularization](https://developers.google.com/machine-learning/glossary#L2_regularization)
      penalizes [^1]. The bias terms do not measure complexity [^1].
    references:
      - source: google-mlcc
        locator: 'Overfitting: Model complexity'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    source:
      id: google-mlcc
      ref: overfitting/model-complexity#q3
      url: https://developers.google.com/machine-learning/crash-course/overfitting/model-complexity
    status: draft
  - id: ml-basics-036
    type: single
    difficulty: easy
    question: You split a dataset into a training set (70%), a validation set (15%) and a test set (15%). What should you do to ensure that the examples in the training set have a similar statistical distribution to the examples in the validation set and the test set?
    figure:
      src: ./ml-basics/ml-basics-036.svg
      alt: A horizontal bar split into a training part (70%), a validation part (15%) and a test part (15%).
    options:
      - text: Shuffle the examples in the dataset extensively before partitioning them.
        correct: true
      - text: Sort the examples from earliest to most recent.
        why: If the examples in the dataset are not stationary, then sorting makes the partitions *less* similar.
      - text: Do nothing. Given enough examples, the law of averages naturally ensures that the distributions will be statistically similar.
        why: Unfortunately, this is not the case. The examples in certain sections of the dataset may differ from those in other sections.
    explanation: |
      Good generalization requires partitions with the same distribution: the training examples should
      be statistically similar to the validation and test examples [^1]. Shuffling the whole dataset
      thoroughly before splitting makes this much more likely, since each partition then gets a random
      sample of every part of the data. Sorting from earliest to latest does the opposite when the data
      is not stationary (it doesn't stay the same over time [^1]): the training set would get the old
      examples and the test set the newest ones. Doing nothing is risky too, because datasets are often
      stored in some order, so different sections can differ however many examples there are.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
        locator: Overfitting, sec. Generalization conditions
    source:
      id: google-mlcc
      ref: overfitting/overfitting#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting
    status: draft
  - id: ml-basics-037
    type: single
    difficulty: easy
    question: A streaming service is developing a model to predict the popularity of potential new television shows for the next three years. The streaming service plans to train the model on a dataset containing hundreds of millions of examples, spanning the previous ten years. Will this model encounter a problem?
    options:
      - text: Probably. Viewers' tastes change in ways that past behavior can't predict.
        correct: true
      - text: Definitely not. The dataset is large enough to make good predictions.
        why: Unfortunately, viewers' tastes are nonstationary.
      - text: Probably not. Viewers' tastes change in predictably cyclical ways. Ten years of data will enable the model to make good predictions on future trends.
        why: Although certain aspects of entertainment are somewhat cyclical, a model trained from past entertainment history will almost certainly have trouble making predictions about the next few years.
    explanation: |
      A model generalizes well only if the dataset is stationary, that is, if it doesn't change
      significantly over time [^1]. Viewers' tastes are not stationary: they keep changing in ways that
      past behavior can't predict, so a model trained on the last ten years will probably misjudge what
      becomes popular in the next three. A bigger dataset doesn't fix this, since hundreds of millions of
      examples of past tastes still describe the past, and although some aspects of entertainment are
      somewhat cyclical, that is not enough to forecast new trends reliably.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
        locator: Overfitting, sec. Generalization conditions
    source:
      id: google-mlcc
      ref: overfitting/overfitting#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting
    status: draft
  - id: ml-basics-038
    type: single
    difficulty: medium
    question: A model aims to predict the time it takes for people to walk a mile based on weather data (temperature, dew point, and precipitation) collected over one year in a city whose weather varies significantly by season. Can you build and test a model from this dataset, even though the weather readings change dramatically by season?
    options:
      - text: Yes
        correct: true
      - text: No
        why: Assuming this dataset contains enough examples of temperature, dew point, and precipitation, then you can build and test a model from this dataset. You just have to ensure that the data is partitioned equally, so that data from all four seasons is distributed equally into the different partitions.
    explanation: |
      Seasonal variation is not a problem in itself; what generalization needs is that the training,
      validation and test partitions share the same distribution [^1]. A full year of data covers all
      four seasons, so as long as there are enough examples and every season is spread evenly across the
      partitions (for example, by shuffling the whole year before splitting), the model is trained and
      tested on the same mix of weather. Splitting by date would break this: a model trained on spring
      to autumn and tested on winter would meet weather it never saw in training.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
        locator: Overfitting, sec. Generalization conditions
    source:
      id: google-mlcc
      ref: overfitting/overfitting#q3
      url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting
    status: draft
  - id: ml-basics-039
    type: multiple
    question: Which **three** of the following models are susceptible to a feedback loop?
    options:
      - text: A traffic-forecasting model that predicts congestion at highway exits near the beach, using beach crowd size as one of its features.
        correct: true
      - text: A book-recommendation model that suggests novels its users may like based on their popularity (i.e., the number of times the books have been purchased).
        correct: true
      - text: A university-ranking model that rates schools in part by their selectivity—the percentage of students who applied that were admitted.
        correct: true
      - text: An election-results model that forecasts the winner of a mayoral race by surveying 2% of voters after the polls have closed.
        why: If the model does not publish its forecast until after the polls have closed, it is not possible for its predictions to affect voter behavior.
      - text: A housing-value model that predicts house prices, using size (area in square meters), number of bedrooms, and geographic location as features.
        why: It is not possible to quickly change a house's location, size, or number of bedrooms in response to price forecasts, making a feedback loop unlikely. However, there is potentially a correlation between size and number of bedrooms (larger homes are likely to have more rooms) that may need to be teased apart.
      - text: A face-attributes model that detects whether a person is smiling in a photo, which is regularly trained on a database of stock photography that is automatically updated monthly.
        why: There is no feedback loop here, as model predictions don't have any impact on the photo database. However, versioning of the input data is a concern here, as these monthly updates could potentially have unforeseen effects on the model.
    explanation: Some beachgoers are likely to base their plans on the traffic forecast. If there is a large beach crowd and traffic is forecast to be heavy, many people may make alternative plans. This may depress beach turnout, resulting in a lighter traffic forecast, which then may increase attendance, and the cycle repeats. Book recommendations are likely to drive purchases, and these additional sales will be fed back into the model as input, making it more likely to recommend these same books in the future. The model's rankings may drive additional interest to top-rated schools, increasing the number of applications they receive. If these schools continue to admit the same number of students, selectivity will increase (the percentage of students admitted will go down). This will boost these schools' rankings, which will further increase prospective student interest, and so on… [^1]
    references:
      - source: google-mlcc
        locator: 'Production ML systems: Questions to ask'
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/questions
    source:
      id: google-mlcc
      ref: production-ml-systems/questions#q1
      url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/questions
    status: draft
  - id: ml-basics-040
    type: multiple
    question: Which **three** of the following four statements are true of static inference?
    options:
      - text: The model must create predictions for all possible inputs.
        correct: true
      - text: The system can verify inferred predictions before serving them.
        correct: true
      - text: For a given input, the model can serve a prediction more quickly than *dynamic* inference.
        correct: true
      - text: You can react quickly to changes in the world.
        why: No, this is a disadvantage of static inference.
    explanation: |
      Static inference computes predictions ahead of time and serves them from a cache or lookup
      table [^1]. So the model must make a prediction for every input it may be asked about, which
      works when the set of items is limited but not for free-form inputs with a long tail of rare
      cases. Because the predictions exist before anyone uses them, the system can verify them
      before serving them, and looking a prediction up is almost always faster than computing it
      on demand as dynamic inference does [^1]. The price is that cached predictions are refreshed
      only every few hours or days, so you cannot react quickly to changes in the world [^1].
    references:
      - source: google-mlcc
        locator: 'Production ML systems: Static versus dynamic inference'
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference
    source:
      id: google-mlcc
      ref: production-ml-systems/static-vs-dynamic-inference#q1
      url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference
    status: draft
  - id: ml-basics-041
    type: single
    difficulty: medium
    question: Which **one** of the following statements is true of dynamic inference?
    options:
      - text: You can provide predictions for all possible items.
        correct: true
      - text: You can do post-verification of predictions before they are used.
        why: In general, it's not possible to do a post-verification of all predictions before they get used because predictions are being made on demand. You can, however, potentially monitor *aggregate* prediction qualities to provide some level of quality checking, but these will signal fire alarms only after the fire has already spread.
      - text: When performing dynamic inference, you don't need to worry about prediction latency (the lag time for returning predictions) as much as when performing static inference.
        why: Prediction latency is often a real concern in dynamic inference. Unfortunately, you can't necessarily fix prediction latency issues by adding more inference servers.
    explanation: |
      Dynamic (online) inference makes a prediction on demand for whatever request comes in, so it can
      serve any new item, including rare, long-tail inputs that a cache of precomputed predictions would
      not contain [^1]. The price is that it is compute intensive and latency sensitive, which may force
      a simpler model, and it needs more monitoring [^1]. Checking predictions before they are served is
      an advantage of static inference, which computes and caches them in advance [^2]; a dynamic
      prediction is used as soon as it is made, so at best you can monitor aggregate quality afterwards.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#dynamic_inference
        locator: 'Production ML systems: Static versus dynamic inference, sec. Dynamic inference'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#static_inference
        locator: 'Production ML systems: Static versus dynamic inference, sec. Static inference'
    source:
      id: google-mlcc
      ref: production-ml-systems/static-vs-dynamic-inference#q2
      url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference
    status: draft
  - id: ml-basics-042
    type: multiple
    difficulty: medium
    question: Which **two** of the following statements are true about static (offline) training?
    options:
      - text: The model stays up to date as new data arrives.
        why: Actually, if you train offline, then the model has no way to incorporate new data as it arrives. This can lead to model staleness, if the distribution you are trying to learn from changes over time.
      - text: You can verify the model before applying it in production.
        correct: true
      - text: Offline training requires less monitoring of training jobs than online training.
        correct: true
      - text: Very little monitoring of input data needs to be done at inference time.
        why: Counterintuitively, you do need to monitor input data at serving time. If the input distributions change, then our model's predictions may become unreliable. Imagine, for example, a model trained only on summertime clothing data suddenly being used to predict clothing buying behavior in wintertime.
    explanation: |
      With static (offline) training you train the model once and serve it for a while, so you develop
      and test it once and can verify it before it goes into production [^1]. Because training jobs run
      rarely, monitoring at training time is more modest than for online training, whose continuous
      training jobs must be watched [^1]. The cost is staleness: the model can't take in new data, so its
      predictions degrade if the relationship between features and labels changes [^1]. For the same
      reason you still have to monitor the input data at serving time; a model trained only on summer
      data would be unreliable in winter [^1].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
        locator: 'Production ML systems: Static versus dynamic training, Table 1 and the text after it'
    source:
      id: google-mlcc
      ref: production-ml-systems/static-vs-dynamic-training#q1
      url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
    status: draft
  - id: ml-basics-043
    type: single
    question: Which **one** of the following statements is true of dynamic (online) training?
    options:
      - text: The model stays up to date as new data arrives.
        correct: true
      - text: Very little monitoring of training jobs needs to be done.
        why: Actually, you must continuously monitor training jobs to ensure that they are healthy and working as intended. You'll also need supporting infrastructure like the ability to roll a model back to a previous snapshot in case something goes wrong in training, such as a buggy job or corruption in input data.
      - text: Very little monitoring of input data needs to be done at inference time.
        why: Just like a static, offline model, it is also important to monitor the inputs to the dynamically updated models. You are likely not at risk for large seasonality effects, but sudden, large changes to inputs (such as an upstream data source going down) can still cause unreliable predictions.
    explanation: This is the primary benefit of online training; you can avoid many staleness issues by allowing the model to train on new data as it comes in. [^1]
    references:
      - source: google-mlcc
        locator: 'Production ML systems: Static versus dynamic training'
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
    source:
      id: google-mlcc
      ref: production-ml-systems/static-vs-dynamic-training#q2
      url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
    status: draft
  - id: ml-basics-044
    type: single
    difficulty: easy
    question: A company wants to use ML in their health and well-being app to help people feel better. Do you think they'll need to use proxy labels to accomplish their goals?
    options:
      - text: Yes. Happiness and well-being can't be measured directly, so they must be approximated by measurable signals such as weekly exercise hours.
        correct: true
      - text: No. Happiness and well-being can be measured directly, so the app can record them and use them as labels without a stand-in.
    explanation: |
      You use a proxy label when the thing you really want to predict is not recorded in the data
      and cannot be measured directly [^1]. "Feeling better", happiness and well-being are not
      observable quantities in app data. The model has to be trained on something measurable that
      should go along with them, such as weekly exercise hours, time with friends, or self-reported
      mood. The course warns that every proxy is an imperfect stand-in. Pick the one with the
      fewest problems for your use case, and check that it actually tracks the outcome you care
      about [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/ml-framing#proxy_labels
        locator: "Problem Framing: Framing an ML problem, 'Proxy labels'"
    source:
      id: google-ml-courses
      ref: problem-framing/ml-framing#q1
      url: https://developers.google.com/machine-learning/problem-framing/ml-framing
    status: draft
  - id: ml-basics-045
    type: single
    difficulty: medium
    question: |
      A fashion firm wants to sell more clothes. Someone suggests using ML to determine which clothes the firm should manufacture. They think they can train a model to determine which type of clothes are in fashion. After they train the model, they want to apply it to their catalog to decide which clothes to make.

      How should they frame their problem in ML terms?
    options:
      - text: |
          **Ideal outcome**: Determine which products to manufacture.

          **Model's goal**: Predict which articles of clothing are in fashion.

          **Model output**: Binary classification, `in_fashion`, `not_in_fashion`

          **Success metrics**: Sell seventy percent or more of the clothes made.
        correct: true
      - text: |
          **Ideal outcome**: Determine how much fabric and supplies to order.

          **Model's goal**: Predict how much of each item to manufacture.

          **Model output**: Binary classification, `make`, `do_not_make`

          **Success metrics**: Sell seventy percent or more of the clothes made.
        why: The ideal outcome isn't to determine how much fabric and supplies to order. It's to determine if an item should be manufactured. Thus, the model's goal addresses the wrong objective.
    explanation: |
      In the course's framing template, the ideal outcome is the product goal in non-ML terms, the
      model's goal says what the model must predict to serve it, the output type must match that
      prediction, and the success metric measures the business result rather than model
      accuracy [^1]. The firm's decision is which clothes to make, and the proposed model judges
      whether an item is in fashion. So a binary `in_fashion` / `not_in_fashion` classifier fits,
      and success is measured by sell-through (selling at least 70% of what is made) [^1]. The
      other framing switches the ideal outcome to ordering fabric and supplies, which is not the
      problem described. Its goal ("how much of each item") is also a quantity, which does not
      match a binary `make` / `do_not_make` output [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/ml-framing#define_the_ideal_outcome_and_the_models_goal
        locator: "Problem Framing: Framing an ML problem, sections 'Define the ideal outcome and the model's goal', 'Identify the output you need' and 'Define the success metrics'"
    source:
      id: google-ml-courses
      ref: problem-framing/ml-framing#q2
      url: https://developers.google.com/machine-learning/problem-framing/ml-framing
    status: draft
  - id: ml-basics-046
    type: single
    difficulty: easy
    question: Why is it important to have a non-ML solution or heuristic in place before analyzing an ML solution?
    options:
      - text: A non-ML solution is the benchmark to measure an ML solution against.
        correct: true
      - text: Non-ML solutions help you determine how much an ML solution will cost.
    explanation: |
      Before you commit to ML, the course says to optimise your existing non-ML solution, or try a
      simple heuristic if you have none, and to use that result as the baseline for judging any ML
      solution [^1]. The key question is how much better ML would be: if the gain over the
      heuristic is small, the simpler solution may be the right one [^1]. Google's Rules of ML make
      the same point: a heuristic often gets you a large share of the benefit, so you may launch
      without ML at first [^2]. Cost is weighed in the comparison too, but you estimate it from the
      ML system's compute, maintenance and staffing needs; the heuristic does not tell you what ML
      will cost [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem#clear_use_case_for_ml
        locator: "Problem Framing: Understand the problem, 'Clear use case for ML'"
      - title: 'Rules of Machine Learning: Best Practices for ML Engineering (Zinkevich, Google)'
        url: https://developers.google.com/machine-learning/guides/rules-of-ml#before_machine_learning
        locator: "Before Machine Learning, Rule #1: Don't be afraid to launch a product without machine learning"
    source:
      id: google-ml-courses
      ref: problem-framing/problem#q1
      url: https://developers.google.com/machine-learning/problem-framing/problem
    status: draft
  - id: ml-basics-047
    type: multiple
    difficulty: easy
    question: When analyzing your datasets, what are three key attributes you should look for?
    options:
      - text: Representative of the real world.
        correct: true
      - text: Contains correct values.
        correct: true
      - text: Features have predictive power for the label.
        correct: true
      - text: Small enough to load onto a local machine.
      - text: Gathered from a variety of unpredictable sources.
    explanation: |
      Predictive ML lives on its data, and the course lists representativeness, correctness and
      predictive features among the qualities to check [^1]. *Representative*: if the data do not
      reflect the real-world behaviour being modelled, the model will predict poorly once deployed.
      *Correct*: a few wrong labels are unavoidable, but if more than a small fraction are wrong,
      predictions suffer. *Predictive power*: features must be correlated with the label, or the
      model has nothing to learn from [^1]. Size is not a limit (the course wants abundant data,
      the more relevant examples the better), and unpredictable sources go against its call for
      consistent, reliable and trusted data [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem#predictive_ml_and_data
        locator: "Problem Framing: Understand the problem, 'Predictive ML and data' and 'Predictive power'"
    source:
      id: google-ml-courses
      ref: problem-framing/problem#q2
      url: https://developers.google.com/machine-learning/problem-framing/problem
    status: draft
  - id: ml-basics-048
    type: single
    difficulty: medium
    question: |
      Based on the following scenario, determine if using ML is the best approach to the problem.

      An engineering team at a large organization is responsible for managing incoming phone calls.

      **The goal**: To inform callers how long they'll wait on hold given the current call volume.

      They don't have any solution in place, but they think a heuristic would be to divide the current number of customers on hold by the number of employees answering phones, and then multiply by 10 minutes. However, they know that some customers have their issues resolved in two minutes, while others can take up to 45 minutes or longer.

      Their heuristic probably won't get them a precise enough number. They can create a dataset with the following columns: `number_of_callcenter_phones`, `user_issue`, `time_to_resolve`, `call_time`, `time_on_hold`.
    options:
      - text: "**Use ML**. The engineering team has a clearly defined goal. Their heuristic won't be good enough for their use case. The dataset appears to have predictive features for the label, `time_on_hold`."
        correct: true
      - text: "**Don't use ML**. Although they have a clearly defined goal, they should implement and optimize a non-ML solution first. Also, their dataset doesn't appear to contain enough features with predictive power."
    explanation: |
      The course's checks are: a clearly stated goal, a non-ML baseline to compare against, and
      data whose features can predict the label [^1]. The goal here is clear. The heuristic is
      already known to fall short, because it assumes every call takes about 10 minutes when
      resolution times run from 2 to over 45 minutes depending on the issue [^1]. Columns such as
      `user_issue` and call volume plausibly correlate with `time_on_hold`, so the data look
      predictive [^1]. Google's Rules of ML also advise moving to ML once you have data and a
      clear goal, rather than patching together a complex heuristic that becomes hard to
      maintain [^2]. One caveat from the same page: a column like `time_to_resolve` can be used as
      a feature only if its value is available at prediction time [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem#check-your-understanding_5
        locator: "Problem Framing: Understand the problem, 'Clear use case for ML', 'Predictive ML and data' and the third 'Check Your Understanding'"
      - title: 'Rules of Machine Learning: Best Practices for ML Engineering (Zinkevich, Google)'
        url: https://developers.google.com/machine-learning/guides/rules-of-ml#rule_3_choose_machine_learning_over_a_complex_heuristic
        locator: 'Rule #3: Choose machine learning over a complex heuristic'
    source:
      id: google-ml-courses
      ref: problem-framing/problem#q3
      url: https://developers.google.com/machine-learning/problem-framing/problem
    status: draft
  - id: ml-basics-049
    type: single
    difficulty: easy
    question: Why is problem framing important?
    options:
      - text: Problem framing ensures that an ML approach is a good solution to the problem before beginning to work with data and train a model.
        correct: true
      - text: Problem framing helps diagnose problems with existing ML models and uncovers issues with data.
    explanation: |
      Problem framing means taking a problem apart to see which pieces need solving. That tells you
      whether the project is technically feasible and gives it clear goals and success
      criteria [^1]. It has two steps: deciding whether ML is the right approach at all and, if so,
      stating the problem in ML terms. Both happen before any data work or model training [^1].
      The first step matters because ML is a specialised tool, and a simpler non-ML solution may
      do the job [^2]. Diagnosing an existing model or finding data issues is debugging and
      evaluation work that comes later, not framing.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem-framing
        locator: 'Problem Framing: Overview'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem#clear_use_case_for_ml
        locator: "Problem Framing: Understand the problem, 'Clear use case for ML'"
    source:
      id: google-ml-courses
      ref: problem-framing/problem-framing#q1
      url: https://developers.google.com/machine-learning/problem-framing/problem-framing
    status: draft
  - id: ml-basics-050
    type: single
    question: |
      Here are two columns of a dataset, sorted by `Timestamp`:

      | Timestamp | Temperature |
      | --- | ---: |
      | June 8, 2023 09:00 | 12 |
      | June 8, 2023 10:00 | 18 |
      | June 8, 2023 11:00 | *missing* |
      | June 8, 2023 12:00 | 24 |
      | June 8, 2023 13:00 | 38 |

      Which of the following would be a reasonable value to impute for the missing value of `Temperature`?
    options:
      - text: '23'
        correct: true
      - text: '31'
        why: Unlikely. The limited part of the dataset that we can see suggests that 31 is much too high for the 11:00 Temperature. However, we can't be sure without basing the imputation on a larger number of examples.
      - text: '51'
        why: Very unlikely. 51 is much higher than any of the displayed values (and, therefore, much higher than the mean).
    explanation: Probably. 23 is the mean of the adjacent values (12, 18, 24, and 38). However, we aren't seeing the rest of the dataset, so it is possible that 23 would be an outlier for 11:00 on other days. [^1]
    references:
      - source: google-mlcc
        locator: 'Datasets: Data characteristics'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics
    source:
      id: google-mlcc
      ref: overfitting/data-characteristics#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics
    status: draft
  - id: ml-basics-051
    type: multiple
    question: The plot below shows a training loss curve. What **three** things could you do to try to improve it?
    figure:
      src: ./ml-basics/ml-basics-051.svg
      alt: 'Loss against training steps: the loss swings up and down in large waves throughout training and never settles.'
    options:
      - text: Check your data against a data schema to detect bad examples, and then remove the bad examples from the training set.
        correct: true
      - text: Reduce the learning rate.
        correct: true
      - text: Reduce the training set to a tiny number of trustworthy examples.
        correct: true
      - text: Increase the number of examples in the training set.
        why: This is a tempting idea, but it is extremely unlikely to fix the problem.
      - text: Increase the learning rate.
        why: In general, avoid increasing the learning rate when a model's learning curve indicates a problem.
    explanation: 'A loss curve that keeps oscillating instead of flattening usually means the updates are too large or the data is noisy [^1]. Lowering the learning rate makes each step smaller. Checking examples against a data schema and removing bad ones takes out broken examples that kick the loss around. Training on a tiny set of trustworthy examples first is a debugging step: if the model cannot converge even there, the problem is in the model or the pipeline, and once it does you can add data back gradually [^1]. Adding more examples or raising the learning rate is unlikely to calm an oscillating curve.'
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: draft
  - id: ml-basics-052
    type: multiple
    question: Which **two** of the following statements identify possible reasons for the exploding loss shown in the plot below?
    figure:
      src: ./ml-basics/ml-basics-052.svg
      alt: 'Loss against training steps: the loss falls smoothly for most of training, then suddenly shoots up to a high level and keeps jumping around there.'
    options:
      - text: The input data contains one or more NaNs—for example, a value caused by a division by zero.
        correct: true
      - text: The input data contains a burst of outliers.
        correct: true
      - text: The learning rate is too low.
        why: A very low learning rate might increase training time, but it is not the cause of the strange loss curve.
      - text: The regularization rate is too high.
        why: True, a very high regularization could prevent a model from converging; however, it won't cause the strange loss curve shown in the plot.
    explanation: |
      A loss that falls smoothly and then suddenly shoots up points to bad input data rather than a
      badly tuned hyperparameter [^1]. One cause is NaNs in the input, for example from a division
      by zero, which is more common than you might expect. Another is a batch packed with outliers,
      which can happen when batches are not shuffled properly [^1]. A low learning rate only slows
      training down, and a very high regularization rate can keep a model from converging, but
      neither produces a sudden jump like this one [^1].
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: draft
  - id: ml-basics-053
    type: single
    difficulty: easy
    question: The plot below shows the loss curves of the training and test sets. Which **one** of the following statements best identifies the reason for the difference between them?
    figure:
      src: ./ml-basics/ml-basics-053.svg
      alt: 'Two loss curves against training steps: the training loss keeps decreasing, while the test loss decreases at first, then flattens and starts to rise.'
    options:
      - text: The model is overfitting the training set.
        correct: true
      - text: The learning rate is too high.
        why: If the learning rate were too high, the loss curve for the training set would likely not have behaved as it did.
    explanation: |
      The two curves fall together at first, then diverge: the training loss keeps going down while the
      test loss levels off and starts to rise. The model is learning details of the training set that
      don't carry over to new data, the classic sign of overfitting [^1]. A learning rate that is too
      high would show up in the training curve itself, which would bounce around or keep increasing
      instead of falling smoothly [^2]. Possible fixes are a simpler model (for example, fewer features),
      a higher regularization rate, and making sure the training and test sets are statistically
      equivalent [^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#detecting_overfitting
        locator: Overfitting, sec. Detecting overfitting
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters#learning_rate
        locator: 'Linear regression: Hyperparameters, sec. Learning rate'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves#exercise_3_test_loss_diverges_from_training_loss
        locator: 'Overfitting: Interpreting loss curves, Exercise 3. Test loss diverges from training loss'
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q3
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: draft
  - id: ml-basics-054
    type: single
    question: Which **one** of the following statements is the most likely explanation for the erratic loss curve shown below?
    figure:
      src: ./ml-basics/ml-basics-054.svg
      alt: 'Loss against training steps: the loss drops quickly and levels off, then the same burst of jagged bumps repeats at regular intervals.'
    options:
      - text: The training set is not shuffled well.
        correct: true
      - text: The regularization rate is too high.
        why: This is unlikely to be the cause.
      - text: The training set contains too many features.
        why: This is unlikely to be the cause.
    explanation: This is a possibility. For example, a training set that contains 100 images of dogs followed by 100 images of cats may cause loss to oscillate as the model trains. Ensure that you shuffle examples sufficiently. [^1]
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
