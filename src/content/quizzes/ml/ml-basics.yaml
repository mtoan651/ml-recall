        url: https://scikit-learn.org/stable/unsupervised_learning.html
        locator: Ch. 2 Unsupervised learning (2.5 Decomposing signals in components, incl. PCA)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/supervised_learning.html
        locator: Ch. 1 Supervised learning (1.1 Linear Models, 1.9 Naive Bayes, 1.10 Decision Trees)
    source:
