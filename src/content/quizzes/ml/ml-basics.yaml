  - id: ml-basics-134
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - ce6146-l02
      - supervised-learning
    question: |
      A table of sold houses has the columns floor area, number of rooms, distance to the station and
      sale price. A model is trained to estimate the sale price of other houses. In one training example,
      what are $x$ and $y$?
    options:
      - text: $x$ = (area, rooms, distance) and $y$ = the recorded sale price
        correct: true
      - text: $x$ = the recorded sale price and $y$ = (area, rooms, distance)
        why: Reversed — the price is the quantity the model has to predict.
      - text: $x$ = all four columns and $y$ = the price the model estimates
        why: The target cannot also be an input, and $y$ is the observed value, not the model's estimate.
      - text: $x$ = (area, rooms, distance) and $y$ = the price the model predicts for that house
        why: That is the prediction $\hat y$; the target $y$ is the observed price used as supervision.
    explanation: |
      The input $x$ is the vector of features known when a prediction is made, and the target $y$ is the
      observed value the model should learn to predict [^1][^2]. The model's output is written $\hat y$;
      the loss compares it with $y$.
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 5; Lecture 1, slide 15; Lecture 2, slide 9
      - source: d2l
        locator: Sec. 3.1.1 Basics
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#basics
