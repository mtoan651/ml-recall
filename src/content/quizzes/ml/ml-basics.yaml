      - supervised-learning
      - unsupervised-learning
    question: |
      True or false: a model trained on customer records that each include the recorded outcome "churned"
      or "stayed", in order to predict that outcome for new customers, is an example of unsupervised
      learning.
    options:
      - text: 'True'
        why: The recorded outcome is a provided target for every example, so the learning is supervised.
      - text: 'False'
