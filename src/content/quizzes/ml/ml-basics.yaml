  - id: ml-basics-143
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - data-splits
      - model-selection
    question: |
      A team tries 40 hyperparameter settings, keeps the one with the best test-set accuracy
      (91%), and reports 91% as the accuracy to expect on new data. What is wrong?
    options:
      - text: Choosing by test accuracy makes 91% optimistic; settings should be compared on a validation set
        correct: true
      - text: Nothing, because choosing among candidate models is the purpose of the test set
        why: Choosing among models is the job of the validation set; the test set is kept for one final evaluation.
      - text: The setting should have been chosen by training accuracy instead, since the training set is the largest
        why: Training accuracy rewards overfitting, so it does not show which setting generalizes best.
      - text: The only problem is that 40 settings are too few to find a good one
        why: Trying more settings does not remove the bias; selecting among even more of them on the test set makes it worse.
    explanation: |
      The training set fits the parameters (and preprocessing statistics), the validation set
      compares design choices such as hyperparameters, architecture and stopping point, and the test
      set evaluates the finally chosen procedure [^1][^2]. Picking the best of 40 by test accuracy
      uses the test set for model selection, so the winning score partly reflects luck on those
      particular examples and is no longer an unbiased estimate [^3]. The test set should be set
      aside before development starts [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 79
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-selection
        locator: Sec. 3.6.3 Model Selection
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#test-set-reuse
        locator: Sec. 4.6.2 Test Set Reuse
    source:
      id: ncu-intro-dl
      ref: lecture-01/q79
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-144
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - workflow
    question: Which order of steps follows the usual workflow for building a deep-learning model?
    options:
      - text: Collect data → split into training/validation/test → design the model → train → evaluate → optimize
        correct: true
      - text: Collect data → design the model → train on all data → split into training/validation/test → evaluate → optimize
        why: Splitting after training on all of the data means the evaluation examples were already seen in training.
      - text: Design the model → train → collect data → split into training/validation/test → evaluate → optimize
        why: A model cannot be trained before there are data to train it on.
      - text: Collect data → design the model → train → evaluate on the training data → split → optimize
        why: Evaluating on training data hides overfitting; the split has to come before training so the evaluation data stay unseen.
    explanation: |
      A structured flow (data collection and preprocessing, splitting, model design, training,
      evaluation, then optimization) keeps evaluation data unseen, so the measured performance
      reflects how the model generalizes [^1][^2]. One caveat: preprocessing that learns from the
      data, such as the mean and standard deviation used for scaling, must be fitted on the training
      split after splitting, never on all the data [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 61, 81
      - title: 'Wikipedia: Training, validation, and test data sets'
        url: https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets
        locator: Lead section; Test data set
      - title: 'scikit-learn User Guide: Common pitfalls and recommended practices'
        url: https://scikit-learn.org/stable/common_pitfalls.html#how-to-avoid-data-leakage
        locator: Sec. 12.2.1 How to avoid data leakage
    source:
      id: ncu-intro-dl
      ref: lecture-01/q80
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-145
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - rules-vs-learning
    question: |
      A spam filter uses a single hand-written rule: flag every message that contains the phrase
      "free prize". Which mistake is this rule prone to?
    options:
      - text: Flagging a genuine store newsletter that announces a "free prize" draw
        correct: true
      - text: Letting through spam messages that do contain the exact phrase "free prize"
        why: The rule flags every message with the phrase, so such spam is always caught.
      - text: Changing its decisions after it has seen a batch of new messages
        why: A fixed rule never adapts; only a learned model is updated from data.
      - text: Refusing to work until thousands of labeled emails are available
        why: Needing labeled training data is a property of a learned model, not of a hand-written rule.
    explanation: |
      A rule fires on its trigger words whatever the context, so a legitimate message that happens
      to use them is flagged, a false positive; it also misses spam that avoids the phrase [^1].
      Because such rules are hard to write for complex patterns, machine learning instead fits a
      model to many labeled examples [^2]. That model has its own weakness: it can fail on new kinds
      of spam that look unlike its training messages [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 7
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#a-motivating-example
        locator: Sec. 1.1 A Motivating Example
    source:
      id: ncu-intro-dl
      ref: lecture-01/q31
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-146
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - data-quality
    question: |
      True or false: once a spam filter is learned from data instead of written as rules, adding
      more training messages always makes it better, whatever their quality or relevance.
    options:
      - text: 'True'
        why: Extra data helps only if it is correctly labeled and resembles the messages the filter will face.
      - text: 'False'
        correct: true
    explanation: |
      Learning from data does not remove human choices: developers still decide which data to
      collect, which objective to optimize and which model to use [^1]. More data helps only when
      it is correct and relevant; examples full of mistakes, or features that do not predict the
      target, make learning fail ("garbage in, garbage out") [^2]. And spam unlike every training
      example can still slip through [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 7
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#data
        locator: Sec. 1.2.1 Data
    source:
      id: ncu-intro-dl
      ref: lecture-01/q32
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-147
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - baselines
      - tabular-data
    question: |
      A bank has about 5,000 rows of tabular customer data (age, income, account balance, …) and
      wants to predict loan default. Which plan is best supported by benchmark evidence on this kind
      of data?
    options:
      - text: Fit a strong conventional model, such as gradient-boosted trees, as a baseline any deep network must beat
        correct: true
      - text: Train a deep network from scratch at once, since deep models outperform conventional ones on every kind of data
        why: On medium-sized tabular data, tree-based models are often as good or better; deep learning's edge is clearest on raw inputs such as images and text.
      - text: Fine-tune a network pretrained on photos, because pretrained features carry over to any type of data
        why: Features pretrained on images capture visual patterns; they do not transfer to rows of customer attributes.
      - text: Skip the baseline, because comparing with simpler models matters only for image data
        why: A simpler baseline is needed for every problem to show whether the extra cost of a deep model pays off.
    explanation: |
      Deep networks shine when they can learn features from raw inputs such as pixels, but training
      them from scratch is costly, and on tabular data conventional models are strong baselines [^1].
      A benchmark on 45 tabular datasets found tree-based models such as XGBoost and random forests
      still ahead of deep networks on medium-sized data (about 10,000 rows) [^2]. Whatever you
      choose, compare it with a simpler baseline on the same data and errors [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 10
      - title: Grinsztajn, Oyallon & Varoquaux (2022), Why do tree-based models still outperform deep learning on tabular data?, arXiv:2207.08815
        url: https://arxiv.org/abs/2207.08815
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-01/q35
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-148
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - anomaly-detection
    question: |
      An inspection model is trained only on photos of defect-free parts. At test time it must flag
      parts with scratches or dents it has never seen. How can such a model decide?
    options:
      - text: It models what normal parts look like and scores how far each test image deviates from that
        correct: true
      - text: It learns the defect classes from labeled defective photos, like an ordinary supervised classifier
        why: The training set contains no defective photos, so defect classes cannot be learned directly.
      - text: It clusters the training photos into one group per type of defect
        why: The training photos contain no defects, so there are no defect groups to find.
      - text: It stores every training photo and flags any test photo that is not an exact copy of one
        why: Every new normal part differs slightly from all stored photos, so nearly everything would be flagged.
    explanation: |
      This is novelty (anomaly) detection: the training data contain only normal examples, and the
      task is to decide whether a new observation deviates from them [^1][^2]. The model scores how
      unusual each test image is, and can also mark the suspicious pixels; a threshold on the score
      gives the normal/defective decision [^1]. The test set must still contain both normal and
      defective parts to measure how well this works [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 12
      - title: 'scikit-learn User Guide: Novelty and Outlier Detection'
        url: https://scikit-learn.org/stable/modules/outlier_detection.html
        locator: Sec. 2.7 Novelty and Outlier Detection (introduction)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q36
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-149
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - learning-tasks
    question: |
      Why should the learning task (classification, regression, clustering, …) be settled before a
      model is built?
    options:
      - text: It fixes what the model must output, which decides the training objective and the evaluation
        correct: true
      - text: It fixes how many hidden layers the network must have
        why: Depth is a separate design choice; the task fixes the kind of output and the loss, not the hidden architecture.
      - text: It is only documentation, because a neural network works the task out from the training data by itself
        why: A network optimizes whatever objective it is given; defining the task is what chooses that objective.
      - text: It decides which optimizer, such as SGD or Adam, training has to use
        why: Any of these optimizers can minimize the loss of any of these tasks; the task chooses the loss, not the optimizer.
    explanation: |
      The learning task is the concrete problem the model has to solve from data, and its desired
      output (a category, a number, a group, a smaller set of coordinates) follows from how the
      result will be used [^1]. The output in turn decides the loss used for training and the
      measure used for evaluation, for example squared error for numerical predictions and the error
      rate for classification [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 14, 17
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#objective-functions
        locator: Sec. 1.2.3 Objective Functions
    source:
      id: ncu-intro-dl
      ref: lecture-01/q37
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-150
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - learning-paradigms
      - forecasting
    question: |
      A supermarket uses several years of daily sales records to train a model that predicts
      tomorrow's demand for each product. What provides the learning signal?
    options:
      - text: The next day's recorded demand for each past day, as in supervised regression
        correct: true
      - text: Nothing; the model groups days with similar sales, so this is unsupervised learning
        why: Each training example pairs past sales with the value observed the next day, which is a target.
      - text: A reward received after each stocking decision, so this is reinforcement learning
        why: The model does not act in an environment; it fits outcomes that were already recorded.
      - text: The category each product belongs to, so this is classification
        why: The output, a demand, is a quantity rather than a category.
    explanation: |
      A useful way to place a learning problem is to ask what the model outputs and where its
      training signal comes from [^1]. Here the output is a number (tomorrow's demand), and every historical
      day supplies its target, the demand actually observed on the next day, so the problem is
      supervised regression [^1][^2]. Because time order matters, such data are split
      chronologically: train on the past, test on later days [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 22, 26, 80
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#regression
        locator: Sec. 1.3.1.1 Regression
    source:
      id: ncu-intro-dl
      ref: lecture-01/q44
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-151
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - math-foundations
    question: Which pairing of a mathematical foundation with its main role in deep learning is correct?
    options:
      - text: Calculus, for measuring how the loss changes with each parameter, as backpropagation does
        correct: true
      - text: Linear algebra, for quantifying how uncertain a model's predictions are
        why: Uncertainty is described with probability; linear algebra represents and transforms data with vectors and matrices.
      - text: Statistics, for computing the gradients that are then used to update the weights of the network
        why: Gradients come from calculus; statistics summarizes data and evaluates results (scaling, validation, error analysis).
      - text: Probability, for storing an image as an array of numbers for a dense layer
        why: Representing data as arrays and multiplying them by weight matrices is linear algebra.
    explanation: |
      Each foundation has its own job [^1]. Linear algebra represents data and transforms it, as in
      fully connected layers, convolution filters and attention. Calculus measures how the loss changes as the parameters
      change, which is what backpropagation and gradient-based optimization rely on [^2].
      Probability describes uncertain outcomes (classifier outputs, generative models), and
      statistics summarizes data and evaluates evidence (feature scaling, validation, error
      analysis) [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 28–29
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/calculus.html
        locator: Sec. 2.4 Calculus (introduction; Sec. 2.4.5 Discussion)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q45
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-152
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - notation
    question: |
      For trip $i$ the observed travel time is 7 minutes and the model predicts 5 minutes. Which
      statement uses the usual notation correctly?
    options:
      - text: $y_i = 7$, $\hat y_i = 5$, and $\theta$ collects the weights and biases of the model
        correct: true
      - text: $y_i = 5$, $\hat y_i = 7$, and $\theta$ collects the weights and biases of the model
        why: The hat marks the prediction, so $\hat y_i = 5$; the observed target is $y_i = 7$.
      - text: $x_i = 7$, $y_i = 5$, and $\theta$ stands for the learning rate
        why: $x_i$ is the input (e.g. the distance), and the learning rate is a hyperparameter, not part of $\theta$.
      - text: $y_i = 7$, $\hat y_i = 5$, and $\theta$ stands for the number of examples
        why: The number of examples is $n$; $\theta$ denotes the adjustable parameters.
    explanation: |
      $x_i$ is the input of example $i$, $y_i$ its observed target and $\hat y_i$ the model's
      prediction; the hat marks an estimate [^1][^2]. $w$ and $b$ are a weight and a bias,
      $\theta$ collects all adjustable parameters, and $n$ counts the examples, so a mean is a sum
      $\sum$ divided by $n$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 30
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#model
        locator: Sec. 3.1.1 Basics; Sec. 3.1.1.1 Model
    source:
      id: ncu-intro-dl
      ref: lecture-01/q46
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-153
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - distribution-shift
    question: |
      A defect detector was validated on images from camera A. After the factory switches to
      camera B, which has different lighting, the detector's alerts become unreliable, although the
      parts themselves have not changed. What is the most likely explanation?
    options:
      - text: The input distribution has shifted, so results measured on camera A no longer hold
        correct: true
      - text: The defect rate on the production line must have risen, since many more alerts are raised
        why: The parts have not changed; what changed is how their images look.
      - text: The model's weights changed by themselves during deployment
        why: A deployed model's parameters stay fixed unless someone retrains it.
      - text: The model overfits more and more the longer it is in use
        why: Overfitting arises during training; running a fixed model does not make it overfit.
    explanation: |
      The model's $P(\text{defect} \mid \text{image})$ was learned and checked on the kind of
      images it saw during development [^1]. A new camera or production line changes the
      distribution of the inputs while what counts as a defect stays the same (covariate shift), so
      performance measured under the old distribution need not carry over [^1][^2]. The usual remedy
      is to collect and label data from the new setup and re-validate or retrain.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 62
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#covariate-shift
        locator: Sec. 4.7.1.1 Covariate Shift
    source:
      id: ncu-intro-dl
      ref: lecture-01/q68
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-154
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - bias-variance
    question: |
      Suppose the same training procedure is run again and again, each time on a fresh training set
      drawn from the same distribution, and its prediction at one fixed input $x$ is recorded. What
      do bias and variance measure?
    options:
      - text: 'Bias: how far the average prediction lies from the true value at $x$; variance: how much the predictions scatter'
        correct: true
      - text: 'Bias: how much the predictions scatter between training sets; variance: how far their average lies from the truth'
        why: The definitions are swapped.
      - text: 'Bias: the error on the training set; variance: the error on the validation set'
        why: Those are training and validation errors; they are related to, but not the definitions of, bias and variance.
      - text: 'Bias: the value of the bias term $b$ in the model; variance: the variance of the input features'
        why: Statistical bias concerns the average prediction error, not a parameter, and variance concerns the predictions, not the inputs.
    explanation: |
      Bias compares the procedure's average prediction (over training sets) with the true
      regression function; variance measures how much the prediction changes from one training set
      to another [^1][^2]. For squared error the expected prediction error at $x$ splits into
      bias², variance and irreducible noise [^2]. Very simple models tend to have high bias, very
      flexible ones high variance.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 77
      - title: 'Wikipedia: Bias–variance tradeoff'
        url: https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff#Bias%E2%80%93variance_decomposition_of_mean_squared_error
        locator: Bias–variance decomposition of mean squared error
    source:
      id: ncu-intro-dl
      ref: lecture-01/q77
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-155
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - bias-variance
    question: |
      A learning procedure is retrained on four different training sets and predicts 2, 4, 3 and 3
      at an input $x$ whose true function value is $f(x) = 5$. The target noise at $x$ has
      variance 1. Treating the four predictions as equally likely, the squared bias is {{1}}, the
      variance is {{2}}, and the expected squared prediction error at $x$ is {{3}}.
    answer:
      blanks:
        - numeric: 4
          tolerance: 0.001
          hint: a number
        - numeric: 0.5
          tolerance: 0.001
          hint: a number
        - numeric: 5.5
          tolerance: 0.001
          hint: a number
      model: Average prediction 3; bias² $(3 - 5)^2 = 4$; variance $(1 + 1 + 0 + 0)/4 = 0.5$; error $4 + 0.5 + 1 = 5.5$.
    explanation: |
      The average prediction is 3, so the bias is $3 - 5 = -2$ and the squared bias is 4 [^1][^2].
      The variance is the mean squared deviation of the predictions from that average,
      $(1 + 1 + 0 + 0)/4 = 0.5$. For squared error the expected error is bias² + variance + noise
      $= 4 + 0.5 + 1 = 5.5$ [^2]. Here the bias dominates: the procedure is systematically too low,
      a sign of underfitting.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 77
      - title: 'Wikipedia: Bias–variance tradeoff'
        url: https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff#Bias%E2%80%93variance_decomposition_of_mean_squared_error
        locator: Bias–variance decomposition of mean squared error
    source:
      id: ncu-intro-dl
      ref: lecture-01/q78
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-156
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - features
      - targets
    question: |
      A delivery-time model rescales its data: distance is measured in units of 5 km, the number of
      stops is used as is, and duration is measured in units of 10 min. A recorded trip covered 17.5 km
      with 4 stops and took 55 min. Its encoded input is [{{1}}, 4] and its target is {{2}}. If the
      model later predicts 4.2 for some trip, that prediction means {{3}} minutes.
    answer:
      blanks:
        - numeric: 3.5
          tolerance: 0.001
          hint: a number
        - numeric: 5.5
          tolerance: 0.001
          hint: a number
        - numeric: 42
          tolerance: 0.001
          hint: minutes
      model: $17.5/5 = 3.5$; $55/10 = 5.5$; $4.2 \times 10\ \text{min} = 42\ \text{min}$.
    explanation: |
      Each supervised example pairs an input vector of features with an observed target, and the
      prediction $\hat y$ is the model's estimate of that target on the same scale [^1][^2]. Dividing
      by fixed reference units only rescales: $17.5\ \text{km}/5\ \text{km} = 3.5$,
      $55\ \text{min}/10\ \text{min} = 5.5$, and a prediction of 4.2 converts back to 42 minutes.
      The reference units are fixed choices, not learned parameters.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 9–10
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#model
        locator: Sec. 3.1.1.1 Model (examples, features, label or target, the estimate ŷ)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q34
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-157
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - hyperparameters
    question: Which of these is a hyperparameter of an MLP rather than a parameter fitted from the data?
    options:
      - text: The number of units in the hidden layer
        correct: true
      - text: The bias of the output unit
        why: Biases are adjusted by gradient descent, like weights; they are parameters.
      - text: The weight from input 2 to hidden unit 1
        why: Every connection weight is a learned parameter.
      - text: The negative-side slope $\alpha$ of a PReLU activation
        why: PReLU learns $\alpha$ together with the weights, so it is a parameter, not a hyperparameter.
    explanation: |
      Parameters are the values training fits, such as weights and biases (and a PReLU slope);
      hyperparameters are chosen around training and are not updated by it — the hidden width, the
      depth, the learning rate or the batch size [^1][^2][^3]. The architecture fixes the shapes and
      the number of parameters; training fixes their values.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 17
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent (hyperparameters)
      - title: 'Wikipedia: Rectifier (neural networks)'
        url: https://en.wikipedia.org/wiki/Rectifier_(neural_networks)
        locator: Variants — Piecewise-linear variants (Parametric ReLU)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q37
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-158
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - capacity
      - optimization
    question: |
      A network architecture once reached almost zero training loss on a dataset. Retrained on the same
      data with a learning rate 1000 times smaller, it ends the same number of epochs with a high
      training loss. What does the high training loss reflect in this run?
    options:
      - text: 'An optimization failure: this run did not reach weights that fit the data'
        correct: true
      - text: Too little representational capacity to express a function that fits the data
        why: The same architecture already fitted these data, so it can express such a function.
      - text: Poor generalization from the training examples to new examples
        why: Generalization concerns new data; here the model does not even fit the training set.
      - text: Training labels so noisy that no model of this size can fit them
        why: The same data were fitted almost perfectly before, so the labels can be fitted.
    explanation: |
      Representational capacity is what an architecture can express, training is the search for
      parameters that minimize the training objective, and generalization is the performance on new
      data [^1][^2]. The earlier run proves that parameters fitting these data exist, so the high
      training loss points to the optimization: with a tiny learning rate every step moves the weights
      very little, and many more iterations would be needed [^3]. A high training loss is therefore not
      always a sign that the model is too small.
    references:
