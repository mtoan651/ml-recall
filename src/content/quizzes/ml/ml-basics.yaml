  - id: ml-basics-117
    type: single
    difficulty: medium
    tags:
      - permutation-importance
      - feature-scaling
      - random-forest
    question: |
      A random forest predicts taxi fares. You multiply one feature, the absolute change in latitude,
      by 1000 (as if changing its unit), retrain, and recompute permutation importance on the
      validation data. What happens to that feature's permutation importance?
    options:
      - text: It stays about the same; tree splits depend on order, not scale
        correct: true
      - text: It grows about 1000-fold, because the feature's values are 1000 times larger
        why: Permutation importance measures how much the model's loss suffers when the column is shuffled, not the size of the values [^2].
      - text: It shrinks, because shuffling large values disturbs the predictions less
        why: Shuffling breaks the link between the column and the target whatever its scale; for a tree the rescaled column carries the same information [^1].
      - text: It cannot be computed until the feature is standardized again
        why: Permutation importance works on any trained model and any feature values; it only shuffles a column and re-scores [^2].
    explanation: |
      The scale of a feature does not affect permutation importance by itself; rescaling matters only
      indirectly, if it helps or hurts the learning method's use of the feature, which does not happen
      with tree-based models like a random forest [^1]. A tree compares values with thresholds, so
      multiplying a column by 1000 only moves the thresholds. Permutation importance then shuffles the
      column in the validation data and measures how much the loss deteriorates [^2]. A model whose
      penalty depends on the size of its weights, such as ridge regression, could be affected [^1].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 2 exercise, Question 5 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_explainability/ex2.py
