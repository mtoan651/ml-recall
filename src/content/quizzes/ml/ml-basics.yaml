  - id: ml-basics-081
    type: single
    difficulty: easy
    tags:
      - bias-variance
      - underfitting
    question: Which observation suggests that a model suffers from high bias?
    options:
      - text: Training error is low but test error is much higher
        why: A large gap between a low training error and the test error is the sign of overfitting, that is, high variance [^1].
      - text: Training and test errors are both high and close to each other
        correct: true
      - text: The model fits the training set well but fails on new data
        why: Fitting the training set well but not generalizing is overfitting (high variance), not high bias [^1].
      - text: The training error is close to zero
        why: A near-zero training error means the model can fit the training data, so bias is low; if anything, watch for high variance [^1].
    explanation: |
      Bias is the tendency to consistently learn the same wrong thing, and high bias corresponds to
      underfitting [^2]. An underfitting model is too simple to capture even the useful patterns in
      the training data, so both training and validation (or test) errors are high and the gap
      between them is small, $E_\text{best} < E_\text{train} \lesssim E_\text{valid}$ [^1]. High
      variance shows the opposite pattern: low training error and a big gap [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Underfitting and Overfitting'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Bias vs variance tradeoff'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
    source:
