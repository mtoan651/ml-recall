  - id: ml-basics-124
    type: single
    difficulty: medium
    tags:
      - shap
      - summary-plot
      - permutation-importance
    question: |
      In a SHAP summary plot, feature A's SHAP values span a much wider range than feature B's, mainly
      because of a few extreme points; most of A's values sit near zero. Is A therefore the more
      important feature in the sense of permutation importance?
    options:
      - text: Not necessarily; a few outliers can set the range of SHAP values
        correct: true
      - text: Yes; the width of a feature's range of SHAP values approximates its permutation importance
        why: The range can be set by a handful of rows, so it maps poorly to any overall notion of importance [^1].
      - text: Yes, as long as the extreme points have high feature values (pink dots)
        why: The colour tells which feature values caused the effect, not how important the feature is across the data [^2].
      - text: No, because SHAP values and permutation importance always rank features differently
        why: The two often agree; widely spread SHAP values across all rows do indicate a high permutation importance [^1].
    explanation: |
      The width of the effects range is not a reasonable stand-in for permutation importance, because
      a few outliers can determine it [^1]. A medium permutation importance could mean a large effect for
      a few predictions or a medium effect for all of them, which is the detail a SHAP summary plot
      adds [^2]. Only if the dots are widely spread over all rows does the plot indicate high
      permutation importance [^1].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 5 exercise, Question 2 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_explainability/ex5.py
