  - id: ml-basics-065
    type: single
    difficulty: easy
    question: |
      A content-based recommender represents apps and the user in the same binary feature space
      (1 = the app has the feature, or the user has shown interest in it):

      | | Education | Casual | Health | TimeWastr | Science R Us | Healthcare |
      | --- | :-: | :-: | :-: | :-: | :-: | :-: |
      | Educational app by Science R Us | 1 | 0 | 0 | 0 | 1 | 0 |
      | Casual app by TimeWastr | 0 | 1 | 0 | 1 | 0 | 0 |
      | Health app by Healthcare | 0 | 0 | 1 | 0 | 0 | 1 |
      | **User** | 1 | 0 | 0 | 0 | 1 | 1 |

      Using the dot product as the similarity measure, which app should it recommend?
    options:
      - text: The educational app created by Science R Us.
        correct: true
      - text: The health app created by Healthcare.
        why: This app scores a 1. It isn't the worst recommendation our system could make, but it certainly isn't the best.
      - text: The casual app created by TimeWastr.
        why: This app actually has the lowest dot product at 0. Our user isn't interested in casual apps like games.
    explanation: |
      With binary vectors, the dot product $\langle x, y \rangle = \sum_i x_i y_i$ counts the features
      active in both the user and the app, so a higher value means a more similar item [^1]. The
      educational app shares Education and Science R Us with the user (score 2), the health app shares
      only Healthcare (score 1), and the casual app shares nothing (score 0). The system scores every
      candidate and recommends the highest, here the educational app [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/content-based/basics
        locator: 'Recommendation Systems: Content-based filtering, Basics (sec. Using dot product as a similarity measure)'
    source:
      id: google-ml-courses
      ref: recommendation/content-based/basics#q1
      url: https://developers.google.com/machine-learning/recommendation/content-based/basics
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-066
    type: single
    difficulty: easy
    question: Platforms such as YouTube and Google Play already have search. Why do they also use recommendation systems?
    options:
      - text: They surface items users would not think to search for in a huge, growing catalogue
        correct: true
      - text: Search cannot find any item in a catalogue that holds more than a few thousand items
        why: Search handles catalogues of millions of items; its limit is that users must already know what to look for.
      - text: Recommendations need no data about users or items, so they are cheaper to run than search
        why: Recommendations depend on data about users and items, such as past interactions, to measure similarity.
      - text: Recommendations guarantee that every item in the catalogue is shown equally often
        why: Recommendations rank items by predicted relevance to each user, so some items are shown far more often than others.
    explanation: |
      A recommendation system helps users find compelling content in a very large corpus: Google Play
      has millions of apps and YouTube billions of videos. Search works when you know what to look for,
      but recommendations can show items users might not have thought to search for, and they drive a
      large share of installs and watch time [^1]. They depend on data about users and items, such as
      past interactions, to measure similarity [^1], and they rank items by relevance rather than
      showing all equally.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/overview
        locator: 'Recommendation Systems: Recommendation systems overview, sec. Why recommendations?'
    source:
      id: google-ml-courses
      ref: recommendation/overview/check-your-understanding#q1
      url: https://developers.google.com/machine-learning/recommendation/overview/check-your-understanding
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-067
    type: single
    difficulty: easy
    question: A common architecture for large-scale recommendation systems has three stages. Which are they?
    options:
      - text: candidate generation, scoring, and re-ranking
        correct: true
      - text: embedding, similarity metrics, and serving
        why: These elements are related to recommendation systems, but they are not primary components.
      - text: matrix factorization, DNN, and reranking
        why: While re-ranking is a component, matrix factorization and DNN are types of candidate generators.
    explanation: |
      One common architecture has three stages. Candidate generation cuts a huge corpus down to a small
      subset, e.g. from billions of videos to hundreds; scoring ranks those candidates with a more
      precise model to pick about ten items; and re-ranking applies further constraints such as removing
      disliked items, boosting fresh content and ensuring diversity and fairness [^1]. Embeddings and
      similarity measures are tools used inside these stages, and matrix factorization and deep networks
      are kinds of candidate generators, not stages [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/overview/types
        locator: 'Recommendation Systems: Recommendation systems overview, Candidate generation, scoring and re-ranking'
    source:
      id: google-ml-courses
      ref: recommendation/overview/check-your-understanding#q2
      url: https://developers.google.com/machine-learning/recommendation/overview/check-your-understanding
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-068
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** Classical results on generalization assume that training and test examples are drawn independently from the same distribution (the i.i.d. assumption).

      **Statement 2.** Around 2017, object detectors trained on COCO usually started from a backbone pretrained on ImageNet classification.
    options:
      - text: True, True
        correct: true
      - text: False, False
        why: Both statements are true; generalization results rely on the i.i.d. assumption, and ImageNet pre-training was the standard start for COCO detectors.
      - text: True, False
        why: Statement 2 is true as well; around 2017, COCO detectors were usually fine-tuned from ImageNet-pretrained backbones.
      - text: False, True
        why: Statement 1 is true as well; classical generalization results assume training and test data drawn i.i.d. from the same distribution.
    explanation: 'Statement 1 is true: the usual argument that training error tells us something about generalization error assumes the training and test data are drawn independently from identical distributions, the IID assumption [^1]. Statement 2 is also true: fine-tuning an ImageNet-pretrained network was the de facto recipe for COCO detection, and the top COCO 2017 competition results used ImageNet pre-training, which is why training from scratch was later presented as a challenge to conventional wisdom [^2]. This is the fine-tuning pattern of transfer learning: pretrain a model on a large source dataset, then train it further on the target task [^3].'
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
        locator: Sec. 3.6.1 Training Error and Generalization Error (IID assumption)
      - title: 'He, Girshick, Dollár (2018): Rethinking ImageNet Pre-training (arXiv:1811.08883)'
        url: https://arxiv.org/abs/1811.08883
        locator: Abstract
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
        locator: Sec. 14.2.1 Steps (fine-tuning)
    source:
      id: mmlu-redux
      ref: machine_learning/86
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=86
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-069
    type: single
    difficulty: easy
    question: Why might a business choose a machine-learning approach instead of a hand-coded rules engine?
    options:
      - text: The patterns are too complex or change too often to write as rules, but can be learned from data
        correct: true
      - text: An ML model is guaranteed to give the right answer on every input, which hand-written rules can never promise
        why: ML models make mistakes too; they are judged by how often they are right on new data, not by a guarantee.
      - text: An ML model needs no data, only a description of the problem
        why: ML learns its rules from data; without examples there is nothing to learn from.
      - text: Hand-written rules cannot be changed once they are deployed
        why: A rules engine can be updated, but only by developers rewriting it by hand; an ML model adapts by retraining on new data.
    explanation: |
      Microsoft's ML-for-Beginners course starts the ML workflow with a question that cannot be
      answered by a simple conditional program or rules engine, for example predicting mortality
      when many health variables interact [^1]. d2l gives the same two reasons: some tasks follow a
      pattern that changes over time, and others involve relationships too complicated to code by
      hand, so the program has to learn from experience, usually data [^2]. ML models still make
      mistakes and cannot learn without data. A rules engine can be changed too, but only when its
      developers decide to update it by hand [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#what-question-to-ask
        locator: 'Lesson: Techniques of Machine Learning, secs. Introduction (step 1) and What question to ask'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html
        locator: Ch. 1 Introduction (opening section, rules vs. learning from experience)
    source:
      id: ms-ml-for-beginners
      ref: quiz-1/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-070
    type: true_false
    difficulty: easy
    question: 'True or false: machine learning algorithms are designed to simulate the human brain.'
    options:
      - text: 'True'
        why: ML is at most loosely inspired by the brain; most ML algorithms, from linear regression to k-means, contain nothing brain-like.
      - text: 'False'
        correct: true
    explanation: |
      False. Microsoft's ML-for-Beginners introduction calls ML "loosely inspired" by how the brain
      learns from what it perceives and draws only "motivational similarities" between the two.
      What defines ML is algorithms that learn hidden patterns from data to support decisions [^1].
      Most classical methods, such as linear regression, decision trees or k-means, contain nothing
      brain-like. Even neural networks took little more than their name from biology: d2l notes
      that the biological interpretation has become less literal over time, and what such networks
      share is layers of linear and nonlinear units trained with the chain rule [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#why-study-machine-learning
        locator: "Lesson: Introduction to machine learning, secs. The child's brain and Why study machine learning?"
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#roots
        locator: Sec. 1.4 Roots
    source:
      id: ms-ml-for-beginners
      ref: quiz-2/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-071
    type: single
    difficulty: easy
    question: Which of these is a classical machine-learning technique, as opposed to deep learning?
    options:
      - text: Logistic regression
        correct: true
      - text: A convolutional neural network
        why: A convolutional neural network is a deep-learning architecture, built from stacked layers of learned convolutions.
      - text: A Transformer language model
        why: A Transformer language model is a deep neural network made of many stacked attention layers.
    explanation: |
      Microsoft's ML-for-Beginners curriculum calls methods such as regression, classification and
      clustering built with scikit-learn "classical machine learning", and it explicitly leaves out
      neural networks and deep learning [^1]. Logistic regression belongs to that classical
      toolbox: a linear model of the log-odds fitted directly to the given features. Convolutional
      networks and Transformers are deep neural network architectures; d2l describes how, once data
      and compute grew, the sweet spot moved from linear models and kernel methods to deep networks
      such as these [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
        locator: 'Lesson: Introduction to machine learning, secs. Concepts to cover and What we will not cover'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#the-road-to-deep-learning
        locator: Sec. 1.5 The Road to Deep Learning
    source:
      id: ms-ml-for-beginners
      ref: quiz-2/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-072
    type: single
    difficulty: easy
    question: In the usual machine-learning workflow, which order of these two steps is right?
    options:
      - text: Prepare the data, then train the model
        correct: true
      - text: Choose a training method, then collect and prepare the data
        why: The training method depends on the question and on the nature of the data, so the data comes first.
      - text: Tune the hyperparameters, then train the model for the first time
        why: Tuning reacts to how a trained model performs; you train and evaluate first, then tune and train again.
    explanation: |
      The workflow in Microsoft's ML-for-Beginners course runs: decide on the question, collect and
      prepare the data, choose a training method, train the model, evaluate it, tune parameters,
      and predict [^1]. The training method comes after the data because the choice depends on the
      question and on the nature of the data [^1]. Tuning comes after a first round of training: you
      look at how the trained model performs on test data and then redo the process with different
      hyperparameters [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#introduction
        locator: 'Lesson: Techniques of Machine Learning, secs. Introduction (steps 1-7) and Parameter tuning'
    source:
      id: ms-ml-for-beginners
      ref: quiz-7/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-073
    type: single
    difficulty: easy
    question: In scikit-learn, which call trains a model on the feature matrix `X` and the targets `y`?
    options:
      - text: '`model.predict(X)`'
        why: '`predict` applies an already fitted model to new data; it does not train anything.'
      - text: '`model.train()`'
        why: scikit-learn estimators have no `train` method; in PyTorch, `model.train()` only switches a module into training mode.
      - text: '`model.fit(X, y)`'
        correct: true
    explanation: |
      Every scikit-learn estimator is trained with its `fit` method, which takes the samples matrix
      `X` and the target values `y`; once fitted, `predict` applies the trained model to new data
      without retraining [^1]. Microsoft's ML-for-Beginners course notes that `model.fit` is the
      training call in many ML libraries [^2]. `model.train()` is a trap from PyTorch: it only
      switches a module into training mode, which changes how layers such as dropout and batch
      normalization behave, and trains nothing by itself [^3].
    references:
      - title: 'scikit-learn: Getting Started'
        url: https://scikit-learn.org/stable/getting_started.html#fitting-and-predicting-estimator-basics
        locator: 'Fitting and predicting: estimator basics'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#train-a-model
        locator: 'Lesson: Techniques of Machine Learning, sec. Train a model'
      - title: 'PyTorch documentation: torch.nn.Module'
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html#torch.nn.Module.train
        locator: Method train(mode=True)
    source:
      id: ms-ml-for-beginners
      ref: quiz-8/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-074
    type: multiple
    difficulty: medium
    question: You save a trained scikit-learn model with Python's `pickle` module. Which statements are true? Select all that apply.
    options:
      - text: '`pickle.dump` serializes the model object into a byte stream that can be written to a file'
        correct: true
      - text: '`pickle.load` rebuilds the model object, so it can predict without being retrained'
        correct: true
      - text: Loading a pickle file from an untrusted source is safe, because the file only holds numbers
        why: A pickle can contain instructions that run arbitrary code while it is loaded, so unpickling an untrusted file is unsafe.
      - text: Programs in any language, such as JavaScript, can load the pickle file directly
        why: Pickle is a Python-specific format that other languages generally cannot read; formats such as ONNX exist for serving models outside Python.
    explanation: |
      Pickling converts a Python object hierarchy, such as a fitted model, into a byte stream, and
      unpickling turns the byte stream back into the object [^1]; Microsoft's ML-for-Beginners
      web-app lesson pickles its trained model and then reloads it to call `predict` [^2].
      Unpickling an untrusted file is not safe: malicious pickle data can execute arbitrary code
      while it loads, and that lesson warns about this too [^1][^2]. The format is Python-specific,
      so non-Python programs may be unable to read it; scikit-learn points to ONNX when a model must
      be served without Python [^1][^3].
    references:
      - title: 'Python documentation: pickle — Python object serialization'
        url: https://docs.python.org/3/library/pickle.html
        locator: Module introduction, Warning, and Data stream format
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---pickle-your-model
        locator: "Lesson: Build a web app to use a ML model, secs. Tool and Exercise - 'pickle' your model"
      - title: 'scikit-learn User Guide: Model persistence'
        url: https://scikit-learn.org/stable/model_persistence.html
        locator: Summary of model persistence methods
    source:
      id: ms-ml-for-beginners
      ref: quiz-17/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-075
    type: true_false
    difficulty: easy
    question: 'True or false: if a trained model is exported (for example to ONNX) and run inside the web page itself, instead of on a server that the page calls, the app can keep making predictions while the device is offline.'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Once the model runs inside the page, a prediction needs no server round trip, so the app keeps working without a connection.
    explanation: |
      True. In Microsoft's ML-for-Beginners cuisine-recommender lesson, the scikit-learn model is
      converted to ONNX and run in the browser with ONNX Runtime, which lets the app run locally and
      even offline [^1]. The same course's earlier UFO app instead sends each request to a pickled
      model inside a Flask server, so every prediction needs a connection to that server [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/4-Applied/README.md#build-your-model
        locator: 'Lesson: Build a cuisine recommender web app, secs. Build your model and Build a recommender web application'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---build-a-flask-app
        locator: 'Lesson: Build a web app to use a ML model, sec. Exercise - build a Flask app'
    source:
      id: ms-ml-for-beginners
      ref: quiz-25/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-076
    type: single
    difficulty: easy
    question: 'Using a trained model to make predictions on new inputs, as a web app does when a user submits a form, is called:'
    options:
      - text: inference
        correct: true
      - text: training
        why: Training is the earlier step that fits the model to labeled data; a web app answering a form uses the finished model.
      - text: validation
        why: Validation scores a model on held-out labeled examples to tune its hyperparameters; it does not serve predictions to users.
    explanation: |
      Inference is the process of making predictions by applying a trained model to new, unlabeled
      examples [^1]. In the terms of Microsoft's ML-for-Beginners course, the app takes the user's
      input and sends it to the model for inference [^2]. Training is the earlier step in which the
      model is fitted to the training data, and validation uses a separate set of examples to tune
      the model's hyperparameters [^2].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference
        locator: 'Production ML systems: Static versus dynamic inference'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#prediction
        locator: 'Lesson: Techniques of Machine Learning, secs. Split your dataset, Train a model and Prediction'
