        locator: 'Lecture 19: Time series — Train/test split for temporal data'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/19_time-series.ipynb
