  - id: ml-basics-093
    type: multiple
    difficulty: medium
    tags:
      - hyperparameter-optimization
      - grid-search
      - random-search
    question: Which statements about hyperparameter optimization are true? Select all that apply.
    options:
      - text: If the best results lie at the edge of your parameter grid, it may be worth extending the range of values
        correct: true
      - text: Grid search is guaranteed to find the best hyperparameter values
        why: It only finds the best combination *on the grid*, judged by noisy cross-validation scores; a better value may lie between or beyond the grid points [^1].
      - text: Different runs of randomized search can return different hyperparameters
        correct: true
      - text: A grid of 10 hyperparameters with 4 values each needs 40 cross-validation runs
        why: A grid tries every combination, $4^{10} = 1{,}048{,}576$ of them, which is why exhaustive search becomes infeasible so quickly [^2].
    explanation: |
      The range you pick matters: when the best score sits at the edge of the grid, the optimum may
      lie outside it, so the range should be moved or widened [^1]. Grid search evaluates every
      combination, so its cost grows exponentially with the number of hyperparameters [^2].
      Randomized search samples configurations at random, so unless the random state is fixed,
      different runs can try different values and return different winners [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Bad range for hyperparameters'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Problems with exhaustive grid search'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Randomized hyperparameter search (n_iter)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
    source:
