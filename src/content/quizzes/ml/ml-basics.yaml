  - id: ml-basics-114
    type: multiple
    difficulty: medium
    tags:
      - interpretability
      - feature-importance
      - shap
    question: |
      You want to explain a random forest that classifies examples as `neg` or `pos`. Which
      statements are true? Select all that apply.
    options:
      - text: A `feature_importances_` value of 0.58 for feature 1 means that increasing feature 1 pushes predictions towards `pos`
        why: Tree feature importances have no sign; they say how much a feature is used, not whether it pushes up or down [^1].
      - text: SHAP values can be computed to explain predictions on test examples, not only on training examples
        correct: true
      - text: SHAP values can be positive or negative, showing which features push one prediction up or down
        correct: true
      - text: A feature's effect in a tree ensemble can first raise and then lower the prediction as the feature grows
        correct: true
    explanation: |
      Unlike linear coefficients, `feature_importances_` have no sign: they show importance but no
      "up or down", and with trees a prediction may go up and then down as a feature increases
      [^1]. SHAP explains an individual prediction by the contribution of each feature value,
      positive or negative, relative to a base value; the course computes SHAP values for both the
      training and the test examples [^2].
    references:
      - source: ubc-dsci573
        locator: Lecture 8 notes, sklearn's feature_importances_ ... — Key point
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/08_model-transparency-conclusion.ipynb
      - source: ubc-dsci573
        locator: Lecture 8 notes, SHAP introduction; SHAP on LGBM model; Force plots
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/08_model-transparency-conclusion.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/08_model-transparency-conclusion.ipynb#ex8.1
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/08_model-transparency-conclusion.ipynb
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-115
    type: short_answer
    difficulty: medium
    tags:
      - shap
      - interpretability
      - additivity
    question: |
      A gradient-boosted classifier's raw scores (log-odds of class 1) average $-2.3$ over the
      training set; this is the SHAP base value. For one test example the SHAP values are: marital
      status $-1.1$, age $+0.4$, capital gain $-0.6$, education $-0.9$, and all other features
      together $-0.3$. What is the model's raw score for this example?
    answer:
      numeric: -4.8
      tolerance: 0.001
      hint: a number, 1 decimal
      model: $-2.3 - 1.1 + 0.4 - 0.6 - 0.9 - 0.3 = -4.8$
    explanation: |
      SHAP explanations are additive: the base value (the mean raw score) plus the SHAP values of
      all features equals the model's raw output for that example [^1]. Here
      $-2.3 + (-1.1 + 0.4 - 0.6 - 0.9 - 0.3) = -4.8$, well below the average, so the example is
      confidently predicted as class 0 (probability $\sigma(-4.8) \approx 0.008$ for class 1). A
      force plot draws exactly these pushes up and down from the base value [^1].
    references:
      - source: ubc-dsci573
        locator: Lecture 8 notes, Explaining a prediction (raw score, expected_value, "the feature importances sum to the prediction")
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/08_model-transparency-conclusion.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/08_model-transparency-conclusion.ipynb#shap-additivity
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/08_model-transparency-conclusion.ipynb
    status: reviewed
