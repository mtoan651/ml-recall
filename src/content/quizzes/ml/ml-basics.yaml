  - id: ml-basics-120
    type: single
    difficulty: hard
    tags:
      - partial-dependence
      - permutation-importance
      - interactions
    question: |
      Two independent features $X_1$ and $X_2$ are uniform on $[-2, 2]$, and the target is
      $y = X_1 X_2$. A model learns this function almost exactly. What do the partial dependence plot
      (PDP) and the permutation importance of $X_1$ show?
    options:
      - text: A flat PDP, but a high permutation importance
        correct: true
      - text: A steep PDP and a high permutation importance
        why: The PDP averages $x_1 X_2$ over the rows, which is $x_1$ times the mean of $X_2$, about 0, for every $x_1$ [^2].
      - text: A flat PDP and a permutation importance near zero
        why: Shuffling $X_1$ destroys the product, so the error grows to about twice the target's variance [^3].
      - text: A U-shaped PDP and a permutation importance near zero
        why: A product of independent zero-mean features has no average effect in either direction, and shuffling still ruins the predictions [^3].
    explanation: |
      The exercise asks for exactly this: a feature with high permutation importance but a flat
      partial dependence plot, and its solution uses $y = X_1 X_2$ [^1]. The PDP fixes $X_1 = x_1$ in
      every row and averages the predictions, giving $x_1 \cdot \overline{X_2} \approx 0$, so the
      positive and negative effects cancel [^2]. Shuffling $X_1$ breaks the product: the squared error
      becomes $E[X_2^2]\,E[(X_1 - X_1')^2] = \frac{4}{3} \cdot \frac{8}{3} \approx 3.6$, about twice the
      target's variance of $16/9$ [^3]. Effects that depend on another feature are invisible to an
      averaged PDP.
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 3 exercise, Question 7 flat PDP with high importance (hint and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_explainability/ex3.py
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 3 Partial Plots — tutorial, How it Works
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_explainability/raw/tut3_partial_plots.ipynb
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 2 Permutation Importance — tutorial, How It Works
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_explainability/raw/tut2_perm_importance.ipynb
    source:
