  - id: ml-basics-002
    type: single
    difficulty: easy
    question: Which of these problems is a Regression analysis-based problem?
    options:
      - text: Predicting the final exam marks of a student
        correct: true
      - text: Predicting the blood type of a person
      - text: Predicting whether an email is spam or not
    explanation: |
      Regression predicts a numeric value, and a final exam mark is a number on a scale [^1][^2]. Blood
      type and spam versus not-spam are category assignments, so predicting them is classification
      [^1][^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
