  - id: ml-basics-159
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - empirical-risk
    question: How does the empirical risk of a model differ from its population risk?
    options:
      - text: Empirical risk averages the loss over the finite training set; population risk is the loss expected under the true data distribution
        correct: true
      - text: Empirical risk is the loss expected under the true data distribution; population risk averages the loss over the finite training set
        why: This swaps the two; only the training-set average can actually be computed.
      - text: Empirical risk is the mean loss on the test set; population risk is the mean loss on the training set
        why: Test loss is an estimate of the population risk, and the training-set average is the empirical risk.
      - text: Empirical risk adds a regularization penalty to the loss; population risk is the plain data loss on the same examples
        why: Regularization is a separate term; empirical risk is just the average data loss.
    explanation: |
      Empirical risk $L(\theta) = \frac1N\sum_n \ell(f(x^{(n)}; \theta), y^{(n)})$ is a statistic of
      the training data that we can compute and minimize; population risk is the expectation of the
      loss under the unknown data-generating distribution — the quantity we actually care about
      [^1][^2]. A held-out test set estimates the population risk, and the difference between the two
      is the generalization gap [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 45
      - title: 'Wikipedia: Empirical risk minimization'
        url: https://en.wikipedia.org/wiki/Empirical_risk_minimization
        locator: Background; Formal definition
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
        locator: Sec. 3.6.1 Training Error and Generalization Error
    source:
      id: ncu-intro-dl
      ref: lecture-02/q56
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-160
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - generalization-gap
      - empirical-risk
    question: |
      A classifier misclassifies 3 of its 60 training examples. On a large held-out set from the same
      distribution its error rate is 0.20. Using the 0–1 loss, what are its empirical (training) risk
      and its estimated generalization gap?
    options:
      - text: 0.05 and 0.15
        correct: true
      - text: 0.95 and 0.15
        why: 0.95 is the training accuracy; the empirical risk averages the loss over the training examples, giving the error rate 3/60.
      - text: 0.05 and 0.25
        why: The gap is the population risk minus the empirical risk, $0.20 - 0.05$, not their sum.
      - text: 3 and 0.15
        why: Risk is an average over the examples, not a count of errors.
    explanation: |
      The empirical risk averages the loss over the training sample; with the 0–1 loss it equals the
      training error rate, $3/60 = 0.05$ [^1][^2]. The population risk is the loss expected on new
      data from the same distribution, which the held-out error of $0.20$ estimates [^3]. Their
      difference, about $0.15$, is the generalization gap; overfitting means a gap that stays large
      and positive [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 55
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
        locator: Sec. 3.6.1 Training Error and Generalization Error
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
        locator: Sec. 4.6.1 The Test Set, eqs. (4.6.1)–(4.6.2)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q55
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-161
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - model-complexity
      - overfitting
    question: |
      Polynomials of three degrees are fitted to the same 30 noisy training points and evaluated on
      fresh test points:

      | Degree | Training RMSE | Test RMSE |
      |---|---|---|
      | 1 | 0.71 | 0.83 |
      | 4 | 0.30 | 0.41 |
      | 14 | 0.05 | 6.2 |

      Which conclusion is correct?
    options:
      - text: Degree 4 fits best, while degree 14 overfits the noisy points
        correct: true
      - text: Degree 14 is the best model, because its training error is the lowest of the three
        why: Training error always falls as the degree grows; a model must be chosen by its error on unseen data.
      - text: Degree 1 overfits, because its test error is higher than its training error
        why: Test error is usually somewhat above training error; degree 1 is poor on both, which signals underfitting.
      - text: Degree 4 still underfits, because it does not drive the training error to zero
        why: Fitting noisy points exactly would mean fitting the noise; degree 4 has the lowest test error.
    explanation: |
      Raising the polynomial degree adds capacity, so the training error keeps falling; a high
      enough degree can pass through every training point [^2]. The test error first falls (from
      degree 1 to 4, less underfitting) and then explodes at degree 14: the flexible curve memorizes
      the training points, noise included, and swings wildly between them [^1][^3]. The model to keep is the
      one with the lowest error on held-out data, here degree 4.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 57
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#polynomial-curve-fitting
        locator: Sec. 3.6.2.1 Polynomial Curve Fitting
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting
        locator: Overfitting
    source:
      id: ncu-intro-dl
      ref: lecture-03/q57
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-162
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - overfitting
      - variance
    question: |
      A network is trained five times with different random seeds. Training accuracy ends near 99% in
      every run, while validation accuracy is 71%, 84%, 64%, 80% and 69%. What does this pattern
      indicate?
    options:
      - text: 'Overfitting with high variance: each run memorizes different details'
        correct: true
      - text: 'Underfitting: the network is too simple to fit even the training data'
        why: Near-perfect training accuracy rules out underfitting.
      - text: A data bug, since a correct pipeline gives identical results for every seed
        why: Seeds legitimately change the initialization and the batch order; the problem is how strongly the outcome depends on them.
      - text: A learning rate that is too small, so the runs stopped before converging
        why: Training accuracy is already about 99%; the issue is the gap to validation accuracy and its spread.
    explanation: |
      A large gap between training and validation accuracy is the main symptom of overfitting
      [^1][^2]. When the validation results also swing widely with the random seed (or the data
      split), the fitted function depends strongly on incidental details of each run: the
      high-variance side of the bias–variance trade-off, where the model picks up noise in the
      training data [^3]. Regularization, more data or a smaller model reduce both the gap and the
      spread; these choices are made on validation data while the test set stays untouched.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 56, 58
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#underfitting-or-overfitting
        locator: Sec. 3.6.2 Underfitting or Overfitting?
      - title: 'Wikipedia: Bias–variance tradeoff'
        url: https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff
        locator: Introduction
    source:
      id: ncu-intro-dl
      ref: lecture-03/q58
    status: reviewed
    reviewed_by: claude
