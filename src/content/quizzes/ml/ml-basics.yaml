  - id: ml-basics-006
    type: single
    difficulty: medium
    question: A machine learning problem involves four attributes plus a class. The attributes have 3, 2, 2, and 2 possible values each. The class has 3 possible values. How many maximum possible different examples are there?
    options:
      - text: '12'
      - text: '24'
      - text: '48'
      - text: '72'
        correct: true
    explanation: |
      Each possible example is one combination of the four attribute values together with a class
      value. The number of distinct examples is therefore the size of a Cartesian product, which the
      product rule gives by multiplying the number of choices for each part [^1]:
      $$3 \times 2 \times 2 \times 2 \times 3 = 72.$$
      The same counting is why d2l notes that just 30 binary features already allow $2^{30}$ different
      inputs [^2]. The answer 24 counts only the attribute combinations and forgets the class, and 12
      and 48 drop or miscount a factor.
    references:
      - title: 'Lehman, Leighton, Meyer: Mathematics for Computer Science (MIT 6.042, 2018)'
        url: https://courses.csail.mit.edu/6.042/spring18/mcs.pdf
        locator: Sec. 15.2.1 The Product Rule (Rule 15.2.1), p. 657
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/naive-bayes.html#the-probabilistic-model-for-classification
        locator: Sec. 22.9.2 The Probabilistic Model for Classification
    source:
      id: mmlu-redux
      ref: machine_learning/2
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=2
    status: draft
  - id: ml-basics-007
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Overfitting is more likely when the set of training data is small.

      **Statement 2.** Overfitting is more likely when the hypothesis space is small.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
        correct: true
      - text: False, True
    explanation: |
      **Statement 1** is true: with little training data a flexible model can fit the noise, and for
      a fixed model, the fewer training samples there are, the more likely overfitting becomes [^2].
      **Statement 2** is false: a *small* hypothesis space limits capacity, which makes
      underfitting — not overfitting — more likely. Overfitting grows with model complexity, not
      with its absence [^3]. MMLU-Redux experts flagged the original answer key as wrong [^1].
    references:
      - source: mmlu-redux
        locator: machine_learning row 8 — wrong_groundtruth
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#dataset-size
        locator: Sec. 3.6.2.2 Dataset Size
        quote: Fixing our model, the fewer samples we have in the training dataset, the more likely (and more severely) we are to encounter overfitting.
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#model-complexity
        locator: Sec. 3.6.1.1 Model Complexity and Sec. 3.6.2 Underfitting or Overfitting?
        quote: when we work with more complex models and/or fewer examples, we expect the training error to go down but the generalization gap to grow.
    source:
      id: mmlu-redux
      ref: machine_learning/8
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=8
    status: draft
  - id: ml-basics-008
    type: single
    difficulty: medium
    question: The disadvantage of Grid search is
    options:
      - text: It can not be applied to non-differentiable functions.
      - text: It can not be applied to non-continuous functions.
      - text: It is hard to implement.
      - text: It runs reasonably slow for multiple linear regression.
        correct: true
    explanation: |
      Grid search only evaluates the objective at the points of a grid. It needs no derivatives and no
      continuity, and it is a simple baseline method [^1][^2]. Its weakness is cost: it tries every
      combination in the Cartesian product of the per-parameter grids, so the number of evaluations
      multiplies with each parameter you add [^1][^2]. Multiple linear regression has one coefficient
      per feature, so a grid over all coefficients becomes very slow, while least squares solves the
      same problem in closed form [^3].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/grid_search.html#exhaustive-grid-search
        locator: Sec. 3.2.1 Exhaustive Grid Search and Sec. 3.2.2 Randomized Parameter Optimization
      - source: d2l
        url: https://d2l.ai/chapter_hyperparameter-optimization/hyperopt-intro.html#exercises
        locator: 'Sec. 19.1 What Is Hyperparameter Optimization? (19.1.4 Exercises: grid search)'
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
        locator: Sec. 3.1.1.3 Analytic Solution
    source:
      id: mmlu-redux
      ref: machine_learning/17
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=17
