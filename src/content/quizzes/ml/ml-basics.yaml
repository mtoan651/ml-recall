    question: Which situation describes overfitting?
    options:
      - text: The model does well on the training set but clearly worse on validation or test data.
        correct: true
      - text: The model does far worse on the training set than on the validation set.
        why: This is unusual and is not overfitting.
      - text: The model does poorly on both the training and the validation set.
        why: That is underfitting.
      - text: The model does well on both the training and the validation set.
        why: That is a model that generalizes.
    explanation: An overfitted model reaches a small training error but a large error on unseen data — a large generalization gap [^1][^2].
