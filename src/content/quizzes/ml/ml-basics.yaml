  - id: ml-basics-042
    type: multiple
    question: Which **two** of the following statements are true about static (offline) training?
    options:
      - text: The model stays up to date as new data arrives.
        why: Actually, if you train offline, then the model has no way to incorporate new data as it arrives. This can lead to model staleness, if the distribution you are trying to learn from changes over time.
      - text: You can verify the model before applying it in production.
        correct: true
      - text: Offline training requires less monitoring of training jobs than online training.
        correct: true
      - text: Very little monitoring of input data needs to be done at inference time.
        why: Counterintuitively, you do need to monitor input data at serving time. If the input distributions change, then our model's predictions may become unreliable. Imagine, for example, a model trained only on summertime clothing data suddenly being used to predict clothing buying behavior in wintertime.
    explanation: Yes, offline training gives ample opportunity to verify model performance before introducing the model in production. In general, monitoring requirements at training time are more modest for offline training, which insulates you from many production considerations. However, the more frequently you train your model, the higher the investment you'll need to make in monitoring. You'll also want to validate regularly to ensure that changes to your code (and its dependencies) don't adversely affect model quality. [^1]
    references:
      - source: google-mlcc
        locator: 'Production ML systems: Static versus dynamic training Stay organized with collections Save and categorize content based on your preferences.'
