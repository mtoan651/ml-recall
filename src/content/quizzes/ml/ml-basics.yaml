      - text: A smaller, simplified representation of the thing you're studying
        why: That is a model in the everyday sense, like a scale model. In ML, a model maps inputs (features) to predictions.
    explanation: |
      In ML, a model is a mathematical relationship, such as a function with learned parameters,
