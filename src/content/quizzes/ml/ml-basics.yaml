  - id: ml-basics-002
    type: single
    difficulty: easy
    question: Which of these problems is a regression problem?
    options:
      - text: Predicting the final exam marks of a student
        correct: true
      - text: Predicting the blood type of a person
        why: Blood type is one of a few categories (A, B, AB, O), so predicting it is classification [^2].
      - text: Predicting whether an email is spam or not
        why: Spam or not spam is a yes/no category, so this is (binary) classification [^2].
    explanation: |
      Regression predicts a numeric value, and a final exam mark is a number on a scale [^1][^2]. Blood
      type and spam versus not-spam are category assignments, so predicting them is classification
      [^1][^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
        locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#regression
        locator: Sec. 1.3.1.1 Regression and Sec. 1.3.1.2 Classification
    source:
