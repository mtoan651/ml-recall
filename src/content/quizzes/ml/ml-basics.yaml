  - id: ml-basics-082
    type: single
    difficulty: easy
    tags:
      - cross-validation
      - model-evaluation
    question: What does $k$-fold cross-validation give you compared with a single train/validation split?
    options:
      - text: More training data, because examples are reused across folds
        why: Cross-validation reuses the same examples in different roles; it adds no new data [^1].
      - text: Faster training, because each fold is smaller
        why: It trains the model $k$ times, once per fold, so it is slower than a single split [^1].
      - text: No need for feature scaling, because folds are averaged
        why: Whether features need scaling depends on the model, not on how you validate it [^2].
      - text: A more robust estimate of performance on unseen data
        correct: true
    explanation: |
      A single split can be unlucky: with a small dataset the validation set is tiny, or the split
      happens not to represent new data well [^1]. In $k$-fold cross-validation each fold takes a
      turn as the validation set, giving $k$ scores whose mean (and spread) is a more robust
      measure of error on unseen data [^1]. The price is $k$ calls to `fit`. Note that this makes the
      estimate less noisy; it does not remove all bias, for example the optimism that comes from
      reusing the same folds for many hyperparameter settings [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Cross-validation (Problems with single train/validation split)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 5: Preprocessing and sklearn pipelines — Scaling'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/05_preprocessing-pipelines.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Optimization bias/Overfitting of the validation set'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
    source:
