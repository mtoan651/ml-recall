    question: |
      Three models are trained on the same data:

      | Model | Training accuracy | Validation accuracy |
      |---|---|---|
      | A | 99% | 72% |
      | B | 84% | 82% |
      | C | 61% | 59% |

      Which model shows the clearest sign of overfitting?
    options:
      - text: Model A
        correct: true
      - text: Model B
        why: Its training and validation accuracies are both good and close together, so it generalizes.
      - text: Model C
        why: It is poor on both sets with a small gap — that is underfitting.
      - text: All three, since each validation accuracy is below its training accuracy
        why: A small gap is normal; overfitting means a large gap between training and unseen data.
    explanation: |
      An overfitted model fits the training set very well but does clearly worse on unseen data, so the
      sign is a large gap between training and validation performance — 27 points for model A [^1][^2].
      Model C is weak on both sets (underfitting), and model B's small gap is expected.
