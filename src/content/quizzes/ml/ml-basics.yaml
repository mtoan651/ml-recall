  - id: ml-basics-111
    type: single
    difficulty: easy
    tags:
      - overfitting
      - generalization
    question: Which of these observations does NOT by itself suggest that a model is overfitting?
    options:
      - text: Training and validation accuracy are both about 0.88
        correct: true
      - text: Training accuracy is 0.98 while validation accuracy is 0.60
        why: A large gap between training and validation scores is the classic symptom of overfitting [^1].
      - text: The model has become very specific to the training examples
        why: Fitting the training data so specifically that it fails to generalize is what overfitting means [^1].
      - text: The classifier's decision boundary is wiggly and highly irregular
        why: An irregular boundary usually means the model bends around individual training points and their noise [^1].
    explanation: |
      Overfitting shows up as a low training error with a big gap to the validation error, because
      the model encodes random quirks of the training data that do not generalize [^1]. Equal
      training and validation accuracy means there is no gap; the model may be fine, or it may be
      underfitting if 0.88 is far from the best achievable error, but it is not overfitting [^1].
    references:
      - source: ubc-dsci571
        locator: Lecture 2 notes, Underfitting, overfitting, the fundamental trade-off (Types of errors, Underfitting, Overfitting)
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/02_ml-fundamentals.ipynb
    source:
      id: ubc-dsci571
      ref: lectures/notes/02_ml-fundamentals.ipynb#ex2.3
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/02_ml-fundamentals.ipynb
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-112
    type: multiple
    difficulty: easy
    tags:
      - overfitting
      - bias-variance
    question: Which statements about overfitting are true? Select all that apply.
    options:
      - text: Some degree of overfitting is common in most real-world problems
        correct: true
      - text: Overfitting happens when a model learns the training data too closely, including its noise and outliers
        correct: true
      - text: An overfitting model has high bias, consistently learning the same wrong thing
        why: High bias corresponds to underfitting; overfitting corresponds to high variance, learning random things irrespective of the real signal [^1].
      - text: A training accuracy close to 100% proves the model is overfitting
        why: Overfitting is diagnosed by the gap to the validation score; a model can fit the training data well and still generalize [^1].
    explanation: |
      When the training error is low we are likely to be overfitting a little, and it is fairly
      common to have at least a bit of it [^1]. The fundamental trade-off is also called the
      bias–variance trade-off: high bias goes with underfitting, high variance with overfitting [^1].
      Whether a model overfits is judged by comparing training and validation (or cross-validation)
      errors, not by the training score alone.
    references:
      - source: ubc-dsci571
        locator: Lecture 2 notes, Overfitting; The fundamental tradeoff; Bias vs variance tradeoff
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/02_ml-fundamentals.ipynb
    source:
