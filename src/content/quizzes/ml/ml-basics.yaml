  - id: ml-basics-003
    type: single
    difficulty: easy
    question: If your Machine Learning model's training accuracy is 95 % and the testing accuracy is 30 %, then what type of condition it is called?
    options:
      - text: Overfitting
        correct: true
      - text: Underfitting
      - text: Double Fitting
    explanation: |
      A large gap between training accuracy (95%) and test accuracy (30%) is the signature of
      overfitting. The model has learned the details and noise of its training data so closely that
      it fails on new data [^1][^2]. An underfit model would do poorly on the training data as well
      [^1][^2]. "Double fitting" is not a standard term.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#evaluate-the-model
        locator: 'Lesson: Techniques of Machine Learning, Evaluate the model'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#fitting
        locator: Overfitting, Fitting, overfitting, and underfitting
    source:
      id: ms-ml-for-beginners
      ref: quiz-10/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ml-basics-004
    type: single
    difficulty: easy
    question: "The process of splitting a dataset into a certain ratio of training and testing dataset using Scikit Learn's 'train_test_split()' method/function is called:"
    options:
      - text: Cross-Validation
      - text: Hold-Out Validation
        correct: true
      - text: Leave one out Validation
    explanation: |
      Splitting the data once into a training part and a held-out test part, as `train_test_split`
      does, is hold-out validation [^1][^2]. Cross-validation instead rotates through several splits:
      k-fold trains on $k-1$ folds and tests on the remaining one, $k$ times over. Leave-one-out is
      the extreme case of k-fold with one sample per fold [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md#the-diabetes-dataset
        locator: 'Lesson: Introduction to Regression, The diabetes dataset (step 3: train_test_split)'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/cross_validation.html
        locator: Sec. 3.1 Cross-validation (introduction) and Sec. 3.1.2.1.1 K-fold
        quote: to hold out part of the available data as a test set X_test, y_test.
    source:
      id: ms-ml-for-beginners
      ref: quiz-10/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ml-basics-005
    type: single
    difficulty: easy
    question: Which of these ML techniques is used to predict continuous values?
    options:
      - text: Clustering
      - text: Classification
      - text: Regression
        correct: true
    explanation: |
      Regression is the supervised technique for predicting continuous values [^1][^2].
      Classification predicts one of a set of discrete categories, and clustering groups unlabeled
      data without predicting any target [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md
        locator: 'Lesson: Time Series SVR, Introduction (SVR in the context of time series)'
