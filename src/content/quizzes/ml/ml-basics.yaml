  - id: ml-basics-014
    type: single
    difficulty: medium
    question: 'Adding more basis functions in a linear model, pick the most probable option:'
    options:
      - text: Decreases model bias
        correct: true
      - text: Decreases estimation bias
      - text: Decreases variance
      - text: Doesn’t affect bias and variance
    explanation: |
      Adding basis functions, such as higher polynomial terms, enlarges the family of functions the
      linear model can represent [^1]. A richer family can get closer to the true function, so the
      bias that comes from the model family's limited expressivity goes down [^2]. That bias is a
      property of the model family, not of estimating from limited data [^2]. The usual price is
      higher variance, because more parameters have to be fitted to a finite sample, so "decreases
      variance" and "no effect" are wrong [^2].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/linear_model.html#polynomial-regression-extending-linear-models-with-basis-functions
        locator: 'Sec. 1.1.16 Polynomial regression: extending linear models with basis functions'
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1 Bias-variance tradeoff and Sec. 8.1.1 A mathematical decomposition
    source:
      id: mmlu-redux
      ref: machine_learning/88
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=88
    status: draft
  - id: ml-basics-015
    type: single
    difficulty: medium
    question: Another term for out-of-distribution detection is?
    options:
      - text: anomaly detection
        correct: true
      - text: one-class detection
      - text: train-test mismatch robustness
      - text: background detection
    explanation: |
      Out-of-distribution detection asks whether a test input is unlike the training data, that is,
      whether it is anomalous. Much of the deep-learning literature uses the two names
      interchangeably: Hendrycks et al. call their method deep anomaly detection, train anomaly
      detectors, and evaluate them as OOD detectors [^1]. Surveys treat anomaly detection, novelty
      detection, open-set recognition and OOD detection as closely related sub-tasks of one broader
      problem [^2]. One-class classification is a technique you might use for the task rather than
      another name for it. Train-test mismatch robustness means performing well despite a shift, not
      detecting it.
    references:
      - title: 'Hendrycks, Mazeika, Dietterich (2019): Deep Anomaly Detection with Outlier Exposure'
        url: https://arxiv.org/abs/1812.04606
        locator: Abstract, Sec. 1 Introduction and Sec. 4.1
      - title: 'Yang, Zhou, Li, Liu (2021): Generalized Out-of-Distribution Detection: A Survey'
        url: https://arxiv.org/abs/2110.11334
        locator: Abstract
    source:
      id: mmlu-redux
      ref: machine_learning/90
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=90
    status: draft
  - id: ml-basics-016
    type: single
    difficulty: medium
    question: Suppose your model is overfitting. Which of the following is NOT a valid way to try and reduce the overfitting?
    options:
      - text: Increase the amount of training data.
      - text: Improve the optimisation algorithm.
        correct: true
      - text: Decrease the model complexity.
      - text: Reduce the noise in the training data.
    explanation: |
      Overfitting comes from a training set that does not represent new data well, from a model that
      is too complex, or both [^1]. More training data, a simpler model, and less noise in the training
      data each attack one of those causes [^1][^2][^3]. A better optimizer only drives the training
      error lower. It does not limit what the model can memorize, so if anything it helps the model
      fit the noise more closely.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#what_causes_overfitting
        locator: Overfitting, What causes overfitting?
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#dataset-size
        locator: Sec. 3.6.2.2 Dataset Size
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1 Bias-variance tradeoff (variance from fitting noise-induced spurious patterns)
    source:
      id: mmlu-redux
      ref: machine_learning/91
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=91
    status: draft
  - id: ml-basics-017
    type: single
    difficulty: easy
    shuffle: false
    question: 'As the number of training examples goes to infinity, your model trained on that data will have:'
    options:
      - text: Lower variance
        correct: true
      - text: Higher variance
      - text: Same variance
      - text: None of the above
    explanation: |
      Variance measures how much the learned model changes from one training sample to another, and
      it usually shrinks as the training set grows [^1]. With more data, the model is less likely to
      latch onto chance patterns of one particular sample, and generalization improves [^2]. Bias,
      which comes from the model family itself, does not go away with more data [^1].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1.1 A mathematical decomposition (for regression)
        quote: It often decreases as the size of the dataset increases.
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#dataset-size
        locator: Sec. 3.6.2.2 Dataset Size
    source:
      id: mmlu-redux
      ref: machine_learning/96
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=96
