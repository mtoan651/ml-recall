  - id: ml-basics-105
    type: single
    difficulty: easy
    question: What distinguishes a supervised approach from an unsupervised approach?
    options:
      - text: A supervised approach is given data that contains the correct answer.
        correct: true
      - text: A supervised approach typically uses clustering.
        why: An unsupervised approach uses clustering.
      - text: An unsupervised approach knows how to label clusters of data.
        why: An unsupervised approach doesn't know what the clusters of data mean. Based on your understanding of the data, it's up to you to define them.
    explanation: A supervised approach is given data that contains the correct answer. The model's job is to find connections in the data that produce the correct answer. An unsupervised approach is given data without the correct answer. Its job is to find groupings in the data. [^1]
