  - id: ml-basics-127
    type: multiple
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - self-supervised-learning
      - learning-paradigms
    question: |
      In which of these setups is the model trained self-supervised, with targets produced
      automatically from unlabeled data? Select all that apply.
    options:
      - text: Parts of each unlabeled photo are hidden, and the model learns to fill them back in
        correct: true
      - text: The model sees the first frames of unlabeled video clips and learns to predict the next frame
        correct: true
      - text: Customers are grouped into segments by how similar their purchase histories are
        why: This is clustering, an unsupervised method; it looks for structure in the data but has no target to predict.
      - text: A robot arm learns to grasp objects from a reward it receives after each successful attempt
        why: The learning signal is a reward for actions taken, which makes this reinforcement learning.
    explanation: |
      The paradigms differ in where the learning signal comes from [^1]. Self-supervised learning
      hides part of each unlabeled example — masked words, an occluded image region — or holds back
      what comes next, such as the next token, and trains the model to predict it, so the data
      supply their own targets [^1][^2][^3]. Clustering and other unsupervised methods have no targets at all, and reinforcement
      learning learns from rewards for actions. Representations learned with self-supervision are
      often reused for downstream tasks.
    references:
