    reviewed_by: claude
  - id: ml-basics-016
    type: single
    difficulty: medium
    question: Suppose your model is overfitting. Which of the following is NOT a valid way to try and reduce the overfitting?
    options:
      - text: Increase the amount of training data.
        why: 'This is a valid remedy: with more data, chance patterns of one small sample matter less, so the model generalizes better.'
      - text: Improve the optimisation algorithm.
        correct: true
      - text: Decrease the model complexity.
        why: 'This is a valid remedy: a simpler model has less capacity to fit noise, and too much complexity is a main cause of overfitting.'
      - text: Reduce the noise in the training data.
        why: 'This is a valid remedy: an overfit model memorizes the noise in its training data, so less noise leaves less to memorize.'
    explanation: |
      Overfitting comes from a training set that does not represent new data well, from a model that
      is too complex, or both [^1]. More training data, a simpler model, and less noise in the training
      data each attack one of those causes [^1][^2][^3]. A better optimizer only drives the training
      error lower. It does not limit what the model can memorize, so if anything it helps the model
      fit the noise more closely.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#what_causes_overfitting
        locator: Overfitting, What causes overfitting?
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#dataset-size
        locator: Sec. 3.6.2.2 Dataset Size
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1 Bias-variance tradeoff (variance from fitting noise-induced spurious patterns)
    source:
      id: mmlu-redux
      ref: machine_learning/91
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=91
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-017
    type: single
    difficulty: easy
    shuffle: false
    question: 'As the number of training examples goes to infinity, your model trained on that data will have:'
    options:
      - text: Lower variance
        correct: true
      - text: Higher variance
        why: More data makes the fitted model depend less on the quirks of one particular sample, so the variance goes down, not up.
      - text: Same variance
        why: Variance depends on the training-set size; each extra example averages out more of the sampling noise, so it shrinks.
      - text: None of the above
        why: One of the options is right, since the variance decreases as the training set grows.
    explanation: |
      Variance measures how much the learned model changes from one training sample to another, and
      it usually shrinks as the training set grows [^1]. With more data, the model is less likely to
      latch onto chance patterns of one particular sample, and generalization improves [^2]. Bias,
      which comes from the model family itself, does not go away with more data [^1].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1.1 A mathematical decomposition (for regression)
        quote: It often decreases as the size of the dataset increases.
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#dataset-size
        locator: Sec. 3.6.2.2 Dataset Size
    source:
      id: mmlu-redux
      ref: machine_learning/96
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=96
