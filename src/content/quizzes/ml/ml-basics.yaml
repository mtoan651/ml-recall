    question: Which assignment of roles to the three data subsets is correct?
    options:
      - text: 'training: final evaluation · validation: fitting parameters · test: choosing settings'
      - text: 'training: choosing settings · validation: final evaluation · test: fitting parameters'
      - text: 'training: fitting parameters · validation: choosing settings · test: final evaluation'
        correct: true
      - text: 'training: fitting parameters · validation: final evaluation · test: choosing settings'
        why: Using the test set to make choices leaks it into development, so it no longer gives an unbiased estimate.
    explanation: Weights are fitted on the training set, architectures, hyperparameters and stopping points are compared on the validation set, and the test set is kept untouched for the final reported performance [^1][^2].
