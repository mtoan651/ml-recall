  - id: ml-basics-139
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l01
      - regression
    question: Which of these model outputs makes the task regression rather than classification?
    options:
      - text: A newborn's weight in kilograms, from ultrasound scans
        correct: true
      - text: The digit 0–9 written in a scanned image of handwriting
        why: The digits are numbers, but here they serve as 10 category labels, so this is classification.
      - text: Whether a skin lesion in a photo is benign or malignant
        why: There are two categories, so this is binary classification.
      - text: Which of five predefined customer segments a new buyer belongs to
        why: The output is one of a fixed set of categories.
    explanation: |
      Regression predicts a numerical quantity that can take any value in a range; classification picks
      one of a fixed set of categories — even when the categories are written as numbers, like digit
      labels [^1][^2]. A birth weight such as 3.27 kg is continuous, so estimating it is regression.
    references:
