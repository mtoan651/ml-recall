  - id: ml-basics-018
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - classification
    question: A filter decides for every incoming email whether it is spam or not spam. Which learning task is this?
    options:
      - text: Classification
        correct: true
      - text: Regression
        why: Regression outputs a continuous number, not a category.
      - text: Clustering
        why: Clustering groups unlabeled data; here the two categories are fixed in advance.
      - text: Dimensionality reduction
        why: It compresses features; it does not assign a label.
    explanation: The output is one of two discrete categories, so this is (binary) classification [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 17
      - source: d2l
        locator: Sec. 1.3.1 Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q03
    status: reviewed
  - id: ml-basics-019
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - regression
      - supervised-learning
    question: A model is trained on apartment features paired with their actual monthly rents, then estimates the rent of an apartment it has never seen. What kind of problem is this?
    options:
      - text: Supervised classification
        why: Rent is a number, not a category.
      - text: Unsupervised clustering
        why: The rents are known targets, and there are no groups to discover.
      - text: Supervised regression
        correct: true
      - text: Reinforcement learning
        why: No agent acts in an environment and collects rewards.
    explanation: Training pairs inputs with known targets, so the learning is supervised; the target is a continuous quantity, so the task is regression [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 17
      - source: d2l
        locator: Sec. 1.3.1 Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q04
    status: reviewed
  - id: ml-basics-020
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - supervised-learning
    question: A model estimates how long a trip will take from its distance. In one training example, what is the target $y$?
    options:
      - text: The distance of the trip
        why: Distance is the input feature $x$.
      - text: The travel time that was actually measured
        correct: true
      - text: The number of training epochs
        why: That is a training setting, not part of an example.
      - text: The learning rate
        why: That is a hyperparameter of the optimizer.
    explanation: 'Each row of the data is one example: the input feature $x$ is the distance, and the target $y$ is the observed value we want to predict — the measured travel time [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 15
      - source: d2l
        locator: Sec. 3.1 Linear Regression
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q05
    status: reviewed
  - id: ml-basics-021
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-ex03
      - clustering
      - unsupervised-learning
    question: An algorithm sorts customers into groups with similar buying behaviour without ever being told which group anyone belongs to. Which learning paradigm is this?
    options:
      - text: Supervised learning
        why: Supervised learning needs labeled targets.
      - text: Reinforcement learning
        why: There are no actions or rewards.
      - text: Self-supervised next-token prediction
        why: That predicts the next element of a sequence, not groups.
      - text: Unsupervised learning
        correct: true
    explanation: Without labels the algorithm has to discover structure in the data by itself; clustering is the classic unsupervised task [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 21–23
      - source: d2l
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q06
    status: reviewed
  - id: ml-basics-022
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - self-supervised-learning
    question: A language model reads “The bus stops at the” and is trained to predict the word that actually follows in the original text. Which paradigm does this illustrate?
    options:
      - text: Self-supervised learning
        correct: true
      - text: Supervised learning with labels written by human annotators
        why: The target is taken from the text itself; nobody labels it.
      - text: Reinforcement learning
        why: There is no reward signal from an environment.
      - text: Clustering
        why: Nothing is being grouped.
    explanation: 'The training signal is cut out of the raw data: the preceding words form the input and the next observed word is the target [^1]. Using part of unlabeled data to supervise another part is self-supervised learning [^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 22, 25
      - source: d2l
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q07
    status: reviewed
  - id: ml-basics-023
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - data-splits
    question: Which assignment of roles to the three data subsets is correct?
    options:
      - text: 'training: final evaluation · validation: fitting parameters · test: choosing settings'
      - text: 'training: choosing settings · validation: final evaluation · test: fitting parameters'
      - text: 'training: fitting parameters · validation: choosing settings · test: final evaluation'
        correct: true
      - text: 'training: fitting parameters · validation: final evaluation · test: choosing settings'
        why: Using the test set to make choices leaks it into development, so it no longer gives an unbiased estimate.
    explanation: Weights are fitted on the training set, architectures, hyperparameters and stopping points are compared on the validation set, and the test set is kept untouched for the final reported performance [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 79
      - source: d2l
        locator: Sec. 3.6 Generalization
        url: https://d2l.ai/chapter_linear-regression/generalization.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q17
    status: reviewed
  - id: ml-basics-024
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - overfitting
    question: After a few epochs, training accuracy keeps rising while validation accuracy starts to drop. What is the most likely explanation?
    options:
      - text: Overfitting
        correct: true
      - text: Generalization is improving
        why: Falling validation accuracy means generalization is getting worse.
      - text: The number of target classes has increased
        why: The label set does not change during training.
      - text: The task has changed from classification to regression
        why: Training does not change the type of task.
    explanation: 'A growing gap between training and validation performance is the signature of overfitting: the model keeps fitting training-specific details that do not transfer [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 82–83
      - source: d2l
        locator: Sec. 3.6 Generalization
        url: https://d2l.ai/chapter_linear-regression/generalization.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q18
    status: reviewed
  - id: ml-basics-025
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - regression
    question: Which task fits a model whose output is a continuous number, such as a price or a temperature?
    options:
      - text: Classification
        why: Classification predicts discrete categories.
      - text: Image recognition
        why: Usually a classification of images.
      - text: Clustering
        why: Clustering groups unlabeled data; it does not predict target values.
      - text: Regression
        correct: true
    explanation: Predicting a continuous numerical value is regression [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 17
      - source: d2l
        locator: Sec. 1.3.1 Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q01
    status: reviewed
  - id: ml-basics-026
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - overfitting
    question: Which situation describes overfitting?
    options:
      - text: The model does well on the training set but clearly worse on validation or test data.
        correct: true
      - text: The model does far worse on the training set than on the validation set.
        why: This is unusual and is not overfitting.
      - text: The model does poorly on both the training and the validation set.
        why: That is underfitting.
      - text: The model does well on both the training and the validation set.
        why: That is a model that generalizes.
    explanation: An overfitted model reaches a small training error but a large error on unseen data — a large generalization gap [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 82
      - source: d2l
        locator: Sec. 3.6 Generalization
        url: https://d2l.ai/chapter_linear-regression/generalization.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q02
    status: reviewed
