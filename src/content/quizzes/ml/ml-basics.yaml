  - id: ml-basics-138
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - underfitting
    question: |
      After 50 epochs, a model's training loss and validation loss are both still high and almost equal.
      What is the most likely explanation?
    options:
      - text: Underfitting
        correct: true
      - text: Overfitting
        why: Overfitting shows a low training loss with a much higher validation loss.
      - text: Leakage of validation data into training
        why: Leakage makes validation results look too good, not as poor as the training results.
      - text: A validation set that is too small
        why: A small validation set makes its estimate noisy, but it does not explain the high training loss.
    explanation: |
      High error on both sets with little gap between them means the model does not even capture the
      pattern in the training data — underfitting, for example from too little capacity or poor
      optimization [^1][^2]. Overfitting looks the other way round: a low training loss and a large gap.
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 18; Lecture 1, slides 82–83
      - source: d2l
