  - id: ml-basics-085
    type: single
    difficulty: medium
    tags:
      - optimization-bias
      - validation
      - hyperparameter-optimization
    question: |
      If you fill in a 10-question multiple-choice test (four options per question) at random, your
      expected grade is 25%. If you fill in two tests at random and submit only the better one, the
      expected grade rises to about 33%, and it keeps rising the more random tests you pick the best
      from. In machine learning, what is this effect an example of?
    options:
      - text: Optimization bias
        correct: true
      - text: The fundamental trade-off
        why: The fundamental trade-off links model complexity to training error and the train–validation gap; here no model gets more complex [^1].
      - text: Violating the golden rule
        why: The golden rule says test data must not influence training. The inflated best-of-many score is the optimization bias that keeping the test set out of the loop protects against [^1].
      - text: Training a regression model
        why: Nothing is learned here; the score improves only because the best of many random attempts is picked.
    explanation: |
      When you pick the best of many tries on the same questions, the winner's score is inflated by
      luck: best of 2 gives about 33%, best of 10 about 47%, best of 100 about 62%, yet on new
      questions random answers still score 25% [^1]. Hyperparameter search does the same when it
      hits one validation set many times, so the best validation score is overly optimistic. The
      bias grows with the number of things tried and shrinks with more validation examples, which
      is why a separate test set, used once, is needed [^1]. (The course credits UBC's CPSC 340 for
      this example.)
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Optimization bias/Overfitting of the validation set (Example 1 and 2)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/final_prep.pdf#q6
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-086
    type: single
    difficulty: medium
    tags:
      - shap
      - interpretability
      - feature-importance
    question: Which statement about SHAP values is true?
    options:
      - text: They give additive, local explanations of individual predictions
        correct: true
      - text: They show global importance but cannot explain a single prediction
        why: SHAP gives one value per feature *per example*, so it explains individual predictions; global summaries are built from these [^1].
      - text: They score a feature by removing it once and refitting the model
        why: A Shapley value averages a feature's contribution over many combinations of the other features; it does not drop one feature and refit [^2].
      - text: They can only be computed for linear models
        why: SHAP is model-agnostic; the course applies it to a LightGBM model, and there are fast variants for tree ensembles [^1].
    explanation: |
      SHAP (SHapley Additive exPlanations) assigns each feature of each example a value that says
      how much the feature pushed this prediction above or below the average prediction $E[f(x)]$ [^1].
      The values are *additive*: starting from $E[f(x)]$ and adding the SHAP values of all features
      gives the model output $f(x)$ for that example, which is what a waterfall plot shows [^1][^2].
      They come from Shapley values in game theory, which share a payout fairly among players by
      averaging each player's marginal contribution over coalitions [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 12: Feature importances and model transparency — SHAP (SHapley Additive exPlanations) introduction; SHAP plots'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/12_feat-importances.ipynb
      - title: Lundberg & Lee (2017), A Unified Approach to Interpreting Model Predictions
        locator: Sec. 2 Additive Feature Attribution Methods; Sec. 3 SHAP values
        url: https://arxiv.org/abs/1705.07874
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/final_prep.pdf#q10
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-087
    type: single
    difficulty: medium
    tags:
      - recommender-systems
      - content-based-filtering
    question: Which statement about content-based filtering in recommender systems is NOT true?
    options:
      - text: It can predict a user's rating of a new item that nobody has rated yet
        why: This is true. Content-based filtering predicts from item features, so a new item with known features can be scored immediately [^1].
      - text: It is not transparent, so you cannot say why an item was recommended
        correct: true
      - text: It needs more investment in acquiring and engineering item features
        why: This is true. Feature acquisition and engineering are its main disadvantage [^1].
      - text: It treats rating prediction as a supervised learning problem
        why: This is true. It fits one regression model per user, with item features as $X$ and the user's ratings as $y$ [^2].
    explanation: |
      Content-based filtering builds a profile for each user by regressing that user's ratings on
      the features of the items they rated, so it is a supervised approach [^2]. Because it scores
      items by their features, it can recommend brand-new items, but it requires good item features,
      which can be expensive to collect [^1]. With linear models its recommendations are quite
      interpretable: the learned weights tell you which item features the user likes, so you can
      explain why an item was recommended [^1]. The "not transparent" statement is the false one.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Miscellaneous comments on content-based filtering (advantages and disadvantages)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
