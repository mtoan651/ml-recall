  - id: ml-basics-106
    type: single
    difficulty: hard
    shuffle: false
    question: |
      Which of the following statements are true concerning information criteria?

      (i) Adjusted $R^2$, like an information criterion, trades off goodness of fit against the number of parameters

      (ii) If the residual sum of squares falls when an additional term is added, the value of the information criterion will fall

      (iii) With $T \ge 8$ observations, Akaike's information criterion always leads to model orders that are at least as large as those of Schwarz's information criterion

      (iv) Akaike's information criterion is consistent
    options:
      - text: (ii) and (iv) only
        why: Both of these are false; the penalty can outweigh a small fall in RSS, and AIC is not consistent. The true statements are (i) and (iii).
      - text: (i) and (iii) only
        correct: true
      - text: (i), (ii), and (iii) only
        why: (ii) is false; the criterion adds a penalty per parameter, so a small drop in RSS can still raise it.
      - text: (i), (ii), (iii), and (iv)
        why: (ii) and (iv) are false; the penalty can outweigh a fall in RSS, and only SBIC, not AIC, is consistent.
    explanation: Information criteria add a penalty for every extra parameter to a measure of fit such as $\ln(\text{RSS}/T)$, and adjusted $R^2$ likewise stops rewarding extra regressors (i); so a smaller RSS does not guarantee a lower criterion (ii is false) [^2]. Schwarz's (Bayesian) criterion charges $\ln T$ per parameter against AIC's 2, which is more once $T \ge 8$ ($\ln 8 \approx 2.08$), so SBIC never selects a larger model than AIC (iii) [^3]. SBIC is consistent — it finds the true model as $T \to \infty$ if that model is among the candidates — while AIC is not (iv is false) [^2][^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 71
        url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=71
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/selecting-predictors.html
        locator: Sec. 7.5 Selecting predictors (Adjusted R², AIC, BIC)
      - title: 'Wikipedia: Akaike information criterion'
        url: https://en.wikipedia.org/wiki/Akaike_information_criterion#Comparison_with_BIC
        locator: Comparison with BIC
    source:
      id: mmlu-redux
      ref: econometrics/71
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=71
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-107
    type: multiple
    difficulty: medium
    tags:
      - recommender-systems
      - collaborative-filtering
      - cold-start
    question: |
      Collaborative filtering fills in a ratings matrix by learning user and item factors from the
      observed ratings, $\hat{y}_{ij} = z_i \cdot w_j$. Which statements are true? Select all that
      apply.
    options:
      - text: It recommends items based on the preferences of similar users or items
        correct: true
      - text: Unlike PCA, its loss only sums over the available ratings (plus regularization terms)
        correct: true
      - text: With ratings from 0 to 5, it can predict a rating outside that range
        correct: true
      - text: It needs item features, such as a movie's genre, to fill in the matrix
        why: Collaborative filtering only uses the user–item interactions in the ratings matrix; models that use item features are content-based [^1].
      - text: It can struggle when a new user with no ratings shows up
        correct: true
    explanation: |
      Collaborative filtering runs a PCA-like factorization of the utility matrix, but the loss is
      computed only on the observed ratings, with regularization on $Z$ and $W$ [^1]. A prediction
      is the dot product of a user's and an item's latent vectors, which nothing forces into the
      0–5 range [^1]. A user or item with no ratings has no data to learn its latent vector from,
      the cold-start problem [^1].
    references:
      - source: ubc-dsci563
        locator: Lecture 7 notes, Sec. 4 Collaborative filtering (4.1 Intuition, 4.2 Toy example, 4.4 Loss function)
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/07_recommender-systems1.ipynb
    source:
      id: ubc-dsci563
      ref: lectures/notes/07_recommender-systems1.ipynb#ex7.2
      url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/07_recommender-systems1.ipynb
