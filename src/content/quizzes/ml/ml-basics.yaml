  - id: ml-basics-123
    type: short_answer
    difficulty: easy
    tags:
      - shap
      - additivity
    question: |
      A model's base value (its prediction for the baseline feature values) is 0.4979, and for one
      soccer team it predicts 0.70. Three of the team's features have SHAP values +0.25 (goals
      scored), −0.08 (ball possession) and +0.05 (distance covered); every other feature has a SHAP
      value of 0 except `Fouls Committed`. What is the SHAP value of `Fouls Committed`? Round to 4
      decimals.
    answer:
      numeric: -0.0179
      tolerance: 0.0002
      hint: a number, 4 decimals (may be negative)
      model: $0.70 - 0.4979 - (0.25 - 0.08 + 0.05) = -0.0179$
    explanation: |
      SHAP values are additive: the SHAP values of all features sum to the prediction minus the
      prediction for the baseline values [^1]. Here they must sum to $0.70 - 0.4979 = 0.2021$, and the
      three known values sum to $0.22$, leaving $-0.0179$ for the fouls. In a force plot, the pink bars
      (pushing the prediction up) minus the blue bars (pushing it down) equal the distance from the
      base value to the output [^1].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 4 SHAP Values — tutorial, How They Work
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_explainability/raw/tut4_shap_basic.ipynb
