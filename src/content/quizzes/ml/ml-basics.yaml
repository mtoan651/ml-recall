  - id: ml-basics-097
    type: single
    difficulty: easy
    question: What attributes of a dataset would be ideal to use for ML?
    options:
      - text: Large size / High diversity
        correct: true
      - text: Large size / Low diversity
        why: Machine learning models are only as good as the examples used to train them. A model will produce poorer predictions on novel data that it never trained on.
      - text: Small size / High diversity
        why: Most models can't find reliable patterns in a small dataset. The predictions will lack the confidence a larger dataset provides.
      - text: Small size / Low diversity
        why: If your dataset is small and without much variation, you may not benefit from machine learning.
    explanation: A large number of examples that cover a variety of use cases is essential for a machine learning system to understand the underlying patterns in the data. A model trained on this type of dataset is more likely to make good predictions on new data. [^1]
    references:
