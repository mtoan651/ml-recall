        why: Supervised learning needs labeled targets.
      - text: Reinforcement learning
        why: There are no actions or rewards.
      - text: Self-supervised next-token prediction
        why: That predicts the next element of a sequence, not groups.
      - text: Unsupervised learning
        correct: true
    explanation: Without labels the algorithm has to discover structure in the data by itself; clustering is the classic unsupervised task [^1][^2].
