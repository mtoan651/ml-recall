  - id: ml-basics-119
    type: true_false
    difficulty: medium
    tags:
      - partial-dependence
      - permutation-importance
    question: |
      True or false: if the partial dependence plot of `feat_a` is much steeper than that of `feat_b`,
      then `feat_a` must have the higher permutation importance.
    options:
      - text: 'True'
        why: The PDP shows the effect of changing a feature's value; permutation importance also depends on how often the feature's value actually varies in the data [^1].
      - text: 'False'
        correct: true
    explanation: |
      Suppose `feat_a` has a big effect when it varies, but has a single value in 99% of the rows.
      Shuffling it then leaves most rows unchanged, so the loss hardly suffers and the permutation
      importance is low, despite the steep partial dependence plot [^1]. Permutation importance
      measures the drop in performance when a column is shuffled in the validation data [^2], while a
      partial dependence plot traces the average prediction as one feature is varied over its range,
      regardless of how rare those values are [^3].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 3 exercise, Question 5 (solution)
