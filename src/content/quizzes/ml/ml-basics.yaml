  - id: ml-basics-020
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - supervised-learning
    question: A model estimates how long a trip will take from its distance. In one training example, what is the target $y$?
    options:
      - text: The distance of the trip
        why: Distance is the input feature $x$.
      - text: The travel time that was actually measured
        correct: true
      - text: The number of training epochs
        why: That is a training setting, not part of an example.
      - text: The learning rate
        why: That is a hyperparameter of the optimizer.
    explanation: 'Each row of the data is one example: the input feature $x$ is the distance, and the target $y$ is the observed value we want to predict — the measured travel time [^1][^2].'
    references:
