  - id: ml-basics-099
    type: single
    difficulty: easy
    question: |
      A website logs how each visitor browses (pages viewed, time on site, purchases), but no
      column says what kind of user each visitor is. To discover the types of users that visit
      the site, would you use supervised or unsupervised learning?
    options:
      - text: Unsupervised learning.
        correct: true
      - text: Supervised learning, because I'm trying to predict which class a user belongs to.
        why: In supervised learning, the dataset must contain the label you're trying to predict. Here no column gives a category of user.
      - text: Reinforcement learning, because users interact with the site.
        why: Reinforcement learning learns a policy from rewards for actions; here we only want to find groups in recorded data.
    explanation: Because we want the model to cluster groups of related customers, we'd use unsupervised learning. After the model clustered the users, we'd create our own names for each cluster, for example, "discount seekers," "deal hunters," "surfers," "loyal," and "wanderers." [^1]
