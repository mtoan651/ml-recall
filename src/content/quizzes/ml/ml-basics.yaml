  - id: ml-basics-109
    type: multiple
    difficulty: easy
    tags:
      - when-to-use-ml
      - rule-based-systems
    question: |
      A consulting team sorts incoming requests by whether machine learning is the right tool. Which
      of these problems suit machine learning? Select all that apply.
    options:
      - text: Recognizing objects in photos, for example to group images by their content
        correct: true
      - text: Fixing common technical faults where the diagnostic steps can be written down in advance
        why: When the procedure is known and stable, a hand-written rule-based program is simpler and more reliable than learning it from data [^1].
      - text: Checking eligibility for a public service against strict, published criteria
        why: The criteria are explicit rules; encoding them directly is transparent and exact, so there is nothing to learn [^1].
      - text: Flagging unusual patterns that may indicate fraudulent bank transactions
        correct: true
      - text: Finding tumours or fractures in MRI, CT or X-ray images
        correct: true
    explanation: |
      Traditional programming writes the rules by hand; machine learning collects many labelled
      examples and lets the algorithm find the rules, which pays off when the rules are hard to
      articulate [^1]. Images, fraud patterns and scans have no simple explicit rules but plenty of
      examples, so they suit ML; procedures and eligibility criteria that are already written down
      suit rule-based systems [^2].
    references:
      - source: ubc-dsci571
        locator: Lecture 0 notes, Why machine learning (ML)? — Saving time and scaling products
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/00_motivation-course-information.ipynb
