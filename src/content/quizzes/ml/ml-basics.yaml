  - id: ml-basics-118
    type: single
    difficulty: medium
    tags:
      - permutation-importance
      - interpretation
    question: |
      In a taxi-fare model, the absolute change in latitude has a clearly higher permutation importance
      than the absolute change in longitude. What can you conclude from this alone?
    options:
      - text: Only that the model relies more on it; latitude changes may just be larger
        correct: true
      - text: That travelling a fixed distance north–south costs more than the same distance east–west
        why: Permutation importance does not give the effect per unit of a feature; a larger spread of latitude changes alone could explain the result [^1].
      - text: That longitude change has no effect on the fare in this model
        why: A lower importance is still an importance; it only ranks below latitude change [^2].
      - text: That the model is biased and should be retrained without the latitude feature
        why: High importance for a sensible feature is not a sign of bias; trip distance is the main driver of fares [^1].
    explanation: |
      Permutation importance tells you how much a model depends on a feature, not how the feature
      affects predictions [^2]. The latitude features may be more important because latitudinal
      distances in the data tend to be larger, because a fixed latitudinal distance costs more, or
      both; the importances cannot tell these apart [^1]. To see the effect of travelling a given
      distance, you need tools such as partial dependence plots [^3].
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 2 exercise, Question 6 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_explainability/ex2.py
