  - id: ml-basics-132
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - classification
    question: |
      A bank's model gives every card transaction a score between 0 and 1, and transactions scoring at
      least 0.5 are blocked as fraud. Which learning task does the model solve?
    options:
      - text: Classification
        correct: true
      - text: Regression, because the output is a number between 0 and 1
        why: The score is the estimated probability of a class; the output the bank needs is one of two categories.
      - text: Clustering, because the transactions end up in two groups
        why: The two groups (fraud, legitimate) are fixed in advance and learned from labeled examples, not discovered.
      - text: Dimensionality reduction, because each transaction is reduced to one number
        why: The score is not a compressed description of the transaction; it estimates how likely the fraud class is.
    explanation: |
      The task is set by the output the application needs: here one of two predefined categories, fraud
      or legitimate, so it is binary classification [^1]. Classifiers commonly output a probability for
      each class [^2], and a threshold turns that probability into the class decision [^1].
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 3; Lecture 1, slides 17, 65
