  - id: ml-basics-121
    type: single
    difficulty: medium
    tags:
      - partial-dependence
      - confounding
    question: |
      In a hospital readmission model, the partial dependence plot of `time_in_hospital` is nearly
      flat, yet the raw readmission rate grouped by `time_in_hospital` rises clearly with longer stays.
      How can both be right?
    options:
      - text: Raw rates mix in other features of long stays; the PDP holds them fixed
        correct: true
      - text: The PDP must be wrong, because it should reproduce the raw readmission rates
        why: A PDP shows the model's prediction as one feature changes with the others held at their observed values, which is not a raw group average [^1].
      - text: The raw rates come from training data, so they are overfit and can be ignored
        why: A group average is a plain description of the data, not a fitted model; it is not overfit [^2].
      - text: The model ignores numeric features, so their PDPs are always flat
        why: Tree models use numeric features all the time; a flat PDP means the model attributes little effect to this one [^1].
    explanation: |
      A partial dependence plot repeatedly changes one feature's value in real rows and averages the
      model's predictions, which answers "controlling for all other features, what is the effect of
      this one?" [^1]. The exercise compares it with a raw `groupby` average of readmissions per
      `time_in_hospital` and finds the two very different: the model gives time in hospital a much
      smaller effect [^2]. Patients with long stays differ in other ways too, such as diagnoses or the
      number of procedures, and the raw rate mixes those effects in.
    references:
      - source: kaggle-learn
        locator: Machine Learning Explainability, Lesson 3 Partial Plots — tutorial, Partial Dependence Plots; How it Works
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/ml_explainability/raw/tut3_partial_plots.ipynb
