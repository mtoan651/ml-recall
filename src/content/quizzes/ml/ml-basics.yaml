    explanation: |
      What separates the paradigms is the learning signal: unsupervised learning gets no targets and
      must discover structure, such as groups of similar customers, from the inputs alone [^1][^2]. Here
      every record comes with its observed outcome, which the model learns to predict — supervised
      classification. Grouping the same customers without the outcome column would be unsupervised.
