  - id: ml-basics-009
    type: single
    difficulty: easy
    question: Given a large dataset of medical records from patients suffering from heart disease, try to learn whether there might be different clusters of such patients for which we might tailor separate treatments. What kind of learning problem is this?
    options:
      - text: Supervised learning
      - text: Unsupervised learning
        correct: true
      - text: Both supervised and unsupervised learning
      - text: Neither supervised nor unsupervised learning
    explanation: |
      The records carry no labels, and the goal is to discover groups of similar patients. Finding
      groups in unlabeled data is clustering, a core unsupervised learning task [^1][^2]. Supervised
      learning would need a known target for every record, such as an outcome to predict [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#unsupervised-and-self-supervised-learning
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning (and 1.3.1 Supervised Learning)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/unsupervised_learning.html
        locator: Ch. 2 Unsupervised learning (2.3 Clustering)
