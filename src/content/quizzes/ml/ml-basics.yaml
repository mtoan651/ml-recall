        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#prediction
        locator: 'Lesson: Techniques of Machine Learning, secs. Split your dataset, Train a model and Prediction'
