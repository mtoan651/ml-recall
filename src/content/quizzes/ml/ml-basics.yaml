    status: reviewed
  - id: ml-basics-024
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - overfitting
    question: After a few epochs, training accuracy keeps rising while validation accuracy starts to drop. What is the most likely explanation?
    options:
      - text: Overfitting
        correct: true
      - text: Generalization is improving
        why: Falling validation accuracy means generalization is getting worse.
      - text: The number of target classes has increased
        why: The label set does not change during training.
      - text: The task has changed from classification to regression
        why: Training does not change the type of task.
    explanation: 'A growing gap between training and validation performance is the signature of overfitting: the model keeps fitting training-specific details that do not transfer [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 82–83
      - source: d2l
        locator: Sec. 3.6 Generalization
        url: https://d2l.ai/chapter_linear-regression/generalization.html
