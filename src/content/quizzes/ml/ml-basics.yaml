      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/02_ml-fundamentals.ipynb
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-113
    type: single
    difficulty: easy
    tags:
      - underfitting
      - model-complexity
    question: Both the training and the validation error of your model are high and close to each other. What is most likely to help?
    options:
      - text: Use a more complex model
        correct: true
      - text: Add noise to the training inputs
        why: Training with input noise acts as a regularizer, making the fitted function smoother, which worsens underfitting [^2].
      - text: Increase the regularization strength
        why: Stronger regularization restricts the model further, while an underfitting model needs more capacity [^3].
      - text: Train on less of the data
        why: Less data does not give a too-simple model more capacity; its training error stays high [^1].
    explanation: |
      High and similar training and validation errors mean the model is too simple to capture the
      useful patterns, which is underfitting [^1]. Moving along the fundamental trade-off towards
      more complex models (deeper trees, more features, weaker regularization) lowers the training
      error, at the risk of overfitting if you go too far [^1][^3].
    references:
      - source: ubc-dsci571
        locator: Lecture 2 notes, Underfitting; The fundamental tradeoff of supervised learning
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/02_ml-fundamentals.ipynb
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction, Bishop 1995)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
    source:
