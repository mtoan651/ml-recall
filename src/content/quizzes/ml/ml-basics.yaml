  - id: ml-basics-011
    type: single
    difficulty: medium
    question: You are training a linear regression model for a simple estimation task, and notice that the model is overfitting to the data. You decide to add in $\ell_2$ regularization to penalize the weights. As you increase the $\ell_2$ regularization coefficient, what will happen to the bias and variance of the model?
    options:
      - text: Bias increase ; Variance increase
      - text: Bias increase ; Variance decrease
        correct: true
      - text: Bias decrease ; Variance increase
      - text: Bias decrease ; Variance decrease
    explanation: |
      A larger $\ell_2$ coefficient restricts the weights more strongly and pushes them toward zero,
      which makes the model simpler [^1][^2]. A simpler model fits the training data less closely, so
      its bias rises. It also reacts less to the particular training sample, so its variance falls
      [^3]. That is how a larger coefficient fights overfitting, and also why too large a coefficient
      leaves the model with a large bias [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/regularization#regularization_rate_lambda
        locator: 'Overfitting: L2 regularization, Regularization rate (lambda)'
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1 Bias-variance tradeoff and Sec. 9.1 Regularization
    source:
      id: mmlu-redux
      ref: machine_learning/63
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=63
    status: draft
  - id: ml-basics-012
    type: single
    difficulty: easy
    question: K-fold cross-validation is
    options:
      - text: linear in K
        correct: true
      - text: quadratic in K
      - text: cubic in K
      - text: exponential in K
    explanation: |
      K-fold cross-validation splits the data into $K$ folds, then trains and evaluates the model $K$
      times, each time holding out a different fold [^1][^2]. The total cost is $K$ times one training
      run on a slightly smaller set, so it grows linearly in $K$. Nothing in the procedure grows
      quadratically, cubically or exponentially with $K$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#cross-validation
        locator: Sec. 3.6.3.1 Cross-Validation
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 9.3 Model selection via cross validation (k-fold cross validation)
    source:
      id: mmlu-redux
      ref: machine_learning/76
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=76
    status: draft
  - id: ml-basics-013
    type: single
    difficulty: easy
    question: Which of the following is NOT supervised learning?
    options:
      - text: PCA
        correct: true
      - text: Decision Tree
      - text: Linear Regression
      - text: Naive Bayesian
    explanation: |
      PCA uses only the inputs. It finds directions that capture most of the variance without looking
      at any labels, so it is an unsupervised dimensionality-reduction method [^1][^2]. Decision trees,
      linear regression and naive Bayes are all trained on labeled examples to predict a target, which
      makes them supervised learners [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#unsupervised-and-self-supervised-learning
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning (subspace estimation / PCA)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/unsupervised_learning.html
        locator: Ch. 2 Unsupervised learning (2.5 Decomposing signals in components, incl. PCA)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/supervised_learning.html
        locator: Ch. 1 Supervised learning (1.1 Linear Models, 1.9 Naive Bayes, 1.10 Decision Trees)
    source:
      id: mmlu-redux
      ref: machine_learning/79
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=79
