  - id: ml-basics-108
    type: short_answer
    difficulty: easy
    tags:
      - recommender-systems
      - utility-matrix
      - baseline
    question: |
      A small utility matrix of ratings has missing entries (—):

      | | Movie 1 | Movie 2 | Movie 3 |
      | --- | --- | --- | --- |
      | User 1 | 5 | — | 3 |
      | User 2 | 4 | 2 | — |
      | User 3 | — | 1 | 2 |

      A baseline predicts a missing rating as the average of the user's mean rating and the item's
      mean rating (each over the observed entries). What rating does it predict for User 1 and
      Movie 2?
    answer:
      numeric: 2.75
      tolerance: 0.001
      hint: a number, 2 decimals
      model: User 1 mean $= (5+3)/2 = 4$, Movie 2 mean $= (2+1)/2 = 1.5$, prediction $= (4 + 1.5)/2 = 2.75$
    explanation: |
      Before trying collaborative filtering, the course compares simple baselines for completing the
      utility matrix: the global average, the per-user average, the per-item average and the average
      of the last two [^1]. Here User 1 rates generously (mean 4) but Movie 2 is poorly rated (mean
      1.5), so the combined baseline predicts 2.75. These baselines give a reference RMSE that a
      real recommender must beat [^1].
    references:
      - source: ubc-dsci563
        locator: Lecture 7 notes, Sec. 3 Baseline Approaches
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/07_recommender-systems1.ipynb
