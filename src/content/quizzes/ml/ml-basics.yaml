    reviewed_by: claude
  - id: ml-basics-098
    type: single
    difficulty: easy
    question: Why does a model need to be trained before it can make predictions?
    options:
      - text: A model needs to be trained to learn the mathematical relationship between the features and the label in a dataset.
        correct: true
      - text: A model doesn't need training; it can predict as soon as its architecture is defined.
        why: An untrained model has arbitrary (random or zero) parameters, so its outputs carry no information about the label.
      - text: Training stores the dataset, so the model can look up the answer for any new example.
        why: Training fits parameters that generalize to new examples; a model that only stores and looks up the training set can't answer for examples it hasn't seen.
    explanation: |
      Training adjusts the model's parameters so that it captures the relationship between the
      features and the label in labeled examples. Only then can it predict the label of new,
      unlabeled examples [^1].
    references:
