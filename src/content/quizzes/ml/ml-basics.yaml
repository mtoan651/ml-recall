  - id: ml-basics-090
    type: multiple
    difficulty: easy
    tags:
      - regression
      - classification
    question: Which of these are regression problems? Select all that apply.
    options:
      - text: Predicting the price of a house from features such as the number of bedrooms and the year built
        correct: true
      - text: Predicting whether a house will sell, from its price, number of rooms and similar features
        why: '"Will sell" or "will not sell" is one of two discrete classes, so this is classification [^1].'
      - text: Predicting a student's percentage grade in a course from past grades
        correct: true
      - text: Predicting whether you should bicycle tomorrow from the weather forecast
        why: The answer is yes or no, a discrete class, so this is classification [^1].
      - text: Predicting the right thermostat temperature from the wind speed and the number of people in a room
        correct: true
    explanation: |
      Supervised problems split by what they predict: classification predicts one of two or more
      discrete classes, regression predicts a continuous value [^1]. A price, a percentage grade and
      a temperature are continuous quantities, so those are regression problems; "will it sell" and
      "should I bike" are yes/no decisions, so those are binary classification [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — Classification vs. Regression'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
