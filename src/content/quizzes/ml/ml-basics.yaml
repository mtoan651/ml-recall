  - id: ml-basics-056
    type: single
    difficulty: easy
    question: What is AutoML (automated machine learning)?
    options:
      - text: Automatically trying many algorithms and settings to find the best model
        correct: true
      - text: Automatically deploying a trained model to a web endpoint
      - text: Automatically collecting new data from users
      - text: Automatically labeling a raw dataset
    explanation: |
      AutoML automates the time-consuming, iterative tasks of model development [^1][^2]: it trains
      many pipelines that try different algorithms, features and hyperparameters, scores each on the
      chosen metric and recommends the best model [^2]. Deployment is a separate, later step: the
      lesson deploys the model that AutoML selected afterwards [^1]. You also bring your own labeled
      training data, so collecting and labeling data are not what AutoML does [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#24-low-codeno-code-training-with-automl
        locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.4 Low code/No Code training with AutoML and 3. model deployment'
      - title: 'Microsoft Learn: What is automated ML? AutoML (Azure Machine Learning)'
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml
        locator: introduction and sec. How does AutoML work?
    source:
      id: ms-ds-for-beginners
      ref: quiz-36/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
    status: draft
  - id: ml-basics-057
    type: single
    difficulty: easy
    question: In the bias-variance view of a model's error, what causes *bias* error?
    options:
      - text: The model is not powerful enough to capture the real relationship in the data, so it underfits
        correct: true
      - text: The model fits the random noise in the training data instead of the real relationship, so it overfits
      - text: The computer does not have enough memory to train the model to convergence
      - text: The labels contain random noise that no model could ever remove
    explanation: |
      Bias error comes from an algorithm that cannot capture the relationship in the training data,
      typically because the model is not powerful enough; this is underfitting [^1]. Approximating the
      noise in the data instead of the meaningful relationship is variance error, i.e. overfitting
      [^1]. Noise that no model can remove is a third term of the decomposition, the irreducible error,
      which is neither bias nor variance [^2]; hardware limits are not part of the decomposition at
      all.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#overfitting-and-bias-variance-tradeoff
        locator: 'Lesson: Neural Network Frameworks, sec. Overfitting and Bias-Variance Tradeoff'
      - title: scikit-learn documentation
        url: https://scikit-learn.org/stable/auto_examples/ensemble/plot_bias_variance.html
        locator: 'Example: Single estimator versus bagging: bias-variance decomposition'
    source:
      id: ms-ai-for-beginners
      ref: quiz-105/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
    status: draft
  - id: ml-basics-058
    type: single
    difficulty: medium
    question: |
      A teammate's experiment found a combination of hyperparameters that beats the team's baseline
      metric. You are running your own experiments on a different model. What should you do?
    options:
      - text: Maybe adopt one of those hyperparameters as a single change, but continue with your own experiments
        correct: true
      - text: Change all the hyperparameters in your current experiment to match your teammate's
        why: Hyperparameters that improved one model need not improve a different one, and changing many things at once hides which change helped.
      - text: Stop experimenting and put your teammate's model into production right away
        why: Beating the baseline does not make it the final model; further experiments may raise the baseline even more.
    explanation: |
      Experiments should make a single, small change at a time, such as a new learning rate, and when a
      change improves the model, its metrics become the new baseline for later experiments [^1].
      Hyperparameters that helped one model need not help another, so copying all of them into a
      different model is not a controlled experiment. Progress is non-linear and many experiments are
      usually needed before the model is good enough for production, so one improvement over the
      baseline is a reason to keep experimenting, not to stop [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/experiments
        locator: 'Managing ML Projects: Experiments'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/experiments#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/experiments
    status: draft
  - id: ml-basics-059
    type: single
    difficulty: medium
    question: |
      You work for a nature preservation company and manage the company's plant identification software. You want to create a model to classify 60 types of invasive plant species to help conservationists manage the habitats for endangered animals.

      You found sample code that solves a similar plant identification problem, and the estimated costs to implement your solution are within the project's budget. While the dataset has lots of training examples, it has only a few for the five most invasive species. Leadership isn't requiring that the model's predictions be interpretable, and there doesn't appear to be negative consequences related to bad predictions. Is your ML solution feasible?
    options:
      - text: No.
        correct: true
      - text: Yes.
        why: Although most of the feasibility criteria are met, there aren't enough examples for each species to train a model well enough to make good predictions.
    explanation: |
      Feasibility depends on data availability, problem difficulty, prediction quality, technical
      requirements and cost [^1]. Here most criteria are met (similar code exists, the budget fits,
      interpretability is not required), but the data is not: a classification model needs numerous
      examples for every label, and with only a few examples for some labels it cannot predict them
      well [^1]. The five most invasive species are exactly the classes the conservationists care
      about most, so the solution is not feasible until more examples of them are collected.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/feasibility
        locator: 'Managing ML Projects: Feasibility, sec. Data availability'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/feasibility#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/feasibility
    status: draft
  - id: ml-basics-060
    type: multiple
    difficulty: easy
    question: Which of the following models are likely to go stale quickly, so that they must be replaced regularly with models trained on newer data? Select all that apply.
    options:
      - text: Predicts spam
        correct: true
        why: Spam tactics change constantly, so yesterday's training data soon stops describing today's spam.
      - text: Recommends clothes
        correct: true
        why: Consumer preferences for clothes change frequently, so recommendations go stale fast.
      - text: Classifies bird species
        why: Bird species don't change over time.
      - text: Predicts if transaction is fraudulent
        correct: true
        why: Fraudsters keep changing their methods, so the patterns in older transactions soon stop applying.
    explanation: |
      As the world changes, trends in data shift and production models go stale, so they need
      retraining on up-to-date data [^1]. How fast depends on how dynamic the data is: a clothes
      recommender goes stale quickly because preferences change often, while a model that identifies
      flowers might never go stale because their identifying features are stable [^1]. Spam and fraud
      also change constantly in response to new tactics, whereas bird species, like flowers, keep their
      characteristics [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
        locator: 'Managing ML Projects: ML pipelines, secs. Updating the model and Model staleness and training frequency'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/pipelines#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
    status: draft
  - id: ml-basics-061
    type: multiple
    difficulty: easy
    question: What are some of the main reasons for using versioned repositories to store predictions, datasets, and models? Select all that apply.
    options:
      - text: Reproduce and debug issues
        correct: true
      - text: Monitor model quality
        correct: true
      - text: Reduce compute quota
    explanation: |
      Storing datasets in version-controlled repositories makes training reproducible and lets you
      compare the prediction quality of different models [^1]. Versioned model repositories let you
      track the evaluation and prediction quality of production models and reproduce results and debug
      issues by tracing a model's datasets and dependencies, and logged predictions with their ground
      truth help monitor model quality [^1]. Versioning does not reduce the compute quota a pipeline
      needs; quota is planned separately [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
        locator: 'Managing ML Projects: ML pipelines, secs. Assets and metadata storage'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/pipelines#q2
      url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
    status: draft
  - id: ml-basics-062
    type: true_false
    difficulty: easy
    question: When choosing hardware to serve predictions, you should always choose more powerful hardware than was used to train the model.
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      Training and serving may run on the same or on different hardware, but in general it is common to
      train on bigger hardware and serve on smaller hardware [^1]. Hardware is chosen per pipeline by
      asking what the model's size and architecture need and whether cheaper hardware would do [^1].
      Training is usually the heavier job: it passes over the whole dataset many times and computes
      gradients, while serving runs one forward pass per request.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/production
        locator: 'Managing ML Projects: Productionization, sec. Provisioning compute resources'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/production#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/production
    status: draft
  - id: ml-basics-063
    type: multiple
    difficulty: medium
    question: Logging and monitoring are set up across a production ML system. Which of these should they be able to detect? Select all that apply.
    options:
      - text: Skews or drifts in the serving data compared with the training data
        correct: true
      - text: A jump in a proxy for model quality, such as the share of mail that users move to spam
        correct: true
      - text: Quota usage that is about to reach its limit
        correct: true
      - text: Whether each prediction was right, by checking it against its true label in real time
    explanation: |
      Logging and monitoring let you find problems in ML pipelines before they affect users [^1]. They
      should catch skews or drifts in serving data, features and predictions, data-type problems, quota
      usage and model-quality metrics [^1]. In production you usually do not have the ground truth in
      real time, so model quality is tracked through proxies: a mail app cannot know which mail is spam
      as it arrives, but a jump in the share of mail users move to spam, say from 0.5% to 3%, signals a
      problem [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/production
        locator: 'Managing ML Projects: Productionization, sec. Logging, monitoring, and alerting'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/production#q2
      url: https://developers.google.com/machine-learning/managing-ml-projects/production
    status: draft
  - id: ml-basics-064
    type: single
    difficulty: easy
    question: The model recommends a shopping app to a user because they recently installed a similar app. What kind of filtering is this an example of?
    options:
      - text: Content-based filtering
        correct: true
      - text: Collaborative filtering
        why: Collaborative filtering takes other users into consideration. In the given scenario we only care about one user.
    explanation: |
      Content-based filtering recommends items similar to what the user already likes, using item
      features and that user's own actions, without information about other users [^1]. Installing an
      app that is similar to the recommended one is such a signal. Collaborative filtering instead uses
      similarities between users and items at the same time, so it can recommend an item to one user
      because a similar user liked it [^2].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/content-based/basics
        locator: 'Recommendation Systems: Content-based filtering, Basics'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/collaborative/basics
        locator: 'Recommendation Systems: Collaborative filtering, Basics'
    source:
      id: google-ml-courses
      ref: recommendation/collaborative/basics#q1
      url: https://developers.google.com/machine-learning/recommendation/collaborative/basics
    status: draft
  - id: ml-basics-065
    type: single
    difficulty: easy
    question: |
      A content-based recommender represents apps and the user in the same binary feature space
      (1 = the app has the feature, or the user has shown interest in it):

      | | Education | Casual | Health | TimeWastr | Science R Us | Healthcare |
      | --- | :-: | :-: | :-: | :-: | :-: | :-: |
      | Educational app by Science R Us | 1 | 0 | 0 | 0 | 1 | 0 |
      | Casual app by TimeWastr | 0 | 1 | 0 | 1 | 0 | 0 |
      | Health app by Healthcare | 0 | 0 | 1 | 0 | 0 | 1 |
      | **User** | 1 | 0 | 0 | 0 | 1 | 1 |

      Using the dot product as the similarity measure, which app should it recommend?
    options:
      - text: The educational app created by Science R Us.
        correct: true
      - text: The health app created by Healthcare.
        why: This app scores a 1. It isn't the worst recommendation our system could make, but it certainly isn't the best.
      - text: The casual app created by TimeWastr.
        why: This app actually has the lowest dot product at 0. Our user isn't interested in casual apps like games.
    explanation: |
      With binary vectors, the dot product $\langle x, y \rangle = \sum_i x_i y_i$ counts the features
      active in both the user and the app, so a higher value means a more similar item [^1]. The
      educational app shares Education and Science R Us with the user (score 2), the health app shares
      only Healthcare (score 1), and the casual app shares nothing (score 0). The system scores every
      candidate and recommends the highest, here the educational app [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/content-based/basics
        locator: 'Recommendation Systems: Content-based filtering, Basics (sec. Using dot product as a similarity measure)'
    source:
      id: google-ml-courses
      ref: recommendation/content-based/basics#q1
      url: https://developers.google.com/machine-learning/recommendation/content-based/basics
    status: draft
  - id: ml-basics-066
    type: single
    difficulty: easy
    question: Platforms such as YouTube and Google Play already have search. Why do they also use recommendation systems?
    options:
      - text: They surface items users would not think to search for in a huge, growing catalogue
        correct: true
      - text: Search cannot find any item in a catalogue that holds more than a few thousand items
      - text: Recommendations need no data about users or items, so they are cheaper to run than search
      - text: Recommendations guarantee that every item in the catalogue is shown equally often
    explanation: |
      A recommendation system helps users find compelling content in a very large corpus: Google Play
      has millions of apps and YouTube billions of videos. Search works when you know what to look for,
      but recommendations can show items users might not have thought to search for, and they drive a
      large share of installs and watch time [^1]. They depend on data about users and items, such as
      past interactions, to measure similarity [^1], and they rank items by relevance rather than
      showing all equally.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/overview
        locator: 'Recommendation Systems: Recommendation systems overview, sec. Why recommendations?'
    source:
      id: google-ml-courses
      ref: recommendation/overview/check-your-understanding#q1
      url: https://developers.google.com/machine-learning/recommendation/overview/check-your-understanding
    status: draft
  - id: ml-basics-067
    type: single
    difficulty: easy
    question: A common architecture for large-scale recommendation systems has three stages. Which are they?
    options:
      - text: candidate generation, scoring, and re-ranking
        correct: true
      - text: embedding, similarity metrics, and serving
        why: These elements are related to recommendation systems, but they are not primary components.
      - text: matrix factorization, DNN, and reranking
        why: While re-ranking is a component, matrix factorization and DNN are types of candidate generators.
    explanation: |
      One common architecture has three stages. Candidate generation cuts a huge corpus down to a small
      subset, e.g. from billions of videos to hundreds; scoring ranks those candidates with a more
      precise model to pick about ten items; and re-ranking applies further constraints such as removing
      disliked items, boosting fresh content and ensuring diversity and fairness [^1]. Embeddings and
      similarity measures are tools used inside these stages, and matrix factorization and deep networks
      are kinds of candidate generators, not stages [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/overview/types
        locator: 'Recommendation Systems: Recommendation systems overview, Candidate generation, scoring and re-ranking'
    source:
      id: google-ml-courses
      ref: recommendation/overview/check-your-understanding#q2
      url: https://developers.google.com/machine-learning/recommendation/overview/check-your-understanding
    status: draft
  - id: ml-basics-068
    type: single
    difficulty: easy
    question: |
      Evaluate both statements.

      **Statement 1.** Classical results on generalization assume that training and test examples are drawn independently from the same distribution (the i.i.d. assumption).

      **Statement 2.** Around 2017, object detectors trained on COCO usually started from a backbone pretrained on ImageNet classification.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: 'Statement 1 is true: the usual argument that training error tells us something about generalization error assumes the training and test data are drawn independently from identical distributions, the IID assumption [^1]. Statement 2 is also true: fine-tuning an ImageNet-pretrained network was the de facto recipe for COCO detection, and the top COCO 2017 competition results used ImageNet pre-training, which is why training from scratch was later presented as a challenge to conventional wisdom [^2]. This is the fine-tuning pattern of transfer learning: pretrain a model on a large source dataset, then train it further on the target task [^3].'
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#training-error-and-generalization-error
        locator: Sec. 3.6.1 Training Error and Generalization Error (IID assumption)
      - title: 'He, Girshick, Dollár (2018): Rethinking ImageNet Pre-training (arXiv:1811.08883)'
        url: https://arxiv.org/abs/1811.08883
        locator: Abstract
      - source: d2l
        url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
        locator: Sec. 14.2.1 Steps (fine-tuning)
    source:
      id: mmlu-redux
      ref: machine_learning/86
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=86
    status: draft
  - id: ml-basics-069
    type: single
    difficulty: easy
    question: Why might a business choose a machine-learning approach instead of a hand-coded rules engine?
    options:
      - text: The patterns are too complex or change too often to write as rules, but can be learned from data
        correct: true
      - text: An ML model is guaranteed to give the right answer on every input, which hand-written rules can never promise
      - text: An ML model needs no data, only a description of the problem
      - text: Hand-written rules cannot be changed once they are deployed
    explanation: |
      The lesson starts the ML workflow with a question that cannot be answered by a simple
      conditional program or rules engine, for example predicting mortality when many health
      variables interact [^1]. d2l gives the same two reasons: some tasks follow a pattern that
      changes over time, and others involve relationships too complicated to code by hand, so the
      program has to learn from experience, usually data [^2]. ML models still make mistakes and
      cannot learn without data. A rules engine can be changed too, but only when its developers
      decide to update it by hand [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#what-question-to-ask
        locator: 'Lesson: Techniques of Machine Learning, secs. Introduction (step 1) and What question to ask'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html
        locator: Ch. 1 Introduction (opening section, rules vs. learning from experience)
    source:
      id: ms-ml-for-beginners
      ref: quiz-1/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ml-basics-070
    type: true_false
    difficulty: easy
    question: 'True or false: machine learning algorithms are designed to simulate the human brain.'
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: |
      False. The lesson calls ML "loosely inspired" by how the brain learns from what it perceives
      and draws only "motivational similarities" between the two. What defines ML is algorithms
      that learn hidden patterns from data to support decisions [^1]. Most classical methods, such
      as linear regression, decision trees or k-means, contain nothing brain-like. Even neural
      networks took little more than their name from biology: d2l notes that the biological
      interpretation has become less literal over time, and what such networks share is layers of
      linear and nonlinear units trained with the chain rule [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#why-study-machine-learning
        locator: "Lesson: Introduction to machine learning, secs. The child's brain and Why study machine learning?"
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#roots
        locator: Sec. 1.4 Roots
    source:
      id: ms-ml-for-beginners
      ref: quiz-2/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: ml-basics-071
    type: single
    difficulty: easy
    question: Which of these is a classical machine-learning technique, as opposed to deep learning?
    options:
      - text: Logistic regression
        correct: true
      - text: A convolutional neural network
      - text: A Transformer language model
    explanation: |
      The curriculum's "classical machine learning" means methods such as regression,
      classification and clustering built with scikit-learn, and it explicitly leaves out neural
      networks and deep learning [^1]. Logistic regression belongs to that classical toolbox.
      Convolutional networks and Transformers are deep neural network architectures: d2l describes
      how, once data and compute grew, the sweet spot moved from linear models and kernel methods
      to deep networks such as these [^2]. Natural language processing, the key given upstream, is
      an application area rather than a technique; it can be tackled with classical methods (as the
      curriculum does) or with deep learning.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
        locator: 'Lesson: Introduction to machine learning, secs. Concepts to cover and What we will not cover'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#the-road-to-deep-learning
