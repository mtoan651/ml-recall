      - local-explanations
    question: |
      Doctors want to see, for each patient, which features raise or lower the model's predicted
      readmission risk, and by how much. Which tool fits this need?
    options:
      - text: SHAP values for that patient's prediction
        correct: true
      - text: Permutation importance on the validation set
        why: Permutation importance gives one number per feature for the whole model, not a breakdown of one patient's prediction [^2].
      - text: A partial dependence plot for each feature
        why: A PDP shows the average effect of a feature over many rows, not its contribution to a particular patient [^3].
      - text: The model's accuracy on the patient's age group
        why: Accuracy describes how often the model is right, not why it made a given prediction [^1].
    explanation: |
      SHAP values break down a single prediction to show the impact of each feature, for instance to
      identify what drives each patient's risk so it can be addressed [^1]. The exercise's solution
      builds a per-patient function around `shap.TreeExplainer` and a force plot [^4].
      Permutation importance and partial dependence plots give global summaries of what the model has
      learned [^2][^3].
