    question: |
      A rental website has thousands of apartment listings described by size, location and age, but with
      no rents or categories attached. It wants to find groups of similar listings. What kind of problem
      is this?
    options:
      - text: Unsupervised clustering
        correct: true
      - text: Supervised regression
        why: There are no target values, such as rents, to predict.
      - text: Supervised classification
        why: No predefined categories or labels are given.
      - text: Reinforcement learning
        why: No agent takes actions and receives rewards.
    explanation: |
      Without targets, the algorithm has to discover structure in the inputs alone; grouping similar
      examples is clustering, a typical unsupervised task [^1][^2]. If recorded rents were added as
      targets, predicting them would turn the problem into supervised regression.
