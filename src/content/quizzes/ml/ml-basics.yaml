  - id: ml-basics-110
    type: single
    difficulty: easy
    tags:
      - when-to-use-ml
      - human-expertise
    question: Which of these decisions is best left to human experts rather than to a learned model or a fixed set of rules?
    options:
      - text: Choosing end-of-life care, where the ethical questions are deeply personal
        correct: true
      - text: Checking that company practices follow regulations that are clearly written down
        why: Clear, stable rules can be encoded directly in a rule-based system [^1].
      - text: Predicting which movies a user will like from their viewing history
        why: Preferences have no explicit rules but plenty of data, which is the typical case for machine learning [^1].
      - text: Detecting transactions that look different from a customer's usual behaviour
        why: Fraud and anomaly detection learn patterns from many past transactions, a standard machine learning task [^1].
    explanation: |
      The rule of thumb in the course: use machine learning when there is a lot of data and the
      decision rules are unknown or too complex to write down, use rule-based systems when the logic
      is clear and stable, and rely on human expertise for problems involving ethics, emotion or
      ambiguity [^1]. End-of-life decisions are deeply personal and ethical, so a model or a rule
      book should at most support the people making them.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 1: Course Introduction — Supervised machine learning, Examples (closing summary)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/01_intro.ipynb
