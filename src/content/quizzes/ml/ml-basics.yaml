  - id: ml-basics-079
    type: short_answer
    difficulty: hard
    tags:
      - covariate-shift
      - importance-weighting
      - logistic-regression
    question: |
      To correct covariate shift, you train logistic regression to distinguish training inputs (label
      $-1$) from equally many test inputs (label $+1$). For a training example $\mathbf{x}_i$ the
      classifier outputs $P(z{=}1 \mid \mathbf{x}_i) = 0.75$. Which importance weight
      $\beta_i = p(\mathbf{x}_i)/q(\mathbf{x}_i)$ should that example get in weighted empirical risk
      minimization, where $p$ is the test and $q$ the training input distribution?
    answer:
      numeric: 3
      tolerance: 0.01
      hint: a number
      model: $\beta_i = \dfrac{P(z{=}1 \mid \mathbf{x}_i)}{P(z{=}{-1} \mid \mathbf{x}_i)} = \dfrac{0.75}{0.25} = 3$
    explanation: |
      With equal sample sizes, $P(z{=}1 \mid \mathbf{x}) = p(\mathbf{x}) / (p(\mathbf{x}) + q(\mathbf{x}))$,
      so the classifier's odds equal the density ratio of test to training inputs [^1]. For logistic
      regression the odds are $\exp(h(\mathbf{x}))$, so $\beta_i = \exp(h(\mathbf{x}_i)) = 0.75/0.25 = 3$
      [^1]. The example looks like test data, so its loss counts three times in
      $\frac{1}{n}\sum_i \beta_i\,l(f(\mathbf{x}_i), y_i)$. d2l suggests capping the weights at a
      constant $c$, $\beta_i = \min(\exp(h(\mathbf{x}_i)), c)$, because a few training points can
      otherwise get huge weights [^1].
    references:
      - source: d2l
        locator: Sec. 4.7.3.2 Covariate Shift Correction
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#covariate-shift-correction
      - source: d2l
        locator: Sec. 4.7.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#exercises
    source:
      id: d2l
      ref: chapter_linear-classification/environment-and-distribution-shift#ex3
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-080
    type: single
    difficulty: easy
    tags:
      - overfitting
      - regularization
      - ridge
    question: Your model overfits. Which change is most likely to help?
    options:
      - text: Add more features so the model sees more information
        why: More features make the model more complex, which increases the chance of overfitting [^2].
      - text: Add regularization, such as the penalty in ridge regression
        correct: true
      - text: Train on fewer examples so it has less to memorize
        why: Less data makes overfitting worse; with more data, patterns that are overly specific to the sample matter less [^3].
      - text: Keep training the same model for more iterations
        why: For a model trained iteratively, longer training fits the training data ever more closely, which feeds overfitting rather than curing it.
    explanation: |
      Regularization limits how complex a model can get. In ridge regression the hyperparameter
      `alpha` controls the fundamental trade-off: a larger `alpha` gives smaller coefficients and
      a simpler model that is less likely to overfit [^1]. The other changes push the wrong way: more
      features increase complexity [^2] and less data makes it easier to learn patterns that are
      overly specific to the sample [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Hyperparameter alpha of Ridge'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 13: Feature engineering and feature selection — Feature selection: Introduction and motivation'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/13_feature-engineering-selection.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Large datasets solve many of these problems'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
    source:
