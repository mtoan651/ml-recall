  - id: ml-basics-096
    type: multiple
    difficulty: medium
    tags:
      - recommender-systems
      - content-based-filtering
      - rmse
    question: |
      Which statements about content-based filtering, as a set of per-user regression models on
      item features, are true? Select all that apply.
    options:
      - text: Content-based filtering uses item features in addition to the similarity between users
        why: It does not use similarity between users at all; each user gets their own model fit to item features [^1].
      - text: Content-based filtering represents each user in terms of the known features of the items they rated
        correct: true
      - text: In this setup, a new movie with no ratings yet cannot be given predicted ratings
        why: The per-user models only need the new movie's features, so it can be scored immediately [^2].
      - text: If one user has ratings in the training matrix but none in the validation matrix, the validation RMSE cannot be computed
        why: RMSE is averaged over the validation ratings that exist; this user simply contributes no terms to it [^3].
    explanation: |
      In content-based filtering each user's profile is a regression model with the features of the
      movies they rated as $X$ and their ratings as $y$; the model is then applied to unrated
      movies to complete that user's row of the utility matrix [^1]. Because it relies on item
      features, it can rate brand-new items, which collaborative filtering cannot [^2]. Validation
      error is computed only over the ratings present in the validation matrix [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Content-based filtering (Overview); Building user profiles'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Miscellaneous comments on content-based filtering (advantages)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Evaluation'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
