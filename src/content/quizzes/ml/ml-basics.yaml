    reviewed_by: claude
  - id: ml-basics-077
    type: single
    difficulty: medium
    tags:
      - recommender-systems
      - session-based
      - sequence-aware
    question: |
      How does session-based recommendation (for example GRU4Rec) differ from sequence-aware
      recommendation with a model such as Caser?
    options:
      - text: Sessions are often anonymous and short, so the model must work from the current clicks, with no user profile
        correct: true
      - text: Session-based models ignore the order of the clicks, while sequence-aware models use it
        why: Session-based models such as GRU4Rec run an RNN over the clicks in order [^2].
      - text: Session-based recommendation needs explicit ratings, sequence-aware recommendation only clicks
        why: Both settings typically work from implicit feedback such as clicks and purchases.
      - text: Sequence-aware models use only the very last item, while session-based models use the user's whole long-term history
        why: It is the other way round; Caser uses the previous $L$ items plus a long-term user embedding [^1].
    explanation: |
      Caser knows the user: it combines a convolutional summary of the last $L$ items, the short-term
      intent, with a user embedding $\mathbf{p}_u$ for general, long-term taste [^1]. Session-based
      recommendation assumes many sites cannot track users over time, users often have only one or two
      sessions, and sessions must be handled independently, so models cannot rely on a user profile
      and must predict from the clicks of the current session alone [^2].
    references:
      - source: d2l
        locator: Sec. 21.7.1 Model Architectures
        url: https://d2l.ai/chapter_recommender-systems/seqrec.html#model-architectures
      - title: Hidasi, Karatzoglou, Baltrunas & Tikk (2015), Session-based Recommendations with Recurrent Neural Networks
        url: https://arxiv.org/abs/1511.06939
        locator: Abstract; Sec. 1 Introduction
      - source: d2l
        locator: Sec. 21.7.7 Exercises, Exercise 3
        url: https://d2l.ai/chapter_recommender-systems/seqrec.html#exercises
    source:
      id: d2l
      ref: chapter_recommender-systems/seqrec#ex3
      url: https://d2l.ai/chapter_recommender-systems/seqrec.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-078
    type: single
    difficulty: medium
    tags:
      - covariate-shift
      - distribution-shift
      - domain-classifier
    question: |
      You have labeled training data and unlabeled inputs collected after deployment. How can you check
      whether the input distribution has shifted (covariate shift)?
    options:
      - text: Train a classifier to separate the two sets and check its accuracy on its own training data
        why: A flexible classifier can reach high training accuracy by memorizing even without any shift; only held-out accuracy shows real separability.
      - text: Train a classifier to tell training from deployment inputs; check if its held-out accuracy beats chance
        correct: true
      - text: Compare the model's prediction accuracy on the training set with its accuracy on the deployment inputs
        why: The deployment inputs have no labels, so accuracy cannot be measured on them.
      - text: Check whether the training loss keeps decreasing after the deployment inputs arrive
        why: The training loss is computed on the training data only and says nothing about how the deployment inputs are distributed.
    explanation: |
      Label the training inputs $-1$ and the deployment inputs $+1$, and train a binary classifier such
      as logistic regression to tell them apart [^1]. If the two distributions are the same, no
      classifier can distinguish them, so its accuracy on held-out examples stays near chance (50% for
      equal-sized sets); clearly better accuracy means the inputs have shifted [^1]. No labels of the
      deployment data are needed, and the same classifier also yields the weights for correcting the
      shift [^1].
    references:
      - source: d2l
        locator: Sec. 4.7.3.2 Covariate Shift Correction
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#covariate-shift-correction
      - source: d2l
        locator: Sec. 4.7.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#exercises
    source:
      id: d2l
      ref: chapter_linear-classification/environment-and-distribution-shift#ex2
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html#exercises
