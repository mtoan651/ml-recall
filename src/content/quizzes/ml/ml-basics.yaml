  - id: ml-basics-018
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - classification
    question: A filter decides for every incoming email whether it is spam or not spam. Which learning task is this?
    options:
      - text: Classification
        correct: true
      - text: Regression
        why: Regression outputs a continuous number, not a category.
      - text: Clustering
        why: Clustering groups unlabeled data; here the two categories are fixed in advance.
      - text: Dimensionality reduction
        why: It compresses features; it does not assign a label.
    explanation: The output is one of two discrete categories, so this is (binary) classification [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 17
      - source: d2l
        locator: Sec. 1.3.1 Supervised Learning
        url: https://d2l.ai/chapter_introduction/index.html
    source:
