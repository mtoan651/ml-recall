  - id: ml-basics-091
    type: multiple
    difficulty: easy
    tags:
      - data-splitting
      - validation
      - generalization
    question: |
      A dataset is split into training, validation and test sets, and the final model will later
      run on new deployment data. Which statements about this setup are true? Select all that apply.
    options:
      - text: A decision tree with no depth limit is likely to perform very well on deployment data
        why: An unlimited tree fits its training data almost perfectly by learning very specific rules, which typically means overfitting and worse results on new data [^2].
      - text: Splitting the data helps us assess how well a model will generalize
        correct: true
      - text: Deployment data is scored only once
        why: Deployment data has no targets, so it cannot be scored at all; it is the *test* data that is scored once [^1].
      - text: Validation data can be used for hyperparameter optimization
        correct: true
      - text: For data without a time order, it is recommended to shuffle the examples before splitting them into training and test sets
        correct: true
    explanation: |
      We split data to approximate the generalization error. Training data is used in `fit`;
      validation data has targets and is used for hyperparameter tuning and model assessment; test
      data is locked away and scored once at the end; deployment data has no targets, and the model
      only predicts on it [^1]. Shuffling before a train/test split keeps both parts representative
      (the splitting function does it by default), with the important exception of time series,
      where the split must respect time [^1][^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Train/validation/test split; Deployment data; Summary of train, validation, test, and deployment data'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
