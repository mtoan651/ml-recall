  - id: ml-basics-101
    type: single
    difficulty: easy
    question: |
      A flight dataset has the columns `departure_airport`, `destination_airport`, `date`,
      `time_of_day`, `airline`, `fuel_price` and `airplane_ticket_cost` (the ticket price). Could
      you train a classification model on it to classify the cost of an airplane ticket as "high,"
      "average," or "low"?
    options:
      - text: Yes, but we'd first need to convert the numeric values in the `airplane_ticket_cost` column to categorical values.
        correct: true
      - text: No. It's not possible to create a classification model. The `airplane_ticket_cost` values are numeric not categorical.
        why: A numeric column can be turned into categories by binning it with thresholds; the binned column then serves as the class label.
      - text: No. Classification models only predict two categories, like `spam` or `not_spam`. This model would need to predict three categories.
        why: Classification models can predict multiple categories. They're called multiclass classification models.
    explanation: |
      Classification needs a categorical label, but a numeric column can be converted into one [^1].
      Choose thresholds that define "high," "average" and "low" (for example relative to the
      average cost of a ticket from the departure airport to the destination airport), map every
      cost to its category, and train a multiclass classifier on that label; equivalently, predict
      the cost and compare the prediction with the same thresholds [^1]. Classification models are
      not limited to two classes: with three or more they are called multiclass classification
      models [^1].
    references:
      - source: google-ml-courses
        locator: Test Your Understanding
        url: https://developers.google.com/machine-learning/intro-to-ml/understanding
    source:
      id: google-ml-courses
      ref: intro-to-ml/understanding#q5
      url: https://developers.google.com/machine-learning/intro-to-ml/understanding
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-102
    type: multiple
    difficulty: medium
    question: If the model's predictions are far off, what might you do to make them better?
    options:
      - text: Retrain the model, but use only the features you believe have the strongest predictive power for the label.
        correct: true
      - text: You can't fix a model whose predictions are far off.
        why: It's possible to fix a model whose predictions are off. Most models require multiple rounds of training until they make useful predictions.
      - text: Retrain the model using a larger and more diverse dataset.
        correct: true
      - text: Try a different training approach. For example, if you used a supervised approach, try an unsupervised approach.
        why: Without labels in its objective, an unsupervised method can't learn to predict the label at all, so switching approach doesn't fix poor predictions.
    explanation: Retraining the model with fewer features, but that have more predictive power, can produce a model that makes better predictions. Models trained on datasets with more examples and a wider range of values can produce better predictions because the model has a better generalized solution for the relationship between the features and the label. [^1]
