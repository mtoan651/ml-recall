  - id: ml-basics-049
    type: single
    difficulty: easy
    question: Why is problem framing important?
    options:
      - text: Problem framing ensures that an ML approach is a good solution to the problem before beginning to work with data and train a model.
        correct: true
      - text: Problem framing helps diagnose problems with existing ML models and uncovers issues with data.
        why: Diagnosing an existing model and finding data issues are debugging and evaluation tasks that come once a model exists; framing happens before any data work or training.
    explanation: |
      Problem framing means taking a problem apart to see which pieces need solving. That tells you
      whether the project is technically feasible and gives it clear goals and success
      criteria [^1]. It has two steps: deciding whether ML is the right approach at all and, if so,
      stating the problem in ML terms. Both happen before any data work or model training [^1].
      The first step matters because ML is a specialised tool, and a simpler non-ML solution may
      do the job [^2]. Diagnosing an existing model or finding data issues is debugging and
      evaluation work that comes later, not framing.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem-framing
        locator: 'Problem Framing: Overview'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/problem-framing/problem#clear_use_case_for_ml
        locator: "Problem Framing: Understand the problem, 'Clear use case for ML'"
    source:
      id: google-ml-courses
      ref: problem-framing/problem-framing#q1
      url: https://developers.google.com/machine-learning/problem-framing/problem-framing
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-050
    type: single
    difficulty: easy
    question: |
      Here are two columns of a dataset, sorted by `Timestamp`:

      | Timestamp | Temperature |
      | --- | ---: |
      | June 8, 2023 09:00 | 12 |
      | June 8, 2023 10:00 | 18 |
      | June 8, 2023 11:00 | *missing* |
      | June 8, 2023 12:00 | 24 |
      | June 8, 2023 13:00 | 38 |

      Which of the following would be a reasonable value to impute for the missing value of `Temperature`?
    options:
      - text: '23'
        correct: true
      - text: '31'
        why: Unlikely. The limited part of the dataset that we can see suggests that 31 is much too high for the 11:00 Temperature. However, we can't be sure without basing the imputation on a larger number of examples.
      - text: '51'
        why: Very unlikely. 51 is much higher than any of the displayed values (and, therefore, much higher than the mean).
    explanation: |
      Imputation replaces a missing value with a well-reasoned guess, and a common choice is the
      mean or median of the feature [^1]. The mean of the visible readings is
      $(12 + 18 + 24 + 38)/4 = 23$, and 23 also lies between the readings at 10:00 (18) and 12:00
      (24), as it should for a temperature rising through the morning. 31 is far above the readings
      on either side, and 51 is higher than every value shown. With only a few rows visible, 23 is
      still just a reasonable guess; a larger sample of the dataset might show that 11:00 readings
      usually differ [^1].
    references:
      - source: google-mlcc
        locator: 'Datasets: Data characteristics'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics
    source:
      id: google-mlcc
      ref: overfitting/data-characteristics#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-051
    type: multiple
    difficulty: medium
    question: The plot below shows a training loss curve. What **three** things could you do to try to improve it?
    figure:
      src: ./ml-basics/ml-basics-051.svg
      alt: 'Loss against training steps: the loss swings up and down in large waves throughout training and never settles.'
    options:
      - text: Check your data against a data schema to detect bad examples, and then remove the bad examples from the training set.
        correct: true
      - text: Reduce the learning rate.
        correct: true
      - text: Reduce the training set to a tiny number of trustworthy examples.
        correct: true
      - text: Increase the number of examples in the training set.
        why: The swings come from steps that are too large or from bad examples, and more data of the same kind fixes neither; it may even add more bad examples.
      - text: Increase the learning rate.
        why: Larger steps make an oscillating loss swing even more; when a loss curve shows a problem, lower the learning rate rather than raise it.
    explanation: 'A loss curve that keeps oscillating instead of flattening usually means the updates are too large or the data is noisy [^1]. Lowering the learning rate makes each step smaller. Checking examples against a data schema and removing bad ones takes out broken examples that kick the loss around. Training on a tiny set of trustworthy examples first is a debugging step: if the model cannot converge even there, the problem is in the model or the pipeline, and once it does you can add data back gradually [^1]. Adding more examples or raising the learning rate is unlikely to calm an oscillating curve.'
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-052
    type: multiple
    difficulty: medium
    question: Which **two** of the following statements identify possible reasons for the exploding loss shown in the plot below?
    figure:
      src: ./ml-basics/ml-basics-052.svg
      alt: 'Loss against training steps: the loss falls smoothly for most of training, then suddenly shoots up to a high level and keeps jumping around there.'
    options:
      - text: The input data contains one or more NaNs—for example, a value caused by a division by zero.
        correct: true
      - text: The input data contains a burst of outliers.
        correct: true
      - text: The learning rate is too low.
        why: A very low learning rate might increase training time, but it is not the cause of the strange loss curve.
      - text: The regularization rate is too high.
        why: True, a very high regularization could prevent a model from converging; however, it won't cause the strange loss curve shown in the plot.
    explanation: |
      A loss that falls smoothly and then suddenly shoots up points to bad input data rather than a
      badly tuned hyperparameter [^1]. One cause is NaNs in the input, for example from a division
      by zero, which is more common than you might expect. Another is a batch packed with outliers,
      which can happen when batches are not shuffled properly [^1]. A low learning rate only slows
      training down, and a very high regularization rate can keep a model from converging, but
      neither produces a sudden jump like this one [^1].
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q2
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-053
    type: single
    difficulty: easy
    question: The plot below shows the loss curves of the training and test sets. Which **one** of the following statements best identifies the reason for the difference between them?
    figure:
      src: ./ml-basics/ml-basics-053.svg
      alt: 'Two loss curves against training steps: the training loss keeps decreasing, while the test loss decreases at first, then flattens and starts to rise.'
    options:
      - text: The model is overfitting the training set.
        correct: true
      - text: The learning rate is too high.
        why: If the learning rate were too high, the loss curve for the training set would likely not have behaved as it did.
    explanation: |
      The two curves fall together at first, then diverge: the training loss keeps going down while the
      test loss levels off and starts to rise. The model is learning details of the training set that
      don't carry over to new data, the classic sign of overfitting [^1]. A learning rate that is too
      high would show up in the training curve itself, which would bounce around or keep increasing
      instead of falling smoothly [^2]. Possible fixes are a simpler model (for example, fewer features),
      a higher regularization rate, and making sure the training and test sets are statistically
      equivalent [^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#detecting_overfitting
        locator: Overfitting, sec. Detecting overfitting
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters#learning_rate
        locator: 'Linear regression: Hyperparameters, sec. Learning rate'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves#exercise_3_test_loss_diverges_from_training_loss
        locator: 'Overfitting: Interpreting loss curves, Exercise 3. Test loss diverges from training loss'
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q3
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-054
    type: single
    difficulty: medium
    question: Which **one** of the following statements is the most likely explanation for the erratic loss curve shown below?
    figure:
      src: ./ml-basics/ml-basics-054.svg
      alt: 'Loss against training steps: the loss drops quickly and levels off, then the same burst of jagged bumps repeats at regular intervals.'
    options:
      - text: The training set is not shuffled well.
        correct: true
      - text: The regularization rate is too high.
        why: Too much regularization keeps the model too simple, so the loss levels off at a high value; it does not make the same burst of bumps repeat at regular intervals.
      - text: The training set contains too many features.
        why: Too many features invite overfitting, which shows as a gap between training and validation loss, not as a repeating pattern in the training loss.
    explanation: |
      The loss converges and then the same burst of bumps keeps repeating at regular intervals,
      which points to the order of the training data [^1]. If the examples are not shuffled, for
      example 100 images of dogs followed by 100 images of cats, each run of similar examples pulls
      the weights one way and the next run pulls them back, so the loss oscillates in a pattern that
      recurs on every pass through the data [^1]. The fix is to shuffle the examples sufficiently.
    references:
      - source: google-mlcc
        locator: 'Overfitting: Interpreting loss curves'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    source:
      id: google-mlcc
      ref: overfitting/interpreting-loss-curves#q4
      url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-055
    type: single
    difficulty: easy
    shuffle: false
    question: Your company wants to mail coupons ("Get 15% off a new bicycle helmet") to bicycle owners, so your model must predict which people own a bicycle. The dataset has no `bike owner` column, but it does have a column named `recently bought a bicycle`. Would `recently bought a bicycle` be a good proxy label or a poor proxy label for this model?
    options:
      - text: Good proxy label
        correct: true
      - text: Poor proxy label
        why: Like all proxy labels, `recently bought a bicycle` is imperfect (some bicycles are bought as gifts and given to others). However, `recently bought a bicycle` is still a relatively good indicator that someone owns a bicycle.
    explanation: The column `recently bought a bicycle` is a relatively good proxy label. After all, most of the people who buy bicycles now own bicycles. Nevertheless, like all proxy labels, even very good ones, `recently bought a bicycle` is imperfect. After all, the person buying an item isn't always the person using (or owning) that item. For example, people sometimes buy bicycles as a gift. [^1]
    references:
      - source: google-mlcc
        locator: 'Datasets: Labels'
        url: https://developers.google.com/machine-learning/crash-course/overfitting/labels
    source:
      id: google-mlcc
      ref: overfitting/labels#q1
      url: https://developers.google.com/machine-learning/crash-course/overfitting/labels
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-056
    type: single
    difficulty: easy
    question: What is AutoML (automated machine learning)?
    options:
      - text: Automatically trying many algorithms and settings to find the best model
        correct: true
      - text: Automatically deploying a trained model to a web endpoint
        why: Deployment is a separate step after training; AutoML selects the model, and you deploy it afterwards.
      - text: Automatically collecting new data from users
        why: AutoML works on a dataset that you supply; it does not gather data.
      - text: Automatically labeling a raw dataset
        why: AutoML expects labeled training data; labeling has to be done before it runs.
    explanation: |
      AutoML automates the time-consuming, iterative tasks of model development [^1][^2]: it trains
      many pipelines that try different algorithms, features and hyperparameters, scores each on the
      chosen metric and recommends the best model [^2]. Deployment is a separate, later step: in
      Microsoft's Data Science for Beginners lesson, the model that AutoML selected is deployed
      afterwards [^1]. You also bring your own labeled training data, so collecting and labeling
      data are not what AutoML does [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#24-low-codeno-code-training-with-automl
        locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.4 Low code/No Code training with AutoML and 3. model deployment'
      - title: 'Microsoft Learn: What is automated ML? AutoML (Azure Machine Learning)'
        url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml
        locator: introduction and sec. How does AutoML work?
    source:
      id: ms-ds-for-beginners
      ref: quiz-36/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-057
    type: single
    difficulty: easy
    question: In the bias-variance view of a model's error, what causes *bias* error?
    options:
      - text: The model is not powerful enough to capture the real relationship in the data, so it underfits
        correct: true
      - text: The model fits the random noise in the training data instead of the real relationship, so it overfits
        why: Fitting noise instead of the real relationship is variance error (overfitting), the opposite of bias.
      - text: The computer does not have enough memory to train the model to convergence
        why: Hardware limits are not part of the bias–variance decomposition; bias comes from a model that is too simple for the data.
      - text: The labels contain random noise that no model could ever remove
        why: Noise that no model can remove is the irreducible error, a separate term from both bias and variance.
    explanation: |
      Bias error comes from an algorithm that cannot capture the relationship in the training data,
      typically because the model is not powerful enough; this is underfitting [^1]. Approximating the
      noise in the data instead of the meaningful relationship is variance error, i.e. overfitting
      [^1]. Noise that no model can remove is a third term of the decomposition, the irreducible error,
      which is neither bias nor variance [^2]; hardware limits are not part of the decomposition at
      all.
    references:
      - source: ms-ai-for-beginners
        url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#overfitting-and-bias-variance-tradeoff
        locator: 'Lesson: Neural Network Frameworks, sec. Overfitting and Bias-Variance Tradeoff'
      - title: scikit-learn documentation
        url: https://scikit-learn.org/stable/auto_examples/ensemble/plot_bias_variance.html
        locator: 'Example: Single estimator versus bagging: bias-variance decomposition'
    source:
      id: ms-ai-for-beginners
      ref: quiz-105/q3
      url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/etc/quiz-app/src/assets/translations/en/lesson-5.json
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-058
    type: single
    difficulty: medium
    question: |
      A teammate's experiment found a combination of hyperparameters that beats the team's baseline
      metric. You are running your own experiments on a different model. What should you do?
    options:
      - text: Maybe adopt one of those hyperparameters as a single change, but continue with your own experiments
        correct: true
      - text: Change all the hyperparameters in your current experiment to match your teammate's
        why: Hyperparameters that improved one model need not improve a different one, and changing many things at once hides which change helped.
      - text: Stop experimenting and put your teammate's model into production right away
        why: Beating the baseline does not make it the final model; further experiments may raise the baseline even more.
    explanation: |
      Experiments should make a single, small change at a time, such as a new learning rate, and when a
      change improves the model, its metrics become the new baseline for later experiments [^1].
      Hyperparameters that helped one model need not help another, so copying all of them into a
      different model is not a controlled experiment. Progress is non-linear and many experiments are
      usually needed before the model is good enough for production, so one improvement over the
      baseline is a reason to keep experimenting, not to stop [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/experiments
        locator: 'Managing ML Projects: Experiments'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/experiments#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/experiments
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-059
    type: single
    difficulty: medium
    question: |
      You work for a nature preservation company and manage the company's plant identification software. You want to create a model to classify 60 types of invasive plant species to help conservationists manage the habitats for endangered animals.

      You found sample code that solves a similar plant identification problem, and the estimated costs to implement your solution are within the project's budget. While the dataset has lots of training examples, it has only a few for the five most invasive species. Leadership isn't requiring that the model's predictions be interpretable, and there doesn't appear to be negative consequences related to bad predictions. Is your ML solution feasible?
    options:
      - text: No.
        correct: true
      - text: Yes.
        why: Although most of the feasibility criteria are met, there aren't enough examples for each species to train a model well enough to make good predictions.
    explanation: |
      Feasibility depends on data availability, problem difficulty, prediction quality, technical
      requirements and cost [^1]. Here most criteria are met (similar code exists, the budget fits,
      interpretability is not required), but the data is not: a classification model needs numerous
      examples for every label, and with only a few examples for some labels it cannot predict them
      well [^1]. The five most invasive species are exactly the classes the conservationists care
      about most, so the solution is not feasible until more examples of them are collected.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/feasibility
        locator: 'Managing ML Projects: Feasibility, sec. Data availability'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/feasibility#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/feasibility
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-060
    type: multiple
    difficulty: easy
    question: Which of the following models are likely to go stale quickly, so that they must be replaced regularly with models trained on newer data? Select all that apply.
    options:
      - text: Predicts spam
        correct: true
        why: Spam tactics change constantly, so yesterday's training data soon stops describing today's spam.
      - text: Recommends clothes
        correct: true
        why: Consumer preferences for clothes change frequently, so recommendations go stale fast.
      - text: Classifies bird species
        why: Bird species don't change over time.
      - text: Predicts if transaction is fraudulent
        correct: true
        why: Fraudsters keep changing their methods, so the patterns in older transactions soon stop applying.
    explanation: |
      As the world changes, trends in data shift and production models go stale, so they need
      retraining on up-to-date data [^1]. How fast depends on how dynamic the data is: a clothes
      recommender goes stale quickly because preferences change often, while a model that identifies
      flowers might never go stale because their identifying features are stable [^1]. Spam and fraud
      also change constantly in response to new tactics, whereas bird species, like flowers, keep their
      characteristics [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
        locator: 'Managing ML Projects: ML pipelines, secs. Updating the model and Model staleness and training frequency'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/pipelines#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-061
    type: multiple
    difficulty: easy
    question: What are some of the main reasons for using versioned repositories to store predictions, datasets, and models? Select all that apply.
    options:
      - text: Reproduce and debug issues
        correct: true
      - text: Monitor model quality
        correct: true
      - text: Reduce compute quota
        why: Versioning makes results reproducible and comparable; it does not reduce the compute a pipeline needs, which is planned separately.
    explanation: |
      Storing datasets in version-controlled repositories makes training reproducible and lets you
      compare the prediction quality of different models [^1]. Versioned model repositories let you
      track the evaluation and prediction quality of production models and reproduce results and debug
      issues by tracing a model's datasets and dependencies, and logged predictions with their ground
      truth help monitor model quality [^1]. Versioning does not reduce the compute quota a pipeline
      needs; quota is planned separately [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
        locator: 'Managing ML Projects: ML pipelines, secs. Assets and metadata storage'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/pipelines#q2
      url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-062
    type: true_false
    difficulty: easy
    question: When choosing hardware to serve predictions, you should always choose more powerful hardware than was used to train the model.
    options:
      - text: 'True'
        why: Serving usually needs less compute than training, so it is common to serve on smaller hardware than the model was trained on.
      - text: 'False'
        correct: true
    explanation: |
      Training and serving may run on the same or on different hardware, but in general it is common to
      train on bigger hardware and serve on smaller hardware [^1]. Hardware is chosen per pipeline by
      asking what the model's size and architecture need and whether cheaper hardware would do [^1].
      Training is usually the heavier job: it passes over the whole dataset many times and computes
      gradients, while serving runs one forward pass per request.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/production
        locator: 'Managing ML Projects: Productionization, sec. Provisioning compute resources'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/production#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/production
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-063
    type: multiple
    difficulty: medium
    question: Logging and monitoring are set up across a production ML system. Which of these should they be able to detect? Select all that apply.
    options:
      - text: Skews or drifts in the serving data compared with the training data
        correct: true
      - text: A jump in a proxy for model quality, such as the share of mail that users move to spam
        correct: true
      - text: Quota usage that is about to reach its limit
        correct: true
      - text: Whether each prediction was right, by checking it against its true label in real time
        why: In production the true labels usually arrive late or not at all, so correctness cannot be checked in real time; that is why quality is tracked through proxies.
    explanation: |
      Logging and monitoring let you find problems in ML pipelines before they affect users [^1]. They
      should catch skews or drifts in serving data, features and predictions, data-type problems, quota
      usage and model-quality metrics [^1]. In production you usually do not have the ground truth in
      real time, so model quality is tracked through proxies: a mail app cannot know which mail is spam
      as it arrives, but a jump in the share of mail users move to spam, say from 0.5% to 3%, signals a
      problem [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/production
        locator: 'Managing ML Projects: Productionization, sec. Logging, monitoring, and alerting'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/production#q2
      url: https://developers.google.com/machine-learning/managing-ml-projects/production
    status: reviewed
    reviewed_by: claude
  - id: ml-basics-064
    type: single
    difficulty: easy
    question: The model recommends a shopping app to a user because they recently installed a similar app. What kind of filtering is this an example of?
    options:
      - text: Content-based filtering
        correct: true
      - text: Collaborative filtering
        why: Collaborative filtering takes other users into consideration. In the given scenario we only care about one user.
    explanation: |
      Content-based filtering recommends items similar to what the user already likes, using item
      features and that user's own actions, without information about other users [^1]. Installing an
      app that is similar to the recommended one is such a signal. Collaborative filtering instead uses
      similarities between users and items at the same time, so it can recommend an item to one user
      because a similar user liked it [^2].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/recommendation/content-based/basics
