  - id: ml-basics-084
    type: single
    difficulty: easy
    tags:
      - overfitting
      - bias-variance
    question: Which of the following corresponds most closely to overfitting?
    options:
      - text: High bias
        why: High bias, consistently learning the same wrong thing, corresponds to underfitting [^1].
      - text: Breaking the golden rule
        why: Letting test data influence training makes the test score misleadingly optimistic; that is a flaw in the evaluation, not the definition of overfitting [^2].
      - text: Low model complexity
        why: Overly simple models underfit; overfitting comes with high complexity [^1].
      - text: High variance
        correct: true
    explanation: |
      The course defines variance as the tendency to learn random things irrespective of the real
      signal, and states that high variance corresponds to overfitting, while high bias corresponds
      to underfitting [^1]. An overfitting model encodes random quirks of its training sample, so
      a different sample would give a noticeably different model: low training error but a large
      gap to the validation error [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Bias vs variance tradeoff'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
