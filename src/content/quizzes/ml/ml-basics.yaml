  - id: ml-basics-135
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - dimensionality-reduction
      - unsupervised-learning
    question: |
      A factory collects sensor logs from its machines. Which of these uses of the logs is unsupervised
      learning?
    options:
      - text: Compressing the logs into 3 numbers that keep most of their variation
        correct: true
      - text: Predicting each machine's failure date from logs labeled with its past failures
        why: The recorded failure dates are targets supplied with the data, so this is supervised learning.
      - text: Learning a maintenance plan from the rewards it earns for avoided breakdowns
        why: Learning from rewards for actions is reinforcement learning.
      - text: Sorting logs into normal or faulty, using labels assigned by the engineers
        why: Engineer-assigned labels are provided targets, so this is supervised classification.
    explanation: |
      Unsupervised learning has no provided targets and learns only from the structure of the inputs;
      besides clustering, dimensionality reduction — finding a few numbers that keep the important
      variation of the data — is a standard example [^1][^2][^3]. Compressing the logs needs nothing
      but the logs themselves, whereas recorded failures and engineer labels make a task supervised,
      and rewards for actions make it reinforcement learning [^1].
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 6; Lecture 1, slides 17, 21–22
      - source: d2l
        locator: Sec. 1.3.2 Unsupervised and Self-Supervised Learning
