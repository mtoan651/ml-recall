        why: Regression outputs a continuous number, not a category.
      - text: Clustering
        why: Clustering groups unlabeled data; here the two categories are fixed in advance.
      - text: Dimensionality reduction
        why: It compresses features; it does not assign a label.
    explanation: The output is one of two discrete categories, so this is (binary) classification [^1][^2].
