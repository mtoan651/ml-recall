    type: single
    difficulty: easy
    shuffle: false
    question: Predicting the amount of rainfall in a region based on various cues is a ______ problem.
    options:
      - text: Supervised learning
        correct: true
      - text: Unsupervised learning
      - text: Clustering
      - text: None of the above
    explanation: |
      The amount of rainfall is a numeric target learned from past cases whose outcome is known, so
      this is supervised learning, specifically regression. d2l even lists rainfall amount as a
      typical regression question [^1]. Clustering is an unsupervised task with no target to predict
      [^2].
