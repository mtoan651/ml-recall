  - id: ml-basics-092
    type: multiple
    difficulty: medium
    tags:
      - cross-validation
      - fundamental-tradeoff
      - underfitting
      - overfitting
    question: |
      Which statements about cross-validation, underfitting and overfitting are true? Select all
      that apply.
    options:
      - text: $k$-fold cross-validation calls `fit` $k$ times
        correct: true
      - text: Cross-validation gives a more robust estimate of model performance than a single split
        correct: true
      - text: If the mean training accuracy is much higher than the mean cross-validation accuracy, the model is likely overfitting
        correct: true
      - text: The fundamental trade-off says that as training error goes down, validation error goes up
        why: 'The trade-off is about the *gap*: as complexity grows, training error tends to fall while the validation-minus-training gap tends to grow; validation error itself can still go down [^2].'
      - text: A decision stump on a complicated classification problem is likely to underfit
        correct: true
    explanation: |
      In $k$-fold cross-validation each of the $k$ folds takes a turn as validation set, so the model
      is fit $k$ times, and the $k$ scores give a more robust estimate than one split [^1]. A big gap
      between training and validation scores is the sign of overfitting, while a model that is too
      simple, such as a decision stump (a tree with one split) on a hard problem, underfits [^2]. The
      fundamental trade-off states that as complexity increases, $E_\text{train}$ tends to go down
      but $E_\text{valid} - E_\text{train}$ tends to go up [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Cross-validation to the rescue!!'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Underfitting; Overfitting; The "fundamental tradeoff" of supervised learning'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
    source:
