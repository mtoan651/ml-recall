  - id: ml-basics-088
    type: multiple
    difficulty: easy
    tags:
      - problem-framing
      - rule-based-systems
    question: Which of these problems are suitable for machine learning? Select all that apply.
    options:
      - text: Checking that a university email address ends with "@student.ubc.ca" before allowing login
        why: This is a clear, deterministic rule that a few lines of code check exactly; the course recommends rule-based systems for such logic [^1].
      - text: Deciding which students get a scholarship based on their personal essays
        why: This involves judgement, ethics and ambiguity that cannot be formalized easily, where the course recommends relying on human expertise [^1].
      - text: Predicting which songs you will like from your listening history
        correct: true
      - text: Detecting plagiarism by checking whether two essays are exactly identical
        why: An exact-match comparison is a simple deterministic rule; no learning is needed [^1].
      - text: Automatically tagging friends in uploaded photos
        correct: true
    explanation: |
      The course's rule of thumb: use machine learning when you have lots of complex data and the
      decision rules are unknown, fuzzy or too complicated to write down; use rule-based systems
      when the logic is clear, deterministic and stable; and rely on human expertise for problems
      involving ethics, creativity, emotion or ambiguity [^1]. Music preferences and face
      recognition have no explicit rules but plenty of examples to learn from, so they suit ML;
      recommendation systems and face recognition are among the course's examples of ML in
      practice [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 1: Course Introduction — Supervised machine learning, Examples (closing summary)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/01_intro.ipynb
