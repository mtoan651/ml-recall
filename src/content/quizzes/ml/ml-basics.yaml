  - id: ml-basics-094
    type: single
    difficulty: medium
    tags:
      - optimization-bias
      - validation-set
      - small-data
    question: |
      You receive one tenth of a dataset. Because it is small, you split it into 96% training and 4%
      validation data, tune many hyperparameter settings on that single validation split, and report
      a validation accuracy of 0.97. Would the tuned model classify the rest of the data with similar
      accuracy?
    options:
      - text: Probably not, since the tiny validation set was reused many times and 0.97 is likely optimistic
        correct: true
      - text: Probably yes, since 0.97 was measured on data the model was not trained on
        why: The validation data never went into `fit`, but it did choose the hyperparameters, so the best score among many tries is biased upward [^1].
      - text: Probably yes, since a 96% training split makes overfitting impossible
        why: A large training share does not prevent overfitting, and here the problem is overfitting the validation set [^1].
      - text: Probably not, since a model tuned on a tenth of the data can never generalize
        why: Small datasets can still give useful models; the problem is that this evaluation cannot be trusted [^2].
    explanation: |
      The validation split holds only 4% of a tenth of the data, so its accuracy is very noisy, and
      picking the best of many hyperparameter settings on it rewards settings that got lucky on
      those few examples. This is optimization bias, or overfitting the validation set: it grows
      with the number of settings tried and shrinks with the size of the validation set [^1]. A
      reported 0.97 is therefore likely an overestimate, which is why a separate test set, used once,
      or more data is needed before trusting the number [^2]. (The course credits this example to
      Mark Schmidt's notes.)
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Optimization bias/Overfitting of the validation set'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Why do we need a test set?; Large datasets solve many of these problems'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
    source:
