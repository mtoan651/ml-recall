  - id: ml-basics-126
    type: multiple
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - hyperparameters
    question: |
      You train an MLP with mini-batch gradient descent. Which of these are **hyperparameters**
      rather than learned parameters? Select all that apply.
    options:
      - text: The learning rate
        correct: true
      - text: The mini-batch size
        correct: true
      - text: The bias vector of the hidden layer
        why: Biases are adjusted by the optimizer from the training data, so they are learned parameters.
      - text: The weight matrix of the first layer
        why: Weights are exactly what training estimates; they are parameters, not hyperparameters.
    explanation: |
      Parameters (weights and biases) are the numbers the training loop updates to reduce the loss.
      Hyperparameters are settings chosen by the user that control the model or the training
      procedure and are not updated by the training loop — such as the learning rate and the
      mini-batch size [^1][^2]. They are tuned on validation data instead.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 44, 54
