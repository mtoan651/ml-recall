      - classification
      - supervised-learning
    question: |
      A bank trains a model on past loan applications, each stored together with whether the loan was
      repaid or not, and then uses it to flag risky new applications. What kind of problem is this?
    options:
      - text: Supervised classification
        correct: true
      - text: Supervised regression
        why: The recorded outcome is one of two categories (repaid or defaulted), not a continuous number.
      - text: Unsupervised clustering
        why: Every training example comes with a known outcome, so the learning is supervised.
      - text: Reinforcement learning
        why: The model does not act in an environment and collect rewards.
    explanation: |
      Each training input is paired with an observed outcome, so the learning signal is supervised [^1].
      That outcome is a category — repaid or defaulted — so the prediction task is classification
      [^1][^2].
