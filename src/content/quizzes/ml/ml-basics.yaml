  - id: ml-basics-095
    type: multiple
    difficulty: medium
    tags:
      - recommender-systems
      - utility-matrix
      - collaborative-filtering
      - cold-start
    question: |
      Which statements about recommender systems built from a user-item utility matrix of ratings
      are true? Select all that apply.
    options:
      - text: The validation utility matrix has the same shape as the training utility matrix
        correct: true
      - text: RMSE perfectly captures what we want from a recommender system
        why: The best RMSE need not give the best recommendations; there is no ground truth of "perfect" recommendations, and diversity, simplicity and maintainability also matter [^3].
      - text: It is reasonable to fill a missing rating with the average rating that similar users gave the item
        correct: true
      - text: For a user who has not rated anything yet, recommending the most popular items is a reasonable fallback
        correct: true
    explanation: |
      The ratings, not the matrix, are split into training and validation sets, and both utility
      matrices have one row per user and one column per item; they only differ in which entries
      are filled [^1]. $k$-nearest-neighbour imputation predicts a missing rating from the ratings
      that the most similar users gave, a simple form of collaborative filtering [^2]. A new user has
      no ratings to find neighbours with, so popular items are a sensible default. RMSE is a
      convenient way to compare methods, but it is not the whole story [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Creating utility matrix; Evaluation (data splitting)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Baseline Approaches (k-nearest neighbours imputation)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 16: Recommender Systems — Beyond error rate in recommendation systems'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/16_recommender-systems.ipynb
