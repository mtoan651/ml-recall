  - id: ml-basics-089
    type: multiple
    difficulty: easy
    tags:
      - supervised-learning
      - unsupervised-learning
    question: Which of these are examples of supervised machine learning? Select all that apply.
    options:
      - text: Finding groups of similar properties in a real-estate dataset
        why: There is no target to predict; grouping similar examples is unsupervised learning (clustering) [^1].
      - text: Predicting whether someone will have a heart attack from demographic, diet and clinical measurements
        correct: true
      - text: Grouping news articles from different sources by topic
        why: The groups are not given in advance; discovering them from the texts alone is unsupervised [^1].
      - text: Detecting credit-card fraud from examples of fraudulent and legitimate transactions
        correct: true
      - text: Given a measure of employee performance, identifying the factors most likely to influence it
        correct: true
    explanation: |
      Supervised learning trains on features $X$ together with targets $y$ and learns a function
      that maps one to the other; unsupervised learning only has $X$ and groups or summarizes it [^1].
      Heart-attack and fraud prediction come with labeled outcomes. The employee example is
      supervised too: the performance measure is the target, and the influential factors are found
      by fitting a model of performance and examining which features drive its predictions, as
      with feature importances [^2]. The real-estate and news examples have no target, so they are
      clustering problems [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — Supervised learning vs. Unsupervised learning'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
