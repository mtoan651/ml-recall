  - id: ml-basics-136
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - ce6146-l01
      - self-supervised-learning
    question: |
      A model is trained on millions of unlabeled sentences: in each one a word is hidden, as in
      "The ___ barked at the mail carrier", and the model must predict it. Where does the target of each
      training example come from?
    options:
      - text: From the word that was hidden in the original sentence
        correct: true
      - text: From an annotator who writes down the correct word for every sentence
        why: No human labeling is needed — the word is already in the text.
      - text: From a reward that the environment returns after each guess
        why: That is reinforcement learning; here the correct answer is known from the data.
      - text: From a cluster assignment computed before training
        why: No clustering is involved; the target is a concrete word.
    explanation: |
      This is self-supervised learning: one part of the raw data (the hidden word) serves as the target
      for another part (its context), so unlabeled text supplies its own supervision [^1][^2].
      Next-word prediction works the same way, with the following word as the target.
    references:
      - source: ncu-intro-dl
        locator: Exercise 1, question 7; Lecture 1, slides 22, 25
      - source: d2l
