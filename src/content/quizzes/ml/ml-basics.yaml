  - id: ml-basics-116
    type: single
    difficulty: medium
    tags:
      - evaluation
      - forecasting
      - choice-of-target
    question: |
      A model predicts a cryptocurrency's price one day ahead from the current price, the price change
      over the last 24 hours and the last hour, the volume traded in 24 hours, and the number of
      recent tweets. Over the past year the price moved by more than \$100, yet the model's average
      error is under \$1. What is the main problem with buying whenever it predicts a rise?
    options:
      - text: Tomorrow's price is close to today's, so a small error proves little
        correct: true
      - text: Target leakage, because the current price is not known when the prediction is made
        why: The current price is known at prediction time, and none of the features change after the target is set, so there is no leakage [^1].
      - text: Train-test contamination, because the tweet counts mix training and test periods
        why: The tweet counts cover the 24 hours before each prediction, which are available at that moment [^1].
      - text: An error that small cannot be real, so the price data must be corrupted
        why: A small error is expected when the price moves gradually; it comes from predicting roughly today's price [^1].
    explanation: |
      There is no leakage: every feature is available when the prediction is made [^1]. But if the
      price moves gradually, predicting today's price for tomorrow already gives a small error, while
      saying nothing about whether the price is going up or down [^1]. A better target is the change in
      price over the next day; if a model predicts that change reliably, it may be useful for
      investing [^1].
    references:
      - source: kaggle-learn
        locator: Intermediate Machine Learning, Lesson 7 exercise, Step 3 Getting Rich With Cryptocurrencies? (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/ml_intermediate/ex7.py
