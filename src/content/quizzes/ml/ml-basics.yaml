questions:
  - id: ml-basics-001
    type: single
    difficulty: easy
    question: What is the technical difference between classical ML and deep learning?
    options:
      - text: classical ML was invented first
        why: When a family of methods appeared says nothing about how it works; the technical difference lies in the model, many-layered neural networks [^1][^2].
      - text: the use of neural networks
        correct: true
      - text: deep learning is used in robots
        why: Robots use classical ML as well as deep learning, so the application area is not a technical difference between the two.
    explanation: |
      Deep learning is the part of machine learning built on neural networks with many layers, which
      learn several layers of representations jointly from data [^1][^2]. Microsoft's ML-For-Beginners
      curriculum, which teaches "classical" machine learning, deliberately leaves neural networks and
      deep learning out [^1]. Which approach came first, or whether robots use it, is not a technical
      difference between the two.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
        locator: 'Lesson: Introduction to Machine Learning, What we will not cover'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#the-essence-of-deep-learning
        locator: Sec. 1.7 The Essence of Deep Learning
    source:
      id: ms-ml-for-beginners
      ref: quiz-1/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
