  - id: ml-basics-083
    type: single
    difficulty: easy
    tags:
      - hyperparameter-optimization
      - random-search
      - grid-search
    question: What is a key advantage of randomized hyperparameter search over exhaustive grid search?
    options:
      - text: It is guaranteed to find the best hyperparameters
        why: Random samples can miss the best combination; no search over a finite budget comes with such a guarantee [^1].
      - text: It always reaches a higher accuracy than grid search
        why: Neither method always wins; random search is usually faster for a similar result, not guaranteed to be better [^1].
      - text: It explores a large search space within a fixed budget of trials
        correct: true
      - text: Unlike grid search, it also works for regression
        why: Both searches work with any estimator and score, for classification and regression alike [^1].
    explanation: |
      Grid search evaluates every combination, so its cost grows exponentially with the number of
      hyperparameters: 5 hyperparameters with 10 values each already need $10^5$ cross-validation
      runs [^1]. Randomized search samples configurations until a budget (`n_iter`) is used up. It is
      faster, adding a hyperparameter that does not matter does not waste trials, and it works well
      when some hyperparameters are much more important than others, because every trial tries a
      new value of the important ones [^1][^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 8: Hyperparameter Optimization and Optimization Bias — Problems with exhaustive grid search; Advantages of RandomizedSearchCV'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/08_hyperparameter-optimization.ipynb
      - title: Bergstra & Bengio (2012), Random Search for Hyper-Parameter Optimization, JMLR 13
        locator: Sec. 1 Introduction, Fig. 1
        url: https://www.jmlr.org/papers/volume13/bergstra12a/bergstra12a.pdf
    source:
