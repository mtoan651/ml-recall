  - id: clustering-032
    type: short_answer
    difficulty: easy
    tags:
      - k-means
      - lloyd-algorithm
    question: |
      K-means with $k = 2$ runs on the 1-D points $1, 2, 3, 8, 9, 10$, starting from the centroids $2$
      and $3$. After the first assignment step and the first centroid update, what is the value of the
      second (larger) centroid?
    answer:
      numeric: 7.5
      tolerance: 0.001
      hint: a number
      model: Points 1, 2 go to centroid 2 and points 3, 8, 9, 10 to centroid 3, so the new centroids are 1.5 and 7.5
    explanation: |
      Each iteration assigns every point to its nearest centroid and then moves each centroid to the
      mean of its points [^1][^2]. Points 1 and 2 are nearest to 2, and 3, 8, 9, 10 to 3, so the means
      are $1.5$ and $(3+8+9+10)/4 = 7.5$. In the next iteration 3 moves to the first cluster, giving the
      centroids 2 and 9, after which the assignments stop changing.
    references:
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
      - source: ds-interviews
        locator: theory.md, Clustering — "Do you know how K-means works?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#clustering
    source:
      id: ds-interviews
      ref: theory.md#q135
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#clustering
    status: draft
  - id: clustering-033
    type: short_answer
    difficulty: easy
    tags:
      - k-medoids
      - robustness
      - outliers
    question: |
      A cluster contains the 1-D points $1, 2, 3, 4, 100$. Its k-means centre is their mean, 22. The
      k-medoids method instead uses the data point with the smallest total absolute distance to the other
      points. Which point is the medoid?
    answer:
      numeric: 3
      tolerance: 0
      hint: one of the data points
      model: 3 — its total distance is $2 + 1 + 1 + 97 = 101$, the smallest of the five points
    explanation: |
      A medoid must be an actual data point that minimizes the sum of dissimilarities to the others
      [^1]. The totals are 105 (for 1), 102 (2), 101 (3), 102 (4) and 390 (100), so the medoid is 3.
      The outlier drags the mean to 22, far from all the typical points, while the medoid barely moves;
      this is why k-medoids is more robust to outliers and noise than k-means [^1][^2].
    references:
      - title: 'Wikipedia: k-medoids'
        url: https://en.wikipedia.org/wiki/K-medoids#Comparison_to_k-means_clustering
        locator: Introduction and section "Comparison to k-means clustering"
      - source: ds-interviews
        locator: theory.md, Clustering — "What are the other clustering algorithms do you know?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#clustering
    source:
      id: ds-interviews
      ref: theory.md#q137
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#clustering
    status: draft
  - id: clustering-034
    type: short_answer
    difficulty: medium
    tags:
      - dbscan
      - core-points
      - density
    question: |
      DBSCAN runs on the 1-D points $1, 2, 3, 6, 10, 11, 12, 13$ with $\varepsilon = 1$ and
      `min_samples` $= 3$, where a point's $\varepsilon$-neighbourhood includes the point itself. How
      many **core** points are there?
    answer:
      numeric: 3
      tolerance: 0
      hint: a whole number
      model: 3 — the points 2, 11 and 12 each have 3 points within distance 1
    explanation: |
      A core point has at least `min_samples` points (itself included) within $\varepsilon$ [^1]. Point
      2 has $\{1,2,3\}$, 11 has $\{10,11,12\}$ and 12 has $\{11,12,13\}$; every other point has at most 2.
      Points 1, 3, 10 and 13 are border points: within $\varepsilon$ of a core point but not core
      themselves; 6 is noise [^1][^2]. Note that "directly density-reachable" requires the starting
      point to be a core point, not just a distance below $\varepsilon$ [^2].
    references:
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#dbscan
        locator: Sec. 2.3.7 DBSCAN
      - title: 'Wikipedia: DBSCAN'
        url: https://en.wikipedia.org/wiki/DBSCAN#Preliminary
        locator: Section "Preliminary" (core points, directly reachable, noise)
    source:
      id: ds-interviews
      ref: theory.md#q138
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#clustering
