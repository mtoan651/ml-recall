      ref: lectures/notes/06_topic-modeling.ipynb#ex6-discussion1
      url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/06_topic-modeling.ipynb
