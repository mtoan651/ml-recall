  - id: clustering-035
    type: single
    difficulty: medium
    tags:
      - k-means
      - feature-scaling
    question: |
      Before you run k-means to create cluster features, which set of features should you definitely
      *not* rescale?
    options:
      - text: Latitude and longitude of cities
        correct: true
      - text: Number of doors and horsepower of cars
        why: These have unrelated units; unscaled, horsepower (in the hundreds) would swamp the door count (2 or 4) in the distances [^1].
      - text: Height and weight of people
        why: Height and weight are on scales that are not comparable, which is the textbook case for rescaling [^1].
      - text: Lot area and living area of houses
        why: Either choice is reasonable here; rescaling stops lot area from dominating the clustering out of proportion to its effect on price [^1].
    explanation: |
      k-means groups points by straight-line (Euclidean) distance, so it is sensitive to scale:
      features with larger values get more weight [^2]. Features that are already directly comparable
      should not be rescaled, while features on incomparable scales usually should [^1]. Latitude and
      longitude together describe real geographic distances, and rescaling them would distort those
      natural distances, so they are left as they are [^1].
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 4 exercise, Question 1 Scaling Features (text and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/feature_engineering_new/ex4.py
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 4 Clustering with k-Means — tutorial, k-Means Clustering
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut4.ipynb
    source:
      id: kaggle-learn
      ref: feature_engineering_new/ex4#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/ex4.ipynb
