  - id: clustering-025
    type: multiple
    difficulty: medium
    tags:
      - hierarchical-clustering
      - clustering-evaluation
      - silhouette
    question: |
      Which statements about hierarchical clustering and evaluating clusterings are true? Select all
      that apply.
    options:
      - text: In hierarchical clustering we do not have to worry about initialization
        correct: true
      - text: Hierarchical clustering can only be applied to small datasets, because dendrograms are hard to visualize for large ones
        why: Large dendrograms can be truncated for display, and flat cluster labels can be extracted without plotting the dendrogram at all [^1].
      - text: K-Means, DBSCAN and hierarchical clustering each have a setting that controls how coarse or fine the clustering is
        correct: true
      - text: To get a robust clustering, you can combine the labels of several clustering methods by majority vote
        why: Cluster labels are arbitrary names, so cluster 1 of one method need not match cluster 1 of another; voting on raw labels is meaningless [^2].
      - text: A high silhouette score with clean, stable clusters means the clusters capture the meaning you are interested in
        why: Clusters can be clean and robust and still not capture the aspect you care about; manual inspection is unavoidable [^2].
    explanation: |
      Agglomerative clustering starts from single points and merges greedily, with no random
      initialization; cutting the dendrogram at different heights controls the number of clusters,
      just as K does in K-Means and `eps`/`min_samples` do in DBSCAN [^1][^3]. Evaluating
      clusterings is hard: the labels themselves are meaningless, the silhouette score gives only
      some intuition, and even consistent results across methods need not reflect the structure
      you care about [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — Hierarchical clustering (Introduction, Dendrogram, Truncation)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — A few comments on clustering evaluation'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — More details on DBSCAN (effect of eps and min_samples)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
