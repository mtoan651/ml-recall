  - id: clustering-038
    type: single
    difficulty: hard
    tags:
      - spectral-clustering
      - k-means
      - fixed-point
    question: |
      Ten points form a vertical column $(0, \pm1), (0, \pm3), (0, \pm5)$ and a horizontal row
      $(2, 0), (4, 0), (6, 0), (8, 0)$. Spectral clustering on a 2-nearest-neighbour graph returns the
      column and the row as its two clusters. Could $k$-means ($k = 2$) end with this same partition?
    options:
      - text: Yes, from a suitable initialization every point stays with its own centroid
        why: With centroids $(0, 0)$ and $(5, 0)$, the point $(2, 0)$ is 2 from the first and 3 from the second, so $k$-means would move it.
      - text: No, $(2, 0)$ is nearer the column's centroid $(0, 0)$ than the row's $(5, 0)$
        correct: true
      - text: No, $(0, \pm 5)$ are closer to the row's centroid than to the column's
        why: $(0, 5)$ is 5 from $(0, 0)$ and about 7.07 from $(5, 0)$, so it stays with the column.
      - text: Yes, because $k$-means and spectral clustering optimize the same objective
        why: $k$-means minimizes distances to centroids; spectral clustering cuts a similarity graph, and the two can disagree.
    explanation: |
      A $k$-means solution must be a fixed point: every point is closest to the centroid of its own
      cluster [^2]. The column's centroid is $(0, 0)$ and the row's is $(5, 0)$; the point $(2, 0)$ is at
      distance 2 from the first and 3 from the second, so this partition is not a fixed point [^1].
      Spectral clustering instead follows the neighbourhood graph: the only links between the groups
      run from $(2, 0)$ to $(0, \pm 1)$, so a random walk rarely crosses them [^1] [^3].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2004) solutions, Problem 3, parts 2–3
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
      - title: 'Wikipedia: k-means clustering'
        locator: Algorithms — Standard algorithm (naive k-means)
        url: https://en.wikipedia.org/wiki/K-means_clustering#Standard_algorithm_(naive_k-means)
      - title: 'Wikipedia: Spectral clustering'
        locator: Relationship with other clustering methods — Relationship with k-means
        url: https://en.wikipedia.org/wiki/Spectral_clustering#Relationship_with_k-means
    source:
      id: mit-ocw-6867
      ref: final_f04soln#q3.3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
    status: draft
