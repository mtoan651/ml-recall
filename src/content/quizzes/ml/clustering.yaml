  - id: clustering-024
    type: multiple
    difficulty: medium
    tags:
      - dbscan
      - eps
      - min-samples
      - outliers
    question: |
      Which statements about DBSCAN (hyperparameters `eps`, the neighbourhood radius, and
      `min_samples`) are true? Select all that apply.
    options:
      - text: With a tiny `eps` and `min_samples` = 1, DBSCAN is likely to put each point in its own cluster
        correct: true
      - text: With a smaller `eps` and a larger `min_samples`, DBSCAN is likely to end up with one big cluster
        why: Both changes make it *harder* to be a core point, so you get more noise points and smaller or fewer clusters, not one big cluster [^2].
      - text: K-Means is more affected by outliers than DBSCAN
        correct: true
      - text: In DBSCAN, every point in a cluster must itself have at least `min_samples` neighbours (itself included) within `eps`
        why: Only *core* points need that many neighbours; border points belong to a cluster because they are within `eps` of a core point [^1].
    explanation: |
      A core point has at least `min_samples` points within distance `eps`; border points are within
      `eps` of a core point but have fewer neighbours; everything else is noise [^1]. With
      `min_samples = 1` every point is a core point, and with a tiny `eps` no two points are close,
      so each point forms its own cluster. Larger `eps` merges more points, while larger
      `min_samples` labels points in sparse regions as noise [^2]. Unlike K-Means, which must assign
      every point, outliers included, to some cluster, DBSCAN can leave outliers unassigned [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — DBSCAN, How does it work? (core, border and noise points)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — More details on DBSCAN (effect of eps and min_samples)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — K-Means vs. DBSCAN; Summary: Pros and cons'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
    source:
