  - id: clustering-021
    type: multiple
    difficulty: easy
    tags:
      - k-means
      - initialization
      - convergence
    question: |
      Think about how K-Means gets from its initial centers to its final clusters. Which statements
      hold? Select all that apply.
    options:
      - text: K-Means is sensitive to initialization, so its solution may change with the initial centers
        correct: true
      - text: K-Means stops when the number of clusters no longer increases between iterations
        why: The number of clusters is fixed at K from the start; it never changes during the run [^1].
      - text: K-Means stops when the centroids no longer move between iterations (or after a maximum number of iterations)
        correct: true
      - text: K-Means is guaranteed to find the optimal clustering
        why: K-Means always converges, but possibly to a sub-optimal solution, depending on where it started [^2].
    explanation: |
      K-Means repeats two steps, assigning points to the nearest center and recomputing each center
      as the mean of its points, until the centers stop changing or a maximum number of iterations
      is reached [^1]. It always converges, but only to a local solution that depends on the random
      initial centers; running it several times or using K-Means++ initialization helps [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — K-Means algorithm'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — K-Means example (convergence); Initialization of K-Means'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
    source:
