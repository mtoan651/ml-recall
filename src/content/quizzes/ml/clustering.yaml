topic: clustering
title: Clustering
questions:
  - id: clustering-001
    type: single
    difficulty: easy
    question: 'Clustering is a type of:'
    options:
      - text: supervised learning
      - text: unsupervised learning
        correct: true
      - text: reinforcement learning
    explanation: |
      Clustering assumes the data are unlabelled: there are no target outputs, and the algorithm
      groups the points using patterns it finds on its own. Learning without labels is what makes
      it unsupervised [^1]. Supervised learning needs labelled examples that show the correct
      output. Reinforcement learning learns by trying to maximise a reward signal. Clustering uses
      neither labels nor rewards [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md
        locator: 'Lesson: Introduction to Clustering (opening paragraph)'
      - title: 'Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Sec. 1.1 Reinforcement Learning, p. 2
    source:
      id: ms-ml-for-beginners
      ref: quiz-27/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-002
    type: single
    difficulty: easy
    question: 'A good Silhouette score means:'
    options:
      - text: clusters are well-separated and well-defined
        correct: true
      - text: there are few clusters
      - text: there are many clusters
    explanation: |
      For each sample, the silhouette coefficient compares $a$, its mean distance to the other
      points in its own cluster, with $b$, its mean distance to the points of the nearest other
      cluster: $s = (b - a)/\max(a, b)$. The score of a clustering is the average over all samples [^2].
      Scores range from $-1$ to $1$. Values near 1 mean dense clusters that are well separated from
      their neighbours, and values near 0 mean the clusters overlap [^1][^2]. The score does not
      count clusters. In fact, it is often computed for several values of $k$ to help choose how
      many clusters to use [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#silhouette-score
        locator: "Lesson: K-Means Clustering, section 'Silhouette score'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#silhouette-coefficient
        locator: Sec. 2.3.11.5 Silhouette Coefficient
    source:
      id: ms-ml-for-beginners
      ref: quiz-29/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-003
    type: single
    difficulty: easy
    question: 'A Voronoi diagram shows:'
    options:
      - text: a cluster's variance
      - text: a cluster's seed and its region
        correct: true
      - text: a cluster's inertia
    explanation: |
      K-means assigns every point to its nearest centroid, which cuts the space into one cell per
      centroid. A Voronoi diagram draws exactly this: each seed point together with the region of
      space closest to it [^1]. Each Voronoi cell is one cluster. K-means alternates between
      computing these cells and moving each centroid to the mean of its cell [^2]. Variance and
      inertia are single numbers that summarise how spread out the points are. A map of regions
      does not show them [^1][^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
        locator: "Lesson: K-Means Clustering, sections 'Introduction' (Voronoi diagrams) and 'Variance'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
      ref: quiz-30/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-004
    type: single
    difficulty: medium
    question: Inertia is
    options:
      - text: a measure of how internally coherent clusters are
        correct: true
      - text: a measure of how much clusters move
      - text: a measure of cluster quality
    explanation: |
      Inertia is the within-cluster sum of squares, $\sum_i \min_j \lVert x_i - \mu_j \rVert^2$,
      which is the quantity k-means tries to minimise. scikit-learn calls it a measure of how
      internally coherent the clusters are [^1][^2]. It is narrower than a general "quality" score:
      it is not normalised (lower is better and zero is optimal, but there is no fixed scale), and
      it assumes convex, isotropic clusters, so it handles elongated or irregular shapes poorly [^2].
      It also does not measure how far centroids move. That movement is what the algorithm checks
      to decide when to stop iterating [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#exercise---build-a-model
        locator: "Lesson: K-Means Clustering, section 'Exercise - build a model' (Inertia note)"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
      ref: quiz-30/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-005
    type: true_false
    difficulty: easy
    question: Using K-Means, you must first determine the value of 'k'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      The number of clusters $k$ is an input to k-means. The algorithm starts by choosing $k$
      initial centroids, so $k$ must be fixed before it runs [^1][^2]. The lesson calls this a
      drawback of k-means and uses the elbow method (plotting inertia against $k$) to choose a
      sensible value [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
        locator: "Lesson: K-Means Clustering, sections 'Introduction' and 'Elbow method'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
      ref: quiz-30/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-006
    type: single
    difficulty: medium
    question: 'The K-means algorithm:'
    options:
      - text: Requires the dimension of the feature space to be no bigger than the number of samples
      - text: Has the smallest value of the objective function when K = 1
      - text: Minimizes the within class variance for a given number of clusters
        correct: true
      - text: Converges to the global optimum if and only if the initial means are chosen as some of the samples themselves
    explanation: |
      For a fixed number of clusters $K$, k-means minimises the inertia
      $\sum_i \min_j \lVert x_i - \mu_j \rVert^2$, the squared distance of each point to its
      cluster mean. This is the within-cluster variance [^1]. With $K = 1$ every point is measured
      from the overall mean, which gives the *largest* value of this objective. Adding a centroid
      can never make the best achievable sum larger. The objective is non-convex, so k-means only
      converges to a local minimum that depends on the starting centroids. This holds even when
      the starting centroids are chosen from the samples, which is the basic initialisation [^1][^2].
      The steps (assign each point to its nearest centroid, recompute the means) work in any
      number of dimensions, so there is no requirement linking the feature dimension to the number
      of samples [^1].
    references:
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Ch. 10 Clustering and the k-means algorithm, p. 149
    source:
      id: mmlu-redux
      ref: machine_learning/18
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=18
    status: draft
  - id: clustering-007
    type: single
    difficulty: medium
    shuffle: false
    question: Which of the following are the spatial clustering algorithms?
    options:
      - text: Partitioning based clustering
      - text: K-means clustering
      - text: Grid based clustering
      - text: All of the above
        correct: true
    explanation: |
      Spatial clustering groups objects by their locations, and several families of algorithms
      are used for it. Partitioning methods split the data into $k$ groups. Ng and Han built
      CLARANS, a spatial data-mining algorithm, on k-medoid partitioning [^1], and the STING paper
      describes it as the first work to bring clustering into spatial data mining [^2]. K-means is
      the classic partitioning algorithm: it divides the samples into $K$ disjoint clusters around
      centroids [^3]. Grid-based methods such as STING store statistics for a hierarchy of spatial
      cells and cluster those cells instead of the individual points [^2][^4]. Every listed
      approach is therefore a spatial clustering method. Note that k-means is itself a
      partitioning method, so two of the options overlap.
    references:
      - title: Ng & Han (1994), Efficient and Effective Clustering Methods for Spatial Data Mining, VLDB
        url: https://www.vldb.org/conf/1994/P144.PDF
        locator: Sec. 1 Introduction; Sec. 2 Clustering Algorithms based on Partitioning
      - title: 'Wang, Yang & Muntz (1997), STING: A Statistical Information Grid Approach to Spatial Data Mining, VLDB'
        url: https://www.vldb.org/conf/1997/P186.PDF
        locator: Abstract; Sec. 2.2.1 CLARANS; Sec. 3
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#clustering-algorithms
        locator: "Lesson: Introduction to Clustering, section 'Clustering algorithms' (Grid-based clustering)"
    source:
      id: mmlu-redux
      ref: machine_learning/38
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=38
    status: draft
  - id: clustering-008
    type: single
    difficulty: medium
    question: Suppose we would like to perform clustering on spatial data such as the geometrical locations of houses. We wish to produce clusters of many different sizes and shapes. Which of the following methods is the most appropriate?
    options:
      - text: Decision Trees
      - text: Density-based clustering
        correct: true
      - text: Model-based clustering
      - text: K-means clustering
    explanation: |
      Density-based methods such as DBSCAN define clusters as dense regions separated by sparse
      ones. Clusters can therefore have any shape and very different sizes, and isolated points
      are labelled as noise [^1][^2]. K-means assumes convex clusters of similar size ("flat
      geometry"), and its objective handles elongated or irregular shapes poorly [^1]. Model-based
      clustering with Gaussian mixtures also uses flat geometry: each component is an ellipsoidal
      Gaussian, which limits the shapes it can capture [^1][^2]. Decision trees are a supervised
      method that needs labels, so they are not a clustering method at all [^3].
    references:
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#dbscan
        locator: Sec. 2.3.1 Overview of clustering methods (table); Sec. 2.3.2 K-means; Sec. 2.3.7 DBSCAN
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#clustering-algorithms
        locator: "Lesson: Introduction to Clustering, sections 'Getting started with clustering' (table) and 'Clustering algorithms'"
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#decision-trees
        locator: Sec. 1.10 Decision Trees (introduction)
    source:
      id: mmlu-redux
      ref: machine_learning/98
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=98
    status: draft
  - id: clustering-009
    type: single
    question: You are calculating similarity for music videos. The length of the embedding vectors of music videos is proportional to their popularity. You switch from cosine to dot product to calculate similarity. How does similarity between music videos change?
    options:
      - text: Popular videos become **more similar** to all videos in general.
        correct: true
      - text: Popular videos only become **more similar** to other popular videos.
        why: Recall that the dot product is calculated as $|a||b|\cos(\theta)$. Assuming `a` is a popular music video, we know its embedding length, $|a|$, is larger than that of unpopular videos. The larger length increases the dot product irrespective of the value of $|b|$. Hence, popular videos become more similar to all other videos, not just other popular videos.
      - text: Popular videos become **less similar** to each other than to less popular videos.
        why: Since dot product increases with vector length, and popular videos have high vector length, the similarity measure will increase, not decrease.
      - text: No change.
        why: Dot product is affected by vector length. The high vector length of popular videos will change the (previously cosine) similarity measure.
    explanation: Since the dot product is affected by the lengths of both vectors, the large vector length of popular videos will make them more similar to all videos. [^1]
    references:
      - source: google-ml-courses
        locator: Check your understanding
        url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    source:
      id: google-ml-courses
      ref: clustering/dnn-clustering/check-your-understanding#q2
      url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    status: draft
  - id: clustering-010
    type: single
    question: Music-video embeddings have lengths proportional to the videos' popularity. You switch the similarity measure from dot product to cosine. How does similarity between music videos change?
    options:
      - text: Popular videos become **less similar** to all videos.
        correct: true
      - text: Popular videos become **more similar** to all videos.
        why: Cosine is not affected by the vector lengths, so switching from dot product will cause the similarities for all popular videos to decrease.
      - text: Popular videos become **more similar** only to each other.
        why: Cosine is not affected by the vector lengths, so switching from dot product will cause the similarities for all popular videos to decrease.
      - text: No change.
        why: Since cosine is not affected by vector length, while dot product is, switching from dot product to cosine will change similarities.
    explanation: Because cosine is not affected by vector length, the large vector length of popular video embeddings does not contribute to similarity. Thus, switching to cosine from dot product reduces the similarity between popular videos and all other videos. [^1]
    references:
      - source: google-ml-courses
        locator: Check your understanding
        url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    source:
      id: google-ml-courses
      ref: clustering/dnn-clustering/check-your-understanding#q3
      url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    status: draft
  - id: clustering-011
    type: single
    question: In the figure below, vectors `a`, `b` and `c` start at the same origin. If you want `b` to be more similar to `a` than to `c`, which similarity measure should you pick?
    figure:
      src: ./clustering/clustering-011.svg
      alt: 'Three line segments from a common origin: a long, nearly vertical one ending at point a, and two short ones ending at points b and c, close together and to the right. The angle between a and b (θab) is much larger than the angle between b and c (θbc).'
    options:
      - text: Dot product
        correct: true
      - text: Cosine
        why: The cosine depends only on the angle between vectors, and the smaller angle $\theta_{bc}$ makes $\cos(\theta_{bc})$ larger than $\cos(\theta_{ab})$.
      - text: Euclidean distance
        why: The distance $\vec{bc}$ is smaller than $\vec{ab}$, leaving `b` closer to `c` than to `a`.
    explanation: Correct! The dot product is proportional to both the cosine and the lengths of vectors. So even though the cosine is higher for the angle formed by `b` and `c` than for the angle formed by `b` and `a`, the greater vector length of `a` makes the dot product of `a` and `b` greater than the dot product of `b` and `c`. [^1]
    references:
      - source: google-ml-courses
        locator: Check your understanding
        url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    source:
      id: google-ml-courses
      ref: clustering/dnn-clustering/check-your-understanding#q1
      url: https://developers.google.com/machine-learning/clustering/dnn-clustering/check-your-understanding
    status: draft
  - id: clustering-012
    type: single
    question: Assume you have enough data to create quantiles. How should you process the data distribution shown below?
    figure:
      src: ./clustering/clustering-012.svg
      alt: Histogram that rises sharply to a peak at small values (around 3 to 4) and then falls off in a long tail to the right, reaching past 25.
    options:
      - text: Create quantiles.
        correct: true
      - text: Normalize.
        why: |
          You typically normalize data if:

          * The data distribution is Gaussian.
          * You have some insight into what the data represents in the real
          that suggests the data shouldn't be transformed nonlinearly.

          Neither case applies here. The data distribution isn't Gaussian because it isn't symmetric. And you don't know what these values represent in the real world.
      - text: Log transform.
        why: This isn't a perfect power-law distribution, so don't use a log transform.
    explanation: Correct. Because the distribution does not match a standard data distribution, you should default to creating quantiles. [^1]
    references:
      - source: google-ml-courses
        locator: Data preparation
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
      ref: clustering/prepare-data#q1
      url: https://developers.google.com/machine-learning/clustering/prepare-data
    status: draft
  - id: clustering-013
    type: single
    question: Assume you have enough data to create quantiles. How would you process the data distribution shown below?
    figure:
      src: ./clustering/clustering-013.svg
      alt: Histogram of a symmetric, bell-shaped distribution centred at 0, spanning about −15 to 15.
    options:
      - text: Normalize.
        correct: true
      - text: Create quantiles.
        why: Incorrect. Since this is a Gaussian distribution, the preferred transform is normalization.
      - text: Log transform.
        why: Incorrect. Only apply a log transform to power-law distributions.
    explanation: Correct. This is a Gaussian distribution. [^1]
    references:
      - source: google-ml-courses
        locator: Data preparation
        url: https://developers.google.com/machine-learning/clustering/prepare-data
    source:
      id: google-ml-courses
