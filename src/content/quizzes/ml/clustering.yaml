  - id: clustering-019
    type: single
    difficulty: easy
    tags:
      - hierarchical-clustering
      - dendrogram
      - number-of-clusters
    question: |
      A biologist wants to group gene-expression samples but has no idea how many clusters there
      might be. Which method most easily lets her look at the data at different levels of
      granularity?
    options:
      - text: K-Means, rerun for each candidate K
        why: K-Means needs the number of clusters in advance, so every granularity is a separate run, and the runs need not be nested [^2].
      - text: DBSCAN, rerun for each candidate eps
        why: DBSCAN sets the granularity only indirectly through `eps` and `min_samples`, which are hard to tune, and each setting is a separate run [^3].
      - text: Hierarchical clustering with a dendrogram
        correct: true
      - text: A Gaussian mixture, refit for each number of components
        why: Like K-Means, a mixture model fixes the number of components before fitting, so each granularity needs its own fit.
    explanation: |
      Agglomerative hierarchical clustering starts with every point in its own cluster and merges
      the closest clusters until one is left; the intermediate steps give clusterings with every
      possible number of clusters [^1]. The dendrogram shows all of them at once, and cutting it at
      different heights yields coarser or finer flat clusterings, which is why the course
      recommends it when you want a complete picture before choosing the number of clusters [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — Hierarchical clustering (Introduction, Dendrogram)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 15: More Clustering — K-Means limitations'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/15_DBSCAN-hierarchical.ipynb
