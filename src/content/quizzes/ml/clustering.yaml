  - id: clustering-036
    type: short_answer
    difficulty: medium
    tags:
      - graph-laplacian
      - spectral-clustering
      - eigenvalues
    question: |
      The square graph has 4 nodes in a cycle (each node joined to two neighbours). Its Laplacian is
      $L = D - A$ (degree matrix minus adjacency matrix). What is the second-smallest eigenvalue of $L$?
    answer:
      numeric: 2
      tolerance: 0.001
      hint: a number
      model: $L$ has eigenvalues $0, 2, 2, 4$
    explanation: |
      $L$ has 2 on the diagonal and $-1$ for each edge; the all-ones vector gives eigenvalue 0, and the
      others are $2 - 2\cos(2\pi k/4)$, i.e. 2, 4, 2, so the spectrum is $0, 2, 2, 4$ [^1]. The
      second-smallest eigenvalue measures how well connected the graph is, and its eigenvector (the
      Fiedler vector) splits the nodes into two groups [^2]. Spectral clustering uses these low
      eigenvectors of a similarity graph's Laplacian to embed and then cluster the points [^3].
    references:
      - title: 'Wikipedia: Laplacian matrix'
        locator: Definitions for simple graphs; Properties
        url: https://en.wikipedia.org/wiki/Laplacian_matrix
      - title: 'Wikipedia: Algebraic connectivity'
        locator: Fiedler vector — Partitioning a graph using the Fiedler vector
        url: https://en.wikipedia.org/wiki/Algebraic_connectivity
      - title: 'Wikipedia: Spectral clustering'
        locator: Definitions — Cluster analysis via Spectral Embedding; Algorithms
        url: https://en.wikipedia.org/wiki/Spectral_clustering
      - source: mit-ocw-18065
        locator: Problem for Lecture 35 (textbook Sections IV.6–IV.7), Problem 1
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec35-q1
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
