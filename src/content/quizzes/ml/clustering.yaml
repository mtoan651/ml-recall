  - id: clustering-020
    type: multiple
    difficulty: easy
    tags:
      - k-means
      - number-of-clusters
    question: |
      Before running K-Means you have to choose K, the number of clusters. Which statements about
      K-Means are true? Select all that apply.
    options:
      - text: K-Means always converges to the same solution
        why: The initial centers are random, and different initializations can converge to different, sometimes poor, solutions [^1].
      - text: K, the number of clusters, should always be at most the number of features
        why: K is about how many groups of *examples* you want; it has nothing to do with the number of features [^2].
      - text: It makes sense to have K at most the number of examples
        correct: true
      - text: In some iterations, some points may be left without a cluster
        why: Every iteration assigns every point to its closest center, so each point always has exactly one cluster [^2].
    explanation: |
      K-Means takes the data and the number of clusters K, initializes K centers, then alternates
      between assigning *every* example to its closest center and moving each center to the mean of
      its examples, until the centers stop changing [^2]. Since clusters are groups of examples, K
      cannot sensibly exceed the number of examples; with K equal to it, every example is its own
      cluster. The random initialization means that runs can converge to different solutions [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — Initialization of K-Means'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — K-Means clustering; K-Means algorithm'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/notes/14_K-Means.ipynb#ex14.1
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
