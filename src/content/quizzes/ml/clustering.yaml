  - id: clustering-026
    type: short_answer
    difficulty: medium
    tags:
      - em-algorithm
      - gaussian-mixture
      - responsibilities
      - e-step
    question: |
      A one-dimensional mixture of two Gaussians has weights $\pi_1 = \pi_2 = 0.5$ and components
      $\mathcal{N}(x; 0, 1)$ and $\mathcal{N}(x; 2, 1)$ at the current EM iteration. In the E-step,
      what is the responsibility $w_{1} = p(h = 1 \mid x = 0)$ of component 1 for the data point
      $x = 0$?
    answer:
      numeric: 0.881
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $w_1 = \frac{0.5\,\mathcal{N}(0; 0, 1)}{0.5\,\mathcal{N}(0; 0, 1) + 0.5\,\mathcal{N}(0; 2, 1)} = \frac{1}{1 + e^{-2}} \approx 0.881$
    explanation: |
      The E-step computes the posterior over the latent component, $w_{ik} = \pi_k p_k(x_i) / \sum_j
      \pi_j p_j(x_i)$ [^1]. The normalising constants of the two unit-variance Gaussians cancel, leaving
      $e^{0}/(e^{0} + e^{-(0-2)^2/2}) = 1/(1 + e^{-2}) \approx 0.881$ [^1][^2]. These soft assignments
      weight each point's contribution to every component in the M-step; hard EM would instead assign
      the point fully to component 1.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.5 (c) EM algorithm for mixture models
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Expectation–maximization algorithm'
        url: https://en.wikipedia.org/wiki/Expectation%E2%80%93maximization_algorithm
        locator: Examples, Gaussian mixture (E step)
    source:
      id: gutmann-pen-paper
      ref: variational-inference#em-mixture-models-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: clustering-027
    type: single
    difficulty: medium
    tags:
      - em-algorithm
      - mixture-models
      - mixing-weights
      - m-step
    question: |
      In EM for a mixture model $p(\mathbf{x}) = \sum_{k=1}^K \pi_k p_k(\mathbf{x}; \theta_k)$, the
      E-step gives responsibilities $w_{ik} = p(h_i = k \mid \mathbf{x}_i)$ for $n$ data points. What
      is the M-step update for the mixing weight $\pi_k$?
    options:
      - text: The fraction of points for which component $k$ has the largest responsibility
        why: That is the hard-EM variant, which rounds the soft assignments; standard EM averages the responsibilities themselves [^1].
      - text: $\pi_k \propto \sum_{i=1}^n w_{ik}\, p_k(\mathbf{x}_i; \theta_k)$
        why: The component densities already entered through $w_{ik}$; the objective for $\pi$ is $\sum_k (\sum_i w_{ik})\log\pi_k$, whose maximiser is proportional to $\sum_i w_{ik}$ [^1].
      - text: $\pi_k = \frac{1}{n}\sum_{i=1}^n w_{ik}$, the average responsibility of component $k$
        correct: true
      - text: $\pi_k$ stays at its initial value; only $\theta_k$ is updated in the M-step
        why: The mixing weights are parameters of the model and are re-estimated in every M-step [^1][^2].
    explanation: |
      The expected complete-data log-likelihood is $\sum_i \sum_k w_{ik}\log[\pi_k p_k(\mathbf{x}_i;
      \theta_k)]$; the part depending on $\pi$ is $\sum_k \omega_k \log \pi_k$ with $\omega_k = \sum_i
      w_{ik}$ [^1]. Under $\sum_k \pi_k = 1$ this is maximised by $\pi_k = \omega_k / \sum_j \omega_j =
      \frac{1}{n}\sum_i w_{ik}$, since the responsibilities of each point sum to one [^1][^2]. The
      component parameters are updated separately by weighted maximum likelihood.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.5 (e)–(f) EM algorithm for mixture models
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Expectation–maximization algorithm'
        url: https://en.wikipedia.org/wiki/Expectation%E2%80%93maximization_algorithm
        locator: Examples, Gaussian mixture (M step)
    source:
      id: gutmann-pen-paper
      ref: variational-inference#em-mixture-models-e
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: clustering-028
    type: short_answer
    difficulty: medium
    tags:
      - em-algorithm
      - gaussian-mixture
      - m-step
      - weighted-mle
    question: |
      In EM for a one-dimensional Gaussian mixture, four data points $x = 0, 1, 3, 4$ have
      responsibilities $0.9, 0.6, 0.2, 0.1$ for component 1. What is the updated mean $\mu_1$ after
      the M-step?
    answer:
      numeric: 0.889
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\mu_1 = \frac{0.9 \cdot 0 + 0.6 \cdot 1 + 0.2 \cdot 3 + 0.1 \cdot 4}{0.9 + 0.6 + 0.2 + 0.1} = 1.6/1.8 \approx 0.889$
    explanation: |
      With no parameters shared between components, the M-step for $(\mu_k, \Sigma_k)$ is a weighted
      maximum-likelihood fit with weights $w_{ik}$ [^1]. For a Gaussian this gives the weighted mean
      $\mu_k = \sum_i W_{ik} x_i$ with normalised weights $W_{ik} = w_{ik}/\sum_j w_{jk}$, here
      $1.6/1.8 \approx 0.889$; the covariance is the correspondingly weighted covariance around the new
      mean [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 10 Variational Inference and Learning, Ex. 10.6 (a)–(b) EM algorithm for mixture of Gaussians
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Expectation–maximization algorithm'
        url: https://en.wikipedia.org/wiki/Expectation%E2%80%93maximization_algorithm
        locator: Examples, Gaussian mixture (M step)
    source:
      id: gutmann-pen-paper
      ref: variational-inference#em-mog-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/variational-inference.tex
    status: draft
  - id: clustering-029
    type: single
    difficulty: easy
    question: |
      You want to cluster 7 points into 3 clusters with the k-means algorithm. After the first iteration, the clusters contain these two-dimensional points:

      - $C_1$: $(0, 6)$, $(6, 0)$
      - $C_2$: $(2, 2)$, $(4, 4)$, $(6, 6)$
      - $C_3$: $(5, 5)$, $(7, 7)$

      What are the cluster centers computed for these 3 clusters?
    options:
      - text: 'C1: (3,3), C2: (4,4), C3: (6,6)'
        correct: true
      - text: 'C1: (3,3), C2: (6,6), C3: (12,12)'
        why: '$C_2$ and $C_3$ are not divided by their number of points: $(6, 6)$ is the $C_2$ sum divided by 2, and $(12, 12)$ is the raw $C_3$ sum.'
      - text: 'C1: (6,6), C2: (12,12), C3: (12,12)'
        why: These are the coordinate sums of each cluster, not divided by the number of points.
      - text: 'C1: (0,0), C2: (48,48), C3: (35,35)'
        why: These multiply the points' coordinates instead of averaging them.
    explanation: 'The k-means update step moves each center to the mean (centroid) of the points currently assigned to it [^2]: $C_1$: $\frac{(0,6) + (6,0)}{2} = (3, 3)$; $C_2$: $\frac{(2,2) + (4,4) + (6,6)}{3} = (4, 4)$; $C_3$: $\frac{(5,5) + (7,7)}{2} = (6, 6)$. The next assignment step then moves every point to its nearest new center [^1].'
    references:
      - source: mmlu-redux
        locator: college_computer_science row 83
      - title: 'Wikipedia: k-means clustering'
        url: https://en.wikipedia.org/wiki/K-means_clustering#Standard_algorithm_(naive_k-means)
        locator: Algorithms, Standard algorithm (naive k-means)
    source:
      id: mmlu-redux
      ref: college_computer_science/83
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_computer_science/test?row=83
    status: draft
  - id: clustering-030
    type: multiple
    difficulty: medium
    tags:
      - gaussian-mixture
      - k-means
      - soft-clustering
    question: |
      Which statements about Gaussian mixture models (GMMs) used for clustering are true? Select all
      that apply.
    options:
      - text: GMMs are more flexible than K-Means but can be more expensive to compute
        correct: true
      - text: In a GMM, every data point gets a probability for each mixture component
        correct: true
      - text: GMMs are sensitive to initialization
        correct: true
      - text: The number of components has no effect on how well a GMM can fit the data
        why: More components let the mixture model more complicated densities, which is why the number of components is chosen with criteria such as AIC or BIC [^1].
      - text: Like K-Means, a GMM describes a cluster only by its center, so it cannot model elongated clusters
        why: Each component has its own mean *and* covariance matrix, so a GMM can fit ellipse-shaped clusters that K-Means splits badly [^1].
    explanation: |
      A GMM models the data as a weighted sum of Gaussians, each with its own mean vector and
      covariance matrix; the covariance lets it capture elongated, ellipse-shaped clusters [^1].
      Fitting is a non-convex problem solved with expectation maximization, so the result depends on
      the initialization (usually K-Means), and each point gets soft membership probabilities for all
      components [^1]. Estimating full covariance matrices costs more than K-Means' centroid updates.
    references:
      - source: ubc-dsci563
        locator: Lecture 1 notes, Sec. 4 Introduction to Gaussian mixture models (4.1 Motivation, 4.2 How does it work?)
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/01_K-Means.ipynb
    source:
      id: ubc-dsci563
      ref: lectures/notes/01_K-Means.ipynb#ex1.4
      url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/01_K-Means.ipynb
    status: draft
  - id: clustering-031
    type: single
    difficulty: easy
    tags:
      - topic-modeling
      - k-means
      - soft-clustering
    question: |
      What is the main difference between topic modelling a collection of documents and clustering
      the same documents with K-Means?
    options:
      - text: K-Means gives each document one cluster; a topic model gives it a mix of topics
        correct: true
      - text: Topic modelling is supervised and needs topic labels, while K-Means is unsupervised
        why: Topic models such as LDA are unsupervised too; they learn topics from the documents alone [^1].
      - text: K-Means outputs named topics such as "sports", while a topic model only outputs cluster ids
        why: Neither method names its groups; a topic model outputs word distributions that a human must interpret [^1].
      - text: Topic models work only on short texts, K-Means only on long ones
        why: Document length is not what separates them; both can be applied to bag-of-words vectors of any text [^1].
    explanation: |
      K-Means groups documents by a similarity measure and assigns each document to one cluster.
      A topic model instead learns a distribution over words for each topic and a distribution over
      topics for each document, so it is a form of soft clustering in which a document can belong to
      several topics at once [^1].
    references:
      - source: ubc-dsci563
        locator: 'Lecture 6 notes, Exercise: Questions for class discussion, question 1 (with solution)'
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/06_topic-modeling.ipynb
    source:
