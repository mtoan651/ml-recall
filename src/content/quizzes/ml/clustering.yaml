title: Clustering
questions:
  - id: clustering-001
    type: single
    difficulty: easy
    question: 'Clustering is a type of:'
    options:
      - text: supervised learning
      - text: unsupervised learning
        correct: true
      - text: reinforcement learning
    explanation: |
      Clustering assumes the data are unlabelled: there are no target outputs, and the algorithm
      groups the points using patterns it finds on its own. Learning without labels is what makes
      it unsupervised [^1]. Supervised learning needs labelled examples that show the correct
      output. Reinforcement learning learns by trying to maximise a reward signal. Clustering uses
      neither labels nor rewards [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md
        locator: 'Lesson: Introduction to Clustering (opening paragraph)'
      - title: 'Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)'
        url: http://incompleteideas.net/book/the-book-2nd.html
        locator: Sec. 1.1 Reinforcement Learning, p. 2
    source:
      id: ms-ml-for-beginners
      ref: quiz-27/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-002
    type: single
    difficulty: easy
    question: 'A good Silhouette score means:'
    options:
      - text: clusters are well-separated and well-defined
        correct: true
      - text: there are few clusters
      - text: there are many clusters
    explanation: |
      For each sample, the silhouette coefficient compares $a$, its mean distance to the other
      points in its own cluster, with $b$, its mean distance to the points of the nearest other
      cluster: $s = (b - a)/\max(a, b)$. The score of a clustering is the average over all samples [^2].
      Scores range from $-1$ to $1$. Values near 1 mean dense clusters that are well separated from
      their neighbours, and values near 0 mean the clusters overlap [^1][^2]. The score does not
      count clusters. In fact, it is often computed for several values of $k$ to help choose how
      many clusters to use [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#silhouette-score
        locator: "Lesson: K-Means Clustering, section 'Silhouette score'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#silhouette-coefficient
        locator: Sec. 2.3.11.5 Silhouette Coefficient
    source:
      id: ms-ml-for-beginners
      ref: quiz-29/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-003
    type: single
    difficulty: easy
    question: 'A Voronoi diagram shows:'
    options:
      - text: a cluster's variance
      - text: a cluster's seed and its region
        correct: true
      - text: a cluster's inertia
    explanation: |
      K-means assigns every point to its nearest centroid, which cuts the space into one cell per
      centroid. A Voronoi diagram draws exactly this: each seed point together with the region of
      space closest to it [^1]. Each Voronoi cell is one cluster. K-means alternates between
      computing these cells and moving each centroid to the mean of its cell [^2]. Variance and
      inertia are single numbers that summarise how spread out the points are. A map of regions
      does not show them [^1][^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
        locator: "Lesson: K-Means Clustering, sections 'Introduction' (Voronoi diagrams) and 'Variance'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
      ref: quiz-30/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-004
    type: single
    difficulty: medium
    question: Inertia is
    options:
      - text: a measure of how internally coherent clusters are
        correct: true
      - text: a measure of how much clusters move
      - text: a measure of cluster quality
    explanation: |
      Inertia is the within-cluster sum of squares, $\sum_i \min_j \lVert x_i - \mu_j \rVert^2$,
      which is the quantity k-means tries to minimise. scikit-learn calls it a measure of how
      internally coherent the clusters are [^1][^2]. It is narrower than a general "quality" score:
      it is not normalised (lower is better and zero is optimal, but there is no fixed scale), and
      it assumes convex, isotropic clusters, so it handles elongated or irregular shapes poorly [^2].
      It also does not measure how far centroids move. That movement is what the algorithm checks
      to decide when to stop iterating [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#exercise---build-a-model
        locator: "Lesson: K-Means Clustering, section 'Exercise - build a model' (Inertia note)"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
      ref: quiz-30/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: clustering-005
    type: true_false
    difficulty: easy
    question: Using K-Means, you must first determine the value of 'k'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      The number of clusters $k$ is an input to k-means. The algorithm starts by choosing $k$
      initial centroids, so $k$ must be fixed before it runs [^1][^2]. The lesson calls this a
      drawback of k-means and uses the elbow method (plotting inertia against $k$) to choose a
      sensible value [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
        locator: "Lesson: K-Means Clustering, sections 'Introduction' and 'Elbow method'"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3.2 K-means
    source:
      id: ms-ml-for-beginners
