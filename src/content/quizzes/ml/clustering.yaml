  - id: clustering-022
    type: multiple
    difficulty: medium
    tags:
      - elbow-method
      - silhouette
      - inertia
      - number-of-clusters
    question: Which statements about choosing the number of clusters are true? Select all that apply.
    options:
      - text: Running K-Means with as many clusters as there are (distinct) examples gives an inertia of 0
        correct: true
      - text: The elbow plot shows the trade-off between the within-cluster distances and the number of clusters
        correct: true
      - text: Unlike the elbow method, the silhouette method does not depend on cluster centers
        correct: true
      - text: The best number of clusters is the K with the smallest inertia
        why: Inertia keeps decreasing as K grows and reaches 0 when every point is its own cluster, so minimizing it always picks the largest K [^1].
      - text: Silhouette scores range from −1 to 1, and higher scores mean better cluster assignments
        correct: true
    explanation: |
      Inertia is the sum of squared distances from points to their cluster centers; it decreases as
      K increases and is 0 when each point has its own cluster, so the elbow method looks for the K
      where adding clusters stops paying off, which is not always easy to read [^1]. The silhouette
      score compares each point's mean distance to its own cluster ($a$) with its mean distance to
      the nearest other cluster ($b$) as $(b-a)/\max(a, b)$; it uses no centers, so it also works for
      other clustering methods, and it ranges from −1 (wrong cluster) to 1 (best) [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — Method 1: The Elbow method; Inertia'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — Method 2: The Silhouette method'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/notes/14_K-Means.ipynb#ex14.3
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
