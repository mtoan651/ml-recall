  - id: clustering-023
    type: multiple
    difficulty: medium
    tags:
      - k-means
      - knn
      - parametric
      - scaling
    question: Which statements comparing K-Means with other methods are true? Select all that apply.
    options:
      - text: Like $k$-nearest neighbours, K-Means is a non-parametric model
        why: To predict, K-Means only needs its K centroids, not the $O(n)$ training data that $k$-NN keeps, so by the course's definition it is parametric [^1].
      - text: The K in $k$-nearest neighbours and the K in K-Means mean nearly the same thing
        why: In $k$-NN, $k$ is how many neighbours vote; in K-Means, K is how many clusters to form [^2].
      - text: Scaling the input features is crucial in clustering
        correct: true
      - text: In clustering, it is almost always a good idea to look for clusters of equal size
        why: Natural groups often differ in size; forcing equal sizes can split real groups or merge different ones [^2].
    explanation: |
      The course calls a model non-parametric if it must store at least $O(n)$ worth of data to make
      predictions, like $k$-NN; K-Means only stores K cluster centers [^1]. Both methods rely on
      distances, so features on large scales dominate unless the data is scaled, and the right data
      representation is crucial for meaningful clustering [^2]. Their K's play different roles:
      neighbours that vote versus the number of groups.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — (Optional) Parametric vs non parametric'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 14: K-Means Clustering — K-Means clustering; Important points to remember'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/14_K-Means.ipynb
