  - id: clustering-037
    type: short_answer
    difficulty: medium
    tags:
      - k-means
      - initialization
      - lloyd-algorithm
    question: |
      Eighteen points lie in two rows: $(x, 0)$ and $(x, 3)$ for $x = 1, 3, 5, \dots, 17$. $k$-means with
      $k = 2$ is initialized with the centres $(9, 3)$ and $(11, 3)$ and run until it converges. How
      many points end up in the cluster of the centre that started at $(9, 3)$?
    answer:
      numeric: 10
      tolerance: 0
      hint: an integer
      model: 10 — the columns $x \le 9$ of both rows, with centroid $(5, 1.5)$
    explanation: |
      Both initial centres have $y = 3$, so every point is assigned by its $x$-coordinate alone:
      $x \le 9$ goes to the first centre and $x \ge 11$ to the second [^1]. The new centroids are
      $(5, 1.5)$ for the 10 points with $x \le 9$ and $(14, 1.5)$ for the 8 others, and with them the
      assignment no longer changes, so the algorithm has converged [^2]. $k$-means splits the data
      left/right, not into the two rows; here that split also has the smaller within-cluster sum of
      squares (160.5 against 480 for the rows).
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2004) solutions, Problem 3, part 1
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
      - title: 'Wikipedia: k-means clustering'
        locator: Algorithms — Standard algorithm (naive k-means)
        url: https://en.wikipedia.org/wiki/K-means_clustering#Standard_algorithm_(naive_k-means)
    source:
      id: mit-ocw-6867
      ref: final_f04soln#q3.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
