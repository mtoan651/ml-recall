  - id: time-series-023
    type: single
    difficulty: medium
    question: An AR($p$) process $y_t = \phi_1 y_{t-1} + \dots + \phi_p y_{t-p} + u_t$ has the characteristic equation $1 - \phi_1 z - \phi_2 z^2 - \dots - \phi_p z^p = 0$. Which condition is necessary and sufficient for the process to be stationary?
    options:
      - text: The roots of the characteristic equation must all lie inside the unit circle
        why: Roots inside the unit circle make the process explosive. It is the *inverse* roots, the roots of $\lambda^p - \phi_1 \lambda^{p-1} - \dots - \phi_p = 0$, that must lie inside.
      - text: The roots of the characteristic equation must all lie on the unit circle
        why: A root on the unit circle is a unit root; the process is then non-stationary, like a random walk.
      - text: The roots of the characteristic equation must all lie outside the unit circle
        correct: true
      - text: Every coefficient must satisfy $\lvert \phi_i \rvert < 1$
        why: 'Neither necessary nor sufficient: $y_t = 1.5\,y_{t-1} - 0.6\,y_{t-2} + u_t$ is stationary (roots of modulus 1.29), while $y_t = 0.9\,y_{t-1} + 0.5\,y_{t-2} + u_t$ is explosive (a root at 0.78).'
    explanation: An AR($p$) process is stationary when all $p$ (possibly complex) roots of $\phi(z) = 1 - \phi_1 z - \dots - \phi_p z^p$ lie outside the unit circle, $\lvert z \rvert > 1$ [^2]. For an AR(1) the only root is $z = 1/\phi_1$, which gives the familiar condition $\lvert \phi_1 \rvert < 1$. Software often plots the *inverse* roots instead, which must then lie inside the unit circle — the same condition in the other convention [^2][^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 53
        url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=53
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/arima-r.html
        locator: Sec. 9.7 ARIMA modelling in fable, Plotting the characteristic roots
    source:
      id: mmlu-redux
      ref: econometrics/53
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=53
