      The forecast origin is the last time with training data, here 2017-08-15, and the forecast
      horizon is the period being forecast, here the 16 days from August 16 to 31 [^1]. The lead time
      counts the steps from origin to horizon: one day [^2]. So the model may use lags starting at lag
      1 and makes the whole 16-step forecast from the features of 2017-08-15 [^2].
