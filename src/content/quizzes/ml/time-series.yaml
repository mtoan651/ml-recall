  - id: time-series-041
    type: single
    difficulty: easy
    tags:
      - holiday-features
      - seasonality
      - feature-engineering
    question: |
      After you remove the weekly and annual seasonality from a grocery chain's daily sales, the
      residuals still spike on national holidays, some of which fall on different dates each year.
      Which features let a linear model use this information?
    options:
      - text: One-hot indicator columns that mark the dates of each holiday
        correct: true
      - text: More Fourier pairs for the annual seasonal pattern
        why: Fourier features describe a smooth repeating shape; one-day spikes on dates that move from year to year are not such a shape [^2].
      - text: A lag-1 feature built from the previous day's sales
        why: A lag feature reacts a day after the spike; it carries no advance notice that tomorrow is a holiday [^3].
      - text: A higher-order polynomial of the time dummy to model the trend
        why: Trend features model slow, long-term change, not one-day effects.
    explanation: |
      Kaggle Learn's solution creates holiday features with a one-hot encoding of the holiday table,
      such as `pd.get_dummies` or scikit-learn's `OneHotEncoder`, joined to the feature set by date
      [^1]. Each indicator acts like a seasonal indicator switch: linear regression learns how far
      sales move on that holiday, whatever date it falls on [^2]. Holiday dates are known in advance,
      so the features are available for the forecast period as well.
