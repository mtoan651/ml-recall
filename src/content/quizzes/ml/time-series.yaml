  - id: time-series-047
    type: single
    difficulty: medium
    tags:
      - multistep-forecasting
      - lead-time
      - forecast-horizon
    question: |
      A forecasting dataset for a yearly series has one row per forecast. In each row, `y_lag_k` is the
      value $k$ steps before the row's time, and `y_step_1` is the value at the row's time:

      | Features | Targets |
      |---|---|
      | `y_lag_2`, `y_lag_3`, `y_lag_4`, `y_lag_5` | `y_step_1`, `y_step_2`, `y_step_3` |

      Which forecasting task does it represent?
    options:
      - text: A 3-step forecast using 4 lag features with a 2-step lead time
        correct: true
      - text: A 3-step forecast using 4 lag features with a 1-step lead time
        why: With a 1-step lead time the most recent value, `y_lag_1`, would be available as a feature [^2].
      - text: A 3-step forecast using 5 lag features with a 2-step lead time
        why: There are four lag columns; the largest lag is 5 only because they start at lag 2 [^2].
      - text: A 4-step forecast using 3 lag features with a 2-step lead time
        why: The number of steps is the number of target columns (3), and the number of lags is the number of feature columns (4) [^2].
    explanation: |
      The forecast horizon is the set of times being predicted, and the lead time is the number of
      steps from the forecast origin, the last time with data, to the horizon [^1]. Each row arranges
      the whole horizon as targets, one column per step, and the lags available at the origin as
      features [^1]. So: three target columns make a 3-step forecast, four feature columns make 4
      lags, and the smallest lag, 2, is the lead time [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 6 Forecasting with Machine Learning — tutorial, Defining the Forecasting Task; Preparing Data for Forecasting
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut6.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 6 exercise, Question 1 Match description to dataset (hint and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex6.py
