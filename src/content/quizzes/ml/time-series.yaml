  - id: time-series-043
    type: multiple
    difficulty: medium
    tags:
      - lag-features
      - autocorrelation
      - partial-autocorrelation
      - lag-plot
    question: |
      You are choosing lag features for the monthly US unemployment rate, whose autocorrelation is
      0.99 at lag 1 and 0.98 at lag 2. Which statements are true? Select all that apply.
    options:
      - text: The lag-2 autocorrelation may only be lag-1 information carried over, so by itself it does not justify a lag-2 feature
        correct: true
      - text: The partial autocorrelation of a lag is its correlation with the series after accounting for all shorter lags
        correct: true
      - text: Autocorrelation and partial autocorrelation measure only linear dependence, so a lag plot can show relationships they miss
        correct: true
      - text: Every lag whose autocorrelation is above 0.5 should become a feature
        why: Many large autocorrelations are decayed copies of shorter lags; including every such lag adds redundant features [^1].
      - text: A lag plot draws the series and its lagged copy as two lines against time
        why: A lag plot puts the lagged value on the x-axis and the current value on the y-axis, one point per time step [^1].
    explanation: |
      Autocorrelation is the correlation of a series with one of its lags, but the lag-2 value may come
      entirely from decayed lag-1 information [^1]. The partial autocorrelation measures the new
      correlation a lag contributes once all previous lags are accounted for, so its correlogram helps
      choose lags; for unemployment, lags 1 to 6 stand out [^1]. Both are linear measures, so Kaggle
      Learn recommends also looking at lag plots, which reveal non-linear dependence such as in the
      *Sunspots* series [^1]. Its exercise applies the same reading to the *Store Sales* data [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 4 Time Series as Features — tutorial, Lag plots and Choosing lags
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut4.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 4 exercise, Question 2 Examine serial dependence in Store Sales (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex4.py
