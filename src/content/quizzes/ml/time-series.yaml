  - id: time-series-037
    type: single
    difficulty: medium
    tags:
      - trend
      - polynomial-features
      - exponential-growth
    question: |
      The 12-month moving average of a monthly sales series rises along a curve that bends upward.
      What is the lowest polynomial order of a trend feature that can follow the bend, and which
      non-polynomial curve may fit even better if sales grow by a roughly constant percentage a year?
    options:
      - text: Order 2 (a parabola), and an exponential curve
        correct: true
      - text: Order 1 (a straight line), and a logarithmic curve
        why: A straight line cannot bend, and a logarithm bends the other way, growing ever more slowly [^2].
      - text: Order 2 (a parabola), and a logarithmic curve
        why: A logarithm grows more and more slowly; constant percentage growth compounds, which is an exponential curve [^2].
      - text: Order 11, and a sine curve
        why: A high order is not needed for one bend and forecasts badly; sine curves model seasons, not trend.
    explanation: |
      Linear regression can fit curved trends if you give it transformed time dummies: adding the
      square of the time dummy models a parabola [^1]. An upward bend is the shape of an order-2
      trend, which is also Kaggle Learn's answer for such a series [^2]. Economic series often grow
      by a percentage, and percentage growth is modelled well by an exponential curve, for instance
      by fitting a linear trend to the logarithm of the series [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 2 Trend — tutorial, Engineering Trend
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut2.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 2 exercise, Question 2 Identify trend (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex2.py
    source:
      id: kaggle-learn
      ref: time_series/ex2#q2
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex2.ipynb
    status: reviewed
    reviewed_by: claude
  - id: time-series-038
    type: single
    difficulty: easy
    tags:
      - trend
      - polynomial-features
      - extrapolation
    question: |
      An order-11 polynomial of the time dummy fits the complicated trend of a sales series closely
      over the training period. Why is it a poor choice for a 90-day forecast?
    options:
      - text: Terms like $t^{11}$ blow up outside the training period
        correct: true
      - text: Linear regression cannot use polynomial features of order higher than 3
        why: Any power of the time dummy is just another feature, which linear regression weights like the others [^2].
      - text: It cannot follow the trend inside the training period, so it underfits
        why: The high order is what lets it follow the trend closely in the training period; the trouble starts beyond it.
      - text: A polynomial of odd order always forecasts a falling trend
        why: Far from the data the leading term dominates, so the direction depends on the sign of its coefficient, not on whether the order is odd.
    explanation: |
      An order-11 polynomial includes terms like $t^{11}$, which tend to diverge rapidly outside the
      training period and make forecasts very unreliable [^1]. Inside the training range the terms
      balance each other to trace the curve, but nothing constrains them beyond it, so the 90-day
      forecast shoots off [^1]. Low-order trends, built by adding powers of the time dummy as
      features, extrapolate more sensibly [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 2 exercise, Question 4 Understand risks of forecasting with high-order polynomials (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex2.py
