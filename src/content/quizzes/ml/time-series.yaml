    reviewed_by: claude
  - id: time-series-025
    type: single
    difficulty: medium
    question: |
      Write the MA(2) process

      $$y_t = u_t - 3u_{t-1} + 2u_{t-2}$$

      as $y_t = \theta(L)\,u_t$ with the lag operator $L$. What are the characteristic roots of the process, i.e. the roots of $\theta(z) = 0$?
    options:
      - text: 1 and 2
        why: These are the roots of the reversed polynomial $\lambda^2 - 3\lambda + 2$, i.e. the inverse roots $1/z$.
      - text: 1 and 0.5
        correct: true
      - text: 2 and -0.5
        why: $\theta(2) = 1 - 6 + 8 = 3 \neq 0$, so 2 is not a root.
      - text: 1 and -3
        why: $\theta(-3) = 1 + 9 + 18 = 28 \neq 0$; the coefficient $-3$ is not a root.
    explanation: |
      Here $\theta(L) = 1 - 3L + 2L^2$, so the characteristic equation is
      $1 - 3z + 2z^2 = (1 - z)(1 - 2z) = 0$, with roots $z = 1$ and $z = 0.5$ [^1]. An MA process
      is invertible (can be written as an AR($\infty$)) only if all these roots lie outside the unit
      circle [^2], so this one is not. Software often plots the *inverse* roots $1/z$ instead, here
      1 and 2, which is the trap in the first option [^2].
    references:
      - source: mmlu-redux
        locator: econometrics row 82
        url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=82
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/arima-r.html
        locator: Sec. 9.7 ARIMA modelling in fable, Plotting the characteristic roots
