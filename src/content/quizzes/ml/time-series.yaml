  - id: time-series-044
    type: single
    difficulty: medium
    tags:
      - leading-indicators
      - lookahead-leakage
      - feature-engineering
    question: |
      You forecast Monday's sales of school supplies. The series `onpromotion` counts the items on
      promotion each day, and the company plans its promotions in advance. May you use Tuesday's
      `onpromotion` value as a feature in Monday's forecast?
    options:
      - text: Yes; it is known when the forecast is made, so nothing leaks
        correct: true
      - text: No; any value dated after the forecast target leaks information from the future
        why: Leakage means using information you will not have at prediction time; planned promotions are known in advance [^1].
      - text: No; only lagged values of the target series itself can be used as features
        why: Other series can be features too; Kaggle Learn's flu example forecasts doctor's visits with lags of Google search popularity [^2].
      - text: Yes, but only after the promotion series has been deseasonalized
        why: Deseasonalizing is not what makes a feature safe; what matters is whether its value is known at forecast time [^1].
    explanation: |
      Since the company itself decides when to run a promotion, there is no worry about lookahead
      leakage, and Tuesday's `onpromotion` value can help forecast Monday's sales [^1]. A series whose
      values give advance notice of changes in the target is a leading indicator; in Kaggle Learn's
      flu example, flu-related searches rise in the weeks before doctor's visits [^2]. For
      school-supply sales, Kaggle Learn finds that both leading and lagging values of `onpromotion`
      correlate with sales, so both are useful features [^3].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 4 exercise, text before Question 3 (leading indicators and lookahead leakage)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex4.ipynb
