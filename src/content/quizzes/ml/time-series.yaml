  - id: time-series-040
    type: single
    difficulty: medium
    tags:
      - periodogram
      - seasonality
      - residuals
    question: |
      The periodogram of a daily sales series has tall peaks at the weekly and biweekly frequencies.
      You fit a seasonal model (weekly indicators plus Fourier features) and subtract its fitted
      values. The periodogram of the deseasonalized series has no large values anywhere. What does
      this tell you?
    options:
      - text: The model captured the seasonality; no strong periodic part remains
        correct: true
      - text: The model overfit, since a good model leaves the seasonal peaks in the residuals
        why: Residuals hold what the model failed to learn; a seasonal model that works should remove the seasonal peaks [^2].
      - text: The series had no real seasonality, so the peaks came from the trend
        why: The original periodogram showed strong weekly peaks; they vanished because the model explained them [^1].
      - text: The trend was removed too, because a periodogram measures the strength of trend
        why: A periodogram measures the strength of each frequency, which is the periodic (seasonal) part of a series [^3].
    explanation: |
      Removing the seasons from a series is called deseasonalizing it, and the periodogram of what is
      left shows whether any seasonality remains [^1]. A deseasonalized periodogram with no large values,
      compared with the peaks of the original, shows the model captured the seasonal variation [^1].
      The residuals are what the model did not learn, so they should now contain only cycles, other
      effects and noise [^2]. The periodogram's height at each frequency is
      $(a^2 + b^2)/2$ for the sine and cosine coefficients at that frequency [^3].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 3 exercise, Question 3 Check for remaining seasonality (text and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex3.py
