  - id: time-series-015
    type: short_answer
    difficulty: hard
    tags:
      - kalman-filter
      - state-space-models
      - filtering
    question: |
      A one-dimensional linear-Gaussian state-space model has $h_s = A h_{s-1} + B \xi_s$ and $v_s =
      C h_s + D \eta_s$ with independent standard normal $\xi_s, \eta_s$. The filtering
      distribution at time $s - 1$ is $p(h_{s-1} \mid v_{1:s-1}) = \mathcal{N}(0, 1)$. With $A = 1$,
      $B^2 = 1$, $C = 1$, $D^2 = 2$ you observe $v_s = 3$. What is the mean $\mu_s$ of $p(h_s \mid
      v_{1:s})$?
    answer:
      numeric: 1.5
      tolerance: 0.01
      hint: a number, 1 decimal
      model: $P_s = A^2\sigma_{s-1}^2 + B^2 = 2$, $K_s = P_s C / (C^2 P_s + D^2) = 0.5$, $\mu_s = A\mu_{s-1} + K_s (v_s - C A \mu_{s-1}) = 1.5$
    explanation: |
      The prediction step propagates the previous posterior through the transition: mean $A\mu_{s-1}
      = 0$, variance $P_s = A^2 \sigma_{s-1}^2 + B^2 = 2$ [^1]. The update multiplies by the
      Gaussian likelihood of $v_s$, which gives the Kalman gain $K_s = P_s C / (C^2 P_s + D^2) = 2/4
      = 0.5$ and $\mu_s = A\mu_{s-1} + K_s (v_s - C A \mu_{s-1}) = 0 + 0.5 \cdot 3 = 1.5$, with
      variance $(1 - K_s C) P_s = 1$ [^1][^2]. The gain weighs the prediction error by how
      uncertain the prediction is relative to the observation noise.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.6 (d)–(f) Kalman filtering
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Kalman filter'
        url: https://en.wikipedia.org/wiki/Kalman_filter
        locator: Details (Predict, Update)
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#kalman-f
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: time-series-016
    type: single
    difficulty: medium
    tags:
      - kalman-filter
      - kalman-gain
      - observation-noise
    question: |
      In a one-dimensional Kalman filter the update is $\mu_s = A\mu_{s-1} + K_s(v_s - C A
      \mu_{s-1})$, $\sigma_s^2 = (1 - K_s C) P_s$, with gain $K_s = P_s C / (C^2 P_s + D^2)$, where
      $D^2$ is the observation-noise variance and $P_s$ the predicted variance. What happens as $D^2
      \to 0$?
    options:
      - text: $\mu_s \to A\mu_{s-1}$ and $\sigma_s^2 \to P_s$
        why: That is the limit of very *noisy* observations ($D^2 \to \infty$, $K_s \to 0$), where the update ignores $v_s$ [^1].
      - text: $K_s \to 0$, so the filter keeps its prediction
        why: With $D^2 = 0$ the gain becomes $P_s C / (C^2 P_s) = 1/C$, its largest possible value [^1].
      - text: $\mu_s \to v_s / C$ and $\sigma_s^2 \to 0$
        correct: true
      - text: $\mu_s \to v_s / C$ but $\sigma_s^2$ stays at $P_s$
        why: $\sigma_s^2 = (1 - K_s C) P_s$ and $K_s C \to 1$, so the posterior variance goes to zero [^1].
    explanation: |
      $v_s - CA\mu_{s-1}$ is the error of predicting the observation from the past, and the gain
      decides how much of it moves the estimate [^1]. As $D^2 \to 0$, $K_s \to 1/C$, so $\mu_s \to
      A\mu_{s-1} + (v_s - CA\mu_{s-1})/C = v_s / C$: the state is obtained by inverting the noiseless
      observation equation, and $\sigma_s^2 = (1 - K_s C)P_s \to 0$ [^1][^2]. With noisy observations
      the filter instead trusts its prediction more.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 7 Inference for Hidden Markov Models, Ex. 7.6 (g) Kalman filtering
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Kalman filter'
        url: https://en.wikipedia.org/wiki/Kalman_filter
        locator: Details (Update) and Kalman gain derivation
    source:
      id: gutmann-pen-paper
      ref: inference-for-hidden-markov-models#kalman-g
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/inference-for-hidden-markov-models.tex
    status: draft
  - id: time-series-017
    type: single
    difficulty: medium
    question: |
      Consider the following AR(2) process, where $u_t$ is white noise:

      $$y_t = 1.5\,y_{t-1} - 0.5\,y_{t-2} + u_t$$

      This is a
    options:
      - text: Stationary process
        why: Stationarity needs every root of $1 - 1.5z + 0.5z^2 = 0$ outside the unit circle, but one root is exactly $z = 1$.
      - text: Unit root process
        correct: true
      - text: Explosive process
        why: An explosive process has a characteristic root inside the unit circle; here the roots are $z = 1$ and $z = 2$.
      - text: Stationary and unit root process
        why: A unit-root process is non-stationary by definition, so it cannot be both.
    explanation: 'The characteristic equation $1 - 1.5z + 0.5z^2 = 0$ factors as $(1 - z)(1 - 0.5z) = 0$, so its roots are $z = 1$ and $z = 2$. Because 1 is a root, the process has a unit root and is non-stationary [^2]. Indeed $\Delta y_t = 0.5\,\Delta y_{t-1} + u_t$ is a stationary AR(1): one difference makes the series stationary, so $y_t$ is an I(1), unit-root process [^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 0
      - title: 'Wikipedia: Unit root'
        url: https://en.wikipedia.org/wiki/Unit_root
        locator: Definition
    source:
      id: mmlu-redux
      ref: econometrics/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=0
    status: draft
  - id: time-series-018
    type: single
    difficulty: easy
    shuffle: false
    question: |
      Which of the following conditions are necessary for a series to be classifiable as a weakly stationary process?

      (i) It must have a constant mean

      (ii) It must have a constant variance

      (iii) It must have constant autocovariances for given lags

      (iv) It must have a constant probability distribution
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
        correct: true
      - text: (i), (ii), (iii), and (iv)
    explanation: A process is weakly (covariance) stationary when its mean is constant, its variance is finite and constant, and its autocovariances depend only on the lag, not on the point in time [^2]. Requiring the whole probability distribution to stay the same over time is *strict* stationarity, a stronger condition that weak stationarity does not need, so (iv) is not necessary [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 6
      - title: 'Wikipedia: Stationary process'
        url: https://en.wikipedia.org/wiki/Stationary_process#Weak_or_wide-sense_stationarity
        locator: Weak or wide-sense stationarity, Definition
    source:
      id: mmlu-redux
      ref: econometrics/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=6
    status: draft
  - id: time-series-019
    type: single
    difficulty: easy
    question: Which of the following statements is true concerning forecasting in econometrics?
    options:
      - text: Forecasts can only be made for time-series data
        why: Forecasts are also made from cross-sectional data, e.g. predicting the price of a house that is not in the sample.
      - text: Mis-specified models are certain to produce inaccurate forecasts
        why: A mis-specified model is not *certain* to forecast badly; simple, "wrong" models often forecast well.
      - text: Structural forecasts are simpler to produce than those from time series models
        why: A structural model needs forecasts of its explanatory variables first, so it is usually harder to forecast with than a pure time-series model.
      - text: In-sample forecasting ability is a poor test of model adequacy
        correct: true
    explanation: A model can fit the data it was estimated on very well and still forecast poorly, because in-sample fit rewards overfitting. The accuracy of forecasts can only be judged on new data that were not used to fit the model, such as a held-out test period [^2]. That is why in-sample forecasting ability is a poor test of model adequacy [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 12
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/accuracy.html
        locator: Sec. 5.8 Evaluating point forecast accuracy, Training and test sets
    source:
      id: mmlu-redux
      ref: econometrics/12
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=12
    status: draft
  - id: time-series-020
    type: single
    difficulty: medium
    question: An ARMA($p, q$) model, with $p$ and $q$ both positive integers, will have
    options:
      - text: An acf and pacf that both decline geometrically
        correct: true
      - text: An acf that declines geometrically and a pacf that is zero after p lags
        why: A PACF that cuts off after lag $p$ is the signature of a pure AR($p$); the MA part of an ARMA model keeps the PACF from cutting off.
      - text: An acf that declines geometrically and a pacf that is zero after q lags
        why: A PACF that cuts off belongs to a pure AR process, and it cuts off after $p$ lags, not $q$.
      - text: An acf that is zero after p lags and a pacf that is zero after q lags
        why: 'These cut-offs are reversed and belong to pure processes: an MA($q$) ACF is zero after lag $q$, an AR($p$) PACF after lag $p$.'
    explanation: 'A pure AR($p$) has an ACF that tails off and a PACF that cuts off after lag $p$; a pure MA($q$) shows the reverse pattern [^2]. An ARMA($p, q$) mixes both, so neither function cuts off: the ACF and the PACF both decay geometrically (or as damped sine waves). This is why, when $p$ and $q$ are both positive, ACF and PACF plots do not reveal the orders, and they are chosen with information criteria instead [^2][^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 22
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/non-seasonal-arima.html
        locator: Sec. 9.5 Non-seasonal ARIMA models, ACF and PACF plots
    source:
      id: mmlu-redux
      ref: econometrics/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=22
    status: draft
  - id: time-series-021
    type: single
    difficulty: medium
    question: |
      The following sample autocorrelations were estimated from a series of $T = 250$ observations:

      | Lag | 1 | 2 | 3 |
      | --- | --- | --- | --- |
      | Autocorrelation | $0.2$ | $-0.15$ | $-0.1$ |

      Assuming that the coefficients are approximately normally distributed, which of them are statistically significant at the 5% level (two-sided)?
    options:
      - text: Lag 1 only
        why: $\lvert -0.15 \rvert > 0.124$, so lag 2 is significant as well.
      - text: Lags 1 and 2 only
        correct: true
      - text: Lags 1, 2 and 3
        why: $\lvert -0.1 \rvert < 0.124$, so lag 3 is not significant.
      - text: It is not possible to determine the statistical significance since no standard errors have been given
        why: Under the null of zero autocorrelation, the standard error of a sample autocorrelation is about $1/\sqrt{T}$, so it does not need to be given.
    explanation: Under the null hypothesis of zero autocorrelation, a sample autocorrelation has a standard error of about $1/\sqrt{T}$, so the 5% bounds are $\pm 1.96/\sqrt{T} = \pm 1.96/\sqrt{250} \approx \pm 0.124$ — the dashed lines on an ACF plot [^2]. Lags 1 ($0.2$) and 2 ($-0.15$) lie outside these bounds and lag 3 ($-0.1$) lies inside, so only the first two are significant [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 31
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/wn.html
        locator: Sec. 2.9 White noise
    source:
      id: mmlu-redux
      ref: econometrics/31
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=31
    status: draft
  - id: time-series-022
    type: single
    difficulty: medium
    question: If the standard tools for time-series analysis, such as estimation of the acf, pacf and spectral analysis, find no evidence of structure in the data, this implies that the data are which of the following?
    options:
      - text: Normally distributed
        why: These tools describe dependence over time, not the shape of the marginal distribution.
      - text: Uncorrelated
        correct: true
      - text: Independent
        why: No *linear* dependence does not rule out non-linear dependence, e.g. between the squares of the observations (volatility clustering).
      - text: Fat-tailed
        why: The tail behaviour of the distribution is not visible in autocorrelations or in the spectrum.
    explanation: 'The ACF, the PACF and the spectrum are all built from autocovariances, so they only detect *linear* dependence between observations. Finding no structure therefore shows that the data are uncorrelated over time, but not that they are independent: uncorrelated variables can still be dependent, e.g. $X$ and $Y = X^2$ for $X$ uniform on $[-1, 1]$ [^2]. "Uncorrelated" is the strongest conclusion these tools support [^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 44
      - title: 'Wikipedia: Uncorrelatedness (probability theory)'
        url: https://en.wikipedia.org/wiki/Uncorrelatedness_(probability_theory)
        locator: Introduction and Examples of dependence without correlation
    source:
      id: mmlu-redux
      ref: econometrics/44
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=44
    status: draft
  - id: time-series-023
    type: single
    difficulty: medium
    question: An AR($p$) process $y_t = \phi_1 y_{t-1} + \dots + \phi_p y_{t-p} + u_t$ has the characteristic equation $1 - \phi_1 z - \phi_2 z^2 - \dots - \phi_p z^p = 0$. Which condition is necessary and sufficient for the process to be stationary?
    options:
      - text: The roots of the characteristic equation must all lie inside the unit circle
        why: Roots inside the unit circle make the process explosive. It is the *inverse* roots, the roots of $\lambda^p - \phi_1 \lambda^{p-1} - \dots - \phi_p = 0$, that must lie inside.
      - text: The roots of the characteristic equation must all lie on the unit circle
        why: A root on the unit circle is a unit root; the process is then non-stationary, like a random walk.
      - text: The roots of the characteristic equation must all lie outside the unit circle
        correct: true
      - text: Every coefficient must satisfy $\lvert \phi_i \rvert < 1$
        why: 'Neither necessary nor sufficient: $y_t = 1.5\,y_{t-1} - 0.6\,y_{t-2} + u_t$ is stationary (roots of modulus 1.29), while $y_t = 0.9\,y_{t-1} + 0.5\,y_{t-2} + u_t$ is explosive (a root at 0.78).'
    explanation: An AR($p$) process is stationary when all $p$ (possibly complex) roots of $\phi(z) = 1 - \phi_1 z - \dots - \phi_p z^p$ lie outside the unit circle, $\lvert z \rvert > 1$ [^2]. For an AR(1) the only root is $z = 1/\phi_1$, which gives the familiar condition $\lvert \phi_1 \rvert < 1$. Software often plots the *inverse* roots instead, which must then lie inside the unit circle — the same condition in the other convention [^2][^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 53
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/arima-r.html
        locator: Sec. 9.7 ARIMA modelling in fable, Plotting the characteristic roots
    source:
      id: mmlu-redux
      ref: econometrics/53
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=53
    status: draft
  - id: time-series-024
    type: single
    difficulty: hard
    shuffle: false
    question: |
      Which of the following statements are true concerning the autocorrelation function (acf) and partial autocorrelation function (pacf)?

      i) The acf and pacf will always be identical at lag one whatever the model

      ii) The pacf for an MA(q) model will in general be non-zero beyond lag q

      iii) The pacf for an AR(p) model will be zero beyond lag p

      iv) The acf and pacf will be the same at lag two for an MA(1) model
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
        correct: true
      - text: (i), (ii), (iii), and (iv)
    explanation: '(i) holds for every model: at lag 1 there is nothing in between to remove, so the first partial autocorrelation equals the first autocorrelation [^2]. (ii) and (iii) are the identification rules: an MA($q$) PACF tails off, while an AR($p$) PACF has no spikes beyond lag $p$. (iv) fails: for an MA(1) the ACF is 0 at lag 2, but the PACF there is $\phi_{22} = -\rho_1^2/(1 - \rho_1^2) \neq 0$, e.g. $-0.135$ when $\theta = 0.4$ [^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 59
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/non-seasonal-arima.html
        locator: Sec. 9.5 Non-seasonal ARIMA models, ACF and PACF plots
    source:
      id: mmlu-redux
      ref: econometrics/59
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=59
    status: draft
  - id: time-series-025
    type: single
    difficulty: hard
    question: |
      Write the MA(2) process

      $$y_t = u_t - 3u_{t-1} + 2u_{t-2}$$

      as $y_t = \theta(L)\,u_t$ with the lag operator $L$. What are the characteristic roots of the process, i.e. the roots of $\theta(z) = 0$?
    options:
      - text: 1 and 2
        why: These are the roots of the reversed polynomial $\lambda^2 - 3\lambda + 2$, i.e. the inverse roots $1/z$.
      - text: 1 and 0.5
        correct: true
      - text: 2 and -0.5
        why: $\theta(2) = 1 - 6 + 8 = 3 \neq 0$, so 2 is not a root.
      - text: 1 and -3
        why: $\theta(-3) = 1 + 9 + 18 = 28 \neq 0$; the coefficient $-3$ is not a root.
    explanation: Here $\theta(L) = 1 - 3L + 2L^2$, so the characteristic equation is $1 - 3z + 2z^2 = (1 - z)(1 - 2z) = 0$, with roots $z = 1$ and $z = 0.5$. An MA process is invertible (can be written as an AR($\infty$)) only if all these roots lie outside the unit circle [^2], so this one is not. The upstream question gave the coefficient of $u_{t-2}$ as 1, which has roots $(3 \pm \sqrt{5})/2 \approx 2.62$ and $0.38$ and matches no option; it is corrected to 2, consistent with the key [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 82
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/arima-r.html
        locator: Sec. 9.7 ARIMA modelling in fable, Plotting the characteristic roots
    source:
      id: mmlu-redux
      ref: econometrics/82
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=82
    status: draft
  - id: time-series-026
    type: single
    difficulty: easy
    question: If a series, y, follows a random walk, what is the optimal one-step ahead forecast of y?
    options:
      - text: The current value of y
        correct: true
      - text: Zero
        why: Zero is the optimal forecast of the *change* in a random walk without drift, not of its level.
      - text: One
        why: Nothing in a random walk pulls its level towards 1.
      - text: The average value of y over the in-sample period
        why: The sample mean is the optimal forecast for a series that fluctuates around a constant mean (e.g. white noise), not for a random walk, whose level wanders.
    explanation: 'A random walk is $y_t = y_{t-1} + u_t$ with unpredictable white noise $u_t$, so $E(y_{t+1} \mid y_t, y_{t-1}, \dots) = y_t$: the best forecast is the last observation. This "naïve" forecast is optimal when the data follow a random walk, which is why it is also called the random walk forecast and serves as a standard benchmark [^2][^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 97
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/simple-methods.html
        locator: Sec. 5.2 Some simple forecasting methods, Naïve method
    source:
      id: mmlu-redux
      ref: econometrics/97
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=97
    status: draft
