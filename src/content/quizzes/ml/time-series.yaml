schema_version: 1
domain: ml
topic: time-series
title: Time Series
questions:
  - id: time-series-001
    type: single
    difficulty: easy
    question: 'A time series is a sequence taken at:'
    options:
      - text: successive equally spaced points in space
      - text: successive equally spaced points in time
        correct: true
      - text: successive equally spaced points in space and time
    explanation: |
      A time series is a sequence of data points indexed in time order. Most commonly, the points
      are taken at successive, equally spaced points in time, such as a stock index's daily
      closing value [^1]. Forecasting texts likewise work with series observed at regular time
      intervals: hourly, daily, monthly and so on [^2]. What defines a time series is the time
      index, not position in space.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#some-definitions
        locator: "Lesson: Intro to Time Series, section 'Some definitions'"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/data-methods.html
        locator: Sec. 1.4 Forecasting data and methods
    source:
      id: ms-ml-for-beginners
      ref: quiz-41/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-002
    type: single
    difficulty: easy
    question: Time series trends are
    options:
      - text: Measurable increases and decreases over time
        correct: true
      - text: Quantifying decreases over time
      - text: Gaps between increases and decreases over time
    explanation: |
      A trend is a long-term increase or decrease in the data. It can rise, fall or change
      direction, and it does not have to be linear [^1][^2]. So it covers both increases and
      decreases, not decreases alone, and it is a movement of the level of the series, not a gap
      between rises and falls [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
        locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Trends)"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/tspatterns.html
        locator: Sec. 2.3 Time series patterns
    source:
      id: ms-ml-for-beginners
      ref: quiz-42/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-003
    type: single
    difficulty: easy
    question: Outliers are
    options:
      - text: points close to standard data variance
      - text: points far away from standard data variance
        correct: true
      - text: points within standard data variance
    explanation: |
      Outliers are observations that lie far from the bulk of the data, outside its usual
      spread [^1][^2]. They may be errors or genuinely unusual events. Extreme outliers can break
      most forecasting methods, so they need attention before modelling [^2]. Points close to or
      within the normal spread are ordinary observations.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
        locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Outliers)"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/missing-outliers.html#outliers
        locator: Sec. 13.9 Dealing with outliers and missing values
    source:
      id: ms-ml-for-beginners
      ref: quiz-42/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-004
    type: single
    difficulty: easy
    question: ARIMA stands for
    options:
      - text: AutoRegressive Integral Moving Average
      - text: AutoRegressive Integrated Moving Action
      - text: AutoRegressive Integrated Moving Average
        correct: true
    explanation: |
      ARIMA stands for AutoRegressive Integrated Moving Average [^1][^2]. "Integrated" refers to
      differencing: the model is fitted to a differenced series, and integration is the reverse of
      differencing [^2]. "Moving average" means the model regresses on past forecast errors, while
      the autoregressive part uses past values of the series [^1][^2]. So neither "Integral" nor
      "Moving Action" is right.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#arima-in-the-context-of-time-series
        locator: "Lesson: Time Series ARIMA, sections 'Introduction' and 'ARIMA in the context of time series'"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/non-seasonal-arima.html
        locator: Sec. 9.5 Non-seasonal ARIMA models
    source:
      id: ms-ml-for-beginners
      ref: quiz-43/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-005
    type: single
    difficulty: easy
    question: Stationarity refers to
    options:
      - text: data whose attributes do not change when shifted in time
      - text: data whose distribution does not change when shifted in time
        correct: true
      - text: data whose distribution changes when shifted in time
    explanation: |
      A stationary series is one whose statistical properties, that is its distribution, do not
      depend on when it is observed. Shifting it in time changes nothing [^1][^2]. Series with a
      trend or seasonality are therefore not stationary, while white noise is [^2]. Data whose
      distribution changes over time are, by definition, non-stationary. "Attributes" is too vague
      a word for the definition [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
        locator: "Lesson: Time Series ARIMA, section 'General concepts' (Stationarity)"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/stationarity.html
        locator: Sec. 9.1 Stationarity and differencing
    source:
      id: ms-ml-for-beginners
      ref: quiz-43/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-006
    type: single
    difficulty: easy
    question: Differencing
    options:
      - text: stabilizes trend and seasonality
      - text: exacerbates trend and seasonality
      - text: eliminates trend and seasonality
        correct: true
    explanation: |
      Differencing replaces each observation with its change from the previous one,
      $y'_t = y_t - y_{t-1}$, or from the same season one period earlier, $y_t - y_{t-m}$ [^2].
      This removes changes in the level of the series, which eliminates, or at least reduces,
      trend and seasonality [^1][^2]. What differencing stabilises is the *mean* of the series:
      the lesson's definition says it eliminates trend and seasonality and consequently stabilises
      the mean, so "stabilizes trend and seasonality" mixes the two up [^1][^2]. It never amplifies
      trend or seasonality.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
        locator: "Lesson: Time Series ARIMA, section 'General concepts' (Differencing)"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/stationarity.html#differencing
        locator: Sec. 9.1 Stationarity and differencing (Differencing; Seasonal differencing)
    source:
      id: ms-ml-for-beginners
      ref: quiz-43/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-007
    type: single
    difficulty: easy
    question: Use SARIMAX to
    options:
      - text: manage seasonal ARIMA models
        correct: true
      - text: manage special ARIMA models
      - text: manage statistical ARIMA models
    explanation: |
      SARIMAX is statsmodels' Seasonal AutoRegressive Integrated Moving Average model with
      eXogenous regressors [^2]. The lesson uses it because the energy data are seasonal. Besides
      the usual $(p, d, q)$, a seasonal ARIMA has a second set $(P, D, Q)$ that models the seasonal
      part of the series [^1][^3]. The "S" stands for seasonal, not special or statistical [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#implement-arima
        locator: "Lesson: Time Series ARIMA, section 'Implement ARIMA'"
      - title: 'statsmodels documentation: statsmodels.tsa.statespace.sarimax.SARIMAX'
        url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.statespace.sarimax.SARIMAX.html
        locator: Class description
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/seasonal-arima.html
        locator: Sec. 9.9 Seasonal ARIMA models
    source:
      id: ms-ml-for-beginners
      ref: quiz-44/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-008
    type: single
    difficulty: easy
    question: "'Walk-Forward' validation involves"
    options:
      - text: re-evaluating a model progressively as it is validated
      - text: re-training a model progressively as it is validated
        correct: true
      - text: re-configuring a model progressively as it is validated
    explanation: |
      Walk-forward validation trains on the data up to some time, forecasts the next step and
      compares the forecast with the actual value. It then adds that value to the training set and
      trains again. The model is re-trained at every step as new data arrive [^1]. This is the
      time-series version of cross-validation: each test point is forecast only from earlier
      observations, and the forecast origin rolls forward in time [^2]. Simply re-scoring a fixed
      model, or changing its configuration at each step, is not what the method does [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#evaluate-your-model
        locator: "Lesson: Time Series ARIMA, section 'Evaluate your model'"
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/tscv.html
        locator: Sec. 5.10 Time series cross-validation
    source:
      id: ms-ml-for-beginners
      ref: quiz-44/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-009
    type: single
    difficulty: easy
    question: Which of these models is popularly used for time series forecasting?
    options:
      - text: ARIMA
        correct: true
      - text: K-Means Clustering
      - text: Logistic Regression
    explanation: |
      ARIMA is the most common time series forecasting model. It relates the current value of a
      series to its past values and past forecast errors [^1][^2]. K-means is a clustering method
      for unlabelled data [^3], and logistic regression is a classifier that predicts a discrete
      label [^4]. Neither is built to forecast future values of a sequence.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#some-definitions
        locator: "Lesson: Intro to Time Series, section 'Some definitions' (Time series forecasting)"
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
        locator: "Lesson: Time Series SVR, section 'Introduction' (Why SVR?)"
      - title: 'scikit-learn User Guide: Clustering'
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
        locator: Sec. 2.3 Clustering (introduction); Sec. 2.3.2 K-means
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Ch. 2 Classification and logistic regression, p. 21
    source:
      id: ms-ml-for-beginners
      ref: quiz-51/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-010
    type: single
    difficulty: easy
    question: Which of these tasks works with time-series data?
    options:
      - text: Forecasting earthquakes from decades of seismic records kept in time order
        correct: true
      - text: Recognizing and naming all the objects that are shown in a single photograph
      - text: Choosing a color palette from the colors of one painting
    explanation: |
      A time series is a sequence of data points indexed in time order, most often taken at equally
      spaced points in time, and time-series modelling is common in signal processing, weather
      forecasting, earthquake prediction and other fields where events are recorded over time [^1].
      Penn State's time-series course opens with such data, the annual number of major earthquakes
      over 99 consecutive years [^2]. A single photograph or the colors of one painting have no time
      order, so they are not time series.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#some-definitions
        locator: 'Lesson: Introduction to time series forecasting, sec. Some definitions'
      - title: 'Penn State STAT 510: Applied Time Series Analysis'
        url: https://online.stat.psu.edu/stat510/Lesson01#overview-of-time-series-characteristics
        locator: Lesson 1.1 Overview of Time Series Characteristics, Example 1.1
    source:
      id: ms-ml-for-beginners
      ref: quiz-41/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-011
    type: single
    difficulty: medium
    question: In an ARIMA model, what does the AR (autoregressive) part do?
    options:
      - text: It removes the trend by differencing the series, repeating until the series is stationary
      - text: It predicts the current value as a linear function of the series' own past values (lags)
        correct: true
      - text: It models the current value from the errors of past forecasts
    explanation: |
      ARIMA combines three parts [^1]. The autoregressive part regresses the variable on its own
      lagged, that is prior, values [^1]; an AR(1) model, for instance, predicts the present value
      from the value one time step earlier with a linear model [^2]. Differencing the data to remove
      a trend and make it stationary is the "I" (integrated) part [^1]. Building the value from past
      forecast errors is the moving-average part: a moving-average term is a past error multiplied
      by a coefficient [^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#arima-in-the-context-of-time-series
        locator: 'Lesson: Time series forecasting with ARIMA, secs. General concepts and ARIMA in the context of time series'
      - title: 'Penn State STAT 510: Applied Time Series Analysis'
        url: https://online.stat.psu.edu/stat510/Lesson01#overview-of-time-series-characteristics
        locator: Lesson 1.1 Overview of Time Series Characteristics (AR(1) model)
      - title: 'Penn State STAT 510: Applied Time Series Analysis'
        url: https://online.stat.psu.edu/stat510/Lesson02#moving-average-models-ma-models
        locator: Lesson 2.1 Moving Average Models (MA models)
    source:
      id: ms-ml-for-beginners
      ref: quiz-44/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: time-series-012
    type: short_answer
    difficulty: medium
    tags:
      - autoregressive-model
      - markov-model
      - sine
    question: |
      A sequence follows $x_t = \sin(0.01\,t)$ exactly, with no noise. You want a *linear*
      autoregressive model $\hat{x}_t = \sum_{i=1}^{\tau} w_i\, x_{t-i}$ that predicts every $x_t$
      without error. What is the smallest window length $\tau$ that makes this possible?
    answer:
      numeric: 2
      tolerance: 0
      hint: a whole number
      model: $\tau = 2$, because $x_t = 2\cos(0.01)\,x_{t-1} - x_{t-2}$
    explanation: |
      The identity $\sin(a + h) + \sin(a - h) = 2\sin a \cos h$ with $a = 0.01(t-1)$ and $h = 0.01$
      gives $x_t = 2\cos(0.01)\,x_{t-1} - x_{t-2}$, an exact linear recurrence with coefficients
      $\approx 1.9999$ and $-1$. One past value is not enough: the same value of $\sin$ occurs on the
      rising and on the falling part of the wave, and the next value differs between the two. This
      is the discrete form of the second-order equation $x'' = -\omega^2 x$ from the exercise hint,
      which needs two initial values. The d2l experiment uses $\tau = 4$ only because its sine data
      carry added noise [^1][^2].
    references:
      - source: d2l
        locator: Sec. 9.1.3 Training
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#training
      - source: d2l
        locator: Sec. 9.1.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/sequence#ex1
      url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#exercises
    status: draft
  - id: time-series-013
    type: single
    difficulty: easy
    tags:
      - stationarity
      - autoregressive-model
      - extrapolation
    question: |
      An investor ranks securities by their past returns and buys the ones that did best, expecting
      the trend to continue. Seen as a sequence-modeling problem, what is the main flaw?
    options:
      - text: It assumes stationary dynamics, but the process behind returns can change, so the past need not predict the future
        correct: true
      - text: It ignores the noise in daily prices, which averaging the returns over a much longer history would remove completely
        why: Even noise-free past data would not carry over if the dynamics that generate returns change.
      - text: It looks too far back; returns obey a first-order Markov condition, so only yesterday matters
        why: Nothing guarantees a Markov condition for returns, and a shorter window does not fix a change in the dynamics.
      - text: It predicts only one step ahead, and one-step-ahead predictions are always unreliable
        why: One-step-ahead predictions are the easy case; the d2l experiment shows them working well while errors grow for $k$-step predictions [^2].
    explanation: |
      An autoregressive forecast assumes that, although the values $x_t$ change, the dynamics that
      generate each observation from the previous ones do not; statisticians call such dynamics
      stationary [^1]. Markets change regime as information and the behavior of other investors
      change, so a rule fitted to past returns is an extrapolation beyond the data it was fitted on,
      and d2l stresses how much harder extrapolation is than interpolation [^2].
    references:
      - source: d2l
        locator: Sec. 9.1.1 Autoregressive Models
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#autoregressive-models
      - source: d2l
        locator: Sec. 9.1.4 Prediction and 9.1.5 Summary
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#summary
      - source: d2l
        locator: Sec. 9.1.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#exercises
    source:
      id: d2l
      ref: chapter_recurrent-neural-networks/sequence#ex2
      url: https://d2l.ai/chapter_recurrent-neural-networks/sequence.html#exercises
    status: draft
