  - id: time-series-051
    type: single
    difficulty: hard
    tags:
      - hmm
      - viterbi
      - most-likely-path
    question: |
      A two-state HMM starts in state 1 or 2 with probability $1/2$ each. State 1 stays in state 1
      with probability 0.99 and moves to state 2 with probability 0.01; state 2 always stays in state
      2. The output distributions over the symbols $\{1, 2, 3, 4\}$ are:

      | state | $P(1)$ | $P(2)$ | $P(3)$ | $P(4)$ |
      | --- | --- | --- | --- | --- |
      | 1 | 0 | 0.199 | 0.8 | 0.001 |
      | 2 | 0.1 | 0 | 0.7 | 0.2 |

      What is the most likely hidden state sequence for the outputs 3, 3, 4?
    options:
      - text: 1, 1, 1
        why: Its probability is $0.5 \cdot 0.8 \cdot 0.99 \cdot 0.8 \cdot 0.99 \cdot 0.001 \approx 0.0003$, since state 1 rarely emits 4.
      - text: 1, 1, 2
        why: 'Switching costs the factor 0.01: $0.5 \cdot 0.8 \cdot 0.99 \cdot 0.8 \cdot 0.01 \cdot 0.2 \approx 0.0006$.'
      - text: 1, 2, 2
        why: Its probability is $0.5 \cdot 0.8 \cdot 0.01 \cdot 0.7 \cdot 0.2 = 0.00056$.
      - text: 2, 2, 2
        correct: true
    explanation: |
      The Viterbi path maximizes the joint probability of states and outputs [^2]. Staying in state 2
      gives $0.5 \cdot 0.7 \cdot 0.7 \cdot 0.2 = 0.049$, far more than any path through state 1 [^1].
      For the outputs 3, 3 alone the best path is 1, 1 ($0.3168$ against $0.245$); the final 4,
      which state 1 almost never emits and which can be reached from state 1 only through the rare
      switch, changes the best explanation of the first two outputs too [^1].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2002) solutions, Problem 2, parts 3–4
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
      - title: 'Wikipedia: Viterbi algorithm'
        locator: Algorithm
        url: https://en.wikipedia.org/wiki/Viterbi_algorithm#Algorithm
    source:
      id: mit-ocw-6867
      ref: final_f02soln#q2.4
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-052
    type: short_answer
    difficulty: hard
    tags:
      - hmm
      - sequence-probability
      - forward-algorithm
    question: |
      An HMM has hidden states A, T, G, C, starts in each with probability $1/4$, and has transitions
      $A \to A$, $A \to T$, $T \to T$, $T \to G$, $G \to G$, $G \to C$, $C \to C$, $C \to A$, each with
      probability $1/2$. States A and G always emit 1; states T and C always emit 2. What probability
      does it assign to the output sequence 1, 2, 1, 2?
    answer:
      numeric: 0.0625
      tolerance: 0.0005
      hint: a probability, e.g. 0.125
      model: Two paths, A T G C and G C A T, each $\frac14\cdot\frac12\cdot\frac12\cdot\frac12 = \frac{1}{32}$; total $\frac{1}{16}$
    explanation: |
      The emissions are deterministic, so only paths whose states emit 1, 2, 1, 2 count. Starting in A,
      the path must go A → T → G → C; starting in G it must go G → C → A → T; every step of each path
      has probability $1/2$ [^1]. Each path has probability $\frac{1}{4}\cdot\left(\frac{1}{2}\right)^3 = \frac{1}{32}$,
      and the sequence probability, the sum over paths, is $1/16$ [^2]. An HMM trained only on the
      repeating pattern 1 1 2 2 would assign this sequence probability 0 [^1].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2001) solutions, Problem 4, parts 4–5
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
      - title: 'Wikipedia: Hidden Markov model'
        locator: Inference — Probability of an observed sequence
        url: https://en.wikipedia.org/wiki/Hidden_Markov_model#Probability_of_an_observed_sequence
    source:
      id: mit-ocw-6867
      ref: final_f01soln#q4.5a
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-053
    type: short_answer
    difficulty: medium
    tags:
      - markov-chain
      - markov-order
      - sequence-prediction
    question: |
      The sequence A A T T G G C C A A T T G G C C ... repeats forever. What is the smallest order $k$
      such that a $k$-th order Markov model, which predicts each symbol from the previous $k$ symbols,
      can predict the sequence perfectly (after the first few symbols)?
    answer:
      numeric: 2
      tolerance: 0
      hint: an integer
      model: 2 — the pair (previous two symbols) determines the next symbol
    explanation: |
      A first-order model fails: after an A the next symbol is A half the time and T the other half,
      so its maximum-likelihood transition probabilities are all $1/2$ [^1]. With two symbols of
      context every pair has a unique successor: AA → T, AT → T, TT → G, TG → G, GG → C, GC → C,
      CC → A, CA → A [^1]. A $k$-th order chain is a first-order chain on tuples of $k$ symbols [^2].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2001) solutions, Problem 4, parts 1–3
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
      - title: 'Wikipedia: Markov chain'
        locator: Discrete-time Markov chain — Variations (a Markov chain of order m is a first-order chain on m-tuples)
        url: https://en.wikipedia.org/wiki/Markov_chain#Variations
    source:
      id: mit-ocw-6867
      ref: final_f01soln#q4.3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-054
    type: true_false
    difficulty: hard
    tags:
      - hmm
      - viterbi
      - ties
    shuffle: false
    question: |
      In an HMM, two distinct state sequences are both most likely for a given output sequence. They
      cross: they share the same state at one intermediate time step, and they differ both before
      and after it. Then there are at least four most likely state sequences.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Because of the Markov property, the two prefixes and the two suffixes can be swapped at the shared state, giving two more paths with the same probability.
    explanation: |
      Write the paths as $(p_1, s, q_1)$ and $(p_2, s, q_2)$, meeting in state $s$ at time $t$. Given
      the state at time $t$, the joint probability factorizes into a part for the prefix and a part
      for the suffix [^2]. Both paths are optimal, so their prefixes score the same and so do their
      suffixes, which makes the crossed paths $(p_1, s, q_2)$ and $(p_2, s, q_1)$ optimal too [^1].
      Because the paths differ both before and after $t$, all four are distinct. If they differed
      on one side only, the swap would just give back the same two paths.
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2001) solutions, Problem 1, part 3
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
      - title: 'Wikipedia: Viterbi algorithm'
        locator: Algorithm
        url: https://en.wikipedia.org/wiki/Viterbi_algorithm#Algorithm
    source:
      id: mit-ocw-6867
      ref: final_f01soln#q1.3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-055
    type: multiple
    difficulty: medium
    tags:
      - hmm
      - conditional-independence
      - forward-backward
      - complexity
    question: |
      An HMM has hidden states $s_1, \dots, s_T$ and observations $x_1, \dots, x_T$, each $x_t$ depending
      only on $s_t$. Which statements are true? Select all that apply.
    options:
      - text: $x_1$ and $x_5$ are independent given the observation $x_3$
        why: Observing $x_3$ does not block the chain $s_1 \to s_2 \to \dots \to s_5$, so information still flows from $x_1$ to $x_5$ [^1].
      - text: $x_1$ and $x_5$ are independent given the hidden state $s_3$
        correct: true
      - text: The forward–backward cost grows quadratically with the number of hidden states but only linearly with $T$
        correct: true
      - text: The observations $x_1, \dots, x_T$ form a first-order Markov chain
        why: Given $x_{t-1}$, earlier observations still carry information about the hidden state, so the outputs generally have no Markov property of any finite order [^1].
    explanation: |
      In the HMM's graph, the hidden chain carries all dependence between observations. Conditioning on
      a hidden state blocks it, but conditioning on an observation does not, because $s_3$ stays
      unobserved [^1]. That is also why the observation sequence alone is not Markov: $x_1$ informs
      $s_1$, which still informs $s_5$ even when $x_3$ is known [^1]. Forward–backward runs in
      $O(S^2 T)$ time for $S$ states and length $T$ [^2].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2004) solutions, Problem 5, parts 2–3; Final exam (Fall 2001) solutions, Problem 1, parts 1–2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
      - title: 'Wikipedia: Forward–backward algorithm'
        locator: Performance (time complexity O(S²T))
        url: https://en.wikipedia.org/wiki/Forward%E2%80%93backward_algorithm#Performance
    source:
      id: mit-ocw-6867
      ref: final_f04soln#q5.2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f04soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-056
    type: short_answer
    difficulty: medium
    tags:
      - kalman-filter
      - posterior-variance
      - state-estimation
    question: |
      A vehicle on a line moves as $x_{t+1} = x_t + u_t$ with known controls $u_t$ (no process noise),
      and you observe $y_t = x_t + z_t$ with independent $z_t \sim \mathcal{N}(0, 1)$. The initial position
      has prior $\mathcal{N}(0, 4)$. After three observations $y_0, y_1, y_2$, what is the posterior
      variance of the current position $x_2$?
    answer:
      numeric: 0.3077
      tolerance: 0.001
      hint: a variance, 3 decimals
      model: $\left(\frac{1}{4} + 3\right)^{-1} = \frac{4}{13} \approx 0.308$
    explanation: |
      With known controls and no process noise, every observation is a noisy measurement of the same
      unknown starting point, shifted by a known amount. For Gaussians the precisions (inverse
      variances) add: $V_t^{-1} = V_0^{-1} + (\text{number of observations})$ with unit noise, the
      information-filter form of the Kalman update [^1] [^2]. Here $1/4 + 3 = 13/4$, so the variance is
      $4/13 \approx 0.308$. It does not depend on the controls $u_t$ [^1].
    references:
      - source: mit-ocw-6438
        locator: Quiz 2 (2013), Question 2 (c)
        url: https://ocw.mit.edu/courses/6-438-algorithms-for-inference-fall-2014/resources/mit6_438f14_q13_2/
      - title: 'Wikipedia: Kalman filter'
        locator: Information filter
        url: https://en.wikipedia.org/wiki/Kalman_filter#Information_filter
    source:
      id: mit-ocw-6438
      ref: mit6_438f14_q13_2#q2c
      url: https://ocw.mit.edu/courses/6-438-algorithms-for-inference-fall-2014/resources/mit6_438f14_q13_2/
    status: reviewed
    reviewed_by: claude
  - id: time-series-057
    type: single
    difficulty: hard
    tags:
      - hidden-semi-markov-model
      - forward-algorithm
      - complexity
    question: |
      A process stays in each of its $k$ states for a random duration $d \in \{1, \dots, M\}$ and then
      jumps to a different state, so it is turned into an HMM whose states are pairs $(x, t)$: the
      current state and the time spent in it so far. Run naively on these $kM$ states, the forward
      algorithm costs $O(N k^2 M^2)$ for $N$ time steps, but it can be done in $O(N(k^2 + kM))$. What
      makes the saving possible?
    options:
      - text: Each $(x, t)$ only moves to $(x, t + 1)$ or some $(x', 1)$, with a factored switch probability
        correct: true
      - text: Emissions depend only on $x$, so the elapsed time $t$ can be dropped from the state
        why: The elapsed time decides how likely it is to leave the state, so it cannot be dropped from the transition model.
      - text: Durations are at most $M$, so each forward message has only $M$ non-zero entries
        why: Each message still has up to $kM$ non-zero entries; the bound $M$ only limits the size of the augmented state space.
      - text: Replacing the sums over states by maxima, as Viterbi does, is cheaper
        why: Maxima cost the same as sums; the saving comes from the sparse, factored transition structure, which helps both algorithms.
    explanation: |
      The augmented chain is an ordinary HMM with $kM$ states, so the textbook forward recursion
      costs $O((kM)^2)$ per step [^1] [^2]. But most transitions are impossible: from $(x, t)$ the
      process either stays, moving to $(x, t + 1)$, or leaves to a new state $x'$ with elapsed time 1.
      The stay updates cost $O(kM)$ per step. For the switches, the probability is "leave after $t$
      steps" times $p_T(x' \mid x)$, so first sum the messages over $t$ for each $x$ ($O(kM)$), then
      combine over pairs $(x, x')$ ($O(k^2)$) [^1].
    references:
      - source: mit-ocw-6438
        locator: Quiz 1 (2011), Problem 2 (b)–(c)
        url: https://ocw.mit.edu/courses/6-438-algorithms-for-inference-fall-2014/resources/mit6_438f14_q11_1/
      - title: 'Wikipedia: Forward–backward algorithm'
        locator: Performance (time complexity O(S²T))
        url: https://en.wikipedia.org/wiki/Forward%E2%80%93backward_algorithm#Performance
    source:
      id: mit-ocw-6438
      ref: mit6_438f14_q11_1#q2c
      url: https://ocw.mit.edu/courses/6-438-algorithms-for-inference-fall-2014/resources/mit6_438f14_q11_1/
    status: reviewed
    reviewed_by: claude
  - id: time-series-058
    type: true_false
    difficulty: medium
    tags:
      - markov-chain
      - ergodicity
      - aperiodicity
    shuffle: false
    question: |
      A first-order Markov chain on the states A, T, G, C has the transitions $A \to A$, $A \to T$,
      $T \to T$, $T \to G$, $G \to G$, $G \to C$, $C \to C$ and $C \to A$, each with probability $1/2$.
      This chain is ergodic.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Every state reaches every other one around the cycle A → T → G → C → A (irreducible), and the self-loops make it aperiodic.
    explanation: |
      A finite chain is ergodic when it is irreducible and aperiodic [^2]. Following the cycle
      $A \to T \to G \to C \to A$, every state can reach every other state, and each state has a
      self-loop, so returns are possible after 1 step and the period is 1 [^2]. This is the
      maximum-likelihood first-order model of the repeating sequence AATTGGCC..., which is ergodic
      even though the sequence itself is deterministic [^1].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2001) solutions, Problem 4, parts 1–2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
      - title: 'Wikipedia: Markov chain'
        locator: Properties — Ergodicity
        url: https://en.wikipedia.org/wiki/Markov_chain#Ergodicity
    source:
      id: mit-ocw-6867
      ref: final_f01soln#q4.2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f01soln/
    status: reviewed
    reviewed_by: claude
  - id: time-series-059
    type: single
    difficulty: medium
    tags:
      - hmm
      - absorbing-state
      - posterior-state
    question: |
      A two-state HMM starts in state 1 or 2 with probability $1/2$ each. State 1 stays in state 1
      with probability 0.99 and moves to state 2 with probability 0.01; state 2 never leaves. Symbol 3
      is emitted with probability 0.8 in state 1 and 0.7 in state 2. The HMM runs for millions of
      steps, and you see only the last output symbol, which is 3. What is the most likely hidden
      state at that last step?
    options:
      - text: State 1, because it emits 3 more often than state 2
        why: 'The emission ratio 0.8/0.7 is tiny compared with the prior odds: after $t$ steps, state 1 has probability $0.5 \cdot 0.99^t$, essentially 0.'
      - text: Both are equally likely, because the HMM started in each with probability $1/2$
        why: The starting distribution is forgotten; the chain drifts into the absorbing state 2.
      - text: It cannot be decided from the last symbol alone
        why: The prior over the state at that time is known from the transition model, and combined with the emission it gives a clear answer.
      - text: State 2, because state 1 has almost surely been left long before
        correct: true
    explanation: |
      To stay in state 1 for $t$ steps the chain must start there and avoid the 0.01 exit every time,
      so $P(s_t = 1) = 0.5 \cdot 0.99^{t}$, which is essentially 0 after millions of steps, while
      state 2 is absorbing [^1]. The posterior for the last state weighs this prior by the emission
      probabilities, $0.8$ against $0.7$, which cannot overcome the prior [^2]. The answer is state 2.
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2002) solutions, Problem 2, part 2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
      - title: 'Wikipedia: Hidden Markov model'
        locator: Inference — Probability of the latent variables (filtering)
        url: https://en.wikipedia.org/wiki/Hidden_Markov_model#Probability_of_the_latent_variables
    source:
      id: mit-ocw-6867
      ref: final_f02soln#q2.2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
    status: reviewed
    reviewed_by: claude
