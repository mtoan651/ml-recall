  - id: time-series-045
    type: single
    difficulty: medium
    tags:
      - rolling-statistics
      - lookahead-leakage
      - pandas
    question: |
      `y` is a pandas Series of daily sales indexed by date. You want a feature for day $t$ equal to
      the mean of the 7 days before $t$, with no lookahead leakage. Which expression computes it?
    options:
      - text: '`y.shift(1).rolling(7).mean()`'
        correct: true
      - text: '`y.rolling(7).mean()`'
        why: A trailing window ends at the current row, so the feature for day $t$ includes the target $y_t$ itself [^1].
      - text: '`y.shift(1).rolling(7, center=True).mean()`'
        why: A centered window on the shifted series covers days $t-4$ to $t+2$, so it includes the target and later days [^1].
      - text: '`y.rolling(7, center=True).mean().shift(1)`'
        why: The centered window around day $t-1$ still reaches day $t+2$; shifting afterwards does not remove those values [^1].
    explanation: |
      Rolling statistics used as features must not see the value being predicted: set the result at
      the right end of the window (`center=False`, the default of `rolling`) and lag the target one
      step [^1]. `y.shift(1)` moves each value one day later, so at day $t$ the trailing 7-day window
      covers $y_{t-7}, \dots, y_{t-1}$ [^2]. Centered windows are fine for moving-average plots, but as
      features they leak future values [^1].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 4 exercise, text before Question 5 Create statistical features
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex4.ipynb
      - title: 'pandas documentation: pandas.Series.rolling'
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.rolling.html
        locator: Parameters `window` and `center` (labels at the right edge of the window by default)
    source:
      id: kaggle-learn
      ref: time_series/ex4#q5
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex4.ipynb
