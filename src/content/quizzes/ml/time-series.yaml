  - id: time-series-039
    type: short_answer
    difficulty: medium
    tags:
      - seasonality
      - seasonal-indicators
      - fourier-features
    question: |
      For a daily sales series you create two kinds of seasonal features: weekly seasonal indicators
      (one-hot day of the week, dropping one day as the baseline) and Fourier features of order 4 for
      the monthly season. How many seasonal feature columns is that in total?
    answer:
      numeric: 14
      tolerance: 0
      hint: a whole number
      model: $6$ weekly indicators $+ 2 \times 4 = 8$ Fourier features $= 14$
    explanation: |
      Seasonal indicators are a one-hot encoding of the season; the 7 days of the week give 7 columns,
      and linear regression works best with one dropped, leaving 6 [^1]. Fourier features come in
      sine/cosine pairs, one pair per frequency, so order 4 means 4 pairs or 8 columns [^1]. In total
      $6 + 8 = 14$. Indicators suit a short season with few observations, such as a week of daily
      data, and Fourier features a long season with many observations, such as a month or a year of
      daily data [^1][^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 3 Seasonality — tutorial, Seasonal indicators; Fourier Features and the Periodogram
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut3.ipynb
