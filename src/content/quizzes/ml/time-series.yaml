      ref: W3D3_HiddenDynamics/W3D3_Tutorial3#demo1.1
      url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D3_HiddenDynamics/instructor/W3D3_Tutorial3.ipynb
