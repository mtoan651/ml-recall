  - id: time-series-046
    type: single
    difficulty: medium
    tags:
      - hybrid-models
      - residuals
      - xgboost
      - extrapolation
    question: |
      You build a "boosted hybrid" forecaster from a linear regression on trend features and an
      XGBoost model on other features, such as the month and the product family. Which procedure is
      right?
    options:
      - text: Fit the regression to the target, fit XGBoost to its residuals, and add the two predictions
        correct: true
      - text: Fit XGBoost to the target, fit the regression to its residuals, and add the two predictions
        why: XGBoost would absorb the trend inside the training range, leaving the regression no trend to learn, so the forecast goes flat beyond the training data [^1].
      - text: Fit the regression to the target, fit XGBoost to its residuals, and forecast with XGBoost alone
        why: XGBoost only learned the detrended residuals; without the regression's prediction the forecast loses the trend [^2].
      - text: Fit both models to the target separately and average their forecasts
        why: Averaging is not boosting; and XGBoost on its own cannot extrapolate the trend, so its half of the average stays flat [^1].
    explanation: |
      In a boosted hybrid, the first model fits the original series, the second fits the residual
      series (target minus the first model's predictions), and the predictions are added [^1]. In
      Kaggle Learn's implementation, `fit` trains `model_2` on `y - y_fit` and `predict` adds
      `model_2`'s predictions to `model_1`'s [^2]. The order matters: linear regression extrapolates
      a trend, while decision trees and their ensembles such as XGBoost cannot, so the regression
      must learn the trend before XGBoost learns the rest [^1].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 5 Hybrid Models — tutorial, Hybrid Forecasting with Residuals; Designing Hybrids
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut5.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 5 exercise, Questions 1–2 fit and predict methods for the boosted hybrid (solutions)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex5.py
    source:
