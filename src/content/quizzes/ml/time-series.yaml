  - id: time-series-042
    type: single
    difficulty: easy
    tags:
      - cycles
      - moving-average
      - seasonality
    question: |
      Daily sales of school supplies have a strong weekly pattern and irregular cycles of growth and
      decay that last a few months. Which centered moving-average window removes the weekly pattern
      but keeps the cycles visible?
    options:
      - text: 7 days
        correct: true
      - text: 3 days
        why: A window shorter than the weekly season does not average over a full week, so the weekly ups and downs remain [^1].
      - text: 365 days
        why: A year-long window would also average away cycles lasting a few months, leaving only the trend [^2].
    explanation: |
      To isolate cycles, choose a window long enough to smooth over the short-term season but short
      enough to preserve the cycles; Kaggle Learn uses a centered seven-day moving average for
      school-supply sales [^1]. Seven days contain each weekday once, so the weekly pattern cancels
      while slower changes survive. The same idea with a window longer than every season, such as
      365 days for daily data, leaves only the trend [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 4 exercise, Question 1 Plotting cycles (text and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex4.ipynb
