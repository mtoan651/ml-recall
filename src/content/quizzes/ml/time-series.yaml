  - id: time-series-050
    type: single
    difficulty: medium
    tags:
      - hmm
      - emission-probabilities
      - impossible-sequences
    question: |
      A two-state HMM starts in state 1 or 2 with probability $1/2$ each. State 1 stays in state 1
      with probability 0.99 and moves to state 2 with probability 0.01; state 2 always stays in state
      2. The output distributions over the symbols $\{1, 2, 3, 4\}$ are:

      | state | $P(1)$ | $P(2)$ | $P(3)$ | $P(4)$ |
      | --- | --- | --- | --- | --- |
      | 1 | 0 | 0.199 | 0.8 | 0.001 |
      | 2 | 0.1 | 0 | 0.7 | 0.2 |

      Which output sequence of length 2 can **not** be generated by this HMM?
    options:
      - text: 2, 1
        why: 'State 1 emits 2, moves to state 2 (probability 0.01), and state 2 emits 1: possible.'
      - text: 4, 2
        why: 'State 1 can emit 4 (probability 0.001), stay in state 1 and emit 2: possible.'
      - text: 1, 2
        correct: true
      - text: 1, 4
        why: 'State 2 emits 1, stays in state 2 and emits 4: possible.'
    explanation: |
      Symbol 1 can only come from state 2, and state 2 is absorbing, so the next state is again 2 [^1].
      State 2 never emits symbol 2, so "1, 2" has probability 0. The probability of an output sequence
      sums over all hidden paths, and here every path that could emit the first symbol is blocked at
      the second [^2].
    references:
      - source: mit-ocw-6867
        locator: Final exam (Fall 2002) solutions, Problem 2, part 1
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
      - title: 'Wikipedia: Hidden Markov model'
        locator: Inference — Probability of an observed sequence
        url: https://en.wikipedia.org/wiki/Hidden_Markov_model#Probability_of_an_observed_sequence
    source:
      id: mit-ocw-6867
      ref: final_f02soln#q2.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f02soln/
