  - id: time-series-049
    type: single
    difficulty: medium
    tags:
      - multistep-forecasting
      - dirrec
      - direct-strategy
      - recursive-strategy
    question: |
      You need an 8-week forecast from a gradient-boosting regressor that predicts a single output
      per model. Which strategy trains one model per step and gives each later model the forecasts
      of the earlier steps as extra lag features?
    options:
      - text: DirRec
        correct: true
      - text: Direct
        why: Direct trains one model per step, but each uses only the original lags; no forecasts are fed in [^1].
      - text: Recursive
        why: Recursive trains a single one-step model and feeds its own forecast back as a lag for the next step [^1].
      - text: MultiOutput
        why: A multioutput model predicts all steps at once with one model, so there is no chain of per-step models [^1].
    explanation: |
      DirRec combines the direct and recursive strategies: a model per step, each with the forecasts
      from previous steps as new lag features [^1]. Its models always have up-to-date lags, so it can
      capture serial dependence better than Direct, but like Recursive it can suffer from error
      propagation [^1]. In scikit-learn, wrapping a regressor in `MultiOutputRegressor` gives the
      Direct strategy and `RegressorChain` gives DirRec, which Kaggle Learn uses with XGBoost
      [^1][^2]. Recent XGBoost versions (1.6 and later) can also fit several regression outputs
      directly [^3].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 6 Forecasting with Machine Learning — tutorial, Multistep Forecasting Strategies
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut6.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 6 exercise, Question 4 Forecast with the DirRec strategy (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex6.py
      - title: 'XGBoost documentation: Multiple Outputs'
        locator: Introduction (multi-output regression since version 1.6)
        url: https://xgboost.readthedocs.io/en/stable/tutorials/multioutput.html
    source:
