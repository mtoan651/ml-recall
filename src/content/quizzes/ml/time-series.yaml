  - id: time-series-030
    type: short_answer
    difficulty: medium
    tags:
      - exponential-smoothing
      - forecasting
    question: |
      Simple exponential smoothing with $\alpha = 0.3$ forecasts
      $\hat y_{t+1} = \alpha y_t + (1-\alpha)\hat y_t$. Starting from $\hat y_1 = 10$, the observations are
      $y_1 = 10$, $y_2 = 14$, $y_3 = 8$. What is the forecast $\hat y_4$? Give 2 decimals.
    answer:
      numeric: 10.24
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $\hat y_2 = 10$, $\hat y_3 = 0.3 \cdot 14 + 0.7 \cdot 10 = 11.2$, $\hat y_4 = 0.3 \cdot 8 + 0.7 \cdot 11.2 = 10.24$
    explanation: |
      Each forecast is a weighted average of the newest observation and the previous forecast, so the
      weights on older observations decay geometrically as $\alpha(1-\alpha)^j$ [^1]. Here
      $\hat y_2 = 10$, $\hat y_3 = 11.2$ and $\hat y_4 = 2.4 + 7.84 = 10.24$. Simple exponential
      smoothing has no trend or seasonal component; Holt's and Holt–Winters' methods add them [^1][^2].
    references:
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/ses.html
        locator: Sec. 8.1 Simple exponential smoothing
      - source: ds-interviews
        locator: theory.md, Time series — "Which models do you know for solving time series problems?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    source:
      id: ds-interviews
      ref: theory.md#q162
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    status: reviewed
    reviewed_by: claude
  - id: time-series-031
    type: short_answer
    difficulty: medium
    tags:
      - differencing
      - trend
      - stationarity
    question: |
      A noise-free series has the quadratic trend $y_t = 5 + 3t + 0.5t^2$. You difference it once,
      $y'_t = y_t - y_{t-1}$, and then a second time, $y''_t = y'_t - y'_{t-1}$. What constant value does
      the twice-differenced series take?
    answer:
      numeric: 1
      tolerance: 0.001
      hint: a number
      model: $y'_t = 2.5 + t$, so $y''_t = 1$ for all $t$
    explanation: |
      Differencing removes a polynomial trend one degree at a time: $y'_t = 3 + 0.5(2t - 1) = 2.5 + t$
      still has a linear trend, and the second difference is the constant $1$ [^1]. Many forecasting
      models (ARIMA, for example) need a stationary series, so a trend is removed by differencing or
      modelled explicitly before fitting, and the forecasts are integrated back afterwards [^1][^2].
    references:
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/stationarity.html
        locator: Sec. 9.1 Stationarity and differencing (second-order differencing)
      - source: ds-interviews
        locator: theory.md, Time series — "If there's a trend in our series, how we can remove it? And why would we want to do it?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    source:
      id: ds-interviews
      ref: theory.md#q163
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    status: reviewed
    reviewed_by: claude
  - id: time-series-032
    type: short_answer
    difficulty: easy
    tags:
      - autoregressive-model
      - ar1
      - forecasting
    question: |
      An AR(1) model $y_t = 2 + 0.6\,y_{t-1} + \varepsilon_t$ (noise with mean 0) is fitted to a series whose
      last value is $y_T = 10$. What is the two-step-ahead forecast $\hat y_{T+2}$?
    answer:
      numeric: 6.8
      tolerance: 0.001
      hint: a number
      model: $\hat y_{T+1} = 2 + 0.6 \cdot 10 = 8$, $\hat y_{T+2} = 2 + 0.6 \cdot 8 = 6.8$
    explanation: |
      An autoregressive model regresses the series on its own lagged values [^1][^2]. Forecasts are
      made recursively, replacing unknown future values by their forecasts and the noise by its mean 0:
      $8$, then $6.8$. Further ahead, the forecasts converge to the mean $2/(1-0.6) = 5$ [^1].
    references:
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/AR.html
        locator: Sec. 9.3 Autoregressive models
      - source: ds-interviews
        locator: theory.md, Time series — "You have a series with only one variable 'y' measured at time t. How do predict 'y' at time t+1?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    source:
      id: ds-interviews
      ref: theory.md#q164
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    status: reviewed
    reviewed_by: claude
  - id: time-series-033
    type: single
    difficulty: medium
    tags:
      - tree-based-models
      - extrapolation
      - differencing
    question: |
      Monthly sales grow steadily, and future months will exceed every value in the training data. You
      want to use gradient-boosted trees with lag features. Which target choice lets the trees handle
      the trend?
    options:
      - text: Predict $y_t$ directly after standardizing it with the training mean and standard deviation
        why: Standardizing is a fixed linear rescaling; the future values still lie outside the scaled training range.
      - text: Shuffle the months before training so the trees see future values
        why: Shuffling leaks the future into training and makes validation scores meaningless for forecasting [^2].
      - text: Predict $y_t$ directly but use more and deeper trees
        why: Any tree predicts averages of training targets, so however many trees you add it cannot output values beyond the training range [^1].
      - text: Predict the change $y_t - y_{t-1}$ and add it to the last observed value
        correct: true
    explanation: |
      A regression tree predicts the mean target of a leaf, so a tree ensemble can only output values
      within the range seen in training and flattens out on a growing series [^1][^3]. Differencing
      removes the trend: the month-to-month changes have a stable range the trees can learn, and adding
      the predicted change to the last value lets the forecast keep rising [^2].
    references:
      - source: ds-interviews
        locator: theory.md, Time series — "What are the problems with using trees for solving time series problems?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/stationarity.html
        locator: Sec. 9.1 Stationarity and differencing
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#regression
        locator: Sec. 1.10.2 Regression
    source:
      id: ds-interviews
      ref: theory.md#q166
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#time-series
    status: reviewed
    reviewed_by: claude
  - id: time-series-034
    type: short_answer
    difficulty: easy
    tags:
      - linear-regression
      - time-dummy
      - trend
    question: |
      A linear regression on 30 days of hardcover book sales, with a time dummy that counts the days,
      gives the model `Hardcover = 3.33 * Time + 150.5`. By how much does the model expect sales to
      change over 6 days? Round to 2 decimals.
    answer:
      numeric: 19.98
      tolerance: 0.01
      hint: a number, 2 decimals
      model: $6 \times 3.33 = 19.98$
    explanation: |
      In `target = weight * feature + bias`, the weight is the average change in the target per unit
      change of the feature [^1]. The time dummy grows by 1 per day, so 6 days change the prediction by
      $6 \times 3.33 = 19.98$ sales; the intercept 150.5 cancels in the difference [^2]. Fitting a line
      to the time dummy is how linear regression models time dependence, here sales that are higher
      later in the month [^1].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 1 Linear Regression with Time Series — tutorial, Time-step features
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut1.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 1 exercise, Question 1 (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex1.py
    source:
      id: kaggle-learn
      ref: time_series/ex1#q1
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: time-series-035
    type: single
    difficulty: easy
    tags:
      - lag-features
      - serial-dependence
      - autoregression
    question: |
      Two series are generated by `target = w * lag_1 + error`, where `lag_1` is the previous value
      and `error` is random noise: one with $w = 0.95$, the other with $w = -0.95$. What does the
      series with $w = -0.95$ look like in a time plot?
    options:
      - text: It zig-zags, since consecutive values tend to have opposite signs
        correct: true
      - text: It stays above or below zero for long runs before crossing over
        why: Long runs of one sign come from $w = 0.95$, where each value tends to keep the sign of the previous one [^1].
      - text: It trends steadily downward, because the weight is negative
        why: The weight links each value to the previous one; it creates no drift in the mean, so neither series has a trend.
      - text: It looks like pure noise, because the previous value carries no information
        why: With $|w| = 0.95$ the previous value is highly informative; it just predicts a value of the opposite sign [^1].
    explanation: |
      In the model `target = weight * lag_1 + error`, a weight close to 1 means the next value likely
      has the same sign as the previous one, and a weight close to −1 means it likely has the opposite
      sign [^1]. So the series with $w = -0.95$ flips back and forth around zero, while the one with
      $w = 0.95$ wanders in long runs [^1]. Both show strong serial dependence: each value can be
      predicted from the previous one, which a lag plot would reveal as a tight line [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 1 exercise, Question 2 Interpret linear regression with a lag feature (text and solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex1.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 1 Linear Regression with Time Series — tutorial, Lag features
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut1.ipynb
    source:
      id: kaggle-learn
      ref: time_series/ex1#q2
      url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/ex1.ipynb
    status: reviewed
    reviewed_by: claude
  - id: time-series-036
    type: short_answer
    difficulty: easy
    tags:
      - trend
      - moving-average
      - seasonality
    question: |
      A monthly retail sales series has a seasonal pattern that repeats every year. You want a
      moving-average plot that shows only the trend. What is the smallest window length, in months,
      that averages over one full season?
    answer:
      numeric: 12
      tolerance: 0
      hint: a whole number of months
      model: 12 months — one full year of monthly observations
    explanation: |
      For a change to count as trend it must happen over a longer period than any seasonal change, so
      the moving average must span at least the longest seasonal period [^1]. A yearly season of
      monthly data lasts 12 observations, and a 12-point window contains every month once, so the
      seasonal ups and downs average out. Kaggle Learn's Time Series course uses a window of 12 for
      the monthly *Mauna Loa* series and 365 for daily *Tunnel Traffic* [^1], and a centered window
      of 12 for monthly *Food and Beverage* sales [^2].
    references:
      - source: kaggle-learn
        locator: Time Series, Lesson 2 Trend — tutorial, Moving Average Plots and Example
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/time_series/raw/tut2.ipynb
      - source: kaggle-learn
        locator: Time Series, Lesson 2 exercise, Question 1 Determine trend with a moving average plot (solution)
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/learntools/time_series/ex2.py
    source:
