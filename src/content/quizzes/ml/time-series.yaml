  - id: time-series-029
    type: short_answer
    difficulty: easy
    tags:
      - cross-validation
      - time-series-split
      - forward-chaining
    question: |
      Ordinary $K$-fold cross-validation shuffles away the time order, so for a series of 100
      observations you use forward-chaining splits instead (scikit-learn's `TimeSeriesSplit` with
      `n_splits=4`). The data are cut into 5 consecutive blocks of 20; split $i$ trains on all blocks
      before block $i+1$ and tests on block $i+1$. How many observations does the **third** split train
      on?
    answer:
      numeric: 60
      tolerance: 0
      hint: a whole number
      model: 60 — it trains on observations 1–60 and tests on 61–80
    explanation: |
      Forward chaining always trains on the past and tests on the next block, so the training window
      grows: 20, 40, 60 and 80 observations for the four splits, each tested on the following 20 [^1].
      This mimics how the model will be used and avoids training on the future, which shuffled
      $K$-fold would do [^2][^3].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/cross_validation.html#time-series-split
        locator: Sec. 3.1.2.6 Cross validation of time series data — Time Series Split
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/tscv.html
        locator: Sec. 5.10 Time series cross-validation
      - source: ds-interviews
        locator: theory.md, Validation — "What is K-fold cross-validation?" ("It should not be used in a time series data.")
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#validation
    source:
