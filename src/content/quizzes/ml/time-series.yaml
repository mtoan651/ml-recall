  - id: time-series-028
    type: single
    difficulty: medium
    tags:
      - linear-dynamical-system
      - autoregressive
      - stability
    question: |
      A latent position evolves as $s_t = D\,s_{t-1} + \eta_t$ with independent Gaussian noise $\eta_t$. What does a trajectory
      look like for $D = -0.9$?
    options:
      - text: It flips sign at almost every step, oscillating around 0 with a bounded size
        correct: true
      - text: It grows without bound, roughly doubling in size at every step
        why: That is the behaviour for $|D| > 1$, e.g. $D = 2$; with $|D| < 1$ the deterministic part shrinks.
      - text: It is pure noise with no dependence at all on the previous step
        why: That is the case $D = 0$; here each value is strongly, and negatively, tied to the previous one.
      - text: It drifts slowly in one direction, much like a random walk
        why: A random walk has $D = 1$; with $D = -0.9$ the sign alternates and the process is pulled back toward 0.
    explanation: |
      Ignoring the noise, $s_t = D^t s_0$: with $D = -0.9$ the sign alternates and the size shrinks by 10% per step, while the
      noise keeps re-exciting the process, so the trajectory oscillates around 0 with a stationary spread (variance
      $\sigma_\eta^2/(1 - D^2)$) [^1][^2]. For $|D| > 1$ the state explodes, and for $D = 0$ it is just the noise [^1].
    references:
      - source: neuromatch-cn
        locator: W3D3 Tutorial 3, Section 1.1 (Interactive Demo 1.1, Astrocat's dynamics)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D3_HiddenDynamics/instructor/W3D3_Tutorial3.ipynb
