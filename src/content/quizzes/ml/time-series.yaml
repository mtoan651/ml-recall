  - id: time-series-027
    type: short_answer
    difficulty: medium
    tags:
      - hidden-markov-model
      - markov-chain
      - prediction
    question: |
      A binary hidden Markov chain switches state with probability $p = 0.1$ at each step (and stays with probability 0.9).
      You know the state at time 0 and get no further observations. What is the probability that the state at time 5
      equals the state at time 0?
    answer:
      numeric: 0.664
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $\tfrac12 + \tfrac12(1 - 2p)^5 = 0.5 + 0.5 \cdot 0.8^5 \approx 0.664$
    explanation: |
      Let $q_t$ be the probability of being in the initial state. One step gives $q_{t+1} = (1 - p)\,q_t + p\,(1 - q_t)$, so
      $q_{t+1} - \tfrac12 = (1 - 2p)(q_t - \tfrac12)$ and $q_t = \tfrac12 + \tfrac12(1 - 2p)^t$ [^1]. With $p = 0.1$, $q_5 = 0.5 + 0.5 \cdot 0.8^5 \approx 0.664$:
      without observations, knowledge of the state decays toward 50/50, faster for larger $p$ [^1]. For $p > 0.5$ the factor
      $1 - 2p$ is negative, so the prediction oscillates around $\tfrac12$ while it decays [^1].
    references:
      - source: neuromatch-cn
        locator: W3D3 Tutorial 2, Section 2 Predicting the future in an HMM (Interactive Demo 2.1 Forgetting in a changing world)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D3_HiddenDynamics/instructor/W3D3_Tutorial2.ipynb
    source:
      id: neuromatch-cn
      ref: W3D3_HiddenDynamics/W3D3_Tutorial2#demo2.1
      url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W3D3_HiddenDynamics/instructor/W3D3_Tutorial2.ipynb
