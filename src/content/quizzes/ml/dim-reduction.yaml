  - id: dim-reduction-015
    type: single
    difficulty: medium
    tags:
      - t-sne
      - visualization
    question: |
      You generate 2-D data from two Gaussian clusters, one with 10 times the spread of the other,
      and run t-SNE until the layout is stable. In the plot both clusters look about the same size.
      What is the best explanation?
    options:
      - text: t-SNE adapts distances to local density, expanding dense clusters and contracting sparse ones
        correct: true
      - text: The perplexity was set too low, so random local clumping hides the clusters' true relative sizes
        why: The equal sizes appear across the usual perplexity range. Low-perplexity clumping is a different artefact, seen even in pure noise.
      - text: The optimization stopped too early and would reveal the true sizes after more iterations
        why: The layout was already stable; stopping early produces pinched or point-like shapes, not equalized cluster sizes.
      - text: Any reduction to fewer dimensions distorts distances, and this is that unavoidable information loss
        why: The data were 2-D to begin with, so no dimensions were removed. The equalization is a built-in feature of t-SNE.
    explanation: |
      t-SNE adapts its notion of distance to regional density, so it naturally expands dense clusters
      and contracts sparse ones, evening out their sizes [^1]. Distill stresses that this is not the
      usual distortion of dimensionality reduction (their data were 2-D already) but a predictable
      effect of the design, so relative cluster sizes cannot be read off a t-SNE plot [^1]. This
      follows from t-SNE's focus on local structure: it matches neighbourhood probabilities, not
      global distances [^2].
    references:
      - title: Wattenberg, Viégas & Johnson (2016), How to Use t-SNE Effectively, Distill
        url: https://distill.pub/2016/misread-tsne/
        locator: Sec. 2 "Cluster sizes in a t-SNE plot mean nothing"
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/manifold.html#t-distributed-stochastic-neighbor-embedding-t-sne
        locator: Sec. 2.2.9 t-distributed Stochastic Neighbor Embedding (t-SNE)
    source:
      id: original
      ref: dim-reduction-015
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-016
    type: true_false
    difficulty: easy
    tags:
      - t-sne
      - visualization
    shuffle: false
    question: In a t-SNE plot, if cluster A sits much farther from cluster C than from cluster B, then A is also much farther from C than from B in the original space.
    options:
      - text: 'True'
        why: Distances between well-separated clusters in a t-SNE plot depend heavily on perplexity and may mean nothing about the original geometry.
      - text: 'False'
        correct: true
    explanation: |
      Distill builds three Gaussian clusters with one pair five times farther apart than the other:
      at low perplexity the t-SNE plot shows them as equidistant, and with more points per cluster
      none of the perplexities tried recovers the true geometry [^1]. Their conclusion is that
      distances between well-separated clusters in a t-SNE plot may mean nothing [^1]. t-SNE focuses
      on local structure and does not explicitly preserve global structure; initializing with PCA
      only mitigates this [^2].
    references:
      - title: Wattenberg, Viégas & Johnson (2016), How to Use t-SNE Effectively, Distill
        url: https://distill.pub/2016/misread-tsne/
        locator: Sec. 3 "Distances between clusters might not mean anything"
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/manifold.html#t-distributed-stochastic-neighbor-embedding-t-sne
        locator: Sec. 2.2.9 t-distributed Stochastic Neighbor Embedding (t-SNE)
    source:
      id: original
      ref: dim-reduction-016
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-017
    type: short_answer
    difficulty: easy
    tags:
      - t-sne
      - perplexity
      - hyperparameters
    question: |
      In t-SNE, the {{1}} hyperparameter is, loosely, a guess at the number of close neighbours each
      point has. Lower values make the embedding pay more attention to {{2}} structure and less to
      global structure.
    answer:
      blanks:
        - accept:
            - perplexity
          hint: one word
        - accept:
            - local
            - local neighbourhood
            - local neighborhood
          hint: one word
      model: Perplexity; low perplexity favours local structure.
    explanation: |
      Distill describes perplexity as a rough guess at the number of close neighbours of each point,
      balancing attention between local and global aspects of the data; typical values lie between 5
      and 50 [^1]. scikit-learn defines it as $2^{S}$, where $S$ is the Shannon entropy of the
      conditional distribution, so it is effectively the number of nearest neighbours considered, and
      a lower perplexity ignores more global information in favour of the local neighbourhood [^2].
      It should also stay below the number of points, and comparing plots at several perplexities is
      good practice [^1].
    references:
      - title: Wattenberg, Viégas & Johnson (2016), How to Use t-SNE Effectively, Distill
        url: https://distill.pub/2016/misread-tsne/
        locator: Introduction and Sec. 1 "Those hyperparameters really matter"
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/manifold.html#t-distributed-stochastic-neighbor-embedding-t-sne
        locator: Sec. 2.2.9 t-distributed Stochastic Neighbor Embedding (t-SNE), "Optimizing t-SNE"
