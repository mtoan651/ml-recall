    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-018
    type: single
    difficulty: hard
    tags:
      - autoencoders
      - pca
      - nonlinear-dimensionality-reduction
    question: |
      An autoencoder has a single hidden layer of $k$ linear units, fewer than the number of inputs,
      and is trained to minimize the squared reconstruction error. How does its optimal solution
      relate to PCA?
    options:
      - text: Its weights span the subspace of the top $k$ principal components but need not be orthogonal
        correct: true
      - text: Its weights equal the top $k$ principal components exactly, orthonormal and in the same order
        why: The loss does not change if the code space is rotated, so the weights are generally neither the components nor orthogonal; the components can be recovered from them with an SVD.
      - text: It learns a curved manifold that PCA cannot represent, so its reconstruction error is lower
        why: With linear units the whole network is a linear map, so it cannot beat PCA's best rank-$k$ reconstruction; nonlinear activations are needed for that.
      - text: Nothing in common, since through the bottleneck it simply learns to copy its input exactly
        why: With $k$ smaller than the input size the code is undercomplete, so exact copying (the identity) is impossible; only a code at least as large as the input could learn it.
    explanation: |
      With linear activations, the optimal single-hidden-layer autoencoder with $k$ units spans the
      same subspace as the first $k$ principal components, and its output is the orthogonal
      projection onto that subspace [^1]. Its weights are generally neither equal to the components
      nor orthogonal, because the loss is invariant to rotations of the code space; the components
      can be recovered with an SVD [^1]. The bottleneck is what prevents learning the identity
      function [^2]. The real power of autoencoders comes from nonlinear activations, which let them
      learn nonlinear reduction functions [^3]; Hinton's deep autoencoder with a 30-unit code
      had a smaller reconstruction error than the first 30 principal components [^1].
    references:
      - title: 'Wikipedia: Autoencoder'
        url: https://en.wikipedia.org/wiki/Autoencoder#Principal_component_analysis
        locator: Section "Applications", subsections "Dimensionality reduction" and "Principal component analysis"
      - title: 'Wikipedia: Autoencoder'
        url: https://en.wikipedia.org/wiki/Autoencoder#Interpretation
        locator: Section "Mathematical principles", subsection "Interpretation" (undercomplete autoencoders)
      - title: 'Wikipedia: Dimensionality reduction'
        url: https://en.wikipedia.org/wiki/Dimensionality_reduction#Autoencoder
        locator: Section "Feature projection", subsection "Autoencoder"
    source:
      id: original
      ref: dim-reduction-018
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-019
    type: short_answer
    difficulty: medium
    tags:
      - curse-of-dimensionality
      - high-dimensional-geometry
    question: |
      Points are spread uniformly in the cube $[-1, 1]^d$. What fraction of the cube's volume lies
      inside the inscribed unit ball when $d = 10$?
    answer:
      numeric: 0.0025
      tolerance: 0.0001
      hint: a decimal rounded to 4 places, e.g. 0.0123
      model: $\pi^{5} / (10 \cdot 2^{9} \cdot \Gamma(5)) = 306.02 / 122880 \approx 0.0025$
    explanation: |
      The volume of a ball of radius $r$ divided by that of the enclosing cube of side $2r$ is
      $\pi^{d/2} / (d\, 2^{d-1}\, \Gamma(d/2))$, which tends to 0 as $d$ grows [^1]. For $d = 10$
      this is $\pi^5 / (10 \cdot 512 \cdot 24) \approx 0.0025$, against $0.785$ for $d = 2$ and
      $0.524$ for $d = 3$. Almost all of the volume sits in the corners, far from the centre, so
      uniformly spread data become sparse; this is one face of the curse of dimensionality, in which
      the amount of data needed often grows exponentially with the dimension [^2]. Reducing the
      dimension first is a common remedy, for example before a k-nearest-neighbours search [^3].
    references:
      - title: 'Wikipedia: Curse of dimensionality'
        url: https://en.wikipedia.org/wiki/Curse_of_dimensionality#Distance_function
        locator: Section "Domains", subsection "Distance function"
      - title: 'Wikipedia: Curse of dimensionality'
        url: https://en.wikipedia.org/wiki/Curse_of_dimensionality
        locator: Lead section
      - title: 'Wikipedia: Dimensionality reduction'
        url: https://en.wikipedia.org/wiki/Dimensionality_reduction#Dimension_reduction
        locator: Section "Dimension reduction"
    source:
      id: original
      ref: dim-reduction-019
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-020
    type: single
    difficulty: hard
    tags:
      - factor-analysis
      - latent-variable-models
      - identifiability
    question: |
      A friend proposes to improve factor analysis by allowing correlated latents:
      $\mathbf{h} \sim \mathcal{N}(\mathbf{0}, C)$ and $\mathbf{v} \mid \mathbf{h} \sim \mathcal{N}(F
      \mathbf{h} + \mathbf{c}, \Psi)$, with $\Psi$ diagonal and $C$ an arbitrary covariance matrix
      (standard factor analysis has $C = I$). Is the model more expressive?
    options:
      - text: Yes; correlated latents can model correlations between visibles that standard factor analysis cannot
        why: Standard factor analysis already models correlations through $F F^\top$; the extra $C$ can be absorbed into the loadings [^1].
      - text: Yes; $C$ adds $H(H+1)/2$ parameters for $H$ latents, which can be estimated from data
        why: Those parameters are redundant, since $(F, C)$ and $(F C^{1/2}, I)$ give identical distributions of $\mathbf{v}$, so they cannot be identified [^1].
      - text: No; $(F, C)$ and $(F C^{1/2}, I)$ give exactly the same $p(\mathbf{v})$
        correct: true
      - text: No, but only because $\Psi$ is diagonal; with a full $\Psi$ the correlated latents would help
        why: The argument $F C F^\top = (F C^{1/2})(F C^{1/2})^\top$ does not involve $\Psi$ at all [^1].
    explanation: |
      The visibles are a linear map of Gaussians plus independent noise, so $p(\mathbf{v}) =
      \mathcal{N}(\mathbf{c}, F C F^\top + \Psi)$ [^1]. With the symmetric square root $C^{1/2} = E
      \Lambda^{1/2} E^\top$, $F C F^\top = \tilde F \tilde F^\top$ for $\tilde F = F C^{1/2}$, which is
      the covariance of standard factor analysis with loadings $\tilde F$ [^1][^2]. Equivalently,
      sampling $\mathbf{h} = C^{1/2}\mathbf{h}'$ with $\mathbf{h}' \sim \mathcal{N}(\mathbf{0}, I)$
      shows the correlation can be moved into $F$; the richer model gains nothing.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.9 (a)–(c) Factor analysis
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Factor analysis'
        url: https://en.wikipedia.org/wiki/Factor_analysis
        locator: Statistical model
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#fa-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-021
    type: single
    difficulty: medium
    tags:
      - whitening
      - ica
      - eigendecomposition
    question: |
      A random vector $\mathbf{x}$ has covariance $C = E \Lambda E^\top$ (eigendecomposition, $E$
      orthogonal). $V = \Lambda^{-1/2} E^\top$ is a whitening matrix: $\mathbf{z} = V\mathbf{x}$ has
      identity covariance. Which of the following is **also** a whitening matrix for $\mathbf{x}$?
    options:
      - text: $V R$ for any orthogonal matrix $R$
        why: $\mathrm{Var}[V R \mathbf{x}] = V R C R^\top V^\top$, which is generally not $I$ because $R$ acts before $C$ is undone [^1].
      - text: $\Lambda^{-1} E^\top$
        why: $\mathrm{Var}[\Lambda^{-1}E^\top\mathbf{x}] = \Lambda^{-1} E^\top C E \Lambda^{-1} = \Lambda^{-1}$, which is not the identity unless all eigenvalues are 1 [^1].
      - text: $2V$
        why: Scaling gives $\mathrm{Var}[2V\mathbf{x}] = 4I$, not the identity [^1].
      - text: $R\,V$ for any orthogonal matrix $R$
        correct: true
    explanation: |
      $\mathrm{Var}[R V \mathbf{x}] = R\,\mathrm{Var}[V\mathbf{x}]\,R^\top = R I R^\top = I$ for every
      orthogonal $R$, so whitening matrices are only unique up to a rotation [^1][^2]. For example,
      $E \Lambda^{-1/2} E^\top$ (ZCA whitening) is another valid choice. This rotational freedom is
      exactly what is left to estimate in ICA after whitening [^1].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.10 (a) Independent component analysis
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Whitening transformation'
        url: https://en.wikipedia.org/wiki/Whitening_transformation
        locator: Definition and whitening matrices (PCA, ZCA)
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#independent-component-analysis-a
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-022
    type: short_answer
    difficulty: medium
    tags:
      - ica
      - whitening
      - orthogonal-matrix
      - degrees-of-freedom
    question: |
      In the ICA model $\mathbf{v} = A\mathbf{h}$ with $D = 4$ independent unit-variance sources and
      an invertible $4 \times 4$ mixing matrix $A$, the data are first whitened: $\mathbf{z} =
      V\mathbf{v} = \tilde A \mathbf{h}$. Since $\tilde A$ must be orthogonal, how many free parameters
      (degrees of freedom) are left to estimate in $\tilde A$?
    answer:
      numeric: 6
      tolerance: 0
      hint: a whole number
      model: An orthogonal $D \times D$ matrix has $D(D-1)/2 = 4 \cdot 3 / 2 = 6$ degrees of freedom (versus $D^2 = 16$ for $A$)
    explanation: |
      Whitening gives $I = \mathrm{Var}(\mathbf{z}) = \tilde A\,\mathrm{Var}(\mathbf{h})\,\tilde
      A^\top = \tilde A \tilde A^\top$ because the sources have identity covariance, so $\tilde A$ is
      orthogonal [^1]. An orthogonal $D \times D$ matrix has $D(D-1)/2$ degrees of freedom, here 6
      instead of the 16 entries of $A$ [^1][^2]. Whitening thus "solves half of the ICA problem",
      which is why algorithms such as FastICA whiten first; the $\log|\det|$ term of the likelihood
      then vanishes as well.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 8 Model-Based Learning, Ex. 8.10 (b) Independent component analysis
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Orthogonal matrix'
        url: https://en.wikipedia.org/wiki/Orthogonal_matrix
        locator: Group properties (dimension n(n − 1)/2)
    source:
      id: gutmann-pen-paper
      ref: model-based-learning#independent-component-analysis-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/model-based-learning.tex
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-023
    type: multiple
    difficulty: medium
    tags:
      - pca
      - reconstruction
      - number-of-components
    question: |
      PCA reduces data $X$ with $d$ features to $Z = XW^\top$ with $k$ components and reconstructs
      $\hat{X} = ZW$. Which statements are true? Select all that apply.
    options:
      - text: Each principal component is a $d$-dimensional vector
        correct: true
      - text: The first principal component is the direction with the highest variance in the data
        correct: true
      - text: With $k = d$, the transformed data $Z$ is exactly the same as $X$
        why: With $k = d$ the components only rotate the coordinate system; $Z$ holds the coordinates in the new basis, which generally differ from $X$ [^1].
      - text: With $k = d$, the reconstruction $\hat{X}$ is exactly the same as $X$
        correct: true
      - text: It is best to pick $k$ as large as possible, so that most of the variance is kept
        why: The point of PCA is a compact representation; $k$ is a trade-off between explained variance and dimension, not something to maximize [^2].
    explanation: |
      Each principal component is a direction in the original $d$-dimensional space, and the
      components are sorted so that the first one captures the most variance [^1]. With $k = d$ the
      $d$ orthonormal components form a full basis: $Z$ is just $X$ expressed in that rotated basis,
      and projecting back gives $\hat{X} = X$ with no loss [^1]. In practice $k$ is chosen to keep
      enough of the variance (for example 90%) while still reducing the dimension [^2].
    references:
      - source: ubc-dsci563
        locator: 'Lecture 3 notes, Principal Component Analysis (PCA): Intuition and terminology; PCA loss function'
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/03_PCA-intro.ipynb
      - source: ubc-dsci563
        locator: Lecture 4 notes, Sec. 2 Choosing the number of components k
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/04_More-PCA-LSA-NMF.ipynb
    source:
      id: ubc-dsci563
      ref: lectures/notes/03_PCA-intro.ipynb#ex3.1
      url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/03_PCA-intro.ipynb
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-024
    type: multiple
    difficulty: medium
    tags:
      - pca
      - linear-regression
      - correlation
    question: |
      You are deciding whether PCA suits a dataset with many correlated numeric features, and you
      wonder how it relates to fitting a line. Which statements about PCA are true? Select all that
      apply.
    options:
      - text: Reducing $d$ dimensions to $k \le d$ with PCA means modelling the data with a $k$-dimensional hyperplane
        correct: true
      - text: PCA assumes that the variables in the dataset are uncorrelated
        why: PCA is most useful when features are correlated, because then a few directions capture most of the variance; it makes no such assumption [^1].
      - text: You can tell which original features dominate a principal component by looking at its weights
        correct: true
      - text: Since PCA and linear regression both minimize squared error, PCA is an unsupervised alternative to linear regression
        why: Linear regression minimizes the vertical error in one target $y$; PCA has no target and minimizes the reconstruction error of all features, measured orthogonally to the subspace [^1].
    explanation: |
      PCA finds a $k$-dimensional subspace (a hyperplane through the mean) that best reconstructs the
      data, and each component's weights $W$ show how much each original feature contributes to it,
      which is how components are interpreted [^1]. Its loss is the squared distance from each point
      to its projection on the subspace, summed over all features; linear regression instead predicts
      one designated target and measures errors along that target only [^1].
    references:
      - source: ubc-dsci563
        locator: Lecture 3 notes, PCA input/output; PCA loss function
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/03_PCA-intro.ipynb
    source:
      id: ubc-dsci563
      ref: lectures/notes/03_PCA-intro.ipynb#ex3.2
      url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/03_PCA-intro.ipynb
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-025
    type: multiple
    difficulty: hard
    tags:
      - pca
      - multicollinearity
      - k-means
    question: |
      PCA turns data $X$ ($n \times d$) into $Z$ ($n \times k$) with components $W$, and reconstructs
      $\hat{x}_i = z_i W$. Which statements are true? Select all that apply.
    options:
      - text: A large magnitude of $Z_{i1}$ means component 1 has a strong influence on the reconstruction $\hat{x}_i$
        correct: true
      - text: K-Means assigns each example to one cluster, while PCA writes each example as a combination of all components
        correct: true
      - text: If two features are perfectly collinear, PCA finds only $d-1$ components that capture any variance
        correct: true
      - text: If two features are perfectly collinear, PCA cannot run because their covariance matrix is singular
        why: PCA still returns $d$ orthogonal components; the component along the redundant direction simply has (almost) zero explained variance [^1].
      - text: The principal components found by PCA are statistically uncorrelated
        correct: true
    explanation: The reconstruction is $\hat{x}_i = \sum_j Z_{ij} W_j$, so the size of $Z_{i1}$ says how much of component 1 goes into example $i$; where K-Means represents an example by one centroid, PCA uses a weighted mix of all components [^2]. With a feature that is an exact combination of others, PCA still returns $d$ orthogonal vectors, but the variance along the redundant direction is zero [^1]. The scores on different components are uncorrelated, since the components diagonalize the covariance matrix [^3].
    references:
      - source: ubc-dsci563
        locator: Lecture 4 notes, Sec. 3.1 PCA and multicollinearity
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/04_More-PCA-LSA-NMF.ipynb
      - source: ubc-dsci563
        locator: Lecture 4 notes, Sec. 1 PCA recap and Sec. 3.3 K-Means and PCA
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/04_More-PCA-LSA-NMF.ipynb
      - title: 'Wikipedia: Principal component analysis'
        url: https://en.wikipedia.org/wiki/Principal_component_analysis#Covariances
        locator: Section "Details", subsection "Covariances"
    source:
