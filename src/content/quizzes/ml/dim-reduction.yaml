  - id: dim-reduction-034
    type: single
    difficulty: medium
    tags:
      - pca
      - manifold-learning
      - swiss-roll
      - lle
    question: |
      Your 3-D data lie on a Swiss roll: a 2-D sheet rolled up into a spiral, with no direction of
      the space that is useless. Why is PCA down to 2 dimensions a poor choice here?
    options:
      - text: It can only project onto a plane, which squashes the roll instead of unrolling it
        correct: true
      - text: Two principal components always keep less than half of the variance of 3-D data
        why: The kept variance depends on the data, and two of three components often keep most of it; the problem is the structure that a linear projection destroys, not the variance figure.
      - text: PCA needs labels to find directions that separate the different layers of the roll
        why: PCA is unsupervised; it picks directions of maximum variance and never uses labels.
      - text: PCA cannot be fitted on data with fewer features than samples
        why: PCA works for any number of samples and features; three features and thousands of points are no problem.
    explanation: |
      PCA is a linear method: it picks the plane that keeps the most variance and projects onto it,
      and linear methods often miss non-linear structure [^2]. A rolled-up sheet has no useless
      direction to drop, so any projection collapses parts of the roll that are far apart along
      the sheet. Manifold learning methods such as LLE instead try to *unroll* it by preserving local
      neighbourhoods [^2][^1]. You can measure this on scikit-learn's `make_swiss_roll`: compare each
      point's nearest neighbours in the 2-D embedding with its nearest neighbours on the unrolled
      sheet; PCA typically preserves far fewer of them than `LocallyLinearEmbedding` does.
    references:
      - source: handson-ml3
        locator: 08_dimensionality_reduction.ipynb, Exercise solutions, 4.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
      - title: 'scikit-learn user guide: Manifold learning'
        locator: Sec. 2.2.1 Introduction; Sec. 2.2.3 Locally Linear Embedding
        url: https://scikit-learn.org/stable/modules/manifold.html#introduction
    source:
      id: handson-ml3
      ref: 08_dimensionality_reduction#ex4
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-035
    type: single
    difficulty: easy
    tags:
      - incremental-pca
      - out-of-core
      - pca
    question: |
      You want to apply PCA to a dataset that is far too large to fit in memory. Which option is
      designed for this?
    options:
      - text: '`IncrementalPCA`, fed with one mini-batch at a time via `partial_fit`'
        correct: true
      - text: '`PCA(svd_solver="randomized")`, which approximates the first components quickly'
        why: Randomized PCA is fast when you keep few components, but it is still a batch method that needs the whole dataset in memory.
      - text: '`KernelPCA` with an RBF kernel, which works with a kernel matrix instead of the data'
        why: The kernel matrix has one entry per pair of instances, so it needs even more memory than the data.
      - text: '`PCA(n_components=0.95)`, which keeps fewer components and so less of the data'
        why: Choosing how many components to keep does not change the fact that `PCA` must see all the data at once during `fit`.
    explanation: |
      Regular `PCA` only supports batch processing, so all the data must fit in main memory.
      `IncrementalPCA` processes the data in mini-batches with `partial_fit` (or `fit` on a
      `numpy.memmap`), giving almost the same components out-of-core [^2]. It is also handy for
      online settings where new instances keep arriving; when the data do fit in memory, regular or
      randomized PCA is faster [^1].
    references:
      - source: handson-ml3
        locator: 08_dimensionality_reduction.ipynb, Exercise solutions, 6.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
      - title: 'scikit-learn user guide: Decomposing signals in components'
        locator: Sec. 2.5.1.2 Incremental PCA
        url: https://scikit-learn.org/stable/modules/decomposition.html#incremental-pca
    source:
