  - id: dim-reduction-032
    type: short_answer
    difficulty: medium
    tags:
      - curse-of-dimensionality
      - euclidean-distance
      - numpy
    question: |
      What does this print, approximately (one decimal)?

      ```python
      import numpy as np

      rng = np.random.default_rng(0)
      a = rng.random((10_000, 600))   # 10,000 random points in the 600-D unit hypercube
      b = rng.random((10_000, 600))   # 10,000 more
      print(np.linalg.norm(a - b, axis=1).mean().round(1))
      ```
    answer:
      numeric: 10.0
      tolerance: 0.15
      hint: A number with one decimal, e.g. 3.7
      model: $\approx \sqrt{600/6} = 10.0$
    explanation: |
      For two independent uniform coordinates on $[0, 1]$,
      $\mathbb{E}[(x - y)^2] = \mathrm{Var}(x) + \mathrm{Var}(y) = 1/12 + 1/12 = 1/6$. Summing over $d$
      coordinates gives a squared distance of
      about $d/6$, and since it concentrates tightly around its mean, the distance is about
      $\sqrt{d/6} = \sqrt{100} = 10$ for $d = 600$ (the script prints `10.0`; in 2-D the same mean
      distance is only about 0.52). Random points in a high-dimensional hypercube are far apart,
      and most of the volume lies far from the centre [^2], so a training set covers the space very
      sparsely and new instances are likely to be far from any training instance; this raises the
      risk of overfitting [^1].
    references:
      - source: handson-ml3
        locator: 08_dimensionality_reduction.ipynb, Exercise solutions, 2.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
      - title: 'Wikipedia: Curse of dimensionality'
        locator: Domains, Distance function
        url: https://en.wikipedia.org/wiki/Curse_of_dimensionality#Distance_function
    source:
      id: handson-ml3
      ref: 08_dimensionality_reduction#ex2
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-033
    type: multiple
    difficulty: medium
    tags:
      - inverse-transform
      - pca
      - kernel-pca
      - t-sne
      - lle
    question: |
      After reducing a dataset's dimensionality, you want to map the reduced points back to the
      original feature space, for example to measure the reconstruction error. Which scikit-learn
      estimators provide such a reverse mapping? Select all that apply.
    options:
      - text: '`PCA`'
        correct: true
      - text: '`KernelPCA(fit_inverse_transform=True)`'
        correct: true
      - text: '`TSNE`'
        why: 't-SNE only offers `fit` and `fit_transform`: it embeds the training points but has no `transform` for new points and no `inverse_transform`.'
      - text: '`LocallyLinearEmbedding`'
        why: LLE can embed new points with `transform`, but it has no `inverse_transform` to map embeddings back to the input space.
    explanation: |
      Dimensionality reduction loses information, so going back is at best approximate, and only
      some algorithms define a reverse mapping at all: PCA has a simple one, t-SNE has none [^1]
      (`PCA.inverse_transform` exists, while `TSNE` offers only `fit` and `fit_transform`).
      `KernelPCA` learns an approximate reverse mapping, a kernel ridge regression that finds the
      "pre-image" of a point, but only when created with `fit_inverse_transform=True` [^2].
      `LocallyLinearEmbedding` can `transform` new points but has no `inverse_transform` [^3].
    references:
      - source: handson-ml3
        locator: 08_dimensionality_reduction.ipynb, Exercise solutions, 3.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/08_dimensionality_reduction.ipynb
