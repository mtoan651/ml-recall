  - id: dim-reduction-027
    type: single
    difficulty: medium
    tags:
      - lsa
      - topic-modeling
      - matrix-factorization
    question: |
      You use LSA for topic modelling: the bag-of-words matrix of $N$ documents and $V$ vocabulary
      words is factored as $X_{N \times V} \approx Z_{N \times K}\, W_{K \times V}$ with $K$ topics.
      Which matrix tells you how much of each topic every document contains?
    options:
      - text: $Z$, with one row of topic weights per document
        correct: true
      - text: $W$, with one row of word weights per topic
        why: $W$ describes the topics themselves, i.e. how strongly each word belongs to each topic [^1].
      - text: $W^\top$, with one row of topic weights per vocabulary word
        why: The rows of $W^\top$ are indexed by words, not documents, so they cannot describe a document's topic mix [^1].
      - text: $X$, since its counts already give each document's topic mix
        why: $X$ holds raw word counts; topics only appear after the factorization [^1].
    explanation: |
      In $X \approx ZW$, row $i$ of $Z$ gives the weights of the $K$ topics for document $i$, and
      row $k$ of $W$ gives the weights of the $V$ words for topic $k$ [^1]. So $Z$ is the
      topic-per-document view and $W$ the word-per-topic view, the same reading used for LSA on the
      toy fruit/city documents [^2].
