  - id: dim-reduction-028
    type: short_answer
    difficulty: easy
    tags:
      - pca
      - eigenvalues
      - explained-variance
    question: |
      Two-dimensional data have unit variance in each coordinate and correlation coefficient $\rho = 0.8$, so the covariance
      matrix is $\begin{bmatrix}1 & 0.8\\ 0.8 & 1\end{bmatrix}$. What fraction of the total variance does the first principal
      component explain?
    answer:
      numeric: 0.9
      tolerance: 0.005
      hint: a fraction, 2 decimals
      model: Eigenvalues $1 \pm \rho = 1.8$ and $0.2$; $1.8/2 = 0.9$
    explanation: The principal components are the eigenvectors of the covariance matrix, and the variances along them are the eigenvalues [^1]. For $\begin{bmatrix}1 & \rho\\ \rho & 1\end{bmatrix}$ the eigenvectors are $[1, 1]/\sqrt2$ and $[1, -1]/\sqrt2$, with eigenvalues $1 + \rho = 1.8$ and $1 - \rho = 0.2$, so the first component explains $1.8/2 = 90\%$ [^1]. As $|\rho|$ shrinks the eigenvalues approach each other (at $\rho = 0$ no direction is preferred), and at $|\rho| = 1$ one eigenvalue is 0 [^1]. Projecting onto the 45° basis also decorrelates the data, as the interactive rotation demo of Neuromatch Academy's W1D4 Tutorial 1 shows [^2].
    references:
      - source: neuromatch-cn
        locator: W1D4 Tutorial 2, Section 1 Calculate the eigenvectors of the sample covariance matrix (interactive demo on correlation and eigenvalues)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W1D4_DimensionalityReduction/instructor/W1D4_Tutorial2.ipynb
      - source: neuromatch-cn
        locator: W1D4 Tutorial 1, Section 3 Project data onto new basis (Interactive Demo 3)
        url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W1D4_DimensionalityReduction/instructor/W1D4_Tutorial1.ipynb
    source:
