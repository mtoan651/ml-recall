      ref: W1D4_DimensionalityReduction/W1D4_Tutorial2#demo1
      url: https://github.com/NeuromatchAcademy/course-content/blob/44634e960df7a14cd0bf7398187f2d209d26b0e8/tutorials/W1D4_DimensionalityReduction/instructor/W1D4_Tutorial2.ipynb
