  - id: dim-reduction-031
    type: short_answer
    difficulty: easy
    tags:
      - eckart-young
      - low-rank-approximation
      - svd
    question: |
      What is the Frobenius-norm error $\lVert A - A_1 \rVert_F$ of the best rank-1 approximation $A_1$ of
      $A = \mathrm{diag}(3, 2, 1)$?
    answer:
      numeric: 2.236
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $A_1 = \mathrm{diag}(3, 0, 0)$, error $\sqrt{2^2 + 1^2} = \sqrt5 \approx 2.236$
    explanation: |
      By the Eckart–Young–Mirsky theorem the best rank-$k$ approximation keeps the $k$ largest singular
      values of the SVD, and the Frobenius error is the root of the sum of the squared discarded ones [^1].
      The singular values of $\mathrm{diag}(3, 2, 1)$ are 3, 2 and 1, so $A_1 = \mathrm{diag}(3, 0, 0)$ and
      the error is $\sqrt{4 + 1} \approx 2.236$; in the spectral norm it would be $\sigma_2 = 2$. PCA rests on
      the same theorem: projecting onto the top principal directions gives the best low-rank fit [^2].
    references:
      - title: 'Wikipedia: Low-rank approximation'
        locator: Basic low-rank approximation problem; Proof of Eckart–Young–Mirsky theorem (for Frobenius norm)
        url: https://en.wikipedia.org/wiki/Low-rank_approximation
      - source: mit-ocw-18065
        locator: Problems for Lecture 7 (textbook Section I.9), Problem 2
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec7-q2
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
