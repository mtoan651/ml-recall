  - id: dim-reduction-026
    type: multiple
    difficulty: hard
    tags:
      - lsa
      - truncated-svd
      - nmf
      - topics
    question: |
      Which statements about latent semantic analysis (LSA, i.e. truncated SVD), PCA and
      non-negative matrix factorization (NMF) are true? Select all that apply.
    options:
      - text: Unlike a bag-of-words vector, LSA gives a short and dense representation of a document
        correct: true
      - text: In LSA, the weight vectors in $W$ can be read as topics extracted from the documents
        correct: true
      - text: In LSA, a document's row of the transformed data $Z$ says how strongly each topic is present in it
        correct: true
      - text: On a 10-dimensional dataset, PCA with 4 components and PCA with 1 component give the same first component (up to sign)
        correct: true
      - text: On a 10-dimensional dataset, NMF with 4 components and NMF with 1 component give the same first component
        why: NMF components are not nested or sorted by variance; changing the number of components changes all of them [^2].
    explanation: |
      LSA applies truncated SVD to the (uncentered) sparse count matrix, $X \approx ZW$: the rows of
      $W$ are word-weight vectors that act as topics, and each row of $Z$ is a short dense vector of
      topic weights for one document [^1]. PCA components are sorted by explained variance and are
      nested, so the first component does not depend on how many you ask for [^2]. NMF only requires
      $Z$ and $W$ to be non-negative; its components are neither orthogonal nor ordered, so they are
      re-estimated together for each choice of $k$ [^2].
    references:
      - source: ubc-dsci563
        locator: Lecture 4 notes, Sec. 4.2 Latent Semantic Analysis (LSA)
        url: https://github.com/UBC-MDS/DSCI_563_unsup-learn/blob/3c429ebfd480f72792fa59def4ab9c072dfa1cf1/lectures/notes/04_More-PCA-LSA-NMF.ipynb
