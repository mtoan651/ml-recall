  - id: dim-reduction-036
    type: short_answer
    difficulty: medium
    tags:
      - pca
      - reconstruction-error
      - anomaly-detection
    question: |
      PCA is fitted on normal data and then used to score a new point by its reconstruction error.
      What does the last line print?

      ```python
      import numpy as np
      from sklearn.decomposition import PCA

      X = np.array([[1, 1], [2, 2], [-1, -1], [-2, -2]], dtype=float)   # normal data
      pca = PCA(n_components=1).fit(X)

      x_new = np.array([[1.0, -1.0]])
      x_rec = pca.inverse_transform(pca.transform(x_new))
      print(round(float(((x_new - x_rec) ** 2).sum()), 2))
      ```
    answer:
      numeric: 2.0
      tolerance: 0.01
      hint: A number, e.g. 0.5
      model: '2.0: $(1, -1)$ projects onto the origin, so the squared error is $1^2 + 1^2$'
    explanation: |
      The normal points lie on the line $y = x$, with mean $(0, 0)$, so the single principal
      component is $(1, 1)/\sqrt{2}$. The new point $(1, -1)$ is orthogonal to it: its projection is
      0, `inverse_transform` maps that back to the mean $(0, 0)$ [^2], and the squared reconstruction
      error is $1^2 + (-1)^2 = 2$. A point on the line, such as $(3, 3)$, would be rebuilt exactly
      (error 0). PCA keeps the directions of normal variation, so instances that do not follow
      them, such as rotated or darkened faces in the handson-ml3 Olivetti exercise, get much larger
      reconstruction errors and can be flagged as anomalies [^1].
    references:
      - source: handson-ml3
        locator: 09_unsupervised_learning.ipynb, Exercise solutions, 13. Using Dimensionality Reduction Techniques for Anomaly Detection
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/09_unsupervised_learning.ipynb
      - title: 'scikit-learn API reference: PCA'
        locator: Methods, transform and inverse_transform
        url: https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html
    source:
      id: handson-ml3
      ref: 09_unsupervised_learning#ex13
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/09_unsupervised_learning.ipynb
    status: reviewed
    reviewed_by: claude
