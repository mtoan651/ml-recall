  - id: dim-reduction-029
    type: short_answer
    difficulty: medium
    tags:
      - pca
      - svd
      - explained-variance
    question: |
      A centered data matrix $X$ has $n = 101$ rows. Its largest singular value is $\sigma_1 = 20$. What
      is the variance of the data along the first principal component, i.e. the largest eigenvalue of
      the sample covariance matrix $X^\top X/(n-1)$?
    answer:
      numeric: 4
      tolerance: 0.001
      hint: a number
      model: $\lambda_1 = \sigma_1^2/(n-1) = 400/100 = 4$
    explanation: |
      With $X = U\Sigma V^\top$, the covariance is $X^\top X/(n-1) = V\,\Sigma^2/(n-1)\,V^\top$, so the
      right singular vectors are the principal directions and the eigenvalues are
      $\lambda_i = \sigma_i^2/(n-1)$ [^1]. Here $\lambda_1 = 400/100 = 4$. The eigenvalues of the
      covariance are thus the *squared* singular values (scaled), not the other way round as is
      sometimes claimed [^1].
    references:
      - title: 'Wikipedia: Principal component analysis'
        url: https://en.wikipedia.org/wiki/Principal_component_analysis#Singular_value_decomposition
        locator: Section "Singular value decomposition"
    source:
      id: ds-interviews
      ref: theory.md#q142
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#dimensionality-reduction
    status: reviewed
    reviewed_by: claude
  - id: dim-reduction-030
    type: single
    difficulty: medium
    tags:
      - pca
      - loadings
      - feature-engineering
    question: |
      PCA on four standardized house features gives these loadings for the first and third
      components (rounded):

      | Feature | PC1 | PC3 |
      |---|---|---|
      | `GarageArea` | 0.47 | 0.03 |
      | `YearRemodAdd` | 0.40 | −0.04 |
      | `TotalBsmtSF` | 0.53 | 0.74 |
      | `GrLivArea` | 0.58 | −0.67 |

      What kind of variation does PC3 describe?
    options:
      - text: Big basements with little living area, contrasted with the opposite
        correct: true
      - text: Overall house size, with large values on all four features at once
        why: That describes PC1, whose loadings all have the same sign; PC3's two large loadings have opposite signs [^1].
      - text: Mostly garage area and remodel year, since their loadings are the smallest
        why: A loading near zero means the feature hardly contributes to the component, so these two can be ignored for PC3 [^2].
      - text: The direction with the most variance, because its largest loadings are bigger than PC1's
        why: Components are ordered by explained variance, which is not read off the size of the loadings; PC3 explains less than PC1 [^1].
    explanation: "A component's loadings tell what variation it expresses through their signs and magnitudes: same signs mean the features vary together, opposite signs mean a contrast [^1]. PC3 is driven by `TotalBsmtSF` (+0.74) and `GrLivArea` (−0.67), with near-zero loadings elsewhere, so it contrasts houses with a lot of living area but small basements against small houses with large basements, the reading given in Kaggle's solution to this exercise [^2]. PC1, with all loadings positive, is a \"size\" component [^2]."
    references:
      - source: kaggle-learn
        locator: Feature Engineering, Lesson 5 Principal Component Analysis — tutorial, Principal Component Analysis
        url: https://github.com/Kaggle/learntools/blob/e9ba66dc899d3e17b80d3a1b9a5d29f430d310cb/notebooks/feature_engineering_new/raw/tut5.ipynb
