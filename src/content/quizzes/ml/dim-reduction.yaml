  - id: dim-reduction-014
    type: multiple
    difficulty: medium
    tags:
      - nonlinear-dimensionality-reduction
      - manifold-learning
      - kernel-pca
    question: Which of these dimensionality-reduction methods can capture nonlinear structure in the data?
    options:
      - text: Kernel PCA
        correct: true
      - text: Isomap
        correct: true
      - text: Truncated SVD (latent semantic analysis)
        why: Truncated SVD is a linear low-rank factorization $X \approx U_k \Sigma_k V_k^\top$; new data are mapped by the matrix product $X V_k$.
      - text: Gaussian random projection
        why: It multiplies the data by a random matrix, which is a linear projection; it roughly preserves pairwise distances but cannot unfold curved structure.
    explanation: |
      Kernel PCA extends PCA with kernels and so achieves a nonlinear reduction [^1]. Isomap is a
      manifold-learning method that looks for a low-dimensional embedding preserving geodesic
      distances, measured along the data rather than straight through space [^2]. Truncated SVD maps
      data with the matrix $V_k$, and a Gaussian random projection projects onto a random matrix;
      both are linear maps [^3][^4]. Linear projections can be powerful, but they often miss the
      nonlinear structure that manifold learning tries to capture [^5].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/decomposition.html#kernel-principal-component-analysis-kpca
        locator: Sec. 2.5.2 Kernel Principal Component Analysis (kPCA)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/manifold.html#isomap
        locator: Sec. 2.2.2 Isomap
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/decomposition.html#truncated-singular-value-decomposition-and-latent-semantic-analysis
        locator: Sec. 2.5.3 Truncated singular value decomposition and latent semantic analysis
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/random_projection.html#gaussian-random-projection
        locator: Sec. 8.6.2 Gaussian random projection
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/manifold.html#introduction
        locator: Sec. 2.2.1 Introduction (Manifold learning)
