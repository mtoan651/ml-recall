  - id: logistic-regression-017
    type: single
    difficulty: medium
    tags:
      - cross-entropy
      - softmax
      - code-reading
      - pytorch
    question: |
      What is wrong with this PyTorch training step for a 10-class classifier?

      ```python
      logits = model(X)                     # shape (batch, 10)
      probs = torch.softmax(logits, dim=1)
      loss = F.cross_entropy(probs, y)      # y holds class indices
      ```
    options:
      - text: '`F.cross_entropy` applies log-softmax itself; pass `logits` instead'
        correct: true
      - text: Nothing, because `F.cross_entropy` expects probabilities that sum to 1
        why: It expects unnormalized logits. Passing probabilities applies a softmax a second time [^1].
      - text: '`y` must be one-hot encoded before calling `F.cross_entropy`'
        why: The target may hold class indices in $[0, C)$; probability targets are an option, not a requirement [^1].
      - text: The softmax should use `dim=0`, so that each column sums to 1
        why: Each row is one example, so the softmax must normalize over the class dimension, `dim=1` [^2].
    explanation: |
      `F.cross_entropy` takes raw logits and applies log-softmax followed by the negative
      log-likelihood [^1]. Fusing the two steps lets it compute
      $\log \hat y_j = o_j - \bar o - \log \sum_k \exp(o_k - \bar o)$ directly, which avoids overflow
      and underflow [^2]. Feeding it `probs` applies a second softmax to numbers in $[0, 1]$: even a
      perfectly confident prediction $(1, 0, \ldots, 0)$ is scored as
      $e / (e + 9) \approx 0.23$ for the true class, so the loss cannot approach 0 and training
      suffers. Keep the softmax for reading out probabilities only [^2].
    references:
      - title: torch.nn.CrossEntropyLoss (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
        locator: Description of input (unnormalized logits) and target (class indices or probabilities)
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
        locator: Sec. 4.5.2 Softmax Revisited, Eq. (4.5.2)
    source:
      id: original
      ref: logistic-regression-017
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-018
    type: single
    difficulty: easy
    tags:
      - log-odds
      - odds-ratio
      - interpretation
    question: |
      In a binary logistic-regression model, the weight of the feature "number of past purchases"
      is $w = \ln 2 \approx 0.693$. Holding the other features fixed, what does one more past
      purchase do?
    options:
      - text: It multiplies the odds $p / (1 - p)$ by 2
        correct: true
      - text: It multiplies the predicted probability $p$ by 2
        why: The model is linear in the log-odds, not in $p$. Doubling $p$ would push it above 1 whenever $p > 0.5$ [^1].
      - text: It adds 0.693 to the predicted probability $p$
        why: The weight is added to the log-odds $z$, and the sigmoid then bends that change [^1].
      - text: It multiplies the log-odds $z$ by 2
        why: The weight is added to $z$, not multiplied, so $z$ grows by $\ln 2$ [^1][^2].
    explanation: |
      The linear part $z = b + \sum_j w_j x_j$ is the log-odds, $z = \ln\frac{p}{1 - p}$ [^1]. One
      more unit of the feature adds $w = \ln 2$ to $z$, so the odds $e^z$ are multiplied by
      $e^{\ln 2} = 2$ [^2]. The effect on $p$ itself depends on the starting point: from $p = 0.5$
      (odds 1) it moves to $2/3$ (odds 2), not to 1.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
        locator: "Logistic regression: Calculating a probability with the sigmoid function, 'Transforming linear output using the sigmoid function' (log-odds)"
      - title: 'Wikipedia: Logistic regression'
        url: https://en.wikipedia.org/wiki/Logistic_regression#The_odds_ratio
        locator: The odds ratio
    source:
      id: original
      ref: logistic-regression-018
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-019
    type: single
    difficulty: medium
    tags:
      - decision-boundary
      - decision-threshold
      - log-odds
    question: |
      A logistic-regression model on two features has log-odds $z = 2x_1 - x_2 - 4$. With the
      usual threshold of 0.5, its decision boundary is the line $2x_1 - x_2 - 4 = 0$. If you
      predict the positive class only when $p > 0.8$, what is the new boundary?
    options:
      - text: The parallel line $2x_1 - x_2 - 4 = \ln 4$
        correct: true
      - text: The line $2x_1 - x_2 - 4 = 0.8$
        why: The threshold is a probability. On the log-odds scale it becomes $\ln\frac{0.8}{0.2} = \ln 4 \approx 1.39$ [^1].
      - text: The same line, since thresholds change only the probabilities
        why: The threshold decides which points are predicted positive, so the boundary moves to the points where $p = 0.8$ [^2].
      - text: A curve, since the sigmoid is nonlinear in $x_1$ and $x_2$
        why: $p > 0.8$ is the same as $z > \ln 4$, and $z$ is linear in the features, so the boundary stays a straight line [^1].
    explanation: |
      The sigmoid is increasing, so $p > t$ is the same as $z > \ln\frac{t}{1 - t}$ [^1]. For the
      default $t = 0.5$ the right-hand side is 0 [^2]; for $t = 0.8$ it is $\ln 4 \approx 1.39$. The
      new boundary $2x_1 - x_2 - 4 = \ln 4$ has the same normal vector $(2, -1)$, so it is parallel
      to the old one, shifted into the old positive region. Every threshold gives a straight-line
      boundary, because $z$ is linear in the features.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
        locator: 'Logistic regression: Calculating a probability with the sigmoid function (log-odds, z = ln(y / (1 - y)))'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/classification_threshold.html
        locator: Sec. 3.3 Tuning the decision threshold for class prediction (default cut-off 0.5, or decision score 0)
    source:
      id: original
      ref: logistic-regression-019
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-020
    type: single
    difficulty: easy
    tags:
      - regularization
      - scikit-learn
    question: |
      A scikit-learn `LogisticRegression` model with default settings overfits. Which change to
      the parameter `C` makes the regularization stronger?
    options:
      - text: Decrease `C`, for example from 1.0 to 0.1
        correct: true
      - text: Increase `C`, for example from 1.0 to 10
        why: '`C` is the inverse of the regularization strength, so a larger `C` weakens the penalty [^1].'
      - text: Set `C=np.inf` to get the strongest penalty
        why: '`C=np.inf` removes the penalty and fits unpenalized logistic regression [^1].'
      - text: Leave `C` alone, it only acts once a penalty is switched on
        why: scikit-learn regularizes logistic regression by default, with `C=1.0` [^1][^2].
    explanation: |
      In scikit-learn, `C` is the inverse of the regularization strength: smaller values mean a
      stronger penalty, and `C=np.inf` turns it off [^1]. The penalty term is divided by `C` in the
      training objective, and regularization is applied by default [^2]. Regularization matters for
      logistic regression: without it, the asymptotic shape of the sigmoid keeps driving the loss
      toward 0 when there are many features, which overfits [^3].
    references:
      - title: scikit-learn API reference
        url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
        locator: sklearn.linear_model.LogisticRegression, parameter C
