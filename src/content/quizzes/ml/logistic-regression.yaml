  - id: logistic-regression-014
    type: single
    difficulty: medium
    tags:
      - softmax
      - numerical-stability
      - code-reading
      - pytorch
    question: |
      This is the from-scratch softmax of d2l, run in PyTorch's default float32. What does the
      last line return?

      ```python
      import torch

      def softmax(X):
          X_exp = torch.exp(X)
          partition = X_exp.sum(1, keepdim=True)
          return X_exp / partition

      softmax(torch.tensor([[100.0, 0.0]]))
      ```
    options:
      - text: '`tensor([[nan, 0.]])`'
        correct: true
      - text: '`tensor([[1., 0.]])`'
        why: That is close to the mathematically correct result, but the code never gets there, because $e^{100} \approx 2.7 \times 10^{43}$ overflows to `inf` first [^2].
      - text: '`tensor([[inf, 0.]])`'
        why: The numerator is `inf`, but so is the denominator, and `inf / inf` is `nan`, not `inf` [^3].
      - text: '`tensor([[0.5, 0.5]])`'
        why: Equal outputs would need equal logits, and these logits differ by 100.
    explanation: |
      Single-precision floats only reach about $10^{38}$, so $\exp(x)$ overflows once $x$ is
      larger than roughly 90 [^2]. Here $e^{100}$ becomes `inf`, the row sum $\infty + 1$ is `inf`,
      and the first entry is `inf / inf`, which is `nan` [^3]. The second entry is
      $1 / \infty = 0$. d2l warns that this naive softmax is not robust to very large or very
      small arguments [^1]. The fix is to subtract the largest logit before exponentiating, or to
      let the framework fuse softmax and cross-entropy [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html#the-softmax
        locator: Sec. 4.4.1 The Softmax (caution about large arguments) and Sec. 4.4.7 Exercise 1
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
        locator: Sec. 4.5.2 Softmax Revisited
      - title: 'Wikipedia: NaN'
        url: https://en.wikipedia.org/wiki/NaN#Operations_generating_NaN
        locator: Operations generating NaN
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression-scratch#ex1
      url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html
    status: reviewed
