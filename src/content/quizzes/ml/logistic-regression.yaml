  - id: logistic-regression-002
    type: single
    difficulty: easy
    question: Types of Logistic Regression include
    options:
      - text: multinomial and cardinal
        why: '"Cardinal" is not a kind of logistic regression; the variant for ordered categories is called ordinal [^1].'
      - text: multinomial and ordinal
        correct: true
      - text: principal and ordinal
        why: '"Principal" belongs to principal component analysis, an unsupervised method, not to logistic regression; the other variant is multinomial [^1].'
    explanation: |
      Besides the binary case, Microsoft's ML-For-Beginners logistic-regression lesson names two more
      kinds of logistic regression [^1]. Multinomial handles more than two unordered categories (such
      as the pumpkin colors orange, white and striped), and ordinal handles categories with a natural
      order, such as pumpkin sizes [^1]. "Cardinal" and "principal" are not types of logistic
      regression. The multinomial form is also what scikit-learn fits for multiclass problems [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#other-classifications
        locator: 'Lesson: Logistic Regression, Other classifications'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/linear_model.html#multinomial-case
        locator: Sec. 1.1.11.2 Multinomial Case
    source:
