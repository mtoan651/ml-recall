questions:
  - id: logistic-regression-001
    type: single
    difficulty: easy
    question: Use Logistic Regression to predict
    options:
      - text: whether an apple is ripe or not
        correct: true
      - text: how many tickets can be sold in a month
      - text: what color the sky will turn tomorrow at 6 PM
    explanation: |
      Logistic regression predicts a binary category, a yes/no answer such as ripe or not ripe [^1].
      The number of tickets sold is a numeric quantity, which is a job for linear regression [^1][^2].
      The sky's color has many possible values. It could be framed as a multiclass problem for the
      multinomial extension, but it is not the two-class question that plain logistic regression is
      built for [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#binary-classification
        locator: 'Lesson: Logistic Regression, Introduction, Binary classification and Other classifications'
