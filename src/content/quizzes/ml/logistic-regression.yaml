  - id: logistic-regression-022
    type: short_answer
    difficulty: medium
    tags:
      - softmax
      - overflow
      - floating-point
    question: |
      A naive softmax computes $\exp(o_j)$ directly. In float16, whose largest finite value is 65504,
      what is the largest logit $o_j$ for which $\exp(o_j)$ does not overflow? Round to 2 decimals.
    answer:
      numeric: 11.09
      tolerance: 0.02
      hint: a number, 2 decimals
      model: $\ln 65504 \approx 11.09$
    explanation: |
      $\exp(o)$ stays finite as long as $o \le \ln(\text{largest value})$. For float16 that is only
      $\ln 65504 \approx 11.09$ [^1], so a logit of 12 already gives `inf`; for float32, with a largest
      value near $3.4 \times 10^{38}$, it is about 88.7, which matches d2l's warning that logits outside
      $[-90, 90]$ are unstable [^2]. On the small side, $\exp(o)$ becomes a less precise subnormal number
      in float16 for $o$ below about $-9.7$ and rounds to 0 below about $-17.3$ [^1]. Subtracting $\max_k o_k$ before
      exponentiating, as framework softmax and cross-entropy functions do, avoids the overflow [^2].
    references:
      - title: 'Wikipedia: Half-precision floating-point format'
        locator: Half precision examples (largest normal number, smallest normal and subnormal numbers)
        url: https://en.wikipedia.org/wiki/Half-precision_floating-point_format#Half_precision_examples
      - source: d2l
        locator: Sec. 4.5.2 Softmax Revisited
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
      - source: d2l
        locator: Sec. 4.5.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#exercises
    source:
