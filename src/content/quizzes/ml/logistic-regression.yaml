  - id: logistic-regression-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The softmax function is commonly used in multiclass logistic regression.

      **Statement 2.** The temperature of a nonuniform softmax distribution affects its entropy.
    options:
      - text: True, True
        correct: true
      - text: False, False
        why: Both statements hold. The softmax is what turns class scores into probabilities in multinomial logistic regression [^1], and the temperature changes the entropy of a nonuniform softmax [^2][^3].
      - text: True, False
        why: Statement 2 is also true. A higher temperature flattens a nonuniform softmax toward uniform (higher entropy), and a lower one sharpens it toward the largest logit (lower entropy) [^2][^3].
      - text: False, True
        why: Statement 1 is also true. Multinomial logistic regression is also called softmax regression, because it turns the class scores into probabilities with the softmax [^1].
    explanation: |
      Statement 1 is true. Multinomial logistic regression, also called softmax regression, turns the
      class scores into probabilities with the softmax function [^1]. Statement 2 is also true. With
      temperature $T$ the softmax is $q_i = \exp(z_i/T) / \sum_j \exp(z_j/T)$, and a higher $T$ gives a
      softer, more spread-out distribution [^2]. As $T$ grows the probabilities approach uniform, and
      as $T \to 0$ they pile onto the largest logit. The entropy $H[P] = -\sum_j P(j)\log P(j)$
      therefore moves between its maximum and zero [^3]. Only when all logits are equal (a uniform
      softmax) does $T$ change nothing, which is why the statement says "nonuniform".
    references:
      - title: 'Jurafsky and Martin: Speech and Language Processing (3rd ed. draft, Aug 2026), Ch. 4 Logistic Regression and Text Classification'
        url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
        locator: Sec. 4.7 Multinomial logistic regression (4.7.1 Softmax)
      - title: 'Hinton, Vinyals, Dean (2015): Distilling the Knowledge in a Neural Network'
        url: https://arxiv.org/abs/1503.02531
        locator: Sec. 2 Distillation, eq. (1)
        quote: Using a higher value for T produces a softer probability distribution over classes.
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#entropy
        locator: Sec. 4.1.3.1 Entropy, eq. (4.1.11)
    source:
      id: mmlu-redux
      ref: machine_learning/21
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=21
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-004
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Maximizing the likelihood of a logistic regression model yields multiple local optima.

      **Statement 2.** No classifier can do better than a naive Bayes classifier if the distribution of the data is known.
    options:
      - text: True, True
        why: Neither statement holds. The logistic-regression loss is convex, with no spurious local optima [^1], and with a known distribution the Bayes classifier, not naive Bayes, is the best possible classifier [^2].
      - text: False, False
        correct: true
      - text: True, False
        why: Statement 1 is false. The negative log-likelihood of logistic regression is convex, so every local optimum is the global one [^1].
      - text: False, True
        why: Statement 2 is false. With the true distribution known, the Bayes classifier reaches the lowest possible error; naive Bayes adds a conditional-independence assumption that can make it worse [^2][^3].
    explanation: |
      Statement 1 is false. The logistic-regression loss (the negative log-likelihood, or
      cross-entropy) is convex, so it has a single optimum with no other local optima, and gradient
      descent from any starting point finds it [^1]. Statement 2 is false too. When the distribution
      is known, the best possible classifier is the Bayes classifier: it predicts the class with the
      largest $P(y \mid x)$ and reaches the lowest possible error rate [^2]. Naive Bayes only
      approximates this by assuming the features are conditionally independent given the class [^3].
      When that assumption fails, the Bayes classifier built from the true distribution does better.
    references:
      - title: 'Jurafsky and Martin: Speech and Language Processing (3rd ed. draft, Aug 2026), Ch. 4 Logistic Regression and Text Classification'
        url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
        locator: Sec. 4.6 Gradient Descent
        quote: For logistic regression, this loss function is conveniently convex.
      - title: 'James, Witten, Hastie, Tibshirani: An Introduction to Statistical Learning (1st ed., 7th printing)'
        url: https://www.statlearning.com/s/ISLR-Seventh-Printing.pdf
        locator: Sec. 2.2.3 The Classification Setting (The Bayes Classifier), p. 38
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/naive_bayes.html
        locator: Sec. 1.9 Naive Bayes
    source:
      id: mmlu-redux
      ref: machine_learning/61
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=61
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-005
    type: single
    difficulty: easy
    question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. For the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$, what is the value of $z$ (the linear output before the sigmoid)?
    options:
      - text: '21'
        why: This drops the minus sign of $w_2$. The term is $(-1)(10) = -10$, not $+10$.
      - text: '0'
        why: This leaves out the bias $b = 1$.
      - text: '0.731'
        why: That is $\sigma(z)$, the predicted probability. $z$ is the value before the sigmoid.
      - text: '1'
        correct: true
    explanation: |
      The linear part of the model is $z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2x_1 - x_2 + 5x_3$.
      Plugging in the input gives $z = 1 + 2(0) - 10 + 5(2) = 1$ [^1]. Only after that is the
      sigmoid applied, giving the probability $\sigma(1) \approx 0.731$ [^1].
    references:
      - source: google-mlcc
        locator: 'Logistic regression: Calculating a probability with the sigmoid function'
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function
    source:
      id: google-mlcc
      ref: logistic-regression/sigmoid-function#q1
      url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-006
    type: single
    difficulty: medium
    shuffle: false
    question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. What does it predict for the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$?
    options:
      - text: '0.268'
        why: That is $\sigma(-1) = 1/(1 + e^{1})$, the result of a sign slip such as computing $1/(1 + e^{z})$ instead of $1/(1 + e^{-z})$ [^1].
      - text: '0.5'
        why: That is $\sigma(0)$, what you get by leaving out the bias; with it, $z = 1 + 0 - 10 + 10 = 1$ [^1].
      - text: '0.731'
        correct: true
      - text: '1'
        why: That is the linear output $z$, not the prediction. The sigmoid maps $z = 1$ to about 0.731, and its output always lies strictly between 0 and 1 [^1].
    explanation: |
      First compute the linear part (the log-odds), then pass it through the sigmoid [^1][^2]:
      $$z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2(0) + (-1)(10) + 5(2) = 1,$$
      $$y' = \sigma(z) = \frac{1}{1 + e^{-1}} \approx \frac{1}{1.368} \approx 0.731.$$
      The value 0.268 is $\sigma(-1)$, which you get with a sign error in $z$. The value 0.5 is
      $\sigma(0)$, which you get by dropping the bias. The sigmoid output always lies strictly
      between 0 and 1, so the model can never predict exactly 1 [^1][^2].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
        locator: "Logistic regression: Calculating a probability with the sigmoid function, 'Transforming linear output using the sigmoid function' and the sigmoid table"
      - title: Stanford CS229 Lecture Notes (Ng & Ma)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Ch. 2, Sec. 2.1 Logistic regression, pp. 21-22
    source:
      id: google-mlcc
      ref: logistic-regression/sigmoid-function#q2
      url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-007
    type: short_answer
    difficulty: medium
    tags:
      - softmax
      - cross-entropy
      - gradient
    question: |
      A softmax-regression model outputs the logits $\mathbf{o} = (2, 1, 0)$ for an example whose
      true class is the first one, so the one-hot label is $\mathbf{y} = (1, 0, 0)$. What is the
      derivative $\partial l / \partial o_1$ of the cross-entropy loss?
    answer:
      numeric: -0.335
      tolerance: 0.002
      hint: a number, 3 decimals (it may be negative)
      model: $\mathrm{softmax}(\mathbf{o})_1 - y_1 = \frac{e^2}{e^2 + e^1 + e^0} - 1 \approx 0.665 - 1 = -0.335$
    explanation: |
      For a softmax followed by the cross-entropy loss, the derivative with respect to a logit is
      the predicted probability minus the label, $\partial_{o_j} l = \mathrm{softmax}(\mathbf{o})_j - y_j$ [^1].
      Here $\mathrm{softmax}(\mathbf{o})_1 = e^2 / (e^2 + e + 1) \approx 7.389 / 11.107 \approx 0.665$,
      so the derivative is $0.665 - 1 \approx -0.335$. It is negative, so a gradient-descent step
      raises $o_1$ and with it the probability of the true class. The other two derivatives are
      just their probabilities, about 0.245 and 0.090, and all three add up to zero [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#softmax-and-cross-entropy-loss
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss, Eq. (4.1.10)
    source:
      id: original
      ref: logistic-regression-007
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-008
    type: short_answer
    difficulty: hard
    tags:
      - softmax
      - cross-entropy
      - hessian
      - convexity
    question: |
      For softmax regression with three classes, an example gets
      $\mathrm{softmax}(\mathbf{o}) = (0.2, 0.3, 0.5)$. What is the second derivative
      $\partial^2 l / \partial o_1^2$ of its cross-entropy loss? (The true class does not matter.)
    answer:
      numeric: 0.16
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $p_1(1 - p_1) = 0.2 \times 0.8 = 0.16$
    explanation: |
      The first derivative is $\partial_{o_j} l = p_j - y_j$ with $p = \mathrm{softmax}(\mathbf{o})$ [^1].
      The label is a constant, so the second derivative is the derivative of the softmax itself,
      $\partial p_j / \partial o_i = p_j(\delta_{ij} - p_i)$ [^2]. On the diagonal this is
      $p_1(1 - p_1) = 0.2 \times 0.8 = 0.16$, whatever the label. The full matrix
      $\mathrm{diag}(p) - pp^\top$ is the covariance of a one-hot vector drawn from
      $\mathrm{softmax}(\mathbf{o})$, the link between the second derivative and the variance that the
      d2l exercise asks for [^3]. A covariance matrix is positive semidefinite, so the loss is convex
      in the logits.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#softmax-and-cross-entropy-loss
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss, Eq. (4.1.10)
      - title: 'Wikipedia: Softmax function'
        url: https://en.wikipedia.org/wiki/Softmax_function#Gradients
        locator: Gradients
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#exercises
        locator: Sec. 4.1.5 Exercises, Exercise 1
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex1
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-009
    type: short_answer
    difficulty: easy
    tags:
      - softmax
      - sigmoid
      - bradley-terry
    question: |
      In a Bradley–Terry choice model, a user picks an apple or an orange with probabilities given
      by a softmax over the scores $o_{\text{apple}} = 3$ and $o_{\text{orange}} = 1$. What is the
      probability that the user picks the apple?
    answer:
      numeric: 0.881
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $\frac{e^3}{e^3 + e^1} = \frac{1}{1 + e^{-2}} = \sigma(2) \approx 0.881$
    explanation: |
      The softmax gives $P(\text{apple}) = e^{3} / (e^{3} + e^{1})$ [^1]. Dividing the numerator and
      the denominator by $e^3$ turns this into $1 / (1 + e^{-(3 - 1)})$, the sigmoid of the score
      difference [^2]. With $\sigma(2) \approx 0.881$ [^3], the higher-scored apple is the likelier
      choice. A two-class softmax is therefore binary logistic regression, whose log-odds is the
      score difference [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
        locator: Sec. 4.1.1.2 The Softmax, Eq. (4.1.3)
      - title: 'Wikipedia: Bradley–Terry model'
        url: https://en.wikipedia.org/wiki/Bradley%E2%80%93Terry_model#Definition
        locator: Definition
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#sigmoid_function
        locator: 'Logistic regression: Calculating a probability with the sigmoid function (sigmoid table)'
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex4
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-010
    type: single
    difficulty: medium
    tags:
      - softmax
      - bradley-terry
      - choice-models
    question: |
      The apple/orange choice model gets a third option, "neither", with score
      $o_{\text{neither}} = 0$, and the softmax now runs over all three scores
      ($o_{\text{apple}} = 3$, $o_{\text{orange}} = 1$). What happens to the ratio
      $P(\text{apple}) / P(\text{orange})$?
    options:
      - text: It stays $e^{3 - 1} \approx 7.39$; only the shared denominator changes
        correct: true
      - text: It falls, because the new option takes most of its share from the favourite
        why: Both probabilities are divided by the same new denominator, so they shrink by the same factor [^1].
      - text: It grows, because the apple has the larger score and loses less
        why: Both probabilities shrink by the same factor, so neither option gains relative to the other [^1].
      - text: It now depends on the score given to the "neither" option
        why: The "neither" score only enters the shared denominator, which cancels in the ratio [^1].
    explanation: |
      A softmax gives option $i$ the probability $e^{o_i} / \sum_k e^{o_k}$ [^1]. The denominator is
      shared, so $P(\text{apple}) / P(\text{orange}) = e^{3 - 1} = e^2 \approx 7.39$ whatever the
      other options are. Both probabilities do shrink, from about 0.881 and 0.119 to about 0.844
      and 0.114, because "neither" now takes about 0.042. Relative odds that ignore the other
      options are called independence of irrelevant alternatives, and a softmax-style choice rule
      has this property [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
        locator: Sec. 4.1.1.2 The Softmax, Eq. (4.1.3)
      - title: "Wikipedia: Luce's choice axiom"
        url: https://en.wikipedia.org/wiki/Luce%27s_choice_axiom
        locator: Introduction and Matching law formulation
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex4-b
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-011
    type: single
    difficulty: medium
    tags:
      - softmax
      - log-sum-exp
    question: |
      Softmax takes its name from $\mathrm{RealSoftMax}(a, b) = \ln(e^a + e^b)$, which is always
      larger than $\max(a, b)$. What is the largest possible gap
      $\mathrm{RealSoftMax}(a, b) - \max(a, b)$?
    options:
      - text: $\ln 2 \approx 0.693$, reached when $a = b$
        correct: true
      - text: $\ln 2 \approx 0.693$, approached as $|a - b| \to \infty$
        why: The gap is $\ln(1 + e^{-|a - b|})$, which shrinks toward 0 as the numbers move apart [^2].
      - text: Exactly $1$, reached when $a = b$
        why: At $a = b$ the gap is $\ln(2e^a) - a = \ln 2$, not 1.
      - text: It has no maximum and grows with $|a - b|$
        why: The gap $\ln(1 + e^{-|a - b|})$ never exceeds $\ln 2$ and shrinks as $|a - b|$ grows [^2].
    explanation: |
      Take $a \ge b$ and factor out $e^a$: $\ln(e^a + e^b) - a = \ln(1 + e^{-(a - b)})$ [^1]. Because
      $e^{-(a - b)}$ lies in $(0, 1]$, the gap lies in $(0, \ln 2]$. It equals $\ln 2$ when $a = b$
      and tends to 0 as the numbers move apart, so the function is a smooth upper approximation
      of the maximum [^2]. Scaling as $\lambda^{-1}\mathrm{RealSoftMax}(\lambda a, \lambda b)$ with
      $\lambda > 0$ divides the gap by $\lambda$, so it tends to $\max(a, b)$ as
      $\lambda \to \infty$ [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#exercises
        locator: Sec. 4.1.5 Exercises, Exercise 5
      - title: 'Wikipedia: LogSumExp'
        url: https://en.wikipedia.org/wiki/LogSumExp#Properties
        locator: Properties
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex5
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-012
    type: true_false
    difficulty: medium
    tags:
      - log-sum-exp
      - softmax
      - numerical-stability
    shuffle: false
    question: |
      Let $g(\mathbf{x}) = \log \sum_i \exp(x_i)$ be the log-partition (log-sum-exp) function.
      True or false: adding the same constant $b$ to every coordinate leaves it unchanged,
      $g(\mathbf{x} + b) = g(\mathbf{x})$.
    options:
      - text: 'True'
        why: Every term gains a factor $e^b$, and the logarithm turns it into $+b$, so $g(\mathbf{x} + b) = g(\mathbf{x}) + b$. It is the softmax, the gradient of $g$, that stays the same [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      $g(\mathbf{x} + b) = \log\left(e^b \sum_i e^{x_i}\right) = g(\mathbf{x}) + b$, so the value
      moves by exactly $b$ [^1]. What stays the same are the softmax probabilities
      $e^{x_i} / \sum_k e^{x_k}$, which are the partial derivatives of $g$ [^2]. Stable code uses
      the shift rule with $b = \max_i x_i$: it computes $g(\mathbf{x}) = b + g(\mathbf{x} - b)$, so
      no exponent is positive and nothing overflows [^1][^3]. The d2l exercise calls $g$
      translation invariant, but the shift has to be added back.
    references:
      - title: 'Wikipedia: LogSumExp'
        url: https://en.wikipedia.org/wiki/LogSumExp#Properties
        locator: Properties, and log-sum-exp trick for log-domain calculations
      - title: 'Wikipedia: Softmax function'
        url: https://en.wikipedia.org/wiki/Softmax_function#Gradients
        locator: Gradients
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-concise.html#softmax-revisited
        locator: Sec. 4.5.2 Softmax Revisited, Eq. (4.5.2)
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex6
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-013
    type: short_answer
    difficulty: medium
    tags:
      - softmax
      - temperature
    question: |
      A softmax with temperature $T$ gives $P(i) \propto \exp(o_i / T)$. You build a new
      distribution $Q(i) \propto P(i)^\alpha$ with $\alpha > 0$. Which value of $\alpha$ doubles the
      temperature?
    answer:
      numeric: 0.5
      tolerance: 0.001
      hint: a number, e.g. 3
      model: $P(i)^\alpha \propto \exp(\alpha o_i / T) = \exp\big(o_i / (T/\alpha)\big)$, so the new temperature is $T/\alpha$ and $\alpha = 1/2$ doubles it.
    explanation: |
      Raising to the power $\alpha$ multiplies every exponent by $\alpha$:
      $P(i)^\alpha \propto \exp(\alpha o_i / T) = \exp(o_i / T')$ with $T' = T / \alpha$, and the
      normalization absorbs the remaining constant [^1]. Doubling the temperature means
      $T' = 2T$, so $\alpha = 1/2$; halving it needs $\alpha = 2$. A higher temperature flattens the
      distribution toward uniform, with higher entropy, while a lower one sharpens it toward the
      largest logit [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
        locator: Sec. 4.1.1.2 The Softmax (temperature, exp(-E/kT)) and Sec. 4.1.5 Exercise 7
      - title: 'Wikipedia: Softmax function'
        url: https://en.wikipedia.org/wiki/Softmax_function#Definition
        locator: Definition (temperature)
    source:
      id: d2l
      ref: chapter_linear-classification/softmax-regression#ex7
      url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
