  - id: logistic-regression-026
    type: single
    difficulty: medium
    tags:
      - decision-boundary
      - linear-classifier
      - log-odds
    question: |
      Logistic regression passes $\mathbf{w}^\top\mathbf{x} + b$ through the nonlinear sigmoid. Why is it
      still called a *linear* classifier?
    options:
      - text: Its decision boundary, $\mathbf{w}^\top\mathbf{x} + b = 0$, is a hyperplane
        correct: true
      - text: The sigmoid is close to linear for the inputs that occur in practice
        why: The sigmoid saturates for large $|z|$; the linearity is in the log-odds, $\log\frac{p}{1-p} = \mathbf{w}^\top\mathbf{x} + b$, not in the probability.
      - text: Its predicted probabilities grow linearly with each feature
        why: The probability is an S-shaped function of each feature; a fixed change in a feature changes the log-odds, not the probability, by a constant amount.
      - text: Its parameters are found in closed form, just like those of linear regression
        why: Logistic regression has no closed-form solution; it is fit iteratively, e.g. by gradient descent or Newton's method.
    explanation: |
      The model is linear in the log-odds: $\log\frac{p}{1-p} = \mathbf{w}^\top\mathbf{x} + b$ [^1].
      Since the sigmoid is monotonic, $p > 0.5$ exactly when $\mathbf{w}^\top\mathbf{x} + b > 0$, so the
      two classes are separated by a hyperplane [^1][^2]. That is what makes it a linear classifier
      (a generalized linear model), even though the mapping to probabilities is nonlinear.
    references:
      - title: 'Wikipedia: Logistic regression'
        url: https://en.wikipedia.org/wiki/Logistic_regression#Definition
        locator: Sections "Definition" and "Interpretation of these terms" (log-odds linear in the predictors)
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 4.4 Logistic Regression (linear decision boundaries)
    source:
      id: ds-interviews
      ref: theory.md#q23
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-027
    type: true_false
    difficulty: medium
    tags:
      - log-linear-model
      - l2-regularization
      - duplicate-features
    shuffle: false
    question: |
      A log-linear model $P(y \mid x) \propto \exp(\theta \cdot \phi(x, y))$ is trained by maximizing the
      log-likelihood minus $C\sum_k \theta_k^2$ with $C > 0$. Its first two features are identical,
      $\phi_1(x, y) = \phi_2(x, y)$ for all $x, y$. True or false: the optimal weights satisfy
      $\theta_1^\ast = \theta_2^\ast$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The likelihood depends only on $\theta_1 + \theta_2$, and for a fixed sum the penalty $\theta_1^2 + \theta_2^2$ is smallest exactly when the two are equal [^1].
    explanation: |
      Since $\phi_1 = \phi_2$, the score contains $(\theta_1 + \theta_2)\phi_1$, so the likelihood sees only
      the sum $s = \theta_1 + \theta_2$ [^1]. For any fixed $s$, $\theta_1^2 + \theta_2^2$ is minimized only at
      $\theta_1 = \theta_2 = s/2$, so the regularized optimum splits the weight evenly. This is the
      general tendency of an $L_2$ penalty to spread weight over many correlated features rather than
      pick one [^2]; without the penalty, any split with the same sum would be optimal.
    references:
      - source: mit-ocw-6864
        locator: Problem Set 3, Question 1
        url: https://ocw.mit.edu/courses/6-864-advanced-natural-language-processing-fall-2005/resources/hw3/
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
    source:
      id: mit-ocw-6864
      ref: hw3#q1
      url: https://ocw.mit.edu/courses/6-864-advanced-natural-language-processing-fall-2005/resources/hw3/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-028
    type: short_answer
    difficulty: medium
    tags:
      - maximum-likelihood
      - score-equations
    question: |
      A one-dimensional logistic regression $P(y = 1 \mid x) = g(w_0 + w_1 x)$, with
      $g(z) = 1/(1 + e^{-z})$, is fit by maximum likelihood to three points: $x = -1$ with $y = 0$,
      $x = 0$ with $y = 1$, and $x = 1$ with $y = 0$. What is the fitted $P(y = 1 \mid x = 0)$?
    answer:
      numeric: 0.3333
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $\hat w_1 = 0$ and $g(\hat w_0) = 1/3$
    explanation: |
      At the maximum the score equations $\sum_k (y_k - p_k) = 0$ and $\sum_k (y_k - p_k)x_k = 0$
      hold [^2]. Try $w_1 = 0$, so every $p_k = p$: the first equation gives $1 - 3p = 0$, i.e.
      $p = 1/3$, and the second becomes $(0 - \tfrac13)(-1) + (1 - \tfrac13)(0) + (0 - \tfrac13)(1) = 0$,
      so it holds too. The log-likelihood is concave, so this stationary point is the global
      maximum [^1]. A monotone sigmoid cannot put the middle point above both neighbours, so the
      best it can do is a flat $1/3$, the likelihood being $\tfrac23 \cdot \tfrac13 \cdot \tfrac23$ [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2004) solutions, Problem 3, part 1; Mid-term exam (Fall 2001) solutions, Problem 2, part 1 (concavity)
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
      - title: 'Wikipedia: Logistic regression'
        locator: Parameter estimation (the derivatives of the log-likelihood set to zero)
        url: https://en.wikipedia.org/wiki/Logistic_regression#Parameter_estimation
    source:
      id: mit-ocw-6867
      ref: midterm_f04soln#q3.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-029
    type: single
    difficulty: hard
    tags:
      - feature-selection
      - xor
      - greedy-selection
    shuffle: false
    question: |
      The training set has 10 copies of each of $(x_1, x_2, y) = (1, 1, 1)$, $(0, 1, 0)$, $(1, 0, 0)$
      and $(0, 0, 1)$, so $y = 1$ exactly when $x_1 = x_2$. A logistic regression with a bias term is
      built by greedy forward selection: starting from the bias alone, a candidate feature is added
      only if it strictly increases the training log-likelihood. The candidates are $x_1$, $x_2$ and
      $x_1 x_2$. Which of them can be added **first**?
    options:
      - text: Only $x_1 x_2$
        correct: true
      - text: Either $x_1$ or $x_2$, but not $x_1 x_2$
        why: Within $x_1 = 1$ (and within $x_1 = 0$) half the labels are 1, so $x_1$ alone cannot shift any probability away from $1/2$; the same holds for $x_2$.
      - text: None of them; a single feature never helps on XOR data
        why: $x_1 x_2 = 1$ only for $(1, 1)$, which is always labelled 1, so this feature alone does raise the likelihood.
      - text: Any of the three, because each one is correlated with the label
        why: $x_1$ and $x_2$ are each independent of the label in this training set.
    explanation: |
      The label is the XOR-like function $y = [x_1 = x_2]$. For $x_1$ alone the conditional label
      frequencies are $1/2$ for both values, so the fitted model stays at $p = 1/2$ and the
      likelihood does not improve; the same holds for $x_2$, so greedy selection never adds them
      [^1]. $x_1 x_2$ separates $(1, 1)$, always labelled 1, from the rest, where a third are 1, so it
      raises the log-likelihood (from about $-27.7$ to $-19.1$). With $x_1$, $x_2$ and $x_1 x_2$
      together every example can be classified correctly, whereas any linear boundary on $x_1, x_2$
      alone misclassifies a quarter of the data [^1]. Greedy forward selection only sees features
      that help on their own at each step [^2].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2004) solutions, Problem 4
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
      - title: 'Wikipedia: Feature selection'
        locator: Subset selection (greedy forward selection)
        url: https://en.wikipedia.org/wiki/Feature_selection#Subset_selection
    source:
      id: mit-ocw-6867
      ref: midterm_f04soln#q4
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f04soln/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-030
    type: multiple
    difficulty: medium
    tags:
      - regularization
      - sgd
      - concavity
      - l2-penalty
    question: |
      A logistic regression is trained by maximizing the average log-probability of the training
      labels minus a quadratic penalty $\frac{C}{2}\lVert w \rVert^2$. Which statements are true?
      Select all that apply.
    options:
      - text: As $C$ grows, the average training log-probability of the labels can only stay the same or decrease
        correct: true
      - text: Stochastic gradient ascent with a fixed learning rate converges exactly to the optimal weights
        why: With a fixed step the updates keep jumping around the optimum; the learning rate has to decrease for the weights to converge [^1].
      - text: The unregularized log-likelihood has several local maxima, so the result depends on the initialization
        why: The log-likelihood is concave in the weights, so every local maximum is global (with a flat region at most) [^1].
      - text: The quadratic penalty sets some of the weights exactly to zero
        why: The derivative of $w_i^2$ is 0 at $w_i = 0$, so the penalty has no pull there; exact zeros need a penalty like $|w_i|$ [^2].
      - text: For large enough $C$ the test log-probability also decreases, even with a large training set
        correct: true
    explanation: |
      A larger $C$ constrains the weights more, so the training fit can only get worse; for large
      $C$ the model is over-constrained and the test log-probability falls as well, and with more
      data this just happens at a larger $C$ [^1]. The log-likelihood of logistic regression is
      concave, so there are no spurious local optima, but plain SGD with a constant step does not
      settle exactly at the optimum [^1]. Feature selection by regularization needs a penalty whose
      derivative at zero is non-zero, such as the 1-norm used by the lasso [^2].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2001) solutions, Problem 2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f01soln/
      - title: 'Wikipedia: Lasso (statistics)'
        locator: Basic form — Orthonormal covariates (soft thresholding makes coefficients exactly zero)
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)#Orthonormal_covariates
    source:
      id: mit-ocw-6867
      ref: midterm_f01soln#q2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f01soln/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-031
    type: single
    difficulty: hard
    tags:
      - l1-penalty
      - regularization-path
      - sparsity
    question: |
      A logistic regression $P(y = 1 \mid x) = g(w_1 x_1 + w_2 x_2)$ (no bias) is trained on data that
      the sign of $x_2$ alone classifies perfectly, although the unregularized solution uses both
      weights. You maximize $\sum_i \log p(y_i \mid x_i) - \frac{C}{2}(|w_1| + |w_2|)$ and increase
      $C$ from 0. What do you expect to see?
    options:
      - text: $w_2$ reaches exactly 0 first, then $w_1$
        why: $w_2$ is the weight the data really need; dropping it costs much more log-likelihood than dropping $w_1$.
      - text: $w_1$ reaches exactly 0 first, then $w_2$
        correct: true
      - text: Both weights reach 0 at the same $C$
        why: The two weights buy very different amounts of log-likelihood, so their penalties are overcome at different values of $C$.
      - text: Neither reaches exactly 0; both only shrink
        why: That is the behaviour of a quadratic penalty. The absolute-value penalty has a non-zero slope at 0 and produces exact zeros.
    explanation: |
      $w_1$ barely helps, since $x_2$ alone already classifies everything correctly, so once the
      penalty's constant pull outweighs its small gain it is set exactly to zero, which is what the
      1-norm's non-zero slope at 0 makes possible [^1] [^2]. As $C$ keeps growing, even $w_2$ is
      eventually not worth its penalty and goes to 0, where the log-likelihood is $n\log 0.5$ [^1].
    references:
      - source: mit-ocw-6867
        locator: Mid-term exam (Fall 2002) solutions, Problem 2, part 2
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
      - title: 'Wikipedia: Lasso (statistics)'
        locator: Basic form — Orthonormal covariates (soft thresholding)
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)#Orthonormal_covariates
    source:
      id: mit-ocw-6867
      ref: midterm_f02soln#q2.2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/midterm_f02soln/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-032
    type: short_answer
    difficulty: easy
    tags:
      - odds-ratio
      - coefficients
      - interpretation
    question: |
      A logistic regression for insurance fraud has the fitted log-odds
      $53.119 - 0.081\,\text{City} + 0.367\,\text{Sex} + 0.060\,\text{Age} - 1.738\,\text{Fault} - 0.142\,\text{Deductible}$,
      where Fault $= 1$ if the policyholder caused the accident and 0 otherwise. By what factor are
      the odds of fraud multiplied when Fault changes from 0 to 1, all other inputs held fixed?
    answer:
      numeric: 0.176
      tolerance: 0.002
      hint: a factor, 3 decimals
      model: $e^{-1.738} \approx 0.176$
    explanation: |
      The odds are $e^{\text{log-odds}}$, so changing one input by one unit multiplies them by $e$ to
      the power of its coefficient: the odds ratio is $e^{\beta}$ [^2]. Here
      $e^{-1.738} \approx 0.176$: when the policyholder is at fault, the odds of fraud are only
      about 18% of the odds when they are not [^1].
    references:
      - source: mit-ocw-15062
        locator: Midterm (2003) solutions, Problem 6 (b)
        url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
      - title: 'Wikipedia: Logistic regression'
        locator: The odds ratio
        url: https://en.wikipedia.org/wiki/Logistic_regression#The_odds_ratio
    source:
      id: mit-ocw-15062
      ref: midterm2003#q6b
      url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-033
    type: short_answer
    difficulty: medium
    tags:
      - predicted-probability
      - sigmoid
    question: |
      A logistic regression for insurance fraud has the fitted log-odds
      $53.119 - 0.081\,\text{City} + 0.367\,\text{Sex} + 0.060\,\text{Age} - 1.738\,\text{Fault} - 0.142\,\text{Deductible}$
      (City $= 1$ for a large city, Sex $= 1$ for male, Age in years, Fault $= 1$ if the
      policyholder caused the accident, Deductible in dollars). What is the predicted probability of
      fraud for a 30-year-old man living in a large city, with a deductible of 400 dollars, who was
      not at fault?
    answer:
      numeric: 0.169
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: log-odds $= 53.119 - 0.081 + 0.367 + 1.8 - 56.8 = -1.595$, and $1/(1 + e^{1.595}) \approx 0.169$
    explanation: |
      First add up the log-odds: $53.119 - 0.081 + 0.367 + 0.060 \cdot 30 - 0.142 \cdot 400 = -1.595$
      [^1]. The logistic function turns log-odds $z$ into the probability $1/(1 + e^{-z})$ [^2], here
      $1/(1 + e^{1.595}) \approx 0.169$ [^1]. The large intercept is offset by the deductible term;
      only the sum matters.
    references:
      - source: mit-ocw-15062
        locator: Midterm (2003) solutions, Problem 6 (d)
        url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
      - title: 'Wikipedia: Logistic regression'
        locator: Definition of the logistic function
        url: https://en.wikipedia.org/wiki/Logistic_regression#Definition_of_the_logistic_function
    source:
      id: mit-ocw-15062
      ref: midterm2003#q6d
      url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-034
    type: short_answer
    difficulty: easy
    tags:
      - log-odds
      - logit
    question: |
      An event has probability $p = 0.1$. What are its log-odds, $\ln \frac{p}{1 - p}$? Round to 3
      decimals.
    answer:
      numeric: -2.197
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\ln(0.1 / 0.9) = \ln(1/9) \approx -2.197$
    explanation: |
      The odds are $0.1 / 0.9 = 1/9 \approx 0.111$, "1 to 9", and their natural logarithm is
      $-\ln 9 \approx -2.197$ [^1]. Log-odds are negative exactly when $p < 0.5$, and the sigmoid maps them
      back: $1 / (1 + e^{2.197}) = 0.1$ [^2]. Logistic regression models these log-odds as a linear
      function of the features [^1].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-11, pp. 13–14; Solution SOL-11, Eqs. (2.10)–(2.13), pp. 29–30
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Logit'
        url: https://en.wikipedia.org/wiki/Logit
        locator: Definition
    source:
      id: dl-interviews
      ref: ch2#prb11
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-035
    type: short_answer
    difficulty: medium
    tags:
      - odds-ratio
      - contingency-table
    question: |
      In a simulated treatment study, tumours were eradicated in 560 of 820 breast-cancer cases (260 not
      eradicated) and in 69 of 105 lung-cancer cases (36 not eradicated). What is the sample odds ratio of
      eradication for breast versus lung cancer? Round to 3 decimals.
    answer:
      numeric: 1.124
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\dfrac{560 / 260}{69 / 36} = \dfrac{560 \cdot 36}{260 \cdot 69} = \dfrac{20160}{17940} \approx 1.124$
    explanation: |
      The odds of eradication are $560/260 \approx 2.154$ for breast and $69/36 \approx 1.917$ for lung
      cancer, so the odds ratio is about 1.124 [^1][^2]. The standard error of the log odds ratio is
      $\sqrt{1/560 + 1/260 + 1/69 + 1/36} \approx 0.219$, so the 95% interval
      $e^{0.117 \pm 1.96 \cdot 0.219} \approx (0.73, 1.73)$ contains 1: the data show no significant
      association between cancer type and eradication [^1][^2]. The relative risk,
      $(560/820) / (69/105) \approx 1.04$, is closer to 1 because eradication is common.
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-19, pp. 16–17; Solution SOL-19, Eqs. (2.27)–(2.31), pp. 34–35
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Odds ratio'
        url: https://en.wikipedia.org/wiki/Odds_ratio
        locator: Statistical inference (standard error of the log odds ratio)
    source:
      id: dl-interviews
      ref: ch2#prb19
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-036
    type: short_answer
    difficulty: easy
    tags:
      - decision-threshold
      - log-odds
    question: |
      A logistic-regression model gives the log-odds of eradicating a tumour as
      $-6 + 0.05\,x_1 + x_2$, where $x_1$ is the irradiation time in milliseconds and $x_2$ the tumour size
      in centimetres. For a 3.5 cm tumour, how many milliseconds of irradiation give exactly a 50% chance
      of eradication?
    answer:
      numeric: 50
      tolerance: 0.01
      hint: a number of milliseconds
      model: $-6 + 0.05\,x_1 + 3.5 = 0 \Rightarrow x_1 = 2.5 / 0.05 = 50$
    explanation: |
      A probability of 0.5 means odds of 1, i.e. log-odds 0 [^2]. Setting $-6 + 0.05\,x_1 + 3.5 = 0$ gives
      $x_1 = 50$ ms [^1]. For comparison, 40 ms gives log-odds $-0.5$ and a probability of
      $\sigma(-0.5) \approx 0.378$.
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-20, pp. 17–18; Solution SOL-20, Eqs. (2.32)–(2.35), p. 35
        url: https://arxiv.org/abs/2201.00650v2
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
        locator: 'Logistic regression: Calculating a probability with the sigmoid function (log-odds)'
    source:
      id: dl-interviews
      ref: ch2#prb20
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-037
    type: single
    difficulty: medium
    tags:
      - inference
      - p-value
      - coefficients
    question: |
      A logistic regression for "a second migraine within an hour" gives these estimates:

      | Parameter | Estimate | Std. error | $z$ | $p$-value |
      |---|---|---|---|---|
      | Intercept | −6.363 | 3.214 | −1.98 | 0.048 |
      | $X_1$: at least four dental amalgams (0/1) | −1.024 | 1.171 | −0.87 | 0.382 |
      | $X_2$: cups of hot coffee per month | 0.119 | 0.055 | 2.17 | 0.030 |

      Which conclusion do they support at the 5% level?
    options:
      - text: Coffee raises the odds of a second migraine; the amalgam effect is not significant
        correct: true
      - text: Having at least four amalgams significantly lowers the odds, since its estimate is negative
        why: The $p$-value 0.38 is far above 0.05, so the data are consistent with no amalgam effect [^2].
      - text: Neither variable matters, because the intercept −6.36 dominates the log-odds
        why: The intercept only sets the baseline; coffee's coefficient is significant ($p = 0.03$) [^2].
      - text: Both variables are significant, because both $|z|$ values exceed 0.5
        why: At the 5% level a two-sided Wald test needs $|z| > 1.96$; amalgams have $|z| = 0.87$ [^2].
    explanation: |
      Each coefficient is tested with the Wald statistic $z = \hat\beta / \mathrm{SE}$ [^2]. Coffee has
      $z = 2.17$, $p = 0.03 < 0.05$ and a positive estimate, so each extra monthly cup multiplies the odds by
      about $e^{0.119} \approx 1.13$ [^1][^3]. The amalgam coefficient has $p = 0.38$, so there is no
      statistical evidence that it changes the odds, even though its point estimate is negative [^1].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-21, pp. 19–20; Solution SOL-21, p. 36
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Wald test'
        url: https://en.wikipedia.org/wiki/Wald_test
        locator: Test on a single parameter
      - title: 'Wikipedia: Logistic regression'
        url: https://en.wikipedia.org/wiki/Logistic_regression#The_odds_ratio
        locator: The odds ratio
    source:
      id: dl-interviews
      ref: ch2#prb21
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-038
    type: short_answer
    difficulty: easy
    tags:
      - decision-threshold
      - log-odds
    question: |
      A logistic regression predicts the probability of improvement as
      $\sigma(-4.8792 + 0.0258\,x)$, where $x$ is a bacteria count. At what count is the predicted
      probability exactly 0.5? Round to 1 decimal.
    answer:
      numeric: 189.1
      tolerance: 0.1
      hint: a number, 1 decimal
      model: $x = 4.8792 / 0.0258 \approx 189.1$
    explanation: |
      $\sigma(z) = 0.5$ exactly when $z = 0$, so $-4.8792 + 0.0258\,x = 0$ gives
      $x = -\hat\alpha / \hat\beta = 4.8792 / 0.0258 \approx 189.1$ [^1][^2]. At a count of 33 the model
      predicts only $\sigma(-4.028) \approx 0.0175$: with such a small slope, the probability climbs slowly.
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-22, pp. 20–21; Solution SOL-22, Eq. (2.40), p. 37
        url: https://arxiv.org/abs/2201.00650v2
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
        locator: 'Logistic regression: Calculating a probability with the sigmoid function (log-odds)'
    source:
      id: dl-interviews
      ref: ch2#prb22
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-039
    type: single
    difficulty: medium
    tags:
      - odds-ratio
      - confidence-interval
    question: |
      A logistic regression has slope $\hat\beta = 0.0258$ with standard error 0.0194 for a count
      variable. Which is the 99% confidence interval for the odds ratio per unit increase of the count
      ($z_{0.995} = 2.576$)?
    options:
      - text: About $(0.976,\ 1.079)$, an interval that contains 1
        correct: true
      - text: About $(-0.024,\ 0.076)$; it contains 0, so the odds ratio may be negative
        why: That is the interval for $\beta$ itself; exponentiating gives the interval for the odds ratio, which is always positive [^2].
      - text: About $(0.988,\ 1.066)$, from $\exp(0.0258 \pm 1.96 \cdot 0.0194)$
        why: 1.96 gives the 95% interval; a 99% interval needs 2.576 and is wider [^2].
      - text: About $(0.999,\ 2.696)$, which shows a strong positive effect
        why: $\exp(0.0258 + 2.576 \cdot 0.0194) = e^{0.0758} \approx 1.079$, not 2.696.
    explanation: |
      The interval for $\beta$ is $0.0258 \pm 2.576 \cdot 0.0194 = (-0.0242, 0.0758)$, and exponentiating
      its ends gives the interval for the odds ratio $e^\beta$: about $(0.976, 1.079)$ [^1][^2]. The point
      estimate $e^{0.0258} \approx 1.026$ means a 2.6% increase in the odds per unit, but the interval
      contains 1, so a zero effect cannot be ruled out at this level.
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-22 parts 3–4, p. 21; Solution SOL-22, Eqs. (2.41)–(2.45), p. 37
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Odds ratio'
        url: https://en.wikipedia.org/wiki/Odds_ratio
        locator: Statistical inference
    source:
      id: dl-interviews
      ref: ch2#prb22-2
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-040
    type: short_answer
    difficulty: medium
    tags:
      - odds-ratio
      - contingency-table
    question: |
      In an animal study, tumours shrank in 60 of 6893 treated animals (6833 without shrinkage) and in 130
      of 6909 animals given a placebo (6778 without shrinkage). What is the odds ratio of shrinkage for the
      treated group versus the placebo group? Round to 3 decimals.
    answer:
      numeric: 0.458
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\dfrac{60 / 6833}{130 / 6778} = \dfrac{60 \cdot 6778}{130 \cdot 6833} \approx 0.458$
    explanation: |
      The odds of shrinkage are $60 / 6833 \approx 0.0088$ with the treatment and
      $130 / 6778 \approx 0.0192$ with the placebo, so the odds ratio is about 0.458 [^1][^2]. Its
      inverse, placebo versus treatment, is $1/0.458 \approx 2.18$, the value reported in the solution
      of *Deep Learning Interviews* [^1]. The standard error of the log odds ratio is
      $\sqrt{1/60 + 1/6833 + 1/130 + 1/6778} \approx 0.157$, so the 95% interval for the inverse,
      about $(1.61, 2.97)$, excludes 1: in these data shrinkage was significantly *less* likely with
      the treatment [^1][^2].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-23, pp. 21–22; Solution SOL-23, Eqs. (2.46)–(2.49), pp. 37–38
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Odds ratio'
        url: https://en.wikipedia.org/wiki/Odds_ratio
        locator: Definition and Statistical inference
    source:
      id: dl-interviews
      ref: ch2#prb23
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-041
    type: single
    difficulty: easy
    tags:
      - generalized-linear-models
      - link-function
    question: Binary logistic regression is a generalized linear model. Which set of components describes it?
    options:
      - text: Bernoulli response; linear predictor $\beta_0 + \boldsymbol\beta^\top\mathbf{x}$; logit link
        correct: true
      - text: Gaussian response; linear predictor $\beta_0 + \boldsymbol\beta^\top\mathbf{x}$; identity link
        why: That is ordinary linear regression [^2].
      - text: Bernoulli response; predictor $\sigma(\beta_0 + \boldsymbol\beta^\top\mathbf{x})$; identity link
        why: The systematic part is the *linear* predictor; the link maps the mean $p$ to it, here by the logit $\ln\frac{p}{1 - p}$ [^1][^2].
      - text: Poisson response; linear predictor $\beta_0 + \boldsymbol\beta^\top\mathbf{x}$; log link
        why: That is Poisson regression for counts [^2].
    explanation: |
      A GLM has three parts: a random component (the distribution of $Y$, here Bernoulli or binomial), a
      systematic component (a linear predictor of the features) and a link function that connects the
      mean of $Y$ to the linear predictor [^1][^2]. For logistic regression the link is the logit,
      $\ln\frac{p}{1 - p} = \beta_0 + \boldsymbol\beta^\top\mathbf{x}$, whose inverse is the sigmoid [^2].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-14, p. 14; Solution SOL-14, p. 31
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Generalized linear model'
        url: https://en.wikipedia.org/wiki/Generalized_linear_model
        locator: Model components and Link function
    source:
      id: dl-interviews
      ref: ch2#prb14
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-042
    type: single
    difficulty: medium
    tags:
      - interaction
      - log-odds
      - coefficients
    question: |
      A logistic-regression model has log-odds $\beta_0 + \beta_1 X + \beta_2 Z + \beta_3 XZ$. By how much do
      the log-odds change when $X$ increases by 1 and $Z$ stays fixed?
    options:
      - text: $\beta_1 + \beta_3 Z$
        correct: true
      - text: $\beta_1$
        why: This ignores the interaction term, which also contains $X$ [^2].
      - text: $\beta_1 + \beta_3$
        why: This is the change only when $Z = 1$.
      - text: $\beta_1 \beta_3 Z$
        why: The terms are added, so the change is a sum, not a product.
    explanation: |
      Replacing $X$ by $X + 1$ adds $\beta_1 + \beta_3 Z$ to the log-odds [^1]. With an interaction term the
      effect of $X$ depends on the value of $Z$: the odds are multiplied by $e^{\beta_1 + \beta_3 Z}$, a
      different factor for each $Z$ [^2]. The significance of $\beta_3$ can be tested with a Wald test or a
      likelihood-ratio test between the models with and without $XZ$ [^1].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-6, pp. 12–13; Solution SOL-6, Eq. (2.9), p. 28
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Interaction (statistics)'
        url: https://en.wikipedia.org/wiki/Interaction_(statistics)
        locator: In regression
    source:
      id: dl-interviews
      ref: ch2#prb6
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-043
    type: short_answer
    difficulty: hard
    tags:
      - loss-functions
      - cross-entropy
      - squared-error
      - saturation
    question: |
      A logistic-regression model outputs $p = \sigma(z)$, and an example with label $y = 1$ has $z = -5$, a
      confident wrong prediction. With cross-entropy loss, $\partial L / \partial z = p - y$; with squared
      error $L = (p - y)^2$, $\partial L / \partial z = 2(p - y)\,p(1 - p)$. How many times larger in
      magnitude is the cross-entropy gradient? Round to the nearest whole number.
    answer:
      numeric: 75
      tolerance: 0.6
      hint: a whole number
      model: $\dfrac{1}{2p(1 - p)}$ with $p = \sigma(-5) \approx 0.00669$, i.e. $\approx 75$
    explanation: |
      The ratio is $1 / (2p(1 - p))$, and $p = \sigma(-5) \approx 0.0067$, so the cross-entropy gradient
      ($\approx -0.993$) is about 75 times the squared-error one ($\approx -0.0132$) [^2]. With squared
      error the factor $p(1 - p)$ from the saturated sigmoid nearly kills the gradient exactly when the
      model is most wrong, and the loss is not convex in the weights [^1][^3]. Cross-entropy (log loss) is
      the natural loss for binary targets [^1][^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-266, p. 289; Solution SOL-266, p. 334
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#softmax-and-cross-entropy-loss
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/logistic-regression/loss-regularization
        locator: 'Logistic regression: Loss and regularization (log loss)'
    source:
      id: dl-interviews
      ref: ch8#prb266
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: logistic-regression-044
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - sigmoid
      - logit
      - decision-threshold
    question: |
      A spam filter outputs a logit $z$, turns it into $p = \sigma(z) = 1/(1 + e^{-z})$ and flags a
      message when $p \ge 0.8$. What is the smallest logit that gets a message flagged? Give 3
      decimals.
    answer:
      numeric: 1.386
      tolerance: 0.002
      hint: a number, e.g. 0.123
      model: $\sigma(z) \ge 0.8 \iff z \ge \ln\frac{0.8}{0.2} = \ln 4 \approx 1.386$
    explanation: |
      The sigmoid is increasing and its inverse is the log-odds, $z = \ln\frac{p}{1 - p}$
      [^1][^2]. The threshold $p = 0.8$ therefore corresponds to $z = \ln 4 \approx 1.386$, and
      every logit at least that large is flagged. Moving the probability threshold moves this
      cut-off on the logit scale; it changes decisions but not the predicted probabilities.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 65–66
      - title: 'Wikipedia: Logit'
        url: https://en.wikipedia.org/wiki/Logit
        locator: Definition (logit as the inverse of the standard logistic function)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q12
    status: reviewed
    reviewed_by: claude
