  - id: logistic-regression-015
    type: true_false
    difficulty: medium
    tags:
      - cross-entropy
      - code-reading
      - pytorch
      - numerical-stability
    shuffle: false
    question: |
      For one example with integer label `k`, one-hot label vector `y` and predicted probabilities
      `y_hat`, true or false: `-(y * torch.log(y_hat)).sum()` always returns the same value as
      `-torch.log(y_hat[k])`.
    options:
      - text: 'True'
        why: If a wrong class has a predicted probability of exactly 0, its term is `0 * log(0)`, that is `0 * -inf`, which is `nan`, and the whole sum becomes `nan` [^2].
      - text: 'False'
        correct: true
    explanation: |
      On paper the one-hot vector zeroes every term except the true class, so the two expressions
      agree [^1]. In floating point they can differ. A predicted probability of exactly 0 for a
      wrong class gives `log(0) = -inf`, and multiplying by the label 0 gives `nan`, which spoils
      the whole sum [^2]. Indexing takes the log of the true-class probability only, and it also
      skips $q - 1$ useless multiplications, which is why d2l selects the entries by indexing [^1][^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html#the-cross-entropy-loss
        locator: Sec. 4.4.3 The Cross-Entropy Loss
      - title: 'Wikipedia: NaN'
        url: https://en.wikipedia.org/wiki/NaN#Operations_generating_NaN
        locator: Operations generating NaN
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html#exercises
        locator: Sec. 4.4.7 Exercises, Exercise 2
