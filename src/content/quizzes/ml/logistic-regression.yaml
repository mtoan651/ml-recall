  - id: logistic-regression-021
    type: true_false
    difficulty: medium
    question: 'True or false: if your features are only weakly correlated with the target, you should switch from linear to logistic regression.'
    options:
      - text: 'True'
        why: The choice depends on the target, not on how strongly the features correlate with it. Logistic regression is for a categorical target, and weak features give a weak classifier just as they give a weak regression [^1][^2].
      - text: 'False'
        correct: true
    explanation: |
      False. What decides between the two is the target: linear regression predicts a continuous
      value, while logistic regression predicts a category such as "white or not white" [^1].
      Microsoft's ML-For-Beginners logistic-regression lesson remarks that logistic regression does
      not need the variables to line up the way linear regression does, which is why its weakly
      correlated pumpkin data was still usable [^1], but that is no reason to switch models. Logistic
      regression still computes a linear combination of the features, the log-odds, and passes it
      through a sigmoid [^2]; features that carry little information about the target give a weak
      classifier just as they give a weak regression.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#binary-classification
        locator: 'Lesson: Logistic regression, secs. Binary classification and Variables DO NOT have to correlate'
