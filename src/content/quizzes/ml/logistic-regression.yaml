  - id: logistic-regression-023
    type: multiple
    difficulty: medium
    tags:
      - softmax
      - large-vocabulary
      - computational-cost
    question: |
      You use softmax regression to predict the next word from a 512-dimensional feature vector, over a
      vocabulary of 50,000 words. Which problems does the large vocabulary cause? Select all that
      apply.
    options:
      - text: The softmax outputs no longer sum to 1 when there are very many classes
        why: The softmax divides by the sum over all classes, so its outputs sum to 1 for any number of classes [^2].
      - text: The cross-entropy loss stops being convex in the weights
        why: 'The number of classes does not matter: the loss is a convex log-sum-exp minus a linear term of the logits, which are linear in the weights.'
      - text: The output layer alone has about 25.6 million weights
        correct: true
      - text: Every probability or loss evaluation needs all 50,000 logits for the softmax denominator
        correct: true
      - text: Rare words occur in few training examples, so their weights are poorly estimated
        correct: true
    explanation: |
      A fully connected layer with $d$ inputs and $q$ outputs has $O(dq)$ parameters and cost [^1]:
      here $512 \times 50{,}000 = 25.6$ million weights plus 50,000 biases. The normalizer
      $\sum_k \exp(o_k)$ runs over every word, so even a single prediction or gradient step touches all
      50,000 outputs [^2]. Word frequencies are very skewed, so most words are rare [^3], and their
      weight vectors receive few updates. The softmax, by contrast, is normalized by construction for
      any number of classes [^2].
    references:
      - source: d2l
        locator: Sec. 4.1.4 Summary and Discussion
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#summary-and-discussion
      - source: d2l
        locator: Sec. 4.1.1.2 The Softmax
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
      - source: d2l
        locator: Sec. 9.2.5 Exploratory Language Statistics
        url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
      - source: d2l
        locator: Sec. 4.4.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html#exercises
