  - id: logistic-regression-002
    type: single
    difficulty: easy
    question: Types of Logistic Regression include
    options:
      - text: multinomial and cardinal
      - text: multinomial and ordinal
        correct: true
      - text: principal and ordinal
    explanation: |
      Besides the binary case, the lesson names two more kinds of logistic regression. Multinomial
      handles more than two unordered categories, and ordinal handles categories with a natural order,
      such as pumpkin sizes [^1]. "Cardinal" and "principal" are not types of logistic regression. The
      multinomial form is also what scikit-learn fits for multiclass problems [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#other-classifications
        locator: 'Lesson: Logistic Regression, Other classifications'
