  - id: logistic-regression-016
    type: short_answer
    difficulty: medium
    tags:
      - decision-threshold
      - cost-sensitive
      - binary-classification
    question: |
      A logistic-regression screening model outputs $p = P(\text{disease} \mid \mathbf{x})$. Missing
      a sick patient (a false negative) costs 10 times as much as a false alarm (a false positive),
      and correct decisions cost nothing. To minimize the expected cost, you flag a patient when
      $p$ is above which threshold?
    answer:
      numeric: 0.0909
      tolerance: 0.001
      hint: a probability, 3 decimals
      model: Flag when $10p > 1 \cdot (1 - p)$, that is when $p > 1/11 \approx 0.091$.
    explanation: |
      Weighting each kind of error by its cost gives the expected cost of each decision [^1].
      Flagging costs $1 \cdot (1 - p)$ on average (a false alarm if the patient is healthy), and not
      flagging costs $10p$ (a miss if the patient is sick). Flagging is cheaper when $10p > 1 - p$,
      that is when $p > 1/11 \approx 0.091$. Returning the most likely label, which means a threshold
      of 0.5, is a poor rule here: when misses are expensive the threshold belongs well below
      0.5 [^2][^3].
    references:
      - title: 'Wikipedia: Cost-sensitive machine learning'
        url: https://en.wikipedia.org/wiki/Cost-sensitive_machine_learning#Cost_Matrix
        locator: Cost Matrix (expected cost)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/classification_threshold.html
        locator: Sec. 3.3 Tuning the decision threshold for class prediction (introduction, cancer-detection example)
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression-scratch.html#exercises
        locator: Sec. 4.4.7 Exercises, Exercise 3
