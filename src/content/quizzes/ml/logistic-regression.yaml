  - id: logistic-regression-025
    type: multiple
    difficulty: medium
    tags:
      - decision-boundary
      - predict-proba
      - sigmoid
      - regularization
    question: |
      Which statements about logistic regression and linear classifiers are true? Select all that
      apply.
    options:
      - text: Increasing logistic regression's hyperparameter `C` increases model complexity
        correct: true
      - text: The raw output score can be turned into the probability score of a prediction
        correct: true
      - text: For a linear classifier trained on $d$ features, the decision boundary is a $(d-1)$-dimensional hyperplane
        correct: true
      - text: A linear classifier is likely to be uncertain about points close to its decision boundary
        correct: true
      - text: A point far from the decision boundary is always classified correctly, because the model is very confident about it
        why: Confidence is not correctness. Points far from the boundary get extreme probabilities even when they are wrong, like the over-confident mistakes (likely Alaskan cities predicted as Canadian) in UBC CPSC 330's city-classification example [^3].
    explanation: |
      `C` is logistic regression's main hyperparameter: bigger `C` means a more complex model that
      may overfit [^1]. The raw score $w^\top x + b$ is passed through the sigmoid to get the
      probability of the positive class, and the boundary $w^\top x + b = 0$ is a hyperplane of
      dimension $d - 1$ (a line for $d = 2$) [^2]. Points near the boundary get probabilities near
      0.5, points far from it get probabilities near 0 or 1, and those confident predictions can
      still be wrong [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Main hyperparameter of logistic regression'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Decision boundary of logistic regression; The sigmoid function'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Least confident, most confident and over confident cases'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
    source:
