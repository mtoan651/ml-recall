  - id: logistic-regression-024
    type: single
    difficulty: medium
    tags:
      - linear-models
      - regularization
      - coefficients
      - predict-proba
    question: Which statement about linear models is true?
    options:
      - text: Ridge regression learns one coefficient per training example
        why: Linear models learn one coefficient per *feature*, plus an intercept [^2].
      - text: For one example, `predict_proba` shows how much each feature drives its prediction
        why: '`predict_proba` returns the probability of each *class*, not a per-feature contribution [^3].'
      - text: Increasing logistic regression's `C` increases model complexity
        correct: true
      - text: On unscaled data, coefficients of 1.25 for A and 0.56 for B mean A has the bigger impact
        why: Without scaling, coefficient size depends on the feature's units; a feature with small values gets a large coefficient [^4].
    explanation: |
      In logistic regression `C` is the inverse regularization strength: a bigger `C` means weaker
      regularization and a more complex model that might overfit, a smaller `C` a simpler one that
      might underfit [^1]. The other statements mix up what a linear model learns (one weight per
      feature) [^2], what `predict_proba` reports (class probabilities, obtained by passing the raw
      score through the sigmoid) [^3], and when coefficient magnitudes can be compared (only after
      scaling) [^4].
