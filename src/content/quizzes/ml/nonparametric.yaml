  - id: nonparametric-017
    type: single
    difficulty: medium
    tags:
      - nearest-neighbor-search
      - approximate-nearest-neighbors
      - word-similarity
    question: |
      Finding the 3 words most similar to "chip" by cosine similarity among 400,000 GloVe vectors
      compares the query with every vector. How can such queries be made much faster for a very large
      vocabulary?
    options:
      - text: Build an approximate nearest-neighbor index, e.g. locality-sensitive hashing or an HNSW graph
        correct: true
      - text: Use Euclidean distance instead of cosine similarity, since it avoids normalization
        why: Any exact distance still has to be computed against all 400,000 vectors.
      - text: Ask for 1 neighbor instead of 3, since the scan cost grows with the number returned
        why: The cost of a full scan comes from the number of vectors, not from how many results are kept.
      - text: Query with $\mathrm{vec}(c) + \mathrm{vec}(b) - \mathrm{vec}(a)$ instead of the word's own vector
        why: That is how analogies are posed; it changes the query, not the cost of the search.
    explanation: |
      d2l's `knn` computes the cosine similarity between the query and every vector in the
      vocabulary [^1], a cost linear in the vocabulary size per query. Approximate nearest-neighbor
      methods trade exactness for speed: locality-sensitive hashing maps nearby points into the same
      bucket with high probability, and graph-based methods such as HNSW walk greedily through a
      proximity graph [^2]. Normalizing all vectors once also turns cosine similarity into a single
      matrix–vector product, but that scan remains linear in the vocabulary size.
    references:
      - source: d2l
        locator: Sec. 15.7.2.1 Word Similarity
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/similarity-analogy.html#word-similarity
      - title: 'Wikipedia: Nearest neighbor search'
        url: https://en.wikipedia.org/wiki/Nearest_neighbor_search#Approximation_methods
        locator: Approximation methods (Greedy search in proximity neighborhood graphs; Locality sensitive hashing)
      - source: d2l
        locator: Sec. 15.7.4 Exercises, Exercise 2
        url: https://d2l.ai/chapter_natural-language-processing-pretraining/similarity-analogy.html#exercises
    source:
      id: d2l
      ref: chapter_natural-language-processing-pretraining/similarity-analogy#ex2
      url: https://d2l.ai/chapter_natural-language-processing-pretraining/similarity-analogy.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-018
    type: single
    difficulty: easy
    tags:
      - knn
      - prediction-cost
      - lazy-learning
    question: What is a key limitation of the $k$-nearest-neighbours ($k$-NN) classifier?
    options:
      - text: Predictions get slow when the training set is large
        correct: true
      - text: It cannot be used for regression, only classification
        why: $k$-NN regression predicts the average target of the $k$ nearest neighbours [^1].
      - text: It cannot work with numerical features, only categories
        why: Numerical features are its natural input, since it compares examples with Euclidean distances [^2].
      - text: It needs labeled training data to make predictions
        why: Every supervised learner needs labeled examples, so this does not set $k$-NN apart [^1].
    explanation: |
      $k$-NN is a lazy learner: `fit` only stores the training set, and all the work happens at
      prediction time, when the query is compared with the stored examples to find its nearest
      neighbours. The course therefore lists "can be VERY slow during prediction time, especially
      when the training set is very large" as its main con [^1]. Brute-force neighbour search costs
      time proportional to the number of training examples times the number of features [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Pros and Cons of k-NNs for supervised learning'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
