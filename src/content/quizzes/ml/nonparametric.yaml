  - id: nonparametric-013
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - computational-complexity
      - prediction
    question: |
      After training a GP regression model on $n$ points you store the Cholesky factor $L$ of
      $K + \sigma^2 I$ and the vector $\boldsymbol{\alpha} = (K + \sigma^2 I)^{-1}\mathbf{y}$. What
      does each new test point cost?
    options:
      - text: $\mathcal{O}(n)$ for the predictive mean and $\mathcal{O}(n^2)$ for the predictive variance
        correct: true
      - text: $\mathcal{O}(n^3)$ for both, since every prediction factorizes the kernel matrix all over again
        why: The factorization is done once in training; predictions reuse $L$ and $\boldsymbol{\alpha}$ [^2].
      - text: $\mathcal{O}(n^2)$ for the predictive mean and $\mathcal{O}(n)$ for the predictive variance
        why: The mean is one dot product $\mathbf{k}_*^\top \boldsymbol{\alpha}$; the variance needs a triangular solve with $L$, which is the more expensive part [^2].
      - text: $\mathcal{O}(1)$ for both, since a GP keeps no weights to evaluate
        why: Being nonparametric is exactly why prediction touches all $n$ training points, like a nearest-neighbour method [^1].
    explanation: |
      The predictive mean is a linear combination of the training targets weighted by the kernel
      [^1]: with $\boldsymbol{\alpha}$ stored it is $\mathbf{k}_*^\top \boldsymbol{\alpha}$, $n$ kernel
      evaluations and one dot product, $\mathcal{O}(n)$. The predictive variance
      $k(x_*, x_*) - \mathbf{v}^\top \mathbf{v}$ needs $\mathbf{v} = L^{-1}\mathbf{k}_*$, a triangular
      solve costing about $n^2/2$ operations per test point [^2]. So for $m$ test points the means cost
      $\mathcal{O}(mn)$ and the variances $\mathcal{O}(mn^2)$, on top of the one-off
      $\mathcal{O}(n^3)$ training cost.
    references:
      - source: d2l
        locator: Sec. 18.3.3 Interpreting Equations for Learning and Predictions (the predictive mean as a weighted combination of targets)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#interpreting-equations-for-learning-and-predictions
