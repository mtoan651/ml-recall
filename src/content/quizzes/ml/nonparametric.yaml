  - id: nonparametric-023
    type: short_answer
    difficulty: medium
    tags:
      - curse-of-dimensionality
      - knn
      - locality
    question: |
      Inputs are uniformly distributed in the 10-dimensional unit hypercube. A nearest-neighbour method
      looks at a small sub-cube around a query point that should contain 1% of the data. What edge length
      must that sub-cube have? Give 2 decimals.
    answer:
      numeric: 0.63
      tolerance: 0.005
      hint: a number between 0 and 1, 2 decimals
      model: $e = 0.01^{1/10} \approx 0.63$
    explanation: |
      A sub-cube of edge $e$ holds the fraction $e^{p}$ of uniformly spread data in $p$ dimensions, so
      capturing a fraction $r$ needs $e = r^{1/p}$ [^1]. For $r = 0.01$ and $p = 10$ that is $0.63$:
      the "local" neighbourhood spans 63% of the range of every input, so it is no longer local [^1][^2].
      This is the curse of dimensionality: the data needed to keep neighbourhoods small grows
      exponentially with the dimension [^3].
    references:
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 2.5 Local Methods in High Dimensions
      - title: 'Wikipedia: Curse of dimensionality'
        url: https://en.wikipedia.org/wiki/Curse_of_dimensionality#k-nearest_neighbor_classification
        locator: Section "k-nearest neighbor classification"
      - source: ds-interviews
        locator: theory.md, Classification — "What is 'curse of dimensionality'?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
    source:
      id: ds-interviews
      ref: theory.md#q39
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-024
    type: short_answer
    difficulty: medium
    tags:
      - collaborative-filtering
      - recommender-systems
      - nearest-neighbours
    question: |
      User-based collaborative filtering predicts Ann's rating of a film from her two most similar users:
      Bob (similarity 0.9) rated it 4 and Cara (similarity 0.5) rated it 2. Using the similarity-weighted
      average $\hat r = \sum_v s_v r_v / \sum_v |s_v|$, what rating is predicted? Give 2 decimals.
    answer:
      numeric: 3.29
      tolerance: 0.01
      hint: a number, 2 decimals
      model: $(0.9 \cdot 4 + 0.5 \cdot 2)/(0.9 + 0.5) = 4.6/1.4 \approx 3.29$
    explanation: |
      Memory-based collaborative filtering is a nearest-neighbour method: it predicts from the ratings
      of the most similar users, weighting each by its similarity [^1][^2]. Here $4.6/1.4 = 3.29$, pulled
      towards Bob's 4 because he is more similar. Real systems also subtract each user's mean rating
      first, because some users rate everything higher than others [^1].
    references:
      - title: 'Wikipedia: Collaborative filtering'
        url: https://en.wikipedia.org/wiki/Collaborative_filtering#Memory-based
        locator: Section "Memory-based"
      - source: d2l
        locator: Sec. 21.1.1 Collaborative Filtering
        url: https://d2l.ai/chapter_recommender-systems/recsys-intro.html#collaborative-filtering
    source:
