  - id: nonparametric-027
    type: short_answer
    difficulty: medium
    tags:
      - knn
      - cross-validation
      - leave-one-out
    question: |
      One-dimensional data: class O at $f = 1, 2, 7, 10, 11$ and class X at $f = 3, 6, 6$ (two X
      points share $f = 6$). Run 8-fold (leave-one-out) cross-validation of 1-NN, breaking distance
      ties in favor of the point on the left. What accuracy is predicted? Give a fraction between 0
      and 1.
    answer:
      numeric: 0.75
      tolerance: 0.001
      hint: a decimal between 0 and 1
      model: 'Wrong only for 3 (nearest 2 is O) and 7 (nearest 6 is X): 6 of 8 = 0.75'
    explanation: |
      Each point is classified by its nearest other point [^1]. 1 → 2 (O, right), 2 → 1 (tie with 3,
      left wins; O, right), 3 → 2 (O, wrong), each 6 → the other 6 (X, right), 7 → 6 (X, wrong),
      10 ↔ 11 (O, right). That is 6 correct out of 8, an estimated accuracy of 75% [^2].
    references:
      - title: 'Wikipedia: Cross-validation (statistics)'
        url: https://en.wikipedia.org/wiki/Cross-validation_(statistics)#Leave-one-out_cross-validation
        locator: Leave-one-out cross-validation
