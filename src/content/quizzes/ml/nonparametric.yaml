title: Nearest Neighbors & Kernel Methods
questions:
  - id: nonparametric-001
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** The kernel density estimator is equivalent to performing (Nadaraya–Watson) kernel regression with the value $Y_i = 1/n$ at each point $X_i$ in the original data set.

      **Statement 2.** The depth of a learned decision tree can be larger than the number of training examples used to create the tree.
    options:
      - text: True, True
        why: Both statements are false; kernel regression with constant targets $1/n$ predicts the constant $1/n$, and a tree path cannot have more splits than there are training examples.
      - text: False, False
        correct: true
      - text: True, False
        why: Statement 1 is false; Nadaraya–Watson divides by the total kernel weight, so constant targets give a constant prediction, not a density.
      - text: False, True
        why: Statement 2 is false; each split sends at least one training example to each child, so a path has at most $n - 1$ splits.
    explanation: |
      Statement 1 is false. Kernel (Nadaraya–Watson) regression predicts a weighted average of the
      training targets, $f(x) = \sum_i y_i K(x - x_i) / \sum_j K(x - x_j)$ [^1]. If every $y_i = 1/n$,
      the weights sum to one and the prediction is the constant $1/n$ everywhere. A kernel density
      estimate instead adds up the kernels without dividing by their total,
      $\hat p(x) \propto \sum_i K(x - x_i)$, so it is large where the points are dense [^2].
      Statement 2 is false too. Thresholds are placed between distinct observed values, so every split
      sends at least one training example to each child [^3]. Each split along a path therefore
      removes at least one example, so the depth can never exceed $n - 1$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html
        locator: Sec. 11.2 Attention Pooling by Similarity, eq. (11.2.2)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/density.html#kernel-density-estimation
        locator: Sec. 2.8.2 Kernel Density Estimation
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/tree.html#mathematical-formulation
        locator: Sec. 1.10.7 Mathematical formulation (decision trees)
    source:
      id: mmlu-redux
      ref: machine_learning/12
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=12
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-002
    type: single
    difficulty: medium
    question: 'For Kernel Regression, which one of these structural assumptions is the one that most affects the trade-off between underfitting and overfitting:'
    options:
      - text: Whether kernel function is Gaussian versus triangular versus box-shaped
        why: The kernel's shape changes the estimate only slightly; Gaussian, triangular and box kernels of the same width give similar fits.
      - text: Whether we use Euclidean versus $L_1$ versus $L_\infty$ metrics
        why: The metric changes the shape of each neighbourhood, but how far the averaging reaches, and so how smooth the fit is, is set by the width.
      - text: The kernel width
        correct: true
      - text: The maximum height of the kernel function
        why: The kernel's height cancels out, because the weights are normalized by their sum.
    explanation: |
      The kernel width (bandwidth) sets how far each training point's influence reaches, so it is the
      smoothing parameter. A narrow kernel follows local variation and gives a wiggly, high-variance
      fit. A wide kernel averages over many points and gives a smooth, high-bias fit [^1][^2]. The
      kernel's shape matters much less: Gaussian, boxcar and Epanechnikov kernels give very similar
      estimates [^1]. The kernel's maximum height cancels out entirely, because the weights are
      normalized by their sum [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#adapting-attention-pooling
        locator: Sec. 11.2.2 Attention Pooling via Nadaraya–Watson Regression and Sec. 11.2.3 Adapting Attention Pooling
        quote: Clearly, the narrower the kernel, the less smooth the estimate.
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/density.html#kernel-density-estimation
        locator: Sec. 2.8.2 Kernel Density Estimation
        quote: The bandwidth here acts as a smoothing parameter, controlling the tradeoff between bias and variance in the result.
    source:
      id: mmlu-redux
      ref: machine_learning/28
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=28
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The training error of 1-nearest neighbor classifier is 0.

      **Statement 2.** As the number of data points grows to infinity, the MAP estimate approaches the MLE estimate for all possible priors. In other words, given enough data, the choice of prior is irrelevant.
    options:
      - text: True, True
        why: Statement 2 is false; a prior that gives zero probability to the MLE keeps the MAP estimate away from it however much data arrives.
      - text: False, False
        why: Statement 1 is true; each training point is its own nearest neighbour, so 1-NN reproduces every training label (barring identical inputs with different labels).
      - text: True, False
        correct: true
      - text: False, True
        why: Both are the wrong way round; 1-NN has zero training error, and the prior washes out only if it is positive around the MLE.
    explanation: |
      Statement 1 is true. 1-NN memorizes the training set, and each training point is its own
      nearest neighbor, so the classifier always reaches zero training error, as long as no two
      identical inputs carry different labels [^1][^2]. Statement 2 is false. The MAP estimate
      maximizes the likelihood times the prior $p(\theta)$ [^3]. If the prior gives zero probability
      to some parameter values, such as a point-mass prior or one whose support leaves out the MLE,
      the product stays zero there no matter how much data arrives. MAP then cannot approach the MLE,
      so the prior washes out only when it is positive around the MLE.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#inspiration-from-nonparametrics
        locator: Sec. 5.5.2 Inspiration from Nonparametrics
      - title: 'James, Witten, Hastie, Tibshirani: An Introduction to Statistical Learning (1st ed., 7th printing)'
        url: https://www.statlearning.com/s/ISLR-Seventh-Printing.pdf
        locator: Sec. 2.2.3 The Classification Setting (K-Nearest Neighbors), p. 40
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 9.4 Bayesian statistics and regularization, eq. (9.5)
    source:
      id: mmlu-redux
      ref: machine_learning/45
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=45
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-004
    type: single
    difficulty: easy
    question: If $N$ is the number of instances in the training dataset, nearest neighbors has a classification run time of
    options:
      - text: $O(1)$
        why: A query has to be compared with the stored examples; it cannot be answered without looking at the data.
      - text: $O(N)$
        correct: true
      - text: $O(\log N)$
        why: Logarithmic query time needs an extra index such as a k-d tree, and only in low dimensions; plain nearest neighbors scans all $N$ points.
      - text: $O(N^2)$
        why: One query needs $N$ distances, not $N^2$; $N^2$ is the cost of comparing all pairs of training points.
    explanation: |
      A basic nearest-neighbor classifier does no real training. At prediction time it compares the
      query with every one of the $N$ stored examples, so brute-force query time grows as $O(DN)$,
      which is linear in $N$ for a fixed dimension $D$ [^1][^2]. Tree indexes such as k-d trees or ball
      trees can bring a query down to about $O(D \log N)$ in low dimensions, but they need an extra
      data structure and slow down toward $O(DN)$ in high dimensions [^1]. Constant time and $O(N^2)$
      do not describe a single query.
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/neighbors.html#choice-of-nearest-neighbors-algorithm
        locator: Sec. 1.6.4 Nearest Neighbor Algorithms (Choice of Nearest Neighbors Algorithm)
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#inspiration-from-nonparametrics
        locator: Sec. 5.5.2 Inspiration from Nonparametrics
    source:
