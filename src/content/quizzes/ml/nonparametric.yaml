  - id: nonparametric-028
    type: single
    difficulty: hard
    tags:
      - knn
      - voronoi
      - condensed-nearest-neighbor
    question: |
      To speed up a two-class 1-nearest-neighbor classifier you remove "redundant" training points,
      whose removal changes the prediction for no possible query. Which condition makes a point
      redundant?
    options:
      - text: Its Voronoi cell borders only cells of its own class
        correct: true
      - text: It is farther than average from the training points of the other class
        why: Distance on average says nothing about whether its cell touches the decision boundary somewhere.
      - text: Its own nearest neighbor has the same class
        why: Its cell can still border a cell of the other class elsewhere, and removing it would move that part of the boundary.
      - text: It lies inside the convex hull of its own class
        why: Points of the other class can lie inside that hull too, so the cell may still touch them.
    explanation: |
      1-NN partitions the plane into Voronoi cells, and the decision boundary consists of the cell
      walls between points of different classes [^1]. If every neighboring cell has the same class,
      deleting the point only redistributes its cell among same-class neighbors, so no prediction
      changes; this is the idea behind condensed nearest neighbor editing [^2].
    references:
      - title: 'Wikipedia: k-nearest neighbors algorithm'
        url: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm#Decision_boundary
        locator: Decision boundary
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 4 Learning, Part A
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
      id: mit-ocw-6034-s05
      ref: quiz2_review_sol#q4a-learning
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-029
    type: single
    difficulty: medium
    tags:
      - knn
      - algorithm-choice
      - scalability
    question: |
      You have about one million labeled examples in a 6-dimensional feature space and expect to
      classify only about 100 new points. Which learner is the most sensible default?
    options:
      - text: Naive Bayes
        why: It is cheap, but its independence assumption usually makes it less accurate than kNN in a dense, low-dimensional space.
      - text: An SVM with an RBF kernel
        why: Kernel SVM training scales badly with a million examples, and the cost is not repaid by only 100 predictions.
      - text: A neural network trained by backpropagation
        why: Many passes over a million examples are expensive; training cost dominates for so few queries.
      - text: k-nearest neighbors
        correct: true
    explanation: |
      kNN has essentially no training cost and works well when the dimension is low and data are
      plentiful [^1]. Its weakness, slow prediction, hardly matters for 100 queries, and in 6
      dimensions a k-d tree can speed up the search further [^2].
    references:
      - source: mit-ocw-6034-s05
        locator: Quiz 2 (Spring 2005) solutions, Problem 6 Learning algorithms, part 1
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
      - title: 'Wikipedia: k-nearest neighbors algorithm'
        url: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm#Algorithm
        locator: Algorithm (lazy learning; search structures)
    source:
      id: mit-ocw-6034-s05
      ref: q2_soln#q6.1
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/q2_soln/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-030
    type: single
    difficulty: medium
    tags:
      - knn
      - curse-of-dimensionality
      - feature-selection
    question: |
      A spam filter represents each email as a vector of word counts over the whole vocabulary (tens
      of thousands of features, most irrelevant). Why is a decision tree likely to beat 1-nearest
      neighbor here?
    options:
      - text: Decision trees cannot overfit, while nearest neighbor always overfits
        why: Unpruned trees overfit easily too; the issue is which features drive the decision.
      - text: Nearest neighbor cannot handle count-valued features, only binary ones
        why: Distances work on counts just fine; the problem is that thousands of irrelevant counts swamp them.
      - text: The tree needs no training data, while nearest neighbor stores all of it
        why: Trees are learned from the training data; storing the data is NN's prediction-time cost, not its accuracy problem.
      - text: Trees pick informative words; NN distance is swamped by irrelevant words
        correct: true
    explanation: |
      In high dimension with many irrelevant features, Euclidean distance is mostly noise, so the
      "nearest" email need not be similar in the words that matter [^1][^2]. A decision tree chooses
      the words with the best splits and ignores the rest, and it also predicts far faster than
      comparing against every stored email; naive Bayes is a strong third option for text [^2].
    references:
      - title: 'Wikipedia: Curse of dimensionality'
        url: https://en.wikipedia.org/wiki/Curse_of_dimensionality#Distance_function
        locator: Distance function
      - source: mit-ocw-6034-s05
        locator: Quiz 2 review solutions, Problem 3 Spaminator, Part A
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    source:
