      ref: quiz2_review_sol#q3a-spam
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-spring-2005/resources/quiz2_review_sol/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-031
    type: single
    difficulty: easy
    tags:
      - knn
      - choice-of-k
      - underfitting
    question: |
      A kNN classifier with plain majority voting is trained on $N$ labeled points. What happens if
      you set $k = N$?
    options:
      - text: The decision boundary becomes the Voronoi diagram of the training points
        why: The Voronoi boundary belongs to 1-NN; with $k = N$ there is no boundary at all.
      - text: The prediction becomes undefined because of ties
        why: Ties only arise if the classes are exactly balanced; otherwise the majority class wins everywhere.
      - text: Every query gets the majority class of the training set
        correct: true
      - text: The classifier memorizes the training set exactly, as with $k = 1$
        why: That is the $k = 1$ extreme; with $k = N$ every point votes on every query.
    explanation: |
      Small $k$ follows every noisy point (overfitting), while large $k$ averages over more and more
      distant points [^1]. At $k = N$ all training points vote for every query, so the classifier
      ignores the input and always predicts the majority class, the extreme of underfitting; $k$ is
      usually chosen by cross-validation in between [^1][^2].
    references:
      - title: 'Wikipedia: k-nearest neighbors algorithm'
        url: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm#Parameter_selection
        locator: Parameter selection
      - source: mit-ocw-6034
        locator: Quiz 3 (2010), Problem 1 Learning, Part A2 More KNN
        url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2010/
    source:
      id: mit-ocw-6034
      ref: mit6_034f10_quiz3_2010#q1a2
      url: https://ocw.mit.edu/courses/6-034-artificial-intelligence-fall-2010/resources/mit6_034f10_quiz3_2010/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-032
    type: single
    difficulty: medium
    tags:
      - kernel-ridge-regression
      - rbf-kernel
      - interpolation
    question: |
      Kernel ridge regression predicts $y(x) = \sum_{t=1}^{n} (\hat\alpha_t / \lambda) K(x_t, x)$ with
      $\hat{\boldsymbol\alpha} = \lambda(\lambda I + K)^{-1}\mathbf{y}$, where $K$ is the Gram matrix of the
      $n$ training inputs. The kernel is $K(x, x') = \exp(-\beta\lVert x - x'\rVert^2 / 2)$ and the
      inputs are distinct. What happens to the training error as $\lambda \to 0$?
    options:
      - text: It becomes exactly zero, since the fit interpolates the targets
        correct: true
      - text: It tends to the noise variance of the targets
        why: That is the typical *test* error of a well-chosen model; without regularization the RBF predictor fits every training target exactly.
      - text: It is undefined, because the Gram matrix becomes singular
        why: For distinct inputs the Gaussian Gram matrix is non-singular, so the limit $K^{-1}\mathbf{y}$ exists [^2].
      - text: It tends to the training error of ordinary least squares on the raw inputs
        why: The RBF feature space is infinite-dimensional, so the unregularized fit is far more flexible than a linear fit on the raw inputs.
    explanation: |
      Writing $A = (\lambda I + K)^{-1}\mathbf{y}$ gives $y(x) = \sum_t A_t K(x_t, x)$, and as
      $\lambda \to 0$, $A \to K^{-1}\mathbf{y}$ [^1]. The limit exists because the Gaussian kernel is
      strictly positive definite, so its Gram matrix on distinct points is invertible [^2]. At a
      training input, $y(x_s) = \sum_t (K^{-1}\mathbf{y})_t K_{ts} = y_s$: the predictor
      interpolates, and the training error is exactly zero [^1]. That is overfitting; the test error
      is lowest at an intermediate $\lambda$.
    references:
      - source: mit-ocw-6867
        locator: Problem set 2 solutions, Problem 2 (a)–(d)
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw2_soln/
      - title: 'Wikipedia: Radial basis function interpolation'
        locator: Motivation (the Gaussian is strictly positive definite, so the interpolation matrix is non-singular)
        url: https://en.wikipedia.org/wiki/Radial_basis_function_interpolation#Motivation
    source:
      id: mit-ocw-6867
      ref: hw2_soln#q2
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw2_soln/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-033
    type: single
    difficulty: medium
    tags:
      - kernel-perceptron
      - dual-representation
    question: |
      The perceptron updates $\theta \leftarrow \theta + y_t\phi(x_t)$ whenever $y_t\theta^\top\phi(x_t) \le 0$,
      starting from $\theta = 0$. Its kernel form keeps the discriminant as
      $f(x) = \sum_{i=1}^{n} w_i\, y_i\, K(x_i, x)$. What is $w_i$?
    options:
      - text: A Lagrange multiplier between 0 and a constant $C$
        why: That describes the SVM dual. The perceptron has no optimization problem; it only counts updates.
      - text: How many updates (mistakes) were made on $x_i$ so far
        correct: true
      - text: 1 if $x_i$ is a support vector and 0 otherwise
        why: Coefficients are integers that can exceed 1, since an example can trigger several updates.
      - text: The kernel value $K(x_i, x_i)$
        why: $K(x_i, x_i)$ is fixed by the kernel; the coefficients change during training.
    explanation: |
      $\theta$ is always a sum of the vectors $y_t\phi(x_t)$ added at the mistakes, so
      $\theta = \sum_i w_i y_i \phi(x_i)$ with $w_i$ the number of updates made on example $i$ [^1][^2].
      Then $\theta^\top\phi(x) = \sum_i w_i y_i K(x_i, x)$, and a mistake on $x_t$ simply increments
      $w_t$, i.e. $f(x) \leftarrow f(x) + y_t K(x_t, x)$ [^1]. Examples that never cause a mistake
      keep $w_i = 0$. With an RBF kernel the training data are always separable in feature space, so
      the algorithm stops after finitely many updates [^1].
    references:
      - source: mit-ocw-6867
        locator: Problem set 2 solutions, Problem 3 (a)–(b)
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw2_soln/
      - title: 'Wikipedia: Kernel perceptron'
        locator: Algorithm (the dual perceptron keeps a "mistake counter" vector)
        url: https://en.wikipedia.org/wiki/Kernel_perceptron#Algorithm
    source:
      id: mit-ocw-6867
      ref: hw2_soln#q3
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw2_soln/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-034
    type: short_answer
    difficulty: hard
    tags:
      - rbf-interpolation
      - extrapolation
    question: |
      One-dimensional RBF interpolation uses $f(x) = \sum_{i=1}^{3} c_i\,|x - x_i|$ with nodes
      $x_1 = 0$, $x_2 = 3$, $x_3 = 4$, and the coefficients are chosen so that $f(0) = 1$,
      $f(3) = 4$ and $f(4) = 3$. What is $f(6)$?
    answer:
      numeric: 5
      tolerance: 0.001
      hint: a number
      model: $c = (1, -1, 1)$, so $f(x) = |x| - |x - 3| + |x - 4|$ and $f(6) = 6 - 3 + 2 = 5$
    explanation: |
      The interpolation conditions give the linear system $K\mathbf{c} = \mathbf{y}$ with
      $K_{ij} = |x_i - x_j|$ [^2]:
      $3c_2 + 4c_3 = 1$, $3c_1 + c_3 = 4$, $4c_1 + c_2 = 3$, whose solution is $c = (1, -1, 1)$ [^1].
      Each basis function is piecewise linear with a kink at its node, so between the nodes $f$
      just joins the data points with straight lines. Beyond $x = 4$ all terms are linear with total
      slope $c_1 + c_2 + c_3 = 1$, so $f(6) = f(4) + 2 = 5$.
    references:
      - source: mit-ocw-9520
        locator: Problem set 2, Problem 2.1 (RBF interpolation with K(x) = |x|)
        url: https://ocw.mit.edu/courses/9-520-statistical-learning-theory-and-applications-spring-2003/resources/second_set/
      - title: 'Wikipedia: Radial basis function interpolation'
        locator: Introduction (interpolant as a weighted sum of radial basis functions; linear system for the weights)
        url: https://en.wikipedia.org/wiki/Radial_basis_function_interpolation
    source:
