  - id: nonparametric-037
    type: short_answer
    difficulty: medium
    tags:
      - minhash
      - jaccard-index
      - near-duplicates
    question: |
      Two documents have shingle sets with Jaccard similarity $2/7$. MinHash computes, for each of 200
      independent random hash functions $h$, the smallest hash value $\min_{x \in S} h(x)$ of each set. For
      how many of the 200 hash functions do you expect the two minima to be equal? Round to 1 decimal.
    answer:
      numeric: 57.1
      tolerance: 0.1
      hint: a number, 1 decimal
      model: $200 \cdot 2/7 \approx 57.1$
    explanation: |
      For a random hash function, the element of $A \cup B$ with the smallest hash is equally likely to be
      any element of the union, and the two minima agree exactly when that element lies in $A \cap B$, which
      happens with probability $J(A, B)$ [^2]. So about $200 \cdot 2/7 \approx 57$ signatures match, and the
      fraction of matches estimates the Jaccard similarity without computing intersections and unions [^1][^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-203, p. 245; Solution SOL-203, p. 298
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: MinHash'
        url: https://en.wikipedia.org/wiki/MinHash
        locator: Jaccard similarity and minimum hash values
    source:
      id: dl-interviews
      ref: ch8#prb203
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-038
    type: single
    difficulty: easy
    tags:
      - locality-sensitive-hashing
      - nearest-neighbors
    question: |
      A hash table wants to avoid collisions. What does a *locality-sensitive* hash family want instead,
      so that it can find similar items without comparing all pairs?
    options:
      - text: Similar items collide with high probability, dissimilar ones with low probability
        correct: true
      - text: No two items ever collide, so that every bucket holds a single item
        why: That is the goal of an ordinary hash table; LSH wants collisions, but only between similar items [^2].
      - text: Dissimilar items collide often, so that each bucket mixes many kinds of items
        why: Buckets full of unrelated items would not narrow the search; similar items should share buckets [^2].
      - text: All items collide, so that one bucket holds the whole data set
        why: That is the brute-force comparison of all pairs that LSH is designed to avoid [^1].
    explanation: |
      Locality-sensitive hashing hashes items into buckets so that similar items are much more likely to
      land in the same bucket than dissimilar ones; candidates for a query are then only the items in its
      buckets [^1][^2]. The book phrases the goal as *maximizing* the probability of a collision for similar
      items [^1]. MinHash is an LSH family for the Jaccard similarity, and random hyperplanes give one for the
      cosine similarity [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problems PRB-204 and PRB-205, p. 246; Solutions SOL-204 and SOL-205, p. 299
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Locality-sensitive hashing'
        url: https://en.wikipedia.org/wiki/Locality-sensitive_hashing
        locator: Introduction and Methods (MinHash, random projection)
    source:
      id: dl-interviews
      ref: ch8#prb205
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-039
    type: short_answer
    difficulty: medium
    tags:
      - k-nearest-neighbors
      - distance-weighting
      - scikit-learn
    question: |
      ```python
      from sklearn.neighbors import KNeighborsClassifier

      X = [[0.0], [1.0], [4.0]]
      y = [0, 0, 1]
      for w in ["uniform", "distance"]:
          knn = KNeighborsClassifier(n_neighbors=3, weights=w).fit(X, y)
          print(w, knn.predict([[3.5]])[0])
      ```

      The loop prints the class predicted for $x = 3.5$: with `"uniform"` it prints {{1}}, and with
      `"distance"` it prints {{2}}.
    answer:
      blanks:
        - numeric: 0
          tolerance: 0
          hint: a class label, 0 or 1
        - numeric: 1
          tolerance: 0
          hint: a class label, 0 or 1
      model: uniform → 0 (two votes against one); distance → 1 (weight 2 against 0.29 + 0.4)
    explanation: |
      With $k = 3$ all three training points are neighbours of $x = 3.5$. Uniform weights give a
      plain majority vote: two points of class 0 against one of class 1, so class 0. With
      `weights="distance"` each neighbour's vote is proportional to the inverse of its distance [^2]:
      class 1 gets $1/0.5 = 2$, while class 0 gets $1/3.5 + 1/2.5 \approx 0.29 + 0.40 = 0.69$, so
      class 1 wins (`predict_proba` gives about 0.74 for class 1). Trying both `weights` values (and
      several `n_neighbors`) in a grid search is how the handson-ml3 solution pushes a k-NN MNIST
      classifier above 97% accuracy [^1].
    references:
      - source: handson-ml3
        locator: 03_classification.ipynb, Exercise solutions, 1. An MNIST Classifier With Over 97% Accuracy
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/03_classification.ipynb
      - title: 'scikit-learn user guide: Nearest Neighbors'
        locator: Sec. 1.6.2 Nearest Neighbors Classification
        url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification
    source:
      id: handson-ml3
      ref: 03_classification#ex1
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/03_classification.ipynb
    status: reviewed
    reviewed_by: claude
