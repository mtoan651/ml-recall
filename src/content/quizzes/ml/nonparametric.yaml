  - id: nonparametric-025
    type: multiple
    difficulty: easy
    tags:
      - knn
      - lazy-learning
      - feature-scaling
    question: |
      You consider a $k$-nearest-neighbour classifier for a table of one million training examples whose
      features include age in years, income in dollars and a few columns unrelated to the label. Which
      statements are true? Select all that apply.
    options:
      - text: Irrelevant features hurt it, because they still count in every distance
        correct: true
      - text: Its trained model is a compact set of weights whose size does not depend on the data
        why: The "model" is the whole training set, so memory grows with the number of examples [^1][^2].
      - text: Training just stores the data, so prediction gets slower as the training set grows
        correct: true
      - text: Without feature scaling, features with large numeric ranges dominate the distances
        correct: true
      - text: It assumes that the classes can be separated by a linear boundary
        why: $k$-NN makes no linearity assumption; its decision boundary can take any shape [^1].
    explanation: |
      $k$-NN is a lazy, instance-based method: it stores the training set and, for each query, searches
      for the nearest examples, so memory and prediction time grow with the data [^1][^2]. It needs no
      linearity assumption and can model complex boundaries, but distances are sensitive to the scale of
      the features and to irrelevant features, and it suffers from the curse of dimensionality [^1].
    references:
      - source: galaxy-training
        locator: Classification in Machine Learning — K-Nearest Neighbor (KNN), advantages and disadvantages
        url: https://training.galaxyproject.org/training-material/topics/statistics/tutorials/classification_machinelearning/tutorial.html
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification
        locator: Sec. 1.6.2 Nearest Neighbors Classification
    source:
