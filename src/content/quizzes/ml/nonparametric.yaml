  - id: nonparametric-020
    type: single
    difficulty: easy
    tags:
      - knn
      - decision-boundary
      - hyperparameters
    question: |
      The figure shows the decision regions of three $k$-NN classifiers trained on the same data
      with different values of $k$. Which panel comes from the classifier with the largest $k$?
    figure:
      src: ./nonparametric/nonparametric-020.svg
      alt: Three panels A, B and C with the same blue circles and orange triangles on two features. Panel A has a fairly smooth wavy boundary with a few small islands, panel B has one very smooth gently curved boundary, and panel C has a jagged boundary with many small islands around single points.
    options:
      - text: Panel A
        why: Panel A still has small islands around a few points, so its $k$ is moderate; a larger $k$ smooths these away [^1].
      - text: Panel B
        correct: true
      - text: Panel C
        why: Islands around single training points are the signature of $k = 1$, the smallest $k$, where each point decides its own neighbourhood [^1].
    explanation: |
      With $k = 1$ every training point labels its own small neighbourhood, so the decision
      boundary wraps around individual (even mislabeled) points and is very jagged. As $k$ grows,
      each prediction is a vote over more neighbours, so single points lose their influence and the
      boundary becomes smoother and simpler [^1]. $k$ thus controls the fundamental trade-off: small
      $k$ overfits, large $k$ underfits [^2]. The smoothest boundary, in panel B, belongs to the
      largest $k$.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Choosing n_neighbors'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
