  - id: nonparametric-022
    type: short_answer
    difficulty: easy
    tags:
      - knn
      - predict-proba
      - certainty
    question: |
      A 5-nearest-neighbour classifier labels the SMS "Good. No cellphones allowed :)". Its five
      nearest training messages have the labels ham, spam, ham, ham, ham. With uniform weights, what
      probability does the classifier give to its predicted class?
    answer:
      numeric: 0.8
      tolerance: 0.001
      hint: a probability, e.g. 0.6
      model: 'Majority vote: ham, with $4/5 = 0.8$'
    explanation: |
      $k$-NN predicts by a vote among the $k$ nearest training examples, and the course asks how it
      could also express how certain it is [^1]. The natural score is the fraction of neighbours
      that agree with the prediction; with uniform weights this is what scikit-learn's
      `predict_proba` returns [^2]. Four of the five neighbours are ham, so the prediction is ham
      with probability 0.8. Distance weighting would change this score.
    references:
      - source: ubc-dsci571
        locator: 'Lecture 7 notes, Exercise 7.1.2 KNNs: Quantifying the level of certainty of predictions'
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
