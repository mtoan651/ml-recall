  - id: nonparametric-021
    type: multiple
    difficulty: medium
    tags:
      - knn
      - euclidean-distance
      - hyperparameters
    question: Which statements about $k$-nearest neighbours ($k$-NN) are true? Select all that apply.
    options:
      - text: Analogy-based models find the examples in the test set that are most similar to the query
        why: The neighbours come from the *training* set; the query is the example being predicted [^1].
      - text: The Euclidean distance between two feature vectors is never negative
        correct: true
      - text: With $k$-NN, larger values of $k$ typically reduce the training error
        why: A larger $k$ averages over more neighbours, which gives a simpler model and usually a *higher* training error; $k = 1$ fits the training set best [^3].
      - text: Like decision trees, $k$-NN selects a small set of useful features
        why: $k$-NN uses all features in its distances, each with equal weight; it does not select features [^4].
      - text: With $k > 1$, the nearest neighbour always contributes the most to the prediction
        why: By default the $k$ neighbours vote with equal weight; only distance weighting gives closer neighbours more say [^5].
    explanation: |
      $k$-NN is analogy-based: to predict a query it finds the most similar *training* examples
      and lets them vote [^1]. Similarity is usually the Euclidean distance, a square root of a sum
      of squares, so it is never negative [^2]. $k$ controls the fundamental trade-off: small $k$
      gives complex, overfit-prone models with low training error, larger $k$ simpler ones [^3].
      Unlike decision trees, $k$-NN treats all features as equally important [^4], and every one of
      the $k$ neighbours has one vote unless you ask for distance weighting [^5].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Analogy-based models'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Distance between feature vectors (Euclidean distance)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Choosing n_neighbors'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
