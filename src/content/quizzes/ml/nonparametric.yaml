  - id: nonparametric-035
    type: multiple
    difficulty: medium
    tags:
      - positive-definite-kernel
      - kernel-construction
    question: |
      $k_1$ and $k_2$ are positive semidefinite (PSD) kernels on a set $\mathcal{X}$ and
      $g:\mathcal{X}\to\mathbb{R}$ is any function. Which of the following kernels are guaranteed
      to be PSD? Select all that apply.
    options:
      - text: $k(u, v) = g(u)\,g(v)$
        correct: true
      - text: $k(u, v) = \exp\big(k_1(u, v)\big)$
        correct: true
      - text: $k(u, v) = k_1(u, v) - k_2(u, v)$
        why: 'Take $k_2 = 2k_1$: the difference is $-k_1$, whose Gram matrices are negative semidefinite.'
      - text: $k(u, v) = k_1(u, v)^2 - k_1(u, v)$
        why: 'A polynomial with a negative coefficient can break PSD-ness: for the constant kernel $k_1 = 1/2$ it gives the constant $-1/4$.'
      - text: $k(u, v) = k_1(u, v)\,k_2(u, v)$
        correct: true
    explanation: |
      The Gram matrix of $k_1 k_2$ is the entrywise (Hadamard) product of two PSD matrices, which is
      PSD (it is a principal submatrix of their Kronecker product) [^1]. PSD kernels are closed under
      sums with nonnegative weights, products and limits, so any polynomial with nonnegative
      coefficients in $k_1$, and hence $\exp(k_1)$ as a limit of its Taylor polynomials, is PSD [^1]
      [^2]. $g(u)g(v)$ has Gram matrix $\mathbf{g}\mathbf{g}^\top$, which is PSD [^1]. Combining
      these shows that the Gaussian kernel $\exp(-\lVert u - v \rVert^2)$ is PSD [^1].
    references:
      - source: mit-ocw-18657
        locator: Problem set 3 solutions, Problem 1 (1)–(5)
        url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-3-solution/
      - title: 'Wikipedia: Positive-definite kernel'
        locator: Some general properties (conical sums, products and limits of p.d. kernels are p.d.)
        url: https://en.wikipedia.org/wiki/Positive-definite_kernel#Some_general_properties
    source:
      id: mit-ocw-18657
      ref: assignment-3#q1
      url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-3-solution/
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-036
    type: single
    difficulty: medium
    tags:
      - gaussian-process
      - missing-values
      - marginalization
    question: |
      Each gene's expression curve is modelled as a sample from a Gaussian process: the measurements
      $\mathbf{y}$ at time points $t_1, \dots, t_r$ have distribution $\mathcal{N}(\mathbf{0}, K)$, where
      $K_{kl} = k(t_k, t_l) + \sigma_n^2\delta_{kl}$. For some genes, a few of the $r$ measurements are
      missing. How should the likelihood of such a gene be computed?
    options:
      - text: Fill the missing entries with 0, the prior mean, and use the full $r \times r$ matrix $K$
        why: Imputed zeros are treated as if they had been measured, which distorts the likelihood and the posterior over the curve.
      - text: Drop every gene that has a missing value from the analysis
        why: That throws away the gene's observed values, which the model can use directly.
      - text: Use only the observed entries of $\mathbf{y}$ and the matching rows and columns of $K$
        correct: true
      - text: Set the rows and columns of $K$ for the missing times to zero and keep its size
        why: Then $K$ is no longer a valid (positive definite) covariance matrix, and the zeros still enter the density.
    explanation: |
      Any finite set of function values of a Gaussian process is jointly Gaussian, and the
      marginal of a multivariate normal over a subset of its coordinates is the normal with the
      corresponding sub-vector of the mean and sub-matrix of the covariance [^2]. So a gene observed
      at 8 of 10 time points is scored with the 8-dimensional Gaussian built from the Gram matrix of
      those 8 times [^1]. Missing values need no imputation in this model.
    references:
      - source: mit-ocw-6867
        locator: Problem set 5 solutions, Problem 2 (e)
        url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw5_soln/
      - title: 'Wikipedia: Multivariate normal distribution'
        locator: Properties — Marginal distributions
        url: https://en.wikipedia.org/wiki/Multivariate_normal_distribution#Marginal_distributions
    source:
      id: mit-ocw-6867
      ref: hw5_soln#q2e
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/hw5_soln/
    status: reviewed
