    reviewed_by: claude
  - id: nonparametric-013
    type: single
    difficulty: medium
    tags:
      - gaussian-processes
      - computational-complexity
      - prediction
    question: |
      After training a GP regression model on $n$ points you store the Cholesky factor $L$ of
      $K + \sigma^2 I$ and the vector $\boldsymbol{\alpha} = (K + \sigma^2 I)^{-1}\mathbf{y}$. What
      does each new test point cost?
    options:
      - text: $\mathcal{O}(n)$ for the predictive mean and $\mathcal{O}(n^2)$ for the predictive variance
        correct: true
      - text: $\mathcal{O}(n^3)$ for both, since every prediction factorizes the kernel matrix all over again
        why: The factorization is done once in training; predictions reuse $L$ and $\boldsymbol{\alpha}$ [^2].
      - text: $\mathcal{O}(n^2)$ for the predictive mean and $\mathcal{O}(n)$ for the predictive variance
        why: The mean is one dot product $\mathbf{k}_*^\top \boldsymbol{\alpha}$; the variance needs a triangular solve with $L$, which is the more expensive part [^2].
      - text: $\mathcal{O}(1)$ for both, since a GP keeps no weights to evaluate
        why: Being nonparametric is exactly why prediction touches all $n$ training points, like a nearest-neighbour method [^1].
    explanation: |
      The predictive mean is a linear combination of the training targets weighted by the kernel
      [^1]: with $\boldsymbol{\alpha}$ stored it is $\mathbf{k}_*^\top \boldsymbol{\alpha}$, $n$ kernel
      evaluations and one dot product, $\mathcal{O}(n)$. The predictive variance
      $k(x_*, x_*) - \mathbf{v}^\top \mathbf{v}$ needs $\mathbf{v} = L^{-1}\mathbf{k}_*$, a triangular
      solve costing about $n^2/2$ operations per test point [^2]. So for $m$ test points the means cost
      $\mathcal{O}(mn)$ and the variances $\mathcal{O}(mn^2)$, on top of the one-off
      $\mathcal{O}(n^3)$ training cost.
    references:
      - source: d2l
        locator: Sec. 18.3.3 Interpreting Equations for Learning and Predictions (the predictive mean as a weighted combination of targets)
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#interpreting-equations-for-learning-and-predictions
      - title: Rasmussen & Williams, Gaussian Processes for Machine Learning (MIT Press, 2006)
        locator: Sec. 2.2, Algorithm 2.1 and its complexity note, p. 19
        url: http://gaussianprocess.org/gpml/chapters/RW2.pdf
      - source: d2l
        locator: Sec. 18.3.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    source:
      id: d2l
      ref: chapter_gaussian-processes/gp-inference#ex4-b
      url: https://d2l.ai/chapter_gaussian-processes/gp-inference.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-014
    type: single
    difficulty: medium
    tags:
      - nadaraya-watson
      - parzen-windows
      - kernel-density-estimation
    question: |
      Binary labels $y_i \in \{-1, +1\}$. Parzen windows estimate
      $\hat{p}(\mathbf{x}, y) = \frac{1}{n}\sum_{i:\,y_i = y} k(\mathbf{x}, \mathbf{x}_i)$, and
      Nadaraya–Watson gives $f(\mathbf{x}) = \sum_i y_i\, k(\mathbf{x}, \mathbf{x}_i) / \sum_j k(\mathbf{x}, \mathbf{x}_j)$;
      the Parzen density estimate is $\hat{p}(\mathbf{x}) = \frac{1}{n}\sum_j k(\mathbf{x}, \mathbf{x}_j)$.
      How are $\hat{p}(\mathbf{x}, +1) - \hat{p}(\mathbf{x}, -1)$ and $f(\mathbf{x})$ related?
    options:
      - text: The difference is $f(\mathbf{x})$ times $\hat{p}(\mathbf{x}) > 0$, so the predicted class is always the same
        correct: true
      - text: They are equal for every $\mathbf{x}$, because both are normalized by the number of training points $n$
        why: Only the Parzen estimate divides by $n$; Nadaraya–Watson divides by the total kernel weight $\sum_j k(\mathbf{x}, \mathbf{x}_j)$.
      - text: They predict the same class only when both classes have the same number of training points
        why: The identity holds for any class sizes; class frequencies are already inside the sum.
      - text: They predict the same class only for the Gaussian kernel, whose weights integrate to 1
        why: The argument works for any nonnegative kernel.
    explanation: |
      Because $y_i = \pm 1$, the difference is $\frac{1}{n}\sum_i y_i\, k(\mathbf{x}, \mathbf{x}_i)$.
      Dividing it by the density estimate $\hat{p}(\mathbf{x}) = \frac{1}{n}\sum_j k(\mathbf{x}, \mathbf{x}_j)$
      gives exactly the Nadaraya–Watson estimate with values $v_i = y_i$ [^1][^2]. The factor is
      positive wherever any kernel weight is, so the two classifiers always choose the same label;
      they differ only by the local data density.
    references:
      - source: d2l
        locator: Sec. 11.2 Attention Pooling by Similarity (introduction)
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html
      - title: 'Wikipedia: Kernel density estimation'
        url: https://en.wikipedia.org/wiki/Kernel_density_estimation#Definition
        locator: Definition
      - source: d2l
        locator: Sec. 11.2.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-pooling#ex1
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-015
    type: single
    difficulty: medium
    tags:
      - nadaraya-watson
      - kernel-width
      - overfitting
      - leave-one-out
    question: |
      You tune the width σ of a Gaussian kernel in Nadaraya–Watson regression by minimizing the
      training error $\sum_i (f(\mathbf{x}_i) - y_i)^2$, where each $f(\mathbf{x}_i)$ is computed with
      the pair $(\mathbf{x}_i, y_i)$ itself still in the data. Where does σ go?
    options:
      - text: "To 0: each point's own weight dominates, so $f(\\mathbf{x}_i) \\to y_i$ and the noise is fit"
        correct: true
      - text: 'To ∞: the estimate then becomes the global mean of all labels, which minimizes the squared error'
        why: The global mean leaves a large training error, while σ → 0 drives it to zero.
      - text: To the noise level of the labels, which balances bias against variance
        why: Finding that balance requires held-out data; the training error keeps falling as σ shrinks.
      - text: Nowhere in particular, since the training error does not depend on σ
        why: Narrower kernels follow the training labels more closely, so the error depends strongly on σ [^1].
    explanation: |
      The narrower the kernel, the less smooth the estimate and the more it follows local variation
      [^1]. As σ → 0 the term $k(\mathbf{x}_i, \mathbf{x}_i) = 1$ swamps all others, so
      $f(\mathbf{x}_i) = y_i$ and the training error is zero: a useless, overfitted model. The fix,
      which d2l's exercise asks for next, is to leave $(\mathbf{x}_i, y_i)$ out when predicting at
      $\mathbf{x}_i$, i.e. leave-one-out cross-validation [^2][^3].
    references:
      - source: d2l
        locator: Sec. 11.2.3 Adapting Attention Pooling
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#adapting-attention-pooling
      - title: 'Wikipedia: Cross-validation (statistics)'
        url: https://en.wikipedia.org/wiki/Cross-validation_(statistics)#Leave-one-out_cross-validation
        locator: Leave-one-out cross-validation
      - source: d2l
        locator: Sec. 11.2.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-pooling#ex2
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: nonparametric-016
    type: single
    difficulty: hard
    tags:
      - nadaraya-watson
      - bandwidth
      - consistency
      - curse-of-dimensionality
    question: |
      Nadaraya–Watson regression in $d$ dimensions is consistent if its kernel width σ shrinks
      suitably as the number of points $n$ grows. Which schedule is right?
    options:
      - text: σ → 0 with $n\sigma^d \to \infty$; the best rate, σ ∝ $n^{-1/(d+4)}$, shrinks more slowly in high $d$
        correct: true
      - text: σ → 0 with $n\sigma^d \to \infty$; the best rate, σ ∝ $n^{-1/(d+4)}$, shrinks faster in high $d$
        why: The exponent $-1/(d+4)$ gets closer to 0 as $d$ grows, so σ shrinks more slowly, not faster.
      - text: σ stays fixed, since averaging over more points in the same window removes the error
        why: A fixed window keeps averaging over a fixed neighborhood, so the bias never goes away.
      - text: σ ∝ $1/n$ in every dimension, so that the window narrows as fast as the data arrive
        why: Then $n\sigma^d$ does not grow, so windows keep holding only a handful of points and the variance does not vanish.
    explanation: |
      d2l notes that the estimator is consistent if the kernel is suitably narrowed as data grow
      [^1]. The bias shrinks only if σ → 0, while the variance shrinks only if each window, whose
      volume scales like $\sigma^d$, still holds many points: $n\sigma^d \to \infty$. Balancing the two
      gives σ ∝ $n^{-1/(d+4)}$ and a mean squared error of order $n^{-4/(d+4)}$, the same rates as
      for multivariate kernel density estimation [^2]. In high dimension the window must stay wide
      and convergence is slow, an instance of the curse of dimensionality.
    references:
      - source: d2l
        locator: Sec. 11.2 Attention Pooling by Similarity (introduction)
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html
      - title: 'Wikipedia: Multivariate kernel density estimation'
        url: https://en.wikipedia.org/wiki/Multivariate_kernel_density_estimation#Optimal_bandwidth_matrix_selection
        locator: Optimal bandwidth matrix selection
      - source: d2l
        locator: Sec. 11.2.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    source:
      id: d2l
      ref: chapter_attention-mechanisms-and-transformers/attention-pooling#ex4
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-pooling.html#exercises
    status: reviewed
