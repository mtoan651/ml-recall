  - id: nonparametric-019
    type: single
    difficulty: medium
    tags:
      - knn
      - prediction-cost
      - complexity
    question: |
      A $k$-NN classifier finds neighbours by brute force: it computes the distance from the query
      to every training example. Each change below makes its predictions slower. Which one has the
      smallest effect on prediction time?
    options:
      - text: Using more features
        why: Every one of the $n$ distances gets more expensive, so the cost grows with the number of features [^1].
      - text: Using more training examples
        why: Brute force computes one distance per training example, so the cost grows linearly with $n$ [^1].
      - text: Using a larger value of $k$
        correct: true
      - text: Using a costlier distance, such as Mahalanobis instead of Euclidean
        why: The distance is computed $n$ times per query, so a metric that costs $O(d^2)$ instead of $O(d)$ slows every one of them [^2].
    explanation: |
      For each query, brute-force $k$-NN computes $n$ distances in $d$ dimensions, which costs about
      $O(dn)$, and then picks the $k$ smallest. More examples, more features or a costlier distance
      all scale the dominant distance computation [^1][^2]. Choosing the $k$ smallest of $n$ numbers
      is cheap in comparison, and scikit-learn notes that brute-force query time is "largely
      unaffected by the value of $k$" [^1]. The course's own warning is the same: $k$-NN gets slow
      at prediction time when the training set is large [^2].
    references:
      - title: 'scikit-learn User Guide: Nearest Neighbors'
        locator: Sec. 1.6.4 Nearest Neighbor Algorithms — Choice of Nearest Neighbors Algorithm
        url: https://scikit-learn.org/stable/modules/neighbors.html#choice-of-nearest-neighbors-algorithm
        quote: Brute force query time is largely unaffected by the value of k
      - source: ubc-cpsc330
        locator: 'Lecture 4: k-Nearest Neighbours and SVM RBFs — Cons of k-NNs for supervised learning'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/04_kNNs-SVM-RBF.ipynb
