  - id: nonparametric-026
    type: single
    difficulty: easy
    tags:
      - knn
      - classification
    question: |
      Training data: negatives $(-1, 0)$, $(2, 1)$, $(2, -2)$; positives $(0, 0)$, $(1, 0)$. With
      Euclidean distance, how do 1-NN and 3-NN classify the new point $(1, -1.01)$?
    options:
      - text: 1-NN negative, 3-NN positive
        why: The single nearest point is $(1, 0)$ at distance 1.01, which is positive.
      - text: 1-NN negative, 3-NN negative
        why: Both the nearest neighbor and the majority of the three nearest are positive.
      - text: 1-NN positive, 3-NN positive
        correct: true
      - text: 1-NN positive, 3-NN negative
        why: The three nearest are $(1, 0)$+, $(2, -2)$− and $(0, 0)$+, so the vote is 2 to 1 for positive.
    explanation: |
      The distances are 1.01 to $(1, 0)$, about 1.41 to $(2, -2)$ and about 1.42 to $(0, 0)$, with the
      other two points farther away [^1]. 1-NN copies the label of $(1, 0)$; 3-NN takes a majority
      vote of $\{+, -, +\}$. Both say positive, although the second neighbor alone is negative [^2].
    references:
      - title: 'Wikipedia: k-nearest neighbors algorithm'
        url: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm#Algorithm
