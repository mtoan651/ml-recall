  - id: trees-ensembles-023
    type: single
    difficulty: easy
    tags:
      - random-forest
      - bootstrap
      - feature-subsampling
    question: Which option correctly describes the sources of randomness in a random forest?
    options:
      - text: Bootstrap samples of the training data, with all features considered at every split
        why: A random forest also restricts each split to a random subset of features, so the trees differ more [^1].
      - text: Bootstrap samples of the training data and a random subset of features at each split
        correct: true
      - text: Random feature subsets at each split, with every tree trained on the full training set
        why: Each tree is also grown on its own bootstrap sample drawn with replacement [^1].
      - text: Random initial values for the leaf predictions, refined during training
        why: Leaf predictions are not initialized randomly; they are the majority class (or mean target) of the training examples in the leaf [^2].
    explanation: |
      To make the trees diverse, a random forest injects randomness in two ways: each tree is built
      on a bootstrap sample, drawn with replacement from the training set, and at each node only a
      random subset of features is considered for the best split (`max_features`) [^1]. The trees
      are then combined by voting or averaging, which reduces the overfitting of single deep
      trees [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 11: Ensembles — Inject randomness in the classifier construction'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/11_ensembles.ipynb
