  - id: trees-ensembles-028
    type: single
    difficulty: medium
    tags:
      - random-forest
      - gradient-boosting
      - learning-rate
    question: Which statement comparing random forests with gradient-boosted trees is **false**?
    options:
      - text: Both are ensembles of decision trees
        why: This is true; both combine many trees, by averaging (random forests) or by adding them sequentially (boosting) [^1].
      - text: Gradient boosting typically uses shallower trees than a random forest
        why: This is true; boosting adds many weak, shallow trees that reduce bias step by step, while forests average deep, low-bias trees to cut variance [^1].
      - text: Both use a learning rate to scale each tree's contribution
        correct: true
      - text: In a random forest, each tree is trained independently of the others
        why: This is true; each tree is grown on its own bootstrap sample with random feature subsets, so trees can even be trained in parallel [^1].
    explanation: |
      Gradient boosting fits each new tree to the gradient of the loss and adds it with a shrinkage
      factor, the learning rate, that controls the step size [^1][^2]. A random forest averages
      independently grown trees and has no learning rate at all. The other statements are true and
      reflect the bias–variance roles of the two methods [^1].
    references:
      - title: 'scikit-learn User Guide: Ensembles'
        url: https://scikit-learn.org/stable/modules/ensemble.html
        locator: Random forests; Gradient-boosted trees (shrinkage via learning rate)
      - title: 'Wikipedia: Gradient boosting'
        url: https://en.wikipedia.org/wiki/Gradient_boosting
        locator: Shrinkage
