  - id: trees-ensembles-028
    type: single
    difficulty: medium
    tags:
      - random-forest
      - gradient-boosting
      - learning-rate
    question: Which statement comparing random forests with gradient-boosted trees is **false**?
    options:
      - text: Both are ensembles of decision trees
        why: This is true; both combine many trees, by averaging (random forests) or by adding them sequentially (boosting) [^1].
      - text: Gradient boosting typically uses shallower trees than a random forest
        why: This is true; boosting adds many weak, shallow trees that reduce bias step by step, while forests average deep, low-bias trees to cut variance [^1].
      - text: Both use a learning rate to scale each tree's contribution
        correct: true
      - text: In a random forest, each tree is trained independently of the others
        why: This is true; each tree is grown on its own bootstrap sample with random feature subsets, so trees can even be trained in parallel [^1].
    explanation: |
      Gradient boosting fits each new tree to the gradient of the loss and adds it with a shrinkage
      factor, the learning rate, that controls the step size [^1][^2]. A random forest averages
      independently grown trees and has no learning rate at all. The other statements are true and
      reflect the bias–variance roles of the two methods [^1].
    references:
      - title: 'scikit-learn User Guide: Ensembles'
        url: https://scikit-learn.org/stable/modules/ensemble.html
        locator: Random forests; Gradient-boosted trees (shrinkage via learning rate)
      - title: 'Wikipedia: Gradient boosting'
        url: https://en.wikipedia.org/wiki/Gradient_boosting
        locator: Shrinkage
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/ml.yml#q3
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-029
    type: short_answer
    difficulty: easy
    tags:
      - decision-tree
      - predict-proba
      - certainty
    question: |
      A depth-2 decision tree for SMS spam uses binary word features (1 = the word occurs). The
      training counts in each leaf are given as [ham, spam]:

      - `call` = 0 and `txt` = 0 → [3649, 229]
      - `call` = 0 and `txt` = 1 → [10, 120]
      - `call` = 1 and `me` = 0 → [108, 262]
      - `call` = 1 and `me` = 1 → [76, 3]

      The message "Call me" reaches the leaf for `call` = 1, `me` = 1, so the tree predicts "ham". If
      the tree reports its certainty as the fraction of training examples in the leaf that share the
      predicted class, how certain is it?
    answer:
      numeric: 0.962
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: $76 / (76 + 3) = 76/79 \approx 0.962$
    explanation: |
      UBC DSCI 571 asks how a decision tree could quantify the certainty of its prediction at a leaf
      [^1]. A natural answer, and what scikit-learn's `predict_proba` does, is the class fractions
      of the training examples in that leaf [^2]: 76 ham and 3 spam give $P(\text{ham}) = 76/79 \approx 0.962$.
      A leaf such as [108, 262] would predict spam with a much lower certainty of
      about 0.71.
    references:
      - source: ubc-dsci571
        locator: 'Lecture 7 notes, Exercise 7.1.1 Decision trees: Quantifying the level of certainty of predictions'
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
      - title: 'scikit-learn documentation: DecisionTreeClassifier.predict_proba'
        url: https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html#sklearn.tree.DecisionTreeClassifier.predict_proba
        locator: predict_proba ("the fraction of samples of the same class in a leaf")
    source:
      id: ubc-dsci571
      ref: lectures/notes/07_naive-Bayes.ipynb#ex7.1.1
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
