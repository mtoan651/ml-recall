  - id: trees-ensembles-016
    type: single
    difficulty: hard
    question: What are the effects of replacing the numerical features with their negative values (for example, changing the value +8 to -8) with the exact numerical splitter?
    options:
      - text: The same conditions will be learned; only the positive/negative children will be switched.
        correct: true
      - text: Different conditions will be learned, but the overall structure of the decision tree will remain the same.
        why: 'Only the sign of each threshold flips: the same partitions are available with the same gains, so the same splits are chosen [^1].'
      - text: The structure of the decision tree will be completely different.
        why: Each child receives the same examples as before, so the tree keeps its shape [^1][^2].
    explanation: |
      The exact splitter looks only at the order of a feature's values: it sorts them and tries a
      threshold halfway between each pair of neighbouring distinct values [^1][^3]. Negating the
      feature reverses that order, so the candidate thresholds are the old ones with their signs
      flipped, and they cut the examples into exactly the same groups with the same information
      gain [^1]. The splitter therefore picks the same partition at every node. Conditions have the
      form $\text{feature} \ge t$, so a split the old tree learned as $x \ge t$ is now learned as
      $-x \ge -t$. No example sits exactly on a midpoint threshold, so $-x \ge -t$ holds exactly
      for the examples that failed $x \ge t$: the former positive child becomes the negative child
      and vice versa. Each child still gets the same examples, so the recursion rebuilds the same
      tree with its branches mirrored [^2]. The other two options assume the split depends on the
      feature values themselves, but only their order matters [^1].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/binary-classification
        locator: 'Decision Forests: Exact splitter for binary classification with numerical features (candidate thresholds and the closing remark on scale)'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/growing
