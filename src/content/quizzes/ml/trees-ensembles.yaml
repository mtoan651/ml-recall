  - id: trees-ensembles-022
    type: single
    difficulty: easy
    tags:
      - decision-trees
      - max-depth
      - model-complexity
      - interpretability
    question: |
      Increasing the maximum depth of a decision tree does all of the following except one. Which
      one does it NOT do?
    options:
      - text: Improve its accuracy on the training examples
        why: A deeper tree can split the training data further; with no depth limit it grows until the leaves are pure [^1].
      - text: Increase the risk of overfitting
        why: Deep trees learn very specific rules for a few examples, which is the overfitting regime [^2].
      - text: Make the model easier to interpret
        correct: true
      - text: Increase the complexity of the model
        why: '`max_depth` directly controls the complexity of a tree: a deeper tree asks more questions [^1].'
    explanation: |
      `max_depth` controls the complexity of a decision tree: a deeper tree asks more questions,
      so it fits the training data better and, with no limit, keeps splitting until every leaf is
      pure, creating rules based on single examples [^1]. That lowers training error but raises the
      risk of overfitting [^2]. A shallow tree is a short list of if/else rules a person can read;
      a deep tree has many more paths from root to leaf, so it becomes harder, not easier, to
      interpret.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — Parameters and hyperparameters (max_depth)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 3: Machine Learning Fundamentals — Overfitting'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/03_ml-fundamentals.ipynb
    source:
