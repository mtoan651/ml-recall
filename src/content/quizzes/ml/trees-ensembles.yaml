  - id: trees-ensembles-002
    type: single
    difficulty: easy
    question: Which one of the following is the main reason for pruning a Decision Tree?
    options:
      - text: To save computing time during testing
        why: A smaller tree is faster to evaluate, but that is a side benefit; trees are pruned so that they generalise better [^2].
      - text: To save space for storing the Decision Tree
        why: Storage savings are a side effect; the reason to prune is overfitting [^1][^2].
      - text: To make the training set error smaller
        why: Pruning removes branches that fit the training data, so it usually makes the training error larger [^2].
      - text: To avoid overfitting the training set
        correct: true
    explanation: |
      A fully grown tree can classify every training example correctly and still generalise
      poorly, because its deepest branches fit noise. Pruning, along with limits on depth and leaf
      size, is the standard remedy for this overfitting [^1][^2]. Pruning usually makes the
      training error *larger*. A branch is typically removed when doing so improves accuracy on
      validation data [^2]. A smaller tree is also cheaper to store and evaluate, but those are
      side benefits, not the reason to prune.
    references:
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#minimal-cost-complexity-pruning
        locator: Sec. 1.10 (disadvantages); Sec. 1.10.9 Minimal Cost-Complexity Pruning
      - title: 'Google Developers: Decision Forests course'
        url: https://developers.google.com/machine-learning/decision-forests/overfitting-and-pruning#overfitting_and_pruning
        locator: Overfitting and pruning
    source:
      id: mmlu-redux
      ref: machine_learning/5
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=5
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The ID3 algorithm is guaranteed to find the optimal decision tree.

      **Statement 2.** Consider a continuous probability distribution with density $f$ that is nonzero everywhere. The probability of a value $x$ is equal to $f(x)$.
    options:
      - text: True, True
        why: Neither holds. ID3 is a greedy heuristic with no optimality guarantee [^1], and for a continuous variable $P(X = x) = 0$, not $f(x)$ [^2].
      - text: False, False
        correct: true
      - text: True, False
        why: Statement 1 is false. Learning an optimal tree is NP-complete, so ID3 picks splits greedily and can miss the best tree [^1].
      - text: False, True
        why: Statement 2 is false. A density value is not a probability; a single point has probability 0, and $f(x)$ can even exceed 1 [^2].
    explanation: |
      Statement 1 is false. Learning an optimal decision tree is NP-complete, so ID3 grows its tree
      greedily: at each node it picks the attribute with the largest information gain. Greedy,
      locally optimal choices cannot guarantee a globally optimal tree [^1]. Statement 2 is also
      false. For a continuous random variable, $P(X = x) = 0$ for every single value $x$, and
      probabilities come from areas under the density curve, $P(a < X < b)$ [^2]. $f(x)$ is only
      the height of that curve, so $f(x) \ne P(X = x)$. A density can even exceed 1; for example,
      $f(x) = 3x^2$ for $0 < x < 1$ gives $f(0.9) = 2.43$ [^2].
    references:
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#tree-algorithms-id3-c4-5-c5-0-and-cart
        locator: 'Sec. 1.10 (disadvantages); Sec. 1.10.6 Tree algorithms: ID3, C4.5, C5.0 and CART'
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson14#probability-density-functions
        locator: Lesson 14, Sec. 14.1 Probability Density Functions
    source:
      id: mmlu-redux
      ref: machine_learning/39
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=39
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-004
    type: single
    difficulty: hard
    question: |
      Evaluate both statements.

      **Statement 1.** In AdaBoost, the weights of the misclassified examples go up by the same multiplicative factor.

      **Statement 2.** In AdaBoost, the weighted training error $\epsilon_t$ of the $t$-th weak classifier on training data with weights $D_t$ tends to increase as a function of $t$.
    options:
      - text: True, True
        correct: true
      - text: False, False
        why: Both are true. Every misclassified example is multiplied by the same factor $e^{\alpha_t}$, and later learners face reweighted problems on which their error tends toward $\tfrac12$ [^1][^2].
      - text: True, False
        why: Statement 2 is also true. Reweighting makes later problems harder; right after each update the previous learner has weighted error exactly $\tfrac12$ [^1].
      - text: False, True
        why: Statement 1 is also true. The update multiplies the weight of every misclassified example by the same $e^{\alpha_t}$ before normalising [^1][^2].
    explanation: |
      Statement 1 is true. AdaBoost updates $D_{t+1}(i) \propto D_t(i)\exp(-\alpha_t y_i h_t(x_i))$,
      so every misclassified example ($y_i h_t(x_i) = -1$) is multiplied by the same factor
      $e^{\alpha_t}$ before normalisation [^1][^2]. Statement 2 is also true. Each update moves
      weight onto the examples that earlier learners got wrong, so later learners face harder
      weighted problems [^2]. In fact, right after the update the last weak learner has weighted
      error exactly $\tfrac12$. With $\alpha_t = \tfrac12 \ln\frac{1-\epsilon_t}{\epsilon_t}$ [^1],
      the misclassified mass $\epsilon_t e^{\alpha_t}$ and the correctly classified mass
      $(1-\epsilon_t) e^{-\alpha_t}$ both equal $\sqrt{\epsilon_t(1-\epsilon_t)}$. So $\epsilon_t$
      tends to creep up toward $\tfrac12$ over the rounds, though not strictly at every step.
    references:
      - title: Schapire, Explaining AdaBoost (2013)
        url: http://rob.schapire.net/papers/explaining-adaboost.pdf
        locator: Fig. 1 The boosting algorithm AdaBoost, p. 2
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 10.1 Boosting Methods, Algorithm 10.1 AdaBoost.M1, pp. 338-339
    source:
      id: mmlu-redux
      ref: machine_learning/49
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=49
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-005
    type: single
    difficulty: easy
    shuffle: false
    question: You've just finished training a decision tree for spam classification, and it is getting abnormally bad performance on both your training and test sets. You know that your implementation has no bugs, so what could be causing the problem?
    options:
      - text: Your decision trees are too shallow.
        correct: true
      - text: You need to increase the learning rate.
        why: A decision tree is grown by greedy splitting, not by gradient steps, so it has no learning rate [^2].
      - text: You are overfitting.
        why: Overfitting gives good training performance and poor test performance; here the training performance is bad too [^1].
      - text: None of the above.
        why: A tree that is too shallow underfits, which explains poor results on both sets [^1][^2].
    explanation: |
      Poor results on both the training and the test set point to underfitting: the model does not
      even fit the data it was trained on [^1]. For a decision tree, depth controls complexity. The
      deeper the tree, the more complex its decision rules, so a tree that is too shallow cannot
      capture the patterns [^2]. Overfitting would show excellent training accuracy with poor test
      accuracy [^1]. A decision tree is grown by greedy splitting, not by gradient steps, so it has
      no learning rate to raise [^2].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#fitting
        locator: Overfitting, section 'Fitting, overfitting, and underfitting'
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#decision-trees
        locator: Sec. 1.10 (introduction); Sec. 1.10.5 Tips on practical use; Sec. 1.10.7 Mathematical formulation
    source:
      id: mmlu-redux
      ref: machine_learning/59
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=59
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-006
    type: single
    difficulty: medium
    question: How does bagging reduce overfitting?
    options:
      - text: Averaging models trained on bootstrap samples drawn with replacement
        correct: true
      - text: Using weak classifiers (e.g. decision stumps) as the base models
        why: Weak learners are what boosting uses; bagging works best with strong, high-variance models such as fully grown trees [^1].
      - text: Restricting the ensemble to base algorithms that rarely overfit
        why: Bagging helps precisely the base learners that overfit, because averaging cuts their variance [^1].
      - text: Validating every base classifier on held-out data and discarding bad ones
        why: Bagging keeps every member; out-of-bag samples can estimate accuracy, but no member is discarded [^1].
    explanation: |
      Bagging fits many copies of a base estimator, each on a random subset of the training set, and
      aggregates their predictions. Drawing the subsets with replacement (bootstrap samples) is what
      makes it bagging, and this randomisation followed by averaging reduces the variance of the base
      estimator [^1]. Because it cuts variance, bagging works best with strong, complex models such
      as fully grown decision trees; weak models such as shallow trees are what boosting uses [^1].
      So it does not need base learners that rarely overfit: high-variance learners are exactly the
      ones it helps. Out-of-bag samples can estimate the ensemble's accuracy, but no member is
      validated and discarded [^1].
    references:
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/ensemble.html#bagging-meta-estimator
        locator: Sec. 1.11.3 Bagging meta-estimator
        quote: As they provide a way to reduce overfitting, bagging methods work best with strong and complex models (e.g., fully developed decision trees), in contrast with boosting methods which usually work best with weak models (e.g., shallow decision trees).
    source:
      id: mmlu-redux
      ref: machine_learning/71
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=71
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-007
    type: single
    difficulty: easy
    question: 'Averaging the outputs of many decision trees mainly helps to:'
    options:
      - text: Increase bias
        why: Raising bias is never the goal; a random forest at most accepts a slight increase in bias as the price of a large drop in variance [^1].
      - text: Decrease bias
        why: An average of trees has about the same bias as one tree; what averaging removes is the part of the error that varies between trees [^1].
      - text: Increase variance
        why: Averaging trees whose errors partly cancel lowers the variance; it does not raise it [^1].
      - text: Decrease variance
        correct: true
    explanation: |
      Individual decision trees have high variance and tend to overfit. Averaging many trees whose
      errors are partly independent lets some of those errors cancel, which reduces variance [^1].
      Bagging relies on the same idea: it reduces the variance of a base estimator by averaging
      models trained on random subsets of the data [^1]. Averaging does not lower bias. A random
      forest may even accept a slight increase in bias in exchange for the large drop in
      variance [^1].
    references:
      - title: 'scikit-learn User Guide: Ensembles'
        url: https://scikit-learn.org/stable/modules/ensemble.html#random-forests
        locator: Sec. 1.11.2.1 Random Forests; Sec. 1.11.3 Bagging meta-estimator
    source:
      id: mmlu-redux
      ref: machine_learning/77
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=77
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-008
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** Linear regression estimator has the smallest variance among all unbiased estimators.

      **Statement 2.** The coefficients $\alpha$ assigned to the classifiers assembled by AdaBoost are always non-negative.
    options:
      - text: True, True
        why: Statement 1 is false. The Gauss–Markov theorem makes least squares best only among *linear* unbiased estimators [^1].
      - text: False, False
        why: Statement 2 is true. With weighted error $\epsilon_t < \tfrac12$, $\alpha_t = \tfrac12 \ln\frac{1-\epsilon_t}{\epsilon_t} > 0$ [^2].
      - text: True, False
        why: Both verdicts are reversed. Least squares is best only among linear unbiased estimators [^1], and AdaBoost's $\alpha_t$ are positive whenever $\epsilon_t < \tfrac12$ [^2].
      - text: False, True
        correct: true
    explanation: |
      Statement 1 is false. The Gauss–Markov theorem says least squares has the smallest variance
      among *linear* unbiased estimators, not among all unbiased estimators. Biased estimators such
      as ridge regression can even achieve a lower mean squared error [^1]. Statement 2 is true.
      AdaBoost sets $\alpha_t = \tfrac12 \ln\frac{1-\epsilon_t}{\epsilon_t}$. The weak learning
      condition requires every weak learner to have weighted error $\epsilon_t < \tfrac12$, so
      $\frac{1-\epsilon_t}{\epsilon_t} > 1$ and $\alpha_t > 0$ [^2].
    references:
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 3.2.2 The Gauss–Markov Theorem, pp. 51-52
      - title: Schapire, Explaining AdaBoost (2013)
        url: http://rob.schapire.net/papers/explaining-adaboost.pdf
        locator: Fig. 1, p. 2; Sec. 2 Direct Application of VC Theory, p. 3 (weak learning condition)
    source:
      id: mmlu-redux
      ref: machine_learning/78
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=78
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-009
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** We learn a classifier $f$ by boosting weak learners $h$. The functional form of $f$'s decision boundary is the same as $h$'s, but with different parameters (e.g., if $h$ was a linear classifier, then $f$ is also a linear classifier).

      **Statement 2.** Cross validation can be used to select the number of iterations in boosting; this procedure may help reduce overfitting.
    options:
      - text: True, True
        why: Statement 1 is false. A weighted vote of linear classifiers is generally not linear, so boosting enlarges the model class [^1].
      - text: False, False
        why: Statement 2 is true. The number of rounds is a tuning parameter, and choosing it by cross-validation works like early stopping [^2].
      - text: True, False
        why: Both verdicts are reversed. Boosting changes the form of the boundary [^1], and cross-validating the number of rounds does help against overfitting [^2].
      - text: False, True
        correct: true
    explanation: |
      Statement 1 is false. The boosted classifier is
      $H(x) = \operatorname{sign}\big(\sum_t \alpha_t h_t(x)\big)$, a weighted vote of many weak
      learners [^1]. A weighted vote of several linear classifiers is generally not linear. The
      complexity (VC dimension) of the combined classifier grows roughly linearly with the number
      of rounds, so it is a richer model than any single weak learner [^1]. Statement 2 is true.
      Boosting can overfit if it runs too long, so the number of rounds is a tuning parameter.
      Choosing it on held-out data, by validation or cross-validation, works like early
      stopping [^1][^2].
    references:
      - title: Schapire, Explaining AdaBoost (2013)
        url: http://rob.schapire.net/papers/explaining-adaboost.pdf
        locator: Fig. 1, p. 2; Sec. 2 Direct Application of VC Theory, p. 3
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 10.12 Regularization, p. 364
    source:
      id: mmlu-redux
      ref: machine_learning/85
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=85
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-010
    type: single
    difficulty: easy
    question: High entropy means that the partitions in classification are
    options:
      - text: pure
        why: A pure partition, with all samples of one class, has entropy 0, the lowest possible value [^1].
      - text: not pure
        correct: true
      - text: useful
        why: Entropy measures how mixed a node is, not how useful a split is; a split is useful when it lowers entropy [^1].
      - text: useless
        why: Entropy describes the class mix of a node, not the value of a split; high-entropy nodes are the ones worth splitting further [^1].
    explanation: |
      Entropy measures how mixed the classes in a node are: $H = -\sum_k p_k \log p_k$, where $p_k$
      is the share of class $k$ in the node [^1]. It is 0 when every sample belongs to one class (a
      pure node) and largest when the classes are evenly mixed, so high entropy means the partition
      is impure [^1]. That is why decision trees pick the splits that lower this impurity the
      most [^1].
    references:
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#classification-criteria
        locator: Sec. 1.10.7 Mathematical formulation; Sec. 1.10.7.1 Classification criteria
    source:
      id: mmlu-redux
      ref: machine_learning/87
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=87
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-011
    type: single
    difficulty: easy
    question: The inference of a decision tree runs by routing an example...
    options:
      - text: from the leaf to the root.
        why: All inference starts from the root (the first condition).
      - text: from one leaf to another.
        why: All inference starts from the root, not from a leaf.
      - text: from the root to the leaf.
        correct: true
    explanation: |
      A decision tree predicts by starting at the root, testing its condition, following the
      branch that matches the example, and repeating at each node until it reaches a leaf. The
      leaf's value is the prediction, and the visited nodes form the inference path [^1][^2].
      Leaves hold predictions, not conditions, so a leaf has nothing that could send an example
      onward. You cannot start at a leaf and climb to the root, and no branch joins one leaf to
      another [^2].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce#question_1
        locator: 'Decision trees: Check your understanding, Question 1'
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/decision-trees#the_model
        locator: "Decision Forests: Decision trees, 'The model'"
    source:
      id: google-ml-courses
      ref: decision-forests/decision-trees-mce#q1
      url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-012
    type: single
    difficulty: easy
    question: In a decision tree, do all conditions involve only a single feature?
    options:
      - text: Yes.
        why: Oblique conditions test multiple features.
      - text: No.
        correct: true
    explanation: |
      No. An axis-aligned condition involves a single feature, such as `num_legs ≥ 2`, while an
      oblique condition involves several, such as `num_legs ≥ num_fingers` [^1][^2]. Trees are often
      trained with axis-aligned conditions only, but oblique conditions are allowed: they are more
      powerful and can express more complex patterns, at a higher training and inference cost [^2].
    references:
      - source: google-ml-courses
        locator: 'Decision trees: Check your understanding, Question 2'
        url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce
      - source: google-ml-courses
        locator: 'Decision Forests: Types of conditions, Axis-aligned vs. oblique conditions'
        url: https://developers.google.com/machine-learning/decision-forests/conditions
    source:
      id: google-ml-courses
      ref: decision-forests/decision-trees-mce#q2
      url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce
    status: reviewed
    reviewed_by: claude
  - id: trees-ensembles-013
    type: multiple
    difficulty: medium
    question: What are the two potential effects of increasing the minimum number of examples per leaf in a decision tree?
    options:
      - text: The size of the decision tree increases.
        why: Raising the minimum only stops splits earlier, so the tree can only shrink or keep its size [^1].
      - text: The size of the decision tree decreases.
        correct: true
      - text: The structure of the decision tree can completely change.
        why: Nodes near the root keep their conditions; only small, deep subtrees turn into leaves. A complete change is what new training examples can cause [^1][^2].
      - text: The structure of the decision tree remains mostly unchanged.
        correct: true
    explanation: |
      In Google's Decision Forests course, the minimum number of examples is a stopping rule: a node
      with fewer examples than the limit is not split any further [^1]. Greedy growth chooses each
      node's condition using only that node's examples [^2], so raising the limit keeps the
      conditions near the root as they were and turns some deep, small subtrees into leaves. The tree
      gets smaller (or keeps its size), and its overall structure stays mostly the same [^1][^2]. It
      cannot get bigger, because the change only removes splits. A completely different structure is
      what can happen when a few *training examples* change, not when this limit rises [^1].
      scikit-learn's `min_samples_leaf` works slightly differently: it rejects any split that would
      leave a child below the limit, so it can sometimes change a split higher up [^3].
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/overfitting-and-pruning#overfitting_and_pruning
        locator: "Decision Forests: Overfitting and pruning, sections 'Overfitting and pruning' and 'Direct decision tree interpretation'"
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/decision-forests/growing
        locator: 'Decision Forests: Growing decision trees (greedy divide-and-conquer algorithm)'
      - title: 'scikit-learn API: sklearn.tree.DecisionTreeClassifier'
        url: https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html
        locator: Parameter min_samples_leaf
    source:
      id: google-ml-courses
      ref: decision-forests/overfitting-mce#q1
      url: https://developers.google.com/machine-learning/decision-forests/overfitting-mce
    status: reviewed
