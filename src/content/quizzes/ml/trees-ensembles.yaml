  - id: trees-ensembles-021
    type: single
    difficulty: easy
    question: Random Forest is a ___ type of classifier
    options:
      - text: ensemble
        correct: true
      - text: linear
      - text: instance-based (nearest-neighbor)
    explanation: |
      A random forest trains many decision trees, each on a bootstrap sample of the training set and
      with a random subset of features considered at the splits, and averages their predictions;
      combining several base estimators like this is what makes it an ensemble method [^1][^2]. A
      linear classifier would separate the classes with a single linear boundary, and an
      instance-based classifier such as k-NN simply stores the training examples and votes among
      the nearest ones at prediction time [^3]; a forest is neither.
    references:
      - title: 'scikit-learn User Guide: Ensembles'
        url: https://scikit-learn.org/stable/modules/ensemble.html#random-forests
        locator: Sec. 1.11 introduction and 1.11.2.1 Random Forests
