      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
    status: draft
  - id: trees-ensembles-025
    type: single
    difficulty: medium
    tags:
      - feature-engineering
      - scaling
      - tree-based-models
    question: |
      You are preparing features for a tree-based ensemble such as a random forest. Which
      transformation can usually be skipped for the trees, even though it matters for k-NN, RBF
      SVMs or the interpretation of linear-model coefficients?
    options:
      - text: Standardizing the continuous features
        correct: true
      - text: Encoding the categorical features as numbers
        why: scikit-learn's trees need numeric input, so categories must still be encoded (one-hot or ordinal) [^3].
      - text: Turning a raw text column into bag-of-words counts
        why: Raw text has no fixed set of values; any model, a tree included, needs it encoded as numeric features first [^4].
      - text: Extracting month and hour features from a timestamp
        why: Trees cannot extrapolate a raw timestamp beyond the training range, so date parts help them as much as other models [^5].
    explanation: |
      A tree splits on thresholds of one feature at a time. Rescaling a feature monotonically, as
      standardization does, moves the thresholds but not the partitions, so the predictions do not
      change; random forests "don't require scaling of data" [^1]. Scaling matters for models that
      compare distances, such as $k$-NN and RBF SVMs, and when comparing coefficient sizes of
      linear models [^2]. The best features depend on the model you use [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 11: Ensembles — Random forests: Strengths and weaknesses'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/11_ensembles.ipynb
