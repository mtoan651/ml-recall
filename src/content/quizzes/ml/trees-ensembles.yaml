  - id: trees-ensembles-026
    type: multiple
    difficulty: easy
    tags:
      - baselines
      - decision-trees
      - prediction
    question: Which statements about baselines and decision trees are true? Select all that apply.
    options:
      - text: Changing the features, for example binarizing them, changes the predictions of a most-frequent baseline classifier
        why: A most-frequent baseline ignores the features and always predicts the most frequent training label [^1].
      - text: Making a prediction needs only an example's features, while training a model and scoring its accuracy also need the targets
        correct: true
      - text: A decision tree only works if all feature values are binary
        why: Trees also handle numeric features; for each split the algorithm picks a feature and a threshold [^3].
      - text: A decision tree predicts by routing the example from the root down to a leaf
        correct: true
    explanation: |
      A baseline such as the most-frequent classifier uses a rule of thumb that ignores $X$, which
      makes it a sanity check for real models [^1]. The usual workflow passes $X$ and $y$ to `fit`
      and to `score` (which compares predictions with the true targets) but only $X$ to
      `predict` [^2]. A decision tree learns a hierarchy of questions; numeric features are split at a
      learned threshold, and a new example is routed from the root through the questions until it
      reaches a leaf, which holds the prediction [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — Baselines; DummyClassifier'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — fit, predict, and score summary'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — How does predict work?; Decision trees with continuous features'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
