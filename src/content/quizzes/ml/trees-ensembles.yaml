  - id: trees-ensembles-027
    type: single
    difficulty: medium
    tags:
      - random-forest
      - bootstrap
      - averaging
      - boosting
    question: Which statement about random forests and averaging is the most accurate?
    options:
      - text: Each tree first draws a random subset of features and then uses only those features for all of its splits
        why: The feature subset is drawn anew at *each node*, not once per tree [^1].
      - text: The number of trees should be tuned like other hyperparameters to get better validation scores
        why: More trees is generally better; the course chooses fewer trees only to save time, not to improve the score [^2].
      - text: Random forests build their trees one after another, each depending on the previous tree
        why: That describes gradient boosting; the trees of a random forest are independent, so they can be trained in parallel [^3].
      - text: Every tree in a random forest is trained on a different bootstrap sample of the training set
        correct: true
      - text: Averaging classifiers with training errors of 10%, 20% and 30% gives at best a training error of 10%
        why: If the models make different mistakes, a majority vote can be right where each single model is wrong, so the ensemble can beat its best member [^4].
    explanation: |
      A random forest injects randomness twice: each tree is grown on its own bootstrap sample of
      the training set, and each node considers only a random subset of features [^1]. The trees
      are independent and vote, which reduces overfitting; adding trees rarely hurts [^2].
      Boosting, by contrast, builds trees sequentially, each correcting the previous ones [^3].
      Averaging can beat the best single model when the models' errors differ: three models that
      are each wrong on a different example can all be outvoted to give a correct ensemble [^4].
    references:
