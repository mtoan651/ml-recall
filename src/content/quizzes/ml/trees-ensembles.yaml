  - id: trees-ensembles-024
    type: single
    difficulty: hard
    tags:
      - permutation-importance
      - correlated-features
      - random-forest
    question: |
      A random forest is trained on data in which several features are strongly correlated with
      each other (near-copies of the same information), and the forest uses all of them in its
      splits. You compute permutation importance on held-out data. What pattern should you expect
      for these correlated features?
    options:
      - text: Each of them gets a very high importance, because each one carries the signal
        why: Permuting one feature leaves its correlated copies intact, so the model loses little and the measured drop in score stays small [^1].
      - text: Exactly one of them gets almost all the importance and the others get almost none
        why: That pattern appears when a model relies on only one copy; a forest that splits on all of them can fall back on the others when one is permuted [^1].
      - text: Each of them gets a low importance, even though their shared information matters
        correct: true
      - text: The computation fails and returns missing values for them
        why: Permutation importance can always be computed; correlation only makes its values misleading [^1].
    explanation: |
      Permutation importance shuffles one feature at a time and measures how much the model's score
      drops [^2]. If that feature has strongly correlated partners, the model still gets the same
      information through them, so the drop is small for *each* feature, and all of them can look
      unimportant even when the information they share is crucial [^1]. The course gives the
      matching advice: check for correlated features and be mindful of them, or remove redundant
      ones, before reading feature importances [^2]; scikit-learn suggests clustering correlated
      features and keeping one per cluster [^1].
    references:
      - title: 'scikit-learn User Guide: Permutation feature importance'
        locator: Sec. 5.2.3 Misleading values on strongly correlated features
        url: https://scikit-learn.org/stable/modules/permutation_importance.html#misleading-values-on-strongly-correlated-features
        quote: When two features are correlated and one of the features is permuted, the model still has access to the latter through its correlated feature.
      - source: ubc-cpsc330
        locator: "Lecture 12: Feature importances and model transparency — sklearn's feature_importances_ attribute vs permutation_importance; Do we have correlated features?"
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/12_feat-importances.ipynb
    source:
