title: Decision Trees & Ensembles
questions:
  - id: trees-ensembles-001
    type: single
    difficulty: easy
    question: 'AdaBoost is known for:'
    options:
      - text: focusing on the weights of incorrectly classified items
        correct: true
      - text: focusing on detecting outliers in the data
        why: AdaBoost has no outlier-detection step. It reweights misclassified examples, and outliers that keep being misclassified can even come to dominate the weights [^3].
      - text: focusing on removing incorrect data
        why: AdaBoost keeps every training example and only changes the weights, so mislabelled points make it more sensitive to noise rather than being removed [^2][^3].
    explanation: |
      AdaBoost trains a sequence of weak learners on reweighted versions of the training data.
      After each round, the examples the current model misclassified get larger weights and the
      correctly classified ones get smaller weights, so the next learner concentrates on the
      examples that earlier ones got wrong [^1][^2]. The defining idea is this reweighting of
      misclassified items. AdaBoost neither detects outliers nor removes incorrect data [^2]. If
      anything, outliers and mislabelled points that keep being misclassified pile up weight, which
      makes AdaBoost sensitive to label noise [^3].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#ensemble-classifiers
        locator: "Lesson: Classification 3, section 'Ensemble Classifiers'"
      - title: 'scikit-learn User Guide: Ensembles'
        url: https://scikit-learn.org/stable/modules/ensemble.html#adaboost
        locator: Sec. 1.11.7 AdaBoost
      - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
        url: https://hastie.su.domains/ElemStatLearn/
        locator: Sec. 10.6 Loss Functions and Robustness, pp. 346-350
    source:
      id: ms-ml-for-beginners
      ref: quiz-24/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: reviewed
