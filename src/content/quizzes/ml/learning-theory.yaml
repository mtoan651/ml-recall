  - id: learning-theory-013
    type: short_answer
    difficulty: medium
    tags:
      - vc-dimension
      - shattering
    question: |
      A classifier labels a point of the plane positive if it lies inside a given axis-aligned
      rectangle (sides parallel to the axes) and negative otherwise. The rectangle can be any such
      rectangle. What is the VC dimension of this class?
    answer:
      numeric: 4
      hint: an integer
    explanation: |
      One shattered set is enough for the lower bound: four points placed as a diamond (top,
      bottom, left, right) can be cut out in all $2^4 = 16$ ways by a suitable rectangle [^1]. No
      set of five points can be shattered. Take their smallest enclosing rectangle: at most four of
      the points (the leftmost, rightmost, highest and lowest) fix its sides, and labelling those
      positive and the remaining point negative is impossible, because any axis-aligned rectangle
      containing the extreme points contains the whole box [^1]. The largest shattered set has 4
      points, so the VC dimension is 4 [^2].
    references:
      - title: Hopcroft and Kannan, Cornell CS4850 course notes, Ch. 6 Learning and VC-dimension (2010 draft)
        url: https://www.cs.cornell.edu/courses/cs4850/2010sp/Course%20Notes/Chap%206%20Learning-march_9_2010.pdf
        locator: 'Examples of Set Systems and Their VC-Dimension: Rectangles with horizontal and vertical edges (p. 16)'
      - title: Wikipedia, Vapnik–Chervonenkis dimension
        url: https://en.wikipedia.org/wiki/Vapnik%E2%80%93Chervonenkis_dimension#Definitions
        locator: Definitions, VC dimension of a set-family
    source:
      id: d2l
      ref: chapter_linear-classification/generalization-classification#ex4
      url: https://d2l.ai/chapter_linear-classification/generalization-classification.html
    status: draft
  - id: learning-theory-014
    type: short_answer
    difficulty: medium
    tags:
      - test-set-size
      - central-limit-theorem
      - bernoulli
    question: |
      A fixed classifier has true error rate $\epsilon(f) = 0.1$. By the central limit theorem, its
      error on $n$ fresh test examples has standard deviation about $\sqrt{\epsilon(f)(1 - \epsilon(f))/n}$.
      How many test examples make this standard deviation equal to $0.01$?
    answer:
      numeric: 900
      tolerance: 1
      hint: a whole number of examples
      model: $0.1 \cdot 0.9 / 0.01^2 = 900$
    explanation: |
      Each test example contributes a Bernoulli variable $\mathbf{1}(f(\mathbf{x}) \neq y)$ with
      variance $\epsilon(f)(1 - \epsilon(f))$, and the average of $n$ of them has standard deviation
      $\sigma/\sqrt{n}$ [^1]. Solving $\sqrt{0.1 \cdot 0.9 / n} = 0.01$ gives $n = 0.09 / 10^{-4} = 900$.
      d2l's figure of about 2,500 examples is the worst case $\epsilon(f) = 0.5$, where the variance
      peaks at $0.25$ [^1]. Error rates near 0 or 1 therefore need smaller test sets for the same
      precision.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
        locator: Sec. 4.6.1 The Test Set
    source:
      id: original
      ref: learning-theory-014
    status: draft
  - id: learning-theory-015
    type: true_false
    difficulty: medium
    tags:
      - hoeffding-inequality
      - central-limit-theorem
      - test-set-size
    shuffle: false
    question: |
      To be 95% sure that a fixed classifier's test error is within $\pm 0.01$ of its true error,
      the finite-sample Hoeffding bound asks for fewer test examples than the asymptotic central
      limit theorem estimate does.
    options:
      - text: 'True'
        why: It is the other way round; the finite-sample guarantee needs about 15,000 examples against about 10,000.
      - text: 'False'
        correct: true
    explanation: |
      The central limit theorem estimate, with the worst-case standard deviation $\sqrt{0.25/n}$
      and two standard deviations for 95% confidence, asks for about 10,000 examples [^1].
      Hoeffding's inequality gives a guarantee that holds for every finite $n$, and solving it for
      the same confidence and precision asks for about 15,000 examples [^1]. Guarantees that hold
      in finite samples are typically somewhat more conservative than asymptotic approximations,
      although the two figures here are of the same order [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
        locator: Sec. 4.6.1 The Test Set, eq. (4.6.3)
        quote: Guarantees that hold even in finite samples are typically slightly more conservative.
    source:
      id: original
      ref: learning-theory-015
    status: draft
  - id: learning-theory-016
    type: short_answer
    difficulty: easy
    tags:
      - test-set-reuse
      - adaptive-overfitting
      - multiple-testing
    question: |
      You evaluate model $f_1$ on the test set, then design $f_2$ using what you saw and evaluate
      it on the same test set. Because $f_2$ was chosen after information from the test set reached
      you, the set is no longer a true test set; this problem is called {{1}} overfitting.
      Evaluating many models on one test set also raises the problem of multiple hypothesis
      testing, that is, of false {{2}}.
    answer:
      blanks:
        - accept:
            - adaptive
          hint: one word
        - accept:
            - discovery
            - discoveries
          hint: one word
      model: Adaptive overfitting; false discovery.
    explanation: |
      The error bound for a test set assumes the classifier was chosen without any contact with
      that set. Once $f_2$ is designed after seeing $f_1$'s test score, information has leaked and
      d2l calls the result adaptive overfitting [^1]. Separately, the more classifiers are scored
      on one test set, the harder it is to guarantee that none of them received a misleading score,
      the false discovery problem of multiple hypothesis testing [^1]. d2l's advice is to consult
      real test sets as rarely as possible and to demote an old test set to a validation set after
      each round of a benchmark [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#test-set-reuse
        locator: Sec. 4.6.2 Test Set Reuse
    source:
      id: original
      ref: learning-theory-016
    status: draft
  - id: learning-theory-017
    type: short_answer
    difficulty: medium
    tags:
      - multiple-testing
      - test-set-reuse
      - false-discovery
    question: |
      For a single classifier you are 95% sure that its test error is within $\pm 0.01$ of its true
      error. You now evaluate 20 classifiers on the same test set and, for simplicity, treat their
      20 results as independent. What is the probability that at least one of them gets a
      misleading score (outside its $\pm 0.01$ interval)?
    answer:
      numeric: 0.64
      tolerance: 0.01
      hint: a probability between 0 and 1, 2 decimals
      model: $1 - 0.95^{20} \approx 0.64$
    explanation: |
      Each score is misleading with probability 0.05, so under independence all 20 are fine with
      probability $0.95^{20} \approx 0.358$, and at least one is misleading with probability
      $1 - 0.358 \approx 0.64$ [^2]. This is why d2l warns that with 20 classifiers you may have no
      power at all to rule out a misleading result, an instance of multiple hypothesis testing [^1].
      Real scores on a shared test set are correlated, but a Bonferroni correction, which tests each
      of $m$ comparisons at level $\alpha/m$, controls the family-wise error without assuming
      independence [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#test-set-reuse
        locator: Sec. 4.6.2 Test Set Reuse
      - title: Wikipedia, Multiple comparisons problem
        url: https://en.wikipedia.org/wiki/Multiple_comparisons_problem#Multiple_testing_correction
        locator: Controlling procedures, Multiple testing correction (family-wise error rate; Bonferroni correction)
    source:
      id: original
      ref: learning-theory-017
    status: draft
  - id: learning-theory-018
    type: single
    difficulty: medium
    tags:
      - vc-dimension
      - deep-learning
      - generalization
    question: |
      In what sense do classical complexity-based bounds, such as those based on the VC dimension or
      Rademacher complexity, fail to explain why deep neural networks generalize?
    options:
      - text: Nets can fit random labels, so the bounds are vacuous, yet nets generalize well
        correct: true
      - text: The bounds say deep nets should generalize well, but in practice they overfit badly
        why: It is the reverse; the bounds are pessimistic, while deep networks generalize well in practice.
      - text: The bounds cover only regression with a squared loss and say nothing about classification
        why: The VC bound is stated for classification error; the trouble is that its value is useless for large networks.
      - text: Deep nets have too few parameters relative to the data for the bounds to apply at all
        why: Deep networks usually have more parameters than training examples; they are over-parametrized.
    explanation: |
      Deep networks are expressive enough to fit every training example, even when the labels of a
      large dataset are assigned at random [^1]. A class that can fit arbitrary labels has an
      enormous VC dimension or Rademacher complexity, so bounds built on these quantities guarantee
      nothing useful [^1]. Yet such networks generalize well in practice, and often better when they
      are larger and deeper, despite a higher VC dimension [^2]. The bounds are not wrong; applied
      directly, they are far too loose to explain what is observed [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#revisiting-overfitting-and-regularization
        locator: Sec. 5.5.1 Revisiting Overfitting and Regularization
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#summary
        locator: Sec. 4.6.4 Summary
        quote: they often generalize better, when they are larger and deeper, despite incurring higher VC dimensions.
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/generalization-deep#ex1
      url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html
    status: draft
  - id: learning-theory-019
    type: short_answer
    difficulty: easy
    tags:
      - early-stopping
      - regularization
    question: |
      Weight decay regularizes by directly constraining the values of the weights. Early stopping
      instead constrains the number of training {{1}}, cutting training off once the error on the
      {{2}} set stops improving.
    answer:
      blanks:
        - accept:
            - epochs
            - epoch
            - iterations
            - iteration
            - steps
            - updates
          hint: one word
        - accept:
            - validation
            - holdout
            - held-out
            - dev
          hint: one word
      model: epochs; validation
    explanation: |
      Rather than limiting the size of the weights, early stopping limits how many epochs the
      network is trained, monitoring validation error and stopping when it stops improving [^1].
      Deep networks can eventually fit even randomly assigned labels, but this ability only emerges
      over many iterations; with label noise they tend to fit the clean examples first and the
      mislabelled ones later [^1]. Stopping early therefore keeps the model from interpolating the
      noise, which is why it acts as a regularizer, whereas weight decay adds a penalty on the
      weight norm to the loss [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
        locator: Sec. 5.5.3 Early Stopping
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#classical-regularization-methods-for-deep-networks
        locator: Sec. 5.5.4 Classical Regularization Methods for Deep Networks
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/generalization-deep#ex2
      url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html
    status: draft
  - id: learning-theory-020
    type: short_answer
    difficulty: medium
    tags:
      - early-stopping
      - patience
      - code-reading
    question: |
      This loop implements early stopping with a patience criterion:

      ```python
      val_losses = [0.90, 0.70, 0.62, 0.60, 0.61, 0.598, 0.605, 0.603, 0.601, 0.59]
      patience, min_delta = 3, 0.005
      best, wait = float("inf"), 0
      for epoch, loss in enumerate(val_losses, start=1):
          if loss < best - min_delta:
              best, wait = loss, 0
          else:
              wait += 1
              if wait >= patience:
                  break
      print(epoch, best)
      ```

      Training stops after epoch {{1}}, and `best` then holds the value {{2}}.
    answer:
      blanks:
        - numeric: 7
          hint: an epoch number
        - numeric: 0.6
          tolerance: 0.0001
          hint: a loss value
      model: 'It prints `7 0.6`: at epoch 6, 0.598 beats 0.60 by less than `min_delta`, so it does not count as an improvement.'
    explanation: |
      The loss improves at epochs 1 to 4, ending at `best = 0.60` with the counter reset. Epoch 5
      (0.61) sets the counter to 1. At epoch 6, 0.598 is lower than 0.60 but not below
      $0.60 - 0.005 = 0.595$, so the counter goes to 2 and `best` stays 0.60. Epoch 7 (0.605)
      brings the counter to 3, the patience, and the loop breaks. This is d2l's patience criterion:
      stop once the validation error has not decreased by more than a small $\epsilon$ for some
      number of epochs, which also saves training time [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
        locator: Sec. 5.5.3 Early Stopping (patience criterion)
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/generalization-deep#ex3
      url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html
    status: draft
  - id: learning-theory-021
    type: true_false
    difficulty: medium
    tags:
      - early-stopping
      - label-noise
      - realizable
    shuffle: false
    question: |
      On a realizable dataset with clean labels (for example, telling cats from dogs with no
      labelling mistakes), early stopping usually brings large improvements in generalization.
    options:
      - text: 'True'
        why: The big gains come with label noise or intrinsic variability in the labels, not on clean, separable data.
      - text: 'False'
        correct: true
    explanation: |
      When there is no label noise and the classes are truly separable, early stopping tends not to
      improve generalization much [^1]. What makes the difference is noise in the labels, or
      intrinsic variability such as predicting patient mortality; then early stopping is crucial,
      because networks fit the clean examples first and only later interpolate the mislabelled ones
      [^1]. Even where it does not help accuracy, it still saves training time once the patience
      criterion is met [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
        locator: Sec. 5.5.3 Early Stopping
        quote: early stopping tends not to lead to significant improvements in generalization.
    source:
      id: d2l
      ref: chapter_multilayer-perceptrons/generalization-deep#ex4
      url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html
    status: draft
  - id: learning-theory-022
    type: single
    difficulty: medium
    tags:
      - double-descent
      - overparameterization
      - model-complexity
    question: |
      In the "double descent" pattern reported for deep networks, how does test error change as
      model complexity (for example, network width) keeps growing?
    options:
      - text: It falls, peaks when the model can just fit the training data, then falls again
        correct: true
      - text: It falls and then rises steadily, the classical U-shaped curve, with no second drop
        why: That is the classical picture; double descent adds a second decrease beyond the interpolation threshold.
      - text: It decreases monotonically, because each parameter added lowers the test error a little
        why: There is a bump; near the interpolation threshold extra complexity first hurts before it helps.
      - text: It stays flat, while it is the training error that goes down twice instead
        why: Double descent is about test error; training error simply reaches zero once the model can interpolate.
    explanation: |
      Classically, test error is U-shaped in model complexity: it falls while the model underfits
      and rises once it overfits [^1]. For deep networks the relation can be non-monotonic in a
      different way, with greater complexity first hurting and then helping again, the so-called
      double descent [^2]. The peak sits near the interpolation threshold, where the model is just
      large enough to fit the training data; beyond it, in the over-parametrized regime, test error
      falls again [^3]. This is one reason why enlarging a network that already fits its training
      set can still improve generalization [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#polynomial-curve-fitting
        locator: Sec. 3.6.2.1 Polynomial Curve Fitting, Fig. 3.6.1
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#revisiting-overfitting-and-regularization
        locator: Sec. 5.5.1 Revisiting Overfitting and Regularization
      - title: Wikipedia, Double descent
        url: https://en.wikipedia.org/wiki/Double_descent
        locator: Introduction (interpolation threshold)
    source:
      id: original
      ref: learning-theory-022
    status: draft
