        locator: Definitions — VC dimension of a classification model
        url: https://en.wikipedia.org/wiki/Vapnik%E2%80%93Chervonenkis_dimension#VC_dimension_of_a_classification_model
    source:
      id: mit-ocw-6867
      ref: final_f03soln#q2.1
      url: https://ocw.mit.edu/courses/6-867-machine-learning-fall-2006/resources/final_f03soln/
