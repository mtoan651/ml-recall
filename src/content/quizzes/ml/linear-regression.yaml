  - id: linear-regression-010
    type: single
    difficulty: medium
    question: 'The relation between the selling price of a car (in \$1,000) and its age (in years) is estimated from a random sample of cars of a specific model. The relation is given by the following formula: Selling price = 15.9 – 0.983 (age) Which of the following can we conclude from this equation?'
    options:
      - text: For every year the car gets older, the selling price goes down by approximately 9.83 percent.
      - text: A new car costs on the average \$9,830.
      - text: For every year the car gets older, the selling price drops by approximately \$1,590.
      - text: For every year the car gets older, the selling price drops by approximately \$983.
        correct: true
    explanation: |
      The slope of a fitted line is the predicted change in $y$ for a one-unit increase in $x$. The
      intercept is the predicted $y$ when $x = 0$ [^1]. Price is measured in thousands of dollars,
      so a slope of $-0.983$ means the predicted price drops by 0.983 thousand dollars, about \$983,
      for each extra year of age. The intercept 15.9 predicts about \$15,900 for a new car (age 0),
      not \$9,830, and \$1,590 mixes up the intercept with the slope. A linear model in price gives
      the same dollar drop every year, not a fixed percentage.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#finding-and-interpreting-the-least-squares-line
        locator: Sec. 7.2.3 Finding and interpreting the least squares line (interpreting slope and intercept)
    source:
      id: mmlu-redux
      ref: high_school_statistics/79
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=79
    status: draft
  - id: linear-regression-011
    type: single
    difficulty: easy
    question: The relation between studying time (in hours) and grade on a final exam (0-100) in a random sample of students in math class was found to be Grade = 50.25 + 10.2 (h) How will a student’s grade be affected if she studies for two hours?
    options:
      - text: Her grade will go up by 40.05 points.
      - text: Her grade will go up by 20.4 points.
        correct: true
      - text: Her grade will remain unchanged.
      - text: Her grade will down by 10.2 points.
    explanation: |
      The slope 10.2 is the predicted change in grade for each additional hour of study [^1].
      Studying two hours therefore adds $2 \times 10.2 = 20.4$ points compared with not studying: the
      prediction is $50.25 + 20.4 = 70.65$ instead of the intercept 50.25. The figure 40.05 is the
      intercept minus the slope, which means nothing here, and a positive slope rules out an
      unchanged or lower grade. This is a predicted association from observational data, not a
      guaranteed causal effect [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#finding-and-interpreting-the-least-squares-line
        locator: Sec. 7.2.3 Finding and interpreting the least squares line (interpreting slope and intercept)
    source:
      id: mmlu-redux
      ref: high_school_statistics/88
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=88
    status: draft
  - id: linear-regression-012
    type: single
    difficulty: medium
    question: For the regression line, which of the following statements about residuals is true?
    options:
      - text: Influential scores have large residuals.
      - text: If the linear model is good, the number of positive residuals will be the same as the number of negative residuals.
      - text: The mean of the residuals is always zero.
        correct: true
      - text: If the correlation is 0, there will be a distinct pattern in the residual plot.
    explanation: |
      For a least-squares line with an intercept, the residuals always add up to zero, on every data
      set, so their mean is exactly zero [^1]. Influential points need not have large residuals. A
      point far out in the $x$ direction pulls the line toward itself, so it can end up close to the
      fitted line [^2]. A zero mean does not force equal numbers of positive and negative residuals,
      because a few large negative residuals can balance many small positive ones. A correlation near
      0 just means there is no linear trend, and the residual plot can then look like structureless
      scatter [^2].
    references:
      - title: 'Shalizi, CMU 36-401 Modern Regression, Lecture 7: Diagnostics and Modifications for Simple Regression (2015)'
        url: https://www.stat.cmu.edu/~cshalizi/mreg/15/lectures/07/lecture-07.pdf
        locator: Sec. 1 The Residuals (and 1.1 Summary on Properties of the Residuals)
        quote: when the simple linear model is estimated by least squares, no matter what.
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#sec-outliers-in-regression
        locator: Sec. 7.1.3 Residuals (residual plots, Dataset 3) and Sec. 7.3 Outliers in linear regression (leverage, influential points)
    source:
      id: mmlu-redux
      ref: high_school_statistics/97
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=97
    status: draft
