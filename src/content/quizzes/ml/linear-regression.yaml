  - id: linear-regression-009
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - inference
    question: A model predicts travel time with $\hat y = 2x + 1$. What does it predict for $x = 3$?
    options:
      - text: '5'
        why: This adds 2 and 3 instead of multiplying.
      - text: '6'
        why: This forgets the bias term $+1$.
      - text: '8'
      - text: '7'
        correct: true
    explanation: 'Inference simply evaluates the learned function on the new input: $\hat y = 2 \cdot 3 + 1 = 7$ [^1].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 44
    source:
      id: ncu-intro-dl
      ref: exercise-01/q10
    status: reviewed
