  - id: linear-regression-035
    type: single
    difficulty: medium
    tags:
      - outliers
      - squared-loss
      - absolute-loss
      - robustness
    shuffle: false
    question: |
      You fit linear regression to data in which one label was mistyped as $y_5 = 10000$. Compare the
      squared loss $\frac{1}{2}(\hat y - y)^2$ with the absolute loss $|\hat y - y|$. Which statement is
      correct?
    options:
      - text: The outlier's squared-loss gradient grows with its residual and dominates; absolute loss caps it at 1
        correct: true
      - text: Both losses are affected equally, because the outlier's residual is exactly the same under both of them
        why: 'The residual is the same, but the gradients are not: $\hat y - y$ for squared loss versus $\mathrm{sign}(\hat y - y)$ for absolute loss.'
      - text: Absolute loss is affected more, because $|r|$ exceeds $\frac{1}{2}r^2$ for large residuals
        why: 'For large $|r|$ it is the other way round: $\frac{1}{2}r^2$ is far larger than $|r|$.'
      - text: Squared loss ignores the outlier, because the gradient of the loss is zero at its minimum
        why: Only the total gradient is zero at the minimum; the outlier's own term pulls the fit strongly toward it.
    explanation: |
      Each example's gradient is $(\hat y - y)\mathbf{x}$ under squared loss but
      $\mathrm{sign}(\hat y - y)\mathbf{x}$ under absolute loss. A residual near 10000 thus pulls 10000
      times harder than a residual of 1 under squared loss, and the fit tilts toward the outlier; d2l
      notes this excessive sensitivity of the quadratic loss to anomalous data [^1]. The absolute loss,
      like the $\ell_1$ norm, is much less sensitive to outliers [^2], but its constant gradient makes
      SGD jitter near the optimum. The Huber loss combines both: quadratic for small residuals and
      linear, with a bounded gradient, for large ones [^3].
    references:
      - source: d2l
        locator: Sec. 3.1.1.2 Loss Function
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function
      - source: d2l
        locator: Sec. 2.3.11 Norms
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#norms
      - title: 'Wikipedia: Huber loss'
        locator: Definition and Motivation
        url: https://en.wikipedia.org/wiki/Huber_loss
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 8
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex8
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
