title: Linear Models & Regularization
questions:
  - id: linear-regression-001
    type: single
    difficulty: easy
    question: If your data is nonlinear, try a ___ type of Regression
    options:
      - text: linear
      - text: spherical
      - text: polynomial
        correct: true
    explanation: |
      Polynomial regression adds powers of the inputs (such as $x^2$) as extra features, so the fitted
      curve can bend to follow nonlinear data [^1]. The model is still linear in its weights, which
      means the usual least-squares machinery can fit it [^2]. Plain linear regression can only fit a
      straight line (or plane), and "spherical" is not a type of regression in the lesson [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#polynomial-regression
        locator: 'Lesson: Linear and Polynomial Regression, Polynomial Regression'
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/linear_model.html#polynomial-regression-extending-linear-models-with-basis-functions
        locator: 'Sec. 1.1.16 Polynomial regression: extending linear models with basis functions'
    source:
      id: ms-ml-for-beginners
      ref: quiz-14/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: linear-regression-002
    type: single
    difficulty: easy
    question: 'Least-Squares Regression means that all the datapoints surrounding the regression line are:'
    options:
      - text: squared and then subtracted
      - text: multiplied
      - text: squared and then added up
        correct: true
    explanation: |
      Least squares takes each point's vertical distance to the line (its residual) and squares it,
      so errors above and below the line count the same way. It then adds the squares up, and the
      best line is the one with the smallest total [^1][^2]. Subtracting the squared values would let
      errors cancel out, and multiplying the residuals plays no part in the method.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#a-linear-regression-line
        locator: 'Lesson: Linear and Polynomial Regression, A linear regression line'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#an-objective-measure-for-finding-the-best-line
        locator: Sec. 7.2.2 An objective measure for finding the best line
    source:
      id: ms-ml-for-beginners
      ref: quiz-14/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: linear-regression-003
    type: single
    difficulty: hard
    shuffle: false
    question: The model obtained by applying linear regression on the identified subset of features may differ from the model obtained at the end of the process of identifying the subset during
    options:
      - text: Best-subset selection
      - text: Forward stepwise selection
      - text: Forward stage wise selection
        correct: true
      - text: All of the above
    explanation: |
      Best-subset and forward stepwise selection are pure variable-selection methods. Every candidate
      model they compare is an ordinary least-squares fit on the chosen predictors, so refitting
      linear regression on the final subset gives back the same model [^1][^2]. Forward stagewise
      regression works differently. At each step it picks the variable most correlated with the
      current residual and moves only that variable's coefficient by a small amount, instead of
      jumping to the least-squares value [^2]. Its coefficients therefore behave like shrunken,
      lasso-like estimates, and refitting plain least squares on the variables it selected can give a
      different model [^2]. The first two methods don't have this gap, so "all of the above" is wrong.
    references:
      - title: 'James, Witten, Hastie, Tibshirani: An Introduction to Statistical Learning (1st ed., 7th printing)'
        url: https://www.statlearning.com/s/ISLR-Seventh-Printing.pdf
        locator: Sec. 6.1.1 Best Subset Selection and Sec. 6.1.2 Stepwise Selection (Algorithms 6.1, 6.2), pp. 205–208
      - title: 'Hesterberg, Choi, Meier, Fraley (2008): Least angle and ℓ1 penalized regression: A review, Statistics Surveys 2'
        url: https://arxiv.org/abs/0802.0964
        locator: Sec. 2.2 LARS and Earlier Methods; Sec. 2.2.4 Forward Stagewise
        quote: In stepwise regression, the most useful predictor is added to the model at each step, and the coefficient jumps from zero to the the least-squares value.
    source:
      id: mmlu-redux
      ref: machine_learning/7
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=7
    status: draft
  - id: linear-regression-004
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** L2 regularization of linear models tends to make models more sparse than L1 regularization.

      **Statement 2.** Residual connections can be found in ResNets and Transformers.
    options:
      - text: True, True
      - text: False, False
      - text: True, False
      - text: False, True
        correct: true
    explanation: |
      Statement 1 is false; it is the other way round. An $\ell_1$ penalty (lasso) drives some
      weights exactly to zero and so produces sparse models. An $\ell_2$ penalty (ridge) shrinks
      weights toward zero but spreads weight across many features [^1][^2]. Statement 2 is true.
      ResNet is built from residual blocks whose shortcut connection adds the block's input to its
      output [^3], and every Transformer sublayer is wrapped in a residual connection followed by
      layer normalization [^4].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/linear_model.html#lasso
        locator: Sec. 1.1.3 Lasso
        quote: The Lasso is a linear model that estimates sparse coefficients, i.e., it is able to set coefficients exactly to zero.
      - source: d2l
        url: https://d2l.ai/chapter_convolutional-modern/resnet.html#residual-blocks
        locator: Sec. 8.6.2 Residual Blocks
      - source: d2l
        url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#residual-connection-and-layer-normalization
        locator: Sec. 11.7.1 Model and Sec. 11.7.3 Residual Connection and Layer Normalization
    source:
      id: mmlu-redux
      ref: machine_learning/14
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=14
    status: draft
  - id: linear-regression-005
    type: multiple
    difficulty: medium
    question: After applying a regularization penalty in linear regression, you find that some of the coefficients of $w$ are zeroed out. Which of the following penalties might have been used?
    options:
      - text: $\ell_0$ norm
        correct: true
      - text: $\ell_1$ norm
        correct: true
      - text: $\ell_2$ norm
        why: An $\ell_2$ penalty shrinks weights toward zero but does not set them exactly to zero.
    explanation: |
      Exact zeros come from penalties that reward sparsity. The $\ell_0$ "norm" counts the non-zero
      coefficients, so penalizing it pushes coefficients to exactly zero, and the $\ell_1$ norm is its
      usual continuous stand-in [^1]. The lasso ($\ell_1$) is known for setting coefficients exactly to
      zero [^2]. An $\ell_2$ penalty shrinks weights toward zero but never pushes them all the way
      there [^3]. So the zeros could have come from the $\ell_0$ or the $\ell_1$ penalty, but not from
      $\ell_2$.
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 9.1 Regularization (sparsity, ‖θ‖₀ and ‖θ‖₁)
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/linear_model.html#lasso
        locator: Sec. 1.1.3 Lasso
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/regularization
        locator: 'Overfitting: L2 regularization'
        quote: L2 regularization encourages weights toward 0, but never pushes weights all the way to zero.
    source:
      id: mmlu-redux
      ref: machine_learning/24
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=24
    status: draft
  - id: linear-regression-006
    type: single
    difficulty: medium
    question: 'Suppose we have the following objective function: $\operatorname*{arg\,min}_{w} \frac{1}{2} \lVert Xw-y \rVert^2_2 + \frac{1}{2}\lambda \lVert w \rVert^2_2$. What is the gradient of $\frac{1}{2} \lVert Xw-y \rVert^2_2 + \frac{1}{2}\lambda \lVert w \rVert^2_2$ with respect to $w$?'
    options:
      - text: $\nabla_w f(w) = (X^\top X + \lambda I)w - X^\top y + \lambda w$
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + \lambda$
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + \lambda w$
        correct: true
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + (\lambda+1) w$
    explanation: |
      Differentiate the two terms separately. The data term has gradient
      $\nabla_w \tfrac12\lVert Xw-y\rVert_2^2 = X^\top(Xw-y)$; d2l derives $2X^\top(Xw-y)$ for the
      version without the $\tfrac12$ [^1]. The penalty $\tfrac{\lambda}{2}\lVert w\rVert_2^2$ has
      gradient $\lambda w$, the factor $\tfrac12$ again cancelling the 2. This is the term that
      "decays" the weights in each gradient step [^2]. Adding them gives
      $$\nabla_w f(w) = X^\top X w - X^\top y + \lambda w.$$
      A bare $+\lambda$ forgets that the penalty depends on $w$. The other two forms add an extra
      $\lambda w$ or an extra $w$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
        locator: Sec. 3.1.1.3 Analytic Solution, eq. (3.1.8)
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
        locator: Sec. 3.7.1 Norms and Weight Decay, eqs. (3.7.2)–(3.7.3)
    source:
      id: mmlu-redux
      ref: machine_learning/40
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=40
    status: draft
  - id: linear-regression-007
    type: single
    difficulty: easy
    question: Which of the following statements about regression is FALSE?
    options:
      - text: It relates inputs to outputs.
      - text: It is used for prediction.
      - text: It may be used for interpretation.
      - text: It discovers causal relationships
        correct: true
    explanation: |
      Regression fits a relationship between inputs and outputs. You can use it to predict new values
      and to describe how the variables are related [^1]. What it cannot do by itself is establish
      cause and effect. Even a clear association in observational data does not show that changing
      $x$ would change $y$, so regression does not discover causal relationships on its own [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#a-linear-regression-line
        locator: 'Lesson: Linear and Polynomial Regression, A linear regression line'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#finding-and-interpreting-the-least-squares-line
        locator: Sec. 7.2.3 Finding and interpreting the least squares line
        quote: we cannot interpret a causal connection between the variables because these data are observational.
    source:
      id: mmlu-redux
      ref: machine_learning/51
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=51
    status: draft
  - id: linear-regression-008
    type: single
    difficulty: medium
    question: 'For polynomial regression, which one of these structural assumptions is the one that most affects the trade-off between underfitting and overfitting:'
    options:
      - text: The polynomial degree
        correct: true
      - text: Whether we learn the weights by matrix inversion or gradient descent
      - text: The assumed variance of the Gaussian noise
      - text: The use of a constant-term unit input
    explanation: |
      In polynomial regression the degree sets the model's complexity. A low degree cannot capture
      the pattern (underfitting), while a high degree has enough parameters to fit the noise as well
      (overfitting) [^1][^2]. The other choices hardly move this trade-off. The normal equations and
      gradient descent are two ways to reach the same least-squares minimum, because the loss is a
      convex quadratic [^3]. Under Gaussian noise, the least-squares solution does not depend on the
      assumed noise variance at all [^4]. A constant input only adds a single intercept parameter.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/generalization.html#polynomial-curve-fitting
        locator: Sec. 3.6.2.1 Polynomial Curve Fitting
      - title: 'scikit-learn example: Underfitting vs. Overfitting'
        url: https://scikit-learn.org/stable/auto_examples/model_selection/plot_underfitting_overfitting.html
        locator: Example description (polynomial degrees 1, 4, 15)
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 1.1 LMS algorithm and Sec. 1.2 The normal equations
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#the-normal-distribution-and-squared-loss
        locator: Sec. 3.1.3 The Normal Distribution and Squared Loss
    source:
      id: mmlu-redux
      ref: machine_learning/81
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=81
    status: draft
  - id: linear-regression-009
    type: single
