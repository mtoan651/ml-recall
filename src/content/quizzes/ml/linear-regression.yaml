  - id: linear-regression-034
    type: short_answer
    difficulty: easy
    tags:
      - least-squares
      - no-bias
      - closed-form
    question: |
      Ohm's law says $V = RI$. You measure $(I, V) = (1, 2.1)$, $(2, 3.9)$ and $(3, 6.2)$ (amperes,
      volts) and fit $R$ by least squares, minimizing $\sum_i (V_i - RI_i)^2$: a linear regression with
      no bias. What is $R$? Round to 3 decimals.
    answer:
      numeric: 2.036
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $R = \dfrac{\sum_i I_iV_i}{\sum_i I_i^2} = \dfrac{28.5}{14} \approx 2.036$ ohms
    explanation: |
      Setting the derivative $-2\sum_i I_i(V_i - RI_i)$ to zero gives
      $R = \sum_i I_iV_i / \sum_i I_i^2$, the one-feature case of the normal equations
      $\mathbf{X}^\top\mathbf{X}\mathbf{w} = \mathbf{X}^\top\mathbf{y}$ [^1]. Here
      $\sum I_iV_i = 2.1 + 7.8 + 18.6 = 28.5$ and $\sum I_i^2 = 14$. Training with autograd and SGD
      would approach the same value iteratively, since the model is linear in $R$ [^2]; leaving out the
      bias encodes the physics that zero current means zero voltage.
    references:
      - source: d2l
        locator: Sec. 3.1.1.3 Analytic Solution
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
      - source: d2l
        locator: Sec. 3.4.4 Training
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#training
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex2
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
