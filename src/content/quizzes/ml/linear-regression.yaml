  - id: linear-regression-031
    type: single
    difficulty: medium
    tags:
      - target-transform
      - log-price
      - relative-error
    question: |
      Why is regressing $y = \log(\text{price})$ usually better than regressing the price itself with
      additive Gaussian noise?
    options:
      - text: Taking logs removes outliers from the data, so the fitted weights become unbiased
        why: Logs compress large values, but they neither remove outliers nor guarantee unbiased weights.
      - text: Prices are positive and vary by percentages, which become additive errors on a log scale
        correct: true
      - text: A log transform makes the relationship between the features and the price linear in every case
        why: A log transform changes the noise model and the scale of the errors; it does not make an arbitrary relationship linear.
      - text: Additive Gaussian noise overflows numerically when the targets are as large as house prices
        why: 'The issue is statistical, not numerical: additive noise of fixed size is the wrong model for prices of very different magnitudes.'
    explanation: |
      Additive Gaussian noise of fixed size can produce negative prices, and it treats a \$100,000
      error the same for a \$125,000 house and for a \$4 million one [^1]. Prices, like stock prices,
      change by percentages: a model $\text{price} = \text{trend} \times (1 + \text{error})$ becomes
      additive after taking logs, where Gaussian noise is a reasonable assumption. That is why the
      Kaggle house-price competition scores the RMSE between log prices, a measure of relative error
      [^1]. Modeling $\log y$ as Gaussian means the price itself is log-normal, hence always positive
      [^2].
    references:
      - source: d2l
        locator: Sec. 5.7.5 Error Measure
        url: https://d2l.ai/chapter_multilayer-perceptrons/kaggle-house-price.html#error-measure
      - title: 'Wikipedia: Log-normal distribution'
        locator: Introduction
        url: https://en.wikipedia.org/wiki/Log-normal_distribution
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 7
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex7
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-032
    type: single
    difficulty: medium
    tags:
      - poisson-regression
      - count-data
      - negative-log-likelihood
    question: |
      To predict the number of apples $k$ sold per day, you model $k \sim \mathrm{Poisson}(\lambda)$
      with $p(k \mid \lambda) = \lambda^k e^{-\lambda} / k!$, and the network outputs
      $\theta = \log\lambda$. Which per-example loss is the negative log-likelihood, up to a constant?
    options:
      - text: $-k\theta$
        why: Without the $e^\theta$ term (the $\lambda$ term) the loss keeps decreasing as $\theta$ grows, so the model would predict ever larger counts.
      - text: $\theta - k\log\theta$
        why: That is the loss written for $\lambda$ with $\theta$ plugged in for $\lambda$; since $\lambda = e^\theta$, the terms become $e^\theta$ and $k\theta$.
      - text: $e^{\theta} - k\theta$
        correct: true
      - text: $(k - e^{\theta})^2$
        why: That is the squared loss of Gaussian noise; counts are nonnegative integers whose variance grows with their mean.
    explanation: |
      $-\log p(k \mid \lambda) = \lambda - k\log\lambda + \log k!$, and substituting
      $\lambda = e^\theta$ gives $e^\theta - k\theta + \log k!$, where $\log k!$ does not depend on the
      parameters [^1]. Its derivative $e^\theta - k$ vanishes at $\theta = \log k$, that is at
      $\lambda = k$, consistent with $\lambda$ being the mean of the Poisson distribution [^2].
      Predicting $\log\lambda$ keeps the rate positive without constraints, the log link of Poisson
      regression [^1]; Gaussian noise would instead allow negative and fractional sales.
    references:
      - title: 'Wikipedia: Poisson regression'
        locator: Maximum likelihood-based parameter estimation
        url: https://en.wikipedia.org/wiki/Poisson_regression#Maximum_likelihood-based_parameter_estimation
      - title: 'Wikipedia: Poisson distribution'
        locator: Descriptive statistics (mean)
        url: https://en.wikipedia.org/wiki/Poisson_distribution#Descriptive_statistics
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 8
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex8
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-033
    type: multiple
    difficulty: medium
    tags:
      - initialization
      - convexity
      - sgd
    question: |
      You train linear regression with squared loss by minibatch SGD. Which statements about
      initializing the weights are true? Select all that apply.
    options:
      - text: Drawing the weights with variance 1000 still converges, but it starts with a large loss and needs more steps
        correct: true
      - text: Zero weights make every gradient zero, so the weights never move
        why: The gradient is $\mathbf{x}(\mathbf{w}^\top\mathbf{x} + b - y)$; at $\mathbf{w} = \mathbf{0}$ the residual is $b - y$, which is nonzero for most examples [^1].
      - text: Variance 1000 lands in a worse local minimum than variance 0.01
        why: The squared loss of a linear model is convex, so it has no bad local minima; the minimum is unique when the design matrix has full rank [^2].
      - text: Zero initialization only works if the bias starts at a nonzero value
        why: With $\mathbf{w} = \mathbf{0}$ and $b = 0$ the residuals are $-y$, which already give nonzero gradients for all weights [^1].
      - text: Initializing all weights to zero works, because there is no hidden layer whose units need their symmetry broken
        correct: true
    explanation: |
      The gradient of the squared loss with respect to $\mathbf{w}$ is
      $\mathbf{x}^{(i)}(\mathbf{w}^\top\mathbf{x}^{(i)} + b - y^{(i)})$ [^1], which is nonzero at
      $\mathbf{w} = \mathbf{0}$ as long as the labels are not all zero, and different for each weight
      because the features differ. Symmetry only becomes a problem with interchangeable hidden units
      [^3]. The loss is convex in $(\mathbf{w}, b)$, so gradient descent reaches the same global minimum
      from any start [^2]; a huge initialization only begins with a much larger loss, so it needs more
      steps to get there.
    references:
      - source: d2l
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
      - source: d2l
        locator: Sec. 3.1.1.3 Analytic Solution
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
      - source: d2l
        locator: Sec. 5.4.1.3 Breaking the Symmetry
        url: https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html#breaking-the-symmetry
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex1
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
