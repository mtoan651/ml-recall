  - id: linear-regression-017
    type: single
    question: Which of the two linear models shown below has the **higher** Mean Squared Error (MSE) when evaluated on the plotted data points?
    figure:
      src: ./linear-regression/linear-regression-017.svg
      alt: 'Two scatter plots, each with the same line y = 2 + 0.5x and 10 points. Left: 6 points lie on the line, 2 are 1 unit above it and 2 are 1 unit below it. Right: 8 points lie on the line, 1 is 2 units above it and 1 is 2 units below it.'
    options:
      - text: The model on the left.
        why: 'The six examples on the line incur a total loss of 0. The four examples not on the line are not very far off the line, so even squaring their offset still yields a low value: $MSE = \frac{0^2 + 1^2 + 0^2 + 1^2 + 0^2 + 1^2 + 0^2 + 1^2 + 0^2 + 0^2} {10} = 0.4$'
      - text: The model on the right.
        correct: true
    explanation: 'The eight examples on the line incur a total loss of 0. However, although only two points lie off the line, both of those points are *twice* as far off the line as the outlier points in the left figure. Squared loss amplifies those differences, so an offset of two incurs a loss four times as great as an offset of one: $MSE = \frac{0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2} {10} = 0.8$ [^1]'
    references:
      - source: google-mlcc
        locator: 'Linear regression: Loss'
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/loss
    source:
      id: google-mlcc
      ref: linear-regression/loss#q1
      url: https://developers.google.com/machine-learning/crash-course/linear-regression/loss
    status: draft
  - id: linear-regression-018
    type: single
    difficulty: medium
    question: In least-squares regression with an L2 penalty $\lambda \lVert w \rVert_2^2$ (ridge regression), assume the regularized objective is minimized exactly. What can be said for certain when the regularization parameter $\lambda$ is increased?
    options:
      - text: It will never decrease the training error.
        correct: true
      - text: It will never increase the training error.
      - text: It will never decrease the testing error.
      - text: It will never increase the testing error.
    explanation: "Let $w_1$ and $w_2$ minimize $L(w) + \\lambda R(w)$ for $\\lambda_1 < \\lambda_2$, with $L$ the training squared error and $R(w) = \\lVert w \\rVert_2^2$. Comparing each optimum with the other's weights gives $R(w_2) \\le R(w_1)$ and then $L(w_1) \\le L(w_2)$: a larger $\\lambda$ buys smaller weights with training fit, so the training error can stay the same or rise but never fall. This is what d2l observes when weight decay is switched on: the training error goes up while the validation error goes down [^1]. The test error has no such guarantee: as $\\lambda$ grows the ridge fit loses flexibility, so test MSE first drops (less variance) and later rises (more bias), a U-shape [^2]."
    references:
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#using-weight-decay
        locator: Sec. 3.7.3.4 Using Weight Decay
      - title: 'James, Witten, Hastie, Tibshirani: An Introduction to Statistical Learning (1st ed., 7th printing)'
        url: https://www.statlearning.com/s/ISLR-Seventh-Printing.pdf
        locator: Sec. 6.2.1 Ridge Regression, 'Why Does Ridge Regression Improve Over Least Squares?' (Fig. 6.5), pp. 217–218
    source:
      id: mmlu-redux
      ref: machine_learning/55
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=55
    status: draft
  - id: linear-regression-019
    type: single
    difficulty: medium
    question: In building a linear regression model for a particular data set, you observe that the coefficient of one of the features has a relatively high negative value. What does this suggest?
    options:
      - text: This feature has a strong effect on the model (should be retained)
      - text: This feature does not have a strong effect on the model (should be ignored)
      - text: It is not possible to comment on the importance of this feature without additional information
        correct: true
      - text: This feature must be negatively correlated with the target when considered on its own.
    explanation: A raw coefficient is in units of the target per unit of the feature, so its size depends on the feature's scale; coefficients can only be compared as importances after the features are brought to a common scale [^1]. A coefficient also describes the feature's link to the target conditional on the other features, and correlated features make coefficients unstable and their effects hard to tease apart [^1]. So a large negative value alone shows neither that the feature matters nor that it can be ignored, and it does not even fix the sign of the feature's own correlation with the target; you need more information, such as the feature scales, the correlations and the stability of the coefficient.
    references:
      - title: 'scikit-learn examples: Common pitfalls in the interpretation of coefficients of linear models'
        url: https://scikit-learn.org/stable/auto_examples/inspection/plot_linear_model_coefficient_interpretation.html#lessons-learned
        locator: "Sections 'Interpreting coefficients: scale matters', 'The problem of correlated variables' and 'Lessons learned'"
    source:
      id: mmlu-redux
      ref: machine_learning/74
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=74
    status: draft
  - id: linear-regression-020
    type: single
    difficulty: medium
    question: Before fitting a least-squares line, you compute the correlation coefficient $r$ between the feature and the target. Which values of $r$ suggest that a straight line will fit well?
    options:
      - text: Values close to 0
      - text: Values close to +1 or −1
        correct: true
      - text: Any positive value, however small
    explanation: |
      The correlation $r$ lies between $-1$ and $+1$ and describes the strength and direction of a
      linear relationship: near $+1$ for a strong positive trend, near $-1$ for a strong negative
      one, near 0 when there is no linear trend [^1]. For a least-squares line with one predictor,
      $R^2 = r^2$, so $r = -0.9$ explains as much of the variation as $r = 0.9$ [^2]. The lesson's
      rule that a good linear model has a "high" coefficient, nearer to 1 than to 0, should be read
      as a large magnitude [^3]. A small positive $r$ means a weak linear relationship.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
        locator: Sec. 7.1.4 Describing linear relationships with correlation
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
        locator: Sec. 7.2.5 Describing the strength of a fit
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#correlation
        locator: 'Lesson: Linear and polynomial regression, sec. Correlation'
    source:
      id: ms-ml-for-beginners
      ref: quiz-13/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: linear-regression-021
    type: single
    difficulty: easy
    question: Which list contains only regression methods?
    options:
      - text: Ridge, lasso, k-means and spectral clustering
      - text: Stepwise, ridge, lasso and elastic net
        correct: true
      - text: Ridge, PCA, Isomap and elastic net
    explanation: |
      Ridge regression adds a penalty on the size of the coefficients to least squares, lasso uses a
      penalty that can set coefficients exactly to zero, and elastic net combines both penalties
      [^1]. Stepwise regression builds a regression model by entering and removing predictors one
      step at a time [^2]. The lesson names these four as the next regression techniques to study
      [^3]. scikit-learn's estimator map files k-means and spectral clustering under clustering, and
      PCA and Isomap under dimensionality reduction, so none of them predicts a numeric target [^4].
    references:
      - title: 'scikit-learn User Guide: Linear Models'
        url: https://scikit-learn.org/stable/modules/linear_model.html#ridge-regression-and-classification
        locator: Secs. 1.1.2 Ridge regression, 1.1.3 Lasso, 1.1.5 Elastic-Net
      - title: 'Penn State STAT 501: Regression Methods'
        url: https://online.stat.psu.edu/stat501/Lesson10#stepwise-regression
        locator: Lesson 10.2 Stepwise Regression
