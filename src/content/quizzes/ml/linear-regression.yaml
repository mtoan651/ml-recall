  - id: linear-regression-051
    type: short_answer
    difficulty: hard
    tags:
      - l0-regularization
      - feature-selection
      - complexity-penalty
    question: |
      L0-regularized least squares scores a weight vector by
      $f(w) = \lVert Xw - y \rVert_2^2 + \lambda \lVert w \rVert_0$, where $\lVert w \rVert_0$
      counts the non-zero weights. Two candidates are
      $w^1 = (0.8,\ 0,\ 0.03,\ 0.1)$ with squared error 4.0 and $w^2 = (0,\ 0,\ 0.22,\ 0)$ with
      squared error 6.5. Above which value of $\lambda$ does $w^2$ get the better (lower) score?
    answer:
      numeric: 1.25
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $4 + 3\lambda > 6.5 + \lambda \iff 2\lambda > 2.5 \iff \lambda > 1.25$
    explanation: |
      $\lVert w \rVert_0$ is the number of non-zero values, here 3 for $w^1$ and 1 for $w^2$ [^1].
      The scores are $4 + 3\lambda$ and $6.5 + \lambda$, equal at $\lambda = 1.25$. For larger
      $\lambda$ the penalty on each used feature outweighs $w^1$'s lower error, so L0
      regularization picks the sparser $w^2$: a larger $\lambda$ sets more weights to zero, i.e.
      discards more features [^1].
    references:
      - source: ubc-dsci573
        locator: Lecture 5 notes, L0 "norm" and the number of features used; Scoring using L0 "norm"
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/05_loss-functions-regularization_intro.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/05_loss-functions-regularization_intro.ipynb#ex5.1
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/05_loss-functions-regularization_intro.ipynb
    status: draft
  - id: linear-regression-052
    type: true_false
    difficulty: easy
    tags:
      - ridge
      - l2-regularization
      - alpha
    question: |
      You fit `Ridge` twice on the same data, once with $\alpha = 0$ and once with $\alpha = 10$,
      and get the weights $w^1 = (32.43,\ 23.14,\ 16.4)$ and $w^2 = (2.03,\ 1.2,\ 0.4)$ without
      knowing which is which. True or false: $w^1$ probably comes from $\alpha = 10$ and $w^2$ from
      $\alpha = 0$.
    options:
      - text: 'True'
        why: A larger $\alpha$ penalizes $\lVert w \rVert_2^2$ more, so the $\alpha = 10$ model should have the smaller weights, $w^2$ [^1].
      - text: 'False'
        correct: true
    explanation: |
      Ridge minimizes $\lVert Xw - y \rVert_2^2 + \alpha \lVert w \rVert_2^2$; $\alpha = 0$ is
      ordinary least squares, and increasing $\alpha$ makes the squared error go up and
      $\lVert w \rVert_2^2$ go down [^1]. So the large weights $w^1$ almost certainly come from
      $\alpha = 0$ and the shrunken weights $w^2$ from $\alpha = 10$.
    references:
      - source: ubc-dsci573
        locator: 'Lecture 6 notes, Example: L2-Regularization "Shrinking"'
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/06_L2-L1-regularization.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/05_loss-functions-regularization_intro.ipynb#ex5.2
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/05_loss-functions-regularization_intro.ipynb
    status: draft
  - id: linear-regression-053
    type: multiple
    difficulty: medium
    tags:
      - l2-regularization
      - ridge
      - sparsity
    question: |
      You add L2 regularization (ridge) with a well-chosen $\lambda > 0$ to a least-squares model.
      Which statements are true? Select all that apply.
    options:
      - text: The model becomes less sensitive to small changes in $X$
        correct: true
      - text: The model can fit the training set worse than without regularization
        correct: true
      - text: The weights shrink but all $w_j$ tend to stay non-zero
        correct: true
      - text: Many weights become exactly zero, so ridge also performs feature selection
        why: That is L1 regularization (lasso); with L2 the weights get very close to zero but not exactly zero [^2].
    explanation: |
      The L2 penalty pulls the weights towards zero, which gives a unique, more stable solution that
      is less sensitive to the data, at the cost of a higher training error than plain least squares
      [^1]. The shrinking is gradual: coefficients approach zero as $\lambda$ grows but do not reach
      it, whereas the L1 penalty drives weights to exactly zero and can be used for feature
      selection [^2].
    references:
      - source: ubc-dsci573
        locator: Lecture 6 notes, Some properties of L2-regularization; Regularization learning curves
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/06_L2-L1-regularization.ipynb
      - source: ubc-dsci573
        locator: 'Lecture 6 notes, The weights become smaller but do not become zero; L1 regularization: the weights become smaller and eventually become zero'
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/06_L2-L1-regularization.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/06_L2-L1-regularization.ipynb#ex6.1
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/06_L2-L1-regularization.ipynb
