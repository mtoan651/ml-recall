  - id: linear-regression-041
    type: multiple
    difficulty: medium
    tags:
      - ridge
      - regularization
      - target-leakage
    question: |
      You are predicting house sale prices with ridge regression. Which statements are true? Select
      all that apply.
    options:
      - text: Price per square foot would be a good feature to add to $X$
        why: Price per square foot is computed from the sale price, the very target you predict, so it leaks the answer and is not available for new houses.
      - text: Ridge's `alpha` works like logistic regression's `C`, so a higher `alpha` means a more complex model
        why: '`alpha` works in the opposite direction to `C`: a higher `alpha` means a more restricted, simpler model [^1].'
      - text: A smaller `alpha` tends to give larger coefficients and a larger `alpha` smaller ones
        correct: true
      - text: Setting `alpha` to 0 turns ridge regression into ordinary linear regression
        correct: true
    explanation: |
      `alpha` is ridge regression's complexity hyperparameter, and it is the inverse of
      `LogisticRegression`'s `C`: larger `alpha` gives smaller coefficients, predictions that are less
      sensitive to the data and less overfitting, while smaller `alpha` gives bigger coefficients [^1].
      With `alpha = 0` the penalty disappears and ridge is plain linear regression [^2]. Features
      must be available at prediction time and must not be derived from the target; price per
      square foot fails on both counts.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — Tuning alpha hyperparameter of Ridge'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Hyperparameter alpha of Ridge'
