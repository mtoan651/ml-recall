      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=4
    status: draft
  - id: linear-regression-043
    type: single
    difficulty: medium
    question: If a Durbin Watson statistic takes a value close to zero, what will be the value of the first order autocorrelation coefficient?
    options:
      - text: Close to zero
        why: A value near 2 corresponds to $\hat\rho \approx 0$, i.e. no first-order autocorrelation.
      - text: Close to plus one
        correct: true
      - text: Close to minus one
        why: An autocorrelation near $-1$ gives a statistic near 4, not near 0.
      - text: Close to either minus one or plus one
        why: The two signs sit at opposite ends of the 0–4 scale, so a value near zero is not ambiguous.
    explanation: For large samples the Durbin–Watson statistic is approximately $d \approx 2(1 - \hat\rho)$, where $\hat\rho$ is the lag-1 autocorrelation of the residuals; small values of $d$ indicate positive autocorrelation [^2]. So $d$ near 0 means $\hat\rho$ near $+1$, $d$ near 2 means no autocorrelation, and $d$ near 4 means $\hat\rho$ near $-1$. The upstream key ("close to minus one") is wrong and is corrected here [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 30
      - title: 'Wikipedia: Durbin–Watson statistic'
        url: https://en.wikipedia.org/wiki/Durbin%E2%80%93Watson_statistic
        locator: Computing and interpreting the Durbin–Watson statistic
    source:
      id: mmlu-redux
      ref: econometrics/30
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=30
    status: draft
  - id: linear-regression-044
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Which of the following assumptions about the disturbances $u_t$ are required to show the consistency, unbiasedness and efficiency of the OLS estimator?

      i) $E(u_t) = 0$

      ii) $\operatorname{Var}(u_t) = \sigma^2$

      iii) $\operatorname{Cov}(u_t, u_{t-j}) = 0$ for all $j \neq 0$

      iv) $u_t \sim N(0, \sigma^2)$
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
        correct: true
      - text: (i), (ii), (iii), and (iv)
    explanation: By the Gauss–Markov theorem, OLS is the best (minimum-variance) linear unbiased estimator when the errors have zero mean, equal variances and are uncorrelated (given exogenous regressors without perfect collinearity); the errors do not need to be normal [^2]. Normality (iv) is only needed for the exact $t$ and $F$ distributions of test statistics in small samples. The upstream statement (iii) said "for all $j$", which includes $j = 0$ and would contradict (ii); it is restricted to $j \neq 0$ here [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 54
      - title: 'Wikipedia: Gauss–Markov theorem'
        url: https://en.wikipedia.org/wiki/Gauss%E2%80%93Markov_theorem
        locator: Introduction and Statement
    source:
      id: mmlu-redux
      ref: econometrics/54
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=54
    status: draft
  - id: linear-regression-045
    type: single
    difficulty: medium
    question: What will be the properties of the OLS estimator in the presence of near (but not perfect) multicollinearity, if all the other classical assumptions hold?
    options:
      - text: It will be consistent, unbiased and efficient
        correct: true
      - text: It will be consistent and unbiased but not efficient
        why: Near multicollinearity breaks no Gauss–Markov assumption, so OLS still has the smallest variance among linear unbiased estimators; that variance is just large.
      - text: It will be consistent but not unbiased
        why: Correlated regressors do not bias OLS; bias comes from problems such as omitted variables or regressors correlated with the error.
      - text: It will not be consistent
        why: Consistency is not affected; with more data the estimates still converge to the true values.
    explanation: 'The Gauss–Markov theorem only rules out *perfect* multicollinearity, so with near multicollinearity OLS stays consistent, unbiased and efficient (BLUE) [^2]. The cost is precision: the variances and standard errors of the coefficients become large, so individual coefficients can look insignificant even when the regressors matter jointly, while predictive performance need not suffer [^2][^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 63
      - title: 'Wikipedia: Multicollinearity'
        url: https://en.wikipedia.org/wiki/Multicollinearity
        locator: Introduction; Effects on coefficient estimates
    source:
      id: mmlu-redux
      ref: econometrics/63
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=63
    status: draft
  - id: linear-regression-046
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Which of the following are plausible approaches to dealing with a model that exhibits heteroscedasticity?

      i) Take logarithms of each of the variables

      ii) Use suitably modified standard errors

      iii) Use a generalised least squares procedure

      iv) Add lagged values of the variables to the regression equation.
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
        correct: true
      - text: (i), (ii), (iii), and (iv)
    explanation: Heteroscedasticity leaves the OLS coefficients unbiased but makes them inefficient and the usual standard errors unreliable [^2]. The standard remedies are a variance-stabilising transformation such as logarithms (i), heteroscedasticity-consistent ("robust") standard errors (ii), and weighted or generalised least squares (iii) [^2]. Adding lagged values (iv) addresses residual autocorrelation or missing dynamics, not a non-constant error variance [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 75
      - title: 'Wikipedia: Homoscedasticity and heteroscedasticity'
        url: https://en.wikipedia.org/wiki/Homoscedasticity_and_heteroscedasticity
        locator: Introduction; Consequences; Correction
    source:
      id: mmlu-redux
      ref: econometrics/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=75
    status: draft
  - id: linear-regression-047
    type: single
    difficulty: easy
    question: In the linear regression model $y = X\beta + u$ with $T$ observations and $k$ regressors, what are the dimensions of $\hat{u}^\top \hat{u}$, where $\hat{u}$ is the vector of OLS residuals?
    options:
      - text: $T \times k$
        why: $T \times k$ is the shape of the regressor matrix $X$.
      - text: $T \times 1$
        why: $T \times 1$ is the shape of $\hat{u}$ itself; $\hat{u}^\top \hat{u}$ is an inner product.
      - text: $k \times 1$
        why: $k \times 1$ is the shape of the coefficient vector $\hat\beta$.
      - text: $1 \times 1$
        correct: true
    explanation: '$\hat{u} = y - X\hat\beta$ is a $T \times 1$ vector, so $\hat{u}^\top \hat{u}$ is $(1 \times T)(T \times 1) = 1 \times 1$: a scalar, the residual sum of squares $\sum_t \hat{u}_t^2$ that OLS minimises [^2]. The outer product $\hat{u}\hat{u}^\top$ would be $T \times T$ [^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 83
      - title: 'Wikipedia: Residual sum of squares'
        url: https://en.wikipedia.org/wiki/Residual_sum_of_squares
        locator: Matrix expression for the OLS residual sum of squares
    source:
      id: mmlu-redux
      ref: econometrics/83
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=83
    status: draft
  - id: linear-regression-048
    type: single
    difficulty: medium
    shuffle: false
    question: |
      If OLS is used in the presence of autocorrelated errors (the regressors are exogenous and do not include a lagged dependent variable), which of the following will be likely consequences?

      i) Coefficient estimates will be biased

      ii) Hypothesis tests could reach the wrong conclusions

      iii) Forecasts made from the model will be biased

      iv) Standard errors may be inappropriate
    options:
      - text: (ii) and (iv) only
        correct: true
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
      - text: (i), (ii), (iii), and (iv)
    explanation: Autocorrelated errors do not bias the OLS coefficients, but OLS is no longer efficient and the usual standard errors are wrong — with positive autocorrelation they tend to be too small and the $t$-statistics too large [^2]. Tests and confidence intervals can therefore mislead (ii, iv), while forecasts stay unbiased, only with wider prediction intervals than necessary (i and iii are false) [^3]. The stem excludes a lagged dependent variable, the case in which autocorrelated errors would also make OLS biased and inconsistent [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 89
      - title: 'Wikipedia: Autocorrelation'
        url: https://en.wikipedia.org/wiki/Autocorrelation#Regression_analysis
        locator: Regression analysis
      - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
        url: https://otexts.com/fpp3/regression-evaluation.html
        locator: Sec. 7.3 Evaluating the regression model, ACF plot of residuals
    source:
      id: mmlu-redux
      ref: econometrics/89
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=89
    status: draft
  - id: linear-regression-049
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Consider the OLS estimator for the standard error of the slope coefficient. Which of the following statement(s) is (are) true?

      (i) The standard error will be positively related to the residual variance

      (ii) The standard error will be negatively related to the dispersion of the observations on the explanatory variable about their mean value

      (iii) The standard error will be negatively related to the sample size

      (iv) The standard error gives a measure of the precision of the coefficient estimate.
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
      - text: (i), (ii), (iii), and (iv)
        correct: true
    explanation: In simple regression $\operatorname{SE}(\hat\beta) = s / \sqrt{\sum_t (x_t - \bar{x})^2}$ with $s^2 = \sum_t \hat{u}_t^2 / (T - 2)$ [^2]. It grows with the residual variance (i); it shrinks when the $x$ values are more spread out (ii) and as $T$ grows, because the sum in the denominator gains a term for every observation (iii); and it measures how precisely the slope is estimated (iv) [^1].
    references:
      - source: mmlu-redux
        locator: econometrics row 96
      - title: 'Wikipedia: Simple linear regression'
        url: https://en.wikipedia.org/wiki/Simple_linear_regression
        locator: Sec. 4.2.1 Variance of regressor coefficients
    source:
      id: mmlu-redux
      ref: econometrics/96
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/econometrics/test?row=96
    status: draft
  - id: linear-regression-050
    type: multiple
    difficulty: medium
    tags:
      - polynomial-features
      - model-selection
      - feature-engineering
    question: |
      You add polynomial features to a regression dataset $X$, giving an augmented dataset $Z$, and
      fit least squares $J(w) = \sum_{i=1}^n (w^\top x_i - y_i)^2$, where each $x_i$ starts with a
      constant 1 (the column-of-ones notation). Which statements are true? Select all that apply.
    options:
      - text: Linear regression on $Z$ learns a linear function of $Z$
        correct: true
      - text: The loss $J(w)$ does not depend on the bias term
        why: With a leading 1 in every $x_i$, the first weight is the bias, so $J(w)$ depends on it like on any other weight [^1].
      - text: If degrees $d$ and $d + 4$ give the same validation error, prefer degree $d$
        correct: true
      - text: With 1000 features, it is wise to start simple with one or two features to check your intuitions
        correct: true
      - text: If you trained on degree-3 features, you must compute degree-3 features of each test example to predict
        correct: true
    explanation: |
      A polynomial transformation is a change of basis: the model is still linear in its weights,
      so it is a linear function of $Z$ but a nonlinear function of $X$ [^1]. In the course's
      notation a column of ones is added to $X$, which makes the intercept one of the weights in
      $w$ [^1]. The transformation is part of the model, so test inputs must go through the same
      transformation, and among models with equal validation error the simpler one is preferred [^2].
    references:
      - source: ubc-dsci573
        locator: Lecture 3 notes, Polynomial feature transformations for non-linear regression (Matrix vector notation, Polynomial transformations)
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/03_feature-engineering.ipynb
      - source: ubc-dsci573
        locator: 'Lecture 5 notes, Complexity penalties and L0 regularization (Model selection: complexity penalty)'
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/05_loss-functions-regularization_intro.ipynb
    source:
      id: ubc-dsci573
      ref: lectures/03_feature-engineering.ipynb#ex3.2
      url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/03_feature-engineering.ipynb
