  - id: linear-regression-006
    type: single
    question: 'Suppose we have the following objective function: $\operatorname*{arg\,min}_{w} \frac{1}{2} \lVert Xw-y \rVert^2_2 + \frac{1}{2}\lambda \lVert w \rVert^2_2$. What is the gradient of $\frac{1}{2} \lVert Xw-y \rVert^2_2 + \frac{1}{2}\lambda \lVert w \rVert^2_2$ with respect to $w$?'
    options:
      - text: $\nabla_w f(w) = (X^\top X + \lambda I)w - X^\top y + \lambda w$
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + \lambda$
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + \lambda w$
        correct: true
      - text: $\nabla_w f(w) = X^\top X w - X^\top y + (\lambda+1) w$
    source:
      id: mmlu-redux
      ref: machine_learning/40
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=40
    status: draft
