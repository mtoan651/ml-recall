  - id: linear-regression-036
    type: short_answer
    difficulty: medium
    tags:
      - huber-loss
      - robustness
      - gradients
    question: |
      The Huber loss with threshold $\sigma$ is $l(r) = \frac{r^2}{2\sigma}$ for $|r| \le \sigma$ and
      $l(r) = |r| - \frac{\sigma}{2}$ otherwise, where $r = \hat y - y$ is the residual. With
      $\sigma = 2$, the derivative $dl/dr$ is {{1}} for a residual $r = 1.5$ and {{2}} for an outlier
      with $r = 500$.
    answer:
      blanks:
        - numeric: 0.75
          tolerance: 0.001
          hint: a number
        - numeric: 1
          tolerance: 0.001
          hint: a number
      model: $r/\sigma = 0.75$ inside the threshold, and $\mathrm{sign}(r) = 1$ outside it.
    explanation: |
      Inside the threshold the loss is quadratic, so the gradient $r/\sigma$ shrinks smoothly toward 0
      with the residual and SGD can settle, as with squared loss. Outside it the loss is linear, so the
      gradient never exceeds 1 in size and an outlier pulls no harder than any other badly fit point
      [^1]. The pieces meet with equal value ($\sigma/2$) and slope (1) at $|r| = \sigma$, so the loss
      is differentiable everywhere. This is the cheap combination of squared and absolute loss that
      d2l's exercises ask for [^2]; PyTorch implements exactly this form as `nn.SmoothL1Loss` with
      `beta` $= \sigma$ [^3].
    references:
      - title: 'Wikipedia: Huber loss'
        locator: Definition and Motivation
        url: https://en.wikipedia.org/wiki/Huber_loss
      - source: d2l
        locator: Sec. 3.5.6 Exercises, Exercise 2 (Huber's robust loss)
        url: https://d2l.ai/chapter_linear-regression/linear-regression-concise.html#exercises
      - title: 'PyTorch documentation: torch.nn.SmoothL1Loss'
        locator: Class description
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.SmoothL1Loss.html
      - source: d2l
        locator: Sec. 3.4.6 Exercises, Exercise 8
        url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression-scratch#ex8-b
      url: https://d2l.ai/chapter_linear-regression/linear-regression-scratch.html#exercises
