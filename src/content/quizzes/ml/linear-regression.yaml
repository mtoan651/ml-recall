  - id: linear-regression-042
    type: single
    difficulty: medium
    shuffle: false
    question: |
      Suppose that the value of $R^2$ for an estimated regression model is exactly zero. Which of the following are true?

      i) All coefficient estimates on the slopes will be zero

      ii) The fitted line will be horizontal with respect to all of the explanatory variables

      iii) The regression line has not explained any of the variability of y about its mean value

      iv) The intercept coefficient estimate must be zero.
    options:
      - text: (ii) and (iv) only
      - text: (i) and (iii) only
      - text: (i), (ii), and (iii) only
        correct: true
      - text: (i), (ii), (iii), and (iv)
    explanation: '$R^2 = 1 - SS_{\text{res}}/SS_{\text{tot}}$, so $R^2 = 0$ means the model explains none of the variation of $y$ about its mean: it does no better than always predicting $\bar{y}$ [^2]. With an intercept (and regressors that are not perfectly collinear), that happens only when every slope estimate is zero, so the fitted line is flat in every explanatory variable — statements (i)–(iii). The intercept estimate is then $\bar{y}$, which need not be zero, so (iv) is false [^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 4
      - title: 'Wikipedia: Coefficient of determination'
        url: https://en.wikipedia.org/wiki/Coefficient_of_determination
        locator: Definitions
