  - id: linear-regression-023
    type: short_answer
    difficulty: medium
    tags:
      - absolute-loss
      - median
      - outliers
    question: |
      You summarize the data $x = (1, 2, 3, 4, 15)$ by one constant $b$. Which $b$ minimizes
      $\sum_i |x_i - b|$?
    answer:
      numeric: 3
      tolerance: 0
      hint: a number
      model: The median, 3. (Squared loss would give the mean, 5.)
    explanation: |
      Moving $b$ a little changes $\sum_i |x_i - b|$ by the step size times (the number of points below
      $b$ minus the number above), so the sum is smallest where equally many points lie on each side:
      at the median [^1]. Here that is 3, and the outlier 15 does not move it. Minimizing
      $\sum_i (x_i - b)^2$ instead sets $-2\sum_i (x_i - b)$ to zero and gives the mean, 5, which the
      outlier drags upward; squared loss is sensitive to anomalous data in exactly this way [^2].
    references:
      - title: 'Wikipedia: Median'
        locator: Optimality property
        url: https://en.wikipedia.org/wiki/Median#Optimality_property
      - source: d2l
        locator: Sec. 3.1.1.2 Loss Function
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex1
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-024
    type: single
    difficulty: medium
    tags:
      - squared-loss
      - maximum-likelihood
      - normal-distribution
    question: |
      The constant $b$ that minimizes $\sum_i (x_i - b)^2$ is the sample mean. How does this relate to
      the normal distribution?
    options:
      - text: It is the maximum likelihood estimate of $\mu$ for i.i.d. data from $\mathcal{N}(\mu, \sigma^2)$
        correct: true
      - text: It holds only for normally distributed $x_i$; for other data the minimizer is the median
        why: The mean minimizes the squared loss for any data; the normal model only explains why squared loss is a natural choice [^1].
      - text: It is the maximum likelihood estimate of the variance $\sigma^2$ when the $x_i$ are i.i.d. normal
        why: $b$ estimates the center $\mu$; the variance is estimated from the squared deviations around it, and that term does not depend on $b$ [^1].
      - text: By the central limit theorem the minimizer is normally distributed, so it equals the mode
        why: The minimizer is the mean by direct calculation; the central limit theorem describes its sampling distribution, not which value minimizes the loss.
    explanation: |
      For i.i.d. normal data the negative log-likelihood is
      $\sum_i \frac{1}{2}\log(2\pi\sigma^2) + \frac{1}{2\sigma^2}(x_i - \mu)^2$. For a fixed $\sigma$
      only the squared term depends on $\mu$, so maximizing the likelihood means minimizing
      $\sum_i (x_i - \mu)^2$ [^1], and the sample mean is the maximum likelihood estimate of $\mu$. d2l
      uses the same argument to show that least-squares linear regression is maximum likelihood under
      additive Gaussian noise, with $\mu$ replaced by $\mathbf{w}^\top\mathbf{x} + b$ [^1].
    references:
      - source: d2l
        locator: Sec. 3.1.3 The Normal Distribution and Squared Loss
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#the-normal-distribution-and-squared-loss
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex1-b
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-025
    type: single
    difficulty: easy
    tags:
      - bias
      - affine-functions
      - design-matrix
    question: |
      To get rid of the separate bias, you append a constant feature 1 to every input,
      $\tilde{\mathbf{x}} = (\mathbf{x}, 1)$. Which weight vector $\tilde{\mathbf{w}}$ makes
      $\tilde{\mathbf{w}}^\top\tilde{\mathbf{x}} = \mathbf{w}^\top\mathbf{x} + b$ for all $\mathbf{x}$?
    options:
      - text: "None: an affine function can't be written as a linear one"
        why: 'It can, in one more dimension: $(\mathbf{w}, b)^\top(\mathbf{x}, 1) = \mathbf{w}^\top\mathbf{x} + b$ [^1].'
      - text: $\tilde{\mathbf{w}} = (\mathbf{w}, b)$
        correct: true
      - text: $\tilde{\mathbf{w}} = (\mathbf{w}, 1)$
        why: With last weight 1 the product adds 1, not $b$; the weight of the constant feature has to carry the bias.
      - text: $\tilde{\mathbf{w}} = (\mathbf{w} + b\mathbf{1}, 0)$
        why: Adding $b$ to every weight adds $b\sum_j x_j$, which depends on $\mathbf{x}$, instead of the constant $b$.
    explanation: |
      $(\mathbf{w}, b)^\top(\mathbf{x}, 1) = \mathbf{w}^\top\mathbf{x} + b \cdot 1$, so every affine
      function of $\mathbf{x}$ is a linear function of $(\mathbf{x}, 1)$, and conversely the last
      weight of any linear function of $(\mathbf{x}, 1)$ acts as a bias. d2l uses this to derive the
      analytic solution: it subsumes $b$ into $\mathbf{w}$ by appending a column of ones to the design
      matrix [^1]. The bias itself is needed, since without it the model could only express functions
      through the origin [^2].
    references:
      - source: d2l
        locator: Sec. 3.1.1.3 Analytic Solution
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
      - source: d2l
        locator: Sec. 3.1.1.1 Model
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#model
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex2
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-026
    type: short_answer
    difficulty: medium
    tags:
      - polynomial-features
      - parameter-count
    question: |
      You want a general quadratic function of $\mathbf{x} \in \mathbb{R}^{10}$,
      $f(\mathbf{x}) = b + \sum_i w_i x_i + \sum_{j \le i} w_{ij} x_i x_j$, and implement it as one
      linear layer applied to the features $x_i$ and all products $x_i x_j$ with $j \le i$. How many
      trainable parameters (weights plus bias) does the model have?
    answer:
      numeric: 66
      tolerance: 0
      hint: an integer
      model: $1 + 10 + 55 = 66$, with $55 = \binom{10}{2} + 10$ quadratic terms
    explanation: |
      There are 10 linear terms, and the pairs $j \le i$ give $10 \cdot 11 / 2 = 55$ quadratic terms
      (45 cross products and 10 squares), plus the bias. A layer that computes these products followed
      by a fully connected layer with one output is linear in its parameters, so it trains exactly like
      linear regression, a single-layer network on expanded inputs [^1]. The count grows fast: with $k$
      variables there are $\binom{k + d - 1}{k - 1}$ monomials of degree $d$ [^2], which is why such
      feature expansions call for regularization.
    references:
      - source: d2l
        locator: Sec. 3.1.4 Linear Regression as a Neural Network
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#linear-regression-as-a-neural-network
      - source: d2l
        locator: Sec. 3.7 Weight Decay (introduction, monomials)
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 3
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex3
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-027
    type: single
    difficulty: hard
    tags:
      - design-matrix
      - rank-deficiency
      - ridge-regression
      - noise-injection
    question: |
      Your design matrix $\mathbf{X} \in \mathbb{R}^{n \times d}$ has linearly dependent columns, so
      $\mathbf{X}^\top\mathbf{X}$ is singular. You add independent noise
      $\epsilon_{ij} \sim \mathcal{N}(0, \sigma^2)$ to every entry, giving $\mathbf{X} + \mathbf{E}$.
      What is the expected value of $(\mathbf{X} + \mathbf{E})^\top(\mathbf{X} + \mathbf{E})$?
    options:
      - text: $\mathbf{X}^\top\mathbf{X} + \sigma^2\mathbf{I}$, one noise variance per entry
        why: Entry $(j, j)$ of $\mathbf{E}^\top\mathbf{E}$ adds up $n$ squared noise terms, one per example, so its mean is $n\sigma^2$.
      - text: $\mathbf{X}^\top\mathbf{X} + d\sigma^2\mathbf{I}$, one term per feature
        why: Entry $(j, j)$ sums over the $n$ rows of column $j$, not over the $d$ features.
      - text: $\mathbf{X}^\top\mathbf{X} + n\sigma^2\mathbf{I}$, which is invertible
        correct: true
      - text: $\mathbf{X}^\top\mathbf{X}$, since the noise has mean zero
        why: 'The cross terms $\mathbf{X}^\top\mathbf{E}$ vanish in expectation, but $\mathbf{E}^\top\mathbf{E}$ does not: its diagonal sums $n$ squared noise terms.'
    explanation: |
      Expanding gives $\mathbf{X}^\top\mathbf{X} + \mathbf{X}^\top\mathbf{E} + \mathbf{E}^\top\mathbf{X} + \mathbf{E}^\top\mathbf{E}$.
      The cross terms have mean zero, and $E[(\mathbf{E}^\top\mathbf{E})_{jk}] = \sum_i E[\epsilon_{ij}\epsilon_{ik}]$
      is $n\sigma^2$ for $j = k$ and 0 otherwise. Without noise, a singular $\mathbf{X}^\top\mathbf{X}$
      means the minimizer is not unique [^1]. Adding $n\sigma^2\mathbf{I}$ makes the matrix invertible,
      just like ridge regression, which solves
      $(\mathbf{X}^\top\mathbf{X} + \lambda\mathbf{I})\mathbf{w} = \mathbf{X}^\top\mathbf{y}$ [^2]; Bishop
      showed that training with input noise is equivalent to this kind of Tikhonov regularization [^3].
    references:
      - source: d2l
        locator: Sec. 3.1.1.3 Analytic Solution
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#analytic-solution
      - title: 'Wikipedia: Ridge regression'
        locator: Overview
        url: https://en.wikipedia.org/wiki/Ridge_regression#Overview
      - source: d2l
        locator: Sec. 5.6 Dropout (introduction, Bishop 1995)
        url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 4
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex4
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-028
    type: single
    difficulty: medium
    tags:
      - laplace-noise
      - maximum-likelihood
      - absolute-loss
    question: |
      Suppose the noise in $y = \mathbf{w}^\top\mathbf{x} + b + \epsilon$ follows the Laplace density
      $p(\epsilon) = \frac{1}{2}e^{-|\epsilon|}$ instead of a Gaussian. Which loss does maximum
      likelihood estimation minimize?
    options:
      - text: The log-cosh error $\sum_i \log\cosh(y_i - \mathbf{w}^\top\mathbf{x}_i - b)$
        why: Log-cosh is a smooth stand-in for the absolute error, but the Laplace log-density is exactly $-|\epsilon| - \log 2$.
      - text: The squared error plus an $\ell_1$ penalty $\lambda\lVert\mathbf{w}\rVert_1$
        why: An $\ell_1$ penalty on the weights comes from a Laplace prior on $\mathbf{w}$, not from Laplace noise on $y$ [^3].
      - text: The squared error $\sum_i (y_i - \mathbf{w}^\top\mathbf{x}_i - b)^2$
        why: Squared error comes from Gaussian noise, whose log-density is quadratic in $\epsilon$ [^1].
      - text: The absolute error $\sum_i |y_i - \mathbf{w}^\top\mathbf{x}_i - b|$
        correct: true
    explanation: |
      The negative log-likelihood is
      $-\sum_i \log p(y_i \mid \mathbf{x}_i) = \sum_i |y_i - \mathbf{w}^\top\mathbf{x}_i - b| + n\log 2$,
      and the constant does not change the minimizer, so maximum likelihood here is least absolute
      deviations [^2]. This mirrors d2l's derivation, in which Gaussian noise leads to the squared loss
      [^1]. Unlike least squares, this problem has no closed-form solution, because the absolute value
      has a kink at zero; it is solved iteratively, for example by linear programming or subgradient
      descent [^2].
    references:
      - source: d2l
        locator: Sec. 3.1.3 The Normal Distribution and Squared Loss
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#the-normal-distribution-and-squared-loss
      - title: 'Wikipedia: Least absolute deviations'
        locator: Introduction and Solving methods
        url: https://en.wikipedia.org/wiki/Least_absolute_deviations
        quote: The LAD estimate also arises as the maximum likelihood estimate if the errors have a Laplace distribution.
      - title: 'Wikipedia: Lasso (statistics)'
        locator: Bayesian interpretation
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)#Bayesian_interpretation
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex5
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-029
    type: single
    difficulty: hard
    tags:
      - absolute-loss
      - sgd
      - learning-rate
    question: |
      You fit a linear model to the absolute loss $|y - \hat y|$ with minibatch SGD and a constant
      learning rate. What happens near the optimum?
    options:
      - text: The weights bounce around it, since each gradient keeps its size however small the residual
        correct: true
      - text: The updates shrink smoothly to zero as the residuals shrink, exactly as with squared loss
        why: With squared loss the gradient is proportional to the residual; with the absolute loss it is $\pm\mathbf{x}$ whatever the residual's size [^1].
      - text: Training halts at the first example with a zero residual, where the gradient is undefined
        why: An exactly zero residual is rare, and frameworks use a subgradient (such as 0) there; training does not stop.
      - text: The parameters diverge to infinity, like plain SGD with a learning rate that is too large
        why: Each step has size at most $\eta\lVert\mathbf{x}\rVert$, so the iterates stay near the optimum; they just do not settle.
    explanation: |
      The derivative of $|r|$ is $\mathrm{sign}(r)$, so each example contributes $\pm\mathbf{x}$ to the
      gradient no matter how close its prediction is; with squared loss the contribution
      $r\mathbf{x}$ shrinks with the residual [^1]. Near the minimum the residuals have mixed signs, the
      minibatch gradient does not go to zero, and a constant step keeps the parameters bouncing around
      the optimum. There are two fixes: let the learning rate decay as training goes on [^2], or smooth
      the kink, as the Huber loss does by being quadratic for small residuals [^3].
    references:
      - source: d2l
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
      - title: 'Wikipedia: Huber loss'
        locator: Definition and Motivation
        url: https://en.wikipedia.org/wiki/Huber_loss
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex5-b
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    status: draft
  - id: linear-regression-030
    type: short_answer
    difficulty: medium
    tags:
      - linear-layers
      - composition
      - affine-functions
    question: |
      Two linear layers are composed without an activation function in between,
      $\mathbf{h} = \mathbf{W}_1\mathbf{x} + \mathbf{b}_1$ and $o = \mathbf{w}_2^\top\mathbf{h} + b_2$,
      with

      $$\mathbf{W}_1 = \begin{bmatrix} 1 & 2 \\ 0 & 1 \\ -1 & 1 \end{bmatrix},\quad \mathbf{b}_1 = \begin{bmatrix} 1 \\ 0 \\ 2 \end{bmatrix},\quad \mathbf{w}_2 = \begin{bmatrix} 1 \\ -1 \\ 2 \end{bmatrix},\quad b_2 = 0.5.$$

      The pair computes the single layer $o = \mathbf{w}^\top\mathbf{x} + b$ with $\mathbf{w} =$
      ( {{1}} , {{2}} ) and $b =$ {{3}}.
    answer:
      blanks:
        - numeric: -1
          tolerance: 0
          hint: a number
        - numeric: 3
          tolerance: 0
          hint: a number
        - numeric: 5.5
          tolerance: 0.001
          hint: a number
      model: $\mathbf{w}^\top = \mathbf{w}_2^\top\mathbf{W}_1 = (-1, 3)$ and $b = \mathbf{w}_2^\top\mathbf{b}_1 + b_2 = 5.5$
    explanation: |
      Substituting gives $o = \mathbf{w}_2^\top\mathbf{W}_1\mathbf{x} + \mathbf{w}_2^\top\mathbf{b}_1 + b_2$,
      again an affine function of $\mathbf{x}$ [^1]. Here
      $\mathbf{w}_2^\top\mathbf{W}_1 = (1 - 0 - 2,\; 2 - 1 + 2) = (-1, 3)$ and
      $\mathbf{w}_2^\top\mathbf{b}_1 + b_2 = 1 - 0 + 4 + 0.5 = 5.5$. So the two-layer stack expresses
      nothing that one linear layer cannot, while it has 13 parameters instead of 3. A nonlinear
      activation between the layers is what prevents this collapse [^1].
    references:
      - source: d2l
        locator: Sec. 5.1.1.3 From Linear to Nonlinear
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        quote: An affine function of an affine function is itself an affine function.
      - source: d2l
        locator: Sec. 3.1.6 Exercises, Exercise 6
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/linear-regression#ex6
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html#exercises
