  - id: linear-regression-037
    type: short_answer
    difficulty: medium
    tags:
      - l1-regularization
      - weight-decay
      - sparsity
    question: |
      You minimize $L(\mathbf{w}) + \lambda\sum_i |w_i|$ ($\ell_1$ regularization) by gradient descent
      with learning rate $\eta = 0.1$ and $\lambda = 0.2$. A weight has value $w = 0.5$, and the data
      loss gives it the gradient $\partial L / \partial w = 0$. What is $w$ after one update?
    answer:
      numeric: 0.48
      tolerance: 0.0005
      hint: a number
      model: $w - \eta(\partial L/\partial w + \lambda\,\mathrm{sign}(w)) = 0.5 - 0.1 \times 0.2 = 0.48$
    explanation: |
      The (sub)gradient of $\lambda|w|$ is $\lambda\,\mathrm{sign}(w)$, so $\ell_1$ regularization
      moves every nonzero weight toward zero by the constant amount $\eta\lambda = 0.02$, whatever its
      size. Weight decay with penalty $\frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$ instead multiplies
      the weight by $1 - \eta\lambda$ [^1], here $0.5 \times 0.98 = 0.49$: it shrinks large weights a
      lot and small ones hardly at all. The constant pull is why $\ell_1$ drives unhelpful weights to
      exactly zero and selects features [^1]; in practice a step that would cross zero is set to zero
      (soft thresholding) instead of overshooting [^2].
    references:
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
      - title: 'Wikipedia: Lasso (statistics)'
        locator: Basic form, Orthonormal covariates (soft thresholding)
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)#Orthonormal_covariates
      - source: d2l
        locator: Sec. 3.7.6 Exercises, Exercise 3
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/weight-decay#ex3
      url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    status: draft
  - id: linear-regression-038
    type: single
    difficulty: easy
    tags:
      - frobenius-norm
      - trace
      - weight-decay
    question: |
      For vectors, $\lVert\mathbf{w}\rVert^2 = \mathbf{w}^\top\mathbf{w}$. Which expression equals the
      squared Frobenius norm $\lVert\mathbf{W}\rVert_F^2$ of a matrix $\mathbf{W}$?
    options:
      - text: $\det(\mathbf{W}^\top\mathbf{W})$, the determinant
        why: The determinant multiplies the eigenvalues; for $\mathbf{W} = \begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$ it is 4, while the sum of squares is 30.
      - text: $\mathbf{1}^\top\mathbf{W}\mathbf{1}$, the sum of all entries
        why: It adds up the entries without squaring them, so positive and negative entries can cancel.
      - text: $\lambda_{\max}(\mathbf{W}^\top\mathbf{W})$, the largest eigenvalue
        why: That is the squared spectral norm; the squared Frobenius norm adds up all eigenvalues of $\mathbf{W}^\top\mathbf{W}$, not only the largest [^2].
      - text: $\operatorname{tr}(\mathbf{W}^\top\mathbf{W})$, the trace
        correct: true
    explanation: |
      The squared Frobenius norm is the sum of the squares of all entries [^1]. Diagonal entry $j$ of
      $\mathbf{W}^\top\mathbf{W}$ is $\sum_i w_{ij}^2$, the squared length of column $j$, so the trace
      adds up every squared entry: $\lVert\mathbf{W}\rVert_F^2 = \operatorname{tr}(\mathbf{W}^\top\mathbf{W})$
      [^2]. For $\mathbf{W} = \begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$ both give 30. This is the
      penalty weight decay applies to each weight matrix of a network [^3].
    references:
      - source: d2l
        locator: Sec. 2.3.11 Norms (Frobenius norm)
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#norms
      - title: 'Wikipedia: Matrix norm'
        locator: Frobenius norm
        url: https://en.wikipedia.org/wiki/Matrix_norm#Frobenius_norm
      - source: d2l
        locator: Sec. 5.3.1 Forward Propagation (regularization term)
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#forward-propagation
      - source: d2l
        locator: Sec. 3.7.6 Exercises, Exercise 4
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    source:
      id: d2l
      ref: chapter_linear-regression/weight-decay#ex4
      url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    status: draft
  - id: linear-regression-039
    type: single
    difficulty: medium
    tags:
      - weight-decay
      - map-estimation
      - gaussian-prior
    question: |
      Minimizing $-\log P(\text{data} \mid \mathbf{w}) - \log P(\mathbf{w})$ finds the most probable
      weights a posteriori (MAP). Which prior $P(\mathbf{w})$ makes $-\log P(\mathbf{w})$ equal to the
      weight-decay penalty $\frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$, up to a constant?
    options:
      - text: A Gaussian centered at the least-squares weights
        why: The penalty pulls the weights toward zero, so the prior must be centered at zero, and a prior cannot depend on the data.
      - text: A zero-mean Gaussian, $\mathbf{w} \sim \mathcal{N}(\mathbf{0}, \lambda^{-1}\mathbf{I})$
        correct: true
      - text: A zero-mean Laplace prior, $P(\mathbf{w}) \propto \exp(-\lambda\lVert\mathbf{w}\rVert_1)$
        why: Its negative log is $\lambda\lVert\mathbf{w}\rVert_1$, the lasso ($\ell_1$) penalty [^3].
      - text: A uniform prior over all weight vectors
        why: A flat prior only adds a constant, so MAP reduces to maximum likelihood with no penalty at all.
    explanation: |
      With $P(\mathbf{w}) \propto \exp(-\frac{\lambda}{2}\lVert\mathbf{w}\rVert^2)$ the negative log
      prior is $\frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$ plus a constant, exactly the term weight decay
      adds to the loss [^1]. That density is a Gaussian with mean 0 and variance $1/\lambda$ for each
      weight, so a larger $\lambda$ expresses a firmer belief that the weights are small; ridge
      regression is the MAP estimate under such a prior [^2]. A Laplace prior gives the $\ell_1$
      penalty of the lasso instead [^3].
    references:
      - source: d2l
        locator: Sec. 3.7.1 Norms and Weight Decay
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
      - title: 'Wikipedia: Ridge regression'
        locator: Bayesian interpretation
        url: https://en.wikipedia.org/wiki/Ridge_regression#Bayesian_interpretation
      - title: 'Wikipedia: Lasso (statistics)'
        locator: Bayesian interpretation
        url: https://en.wikipedia.org/wiki/Lasso_(statistics)#Bayesian_interpretation
      - source: d2l
        locator: Sec. 3.7.6 Exercises, Exercise 6
        url: https://d2l.ai/chapter_linear-regression/weight-decay.html#exercises
    source:
      id: d2l
