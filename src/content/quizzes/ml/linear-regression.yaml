        locator: 'Lesson: Linear and polynomial regression, sec. Review & Self Study'
      - title: 'scikit-learn User Guide: Choosing the right estimator'
        url: https://scikit-learn.org/stable/machine_learning_map.html
        locator: Estimator map (clustering, regression and dimensionality-reduction branches)
    source:
      id: ms-ml-for-beginners
