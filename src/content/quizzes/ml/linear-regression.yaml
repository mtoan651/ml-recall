  - id: linear-regression-040
    type: multiple
    difficulty: easy
    tags:
      - ridge
      - regularization
      - parameters
    question: Which statements about linear regression and ridge regression are true? Select all that apply.
    options:
      - text: Increasing ridge regression's hyperparameter `alpha` is likely to decrease model complexity
        correct: true
      - text: Ridge regression can be used on datasets with many features
        correct: true
      - text: Ridge regression learns one coefficient per training example
        why: It learns one coefficient per *feature*, plus an intercept, however many examples there are [^2].
      - text: A linear regression model with 2 features learns 3 parameters, one weight per feature plus a bias
        correct: true
    explanation: |
      A linear regression model predicts $\hat y = w_1x_1 + \dots + w_dx_d + b$: one learned weight
      per feature plus a bias, so $d = 2$ features give 3 parameters, and the same formula works
      for any number of features [^1][^2]. Ridge regression is linear regression with a complexity
      hyperparameter `alpha`: larger `alpha` is more likely to underfit, smaller `alpha` more likely
      to overfit [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 7: Linear Models — Generalizing to more features'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/07_linear-models.ipynb
