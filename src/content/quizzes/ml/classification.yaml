schema_version: 1
domain: ml
topic: classification
title: Classification
questions:
  - id: classification-001
    type: single
    difficulty: easy
    question: Classification is a form of supervised learning that has a lot in common with
    options:
      - text: Time Series
      - text: Regression techniques
        correct: true
      - text: Natural language processing
    explanation: |
      The lesson introduces classification as a supervised technique that has a lot in common with
      regression: both learn from labeled examples to map input variables to an output [^1]. What
      differs is the target. Regression answers "how much?" with a number, classification answers
      "which one?" with a category, and many techniques carry over from one to the other [^2]. Time
      series and natural language processing (NLP) are kinds of data and application areas, not a
      sibling family of supervised methods.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md
        locator: 'Lesson: Classification 1, introduction'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#classification
        locator: Sec. 1.3.1.2 Classification
    source:
      id: ms-ml-for-beginners
      ref: quiz-19/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-002
    type: single
    difficulty: easy
    question: What is a multiclass question?
    options:
      - text: the task of classifying each data point into several classes at once
      - text: the task of classifying data points into one of several classes
        correct: true
      - text: the task of cleaning data points in multiple ways
    explanation: |
      A multiclass problem has more than two possible classes, and each data point gets exactly one
      of them. The cuisine dataset is multiclass because a recipe belongs to one of several national
      cuisines [^1][^2]. Putting the same data point into several classes at once is a different
      task: when an example can be assigned to multiple classes, the problem is multi-label
      classification [^2]. Cleaning data is a preparation step that comes before modeling, not a type
      of question [^1].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#hello-classifier
        locator: "Lesson: Classification 1, Hello 'classifier' and Exercise - clean and balance your data"
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/multiclass
        locator: 'Classification: Multi-class classification'
    source:
      id: ms-ml-for-beginners
      ref: quiz-20/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-003
    type: single
    difficulty: easy
    question: Classification is a type of
    options:
      - text: NLP
      - text: Supervised Learning
        correct: true
      - text: Unsupervised Learning
    explanation: |
      Classification learns from labeled examples, where the label is the class to predict, and that
      is what makes it supervised learning. Scikit-learn files all of its classifiers under
      supervised learning [^1][^2]. Unsupervised learning works with unlabeled data and looks for
      structure such as clusters, so it has no classes to learn from [^2]. NLP is an application area
      that may use classifiers, not a kind of learning.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#choosing-your-classifier
        locator: 'Lesson: Classification 2, Choosing your classifier'
      - source: d2l
        url: https://d2l.ai/chapter_introduction/index.html#supervised-learning
        locator: Sec. 1.3.1 Supervised Learning (1.3.1.2 Classification) and Sec. 1.3.2 Unsupervised and Self-Supervised Learning
    source:
      id: ms-ml-for-beginners
      ref: quiz-21/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-004
    type: single
    difficulty: easy
    question: What is a 'solver'?
    options:
      - text: the loss function that training minimizes
      - text: the algorithm to use in the optimization problem
        correct: true
      - text: a machine learning technique
    explanation: |
      In scikit-learn's `LogisticRegression`, the `solver` parameter names the optimization algorithm
      that fits the model's weights, for example `lbfgs` (the default) or `liblinear` [^1][^2]. The
      choice matters because not every solver supports every multiclass setting [^1]. The solver is
      not the loss function: the loss is the objective, and the solver is the procedure that
      minimizes it. Nor is it a machine learning technique of its own; it is one setting of a
      technique.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#using-scikit-learn
        locator: 'Lesson: Classification 2, Using Scikit-learn'
      - title: 'scikit-learn API reference: LogisticRegression'
        url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html#sklearn.linear_model.LogisticRegression
        locator: 'Parameters: solver'
        quote: Algorithm to use in the optimization problem. Default is ‘lbfgs’.
    source:
      id: ms-ml-for-beginners
      ref: quiz-22/q1
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-005
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - decision-threshold
    question: A spam detector outputs the probability $p = 0.8$ and flags spam whenever $p \ge 0.5$. What happens to this email?
    options:
      - text: It is classified as legitimate.
        why: $0.8 \ge 0.5$, so the rule says spam.
      - text: It is classified as spam.
        correct: true
      - text: The threshold is raised to 0.8.
        why: The threshold is fixed by the rule; comparing does not change it.
      - text: The probability is lowered to 0.5.
        why: Applying a threshold does not change the predicted probability.
    explanation: Because $0.8 \ge 0.5$, the rule assigns the spam class. A threshold converts a probability into a decision without changing the probability itself [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 65–66
    source:
      id: ncu-intro-dl
      ref: exercise-01/q16
    status: reviewed
  - id: classification-006
    type: true_false
    difficulty: easy
    question: 'True or false: in a recipe dataset used to predict the cuisine, dropping ingredients such as rice, garlic and ginger, which are common in recipes of every cuisine, can help the classifier.'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      True. The lesson plots the most common ingredients of each cuisine, sees that rice, garlic and
      ginger are popular everywhere, and drops these columns because they create confusion between
      cuisines instead of telling them apart [^1]. A feature that looks the same in every class
      carries little information about the class. Univariate feature selection makes the same idea
      systematic: it scores each feature with a statistical test against the target and keeps only
      the best-scoring ones [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#discovering-ingredients
        locator: 'Lesson: Introduction to classification, sec. Discovering ingredients'
      - title: 'scikit-learn User Guide: Feature selection'
        url: https://scikit-learn.org/stable/modules/feature_selection.html#univariate-feature-selection
        locator: Sec. 1.13.2 Univariate feature selection
    source:
      id: ms-ml-for-beginners
      ref: quiz-20/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-007
    type: multiple
    difficulty: easy
    question: Which of these are sensible ways to choose a classifier for a new problem? Select all that apply.
    options:
      - text: Use a guide such as an algorithm cheat sheet to shortlist classifiers that suit your data
        correct: true
      - text: Try several candidates and compare them on held-out validation data
        correct: true
      - text: Always use the most complex model available, such as a deep neural network
      - text: Pick the classifier with the highest accuracy on its own training data
    explanation: |
      The lesson suggests both: run several classifiers and compare the results, and, better than
      guessing, follow a cheat sheet that maps kinds of problems to suitable algorithms [^1]. It also
      rules out neural networks for its small, clean dataset as too heavy, so the most complex model
      is not automatically the best choice [^1]. Candidates must be compared on examples they were
      not trained on: MLCC splits the data into training, validation and test sets and stresses that
      testing on different examples is stronger proof of a model's fitness than testing on the
      training examples [^2].
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#what-classifier-to-go-with
        locator: 'Lesson: Cuisine classifiers 1, secs. What classifier to go with?, A better approach and Reasoning'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#training_validation_and_test_sets
        locator: 'Datasets: Dividing the original dataset, Training, validation, and test sets'
    source:
      id: ms-ml-for-beginners
      ref: quiz-21/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-008
    type: single
    difficulty: medium
    question: Which of these is a strategy for applying a binary classifier to a problem with more than two classes, rather than a classification algorithm itself?
    options:
      - text: Logistic regression
      - text: Decision-tree classification
      - text: One-vs-rest (one-vs-all)
        correct: true
    explanation: |
      One-vs-rest, also called one-vs-all, fits one classifier per class, each trained to separate
      its class from all the others. It wraps any binary classifier, which is why scikit-learn
      provides it as a meta-estimator, `OneVsRestClassifier` [^1]. Logistic regression and decision
      trees are classification algorithms. The lesson's model is a logistic regression run with the
      one-vs-rest scheme, because logistic regression is designed for binary problems and the
      cuisine task has five classes [^2].
    references:
      - title: 'scikit-learn User Guide: Multiclass and multioutput algorithms'
        url: https://scikit-learn.org/stable/modules/multiclass.html#ovr-classification
        locator: Sec. 1.12.1.2 OneVsRestClassifier
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#using-scikit-learn
        locator: 'Lesson: Cuisine classifiers 1, sec. Using Scikit-learn'
    source:
      id: ms-ml-for-beginners
      ref: quiz-22/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: classification-009
    type: single
    difficulty: easy
    question: How do you check whether a trained classifier is working as expected?
    options:
      - text: Measure its predictions (accuracy, precision, recall) on held-out test data
        correct: true
      - text: Check that its predictions agree with those of several other algorithms on the same data
      - text: Look up how well this type of algorithm has done on similar problems in published studies
    explanation: |
      A model is evaluated on data it has never seen: the lesson's workflow uses the test data for
      this [^1], and the cuisine lesson scores its classifier on the test split and prints a
      classification report with precision, recall and F1 for each class [^2]. Agreement with other
      algorithms says nothing about correctness, since several models can make the same mistakes.
      How an algorithm did on other problems does not show how this trained model does on your data.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#evaluate-the-model
        locator: 'Lesson: Techniques of Machine Learning, sec. Evaluate the model'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#exercise---apply-logistic-regression
        locator: 'Lesson: Cuisine classifiers 1, sec. Exercise - apply logistic regression'
    source:
