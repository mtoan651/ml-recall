  - id: classification-016
    type: single
    difficulty: medium
    tags:
      - decision-theory
      - expected-loss
      - bayes-optimal
    question: |
      In a multiclass problem, $l(y, y')$ is the penalty for predicting $y'$ when the true class is
      $y$, and the model provides $p(y \mid x)$. Which rule gives the prediction with the smallest
      expected penalty?
    options:
      - text: $\hat y = \operatorname*{arg\,min}_{y'} \sum_y l(y, y')\,p(y \mid x)$
        correct: true
      - text: $\hat y = \operatorname*{arg\,max}_{y} p(y \mid x)$
        why: This is optimal only for the 0–1 loss, where every mistake costs the same.
      - text: $\hat y = \operatorname*{arg\,min}_{y'} \sum_y l(y, y')$
        why: It ignores $p(y \mid x)$, so the prediction would not depend on the input at all.
      - text: $\hat y = \operatorname*{arg\,max}_{y'} \sum_y l(y, y')\,p(y \mid x)$
        why: That picks the prediction with the largest expected penalty.
    explanation: |
      Given $x$, the true class is random with distribution $p(y \mid x)$, so predicting $y'$ has
      expected penalty $\sum_y l(y, y')\,p(y \mid x)$, and the optimal (Bayes) decision minimizes it
      over $y'$ [^1]. For the 0–1 loss, with $l(y, y') = 1$ whenever $y \neq y'$, the expected penalty
      is $1 - p(y' \mid x)$, so the rule reduces to choosing the most probable class, which is how d2l
      turns probabilities into hard predictions for accuracy [^2]. Unequal costs, such as missing a
      disease versus raising a false alarm, move the decision away from the most probable class.
    references:
      - title: 'Wikipedia: Bayes estimator'
        locator: Definition (minimizing the posterior expected loss)
        url: https://en.wikipedia.org/wiki/Bayes_estimator
      - source: d2l
        locator: Sec. 4.3.2 Accuracy
        url: https://d2l.ai/chapter_linear-classification/classification.html#accuracy
      - source: d2l
        locator: Sec. 4.3.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_linear-classification/classification.html#exercises
    source:
      id: d2l
      ref: chapter_linear-classification/classification#ex3-b
      url: https://d2l.ai/chapter_linear-classification/classification.html#exercises
    status: draft
  - id: classification-017
    type: single
    difficulty: medium
    tags:
      - naive-bayes
      - bayes-rule
      - text-classification
    question: |
      You want $P(\text{spam} \mid \text{message})$ for a new SMS. Why not estimate it, or
      $P(\text{message} \mid \text{spam})$, by counting how often that exact message occurs among
      the spam and ham messages of the training set?
    options:
      - text: Most messages are unique, so the counts would almost always be zero
        correct: true
      - text: Bayes' rule cannot be applied to text data
        why: Naive Bayes is exactly Bayes' rule applied to text; the problem is estimating the likelihood, not using the rule [^1].
      - text: The counts would give probabilities that do not sum to 1 over the classes
        why: Relative frequencies over the classes always sum to 1; the issue is that there are almost no counts at all [^1].
      - text: Spam labels are too noisy for counting to work
        why: Label noise is not the obstacle; even perfectly labelled data rarely contains the same message twice [^1].
    explanation: |
      A whole message is one point in an enormous space of word sequences, so estimating
      $P(\text{message} \mid \text{spam})$ directly, word by word given all previous words, needs a
      huge number of parameters and an impossibly large training set [^1]. Naive Bayes makes this
      tractable with two assumptions: a bag-of-words representation and conditional independence of
      the words given the class, so only per-word probabilities have to be counted [^1].
    references:
      - source: ubc-dsci571
        locator: Lecture 7 notes, Exercise 7.1.3 Calculating P(spam | message) and P(ham | message), and the slides that follow
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    source:
      id: ubc-dsci571
      ref: lectures/notes/07_naive-Bayes.ipynb#ex7.1.3
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    status: draft
  - id: classification-018
    type: multiple
    difficulty: medium
    tags:
      - naive-bayes
      - bernoulli-nb
      - conditional-independence
    question: |
      A Bernoulli naive Bayes spam filter uses binary features for $d$ vocabulary words (present or
      absent). Which statements are true? Select all that apply.
    options:
      - text: For the two classes it has to estimate $2d + 1$ probabilities
        correct: true
      - text: It should only be used if the words really are conditionally independent given the class
        why: The independence assumption is strong and often unrealistic, yet naive Bayes still works well in practice, e.g. in spam filtering [^1].
      - text: Naive Bayes can only be used when all features are binary
        why: Multinomial naive Bayes uses word counts and Gaussian naive Bayes handles continuous features [^2].
      - text: Dropping the shared denominator $P(\text{message})$ does not change which class gets the higher score
        correct: true
    explanation: |
      Per word and class it needs $P(w = 1 \mid c)$, since $P(w = 0 \mid c) = 1 - P(w = 1 \mid c)$;
      that is $2d$ numbers, plus one prior $P(\text{spam})$, as $P(\text{ham}) = 1 - P(\text{spam})$
      [^1]. $P(\text{message})$ is the same for both classes, so ignoring it changes the scores but
      not their ranking [^1]. The "naive" assumption is rarely true, which makes the probability
      estimates poor, but the predicted class is often still right [^2].
    references:
      - source: ubc-dsci571
        locator: Lecture 7 notes, Naive Bayes predict; Naive Bayes classifier fit (Prior and Conditional probabilities)
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
      - source: ubc-dsci571
        locator: Lecture 7 notes, Naive Bayes with continuous features; Summary and final remarks
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    source:
      id: ubc-dsci571
      ref: lectures/notes/07_naive-Bayes.ipynb#ex7.2
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    status: draft
  - id: classification-019
    type: short_answer
    difficulty: medium
    tags:
      - naive-bayes
      - bernoulli-nb
      - worked-example
    question: |
      Six training SMS are encoded by whether four words occur:

      | message | block | free | prize | urgent | label |
      | --- | --- | --- | --- | --- | --- |
      | 1 | 0 | 0 | 1 | 1 | spam |
      | 2 | 0 | 1 | 0 | 1 | ham |
      | 3 | 1 | 0 | 0 | 0 | ham |
      | 4 | 0 | 1 | 1 | 1 | spam |
      | 5 | 0 | 1 | 0 | 0 | spam |
      | 6 | 1 | 0 | 0 | 0 | ham |

      A Bernoulli naive Bayes model is fit by plain counting (no smoothing). The new message
      "URGENT! Free!!" has block = 0, free = 1, prize = 0, urgent = 1. What is
      $P(\text{spam} \mid \text{message})$ after normalizing the two class scores?
    answer:
      numeric: 0.8
      tolerance: 0.001
      hint: a probability, e.g. 0.65
      model: 'spam: $\frac{3}{6}\cdot\frac33\cdot\frac23\cdot\frac13\cdot\frac23 = \frac{2}{27}$; ham: $\frac{3}{6}\cdot\frac13\cdot\frac13\cdot\frac33\cdot\frac13 = \frac{1}{54}$; $\frac{2/27}{2/27 + 1/54} = 0.8$'
    explanation: |
      Naive Bayes scores each class by $P(c)\prod_i P(x_i \mid c)$, with every probability
      estimated by counting [^1]. For spam: $P(\text{spam}) = 3/6$, $P(\text{block}=0) = 3/3$,
      $P(\text{free}=1) = 2/3$, $P(\text{prize}=0) = 1/3$, $P(\text{urgent}=1) = 2/3$, product
      $0.0741$. For ham the factors are $3/6, 1/3, 1/3, 3/3, 1/3$, product $0.0185$ [^1].
      Dividing by their sum gives $0.8$ for spam and $0.2$ for ham. Absent words count too, through
      $P(x_i = 0 \mid c)$.
    references:
      - source: ubc-dsci571
        locator: 'Lecture 7 notes, Naive Bayes predict (worked example: computing prior and conditional probabilities)'
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    source:
      id: ubc-dsci571
      ref: lectures/notes/07_naive-Bayes.ipynb#nb-predict-example
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    status: draft
  - id: classification-020
    type: short_answer
    difficulty: hard
    tags:
      - naive-bayes
      - laplace-smoothing
      - bernoulli-nb
    question: |
      Six training SMS are encoded by whether four words occur:

      | message | block | free | prize | urgent | label |
      | --- | --- | --- | --- | --- | --- |
      | 1 | 0 | 0 | 1 | 1 | spam |
      | 2 | 0 | 1 | 0 | 1 | ham |
      | 3 | 1 | 0 | 0 | 0 | ham |
      | 4 | 0 | 1 | 1 | 1 | spam |
      | 5 | 0 | 1 | 0 | 0 | spam |
      | 6 | 1 | 0 | 0 | 0 | ham |

      The message "urgent free block" has block = 1, free = 1, prize = 0, urgent = 1. "block" never
      occurs in a spam message, so plain counting gives spam a score of 0. With Laplace smoothing
      for a Bernoulli model, $P(x_i = 1 \mid c) = \frac{\text{count}(x_i = 1, c) + 1}{\text{count}(c) + 2}$,
      and unsmoothed priors, what is $P(\text{spam} \mid \text{message})$?
    answer:
      numeric: 0.273
      tolerance: 0.002
      hint: a probability, 3 decimals
      model: 'spam: $\frac12\cdot\frac15\cdot\frac35\cdot\frac25\cdot\frac35 = 0.0144$; ham: $\frac12\cdot\frac35\cdot\frac25\cdot\frac45\cdot\frac25 = 0.0384$; $\frac{0.0144}{0.0528} \approx 0.273$'
    explanation: |
      Without smoothing, one zero factor wipes out all other evidence for a class [^1]. Laplace
      smoothing adds one pseudo-count for "present" and one for "absent" per word and class, hence
      $+2$ in the denominator of the Bernoulli model [^1]. For spam the smoothed factors are
      $P(\text{block}=1) = 1/5$, $P(\text{free}=1) = 3/5$, $P(\text{prize}=0) = 2/5$,
      $P(\text{urgent}=1) = 3/5$; for ham they are $3/5, 2/5, 4/5, 2/5$. With priors $1/2$ the
      normalized spam probability is $0.0144 / (0.0144 + 0.0384) \approx 0.273$, so the message is
      classified as ham. scikit-learn's `BernoulliNB(alpha=1)` uses the same formula [^2].
    references:
      - source: ubc-dsci571
        locator: Lecture 7 notes, Laplace smoothing; (Optional) Details on the formulas
        url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
      - title: 'scikit-learn User Guide: 1.9.4 Bernoulli Naive Bayes'
        url: https://scikit-learn.org/stable/modules/naive_bayes.html#bernoulli-naive-bayes
        locator: Sec. 1.9.4 Bernoulli Naive Bayes
    source:
      id: ubc-dsci571
      ref: lectures/notes/07_naive-Bayes.ipynb#laplace-smoothing-example
      url: https://github.com/UBC-MDS/DSCI_571_sup-learn-1/blob/70be2d76ec40e11fe7ddcff2a8c9e602a2698129/lectures/notes/07_naive-Bayes.ipynb
    status: draft
  - id: classification-021
    type: single
    difficulty: medium
    tags:
      - text-classification
      - sparse-features
      - linear-models
    question: |
      You classify documents with bag-of-words features: 200,000 columns, almost all zeros in every
      row. Why is logistic regression usually a better first choice than gradient-boosted trees here?
    options:
      - text: Logistic regression captures interactions between words that trees cannot
        why: Plain logistic regression is additive in the features; trees are the ones that model interactions.
      - text: It scales to many sparse columns and suits text where many words each add a little evidence
        correct: true
      - text: Trees need dense one-hot inputs, so you would first have to convert the sparse matrix into a dense one
        why: Many tree libraries accept sparse input; the problem is that each split looks at one rare word at a time.
      - text: Gradient-boosted trees cannot be trained on more than a few thousand features
        why: Boosting libraries accept many features; the issue is cost and fit, not a hard limit.
    explanation: |
      Bag-of-words matrices are wide and sparse, and a linear model's training cost grows with the
      number of non-zero entries, so it scales easily to hundreds of thousands of word columns [^1][^2].
      Text classes are often well separated by summing small contributions of many words, which is
      exactly what a linear model does, while a tree can only split on one (mostly zero) word column at
      a time [^1]. Trees become more attractive with dense features such as embeddings.
    references:
      - title: 'scikit-learn: Classification of text documents using sparse features'
        url: https://scikit-learn.org/stable/auto_examples/text/plot_document_classification_20newsgroups.html
        locator: Benchmarking classifiers (linear models are fast and accurate on sparse text features)
      - source: ds-interviews
        locator: theory.md, Text classification — "Would you prefer gradient boosting trees model or logistic regression when doing text classification with bag of words?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#text-classification
    source:
      id: ds-interviews
      ref: theory.md#q126
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#text-classification
    status: draft
