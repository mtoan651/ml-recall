topic: metrics
title: Evaluation Metrics
questions:
  - id: metrics-001
    type: single
    difficulty: easy
    question: 'A confusion matrix is also known as a:'
    options:
      - text: error matrix
        correct: true
      - text: truth matrix
      - text: accuracy matrix
    explanation: |
      A confusion matrix sets a classifier's predictions against the true labels and counts the true
      and false positives and negatives [^1][^2]. Because it lays out exactly where the model makes
      its mistakes, it is also called an error matrix [^1]. "Truth matrix" and "accuracy matrix" are
      not standard names for it.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#better-comprehension-via-a-confusion-matrix
        locator: 'Lesson: Logistic Regression, Better comprehension via a confusion matrix'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding#confusion_matrix
        locator: 'Classification: Thresholds and the confusion matrix, Confusion matrix'
    source:
      id: ms-ml-for-beginners
      ref: quiz-16/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: metrics-002
    type: single
    difficulty: easy
    question: 'A good model will have:'
    options:
      - text: a large number of false positives and true negatives in its confusion matrix
      - text: a large number of true positives and true negatives in its confusion matrix
        correct: true
      - text: a large number of true positives and false negatives in its confusion matrix
    explanation: |
      True positives and true negatives are the correct predictions: actual positives labeled
      positive and actual negatives labeled negative [^1]. A good model has many of these and few
      false positives and false negatives [^2]. Any combination that includes many false positives or
      false negatives describes a model that makes many mistakes.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding#confusion_matrix
        locator: 'Classification: Thresholds and the confusion matrix, Confusion matrix'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#better-comprehension-via-a-confusion-matrix
        locator: 'Lesson: Logistic Regression, Better comprehension via a confusion matrix'
    source:
      id: ms-ml-for-beginners
      ref: quiz-16/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: metrics-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The F1 score can be especially useful for datasets with class high imbalance.

      **Statement 2.** The area under the ROC curve is one of the main metrics used to assess anomaly detectors.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is true. On a heavily imbalanced dataset, a useless model that always predicts the
      majority class can still score high accuracy. F1, the harmonic mean of precision and recall,
      looks at how well the rare positive class is caught, which is why it is preferred for
      class-imbalanced data [^1]. Statement 2 is also true. Anomaly and out-of-distribution detectors
      are routinely compared by the area under the ROC curve, often together with the area under the
      precision-recall curve, because AUROC summarizes performance across all thresholds [^2][^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
        locator: 'Classification: Accuracy, recall, precision, and related metrics (Accuracy; (Optional, advanced) F1 score)'
        quote: This metric balances the importance of precision and recall, and is preferable to accuracy for class-imbalanced datasets.
      - title: 'Hendrycks and Gimpel (2017): A Baseline for Detecting Misclassified and Out-of-Distribution Examples in Neural Networks'
        url: https://arxiv.org/abs/1610.02136
        locator: Sec. 2 Problem Formulation and Evaluation
      - title: 'Hendrycks, Mazeika, Dietterich (2019): Deep Anomaly Detection with Outlier Exposure'
        url: https://arxiv.org/abs/1812.04606
        locator: Sec. 4.1 Evaluating Out-of-Distribution Detection Methods
    source:
      id: mmlu-redux
      ref: machine_learning/41
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=41
    status: draft
  - id: metrics-004
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex01
      - mse
      - regression
    question: A model predicts $[2, 6]$ where the true values are $[4, 4]$. What is the mean squared error?
    options:
      - text: '0'
        why: The signed errors $-2$ and $+2$ cancel, but squared errors cannot.
      - text: '2'
        why: That is the mean absolute error.
      - text: '4'
        correct: true
      - text: '8'
        why: That is the sum of squared errors, not their mean.
    explanation: The squared errors are $(2-4)^2 = 4$ and $(6-4)^2 = 4$, and their mean is $(4 + 4)/2 = 4$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 87
      - source: d2l
        locator: Sec. 3.1 Linear Regression
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q13
    status: reviewed
  - id: metrics-005
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - mse
      - regression
    question: Which metric is the usual choice for evaluating a regression model?
    options:
      - text: Accuracy
        why: Accuracy counts correct class decisions.
      - text: Mean squared error (MSE)
        correct: true
      - text: F1-score
        why: F1 combines precision and recall for classification.
      - text: Precision
        why: Precision is a classification metric.
    explanation: MSE averages the squared differences between predicted and true numerical values; accuracy, precision and F1 evaluate class decisions [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 87
    source:
      id: ncu-intro-dl
      ref: exercise-02/q10
    status: reviewed
