schema_version: 1
domain: ml
topic: metrics
title: Evaluation Metrics
questions:
  - id: metrics-001
    type: single
    difficulty: easy
    question: 'A confusion matrix is also known as a:'
    options:
      - text: error matrix
        correct: true
      - text: truth matrix
      - text: accuracy matrix
    explanation: |
      A confusion matrix sets a classifier's predictions against the true labels and counts the true
      and false positives and negatives [^1][^2]. Because it lays out exactly where the model makes
      its mistakes, it is also called an error matrix [^1]. "Truth matrix" and "accuracy matrix" are
      not standard names for it.
    references:
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#better-comprehension-via-a-confusion-matrix
        locator: 'Lesson: Logistic Regression, Better comprehension via a confusion matrix'
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding#confusion_matrix
        locator: 'Classification: Thresholds and the confusion matrix, Confusion matrix'
    source:
      id: ms-ml-for-beginners
      ref: quiz-16/q2
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: metrics-002
    type: single
    difficulty: easy
    question: 'A good model will have:'
    options:
      - text: a large number of false positives and true negatives in its confusion matrix
      - text: a large number of true positives and true negatives in its confusion matrix
        correct: true
      - text: a large number of true positives and false negatives in its confusion matrix
    explanation: |
      True positives and true negatives are the correct predictions: actual positives labeled
      positive and actual negatives labeled negative [^1]. A good model has many of these and few
      false positives and false negatives [^2]. Any combination that includes many false positives or
      false negatives describes a model that makes many mistakes.
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding#confusion_matrix
        locator: 'Classification: Thresholds and the confusion matrix, Confusion matrix'
      - source: ms-ml-for-beginners
        url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#better-comprehension-via-a-confusion-matrix
        locator: 'Lesson: Logistic Regression, Better comprehension via a confusion matrix'
    source:
      id: ms-ml-for-beginners
      ref: quiz-16/q3
      url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/quiz-app/src/assets/translations/en.json
    status: draft
  - id: metrics-003
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** The F1 score can be especially useful for datasets with high class imbalance.

      **Statement 2.** The area under the ROC curve is one of the main metrics used to assess anomaly detectors.
    options:
      - text: True, True
        correct: true
      - text: False, False
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is true. On a heavily imbalanced dataset, a useless model that always predicts the
      majority class can still score high accuracy. F1, the harmonic mean of precision and recall,
      looks at how well the rare positive class is caught, which is why it is preferred for
      class-imbalanced data [^1]. Statement 2 is also true. Anomaly and out-of-distribution detectors
      are routinely compared by the area under the ROC curve, often together with the area under the
      precision-recall curve, because AUROC summarizes performance across all thresholds [^2][^3].
    references:
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
        locator: 'Classification: Accuracy, recall, precision, and related metrics (Accuracy; (Optional, advanced) F1 score)'
        quote: This metric balances the importance of precision and recall, and is preferable to accuracy for class-imbalanced datasets.
      - title: 'Hendrycks and Gimpel (2017): A Baseline for Detecting Misclassified and Out-of-Distribution Examples in Neural Networks'
        url: https://arxiv.org/abs/1610.02136
        locator: Sec. 2 Problem Formulation and Evaluation
      - title: 'Hendrycks, Mazeika, Dietterich (2019): Deep Anomaly Detection with Outlier Exposure'
        url: https://arxiv.org/abs/1812.04606
        locator: Sec. 4.1 Evaluating Out-of-Distribution Detection Methods
    source:
      id: mmlu-redux
      ref: machine_learning/41
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=41
    status: draft
  - id: metrics-004
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex01
      - mse
      - regression
    question: A model predicts $[2, 6]$ where the true values are $[4, 4]$. What is the mean squared error?
    options:
      - text: '0'
        why: The signed errors $-2$ and $+2$ cancel, but squared errors cannot.
      - text: '2'
        why: That is the mean absolute error.
      - text: '4'
        correct: true
      - text: '8'
        why: That is the sum of squared errors, not their mean.
    explanation: The squared errors are $(2-4)^2 = 4$ and $(6-4)^2 = 4$, and their mean is $(4 + 4)/2 = 4$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 87
      - source: d2l
        locator: Sec. 3.1 Linear Regression
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q13
    status: reviewed
  - id: metrics-005
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex02
      - mse
      - regression
    question: Which metric is the usual choice for evaluating a regression model?
    options:
      - text: Accuracy
        why: Accuracy counts correct class decisions.
      - text: Mean squared error (MSE)
        correct: true
      - text: F1-score
        why: F1 combines precision and recall for classification.
      - text: Precision
        why: Precision is a classification metric.
    explanation: MSE averages the squared differences between predicted and true numerical values; accuracy, precision and F1 evaluate class decisions [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 87
    source:
      id: ncu-intro-dl
      ref: exercise-02/q10
    status: reviewed
  - id: metrics-006
    type: single
    question: A model outputs 5 TP, 6 TN, 3 FP, and 2 FN. Calculate the recall.
    options:
      - text: '0.714'
        correct: true
      - text: '0.455'
        why: Recall considers all actual positives, not all correct classifications. The formula for recall is $\frac{TP}{TP+FN}$.
      - text: '0.625'
        why: Recall considers all actual positives, not all positive classifications. The formula for recall is $\frac{TP}{TP+FN}$
    explanation: Recall is calculated as $\frac{TP}{TP+FN}=\frac{5}{7}$. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: Accuracy, recall, precision, and related metrics'
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    source:
      id: google-mlcc
      ref: classification/accuracy-precision-recall#q1
      url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    status: draft
  - id: metrics-007
    type: single
    question: A model outputs 3 TP, 4 TN, 2 FP, and 1 FN. Calculate the precision.
    options:
      - text: '0.6'
        correct: true
      - text: '0.75'
        why: Precision considers all positive classifications, not all actual positives. The formula for precision is $\frac{TP}{TP+FP}$.
      - text: '0.429'
        why: Precision considers all positive classifications, not all correct classifications. The formula for precision is $\frac{TP}{TP+FP}$
    explanation: Precision is calculated as $\frac{TP}{TP+FP}=\frac{3}{5}$. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: Accuracy, recall, precision, and related metrics'
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    source:
      id: google-mlcc
      ref: classification/accuracy-precision-recall#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    status: draft
  - id: metrics-008
    type: single
    question: "You're building a binary classifier that checks photos of insect traps for whether a dangerous invasive species is present. If the model detects the species, the entomologist (insect scientist) on duty is notified. Early detection of this insect is critical to preventing an infestation. A false alarm (false positive) is easy to handle: the entomologist sees that the photo was misclassified and marks it as such. Assuming an acceptable accuracy level, which metric should this model be optimized for?"
    options:
      - text: Recall
        correct: true
      - text: False positive rate (FPR)
        why: In this scenario, false alarms (FP) are low-cost. Trying to minimize them at the risk of missing actual positives doesn't make sense.
      - text: Precision
        why: In this scenario, false alarms (FP) aren't particularly harmful, so trying to improve the correctness of positive classifications doesn't make sense.
    explanation: In this scenario, false alarms (FP) are low-cost, and false negatives are highly costly, so it makes sense to maximize recall, or the probability of detection. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: Accuracy, recall, precision, and related metrics'
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    source:
      id: google-mlcc
      ref: classification/accuracy-precision-recall#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    status: draft
  - id: metrics-009
    type: single
    question: Which of the following models performs worse than chance?
    options:
      - text: A model whose ROC curve has an AUC of 0.32
        correct: true
        image:
          src: ./metrics/metrics-009-a.svg
          alt: ROC curve that stays below the diagonal, moving right first and rising steeply only near FPR = 1, labelled AUC = 0.32.
      - text: A model whose ROC curve has an AUC of 0.508
        why: This model performs slightly better than chance.
        image:
          src: ./metrics/metrics-009-b.svg
          alt: ROC curve (dash-dot) that runs almost along the diagonal with small zig-zags, labelled AUC = 0.508.
      - text: A model whose ROC curve has an AUC of 0.5
        why: This model performs the same as chance.
        image:
          src: ./metrics/metrics-009-c.svg
          alt: ROC curve that is the straight diagonal line from (0, 0) to (1, 1), labelled AUC = 0.5.
      - text: A model whose ROC curve has an AUC of 1.0
        why: This is a hypothetical perfect classifier.
        image:
          src: ./metrics/metrics-009-d.svg
          alt: ROC curve that goes straight up from (0, 0) to (0, 1) and then straight across to (1, 1), labelled AUC = 1.0.
    explanation: The model with AUC 0.32 is the only one below 0.5, which means it performs worse than chance. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: ROC and AUC'
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    source:
      id: google-mlcc
      ref: classification/roc-and-auc#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    status: draft
  - id: metrics-010
    type: single
    question: A binary classifier's ROC curve has an AUC of 0.32, so it performs worse than chance. Which change makes it perform better than chance?
    options:
      - text: Reverse its predictions, so every **1** becomes **0** and every **0** becomes **1**.
        correct: true
      - text: Have it always predict the negative class (**0**), whatever the input.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
      - text: Have it always predict the positive class (**1**), whatever the input.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
    explanation: If a binary classifier reliably puts examples in the wrong classes more often than chance, switching the class label immediately makes its predictions better than chance without having to retrain the model. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: ROC and AUC'
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    source:
      id: google-mlcc
      ref: classification/roc-and-auc#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    status: draft
  - id: metrics-011
    type: single
    question: Imagine a phishing or malware classification model where phishing and malware websites are in the class labeled **1** (true) and harmless websites are in the class labeled **0** (false). This model mistakenly classifies a legitimate website as malware. What is this called?
    options:
      - text: A false positive
        correct: true
      - text: A true positive
        why: A true positive would be a malware site correctly classified as malware.
      - text: A false negative
        why: A false negative would be a malware site incorrectly classified as a legitimate site.
      - text: A true negative
        why: A true negative would be a legitimate site correctly classified as a legitimate site.
    explanation: A negative example (legitimate site) has been wrongly classified as a positive example (malware site). [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q1
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-012
    type: single
    question: In general, what happens to the number of false positives when the classification threshold increases? What about true positives?
    options:
      - text: Both true and false positives decrease.
        correct: true
      - text: Both true and false positives increase.
      - text: True positives increase. False positives decrease.
    explanation: As the threshold increases, the model will likely predict fewer positives overall, both true and false. A spam classifier with a threshold of .9999 will only label an email as spam if it considers the classification to be at least 99.99% likely, which means it is highly unlikely to mislabel a legitimate email, but also likely to miss actual spam email. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-013
    type: single
    question: In general, what happens to the number of false negatives when the classification threshold increases? What about true negatives?
    options:
      - text: Both true and false negatives increase.
        correct: true
      - text: Both true and false negatives decrease.
      - text: True negatives increase. False negatives decrease.
    explanation: As the threshold increases, the model will likely predict more negatives overall, both true and false. At a very high threshold, almost all emails, both spam and not-spam, will be classified as not-spam. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
