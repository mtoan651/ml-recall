    question: |
      A ranking returns 4 documents with graded relevance $[3, 2, 0, 1]$ (in rank order). Using
      $\mathrm{DCG} = \sum_{i=1}^{4} \frac{\mathrm{rel}_i}{\log_2(i+1)}$ and normalizing by the DCG of
      the ideal order $[3, 2, 1, 0]$, what is the NDCG? Give 3 decimals.
    answer:
      numeric: 0.985
      tolerance: 0.001
      hint: a number between 0 and 1, 3 decimals
      model: $\mathrm{DCG} = 3 + 2/1.585 + 0 + 1/2.322 = 4.693$, $\mathrm{IDCG} = 3 + 1.262 + 0.5 = 4.762$, NDCG $= 0.985$
    explanation: |
      DCG adds the relevance of each result, discounted by $\log_2$ of its position plus one, so
      mistakes near the top cost most [^1]. The ranking scores $3 + 1.262 + 0 + 0.431 = 4.693$ and the
      ideal order $3 + 1.262 + 0.5 + 0 = 4.762$; their ratio is $0.985$. Only the swap of the two lowest
      results is penalized, and only lightly, because it happens far down the list [^1].
    references:
      - title: 'Wikipedia: Discounted cumulative gain'
        url: https://en.wikipedia.org/wiki/Discounted_cumulative_gain#Normalized_DCG
