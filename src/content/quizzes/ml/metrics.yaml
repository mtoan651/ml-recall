  - id: metrics-024
    type: multiple
    difficulty: medium
    tags:
      - false-positives
      - false-negatives
      - precision
      - recall
      - accuracy
    question: Which statements about classification errors and metrics are true? Select all that apply.
    options:
      - text: In screening for a serious disease (positive = has the disease), false positives are usually more damaging than false negatives
        why: A false negative sends a sick person home untreated, while a false positive usually leads to a follow-up test, so missing cases is typically worse [^1].
      - text: In spam filtering (positive = spam), false positives are usually more damaging than false negatives
        correct: true
      - text: If method A has a higher accuracy than method B, then A also has a higher precision
        why: 'Counterexample: A with TN = 90, FP = 5, FN = 5, TP = 0 has accuracy 0.90 and precision 0, while B with TN = 80, FP = 15, FN = 0, TP = 5 has accuracy 0.85 and precision 0.25 [^2].'
      - text: If method A has a higher accuracy than method B, then A also has a higher recall
        why: In the same counterexample A finds none of the 5 positives (recall 0) while B finds all of them (recall 1) [^2].
    explanation: |
      Which error is worse depends on the cost of each mistake in the application [^1]. A spam
      filter that sends an important email to the junk folder (a false positive) does more harm
      than one that lets a spam message through, whereas missing a disease (a false negative) is
      usually the costlier error in medical screening. Accuracy mixes both kinds of errors, so it
      can rank models differently from precision $TP/(TP+FP)$ and recall $TP/(TP+FN)$, especially
      with class imbalance, as the course's two confusion matrices show [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — What is "positive" and "negative"?; Which type of error is more important?'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — iClicker Exercise 9.1 (Method A and Method B confusion matrices); Precision, recall, f1 score'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
    source:
