  - id: metrics-023
    type: single
    difficulty: easy
    tags:
      - rmse
      - mae
      - outliers
      - regression-metrics
    question: |
      In regression, which pair correctly names a metric that is very sensitive to large outliers
      and one that is more robust to them? (MAE: mean absolute error, RMSE: root mean squared
      error, MAPE: mean absolute percentage error.)
    options:
      - text: MAE is sensitive; $R^2$ is robust
        why: MAE grows only linearly with an error, so it is the more robust one, while $R^2$ is built on squared errors [^2].
      - text: $R^2$ is sensitive; RMSE is robust
        why: RMSE squares the errors before averaging, which makes it one of the most outlier-sensitive metrics [^1].
      - text: MAPE is sensitive; RMSE is robust
        why: RMSE is not robust, because of the squaring; MAPE's weak spot is true values near zero, not large outliers [^1].
      - text: RMSE is sensitive; MAE is robust
        correct: true
    explanation: |
      RMSE squares each error before averaging, so one prediction that is off by 10 contributes as
      much as a hundred predictions off by 1; a few large outliers can dominate it [^1][^2]. MAE
      adds the absolute errors, so each error counts in proportion to its size and outliers have
      much less influence [^1]. $R^2$ is a normalized squared error and shares RMSE's sensitivity [^2].
    references:
      - source: google-mlcc
        locator: 'Linear regression: Loss — Choosing a loss'
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/loss#choosing_a_loss
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — Mean squared error (MSE); RMSE; R^2'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/final_prep.pdf#q8
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
