  - id: metrics-008
    type: single
    question: "You're building a binary classifier that checks photos of insect traps for whether a dangerous invasive species is present. If the model detects the species, the entomologist (insect scientist) on duty is notified. Early detection of this insect is critical to preventing an infestation. A false alarm (false positive) is easy to handle: the entomologist sees that the photo was misclassified and marks it as such. Assuming an acceptable accuracy level, which metric should this model be optimized for?"
    options:
      - text: Recall
        correct: true
      - text: False positive rate (FPR)
        why: In this scenario, false alarms (FP) are low-cost. Trying to minimize them at the risk of missing actual positives doesn't make sense.
      - text: Precision
        why: In this scenario, false alarms (FP) aren't particularly harmful, so trying to improve the correctness of positive classifications doesn't make sense.
    explanation: In this scenario, false alarms (FP) are low-cost, and false negatives are highly costly, so it makes sense to maximize recall, or the probability of detection. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: Accuracy, recall, precision, and related metrics Stay organized with collections Save and categorize content based on your preferences.'
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    source:
      id: google-mlcc
      ref: classification/accuracy-precision-recall#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    status: draft
  - id: metrics-009
    type: single
    question: Which of the following models performs worse than chance?
    options:
      - text: A model whose ROC curve has an AUC of 0.32
        correct: true
      - text: A model whose ROC curve has an AUC of 0.508
        why: This model performs slightly better than chance.
      - text: A model whose ROC curve has an AUC of 0.5
        why: This model performs the same as chance.
      - text: A model whose ROC curve has an AUC of 1.0
        why: This is a hypothetical perfect classifier.
    explanation: This model has an AUC lower than 0.5, which means it performs worse than chance. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: ROC and AUC Stay organized with collections Save and categorize content based on your preferences.'
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    source:
      id: google-mlcc
      ref: classification/roc-and-auc#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    status: draft
  - id: metrics-010
    type: single
    question: A binary classifier's ROC curve has an AUC of 0.32, so it performs worse than chance. Which change makes it perform better than chance?
    options:
      - text: Reverse the predictions, so predictions of **1** become **0**, and predictions of **0** become **1**.
        correct: true
      - text: Have it always predict the negative class.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
      - text: Have it always predict the positive class.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
    explanation: If a binary classifier reliably puts examples in the wrong classes more often than chance, switching the class label immediately makes its predictions better than chance without having to retrain the model. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: ROC and AUC Stay organized with collections Save and categorize content based on your preferences.'
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    source:
      id: google-mlcc
      ref: classification/roc-and-auc#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    status: draft
  - id: metrics-011
    type: single
    question: Imagine a phishing or malware classification model where phishing and malware websites are in the class labeled **1** (true) and harmless websites are in the class labeled **0** (false). This model mistakenly classifies a legitimate website as malware. What is this called?
    options:
      - text: A false positive
        correct: true
      - text: A true positive
        why: A true positive would be a malware site correctly classified as malware.
      - text: A false negative
        why: A false negative would be a malware site incorrectly classified as a legitimate site.
      - text: A true negative
        why: A true negative would be a legitimate site correctly classified as a legitimate site.
    explanation: A negative example (legitimate site) has been wrongly classified as a positive example (malware site). [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix Stay organized with collections Save and categorize content based on your preferences.
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q1
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-012
    type: single
    question: In general, what happens to the number of false positives when the classification threshold increases? What about true positives?
    options:
      - text: Both true and false positives decrease.
        correct: true
      - text: Both true and false positives increase.
      - text: True positives increase. False positives decrease.
    explanation: As the threshold increases, the model will likely predict fewer positives overall, both true and false. A spam classifier with a threshold of .9999 will only label an email as spam if it considers the classification to be at least 99.99% likely, which means it is highly unlikely to mislabel a legitimate email, but also likely to miss actual spam email. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix Stay organized with collections Save and categorize content based on your preferences.
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-013
    type: single
    question: In general, what happens to the number of false negatives when the classification threshold increases? What about true negatives?
    options:
      - text: Both true and false negatives increase.
        correct: true
      - text: Both true and false negatives decrease.
      - text: True negatives increase. False negatives decrease.
    explanation: As the threshold increases, the model will likely predict more negatives overall, both true and false. At a very high threshold, almost all emails, both spam and not-spam, will be classified as not-spam. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix Stay organized with collections Save and categorize content based on your preferences.
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
