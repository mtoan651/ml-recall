    question: |
      A part-of-speech tagger with three tags has this confusion matrix (rows: true tag, columns:
      predicted tag):

      | | NN | VB | ADJ |
      | --- | --- | --- | --- |
      | **NN** | 25 | 5 | 1 |
      | **VB** | 2 | 15 | 12 |
      | **ADJ** | 1 | 6 | 0 |

      Compute the macro-F1 score as the plain average of the three per-class F1 scores. ADJ has
      precision and recall 0; count its F1 as 0.
    answer:
      numeric: 0.464
      tolerance: 0.003
      hint: a number, 3 decimals
      model: $F1_{NN} = \frac{2 \cdot 0.893 \cdot 0.806}{0.893 + 0.806} \approx 0.847$, $F1_{VB} \approx 0.545$, $F1_{ADJ} = 0$; mean $\approx 0.464$
    explanation: |
      $F1 = 2PR/(P + R)$ for each class [^1]. NN has $P = 25/28 \approx 0.893$ and
      $R = 25/31 \approx 0.806$, so $F1 \approx 0.847$; VB has $P = 15/26$, $R = 15/29$, so
      $F1 \approx 0.545$; ADJ is never predicted correctly, so its F1 is 0 [^2]. Macro-averaging
      gives every class the same weight: $(0.847 + 0.545 + 0)/3 \approx 0.464$, far below the
      accuracy of about 0.60, because the rare tag ADJ counts as much as the frequent ones.
