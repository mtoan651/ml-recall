    question: |
      A 3-class classifier has this confusion matrix (rows: true class, columns: predicted class):

      | true \ predicted | 0 | 1 | 2 |
      | ---: | ---: | ---: | ---: |
      | 0 | 84 | 0 | 0 |
      | 1 | 0 | 73 | 10 |
      | 2 | 0 | 32 | 51 |

      What is its macro-averaged recall (the unweighted mean of the three per-class recalls)? Give 3
      decimals.
    answer:
      numeric: 0.831
      tolerance: 0.001
      hint: a number between 0 and 1, 3 decimals
      model: $(84/84 + 73/83 + 51/83)/3 = (1 + 0.880 + 0.614)/3 \approx 0.831$
    explanation: |
      Each class's recall is its diagonal count divided by its row total (the number of true members):
      $84/84 = 1$, $73/83 = 0.880$ and $51/83 = 0.614$ [^1][^2]. The macro average weights the three
      classes equally, $0.831$ [^2]. Classes 1 and 2 are often confused with each other (10 and 32
      errors), while class 0 is always recognized.
    references:
      - source: galaxy-training
        locator: 'Foundational Aspects of Machine Learning using Python — Decision tree modeling, Simple decision tree for classification: Toy dataset (three-class cross-tabulation)'
        url: https://training.galaxyproject.org/training-material/topics/statistics/tutorials/intro-to-ml-with-python/tutorial.html
      - title: scikit-learn User Guide
        url: https://scikit-learn.org/stable/modules/model_evaluation.html#multiclass-and-multilabel-classification
        locator: Precision, recall and F-measures — Multiclass and multilabel classification (macro averaging)
    source:
      id: galaxy-training
      ref: intro-to-ml-with-python#q20
      url: https://github.com/galaxyproject/training-material/blob/917e68d1d61c2915c7a970d75468b8494be90c0d/topics/statistics/tutorials/intro-to-ml-with-python/tutorial.md
    status: draft
  - id: metrics-045
    type: short_answer
    difficulty: medium
    tags:
      - rmse
      - r-squared
      - regression-metrics
    question: |
      A linear regression on many training examples has training RMSE $= 0.562$, while the standard
      deviation of the target is $3.494$. Using $R^2 = 1 - \mathrm{MSE}/\mathrm{Var}(y)$, what is the
      training $R^2$ approximately? Give 2 decimals.
    answer:
      numeric: 0.97
      tolerance: 0.005
      hint: a number, 2 decimals
      model: $1 - (0.562/3.494)^2 = 1 - 0.026 \approx 0.97$
    explanation: |
      $R^2$ compares the model's squared error with that of always predicting the mean, whose MSE is the
      variance of $y$ [^1]. Since $\mathrm{RMSE}/\mathrm{SD} = 0.161$, the ratio of the squares is $0.026$,
      so $R^2 \approx 0.97$ [^1]. That is why an RMSE much smaller than the target's standard deviation
      signals a good fit — on the training data; overfitting is checked by computing the same numbers on
      test data [^2].
    references:
      - title: 'Wikipedia: Coefficient of determination'
        url: https://en.wikipedia.org/wiki/Coefficient_of_determination#Definitions
        locator: Section "Definitions"
      - source: galaxy-training
        locator: 'Introduction to Machine Learning using R — Supervised Learning II: regression, Linear regression (RMSE vs. standard deviation)'
        url: https://training.galaxyproject.org/training-material/topics/statistics/tutorials/intro-to-ml-with-r/tutorial.html
    source:
      id: galaxy-training
      ref: intro-to-ml-with-r#q6
      url: https://github.com/galaxyproject/training-material/blob/917e68d1d61c2915c7a970d75468b8494be90c0d/topics/statistics/tutorials/intro-to-ml-with-r/tutorial.md
    status: draft
  - id: metrics-046
    type: short_answer
    difficulty: medium
    tags:
      - validation-error
      - data-leakage
      - knn
    question: |
      A dataset of 1000 cases is split into 600 training and 400 validation cases. A 1-nearest-neighbour
      classifier has an 8% error rate on the validation set. You then discover that 100 training
      cases had accidentally been copied over 100 validation cases, so 100 validation cases are exact
      duplicates of training cases. What is the error rate on the 300 genuine validation cases?
    answer:
      numeric: 0.1067
      tolerance: 0.002
      hint: a fraction between 0 and 1, 3 decimals
      model: $0.08 \times 400 = 32$ errors, all among the 300 genuine cases, so $32/300 \approx 0.107$
    explanation: |
      The 8% rate means $0.08 \times 400 = 32$ validation errors. A duplicated case has itself in
      the training set at distance 0, so 1-NN predicts its own label and gets it right [^1]. All 32
      errors therefore come from the 300 genuine cases, and the honest error rate is
      $32/300 \approx 10.7\%$ (the published solution's "21/300" is a typo) [^1]. Leaked duplicates
      make a validation estimate optimistic, most of all for models that memorize the training set
      such as 1-NN [^2].
    references:
      - source: mit-ocw-15062
        locator: Midterm (2003) solutions, Problem 2
        url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
      - title: 'Wikipedia: Cross-validation (statistics)'
        locator: Computational issues (the validation set must stay blind to the training procedure, otherwise bias may result)
        url: https://en.wikipedia.org/wiki/Cross-validation_(statistics)#Computational_issues
    source:
      id: mit-ocw-15062
      ref: midterm2003#q2
      url: https://ocw.mit.edu/courses/15-062-data-mining-spring-2003/resources/midterm2003solutions/
    status: draft
  - id: metrics-047
    type: short_answer
    difficulty: medium
    tags:
      - f1-score
      - precision
      - recall
      - class-imbalance
    question: |
      A detector of malfunctioning sensors (positive class P) gives this confusion matrix on a test set:

      | | Predicted P | Predicted N |
      |---|---|---|
      | **Actual P** | 12 | 7 |
      | **Actual N** | 24 | 1009 |

      What is its F1 score for the positive class? Round to 3 decimals.
    answer:
      numeric: 0.436
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $P = 12/36 = 0.333$, $R = 12/19 = 0.632$, $F_1 = 2PR/(P + R) \approx 0.436$
    explanation: |
      TP = 12, FN = 7, FP = 24 and TN = 1009 [^1]. Precision is $12/(12 + 24) = 0.333$ and recall
      $12/(12 + 7) \approx 0.632$, so $F_1 = 2PR/(P + R) = 24/55 \approx 0.436$ [^2]. The accuracy of 97% hides
      that two out of three alarms are false and a third of the faulty sensors are missed.
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-227, Fig. 8.27, pp. 260–261; Solution SOL-227, Eqs. (8.67)–(8.69), p. 316
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: F-score'
        url: https://en.wikipedia.org/wiki/F-score
        locator: Definition
    source:
      id: dl-interviews
      ref: ch8#prb227
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
  - id: metrics-048
    type: short_answer
    difficulty: easy
    tags:
      - accuracy
      - baseline
      - class-imbalance
    question: |
      A test set has 19 malfunctioning sensors (P) and 1033 working ones (N). A detector scores 97.1%
      accuracy on it. What accuracy does a "classifier" that always answers N get? Round to 3 decimals
      (as a fraction, e.g. 0.971).
    answer:
      numeric: 0.982
      tolerance: 0.001
      hint: a fraction, 3 decimals
      model: $1033 / (19 + 1033) = 1033/1052 \approx 0.982$
    explanation: |
      Always predicting the majority class is right on all 1033 working sensors and wrong on the 19 faulty
      ones, $1033/1052 \approx 0.982$, better than the detector's $1021/1052 \approx 0.971$ although it never
      finds a single fault [^1][^2]. On imbalanced data, accuracy must be compared with this baseline, and
      precision, recall or F1 for the rare class say more [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-227, Fig. 8.27, pp. 260–261; Solution SOL-227, Eq. (8.67), p. 316
        url: https://arxiv.org/abs/2201.00650v2
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
        locator: 'Classification: Accuracy, recall, precision, and related metrics (accuracy on imbalanced datasets)'
    source:
      id: dl-interviews
      ref: ch8#prb227-2
      url: https://arxiv.org/abs/2201.00650v2
