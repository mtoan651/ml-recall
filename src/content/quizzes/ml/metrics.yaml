  - id: metrics-042
    type: short_answer
    difficulty: medium
    tags:
      - matthews-correlation
      - binary-classification
    question: |
      A binary classifier has the confusion counts TP = 40, FN = 10, FP = 10, TN = 40. What is its
      Matthews correlation coefficient,
      $\mathrm{MCC} = \frac{TP\cdot TN - FP\cdot FN}{\sqrt{(TP+FP)(TP+FN)(TN+FP)(TN+FN)}}$?
    answer:
      numeric: 0.6
      tolerance: 0.001
      hint: a number between -1 and 1
      model: $(1600 - 100)/\sqrt{50^4} = 1500/2500 = 0.6$
    explanation: |
      The numerator is $40 \cdot 40 - 10 \cdot 10 = 1500$ and each of the four sums is 50, so
      $\mathrm{MCC} = 1500/2500 = 0.6$ [^1]. MCC ranges from $-1$ (always wrong) through 0 (no better than
      random) to $+1$ (perfect) and uses all four cells, so it stays informative when the classes are
      imbalanced [^1][^2]. Here accuracy is 0.8, while MCC reports a moderate correlation of 0.6.
    references:
      - title: 'Wikipedia: Phi coefficient (Matthews correlation coefficient)'
        url: https://en.wikipedia.org/wiki/Phi_coefficient#Machine_learning
