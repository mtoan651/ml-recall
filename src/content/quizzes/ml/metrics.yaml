  - id: metrics-035
    type: short_answer
    difficulty: medium
    tags:
      - precision
      - class-imbalance
      - random-baseline
    question: |
      A test set has 990 examples of class A and 10 of class B. A model flips a fair coin for each
      example and predicts B on heads. Using expected counts, what is its precision for class B?
    answer:
      numeric: 0.01
      tolerance: 0.0005
      hint: a number, e.g. 0.05
      model: 'About 500 B predictions, of which $10 \times 0.5 = 5$ are true B: $P_B = 5/500 = 0.01$'
    explanation: |
      Precision is $TP/(TP + FP)$ [^1]. The coin predicts B for about half of all 1000 examples,
      i.e. 500 times; only 5 of those are real B's (half of the 10), so $P_B = 5/500 = 0.01$, while
      the recall for B is $5/10 = 0.5$ [^2]. A random classifier's precision for a class is just
      that class's share of the data, which is why precision is so low for rare classes.
    references:
      - source: trusthlt-nlp
        locator: Lecture 1 slides, frame 'Precision, recall, F-1 score'
        url: https://github.com/trusthlt/nlp-with-deep-learning-lectures/blob/751182ea7a6a6f2246bbd8313329ecd09d270dbc/lectures/lecture01/pdf/nlpwdl2025-lecture01-handout.pdf
