    question: |
      For a search query, 4 products in the shop are relevant. Your ranking shows 3 of them among its top
      10 results. What is recall@10?
    answer:
      numeric: 0.75
      tolerance: 0.001
      hint: a number between 0 and 1
      model: recall@10 $= 3/4 = 0.75$ (precision@10 would be $3/10 = 0.3$)
    explanation: |
      Recall@k is the share of all relevant items that appear in the top $k$: $3/4 = 0.75$ [^1][^2].
      Precision@k divides by $k$ instead, giving $3/10 = 0.3$. Both ignore the order inside the top $k$,
      which is why rank-aware metrics such as average precision and NDCG are also used [^2].
    references:
      - source: ds-interviews
        locator: theory.md, Ranking and search — "What is precision and recall at k?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#ranking-and-search
