  - id: metrics-016
    type: single
    difficulty: easy
    question: Which of these metrics is used to evaluate a classification model?
    options:
      - text: Accuracy
        correct: true
      - text: R² score (coefficient of determination)
      - text: Normalized root mean squared error
    explanation: |
      Accuracy is the fraction of predictions whose class equals the true class, so it needs class
      labels and is a classification metric [^1]. The $R^2$ score and the (normalized) root mean
      squared error measure how far numeric predictions are from numeric targets, so they are
      regression metrics [^1]. In the Azure lesson the experiment is configured with a task type
      (classification, regression or forecasting) and a primary metric, and the classification run
      uses weighted AUC [^2].
    references:
      - title: 'scikit-learn User Guide: Metrics and scoring'
        url: https://scikit-learn.org/stable/modules/model_evaluation.html
        locator: Sec. 3.4.3.1 String name scorers, 3.4.4 Classification metrics, 3.4.6 Regression metrics
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/19-Azure/README.md#252-automl-configuration-and-training
        locator: 'Lesson 19: Data Science in the Cloud, the Azure ML SDK way, sec. 2.5.2 AutoML Configuration and training'
    source:
      id: ms-ds-for-beginners
      ref: quiz-37/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-5.json
    status: draft
  - id: metrics-017
    type: single
    difficulty: easy
    question: You plan to use an LLM as a customer-support agent to solve a clear business problem. Which of these is the best evidence that the solution is successful?
    options:
      - text: The share of resolved support cases that needed a human drops from 72% to 50%
        correct: true
      - text: The LLM's evaluation metrics, such as accuracy on a support benchmark, are consistently high
        why: Good model metrics doesn't guarantee that you'll have improved business metrics.
      - text: Feedback from the first round of user testing with real customers is very favourable
        why: Early user feedback is typically more qualitative than quantitative. You'll need to determine a quantifiable business metric for measuring success.
    explanation: |
      Success is measured by business metrics, which are the reason for using ML; they should be
      quantifiable and focused, like cutting the share of support cases that need a person from 72% to
      50% [^1]. Model metrics measure model quality, but great model metrics do not necessarily improve
      the business metric, so teams check the connection, e.g. by deploying to a small share of users
      [^1]. Favourable early feedback is encouraging, but it is not a quantified business metric.
    references:
      - source: google-ml-courses
        url: https://developers.google.com/machine-learning/managing-ml-projects/success
        locator: 'Managing ML Projects: Measuring success'
    source:
      id: google-ml-courses
      ref: managing-ml-projects/success#q1
      url: https://developers.google.com/machine-learning/managing-ml-projects/success
    status: draft
  - id: metrics-018
    type: single
    difficulty: easy
    tags:
      - roc-curve
      - auc
      - random-classifier
    question: |
      For a binary classification problem with balanced classes, a lazy classifier labels each
      example by tossing a coin (heads = positive, tails = negative). Which ROC curve in the figure
      best matches this approach?
    figure:
      src: ./metrics/metrics-018.svg
      alt: Three ROC plots with false positive rate on the x-axis and true positive rate on the y-axis, both from 0 to 1. Panel A rises steeply to the top-left corner, panel B runs close to the diagonal from (0, 0) to (1, 1), and panel C stays near the bottom and only rises at the right edge.
    options:
      - text: Panel A
        why: A curve hugging the top-left corner reaches high recall at a low false positive rate, which needs scores that actually rank positives above negatives [^1].
      - text: Panel B
        correct: true
      - text: Panel C
        why: A curve below the diagonal ranks negatives above positives, which is worse than chance; a coin does not prefer either class, so on average it cannot do that [^1].
    explanation: |
      A coin ignores the input, so an actual positive and an actual negative are labeled positive
      with the same probability $p$ (the chance of heads). Hence $\text{TPR} = \text{FPR} = p$: a fair
      coin gives the point (0.5, 0.5), and coins with other biases trace out the diagonal from
      (0, 0) to (1, 1) [^1]. This is the ROC of random guessing, with AUC = 0.5, "random chance" in
      the course's words [^1]. The class balance does not change this, since TPR and FPR are each
      computed within one class.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — Receiver Operating Characteristic (ROC) curve; Area under the curve (AUC)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/midterm_prep.pdf#q16
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/midterm_prep.pdf
    status: draft
  - id: metrics-019
    type: single
    difficulty: easy
    tags:
      - recall
      - precision
      - confusion-matrix
    question: A binary classifier reaches a recall of 100% on the test set. What can you conclude?
    options:
      - text: Its accuracy must also be 100%, as no positive is missed
        why: False positives still count as errors in accuracy, and recall does not see them [^1].
      - text: It makes no false positive predictions on the test set
        why: Recall is $TP/(TP+FN)$ and contains no FP term; predicting every example as positive already gives recall 1 [^1].
      - text: It found every positive example, though it may also flag negatives
        correct: true
      - text: Its precision must be high as well, since recall is perfect
        why: Precision $TP/(TP+FP)$ can be low; if the model predicts everything as positive, precision equals the share of positives [^1].
    explanation: |
      Recall is $\frac{TP}{TP+FN}$: of all actual positives, how many did the model catch [^1]? A
      recall of 1 means $FN = 0$, so no positive was missed. It says nothing about false positives,
      which enter precision, $\frac{TP}{TP+FP}$, and accuracy. The trivial classifier that labels
      everything positive has recall 1 but poor precision, which is why recall is reported together
      with precision or summarized by the F1-score [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — Precision, recall, f1 score'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/midterm_prep.pdf#q17
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/midterm_prep.pdf
    status: draft
  - id: metrics-020
    type: single
    difficulty: medium
    tags:
      - r2
      - baselines
      - cross-validation
      - regression-metrics
    question: |
      The table shows 10-fold cross-validation results of a regressor, scored with $R^2$ (the
      default regression score in scikit-learn):

      | fold | test_score | train_score |
      | ---: | ---: | ---: |
      | 0 | −0.003547 | 0.0 |
      | 1 | −0.001266 | 0.0 |
      | 2 | −0.011767 | 0.0 |
      | 3 | −0.006744 | 0.0 |
      | 4 | −0.076533 | 0.0 |
      | 5 | −0.003133 | 0.0 |
      | 6 | −0.000397 | 0.0 |
      | 7 | −0.003785 | 0.0 |
      | 8 | −0.001740 | 0.0 |
      | 9 | −0.000117 | 0.0 |

      Which regressor most likely produced these scores?
    options:
      - text: A baseline that always predicts the median of the training targets
        why: The mean minimizes the squared error, so a median predictor has $R^2 \le 0$ on its own training data, and below 0 whenever median and mean differ [^1].
      - text: A support vector regressor with an RBF kernel
        why: An SVR learns from the features, so on its training folds it would score clearly above 0 [^2].
      - text: A support vector regressor with a linear kernel
        why: A linear SVR also uses the features and would fit its training folds better than a constant, giving a positive training $R^2$ [^2].
      - text: A baseline that always predicts the mean of the training targets
        correct: true
    explanation: |
      $R^2 = 1 - \frac{\sum_i (y_i - \hat y_i)^2}{\sum_i (y_i - \bar y)^2}$ [^1]. If the model always
      predicts the training mean $\bar y$, numerator and denominator are equal on the training fold,
      so the training $R^2$ is exactly 0, as in every row of the table. On a validation fold the
      training mean is slightly off from that fold's mean, so $R^2$ is slightly negative; the course
      reads a negative $R^2$ as "worse than `DummyRegressor`", the mean baseline itself [^1][^2]. A
      model that uses the features would have a positive training score.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — R^2 (not in detail)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 2: Terminology, Baselines, Decision Trees — DummyRegressor'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/02_terminology-decision-trees.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/midterm_prep.pdf#q18
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/midterm_prep.pdf
    status: draft
  - id: metrics-021
    type: single
    difficulty: hard
    tags:
      - mape
      - r2
      - regression-metrics
    question: |
      A model predicts the monthly revenue of business units of very different sizes. On the test
      set it reaches $R^2 = 0.92$ but a mean absolute percentage error (MAPE) of 40%: it is accurate
      for the large units and poor for the small ones. What best explains how both numbers can hold?
    options:
      - text: One of the metrics must be miscomputed, because a high $R^2$ implies a low MAPE
        why: The two metrics measure different things, and neither implies the other, so this pair of results is perfectly possible [^1].
      - text: $R^2$ is dominated by squared errors on large units; MAPE weighs every unit's relative error equally
        correct: true
      - text: A MAPE of 40% means the model explains only 60% of the variance, so $R^2$ must be wrong
        why: MAPE is the average absolute error as a share of each true value; it is not $1 - R^2$ [^1].
      - text: $R^2$ ignores the large units because it is computed on percentages
        why: $R^2$ uses squared errors in the target's units, so the large units, with the largest errors, dominate it [^1].
    explanation: |
      $R^2$ compares squared errors in the target's units with the target's variance, so units with
      large revenues, and therefore large absolute errors and spread, dominate it; the course makes
      the same point for MSE, where expensive houses dominate [^1]. MAPE averages each unit's error
      *as a percentage of its true value*, so an error of 30,000 is 5% for a large unit but 50% for
      a small one [^1]. Poor relative accuracy on many small units thus inflates MAPE without
      hurting $R^2$ much. Which number matters depends on the goal; note also that MAPE becomes
      unstable when true values are close to zero, since it divides by them.
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — MAPE; Transforming the targets'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/midterm_prep.pdf#q19
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/midterm_prep.pdf
    status: draft
  - id: metrics-022
    type: single
    difficulty: easy
    tags:
      - roc-curve
      - auc
      - thresholds
    question: |
      Which metric measures how well a binary classifier separates the two classes across all
      possible classification thresholds?
    options:
      - text: Precision of the positive class
        why: Precision is computed from the hard predictions at one threshold [^1].
      - text: Recall of the positive class
        why: Recall also comes from one confusion matrix, that is, from one threshold [^1].
      - text: Area under the ROC curve
        correct: true
      - text: F1-score of the positive class
        why: F1 combines precision and recall at a single threshold; it measures the quality of `predict`, not of the scores [^2].
    explanation: |
      An ROC curve plots the true positive rate against the false positive rate for every
      threshold on the classifier's scores, from (0, 0) to (1, 1) [^1]. The area under it (AUC)
      summarizes all thresholds in one number: 0.5 is random chance and 1.0 means every positive
      gets a higher score than every negative, so AUC can be read as the probability that a random
      positive is ranked above a random negative [^1]. Precision, recall and F1 describe one
      operating point [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — Receiver Operating Characteristic (ROC) curve; Area under the curve (AUC)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — AP vs. F1-score'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/final_prep.pdf#q7
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
