  - id: metrics-038
    type: short_answer
    difficulty: medium
    tags:
      - pr-auc
      - class-imbalance
      - baseline
    question: |
      In a fraud dataset only 2% of the transactions are fraudulent. A useless model outputs random
      scores, so its ROC AUC is about 0.5. About what area under the precision–recall curve
      (positive class = fraud) does it get?
    answer:
      numeric: 0.02
      tolerance: 0.005
      hint: a number between 0 and 1
      model: About $0.02$ — a random ranker has precision equal to the positive rate at every recall
    explanation: |
      A random ranker's precision at any threshold is just the fraction of positives, so its PR curve
      is a flat line at $P/(P+N) = 0.02$ and the area under it is about $0.02$ [^1]. Its ROC AUC stays at
      0.5 whatever the class balance. That is why, when you care about a rare positive class and true
      negatives are plentiful, the PR curve shows much more clearly how far a model is from random
      [^1][^2].
    references:
      - title: Saito & Rehmsmeier (2015), The Precision-Recall Plot Is More Informative than the ROC Plot When Evaluating Binary Classifiers on Imbalanced Datasets, PLoS ONE 10(3)
        url: https://doi.org/10.1371/journal.pone.0118432
        locator: Section "Precision-recall plot" (baseline $y = P/(P+N)$) and Fig. 2
      - source: ds-interviews
        locator: theory.md, Classification — "In which cases AU PR is better than AU ROC?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
