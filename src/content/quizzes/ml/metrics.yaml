  - id: metrics-036
    type: short_answer
    difficulty: easy
    tags:
      - precision
      - recall
      - f1-score
    question: |
      A spam filter flags 40 emails, of which 30 really are spam. The test set contains 60 spam emails
      in total. What is the filter's F1 score?
    answer:
      numeric: 0.6
      tolerance: 0.001
      hint: a number between 0 and 1
      model: $P = 30/40 = 0.75$, $R = 30/60 = 0.5$, $F_1 = \frac{2PR}{P+R} = \frac{0.75}{1.25} = 0.6$
    explanation: |
      Precision is $TP/(TP+FP) = 30/40 = 0.75$ and recall is $TP/(TP+FN) = 30/60 = 0.5$ [^1]. The F1
      score is their harmonic mean, $2PR/(P+R) = 0.6$ [^1][^2]. The harmonic mean sits closer to the
      smaller of the two values than the arithmetic mean ($0.625$) would, so a model cannot hide a poor
      recall behind a high precision.
    references:
      - source: ds-interviews
        locator: theory.md, Classification — "What are precision, recall, and F1-score?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#classification
