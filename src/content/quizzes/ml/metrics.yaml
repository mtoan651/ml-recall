  - id: metrics-027
    type: single
    difficulty: easy
    question: Which one of the following statements is true concerning alternative forecast accuracy measures?
    options:
      - text: Mean squared error is expressed in the same units as the forecast variable
        why: MSE is in squared units of the data; only its square root, the RMSE, is on the original scale [^2].
      - text: Mean absolute error provides a quadratic loss function
        why: MAE is a linear (absolute-value) loss; the quadratic loss is the MSE.
      - text: Mean absolute percentage error is a useful measure for evaluating asset return forecasts
        why: Returns are often close to zero, and percentage errors become extreme or undefined when the actual value is near or equal to zero [^3].
      - text: Mean squared error penalises large forecast errors disproportionately more than small forecast errors
        correct: true
    explanation: 'MSE averages *squared* errors, so an error twice as large costs four times as much and a few large misses dominate the score [^2]. MAE grows only linearly with the size of an error, which makes it less sensitive to outliers: minimising MAE leads to forecasts of the median, minimising MSE to forecasts of the mean [^3][^1].'
    references:
      - source: mmlu-redux
        locator: econometrics row 62
      - title: 'Wikipedia: Mean squared error'
        url: https://en.wikipedia.org/wiki/Mean_squared_error
        locator: Introduction; Loss function, Criticism
