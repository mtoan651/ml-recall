  - id: metrics-029
    type: multiple
    difficulty: medium
    tags:
      - average-precision
      - f1-score
      - roc-curve
      - class-weight
    question: |
      You evaluate a fraud classifier with threshold-based metrics and try to fix its class
      imbalance. Which statements are true? Select all that apply.
    options:
      - text: The average precision (AP) score at threshold 0.5 is the same as the F1 score
        why: F1 is computed at one threshold from hard predictions; AP summarizes precision and recall over all thresholds of `predict_proba`, so it has no threshold [^1].
      - text: '`class_weight="balanced"` is likely to decrease false negatives but increase false positives'
        correct: true
      - text: Along an ROC curve, the threshold goes from 1 at the lower left to 0 at the upper right
        correct: true
      - text: A macro-averaged recall gives every class the same weight, whatever its size
        correct: true
    explanation: |
      F1 measures the quality of `predict` at a single threshold, while AP is a summary across
      thresholds that measures the quality of `predict_proba` [^1]. On an ROC curve a threshold of 1
      labels nothing positive (FPR = TPR = 0) and a threshold of 0 labels everything positive
      (FPR = TPR = 1) [^1]. Balanced class weights make errors on the rare positive class costlier,
      so the model predicts it more often: fewer false negatives, more false positives [^2]. Macro
      averaging takes the plain mean over classes, unlike weighted averaging [^1].
    references:
      - source: ubc-dsci573
        locator: Lecture 1 notes, AP score; AP vs. F1-score; ROC curve; (Optional) Macro average and weighted average
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/01_classification-metrics.ipynb
      - source: ubc-dsci573
        locator: 'Lecture 1 notes, Dealing with class imbalance: class_weight="balanced"'
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/01_classification-metrics.ipynb
