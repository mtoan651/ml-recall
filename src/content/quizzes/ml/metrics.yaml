    question: |
      A classifier gives these scores on a test set:

      | | scores |
      | --- | --- |
      | positives | 0.9, 0.6, 0.35 |
      | negatives | 0.7, 0.4, 0.2, 0.1 |

      What is its ROC AUC?
    answer:
      numeric: 0.75
      tolerance: 0.001
      hint: a number between 0 and 1
      model: 9 of the $3 \times 4 = 12$ positive–negative pairs are ranked correctly, so AUC $= 9/12 = 0.75$
    explanation: |
      The ROC AUC equals the probability that a randomly chosen positive gets a higher score than a
      randomly chosen negative [^1]. Counting pairs: 0.9 beats all 4 negatives, 0.6 beats 3 (not 0.7)
      and 0.35 beats 2, so $9$ of $12$ pairs are ordered correctly and AUC $= 0.75$. The value only
      depends on the ranking of the scores, not on their size, which is why AUC measures how well the
      model separates the classes [^2].
    references:
      - title: 'Wikipedia: Receiver operating characteristic'
        url: https://en.wikipedia.org/wiki/Receiver_operating_characteristic#Area_under_the_curve
