  - id: metrics-049
    type: short_answer
    difficulty: easy
    tags:
      - jaccard-index
      - set-similarity
    question: |
      What is the Jaccard similarity of the sets $\{11, 12, 13, 14, 15\}$ and $\{12, 14, 16, 18\}$? Round to 3
      decimals.
    answer:
      numeric: 0.286
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\lvert\{12, 14\}\rvert / \lvert\{11, 12, 13, 14, 15, 16, 18\}\rvert = 2/7 \approx 0.286$
    explanation: |
      The Jaccard similarity is $J(A, B) = \lvert A \cap B \rvert / \lvert A \cup B \rvert$, the size of the
      intersection divided by the size of the union [^1][^2]. The sets share 12 and 14, and together contain
      7 different numbers, so $J = 2/7 \approx 0.286$. Applied to the pixel sets of two boxes or masks, the
      same ratio is the intersection over union (IoU) used in object detection [^2].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-201, p. 244; Solution SOL-201, p. 297
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Jaccard index'
        url: https://en.wikipedia.org/wiki/Jaccard_index
        locator: Overview
    source:
      id: dl-interviews
      ref: ch8#prb201
      url: https://arxiv.org/abs/2201.00650v2
    status: draft
