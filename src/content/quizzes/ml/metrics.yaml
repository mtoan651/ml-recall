  - id: metrics-026
    type: multiple
    difficulty: medium
    tags:
      - regression-metrics
      - rmse
      - mse
      - r2
      - mape
    question: Which statements about regression metrics are true? Select all that apply.
    options:
      - text: Precision and recall can still be used for regression problems, alongside other metrics
        why: Precision and recall count exact class matches; a regression prediction is almost never exactly right, so we need scores of how far off it is [^1].
      - text: An $R^2$ below 0 means the model does worse than always predicting the mean of the targets
        correct: true
      - text: RMSE is never negative
        correct: true
      - text: MSE by itself does not tell you whether the model is underpredicting or overpredicting
        correct: true
      - text: MAPE is expressed in the same units as the target
        why: MAPE averages errors as percentages of the true values, so it is unitless; RMSE is the metric in the target's units [^3].
    explanation: |
      Regression needs scores that reflect how wrong each prediction is, not whether it is exactly
      right [^1]. MSE and RMSE square the errors, so they are never negative and lose the sign of
      each error: over- and underprediction count the same [^2]. $R^2$ is 1 for perfect predictions
      and negative when the model is worse than the mean baseline [^2]. RMSE is in the units of the
      target, while MAPE is a unitless percentage [^3].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — Regression scoring functions'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — Mean squared error (MSE); RMSE; R^2'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 10: Regression metrics — What did we learn today? (scoring metrics)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/10_regression-metrics.ipynb
