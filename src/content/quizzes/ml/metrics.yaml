    status: draft
  - id: metrics-008
    type: single
    question: "You're building a binary classifier that checks photos of insect traps for whether a dangerous invasive species is present. If the model detects the species, the entomologist (insect scientist) on duty is notified. Early detection of this insect is critical to preventing an infestation. A false alarm (false positive) is easy to handle: the entomologist sees that the photo was misclassified and marks it as such. Assuming an acceptable accuracy level, which metric should this model be optimized for?"
    options:
      - text: Recall
        correct: true
      - text: False positive rate (FPR)
        why: In this scenario, false alarms (FP) are low-cost. Trying to minimize them at the risk of missing actual positives doesn't make sense.
      - text: Precision
        why: In this scenario, false alarms (FP) aren't particularly harmful, so trying to improve the correctness of positive classifications doesn't make sense.
    explanation: In this scenario, false alarms (FP) are low-cost, and false negatives are highly costly, so it makes sense to maximize recall, or the probability of detection. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: Accuracy, recall, precision, and related metrics'
        url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    source:
      id: google-mlcc
      ref: classification/accuracy-precision-recall#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall
    status: draft
  - id: metrics-009
    type: single
    question: Which of the following models performs worse than chance?
    options:
      - text: A model whose ROC curve has an AUC of 0.32
        correct: true
        image:
          src: ./metrics/metrics-009-a.svg
          alt: ROC curve that stays below the diagonal, moving right first and rising steeply only near FPR = 1, labelled AUC = 0.32.
      - text: A model whose ROC curve has an AUC of 0.508
        why: This model performs slightly better than chance.
        image:
          src: ./metrics/metrics-009-b.svg
          alt: ROC curve (dash-dot) that runs almost along the diagonal with small zig-zags, labelled AUC = 0.508.
      - text: A model whose ROC curve has an AUC of 0.5
