  - id: metrics-030
    type: short_answer
    difficulty: easy
    tags:
      - class-imbalance
      - class-weight
    question: |
      A training set has 950 non-fraud and 50 fraud transactions. scikit-learn's
      `class_weight="balanced"` gives class $c$ the weight
      $\frac{n_\text{samples}}{n_\text{classes} \cdot n_c}$. What weight does the fraud class get?
    answer:
      numeric: 10
      tolerance: 0.001
      hint: a number
      model: $1000 / (2 \times 50) = 10$ (and $1000 / (2 \times 950) \approx 0.53$ for non-fraud)
    explanation: |
      `class_weight` tells the classifier that errors on some classes matter more, for example a
      false negative ten times more than a false positive [^1]. The "balanced" setting picks weights
      inversely proportional to the class frequencies, $n_\text{samples} / (n_\text{classes}\,n_c)$
      [^1]: $1000/(2 \cdot 50) = 10$ for fraud and $1000/(2 \cdot 950) \approx 0.53$ for non-fraud,
      so both classes carry the same total weight of 500.
    references:
      - source: ubc-dsci573
        locator: Lecture 1 notes, Changing the training procedure; class_weight="balanced"
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/01_classification-metrics.ipynb
