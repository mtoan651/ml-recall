  - id: metrics-025
    type: multiple
    difficulty: medium
    tags:
      - classification-threshold
      - precision
      - recall
    question: |
      A classifier labels an example positive when its predicted probability exceeds a threshold.
      Which statements are true? Select all that apply.
    options:
      - text: Raising the threshold tends to decrease both true positives and false positives
        correct: true
      - text: Raising the threshold tends to decrease both true negatives and false negatives
        why: A higher threshold labels more examples negative, so true and false negatives *increase* [^1].
      - text: Lowering the threshold generally increases recall
        correct: true
      - text: Raising the threshold can improve precision if it removes many false positives without losing many true positives
        correct: true
    explanation: |
      A higher threshold is a higher bar for predicting positive: fewer examples are labeled
      positive, so both TP and FP fall, and both TN and FN rise [^1]. Recall $TP/(TP+FN)$ can then
      only stay the same or go down, which is why lowering the threshold is the way to raise
      recall [^1]. Precision $TP/(TP+FP)$ usually goes up with the threshold when the removed
      predictions are mostly false positives, though it can occasionally go down [^1].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 9: Classification metrics — Precision/Recall tradeoff; Decreasing the threshold; Increasing the threshold'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/09_classification-metrics.ipynb
    source:
