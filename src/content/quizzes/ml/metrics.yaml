  - id: metrics-010
    type: single
    question: A binary classifier's ROC curve has an AUC of 0.32, so it performs worse than chance. Which change makes it perform better than chance?
    options:
      - text: Reverse its predictions, so every **1** becomes **0** and every **0** becomes **1**.
        correct: true
      - text: Have it always predict the negative class (**0**), whatever the input.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
      - text: Have it always predict the positive class (**1**), whatever the input.
        why: This may or may not improve performance above chance. Also, as discussed in the [Accuracy](https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy) section, this isn't a useful model.
    explanation: If a binary classifier reliably puts examples in the wrong classes more often than chance, switching the class label immediately makes its predictions better than chance without having to retrain the model. [^1]
    references:
      - source: google-mlcc
        locator: 'Classification: ROC and AUC'
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    source:
      id: google-mlcc
      ref: classification/roc-and-auc#q3
      url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    status: draft
  - id: metrics-011
    type: single
    question: Imagine a phishing or malware classification model where phishing and malware websites are in the class labeled **1** (true) and harmless websites are in the class labeled **0** (false). This model mistakenly classifies a legitimate website as malware. What is this called?
    options:
      - text: A false positive
        correct: true
      - text: A true positive
        why: A true positive would be a malware site correctly classified as malware.
      - text: A false negative
        why: A false negative would be a malware site incorrectly classified as a legitimate site.
      - text: A true negative
        why: A true negative would be a legitimate site correctly classified as a legitimate site.
    explanation: A negative example (legitimate site) has been wrongly classified as a positive example (malware site). [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q1
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-012
    type: single
    question: In general, what happens to the number of false positives when the classification threshold increases? What about true positives?
    options:
      - text: Both true and false positives decrease.
        correct: true
      - text: Both true and false positives increase.
      - text: True positives increase. False positives decrease.
    explanation: As the threshold increases, the model will likely predict fewer positives overall, both true and false. A spam classifier with a threshold of .9999 will only label an email as spam if it considers the classification to be at least 99.99% likely, which means it is highly unlikely to mislabel a legitimate email, but also likely to miss actual spam email. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    source:
      id: google-mlcc
      ref: classification/thresholding#q2
      url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
    status: draft
  - id: metrics-013
    type: single
    question: In general, what happens to the number of false negatives when the classification threshold increases? What about true negatives?
    options:
      - text: Both true and false negatives increase.
        correct: true
      - text: Both true and false negatives decrease.
      - text: True negatives increase. False negatives decrease.
    explanation: As the threshold increases, the model will likely predict more negatives overall, both true and false. At a very high threshold, almost all emails, both spam and not-spam, will be classified as not-spam. [^1]
    references:
      - source: google-mlcc
        locator: Thresholds and the confusion matrix
        url: https://developers.google.com/machine-learning/crash-course/classification/thresholding
