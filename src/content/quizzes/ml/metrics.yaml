  - id: metrics-028
    type: short_answer
    difficulty: medium
    tags:
      - accuracy
      - precision
      - confusion-matrix
      - class-imbalance
    question: |
      Two classifiers are tested on 100 examples, 95 negative and 5 positive. Rows are the true
      class, columns the predicted class:

      | Method A | predicted negative | predicted positive |
      | --- | --- | --- |
      | **negative** | 90 | 5 |
      | **positive** | 5 | 0 |

      | Method B | predicted negative | predicted positive |
      | --- | --- | --- |
      | **negative** | 80 | 15 |
      | **positive** | 0 | 5 |

      Method A has accuracy {{1}} and precision {{2}}; method B has accuracy {{3}} and precision {{4}}.
    answer:
      blanks:
        - numeric: 0.9
          tolerance: 0.001
          hint: e.g. 0.75
        - numeric: 0
          tolerance: 0.001
          hint: e.g. 0.75
        - numeric: 0.85
          tolerance: 0.001
          hint: e.g. 0.75
        - numeric: 0.25
          tolerance: 0.001
          hint: e.g. 0.75
      model: 'A: accuracy $90/100 = 0.90$, precision $0/(0+5) = 0$; B: accuracy $85/100 = 0.85$, precision $5/(5+15) = 0.25$'
    explanation: |
      Accuracy is the fraction of all predictions that are correct, while precision is
      $TP/(TP + FP)$, the fraction of predicted positives that are really positive [^1]. Method A
      wins on accuracy (0.90 vs 0.85) only because it gets the many negatives right; it never finds
      a positive, so its precision (and recall) is 0. Method B catches all 5 positives with precision
      0.25. This is the course's counterexample to "higher accuracy implies higher precision" [^2].
    references:
      - source: ubc-dsci573
        locator: Lecture 1 notes, Confusion matrix; Precision, recall, f1 score
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/01_classification-metrics.ipynb
      - source: ubc-dsci573
        locator: Lecture 1 notes, iClicker Exercise 1.1 (answer with methods A and B)
        url: https://github.com/UBC-MDS/DSCI_573_feat-model-select/blob/741d72d4f4dd495a86352d4d6ee990dea41914ac/lectures/01_classification-metrics.ipynb
