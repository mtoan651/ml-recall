      alt: 'ROC curve labelled AUC = 0.84 with three marked points on its upper-left bend: A at about (FPR 0.20, TPR 0.72), B at about (0.27, 0.86) and C at about (0.39, 0.93).'
    options:
      - text: Point A
        correct: true
      - text: Point B
        why: This threshold balances true and false positives.
      - text: Point C
        why: This threshold maximizes true positives (flags more spam) at a cost of more false positives (more legitimate emails flagged as spam).
