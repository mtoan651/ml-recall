    question: |
      A test set has 990 examples of class A and 10 of class B. Model-One labels everything A.
      Model-Two flips a fair coin for each example. Taking expected counts for Model-Two and
      counting an undefined precision as 0, which statement is true?
    options:
      - text: Model-One wins on both accuracy and macro-F1, yet never finds a B
        correct: true
      - text: Macro-F1 ranks Model-Two above Model-One, because it gives both classes equal weight
        why: Model-Two's macro-F1 is about $(0.664 + 0.020)/2 \approx 0.34$, below Model-One's $(0.995 + 0)/2 \approx 0.50$ [^1].
      - text: Model-Two's expected recall for class B is 0.01
        why: Model-Two finds half of the B examples, recall 0.5; 0.01 is its expected precision for B, $5/500$ [^1].
      - text: Both models have the same expected accuracy
        why: Model-One is right on all 990 A's (accuracy 0.99); Model-Two is right half of the time (0.5) [^1].
    explanation: |
      Model-One: accuracy $990/1000 = 0.99$; for A, $P = 0.99$, $R = 1$, $F1 \approx 0.995$; for B
      nothing is predicted, so $R = 0$ and $F1 = 0$; macro-F1 $\approx 0.497$ [^1]. Model-Two: about
      495 A's and 5 B's are right; for A, $P = 495/500$, $R = 0.5$, $F1 \approx 0.664$; for B,
      $P = 5/500 = 0.01$, $R = 0.5$, $F1 \approx 0.020$; macro-F1 $\approx 0.342$. Neither accuracy
      nor macro-F1 alone exposes Model-One; the recall of the rare class does [^2].
