    question: |
      A query has 3 relevant documents. The ranking's top 6 results have relevance
      $[1, 0, 1, 0, 0, 1]$ (1 = relevant), so all 3 are retrieved. Using
      $\mathrm{AP} = \frac{1}{R}\sum_{k} P@k \cdot \mathrm{rel}_k$ with $R = 3$, what is the average
      precision? Give 3 decimals.
    answer:
      numeric: 0.722
      tolerance: 0.001
      hint: a number between 0 and 1, 3 decimals
      model: $\frac13\left(\frac11 + \frac23 + \frac36\right) = 0.722$
    explanation: |
      Average precision averages precision@k over the positions $k$ of the relevant documents [^1]. They
      sit at ranks 1, 3 and 6, where precision@k is $1/1$, $2/3$ and $3/6$, so
      $\mathrm{AP} = (1 + 0.667 + 0.5)/3 = 0.722$. Unlike precision@k, AP rewards putting relevant
      documents higher; the mean of AP over many queries is MAP [^1].
    references:
      - title: 'Wikipedia: Evaluation measures (information retrieval)'
        url: https://en.wikipedia.org/wiki/Evaluation_measures_(information_retrieval)#Average_precision
