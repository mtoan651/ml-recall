  - id: probability-033
    type: single
    difficulty: hard
    question: Consider a segment of length 10. Points A and B are chosen randomly such that A and B divide the segment into three smaller segments. What is the probability that the three smaller segments could form the sides of a triangle?
    options:
      - text: '0'
      - text: 10%
      - text: 25%
        correct: true
      - text: 50%
    explanation: |
      Let the cut points $a, b$ be independent and uniform on $[0,10]$. Their joint density is the product of the marginals, the constant $\tfrac{1}{100}$ on the square, and the probability of a region is the integral of that density over it [^1], i.e. its area divided by 100. Three pieces form a triangle exactly when each one is shorter than half the segment, 5; for $a < b$ that means $a < 5$, $b > 5$ and $b - a < 5$, a triangle of area 12.5. The case $b < a$ is symmetric, so the probability is $25/100 = 25\%$. The classic equilateral-triangle argument gives the same answer, with the favourable points filling the middle quarter [^2].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson20#two-continuous-random-variables
        locator: Sec. 20.1 Two Continuous Random Variables (Def. 20.1 joint PDF; Def. 20.4 independence)
      - title: The Broken Stick Problem (Duke University Mathematics, WebFeats II)
        url: https://sites.math.duke.edu/education/webfeatsII/gdrive/Team%20D/project/brokenstick.htm
        locator: Solution via the equilateral-triangle altitude theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/88
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=88
    status: draft
  - id: probability-034
    type: single
    difficulty: hard
    question: A fair coin is to be tossed 100 times, with each toss resulting in a head or a tail. If $H$ is the total number of heads and $T$ is the total number of tails, which of the following events has the greatest probability?
    options:
      - text: $H = 50$
      - text: $T \ge 60$
      - text: $51 \le H \le 55$
      - text: $H \ge 48$ and $T \ge 48$
        correct: true
    explanation: |
      $H$ is binomial with $n = 100$ and $p = 0.5$, so $\mu = np = 50$ and $\sigma = \sqrt{np(1-p)} = 5$ [^1]. Summing the pmf $\binom{100}{k}/2^{100}$ [^2] gives:
      - $P(48 \le H \le 52) \approx 0.383$
      - $P(51 \le H \le 55) \approx 0.325$
      - $P(H = 50) \approx 0.080$
      - $P(T \ge 60) = P(H \le 40) \approx 0.028$

      "$H \ge 48$ and $T \ge 48$" is the same as $48 \le H \le 52$: five values centred on the most likely count. "$51 \le H \le 55$" also has five values but sits to one side, so it is less likely. $T \ge 60$ is two standard deviations out.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#the-mean-and-variance
        locator: Sec. 10.5 The Mean and Variance
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#binomial
        locator: Sec. 22.8.4 Binomial
    source:
      id: mmlu-redux
      ref: college_mathematics/90
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=90
    status: draft
  - id: probability-035
    type: single
    difficulty: easy
    question: Why are probability and statistics important for data science?
    options:
      - text: Because you cannot operate on data without knowing math
      - text: Because data science is a science, with probability and statistics as its formal foundation
        correct: true
      - text: Because they guarantee that a pattern found in a sample holds for everyone
    explanation: |
      Data science uses scientific methods such as probability and statistics, and statistics gives
      it the mathematical foundations it applies to draw insights from data [^1]. The statistics
      lesson notes that you can work with data without deep knowledge of mathematics, although
      basic concepts help, so math is not a hard prerequisite [^2]. Statistics does not guarantee
      that a sample pattern holds for everyone either: a sample may not represent the population,
      which is why confidence intervals and hypothesis tests quantify the uncertainty [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-is-data-science
        locator: 'Lesson 1: Defining Data Science, sec. What is Data Science?'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md#confidence-intervals
        locator: 'Lesson 4: Statistics and Probability, introduction and sec. Confidence Intervals'
    source:
      id: ms-ds-for-beginners
      ref: quiz-6/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: probability-036
    type: single
    difficulty: easy
    question: An insurance agent is successful in selling a life insurance policy to 20 percent of the customers he contacts. He decides to construct a simulation with random digits (each of 0–9 equally likely) to estimate the mean number of customers he needs to contact before being able to sell a policy. Which of the following schemes should he use to do the simulation?
    options:
      - text: Assign numbers 0, 1 to successfully selling a policy to a customer and numbers 2, 3, 4, 5, 6, 7, 8, 9 to failing to sell a policy to a customer.
        correct: true
      - text: Assign numbers 0, 1 to successfully selling a policy to a customer and numbers 2, 3, 4 to failing to sell a policy to a customer.
      - text: Assign number 0 to successfully selling a policy to a customer and number 1 to failing to sell a policy to a customer.
      - text: Assign numbers 0, 1, 2, 3, 4 to successfully selling a policy to a customer and numbers 5, 6, 7, 8, 9 to failing to sell a policy to a customer.
    explanation: Each contact is a Bernoulli trial with success probability $p = 0.2$, and the number of contacts up to the first sale is a geometric random variable [^1]. With ten equally likely digits, the probability of an outcome is the number of digits assigned to it divided by 10 [^2], so giving two digits (0 and 1) to a sale and the other eight to no sale makes $P(\text{sale}) = 2/10 = 0.2$. Using only the digits 0–4 gives $2/5 = 0.4$, and the one-digit-each and five-digit schemes give $0.5$.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson11#geometric-distributions
        locator: Lesson 11, Sec. 11.1 Geometric Distributions (Def. 11.1; example with p = 0.20)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson02#the-classical-approach
        locator: Lesson 2, Sec. 2.4 How to Assign Probability to Events (The Classical Approach)
    source:
      id: mmlu-redux
      ref: high_school_statistics/69
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=69
    status: draft
  - id: probability-037
    type: single
    difficulty: medium
    question: A university’s mathematics department has 10 professors and will offer 20 different courses next semester. Each professor will be assigned to teach exactly 2 of the courses, and each course will have exactly one professor assigned to teach it. If any professor can be assigned to teach any course, how many different complete assignments of the 10 professors to the 20 courses are possible?
    options:
      - text: $20!/2^{10}$
        correct: true
      - text: $10!/2^9$
      - text: $10^{20} - 2^{10}$
      - text: $10^{20} - 100$
    explanation: "Assign the professors one at a time: the first gets 2 of the 20 courses, the second 2 of the remaining 18, and so on, so by the multiplicative principle [^1] the count is $\\binom{20}{2}\\binom{18}{2}\\cdots\\binom{2}{2}$ [^2]. Writing each factor as $\\frac{(20-2i)(19-2i)}{2}$, the product is $\\frac{20!}{2^{10}}$. Equivalently, list the 20 courses in a row and give positions 1–2 to the first professor, 3–4 to the second, and so on; swapping the two courses inside each pair gives the same assignment, which divides $20!$ by $2^{10}$. The answers built on $10^{20}$ count all ways to give each course a professor, ignoring the 'exactly 2 each' rule."
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_counting-addmult.html
        locator: Sec. 1.1 Additive and Multiplicative Principles
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_counting-combperm.html
        locator: Sec. 1.3 Combinations and Permutations
    source:
      id: mmlu-redux
      ref: college_mathematics/19
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=19
    status: draft
  - id: probability-038
    type: single
    difficulty: easy
    question: '$X$ is a finite set with the following property: the number of subsets of $X$ that contain exactly 3 elements is 14 more than the number of subsets of $X$ that contain exactly 2 elements. How many subsets of $X$ contain exactly 4 elements?'
    options:
      - text: '24'
      - text: '25'
      - text: '28'
      - text: '35'
        correct: true
    explanation: The number of $k$-element subsets of an $n$-element set is the binomial coefficient $\binom{n}{k}$ [^1]. We need $\binom{n}{3} - \binom{n}{2} = 14$; $n = 7$ gives $35 - 21 = 14$, and the difference only grows for larger $n$, so $|X| = 7$. Then $\binom{7}{4} = 35$, the same as $\binom{7}{3}$ by the symmetry $\binom{n}{k} = \binom{n}{n-k}$.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_counting-binom.html
        locator: Sec. 1.2 Binomial Coefficients
    source:
      id: mmlu-redux
      ref: college_mathematics/92
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=92
    status: draft
  - id: probability-039
    type: short_answer
    difficulty: medium
    tags:
      - laplace-distribution
      - variance
      - standard-deviation
    question: |
      The Laplace distribution has density $p(x) = \frac{1}{2}e^{-|x|}$. What is its standard
      deviation? (Hint: $\int_0^\infty x^2 e^{-x}\,dx = 2$.)
    answer:
      numeric: 1.414
      tolerance: 0.002
      hint: a number, 3 decimals
      model: mean 0 by symmetry; $E[X^2] = 2 \cdot \frac{1}{2}\int_0^\infty x^2e^{-x}dx = 2$, so $\sigma = \sqrt{2} \approx 1.414$
    explanation: |
      The density is symmetric about 0, so the mean is 0 [^1]. The variance is
      $E[X^2] - 0^2 = \int x^2 \frac{1}{2}e^{-|x|}dx = 2 \cdot \frac{1}{2}\int_0^\infty x^2 e^{-x}dx = 2$
      [^1], so the standard deviation is $\sqrt{2} \approx 1.414$. Compared with a Gaussian of the
      same variance, the Laplace density is sharper at the centre and has heavier tails; as a noise
      model it leads to the absolute (L1) loss, whose maximum-likelihood location estimate is the
      median [^2].
    references:
      - source: d2l
        locator: Sec. 22.6.1.7 Means and Variances in the Continuum
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#means-and-variances-in-the-continuum
      - title: 'Wikipedia: Laplace distribution'
        locator: Infobox (variance $2b^2$) and Statistical inference (the MLE of the location is the sample median; link to least absolute deviations)
        url: https://en.wikipedia.org/wiki/Laplace_distribution
      - source: d2l
        locator: Sec. 22.6.3 Exercises, Exercise 2
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/random-variables#ex2
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    status: draft
  - id: probability-040
    type: single
    difficulty: medium
    tags:
      - chebyshev-inequality
      - standard-deviation
      - tail-bounds
    question: |
      Someone says: "My random variable has mean 1 and standard deviation 2, and 25% of my samples
      were larger than 9." Should you believe them?
    options:
      - text: 'No: 9 is 4 standard deviations above the mean, and Chebyshev allows at most $1/16 = 6.25\%$ that far out'
        correct: true
      - text: 'Yes: Chebyshev bounds 4-standard-deviation events by $1/4 = 25\%$, so the claim sits exactly at the limit'
        why: The bound is $1/\alpha^2$, not $1/\alpha$; for $\alpha = 4$ it is $1/16$ [^1].
      - text: "Yes: Chebyshev's inequality only holds for Gaussians, so any tail is possible for this variable"
        why: Chebyshev's inequality holds for every distribution with a finite variance [^1].
      - text: 'No: a Gaussian puts only 0.003% beyond 4 standard deviations, the most any distribution can'
        why: The Gaussian is not the worst case; other distributions can put up to $1/16$ of their mass that far out [^1].
    explanation: |
      Chebyshev's inequality says
      $P(X \notin [\mu - \alpha\sigma, \mu + \alpha\sigma]) \le 1/\alpha^2$ for any random variable
      [^1]. Here $9 = 1 + 4 \cdot 2$, so $\alpha = 4$ and at most $1/16 = 6.25\%$ of the mass can lie
      above 9, or below $-7$. A claimed 25% contradicts the stated mean and standard deviation, so at
      least one of the numbers is wrong. The standard deviation therefore gives a guaranteed typical
      range for any distribution [^1].
    references:
      - source: d2l
        locator: Sec. 22.6.1.6 Standard Deviations, Eq. (22.6.20) (Chebyshev's inequality)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#standard-deviations
      - source: d2l
        locator: Sec. 22.6.3 Exercises, Exercise 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/random-variables#ex3
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    status: draft
  - id: probability-041
    type: single
    difficulty: medium
    tags:
      - covariance
      - independence
      - joint-density
    question: |
      $X$ and $Y$ have joint density $p(x, y) = 4xy$ for $x, y \in [0, 1]$ and 0 elsewhere. What is
      $\textrm{Cov}(X, Y)$?
    options:
      - text: 0, because the density factors as $(2x)(2y)$, so $X$ and $Y$ are independent
        correct: true
      - text: $4/9$, the value of $E[XY] = \iint xy \cdot 4xy\,dx\,dy$
        why: $E[XY] = 4/9$ is right, but the covariance subtracts $E[X]E[Y] = (2/3)^2 = 4/9$ [^1].
      - text: Positive, because the density is largest at $(1, 1)$, where both variables are large
        why: The density peaks at $(1, 1)$ because each marginal favours large values, not because the variables move together [^2].
      - text: Nonzero, because independence would need a constant density on the square
        why: Independence means the joint density is a product of the marginals, $2x \cdot 2y$ here, not that it is constant [^2].
    explanation: |
      Covariance is $E[XY] - E[X]E[Y]$ [^1]. Here $E[X] = \iint x \cdot 4xy = 2/3$, likewise
      $E[Y] = 2/3$, and $E[XY] = 4 \cdot \frac{1}{3} \cdot \frac{1}{3} = 4/9$, so the covariance is
      $4/9 - 4/9 = 0$. The shortcut: $4xy = (2x)(2y)$ is the product of the two marginal densities, so
      $X$ and $Y$ are independent, and independent variables have zero covariance [^2]. The converse
      fails: zero covariance does not imply independence [^1].
    references:
      - source: d2l
        locator: Sec. 22.6.1.10 Covariance (definition; covariance only measures linear relationships)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#covariance
      - source: d2l
        locator: Sec. 22.6.1.8 Joint Density Functions and Sec. 22.6.1.10 Covariance (independent implies zero covariance)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#joint-density-functions
      - source: d2l
        locator: Sec. 22.6.3 Exercises, Exercise 4
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/random-variables#ex4
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#exercises
    status: draft
  - id: probability-042
    type: short_answer
    difficulty: easy
    tags:
      - binomial-distribution
      - variance
      - independence
    question: |
      $X$ and $Y$ are independent with $X, Y \sim \textrm{Binomial}(16, 1/2)$. What is the standard
      deviation of $X - Y$?
    answer:
      numeric: 2.828
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\textrm{Var}(X - Y) = \textrm{Var}(X) + \textrm{Var}(Y) = 4 + 4 = 8$, so $\sigma = \sqrt{8} \approx 2.828$
    explanation: |
      A $\textrm{Binomial}(n, p)$ variable has variance $np(1 - p) = 16 \cdot \frac{1}{4} = 4$ [^1].
      For independent variables
      $\textrm{Var}(X - Y) = \textrm{Var}(X) + (-1)^2\textrm{Var}(Y) = 8$: variances add even when
      the variables are subtracted, because $\textrm{Var}(aY) = a^2\textrm{Var}(Y)$ [^2]. The standard
      deviation is $\sqrt{8} = 2\sqrt{2} \approx 2.828$, not $4 - 4 = 0$.
    references:
      - source: d2l
        locator: Sec. 22.8.4 Binomial (mean $np$, variance $np(1-p)$)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#binomial
      - source: d2l
        locator: Sec. 22.6.1.5 Variances (properties of the variance)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
      - source: d2l
        locator: Sec. 22.8.9 Exercises, Exercise 1
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/distributions#ex1
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#exercises
    status: draft
  - id: probability-043
    type: single
    difficulty: medium
    tags:
      - poisson-distribution
      - central-limit-theorem
    question: |
      For $X \sim \textrm{Poisson}(\lambda)$, $(X - \lambda)/\sqrt{\lambda}$ is approximately standard
      normal when $\lambda$ is large. Why does this make sense?
    options:
      - text: For integer $\lambda$, $X$ is a sum of $\lambda$ independent $\textrm{Poisson}(1)$ variables, so the central limit theorem applies
        correct: true
      - text: The Poisson mass function equals the Gaussian density exactly once $\lambda$ is large enough
        why: A discrete distribution never equals a continuous density; the standardized distribution only approaches the Gaussian in the limit [^1].
      - text: Subtracting the mean and dividing by the standard deviation always turns a variable into a standard normal
        why: Standardizing gives mean 0 and variance 1, but the shape of the distribution stays the same.
      - text: The Poisson is the limit of binomials, and every binomial is Gaussian when $p$ is small
        why: In the Poisson limit $np$ stays fixed, which gives a skewed Poisson rather than a Gaussian [^1].
    explanation: |
      Independent Poisson variables add: their sum is Poisson with the summed rate [^2]. So for
      integer $\lambda$, $X$ has the distribution of $\sum_{i=1}^{\lambda} X_i$ with i.i.d.
      $X_i \sim \textrm{Poisson}(1)$. The mean and the variance of $X$ are both $\lambda$ [^1], so
      $(X - \lambda)/\sqrt{\lambda}$ is exactly the standardized sum to which the central limit
      theorem applies [^1]. As $\lambda$ grows, the sum has more and more terms and the standardized
      distribution approaches $\mathcal{N}(0, 1)$.
    references:
      - source: d2l
        locator: Sec. 22.8.5 Poisson and Sec. 22.8.6 Gaussian (the central limit theorem)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#gaussian
      - title: 'Wikipedia: Poisson distribution'
        locator: Properties, Sums of Poisson-distributed random variables
        url: https://en.wikipedia.org/wiki/Poisson_distribution
      - source: d2l
        locator: Sec. 22.8.9 Exercises, Exercise 2
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/distributions#ex2
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#exercises
