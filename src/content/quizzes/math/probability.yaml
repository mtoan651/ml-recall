  - id: probability-027
    type: single
    difficulty: medium
    question: Suppose $X$ is a discrete random variable on the set of positive integers such that for each positive integer $n$, the probability that $X = n$ is $1/2^n$. If $Y$ is a random variable with the same probability distribution and $X$ and $Y$ are independent, what is the probability that the value of at least one of the variables $X$ and $Y$ is greater than 3?
    options:
      - text: 1/64
        why: $(1/8)^2 = 1/64$ is the probability that *both* exceed 3, not at least one.
      - text: 15/64
        correct: true
      - text: 1/4
        why: $\tfrac18 + \tfrac18 = \tfrac14$ counts the case where both exceed 3 twice; subtracting $\tfrac{1}{64}$ gives $\tfrac{15}{64}$.
      - text: 3/8
        why: Each variable exceeds 3 with probability $\tfrac18$, and at least one of the two does with probability $1 - (\tfrac78)^2 = \tfrac{15}{64}$, not $\tfrac38$.
    explanation: |
      $P(X \le 3) = \tfrac12 + \tfrac14 + \tfrac18 = \tfrac78$. For independent variables the joint probability factors, so $P(X \le 3, Y \le 3) = (\tfrac78)^2 = \tfrac{49}{64}$ [^1]. "At least one exceeds 3" is the complement of "both are at most 3", so its probability is $1 - \tfrac{49}{64} = \tfrac{15}{64}$ [^2]. $\tfrac{1}{64} = (\tfrac18)^2$ is the probability that *both* exceed 3.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (complement)
    source:
      id: mmlu-redux
      ref: college_mathematics/4
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=4
    status: reviewed
    reviewed_by: claude
  - id: probability-028
    type: single
    difficulty: medium
    question: There are 25 suitcases, 5 of which are damaged. Three suitcases are selected at random. What is the probability that exactly 2 are damaged?
    options:
      - text: 2/69
        why: $\tfrac{5}{25} \cdot \tfrac{4}{24} \cdot \tfrac{20}{23} = \tfrac{2}{69}$ is one particular order (damaged, damaged, intact); there are 3 such orders.
      - text: 1/30
        why: There are $\binom52\binom{20}{1} = 200$ favourable selections out of $\binom{25}{3} = 2300$, which gives $\tfrac{2}{23}$, not $\tfrac{1}{30}$.
      - text: 2/23
        correct: true
      - text: 12/125
        why: This is the binomial answer $3(\tfrac15)^2(\tfrac45)$, which would apply only if the suitcases were drawn with replacement.
    explanation: |
      Drawing 3 suitcases without replacement from 5 damaged and 20 intact ones is the hypergeometric setting [^1]. Count unordered selections with combinations ("$n$ choose $r$") [^2]:
      $$P(X = 2) = \frac{\binom52\binom{20}{1}}{\binom{25}{3}} = \frac{10 \times 20}{2300} = \frac{2}{23}.$$
      The option $\tfrac{12}{125} = 3(\tfrac15)^2(\tfrac45)$ is the binomial answer, which would apply only if the suitcases were drawn with replacement.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#hypergeometric-distribution
        locator: Sec. 7.4 Hypergeometric Distribution (Def. 7.4)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson03#combinations
        locator: Sec. 3.3 Combinations (Def. 3.6)
    source:
      id: mmlu-redux
      ref: college_mathematics/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=6
    status: reviewed
    reviewed_by: claude
  - id: probability-029
    type: single
    difficulty: medium
    question: 'A six-sided die (whose faces are numbered 1 through 6, as usual) is known to be counterfeit: The probability of rolling any even number is twice the probability of rolling any odd number. What is the probability that if this die is thrown twice, the first roll will be a 5 and the second roll will be a 6?'
    options:
      - text: 2/81
        correct: true
      - text: 1/18
        why: On this die $P(5) = \tfrac19$ and $P(6) = \tfrac29$, so the product is $\tfrac{2}{81}$, not $\tfrac{1}{18}$.
      - text: 2/27
        why: $\tfrac19 \cdot \tfrac23$ uses the probability of rolling *any* even number instead of a 6.
      - text: 1/9
        why: $\tfrac19$ is only $P(5)$; the second roll must also be a 6.
    explanation: |
      Let each odd face have probability $p$ and each even face $2p$. The six faces are mutually exclusive and together make up the whole sample space, so their probabilities sum to 1 [^1]: $3p + 3(2p) = 9p = 1$, so $p = \tfrac19$. That gives $P(5) = \tfrac19$ and $P(6) = \tfrac29$. The two throws are independent, so the probabilities multiply [^2]: $\tfrac19 \cdot \tfrac29 = \tfrac{2}{81}$. $\tfrac19$ is only the chance of rolling the 5.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (axioms of probability)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
    source:
      id: mmlu-redux
      ref: college_mathematics/24
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=24
    status: reviewed
    reviewed_by: claude
  - id: probability-030
    type: single
    difficulty: hard
    question: The probability that a point $(x, y)$ in $\mathbb{R}^2$ is chosen follows a uniform random distribution within the region described by the inequality $0 < |x| + |y| < 1$. What is the probability that $2(x + y) > 1$?
    options:
      - text: '0'
        why: The line $x + y = \tfrac12$ crosses the diamond, parallel to its edge $x + y = 1$, so the event has positive area.
      - text: 1/4
        correct: true
      - text: $\sqrt{2}/4$
        why: The strip $x + y > \tfrac12$ covers area $\tfrac12$ of the diamond's 2, a ratio of $\tfrac14$; no factor $\sqrt2$ survives in the ratio.
      - text: $1/\sqrt{2}$
        why: 'Far too large: only the strip between $x + y = \tfrac12$ and the edge $x + y = 1$ qualifies, area $\tfrac12$ out of 2.'
    explanation: |
      With a joint density, the probability of a region is the integral of the density over it [^1]. A uniform density is constant, so the probability is area(region)/area(diamond). Change variables to $u = x + y$, $v = x - y$. Since $|x| + |y| = \max(|u|, |v|)$, the diamond becomes the square $|u| < 1$, $|v| < 1$, and the point is still uniform. The event $2(x+y) > 1$ is $u > \tfrac12$, a strip covering $\tfrac{1/2}{2} = \tfrac14$ of that square; directly in $(x,y)$, the strip has area $\tfrac12$ out of the diamond's 2. The answer 0 is wrong because the line $x + y = \tfrac12$ does cross the diamond, parallel to its edge $x + y = 1$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#joint-density-functions
        locator: Sec. 22.6.1.8 Joint Density Functions
    source:
      id: mmlu-redux
      ref: college_mathematics/39
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=39
    status: reviewed
    reviewed_by: claude
  - id: probability-031
    type: single
    difficulty: medium
    question: If a real number $x$ is chosen at random in the interval $[0, 3]$ and a real number $y$ is chosen at random in the interval $[0, 4]$, what is the probability that $x < y$?
    options:
      - text: 1/2
        why: $\tfrac12$ would hold only if both numbers came from the same interval; here $y$ can also land in $(3, 4]$, where it is always larger than $x$.
      - text: 7/12
        why: The region $y \le x$ is a triangle of area 4.5 in the $3 \times 4$ rectangle, so $P(x < y) = 1 - 4.5/12 = \tfrac58$.
      - text: 5/8
        correct: true
      - text: 2/3
        why: $P(x < y) = P(y > 3) + P(y \le 3) \cdot \tfrac12 = \tfrac14 + \tfrac34 \cdot \tfrac12 = \tfrac58$, not $\tfrac23$.
    explanation: |
      A uniform variable on $[a,b]$ has constant density $1/(b-a)$ [^1], so $X$ has density $\tfrac13$ and $Y$ has density $\tfrac14$. For independent continuous variables, the joint density is the product of the marginals, here $\tfrac{1}{12}$ on the $3 \times 4$ rectangle, and the probability of a region is its integral [^2]. So probabilities are area ratios. The part of the rectangle with $y \le x$ is a triangle of area $\int_0^3 x\,dx = 4.5$, so
      $$P(x < y) = 1 - \frac{4.5}{12} = \frac58.$$
      $\tfrac12$ would only be right if the two intervals had the same length.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#continuous-uniform
        locator: Sec. 22.8.3 Continuous Uniform, Eq. (22.8.6)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson20#two-continuous-random-variables
        locator: Sec. 20.1 Two Continuous Random Variables (Def. 20.1 joint PDF; Def. 20.4 independence)
    source:
      id: mmlu-redux
      ref: college_mathematics/61
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=61
    status: reviewed
    reviewed_by: claude
  - id: probability-032
    type: single
    difficulty: medium
    question: In a game two players take turns tossing a fair coin; the winner is the first one to toss a head. The probability that the player who makes the first toss wins the game is
    options:
      - text: 1/4
        why: $\tfrac14$ is the chance that the game ends on the second toss (tails, then heads), which is a win for the second player.
      - text: 1/3
        why: $\tfrac13$ is the second player's chance, $1 - \tfrac23$.
      - text: 1/2
        why: The first player wins at once with probability $\tfrac12$ and can still win later, so the chance exceeds $\tfrac12$.
      - text: 2/3
        correct: true
    explanation: |
      The first player wins on toss 1, 3, 5, …. Winning on toss $2k+1$ needs $2k$ tails followed by a head, and independent tosses multiply [^1], so that has probability $(\tfrac12)^{2k+1}$. Adding these up gives a geometric series with first term $a = \tfrac12$ and ratio $r = \tfrac14$, whose sum is $a/(1-r)$ [^2]:
      $$P = \frac{1/2}{1 - 1/4} = \frac23.$$
      Going first is an advantage, so $\tfrac12$ is wrong. $\tfrac13$ is the second player's chance.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-8-3-geometric.html#sec-8-3-geometric-5
        locator: Sec. 8.3.3 Infinite Geometric Series, Eq. (8.3.11)
    source:
      id: mmlu-redux
      ref: college_mathematics/74
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=74
    status: reviewed
    reviewed_by: claude
  - id: probability-033
    type: single
    difficulty: hard
    question: Consider a segment of length 10. Points A and B are chosen randomly such that A and B divide the segment into three smaller segments. What is the probability that the three smaller segments could form the sides of a triangle?
    options:
      - text: '0'
        why: 'Many cuts work: cutting at 4 and 7 gives pieces 4, 3 and 3, which form a triangle.'
      - text: 10%
        why: The favourable cuts form two triangles of area 12.5 each in the $10 \times 10$ square of cut points, i.e. 25%.
      - text: 25%
        correct: true
      - text: 50%
        why: Every piece must be shorter than 5, which holds for only a quarter of the square of possible cut points, not half.
    explanation: |
      Let the cut points $a, b$ be independent and uniform on $[0,10]$. Their joint density is the product of the marginals, the constant $\tfrac{1}{100}$ on the square, and the probability of a region is the integral of that density over it [^1], i.e. its area divided by 100. Three pieces form a triangle exactly when each one is shorter than half the segment, 5; for $a < b$ that means $a < 5$, $b > 5$ and $b - a < 5$, a triangle of area 12.5. The case $b < a$ is symmetric, so the probability is $25/100 = 25\%$. The classic equilateral-triangle argument gives the same answer, with the favourable points filling the middle quarter [^2].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson20#two-continuous-random-variables
        locator: Sec. 20.1 Two Continuous Random Variables (Def. 20.1 joint PDF; Def. 20.4 independence)
      - title: The Broken Stick Problem (Duke University Mathematics, WebFeats II)
        url: https://sites.math.duke.edu/education/webfeatsII/gdrive/Team%20D/project/brokenstick.htm
        locator: Solution via the equilateral-triangle altitude theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/88
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=88
    status: reviewed
    reviewed_by: claude
  - id: probability-034
    type: single
    difficulty: hard
    question: A fair coin is to be tossed 100 times, with each toss resulting in a head or a tail. If $H$ is the total number of heads and $T$ is the total number of tails, which of the following events has the greatest probability?
    options:
      - text: $H = 50$
        why: A single value, even the most likely one, has probability only about 0.080.
      - text: $T \ge 60$
        why: '$T \ge 60$ means $H \le 40$, two standard deviations out: probability about 0.028.'
      - text: $H \ge 51$ and $T \ge 45$
        why: 'This is $51 \le H \le 55$: five values off to one side of the mode, probability about 0.325.'
      - text: $H \ge 48$ and $T \ge 48$
        correct: true
    explanation: |
      $H$ is binomial with $n = 100$ and $p = 0.5$, so $\mu = np = 50$ and $\sigma = \sqrt{np(1-p)} = 5$ [^1]. Since $T = 100 - H$, every option is an event about $H$ alone. Summing the pmf $\binom{100}{k}/2^{100}$ [^2] gives:
      - "$H \ge 48$ and $T \ge 48$" is $48 \le H \le 52$: probability $\approx 0.383$
      - "$H \ge 51$ and $T \ge 45$" is $51 \le H \le 55$: $\approx 0.325$
      - $H = 50$: $\approx 0.080$
      - $T \ge 60$ is $H \le 40$: $\approx 0.028$

      Both bands contain five values, but the first is centred on the most likely count while the second sits to one side, so the first is more likely. $T \ge 60$ is two standard deviations out.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#the-mean-and-variance
        locator: Sec. 10.5 The Mean and Variance
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#binomial
        locator: Sec. 22.8.4 Binomial
    source:
      id: mmlu-redux
      ref: college_mathematics/90
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=90
    status: reviewed
    reviewed_by: claude
  - id: probability-035
    type: single
    difficulty: easy
    question: Why are probability and statistics important for data science?
    options:
      - text: Because you cannot operate on data without knowing math
        why: The lesson notes that you can work with data without deep mathematical knowledge, although basic concepts help [^2].
      - text: Because data science is a science, with probability and statistics as its formal foundation
        correct: true
      - text: Because they guarantee that a pattern found in a sample holds for everyone
        why: 'Statistics quantifies uncertainty but guarantees nothing: a sample may not represent the whole population [^2].'
    explanation: |
      Data science uses scientific methods such as probability and statistics, and statistics gives
      it the mathematical foundations it applies to draw insights from data [^1]. The statistics
      lesson notes that you can work with data without deep knowledge of mathematics, although
      basic concepts help, so math is not a hard prerequisite [^2]. Statistics does not guarantee
      that a sample pattern holds for everyone either: a sample may not represent the population,
      which is why confidence intervals and hypothesis tests quantify the uncertainty [^2].
    references:
