domain: math
topic: probability
title: Probability
questions:
  - id: probability-001
    type: single
    difficulty: medium
    question: Given two Boolean random variables, $A$ and $B$, where $P(A) = 1/2$, $P(B) = 1/3$, and $P(A \mid \neg B) = 1/4$, what is $P(A \mid B)$?
    options:
      - text: 1/6
      - text: 1/4
      - text: 3/4
      - text: '1'
        correct: true
    explanation: |
      A conditional probability is a joint probability divided by the probability of the condition. So $P(A, \neg B) = P(A \mid \neg B)\,P(\neg B) = \tfrac14 \cdot \tfrac23 = \tfrac16$ [^1], using $P(\neg B) = 1 - \tfrac13$ [^2]. Summing the joint over both values of $B$ recovers the marginal, $P(A) = P(A,B) + P(A,\neg B)$ [^1], so $P(A,B) = \tfrac12 - \tfrac16 = \tfrac13$. Then $P(A \mid B) = P(A,B)/P(B) = \tfrac{1/3}{1/3} = 1$: $A$ always happens when $B$ does. $\tfrac16$ is the joint probability $P(A, \neg B)$, not the conditional that was asked for.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (Eqs. 2.6.2 and 2.6.6)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (axioms; complement)
    source:
      id: mmlu-redux
      ref: machine_learning/10
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=10
    status: draft
  - id: probability-002
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** For a continuous random variable $x$ and its probability distribution function $p(x)$, it holds that $0 \le p(x) \le 1$ for all $x$.

      **Statement 2.** Decision tree is learned by minimizing information gain.
    options:
      - text: True, True
      - text: False, False
        correct: true
      - text: True, False
      - text: False, True
    explanation: |
      Statement 1 is false. A density only has to be nonnegative and integrate to 1 [^1], so it can exceed 1. The uniform density on $[a,b]$ is $1/(b-a)$ [^2], which equals 2 on $[0, 0.5]$. Probabilities come from areas under $p(x)$, not from its height.
      Statement 2 is also false. Tree learners such as ID3 and CART pick, at each node, the split with the *largest* information gain, which is the same as minimizing the weighted child impurity [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#probability-density-functions
        locator: Sec. 22.6.1.2 Probability Density Functions, Eq. (22.6.10)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#continuous-uniform
        locator: Sec. 22.8.3 Continuous Uniform, Eq. (22.8.6)
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#tree-algorithms-id3-c4-5-c5-0-and-cart
        locator: 'Sec. 1.10.6 Tree algorithms: ID3, C4.5, C5.0 and CART; Sec. 1.10.7 Mathematical formulation'
    source:
      id: mmlu-redux
      ref: machine_learning/11
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=11
    status: draft
  - id: probability-003
    type: single
    difficulty: medium
    question: Say the incidence of a disease $D$ is about 5 cases per 100 people (i.e., $P(D) = 0.05$). Let Boolean random variable $D$ mean a patient “has disease $D$” and let Boolean random variable $TP$ stand for “tests positive.” Tests for disease $D$ are known to be very accurate in the sense that the probability of testing positive when you have the disease is 0.99, and the probability of testing negative when you do not have the disease is 0.97. What is $P(TP)$, the prior probability of testing positive?
    options:
      - text: '0.0368'
      - text: '0.473'
      - text: '0.078'
        correct: true
      - text: '0.0495'
        why: This counts only the true positives, $P(TP \mid D)P(D)$, and leaves out the false positives from healthy people.
    explanation: |
      Marginalize over disease status [^1]:
      $$P(TP) = P(TP \mid D)P(D) + P(TP \mid \neg D)P(\neg D) = 0.99(0.05) + 0.03(0.95) = 0.0495 + 0.0285 = 0.078.$$
      The false-positive rate is $1 - 0.97 = 0.03$. The value 0.0495 counts only true positives. The test is quite accurate, but because the disease is rare, more than a third of all positives come from healthy people.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eq. (2.6.7)
    source:
      id: mmlu-redux
      ref: machine_learning/13
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=13
    status: draft
  - id: probability-004
    type: single
    difficulty: medium
    question: Suppose we would like to calculate $P(H \mid E, F)$ and we have no conditional independence information. Which of the following sets of numbers are sufficient for the calculation?
    options:
      - text: $P(E, F)$, $P(H)$, $P(E \mid H)$, $P(F \mid H)$
      - text: $P(E, F)$, $P(H)$, $P(E, F \mid H)$
        correct: true
      - text: $P(H)$, $P(E \mid H)$, $P(F \mid H)$
      - text: $P(E, F)$, $P(E \mid H)$, $P(F \mid H)$
    explanation: |
      Bayes' theorem gives $P(H \mid E,F) = \dfrac{P(E,F \mid H)\,P(H)}{P(E,F)}$ [^1]. That uses exactly $P(E,F)$, $P(H)$ and $P(E,F \mid H)$. The sets with $P(E \mid H)$ and $P(F \mid H)$ would need $P(E,F \mid H) = P(E \mid H)P(F \mid H)$. That factorization is conditional independence of $E$ and $F$ given $H$ [^1], and the question rules it out. The set without $P(E,F)$ also lacks the normalizer.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (Bayes' theorem, Eq. 2.6.3; conditional independence)
    source:
      id: mmlu-redux
      ref: machine_learning/15
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=15
    status: draft
  - id: probability-005
    type: single
    difficulty: medium
    question: Say the incidence of a disease $D$ is about 5 cases per 100 people (i.e., $P(D) = 0.05$). Let Boolean random variable $D$ mean a patient “has disease $D$” and let Boolean random variable $TP$ stand for “tests positive.” Tests for disease $D$ are known to be very accurate in the sense that the probability of testing positive when you have the disease is 0.99, and the probability of testing negative when you do not have the disease is 0.97. What is $P(D \mid TP)$, the posterior probability that you have disease $D$ when the test is positive?
    options:
      - text: '0.0495'
      - text: '0.078'
      - text: '0.635'
        correct: true
      - text: '0.97'
    explanation: |
      By Bayes' theorem [^1],
      $$P(D \mid TP) = \frac{P(TP \mid D)P(D)}{P(TP)} = \frac{0.99 \times 0.05}{0.99 \times 0.05 + 0.03 \times 0.95} = \frac{0.0495}{0.078} \approx 0.635.$$
      The posterior is far below the test's 0.97–0.99 accuracy because the 5% prior is small, the same effect as in the textbook's HIV-test example [^1]. 0.0495 is the joint $P(TP, D)$, and 0.078 is the evidence $P(TP)$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eqs. (2.6.7)–(2.6.8)
    source:
      id: mmlu-redux
      ref: machine_learning/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=22
    status: draft
  - id: probability-006
    type: single
    difficulty: medium
    question: Which one of the following is equal to $P(A, B, C)$ given Boolean random variables $A$, $B$ and $C$, and no independence or conditional independence assumptions between any of them?
    options:
      - text: $P(A \mid B) \cdot P(B \mid C) \cdot P(C \mid A)$
      - text: $P(C \mid A, B) \cdot P(A) \cdot P(B)$
      - text: $P(A, B \mid C) \cdot P(C)$
        correct: true
      - text: $P(A \mid B, C) \cdot P(B \mid A, C) \cdot P(C \mid A, B)$
    explanation: |
      The definition of conditional probability, applied to the joint event $(A, B)$ and $C$, gives $P(A,B,C) = P(A,B \mid C)\,P(C)$ with no assumptions [^1]. $P(C \mid A,B)P(A)P(B)$ would need $A$ and $B$ to be independent, since in general $P(A,B) \ne P(A)P(B)$ [^1]. The products of three conditionals do not follow the chain rule. For example, $P(A \mid B)P(B \mid C)P(C \mid A)$ never includes a marginal.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (conditional probability, independence)
    source:
      id: mmlu-redux
      ref: machine_learning/52
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=52
    status: draft
  - id: probability-007
    type: single
    difficulty: easy
    question: Can you get heads 10 times in a row when throwing a coin?
    options:
      - text: yes
        correct: true
      - text: no
    explanation: |
      The lesson defines a probability as the number of favourable outcomes divided by the total, when all outcomes are equally likely [^1]. Ten tosses give $2^{10} = 1024$ equally likely sequences, and only one of them is all heads. Separate coin tosses are independent, so multiplying gives the same answer, $(1/2)^{10} = 1/1024$ [^2]. The probability is small but positive, so ten heads in a row is possible; it happens about once in a thousand tries.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
    source:
      id: ms-ds-for-beginners
      ref: quiz-6/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: probability-008
    type: single
    difficulty: easy
    question: When you throw a fair die, what is the probability of getting an even number?
    options:
      - text: 1/2
        correct: true
      - text: 1/3
      - text: impossible to tell
    explanation: |
      A fair die has six equally likely faces, and three of them (2, 4, 6) are even, so the probability is $3/6 = 1/2$ [^1]. "Impossible to tell" would only apply to an unknown, possibly biased die. $1/3$ counts the wrong number of faces.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
    source:
      id: ms-ds-for-beginners
      ref: quiz-6/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: probability-009
    type: single
    difficulty: easy
    shuffle: false
    question: We throw the dice 100 times and compute the average value. What would be the distribution of the result?
    options:
      - text: uniform
      - text: normal
        correct: true
      - text: none of the above
    explanation: |
      By the central limit theorem, the mean of a large random sample is approximately normal, with mean $\mu$ and variance $\sigma^2/n$. This holds whatever distribution the individual values come from, including discrete ones [^1][^2]. One roll is uniform on $\{1,\dots,6\}$, but the average of 100 rolls piles up around 3.5 in a bell shape, with standard deviation $\sigma/\sqrt{100} \approx 0.17$. The uniform answer describes a single roll, not the average.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Law of Large Numbers and Central Limit Theorem"'
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson27#the-theorem
        locator: Sec. 27.1 The Theorem (Central Limit Theorem)
    source:
      id: ms-ds-for-beginners
      ref: quiz-7/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: probability-010
    type: single
    difficulty: medium
    question: Players in the National Football League weigh, on average, about 248 pounds with a standard deviation of about 47 pounds. If four players are to be selected at random, the expected value of the random variable $W$, the total combined weight of the four players, is 992 pounds. The standard deviation of $W$ is approximately
    options:
      - text: 47 pounds
      - text: 67 pounds
      - text: 94 pounds
        correct: true
      - text: 141 pounds
    explanation: |
      For independent random variables, variances add: $\operatorname{Var}(X+Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$ [^1]. So $\operatorname{Var}(W) = 4 \times 47^2$ and $\operatorname{SD}(W) = \sqrt{4}\times 47 = 94$ pounds. Standard deviations do not add: that would give $4 \times 47 = 188$. 47 is the SD of a single player.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=6
    status: draft
  - id: probability-011
    type: single
    difficulty: easy
    question: Two events $A$ and $B$ each have a nonzero probability. If $A$ and $B$ are independent, which of the following statements is true?
    options:
      - text: $P(A \text{ and } B) = P(A) \cdot P(B)$
        correct: true
      - text: $A$ and $B$ may or may not be mutually exclusive.
      - text: $A$ and $B$ must be mutually exclusive.
      - text: $P(A \mid B) = P(B \mid A)$
    explanation: |
      $A$ and $B$ are independent exactly when $P(A \cap B) = P(A)P(B)$ [^1]. If both probabilities are positive, that product is positive, so the events share outcomes and cannot be mutually exclusive. The reverse also holds: mutually exclusive events with positive probabilities are always dependent, because $P(A \cap B) = 0 \ne P(A)P(B)$ [^2]. That rules out both "may or may not be mutually exclusive" and "must be mutually exclusive". $P(A \mid B) = P(B \mid A)$ does not follow either: under independence it would need $P(A) = P(B)$.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson05#two-definitions
        locator: Sec. 5.1 Two Definitions (Def. 5.2 Independent Events)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#independent-vs.-mutually-exclusive
        locator: Sec. 2.6, Independent vs. Mutually Exclusive
    source:
      id: mmlu-redux
      ref: high_school_statistics/9
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=9
    status: draft
  - id: probability-012
    type: single
    difficulty: medium
    question: An automobile service station performs oil changes and tire replacements, as well as other services. Sixty percent of its customers request an oil change, 30 percent request tire replacements, and 10 percent request both. A customer requests an oil change. What is the probability this customer does not request tire replacements?
    options:
      - text: '0.42'
      - text: '0.5'
      - text: '0.7'
      - text: '0.833'
        correct: true
    explanation: |
      Use $P(A \mid B) = P(A \cap B)/P(B)$ [^1], with $B$ = "oil change" and $A$ = "no tire replacement". The customers who want an oil change but no tires make up $0.60 - 0.10 = 0.50$ of all customers, so $P(A \mid B) = 0.50/0.60 \approx 0.833$. 0.5 forgets to divide by $P(\text{oil})$. 0.7 is the share of *all* customers who skip tires, which ignores the condition.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#what-is-conditional-probability
        locator: Sec. 4.2 What is Conditional Probability? (Def. 4.1)
    source:
      id: mmlu-redux
      ref: high_school_statistics/27
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=27
    status: draft
  - id: probability-013
    type: single
    difficulty: medium
    question: There are two games involving flipping a fair coin. In the first game you win a prize if you can throw between 45% and 55% heads. In the second game you win if you can throw more than 80% heads. For each game would you rather flip the coin 30 times or 300 times?
    options:
      - text: 30 times for each game
      - text: 300 times for each game
      - text: 30 times for the first game and 300 times for the second
      - text: 300 times for the first game and 30 times for the second
        correct: true
    explanation: |
      The relative frequency of heads converges to the true probability as the number of tosses grows (the law of large numbers), and the typical error shrinks at a rate of about $1/\sqrt n$ [^1].
      - The 45–55% game rewards a proportion close to 0.5, so more flips help: about 0.93 with 300 flips versus about 0.42 with 30.
      - The over-80% game needs a big deviation from 0.5, which only a small sample has any real chance of producing: about $1.6 \times 10^{-4}$ with 30 flips versus about $10^{-27}$ with 300.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-simple-example-tossing-coins
        locator: 'Sec. 2.6.1 A Simple Example: Tossing Coins'
    source:
      id: mmlu-redux
      ref: high_school_statistics/36
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=36
    status: draft
  - id: probability-014
    type: single
    difficulty: medium
    question: Which of the following is a binomial random variable?
    options:
      - text: The number of tosses before a "5" appears when tossing a fair die.
      - text: The number of points a hockey team receives in 10 games, where two points are awarded for wins, one point for ties, and no points for losses.
      - text: The number of hearts out of five cards randomly drawn from a deck of 52 cards, without replacement.
      - text: The number of motorists not wearing seat belts in a random sample of five drivers.
        correct: true
    explanation: |
      A binomial random variable counts successes in a fixed number $n$ of identical, independent trials, each with two outcomes and the same success probability $p$ [^1]. Five randomly sampled drivers, each either belted or not, meet every condition. Each of the other options breaks one:
      - Counting tosses until the first "5" has no fixed $n$; repeating trials until the first success is the geometric setting [^2].
      - A hockey game has three outcomes (2, 1 or 0 points), not two.
      - Cards drawn without replacement change the chance of a heart from draw to draw; that count is hypergeometric [^3].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson11#geometric-distributions
        locator: Sec. 11.1 Geometric Distributions (Def. 11.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#hypergeometric-distribution
        locator: Sec. 7.4 Hypergeometric Distribution (Def. 7.4)
    source:
      id: mmlu-redux
      ref: high_school_statistics/37
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=37
    status: draft
  - id: probability-015
    type: single
    difficulty: medium
    question: Semir rolls a six-sided die every morning to determine what he will have for breakfast. If he rolls a 1 or 2, he takes time to cook himself a big breakfast. If he rolls a 3 or larger he grabs a quick lighter breakfast. When he cooks himself a big breakfast, there is a 15% chance he will be late for school. If he has a lighter breakfast, there is a 6% chance he will be late for school. What is the probability Semir will be on time for school any given day?
    options:
      - text: '0.09'
      - text: '0.21'
      - text: '0.8'
      - text: '0.91'
        correct: true
    explanation: |
      Marginalize over the type of breakfast: $P(\text{late}) = P(\text{late} \mid \text{big})P(\text{big}) + P(\text{late} \mid \text{light})P(\text{light})$ [^1]. With $P(\text{big}) = 2/6 = 1/3$, this is $\tfrac13(0.15) + \tfrac23(0.06) = 0.05 + 0.04 = 0.09$. Being on time is the complement, $1 - 0.09 = 0.91$ [^2]. 0.09 is the chance of being late, and 0.21 adds the two conditional rates without weighting them.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (marginalization, Eq. 2.6.6)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (complement)
    source:
      id: mmlu-redux
      ref: high_school_statistics/49
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=49
    status: draft
  - id: probability-016
    type: single
    difficulty: medium
    question: In which of the following situations is a binomial model not an appropriate model to describe the outcome?
    options:
      - text: The number of heads in three tosses of a coin
      - text: The number of rainy days in a given week
        correct: true
      - text: The number of girls in a family of five children
      - text: The number of sixes in ten rolls of a fair die
    explanation: |-
      A binomial random variable requires, among other things, that the $n$ trials are independent and that the success probability $p$ is the same on every trial [^1]. Rainy days fail both: weather tends to persist, so rain today makes rain tomorrow more likely, and the chance of rain also changes with the season. Coin tosses, die rolls and the sex of each child are the standard examples of independent trials with a constant $p$, so those three counts are binomial.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
    source:
      id: mmlu-redux
      ref: high_school_statistics/52
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=52
    status: draft
  - id: probability-017
    type: single
    difficulty: medium
    question: A publisher used standard boxes for shipping books. The mean weight of books packed per box is 25 pounds, with a standard deviation of two pounds. The mean weight of the boxes is one pound, with a standard deviation of 0.15 pounds. The mean weight of the packing material used per box is two pounds, with a standard deviation of 0.25 pounds. What is the standard deviation of the weights of the packed boxes?
    options:
      - text: 28.000 pounds
      - text: 5.290 pounds
      - text: 4.085 pounds
      - text: 2.021 pounds
        correct: true
    explanation: |
      The packed weight is books + box + packing, so the means add ($25 + 1 + 2 = 28$). The SDs do not add, but for independent parts the variances do [^1]:
      $$\sigma = \sqrt{2^2 + 0.15^2 + 0.25^2} = \sqrt{4.085} \approx 2.021 \text{ pounds}.$$
      28 is the mean, not the SD. 4.085 is the variance, before taking the square root.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/53
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=53
    status: draft
  - id: probability-018
    type: single
    difficulty: hard
    question: During the years 1886 through 2000 there were an average of 8.7 tropical cyclones per year, of which an average of 5.1 became hurricanes. Assuming that the probability of any cyclone becoming a hurricane is independent of what happens to any other cyclone, if there are five cyclones in one year, what is the probability that at least three become hurricanes?
    options:
      - text: '0.313'
      - text: '0.345'
      - text: '0.586'
      - text: '0.658'
        correct: true
    explanation: |
      Each of the 5 cyclones becomes a hurricane independently, with the same probability $p = 5.1/8.7 \approx 0.586$, so the number $X$ of hurricanes is binomial [^1]. Exactly $k$ successes can occur in $\binom{n}{k}$ ways, each with probability $p^k(1-p)^{n-k}$ [^2]. So
      $$P(X \ge 3) = \sum_{k=3}^{5}\binom5k (0.586)^k(0.414)^{5-k} \approx 0.345 + 0.244 + 0.069 = 0.658.$$
      The option 0.345 is only $P(X = 3)$, and 0.586 is $p$ itself.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#binomial
        locator: Sec. 22.8.4 Binomial
    source:
      id: mmlu-redux
      ref: high_school_statistics/56
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=56
    status: draft
  - id: probability-019
    type: single
    difficulty: medium
    question: A test for heartworm in dogs shows a positive result in 96% of dogs that actually have heartworm, and shows a negative result in 98% of dogs with no heartworm. If heartworm actually occurs in 10% of dogs, what is the probability that a randomly selected dog that tested positive for heartworm actually has heartworm?
    options:
      - text: 11%
      - text: 18%
      - text: 84%
        correct: true
      - text: 88%
    explanation: |
      Bayes' theorem with marginalization in the denominator [^1]:
      $$P(\text{HW} \mid +) = \frac{0.96 \times 0.10}{0.96 \times 0.10 + 0.02 \times 0.90} = \frac{0.096}{0.114} \approx 0.84.$$
      The false-positive rate is $1 - 0.98 = 0.02$. 11% is roughly $P(+) = 0.114$ itself, and 88% is close to $P(\text{no HW}, -) = 0.90 \times 0.98 = 0.882$, a different event.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eqs. (2.6.7)–(2.6.8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/61
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=61
    status: draft
  - id: probability-020
    type: single
    difficulty: easy
    question: Which of the following statements about any two events $A$ and $B$ is true?
    options:
      - text: $P(A \cup B) = 1$ implies events $A$ and $B$ are independent.
      - text: $P(A \cup B) = 1$ implies events $A$ and $B$ are mutually exclusive.
      - text: $P(A \cap B) = 0$ implies events $A$ and $B$ are independent.
      - text: $P(A \cap B) = 0$ implies events $A$ and $B$ are mutually exclusive.
        correct: true
    explanation: |-
      Mutually exclusive events cannot occur together: their intersection is empty, so $P(A \cap B) = 0$ [^1]. The key statement uses this link in the reverse direction, as introductory courses do. That is exact when every outcome has positive probability, as in a finite sample space with no impossible outcomes; in general an overlap can have probability 0. $P(A \cap B) = 0$ does not give independence: mutually exclusive events with positive probabilities are in fact dependent, since $0 \ne P(A)P(B)$ [^2]. $P(A \cup B) = 1$ only says that the two events together cover the sample space. They may still overlap, so they need not be mutually exclusive, and they need not be independent either: an event $A$ with $P(A) = \tfrac12$ and its complement $A'$ give $P(A \cup A') = 1$ but $P(A \cap A') = 0 \ne \tfrac14$.
    references:
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.12 Probability of the empty set)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#independent-vs.-mutually-exclusive
        locator: Sec. 2.6, Independent vs. Mutually Exclusive
    source:
      id: mmlu-redux
      ref: high_school_statistics/67
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=67
    status: draft
  - id: probability-021
    type: single
    difficulty: medium
    question: All of the following statements are true for all discrete random variables except for which one?
    options:
      - text: The possible outcomes must all be numerical.
      - text: The possible outcomes must be mutually exclusive.
      - text: The mean (expected value) always equals the sum of the products obtained by multiplying each value by its corresponding probability.
      - text: Approximately 95% of the outcomes will be within two standard deviations of the mean.
        correct: true
    explanation: |
      "About 95% within two standard deviations" is the empirical rule, and it comes from the normal distribution [^1]. A skewed or two-valued discrete variable need not follow it. The other statements hold for every discrete random variable:
      - A random variable assigns exactly one real number to each outcome, so its values are numerical [^2].
      - Its distinct values are mutually exclusive outcomes, and the probability mass function sums to 1 over them [^3].
      - Its expected value is $\sum_x x\,P(X = x)$ [^4].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson16#the-empirical-rule-revisited
        locator: Sec. 16.6, The Empirical Rule Revisited
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#discrete-random-variables
        locator: Sec. 7.1 Discrete Random Variables (Def. 7.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#probability-mass-functions
        locator: Sec. 7.2 Probability Mass Functions (Def. 7.3)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#expectations
        locator: Sec. 2.6.6 Expectations, Eq. (2.6.12)
    source:
      id: mmlu-redux
      ref: high_school_statistics/74
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=74
    status: draft
  - id: probability-022
    type: single
    difficulty: medium
    question: The financial aid office at a state university conducts a study to determine the total student costs per semester. All students are charged \$4500 for tuition. The mean cost for books is \$350 with a standard deviation of \$65. The mean outlay for room and board is \$2800 with a standard deviation of \$380. The mean personal expenditure is \$675 with a standard deviation of \$125. Assuming independence among categories, what is the standard deviation of the total student costs?
    options:
      - text: \$24
      - text: \$91
      - text: \$190
      - text: \$405
        correct: true
    explanation: |
      Tuition is a fixed \$4500 for everyone. Adding a constant does not change the variance, because $\operatorname{Var}(X + b) = \operatorname{Var}(X)$ [^1]. For the independent categories, variances add [^1]:
      $$\sigma = \sqrt{65^2 + 380^2 + 125^2} = \sqrt{164{,}250} \approx \$405.$$
      Adding the SDs directly would give \$570, which is not offered. \$190 is their average.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=75
    status: draft
  - id: probability-023
    type: single
    difficulty: medium
    question: Suppose that 54% of the graduates from your high school go on to 4-year colleges, 20% go on to 2-year colleges, 19% find employment, and the remaining 7% search for a job. If a randomly selected student is not going on to a 2-year college, what is the probability she will be going on to a 4-year college?
    options:
      - text: '0.460'
      - text: '0.540'
      - text: '0.630'
      - text: '0.675'
        correct: true
    explanation: |
      Use $P(A \mid B) = P(A \cap B)/P(B)$ [^1], with $B$ = "not a 2-year college" and $P(B) = 1 - 0.20 = 0.80$. Every 4-year-college student is in $B$, so $P(A \cap B) = 0.54$ and the answer is $0.54/0.80 = 0.675$. 0.54 ignores the condition, and 0.46 is its complement.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#what-is-conditional-probability
        locator: Sec. 4.2 What is Conditional Probability? (Def. 4.1)
    source:
      id: mmlu-redux
      ref: high_school_statistics/76
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=76
    status: draft
  - id: probability-024
    type: single
    difficulty: medium
    question: When a patient complains to the doctor about a certain set of symptoms, the doctor diagnoses the patient with Condition A 15% of the time. If a patient with these symptoms is diagnosed with Condition A, he or she is diagnosed with Condition B 70% of the time. A patient with these symptoms that is not diagnosed with Condition A is diagnosed with Condition B 10% of the time. What is the probability that a patient with this set of symptoms will be diagnosed with at least one of these conditions?
    options:
      - text: '0.235'
        correct: true
      - text: '0.25'
      - text: '0.765'
      - text: '0.85'
    explanation: |
      Go through the complement. By the multiplication rule, a patient gets neither diagnosis with probability $P(A')P(B' \mid A') = 0.85 \times 0.90 = 0.765$ [^1], so $P(\text{at least one}) = 1 - 0.765 = 0.235$ [^2]. The union formula $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ [^2] agrees: $P(A \cap B) = 0.15 \times 0.70 = 0.105$ and $P(B) = 0.105 + 0.085 = 0.19$. 0.765 is the probability of neither, and 0.25 just adds 0.15 and 0.10.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#multiplication-rule
        locator: Sec. 4.3 Multiplication Rule (Def. 4.2)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.11 complement; 2.13 union)
    source:
      id: mmlu-redux
      ref: high_school_statistics/86
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=86
    status: draft
  - id: probability-025
    type: single
    difficulty: easy
    question: Suppose you toss a fair die three times and it comes up an even number each time. Which of the following is a true statement?
    options:
      - text: By the law of large numbers, the next toss is more likely to be an odd number than another even number.
      - text: Based on the properties of conditional probability the next toss is more likely to be an even number given that three in a row have been even.
      - text: Dice actually do have memories, and thus the number that comes up on the next toss will be influenced by the previous tosses.
      - text: The probability that the next toss will again be even is 0.5.
        correct: true
    explanation: |
      Separate tosses are independent: one result tells you nothing about the next, just like two separate coin flips [^1]. So an even number on the fourth toss still has probability $3/6 = 0.5$. The law of large numbers is about long-run averages settling near the true probability [^2]. It does not push the next toss towards odd to "balance" a streak. The two options that claim the die remembers the streak are versions of the gambler's fallacy.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-simple-example-tossing-coins
        locator: 'Sec. 2.6.1 A Simple Example: Tossing Coins (law of large numbers)'
    source:
      id: mmlu-redux
      ref: high_school_statistics/98
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=98
    status: draft
  - id: probability-026
    type: single
    difficulty: medium
    question: Sofia and Tess will each randomly choose one of the 10 integers from 1 to 10. What is the probability that neither integer chosen will be the square of the other?
    options:
      - text: '0.64'
      - text: '0.72'
      - text: '0.81'
      - text: '0.95'
        correct: true
    explanation: |
      By the multiplication principle there are $10 \times 10 = 100$ equally likely ordered pairs (Sofia, Tess) [^1]. With equally likely outcomes, a probability is a count divided by the size of the sample space [^2]. The pairs where one number is the square of the other are $(1,1)$, $(2,4)$, $(4,2)$, $(3,9)$ and $(9,3)$: five in all, since $1 = 1^2$ counts and $4^2 = 16$ is out of range. The complement rule gives $1 - 5/100 = 0.95$ [^3]. Values like 0.81 look like products of probabilities, but nothing here is being multiplied.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson03#the-multiplication-principle
        locator: Sec. 3.1 The Multiplication Principle (Def. 3.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson02#the-classical-approach
        locator: Sec. 2.4, The Classical Approach
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.11 Probability of a complement)
    source:
      id: mmlu-redux
      ref: college_mathematics/2
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=2
    status: draft
  - id: probability-027
    type: single
    difficulty: medium
    question: Suppose $X$ is a discrete random variable on the set of positive integers such that for each positive integer $n$, the probability that $X = n$ is $1/2^n$. If $Y$ is a random variable with the same probability distribution and $X$ and $Y$ are independent, what is the probability that the value of at least one of the variables $X$ and $Y$ is greater than 3?
    options:
      - text: 1/64
      - text: 15/64
        correct: true
      - text: 1/4
      - text: 3/8
    explanation: |
      $P(X \le 3) = \tfrac12 + \tfrac14 + \tfrac18 = \tfrac78$. For independent variables the joint probability factors, so $P(X \le 3, Y \le 3) = (\tfrac78)^2 = \tfrac{49}{64}$ [^1]. "At least one exceeds 3" is the complement of "both are at most 3", so its probability is $1 - \tfrac{49}{64} = \tfrac{15}{64}$ [^2]. $\tfrac{1}{64} = (\tfrac18)^2$ is the probability that *both* exceed 3.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (complement)
    source:
      id: mmlu-redux
      ref: college_mathematics/4
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=4
    status: draft
  - id: probability-028
    type: single
    difficulty: medium
    question: There are 25 suitcases, 5 of which are damaged. Three suitcases are selected at random. What is the probability that exactly 2 are damaged?
    options:
      - text: 2/69
      - text: 1/30
      - text: 2/23
        correct: true
      - text: 12/125
    explanation: |
      Drawing 3 suitcases without replacement from 5 damaged and 20 intact ones is the hypergeometric setting [^1]. Count unordered selections with combinations ("$n$ choose $r$") [^2]:
      $$P(X = 2) = \frac{\binom52\binom{20}{1}}{\binom{25}{3}} = \frac{10 \times 20}{2300} = \frac{2}{23}.$$
      The option $\tfrac{12}{125} = 3(\tfrac15)^2(\tfrac45)$ is the binomial answer, which would apply only if the suitcases were drawn with replacement.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#hypergeometric-distribution
        locator: Sec. 7.4 Hypergeometric Distribution (Def. 7.4)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson03#combinations
        locator: Sec. 3.3 Combinations (Def. 3.6)
    source:
      id: mmlu-redux
      ref: college_mathematics/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=6
    status: draft
  - id: probability-029
    type: single
    difficulty: medium
    question: 'A six-sided die (whose faces are numbered 1 through 6, as usual) is known to be counterfeit: The probability of rolling any even number is twice the probability of rolling any odd number. What is the probability that if this die is thrown twice, the first roll will be a 5 and the second roll will be a 6?'
    options:
      - text: 2/81
        correct: true
      - text: 1/18
      - text: 2/27
      - text: 1/9
    explanation: |
      Let each odd face have probability $p$ and each even face $2p$. The six faces are mutually exclusive and together make up the whole sample space, so their probabilities sum to 1 [^1]: $3p + 3(2p) = 9p = 1$, so $p = \tfrac19$. That gives $P(5) = \tfrac19$ and $P(6) = \tfrac29$. The two throws are independent, so the probabilities multiply [^2]: $\tfrac19 \cdot \tfrac29 = \tfrac{2}{81}$. $\tfrac19$ is only the chance of rolling the 5.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (axioms of probability)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
    source:
      id: mmlu-redux
      ref: college_mathematics/24
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=24
    status: draft
  - id: probability-030
    type: single
    difficulty: hard
    question: The probability that a point $(x, y)$ in $\mathbb{R}^2$ is chosen follows a uniform random distribution within the region described by the inequality $0 < |x| + |y| < 1$. What is the probability that $2(x + y) > 1$?
    options:
      - text: '0'
      - text: 1/4
        correct: true
      - text: $\sqrt{2}/4$
      - text: $1/\sqrt{2}$
    explanation: |
      With a joint density, the probability of a region is the integral of the density over it [^1]. A uniform density is constant, so the probability is area(region)/area(diamond). Change variables to $u = x + y$, $v = x - y$. Since $|x| + |y| = \max(|u|, |v|)$, the diamond becomes the square $|u| < 1$, $|v| < 1$, and the point is still uniform. The event $2(x+y) > 1$ is $u > \tfrac12$, a strip covering $\tfrac{1/2}{2} = \tfrac14$ of that square; directly in $(x,y)$, the strip has area $\tfrac12$ out of the diamond's 2. The answer 0 is wrong because the line $x + y = \tfrac12$ does cross the diamond, parallel to its edge $x + y = 1$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#joint-density-functions
        locator: Sec. 22.6.1.8 Joint Density Functions
    source:
      id: mmlu-redux
      ref: college_mathematics/39
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=39
    status: draft
  - id: probability-031
    type: single
    difficulty: medium
    question: If a real number $x$ is chosen at random in the interval $[0, 3]$ and a real number $y$ is chosen at random in the interval $[0, 4]$, what is the probability that $x < y$?
    options:
      - text: 1/2
      - text: 7/12
      - text: 5/8
        correct: true
      - text: 2/3
    explanation: |
      A uniform variable on $[a,b]$ has constant density $1/(b-a)$ [^1], so $X$ has density $\tfrac13$ and $Y$ has density $\tfrac14$. For independent continuous variables, the joint density is the product of the marginals, here $\tfrac{1}{12}$ on the $3 \times 4$ rectangle, and the probability of a region is its integral [^2]. So probabilities are area ratios. The part of the rectangle with $y \le x$ is a triangle of area $\int_0^3 x\,dx = 4.5$, so
      $$P(x < y) = 1 - \frac{4.5}{12} = \frac58.$$
      $\tfrac12$ would only be right if the two intervals had the same length.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#continuous-uniform
        locator: Sec. 22.8.3 Continuous Uniform, Eq. (22.8.6)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson20#two-continuous-random-variables
        locator: Sec. 20.1 Two Continuous Random Variables (Def. 20.1 joint PDF; Def. 20.4 independence)
    source:
      id: mmlu-redux
      ref: college_mathematics/61
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=61
    status: draft
  - id: probability-032
    type: single
    difficulty: medium
    question: In a game two players take turns tossing a fair coin; the winner is the first one to toss a head. The probability that the player who makes the first toss wins the game is
    options:
      - text: 1/4
      - text: 1/3
      - text: 1/2
      - text: 2/3
        correct: true
    explanation: |
      The first player wins on toss 1, 3, 5, …. Winning on toss $2k+1$ needs $2k$ tails followed by a head, and independent tosses multiply [^1], so that has probability $(\tfrac12)^{2k+1}$. Adding these up gives a geometric series with first term $a = \tfrac12$ and ratio $r = \tfrac14$, whose sum is $a/(1-r)$ [^2]:
      $$P = \frac{1/2}{1 - 1/4} = \frac23.$$
      Going first is an advantage, so $\tfrac12$ is wrong. $\tfrac13$ is the second player's chance.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-8-3-geometric.html#sec-8-3-geometric-5
        locator: Sec. 8.3.3 Infinite Geometric Series, Eq. (8.3.11)
