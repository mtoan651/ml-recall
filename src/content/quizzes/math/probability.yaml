  - id: probability-015
    type: single
    difficulty: medium
    question: Semir rolls a six-sided die every morning to determine what he will have for breakfast. If he rolls a 1 or 2, he takes time to cook himself a big breakfast. If he rolls a 3 or larger he grabs a quick lighter breakfast. When he cooks himself a big breakfast, there is a 15% chance he will be late for school. If he has a lighter breakfast, there is a 6% chance he will be late for school. What is the probability Semir will be on time for school any given day?
    options:
      - text: '0.09'
        why: 0.09 is the probability of being *late*; being on time is its complement.
      - text: '0.21'
        why: $0.15 + 0.06$ adds the two conditional rates without weighting them by how often each breakfast happens.
      - text: '0.8'
        why: Weighting the late rates gives $P(\text{late}) = \tfrac13(0.15) + \tfrac23(0.06) = 0.09$, so on time is 0.91, not 0.8.
      - text: '0.91'
        correct: true
    explanation: |
      Marginalize over the type of breakfast: $P(\text{late}) = P(\text{late} \mid \text{big})P(\text{big}) + P(\text{late} \mid \text{light})P(\text{light})$ [^1]. With $P(\text{big}) = 2/6 = 1/3$, this is $\tfrac13(0.15) + \tfrac23(0.06) = 0.05 + 0.04 = 0.09$. Being on time is the complement, $1 - 0.09 = 0.91$ [^2]. 0.09 is the chance of being late, and 0.21 adds the two conditional rates without weighting them.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (marginalization, Eq. 2.6.6)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (complement)
    source:
      id: mmlu-redux
      ref: high_school_statistics/49
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=49
    status: reviewed
    reviewed_by: claude
  - id: probability-016
    type: single
    difficulty: medium
    question: In which of the following situations is a binomial model not an appropriate model to describe the outcome?
    options:
      - text: The number of heads in three tosses of a coin
        why: 'Three independent tosses, each heads with the same $p = 0.5$: a textbook binomial count.'
      - text: The number of rainy days in a given week
        correct: true
      - text: The number of girls in a family of five children
        why: Each birth is treated as an independent trial with the same probability of a girl, so the count is binomial.
      - text: The number of sixes in ten rolls of a fair die
        why: 'Ten independent rolls, each a six with probability $1/6$: binomial with $n = 10$ and $p = 1/6$.'
    explanation: |-
      A binomial random variable requires, among other things, that the $n$ trials are independent and that the success probability $p$ is the same on every trial [^1]. Rainy days fail both: weather tends to persist, so rain today makes rain tomorrow more likely, and the chance of rain also changes with the season. Coin tosses, die rolls and the sex of each child are the standard examples of independent trials with a constant $p$, so those three counts are binomial.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
    source:
      id: mmlu-redux
      ref: high_school_statistics/52
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=52
    status: reviewed
    reviewed_by: claude
  - id: probability-017
    type: single
    difficulty: medium
    question: A publisher used standard boxes for shipping books. The mean weight of books packed per box is 25 pounds, with a standard deviation of two pounds. The mean weight of the boxes is one pound, with a standard deviation of 0.15 pounds. The mean weight of the packing material used per box is two pounds, with a standard deviation of 0.25 pounds. What is the standard deviation of the weights of the packed boxes?
    options:
      - text: 28.000 pounds
        why: 28 pounds is the mean weight $25 + 1 + 2$, not the standard deviation.
      - text: 5.290 pounds
        why: $\sqrt{28} \approx 5.29$ is the square root of the mean; the SD comes from adding the variances.
      - text: 4.085 pounds
        why: 4.085 is the variance $2^2 + 0.15^2 + 0.25^2$; the SD is its square root.
      - text: 2.021 pounds
        correct: true
    explanation: |
      The packed weight is books + box + packing, so the means add ($25 + 1 + 2 = 28$). The SDs do not add, but for independent parts the variances do [^1]:
      $$\sigma = \sqrt{2^2 + 0.15^2 + 0.25^2} = \sqrt{4.085} \approx 2.021 \text{ pounds}.$$
      28 is the mean, not the SD. 4.085 is the variance, before taking the square root.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/53
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=53
    status: reviewed
    reviewed_by: claude
  - id: probability-018
    type: single
    difficulty: hard
    question: During the years 1886 through 2000 there were an average of 8.7 tropical cyclones per year, of which an average of 5.1 became hurricanes. Assuming that the probability of any cyclone becoming a hurricane is independent of what happens to any other cyclone, if there are five cyclones in one year, what is the probability that at least three become hurricanes?
    options:
      - text: '0.313'
        why: $0.244 + 0.069 = 0.313$ is $P(X \ge 4)$; it leaves out $P(X = 3) \approx 0.345$.
      - text: '0.345'
        why: This is only $P(X = 3)$; at least three also includes four and five hurricanes.
      - text: '0.586'
        why: This is $p = 5.1/8.7$, the chance for a single cyclone.
      - text: '0.658'
        correct: true
    explanation: |
      Each of the 5 cyclones becomes a hurricane independently, with the same probability $p = 5.1/8.7 \approx 0.586$, so the number $X$ of hurricanes is binomial [^1]. Exactly $k$ successes can occur in $\binom{n}{k}$ ways, each with probability $p^k(1-p)^{n-k}$ [^2]. So
      $$P(X \ge 3) = \sum_{k=3}^{5}\binom5k (0.586)^k(0.414)^{5-k} \approx 0.345 + 0.244 + 0.069 = 0.658.$$
      The option 0.345 is only $P(X = 3)$, and 0.586 is $p$ itself.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#binomial
        locator: Sec. 22.8.4 Binomial
    source:
      id: mmlu-redux
      ref: high_school_statistics/56
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=56
    status: reviewed
    reviewed_by: claude
  - id: probability-019
    type: single
    difficulty: medium
    question: A test for heartworm in dogs shows a positive result in 96% of dogs that actually have heartworm, and shows a negative result in 98% of dogs with no heartworm. If heartworm actually occurs in 10% of dogs, what is the probability that a randomly selected dog that tested positive for heartworm actually has heartworm?
    options:
      - text: 11%
        why: About 11% is $P(+) = 0.114$, the overall rate of positive tests, not the posterior.
      - text: 18%
        why: 'Far too low: of the total positive probability 0.114, the share 0.096 comes from dogs that have heartworm.'
      - text: 84%
        correct: true
      - text: 88%
        why: 88% is close to $P(\text{no HW}, -) = 0.90 \times 0.98 = 0.882$, a different event.
    explanation: |
      Bayes' theorem with marginalization in the denominator [^1]:
      $$P(\text{HW} \mid +) = \frac{0.96 \times 0.10}{0.96 \times 0.10 + 0.02 \times 0.90} = \frac{0.096}{0.114} \approx 0.84.$$
      The false-positive rate is $1 - 0.98 = 0.02$. 11% is roughly $P(+) = 0.114$ itself, and 88% is close to $P(\text{no HW}, -) = 0.90 \times 0.98 = 0.882$, a different event.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eqs. (2.6.7)–(2.6.8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/61
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=61
    status: reviewed
    reviewed_by: claude
  - id: probability-020
    type: single
    difficulty: easy
    question: In a finite sample space in which every outcome has positive probability, which of the following statements about two events $A$ and $B$ is true?
    options:
      - text: $P(A \cup B) = 1$ implies events $A$ and $B$ are independent.
        why: $A$ and its complement $A'$ have $P(A \cup A') = 1$, but for $0 < P(A) < 1$, $P(A \cap A') = 0 \ne P(A)P(A')$.
      - text: $P(A \cup B) = 1$ implies events $A$ and $B$ are mutually exclusive.
        why: 'Covering the sample space does not prevent overlap: if $A = B$ is the whole sample space, $P(A \cup B) = 1$ and $A \cap B \ne \emptyset$.'
      - text: $P(A \cap B) = 0$ implies events $A$ and $B$ are independent.
        why: Mutually exclusive events with positive probabilities are dependent, because $P(A \cap B) = 0 \ne P(A)P(B)$ [^2].
      - text: $P(A \cap B) = 0$ implies events $A$ and $B$ are mutually exclusive.
        correct: true
    explanation: "Mutually exclusive events cannot occur together: their intersection is empty, so $P(A \\cap B) = 0$ [^1]. In the setting of the question the converse holds too: an outcome shared by $A$ and $B$ would give the intersection a positive probability, so $P(A \\cap B) = 0$ forces $A \\cap B = \\emptyset$. (Without that assumption, e.g. for a continuous distribution, an overlap can have probability 0.) $P(A \\cap B) = 0$ does not give independence: mutually exclusive events with positive probabilities are in fact dependent, since $0 \\ne P(A)P(B)$ [^2]. $P(A \\cup B) = 1$ only says that the two events together cover the sample space. They may still overlap, so they need not be mutually exclusive, and they need not be independent either: an event $A$ with $P(A) = \\tfrac12$ and its complement $A'$ give $P(A \\cup A') = 1$ but $P(A \\cap A') = 0 \\ne \\tfrac14$."
    references:
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.12 Probability of the empty set)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#independent-vs.-mutually-exclusive
        locator: Sec. 2.6, Independent vs. Mutually Exclusive
    source:
      id: mmlu-redux
      ref: high_school_statistics/67
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=67
    status: reviewed
    reviewed_by: claude
  - id: probability-021
    type: single
    difficulty: medium
    question: All of the following statements are true for all discrete random variables except for which one?
    options:
      - text: The possible outcomes must all be numerical.
        why: 'True for every random variable: it assigns a real number to each outcome, so its values are numerical [^2].'
      - text: The possible outcomes must be mutually exclusive.
        why: 'True: the distinct values of a discrete random variable are mutually exclusive, and their probabilities sum to 1 [^3].'
      - text: The mean (expected value) always equals the sum of the products obtained by multiplying each value by its corresponding probability.
        why: 'True: the expected value of a discrete random variable is $\sum_x x\,P(X = x)$ by definition [^4].'
      - text: Approximately 95% of the outcomes will be within two standard deviations of the mean.
        correct: true
    explanation: |
      "About 95% within two standard deviations" is the empirical rule, and it comes from the normal distribution [^1]. A skewed or two-valued discrete variable need not follow it. The other statements hold for every discrete random variable:
      - A random variable assigns exactly one real number to each outcome, so its values are numerical [^2].
      - Its distinct values are mutually exclusive outcomes, and the probability mass function sums to 1 over them [^3].
      - Its expected value is $\sum_x x\,P(X = x)$ [^4].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson16#the-empirical-rule-revisited
        locator: Sec. 16.6, The Empirical Rule Revisited
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#discrete-random-variables
        locator: Sec. 7.1 Discrete Random Variables (Def. 7.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#probability-mass-functions
        locator: Sec. 7.2 Probability Mass Functions (Def. 7.3)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#expectations
        locator: Sec. 2.6.6 Expectations, Eq. (2.6.12)
    source:
      id: mmlu-redux
      ref: high_school_statistics/74
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=74
    status: reviewed
    reviewed_by: claude
  - id: probability-022
    type: single
    difficulty: medium
    question: The financial aid office at a state university conducts a study to determine the total student costs per semester. All students are charged \$4500 for tuition. The mean cost for books is \$350 with a standard deviation of \$65. The mean outlay for room and board is \$2800 with a standard deviation of \$380. The mean personal expenditure is \$675 with a standard deviation of \$125. Assuming independence among categories, what is the standard deviation of the total student costs?
    options:
      - text: \$24
        why: $\sqrt{65 + 380 + 125} \approx 24$ takes the root of the summed SDs. The total cannot vary less than room and board alone, whose SD is \$380.
      - text: \$91
        why: Smaller than the SD of room and board alone (\$380); for independent parts the variance of the total is at least that of each part.
      - text: \$190
        why: \$190 is the average of the three SDs; the SD of the total comes from adding the variances [^1].
      - text: \$405
        correct: true
    explanation: |
      Tuition is a fixed \$4500 for everyone. Adding a constant does not change the variance, because $\operatorname{Var}(X + b) = \operatorname{Var}(X)$ [^1]. For the independent categories, variances add [^1]:
      $$\sigma = \sqrt{65^2 + 380^2 + 125^2} = \sqrt{164{,}250} \approx \$405.$$
      Adding the SDs directly would give \$570, which is not offered. \$190 is their average.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=75
    status: reviewed
    reviewed_by: claude
  - id: probability-023
    type: single
    difficulty: medium
    question: Suppose that 54% of the graduates from your high school go on to 4-year colleges, 20% go on to 2-year colleges, 19% find employment, and the remaining 7% search for a job. If a randomly selected student is not going on to a 2-year college, what is the probability she will be going on to a 4-year college?
    options:
      - text: '0.460'
        why: 0.46 is $1 - 0.54$, the share not going to a 4-year college, and it ignores the condition.
      - text: '0.540'
        why: 0.54 is the unconditional share; given 'not a 2-year college' you must divide by $P(B) = 0.80$.
      - text: '0.630'
        why: Restricting to the 80% who do not go to a 2-year college gives $0.54/0.80 = 0.675$, not 0.63.
      - text: '0.675'
        correct: true
    explanation: |
      Use $P(A \mid B) = P(A \cap B)/P(B)$ [^1], with $B$ = "not a 2-year college" and $P(B) = 1 - 0.20 = 0.80$. Every 4-year-college student is in $B$, so $P(A \cap B) = 0.54$ and the answer is $0.54/0.80 = 0.675$. 0.54 ignores the condition, and 0.46 is its complement.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#what-is-conditional-probability
        locator: Sec. 4.2 What is Conditional Probability? (Def. 4.1)
    source:
      id: mmlu-redux
      ref: high_school_statistics/76
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=76
    status: reviewed
    reviewed_by: claude
  - id: probability-024
    type: single
    difficulty: medium
    question: When a patient complains to the doctor about a certain set of symptoms, the doctor diagnoses the patient with Condition A 15% of the time. If a patient with these symptoms is diagnosed with Condition A, he or she is diagnosed with Condition B 70% of the time. A patient with these symptoms that is not diagnosed with Condition A is diagnosed with Condition B 10% of the time. What is the probability that a patient with this set of symptoms will be diagnosed with at least one of these conditions?
    options:
      - text: '0.235'
        correct: true
      - text: '0.25'
        why: $0.15 + 0.10$ adds an unconditional probability to a conditional one; the 10% applies only to the 85% not diagnosed with A.
      - text: '0.765'
        why: 0.765 is the probability of *neither* diagnosis; at least one is its complement.
      - text: '0.85'
        why: 0.85 is $P(A')$, the chance of not being diagnosed with Condition A.
    explanation: |
      Go through the complement. By the multiplication rule, a patient gets neither diagnosis with probability $P(A')P(B' \mid A') = 0.85 \times 0.90 = 0.765$ [^1], so $P(\text{at least one}) = 1 - 0.765 = 0.235$ [^2]. The union formula $P(A \cup B) = P(A) + P(B) - P(A \cap B)$ [^2] agrees: $P(A \cap B) = 0.15 \times 0.70 = 0.105$ and $P(B) = 0.105 + 0.085 = 0.19$. 0.765 is the probability of neither, and 0.25 just adds 0.15 and 0.10.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#multiplication-rule
        locator: Sec. 4.3 Multiplication Rule (Def. 4.2)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.11 complement; 2.13 union)
    source:
      id: mmlu-redux
      ref: high_school_statistics/86
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=86
    status: reviewed
    reviewed_by: claude
  - id: probability-025
    type: single
    difficulty: easy
    question: Suppose you toss a fair die three times and it comes up an even number each time. Which of the following is a true statement?
    options:
      - text: By the law of large numbers, the next toss is more likely to be an odd number than another even number.
        why: The law of large numbers is about long-run averages [^2]; it does not push the next toss towards odd (the gambler's fallacy).
      - text: Based on the properties of conditional probability the next toss is more likely to be an even number given that three in a row have been even.
        why: For independent tosses $P(\text{even} \mid \text{three evens}) = P(\text{even}) = 0.5$; the streak changes nothing [^1].
      - text: Dice actually do have memories, and thus the number that comes up on the next toss will be influenced by the previous tosses.
        why: 'A die has no memory: separate tosses are independent, so earlier results do not influence the next one [^1].'
      - text: The probability that the next toss will again be even is 0.5.
        correct: true
    explanation: |
      Separate tosses are independent: one result tells you nothing about the next, just like two separate coin flips [^1]. So an even number on the fourth toss still has probability $3/6 = 0.5$. The law of large numbers is about long-run averages settling near the true probability [^2]. It does not push the next toss towards odd to "balance" a streak. The two options that claim the die remembers the streak are versions of the gambler's fallacy.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-simple-example-tossing-coins
        locator: 'Sec. 2.6.1 A Simple Example: Tossing Coins (law of large numbers)'
    source:
      id: mmlu-redux
      ref: high_school_statistics/98
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=98
    status: reviewed
    reviewed_by: claude
  - id: probability-026
    type: single
    difficulty: medium
    question: Sofia and Tess will each randomly choose one of the 10 integers from 1 to 10. What is the probability that neither integer chosen will be the square of the other?
    options:
      - text: '0.64'
        why: That would exclude 36 of the 100 ordered pairs, but only 5 pairs have one number the square of the other.
      - text: '0.72'
        why: That would exclude 28 pairs; counting carefully, only $(1,1)$, $(2,4)$, $(4,2)$, $(3,9)$ and $(9,3)$ are excluded.
      - text: '0.81'
        why: $0.9^2 = 0.81$ multiplies two probabilities, but the event is not a product of independent events; only 5 of 100 pairs are excluded.
      - text: '0.95'
        correct: true
    explanation: |
      By the multiplication principle there are $10 \times 10 = 100$ equally likely ordered pairs (Sofia, Tess) [^1]. With equally likely outcomes, a probability is a count divided by the size of the sample space [^2]. The pairs where one number is the square of the other are $(1,1)$, $(2,4)$, $(4,2)$, $(3,9)$ and $(9,3)$: five in all, since $1 = 1^2$ counts and $4^2 = 16$ is out of range. The complement rule gives $1 - 5/100 = 0.95$ [^3]. Values like 0.81 look like products of probabilities, but nothing here is being multiplied.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson03#the-multiplication-principle
        locator: Sec. 3.1 The Multiplication Principle (Def. 3.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson02#the-classical-approach
        locator: Sec. 2.4, The Classical Approach
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#probability-properties
        locator: Sec. 2.4 Probability Properties (2.11 Probability of a complement)
    source:
      id: mmlu-redux
      ref: college_mathematics/2
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=2
