title: Probability
questions:
  - id: probability-001
    type: single
    difficulty: medium
    question: Given two Boolean random variables, $A$ and $B$, where $P(A) = 1/2$, $P(B) = 1/3$, and $P(A \mid \neg B) = 1/4$, what is $P(A \mid B)$?
    options:
      - text: 1/6
        why: This is the joint probability $P(A, \neg B) = \tfrac14 \cdot \tfrac23$, not the conditional $P(A \mid B)$.
      - text: 1/4
        why: This is the given $P(A \mid \neg B)$; conditioning on $B$ instead of $\neg B$ changes the answer.
      - text: 3/4
        why: This is $P(\neg A \mid \neg B) = 1 - \tfrac14$, a conditional on the wrong events.
      - text: '1'
        correct: true
    explanation: |
      A conditional probability is a joint probability divided by the probability of the condition. So $P(A, \neg B) = P(A \mid \neg B)\,P(\neg B) = \tfrac14 \cdot \tfrac23 = \tfrac16$ [^1], using $P(\neg B) = 1 - \tfrac13$ [^2]. Summing the joint over both values of $B$ recovers the marginal, $P(A) = P(A,B) + P(A,\neg B)$ [^1], so $P(A,B) = \tfrac12 - \tfrac16 = \tfrac13$. Then $P(A \mid B) = P(A,B)/P(B) = \tfrac{1/3}{1/3} = 1$: $A$ always happens when $B$ does. $\tfrac16$ is the joint probability $P(A, \neg B)$, not the conditional that was asked for.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (Eqs. 2.6.2 and 2.6.6)
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-more-formal-treatment
        locator: Sec. 2.6.2 A More Formal Treatment (axioms; complement)
    source:
      id: mmlu-redux
      ref: machine_learning/10
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=10
    status: reviewed
    reviewed_by: claude
  - id: probability-002
    type: single
    difficulty: medium
    question: |
      Evaluate both statements.

      **Statement 1.** For a continuous random variable $x$ and its probability distribution function $p(x)$, it holds that $0 \le p(x) \le 1$ for all $x$.

      **Statement 2.** Decision tree is learned by minimizing information gain.
    options:
      - text: True, True
        why: 'Statement 1 is false: a density can exceed 1, e.g. the uniform density on $[0, 0.5]$ equals 2 [^2].'
      - text: False, False
        correct: true
      - text: True, False
        why: 'Statement 1 is false: a density only has to be nonnegative and integrate to 1, so values above 1 are allowed [^1].'
      - text: False, True
        why: 'Statement 2 is false: each split is chosen to *maximize* the information gain, not to minimize it [^3].'
    explanation: |
      Statement 1 is false. A density only has to be nonnegative and integrate to 1 [^1], so it can exceed 1. The uniform density on $[a,b]$ is $1/(b-a)$ [^2], which equals 2 on $[0, 0.5]$. Probabilities come from areas under $p(x)$, not from its height.
      Statement 2 is also false. Tree learners such as ID3 and CART pick, at each node, the split with the *largest* information gain, which is the same as minimizing the weighted child impurity [^3].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#probability-density-functions
        locator: Sec. 22.6.1.2 Probability Density Functions, Eq. (22.6.10)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html#continuous-uniform
        locator: Sec. 22.8.3 Continuous Uniform, Eq. (22.8.6)
      - title: 'scikit-learn User Guide: Decision Trees'
        url: https://scikit-learn.org/stable/modules/tree.html#tree-algorithms-id3-c4-5-c5-0-and-cart
        locator: 'Sec. 1.10.6 Tree algorithms: ID3, C4.5, C5.0 and CART; Sec. 1.10.7 Mathematical formulation'
    source:
      id: mmlu-redux
      ref: machine_learning/11
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=11
    status: reviewed
    reviewed_by: claude
  - id: probability-003
    type: single
    difficulty: medium
    question: Say the incidence of a disease $D$ is about 5 cases per 100 people (i.e., $P(D) = 0.05$). Let Boolean random variable $D$ mean a patient “has disease $D$” and let Boolean random variable $TP$ stand for “tests positive.” Tests for disease $D$ are known to be very accurate in the sense that the probability of testing positive when you have the disease is 0.99, and the probability of testing negative when you do not have the disease is 0.97. What is $P(TP)$, the prior probability of testing positive?
    options:
      - text: '0.0368'
        why: 'Too small: the true positives alone contribute $0.99 \times 0.05 = 0.0495$, and false positives add $0.03 \times 0.95$ on top.'
      - text: '0.473'
        why: 'Far too large: $P(TP)$ averages 0.99 (weight 0.05) and 0.03 (weight 0.95), so it must lie close to 0.03.'
      - text: '0.078'
        correct: true
      - text: '0.0495'
        why: This counts only the true positives, $P(TP \mid D)P(D)$, and leaves out the false positives from healthy people.
    explanation: |
      Marginalize over disease status [^1]:
      $$P(TP) = P(TP \mid D)P(D) + P(TP \mid \neg D)P(\neg D) = 0.99(0.05) + 0.03(0.95) = 0.0495 + 0.0285 = 0.078.$$
      The false-positive rate is $1 - 0.97 = 0.03$. The value 0.0495 counts only true positives. The test is quite accurate, but because the disease is rare, more than a third of all positives come from healthy people.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eq. (2.6.7)
    source:
      id: mmlu-redux
      ref: machine_learning/13
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=13
    status: reviewed
    reviewed_by: claude
  - id: probability-004
    type: single
    difficulty: medium
    question: Suppose we would like to calculate $P(H \mid E, F)$ and we have no conditional independence information. Which of the following sets of numbers are sufficient for the calculation?
    options:
      - text: $P(E, F)$, $P(H)$, $P(E \mid H)$, $P(F \mid H)$
        why: Combining $P(E \mid H)$ and $P(F \mid H)$ into $P(E, F \mid H)$ needs conditional independence of $E$ and $F$ given $H$, which is not assumed [^1].
      - text: $P(E, F)$, $P(H)$, $P(E, F \mid H)$
        correct: true
      - text: $P(H)$, $P(E \mid H)$, $P(F \mid H)$
        why: Combining $P(E \mid H)$ and $P(F \mid H)$ needs conditional independence, and the set also lacks the normalizer $P(E, F)$.
      - text: $P(E, F)$, $P(E \mid H)$, $P(F \mid H)$
        why: This set lacks the prior $P(H)$, and combining $P(E \mid H)$ with $P(F \mid H)$ would need conditional independence.
    explanation: |
      Bayes' theorem gives $P(H \mid E,F) = \dfrac{P(E,F \mid H)\,P(H)}{P(E,F)}$ [^1]. That uses exactly $P(E,F)$, $P(H)$ and $P(E,F \mid H)$. The sets with $P(E \mid H)$ and $P(F \mid H)$ would need $P(E,F \mid H) = P(E \mid H)P(F \mid H)$. That factorization is conditional independence of $E$ and $F$ given $H$ [^1], and the question rules it out. The set without $P(E,F)$ also lacks the normalizer.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (Bayes' theorem, Eq. 2.6.3; conditional independence)
    source:
      id: mmlu-redux
      ref: machine_learning/15
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=15
    status: reviewed
    reviewed_by: claude
  - id: probability-005
    type: single
    difficulty: medium
    question: Say the incidence of a disease $D$ is about 5 cases per 100 people (i.e., $P(D) = 0.05$). Let Boolean random variable $D$ mean a patient “has disease $D$” and let Boolean random variable $TP$ stand for “tests positive.” Tests for disease $D$ are known to be very accurate in the sense that the probability of testing positive when you have the disease is 0.99, and the probability of testing negative when you do not have the disease is 0.97. What is $P(D \mid TP)$, the posterior probability that you have disease $D$ when the test is positive?
    options:
      - text: '0.0495'
        why: This is the joint $P(TP, D) = 0.99 \times 0.05$; it still has to be divided by $P(TP)$.
      - text: '0.078'
        why: This is the evidence $P(TP)$, the denominator of Bayes' theorem, not the posterior.
      - text: '0.635'
        correct: true
      - text: '0.97'
        why: This is the test's specificity $P(\neg TP \mid \neg D)$; the posterior also depends on the small prior $P(D) = 0.05$.
    explanation: |
      By Bayes' theorem [^1],
      $$P(D \mid TP) = \frac{P(TP \mid D)P(D)}{P(TP)} = \frac{0.99 \times 0.05}{0.99 \times 0.05 + 0.03 \times 0.95} = \frac{0.0495}{0.078} \approx 0.635.$$
      The posterior is far below the test's 0.97–0.99 accuracy because the 5% prior is small, the same effect as in the textbook's HIV-test example [^1]. 0.0495 is the joint $P(TP, D)$, and 0.078 is the evidence $P(TP)$.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#subsec-probability-hiv-app
        locator: Sec. 2.6.5 An Example (HIV test), Eqs. (2.6.7)–(2.6.8)
    source:
      id: mmlu-redux
      ref: machine_learning/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=22
    status: reviewed
    reviewed_by: claude
  - id: probability-006
    type: single
    difficulty: medium
    question: Which one of the following is equal to $P(A, B, C)$ given Boolean random variables $A$, $B$ and $C$, and no independence or conditional independence assumptions between any of them?
    options:
      - text: $P(A \mid B) \cdot P(B \mid C) \cdot P(C \mid A)$
        why: A product of three conditionals with no marginal is not a chain-rule factorization, so it does not equal $P(A, B, C)$ in general.
      - text: $P(C \mid A, B) \cdot P(A) \cdot P(B)$
        why: $P(A)P(B)$ equals $P(A, B)$ only if $A$ and $B$ are independent, which is not assumed [^1].
      - text: $P(A, B \mid C) \cdot P(C)$
        correct: true
      - text: $P(A \mid B, C) \cdot P(B \mid A, C) \cdot P(C \mid A, B)$
        why: Every factor conditions on the other two variables; the chain rule needs factors that condition on fewer and fewer variables, ending with a marginal.
    explanation: |
      The definition of conditional probability, applied to the joint event $(A, B)$ and $C$, gives $P(A,B,C) = P(A,B \mid C)\,P(C)$ with no assumptions [^1]. $P(C \mid A,B)P(A)P(B)$ would need $A$ and $B$ to be independent, since in general $P(A,B) \ne P(A)P(B)$ [^1]. The products of three conditionals do not follow the chain rule. For example, $P(A \mid B)P(B \mid C)P(C \mid A)$ never includes a marginal.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (conditional probability, independence)
    source:
      id: mmlu-redux
      ref: machine_learning/52
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=52
    status: reviewed
    reviewed_by: claude
  - id: probability-007
    type: single
    difficulty: easy
    question: Can you get heads 10 times in a row when throwing a coin?
    options:
      - text: Yes, it is possible
        correct: true
      - text: No, it is impossible
        why: 'Ten heads in a row has probability $(1/2)^{10} = 1/1024$: small, but not zero.'
    explanation: |
      The lesson defines a probability as the number of favourable outcomes divided by the total, when all outcomes are equally likely [^1]. Ten tosses give $2^{10} = 1024$ equally likely sequences, and only one of them is all heads. Separate coin tosses are independent, so multiplying gives the same answer, $(1/2)^{10} = 1/1024$ [^2]. The probability is small but positive, so ten heads in a row is possible; it happens about once in a thousand tries.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
        locator: Sec. 2.6.4 Multiple Random Variables (independence)
    source:
      id: ms-ds-for-beginners
      ref: quiz-6/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: probability-008
    type: single
    difficulty: easy
    question: When you throw a fair die, what is the probability of getting an even number?
    options:
      - text: 1/2
        correct: true
      - text: 1/3
        why: Three of the six faces (2, 4, 6) are even, so the probability is $3/6$, not $1/3$.
      - text: impossible to tell
        why: For a fair die all six faces are equally likely, so the probability follows from counting faces.
    explanation: |
      A fair die has six equally likely faces, and three of them (2, 4, 6) are even, so the probability is $3/6 = 1/2$ [^1]. "Impossible to tell" would only apply to an unknown, possibly biased die. $1/3$ counts the wrong number of faces.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
    source:
      id: ms-ds-for-beginners
      ref: quiz-6/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: probability-009
    type: single
    difficulty: easy
    shuffle: false
    question: We roll a fair die 100 times and compute the average of the rolls. Approximately what distribution does this average follow?
    options:
      - text: uniform
        why: A single roll is uniform on $\{1, \dots, 6\}$, but the average of 100 rolls piles up around 3.5 in a bell shape.
      - text: normal
        correct: true
      - text: none of the above
        why: 'The average does follow a recognizable distribution: by the central limit theorem it is approximately normal [^2].'
    explanation: |
      By the central limit theorem, the mean of a large random sample is approximately normal, with mean $\mu$ and variance $\sigma^2/n$. This holds whatever distribution the individual values come from, including discrete ones [^1][^2]. One roll is uniform on $\{1,\dots,6\}$, but the average of 100 rolls piles up around 3.5 in a bell shape, with standard deviation $\sigma/\sqrt{100} \approx 0.17$. The uniform answer describes a single roll, not the average.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: 'Lesson: Statistics and Probability, "Law of Large Numbers and Central Limit Theorem"'
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson27#the-theorem
        locator: Sec. 27.1 The Theorem (Central Limit Theorem)
    source:
      id: ms-ds-for-beginners
      ref: quiz-7/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: reviewed
    reviewed_by: claude
  - id: probability-010
    type: single
    difficulty: medium
    question: Players in the National Football League weigh, on average, about 248 pounds with a standard deviation of about 47 pounds. If four players are to be selected at random, the expected value of the random variable $W$, the total combined weight of the four players, is 992 pounds. The standard deviation of $W$ is approximately
    options:
      - text: 47 pounds
        why: 47 pounds is the SD of a single player; the total of four players varies more.
      - text: 67 pounds
        why: $47\sqrt{2} \approx 67$ would be the SD of the total weight of two players, not four.
      - text: 94 pounds
        correct: true
      - text: 141 pounds
        why: '$3 \times 47 = 141$ follows no rule: for four independent players the variances add, so the SD is $\sqrt{4} \times 47$.'
    explanation: |
      For independent random variables, variances add: $\operatorname{Var}(X+Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$ [^1]. So $\operatorname{Var}(W) = 4 \times 47^2$ and $\operatorname{SD}(W) = \sqrt{4}\times 47 = 94$ pounds. Standard deviations do not add: that would give $4 \times 47 = 188$. 47 is the SD of a single player.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html#variances
        locator: Sec. 22.6.1.5 Variances (properties of variance)
    source:
      id: mmlu-redux
      ref: high_school_statistics/6
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=6
    status: reviewed
    reviewed_by: claude
  - id: probability-011
    type: single
    difficulty: easy
    question: Two events $A$ and $B$ each have a nonzero probability. If $A$ and $B$ are independent, which of the following statements is true?
    options:
      - text: $P(A \text{ and } B) = P(A) \cdot P(B)$
        correct: true
      - text: $A$ and $B$ may or may not be mutually exclusive.
        why: With nonzero probabilities, independence gives $P(A \cap B) = P(A)P(B) > 0$, so the events can never be mutually exclusive.
      - text: $A$ and $B$ must be mutually exclusive.
        why: Mutually exclusive events with positive probabilities have $P(A \cap B) = 0 \ne P(A)P(B)$, so they are dependent [^2].
      - text: $P(A \mid B) = P(B \mid A)$
        why: Under independence $P(A \mid B) = P(A)$ and $P(B \mid A) = P(B)$, which are equal only if $P(A) = P(B)$.
    explanation: |
      $A$ and $B$ are independent exactly when $P(A \cap B) = P(A)P(B)$ [^1]. If both probabilities are positive, that product is positive, so the events share outcomes and cannot be mutually exclusive. The reverse also holds: mutually exclusive events with positive probabilities are always dependent, because $P(A \cap B) = 0 \ne P(A)P(B)$ [^2]. That rules out both "may or may not be mutually exclusive" and "must be mutually exclusive". $P(A \mid B) = P(B \mid A)$ does not follow either: under independence it would need $P(A) = P(B)$.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson05#two-definitions
        locator: Sec. 5.1 Two Definitions (Def. 5.2 Independent Events)
      - title: 'Penn State STAT 500: Applied Statistics'
        url: https://online.stat.psu.edu/stat500/Lesson02#independent-vs.-mutually-exclusive
        locator: Sec. 2.6, Independent vs. Mutually Exclusive
    source:
      id: mmlu-redux
      ref: high_school_statistics/9
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=9
    status: reviewed
    reviewed_by: claude
  - id: probability-012
    type: single
    difficulty: medium
    question: An automobile service station performs oil changes and tire replacements, as well as other services. Sixty percent of its customers request an oil change, 30 percent request tire replacements, and 10 percent request both. A customer requests an oil change. What is the probability this customer does not request tire replacements?
    options:
      - text: '0.42'
        why: $0.6 \times 0.7 = 0.42$ treats the two requests as independent and is a joint probability, not a conditional one.
      - text: '0.5'
        why: 0.50 is the share of *all* customers who want an oil change but no tires; it still has to be divided by $P(\text{oil}) = 0.6$.
      - text: '0.7'
        why: 0.7 is the share of all customers who skip tires; it ignores that this customer wants an oil change.
      - text: '0.833'
        correct: true
    explanation: |
      Use $P(A \mid B) = P(A \cap B)/P(B)$ [^1], with $B$ = "oil change" and $A$ = "no tire replacement". The customers who want an oil change but no tires make up $0.60 - 0.10 = 0.50$ of all customers, so $P(A \mid B) = 0.50/0.60 \approx 0.833$. 0.5 forgets to divide by $P(\text{oil})$. 0.7 is the share of *all* customers who skip tires, which ignores the condition.
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson04#what-is-conditional-probability
        locator: Sec. 4.2 What is Conditional Probability? (Def. 4.1)
    source:
      id: mmlu-redux
      ref: high_school_statistics/27
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=27
    status: reviewed
    reviewed_by: claude
  - id: probability-013
    type: single
    difficulty: medium
    question: There are two games involving flipping a fair coin. In the first game you win a prize if you can throw between 45% and 55% heads. In the second game you win if you can throw more than 80% heads. For each game would you rather flip the coin 30 times or 300 times?
    options:
      - text: 30 times for each game
        why: 'In the 45–55% game more flips help: the chance of landing in the band rises from about 0.42 with 30 flips to about 0.93 with 300.'
      - text: 300 times for each game
        why: 'In the over-80% game more flips hurt: the chance falls from about $1.6 \times 10^{-4}$ with 30 flips to about $10^{-27}$ with 300.'
      - text: 30 times for the first game and 300 times for the second
        why: 'This is backwards: a proportion close to 0.5 needs many flips, while an extreme proportion needs few.'
      - text: 300 times for the first game and 30 times for the second
        correct: true
    explanation: |
      The relative frequency of heads converges to the true probability as the number of tosses grows (the law of large numbers), and the typical error shrinks at a rate of about $1/\sqrt n$ [^1].
      - The 45–55% game rewards a proportion close to 0.5, so more flips help: about 0.93 with 300 flips versus about 0.42 with 30.
      - The over-80% game needs a big deviation from 0.5, which only a small sample has any real chance of producing: about $1.6 \times 10^{-4}$ with 30 flips versus about $10^{-27}$ with 300.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/probability.html#a-simple-example-tossing-coins
        locator: 'Sec. 2.6.1 A Simple Example: Tossing Coins'
    source:
      id: mmlu-redux
      ref: high_school_statistics/36
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=36
    status: reviewed
    reviewed_by: claude
  - id: probability-014
    type: single
    difficulty: medium
    question: Which of the following is a binomial random variable?
    options:
      - text: The number of tosses before a "5" appears when tossing a fair die.
        why: There is no fixed number of trials; counting until the first success is the geometric setting [^2].
      - text: The number of points a hockey team receives in 10 games, where two points are awarded for wins, one point for ties, and no points for losses.
        why: Each game has three outcomes (2, 1 or 0 points), and the variable adds up points instead of counting successes.
      - text: The number of hearts out of five cards randomly drawn from a deck of 52 cards, without replacement.
        why: Without replacement the chance of a heart changes from draw to draw, so the trials are not independent; the count is hypergeometric [^3].
      - text: The number of motorists not wearing seat belts in a random sample of five drivers.
        correct: true
    explanation: |
      A binomial random variable counts successes in a fixed number $n$ of identical, independent trials, each with two outcomes and the same success probability $p$ [^1]. Five randomly sampled drivers, each either belted or not, meet every condition. Each of the other options breaks one:
      - Counting tosses until the first "5" has no fixed $n$; repeating trials until the first success is the geometric setting [^2].
      - A hockey game has three outcomes (2, 1 or 0 points), not two.
      - Cards drawn without replacement change the chance of a heart from draw to draw; that count is hypergeometric [^3].
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson10#is-x-binomial
        locator: Sec. 10.2 Is X Binomial? (Def. 10.2)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson11#geometric-distributions
        locator: Sec. 11.1 Geometric Distributions (Def. 11.1)
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson07#hypergeometric-distribution
        locator: Sec. 7.4 Hypergeometric Distribution (Def. 7.4)
    source:
