  - id: optimization-048
    type: single
    difficulty: medium
    tags:
      - minibatch-sgd
      - gradient-descent
      - data-efficiency
    question: |
      Your training set is silently duplicated: every example now appears twice. The learning rate
      and batch size stay the same. What changes for gradient descent (GD), SGD and minibatch SGD?
    options:
      - text: 'GD: the same steps at twice the cost; SGD and minibatch SGD: the same updates, twice as many per epoch'
        correct: true
      - text: GD takes steps twice as large, because every loss term is now counted twice
        why: The objective is the average loss, and averaging over duplicated examples gives the same value and gradient [^1].
      - text: SGD now sees each example twice per update, which halves its gradient noise
        why: Each SGD draw is still one example from the same set of distinct values, so its noise is unchanged.
      - text: Nothing changes for any of the three methods, because the data distribution is still the same
        why: Per-update behaviour is the same, but the cost of a GD step and the number of updates per epoch both double.
    explanation: |
      The objective is the mean of the per-example losses, so duplicating every example leaves it
      and its gradient unchanged [^1]. Gradient descent therefore takes exactly the same steps, but
      each one costs twice as much, which shows why GD is data-inefficient when examples are
      redundant [^2]. SGD and minibatch SGD sample uniformly from what is still the same empirical
      distribution, so each update behaves as before. One pass over the doubled data simply contains
      twice as many updates, about two of the old epochs.
    references:
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates (the objective as an average; $\mathcal{O}(n)$ cost per GD step)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
      - source: d2l
        locator: Sec. 12.5 Minibatch Stochastic Gradient Descent (GD is not data efficient when data are similar)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html
      - source: d2l
        locator: Sec. 12.5.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/minibatch-sgd#ex4
      url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-049
    type: short_answer
    difficulty: easy
    tags:
      - momentum
      - learning-rate
      - effective-step-size
    question: |
      Plain SGD works well with $\eta = 0.1$. You switch to momentum,
      $\mathbf{v}_t = \beta\mathbf{v}_{t-1} + \mathbf{g}_t$, $\mathbf{x}_t = \mathbf{x}_{t-1} - \eta\mathbf{v}_t$,
      with $\beta = 0.9$. Where the gradient is roughly constant, which $\eta$ gives the same step size
      as before?
    answer:
      numeric: 0.01
      tolerance: 0.0001
      hint: a number
      model: $\mathbf{v} \to \mathbf{g}/(1 - \beta) = 10\mathbf{g}$, so $\eta = 0.1 \times (1 - 0.9) = 0.01$
    explanation: |
      For a constant gradient the velocity tends to $\sum_\tau \beta^\tau \mathbf{g} = \mathbf{g}/(1 - \beta)$,
      so momentum takes steps of size $\eta/(1 - \beta)$ [^1]. With $\beta = 0.9$ that is a factor
      of 10, the effective number of averaged gradients, so the learning rate has to drop to
      $0.01$ to match. That is why raising the momentum to 0.9 goes together with a smaller learning
      rate [^2].
    references:
      - source: d2l
        locator: Sec. 12.6.1.4 Effective Sample Weight
        url: https://d2l.ai/chapter_optimization/momentum.html#effective-sample-weight
      - source: d2l
        locator: Sec. 12.6.2.1 Implementation from Scratch (momentum 0.9, effective sample size 10, smaller learning rate)
        url: https://d2l.ai/chapter_optimization/momentum.html#implementation-from-scratch
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex1
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-050
    type: short_answer
    difficulty: medium
    tags:
      - gradient-descent
      - eigenvalues
      - ill-conditioning
      - momentum
    question: |
      Gradient descent minimizes $f(\mathbf{x}) = \frac{1}{2}\sum_{i=1}^{10} \lambda_i x_i^2$ with
      $\lambda_i = 2^{-i}$, starting from $x_i = 1$ for all $i$, with $\eta = 2$. What is $x_{10}$
      after 100 steps?
    answer:
      numeric: 0.822
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $x_{10} = (1 - 2 \cdot 2^{-10})^{100} = (1 - 1/512)^{100} \approx 0.822$
    explanation: |
      On a quadratic, gradient descent works separately along each eigen-direction:
      $x_i \leftarrow (1 - \eta\lambda_i)x_i$ [^1]. With $\eta = 2$ the steepest coordinate
      ($\lambda_1 = \frac{1}{2}$) reaches 0 in one step, while $x_{10}$ shrinks by only $1/512$ per
      step and is still about $0.82$ after 100 steps. The learning rate cannot fix this: stability
      needs $\eta\lambda_1 < 2$, i.e. $\eta < 4$, and even at that limit $x_{10}$ would still be about
      $0.68$. Momentum stays stable up to $\eta\lambda < 2 + 2\beta$ and speeds up the slow
      directions [^2].
    references:
      - source: d2l
        locator: Sec. 12.6.3.1 Quadratic Convex Functions (no mixing between eigenspaces)
        url: https://d2l.ai/chapter_optimization/momentum.html#quadratic-convex-functions
      - source: d2l
        locator: Sec. 12.6.3.2 Scalar Functions (convergence needs $0 < \eta\lambda < 2$, or $< 2 + 2\beta$ with momentum)
        url: https://d2l.ai/chapter_optimization/momentum.html#scalar-functions
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex2
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-051
    type: short_answer
    difficulty: medium
    tags:
      - quadratic-functions
      - minimizer
      - positive-definite
    question: |
      Let $h(\mathbf{x}) = \frac{1}{2}\mathbf{x}^\top \mathbf{Q}\mathbf{x} + \mathbf{x}^\top\mathbf{c} + b$
      with $\mathbf{Q} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$, $\mathbf{c} = (-3, 0)^\top$ and
      $b = 0$. What is the minimum value of $h$?
    answer:
      numeric: -3
      tolerance: 0.001
      hint: a number
      model: $\mathbf{x}^* = -\mathbf{Q}^{-1}\mathbf{c} = (2, -1)^\top$ and $h^* = b - \frac{1}{2}\mathbf{c}^\top\mathbf{Q}^{-1}\mathbf{c} = -3$
    explanation: |
      Setting the gradient $\mathbf{Q}\mathbf{x} + \mathbf{c}$ to zero gives
      $\mathbf{x}^* = -\mathbf{Q}^{-1}\mathbf{c}$. Here
      $\mathbf{Q}^{-1} = \frac{1}{3}\begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$, so
      $\mathbf{x}^* = (2, -1)^\top$ and the minimum is
      $b - \frac{1}{2}\mathbf{c}^\top\mathbf{Q}^{-1}\mathbf{c} = -\frac{1}{2} \cdot 9 \cdot \frac{2}{3} = -3$
      [^1]. It is a minimum because $\mathbf{Q}$ is positive definite (eigenvalues 1 and 3). Writing
      $h$ as $\frac{1}{2}(\mathbf{x} - \mathbf{x}^*)^\top\mathbf{Q}(\mathbf{x} - \mathbf{x}^*) + h^*$
      shows that the gradient is $\mathbf{Q}$ times the distance to the minimizer [^1].
    references:
      - source: d2l
        locator: Sec. 12.6.3.1 Quadratic Convex Functions, Eqs. (12.6.6)–(12.6.7)
        url: https://d2l.ai/chapter_optimization/momentum.html#quadratic-convex-functions
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex3
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
