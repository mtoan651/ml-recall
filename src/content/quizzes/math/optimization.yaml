  - id: optimization-049
    type: short_answer
    difficulty: easy
    tags:
      - momentum
      - learning-rate
      - effective-step-size
    question: |
      Plain SGD works well with $\eta = 0.1$. You switch to momentum,
      $\mathbf{v}_t = \beta\mathbf{v}_{t-1} + \mathbf{g}_t$, $\mathbf{x}_t = \mathbf{x}_{t-1} - \eta\mathbf{v}_t$,
      with $\beta = 0.9$. Where the gradient is roughly constant, which $\eta$ gives the same step size
      as before?
    answer:
      numeric: 0.01
      tolerance: 0.0001
      hint: a number
      model: $\mathbf{v} \to \mathbf{g}/(1 - \beta) = 10\mathbf{g}$, so $\eta = 0.1 \times (1 - 0.9) = 0.01$
    explanation: |
      For a constant gradient the velocity tends to $\sum_\tau \beta^\tau \mathbf{g} = \mathbf{g}/(1 - \beta)$,
      so momentum takes steps of size $\eta/(1 - \beta)$ [^1]. With $\beta = 0.9$ that is a factor
      of 10, the effective number of averaged gradients, so the learning rate has to drop to
      $0.01$ to match. That is why raising the momentum to 0.9 goes together with a smaller learning
      rate [^2].
    references:
      - source: d2l
        locator: Sec. 12.6.1.4 Effective Sample Weight
        url: https://d2l.ai/chapter_optimization/momentum.html#effective-sample-weight
      - source: d2l
        locator: Sec. 12.6.2.1 Implementation from Scratch (momentum 0.9, effective sample size 10, smaller learning rate)
        url: https://d2l.ai/chapter_optimization/momentum.html#implementation-from-scratch
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex1
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
