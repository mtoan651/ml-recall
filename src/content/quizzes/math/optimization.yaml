  - id: optimization-087
    type: single
    difficulty: hard
    tags:
      - convex-conjugate
      - log-sum-exp
      - entropy
    question: |
      The convex conjugate of $f$ is $f^*(y) = \sup_x \big(y^\top x - f(x)\big)$. What is the conjugate of
      the log-sum-exp function $f(x) = \log\sum_{j=1}^{d} e^{x_j}$ on $\mathbb{R}^d$?
    options:
      - text: $f^*(y) = \log\sum_j e^{y_j}$ for every $y$; log-sum-exp is its own conjugate
        why: The self-conjugate function is $\frac12\lVert x \rVert^2$; log-sum-exp's conjugate is finite only on the probability simplex.
      - text: $f^*(y) = -\sum_j y_j \log y_j$ for every $y$ with positive entries
        why: The sign is wrong (it is the negative entropy), and $f^*$ is $+\infty$ unless the entries also sum to 1.
      - text: $f^*(y) = \sum_j y_j \log y_j$ if $y$ is a probability vector, and $+\infty$ otherwise
        correct: true
      - text: $f^*(y) = \max_j y_j$ for every $y$
        why: That is the function log-sum-exp approximates; its conjugate is the indicator of the simplex, not log-sum-exp's conjugate.
    explanation: |
      The supremum is attained where the gradient of $y^\top x - f(x)$ vanishes, i.e. where
      $y = \mathrm{softmax}(x)$, which is possible only for $y$ in the probability simplex; then
      $x_i = \log y_i$ (up to a constant) and $f^*(y) = \sum_i y_i\log y_i$ [^1]. If the entries of $y$ do
      not sum to 1, or one is negative, a suitable $x$ makes the objective arbitrarily large [^1]. So
      the conjugate of log-sum-exp is the negative entropy on the simplex [^2].
    references:
      - source: mit-ocw-18657
        locator: Problem set 3 solutions, Problem 3 (1)(c)
        url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-3-solution/
      - title: 'Wikipedia: LogSumExp'
        locator: Properties (the convex conjugate of LogSumExp is the negative entropy)
        url: https://en.wikipedia.org/wiki/LogSumExp#Properties
    source:
      id: mit-ocw-18657
      ref: assignment-3#q3.1c
      url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-3-solution/
    status: reviewed
    reviewed_by: claude
  - id: optimization-088
    type: true_false
    difficulty: easy
    tags:
      - sgd
      - minibatch
      - randomness
    question: |
      True or false: the word "stochastic" in stochastic gradient descent refers only to the use of
      minibatches; SGD needs no random numbers.
    options:
      - text: 'True'
        why: SGD draws its examples or minibatches at random, which is what makes each gradient a random estimate [^2].
      - text: 'False'
        correct: true
    explanation: |
      False. Each SGD step samples an example index (or a minibatch) uniformly at random, so the update
      uses a random but unbiased estimate of the full gradient [^2]. In practice the data are reshuffled
      with a random number generator before every pass, so that each epoch visits the examples in a
      different random order [^3]. Using a subset per step is what makes SGD cheap; the random choice of
      that subset is what makes it stochastic [^1].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-259, pp. 286–287; Solution SOL-259, p. 331
        url: https://arxiv.org/abs/2201.00650v2
