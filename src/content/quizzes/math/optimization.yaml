  - id: optimization-063
    type: true_false
    difficulty: easy
    tags:
      - critical-points
      - derivatives
      - saddle-points
    shuffle: false
    question: "True or false: if $f'(x) = 0$, then $f$ has a local maximum or a local minimum at $x$."
    options:
      - text: 'True'
        why: $f(x) = x^3$ has $f'(0) = 0$, but it is negative to the left of 0 and positive to the right, so 0 is neither [^1].
      - text: 'False'
        correct: true
    explanation: |
      A zero derivative makes $x$ a critical point, a candidate for an extremum, but not necessarily
      one [^2]. For $f(x) = x^3$ both the first and second derivatives vanish at 0 and the function
      keeps increasing through it; optimization can still stall there [^1]. In several dimensions the
      same thing happens at saddle points, where the gradient is zero but the Hessian has both
      positive and negative eigenvalues [^1].
