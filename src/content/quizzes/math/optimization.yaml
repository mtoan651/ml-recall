  - id: optimization-112
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l01
      - ce6146-l03
      - gradient
      - gradient-descent
    question: |
      For the loss $L(w_1, w_2) = w_1^2 + 3w_2$ at the point $(w_1, w_2) = (2, 1)$, in which direction does
      a gradient-descent step move the parameters?
    options:
      - text: $(-4, -3)$
        correct: true
      - text: $(4, 3)$
        why: That is the gradient itself, the direction of steepest increase.
      - text: $(-2, -1)$
        why: This negates the current point instead of the gradient.
      - text: $(-2, -3)$
        why: The partial derivative of $w_1^2$ is $2w_1 = 4$, not $w_1$.
    explanation: |
      The gradient is the vector of partial derivatives, $(2w_1, 3) = (4, 3)$ at $(2, 1)$ [^1]. It points
      towards the steepest local increase of the loss, so gradient descent steps along the negative
      gradient, $-\eta\,(4, 3)$, i.e. in the direction $(-4, -3)$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Exercise 2, question 11; Lecture 1, slide 50; Lecture 3, slides 8, 12
      - source: d2l
        locator: Sec. 12.3.2 Multivariate Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
