  - id: optimization-062
    type: single
    difficulty: medium
    tags:
      - learning-rate-schedule
      - warmup
    question: |
      What problem does a learning-rate warmup (a short phase in which $\eta$ rises from a small value
      to its maximum) address?
    options:
      - text: Early updates from random weights are large and poorly aimed, so a full-size $\eta$ at the start can diverge
        correct: true
      - text: Without warmup the final learning rate stays too large for the model to converge
        why: The end of training is handled by the decay part of the schedule; warmup only shapes the first steps [^1].
      - text: Warmup lets the optimizer skip the gradient computation during the first epochs
        why: Every warmup step computes gradients as usual; only the step size is smaller.
      - text: Warmup reduces overfitting by showing the model the easiest examples first
        why: That describes curriculum learning; warmup changes the learning rate, not the order of the data.
    explanation: |
      At the start the parameters are random, so the first update directions may be meaningless and
      large steps can make optimization diverge, while a uniformly small rate makes progress slow
      [^1]. Warmup ramps the rate up, usually linearly, and then hands over to the normal schedule;
      it can be combined with any scheduler [^1]. Goyal et al. ramp up over the first 5 epochs for
      large-batch ImageNet training and report that results are robust to the exact length [^2],
      so there is no single right length.
    references:
      - source: d2l
        locator: Sec. 12.11 Learning Rate Scheduling (initialization) and Sec. 12.11.3.4 Warmup
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html#warmup
      - title: 'Goyal et al., Accurate, Large Minibatch SGD: Training ImageNet in 1 Hour (2017)'
        locator: Sec. 2.2 Warmup (gradual warmup)
        url: https://arxiv.org/abs/1706.02677
      - source: d2l
        locator: Sec. 12.11.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/lr-scheduler#ex4
      url: https://d2l.ai/chapter_optimization/lr-scheduler.html#exercises
    status: draft
  - id: optimization-063
    type: true_false
    difficulty: easy
    tags:
      - critical-points
      - derivatives
      - saddle-points
    shuffle: false
    question: "True or false: if $f'(x) = 0$, then $f$ has a local maximum or a local minimum at $x$."
    options:
      - text: 'True'
        why: $f(x) = x^3$ has $f'(0) = 0$, but it is negative to the left of 0 and positive to the right, so 0 is neither [^1].
      - text: 'False'
        correct: true
    explanation: |
      A zero derivative makes $x$ a critical point, a candidate for an extremum, but not necessarily
      one [^2]. For $f(x) = x^3$ both the first and second derivatives vanish at 0 and the function
      keeps increasing through it; optimization can still stall there [^1]. In several dimensions the
      same thing happens at saddle points, where the gradient is zero but the Hessian has both
      positive and negative eigenvalues [^1].
    references:
      - source: d2l
        locator: Sec. 12.1.2.2 Saddle Points (the example $x^3$)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
      - source: d2l
        locator: Sec. 22.4.3 A Note on Mathematical Optimization (critical points)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-note-on-mathematical-optimization
      - source: d2l
        locator: Sec. 22.3.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#exercises
    source:
