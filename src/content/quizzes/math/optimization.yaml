    reviewed_by: claude
  - id: optimization-101
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l02
      - automatic-differentiation
      - finite-differences
    question: |
      Which way of computing derivatives estimates them from function values at nearby points, so
      that its accuracy depends on the chosen step size and on floating-point rounding?
    options:
      - text: Numerical differentiation (finite differences)
        correct: true
      - text: Symbolic differentiation of the formula
        why: It manipulates formulas to produce an exact derivative expression; no step size is involved.
      - text: Reverse-mode automatic differentiation
        why: It chains the exact local derivatives of the executed operations, so apart from floating-point rounding it is exact and uses no step size.
      - text: Forward-mode automatic differentiation
        why: It also propagates exact local derivatives (Jacobian–vector products) through the operations, without a step size.
    explanation: |
      Finite differences approximate a derivative from function values at $\theta \pm \varepsilon$,
      so they carry a truncation error that depends on $\varepsilon$ and a rounding error that grows
      when $\varepsilon$ is tiny [^1][^2]; they are also expensive, needing extra function
      evaluations for every parameter [^3]. Automatic differentiation — forward mode
      (Jacobian–vector products) or reverse mode (vector–Jacobian products, i.e. backpropagation) —
      chains together the exact derivatives of the elementary operations the program executed, so
      it is exact up to floating-point rounding [^1][^3]. That is why finite differences are used to
      check gradients, not to train.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slides 86–89
      - title: 'Wikipedia: Numerical differentiation'
        url: https://en.wikipedia.org/wiki/Numerical_differentiation
        locator: Finite differences; Step size
      - title: 'Wikipedia: Automatic differentiation'
        url: https://en.wikipedia.org/wiki/Automatic_differentiation
        locator: Difference from other differentiation methods; Forward and reverse accumulation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q30
    status: reviewed
    reviewed_by: claude
  - id: optimization-102
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - gradient-descent
    question: |
      Gradient descent minimizes $L(x, y) = x^2 + 4y^2$ with learning rate $\eta = 0.1$, starting
      from $(x_0, y_0) = (2, 1)$. After two steps, $x_2 =$ {{1}} and $y_2 =$ {{2}}.
    answer:
      blanks:
        - numeric: 1.28
          tolerance: 0.001
          hint: a number
        - numeric: 0.04
          tolerance: 0.001
          hint: a number
      model: $\nabla L = (2x, 8y)$, so $x \leftarrow 0.8x$ and $y \leftarrow 0.2y$ each step; $(2, 1) \to (1.6, 0.2) \to (1.28, 0.04)$.
    explanation: |
      The update is $\theta \leftarrow \theta - \eta\nabla L(\theta)$, with $\nabla L = (2x, 8y)$
      [^1][^2]. Each step multiplies $x$ by $1 - 0.2 = 0.8$ and $y$ by $1 - 0.8 = 0.2$:
      $(2, 1) \to (1.6, 0.2) \to (1.28, 0.04)$. The steep direction $y$ shrinks much faster than
      the shallow direction $x$ — with one learning rate for both, progress along the flat
      direction is slow.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 12–13
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html
        locator: Sec. 12.3.2 Multivariate Gradient Descent
    source:
      id: ncu-intro-dl
      ref: lecture-03/q01
    status: reviewed
    reviewed_by: claude
  - id: optimization-103
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l03
      - gradient-descent
      - learning-rate
      - ill-conditioning
    question: |
      Gradient descent with a fixed learning rate $\eta$ is applied to the elongated valley
      $L(x, y) = x^2 + 10y^2$. It converges to the minimum from every starting point exactly when
      $0 < \eta < c$. What is $c$?
    answer:
      numeric: 0.1
      tolerance: 0.0001
      hint: a number
      model: $x \leftarrow (1 - 2\eta)x$, $y \leftarrow (1 - 20\eta)y$; both factors need absolute value below 1, and the steep direction requires $\eta < 2/20 = 0.1$.
    explanation: |
      Each coordinate evolves separately: $x$ is multiplied by $1 - 2\eta$ and $y$ by
      $1 - 20\eta$ [^1][^2]. Convergence needs both factors inside $(-1, 1)$, and the steep
      $y$-direction is the binding one: $\eta < 0.1$. Just below that limit the $y$-factor is
      close to $-1$, so the iterate flips from one valley wall to the other (zig-zag), while the
      $x$-factor is close to $0.8$ and progress along the valley floor is slow. Momentum [^3] and
      per-parameter step sizes [^4] were designed for exactly this situation.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 15, 36, 52
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html
        locator: Sec. 12.3.1.1 Learning Rate; Sec. 12.3.2 Multivariate Gradient Descent
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html
        locator: Sec. 12.6.1.2 An Ill-conditioned Problem; Sec. 12.6.1.3 The Momentum Method
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html
        locator: Sec. 12.7.3 The Algorithm
