  - id: optimization-128
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - backpropagation
      - binary-cross-entropy
    question: |
      The output unit of a pass/fail network computes $z^2 = W^2a^1 + b^2$ and
      $\hat y = \sigma(z^2)$, and it is trained with binary cross-entropy. For one student the hidden
      activations are $a^1 = (2, 0)^\top$ and the current parameters are $W^2 = (0.4,\ -0.6)$ and
      $b^2 = -0.8$, so $z^2 = 0$ and $\hat y = 0.5$. The student failed ($y = 0$). After one
      gradient-descent step with $\eta = 0.1$, the first weight is {{1}}, the second weight is {{2}}
      and the bias is {{3}}.
    answer:
      blanks:
        - numeric: 0.3
          tolerance: 0.0005
          hint: a number
        - numeric: -0.6
          tolerance: 0.0005
          hint: a number
        - numeric: -0.85
          tolerance: 0.0005
          hint: a number
      model: $\partial L/\partial z^2 = \hat y - y = 0.5$; $\partial L/\partial W^2 = 0.5\,(a^1)^\top = (1,\ 0)$, so $W^2 = (0.4 - 0.1,\ -0.6) = (0.3,\ -0.6)$; $b^2 = -0.8 - 0.05 = -0.85$.
    explanation: |
      For a sigmoid output trained with binary cross-entropy, the gradient with respect to the logit
      simplifies to $\hat y - y = 0.5$, the two-class case of the softmax result [^1][^2]. The
      chain rule then gives $\partial L/\partial W^2 = (\hat y - y)(a^1)^\top = (1,\ 0)$ and
      $\partial L/\partial b^2 = 0.5$ [^3]. Subtracting $\eta$ times these lowers the first weight
      to $0.3$ and the bias to $-0.85$, pushing $\hat y$ down toward the label 0. The weight from the
      inactive hidden unit ($a^1_2 = 0$) gets zero gradient and stays at $-0.6$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 23, 25
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#softmax-and-cross-entropy-loss
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
        locator: Sec. 5.3.3 Backpropagation
    source:
      id: ncu-intro-dl
      ref: lecture-03/q37
    status: reviewed
    reviewed_by: claude
  - id: optimization-129
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - optimizer-choice
    question: |
      True or false: all gradient-based optimizers minimize the same training loss, so switching from
      SGD to Adam can change how fast a network trains but not the accuracy of the final model.
    options:
      - text: 'True'
        why: On a non-convex loss, optimizers with different update rules follow different paths and can end in different solutions that generalize differently.
      - text: 'False'
        correct: true
    explanation: |
      The choice of optimizer affects convergence speed, computational cost and the quality of the
      solution that is reached [^1]. A deep network's loss is non-convex, so methods with different
      update rules settle in different minima; in experiments on several deep-learning tasks,
      adaptive methods such as Adam found solutions that generalized worse than those of SGD, even
      when their training loss was lower [^2]. Every method has trade-offs, so the optimizer is a
      design choice to validate, not a detail.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 27
      - title: Wilson et al. (2017), The Marginal Value of Adaptive Gradient Methods in Machine Learning, arXiv:1705.08292
        url: https://arxiv.org/abs/1705.08292
        locator: Abstract
