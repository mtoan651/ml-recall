  - id: optimization-106
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - momentum
    question: |
      Momentum is used in its exponential-moving-average form,
      $v_t = \beta v_{t-1} + (1 - \beta)\,\nabla L(\theta_{t-1})$,
      $\theta_t = \theta_{t-1} - \eta\,v_t$, with $\beta = 0.9$, $\eta = 0.1$ and $v_0 = 0$. For
      $L(\theta) = \theta^2$ and $\theta_0 = 1$, what is $\theta_2$? Give 4 decimals.
    answer:
      numeric: 0.9424
      tolerance: 0.0002
      hint: 4 decimals
      model: $g_1 = 2$, $v_1 = 0.2$, $\theta_1 = 0.98$; $g_2 = 1.96$, $v_2 = 0.18 + 0.196 = 0.376$, $\theta_2 = 0.98 - 0.0376 = 0.9424$.
    explanation: |
      The velocity is a leaky (exponential moving) average of past gradients [^1][^3]. Step 1:
      $g_1 = 2\theta_0 = 2$,
      $v_1 = 0.1 \cdot 2 = 0.2$, $\theta_1 = 1 - 0.02 = 0.98$. Step 2: $g_2 = 1.96$,
      $v_2 = 0.9 \cdot 0.2 + 0.1 \cdot 1.96 = 0.376$, $\theta_2 = 0.98 - 0.0376 = 0.9424$. Because
      $v$ starts at 0 and the factor $1 - \beta$ scales new gradients, the first steps are small;
      the velocity builds up while gradients keep pointing the same way. Many texts and libraries
      drop the factor $1 - \beta$ and use $v_t = \beta v_{t-1} + g_t$ [^2], which only rescales the
      learning rate.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 37–38
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html
        locator: Sec. 12.6.1.1 Leaky Averages; Sec. 12.6.1.3 The Momentum Method; Sec. 12.6.1.4 Effective Sample Weight
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html
        locator: Sec. 12.10.1 The Algorithm (leaky averages with factors 1 − β)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q06
    status: reviewed
    reviewed_by: claude
  - id: optimization-107
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - nesterov
      - momentum
    question: |
      Nesterov momentum in moving-average form uses
      $v_t = \beta v_{t-1} + (1 - \beta)\,\nabla L(\theta - \eta\beta v_{t-1})$ and
      $\theta \leftarrow \theta - \eta v_t$. For $L(\theta) = \theta^2$ with $\theta = 1$,
      $v_{t-1} = 1$, $\beta = 0.9$ and $\eta = 0.1$, the gradient used in this step is {{1}} and the
      new $\theta$ is {{2}}. Give 4 decimals.
    answer:
      blanks:
        - numeric: 1.82
          tolerance: 0.0002
          hint: a number
        - numeric: 0.8918
          tolerance: 0.0002
          hint: 4 decimals
      model: Look-ahead point $1 - 0.1 \cdot 0.9 \cdot 1 = 0.91$, gradient $2 \cdot 0.91 = 1.82$; $v_t = 0.9 + 0.1 \cdot 1.82 = 1.082$; $\theta = 1 - 0.1082 = 0.8918$.
    explanation: |
      Plain momentum evaluates the gradient at the current point. Nesterov first moves along the
      accumulated velocity — here to $\theta - \eta\beta v_{t-1} = 0.91$ — and evaluates the
      gradient there, $2 \cdot 0.91 = 1.82$ [^1][^2]. The velocity becomes
      $0.9 + 0.1 \cdot 1.82 = 1.082$ and $\theta = 0.8918$. Plain momentum would have used the
      gradient 2 at $\theta = 1$; looking ahead lets the method slow down earlier when the slope
      is about to change.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 39–40
      - title: Ruder (2016), An overview of gradient descent optimization algorithms, arXiv:1609.04747
        url: https://arxiv.org/abs/1609.04747
        locator: Sec. 4.2 Nesterov accelerated gradient
    source:
      id: ncu-intro-dl
      ref: lecture-03/q08
    status: reviewed
    reviewed_by: claude
  - id: optimization-108
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - adagrad
    question: |
      AdaGrad updates a parameter by $\theta \leftarrow \theta - \dfrac{\eta}{\sqrt{G_t} + \varepsilon}\,g_t$,
      where $G_t$ is the sum of all squared gradients so far. With $\eta = 0.1$ and negligible
      $\varepsilon$, the gradients at steps 1 and 2 are $g_1 = 3$ and $g_2 = 4$. By how much does
      $\theta$ change at step 2 (give the signed change)?
    answer:
      numeric: -0.08
      tolerance: 0.0005
      hint: a signed number
      model: $G_2 = 9 + 16 = 25$, change $= -0.1 \cdot 4/\sqrt{25} = -0.08$
    explanation: |
      AdaGrad divides the learning rate by the square root of the accumulated squared gradients of
      each parameter [^1][^2]. After two steps $G_2 = 3^2 + 4^2 = 25$, so the step is
      $-0.1 \cdot 4/5 = -0.08$, smaller than plain gradient descent's $-0.4$. Because $G_t$ only
      grows, the effective learning rate keeps shrinking — helpful for rarely updated (sparse)
      features, but it can stall long training runs.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 41–42
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html
        locator: Sec. 12.7.3 The Algorithm
    source:
      id: ncu-intro-dl
      ref: lecture-03/q09
    status: reviewed
    reviewed_by: claude
  - id: optimization-109
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l03
      - adagrad
      - rmsprop
    question: |
      A parameter receives the same gradient $g = 2$ at each of 100 steps, with $\eta = 0.1$ and
      negligible $\varepsilon$. AdaGrad divides by $\sqrt{G_t}$ with $G_t = \sum_{i \le t} g_i^2$;
      RMSProp divides by $\sqrt{E_t}$ with $E_t = 0.9E_{t-1} + 0.1g_t^2$ and $E_0 = 0$. At step 100
      the step size $\eta |g|/\sqrt{\cdot}$ is {{1}} for AdaGrad and about {{2}} for RMSProp.
    answer:
      blanks:
        - numeric: 0.01
          tolerance: 0.0005
          hint: a number
        - numeric: 0.1
          tolerance: 0.001
          hint: a number
      model: AdaGrad $G_{100} = 100 \cdot 4 = 400$, step $0.1 \cdot 2/20 = 0.01$. RMSProp $E_{100} = 4(1 - 0.9^{100}) \approx 4$, step $\approx 0.1 \cdot 2/2 = 0.1$.
    explanation: |
      AdaGrad's sum grows linearly with $t$ for a constant gradient, so its step decays like
      $1/\sqrt{t}$: after 100 steps it is ten times smaller than at the start [^1][^2]. RMSProp
      replaces the sum by an exponentially decaying average, which settles at $g^2 = 4$, so the
      step stays near $\eta = 0.1$ instead of vanishing [^3]. Because the average forgets old
      gradients, RMSProp also adapts when the gradient scale drifts over time.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 41–44
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html
        locator: Sec. 12.7.3 The Algorithm
      - source: d2l
        url: https://d2l.ai/chapter_optimization/rmsprop.html
        locator: Sec. 12.8.1 The Algorithm
