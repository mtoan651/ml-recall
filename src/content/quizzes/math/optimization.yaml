  - id: optimization-098
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - gradient-descent
    question: |
      A model $\hat y = wx + b$ is trained with the loss $L = \tfrac12(\hat y - y)^2$ on one
      example $x = 3$, $y = 5$. The current parameters are $w = 0.5$, $b = 0$ and the learning
      rate is $\eta = 0.05$. After one gradient-descent step, $w =$ {{1}} and $b =$ {{2}}.
    answer:
      blanks:
        - numeric: 1.025
          tolerance: 0.0005
          hint: a decimal
        - numeric: 0.175
          tolerance: 0.0005
          hint: a decimal
      model: $\hat y = 1.5$, $\partial L/\partial w = (1.5 - 5) \cdot 3 = -10.5$, $\partial L/\partial b = -3.5$; $w = 0.5 + 0.525 = 1.025$, $b = 0 + 0.175 = 0.175$.
    explanation: |
      By the chain rule, $\partial L/\partial w = (\hat y - y)\,x$ and
      $\partial L/\partial b = \hat y - y$ [^1][^2]. With $\hat y = 1.5$ the residual is $-3.5$, so
      the gradients are $-10.5$ and $-3.5$. Both are computed at the old parameters and then
      applied together: $w \leftarrow 0.5 - 0.05(-10.5) = 1.025$ and
      $b \leftarrow 0 - 0.05(-3.5) = 0.175$. The new prediction $3.25$ is closer to 5, and the loss
      falls from $6.125$ to about $1.53$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 48–52
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html
        locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
    source:
      id: ncu-intro-dl
      ref: lecture-01/q05
    status: reviewed
    reviewed_by: claude
  - id: optimization-099
    type: multiple
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l01
      - gradient-descent
      - learning-rate
    question: |
      The model $\hat y = wx + b$ starts at $w = b = 0$ and is trained with
      $L = \tfrac12(\hat y - y)^2$ on the single example $x = 1$, $y = 4$ (initial loss 8). For
      which learning rates does **one** gradient-descent step lower the loss? Select all that apply.
    options:
      - text: $\eta = 0.1$
        correct: true
      - text: $\eta = 0.75$
        correct: true
      - text: $\eta = 1.0$
        why: Both parameters move to 4, the prediction jumps to 8 and overshoots the target by as much as it was below it, so the loss stays at 8.
      - text: $\eta = 1.25$
        why: The prediction jumps to 10, overshooting the target by 6, and the loss rises to 18.
    explanation: |
      Both gradients equal $\hat y - y = -4$ (because $x = 1$), so one step gives
      $w = b = 4\eta$ and the new prediction is $8\eta$ [^1]. The new loss
      $\tfrac12(8\eta - 4)^2$ is $5.12$ for $\eta = 0.1$, $2$ for $\eta = 0.75$ (it overshoots, but
      lands closer), $8$ for $\eta = 1$ and $18$ for $\eta = 1.25$. A step that is too large jumps
      past the minimum, and beyond a threshold the loss grows — the overshooting and divergence
      that make the learning rate a critical setting [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 52–53
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html
        locator: Sec. 12.3.1.1 Learning Rate
    source:
      id: ncu-intro-dl
      ref: lecture-01/q06
    status: reviewed
    reviewed_by: claude
  - id: optimization-100
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - hessian
      - memory
    question: |
      A small network has $P = 50{,}000$ parameters. How many gigabytes ($1\ \text{GB} = 10^9$
      bytes) would it take to store its full Hessian matrix as 32-bit floats?
    answer:
      numeric: 10
      tolerance: 0.01
      hint: a number of GB
      model: $P^2 = 2.5 \times 10^9$ entries × 4 bytes $= 10^{10}$ bytes $= 10$ GB.
    explanation: |
      The Hessian holds all second derivatives $\partial^2 L/\partial\theta_i\partial\theta_j$, a
      $P \times P$ matrix [^1][^2]. With $P = 5 \times 10^4$ that is $2.5 \times 10^9$ entries, or
      10 GB at 4 bytes each — for a tiny network, while the gradient has only $P$ entries. Storing
      the full Hessian is infeasible for neural-network losses [^2], so deep learning relies on
      first-order methods and, when curvature is needed, on Hessian–vector products that automatic
      differentiation computes without forming the matrix [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 90
      - title: 'Wikipedia: Hessian matrix'
        url: https://en.wikipedia.org/wiki/Hessian_matrix
        locator: Definitions and properties; Applications — Use in optimization
      - title: torch.autograd.functional.hvp (PyTorch documentation)
        url: https://docs.pytorch.org/docs/stable/generated/torch.autograd.functional.hvp.html
        locator: Function description (product of the Hessian with a vector v)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q29
