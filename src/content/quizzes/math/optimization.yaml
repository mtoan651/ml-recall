title: Optimization & Calculus
questions:
  - id: optimization-001
    type: single
    difficulty: easy
    question: Let us say that we have computed the gradient of our cost function and stored it in a vector g. What is the cost of one gradient descent update given the gradient?
    options:
      - text: O(D)
        correct: true
      - text: O(N)
      - text: O(ND)
      - text: O(ND^2)
    explanation: |
      Once $g$ is known, the update is $w \leftarrow w - \eta g$ [^1]. That is one scaled subtraction per parameter, so it costs $O(D)$ for $D$ parameters. The $N$-dependent costs belong to *computing* the gradient: summing per-example gradients over $N$ examples costs $O(N)$ gradient evaluations, which is what SGD avoids [^2]. That step is already done here, so $O(N)$ and $O(ND)$ describe the wrong step.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
        locator: Sec. 12.3.2 Multivariate Gradient Descent, Eq. (12.3.7)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
        locator: Sec. 12.4.1 Stochastic Gradient Updates
    source:
      id: mmlu-redux
      ref: machine_learning/50
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=50
    status: draft
  - id: optimization-002
    type: single
    difficulty: hard
    question: Which of the following is false?
    options:
      - text: 'The following fully connected network without activation functions is linear: $g_3(g_2(g_1(x)))$, where $g_i(x) = W_i x$ and $W_i$ are matrices.'
      - text: Leaky ReLU $\max\{0.01x,x\}$ is convex.
      - text: A combination of ReLUs such as $ReLU(x) - ReLU(x-1)$ is convex.
        correct: true
      - text: The loss $\log \sigma(x)= -\log(1+e^{-x})$ is concave
    explanation: |
      $f(x) = \mathrm{ReLU}(x) - \mathrm{ReLU}(x-1)$ is 0 for $x < 0$, equals $x$ on $[0,1]$, and stays at 1 for $x > 1$. It bends downward at $x = 1$, so it breaks the convexity inequality [^1]: $f(1) = 1 > \tfrac12 f(0) + \tfrac12 f(2) = \tfrac12$. The other three statements are true:
      - Stacking linear layers without activations collapses into a single linear (affine) map [^2].
      - Leaky ReLU is the maximum of the lines $0.01x$ and $x$, and a maximum of convex functions is convex, as you can check from the definition [^1].
      - $\frac{d}{dx}\log\sigma(x) = 1 - \sigma(x)$. Using $\sigma' = \sigma(1-\sigma)$ [^3], the second derivative is $-\sigma(x)(1-\sigma(x)) < 0$, so $\log\sigma$ is concave [^1].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_optimization/convexity.html#convex-functions
        locator: Sec. 12.2.1.2 Convex Functions; Sec. 12.2.2.3 Convexity and Second Derivatives
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
        locator: Sec. 5.1.1.3 From Linear to Nonlinear
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
        locator: Sec. 5.1.2.2 Sigmoid Function, Eq. (5.1.7)
    source:
      id: mmlu-redux
      ref: machine_learning/84
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=84
    status: draft
  - id: optimization-003
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - gradient
      - gradient-descent
    question: In gradient descent, what is the gradient of the loss?
    options:
      - text: The angle of the loss curve
      - text: The direction of steepest descent
        why: The gradient points towards steepest *ascent*; gradient descent steps along its negative.
      - text: The slope of the loss at the current point — the vector of partial derivatives
        correct: true
      - text: The area under the loss curve
    explanation: The gradient collects the partial derivatives of the loss with respect to the parameters and points towards the steepest local increase [^1]; gradient descent therefore moves in the negative gradient direction [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 50
      - source: d2l
        locator: Sec. 12.3 Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html
        quote: the direction of steepest descent is given by the negative gradient
    source:
      id: ncu-intro-dl
      ref: exercise-02/q11
    status: reviewed
  - id: optimization-004
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - convergence
      - gradient-descent
    question: In practice, when does gradient descent stop?
    options:
      - text: When the loss reaches its maximum
      - text: When the gradient becomes very large
        why: A large gradient means the parameters are far from a stationary point.
      - text: Only after a fixed number of steps, regardless of progress
        why: Practical stopping rules also watch how much the updates change.
      - text: When the updates (or the gradient) become very small, or an iteration limit is reached
        correct: true
    explanation: Close to a minimum the gradient — and with it each update — shrinks, while a learning rate that is too large can overshoot instead of settling [^1]. Common stopping rules are therefore "change below a tolerance" or "maximum number of iterations". A near-zero gradient only signals a critical point, not necessarily the global optimum [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 14–15
      - source: d2l
        locator: Sec. 12.1 Optimization and Deep Learning
        url: https://d2l.ai/chapter_optimization/optimization-intro.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q12
    status: reviewed
  - id: optimization-005
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - critical-point
    question: In optimization, what is a critical (stationary) point?
    options:
      - text: A point where learning stops for good
        why: Noise in SGD can move the parameters away again, e.g. from a saddle point.
      - text: A point where the loss is at its maximum
        why: A maximum is only one kind of critical point.
      - text: A point where the gradient of the objective is zero
        correct: true
      - text: A point where the parameters stop changing
        why: Parameters can stall for other reasons, such as a learning rate of zero.
    explanation: Critical points have $\nabla L = 0$. They can be local minima, local maxima or saddle points, so reaching one does not guarantee the global optimum [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 14
      - source: d2l
        locator: Sec. 12.1 Optimization and Deep Learning
        url: https://d2l.ai/chapter_optimization/optimization-intro.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q17
    status: reviewed
  - id: optimization-006
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
    question: What is the core goal of optimization in deep learning?
    options:
      - text: Adjust the parameters so that the loss becomes as small as possible
        correct: true
      - text: Increase the number of target labels
      - text: Remove the validation set
      - text: Replace the input features with the labels
    explanation: Optimization updates the weights and biases to minimize the loss, i.e. to reduce the difference between predictions and targets [^1][^2].
    references:
