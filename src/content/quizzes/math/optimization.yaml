  - id: optimization-017
    type: single
    difficulty: easy
    question: Let $x_1 = 1$ and $x_{n+1} = \sqrt{3 + 2x_n}$ for all positive integers $n$. If it is assumed that $\{x_n\}$ converges, then $\lim_{n \to \infty} x_n =$
    options:
      - text: $3$
        correct: true
      - text: $e$
        why: '$e$ does not satisfy the fixed-point equation: $\sqrt{3 + 2e} \approx 2.90 \ne e$.'
      - text: $\sqrt{5}$
        why: $\sqrt{5}$ is only the second term $x_2 = \sqrt{3 + 2}$; the limit must satisfy $L = \sqrt{3 + 2L}$.
      - text: $0$
        why: Every term is positive and the sequence grows from 1 ($x_2 = \sqrt5 \approx 2.24$), so it cannot tend to 0; also $\sqrt{3 + 0} \ne 0$.
    explanation: 'If $x_n \to L$ then also $x_{n+1} \to L$, and because $\sqrt{3 + 2x}$ is continuous the limit passes inside it: $L = \sqrt{3 + 2L}$ [^1]. Squaring gives $L^2 - 2L - 3 = (L - 3)(L + 1) = 0$, and $L = -1$ is impossible because every term is positive, so $L = 3$. $\sqrt{5}$ is only the second term $x_2$. The same reasoning applies to any convergent iteration $x_{n+1} = g(x_n)$ with continuous $g$: its limit is a fixed point $x = g(x)$.'
    references:
      - title: CLP-2 Integral Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP2/clp_2_ic/chap_seq_ser-3.html
        locator: Sec. 3.1 Sequences, Theorem 3.1.12 Continuous functions of limits
    source:
      id: mmlu-redux
      ref: college_mathematics/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=22
    status: reviewed
    reviewed_by: claude
  - id: optimization-018
    type: single
    difficulty: easy
    question: Let $f(x)$ be a function whose graph passes through the origin. If $f(2n) = n^2 + f(2(n - 1))$ for every integer $n$, what is the value of $f(8)$?
    options:
      - text: '24'
        why: The values are $f(2) = 1$, $f(4) = 5$, $f(6) = 14$ and $f(8) = 30$, so 24 does not fit the recurrence.
      - text: '30'
        correct: true
      - text: '32'
        why: $f(8) = f(6) + 4^2 = 14 + 16 = 30$, not 32.
      - text: '36'
        why: 36 would need $f(6) = 20$, but $f(6) = 1 + 4 + 9 = 14$, so $f(8) = 30$.
    explanation: Write $a_n = f(2n)$. The recurrence says $a_n - a_{n-1} = n^2$, and $a_0 = f(0) = 0$ because the graph passes through the origin. Adding these differences telescopes to $a_n - a_0 = \sum_{k=1}^{n} k^2$ [^1]. So $f(8) = a_4 = 1 + 4 + 9 + 16 = 30$; note that $f(8)$ is $a_4$, not $a_8$.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_recurrence.html
        locator: Sec. 2.4 Solving Recurrence Relations (telescoping)
    source:
      id: mmlu-redux
      ref: college_mathematics/31
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=31
    status: reviewed
    reviewed_by: claude
  - id: optimization-019
    type: true_false
    difficulty: easy
    question: "True or false: if $f : [a, b] \\to \\mathbb{R}$ has a local maximum at a point $c$ of $[a, b]$, then $f'(c)$ must exist and equal 0."
    options:
      - text: 'True'
        why: A maximum at an endpoint need not have zero slope ($f(x) = x$ on $[0, 1]$ has $f'(1) = 1$), and at a corner such as $-\lvert x\rvert$ at 0 the derivative does not exist.
      - text: 'False'
        correct: true
    explanation: False. A local extremum forces $f'(c) = 0$ only at an interior point where the derivative exists [^1]. The maximum can sit at a corner where $f$ is not differentiable, as $-|x|$ peaks at $x = 0$, or at an endpoint of the interval, as $f(x) = x$ on $[0, 1]$ peaks at $x = 1$ where $f'(1) = 1$ [^1]. That is why the search for a maximum on a closed interval checks critical points, singular points and the endpoints [^2].
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_optimise.html
        locator: Sec. 3.5 Optimisation, Theorem 3.5.4 and Definition 3.5.6 (critical and singular points)
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-5-optimization.html#sec-3-5-optimization-4
        locator: Sec. 3.5.2 Global Optimization
    source:
      id: mmlu-redux
      ref: college_mathematics/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=33
