      id: ncu-intro-dl
      ref: lecture-03/q38
    status: reviewed
    reviewed_by: claude
  - id: optimization-130
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - mini-batch
      - sgd
    question: |
      A scalar parameter $\theta = 2$ is trained with learning rate $\eta = 0.5$. At this
      $\theta$, the four examples of a mini-batch have the per-example loss gradients $0.8$, $-0.4$,
      $1.2$ and $0.4$. A mini-batch gradient-descent step on these four examples gives
      $\theta =$ {{1}}; an SGD step on the first example alone gives $\theta =$ {{2}}.
    answer:
      blanks:
        - numeric: 1.75
          tolerance: 0.0005
          hint: a number
        - numeric: 1.6
          tolerance: 0.0005
          hint: a number
      model: 'Mini-batch: average gradient $(0.8 - 0.4 + 1.2 + 0.4)/4 = 0.5$, so $\theta = 2 - 0.5 \cdot 0.5 = 1.75$. SGD: $\theta = 2 - 0.5 \cdot 0.8 = 1.6$.'
    explanation: |
      Mini-batch gradient descent averages the per-example gradients of the batch and takes one step
      with that average [^1][^2]; SGD steps with the gradient of a single example [^1][^3]. The first
      example's gradient $0.8$ differs from the batch average $0.5$, and other examples would give
      $-0.4$ or $1.2$: this spread is the noise of SGD, which averaging over a mini-batch reduces.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 30, 32, 34
      - source: d2l
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
        locator: Sec. 12.5.2 Minibatches, eq. (12.5.2)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
        locator: Sec. 12.4.1 Stochastic Gradient Updates
    source:
      id: ncu-intro-dl
