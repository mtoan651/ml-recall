  - id: optimization-065
    type: single
    difficulty: easy
    tags:
      - gradients
      - norms
      - matrix-calculus
    question: |
      For a nonzero vector $\mathbf{v} \in \mathbb{R}^n$, what is the gradient
      $\frac{\partial}{\partial\mathbf{v}}\lVert\mathbf{v}\rVert_2$?
    options:
      - text: $\mathbf{v}/\lVert\mathbf{v}\rVert_2$, the unit vector along $\mathbf{v}$
        correct: true
      - text: $2\mathbf{v}$, twice the vector itself
        why: That is the gradient of the squared norm $\lVert\mathbf{v}\rVert_2^2 = \sum_i v_i^2$.
      - text: $\mathbf{v}/\lVert\mathbf{v}\rVert_2^2$, the vector divided by its squared norm
        why: The chain rule gives $\frac{1}{2}(\sum_i v_i^2)^{-1/2} \cdot 2v_i = v_i/\lVert\mathbf{v}\rVert_2$, with the norm to the first power [^1].
      - text: $\mathbf{1}$, a vector of ones, as each $v_i$ enters the norm once
        why: Each $v_i$ enters squared, inside a square root, so the derivative depends on $\mathbf{v}$.
    explanation: |
      Write $\lVert\mathbf{v}\rVert_2 = (\sum_i v_i^2)^{1/2}$. By the chain rule
      $\partial\lVert\mathbf{v}\rVert/\partial v_i = v_i / \lVert\mathbf{v}\rVert$, and stacking the
      partial derivatives in the shape of $\mathbf{v}$ gives $\mathbf{v}/\lVert\mathbf{v}\rVert$ [^1].
      The norm grows fastest along $\mathbf{v}$ itself, at unit rate. At $\mathbf{v} = \mathbf{0}$ the
      norm has a kink, like $|x|$, and no gradient. This gradient appears in norm penalties and in
      gradient clipping.
    references:
      - source: d2l
        locator: Sec. 22.4.7 A Little Matrix Calculus (denominator layout) and Sec. 22.4.4 Multivariate Chain Rule
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-little-matrix-calculus
      - source: d2l
        locator: Sec. 22.4.9 Exercises, Exercise 2
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/multivariable-calculus#ex2
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    status: draft
  - id: optimization-066
    type: short_answer
    difficulty: easy
    tags:
      - gradients
      - log-sum-exp
      - softmax
    question: Let $L(x, y) = \log(e^x + e^y)$. What is $\partial L / \partial x$ at $(x, y) = (\ln 3, 0)$?
    answer:
      numeric: 0.75
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $\frac{e^x}{e^x + e^y} = \frac{3}{3 + 1} = 0.75$
    explanation: |
      By the chain rule $\partial L/\partial x = e^x/(e^x + e^y)$ and
      $\partial L/\partial y = e^y/(e^x + e^y)$ [^1]. At $(\ln 3, 0)$ these are $3/4$ and $1/4$. The
      gradient of log-sum-exp is the softmax of its inputs, so its components are positive and
      always sum to 1 [^2]; that is why the cross-entropy gradient with respect to the logits is
      $\textrm{softmax}(\mathbf{o}) - \mathbf{y}$.
    references:
      - source: d2l
        locator: Sec. 22.4.1 Higher-Dimensional Differentiation (gradients) and Sec. 22.4.4 Multivariate Chain Rule
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#multivariate-chain-rule
