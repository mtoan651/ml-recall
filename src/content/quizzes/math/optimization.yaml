        url: https://activecalculus.org/single2e/sec-5-3-substitution.html
        locator: Sec. 5.3 Integration by substitution
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-5-improper.html#sec-6-5-improper-4
        locator: Sec. 6.5.2 Improper Integrals Involving Unbounded Intervals
    source:
