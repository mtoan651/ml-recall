      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=93
    status: reviewed
    reviewed_by: claude
  - id: optimization-031
    type: short_answer
    difficulty: easy
    tags:
      - loss-landscape
      - symmetry
      - local-minima
      - mlp
    question: |
      An MLP has one hidden layer with 5 units and a single output. Starting from one trained set of
      weights, how many weight settings (counting the original) can you get just by reordering the
      hidden units, all computing exactly the same function? Assume no two hidden units are
      identical.
    answer:
      numeric: 120
      tolerance: 0
      hint: a whole number
      model: $5! = 120$ orderings of the hidden units
    explanation: |
      Swapping hidden units $i$ and $j$, that is their incoming weights and bias together with their
      outgoing weight, leaves the network's output unchanged, because the output layer just sums
      over the hidden units. Any of the $d! = 5! = 120$ permutations gives an equivalent solution, so
      every local minimum comes with at least $d!$ copies that behave identically. This symmetry is
      one reason deep-learning objectives have many local minima [^1]. With odd activations such as
      $\tanh$, flipping the signs of a unit's weights multiplies the count by another $2^d$.
    references:
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima (deep-learning objectives have many local optima)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.1.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/optimization-intro#ex1
      url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-032
    type: single
    difficulty: medium
    tags:
      - saddle-points
      - gradient-descent
      - hessian
    question: |
      $f(x, y) = x^2 - y^2$ has a saddle point at the origin. Gradient descent with a small learning
      rate $\eta$ starts at $(1, 10^{-6})$. Why does it not end at the saddle?
    options:
      - text: Along $y$ the update is $y \leftarrow (1 + 2\eta)y$, so the tiny offset grows geometrically
        correct: true
      - text: The gradient at the origin is nonzero along $y$, which pushes the iterate away from it
        why: All partial derivatives vanish at a saddle point; that is what makes it a critical point [^1].
      - text: It does end there, because every start with $x \neq 0$ is drawn to the critical point
        why: Only the $x$ coordinate shrinks, as $(1 - 2\eta)x$. Any nonzero $y$ is amplified [^1].
      - text: Escaping needs curvature information, so only Newton-type methods can ever leave a saddle point
        why: Plain gradient descent leaves it too, as soon as the iterate is off the stable line $y = 0$.
    explanation: |
      The gradient is $(2x, -2y)$, so gradient descent updates $x \leftarrow (1 - 2\eta)x$ and
      $y \leftarrow (1 + 2\eta)y$. The Hessian has one positive and one negative eigenvalue, which
      makes the origin a saddle point [^1]: attracting along $x$, repelling along $y$. Like a ball
      balanced on a real saddle, the equilibrium is unstable, and any perturbation along $y$ grows
      exponentially. Optimizers can use this: the noise in minibatch gradients knocks parameters off
      such points [^2], and gradient descent started exactly at $y = 0$ is the only way to stay stuck.
    references:
      - source: d2l
        locator: Sec. 12.1.2.2 Saddle Points (the example $x^2 - y^2$ and the Hessian eigenvalue test)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima (minibatch noise dislodges parameters)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.1.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/optimization-intro#ex4
      url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-033
    type: multiple
    difficulty: medium
    tags:
      - convexity
      - convex-sets
      - norms
    question: Which of these subsets of $\mathbb{R}^2$ are convex? Select all that apply.
    options:
      - text: '$\{\mathbf{x} : |x_1| + |x_2| \le 1\}$'
        correct: true
      - text: '$\{\mathbf{x} : \max(|x_1|, |x_2|) \le 1\}$'
        correct: true
      - text: '$\{\mathbf{x} : (\sqrt{|x_1|} + \sqrt{|x_2|})^2 \le 1\}$'
        why: $(1, 0)$ and $(0, 1)$ are in the set, but their midpoint $(\frac{1}{2}, \frac{1}{2})$ gives $(2\sqrt{0.5})^2 = 2 > 1$. For $p < 1$, $\lVert \cdot \rVert_p$ is not a norm, as it is not subadditive [^2], and its "ball" is not convex.
      - text: '$\{\mathbf{x} : x_1 + 2x_2 = 3\}$'
        correct: true
      - text: '$\{\mathbf{x} : \lVert \mathbf{x} \rVert_2 \le 1\} \cup \{\mathbf{x} : \lVert \mathbf{x} - (3, 0) \rVert_2 \le 1\}$'
        why: The segment between the two centres leaves both discs; a union of convex sets need not be convex [^1].
    explanation: |
      A set is convex if it contains the whole segment between any two of its points [^1]. Balls of
      a $p$-norm with $p \ge 1$ are convex: by the triangle inequality,
      $\lVert \lambda \mathbf{a} + (1 - \lambda)\mathbf{b} \rVert \le \lambda \lVert \mathbf{a} \rVert + (1 - \lambda)\lVert \mathbf{b} \rVert \le r$
      [^2]. That covers the $\ell_1$ diamond and the $\ell_\infty$ square. An affine set
      $\{\mathbf{x} : W\mathbf{x} = \mathbf{b}\}$ is convex because
      $W(\lambda \mathbf{a} + (1 - \lambda)\mathbf{c}) = \lambda \mathbf{b} + (1 - \lambda)\mathbf{b} = \mathbf{b}$.
      Intersections of convex sets are convex, unions in general are not [^1].
    references:
      - source: d2l
        locator: Sec. 12.2.1.1 Convex Sets (definition; intersections versus unions)
        url: https://d2l.ai/chapter_optimization/convexity.html#convex-sets
      - title: 'Wikipedia: Lp space'
        locator: The p-norm in finite dimensions; When 0 < p < 1
        url: https://en.wikipedia.org/wiki/Lp_space
      - source: d2l
        locator: Sec. 12.2.5 Exercises, Exercises 2 and 5
        url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/convexity#ex2
      url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-034
    type: true_false
    difficulty: easy
    tags:
      - convexity
      - convex-functions
    shuffle: false
    question: |
      True or false: if $f$ and $g$ are convex functions on $\mathbb{R}$, then
      $h(x) = \min(f(x), g(x))$ is convex too.
    options:
      - text: 'True'
        why: 'Counterexample: $f = (x - 1)^2$, $g = (x + 1)^2$. Then $h(-1) = h(1) = 0$ but $h(0) = 1$, above the chord between them [^1].'
      - text: 'False'
        correct: true
    explanation: |
      Convexity requires $\lambda h(x) + (1 - \lambda)h(x') \ge h(\lambda x + (1 - \lambda)x')$ [^1].
      The minimum of two parabolas centred at $\pm 1$ has two valleys with a bump at 0, which breaks
      this at $x = -1$, $x' = 1$, $\lambda = \frac{1}{2}$. The maximum, on the other hand, is
      always convex: each of $f$ and $g$ lies below its own chord, so their maximum lies below the
      maximum of the chords. Geometrically, the region above $\max(f, g)$ is the intersection of the
      regions above $f$ and above $g$, and intersections of convex sets are convex [^2].
      $\textrm{ReLU}(x) = \max(0, x)$ is convex for this reason.
    references:
      - source: d2l
        locator: Sec. 12.2.1.2 Convex Functions (definition)
        url: https://d2l.ai/chapter_optimization/convexity.html#convex-functions
      - source: d2l
        locator: Sec. 12.2.1.1 Convex Sets (intersections of convex sets are convex)
        url: https://d2l.ai/chapter_optimization/convexity.html#convex-sets
      - source: d2l
        locator: Sec. 12.2.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/convexity#ex3
      url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-035
    type: true_false
    difficulty: medium
    tags:
      - convexity
      - projections
      - constrained-optimization
    shuffle: false
    question: |
      True or false: projecting onto the unit circle $\{\mathbf{x} : \lVert \mathbf{x} \rVert_2 = 1\}$
      (the curve, not the disc), $P(\mathbf{x}) = \mathbf{x} / \lVert \mathbf{x} \rVert_2$, never
      increases distances: $\lVert P(\mathbf{x}) - P(\mathbf{y}) \rVert \le \lVert \mathbf{x} - \mathbf{y} \rVert$
      for all nonzero $\mathbf{x}, \mathbf{y}$.
    options:
      - text: 'True'
        why: 'Take $\mathbf{x} = (0.1, 0)$ and $\mathbf{y} = (-0.1, 0)$: they are $0.2$ apart, but their projections $(1, 0)$ and $(-1, 0)$ are $2$ apart.'
      - text: 'False'
        correct: true
    explanation: |
      A projection maps a point to the closest point of a set [^1]. For a convex set, such as the
      disc used by gradient clipping, projections are non-expansive:
      $\lVert \textrm{Proj}(\mathbf{x}) - \textrm{Proj}(\mathbf{y}) \rVert \le \lVert \mathbf{x} - \mathbf{y} \rVert$
      [^2]. The circle is not convex, and two nearby points on opposite sides of the centre are sent
      to opposite ends of the circle, ten times farther apart. Non-expansiveness is what makes
      projected gradient steps onto convex constraint sets well behaved.
    references:
      - source: d2l
        locator: Sec. 12.2.3.3 Projections (definition; gradient clipping as projection onto a ball)
        url: https://d2l.ai/chapter_optimization/convexity.html#projections
      - source: d2l
        locator: Sec. 12.2.5 Exercises, Exercise 8 (projections onto convex sets never increase distances)
        url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/convexity#ex8
      url: https://d2l.ai/chapter_optimization/convexity.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-036
    type: short_answer
    difficulty: easy
    tags:
      - gradient-descent
      - learning-rate
      - divergence
    question: |
      Gradient descent on $f(x) = x^2$ uses $x \leftarrow x - \eta f'(x)$. It converges to 0 from any
      start exactly when $0 < \eta < c$. What is $c$?
    answer:
      numeric: 1
      tolerance: 0
      hint: a number
      model: $x \leftarrow (1 - 2\eta)x$ converges iff $|1 - 2\eta| < 1$, i.e. $0 < \eta < 1$
    explanation: |
      With $f'(x) = 2x$ the update is $x \leftarrow (1 - 2\eta)x$, so after $t$ steps
      $x_t = (1 - 2\eta)^t x_0$ [^1]. This shrinks to 0 exactly when $|1 - 2\eta| < 1$. With
      $\eta = 0.2$ the factor is $0.6$ and $x_0 = 10$ becomes about $0.06$ after 10 steps; with
      $\eta = 1.1$ the factor is $-1.2$, so $x$ overshoots and diverges [^2]. At $\eta = 1$ it
      bounces between $\pm x_0$ forever. In general, for curvature $\lambda$ the condition is
      $0 < \eta\lambda < 2$ [^1].
    references:
      - source: d2l
        locator: Sec. 12.6.3.2 Scalar Functions ($x_{t+1} = (1 - \eta\lambda)x_t$)
        url: https://d2l.ai/chapter_optimization/momentum.html#scalar-functions
      - source: d2l
        locator: Sec. 12.3.1.1 Learning Rate ($\eta = 0.2$, $0.05$ and $1.1$ on $f(x) = x^2$)
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
      - source: d2l
        locator: Sec. 12.3.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/gd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/gd#ex1
      url: https://d2l.ai/chapter_optimization/gd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-037
    type: short_answer
    difficulty: medium
    tags:
      - line-search
      - convexity
      - log-sum-exp
    question: |
      A line search minimizes the convex function $f(x) = \log\left(e^{x} + e^{-2x - 3}\right)$.
      Where is its minimizer $x^*$?
    answer:
      numeric: -0.769
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $f'(x) = 0 \iff e^{x} = 2e^{-2x-3} \iff 3x = \ln 2 - 3$, so $x^* = (\ln 2 - 3)/3 \approx -0.769$
    explanation: |
      The derivative is $f'(x) = \frac{e^{x} - 2e^{-2x-3}}{e^{x} + e^{-2x-3}}$, which is zero when
      $e^{x} = 2e^{-2x-3}$, i.e. $x = \ln 2 - 2x - 3$ and $x^* = (\ln 2 - 3)/3 \approx -0.769$.
      $f$ is a log-sum-exp of affine functions, hence convex [^3], so this critical point is the
      global minimum [^1]. A bisection line search on the sign of $f'$, started on an interval such as
      $[-2, 2]$, converges to the same point [^2].
    references:
      - source: d2l
        locator: Sec. 12.2.2.1 Local Minima Are Global Minima
        url: https://d2l.ai/chapter_optimization/convexity.html#local-minima-are-global-minima
      - source: d2l
        locator: Sec. 12.3.3.4 Gradient Descent with Line Search, and Sec. 12.3.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/gd.html#exercises
      - title: 'Wikipedia: LogSumExp'
        locator: Properties (LSE is convex)
        url: https://en.wikipedia.org/wiki/LogSumExp
    source:
      id: d2l
      ref: chapter_optimization/gd#ex2
      url: https://d2l.ai/chapter_optimization/gd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-038
    type: short_answer
    difficulty: easy
    tags:
      - line-search
      - bisection
      - convergence-rate
    question: |
      To minimize a convex, differentiable $f$ on $[a, b]$ with $b - a = 1$, a bisection line search
      looks at the sign of $f'$ at the midpoint and keeps the half that contains the minimum. How
      many steps until the interval is shorter than $10^{-6}$?
    answer:
      numeric: 20
      tolerance: 0
      hint: a whole number
      model: $2^{-19} \approx 1.9 \times 10^{-6}$ and $2^{-20} \approx 9.5 \times 10^{-7}$, so 20 steps
    explanation: |
      Each step halves the interval, so after $k$ steps its length is $2^{-k}$: the error shrinks by a
      constant factor $\frac{1}{2}$ per step (linear convergence), and $k = 20$ is the first with
      $2^{-k} < 10^{-6}$. Picking the correct half needs the sign of the derivative at the midpoint,
      or two function values close to it, which amounts to a finite-difference derivative; a single
      value $f\left(\frac{a+b}{2}\right)$ cannot tell on which side the minimum lies. Line search
      converges quickly but needs many evaluations of the full objective, which is too costly in deep
      learning [^1].
    references:
      - source: d2l
        locator: Sec. 12.3.3.4 Gradient Descent with Line Search
        url: https://d2l.ai/chapter_optimization/gd.html#gradient-descent-with-line-search
      - source: d2l
        locator: Sec. 12.3.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/gd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/gd#ex2-b
      url: https://d2l.ai/chapter_optimization/gd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-039
    type: single
    difficulty: medium
    tags:
      - gradient-descent
      - ill-conditioning
      - learning-rate
    question: |
      Gradient descent with a fixed learning rate is very slow on
      $f(\mathbf{x}) = x_1^2 + 100x_2^2$. What is the cause?
    options:
      - text: Keeping $x_2$ stable needs $\eta < 0.01$, and then $x_1$ shrinks by at most 2% per step
        correct: true
      - text: The gradient along $x_1$ is zero away from the axis, so $x_1$ never moves
        why: The partial derivative $\partial f/\partial x_1 = 2x_1$ is nonzero whenever $x_1 \ne 0$.
      - text: The minimum is not unique, so the iterates drift along a flat valley of equally good points
        why: $f$ has the unique minimum $(0, 0)$; the trouble is the very different curvatures, not a flat valley of minima [^1].
      - text: The function is not convex, so the iterates bounce between local minima
        why: $f$ is a convex quadratic with positive curvature in both directions and a single minimum [^1].
    explanation: |
      Each coordinate evolves separately: $x_1 \leftarrow (1 - 2\eta)x_1$ and
      $x_2 \leftarrow (1 - 200\eta)x_2$. The steep direction forces $|1 - 200\eta| < 1$, so
      $\eta < 0.01$, and then the flat direction contracts by a factor of at least $0.98$ per step,
      needing hundreds of steps [^1]. The curvature ratio, the condition number, is 100. A small
      $\eta$ is safe for $x_2$ but slow for $x_1$, while a larger one diverges along $x_2$ [^1].
      Rescaling the coordinates (preconditioning) or momentum removes the bottleneck [^2].
    references:
      - source: d2l
        locator: Sec. 12.6.1.2 An Ill-conditioned Problem
        url: https://d2l.ai/chapter_optimization/momentum.html#an-ill-conditioned-problem
      - source: d2l
        locator: Sec. 12.3.3.3 Preconditioning (heights in millimetres and kilometres)
        url: https://d2l.ai/chapter_optimization/gd.html#preconditioning
      - source: d2l
        locator: Sec. 12.3.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/gd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/gd#ex3
      url: https://d2l.ai/chapter_optimization/gd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-040
    type: single
    difficulty: medium
    tags:
      - newtons-method
      - preconditioning
      - nonconvex
    question: |
      A lightweight Newton method preconditions with the Hessian diagonal,
      $\mathbf{x} \leftarrow \mathbf{x} - \eta\, \textrm{diag}(\mathbf{H})^{-1} \nabla f(\mathbf{x})$.
      On nonconvex functions, why divide by $|H_{ii}|$ rather than by $H_{ii}$?
    options:
      - text: Where $H_{ii} < 0$ the step would go uphill along that coordinate; $|H_{ii}|$ keeps it a descent step
        correct: true
      - text: Negative entries make $\textrm{diag}(\mathbf{H})$ singular, so it cannot be inverted
        why: A diagonal matrix is singular only when an entry is zero; negative entries invert fine.
      - text: The absolute value is cheaper to obtain by backpropagation than the signed entry
        why: Both need the same second derivative; the absolute value is applied afterwards.
      - text: It makes the method converge in one step on every quadratic, convex or not
        why: One-step convergence holds for an axis-aligned convex quadratic with $\eta = 1$; taking absolute values does not create it [^1].
    explanation: |
      Newton's method divides by the curvature. Where the second derivative is negative, the step
      $-f'(x)/f''(x)$ points in the direction that increases $f$, which is why plain Newton on
      $x\cos(cx)$ goes badly wrong [^1]. Using $|H_{ii}|$ keeps every coordinate step pointing
      downhill while still taking short steps where the curvature is large and long ones where the
      function is flat [^1]. On a convex axis-aligned quadratic, diagonal preconditioning with
      $\eta = 1$ jumps to the minimum in one step [^2].
    references:
      - source: d2l
        locator: Sec. 12.3.3.1 Newton's Method (the nonconvex example and the absolute-value fix)
