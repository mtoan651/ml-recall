    reviewed_by: claude
  - id: optimization-105
    type: multiple
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - sgd
      - mini-batch
      - gradient-descent
    question: |
      Which statements about full-batch gradient descent, SGD and mini-batch gradient descent are
      correct? Select all that apply.
    options:
      - text: When the examples in a mini-batch are drawn uniformly at random, the mini-batch gradient is an unbiased estimate of the full-batch gradient
        correct: true
      - text: Averaging the gradient over a larger mini-batch reduces the variance of this estimate
        correct: true
      - text: On a non-convex loss, full-batch gradient descent reaches the global minimum because its gradient is exact
        why: An exact gradient still only describes the local slope; full-batch GD can stop at a local minimum or stall near a saddle point.
      - text: The three methods use different update rules, which is why they reach different solutions
        why: All three apply the same rule, θ ← θ − η g; the only difference is how many examples are used to estimate g.
    explanation: |
      The three variants share the update $\theta \leftarrow \theta - \eta\,g$ and differ in the
      estimate $g$: all $N$ examples, one example, or a mini-batch of $B$ [^1]. A uniformly sampled
      example's gradient has the full gradient as its expectation [^2], and averaging $B$
      independent ones divides the variance by $B$ [^3]. The exactness of the full-batch gradient
      gives smooth steps, not global optimality: on non-convex deep-learning losses gradient methods
      can end in local minima or slow down near saddle points, and the noise of small batches can
      even help escape them [^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 29–35
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html
        locator: Sec. 12.4.1 Stochastic Gradient Updates
      - source: d2l
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html
        locator: Sec. 12.5.2 Minibatches
      - source: d2l
        url: https://d2l.ai/chapter_optimization/optimization-intro.html
        locator: Sec. 12.1.2.1 Local Minima; Sec. 12.1.2.2 Saddle Points
