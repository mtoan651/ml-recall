  - id: optimization-064
    type: short_answer
    difficulty: easy
    tags:
      - derivatives
      - minimization
      - entropy
    question: Where is the minimum of $f(x) = x\log x$ on $x \ge 0$ (with $f(0) = 0$, the limiting value)?
    answer:
      numeric: 0.368
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $f'(x) = \log x + 1 = 0$ gives $x = e^{-1} \approx 0.368$, with $f(e^{-1}) = -e^{-1}$
    explanation: |
      The derivative is $\log x + 1$, which is zero at $x = e^{-1} \approx 0.368$ [^1]. The second
      derivative $1/x$ is positive, so this is a minimum, with value $-e^{-1} \approx -0.368$, below
      the boundary value $f(0) = 0$ [^2]. The same function appears in entropy: the term
      $-p\log p$ is largest at $p = 1/e$.
