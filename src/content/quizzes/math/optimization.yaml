    reviewed_by: claude
  - id: optimization-086
    type: single
    difficulty: medium
    tags:
      - projection
      - positive-semidefinite
      - eigendecomposition
    question: |
      A symmetric matrix $A$ has eigendecomposition $A = U\Sigma U^\top$. Which matrix is its projection
      onto the set of positive semidefinite matrices, i.e. the PSD matrix closest to $A$ in Frobenius
      norm?
    options:
      - text: $U|\Sigma|U^\top$, where $|\Sigma|$ flips the sign of the negative eigenvalues
        why: Flipping a negative eigenvalue $-\lambda$ to $\lambda$ moves twice as far as setting it to 0, so it is not the closest PSD matrix.
      - text: $U\Sigma_+U^\top$, where $\Sigma_+$ sets the negative eigenvalues to 0
        correct: true
      - text: $A$ with its negative entries set to 0
        why: Entrywise clipping does not make a matrix PSD in general; positive semidefiniteness is a property of the eigenvalues, not of the entries.
      - text: $A + |\lambda_{\min}|\,I$, which shifts every eigenvalue up
        why: This is PSD, but it also changes the eigenvalues that were already non-negative, so it is farther from $A$.
    explanation: |
      The Frobenius norm is unchanged by the orthogonal change of basis $U$, so the problem reduces to
      finding the closest non-negative diagonal to $\Sigma$, which keeps each non-negative eigenvalue
      and replaces each negative one by 0 [^1]. One checks optimality with the first-order condition:
      $B - A = \sum_{i: \sigma_i < 0}(-\sigma_i)u_iu_i^\top$ is a non-negative combination of directions
      in which $B$ is tight, $u_i^\top B u_i = 0$ [^1]. A symmetric matrix is PSD exactly when all its
      eigenvalues are non-negative [^2].
    references:
      - source: mit-ocw-18657
        locator: Problem set 3 solutions, Problem 2 (3)(b)
        url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-3-solution/
      - title: 'Wikipedia: Definite matrix'
        locator: Eigenvalues
        url: https://en.wikipedia.org/wiki/Definite_matrix#Eigenvalues
    source:
      id: mit-ocw-18657
      ref: assignment-3#q2.3b
