  - id: optimization-050
    type: short_answer
    difficulty: medium
    tags:
      - gradient-descent
      - eigenvalues
      - ill-conditioning
      - momentum
    question: |
      Gradient descent minimizes $f(\mathbf{x}) = \frac{1}{2}\sum_{i=1}^{10} \lambda_i x_i^2$ with
      $\lambda_i = 2^{-i}$, starting from $x_i = 1$ for all $i$, with $\eta = 2$. What is $x_{10}$
      after 100 steps?
    answer:
      numeric: 0.822
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $x_{10} = (1 - 2 \cdot 2^{-10})^{100} = (1 - 1/512)^{100} \approx 0.822$
    explanation: |
      On a quadratic, gradient descent works separately along each eigen-direction:
      $x_i \leftarrow (1 - \eta\lambda_i)x_i$ [^1]. With $\eta = 2$ the steepest coordinate
      ($\lambda_1 = \frac{1}{2}$) reaches 0 in one step, while $x_{10}$ shrinks by only $1/512$ per
      step and is still about $0.82$ after 100 steps. The learning rate cannot fix this: stability
      needs $\eta\lambda_1 < 2$, i.e. $\eta < 4$, and even at that limit $x_{10}$ would still be about
      $0.68$. Momentum stays stable up to $\eta\lambda < 2 + 2\beta$ and speeds up the slow
      directions [^2].
    references:
      - source: d2l
        locator: Sec. 12.6.3.1 Quadratic Convex Functions (no mixing between eigenspaces)
        url: https://d2l.ai/chapter_optimization/momentum.html#quadratic-convex-functions
      - source: d2l
        locator: Sec. 12.6.3.2 Scalar Functions (convergence needs $0 < \eta\lambda < 2$, or $< 2 + 2\beta$ with momentum)
        url: https://d2l.ai/chapter_optimization/momentum.html#scalar-functions
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex2
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    status: draft
  - id: optimization-051
    type: short_answer
    difficulty: medium
    tags:
      - quadratic-functions
      - minimizer
      - positive-definite
    question: |
      Let $h(\mathbf{x}) = \frac{1}{2}\mathbf{x}^\top \mathbf{Q}\mathbf{x} + \mathbf{x}^\top\mathbf{c} + b$
      with $\mathbf{Q} = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$, $\mathbf{c} = (-3, 0)^\top$ and
      $b = 0$. What is the minimum value of $h$?
    answer:
      numeric: -3
      tolerance: 0.001
      hint: a number
      model: $\mathbf{x}^* = -\mathbf{Q}^{-1}\mathbf{c} = (2, -1)^\top$ and $h^* = b - \frac{1}{2}\mathbf{c}^\top\mathbf{Q}^{-1}\mathbf{c} = -3$
    explanation: |
      Setting the gradient $\mathbf{Q}\mathbf{x} + \mathbf{c}$ to zero gives
      $\mathbf{x}^* = -\mathbf{Q}^{-1}\mathbf{c}$. Here
      $\mathbf{Q}^{-1} = \frac{1}{3}\begin{bmatrix} 2 & -1 \\ -1 & 2 \end{bmatrix}$, so
      $\mathbf{x}^* = (2, -1)^\top$ and the minimum is
      $b - \frac{1}{2}\mathbf{c}^\top\mathbf{Q}^{-1}\mathbf{c} = -\frac{1}{2} \cdot 9 \cdot \frac{2}{3} = -3$
      [^1]. It is a minimum because $\mathbf{Q}$ is positive definite (eigenvalues 1 and 3). Writing
      $h$ as $\frac{1}{2}(\mathbf{x} - \mathbf{x}^*)^\top\mathbf{Q}(\mathbf{x} - \mathbf{x}^*) + h^*$
      shows that the gradient is $\mathbf{Q}$ times the distance to the minimizer [^1].
    references:
      - source: d2l
        locator: Sec. 12.6.3.1 Quadratic Convex Functions, Eqs. (12.6.6)–(12.6.7)
        url: https://d2l.ai/chapter_optimization/momentum.html#quadratic-convex-functions
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex3
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    status: draft
  - id: optimization-052
    type: single
    difficulty: medium
    tags:
      - momentum
      - sgd
      - gradient-noise
    question: Why is momentum especially useful when the gradients are stochastic (minibatch SGD)?
    options:
      - text: The velocity averages about $1/(1-\beta)$ recent gradients, so much of the noise cancels, like a larger batch at no extra cost
        correct: true
      - text: It makes each stochastic gradient an unbiased estimate of the full gradient, which plain SGD gradients are not
        why: A plain stochastic gradient is already an unbiased estimate of the full gradient [^2].
      - text: It removes the need to decay the learning rate, since the noise in the velocity averages out exactly
        why: The leaky average only damps the noise; the learning rate still has to decrease for convergence [^3].
      - text: It lets you skip shuffling the data, since the velocity remembers the order of past examples
        why: Momentum stores a running sum of gradients, not the data order; examples should still be drawn at random.
    explanation: |
      Momentum replaces the gradient by a leaky average
      $\mathbf{v}_t = \sum_\tau \beta^\tau \mathbf{g}_{t-\tau}$ of past gradients, with an effective
      window of $1/(1 - \beta)$ [^1]. Noisy components that point in different directions from step
      to step partly cancel, while consistent components add up, which gives most of the benefit of a
      bigger batch without computing it [^1]. The averaged gradients come from slightly older
      parameters, so this is not identical to a larger batch, and momentum also speeds up
      ill-conditioned problems [^1]. With minibatches the update is unchanged; only $\mathbf{g}_t$ is
      a minibatch gradient.
    references:
      - source: d2l
        locator: Sec. 12.6.1.1 Leaky Averages and Sec. 12.6.1.3 The Momentum Method
        url: https://d2l.ai/chapter_optimization/momentum.html#leaky-averages
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates (unbiased stochastic gradient)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
      - source: d2l
        locator: Sec. 12.4.3 Convergence Analysis for Convex Objectives (the learning rate needs to vanish)
        url: https://d2l.ai/chapter_optimization/sgd.html#convergence-analysis-for-convex-objectives
      - source: d2l
        locator: Sec. 12.6.5 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/momentum#ex4
      url: https://d2l.ai/chapter_optimization/momentum.html#exercises
    status: draft
  - id: optimization-053
    type: short_answer
    difficulty: hard
    tags:
      - condition-number
      - sensitivity
      - orthogonal-matrices
    question: |
      You minimize $f(\mathbf{x}) = \frac{1}{2}\mathbf{x}^\top\mathbf{Q}\mathbf{x} + \mathbf{c}^\top\mathbf{x}$,
      where $\mathbf{Q}$ is symmetric with eigenvalues 4 and 0.01. The vector $\mathbf{c}$ is
      perturbed by $\boldsymbol{\delta}$ with $\lVert\boldsymbol{\delta}\rVert_2 = 0.01$. What is the
      largest possible change $\lVert\Delta\mathbf{x}^*\rVert_2$ of the minimizer
      $\mathbf{x}^* = -\mathbf{Q}^{-1}\mathbf{c}$?
    answer:
      numeric: 1
      tolerance: 0.001
      hint: a number
      model: $\Delta\mathbf{x}^* = -\mathbf{Q}^{-1}\boldsymbol{\delta}$; along the eigenvector with eigenvalue 0.01 this has length $0.01/0.01 = 1$
    explanation: |
      Write $\mathbf{Q} = \mathbf{U}^\top\boldsymbol{\Lambda}\mathbf{U}$ with orthogonal $\mathbf{U}$.
      Because $\mathbf{U}^\top\mathbf{U} = \mathbf{I}$, $\lVert\mathbf{U}\mathbf{v}\rVert = \lVert\mathbf{v}\rVert$
      for every $\mathbf{v}$, so the rotated perturbation $\mathbf{U}\boldsymbol{\delta}$ still has
      length 0.01 and we can work coordinate by coordinate. The minimizer moves by
      $\bar{\delta}_i/\lambda_i$ in eigen-coordinate $i$ [^1]: at most $0.01/0.01 = 1$, if
      $\boldsymbol{\delta}$ lies along the flat direction, and only $0.01/4 = 0.0025$ along the steep
      one. The ratio of these sensitivities is the condition number $\kappa = 4/0.01 = 400$; a large
      $\kappa$ makes the problem hard to solve accurately [^1].
    references:
      - source: d2l
        locator: Sec. 12.7.2 Preconditioning (perturbing $\mathbf{c}$; condition number, Eq. (12.7.2))
        url: https://d2l.ai/chapter_optimization/adagrad.html#preconditioning
      - source: d2l
        locator: Sec. 12.7.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adagrad#ex1
      url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    status: draft
  - id: optimization-054
    type: single
    difficulty: medium
    tags:
      - adagrad
      - preconditioning
      - rotation
    question: |
      Adagrad is run on $f(\mathbf{x}) = 0.1x_1^2 + 2x_2^2$ and on its copy rotated by $45^\circ$,
      $f(\mathbf{x}) = 0.05(x_1 + x_2)^2 + (x_1 - x_2)^2$. Plain gradient descent behaves the same on
      both up to the rotation, but Adagrad converges much more slowly on the second. Why?
    options:
      - text: Its per-coordinate scaling is a diagonal preconditioner, which helps only when the steep and flat directions follow the axes
        correct: true
      - text: The rotated function has larger gradients, so the accumulated sum shrinks its steps too fast
        why: Adagrad divides by the root of the summed squared gradients, so scaling all gradients by a constant leaves its steps unchanged (up to $\epsilon$).
      - text: Rotating the function makes it nonconvex, and Adagrad's guarantees need convexity
        why: A rotation of a convex quadratic is still a convex quadratic with the same eigenvalues [^2].
      - text: Adagrad is designed for sparse features, and after rotation every feature is sparse
        why: After rotation both coordinates get gradients of similar size at every step; nothing becomes sparse.
    explanation: |
      Adagrad divides each coordinate's step by $\sqrt{\mathbf{s}_t}$, the root of its own
      accumulated squared gradients, as a cheap proxy for the diagonal of the Hessian [^1]. Diagonal
      rescaling removes ill-conditioning entirely when the problem is axis aligned [^1]. After the
      rotation the Hessian $\begin{bmatrix} 2.1 & -1.9 \\ -1.9 & 2.1 \end{bmatrix}$ has equal
      diagonal entries, so both coordinates get about the same scaling, and the factor-20 difference
      in curvature along the rotated axes remains. (The d2l exercise writes the rotated function as
      $0.1(x_1 + x_2)^2 + 2(x_1 - x_2)^2$, twice this copy; Adagrad ignores such a constant factor.) Plain gradient descent does not depend on the
      coordinate system, because orthogonal changes of variables decouple a quadratic into the same
      eigen-directions [^2].
    references:
      - source: d2l
        locator: Sec. 12.7.2 Preconditioning (diagonal rescaling; the gradient as a proxy for the Hessian diagonal)
        url: https://d2l.ai/chapter_optimization/adagrad.html#preconditioning
      - source: d2l
        locator: Sec. 12.6.3.1 Quadratic Convex Functions
        url: https://d2l.ai/chapter_optimization/momentum.html#quadratic-convex-functions
      - source: d2l
        locator: Sec. 12.7.7 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adagrad#ex2
      url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    status: draft
  - id: optimization-055
    type: short_answer
    difficulty: medium
    tags:
      - preconditioning
      - gershgorin
      - condition-number
    question: |
      $\mathbf{M} = \begin{bmatrix} 4 & 2 \\ 2 & 100 \end{bmatrix}$ has condition number about 25.
      After diagonal preconditioning,
      $\tilde{\mathbf{M}} = \textrm{diag}^{-\frac{1}{2}}(\mathbf{M})\,\mathbf{M}\,\textrm{diag}^{-\frac{1}{2}}(\mathbf{M})$,
      the Gershgorin circle theorem confines every eigenvalue of $\tilde{\mathbf{M}}$ to an interval.
      Which upper bound on the condition number of $\tilde{\mathbf{M}}$ follows?
    answer:
      numeric: 1.222
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\tilde{\mathbf{M}} = \begin{bmatrix} 1 & 0.1 \\ 0.1 & 1 \end{bmatrix}$, eigenvalues in $[0.9, 1.1]$, so $\kappa \le 1.1/0.9 \approx 1.222$
    explanation: |
      Diagonal preconditioning makes every diagonal entry 1 and divides each off-diagonal entry by
      $\sqrt{M_{ii}M_{jj}}$: here $2/\sqrt{4 \cdot 100} = 0.1$ [^1]. Gershgorin's theorem puts every
      eigenvalue within (sum of the absolute off-diagonal entries of its row) of a diagonal entry
      [^2], so all eigenvalues lie in $[1 - 0.1, 1 + 0.1]$ and $\kappa \le 1.1/0.9 \approx 1.222$,
      down from about 25. In general all Gershgorin discs of $\tilde{\mathbf{M}}$ are centred at 1,
      so preconditioning helps most when the off-diagonal entries are small relative to the
      diagonal ones.
    references:
      - source: d2l
        locator: Sec. 12.7.2 Preconditioning, Eq. (12.7.3)
        url: https://d2l.ai/chapter_optimization/adagrad.html#preconditioning
      - source: d2l
        locator: Sec. 22.2.5 Gershgorin Circle Theorem
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/eigendecomposition.html#gershgorin-circle-theorem
      - source: d2l
        locator: Sec. 12.7.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adagrad#ex4
      url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    status: draft
  - id: optimization-056
    type: single
    difficulty: medium
    tags:
      - adagrad
      - rmsprop
      - learning-rate-decay
    question: |
      Adagrad accumulates $\mathbf{s}_t = \mathbf{s}_{t-1} + \mathbf{g}_t^2$ and steps by
      $\eta\,\mathbf{g}_t/\sqrt{\mathbf{s}_t + \epsilon}$, so its effective learning rate decays
      roughly like $1/\sqrt{t}$. Which change gives a less aggressive decay?
    options:
      - text: Use a leaky average, $\mathbf{s}_t = \gamma\mathbf{s}_{t-1} + (1 - \gamma)\mathbf{g}_t^2$
        correct: true
      - text: Accumulate $|\mathbf{g}_t|$ instead of $\mathbf{g}_t^2$ in $\mathbf{s}_t$, so that the sum grows more slowly
        why: The sum still grows linearly with $t$, so the step still shrinks like $1/\sqrt{t}$.
      - text: Increase $\epsilon$ from $10^{-6}$ to $10^{-4}$
        why: Once $\mathbf{s}_t$ has grown, $\epsilon$ is negligible and the decay is unchanged.
      - text: Divide by $\mathbf{s}_t + \epsilon$ instead of by its square root
        why: That makes the effective learning rate fall like $1/t$, even faster.
    explanation: |
      Because $\mathbf{s}_t$ sums squared gradients without normalization, it grows about linearly
      and the effective learning rate falls like $\mathcal{O}(t^{-1/2})$, often too fast for deep
      learning [^1]. RMSProp replaces the sum by a leaky average, so $\mathbf{s}_t$ tracks the
      recent scale of $\mathbf{g}_t^2$ instead of growing without bound [^2]. The per-coordinate
      scaling is kept, and the overall rate is then set by $\eta$, which you can schedule
      separately [^2].
    references:
      - source: d2l
        locator: Sec. 12.7.3 The Algorithm (linear growth of $\mathbf{s}_t$, $\mathcal{O}(t^{-1/2})$ learning rate)
        url: https://d2l.ai/chapter_optimization/adagrad.html#the-algorithm
      - source: d2l
        locator: Sec. 12.8 RMSProp (introduction) and Sec. 12.8.1 The Algorithm, Eq. (12.8.1)
        url: https://d2l.ai/chapter_optimization/rmsprop.html#the-algorithm
      - source: d2l
        locator: Sec. 12.7.7 Exercises, Exercise 6
        url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adagrad#ex6
      url: https://d2l.ai/chapter_optimization/adagrad.html#exercises
    status: draft
  - id: optimization-057
    type: short_answer
    difficulty: medium
    tags:
      - rmsprop
      - hyperparameters
      - divergence
    question: |
      An RMSProp implementation uses $s \leftarrow \gamma s + (1 - \gamma)g^2$ and
      $x \leftarrow x - \eta\, g/\sqrt{s + \epsilon}$, with $s$ initialized to 0, $\epsilon = 10^{-6}$
      and $\eta = 0.4$. If you set $\gamma = 1$, what is the effective learning rate that multiplies
      $g$ at every step?
    answer:
      numeric: 400
      tolerance: 0.5
      hint: a number
      model: $s$ stays 0, so the step is $\eta/\sqrt{\epsilon}\cdot g = 0.4/10^{-3}\cdot g = 400\,g$
    explanation: |
      With $\gamma = 1$ the new squared gradient gets weight $1 - \gamma = 0$, so $s$ never leaves its
      initial value 0 [^1]. Every step is then $\eta/\sqrt{\epsilon}\, g = 400\,g$, a huge fixed
      learning rate, and on a problem such as $0.1x_1^2 + 2x_2^2$ the iterates diverge at once. In
      general $\gamma$ sets how long the history of squared gradients is: the average spans about
      $1/(1 - \gamma)$ steps, which is infinite here [^1][^2].
    references:
      - source: d2l
        locator: Sec. 12.8.1 The Algorithm, Eqs. (12.8.1)–(12.8.2)
        url: https://d2l.ai/chapter_optimization/rmsprop.html#the-algorithm
      - source: d2l
        locator: Sec. 12.8.4 Summary ($\gamma$ determines the length of the history)
        url: https://d2l.ai/chapter_optimization/rmsprop.html#summary
      - source: d2l
        locator: Sec. 12.8.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/rmsprop.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/rmsprop#ex1
      url: https://d2l.ai/chapter_optimization/rmsprop.html#exercises
    status: draft
  - id: optimization-058
    type: short_answer
    difficulty: hard
    tags:
      - adadelta
      - learning-rate
      - adaptive-methods
    question: |
      Adadelta updates $\mathbf{s}_t = \rho\mathbf{s}_{t-1} + (1 - \rho)\mathbf{g}_t^2$,
      $\mathbf{g}'_t = \frac{\sqrt{\Delta\mathbf{x}_{t-1} + \epsilon}}{\sqrt{\mathbf{s}_t + \epsilon}} \odot \mathbf{g}_t$,
      $\mathbf{x}_t = \mathbf{x}_{t-1} - \mathbf{g}'_t$ and
      $\Delta\mathbf{x}_t = \rho\Delta\mathbf{x}_{t-1} + (1 - \rho)\mathbf{g}'^2_t$, with
      $\mathbf{s}_0 = \Delta\mathbf{x}_0 = 0$, $\rho = 0.9$ and $\epsilon = 10^{-5}$. For a scalar
      parameter with first gradient $g_1 = 5$, how large is the first step $|g'_1|$?
    answer:
      numeric: 0.01
      tolerance: 0.0002
      hint: a number, 4 decimals
      model: $|g'_1| = \frac{\sqrt{10^{-5}}}{\sqrt{0.1 \cdot 25 + 10^{-5}}} \cdot 5 \approx \frac{0.003162}{1.5811} \cdot 5 \approx 0.0100$
    explanation: |
      With $\Delta x_0 = 0$ the numerator is $\sqrt{\epsilon}$, and for any gradient much larger than
      $\sqrt{\epsilon}$ the first step is about $\sqrt{\epsilon}/\sqrt{1 - \rho} \approx 0.01$,
      whatever $|g_1|$ is [^1]. Adadelta has no learning-rate argument, but $\epsilon$ plays its
      role: it sets the size of the first steps, and later steps grow only as $\Delta\mathbf{x}$
      accumulates [^1][^2]. So it is not really learning-rate free; a problem whose parameters must
      travel far, or one with badly scaled $\epsilon$, can make it very slow at first.
    references:
      - source: d2l
        locator: Sec. 12.9.1 The Algorithm, Eqs. (12.9.1)–(12.9.4)
        url: https://d2l.ai/chapter_optimization/adadelta.html#the-algorithm
      - source: d2l
        locator: Sec. 12.9.3 Summary (no learning-rate parameter; uses the rate of change of the parameters)
        url: https://d2l.ai/chapter_optimization/adadelta.html#summary
      - source: d2l
        locator: Sec. 12.9.4 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/adadelta.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adadelta#ex3
      url: https://d2l.ai/chapter_optimization/adadelta.html#exercises
