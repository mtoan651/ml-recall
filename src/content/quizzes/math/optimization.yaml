  - id: optimization-048
    type: single
    difficulty: medium
    tags:
      - minibatch-sgd
      - gradient-descent
      - data-efficiency
    question: |
      Your training set is silently duplicated: every example now appears twice. The learning rate
      and batch size stay the same. What changes?
    options:
      - text: 'GD: the same steps at twice the cost; SGD: the same updates, but twice as many per epoch'
        correct: true
      - text: GD takes steps twice as large, because every loss term is now counted twice
        why: The objective is the average loss, and averaging over duplicated examples gives the same value and gradient [^1].
      - text: SGD now sees each example twice per update, which halves its gradient noise
        why: Each SGD draw is still one example from the same set of distinct values, so its noise is unchanged.
      - text: Nothing changes for any of the three methods, because the data distribution is still the same
        why: Per-update behaviour is the same, but the cost of a GD step and the number of updates per epoch both double.
    explanation: |
      The objective is the mean of the per-example losses, so duplicating every example leaves it
      and its gradient unchanged [^1]. Gradient descent therefore takes exactly the same steps, but
      each one costs twice as much, which shows why GD is data-inefficient when examples are
      redundant [^2]. SGD and minibatch SGD sample uniformly from what is still the same empirical
      distribution, so each update behaves as before. One pass over the doubled data simply contains
      twice as many updates, about two of the old epochs.
    references:
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates (the objective as an average; $\mathcal{O}(n)$ cost per GD step)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
      - source: d2l
        locator: Sec. 12.5 Minibatch Stochastic Gradient Descent (GD is not data efficient when data are similar)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html
      - source: d2l
        locator: Sec. 12.5.7 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/minibatch-sgd#ex4
      url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
