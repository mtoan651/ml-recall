  - id: optimization-064
    type: short_answer
    difficulty: easy
    tags:
      - derivatives
      - minimization
      - entropy
    question: Where is the minimum of $f(x) = x\log x$ on $x \ge 0$ (with $f(0) = 0$, the limiting value)?
    answer:
      numeric: 0.368
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $f'(x) = \log x + 1 = 0$ gives $x = e^{-1} \approx 0.368$, with $f(e^{-1}) = -e^{-1}$
    explanation: |
      The derivative is $\log x + 1$, which is zero at $x = e^{-1} \approx 0.368$ [^1]. The second
      derivative $1/x$ is positive, so this is a minimum, with value $-e^{-1} \approx -0.368$, below
      the boundary value $f(0) = 0$ [^2]. The same function appears in entropy: the term
      $-p\log p$ is largest at $p = 1/e$.
    references:
      - source: d2l
        locator: Sec. 22.3.2.2 Derivative Rules (product rule) and Sec. 22.3.2.1 Common Derivatives
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#derivative-rules
      - source: d2l
        locator: Sec. 22.3.2.4 Higher Order Derivatives (positive second derivative means a minimum)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#higher-order-derivatives
      - source: d2l
        locator: Sec. 22.3.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#exercises
