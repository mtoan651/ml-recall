  - id: optimization-104
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l03
      - backpropagation
      - gradient-descent
    question: |
      Continue with the pass/fail network $z^1 = W^1 x + b^1$, $a^1 = \mathrm{ReLU}(z^1)$,
      $\hat y = \sigma(W^2 a^1 + b^2)$, where

      $$W^1 = \begin{bmatrix} 0.5 & -1 \\ 1 & 0.5 \end{bmatrix},\quad b^1 = \begin{bmatrix} -1 \\ -1 \end{bmatrix},\quad W^2 = \begin{bmatrix} 1 & 2 \end{bmatrix},\quad b^2 = -1,$$

      $x = (2, 1)^\top$, $y = 1$, binary cross-entropy loss, so $z^1 = (-1, 1.5)$ and
      $\hat y = \sigma(2) \approx 0.8808$. After one gradient-descent step with $\eta = 0.5$, what is
      the new value of $W^1_{21}$ (row 2, column 1: the weight from input $x_1$ to hidden unit 2)?
      Give 4 decimals.
    answer:
      numeric: 1.2384
      tolerance: 0.0003
      hint: 4 decimals
      model: $\delta^2 = \hat y - y \approx -0.1192$; $\partial L/\partial a^1 = (W^2)^\top\delta^2 = (-0.1192, -0.2384)$; $\delta^1 = (0, -0.2384)$; $\partial L/\partial W^1_{21} = \delta^1_2 x_1 = -0.4768$; $W^1_{21} = 1 + 0.5 \cdot 0.4768 \approx 1.2384$.
    explanation: |
      For a sigmoid output with binary cross-entropy the logit gradient is $\hat y - y \approx
      -0.1192$, the two-class case of the softmax result [^1][^3]. It flows back through $W^2$ to
      the hidden activations as $(1, 2) \times (-0.1192)$, and the ReLU derivatives $(0, 1)$ block
      the inactive first unit, so $\delta^1 = (0, -0.2384)$ [^2]. The weight gradient is $\partial L/\partial W^1 = \delta^1 x^\top$,
      whose entry $(2, 1)$ is $-0.2384 \cdot 2 = -0.4768$. The update
      $W^1_{21} \leftarrow 1 - 0.5(-0.4768) \approx 1.2384$ raises the weight, increasing unit 2's
      output and hence $\hat y$. The first row of $W^1$ gets zero gradient and stays unchanged.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 22–26
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
        locator: Sec. 5.3.3 Backpropagation; Sec. 5.3.4 Training Neural Networks
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        locator: Sec. 4.1.2.2 Softmax and Cross-Entropy Loss, Eq. (4.1.10)
