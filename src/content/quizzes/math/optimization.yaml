  - id: optimization-046
    type: single
    difficulty: medium
    tags:
      - local-minima
      - nonconvex
    question: How many local minima does $f(x) = x^2(1 + \sin x)$ have on $\mathbb{R}$?
    options:
      - text: 'Infinitely many, all with $f = 0$: at $x = 0$ and wherever $\sin x = -1$'
        correct: true
      - text: Exactly one, at $x = 0$, because $x^2$ dominates for large $|x|$
        why: The factor $1 + \sin x$ returns to 0 at every $x = \frac{3\pi}{2} + 2\pi k$, however large $x^2$ is.
      - text: Infinitely many, with values growing like $x^2$, so only $x = 0$ is global
        why: At each of those minima $1 + \sin x = 0$, so $f = 0$ there too; they are all global minima.
      - text: Only $x = 0$, because $f$ is convex as a product of nonnegative factors
        why: A product of nonnegative functions need not be convex; $f$ dips back to 0 periodically [^1].
    explanation: |
      Both factors are nonnegative, so $f \ge 0$, and $f = 0$ exactly at $x = 0$ and at
      $x = \frac{3\pi}{2} + 2\pi k$ for every integer $k$. Each zero is a local, and in fact global,
      minimum; between two zeros $f$ rises to a single maximum. Nonconvex functions can have
      arbitrarily many local minima [^1]. If the minima had different values, an optimizer would
      have to visit them all to be sure of the global one; that is why no optimality guarantees exist
      for general nonconvex problems [^2].
    references:
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.4.5 Summary (the number of local minima to check may be exponential)
        url: https://d2l.ai/chapter_optimization/sgd.html#summary
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex5
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: draft
  - id: optimization-047
    type: short_answer
    difficulty: easy
    tags:
      - minibatch-sgd
      - batch-size
      - gradient-variance
    question: |
      Per-example gradients are i.i.d. If you increase the minibatch size from 16 to 256, by what
      factor does the standard deviation of the minibatch gradient shrink?
    answer:
      numeric: 4
      tolerance: 0
      hint: a number
      model: $\sqrt{256 / 16} = \sqrt{16} = 4$
    explanation: |
      Averaging $b$ independent gradients keeps the expectation and divides the standard deviation by
      $\sqrt{b}$ [^1]. Going from 16 to 256 multiplies $b$ by 16 and so divides the standard
      deviation by 4, while the compute per step grows 16-fold. Past some point the extra noise
      reduction is small compared with the linear increase in cost, so batches are chosen to be
      efficient on the hardware and to fit in GPU memory [^1].
    references:
      - source: d2l
        locator: Sec. 12.5.2 Minibatches (standard deviation reduced by $b^{-1/2}$)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
      - source: d2l
        locator: Sec. 12.5.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/minibatch-sgd#ex1
      url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
