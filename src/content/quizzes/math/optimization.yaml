  - id: optimization-113
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l03
      - convergence
      - gradient-descent
    question: |
      Gradient descent minimizes $L(\theta) = \theta^2$ from $\theta_0 = 1$ with $\eta = 0.25$ and stops as
      soon as one update changes $\theta$ by less than 0.01 in absolute value. How many updates does it
      make, counting the one that triggers the stop?
    answer:
      numeric: 7
      tolerance: 0
      hint: an integer
      model: Each update is $\theta \leftarrow \theta - 0.25 \cdot 2\theta = 0.5\,\theta$, so update $k$ changes $\theta$ by $0.5^k$; $0.5^7 \approx 0.0078$ is the first below 0.01.
    explanation: |
      With $L'(\theta) = 2\theta$, each update multiplies $\theta$ by $1 - 2\eta = 0.5$, so the changes are
      $0.5, 0.25, 0.125, \ldots$ and the $k$-th one equals $0.5^k$ [^2]. It first falls below 0.01 at
      $k = 7$. Near a minimum the gradient, and with it each update, shrinks — which is why "update below a
      tolerance, or an iteration limit" is a common stopping rule [^1].
    references:
      - source: ncu-intro-dl
        locator: Exercise 2, question 12; Lecture 3, slides 12, 15
      - source: d2l
        locator: Sec. 12.3.1 One-Dimensional Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html#one-dimensional-gradient-descent
    source:
      id: ncu-intro-dl
      ref: exercise-02/q12-v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-114
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - ce6146-l03
      - critical-point
    question: Where are the critical points of $L(w) = w^3 - 3w$?
    options:
      - text: $w = -1$ and $w = 1$
        correct: true
      - text: $w = 0$ only
        why: $L'(0) = -3 \neq 0$.
      - text: $w = -\sqrt{3}$, $w = 0$ and $w = \sqrt{3}$
        why: Those are the zeros of $L$ itself, not of its derivative.
      - text: $w = 1$ only
        why: $L'(-1) = 0$ as well; critical points include local maxima.
    explanation: |
      Critical points are where the gradient vanishes: $L'(w) = 3w^2 - 3 = 0$ gives $w = \pm 1$ [^1][^2].
      $w = 1$ is a local minimum and $w = -1$ a local maximum, so a zero gradient alone does not tell which
      kind of point has been reached.
    references:
      - source: ncu-intro-dl
        locator: Exercise 2, question 17; Lecture 3, slide 14
      - source: d2l
        locator: Sec. 12.1.2 Optimization Challenges in Deep Learning
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#optimization-challenges-in-deep-learning
    source:
      id: ncu-intro-dl
      ref: exercise-02/q17-v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-115
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - ce6146-l03
      - gradient-descent
      - gradient-ascent
    question: |
      Optimization can maximize an objective as well as minimize a loss. To maximize a differentiable
      objective $J(\theta)$, such as an average reward, with gradient steps, how must the parameters move?
    options:
      - text: Along $+\nabla_\theta J$, which is the same as minimizing $-J$
        correct: true
      - text: Along $-\nabla_\theta J$, exactly as for a loss
        why: Stepping against the gradient decreases $J$, the opposite of the goal.
      - text: Along $+\nabla_\theta J$ for weights and $-\nabla_\theta J$ for biases
        why: The sign is set by whether the objective is maximized or minimized, not by the kind of parameter.
      - text: Nowhere; gradients only work for minimizing, so a gradient-free search is needed
        why: Flipping the sign of the objective turns maximization into minimization, so gradient methods apply unchanged.
    explanation: |
      Optimization adjusts the parameters $\theta = \{W, b\}$ to make an objective as good as possible —
      usually to minimize a loss [^1]. Most algorithms are written for minimization, and an objective to
      be maximized is handled by flipping its sign [^2]: minimizing $-J$ with
      $\theta \leftarrow \theta - \eta\nabla_\theta(-J) = \theta + \eta\nabla_\theta J$ is gradient ascent,
      a step along the direction of steepest increase of $J$ [^1].
    references:
      - source: ncu-intro-dl
        locator: Exercise 3, question 14; Lecture 3, slides 6, 8, 12
      - source: d2l
        locator: Sec. 12.1 Optimization and Deep Learning (introduction, maximizing by flipping the sign)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#optimization-and-deep-learning
    source:
      id: ncu-intro-dl
      ref: exercise-03/q14-v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-116
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - squared-loss
    question: |
      True or false: training a regression model with the loss $(\hat y - y)^2$ instead of
      $\tfrac12(\hat y - y)^2$ changes which parameter values minimize the training loss.
    options:
      - text: 'True'
        why: Scaling a loss by a positive constant leaves its minimizer where it was; only the gradient is scaled.
      - text: 'False'
        correct: true
    explanation: |
      Multiplying a loss by a positive constant does not move its minimum; it only scales the
      gradient, here by 2, which acts like doubling the learning rate [^1][^2]. The factor
      $\tfrac12$ is a convenience: it cancels the 2 that comes from differentiating the square, so
      $\partial L/\partial \hat y = \hat y - y$ [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 48
      - source: d2l
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function
        locator: Sec. 3.1.1.2 Loss Function
    source:
      id: ncu-intro-dl
      ref: lecture-01/q59
    status: reviewed
    reviewed_by: claude
  - id: optimization-117
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - derivatives
      - linear-approximation
    question: |
      A model $\hat y = wx + b$ with fixed $b = 1$ is fitted to one example $x = 3$, $y = 10$ using
      $L(w) = \tfrac12(\hat y - y)^2$. At $w = 2$, $dL/dw =$ {{1}}. Using the tangent line,
      increasing $w$ by $0.02$ changes the loss by about {{2}}.
    answer:
      blanks:
        - numeric: -9
          tolerance: 0.001
          hint: a number
        - numeric: -0.18
          tolerance: 0.001
          hint: a number (negative for a decrease)
      model: '$\hat y = 7$, $dL/dw = (\hat y - y)\,x = (-3)(3) = -9$; change $\approx -9 \cdot 0.02 = -0.18$ (exact: $-0.1782$).'
    explanation: |
      The derivative measures how fast the loss changes locally: near $w$, $L(w + \Delta w) \approx L(w) +
      L'(w)\,\Delta w$ [^1][^2]. By the chain rule $dL/dw = (\hat y - y)\,x = (7 - 10) \cdot 3 = -9$,
      so a small increase of 0.02 lowers the loss by about 0.18. The exact change,
      $L(2.02) - L(2) = 4.3218 - 4.5 = -0.1782$, is close; the tangent's prediction gets worse for
      larger steps [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 48–49
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#linear-approximation
        locator: Sec. 22.3.1 Differential Calculus; Sec. 22.3.2.3 Linear Approximation
    source:
      id: ncu-intro-dl
      ref: lecture-01/q60
    status: reviewed
    reviewed_by: claude
  - id: optimization-118
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - partial-derivatives
      - gradient
    question: |
      At the current parameters of a model, the loss has the partial derivatives
      $\partial L/\partial w = -6$ and $\partial L/\partial b = 2$. Which statement is correct?
    options:
      - text: Increasing $w$ slightly while keeping $b$ fixed lowers the loss
        correct: true
      - text: Increasing $b$ slightly while keeping $w$ fixed lowers the loss
        why: $\partial L/\partial b = 2 > 0$, so a small increase of $b$ raises the loss by about $2\,\Delta b$; $b$ should be decreased.
      - text: One gradient-descent step changes $b$ more than $w$
        why: The step is $-\eta \nabla L = (6\eta, -2\eta)$, so $w$ moves three times as far as $b$.
      - text: The parameters are at a minimum, since one partial derivative is negative and the other positive
        why: At a minimum of a differentiable loss every partial derivative is 0; nonzero partials mean the loss can still be lowered.
    explanation: |
      A partial derivative is the rate of change of the loss when one parameter moves and the others
      are held fixed [^1][^2]. Since $\partial L/\partial w = -6$, a small increase $\Delta w$ changes
      the loss by about $-6\,\Delta w$, a decrease; since $\partial L/\partial b = 2$, $b$ must go
      down instead. The gradient $(-6, 2)$ collects both partials, and gradient descent moves
      against it, by $-\eta \nabla L = (6\eta, -2\eta)$ [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 50
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/calculus.html#partial-derivatives-and-gradients
        locator: Sec. 2.4.3 Partial Derivatives and Gradients
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
        locator: Sec. 12.3.2 Multivariate Gradient Descent
    source:
      id: ncu-intro-dl
      ref: lecture-01/q61
    status: reviewed
    reviewed_by: claude
  - id: optimization-119
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - gradient
      - taylor-approximation
    question: |
      At the current parameters $\theta$ the loss is $L(\theta) = 2.0$ and its gradient is
      $\nabla_\theta L = (3, -1, 0.5)$. Using the first-order approximation, what is
      $L(\theta + \Delta\theta)$ for the small change $\Delta\theta = (-0.1, 0.2, 0.4)$?
    options:
      - text: About 1.7
        correct: true
      - text: About 2.3
        why: This subtracts the inner product instead of adding it; the change itself is already $-0.3$.
      - text: About 2.7
        why: This adds the magnitudes $0.3 + 0.2 + 0.2$ and ignores the signs of the products.
      - text: About −0.3
        why: $-0.3$ is the predicted change $\nabla_\theta L \cdot \Delta\theta$, not the new loss.
    explanation: |
      Near a differentiable point, $L(\theta + \Delta\theta) \approx L(\theta) + \nabla_\theta L \cdot \Delta\theta$
      [^1][^2]. The inner product is $3(-0.1) + (-1)(0.2) + 0.5(0.4) = -0.3 - 0.2 + 0.2 = -0.3$, so
      $L \approx 1.7$. Each partial derivative measures how fast the loss changes along one parameter
      with the others held fixed — exactly the numbers backpropagation computes.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 70
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#higher-dimensional-differentiation
        locator: Sec. 22.4.1 Higher-Dimensional Differentiation
    source:
      id: ncu-intro-dl
      ref: lecture-02/q79
    status: reviewed
    reviewed_by: claude
  - id: optimization-120
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - hessian
    question: |
      For $L(\theta_1, \theta_2) = \theta_1^2\theta_2 + \theta_2^3$, what is the Hessian–vector
      product $Hv$ at $\theta = (1, 2)$ for $v = (1, -1)$?
    options:
      - text: $(2, -10)$
        correct: true
      - text: $(4, 2)$
        why: This is only the first column of $H$, i.e. $Hv$ for $v = (1, 0)$.
      - text: $(6, 14)$
        why: This is $Hv$ for $v = (1, 1)$; the second component of $v$ is $-1$.
      - text: $(4, -13)$
        why: This multiplies the gradient $(4, 13)$ entrywise by $v$; $Hv$ uses second derivatives.
    explanation: |
      The Hessian holds the second partial derivatives,
      $H = \begin{bmatrix} 2\theta_2 & 2\theta_1 \\ 2\theta_1 & 6\theta_2 \end{bmatrix}$, which is
      $\begin{bmatrix} 4 & 2 \\ 2 & 12 \end{bmatrix}$ at $(1, 2)$ [^1][^2]. Then
      $Hv = (4 - 2,\; 2 - 12) = (2, -10)$. Automatic differentiation can produce $Hv$ by differentiating
      the gradient computation, without building and storing all $P^2$ Hessian entries [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 90
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#hessians
        locator: Sec. 22.4.6 Hessians
      - title: torch.autograd.functional.hvp (PyTorch documentation)
        url: https://docs.pytorch.org/docs/2.14/generated/torch.autograd.functional.hvp.html
        locator: Function description
    source:
      id: ncu-intro-dl
      ref: lecture-02/q96
    status: reviewed
    reviewed_by: claude
  - id: optimization-121
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - gradient-descent
      - gradient
    question: |
      The loss of a tiny model with parameters $w$ and $b$ is $L(w, b) = (w + 2b - 3)^2$. Starting
      from $(w, b) = (1, 0)$, where are the parameters after one gradient-descent step with learning
      rate $\eta = 0.05$?
    options:
      - text: $(1.2,\ 0.4)$
        correct: true
      - text: $(0.8,\ -0.4)$
        why: This adds $\eta\nabla L$. The gradient points uphill, so gradient descent subtracts it.
      - text: $(1.2,\ 0.2)$
        why: By the chain rule $\partial L/\partial b = 2(w + 2b - 3) \cdot 2 = -8$; the inner factor 2 was dropped.
      - text: $(5,\ 8)$
        why: This subtracts the full gradient $(-4, -8)$ without scaling it by $\eta = 0.05$.
    explanation: |
      The gradient collects the partial derivatives of the loss with respect to every parameter:
      at $(1, 0)$, $\partial L/\partial w = 2(w + 2b - 3) = -4$ and
      $\partial L/\partial b = 2(w + 2b - 3) \cdot 2 = -8$ [^1]. It points toward the steepest
      increase of the loss, so gradient descent moves against it [^2]:
      $(1, 0) - 0.05\,(-4, -8) = (1.2, 0.4)$. Both parameters grow because both partial derivatives
      are negative, and the loss falls from 4 to $(1.2 + 0.8 - 3)^2 = 1$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 8, 12
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
        locator: Sec. 12.3.2 Multivariate Gradient Descent, eqs. (12.3.5)–(12.3.7)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q27
    status: reviewed
    reviewed_by: claude
  - id: optimization-122
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - optimization-methods
    question: |
      Which of these methods minimizes an objective without using its gradient, and is therefore not
      a variant of gradient descent?
    options:
      - text: Bayesian optimization
        correct: true
      - text: Adam
        why: Adam steps along a running average of gradients, rescaled by a running average of squared gradients.
      - text: RMSProp
        why: RMSProp divides each gradient by the root of a running average of past squared gradients.
      - text: Nesterov accelerated gradient
        why: NAG evaluates the gradient at a look-ahead point and uses it in a momentum update.
    explanation: |
      Optimization is the general task of minimizing an objective, and gradient descent is only one
      family of algorithms for it; momentum, Nesterov, AdaGrad, RMSProp and Adam are all built on
      gradient-descent steps [^1]. Bayesian optimization instead fits a probabilistic model (often a
      Gaussian process) to the objective values observed so far and uses it to choose the next point
      to evaluate. It suits expensive black-box objectives whose derivatives are unavailable, such as
      a model's validation score as a function of its hyperparameters [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 10
      - title: 'Wikipedia: Bayesian optimization'
        url: https://en.wikipedia.org/wiki/Bayesian_optimization
        locator: Introduction
    source:
      id: ncu-intro-dl
      ref: lecture-03/q29
    status: reviewed
    reviewed_by: claude
  - id: optimization-123
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - newtons-method
      - hessian
    question: |
      Newton's method uses second derivatives and often needs far fewer steps than gradient descent.
      Why do deep-learning optimizers still rely on first-order gradient steps?
    options:
      - text: The Hessian has $d^2$ entries for $d$ parameters, too many to compute, store and invert for millions of them
        correct: true
      - text: Gradient descent always reaches the global minimum of a network's loss, while Newton's method may stop at a local one
        why: Neither method has such a guarantee on the non-convex loss of a deep network.
      - text: Newton's method ignores the gradient entirely, so backpropagation would be of no use to it
        why: The Newton step $-H^{-1}\nabla L$ needs the gradient as well as the Hessian.
      - text: Second-order methods cannot be written as tensor operations, so they cannot run on GPUs
        why: Hessian products are ordinary linear algebra; the obstacle is their size, not the hardware.
    explanation: |
      Newton's method steps by $-H^{-1}\nabla L$, where the Hessian $H$ of $d$ parameters is a
      $d \times d$ matrix; for deep networks storing its $\mathcal{O}(d^2)$ entries alone is
      prohibitive, and computing and inverting it costs even more [^2]. The gradient has only $d$
      entries, backpropagation computes all of them in one backward pass [^3], and the update maps
      directly onto GPU tensor operations and mini-batches. This balance of cost, stability and
      scalability is why gradient descent and its variants dominate deep learning [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 10–11
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#newtons-method
        locator: Sec. 12.3.3.1 Newton's Method
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
        locator: Sec. 5.3.3 Backpropagation
    source:
      id: ncu-intro-dl
      ref: lecture-03/q30
    status: reviewed
    reviewed_by: claude
  - id: optimization-124
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - saddle-point
      - hessian
    question: |
      A saddle point is called *strict* when the Hessian there has at least one negative eigenvalue
      (a direction of clear downward curvature), and *non-strict* otherwise. What is the origin for
      $f(x, y) = x^2 - y^4$?
    options:
      - text: 'A non-strict saddle: no Hessian eigenvalue is negative, yet $f$ falls along $y$'
        correct: true
      - text: A local minimum, because the gradient vanishes and no eigenvalue of the Hessian is negative
        why: A Hessian without negative eigenvalues is not enough here, since $f(0, y) = -y^4 < 0$ for every $y \neq 0$.
      - text: A strict saddle, because $f$ takes negative values all along the $y$-axis
        why: Strictness is about curvature. Along $y$ the second derivative at 0 is 0, not negative; the drop only appears at fourth order.
      - text: Not a critical point at all, because the Hessian is singular there
        why: Critical points are defined by a zero gradient, and $\nabla f(0, 0) = (0, 0)$; a singular Hessian only makes the point degenerate.
    explanation: |
      The gradient $(2x, -4y^3)$ vanishes at the origin and the Hessian there is
      $\mathrm{diag}(2, 0)$. At a zero-gradient point, all-positive Hessian eigenvalues mean a
      minimum and mixed signs a saddle [^2]; here one eigenvalue is 0, so the test is inconclusive.
      Along $y$ the function equals $-y^4$, so the origin is a saddle rather than a minimum, and with
      no negative eigenvalue it is a non-strict (degenerate) one, like the origin of $x^4 - y^4$
      [^3]. Near it the gradient along $y$ is $-4y^3$, tiny for small $y$, so gradient descent
      drifts away only very slowly, whereas at a strict saddle such as $x^2 - y^2$ the downward
      curvature lets small perturbations, such as mini-batch noise, grow quickly [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 14
      - source: d2l
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
        locator: Sec. 12.1.2.2 Saddle Points
      - title: 'Wikipedia: Saddle point'
        url: https://en.wikipedia.org/wiki/Saddle_point
        locator: Mathematical discussion
    source:
      id: ncu-intro-dl
      ref: lecture-03/q31
    status: reviewed
    reviewed_by: claude
  - id: optimization-125
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - saddle-point
      - plateau
    question: |
      For many epochs the training loss stays almost constant while the gradient norm is tiny; then,
      with the same learning rate, the loss suddenly starts falling again. What is the most likely
      explanation?
    options:
      - text: The parameters crossed a nearly flat region, such as a plateau around a saddle point
        correct: true
      - text: The learning rate was too large, so every update overshot the minimum
        why: Overshooting makes the loss oscillate or grow and comes with large gradients, not a flat curve with tiny ones.
      - text: The network had reached the global minimum, from which the loss can only rise
        why: The loss fell further afterwards, so the flat stretch was not a minimum at all.
      - text: The model started to overfit the training data during the long flat stretch of the curve
        why: Overfitting shows up as a widening gap between training and validation loss; it does not stall the training loss.
    explanation: |
      Gradient steps are proportional to the gradient, so wherever the loss surface is nearly flat —
      on a plateau or near a saddle point — progress slows to a crawl even though the point is not a
      minimum [^1][^2]. In high-dimensional networks such saddle points, surrounded by high-error
      plateaus, are common and can look like local minima until the iterates find a way down [^3].
      Mini-batch noise and momentum help to leave these regions faster.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 14, 52
      - source: d2l
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
        locator: Sec. 12.1.2.2 Saddle Points
      - title: Dauphin et al. (2014), Identifying and attacking the saddle point problem in high-dimensional non-convex optimization, arXiv:1406.2572
        url: https://arxiv.org/abs/1406.2572
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-03/q32
    status: reviewed
    reviewed_by: claude
  - id: optimization-126
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - learning-rate
      - divergence
    question: |
      Gradient descent minimizes $L(\theta) = 2\theta^2$ from $\theta_0 = 1$ with learning rate
      $\eta = 0.6$. What is $\theta_3$, the value after three steps?
    options:
      - text: $-2.744$
        correct: true
      - text: $2.744$
        why: Each step multiplies $\theta$ by the negative factor $-1.4$, so the sign flips every step and is negative after an odd number of steps.
      - text: $-1.4$
        why: That is $\theta_1$; two more steps multiply it by $-1.4$ again.
      - text: $-0.008$
        why: This uses the derivative $2\theta$, but the derivative of $2\theta^2$ is $4\theta$.
    explanation: |
      With $L'(\theta) = 4\theta$, each update is $\theta \leftarrow \theta - 0.6 \cdot 4\theta =
      -1.4\,\theta$, so $\theta_3 = (-1.4)^3 = -2.744$ [^1]. Because $|1 - 4\eta| > 1$, every step
      jumps past the minimum at 0 and lands farther away on the other side: the iterates oscillate
      with growing amplitude and diverge, the typical sign of a learning rate that is too large
      [^2][^3]. Here convergence requires $|1 - 4\eta| < 1$, that is $0 < \eta < 0.5$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 15
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters
        locator: Linear regression — Hyperparameters, sec. Learning rate
    source:
      id: ncu-intro-dl
      ref: lecture-03/q33
    status: reviewed
    reviewed_by: claude
  - id: optimization-127
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - learning-rate
    question: |
      A model's training loss decreases smoothly, without any oscillation, but only by about 0.004
      per epoch, and after many epochs it is still far above the values that similar models reach.
      What is the most likely fix?
    options:
      - text: Increase the learning rate
        correct: true
      - text: Decrease the learning rate
        why: Smaller steps would make the progress even slower; lowering the learning rate helps when the loss oscillates or diverges.
      - text: Add dropout to reduce overfitting
        why: The problem is a slow fit to the training data itself, not a gap to the validation performance.
      - text: Stop training, since the model has converged
        why: A loss that keeps falling steadily and is still far from good values has not converged.
    explanation: |
      A learning rate that is too small produces exactly this picture: every step points in a good
      direction but is tiny, so a very large number of iterations is needed [^1][^2]. A rate that is
      too large shows the opposite symptoms, a loss that bounces around or grows [^3]. A good
      learning rate balances speed and stability and is found by tuning or delegated to adaptive
      methods [^1].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 15
      - source: d2l
        url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
        locator: Sec. 12.3.1.1 Learning Rate
      - source: google-mlcc
        url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters
        locator: Linear regression — Hyperparameters, sec. Learning rate
