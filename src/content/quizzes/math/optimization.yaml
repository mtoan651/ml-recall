  - id: optimization-007
    type: single
    difficulty: medium
    question: The shortest distance from the curve $xy = 8$ to the origin is
    options:
      - text: '4'
        correct: true
      - text: '8'
      - text: '16'
      - text: $2\sqrt{2}$
    explanation: |
      Minimize the squared distance $f = x^2 + y^2$ on the curve $g = xy = 8$. The method of Lagrange multipliers solves $\nabla f = \lambda \nabla g$ together with the constraint and then compares $f$ at the solutions [^1]. Here that means $2x = \lambda y$, $2y = \lambda x$ and $xy = 8$. Dividing the first two equations gives $x^2 = y^2$, and with $xy = 8 > 0$ this forces $x = y = \pm 2\sqrt2$. There $f = 16$, so the shortest distance is $\sqrt{16} = 4$. The traps are 16 (the squared distance) and $2\sqrt2$ (one coordinate of the nearest point).
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-mv_deriv-lagrange.html#keyidea-Lagrange-multipliers
        locator: Sec. 11.11, Key Idea 11.11.4 Method of Lagrange Multipliers
    source:
      id: mmlu-redux
      ref: college_mathematics/14
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=14
    status: draft
  - id: optimization-008
    type: single
    difficulty: medium
    question: A total of $x$ feet of fencing is to form three sides of a level rectangular yard. What is the maximum possible area of the yard, in terms of $x$?
    options:
      - text: $x^2/9$
        why: Three equal sides of $x/3$ give area $x^2/9$, less than the $x^2/8$ reached at $w = x/4$, so equal sides are not optimal.
      - text: $x^2/8$
        correct: true
      - text: $x^2/4$
      - text: $x^2$
    explanation: |
      Use the standard applied-optimization recipe: write down the quantity to optimize, use the constraint to reduce it to one variable, then find its critical numbers [^1]. Let $w$ be each of the two sides perpendicular to the open side and $\ell$ the side parallel to it. The fencing gives $2w + \ell = x$, so the area is $A(w) = w(x - 2w)$ on $0 < w < x/2$. $A'(w) = x - 4w$ is zero at $w = x/4$, and $A''(w) = -4 < 0$ makes this a maximum [^2]. Then $\ell = x/2$ and $A = x^2/8$. Making all three fenced sides equal looks natural but gives only $x^2/9$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-6-applied-opt.html#sec-3-6-applied-opt-4-3
        locator: Sec. 3.6 Applied optimization, Note 3.6.1
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-3-tests.html#Second-D-Test
        locator: Sec. 3.3.3, Second Derivative Test
    source:
      id: mmlu-redux
      ref: college_mathematics/20
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=20
    status: draft
  - id: optimization-009
    type: single
    difficulty: hard
    question: What is the minimum value of the expression $x + 4z$ as a function defined on $\mathbb{R}^3$, subject to the constraint $x^2 + y^2 + z^2 \le 2$?
    options:
      - text: '0'
      - text: '-2'
      - text: $-\sqrt{34}$
        correct: true
      - text: $-\sqrt{35}$
    explanation: |
      Write $x + 4z = \mathbf a \cdot \mathbf v$ with $\mathbf a = (1,0,4)$ and $\mathbf v = (x,y,z)$. Since $\mathbf a \cdot \mathbf v = \|\mathbf a\|\|\mathbf v\|\cos\theta$ [^1], the expression is smallest when $\mathbf v$ points opposite to $\mathbf a$ and is as long as allowed, $\|\mathbf v\| = \sqrt2$. That gives
      $$\min = -\|\mathbf a\|\sqrt2 = -\sqrt{17}\cdot\sqrt2 = -\sqrt{34},$$
      reached at $\mathbf v = -\sqrt2\,\mathbf a/\sqrt{17}$. The answer $-\sqrt{35}$ is a slip in $17 \cdot 2$. The value $-2$ ignores the coefficient 4.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#dot-products-and-angles
        locator: Sec. 22.1.2 Dot Products and Angles, Eq. (22.1.6)
    source:
      id: mmlu-redux
      ref: college_mathematics/70
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=70
    status: draft
  - id: optimization-010
    type: single
    difficulty: easy
    question: Which of the following is an equation of the line tangent to the graph of $y = x + e^x$ at $x = 0$?
    options:
      - text: $y = 2x + 1$
        correct: true
      - text: $y = 2x$
      - text: $y = x + 2$
      - text: $y = x + 1$
    explanation: |
      The tangent line at $x = a$ is $y = f(a) + f'(a)(x - a)$: it goes through the point on the graph with slope $f'(a)$ [^1]. Since $\frac{d}{dx}e^x = e^x$ [^2], $f'(x) = 1 + e^x$ and $f'(0) = 2$, while $f(0) = 0 + e^0 = 1$. So the tangent line is $y = 1 + 2x$. $y = 2x$ has the right slope but misses $(0,1)$, and $y = x + 1$ leaves the $e^x$ term out of the slope.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-1-8-tan-line-approx.html#sec-1-8-tan-line-approx-4
        locator: Sec. 1.8.2 The tangent line
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#common-derivatives
        locator: Sec. 22.3.2.1 Common Derivatives
    source:
      id: mmlu-redux
      ref: college_mathematics/78
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=78
    status: draft
  - id: optimization-011
    type: single
    difficulty: hard
    question: Let $f(x,y) = x^2 - 2xy + y^3$ for all real $x$ and $y$. Which of the following is true?
    options:
      - text: $f$ has all of its relative extrema on the line $x = y$.
        correct: true
      - text: $f$ has all of its relative extrema on the parabola $x = y^2$.
      - text: $f$ has a relative minimum at $(0, 0)$.
      - text: $f$ has an absolute minimum at $(2/3, 2/3)$.
    explanation: |
      Extreme values can only occur at critical points, where both first partial derivatives vanish [^1]. $f_x = 2x - 2y = 0$ gives $x = y$, and then $f_y = -2x + 3y^2 = 0$ gives $y = 0$ or $y = \tfrac23$. So both critical points, $(0,0)$ and $(\tfrac23,\tfrac23)$, lie on the line $x = y$. The second partial derivatives test uses $D = f_{xx}f_{yy} - f_{xy}^2 = 12y - 4$ [^1]. At $(0,0)$, $D = -4 < 0$, a saddle and not a relative minimum. At $(\tfrac23,\tfrac23)$, $D = 4 > 0$ with $f_{xx} = 2 > 0$, a local minimum; it is not absolute, since $f(0,y) = y^3 \to -\infty$, and the parabola $x = y^2$ does not pass through it.
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-mv_deriv-optimization.html#Second-derivative-test
        locator: Sec. 11.10.2 Extrema and Critical Points; Sec. 11.10.3, The Second Partial Derivatives Test
    source:
      id: mmlu-redux
      ref: college_mathematics/81
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=81
    status: draft
  - id: optimization-012
    type: single
    difficulty: medium
    question: If $c > 0$ and $f(x) = e^x - cx$ for all real numbers $x$, then the minimum value of $f$ is
    options:
      - text: $f(c)$
      - text: $f(e^c)$
      - text: $f(1/c)$
      - text: $f(\log c)$
        correct: true
    explanation: |
      Since $\frac{d}{dx}e^x = e^x$ [^1], $f'(x) = e^x - c$, which is zero exactly at $x = \log c$ (the natural log, defined because $c > 0$). There $f''(\log c) = c > 0$, so the critical point is a local minimum [^2]. In fact $f''(x) = e^x > 0$ everywhere, so $f$ is convex, and a local minimum of a convex function is also the global minimum [^3]. The minimum value is $f(\log c) = c - c\log c$. At $c$, $e^c$ and $1/c$ the derivative is generally not zero, so those values are not minima.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#common-derivatives
        locator: Sec. 22.3.2.1 Common Derivatives
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-3-tests.html#Second-D-Test
        locator: Sec. 3.3.3, Second Derivative Test
      - source: d2l
        url: https://d2l.ai/chapter_optimization/convexity.html#local-minima-are-global-minima
        locator: Sec. 12.2.2.1 Local Minima Are Global Minima; Sec. 12.2.2.3 Convexity and Second Derivatives
    source:
      id: mmlu-redux
      ref: college_mathematics/82
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=82
    status: draft
  - id: optimization-013
    type: single
    difficulty: hard
    question: Let $f(x, y) = x^3 + y^3 + 3xy$ for all real $x$ and $y$. Then there exist distinct points $P$ and $Q$ such that $f$ has a
    options:
      - text: local maximum at $P$ and at $Q$
      - text: saddle point at $P$ and at $Q$
      - text: local maximum at $P$ and a saddle point at $Q$
        correct: true
      - text: local minimum at $P$ and a saddle point at $Q$
    explanation: |
      Start with the critical points, where $f_x = 3x^2 + 3y$ and $f_y = 3y^2 + 3x$ both vanish [^1]. That gives $y = -x^2$ and $x = -y^2 = -x^4$, so $x(1 + x^3) = 0$, and the points are $(0,0)$ and $(-1,-1)$. Classify them with the discriminant $D = f_{xx}f_{yy} - f_{xy}^2 = 36xy - 9$ [^1]. At $(0,0)$, $D = -9 < 0$: a saddle point. At $(-1,-1)$, $D = 27 > 0$ and $f_{xx} = -6 < 0$: a local maximum. So $f$ has exactly one local maximum and one saddle, and no local minimum.
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-mv_deriv-optimization.html#Second-derivative-test
        locator: Sec. 11.10.2 Extrema and Critical Points; Sec. 11.10.3, The Second Partial Derivatives Test
    source:
      id: mmlu-redux
      ref: college_mathematics/87
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=87
    status: draft
  - id: optimization-014
    type: single
    difficulty: easy
    question: Let $k$ be the number of real solutions of the equation $e^x + x - 2 = 0$ in the interval $[0, 1]$, and let $n$ be the number of real solutions that are not in $[0, 1]$. Which of the following is true?
    options:
      - text: $k = 0$ and $n = 1$
      - text: $k = 1$ and $n = 0$
        correct: true
      - text: $k = n = 1$
      - text: $k > 1$
    explanation: Let $f(x) = e^x + x - 2$. Since $f$ is continuous with $f(0) = -1 < 0$ and $f(1) = e - 1 > 0$, the intermediate value theorem gives a root in $[0, 1]$ [^1]. Since $f'(x) = e^x + 1 > 0$ everywhere, $f$ is strictly increasing [^2], so it crosses zero only once on the whole real line. Hence $k = 1$ and $n = 0$; the root is near $x \approx 0.44$.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_1_6.html
        locator: Sec. 1.6 Continuity, Theorem 1.6.12 Intermediate value theorem
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_mvt.html
        locator: Sec. 2.13 The Mean Value Theorem, Corollary 2.13.12
    source:
      id: mmlu-redux
      ref: college_mathematics/3
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=3
    status: draft
  - id: optimization-015
    type: single
    difficulty: medium
    question: Let $y = f(x)$ be a solution of the differential equation $x\,dy + (y - xe^x)\,dx = 0$ such that $y = 0$ when $x = 1$. What is the value of $f(2)$?
    options:
      - text: $\frac{1}{2e}$
      - text: $\frac{1}{e}$
      - text: $\frac{e^2}{2}$
        correct: true
      - text: $2e$
    explanation: Dividing by $dx$ gives $x y' + y = x e^x$, and the left side is exactly the product-rule derivative $(xy)'$ [^1]. So $(xy)' = x e^x$, and integration by parts gives $\int x e^x\,dx = (x - 1)e^x + C$ [^2], hence $xy = (x - 1)e^x + C$. The condition $y(1) = 0$ forces $C = 0$, so $f(x) = (x - 1)e^x / x$ and $f(2) = e^2/2$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-2-3-prod-quot.html#sec-2-3-prod-quot-4
        locator: Sec. 2.3.2 The product rule
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-5-4-parts.html#sec-5-4-parts-4
        locator: 'Sec. 5.4.2 Reversing the Product Rule: Integration by Parts'
    source:
      id: mmlu-redux
      ref: college_mathematics/5
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=5
    status: draft
  - id: optimization-016
    type: true_false
    difficulty: easy
    question: 'True or false: if $f, g : \mathbb{R} \to \mathbb{R}$ are differentiable everywhere, then the composition $f(g(x))$ is differentiable everywhere.'
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: True. The chain rule says that if $g$ is differentiable at $a$ and $f$ is differentiable at $g(a)$, then $F(x) = f(g(x))$ is differentiable at $a$ with $F'(a) = f'(g(a))\,g'(a)$ [^1]. When both functions are differentiable everywhere, these hypotheses hold at every point, so the composition is differentiable everywhere. Backpropagation relies on exactly this when it differentiates a network as a composition of layers [^2].
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_chain_rule.html
        locator: Sec. 2.9 The Chain Rule, Theorem 2.9.2
      - source: d2l
        url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
        locator: Sec. 5.3.3 Backpropagation
    source:
      id: mmlu-redux
      ref: college_mathematics/11
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=11
    status: draft
  - id: optimization-017
    type: single
    difficulty: easy
    question: Let $x_1 = 1$ and $x_{n+1} = \sqrt{3 + 2x_n}$ for all positive integers $n$. If it is assumed that $\{x_n\}$ converges, then $\lim_{n \to \infty} x_n =$
    options:
      - text: $3$
        correct: true
      - text: $e$
      - text: $\sqrt{5}$
      - text: $0$
    explanation: 'If $x_n \to L$ then also $x_{n+1} \to L$, and because $\sqrt{3 + 2x}$ is continuous the limit passes inside it: $L = \sqrt{3 + 2L}$ [^1]. Squaring gives $L^2 - 2L - 3 = (L - 3)(L + 1) = 0$, and $L = -1$ is impossible because every term is positive, so $L = 3$. $\sqrt{5}$ is only the second term $x_2$. The same reasoning applies to any convergent iteration $x_{n+1} = g(x_n)$ with continuous $g$: its limit is a fixed point $x = g(x)$.'
    references:
      - title: CLP-2 Integral Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP2/clp_2_ic/chap_seq_ser-3.html
