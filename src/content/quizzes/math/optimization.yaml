    reviewed_by: claude
  - id: optimization-091
    type: multiple
    difficulty: medium
    tags:
      - automatic-differentiation
      - forward-mode
      - reverse-mode
      - jacobian
    question: |
      A program computes $f: \mathbb{R}^N \to \mathbb{R}^M$, and you want its full $M \times N$ Jacobian by
      automatic differentiation. Which statements are correct? Select all that apply.
    options:
      - text: Forward and reverse mode give the same derivatives, up to floating-point rounding
        correct: true
      - text: Forward mode needs one pass per input, so its cost grows with $N$
        correct: true
      - text: Reverse mode needs one pass per output, so its cost grows with $M$
        correct: true
      - text: Reverse mode always needs less time and less memory than forward mode
        why: Reverse mode must store the intermediate values of the forward pass, and it is faster only when $M$ is smaller than $N$ [^2].
    explanation: |
      Both modes apply the chain rule to the same elementary operations and differ only in the order of
      the products, so they compute the same exact derivatives [^1][^2]. Forward mode builds the Jacobian
      one column per pass ($N$ passes), reverse mode one row per pass ($M$ passes), at a few times the cost
      of evaluating $f$ each; that is why reverse mode (backpropagation) suits a scalar loss of millions
      of parameters [^2]. Its price is memory: storage grows with the number of operations in the
      evaluated function, unless checkpointing is used [^2].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-129, p. 141; Solution SOL-129, p. 167
        url: https://arxiv.org/abs/2201.00650v2
      - title: Baydin et al. (2018), Automatic Differentiation in Machine Learning, a Survey (JMLR)
        locator: Sec. 3.1 Forward Mode and Sec. 3.2 Reverse Mode
        url: https://arxiv.org/abs/1502.05767
    source:
      id: dl-interviews
      ref: ch5#prb129
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-092
    type: short_answer
    difficulty: easy
    tags:
      - derivatives
      - chain-rule
    question: An expression graph computes $g(x) = 1 / \sqrt{x}$. What is $g'(9)$? Round to 4 decimals.
    answer:
      numeric: -0.0185
      tolerance: 0.0001
      hint: a number, 4 decimals
      model: $g'(x) = -\tfrac12 x^{-3/2}$, so $g'(9) = -\tfrac{1}{54} \approx -0.0185$
    explanation: |
      Writing $g(x) = x^{-1/2}$, the power rule gives $g'(x) = -\tfrac12 x^{-3/2}$ [^2]. At $x = 9$,
      $x^{3/2} = 27$, so $g'(9) = -1/54 \approx -0.0185$. The book reaches the same value from the limit
      definition $\lim_{h \to 0} (g(9 + h) - g(9))/h$ [^1].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-102, pp. 126–127; Solution SOL-102, Eq. (5.30), p. 148
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
    source:
      id: dl-interviews
      ref: ch5#prb102
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-093
    type: short_answer
    difficulty: medium
    tags:
      - taylor-series
      - maclaurin
    question: How many nonzero terms does the Taylor polynomial of degree 101 of $\cos x$, centred at $x = 0$, have?
    answer:
      numeric: 51
      tolerance: 0
      hint: a whole number
      model: The even powers $x^0, x^2, \ldots, x^{100}$, that is 51 terms
    explanation: |
      $\cos x = \sum_{n \ge 0} (-1)^n x^{2n} / (2n)!$ contains only even powers, because the odd
      derivatives of $\cos$ at 0 are $\pm\sin 0 = 0$ [^1][^2]. Up to degree 101 the even powers are
      $0, 2, \ldots, 100$, i.e. 51 nonzero terms, and the degree-101 polynomial equals the degree-100 one.
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problems PRB-105 and PRB-108, pp. 128–129; Solution SOL-105, Eq. (5.36), p. 150
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.3.2.5 Taylor Series
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#taylor-series
    source:
      id: dl-interviews
      ref: ch5#prb108
      url: https://arxiv.org/abs/2201.00650v2
