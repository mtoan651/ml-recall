  - id: optimization-131
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - sgd
      - online-learning
    question: |
      A model that predicts a machine's temperature must be updated right after each new sensor
      reading arrives, and old readings are not kept. Which gradient-descent variant fits?
    options:
      - text: Stochastic gradient descent, one update per reading
        correct: true
      - text: Full-batch gradient descent over all readings seen so far
        why: Each update would need every past reading, but they are not stored, and steps would get slower as data accumulate.
      - text: Mini-batch gradient descent with batches of 1,024 readings
        why: The model would wait for 1,024 new readings before each update instead of reacting to each one.
      - text: Full-batch gradient descent with a smaller learning rate
        why: A smaller learning rate does not remove the need to process the whole dataset for every step.
    explanation: |
      SGD updates the parameters with the gradient of one example at a time, so it fits online
      learning, where data arrive as a stream and each example can be used as soon as it is seen
      [^1][^2]. Its updates have a constant cost per step and are frequent but noisy [^3]; that noise
      can even help it escape poor regions of a non-convex loss [^1]. Full-batch gradient descent needs the whole stored dataset for
      every step, and large mini-batches would delay each update.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 32–33, 50
      - title: 'Wikipedia: Stochastic gradient descent'
        url: https://en.wikipedia.org/wiki/Stochastic_gradient_descent
        locator: Iterative method
      - source: d2l
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
        locator: Sec. 12.4.1 Stochastic Gradient Updates
    source:
      id: ncu-intro-dl
      ref: lecture-03/q41
    status: reviewed
    reviewed_by: claude
  - id: optimization-132
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - ill-conditioning
      - momentum
      - adaptive-learning-rate
    question: |
      In a long, narrow valley of the loss, plain gradient descent zig-zags across the valley and
      creeps along it. Advanced optimizers attack this either by changing the step *direction*, using
      a velocity accumulated from earlier gradients, or by giving each parameter its own step *size*.
      Which grouping is correct?
    options:
      - text: 'Velocity: momentum and Nesterov. Per-parameter step size: AdaGrad and RMSProp'
        correct: true
      - text: 'Velocity: AdaGrad and RMSProp. Per-parameter step size: momentum and Nesterov'
        why: AdaGrad and RMSProp scale steps by sums or averages of squared gradients and keep no velocity; momentum methods use one learning rate for all parameters.
      - text: 'Velocity: momentum and AdaGrad. Per-parameter step size: Nesterov and RMSProp'
        why: AdaGrad rescales steps by accumulated squared gradients, and Nesterov is a momentum method with a look-ahead gradient.
      - text: 'Velocity: Nesterov and RMSProp. Per-parameter step size: momentum and AdaGrad'
        why: Momentum uses one learning rate for all parameters, and RMSProp keeps no velocity.
    explanation: |
      Momentum and Nesterov accumulate past gradients into a velocity: components that flip sign
      across the valley cancel, while the consistent component along the valley builds up [^1][^2].
      AdaGrad and RMSProp instead divide each parameter's step by the root of its summed or averaged
      squared gradients, so steep directions get smaller steps and flat ones larger steps [^1][^3].
      Adam combines both ideas: a momentum-like first moment and an RMSProp-like second moment [^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 36
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html#the-momentum-method
        locator: Sec. 12.6.1.3 The Momentum Method
      - source: d2l
        url: https://d2l.ai/chapter_optimization/rmsprop.html#the-algorithm
        locator: Sec. 12.8 RMSProp (introduction) and 12.8.1 The Algorithm
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
        locator: Sec. 12.10.1 The Algorithm
    source:
      id: ncu-intro-dl
      ref: lecture-03/q42
    status: reviewed
    reviewed_by: claude
  - id: optimization-133
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - momentum
    question: |
      A parameter receives the same gradient $g = 0.2$ at every step; the learning rate is
      $\eta = 0.05$ and the momentum coefficient is $\beta = 0.9$. Both forms below update
      $\theta \leftarrow \theta - \eta v_t$. Once the velocity has settled, each step moves the
      parameter by {{1}} with the form used by `torch.optim.SGD` (default dampening 0),
      $v_t = \beta v_{t-1} + g_t$, and by
      {{2}} with the moving-average form $v_t = \beta v_{t-1} + (1 - \beta)g_t$.
    answer:
      blanks:
        - numeric: 0.1
          tolerance: 0.0005
          hint: a number
        - numeric: 0.01
          tolerance: 0.0005
          hint: a number
      model: 'Without $(1 - \beta)$: $v = \beta v + g \Rightarrow v = g/(1 - \beta) = 2$, step $0.05 \cdot 2 = 0.1$. Moving average: $v \to g = 0.2$, step $0.01$, the same as plain gradient descent.'
    explanation: |
      In the form without the factor $1 - \beta$, PyTorch's default [^3], the velocity of a constant
      gradient approaches $g/(1 - \beta)$, so momentum stretches the step by $1/(1 - \beta) = 10$:
      this is how it accelerates on gentle, consistent slopes [^2]. The moving-average form [^1]
      normalizes the weights of past gradients to sum to 1, so its velocity approaches $g$ itself
      and the long-run step equals plain gradient descent's $\eta g = 0.01$; its gain comes from
      damping oscillating components, which allows a larger $\eta$. The two forms are the same
      method once $\eta$ is rescaled by $1 - \beta$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 37–38
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html#effective-sample-weight
        locator: Sec. 12.6.1.4 Effective Sample Weight
      - title: 'PyTorch documentation: torch.optim.SGD'
        url: https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html
        locator: Algorithm (momentum buffer and dampening)
    source:
      id: ncu-intro-dl
      ref: lecture-03/q43
    status: reviewed
    reviewed_by: claude
  - id: optimization-134
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - nesterov
      - momentum
    question: How does Nesterov accelerated gradient (NAG) differ from ordinary momentum?
    options:
      - text: It evaluates the gradient where the velocity is about to carry the parameters
        correct: true
      - text: It evaluates the gradient at the previous parameters instead of the current ones
        why: Stale parameters would make the step less informed; NAG looks forward along the velocity.
      - text: It drops the velocity and steps with the current gradient only
        why: That is plain gradient descent; NAG keeps the velocity of momentum.
      - text: It divides each step by the root of the accumulated squared gradients
        why: That is AdaGrad's per-parameter scaling, not a momentum method.
    explanation: |
      Momentum is about to move the parameters by roughly $\eta\beta v_{t-1}$ anyway, so NAG first
      takes that provisional step and evaluates the gradient there, at the predicted next point
      [^1][^2]. If the slope is about to change, for example just before the bottom of a valley, the
      look-ahead gradient already reflects it and the velocity is corrected earlier, which reduces
      overshooting and often speeds up convergence compared with ordinary momentum.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 39–40
      - title: 'Wikipedia: Stochastic gradient descent'
        url: https://en.wikipedia.org/wiki/Stochastic_gradient_descent
        locator: Extensions and variants — Momentum
    source:
      id: ncu-intro-dl
      ref: lecture-03/q44
    status: reviewed
    reviewed_by: claude
  - id: optimization-135
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - adagrad
      - sparse-features
    question: |
      AdaGrad ($\eta = 0.1$, negligible $\varepsilon$) trains two weights. Weight A belongs to a
      frequent feature and has received the gradient $0.5$ at each of the first 16 steps. Weight B
      belongs to a rare feature: its gradient was 0 at steps 1–15 and $0.5$ at step 16. At step 16,
      how many times larger is B's step than A's?
    options:
      - text: '4'
        correct: true
      - text: '16'
        why: The accumulated sums differ by a factor of 16, but AdaGrad divides by their square roots.
      - text: '1'
        why: Equal current gradients give equal steps only in plain gradient descent; AdaGrad also uses each weight's gradient history.
      - text: '0.25'
        why: B has the smaller history, so B gets the larger step, not the smaller one.
    explanation: |
      AdaGrad divides each weight's step by $\sqrt{G_t}$, the root of that weight's own sum of
      squared gradients [^1][^2]. For A, $G = 16 \cdot 0.25 = 4$, so the step is
      $0.1 \cdot 0.5/2 = 0.025$; for B, $G = 0.25$, so the step is $0.1 \cdot 0.5/0.5 = 0.1$, four
      times larger. Weights of rarely seen features keep a large effective learning rate, which is
      why AdaGrad suits sparse data such as word features [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 41–42
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html#the-algorithm
        locator: Sec. 12.7.3 The Algorithm
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html#sparse-features-and-learning-rates
        locator: Sec. 12.7.1 Sparse Features and Learning Rates
    source:
      id: ncu-intro-dl
      ref: lecture-03/q45
    status: reviewed
    reviewed_by: claude
  - id: optimization-136
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - rmsprop
    question: |
      RMSProp updates $E_t = \gamma E_{t-1} + (1 - \gamma)g_t^2$ and
      $\theta \leftarrow \theta - \dfrac{\eta}{\sqrt{E_t} + \varepsilon}\,g_t$, with $E_0 = 0$,
      $\gamma = 0.9$, $\eta = 0.01$ and negligible $\varepsilon$. Starting from $\theta = 1$, the
      gradients at steps 1 and 2 are $g_1 = 2$ and $g_2 = 1$. What is $\theta$ after step 2? Give 4
      decimals.
    answer:
      numeric: 0.9536
      tolerance: 0.0002
      hint: 4 decimals
      model: $E_1 = 0.4$, step $0.01 \cdot 2/\sqrt{0.4} \approx 0.03162$; $E_2 = 0.36 + 0.1 = 0.46$, step $0.01 \cdot 1/\sqrt{0.46} \approx 0.01474$; $\theta \approx 1 - 0.03162 - 0.01474 \approx 0.9536$.
    explanation: |
      RMSProp divides each step by the root of an exponentially decaying average of recent squared
      gradients [^1][^2][^3]. Because $E_0 = 0$ and only 10% of $g_1^2$ enters $E_1 = 0.4$, the first step is about
      $3.2\eta$, larger than $\eta$: plain RMSProp has no bias correction, unlike Adam. At step 2
      the average $E_2 = 0.46$ still remembers the large first gradient, so the step is about
      $0.0147$. Unlike AdaGrad's ever-growing sum, the average forgets old gradients geometrically,
      so the step size does not decay toward zero.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 43–44
      - source: d2l
        url: https://d2l.ai/chapter_optimization/rmsprop.html#the-algorithm
        locator: Sec. 12.8.1 The Algorithm, eq. (12.8.1)
      - title: 'Wikipedia: Stochastic gradient descent'
        url: https://en.wikipedia.org/wiki/Stochastic_gradient_descent
        locator: Extensions and variants — RMSProp
    source:
      id: ncu-intro-dl
      ref: lecture-03/q46
    status: reviewed
    reviewed_by: claude
  - id: optimization-137
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - non-stationary
      - concept-drift
    question: In which training situation is the objective non-stationary?
    options:
      - text: A fraud detector is retrained continually while fraudsters keep changing tactics
        correct: true
      - text: An image classifier is trained for many epochs on a fixed dataset, shuffled anew every epoch
        why: Reshuffling changes the order of the mini-batches, not the objective; the average loss over the fixed dataset stays the same function.
      - text: A network is trained on a fixed dataset whose loss surface has many local minima
        why: A non-convex objective can be hard to minimize, but it does not change over time.
      - text: The learning rate of a model trained on a fixed dataset is halved every ten epochs
        why: A schedule changes how the optimizer moves, not the function being minimized.
    explanation: |
      An objective is non-stationary when the function being optimized itself changes during
      training, typically because the data distribution drifts, as with streaming data or evolving
      environments [^1][^2]. The best parameters then move over time and the optimizer has to keep
      adapting. Methods built on exponentially decaying averages, such as RMSProp and Adam, weight
      recent gradients most, and Adam was explicitly designed to suit non-stationary objectives [^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 45
      - title: 'Wikipedia: Concept drift'
        url: https://en.wikipedia.org/wiki/Concept_drift
        locator: Introduction
      - title: 'Kingma & Ba (2015), Adam: A Method for Stochastic Optimization, arXiv:1412.6980'
        url: https://arxiv.org/abs/1412.6980
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-03/q47
    status: reviewed
    reviewed_by: claude
  - id: optimization-138
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - rmsprop
      - adagrad
      - non-stationary
    question: |
      A recommendation model is trained online for months. User behaviour shifts, and some weights
      that received large gradients early on now need sizable updates again. Why does RMSProp handle
      this better than AdaGrad?
    options:
      - text: RMSProp's decaying average forgets old squared gradients; AdaGrad's sum only grows, so its steps keep shrinking
        correct: true
      - text: RMSProp adds a velocity term that carries the weights through the shift, a term AdaGrad does not have
        why: Plain RMSProp keeps no velocity; it differs from AdaGrad only in how the squared gradients are accumulated.
      - text: RMSProp evaluates its gradient at a look-ahead point, so it anticipates the coming shift in the data
        why: Evaluating the gradient at a look-ahead point is Nesterov's idea, not RMSProp's.
      - text: AdaGrad cannot handle the sparse gradients that online recommendation data always produce
        why: Sparse features are where AdaGrad shines; its weakness is the ever-shrinking effective learning rate.
    explanation: |
      AdaGrad's denominator sums every squared gradient ever seen, so a weight that once had large
      gradients keeps a tiny effective learning rate for good, even when the data change and it
      needs to move again [^2]. RMSProp replaces the sum by an exponentially decaying average, so old
      gradients fade out and each parameter's step size follows the recent gradient scale [^2][^3].
      This is why RMSProp and Adam are the usual recommendations for non-stationary objectives
      [^1][^4].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 44–45, 52
      - source: d2l
        url: https://d2l.ai/chapter_optimization/rmsprop.html
        locator: Sec. 12.8 RMSProp (introduction)
      - source: d2l
        url: https://d2l.ai/chapter_optimization/rmsprop.html#the-algorithm
        locator: Sec. 12.8.1 The Algorithm, eq. (12.8.2)
      - title: 'Kingma & Ba (2015), Adam: A Method for Stochastic Optimization, arXiv:1412.6980'
        url: https://arxiv.org/abs/1412.6980
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-03/q48
    status: reviewed
    reviewed_by: claude
  - id: optimization-139
    type: short_answer
    difficulty: hard
    tags:
      - ce6146
      - ce6146-l03
      - adam
      - bias-correction
    question: |
      Adam with bias correction ($\eta = 0.1$, $\beta_1 = 0.9$, $\beta_2 = 0.999$, negligible
      $\varepsilon$, $m_0 = v_0 = 0$) updates a parameter that starts at $\theta = 1$. The gradients
      are $g_1 = 1$ and $g_2 = 3$. After step 2, the bias-corrected first moment is
      $\hat m_2 =$ {{1}} (3 decimals) and the parameter is $\theta =$ {{2}} (4 decimals).
    answer:
      blanks:
        - numeric: 2.053
          tolerance: 0.001
          hint: 3 decimals
        - numeric: 0.8082
          tolerance: 0.0002
          hint: 4 decimals
      model: 'Step 1: $\hat m_1 = 1$, $\hat v_1 = 1$, $\theta = 0.9$. Step 2: $m_2 = 0.09 + 0.3 = 0.39$, $\hat m_2 = 0.39/0.19 \approx 2.053$; $v_2 = 0.000999 + 0.009 = 0.009999$, $\hat v_2 = 0.009999/0.001999 \approx 5.002$; $\theta = 0.9 - 0.1 \cdot 2.053/\sqrt{5.002} \approx 0.9 - 0.0918 = 0.8082$.'
    explanation: |
      Adam keeps exponential moving averages of the gradients ($m_t$) and of their squares ($v_t$)
      and divides them by $1 - \beta_1^t$ and $1 - \beta_2^t$ to undo the pull toward the zero
      initialization [^1][^2][^3]. At step 1 this gives $\hat m_1 = g_1$ and $\hat v_1 = g_1^2$, so the
      step is exactly $\eta$. At step 2 the corrected averages, about $2.053$ and $5.002$, weight the
      two gradients almost equally (about 0.47 and 0.53), and the step
      $0.1 \cdot 2.053/2.237 \approx 0.092$ stays below $\eta$: Adam's step sizes are roughly bounded
      by the learning rate.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 46
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
        locator: Sec. 12.10.1 The Algorithm, eqs. (12.10.1)–(12.10.4)
      - title: 'Kingma & Ba (2015), Adam: A Method for Stochastic Optimization, arXiv:1412.6980'
        url: https://arxiv.org/abs/1412.6980
        locator: Algorithm 1
