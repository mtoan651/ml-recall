  - id: optimization-111
    type: single
    difficulty: medium
    tags:
      - gradient-descent
      - sgd
      - mini-batch
      - convergence
      - learning-rate
    question: |
      You fit a linear regression model (a convex problem) to noisy data with a constant, suitably
      small learning rate and run for a very long time. Which variant of gradient descent ends up
      exactly at the optimum instead of bouncing around it?
    options:
      - text: Batch gradient descent
        correct: true
      - text: Stochastic gradient descent
        why: Each SGD step follows the gradient of one random instance, which is not zero at the optimum, so with a constant learning rate the parameters keep jittering around it.
      - text: Mini-batch gradient descent with batches of 32
        why: Mini-batch gradients are less noisy than single-instance ones but still random, so the iterates keep moving around the optimum unless the learning rate is decreased.
      - text: All three, because the cost function is convex
        why: Convexity guarantees there is a single optimum to head for, but the stochastic variants still need a decaying learning rate to settle on it.
    explanation: |
      Batch gradient descent uses the exact gradient of the full cost, which shrinks to zero at the
      minimum, so the steps shrink too and the iterates converge. SGD and mini-batch GD use noisy
      gradient estimates: even near the minimum they keep injecting the noise
      $\eta \nabla f_i(\mathbf{x})$, so the trajectory stays noisy and does not improve with more
      steps unless the learning rate is reduced over time [^2]. With noisy data the per-instance
      gradients do not all vanish at the least-squares solution, which is why the stochastic
      variants keep moving (on data that a line fits perfectly, they would converge too). SGD
      usually gets *near* the optimum first, but only batch GD truly converges [^1].
    references:
      - source: handson-ml3
        locator: 04_training_linear_models.ipynb, Exercise solutions, 7.
        url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/04_training_linear_models.ipynb
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates; Sec. 12.4.2 Dynamic Learning Rate
        url: https://d2l.ai/chapter_optimization/sgd.html
    source:
      id: handson-ml3
      ref: 04_training_linear_models#ex7
      url: https://github.com/ageron/handson-ml3/blob/ef1c9f5ab11083584635b9b3a7846f49c58a6084/04_training_linear_models.ipynb
