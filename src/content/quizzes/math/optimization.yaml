  - id: optimization-076
    type: single
    difficulty: medium
    tags:
      - matrix-calculus
      - gradient
      - quadratic-form
    question: |
      For a general square matrix $A$ (not necessarily symmetric), what is the gradient of
      $J(\mathbf{w}) = \mathbf{w}^\top A \mathbf{w}$ with respect to the column vector $\mathbf{w}$?
    options:
      - text: $2A\mathbf{w}$
        why: This holds only for symmetric $A$, where $A + A^\top = 2A$ [^1][^2].
      - text: $A^\top \mathbf{w}$
        why: This is only one of the two terms; $\mathbf{w}$ appears on both sides of $A$, so both $A\mathbf{w}$ and $A^\top\mathbf{w}$ contribute [^1].
      - text: $(A + A^\top)\mathbf{w}$
        correct: true
      - text: $A\mathbf{w}$
        why: Differentiating only the right-hand $\mathbf{w}$ misses the contribution of the left-hand $\mathbf{w}^\top$ [^1].
    explanation: |
      Perturbing $\mathbf{w}$ by $\epsilon\mathbf{h}$ gives
      $J(\mathbf{w} + \epsilon\mathbf{h}) = J(\mathbf{w}) + \epsilon(\mathbf{w}^\top A\mathbf{h} + \mathbf{h}^\top A\mathbf{w}) + O(\epsilon^2)$
      [^1]. Since $\mathbf{h}^\top A\mathbf{w} = \mathbf{w}^\top A^\top\mathbf{h}$, the linear term is
      $\epsilon\,\mathbf{w}^\top(A + A^\top)\mathbf{h}$, so $\nabla J = (A + A^\top)\mathbf{w}$ [^1][^2].
      Special cases: $\nabla\,\mathbf{w}^\top\mathbf{w} = 2\mathbf{w}$, and $2A\mathbf{w}$ for symmetric
      $A$ such as a Hessian or covariance matrix.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 2 Optimisation, Ex. 2.1 (b) Gradient of vector-valued functions
        url: https://arxiv.org/abs/2206.13446
      - source: d2l
        locator: Sec. 22.4.7 A Little Matrix Calculus
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-little-matrix-calculus
    source:
      id: gutmann-pen-paper
      ref: optimisation#grad-vector-b
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/optimisation.tex
    status: reviewed
    reviewed_by: claude
  - id: optimization-077
    type: single
    difficulty: medium
    tags:
      - newtons-method
      - hessian
      - second-order-optimization
    question: |
      Near the current point $\mathbf{w}_0$, a function $J$ is approximated by
      $f(\mathbf{w}) = J(\mathbf{w}_0) + \mathbf{g}^\top(\mathbf{w} - \mathbf{w}_0) + \tfrac12(\mathbf{w} - \mathbf{w}_0)^\top H(\mathbf{w} - \mathbf{w}_0)$, where $\mathbf{g}$ is the gradient and $H$ a
      symmetric positive definite Hessian. Which point minimises $f$, i.e. what is the Newton update?
    options:
      - text: $\mathbf{w}^* = \mathbf{w}_0 - H\mathbf{g}$
        why: Setting $\nabla f = \mathbf{g} + H(\mathbf{w} - \mathbf{w}_0) = 0$ requires solving with $H$, i.e. multiplying by $H^{-1}$, not by $H$ [^1].
      - text: $\mathbf{w}^* = \mathbf{w}_0 + H^{-1}\mathbf{g}$
        why: With a positive definite $H$ this moves uphill; the minimiser lies against the gradient direction [^1].
      - text: $\mathbf{w}^* = \mathbf{w}_0 - \mathbf{g}$
        why: This is a plain gradient step with step size 1; it ignores the curvature information in $H$ [^1][^2].
      - text: $\mathbf{w}^* = \mathbf{w}_0 - H^{-1}\mathbf{g}$
        correct: true
    explanation: |
      The gradient of the quadratic model is $\nabla f(\mathbf{w}) = \mathbf{g} + H(\mathbf{w} -
      \mathbf{w}_0)$, which vanishes at $\mathbf{w}^* = \mathbf{w}_0 - H^{-1}\mathbf{g}$ [^1]. Because
      $H$ is positive definite, $f$ grows quadratically away from this point, so it is the minimiser
      [^1]. One Newton step jumps to the minimum of the local quadratic model; in practice one solves
      $H\mathbf{p} = \mathbf{g}$ instead of inverting $H$, and often adds a step size from a line
      search [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 2 Optimisation, Ex. 2.2 (a)–(c) Newton's method
        url: https://arxiv.org/abs/2206.13446
      - source: d2l
        locator: Sec. 12.3.3.1 Newton's Method
        url: https://d2l.ai/chapter_optimization/gd.html#newtons-method
    source:
      id: gutmann-pen-paper
      ref: optimisation#newtons-method-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/optimisation.tex
    status: reviewed
    reviewed_by: claude
  - id: optimization-078
    type: single
    difficulty: hard
    tags:
      - matrix-calculus
      - gradient
      - linear-layer
      - outer-product
    question: |
      Let $W \in \mathbb{R}^{n \times m}$ have rows $\mathbf{w}_1^\top, \ldots, \mathbf{w}_n^\top$, let
      $\mathbf{v} \in \mathbb{R}^m$, and let $f: \mathbb{R} \to \mathbb{R}$ be differentiable. What is
      the gradient of $J(W) = \sum_{k=1}^n f(\mathbf{w}_k^\top \mathbf{v})$ with respect to $W$ (an
      $n \times m$ matrix)? Here $f'$ acts element-wise on the vector $W\mathbf{v}$.
    options:
      - text: $f'(W\mathbf{v})\,\mathbf{v}^\top$
        correct: true
      - text: $\mathbf{v}\, f'(W\mathbf{v})^\top$
        why: This is the transpose, an $m \times n$ matrix; the gradient must have the shape of $W$ [^1].
      - text: $W^\top f'(W\mathbf{v})$
        why: This $m$-vector is the gradient with respect to the input $\mathbf{v}$, not with respect to the weights [^1].
      - text: $f'(W\mathbf{v}) \odot (W\mathbf{v})$
        why: This is an $n$-vector; the derivative with respect to $W_{ij}$ needs the input component $v_j$, which an outer product supplies [^1].
    explanation: |
      $\partial J/\partial W_{ij} = f'(\mathbf{w}_i^\top\mathbf{v})\,\partial(\mathbf{w}_i^\top
      \mathbf{v})/\partial W_{ij} = f'(\mathbf{w}_i^\top \mathbf{v})\, v_j$, which is entry $(i, j)$ of the
      outer product $f'(W\mathbf{v})\,\mathbf{v}^\top$ [^1]. This is the familiar weight gradient of a
      linear layer: the error signal at the outputs times the transposed input [^1][^2].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 2 Optimisation, Ex. 2.3 (c) Gradient of matrix-valued functions
        url: https://arxiv.org/abs/2206.13446
      - source: d2l
        locator: Sec. 22.4.7 A Little Matrix Calculus
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-little-matrix-calculus
    source:
      id: gutmann-pen-paper
      ref: optimisation#grad-matrix-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/optimisation.tex
    status: reviewed
    reviewed_by: claude
  - id: optimization-079
    type: single
    difficulty: hard
    tags:
      - matrix-calculus
      - log-determinant
      - ica
      - normalising-flows
    question: |
      Log-likelihoods of ICA and of normalising flows contain the term $\log\lvert\det W\rvert$ for
      an invertible square matrix $W$. What is its gradient $\nabla_W \log\lvert\det W\rvert$?
    options:
      - text: $W^{-1}$
        why: The transpose matters for non-symmetric $W$; $\partial\log\lvert\det W\rvert/\partial W_{ij}$ is entry $(j, i)$ of $W^{-1}$ [^1][^2].
      - text: $(W^{-1})^\top$
        correct: true
      - text: $\frac{1}{\det W}\, I$
        why: The derivative of $\log\lvert\det W\rvert$ is not a multiple of the identity; it depends on all entries of $W$ through the cofactors [^2].
      - text: $W^\top$
        why: That would be the gradient of $\frac12\lVert W\rVert_F^2$, not of the log-determinant [^1].
    explanation: |
      For a diagonalizable $W = U\Lambda V^\top$, with the eigenvectors $\mathbf{u}_i$ as the columns of
      $U$ and $V^\top = U^{-1}$, we have $\log\lvert\det W\rvert = \sum_i \log\lvert\lambda_i\rvert$ and
      $\nabla_W\lambda_i = \mathbf{v}_i\mathbf{u}_i^\top$, so
      $\nabla_W \log\lvert\det W\rvert = \sum_i \mathbf{v}_i\mathbf{u}_i^\top/\lambda_i = (W^{-1})^\top$
      [^1]. Jacobi's formula $d\det W = \det W\,\mathrm{tr}(W^{-1}dW)$ gives the same result for every
      invertible $W$ [^2]. In ICA this term pushes the unmixing matrix away from singular solutions.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 2 Optimisation, Ex. 2.4 (a)–(d) Gradient of the log-determinant
        url: https://arxiv.org/abs/2206.13446
      - title: "Wikipedia: Jacobi's formula"
        url: https://en.wikipedia.org/wiki/Jacobi%27s_formula
        locator: Statement and Corollary
    source:
      id: gutmann-pen-paper
      ref: optimisation#grad-log-det-d
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/optimisation.tex
    status: reviewed
    reviewed_by: claude
  - id: optimization-080
    type: single
    difficulty: easy
    tags:
      - gradient-descent
      - sgd
      - minibatch
    question: |
      Which of the following optimisation algorithms produces the same sequence of parameter updates
      no matter in which order the training examples are stored?
    options:
      - text: Mini-batch gradient descent
        why: The order determines which examples end up in each mini-batch, and hence the sequence of updates [^2].
      - text: Stochastic gradient descent
        why: SGD updates after every single example, so a different order gives a different trajectory [^1].
      - text: Stochastic gradient descent with momentum
        why: Momentum averages past gradients, but those gradients still come from examples visited in a particular order [^1].
      - text: Batch (full) gradient descent
        correct: true
    explanation: |
      Batch gradient descent computes the gradient of the loss over the whole training set before
      each update; this is a sum over examples, and sums do not depend on order [^3]. Stochastic and
      mini-batch methods update the parameters after each example or small batch, so the order in
      which data are visited (usually shuffled every epoch) changes the path through parameter space
      [^1][^2].
    references:
      - source: d2l
        locator: Sec. 12.4 Stochastic Gradient Descent
        url: https://d2l.ai/chapter_optimization/sgd.html
      - source: d2l
        locator: Sec. 12.5.2 Minibatches
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
      - source: d2l
        locator: Sec. 12.3.2 Multivariate Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
    source:
      id: dsgiitr-ml-interviewqs
      ref: questions/ml.yml#q1
      url: https://github.com/dsgiitr/ML-InterviewQs/blob/8c6d228b051af7ceb429e6322befda068964e6b5/questions/ml.yml
    status: reviewed
    reviewed_by: claude
  - id: optimization-081
    type: short_answer
    difficulty: easy
    tags:
      - adam
      - optimizer-state
      - memory
    question: |
      You train a network with 1,000,000 parameters. Plain SGD (no momentum) stores nothing besides the
      parameters and their gradients. How many **extra** numbers does Adam keep as optimizer state?
    answer:
      numeric: 2000000
      tolerance: 0
      hint: a whole number
      model: 2,000,000 — one first-moment and one second-moment estimate per parameter
    explanation: |
      Adam keeps two exponentially weighted averages for every parameter: the momentum-like first
      moment $\mathbf{v}_t$ of the gradient and the second moment $\mathbf{s}_t$ of its square [^1]. That
      is $2 \times 10^6$ extra values, i.e. twice the model size in optimizer state. Dividing by
      $\sqrt{\hat{\mathbf{s}}_t}$ gives each parameter its own effective step size, which is the main
      difference from SGD [^1][^2].
    references:
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
      - source: ds-interviews
        locator: theory.md, Optimization in neural networks — "What is Adam? What's the main difference between Adam and SGD?"
        url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#optimization-in-neural-networks
    source:
      id: ds-interviews
      ref: theory.md#q100
      url: https://github.com/alexeygrigorev/data-science-interviews/blob/919f44547ef5ffc2bd59674fd301940529f4c1a8/theory.md#optimization-in-neural-networks
    status: reviewed
    reviewed_by: claude
  - id: optimization-082
    type: short_answer
    difficulty: medium
    tags:
      - steepest-descent
      - dual-norm
      - sign-descent
    question: |
      Steepest descent under the max norm solves
      $$\Delta w^\star = \operatorname*{arg\,min}_{\Delta w}\Big[g^\top \Delta w + \tfrac{\lambda}{2}\lVert \Delta w \rVert_\infty^2\Big]$$
      and the solution is $\Delta w^\star = -\frac{\lVert g \rVert_1}{\lambda}\,\mathrm{sign}(g)$. For
      $g = (3, -1, 0.5)$ and $\lambda = 2$, what is the second component $\Delta w^\star_2$?
    answer:
      numeric: 2.25
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $\lVert g \rVert_1 = 4.5$, so $\Delta w^\star = -2.25\,\mathrm{sign}(g) = (-2.25,\ 2.25,\ -2.25)$
    explanation: |
      Write $\Delta w = c\,t$ with $\lVert t \rVert_\infty = 1$ and $c \ge 0$. The best direction is
      $t = -\mathrm{sign}(g)$, which reaches $g^\top t = -\lVert g \rVert_1$, because the $\ell_1$ norm is
      the dual of the $\ell_\infty$ norm [^1][^2]. Minimizing $-c\lVert g \rVert_1 + \tfrac{\lambda}{2}c^2$
      gives $c = \lVert g \rVert_1 / \lambda = 4.5 / 2 = 2.25$. Every coordinate moves by the same
      amount, against the sign of its gradient, so the second coordinate (gradient $-1$) moves up by
      $2.25$; a numerical minimizer finds the same point.
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Steepest descent, Problems 1–3
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: 'Wikipedia: Dual norm'
        locator: Examples — Finite-dimensional spaces; Lp and ℓp spaces
        url: https://en.wikipedia.org/wiki/Dual_norm
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q3b
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: optimization-083
    type: short_answer
    difficulty: hard
    tags:
      - square-loss
      - spectral-norm
      - smoothness
      - sharpness
    question: |
      A linear predictor $W \in \mathbb{R}^{d_{\text{out}} \times d_{\text{in}}}$ is fit with the square loss
      $$L(W) = \frac{1}{2n}\sum_{i=1}^{n}\frac{1}{d_{\text{out}}}\lVert y^{(i)} - W x^{(i)} \rVert_2^2,$$
      where every input is normalized to $\lVert x^{(i)} \rVert_2 = \sqrt{d_{\text{in}}}$. The bound
      $L(W + \Delta W) \le L(W) + \operatorname{tr}(G^\top \Delta W) + \tfrac{\lambda}{2}\lVert \Delta W \rVert_{2 \to 2}^2$
      holds for every $\Delta W$, with $G$ the gradient and $\lVert\cdot\rVert_{2 \to 2}$ the spectral norm
      (the largest singular value). For $d_{\text{in}} = 512$ and $d_{\text{out}} = 128$, what is the
      smallest $\lambda$ this argument gives?
    answer:
      numeric: 4
      tolerance: 0.001
      hint: a number
      model: $\lambda = d_{\text{in}} / d_{\text{out}} = 512 / 128 = 4$
    explanation: |
      Expanding the square gives exactly
      $L(W + \Delta W) = L(W) + \operatorname{tr}(G^\top \Delta W) + \frac{1}{2n\,d_{\text{out}}}\sum_i \lVert \Delta W x^{(i)} \rVert_2^2$
      [^1]. Since $\lVert \Delta W x \rVert_2 \le \lVert \Delta W \rVert_{2 \to 2} \lVert x \rVert_2$ and
      $\lVert x^{(i)} \rVert_2^2 = d_{\text{in}}$, the last term is at most
      $\frac{d_{\text{in}}}{2 d_{\text{out}}}\lVert \Delta W \rVert_{2 \to 2}^2$, so
      $\lambda = d_{\text{in}} / d_{\text{out}} = 4$ [^2]. Choosing $\Delta W$ to minimize this upper bound
      is steepest descent under the spectral norm, which Bernstein and Newhouse connect to the Shampoo
      optimizer; the sharpness $\lambda$ depends only on the layer's shape, not on the data [^2].
    references:
      - source: mit-ocw-67960
        locator: Homework 2, Steepest descent, Problem 5 (bonus)
        url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
      - title: Bernstein & Newhouse (2024), Old Optimizer, New Norm — An Anthology, arXiv:2409.20325
        locator: Story II, Proposition 6 (Bounding the square loss of a linear predictor), Eq. (21)
        url: https://arxiv.org/abs/2409.20325
    source:
      id: mit-ocw-67960
      ref: mit6_7960_f24_hw2#q5
      url: https://ocw.mit.edu/courses/6-7960-deep-learning-fall-2024/resources/mit6_7960_f24_hw2_pdf/
    status: reviewed
    reviewed_by: claude
  - id: optimization-084
    type: single
    difficulty: easy
    tags:
      - gradient-descent
      - least-squares
    question: |
      Gradient descent with step size $s$ minimizes $f(x) = \tfrac12\lVert Ax - b \rVert_2^2$. What is its
      update?
    options:
      - text: $x_{k+1} = x_k - s\,A^\top(Ax_k - b)$
        correct: true
      - text: $x_{k+1} = x_k - s\,A^\top(b - Ax_k)$
        why: This steps along $+\nabla f$ and increases the loss; the gradient is $A^\top(Ax - b)$.
      - text: $x_{k+1} = x_k - s\,(Ax_k - b)$
        why: The residual $Ax_k - b$ lives in the output space; it has to be mapped back by $A^\top$ to match $x$.
      - text: $x_{k+1} = x_k - s\,(A^\top A)^{-1}A^\top b$
        why: That uses the normal-equation solution, not the gradient at $x_k$, and does not depend on the current error.
    explanation: |
      The gradient of $\tfrac12\lVert Ax - b \rVert^2$ is $A^\top(Ax - b)$: the residual mapped back through
      $A^\top$ [^1]. Each step moves against it, and for a small enough step ($s < 2/\sigma_{\max}(A)^2$) the
      iterates converge to the least-squares solution without forming or inverting $A^\top A$ [^2].
    references:
      - source: d2l
        locator: Sec. 3.1.1.2 Loss Function and Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent, Eq. (3.1.10)
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
      - source: mit-ocw-18065
        locator: Problems for Lecture 22 (textbook Section VI.4), Problem 6
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec22-q6
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    status: reviewed
    reviewed_by: claude
  - id: optimization-085
    type: short_answer
    difficulty: easy
    tags:
      - gradient-descent
      - step-size
    question: |
      Minimize $F(x, y) = y^2 + (y - x)^2$ by full gradient descent with step size $s = \tfrac12$,
      starting at $(x_0, y_0) = (1, 1)$. Where is $(x_1, y_1)$?
    answer:
      accept:
        - (1, 0)
      pattern: \(?\s*1(\.0*)?\s*,\s*0(\.0*)?\s*\)?
      hint: a point, e.g. (2, -1)
      model: $\nabla F(1, 1) = (-2(y - x),\ 2y + 2(y - x)) = (0, 2)$, so $(1, 1) - \tfrac12(0, 2) = (1, 0)$
    explanation: |
      The partial derivatives are $\partial F/\partial x = -2(y - x)$ and $\partial F/\partial y = 2y + 2(y - x)$,
      which at $(1, 1)$ give $\nabla F = (0, 2)$ [^1]. One step of size $\tfrac12$ lands at $(1, 0)$, where
      $F(1, 0) = 1$, no better than $F(1, 1) = 1$: the step overshot along $y$, a reminder that the step
      size must suit the curvature. The minimum is at $(0, 0)$ [^2].
    references:
      - source: d2l
        locator: Sec. 12.3.1 One-Dimensional Gradient Descent; Sec. 12.3.2 Multivariate Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html#multivariate-gradient-descent
      - source: mit-ocw-18065
        locator: Problems for Lecture 25 (textbook Section VI.5), Problem 1
        url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
    source:
      id: mit-ocw-18065
      ref: MIT18_065S18PSets#lec25-q1
      url: https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/18065-all-problem-sets-in-one-file/
