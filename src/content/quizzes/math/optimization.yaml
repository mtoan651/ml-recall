    reviewed_by: claude
  - id: optimization-042
    type: single
    difficulty: hard
    tags:
      - sgd
      - learning-rate-schedule
      - convergence
    question: |
      For a convex objective, stochastic gradients bounded by $L$ and a start at distance $r$ from the
      optimum, SGD with step sizes $\eta_t$ satisfies
      $$E[R(\bar{\mathbf{x}})] - R^* \le \frac{r^2 + L^2 \sum_{t=1}^T \eta_t^2}{2\sum_{t=1}^T \eta_t}.$$
      Which schedule makes this bound go to 0 as $T \to \infty$?
    options:
      - text: $\eta_t = \eta_0 / \sqrt{t}$
        correct: true
      - text: $\eta_t = \eta_0$, a constant
        why: 'Both sums grow like $T$, so the bound tends to $L^2\eta_0/2$: the noise keeps the iterates away from the optimum [^1].'
      - text: $\eta_t = \eta_0 e^{-\lambda t}$
        why: '$\sum_t \eta_t$ stays finite, so the bound never drops below $r^2/(2\sum_t \eta_t)$: the steps die out before the optimum is reached [^1].'
      - text: $\eta_t = \eta_0 / t^2$
        why: Here too $\sum_t \eta_t$ converges, so the iterates cannot travel arbitrarily far and the bound stays positive.
    explanation: |
      The bound needs $\sum_t \eta_t \to \infty$, so the iterates can travel any distance, and
      $\sum_t \eta_t^2 / \sum_t \eta_t \to 0$, so the injected noise averages out [^1]. With
      $\eta_t = \eta_0/\sqrt{t}$, $\sum \eta_t \approx 2\eta_0\sqrt{T}$ and
      $\sum \eta_t^2 \approx \eta_0^2 \ln T$, so the bound shrinks like $\ln T/\sqrt{T}$. This is the
      polynomial decay with $\alpha = 0.5$ that the analysis favours, while exponential decay stops
      too early [^2]. If $T$ is known, a constant $\eta = r/(L\sqrt{T})$ also gives $rL/\sqrt{T}$ [^1].
    references:
      - source: d2l
        locator: Sec. 12.4.3 Convergence Analysis for Convex Objectives, Eq. (12.4.17)
        url: https://d2l.ai/chapter_optimization/sgd.html#convergence-analysis-for-convex-objectives
      - source: d2l
        locator: Sec. 12.4.2 Dynamic Learning Rate (piecewise constant, exponential and polynomial decay)
        url: https://d2l.ai/chapter_optimization/sgd.html#dynamic-learning-rate
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex1
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-043
    type: short_answer
    difficulty: medium
    tags:
      - sgd
      - gradient-noise
      - expected-risk
    question: |
      For $f(\mathbf{x}) = x_1^2 + 2x_2^2$, take the per-example loss
      $f(\mathbf{x}, \mathbf{w}) = (x_1 - w_1)^2 + 2(x_2 - w_2)^2$ with $\mathbf{w} \sim \mathcal{N}(\mathbf{0}, I)$.
      Its gradient $\nabla_{\mathbf{x}} f(\mathbf{x}, \mathbf{w})$ is $\nabla f(\mathbf{x})$ plus
      zero-mean Gaussian noise, and $E_{\mathbf{w}}[f(\mathbf{x}, \mathbf{w})] = x_1^2 + 2x_2^2 + c$.
      What is $c$?
    answer:
      numeric: 3
      tolerance: 0
      hint: a number
      model: $E[(x_1 - w_1)^2] = x_1^2 + 1$ and $2E[(x_2 - w_2)^2] = 2x_2^2 + 2$, so $c = 3$
    explanation: |
      Expanding, $E[(x_i - w_i)^2] = x_i^2 - 2x_iE[w_i] + E[w_i^2] = x_i^2 + 1$, so the expected
      loss is $x_1^2 + 2x_2^2 + 3$, the original objective plus a constant with the same minimizer.
      The gradient is $(2x_1, 4x_2) - (2w_1, 4w_2)$: the true gradient plus zero-mean Gaussian noise
      with variances 4 and 16. SGD on these sampled losses is therefore gradient descent on $f$ with
      Gaussian gradient noise, which justifies simulating SGD by adding noise to the gradient [^1].
      A stochastic gradient is an unbiased estimate of the full gradient [^2].
    references:
      - source: d2l
        locator: Sec. 12.4.4 Stochastic Gradients and Finite Samples (adding noise to a non-stochastic gradient is justified)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradients-and-finite-samples
      - source: d2l
        locator: Sec. 12.4.1 Stochastic Gradient Updates, Eq. (12.4.4)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex2
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-044
    type: short_answer
    difficulty: easy
    tags:
      - sgd
      - sampling-with-replacement
      - data-efficiency
    question: |
      An "epoch" of SGD draws $n = 1000$ training examples uniformly at random with replacement. On
      average, how many distinct examples does it use?
    answer:
      numeric: 632
      tolerance: 1
      hint: a whole number
      model: $1000\left(1 - (1 - 1/1000)^{1000}\right) \approx 1000(1 - e^{-1}) \approx 632$
    explanation: |
      Each example is missed by all $n$ draws with probability $(1 - 1/n)^n \approx e^{-1} \approx 0.37$,
      so it is used at least once with probability about $0.63$ [^1]. About 368 examples are never
      seen in that epoch while others are used twice or more, which raises the variance of the
      updates and wastes data. That is why practice samples without replacement: shuffle, then pass
      over every example exactly once per epoch [^1][^2].
    references:
      - source: d2l
        locator: Sec. 12.4.4 Stochastic Gradients and Finite Samples, Eq. (12.4.18)
        url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradients-and-finite-samples
      - source: d2l
        locator: Sec. 12.5.6 Summary (a random permutation, each observation once per epoch)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#summary
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex3
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-045
    type: single
    difficulty: medium
    tags:
      - sgd
      - preconditioning
      - adaptive-learning-rate
    question: |
      During SGD, one coordinate of the gradient is consistently much larger than all the others.
      What is the most sensible change to the solver?
    options:
      - text: Give each coordinate its own step size, scaled down where gradients are large
        correct: true
      - text: Raise the global learning rate so that all the small coordinates also move faster
        why: The large coordinate already limits the learning rate; raising it makes that coordinate overshoot or diverge [^1].
      - text: Drop that coordinate from the update so that it stops dominating
        why: Then its parameter is never trained; the scale needs to be matched, not ignored.
      - text: Use smaller minibatches so that the large coordinate averages out
        why: Batch size changes the noise of the gradient, not the systematic difference in scale between coordinates [^2].
    explanation: |
      A single global learning rate must be small enough for the steepest coordinate, which makes
      the others crawl. Preconditioning fixes this by effectively choosing a different learning rate
      for each coordinate [^1]. Adagrad does it automatically by dividing each coordinate's step by
      the root of its accumulated squared gradients, so coordinates with routinely large gradients
      are scaled down [^3]; RMSProp and Adam use the same idea with leaky averages. Standardizing the
      corresponding input feature attacks the same mismatch at the data level.
    references:
      - source: d2l
        locator: Sec. 12.3.3.3 Preconditioning (a different learning rate for each variable)
        url: https://d2l.ai/chapter_optimization/gd.html#preconditioning
      - source: d2l
        locator: Sec. 12.5.2 Minibatches (averaging reduces the gradient's standard deviation)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
      - source: d2l
        locator: Sec. 12.7.1 Sparse Features and Learning Rates
        url: https://d2l.ai/chapter_optimization/adagrad.html#sparse-features-and-learning-rates
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex4
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-046
    type: single
    difficulty: medium
    tags:
      - local-minima
      - nonconvex
    question: How many local minima does $f(x) = x^2(1 + \sin x)$ have on $\mathbb{R}$?
    options:
      - text: 'Infinitely many, all with $f = 0$: at $x = 0$ and wherever $\sin x = -1$'
        correct: true
      - text: Exactly one, at $x = 0$, because $x^2$ dominates for large $|x|$
        why: The factor $1 + \sin x$ returns to 0 at every $x = \frac{3\pi}{2} + 2\pi k$, however large $x^2$ is.
      - text: Infinitely many, with values growing like $x^2$, so only $x = 0$ is global
        why: At each of those minima $1 + \sin x = 0$, so $f = 0$ there too; they are all global minima.
      - text: Only $x = 0$, because $f$ is convex as a product of nonnegative factors
        why: A product of nonnegative functions need not be convex; $f$ dips back to 0 periodically [^1].
    explanation: |
      Both factors are nonnegative, so $f \ge 0$, and $f = 0$ exactly at $x = 0$ and at
      $x = \frac{3\pi}{2} + 2\pi k$ for every integer $k$. Each zero is a local, and in fact global,
      minimum; between two zeros $f$ rises to a single maximum. Nonconvex functions can have
      arbitrarily many local minima [^1]. If the minima had different values, an optimizer would
      have to visit them all to be sure of the global one; that is why no optimality guarantees exist
      for general nonconvex problems [^2].
    references:
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.4.5 Summary (the number of local minima to check may be exponential)
        url: https://d2l.ai/chapter_optimization/sgd.html#summary
      - source: d2l
        locator: Sec. 12.4.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/sgd#ex5
      url: https://d2l.ai/chapter_optimization/sgd.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-047
    type: short_answer
    difficulty: easy
    tags:
      - minibatch-sgd
      - batch-size
      - gradient-variance
    question: |
      Per-example gradients are i.i.d. If you increase the minibatch size from 16 to 256, by what
      factor does the standard deviation of the minibatch gradient shrink?
    answer:
      numeric: 4
      tolerance: 0
      hint: a number
      model: $\sqrt{256 / 16} = \sqrt{16} = 4$
    explanation: |
      Averaging $b$ independent gradients keeps the expectation and divides the standard deviation by
      $\sqrt{b}$ [^1]. Going from 16 to 256 multiplies $b$ by 16 and so divides the standard
      deviation by 4, while the compute per step grows 16-fold. Past some point the extra noise
      reduction is small compared with the linear increase in cost, so batches are chosen to be
      efficient on the hardware and to fit in GPU memory [^1].
    references:
      - source: d2l
        locator: Sec. 12.5.2 Minibatches (standard deviation reduced by $b^{-1/2}$)
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#minibatches
      - source: d2l
        locator: Sec. 12.5.7 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/minibatch-sgd#ex1
      url: https://d2l.ai/chapter_optimization/minibatch-sgd.html#exercises
