  - id: optimization-067
    type: single
    difficulty: medium
    tags:
      - critical-points
      - hessian
      - saddle-points
    question: $f(x, y) = x^2y + xy^2$ has only one critical point, $(0, 0)$. What kind of point is it?
    options:
      - text: Neither a maximum nor a minimum, since $f(x, x) = 2x^3$ changes sign at 0
        correct: true
      - text: A minimum, since the Hessian there is zero and hence positive semidefinite
        why: A zero Hessian makes the second-order test inconclusive; positive semidefiniteness alone does not prove a minimum [^2].
      - text: A maximum, since $f$ is identically zero along the line $y = -x$
        why: Being zero along one line says nothing about a maximum; along $y = x$ the function takes both signs.
      - text: A minimum, since $f(0, 0) = 0$ and $f$ is a sum of nonnegative terms
        why: $x^2y$ and $xy^2$ can be negative, for example $f(-1, -1) = -2$.
    explanation: |
      The gradient $(2xy + y^2,\ x^2 + 2xy) = (y(2x + y),\ x(x + 2y))$ vanishes only at the origin
      [^1]. There the Hessian $\begin{bmatrix} 2y & 2x + 2y \\ 2x + 2y & 2x \end{bmatrix}$ is the zero
      matrix, so second derivatives cannot classify the point [^2]. Along the line $y = x$,
      $f(x, x) = 2x^3$ is positive on one side and negative on the other, so the origin is neither a
      maximum nor a minimum: a degenerate saddle. A critical point is only a candidate for an
      extremum [^1].
    references:
      - source: d2l
        locator: Sec. 22.4.3 A Note on Mathematical Optimization (critical points)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-note-on-mathematical-optimization
      - source: d2l
        locator: Sec. 12.1.2.2 Saddle Points (Hessian eigenvalue test)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
      - source: d2l
        locator: Sec. 22.4.9 Exercises, Exercise 4
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/multivariable-calculus#ex4
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    status: draft
  - id: optimization-068
    type: single
    difficulty: medium
    tags:
      - gradients
      - regularization
      - critical-points
    question: |
      You minimize $f(\mathbf{x}) = g(\mathbf{x}) + h(\mathbf{x})$, for example a data loss $g$ plus a
      regularizer $h$. At a critical point of $f$, how are $\nabla g$ and $\nabla h$ related?
    options:
      - text: They have equal length and point in opposite directions
        correct: true
      - text: Both are zero, so each term is minimized on its own
        why: Only their sum must vanish; usually neither term is at its own minimum.
      - text: They are orthogonal to each other, so neither term can improve
        why: Orthogonal nonzero gradients have a nonzero sum, so $\mathbf{x}$ would not be a critical point.
      - text: They point the same way, so both terms decrease together
        why: Then the sum would be nonzero and a step along $-\nabla f$ would still lower $f$ [^1].
    explanation: |
      A critical point has $\nabla f = \nabla g + \nabla h = 0$ [^1], i.e. $\nabla g = -\nabla h$:
      any small step that lowers $g$ raises $h$ at the same first-order rate, a tug of war in which
      neither term can improve without hurting the other. With weight decay
      $h(\mathbf{w}) = \frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$ this reads
      $\nabla g(\mathbf{w}) = -\lambda\mathbf{w}$. The same picture explains Lagrangians: at the
      constrained optimum the gradient of the objective is offset by the gradient of the
      constraint [^2].
    references:
      - source: d2l
        locator: Sec. 22.4.3 A Note on Mathematical Optimization (a minimum has zero gradient)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-note-on-mathematical-optimization
      - source: d2l
        locator: Sec. 12.2.3.1 Lagrangian and Sec. 12.2.3.2 Penalties (weight decay as a penalty)
        url: https://d2l.ai/chapter_optimization/convexity.html#lagrangian
      - source: d2l
        locator: Sec. 22.4.9 Exercises, Exercise 5
