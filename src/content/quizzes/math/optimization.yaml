      id: ncu-intro-dl
      ref: lecture-03/q10
    status: reviewed
    reviewed_by: claude
  - id: optimization-110
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - adam
      - bias-correction
    question: |
      A parameter $\theta = 2$ is updated by Adam with bias correction ($\eta = 0.001$,
      $\beta_1 = 0.9$, $\beta_2 = 0.999$, tiny $\varepsilon$, moments initialized to 0). After the
      first step, $\theta =$ {{1}} if the first gradient is $g_1 = -50$, and $\theta =$ {{2}} if
      it is $g_1 = -0.05$. Give 4 decimals.
    answer:
      blanks:
        - numeric: 2.001
          tolerance: 0.00005
          hint: 4 decimals
        - numeric: 2.001
          tolerance: 0.00005
          hint: 4 decimals
      model: $\hat m_1 = g_1$ and $\hat v_1 = g_1^2$, so the step is $-\eta\,g_1/|g_1| = +0.001$ in both cases.
    explanation: |
      After one step $m_1 = (1 - \beta_1)g_1$ and $v_1 = (1 - \beta_2)g_1^2$; bias correction
      divides them by $1 - \beta_1$ and $1 - \beta_2$, giving $\hat m_1 = g_1$ and
      $\hat v_1 = g_1^2$ [^1][^2][^3]. The update $-\eta\,\hat m_1/(\sqrt{\hat v_1} + \varepsilon)$ is
      therefore $-\eta\,\mathrm{sign}(g_1) = +0.001$ whatever the gradient's size. Adam's step
      sizes are roughly bounded by $\eta$ and invariant to rescaling the gradient, which is why its
      learning rate needs less tuning across parameters with very different gradient scales.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 46–48
      - title: Kingma & Ba (2015), Adam — A Method for Stochastic Optimization, arXiv:1412.6980
        url: https://arxiv.org/abs/1412.6980
        locator: Algorithm 1; Sec. 2.1 Adam's update rule; Sec. 3 Initialization bias correction
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html
        locator: Sec. 12.10.1 The Algorithm
