  - id: optimization-003
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - gradient
      - gradient-descent
    question: In gradient descent, what is the gradient of the loss?
    options:
      - text: The angle of the loss curve
      - text: The direction of steepest descent
        why: The gradient points towards steepest *ascent*; gradient descent steps along its negative.
      - text: The slope of the loss at the current point — the vector of partial derivatives
        correct: true
      - text: The area under the loss curve
    explanation: The gradient collects the partial derivatives of the loss with respect to the parameters and points towards the steepest local increase [^1]; gradient descent therefore moves in the negative gradient direction [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 50
      - source: d2l
        locator: Sec. 12.3 Gradient Descent
        url: https://d2l.ai/chapter_optimization/gd.html
        quote: the direction of steepest descent is given by the negative gradient
    source:
      id: ncu-intro-dl
      ref: exercise-02/q11
    status: reviewed
    reviewed_by: owner
  - id: optimization-004
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - convergence
      - gradient-descent
    question: In practice, when does gradient descent stop?
    options:
      - text: When the loss reaches its maximum
      - text: When the gradient becomes very large
        why: A large gradient means the parameters are far from a stationary point.
      - text: Only after a fixed number of steps, regardless of progress
        why: Practical stopping rules also watch how much the updates change.
      - text: When the updates (or the gradient) become very small, or an iteration limit is reached
        correct: true
    explanation: Close to a minimum the gradient — and with it each update — shrinks, while a learning rate that is too large can overshoot instead of settling [^1]. Common stopping rules are therefore "change below a tolerance" or "maximum number of iterations". A near-zero gradient only signals a critical point, not necessarily the global optimum [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 14–15
      - source: d2l
        locator: Sec. 12.1 Optimization and Deep Learning
        url: https://d2l.ai/chapter_optimization/optimization-intro.html
    source:
      id: ncu-intro-dl
      ref: exercise-02/q12
    status: reviewed
    reviewed_by: owner
  - id: optimization-005
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-ex02
      - critical-point
    question: In optimization, what is a critical (stationary) point?
    options:
      - text: A point where learning stops for good
        why: Noise in SGD can move the parameters away again, e.g. from a saddle point.
      - text: A point where the loss is at its maximum
        why: A maximum is only one kind of critical point.
      - text: A point where the gradient of the objective is zero
        correct: true
      - text: A point where the parameters stop changing
        why: Parameters can stall for other reasons, such as a learning rate of zero.
    explanation: Critical points have $\nabla L = 0$. They can be local minima, local maxima or saddle points, so reaching one does not guarantee the global optimum [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 14
      - source: d2l
        locator: Sec. 12.1 Optimization and Deep Learning
        url: https://d2l.ai/chapter_optimization/optimization-intro.html
    source:
      id: ncu-intro-dl
