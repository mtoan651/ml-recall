    reviewed_by: claude
  - id: optimization-068
    type: single
    difficulty: medium
    tags:
      - gradients
      - regularization
      - critical-points
    question: |
      You minimize $f(\mathbf{x}) = g(\mathbf{x}) + h(\mathbf{x})$, for example a data loss $g$ plus a
      regularizer $h$. At a critical point of $f$, how are $\nabla g$ and $\nabla h$ related?
    options:
      - text: They have equal length and point in opposite directions
        correct: true
      - text: Both are zero, so each term is minimized on its own
        why: Only their sum must vanish; usually neither term is at its own minimum.
      - text: They are orthogonal to each other, so neither term can improve
        why: Orthogonal nonzero gradients have a nonzero sum, so $\mathbf{x}$ would not be a critical point.
      - text: They point the same way, so both terms decrease together
        why: Then the sum would be nonzero and a step along $-\nabla f$ would still lower $f$ [^1].
    explanation: |
      A critical point has $\nabla f = \nabla g + \nabla h = 0$ [^1], i.e. $\nabla g = -\nabla h$:
      any small step that lowers $g$ raises $h$ at the same first-order rate, a tug of war in which
      neither term can improve without hurting the other. With weight decay
      $h(\mathbf{w}) = \frac{\lambda}{2}\lVert\mathbf{w}\rVert^2$ this reads
      $\nabla g(\mathbf{w}) = -\lambda\mathbf{w}$. The same picture explains Lagrangians: at the
      constrained optimum the gradient of the objective is offset by the gradient of the
      constraint [^2].
    references:
      - source: d2l
        locator: Sec. 22.4.3 A Note on Mathematical Optimization (a minimum has zero gradient)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#a-note-on-mathematical-optimization
      - source: d2l
        locator: Sec. 12.2.3.1 Lagrangian and Sec. 12.2.3.2 Penalties (weight decay as a penalty)
        url: https://d2l.ai/chapter_optimization/convexity.html#lagrangian
      - source: d2l
        locator: Sec. 22.4.9 Exercises, Exercise 5
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/multivariable-calculus#ex5
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-069
    type: single
    difficulty: hard
    tags:
      - multiple-integrals
      - fubini
      - order-of-integration
    question: |
      For $f(x, y) = \frac{xy(x^2 - y^2)}{(x^2 + y^2)^3}$ on $[0, 2] \times [0, 1]$, the iterated
      integrals are $\int_0^2\int_0^1 f\,dy\,dx = 0.2$ and $\int_0^1\int_0^2 f\,dx\,dy = -0.05$. Why
      can the order of integration change the result?
    options:
      - text: $\iint |f|$ is infinite near the origin, so Fubini's theorem does not apply
        correct: true
      - text: One computation must be wrong, since the order never matters for a rational function
        why: Both values are correct; $f$ is not even defined at the origin, and near it $|f|$ is not integrable [^1].
      - text: The region is not a square, and Fubini's theorem needs equal side lengths
        why: Fubini's theorem works on any rectangle; the shape of the region is not the problem [^2].
      - text: $f$ changes sign on the region, and Fubini's theorem requires $f \ge 0$
        why: Signed integrands are fine as long as $\iint |f| < \infty$; the nonnegative case is Tonelli's theorem [^2].
    explanation: |
      Fubini's theorem lets us swap the order of integration when $\iint |f| < \infty$ [^2]. Here $f$
      behaves like $1/r^2$ near the origin, and in two dimensions $\int |f|\, r\,dr$ diverges like
      $\int dr/r$, so the theorem does not apply and the two orders give $0.2$ and $-0.05$ [^1]. For
      the well-behaved functions of everyday machine learning swapping sums, integrals and
      expectations is safe [^1], but the hypothesis matters whenever we exchange an expectation with
      a sum, an integral or a gradient.
    references:
      - source: d2l
        locator: Sec. 22.5.5 Multiple Integrals (Fubini's theorem and this counterexample)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/integral-calculus.html#multiple-integrals
      - title: "Wikipedia: Fubini's theorem"
        locator: For integrable functions; Tonelli's theorem for non-negative measurable functions; Counterexamples, Failure of Fubini's theorem for non-integrable functions
        url: https://en.wikipedia.org/wiki/Fubini%27s_theorem
      - source: d2l
        locator: Sec. 22.5.8 Exercises, Exercise 4
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/integral-calculus.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/integral-calculus#ex4
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/integral-calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-070
    type: short_answer
    difficulty: medium
    tags:
      - derivatives
      - chain-rule
      - logarithmic-differentiation
    question: Compute the derivative of $f(x) = x^x$ (for $x > 0$) at $x = 2$. Round to 3 decimals.
    answer:
      numeric: 6.773
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $f'(x) = x^x(\ln x + 1)$, so $f'(2) = 4(\ln 2 + 1) \approx 6.773$
    explanation: |
      Neither the power rule (it needs a constant exponent) nor the rule for $e^x$ (it needs a constant
      base) applies directly [^1]. Write $x^x = e^{x \ln x}$ and use the chain and product rules:
      $f'(x) = e^{x \ln x}(\ln x + 1) = x^x(\ln x + 1)$ [^1]. Taking logarithms first,
      $\ln f(x) = x \ln x$, leads to the same result; this is logarithmic differentiation [^2]. At
      $x = 2$: $4(\ln 2 + 1) \approx 4 \times 1.693 = 6.773$.
    references:
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
      - title: 'Wikipedia: Logarithmic differentiation'
        locator: Overview
        url: https://en.wikipedia.org/wiki/Logarithmic_differentiation
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 4
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex4
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-071
    type: single
    difficulty: medium
    tags:
      - derivatives
      - stationary-points
      - second-derivative-test
    question: |
      A smooth function has $f'(0) = 0$ and $f''(0) = 0$. What can you conclude about the point
      $x = 0$?
    options:
      - text: It is not a stationary point, because the second derivative vanishes
        why: A stationary point only requires $f'(0) = 0$; the second derivative plays no part in the definition [^1].
      - text: 'Nothing yet: 0 may be a minimum, a maximum or neither'
        correct: true
      - text: It is a horizontal point of inflection, as for $f(x) = x^3$ at 0
        why: $f(x) = x^4$ also has $f'(0) = f''(0) = 0$, and 0 is its global minimum [^2].
      - text: It is a local minimum, because the function is flat to second order
        why: $f(x) = -x^4$ satisfies both conditions and has a maximum at 0 [^2].
    explanation: |
      $f'(0) = 0$ makes 0 a stationary point, where the tangent is horizontal [^1]. The second-derivative
      test decides only when $f''(0) \neq 0$: positive means a local minimum, negative a local maximum,
      and $f''(0) = 0$ leaves the test inconclusive [^2]. Indeed $x^4$ (a minimum), $-x^4$ (a maximum)
      and $x^3$ (neither) all have $f'(0) = f''(0) = 0$; higher derivatives or the sign of $f'$ on
      either side of 0 must decide. In optimization, such flat points are why a vanishing gradient alone
      does not certify a minimum.
    references:
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
      - title: 'Wikipedia: Derivative test'
        locator: Second-derivative test (single variable)
        url: https://en.wikipedia.org/wiki/Derivative_test#Second-derivative_test_(single_variable)
        quote: If f''(x) = 0, the test is inconclusive.
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 5
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex5
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-072
    type: short_answer
    difficulty: easy
    tags:
      - derivatives
      - tangent-line
    question: |
      The tangent line to $f(x) = x^3 - \frac{1}{x}$ at $x = 1$ is $y = mx + c$. Fill in: $m =$ {{1}}
      and $c =$ {{2}}.
    answer:
      blanks:
        - numeric: 4
          tolerance: 0
          hint: slope
        - numeric: -4
          tolerance: 0
          hint: intercept
      model: $f(1) = 0$ and $f'(x) = 3x^2 + x^{-2}$, so $m = f'(1) = 4$ and $y = 4(x - 1)$, i.e. $c = -4$.
    explanation: |
      The tangent at $x_0$ is the line $y = f(x_0) + f'(x_0)(x - x_0)$, because the derivative gives
      the slope of $f$ at that point [^1]. With the power rule, $\frac{d}{dx}x^3 = 3x^2$ and
      $\frac{d}{dx}(-x^{-1}) = x^{-2}$, so $f'(1) = 3 + 1 = 4$ [^1]. Since $f(1) = 1 - 1 = 0$, the
      tangent is $y = 4(x - 1) = 4x - 4$.
    references:
      - source: d2l
        locator: Sec. 2.4.1 Derivatives and Differentiation
        url: https://d2l.ai/chapter_preliminaries/calculus.html#derivatives-and-differentiation
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 6
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex6
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-073
    type: short_answer
    difficulty: easy
    tags:
      - gradient
      - partial-derivatives
    question: |
      For $f(\mathbf{x}) = 3x_1^2 + 5e^{x_2}$, the gradient at $\mathbf{x} = (2, \ln 3)$ is
      ( {{1}} , {{2}} ).
    answer:
      blanks:
        - numeric: 12
          tolerance: 0
          hint: a number
        - numeric: 15
          tolerance: 0.001
          hint: a number
      model: $\nabla f = (6x_1, 5e^{x_2}) = (12, 15)$
    explanation: |
      The gradient collects the partial derivatives, and each partial derivative treats the other
      variables as constants [^1]. So $\partial f / \partial x_1 = 6x_1$, because the second term does
      not depend on $x_1$, and $\partial f / \partial x_2 = 5e^{x_2}$. At $(2, \ln 3)$ the gradient is
      $(12, 5 \cdot 3) = (12, 15)$.
    references:
      - source: d2l
        locator: Sec. 2.4.3 Partial Derivatives and Gradients
        url: https://d2l.ai/chapter_preliminaries/calculus.html#partial-derivatives-and-gradients
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 7
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex7
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-074
    type: short_answer
    difficulty: medium
    tags:
      - chain-rule
      - multivariate-calculus
    question: |
      Let $u = f(x, y, z) = x^2 + yz$ with $x = a + b$, $y = ab$ and $z = a - b$. Use the
      multivariate chain rule to compute $\partial u / \partial a$ at $(a, b) = (1, 2)$.
    answer:
      numeric: 6
      tolerance: 0.001
      hint: an integer
      model: $2x \cdot 1 + z \cdot b + y \cdot 1 = 2 \cdot 3 + (-1) \cdot 2 + 2 = 6$
    explanation: |
      When $u$ depends on $a$ through several intermediate variables, the chain rule adds one term per
      path:
      $\frac{\partial u}{\partial a} = \frac{\partial u}{\partial x}\frac{\partial x}{\partial a} + \frac{\partial u}{\partial y}\frac{\partial y}{\partial a} + \frac{\partial u}{\partial z}\frac{\partial z}{\partial a}$
      [^1]. The factors are $2x$ and $1$, $z$ and $b$, and $y$ and $1$; at $(1, 2)$ we have $x = 3$,
      $y = 2$ and $z = -1$, so the sum is $6 - 2 + 2 = 6$. Substituting first,
      $u = (a + b)^2 + a^2 b - ab^2$, and differentiating gives $2(a + b) + 2ab - b^2 = 6$ as well
      [^2].
    references:
      - source: d2l
        locator: Sec. 2.4.4 Chain Rule
        url: https://d2l.ai/chapter_preliminaries/calculus.html#chain-rule
      - title: 'Wikipedia: Chain rule'
        locator: Multivariable case
        url: https://en.wikipedia.org/wiki/Chain_rule#Multivariable_case
      - source: d2l
        locator: Sec. 2.4.6 Exercises, Exercise 9
        url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/calculus#ex9
      url: https://d2l.ai/chapter_preliminaries/calculus.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: optimization-075
    type: short_answer
    difficulty: medium
    tags:
      - derivatives
      - inverse-function
    question: |
      $f(x) = x^3 + x$ is increasing and invertible, and $f(1) = 2$. What is the derivative of its
      inverse at 2, $(f^{-1})'(2)$?
    answer:
      numeric: 0.25
      tolerance: 0.001
      hint: a number
      model: $(f^{-1})'(2) = 1 / f'(f^{-1}(2)) = 1 / f'(1) = 1/4$
    explanation: |
      Differentiate $f(f^{-1}(y)) = y$ with the chain rule: $f'(f^{-1}(y)) \cdot (f^{-1})'(y) = 1$
      [^1], hence $(f^{-1})'(y) = 1 / f'(f^{-1}(y))$ [^2]. Since $f(1) = 2$, $f^{-1}(2) = 1$, and
      $f'(x) = 3x^2 + 1$ gives $f'(1) = 4$, so the answer is $1/4$. You never need a formula for
      $f^{-1}$ itself, which here would mean solving a cubic.
    references:
      - source: d2l
        locator: Sec. 2.4.4 Chain Rule
