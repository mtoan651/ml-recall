  - id: optimization-020
    type: single
    difficulty: medium
    question: The region in the first quadrant bounded by the $x$-axis and the curve $y = \frac{x}{1 + x^3}$, $x \ge 0$, is rotated about the $x$-axis. What is the volume of the solid generated?
    options:
      - text: $\pi/3$
        correct: true
      - text: $\pi/4$
        why: $\int_0^\infty \frac{x^2}{(1 + x^3)^2}\,dx = \frac13$, so the volume is $\pi/3$, not $\pi/4$.
      - text: $\pi$
        why: This drops the factor $\frac13$ that comes from $du = 3x^2\,dx$; the integral is $\frac13$, not 1.
      - text: $2\pi$
        why: The disk method gives $V = \pi \int_0^\infty f(x)^2\,dx = \pi \cdot \frac13$; $2\pi$ is six times too large.
    explanation: By the disk method the volume is $V = \pi \int_0^\infty f(x)^2\,dx = \pi \int_0^\infty \frac{x^2}{(1 + x^3)^2}\,dx$ [^1]. The substitution $u = 1 + x^3$, $du = 3x^2\,dx$ turns the integrand into $\frac{1}{3u^2}$ [^2], so the improper integral is $\lim_{b \to \infty} \left[-\frac{1}{3(1 + x^3)}\right]_0^b = \frac{1}{3}$ [^3]. Hence $V = \pi/3$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-2-volume.html#sec-6-2-volume-4
        locator: Sec. 6.2.2 The Volume of a Solid of Revolution
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-5-3-substitution.html
        locator: Sec. 5.3 Integration by substitution
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-5-improper.html#sec-6-5-improper-4
        locator: Sec. 6.5.2 Improper Integrals Involving Unbounded Intervals
    source:
      id: mmlu-redux
      ref: college_mathematics/47
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=47
    status: reviewed
    reviewed_by: claude
  - id: optimization-021
    type: single
    difficulty: medium
    question: If $f$ is a continuously differentiable real-valued function defined on the open interval $(-1, 4)$ such that $f(3) = 5$ and $f'(x) \ge -1$ for all $x$, what is the greatest possible value of $f(0)$?
    options:
      - text: '3'
        why: '$f(0)$ can exceed $f(3) = 5$: with slope at least $-1$, $f$ can drop by up to 3 from 0 to 3, so $f(0) \le 8$, reached by $f(x) = 8 - x$.'
      - text: '4'
        why: $f(x) = 8 - x$ has $f(3) = 5$ and $f' = -1 \ge -1$, so $f(0)$ can be 8, more than 4.
      - text: '5'
        why: 5 assumes $f$ cannot decrease, but $f' \ge -1$ lets $f$ fall by up to 3 between 0 and 3, so $f(0)$ can be 8.
      - text: '8'
        correct: true
    explanation: By the mean value theorem there is a $c$ in $(0, 3)$ with $f(3) - f(0) = 3f'(c)$ [^1]. Since $f'(c) \ge -1$, $f(3) - f(0) \ge -3$, so $f(0) \le f(3) + 3 = 8$. The bound is reached by $f(x) = 8 - x$, whose slope is exactly $-1$; the answer 5 would only hold if $f$ could not decrease.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_mvt.html
        locator: Sec. 2.13 The Mean Value Theorem, Theorem 2.13.5
    source:
      id: mmlu-redux
      ref: college_mathematics/51
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=51
    status: reviewed
    reviewed_by: claude
  - id: optimization-022
    type: single
    difficulty: easy
    question: How many real roots does the polynomial $2x^5 + 8x - 7$ have?
    options:
      - text: None
        why: $p(0) = -7 < 0 < 3 = p(1)$, so the intermediate value theorem gives a real root (every odd-degree polynomial has one).
      - text: One
        correct: true
      - text: Two
        why: $p'(x) = 10x^4 + 8 > 0$, so $p$ is strictly increasing and crosses zero only once.
      - text: Three
        why: A strictly increasing polynomial ($p'(x) = 10x^4 + 8 > 0$) has at most one real root.
    explanation: Let $p(x) = 2x^5 + 8x - 7$. Its derivative $p'(x) = 10x^4 + 8$ is positive everywhere, so $p$ is strictly increasing [^1] and can cross zero at most once. Since $p(0) = -7 < 0$ and $p(1) = 3 > 0$, the intermediate value theorem gives a root between 0 and 1 [^2]. So there is exactly one real root; the other four roots are complex.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_mvt.html
        locator: Sec. 2.13 The Mean Value Theorem, Corollary 2.13.12
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_1_6.html
        locator: Sec. 1.6 Continuity, Theorem 1.6.12 Intermediate value theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/54
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=54
    status: reviewed
    reviewed_by: claude
  - id: optimization-023
    type: single
    difficulty: medium
    question: Water drips out of a hole at the vertex of an upside-down cone at a rate of 3 cm³ per minute. The cone's height and radius are 2 cm and 1 cm, respectively. At what rate does the height of the water change when the water level is half a centimeter below the top of the cone? The volume of a cone is $V = \frac{\pi}{3} r^2 h$, where $r$ is the radius and $h$ is the height of the cone.
    options:
      - text: $-\frac{48}{\pi}$ cm/min
        why: This uses $h = 0.5$, the distance below the rim, instead of the water depth $h = 1.5$.
      - text: $-\frac{4}{3\pi}$ cm/min
        why: This takes the water radius equal to the depth, $r = h$; similar triangles give $r = h/2$.
      - text: $-\frac{8}{3\pi}$ cm/min
        why: 'Off by a factor 2: $V = \pi h^3/12$ gives $dV/dh = \pi h^2/4$, not $\pi h^2/2$.'
      - text: $-\frac{16}{3\pi}$ cm/min
        correct: true
    explanation: By similar triangles the water's radius is half its depth, $r = h/2$, so $V = \frac{\pi}{3}\left(\frac{h}{2}\right)^2 h = \frac{\pi h^3}{12}$. Differentiating with respect to time, the core step of every related-rates problem [^1], gives $\frac{dV}{dt} = \frac{\pi h^2}{4}\frac{dh}{dt}$. With $\frac{dV}{dt} = -3$ and depth $h = 2 - 0.5 = 1.5$, $\frac{dh}{dt} = \frac{-12}{\pi (1.5)^2} = -\frac{16}{3\pi}$ cm/min. Using $h = 0.5$, the distance below the rim, instead of the depth gives $-48/\pi$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-1-rel-rates.html#sec-3-1-rel-rates-4
        locator: Sec. 3.1.2 Related Rates Problems
    source:
      id: mmlu-redux
      ref: college_mathematics/63
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=63
    status: reviewed
    reviewed_by: claude
  - id: optimization-024
    type: single
    difficulty: medium
    question: |
      Which of the following are valid intervals of convergence for a power series?

      (I) $[-1, 3)$

      (II) $(-\infty, 0]$

      (III) $[2, 2] \cup [3, 3]$

      (IV) $(-\infty, \infty)$
    options:
      - text: Only (II)
        why: A power series converges on an interval symmetric about its centre (endpoints aside), so a half-line such as $(-\infty, 0]$ is impossible.
      - text: Only (IV)
        why: '(I) is possible as well: $[-1, 3)$ has centre 1 and radius 2 with one endpoint included, as for $\sum_{n \ge 1} \frac1n\left(\frac{x - 1}{2}\right)^n$.'
      - text: (I) and (IV)
        correct: true
      - text: (II) and (III)
        why: 'Neither can occur: the set of convergence is a single point, an interval symmetric about the centre, or the whole line.'
    explanation: A power series $\sum A_n (x - c)^n$ converges either for every $x$, or only at $x = c$, or for $|x - c| < R$ and not for $|x - c| > R$, with each endpoint checked separately [^1]. $[-1, 3)$ is centred at $c = 1$ with $R = 2$ and includes one endpoint, which happens for example with $\sum_{n \ge 1} \frac{1}{n}\left(\frac{x - 1}{2}\right)^n$; $(-\infty, \infty)$ is the case $R = \infty$. A half-line such as $(-\infty, 0]$ is not symmetric about any centre, and two separate points cannot occur either, so only (I) and (IV) are possible.
    references:
      - title: CLP-2 Integral Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP2/clp_2_ic/chap_seq_ser-7.html
        locator: Sec. 3.5.1 Radius and Interval of Convergence, Theorem 3.5.9 and Definition 3.5.10
    source:
      id: mmlu-redux
      ref: college_mathematics/67
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=67
    status: reviewed
    reviewed_by: claude
  - id: optimization-025
    type: single
    difficulty: easy
    question: In the $xy$-plane, the curve with parametric equations $x = \cos t$ and $y = \sin t$, $0 \le t \le \pi$, has length
    options:
      - text: $3$
        why: The speed is 1, so the length equals the time span $\pi \approx 3.14$, not 3.
      - text: $\pi$
        correct: true
      - text: $3\pi$
        why: $3\pi$ would be one and a half full circles; $t \in [0, \pi]$ traces only the upper half of the unit circle.
      - text: $\frac{3}{2}$
        why: The speed $\sqrt{\sin^2 t + \cos^2 t} = 1$, so $L = \int_0^\pi 1\,dt = \pi$, not $\frac32$.
    explanation: The length of a parametric curve is the integral of its speed, $L = \int_a^b \sqrt{x'(t)^2 + y'(t)^2}\,dt$ [^1]. Here $x'(t)^2 + y'(t)^2 = \sin^2 t + \cos^2 t = 1$, so $L = \int_0^\pi 1\,dt = \pi$. Geometrically, the curve is the upper half of the unit circle, half of the circumference $2\pi$.
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-VVF-ArcLength.html#S-VVF-ArcLength-4
        locator: Sec. 10.4.2 Arc Length, Definition 10.4.4 and formula (10.4.1)
    source:
      id: mmlu-redux
      ref: college_mathematics/68
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=68
    status: reviewed
    reviewed_by: claude
  - id: optimization-026
    type: single
    difficulty: easy
    question: In the $xy$-plane, the graph of $x^{\log y} = y^{\log x}$ is
    options:
      - text: the open first quadrant
        correct: true
      - text: a closed curve
        why: Every point with $x, y > 0$ satisfies the equation, so the graph is a two-dimensional region, not a curve.
      - text: a ray in the open first quadrant
        why: The equation holds for all $x, y > 0$, not only on a ray such as $y = x$.
      - text: a single point
        why: $x^{\log y} = e^{\log x \log y} = y^{\log x}$ for every positive $x$ and $y$, so infinitely many points satisfy it.
    explanation: Both sides are defined only for $x > 0$ and $y > 0$, since $\log$ needs a positive argument [^1]. For such points, using $a = e^{\log a}$ and $\log(a^b) = b \log a$ [^1], $x^{\log y} = e^{\log y \cdot \log x}$ and $y^{\log x} = e^{\log x \cdot \log y}$. The two sides are always equal, so every point with $x, y > 0$ satisfies the equation and the graph is the whole open first quadrant.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_diff_logs.html
        locator: Sec. 2.10 The Natural Logarithm (properties of log)
    source:
      id: mmlu-redux
      ref: college_mathematics/69
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=69
    status: reviewed
    reviewed_by: claude
  - id: optimization-027
    type: single
    difficulty: medium
    question: The region bounded by the curves $y = x$ and $y = x^2$ in the first quadrant of the $xy$-plane is rotated about the $y$-axis. The volume of the resulting solid of revolution is
    options:
      - text: $\pi/12$
        why: 'This is the shell integral without its factor 2: $V = 2\pi \int_0^1 x(x - x^2)\,dx = \pi/6$.'
      - text: $\pi/6$
        correct: true
      - text: $\pi/3$
        why: $\pi/3$ is the volume of the inner solid alone (radius $y$); the washer subtracts it from the outer one, $\pi/2 - \pi/3 = \pi/6$.
      - text: $2\pi/3$
        why: 'This uses shells of height $x$ instead of $x - x^2$: $2\pi \int_0^1 x \cdot x\,dx = 2\pi/3$.'
    explanation: 'The curves meet at $(0, 0)$ and $(1, 1)$. Slicing perpendicular to the $y$-axis gives washers: at height $y$ the outer radius is $x = \sqrt{y}$ (from $y = x^2$) and the inner radius is $x = y$ (from $y = x$) [^1]. So $V = \int_0^1 \pi\left[(\sqrt{y})^2 - y^2\right]dy = \pi\left(\frac{1}{2} - \frac{1}{3}\right) = \frac{\pi}{6}$.'
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-2-volume.html#sec-6-2-volume-5
        locator: Sec. 6.2.3 Revolving about the y-axis (washers)
    source:
      id: mmlu-redux
      ref: college_mathematics/76
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=76
    status: reviewed
    reviewed_by: claude
  - id: optimization-028
    type: single
    difficulty: hard
    question: The curves $y = (\sin x + \cos x)^4$ and $y = (\sin x - \cos x)^4$ intersect at $x = 0$. If $a$ is the smallest positive value of $x$ at which these curves next intersect, determine the area between these curves from $x = 0$ to $x = a$.
    options:
      - text: $2$
        why: The difference $(1 + \sin 2x)^2 - (1 - \sin 2x)^2$ is $4\sin 2x$, not $2\sin 2x$, so the area is 4.
      - text: $\pi$
        why: $\int_0^{\pi/2} 4\sin 2x\,dx = \left[-2\cos 2x\right]_0^{\pi/2} = 4$, not $\pi$.
      - text: $4$
        correct: true
      - text: $\frac{3\pi}{2}$
        why: $3\pi/2$ is the integral of the *sum* of the two curves; the area between them integrates their difference, $4\sin 2x$.
    explanation: 'Since $(\sin x \pm \cos x)^2 = 1 \pm 2\sin x\cos x = 1 \pm \sin 2x$, the curves are $(1 + \sin 2x)^2$ and $(1 - \sin 2x)^2$. They meet where $\sin 2x = 0$, so the next intersection after 0 is $a = \pi/2$. On $[0, \pi/2]$ the curve $(1 + \sin 2x)^2$ is on top, and the area between the curves is the integral of the difference [^1]: $\int_0^{\pi/2} \left[(1 + \sin 2x)^2 - (1 - \sin 2x)^2\right] dx = \int_0^{\pi/2} 4\sin 2x\,dx = \left[-2\cos 2x\right]_0^{\pi/2} = 4$.'
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-1-area.html#sec-6-1-area-4
        locator: Sec. 6.1.2 The Area Between Two Curves
    source:
      id: mmlu-redux
      ref: college_mathematics/83
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=83
    status: reviewed
    reviewed_by: claude
  - id: optimization-029
    type: single
    difficulty: medium
    question: A ladder 9 meters in length is leaning against a vertical wall on level ground. As the bottom end of the ladder is moved away from the wall at a constant rate of 2 meters per second, the top end slides downward along the wall. How fast, in meters per second, will the top end of the ladder be sliding downward at the moment the top end is 3 meters above the ground?
    options:
      - text: $12\sqrt{2}$
        why: 'This forgets to divide by $y = 3$: $\frac{dy}{dt} = -\frac{x}{y}\frac{dx}{dt}$.'
      - text: $6\sqrt{2}$
        why: $6\sqrt{2}$ is the distance $x$ from the wall at that moment, not a rate.
      - text: $4\sqrt{2}$
        correct: true
      - text: $\frac{1}{2\sqrt{2}}$
        why: $\frac{1}{2\sqrt2}$ is the ratio $y/x$, upside down and without the factor $\frac{dx}{dt}$; the rate is $\frac{x}{y}\frac{dx}{dt} = 2\sqrt{2} \cdot 2 = 4\sqrt{2}$.
    explanation: Let $x$ be the distance from the foot of the ladder to the wall and $y$ the height of the top, so $x^2 + y^2 = 81$. Differentiating with respect to time gives $2x\frac{dx}{dt} + 2y\frac{dy}{dt} = 0$ [^1]. When $y = 3$, $x = \sqrt{72} = 6\sqrt{2}$, and with $\frac{dx}{dt} = 2$ we get $\frac{dy}{dt} = -\frac{x}{y}\frac{dx}{dt} = -\frac{6\sqrt{2} \cdot 2}{3} = -4\sqrt{2}$. So the top slides down at $4\sqrt{2} \approx 5.66$ m/s; $12\sqrt{2}$ forgets to divide by $y$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-1-rel-rates.html#sec-3-1-rel-rates-4
        locator: Sec. 3.1.2 Related Rates Problems
    source:
      id: mmlu-redux
      ref: college_mathematics/91
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=91
    status: reviewed
    reviewed_by: claude
  - id: optimization-030
    type: single
    difficulty: easy
    question: What is the greatest possible area of a triangular region with one vertex at the center of a circle of radius 1 and the other two vertices on the circle?
    options:
      - text: $\frac{1}{2}$
        correct: true
      - text: $1$
        why: 1 is the area of the square on the two radii; the triangle has half of it, $\frac12 \cdot 1 \cdot 1 \cdot \sin 90^\circ$.
      - text: $\sqrt{2}$
        why: $\sqrt{2}$ is the length of the third side when the radii are perpendicular, not an area.
      - text: $\pi$
        why: $\pi$ is the area of the whole disc; a triangle with two radii as sides has area at most $\frac12$.
    explanation: Two sides of the triangle are radii of length 1 with angle $\theta$ between them, so the area is $A(\theta) = \frac{1}{2}\sin\theta$ for $0 < \theta < \pi$. $A'(\theta) = \frac{1}{2}\cos\theta$ is zero only at $\theta = \pi/2$, where $A = \frac{1}{2}$, and the area tends to 0 at both ends of the interval, so this critical point gives the global maximum [^1]. The value 1 is the area of the square spanned by the two radii, not of the triangle.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-5-optimization.html#sec-3-5-optimization-4
        locator: Sec. 3.5.2 Global Optimization
    source:
