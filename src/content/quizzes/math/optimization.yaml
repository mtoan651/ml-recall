  - id: optimization-089
    type: short_answer
    difficulty: medium
    tags:
      - automatic-differentiation
      - forward-mode
      - tangent
    question: |
      Forward-mode automatic differentiation evaluates $f(x_1, x_2) = \ln x_1 + x_1 x_2$ at
      $(x_1, x_2) = (e^2, \pi)$ through the trace $v_1 = \ln x_1$, $v_2 = x_1 x_2$, $f = v_1 + v_2$,
      carrying a tangent $\dot v$ along with every value. With the seeds $\dot x_1 = 1$ and
      $\dot x_2 = 0$, what tangent $\dot f$ comes out? Round to 3 decimals.
    answer:
      numeric: 3.277
      tolerance: 0.002
      hint: a number, 3 decimals
      model: $\dot v_1 = \dot x_1 / x_1 = e^{-2}$, $\dot v_2 = \dot x_1 x_2 + x_1 \dot x_2 = \pi$, $\dot f = e^{-2} + \pi \approx 3.277$
    explanation: |
      Each step of the trace applies the derivative rule of its operation to the incoming tangents:
      $\dot v_1 = \dot x_1 / x_1 = e^{-2} \approx 0.135$ and $\dot v_2 = \dot x_1 x_2 + x_1 \dot x_2 = \pi$,
      so $\dot f = \dot v_1 + \dot v_2 \approx 3.277$ [^1][^2]. The seed $(\dot x_1, \dot x_2) = (1, 0)$
      selects the partial derivative $\partial f / \partial x_1 = 1/x_1 + x_2$; seeding $(0, 1)$ in a second
      pass would give $\partial f / \partial x_2 = x_1 = e^2$ [^2].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-131, pp. 142–143; Solution SOL-131, Table 5.3, pp. 168–172
        url: https://arxiv.org/abs/2201.00650v2
      - title: Baydin et al. (2018), Automatic Differentiation in Machine Learning, a Survey (JMLR)
        locator: Sec. 3.1 Forward Mode and Table 2
        url: https://arxiv.org/abs/1502.05767
    source:
      id: dl-interviews
      ref: ch5#prb131
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-090
    type: short_answer
    difficulty: medium
    tags:
      - automatic-differentiation
      - dual-numbers
    question: |
      Dual numbers $a + b\varepsilon$ with $\varepsilon^2 = 0$ carry a value and a derivative together.
      Evaluate $g(x) = 5x^2 + 4x + 1$ at the dual number $5 + \varepsilon$ and write the result as
      $a + b\varepsilon$: $a$ = {{1}} and $b$ = {{2}}.
    answer:
      blanks:
        - numeric: 146
          tolerance: 0
          hint: a whole number
        - numeric: 54
          tolerance: 0
          hint: a whole number
      model: $g(5 + \varepsilon) = 5(25 + 10\varepsilon) + 4(5 + \varepsilon) + 1 = 146 + 54\varepsilon$
    explanation: |
      $(5 + \varepsilon)^2 = 25 + 10\varepsilon + \varepsilon^2 = 25 + 10\varepsilon$, so
      $g(5 + \varepsilon) = 125 + 50\varepsilon + 20 + 4\varepsilon + 1 = 146 + 54\varepsilon$ [^1]. In
      general $g(x + \dot x\varepsilon) = g(x) + g'(x)\dot x\,\varepsilon$: the real part is $g(5) = 146$ and
      the $\varepsilon$ part is $g'(5) = 10 \cdot 5 + 4 = 54$ [^2]. This is how forward-mode AD obtains
      exact derivatives with ordinary arithmetic, without symbolic manipulation or finite differences.
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-127, p. 140; Solution SOL-127, Eqs. (5.65)–(5.72), pp. 165–166
        url: https://arxiv.org/abs/2201.00650v2
      - title: Baydin et al. (2018), Automatic Differentiation in Machine Learning, a Survey (JMLR)
        locator: Sec. 3.1.1 Dual Numbers, Eq. (5)
        url: https://arxiv.org/abs/1502.05767
    source:
      id: dl-interviews
      ref: ch5#prb127
      url: https://arxiv.org/abs/2201.00650v2
