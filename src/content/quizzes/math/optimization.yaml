    status: reviewed
    reviewed_by: owner
  - id: optimization-006
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
    question: What is the core goal of optimization in deep learning?
    options:
      - text: Adjust the parameters so that the loss becomes as small as possible
        correct: true
      - text: Increase the number of target labels
      - text: Remove the validation set
      - text: Replace the input features with the labels
    explanation: Optimization updates the weights and biases to minimize the loss, i.e. to reduce the difference between predictions and targets [^1][^2].
