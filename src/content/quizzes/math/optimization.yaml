  - id: optimization-095
    type: single
    difficulty: medium
    tags:
      - derivatives
      - monotonicity
      - critical-points
    question: On which intervals is $f(x) = \dfrac{x^2 + 1}{(x + 2)^2}$ increasing?
    options:
      - text: On $(-\infty, -2)$ and on $(\tfrac12, \infty)$
        correct: true
      - text: Only on $(\tfrac12, \infty)$
        why: For $x < -2$ both $2x - 1$ and $(x + 2)^3$ are negative, so $f'(x) > 0$ there too.
      - text: On $(-2, \tfrac12)$
        why: There $2x - 1 < 0$ and $(x + 2)^3 > 0$, so $f'(x) < 0$ and $f$ decreases.
      - text: On $(-\infty, \tfrac12)$, with a minimum at $x = -2$
        why: $f$ is not defined at $x = -2$ and tends to $+\infty$ on both sides of it.
    explanation: |
      By the quotient rule,
      $f'(x) = \dfrac{2x(x + 2)^2 - 2(x^2 + 1)(x + 2)}{(x + 2)^4} = \dfrac{2(2x - 1)}{(x + 2)^3}$
      for $x \ne -2$ [^1][^2]. The sign is positive where $2x - 1$ and $x + 2$ have the same sign: for
      $x > \tfrac12$ and for $x < -2$. The only critical point, $x = \tfrac12$, is the global minimum
      $f(\tfrac12) = 0.2$, since $f \to 1$ as $x \to -\infty$ and $f \to \infty$ near $x = -2$.
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-115, pp. 131–132; Solution SOL-115, Eq. (5.44), p. 154
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.3.2.2 Derivative Rules
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/single-variable-calculus.html#derivative-rules
    source:
      id: dl-interviews
      ref: ch5#prb115
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-096
    type: short_answer
    difficulty: hard
    tags:
      - numerical-differentiation
      - floating-point
      - rounding-error
    question: |
      In float64, the forward difference $\big((1 + h)^2 - 1^2\big)/h$ estimates the derivative of $x^2$ at
      $x = 1$, which is 2. What does it return for $h = 10^{-15}$? Round to 2 decimals.
    answer:
      numeric: 2.22
      tolerance: 0.01
      hint: a number, 2 decimals
      model: $1 + 10^{-15}$ is stored as $1 + 5 \cdot 2^{-52} \approx 1 + 1.11 \times 10^{-15}$, so the result is $\approx 2.22 \times 10^{-15} / 10^{-15} = 2.22$
    explanation: |
      Near 1, float64 numbers are spaced $2^{-52} \approx 2.22 \times 10^{-16}$ apart, so $1 + 10^{-15}$
      is rounded to $1 + 5 \cdot 2^{-52} \approx 1 + 1.11 \times 10^{-15}$ [^2]. Squaring and subtracting 1
      leaves about $2.22 \times 10^{-15}$, and dividing by the *intended* step $10^{-15}$ gives 2.22, an
      11% error. The truncation error of the forward difference shrinks with $h$, but the rounding error
      grows like $\epsilon / h$, which is why the formula is numerically unstable for small $h$ [^1] and
      why steps near $\sqrt{\epsilon} \approx 10^{-8}$ work best [^2].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-100, pp. 125–126; Solution SOL-100, Eq. (5.28), p. 146
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Numerical differentiation'
        url: https://en.wikipedia.org/wiki/Numerical_differentiation
        locator: Step size
    source:
      id: dl-interviews
      ref: ch5#prb100
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: optimization-097
    type: short_answer
    difficulty: easy
    tags:
      - partial-derivatives
      - gradient
      - reverse-mode
    question: |
      An expression graph computes $g(A, B, C) = A + B \ln C$. At $(A, B, C) = (1, 3, 2)$ its partial
      derivatives are $\partial g / \partial A$ = {{1}}, $\partial g / \partial B$ = {{2}} and
      $\partial g / \partial C$ = {{3}}. Round to 3 decimals where needed.
    answer:
      blanks:
        - numeric: 1
          tolerance: 0.001
          hint: a number
        - numeric: 0.693
          tolerance: 0.001
          hint: 3 decimals
        - numeric: 1.5
          tolerance: 0.001
          hint: a number
      model: $\partial g/\partial A = 1$, $\partial g/\partial B = \ln C = \ln 2 \approx 0.693$, $\partial g/\partial C = B/C = 1.5$
    explanation: |
      Treating the other variables as constants: $A$ enters linearly, so its partial derivative is 1;
      $\partial(B \ln C)/\partial B = \ln C = \ln 2 \approx 0.693$; and $\partial(B \ln C)/\partial C = B/C = 1.5$
      [^1][^2]. Reverse-mode AD obtains all three from one backward pass through the graph, starting with
      $\bar g = 1$ and multiplying by the local derivative at each node [^3].
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-128, Fig. 5.11, p. 141; Solution SOL-128, Eq. (5.75), p. 167
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 2.4.3 Partial Derivatives and Gradients
        url: https://d2l.ai/chapter_preliminaries/calculus.html#partial-derivatives-and-gradients
      - title: Baydin et al. (2018), Automatic Differentiation in Machine Learning, a Survey (JMLR)
        locator: Sec. 3.2 Reverse Mode
        url: https://arxiv.org/abs/1502.05767
