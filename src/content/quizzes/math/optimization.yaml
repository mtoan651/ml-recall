  - id: optimization-018
    type: single
    difficulty: easy
    question: Let $f(x)$ be a function whose graph passes through the origin. If $f(2n) = n^2 + f(2(n - 1))$ for every integer $n$, what is the value of $f(8)$?
    options:
      - text: '24'
      - text: '30'
        correct: true
      - text: '32'
      - text: '36'
    explanation: Write $a_n = f(2n)$. The recurrence says $a_n - a_{n-1} = n^2$, and $a_0 = f(0) = 0$ because the graph passes through the origin. Adding these differences telescopes to $a_n - a_0 = \sum_{k=1}^{n} k^2$ [^1]. So $f(8) = a_4 = 1 + 4 + 9 + 16 = 30$; note that $f(8)$ is $a_4$, not $a_8$.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_recurrence.html
        locator: Sec. 2.4 Solving Recurrence Relations (telescoping)
    source:
      id: mmlu-redux
      ref: college_mathematics/31
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=31
    status: draft
  - id: optimization-019
    type: true_false
    difficulty: easy
    question: "True or false: if $f : [a, b] \\to \\mathbb{R}$ has a local maximum at a point $c$ of $[a, b]$, then $f'(c)$ must exist and equal 0."
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: False. A local extremum forces $f'(c) = 0$ only at an interior point where the derivative exists [^1]. The maximum can sit at a corner where $f$ is not differentiable, as $-|x|$ peaks at $x = 0$, or at an endpoint of the interval, as $f(x) = x$ on $[0, 1]$ peaks at $x = 1$ where $f'(1) = 1$ [^1]. That is why the search for a maximum on a closed interval checks critical points, singular points and the endpoints [^2].
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_optimise.html
        locator: Sec. 3.5 Optimisation, Theorem 3.5.4 and Definition 3.5.6 (critical and singular points)
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-5-optimization.html#sec-3-5-optimization-4
        locator: Sec. 3.5.2 Global Optimization
    source:
      id: mmlu-redux
      ref: college_mathematics/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=33
