  - id: optimization-140
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - adam
      - bias-correction
    question: Why does Adam divide its moving averages by $1 - \beta_1^t$ and $1 - \beta_2^t$?
    options:
      - text: The averages start at zero, which biases early estimates toward zero
        correct: true
      - text: To shrink the effective learning rate step by step as training goes on, like a decay schedule
        why: The factors $1 - \beta^t$ approach 1, so the correction fades away; it is not a learning-rate schedule.
      - text: To prevent a division by zero when the second moment is zero
        why: That is the job of the small constant $\varepsilon$ in the denominator.
      - text: To remove the noise that mini-batch sampling adds to every gradient
        why: The averaging over steps smooths noise; the correction only rescales the averages to undo the zero start.
    explanation: |
      With $m_0 = v_0 = 0$, the averages after $t$ steps give the observed gradients a total weight
      of only $1 - \beta^t$, so early on they underestimate the true moments, strongly so for
      $\beta_2 = 0.999$ [^2][^3]. Dividing by $1 - \beta^t$ renormalizes these weights to sum to 1
      [^1][^2]. As $t$ grows the factors approach 1 and the correction disappears.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 46
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
        locator: Sec. 12.10.1 The Algorithm, eq. (12.10.2)
      - title: 'Kingma & Ba (2015), Adam: A Method for Stochastic Optimization, arXiv:1412.6980'
        url: https://arxiv.org/abs/1412.6980
        locator: Sec. 3 Initialization bias correction
    source:
      id: ncu-intro-dl
      ref: lecture-03/q50
    status: reviewed
    reviewed_by: claude
  - id: optimization-141
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - adam
      - optimizer-choice
    question: |
      You start training a new architecture and have little time to tune the optimizer. Which choice
      do common guidelines suggest, and what does it cost compared with plain SGD?
    options:
      - text: Adam; it stores two extra moving averages per parameter and does a little more work per step
        correct: true
      - text: AdaGrad; its accumulated gradient sums make it the most robust choice for long runs
        why: AdaGrad's ever-growing sums shrink the steps until learning can stall in long runs.
      - text: Full-batch gradient descent; its only cost is noisier steps than SGD takes
        why: Full-batch steps are the least noisy of all; their cost is a pass over the entire dataset per update.
      - text: Plain SGD; it has no learning rate that needs tuning
        why: Plain SGD is sensitive to its learning rate, which usually needs careful tuning.
    explanation: |
      Adam combines momentum with per-parameter step sizes; it works well across many architectures
      and its hyperparameters typically need little tuning, which makes it a common default
      [^1][^2]. The price is state and computation: it keeps a first- and a second-moment estimate
      for every parameter and does a few more operations per step than SGD [^1][^3]. On some tasks
      well-tuned SGD still generalizes better [^4], so the default is a starting point, not a rule.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 47–48, 51
      - title: 'Kingma & Ba (2015), Adam: A Method for Stochastic Optimization, arXiv:1412.6980'
        url: https://arxiv.org/abs/1412.6980
        locator: Abstract
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
        locator: Sec. 12.10.1 The Algorithm (state variables)
      - title: Wilson et al. (2017), The Marginal Value of Adaptive Gradient Methods in Machine Learning, arXiv:1705.08292
        url: https://arxiv.org/abs/1705.08292
        locator: Abstract
    source:
      id: ncu-intro-dl
      ref: lecture-03/q51
    status: reviewed
    reviewed_by: claude
  - id: optimization-142
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l03
      - rosenbrock
      - ill-conditioning
    question: |
      The Rosenbrock function, a standard test problem for optimizers, is
      $f(x, y) = 100(y - x^2)^2 + (1 - x)^2$; its minimum $f = 0$ lies at $(1, 1)$. At the point $(0, 0.5)$, the partial
      derivative with respect to $x$ is {{1}} and the partial derivative with respect to $y$ is
      {{2}}.
    answer:
      blanks:
        - numeric: -2
          tolerance: 0.001
          hint: a number
        - numeric: 100
          tolerance: 0.001
          hint: a number
      model: $\partial f/\partial x = -2(1 - x) - 400x(y - x^2) = -2$ and $\partial f/\partial y = 200(y - x^2) = 100$ at $(0, 0.5)$.
    explanation: |
      The minimum lies at the end of a long, curved, nearly flat valley along $y = x^2$, whose walls
      are very steep because of the factor 100 [^2]. At $(0, 0.5)$, off the valley floor, the
      gradient $(-2, 100)$ points almost entirely across the valley rather than toward $(1, 1)$, so
      a gradient step mostly drops back to the floor and makes little progress toward the minimum.
      At the minimum the Hessian's eigenvalues are about $0.4$ and $1002$: this ill-conditioning
      makes plain gradient descent zig-zag, and momentum and adaptive step sizes are designed to
      cope with it [^1][^3].
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slide 49
      - title: 'Wikipedia: Rosenbrock function'
        url: https://en.wikipedia.org/wiki/Rosenbrock_function
        locator: Introduction
      - source: d2l
        url: https://d2l.ai/chapter_optimization/momentum.html#an-ill-conditioned-problem
        locator: Sec. 12.6.1.2 An Ill-conditioned Problem
    source:
      id: ncu-intro-dl
      ref: lecture-03/q52
    status: reviewed
    reviewed_by: claude
  - id: optimization-143
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l03
      - adagrad
      - optimizer-choice
      - sparse-features
    question: |
      A text classifier uses bag-of-words features. Most words occur in only a few documents, but
      those rare words are often highly informative. Which optimizer do common guidelines suggest
      for such sparse features?
    options:
      - text: AdaGrad
        correct: true
      - text: Full-batch gradient descent
        why: It uses one global learning rate, so weights of rare words still take small steps on the few occasions their gradients appear.
      - text: SGD with momentum
        why: Momentum smooths the direction but uses one learning rate for all weights; rare features get no larger steps.
      - text: Nesterov accelerated gradient
        why: Like ordinary momentum, NAG gives every parameter the same learning rate.
    explanation: |
      AdaGrad gives every parameter its own learning rate, divided by the root of that parameter's
      accumulated squared gradients [^2]. Weights of frequent words build up large sums and take
      small steps, while weights of rare words keep large steps for the few times their features
      appear, which is why AdaGrad is recommended for sparse data such as text [^1][^3]. RMSProp and
      Adam also adapt per parameter and are common alternatives.
    references:
      - source: ncu-intro-dl
        locator: Lecture 3, slides 42, 51
      - source: d2l
        url: https://d2l.ai/chapter_optimization/adagrad.html#sparse-features-and-learning-rates
        locator: Sec. 12.7.1 Sparse Features and Learning Rates
      - title: 'Wikipedia: Stochastic gradient descent'
        url: https://en.wikipedia.org/wiki/Stochastic_gradient_descent
        locator: Extensions and variants — AdaGrad
    source:
      id: ncu-intro-dl
      ref: lecture-03/q53
    status: reviewed
    reviewed_by: claude
