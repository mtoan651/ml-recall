  - id: optimization-059
    type: short_answer
    difficulty: medium
    tags:
      - adam
      - bias-correction
    question: |
      Adam uses $\beta_1 = 0.9$ and $\beta_2 = 0.999$ with $\mathbf{v}_0 = \mathbf{s}_0 = 0$. Ignore
      $\epsilon$. On the first step, by what factor would the update be larger if you skipped bias
      correction, i.e. used $\mathbf{v}_1/\sqrt{\mathbf{s}_1}$ instead of
      $\hat{\mathbf{v}}_1/\sqrt{\hat{\mathbf{s}}_1}$?
    answer:
      numeric: 3.162
      tolerance: 0.005
      hint: a number, 3 decimals
      model: $\frac{(1 - \beta_1)g}{\sqrt{1 - \beta_2}\,|g|} = \frac{0.1}{\sqrt{0.001}} \approx 3.162$, while the corrected ratio is 1
    explanation: |
      After one step $v_1 = (1 - \beta_1)g_1$ and $s_1 = (1 - \beta_2)g_1^2$, both biased toward the
      zero initialization [^1]. Dividing by $1 - \beta^t$ gives $\hat{v}_1 = g_1$ and
      $\hat{s}_1 = g_1^2$, a first step of exactly $\eta$ per coordinate [^1]. Without correction
      the step is $0.1/\sqrt{0.001} \approx 3.16$ times larger: the second moment, averaged with
      $\beta_2$ close to 1, is far more underestimated than the first. The Adam paper warns that
      skipping the correction leads to much larger initial steps [^2]. The correction fades as
      $\beta^t \to 0$.
    references:
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm, Eq. (12.10.2)
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
      - title: 'Kingma & Ba, Adam: A Method for Stochastic Optimization (ICLR 2015)'
        locator: Sec. 3 Initialization Bias Correction
        url: https://arxiv.org/abs/1412.6980
      - source: d2l
        locator: Sec. 12.10.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_optimization/adam.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adam#ex2
      url: https://d2l.ai/chapter_optimization/adam.html#exercises
    status: draft
  - id: optimization-060
    type: single
    difficulty: medium
    tags:
      - adam
      - learning-rate-decay
      - convergence
    question: |
      Adam rescales each coordinate of the update to roughly $\eta\,\hat{v}/\sqrt{\hat{s}}$. Why
      should its learning rate $\eta$ still be reduced as training converges?
    options:
      - text: Near a minimum, noisy gradients keep $\hat{v}/\sqrt{\hat{s}}$ from vanishing, so the iterates jitter at a scale set by $\eta$
        correct: true
      - text: Bias correction makes $\hat{v}$ grow with $t$, so the steps would otherwise grow without bound
        why: The correction factor $1/(1 - \beta_1^t)$ falls toward 1 over time; it does not make $\hat{v}$ grow [^1].
      - text: $\hat{s}$ tends to zero near a minimum, so the division blows up unless $\eta$ shrinks
        why: With stochastic gradients $\hat{s}$ stays near the gradient variance, and if $\hat{v}$ and $\hat{s}$ both shrink their ratio stays bounded.
      - text: Its momentum term diverges as soon as the gradient changes sign near the minimum
        why: Momentum is a bounded leaky average; sign changes make it smaller, not divergent.
    explanation: |
      Adam normalizes each coordinate by the root of its second moment, so its steps have magnitude
      about $\eta$ whatever the scale of the gradient [^2]. At the optimum stochastic gradients are
      still noisy, so the momentum average does not vanish and the parameters keep moving at a scale
      set by $\eta$. As for SGD, convergence needs a learning rate that vanishes [^3], and Adam's own
      convergence result assumes $\alpha_t = \alpha/\sqrt{t}$ [^2]. In practice a learning-rate
      schedule does the job; otherwise we bounce around the minimum [^4].
    references:
      - source: d2l
        locator: Sec. 12.10.1 The Algorithm, Eqs. (12.10.1)–(12.10.3)
        url: https://d2l.ai/chapter_optimization/adam.html#the-algorithm
      - title: 'Kingma & Ba, Adam: A Method for Stochastic Optimization (ICLR 2015)'
        locator: Sec. 2.1 Adam's update rule (step size bounded by about $\alpha$) and Theorem 4.1 ($\alpha_t = \alpha/\sqrt{t}$)
        url: https://arxiv.org/abs/1412.6980
      - source: d2l
        locator: Sec. 12.4.3 Convergence Analysis for Convex Objectives (the learning rate needs to vanish)
        url: https://d2l.ai/chapter_optimization/sgd.html#convergence-analysis-for-convex-objectives
      - source: d2l
        locator: Sec. 12.11 Learning Rate Scheduling (a large rate bounces around the minimum)
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html
      - source: d2l
        locator: Sec. 12.10.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/adam.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/adam#ex3
      url: https://d2l.ai/chapter_optimization/adam.html#exercises
    status: draft
  - id: optimization-061
    type: short_answer
    difficulty: easy
    tags:
      - learning-rate-schedule
      - cosine-schedule
    question: |
      A cosine schedule sets
      $\eta_t = \eta_T + \frac{\eta_0 - \eta_T}{2}\left(1 + \cos(\pi t/T)\right)$ for $0 \le t \le T$.
      With $\eta_0 = 0.3$, $\eta_T = 0.01$ and $T = 20$, what is the learning rate at $t = 5$?
    answer:
      numeric: 0.2575
      tolerance: 0.001
      hint: a number, 4 decimals
      model: $0.01 + 0.145\,(1 + \cos(\pi/4)) = 0.01 + 0.145 \times 1.7071 \approx 0.2575$
    explanation: |
      At $t = 5$, $\pi t/T = \pi/4$ and $\cos(\pi/4) \approx 0.7071$, giving
      $0.01 + 0.145 \times 1.7071 \approx 0.2575$ [^1]. The cosine schedule falls slowly at first,
      fastest in the middle (at $t = 10$ it is exactly halfway, $0.155$), and slowly again at the
      end, where a small rate refines the solution; after $T$ it is pinned at $\eta_T$ [^1]. It was
      proposed with warm restarts in SGDR [^2].
    references:
      - source: d2l
        locator: Sec. 12.11.3.3 Cosine Scheduler, Eq. (12.11.1)
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html#cosine-scheduler
      - title: 'Loshchilov & Hutter, SGDR: Stochastic Gradient Descent with Warm Restarts (ICLR 2017)'
        url: https://arxiv.org/abs/1608.03983
        locator: Cosine annealing schedule
      - source: d2l
        locator: Sec. 12.11.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_optimization/lr-scheduler.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/lr-scheduler#ex3
      url: https://d2l.ai/chapter_optimization/lr-scheduler.html#exercises
