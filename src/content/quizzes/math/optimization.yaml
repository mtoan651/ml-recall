  - id: optimization-031
    type: short_answer
    difficulty: easy
    tags:
      - loss-landscape
      - symmetry
      - local-minima
      - mlp
    question: |
      An MLP has one hidden layer with 5 units and a single output. Starting from one trained set of
      weights, how many weight settings (counting the original) can you get just by reordering the
      hidden units, all computing exactly the same function? Assume no two hidden units are
      identical.
    answer:
      numeric: 120
      tolerance: 0
      hint: a whole number
      model: $5! = 120$ orderings of the hidden units
    explanation: |
      Swapping hidden units $i$ and $j$, that is their incoming weights and bias together with their
      outgoing weight, leaves the network's output unchanged, because the output layer just sums
      over the hidden units. Any of the $d! = 5! = 120$ permutations gives an equivalent solution, so
      every local minimum comes with at least $d!$ copies that behave identically. This symmetry is
      one reason deep-learning objectives have many local minima [^1]. With odd activations such as
      $\tanh$, flipping the signs of a unit's weights multiplies the count by another $2^d$.
    references:
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima (deep-learning objectives have many local optima)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.1.4 Exercises, Exercise 1
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/optimization-intro#ex1
      url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    status: draft
  - id: optimization-032
    type: single
    difficulty: medium
    tags:
      - saddle-points
      - gradient-descent
      - hessian
    question: |
      $f(x, y) = x^2 - y^2$ has a saddle point at the origin. Gradient descent with a small learning
      rate $\eta$ starts at $(1, 10^{-6})$. Why does it not end at the saddle?
    options:
      - text: Along $y$ the update is $y \leftarrow (1 + 2\eta)y$, so the tiny offset grows geometrically
        correct: true
      - text: The gradient at the origin is nonzero along $y$, which pushes the iterate away from it
        why: All partial derivatives vanish at a saddle point; that is what makes it a critical point [^1].
      - text: It does end there, because every start with $x \neq 0$ is drawn to the critical point
        why: Only the $x$ coordinate shrinks, as $(1 - 2\eta)x$. Any nonzero $y$ is amplified [^1].
      - text: Escaping needs curvature information, so only Newton-type methods can ever leave a saddle point
        why: Plain gradient descent leaves it too, as soon as the iterate is off the stable line $y = 0$.
    explanation: |
      The gradient is $(2x, -2y)$, so gradient descent updates $x \leftarrow (1 - 2\eta)x$ and
      $y \leftarrow (1 + 2\eta)y$. The Hessian has one positive and one negative eigenvalue, which
      makes the origin a saddle point [^1]: attracting along $x$, repelling along $y$. Like a ball
      balanced on a real saddle, the equilibrium is unstable, and any perturbation along $y$ grows
      exponentially. Optimizers can use this: the noise in minibatch gradients knocks parameters off
      such points [^2], and gradient descent started exactly at $y = 0$ is the only way to stay stuck.
    references:
      - source: d2l
        locator: Sec. 12.1.2.2 Saddle Points (the example $x^2 - y^2$ and the Hessian eigenvalue test)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#saddle-points
      - source: d2l
        locator: Sec. 12.1.2.1 Local Minima (minibatch noise dislodges parameters)
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#local-minima
      - source: d2l
        locator: Sec. 12.1.4 Exercises, Exercise 4
        url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    source:
      id: d2l
      ref: chapter_optimization/optimization-intro#ex4
      url: https://d2l.ai/chapter_optimization/optimization-intro.html#exercises
    status: draft
  - id: optimization-033
    type: multiple
    difficulty: medium
    tags:
      - convexity
      - convex-sets
      - norms
    question: Which of these subsets of $\mathbb{R}^2$ are convex? Select all that apply.
    options:
      - text: '$\{\mathbf{x} : |x_1| + |x_2| \le 1\}$'
        correct: true
      - text: '$\{\mathbf{x} : \max(|x_1|, |x_2|) \le 1\}$'
        correct: true
      - text: '$\{\mathbf{x} : (\sqrt{|x_1|} + \sqrt{|x_2|})^2 \le 1\}$'
        why: $(1, 0)$ and $(0, 1)$ are in the set, but their midpoint $(\frac{1}{2}, \frac{1}{2})$ gives $(2\sqrt{0.5})^2 = 2 > 1$. For $p < 1$, $\lVert \cdot \rVert_p$ is not a norm, as it is not subadditive [^2], and its "ball" is not convex.
      - text: '$\{\mathbf{x} : x_1 + 2x_2 = 3\}$'
        correct: true
      - text: '$\{\mathbf{x} : \lVert \mathbf{x} \rVert_2 \le 1\} \cup \{\mathbf{x} : \lVert \mathbf{x} - (3, 0) \rVert_2 \le 1\}$'
        why: The segment between the two centres leaves both discs; a union of convex sets need not be convex [^1].
    explanation: |
      A set is convex if it contains the whole segment between any two of its points [^1]. Balls of
      a $p$-norm with $p \ge 1$ are convex: by the triangle inequality,
      $\lVert \lambda \mathbf{a} + (1 - \lambda)\mathbf{b} \rVert \le \lambda \lVert \mathbf{a} \rVert + (1 - \lambda)\lVert \mathbf{b} \rVert \le r$
      [^2]. That covers the $\ell_1$ diamond and the $\ell_\infty$ square. An affine set
      $\{\mathbf{x} : W\mathbf{x} = \mathbf{b}\}$ is convex because
      $W(\lambda \mathbf{a} + (1 - \lambda)\mathbf{c}) = \lambda \mathbf{b} + (1 - \lambda)\mathbf{b} = \mathbf{b}$.
      Intersections of convex sets are convex, unions in general are not [^1].
    references:
      - source: d2l
        locator: Sec. 12.2.1.1 Convex Sets (definition; intersections versus unions)
        url: https://d2l.ai/chapter_optimization/convexity.html#convex-sets
      - title: 'Wikipedia: Lp space'
        locator: The p-norm in finite dimensions; When 0 < p < 1
        url: https://en.wikipedia.org/wiki/Lp_space
      - source: d2l
        locator: Sec. 12.2.5 Exercises, Exercises 2 and 5
        url: https://d2l.ai/chapter_optimization/convexity.html#exercises
