    reviewed_by: claude
  - id: optimization-094
    type: short_answer
    difficulty: easy
    tags:
      - taylor-series
      - polynomials
    question: |
      Rewrite $f(x) = 5x^2 - 11x + 1$ as its Taylor expansion centred at $x = -3$,
      $f(x) = a + b(x + 3) + c(x + 3)^2$. Fill in $a$ = {{1}}, $b$ = {{2}} and $c$ = {{3}}.
    answer:
      blanks:
        - numeric: 79
          tolerance: 0
          hint: a whole number
        - numeric: -41
          tolerance: 0
          hint: a whole number
        - numeric: 5
          tolerance: 0
          hint: a whole number
      model: $f(-3) = 79$, $f'(-3) = 10 \cdot (-3) - 11 = -41$, $f''/2 = 5$
    explanation: |
      The Taylor coefficients are $f^{(n)}(-3)/n!$ [^2]: $f(-3) = 45 + 33 + 1 = 79$,
      $f'(x) = 10x - 11$ gives $-41$, and $f''(x) = 10$ gives $c = 10/2 = 5$; all higher derivatives
      vanish, so the expansion is exact [^1]. Expanding $79 - 41(x + 3) + 5(x + 3)^2$ gives back
      $5x^2 - 11x + 1$.
    references:
      - source: dl-interviews
        locator: Ch. 5 (Calculus, Algorithmic Differentiation), Problem PRB-107, p. 129; Solution SOL-107, Eq. (5.38), p. 151
