  - id: optimization-066
    type: short_answer
    difficulty: easy
    tags:
      - gradients
      - log-sum-exp
      - softmax
    question: Let $L(x, y) = \log(e^x + e^y)$. What is $\partial L / \partial x$ at $(x, y) = (\ln 3, 0)$?
    answer:
      numeric: 0.75
      tolerance: 0.001
      hint: a number, 2 decimals
      model: $\frac{e^x}{e^x + e^y} = \frac{3}{3 + 1} = 0.75$
    explanation: |
      By the chain rule $\partial L/\partial x = e^x/(e^x + e^y)$ and
      $\partial L/\partial y = e^y/(e^x + e^y)$ [^1]. At $(\ln 3, 0)$ these are $3/4$ and $1/4$. The
      gradient of log-sum-exp is the softmax of its inputs, so its components are positive and
      always sum to 1 [^2]; that is why the cross-entropy gradient with respect to the logits is
      $\textrm{softmax}(\mathbf{o}) - \mathbf{y}$.
    references:
      - source: d2l
        locator: Sec. 22.4.1 Higher-Dimensional Differentiation (gradients) and Sec. 22.4.4 Multivariate Chain Rule
