  - id: optimization-018
    type: single
    difficulty: easy
    question: Let $f(x)$ be a function whose graph passes through the origin. If $f(2n) = n^2 + f(2(n - 1))$ for every integer $n$, what is the value of $f(8)$?
    options:
      - text: '24'
      - text: '30'
        correct: true
      - text: '32'
      - text: '36'
    explanation: Write $a_n = f(2n)$. The recurrence says $a_n - a_{n-1} = n^2$, and $a_0 = f(0) = 0$ because the graph passes through the origin. Adding these differences telescopes to $a_n - a_0 = \sum_{k=1}^{n} k^2$ [^1]. So $f(8) = a_4 = 1 + 4 + 9 + 16 = 30$; note that $f(8)$ is $a_4$, not $a_8$.
    references:
      - title: 'Levin, Discrete Mathematics: An Open Introduction (3rd ed.)'
        url: https://discrete.openmathbooks.org/dmoi3/sec_recurrence.html
        locator: Sec. 2.4 Solving Recurrence Relations (telescoping)
    source:
      id: mmlu-redux
      ref: college_mathematics/31
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=31
    status: draft
  - id: optimization-019
    type: true_false
    difficulty: easy
    question: "True or false: if $f : [a, b] \\to \\mathbb{R}$ has a local maximum at a point $c$ of $[a, b]$, then $f'(c)$ must exist and equal 0."
    options:
      - text: 'True'
      - text: 'False'
        correct: true
    explanation: False. A local extremum forces $f'(c) = 0$ only at an interior point where the derivative exists [^1]. The maximum can sit at a corner where $f$ is not differentiable, as $-|x|$ peaks at $x = 0$, or at an endpoint of the interval, as $f(x) = x$ on $[0, 1]$ peaks at $x = 1$ where $f'(1) = 1$ [^1]. That is why the search for a maximum on a closed interval checks critical points, singular points and the endpoints [^2].
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_optimise.html
        locator: Sec. 3.5 Optimisation, Theorem 3.5.4 and Definition 3.5.6 (critical and singular points)
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-5-optimization.html#sec-3-5-optimization-4
        locator: Sec. 3.5.2 Global Optimization
    source:
      id: mmlu-redux
      ref: college_mathematics/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=33
    status: draft
  - id: optimization-020
    type: single
    difficulty: medium
    question: The region in the first quadrant bounded by the $x$-axis and the curve $y = \frac{x}{1 + x^3}$, $x \ge 0$, is rotated about the $x$-axis. What is the volume of the solid generated?
    options:
      - text: $\pi/3$
        correct: true
      - text: $\pi/4$
      - text: $\pi$
      - text: $2\pi$
    explanation: By the disk method the volume is $V = \pi \int_0^\infty f(x)^2\,dx = \pi \int_0^\infty \frac{x^2}{(1 + x^3)^2}\,dx$ [^1]. The substitution $u = 1 + x^3$, $du = 3x^2\,dx$ turns the integrand into $\frac{1}{3u^2}$ [^2], so the improper integral is $\lim_{b \to \infty} \left[-\frac{1}{3(1 + x^3)}\right]_0^b = \frac{1}{3}$ [^3]. Hence $V = \pi/3$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-2-volume.html#sec-6-2-volume-4
        locator: Sec. 6.2.2 The Volume of a Solid of Revolution
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-5-3-substitution.html
        locator: Sec. 5.3 Integration by substitution
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-6-5-improper.html#sec-6-5-improper-4
        locator: Sec. 6.5.2 Improper Integrals Involving Unbounded Intervals
    source:
      id: mmlu-redux
      ref: college_mathematics/47
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=47
    status: draft
  - id: optimization-021
    type: single
    difficulty: medium
    question: If $f$ is a continuously differentiable real-valued function defined on the open interval $(-1, 4)$ such that $f(3) = 5$ and $f'(x) \ge -1$ for all $x$, what is the greatest possible value of $f(0)$?
    options:
      - text: '3'
      - text: '4'
      - text: '5'
      - text: '8'
        correct: true
    explanation: By the mean value theorem there is a $c$ in $(0, 3)$ with $f(3) - f(0) = 3f'(c)$ [^1]. Since $f'(c) \ge -1$, $f(3) - f(0) \ge -3$, so $f(0) \le f(3) + 3 = 8$. The bound is reached by $f(x) = 8 - x$, whose slope is exactly $-1$; the answer 5 would only hold if $f$ could not decrease.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_mvt.html
        locator: Sec. 2.13 The Mean Value Theorem, Theorem 2.13.5
    source:
      id: mmlu-redux
      ref: college_mathematics/51
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=51
    status: draft
  - id: optimization-022
    type: single
    difficulty: easy
    question: How many real roots does the polynomial $2x^5 + 8x - 7$ have?
    options:
      - text: None
      - text: One
        correct: true
      - text: Two
      - text: Three
    explanation: Let $p(x) = 2x^5 + 8x - 7$. Its derivative $p'(x) = 10x^4 + 8$ is positive everywhere, so $p$ is strictly increasing [^1] and can cross zero at most once. Since $p(0) = -7 < 0$ and $p(1) = 3 > 0$, the intermediate value theorem gives a root between 0 and 1 [^2]. So there is exactly one real root; the other four roots are complex.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_mvt.html
        locator: Sec. 2.13 The Mean Value Theorem, Corollary 2.13.12
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_1_6.html
        locator: Sec. 1.6 Continuity, Theorem 1.6.12 Intermediate value theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/54
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=54
    status: draft
  - id: optimization-023
    type: single
    difficulty: medium
    question: Water drips out of a hole at the vertex of an upside-down cone at a rate of 3 cm³ per minute. The cone's height and radius are 2 cm and 1 cm, respectively. At what rate does the height of the water change when the water level is half a centimeter below the top of the cone? The volume of a cone is $V = \frac{\pi}{3} r^2 h$, where $r$ is the radius and $h$ is the height of the cone.
    options:
      - text: $-\frac{48}{\pi}$ cm/min
      - text: $-\frac{4}{3\pi}$ cm/min
      - text: $-\frac{8}{3\pi}$ cm/min
      - text: $-\frac{16}{3\pi}$ cm/min
        correct: true
    explanation: By similar triangles the water's radius is half its depth, $r = h/2$, so $V = \frac{\pi}{3}\left(\frac{h}{2}\right)^2 h = \frac{\pi h^3}{12}$. Differentiating with respect to time, the core step of every related-rates problem [^1], gives $\frac{dV}{dt} = \frac{\pi h^2}{4}\frac{dh}{dt}$. With $\frac{dV}{dt} = -3$ and depth $h = 2 - 0.5 = 1.5$, $\frac{dh}{dt} = \frac{-12}{\pi (1.5)^2} = -\frac{16}{3\pi}$ cm/min. Using $h = 0.5$, the distance below the rim, instead of the depth gives $-48/\pi$.
    references:
      - title: Active Calculus (2nd ed.)
        url: https://activecalculus.org/single2e/sec-3-1-rel-rates.html#sec-3-1-rel-rates-4
        locator: Sec. 3.1.2 Related Rates Problems
    source:
      id: mmlu-redux
      ref: college_mathematics/63
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=63
    status: draft
  - id: optimization-024
    type: single
    difficulty: medium
    question: |
      Which of the following are valid intervals of convergence for a power series?

      (I) $[-1, 3)$

      (II) $(-\infty, 0]$

      (III) $[2, 2] \cup [3, 3]$

      (IV) $(-\infty, \infty)$
    options:
      - text: Only (II)
      - text: Only (IV)
      - text: (I) and (IV)
        correct: true
      - text: (II) and (III)
    explanation: A power series $\sum A_n (x - c)^n$ converges either for every $x$, or only at $x = c$, or for $|x - c| < R$ and not for $|x - c| > R$, with each endpoint checked separately [^1]. $[-1, 3)$ is centred at $c = 1$ with $R = 2$ and includes one endpoint, which happens for example with $\sum_{n \ge 1} \frac{1}{n}\left(\frac{x - 1}{2}\right)^n$; $(-\infty, \infty)$ is the case $R = \infty$. A half-line such as $(-\infty, 0]$ is not symmetric about any centre, and two separate points cannot occur either, so only (I) and (IV) are possible.
    references:
      - title: CLP-2 Integral Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP2/clp_2_ic/chap_seq_ser-7.html
        locator: Sec. 3.5.1 Radius and Interval of Convergence, Theorem 3.5.9 and Definition 3.5.10
    source:
      id: mmlu-redux
      ref: college_mathematics/67
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=67
    status: draft
  - id: optimization-025
    type: single
    difficulty: easy
    question: In the $xy$-plane, the curve with parametric equations $x = \cos t$ and $y = \sin t$, $0 \le t \le \pi$, has length
    options:
      - text: $3$
      - text: $\pi$
        correct: true
      - text: $3\pi$
      - text: $\frac{3}{2}$
    explanation: The length of a parametric curve is the integral of its speed, $L = \int_a^b \sqrt{x'(t)^2 + y'(t)^2}\,dt$ [^1]. Here $x'(t)^2 + y'(t)^2 = \sin^2 t + \cos^2 t = 1$, so $L = \int_0^\pi 1\,dt = \pi$. Geometrically, the curve is the upper half of the unit circle, half of the circumference $2\pi$.
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-VVF-ArcLength.html#S-VVF-ArcLength-4
        locator: Sec. 10.4.2 Arc Length, Definition 10.4.4 and formula (10.4.1)
    source:
      id: mmlu-redux
      ref: college_mathematics/68
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=68
    status: draft
  - id: optimization-026
    type: single
    difficulty: easy
    question: In the $xy$-plane, the graph of $x^{\log y} = y^{\log x}$ is
    options:
      - text: the open first quadrant
        correct: true
      - text: a closed curve
      - text: a ray in the open first quadrant
      - text: a single point
    explanation: Both sides are defined only for $x > 0$ and $y > 0$, since $\log$ needs a positive argument [^1]. For such points, using $a = e^{\log a}$ and $\log(a^b) = b \log a$ [^1], $x^{\log y} = e^{\log y \cdot \log x}$ and $y^{\log x} = e^{\log x \cdot \log y}$. The two sides are always equal, so every point with $x, y > 0$ satisfies the equation and the graph is the whole open first quadrant.
    references:
      - title: CLP-1 Differential Calculus (Feldman, Rechnitzer, Yeager)
        url: https://personal.math.ubc.ca/~CLP/CLP1/clp_1_dc/sec_diff_logs.html
        locator: Sec. 2.10 The Natural Logarithm (properties of log)
    source:
      id: mmlu-redux
      ref: college_mathematics/69
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=69
