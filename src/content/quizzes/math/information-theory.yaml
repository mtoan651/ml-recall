        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.11.1.1 Self-information
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#self-information
      - source: d2l
        locator: Sec. 22.11.2.2 Definition (entropy)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#definition
