  - id: information-theory-023
    type: true_false
    difficulty: medium
    tags:
      - joint-entropy
      - invariance
    question: |
      $X$ and $Z$ are discrete random variables and $Y = X + Z$. True or false:
      $H(X, Y) = H(X, Z)$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: From $(X, Y)$ you can recover $Z = Y - X$, and from $(X, Z)$ you can recover $Y = X + Z$, so the two pairs carry the same information.
    explanation: |
      True. The map $(x, z) \mapsto (x, x + z)$ is a bijection with inverse $(x, y) \mapsto (x, y - x)$, so
      every value of the pair $(X, Z)$ corresponds to exactly one value of $(X, Y)$ with the same
      probability [^1]. Entropy depends only on these probabilities, not on the labels of the outcomes,
      so the joint entropies are equal [^2]. Note that $H(Y)$ itself can be smaller than $H(Z)$, since
      $X + Z$ alone may merge outcomes.
    references:
      - source: dl-interviews
        locator: Ch. 4 (Information Theory), Problem PRB-79, p. 92; Solution SOL-79, p. 107
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.11.3.1 Joint Entropy
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#joint-entropy
    source:
      id: dl-interviews
      ref: ch4#prb79
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-024
    type: single
    difficulty: easy
    tags:
      - information
      - uncertainty
      - entropy
    question: |
      Before a message arrives you are uncertain about its content; afterwards you are less so. In
      Shannon's theory, how is the information conveyed by the message related to your uncertainty?
    options:
      - text: 'It is the decrease in uncertainty: entropy before minus entropy after'
        correct: true
      - text: It is the increase in uncertainty caused by receiving the message
        why: Receiving a message removes uncertainty; the more uncertainty it removes, the more information it carries [^1].
      - text: It is the length of the message in symbols, whatever their probabilities
        why: Information depends on probabilities; a long message that was certain in advance carries no information [^2].
      - text: It is largest for messages the receiver was sure to get
        why: An outcome with probability 1 has self-information $-\log 1 = 0$ [^2].
    explanation: |
      Shannon treats information and uncertainty as two sides of the same coin: the more uncertainty
      there is, the more information we gain by removing it [^1]. Formally, the information that an
      observation $Y$ gives about $X$ is the mutual information $I(X, Y) = H(X) - H(X \mid Y)$, the
      reduction in the entropy of $X$ [^3]. A single outcome of probability $p$ carries $-\log_2 p$ bits,
      zero for a certain event [^2].
    references:
      - source: dl-interviews
        locator: Ch. 4 (Information Theory), Sec. 4.1 Introduction (p. 86) and Problem PRB-72, p. 90; Solution SOL-72, p. 104
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.11.1.1 Self-information
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#self-information
      - source: d2l
        locator: Sec. 22.11.3 Mutual Information
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#mutual-information
    source:
      id: dl-interviews
      ref: ch4#prb72
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-025
    type: single
    difficulty: medium
    tags:
      - conditional-entropy
      - mutual-information
      - communication-channel
    question: |
      A source $S$ sends messages over a noisy channel to a destination $D$. Shannon calls the
      uncertainty about what was *sent* that remains after the destination has received the signal the
      *equivocation*. Which quantity is it?
    options:
      - text: $H(D \mid S)$
        why: This is the uncertainty about what is received given what was sent, the part added by the channel noise [^1].
      - text: $H(S \mid D)$
        correct: true
      - text: $I(S; D)$
        why: The mutual information is the part of $H(S)$ that does get through, $H(S) - H(S \mid D)$ [^3].
      - text: $H(S, D)$
        why: The joint entropy measures the uncertainty of the pair, not what remains about $S$ once $D$ is known [^3].
    explanation: |
      The equivocation is the conditional entropy $H(S \mid D)$: what you still do not know about the sent
      message after seeing the received one [^2]. The mutual information is what is transmitted,
      $I(S; D) = H(S) - H(S \mid D) = H(D) - H(D \mid S)$, where $H(D \mid S)$ is the noise [^1][^3]. In a
      Venn diagram of $H(S)$ and $H(D)$, the overlap is $I(S; D)$, the rest of $H(S)$ is the equivocation and
      the rest of $H(D)$ is the noise [^1].
    references:
      - source: dl-interviews
        locator: Ch. 4 (Information Theory), Problem PRB-92, pp. 98–99; Solution SOL-92, Fig. 4.15 and Eq. (4.38), pp. 116–117
        url: https://arxiv.org/abs/2201.00650v2
      - title: Shannon (1948), A Mathematical Theory of Communication, Bell System Technical Journal 27(3)
        locator: Part II, Sec. 12 Equivocation and Channel Capacity
        url: https://doi.org/10.1002/j.1538-7305.1948.tb01338.x
      - source: d2l
        locator: Sec. 22.11.3.2 Conditional Entropy and 22.11.3.3 Mutual Information
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#conditional-entropy
    source:
      id: dl-interviews
      ref: ch4#prb92
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-026
    type: short_answer
    difficulty: medium
    tags:
      - binary-entropy
      - logit
      - derivative
    question: |
      The binary entropy in bits is $H(p) = -p \log_2 p - (1 - p) \log_2 (1 - p)$. What is $H'(0.2)$, the
      derivative with respect to $p$ at $p = 0.2$?
    answer:
      numeric: 2
      tolerance: 0.001
      hint: a number
      model: $H'(p) = \log_2 \dfrac{1 - p}{p}$, so $H'(0.2) = \log_2 4 = 2$
    explanation: |
      Differentiating, the terms $-\frac{1}{\ln 2}$ and $+\frac{1}{\ln 2}$ cancel and leave
      $H'(p) = -\log_2 p + \log_2(1 - p) = -\log_2 \frac{p}{1 - p}$, minus the logit of $p$ (in base 2) [^1].
      At $p = 0.2$ this is $\log_2 4 = 2$ bits: the entropy still rises steeply towards its maximum at
      $p = 0.5$, where the logit and hence the derivative is 0 [^1][^2].
    references:
      - source: dl-interviews
        locator: Ch. 2 (Logistic Regression), Problem PRB-24, p. 22; Solution SOL-24, Eq. (2.50), p. 38
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Binary entropy function'
        url: https://en.wikipedia.org/wiki/Binary_entropy_function
        locator: Derivative
    source:
      id: dl-interviews
      ref: ch2#prb24
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-027
    type: true_false
    difficulty: medium
    tags:
      - kl-divergence
      - jeffreys-divergence
      - symmetry
    question: |
      For two distributions $P$ and $Q$ on the same finite set with all probabilities positive, true or
      false: $\displaystyle\sum_x \big(P(x) - Q(x)\big) \log \frac{P(x)}{Q(x)} = D_{\mathrm{KL}}(P \| Q) + D_{\mathrm{KL}}(Q \| P)$.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Splitting the sum into the $P(x)$ and the $-Q(x)$ parts gives exactly the two KL divergences.
    explanation: |
      True. $\sum_x P(x) \log \frac{P(x)}{Q(x)} = D_{\mathrm{KL}}(P \| Q)$, and
      $-\sum_x Q(x) \log \frac{P(x)}{Q(x)} = \sum_x Q(x) \log \frac{Q(x)}{P(x)} = D_{\mathrm{KL}}(Q \| P)$ [^2].
      The sum is the symmetrized KL divergence, also called the Jeffreys divergence [^3], which
      *Deep Learning Interviews* lists among the KL-based distances [^1]. It is symmetric and non-negative, but
      like KL itself it does not satisfy the triangle inequality, so it is not a metric; the Jensen–Shannon
      divergence is a bounded alternative [^3].
    references:
      - source: dl-interviews
        locator: Ch. 8 (Deep Learning), Problem PRB-202, Eqs. (8.12)–(8.13), pp. 244–245
        url: https://arxiv.org/abs/2201.00650v2
      - source: d2l
        locator: Sec. 22.11.4.1 Definition (KL divergence)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#kullbackleibler-divergence
      - title: 'Wikipedia: Kullback–Leibler divergence'
        url: https://en.wikipedia.org/wiki/Kullback%E2%80%93Leibler_divergence
        locator: Symmetrised divergence
    source:
      id: dl-interviews
      ref: ch8#prb202-2
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-028
    type: short_answer
    difficulty: medium
    tags:
      - entropy
      - concavity
      - mixtures
    question: |
      You pick one of two coins at random, each with probability 1/2: one lands heads with probability
      0.1, the other with probability 0.9. How many bits larger is the entropy of a single toss of the
      picked coin than the average of the two coins' own entropies? Round to 3 decimals.
    answer:
      numeric: 0.531
      tolerance: 0.002
      hint: a number of bits, 3 decimals
      model: $H(0.5) - \tfrac12\big(H(0.1) + H(0.9)\big) = 1 - 0.469 = 0.531$
    explanation: |
      A toss of the randomly picked coin lands heads with probability $\tfrac12 \cdot 0.1 + \tfrac12 \cdot 0.9 = 0.5$,
      so its entropy is 1 bit, while each coin alone has $H(0.1) = H(0.9) \approx 0.469$ bits [^1].
      Entropy is concave, so the entropy of a mixture is at least the average of the entropies,
      $H(q p_1 + (1 - q) p_2) \ge q H(p_1) + (1 - q) H(p_2)$ [^1][^2]. The gap is the mutual
      information between the toss $T$ and the choice of coin $C$:
      $I(T, C) = H(T) - H(T \mid C) = 1 - 0.469 = 0.531$ bits, the amount one toss reveals about
      which coin was picked [^3].
    references:
      - source: dl-interviews
        locator: Ch. 4 (Information Theory), Problem PRB-78, p. 92; Solution SOL-78, Eq. (4.15), pp. 106–107
        url: https://arxiv.org/abs/2201.00650v2
      - title: 'Wikipedia: Entropy (information theory)'
        url: https://en.wikipedia.org/wiki/Entropy_(information_theory)
        locator: Further properties (concavity)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#mutual-information
        locator: Sec. 22.11.3 Mutual Information (I(X, Y) = H(X) − H(X | Y))
    source:
      id: dl-interviews
      ref: ch4#prb78
      url: https://arxiv.org/abs/2201.00650v2
    status: reviewed
    reviewed_by: claude
  - id: information-theory-029
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - entropy
    question: |
      A three-class model outputs the distribution $p = (0.5, 0.25, 0.25)$. What is its entropy in
      nats (natural logarithm)? Give 3 decimals.
    answer:
      numeric: 1.040
      tolerance: 0.002
      hint: a number, e.g. 0.123
      model: $H = -[0.5\ln 0.5 + 2(0.25\ln 0.25)] = 0.3466 + 0.6931 \approx 1.040$ nats (1.5 bits)
    explanation: |
      Entropy is $H(p) = -\sum_k p_k \log p_k$ [^1][^2]. Here
      $-0.5\ln 0.5 = 0.3466$ and each $-0.25\ln 0.25 = 0.3466$, so $H \approx 1.040$ nats
      ($= 1.5$ bits with base-2 logarithms). It is below the maximum $\ln 3 \approx 1.099$ of a
      uniform three-class distribution, because one class is more likely than the others.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 69
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html
        locator: Sec. 22.11.2.2 Definition (entropy)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q13
    status: reviewed
    reviewed_by: claude
  - id: information-theory-030
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - kl-divergence
    question: |
      For the distributions $p = (0.75, 0.25)$ and $q = (0.5, 0.5)$, using natural logarithms,
      $D_{\mathrm{KL}}(p \parallel q) =$ {{1}} and $D_{\mathrm{KL}}(q \parallel p) =$ {{2}}. Give 3
      decimals.
    answer:
      blanks:
        - numeric: 0.131
          tolerance: 0.002
          hint: 3 decimals
        - numeric: 0.144
          tolerance: 0.002
          hint: 3 decimals
      model: $D_{\mathrm{KL}}(p \parallel q) = 0.75\ln 1.5 + 0.25\ln 0.5 \approx 0.131$; $D_{\mathrm{KL}}(q \parallel p) = 0.5\ln\tfrac{2}{3} + 0.5\ln 2 \approx 0.144$.
    explanation: |
      $D_{\mathrm{KL}}(p \parallel q) = \sum_k p_k \log(p_k/q_k)$ weights the log-ratios by the
      first distribution [^1][^2]. Here $0.75\ln 1.5 + 0.25\ln 0.5 \approx 0.304 - 0.173 = 0.131$,
      while swapping the roles gives $0.5\ln(2/3) + 0.5\ln 2 \approx -0.203 + 0.347 = 0.144$. Both
      values are positive, as KL divergence is for any two different distributions, but they
      differ: KL divergence is not symmetric and therefore does not qualify as a distance. In classification $p$
      is the target and $q$ the model, and minimizing the cross-entropy
      $H(p, q) = H(p) + D_{\mathrm{KL}}(p \parallel q)$ over $q$ minimizes the first direction.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 70
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html
        locator: Sec. 22.11.4.1 Definition; Sec. 22.11.4.2 KL Divergence Properties
    source:
      id: ncu-intro-dl
      ref: lecture-01/q14
    status: reviewed
    reviewed_by: claude
  - id: information-theory-031
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - cross-entropy
    question: |
      A classifier assigns the probabilities 0.8, 0.5 and 0.2 to the true classes of three
      examples. What is the mean cross-entropy loss over these examples, using natural logarithms?
      Give 3 decimals.
    answer:
      numeric: 0.842
      tolerance: 0.002
      hint: 3 decimals
      model: $-(\ln 0.8 + \ln 0.5 + \ln 0.2)/3 = (0.223 + 0.693 + 1.609)/3 \approx 0.842$
    explanation: |
      With a one-hot target, cross-entropy keeps only the term of the observed class,
      $L = -\log p_{\text{true}}$ [^1][^2]. The three losses are 0.223, 0.693 and 1.609 (the
      smaller the true-class probability, the larger the loss), and their mean is 0.842. Taking
      logs turns the product of the probabilities into a sum, so this is the average negative
      log-likelihood [^2]. With base-10 logs the result would be 0.366, so the base matters.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 64, 68
      - source: d2l
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#log-likelihood
        locator: Sec. 4.1.2.1 Log-Likelihood; Sec. 4.1.2.2 Softmax and Cross-Entropy Loss
    source:
      id: ncu-intro-dl
      ref: lecture-01/q71
    status: reviewed
    reviewed_by: claude
  - id: information-theory-032
    type: true_false
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - entropy
    question: |
      True or false: if a classifier's predicted class distribution has low entropy, its
      prediction is correct.
    options:
      - text: 'True'
        why: Entropy measures only how concentrated the prediction is; a confident prediction can still be wrong.
      - text: 'False'
        correct: true
    explanation: |
      Entropy, $H(p) = -\sum_k p_k \log p_k$, measures how spread out the predicted distribution
      is and never looks at the true label [^1][^2]. The prediction $(0.95, 0.05)$ has an entropy of
      only about 0.199 nats, yet if the true class is the second one its cross-entropy loss is
      $-\ln 0.05 \approx 3.0$: confident and wrong. Correctness has to be judged against the labels.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 69
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#entropy
        locator: Sec. 22.11.2 Entropy (22.11.2.2 Definition)
    source:
      id: ncu-intro-dl
      ref: lecture-01/q72
    status: reviewed
    reviewed_by: claude
  - id: information-theory-033
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - cross-entropy
      - kl-divergence
    question: |
      For a reference distribution $p = (0.5, 0.5)$ and a model distribution $q = (0.8, 0.2)$,
      using natural logarithms, the cross-entropy is $H(p, q) =$ {{1}} and the KL divergence is
      $D_{\mathrm{KL}}(p \parallel q) =$ {{2}}. Give 3 decimals.
    answer:
      blanks:
        - numeric: 0.916
          tolerance: 0.002
          hint: 3 decimals
        - numeric: 0.223
          tolerance: 0.002
          hint: 3 decimals
      model: $H(p, q) = -\tfrac12(\ln 0.8 + \ln 0.2) \approx 0.916$; $H(p) = \ln 2 \approx 0.693$; $D_{\mathrm{KL}} = 0.916 - 0.693 = 0.223$.
    explanation: |
      Cross-entropy, $H(p, q) = -\sum_k p_k \log q_k$, splits into $H(p) + D_{\mathrm{KL}}(p
      \parallel q)$ [^1][^2]. Here $H(p, q) = 0.5\,(0.223 + 1.609) = 0.916$ and $H(p) = \ln 2 =
      0.693$, so $D_{\mathrm{KL}} = 0.223$; directly, $0.5 \ln(0.5/0.8) + 0.5 \ln(0.5/0.2) \approx
      0.223$. Because $H(p)$ does not depend on $q$, minimizing cross-entropy over $q$ also
      minimizes the KL divergence [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 70
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#cross-entropy
        locator: Sec. 22.11.4 Kullback–Leibler Divergence; Sec. 22.11.5 Cross-Entropy
    source:
      id: ncu-intro-dl
      ref: lecture-01/q73
    status: reviewed
    reviewed_by: claude
  - id: information-theory-034
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - cross-entropy
      - kl-divergence
      - soft-targets
    question: |
      A training example has the soft target $q = (0.8, 0.2, 0)$ over three classes. What is the
      smallest cross-entropy $H(q, p)$ (natural log) that any predicted distribution $p$ can reach,
      and at which $p$?
    options:
      - text: About 0.500, at $p = q$
        correct: true
      - text: 0, at $p = (1, 0, 0)$
        why: With $q_2 = 0.2 > 0$ and $p_2 = 0$ the term $-0.2\ln p_2$ is infinite; a loss of 0 needs a one-hot target.
      - text: About 0.223, at $p = q$
        why: That is only $-\ln 0.8$; the cross-entropy weights $-\ln p_j$ by $q_j$ for every class and adds the terms.
      - text: About 0.722, at $p = q$
        why: That is the entropy of $q$ in bits ($\log_2$); in natural-log units (nats) it is 0.500.
    explanation: |
      Cross-entropy splits as $H(q, p) = H(q) + D_{\mathrm{KL}}(q \parallel p)$ [^1][^2], and
      Gibbs' inequality gives $D_{\mathrm{KL}} \ge 0$ with equality only at $p = q$ [^3]. The floor is
      therefore the target's own entropy,
      $H(q) = -(0.8\ln 0.8 + 0.2\ln 0.2) \approx 0.179 + 0.322 = 0.500$, reached at $p = q$. With a
      soft target the cross-entropy loss cannot reach 0; only a one-hot target has $H(q) = 0$.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 62
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#formal-definition
        locator: Sec. 22.11.5.1 Formal Definition, Eq. (22.11.26)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#kl-divergence-properties
        locator: Sec. 22.11.4.2 KL Divergence Properties (non-negative, zero only when P = Q)
    source:
      id: ncu-intro-dl
      ref: lecture-02/q71
    status: reviewed
    reviewed_by: claude
  - id: information-theory-035
    type: single
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - cross-entropy
      - kl-divergence
    question: |
      A classifier is trained with cross-entropy against fixed targets $q$. Why does minimizing
      $H(q, p)$ over the model's prediction $p$ also minimize $D_{\mathrm{KL}}(q \parallel p)$?
    options:
      - text: $H(q, p) = H(q) + D_{\mathrm{KL}}(q \parallel p)$, and $H(q)$ does not depend on $p$
        correct: true
      - text: KL divergence is symmetric, so it equals the cross-entropy taken in either order
        why: KL divergence is not symmetric, and it differs from the cross-entropy by $H(q)$.
      - text: Cross-entropy and KL divergence are equal for every pair of distributions
        why: They differ by the entropy $H(q)$; they coincide only when $H(q) = 0$, as for a one-hot target.
      - text: Both become zero as soon as $p$ gives the true class its largest probability
        why: Both reach their minimum only at $p = q$; ranking the true class first is not enough.
    explanation: |
      Cross-entropy splits into the target's own entropy plus the KL divergence [^1][^2][^3]. With $q$
      fixed, $H(q)$ is a constant, so both objectives have the same minimizer, $p = q$; for a one-hot
      target $H(q) = 0$ and the two are even numerically equal. KL divergence is not symmetric, so it
      is not a true distance.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 62
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#cross-entropy
        locator: Sec. 22.11.5.1 Formal Definition, Eq. (22.11.26); Sec. 22.11.5.2 Properties
      - title: 'Wikipedia: Cross-entropy'
        url: https://en.wikipedia.org/wiki/Cross-entropy
        locator: Definition
    source:
      id: ncu-intro-dl
      ref: lecture-02/q72
    status: reviewed
    reviewed_by: claude
  - id: information-theory-036
    type: true_false
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - kl-divergence
    question: |
      True or false: if the target distribution $q$ gives positive probability to a class to which
      the model assigns $p_j = 0$, then $D_{\mathrm{KL}}(q \parallel p)$ is infinite.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The term $q_j \log(q_j/p_j)$ with $q_j > 0$ grows without bound as $p_j \to 0$; only terms with $q_j = 0$ drop out.
    explanation: |
      Each class contributes $q_j \log(q_j/p_j)$ [^1]. Terms with $q_j = 0$ count as 0, but a term
      with $q_j > 0$ and $p_j = 0$ is infinite, so the whole divergence is infinite [^2]. Softmax
      outputs are always strictly positive, which keeps the cross-entropy loss finite.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 62
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html#kl-divergence-properties
        locator: Sec. 22.11.4.2 KL Divergence Properties
    source:
      id: ncu-intro-dl
      ref: lecture-02/q73
    status: reviewed
    reviewed_by: claude
