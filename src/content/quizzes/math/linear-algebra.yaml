  - id: linear-algebra-003
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - tensor-shapes
    question: A mini-batch holds 4 examples with 2 features each. If each row is one example, what is the shape of the input matrix $X$?
    options:
      - text: $2 \times 4$
        why: This puts features on the rows.
      - text: $4 \times 4$
        why: There are only 2 features, so there cannot be 4 columns.
      - text: $4 \times 2$
        correct: true
      - text: $2 \times 2$
        why: This ignores half of the examples.
    explanation: 'Rows are examples and columns are features, so $X$ has 4 rows and 2 columns: $X \in \mathbb{R}^{4 \times 2}$ [^1][^2].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 33
      - source: d2l
        locator: Sec. 2.3 Linear Algebra
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q08
    status: reviewed
  - id: linear-algebra-004
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - vectors
    question: What is the name for a one-dimensional array of numbers, such as $[0.2, 0.5, 0.8]$ describing a single example?
    answer:
      accept:
        - vector
        - a vector
        - feature vector
      model: A vector (here with 3 components).
    explanation: A vector is an ordered one-dimensional collection of numbers; this one has three components, one per feature [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 31–32
      - source: d2l
        locator: Sec. 2.3 Linear Algebra
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
    source:
      id: ncu-intro-dl
      ref: exercise-01/q19
    status: reviewed
  - id: linear-algebra-005
    type: short_answer
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - matrices
    question: What is the name for a two-dimensional array of numbers arranged in rows and columns, such as the weights of a dense layer?
    answer:
      accept:
        - matrix
        - a matrix
        - weight matrix
      model: A matrix.
    explanation: A two-dimensional array with rows and columns is a matrix [^1]. A dense layer stores its weights as a matrix that maps one activation vector to the next [^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 31
      - source: ncu-intro-dl
        locator: Lecture 2, slide 15
    source:
      id: ncu-intro-dl
      ref: exercise-01/q20
    status: reviewed
  - id: linear-algebra-006
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex03
      - matrix-multiplication
      - tensor-shapes
    question: 'Inputs are stored as rows: $X$ has shape $5 \times 3$ and $W$ has shape $3 \times 4$. What is the shape of $XW$?'
    options:
      - text: $3 \times 3$
      - text: $5 \times 4$
        correct: true
      - text: $4 \times 5$
        why: That would be the transpose $(XW)^\top$.
      - text: $5 \times 3$
        why: That is the shape of $X$ itself.
    explanation: The inner dimensions (3) must match and disappear; the product keeps the outer dimensions, so $XW$ is $5 \times 4$ [^1][^2].
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slides 35–36
      - source: d2l
        locator: Sec. 2.3 Linear Algebra
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
    source:
      id: ncu-intro-dl
      ref: exercise-03/q08
    status: reviewed
