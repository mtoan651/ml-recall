  - id: linear-algebra-034
    type: single
    difficulty: medium
    tags:
      - einstein-notation
      - einsum
      - trace
      - code-reading
    question: |
      In Einstein notation $\textrm{tr}(A^4) = a_{ij}a_{jk}a_{kl}a_{li}$. Which call computes
      $\textrm{tr}(A^4)$ for a square tensor `A`?
    options:
      - text: "`torch.einsum('ij,jk,kl,li->', A, A, A, A)`"
        correct: true
      - text: "`torch.einsum('ij,jk,kl,li->i', A, A, A, A)`"
        why: Keeping the index $i$ in the output returns the vector of diagonal entries of $A^4$, not their sum.
      - text: "`torch.einsum('ii,ii,ii,ii->', A, A, A, A)`"
        why: This sums $a_{ii}^4$, the fourth powers of the diagonal of $A$, which ignores all off-diagonal entries.
      - text: "`torch.einsum('ij,ji,ij,ji->', A, A, A, A)`"
        why: This computes $\sum_{ij} (a_{ij}a_{ji})^2$; the indices do not chain $A \cdot A \cdot A \cdot A$.
    explanation: |
      In Einstein notation every index that appears twice is summed [^1]. The chain
      $a_{ij}a_{jk}a_{kl}$ builds $(A^3)_{il}$, multiplying by $a_{li}$ and summing over $i$ closes
      the chain into the trace. In `einsum` the same indices are written as a string, and an empty
      output after `->` means that every index is summed, giving a scalar [^2]. For example
      $\textrm{tr}(A) = a_{ii}$ is `einsum('ii->', A)`.
    references:
      - source: d2l
        locator: Sec. 22.1.9.1 Common Examples from Linear Algebra (Einstein notation)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#common-examples-from-linear-algebra
      - source: d2l
        locator: Sec. 22.1.9.2 Expressing in Code (einsum)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#expressing-in-code
      - source: d2l
        locator: Sec. 22.1.11 Exercises, Exercise 7
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops#ex7
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
