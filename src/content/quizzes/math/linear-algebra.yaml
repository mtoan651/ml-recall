questions:
  - id: linear-algebra-001
    type: single
    difficulty: medium
    question: What is the dimensionality of the null space of the following matrix? A = [[3, 2, −9], [−6, −4, 18], [12, 8, −36]]
    options:
      - text: '0'
      - text: '1'
      - text: '2'
        correct: true
      - text: '3'
    explanation: |
      The second row is $-2$ times the first and the third row is $4$ times the first, so only one row (and one column) is linearly independent and $\operatorname{rank}(A) = 1$ [^1]. The rank theorem says rank plus nullity equals the number of columns [^2], so the null space has dimension $3 - 1 = 2$.
      The answer 1 confuses nullity with rank. The answer 3 would only hold for the zero matrix.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#rank
        locator: Sec. 22.1.6 Rank
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/rank-thm.html#rank-theorem
        locator: Sec. 2.9 The Rank Theorem
    source:
      id: mmlu-redux
      ref: machine_learning/9
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=9
