  - id: linear-algebra-002
    type: single
    difficulty: easy
    question: What is the rank of the following matrix? A = [[1, 1, 1], [1, 1, 1], [1, 1, 1]]
    options:
      - text: '0'
      - text: '1'
        correct: true
      - text: '2'
      - text: '3'
    explanation: |
      Rank is the largest number of linearly independent columns [^1]. All three columns equal $(1,1,1)^\top$, so any two of them are dependent, while one nonzero column on its own is independent. That gives rank 1. A rank of 0 would need the zero matrix, and rank 3 would need an invertible matrix.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#rank
        locator: Sec. 22.1.6 Rank
