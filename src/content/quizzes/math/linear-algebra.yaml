  - id: linear-algebra-023
    type: single
    difficulty: hard
    question: |
      Consider the system of linear equations

      $$
      \begin{aligned}
      w + 3x + 2y + 2z &= 0 \\
      w + 4x + y &= 0 \\
      3w + 5x + 10y + 14z &= 0 \\
      2w + 5x + 5y + 6z &= 0
      \end{aligned}
      $$

      with solutions of the form $(w, x, y, z)$, where $w$, $x$, $y$ and $z$ are real. Which of the following statements is FALSE?
    options:
      - text: The system is consistent.
      - text: The system has infinitely many solutions.
      - text: The sum of any two solutions is a solution.
      - text: Every solution is a scalar multiple of $(-5, 1, 1, 0)$.
        correct: true
    explanation: |
      The system is homogeneous, so it always has the zero solution (it is consistent) [^1]. Its solutions form the null space, a subspace, so the sum of two solutions is again a solution [^2]. Row reduction gives $w + 5y + 8z = 0$ and $x - y - 2z = 0$, leaving two free variables ($y$ and $z$). So there are infinitely many solutions, $y(-5,1,1,0) + z(-8,2,0,1)$, in parametric vector form [^1].
      This solution set is two-dimensional. For example, $(-8,2,0,1)$ solves all four equations but is not a multiple of $(-5,1,1,0)$, which is why "every solution is a scalar multiple" is the false statement.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/solution-sets.html#solnsets-homog
        locator: Sec. 2.4.1 Homogeneous Systems
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/subspaces.html#definition-23
        locator: Sec. 2.6.2, Definition of the null space (a subspace)
    source:
      id: mmlu-redux
      ref: college_mathematics/99
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=99
    status: draft
  - id: linear-algebra-024
    type: single
    difficulty: medium
    question: Suppose $P$ is the vector space of polynomials with real coefficients and degree at most 7. If the operator $D$ sends $p(x)$ in $P$ to its derivative $p'(x)$, what are the dimensions of the null space $n$ and the range $r$ of $D$?
    options:
      - text: $n = 1$ and $r = 6$
      - text: $n = 1$ and $r = 7$
        correct: true
      - text: $n = 2$ and $r = 5$
      - text: $n = 2$ and $r = 6$
    explanation: '$P$ has the basis $1, x, \dots, x^7$, so $\dim P = 8$, and differentiation is linear. Its null space is the constant polynomials, the only ones with derivative 0, so $n = 1$. Its range is all polynomials of degree at most 6, since each $x^k$ with $k \le 6$ is the derivative of $x^{k+1}/(k+1)$, so $r = 7$. This matches the rank theorem: in the monomial basis $D$ is an $8 \times 8$ matrix, and rank plus nullity equals the number of columns, $7 + 1 = 8$ [^1].'
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/rank-thm.html#rank-theorem
        locator: Sec. 2.9 The Rank Theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/13
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=13
    status: draft
  - id: linear-algebra-025
    type: single
    difficulty: medium
    question: Let $M$ be a $5 \times 5$ real matrix. Exactly three of the following four conditions on $M$ are equivalent to each other. Which condition is NOT equivalent to the other three?
    options:
      - text: For any two distinct column vectors $u$ and $v$ of $M$, the set $\{u, v\}$ is linearly independent.
        correct: true
      - text: The homogeneous system $Mx = 0$ has only the trivial solution.
      - text: The system of equations $Mx = b$ has a unique solution for each real $5 \times 1$ column vector $b$.
      - text: The determinant of $M$ is nonzero.
    explanation: "By the invertible matrix theorem, '$Mx = 0$ has only the trivial solution' and '$Mx = b$ has a unique solution for every $b$' are both equivalent to $M$ being invertible [^1], and a square matrix is invertible exactly when its determinant is nonzero [^2]. Pairwise independence of the columns is much weaker than independence of all five: the columns $e_1, e_2, e_1 + e_2, e_3, e_4$ are pairwise independent, yet the third is the sum of the first two, so that $M$ is singular. Invertibility implies pairwise independence but not conversely, so pairwise independence is the odd one out."
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/invertible-matrix-thm.html#imt-1
        locator: Sec. 3.6 The Invertible Matrix Theorem
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/determinants-definitions-properties.html#det-defn-invert-prop
        locator: Sec. 4.1 Determinants, Invertibility Property
    source:
      id: mmlu-redux
      ref: college_mathematics/15
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=15
    status: draft
  - id: linear-algebra-026
    type: single
    difficulty: medium
    question: Let $\mathbf{F}$ be a constant unit force that is parallel to the vector $(-1, 0, 1)$ in $xyz$-space. What is the work done by $\mathbf{F}$ on a particle that moves along the path $(t, t^2, t^3)$ between time $t = 0$ and time $t = 1$?
    options:
      - text: $-\frac{1}{4}$
      - text: $-\frac{1}{4\sqrt{2}}$
      - text: $0$
        correct: true
      - text: $\sqrt{2}$
    explanation: Work is the dot product of force and displacement [^1]; along a curve it is $W = \int \mathbf{F} \cdot d\mathbf{r}$, which for a constant force reduces to $\mathbf{F}$ dotted with the net displacement [^2]. The particle moves from $(0, 0, 0)$ to $(1, 1, 1)$, and $\pm\frac{1}{\sqrt{2}}(-1, 0, 1) \cdot (1, 1, 1) = 0$. The force is perpendicular to the net displacement, so the work is 0 whatever the curved path in between.
    references:
      - title: Active Calculus Multivariable (2nd ed.)
        url: https://activecalculus.org/multi2e/S-Precalc-DotProduct.html#S-Precalc-DotProduct-7
        locator: Sec. 9.4.5 Work, Force, and Displacement
      - title: 'Wikipedia: Work (physics)'
        url: https://en.wikipedia.org/wiki/Work_(physics)#Mathematical_calculation
        locator: Section 'Mathematical calculation' (constant force along a path)
    source:
      id: mmlu-redux
      ref: college_mathematics/45
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=45
    status: draft
  - id: linear-algebra-027
    type: single
    difficulty: hard
    question: |
      Suppose $V$ is a real vector space of finite dimension $n$. Call the set of linear maps from $V$ into itself $M(V)$. Let $T$ be in $M(V)$. Consider the two subspaces $U = \{X \in M(V) : TX = XT\}$ and $W = \{TX - XT : X \in M(V)\}$. Which of the following must be TRUE?

      I. If $V$ has a basis containing only eigenvectors of $T$, then $U = M(V)$.

      II. $\dim U + \dim W = n^2$

      III. $\dim U < n$
    options:
      - text: I only
      - text: II only
        correct: true
      - text: III only
      - text: I and II only
    explanation: 'The map $\phi(X) = TX - XT$ is linear on $M(V)$, a space of dimension $n^2$; $U$ is its null space and $W$ its range, so the rank theorem gives $\dim U + \dim W = n^2$ [^1]. Statement I fails: $T = \operatorname{diag}(1, 2)$ has a basis of eigenvectors, yet only diagonal matrices commute with it, so $U \ne M(V)$. Statement III fails too: $T = I$ commutes with every $X$, so $\dim U = n^2$, which is not less than $n$. Only II must hold.'
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/rank-thm.html#rank-theorem
        locator: Sec. 2.9 The Rank Theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/73
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=73
    status: draft
  - id: linear-algebra-028
    type: short_answer
    difficulty: easy
    tags:
      - dot-product
      - angle
      - cosine-similarity
    question: |
      What is the angle, in degrees, between $\mathbf{v}_1 = (1, 0, -1, 2)^\top$ and
      $\mathbf{v}_2 = (3, 1, 0, 1)^\top$?
    answer:
      numeric: 52.0
      tolerance: 0.1
      hint: degrees, 1 decimal
      model: $\cos\theta = \frac{5}{\sqrt{6}\sqrt{11}} = \frac{5}{\sqrt{66}} \approx 0.6155$, so $\theta \approx 52.0^\circ$
    explanation: |
      The angle satisfies
      $\cos\theta = \frac{\mathbf{v}_1 \cdot \mathbf{v}_2}{\lVert\mathbf{v}_1\rVert\lVert\mathbf{v}_2\rVert}$
      in any number of dimensions [^1]. Here $\mathbf{v}_1 \cdot \mathbf{v}_2 = 3 + 0 + 0 + 2 = 5$,
      $\lVert\mathbf{v}_1\rVert = \sqrt{6}$ and $\lVert\mathbf{v}_2\rVert = \sqrt{11}$, so
      $\cos\theta \approx 0.6155$ and $\theta \approx 52.0^\circ$ (0.908 rad). The cosine itself,
      $0.6155$, is the cosine similarity of the two vectors, a common way to compare embeddings
      because it ignores their lengths [^2].
    references:
      - source: d2l
        locator: Sec. 22.1.2 Dot Products and Angles
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#dot-products-and-angles
      - source: d2l
        locator: Sec. 22.1.2.1 Cosine Similarity
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#cosine-similarity
      - source: d2l
        locator: Sec. 22.1.11 Exercises, Exercise 1
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops#ex1
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    status: draft
  - id: linear-algebra-029
    type: true_false
    difficulty: easy
    tags:
      - matrix-inverse
      - shear
    shuffle: false
    question: |
      True or false: $\begin{bmatrix} 1 & 2 \\ 0 & 1 \end{bmatrix}$ and
      $\begin{bmatrix} 1 & -2 \\ 0 & 1 \end{bmatrix}$ are inverses of each other.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Multiplying gives $\begin{bmatrix} 1 & -2 + 2 \\ 0 & 1 \end{bmatrix} = \mathbf{I}$, in either order [^1].
    explanation: |
      The first matrix is a shear that moves each point horizontally by twice its height; the second
      shears back by the same amount. The product is the identity in both orders, which is the
      definition of an inverse [^1]. The $2 \times 2$ formula agrees: with determinant
      $ad - bc = 1$, the inverse of $\begin{bmatrix} a & b \\ c & d \end{bmatrix}$ is
      $\begin{bmatrix} d & -b \\ -c & a \end{bmatrix} = \begin{bmatrix} 1 & -2 \\ 0 & 1 \end{bmatrix}$
      [^1].
    references:
      - source: d2l
        locator: Sec. 22.1.7 Invertibility (definition and the $2 \times 2$ inverse formula)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#invertibility
      - source: d2l
        locator: Sec. 22.1.11 Exercises, Exercise 2
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops#ex2
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    status: draft
  - id: linear-algebra-030
    type: short_answer
    difficulty: easy
    tags:
      - determinant
      - area
      - linear-transformations
    question: |
      A shape in the plane has area $100\ \textrm{m}^2$. What is its area, in $\textrm{m}^2$, after it is
      transformed by $\begin{bmatrix} 2 & 3 \\ 1 & 2 \end{bmatrix}$?
    answer:
      numeric: 100
      tolerance: 0
      hint: a number
      model: $\det = 2 \cdot 2 - 3 \cdot 1 = 1$, so the area stays $100\ \textrm{m}^2$
    explanation: |
      A linear map multiplies every area by $|\det A|$: it sends each small square of a figure to a
      parallelogram whose area is scaled by the determinant [^1]. Here $\det A = 4 - 3 = 1$, so the
      shape is sheared and stretched but keeps its area of $100\ \textrm{m}^2$. In $n$ dimensions the
      determinant scales volumes the same way [^1].
    references:
      - source: d2l
        locator: Sec. 22.1.8 Determinant
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#determinant
      - source: d2l
        locator: Sec. 22.1.11 Exercises, Exercise 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops#ex3
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
    status: draft
  - id: linear-algebra-031
    type: single
    difficulty: medium
    tags:
      - linear-independence
      - determinant
    shuffle: false
    question: |
      Which of these sets of vectors in $\mathbb{R}^3$ are linearly independent?

      - A: $(1, 0, -1)$, $(2, 1, -1)$, $(3, 1, 1)$
      - B: $(3, 1, 1)$, $(1, 1, 1)$, $(0, 0, 0)$
      - C: $(1, 1, 0)$, $(0, 1, -1)$, $(1, 0, 1)$
    options:
      - text: Only A
        correct: true
      - text: Only C
        why: In C, $(1, 1, 0) - (0, 1, -1) = (1, 0, 1)$, so the third vector is a combination of the other two [^1].
      - text: A and C
        why: C is dependent, since its third vector equals the first minus the second [^1].
      - text: A and B
        why: Any set containing the zero vector is dependent, since $1 \cdot \mathbf{0} = \mathbf{0}$ is a nontrivial combination [^1].
    explanation: |
      Vectors are linearly dependent if some combination with coefficients not all zero gives the
      zero vector [^1]. B contains $\mathbf{0}$, and in C the third vector is the first minus the
      second, so both are dependent. For A, the matrix with these columns has determinant 3, which is
      nonzero, so the matrix does not squash space into a lower dimension and its columns are
      independent [^2].
    references:
      - source: d2l
        locator: Sec. 22.1.5 Linear Dependence
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#linear-dependence
      - source: d2l
        locator: Sec. 22.1.8 Determinant (invertible if and only if the determinant is nonzero)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#determinant
