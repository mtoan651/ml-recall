  - id: linear-algebra-019
    type: single
    difficulty: hard
    question: |
      Suppose A and B are n × n matrices with real entries. Which of the follow are TRUE?
      I. The trace of A^2 is nonnegative.
      II. If A^2 = A, then the trace of A is nonnegative.
      III. The trace of AB is the product of the traces of A and B.
    options:
      - text: II only
        correct: true
      - text: III only
      - text: I and II only
      - text: II and III only
    explanation: |
      The trace is the sum of the diagonal entries [^1].
      - **I is false.** The rotation $A = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ has $A^2 = -I$, so $\operatorname{tr}(A^2) = -2$.
      - **III is false.** For $A = B = I_2$, $\operatorname{tr}(AB) = 2$ but $\operatorname{tr}A \cdot \operatorname{tr}B = 4$.
      - **II is true.** An idempotent matrix ($A^2 = A$) has eigenvalues 0 and 1 and is diagonalizable, and its trace equals its rank, which is never negative [^2].
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/characteristic-polynomial.html#paragraphs-19
        locator: Sec. 5.2, Form of the characteristic polynomial (definition of the trace)
      - title: Idempotent matrix (Wikipedia)
        url: https://en.wikipedia.org/wiki/Idempotent_matrix#Trace
        locator: Trace
    source:
      id: mmlu-redux
      ref: college_mathematics/75
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=75
    status: draft
  - id: linear-algebra-020
    type: single
    difficulty: medium
    question: |
      If v is an eigenvector of an invertible matrix A, then which of the following is I are necessarily
      true?
      I. v is also an eigenvector of 2A.
      II. v is also an eigenvector of A^2.
      III. v is also an eigenvector of A^(-1).
    options:
      - text: I only
      - text: II only
      - text: III only
      - text: I, II, and III
        correct: true
    explanation: |
      By definition $Av = \lambda v$ with $v \ne 0$ [^1]. Then $(2A)v = 2\lambda v$ and $A^2 v = A(\lambda v) = \lambda^2 v$, so $v$ is an eigenvector of both. Raising a matrix to a power raises its eigenvalues to that power [^2]. Because $A$ is invertible, $0$ is not an eigenvalue, so $\lambda \ne 0$ [^1]. Applying $A^{-1}$ to $Av = \lambda v$ then gives $A^{-1}v = \lambda^{-1} v$, matching the fact that inverting a matrix inverts its eigenvalues [^2]. So all three statements hold.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/eigenvectors.html#evecs-eval0
        locator: 'Sec. 5.1, Definition of eigenvector; Fact: 0 is an eigenvalue iff A is not invertible'
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/eigendecomposition.html#operations-on-eigendecompositions
        locator: Sec. 22.2.3 Operations on Eigendecompositions
    source:
      id: mmlu-redux
      ref: college_mathematics/86
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=86
    status: draft
  - id: linear-algebra-021
    type: single
    difficulty: medium
    question: For which p is the norm ||x||_p expressable as an inner product?
    options:
      - text: '1'
      - text: '2'
        correct: true
      - text: p >= 1
      - text: infinity
    explanation: |
      A norm comes from an inner product exactly when it satisfies the parallelogram law $\|x+y\|^2 + \|x-y\|^2 = 2\|x\|^2 + 2\|y\|^2$, and among the $p$-norms only $p = 2$ does [^1]. For $x = (1,0)$ and $y = (0,1)$, the 1-norm gives $4 + 4 = 8 \ne 4$, and the $\infty$-norm gives $1 + 1 = 2 \ne 4$. So neither $p = 1$, nor $p = \infty$, nor "every $p \ge 1$" works. The Euclidean norm is $\|x\|_2 = \sqrt{\sum_i x_i^2}$ [^2], which is exactly $\sqrt{x \cdot x}$.
    references:
      - title: Parallelogram law (Wikipedia)
        url: https://en.wikipedia.org/wiki/Parallelogram_law#Normed_vector_spaces_satisfying_the_parallelogram_law
        locator: Normed vector spaces satisfying the parallelogram law
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#norms
        locator: Sec. 2.3.11 Norms, Eq. (2.3.13)
    source:
      id: mmlu-redux
      ref: college_mathematics/94
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=94
    status: draft
  - id: linear-algebra-022
    type: single
    difficulty: easy
    question: Which of the following is not always true for x, y, z ∈ R^k?
    options:
      - text: '|x| ≥ 0'
      - text: '|x · y| ≤ |x||y|'
      - text: '|x| = 0 if and only if x = 0'
      - text: '|x + y| = |x| + |y|'
        correct: true
    explanation: |
      A norm only satisfies the triangle **inequality** $|x + y| \le |x| + |y|$ [^1]. Equality needs $x$ and $y$ to point the same way. For $x = (1,0)$ and $y = (-1,0)$, $|x+y| = 0$ but $|x|+|y| = 2$.
      The other three statements always hold. Norms are nonnegative and vanish only at $x = 0$ [^1]. $|x \cdot y| \le |x||y|$ (Cauchy–Schwarz) follows from $x \cdot y = |x||y|\cos\theta$ [^2].
    references:
      - source: d2l
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#norms
        locator: Sec. 2.3.11 Norms
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#dot-products-and-angles
        locator: Sec. 22.1.2 Dot Products and Angles, Eq. (22.1.6)
    source:
      id: mmlu-redux
      ref: college_mathematics/95
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=95
