  - id: linear-algebra-007
    type: single
    difficulty: medium
    question: 'Let $T: \mathbb{R}^2 \to \mathbb{R}^2$ be the linear transformation that maps the point $(1, 2)$ to $(2, 3)$ and the point $(-1, 2)$ to $(2, -3)$. Then $T$ maps the point $(2, 1)$ to'
    options:
      - text: $(1, 6)$
        correct: true
      - text: $(-1, 4)$
      - text: $(3, 2)$
      - text: $(-4, 3)$
    explanation: |
      A linear map sends a linear combination of inputs to the same combination of outputs [^1]. Write $(2,1) = a(1,2) + b(-1,2)$: then $a - b = 2$ and $2a + 2b = 1$, so $a = \tfrac54$ and $b = -\tfrac34$. Hence
      $$T(2,1) = \tfrac54(2,3) - \tfrac34(2,-3) = \left(\tfrac{10-6}{4}, \tfrac{15+9}{4}\right) = (1, 6).$$
      The other options come from guessing a pattern (such as swapping coordinates) rather than decomposing $(2,1)$ in the given basis.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/linear-transformations.html#fact-3
        locator: Sec. 3.3, Facts about linear transformations
    source:
      id: mmlu-redux
      ref: college_mathematics/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=0
    status: draft
  - id: linear-algebra-008
    type: single
    difficulty: medium
    question: Let $V$ be the vector space, under the usual operations, of real polynomials that are of degree at most 3. Let $W$ be the subspace of all polynomials $p(x)$ in $V$ such that $p(0) = p(1) = p(-1) = 0$. Then $\dim V + \dim W$ is
    options:
      - text: '4'
      - text: '5'
        correct: true
      - text: '6'
      - text: '7'
    explanation: |
      Polynomials of degree at most 3 have the basis $\{1, x, x^2, x^3\}$, so $\dim V = 4$. This is the degree-3 version of the textbook example where $\{1, x, x^2\}$ gives dimension 3 [^1]. Writing $p = a + bx + cx^2 + dx^3$, the conditions become $a = 0$, $b + c + d = 0$ and $-b + c - d = 0$, three independent linear equations in four unknowns. By the rank theorem the solution space has dimension $4 - 3 = 1$ [^2]. Solving gives $c = 0$ and $d = -b$, so $W = \operatorname{span}\{x - x^3\}$ and $\dim V + \dim W = 5$. Answering 4 forgets $W$, and 6 or 7 overcount it.
    references:
      - title: A First Course in Linear Algebra (Kuttler), LibreTexts
        url: https://math.libretexts.org/Bookshelves/Linear_Algebra/A_First_Course_in_Linear_Algebra_(Kuttler)/09%3A_Vector_Spaces/9.04%3A_Subspaces_and_Basis
        locator: Sec. 9.4, Example 9.4.5 Dimension of a Vector Space
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/rank-thm.html#rank-theorem
        locator: Sec. 2.9 The Rank Theorem
    source:
      id: mmlu-redux
      ref: college_mathematics/1
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=1
    status: draft
  - id: linear-algebra-009
    type: single
    difficulty: medium
    question: Let $V$ and $W$ be 4-dimensional subspaces of a 7-dimensional vector space $X$. Which of the following CANNOT be the dimension of the subspace $V \cap W$?
    options:
      - text: '0'
        correct: true
      - text: '1'
      - text: '2'
      - text: '3'
    explanation: |
      The dimension formula gives $\dim(V+W) = \dim V + \dim W - \dim(V \cap W)$ [^1]. Since $V + W$ sits inside the 7-dimensional space $X$, we get $\dim(V \cap W) = 8 - \dim(V+W) \ge 8 - 7 = 1$. So two 4-dimensional subspaces of a 7-dimensional space must share at least a line, and dimension 0 is impossible. Dimensions 1, 2 and 3 all occur (and 4 when $V = W$).
    references:
      - title: A First Course in Linear Algebra (Kuttler), LibreTexts
        url: https://math.libretexts.org/Bookshelves/Linear_Algebra/A_First_Course_in_Linear_Algebra_(Kuttler)/09%3A_Vector_Spaces/9.05%3A_Sums_and_Intersections
        locator: Sec. 9.5, Theorem 9.5.1 Dimension of Sum
    source:
      id: mmlu-redux
      ref: college_mathematics/10
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=10
    status: draft
  - id: linear-algebra-010
    type: single
    difficulty: medium
    question: If $f$ is a linear transformation from the plane to the real numbers and if $f(1, 1) = 1$ and $f(-1, 0) = 2$, then $f(3, 5) =$
    options:
      - text: '9'
        correct: true
      - text: '8'
      - text: '0'
      - text: '-5'
    explanation: |-
      A linear map $\mathbb{R}^2 \to \mathbb{R}$ has the form $f(x,y) = ax + by$, and linearity lets you evaluate it on any combination of known inputs [^1]. From $f(-1,0) = -a = 2$ we get $a = -2$, and $f(1,1) = a + b = 1$ gives $b = 3$. Therefore $f(3,5) = 3(-2) + 5(3) = 9$. A quick check guards against sign slips: $f(1,1) = -2 + 3 = 1$ and $f(-1,0) = 2$, as required. Taking $a = +2$ by mistake would give $b = -1$ and $f(3,5) = 1$.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/linear-transformations.html#fact-3
        locator: Sec. 3.3, Facts about linear transformations
    source:
      id: mmlu-redux
      ref: college_mathematics/21
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=21
    status: draft
  - id: linear-algebra-011
    type: single
    difficulty: medium
    question: In $xyz$-space, what are the coordinates of the point on the plane $2x + y + 3z = 3$ that is closest to the origin?
    options:
      - text: $(0, 0, 1)$
      - text: $(3/7, 3/14, 9/14)$
        correct: true
      - text: $(7/15, 8/15, 1/15)$
      - text: $(5/6, 1/3, 1/3)$
    explanation: |
      For a fixed vector $\mathbf w$, the points $\mathbf v$ with $\mathbf w \cdot \mathbf v = c$ form a hyperplane at right angles to $\mathbf w$. Every such point has the same projection length, $c/\|\mathbf w\|$, onto the direction of $\mathbf w$ [^1]. Here $\mathbf w = (2,1,3)$ and $c = 3$, so no point of the plane is closer to the origin than $3/\sqrt{14} \approx 0.80$. The only point at exactly that distance is the one lying along $\mathbf w$: $t(2,1,3)$ with $14t = 3$, which is $(\tfrac37, \tfrac{3}{14}, \tfrac{9}{14})$. $(0,0,1)$ and $(\tfrac56, \tfrac13, \tfrac13)$ satisfy the plane equation but are farther away (distance 1 and about 0.96). $(\tfrac{7}{15}, \tfrac{8}{15}, \tfrac{1}{15})$ is not on the plane.
    references:
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#hyperplanes
        locator: Sec. 22.1.3 Hyperplanes, Eq. (22.1.10)
    source:
      id: mmlu-redux
      ref: college_mathematics/29
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=29
    status: draft
  - id: linear-algebra-012
    type: single
    difficulty: hard
    question: |
      Let $V$ be a finite-dimensional real vector space and let $P$ be a linear transformation of $V$ such that $P^2 = P$. Which of the following must be true?

      I. $P$ is invertible.

      II. $P$ is diagonalizable.

      III. $P$ is either the identity transformation or the zero transformation.
    options:
      - text: None
      - text: I only
      - text: II only
        correct: true
      - text: III only
    explanation: |
      A map with $P^2 = P$ is a projection. Its only possible eigenvalues are 0 and 1, and it is always diagonalizable [^1]. To see why, write $v = Pv + (v - Pv)$: $P$ fixes $Pv$ and sends $v - Pv$ to $0$, so eigenvectors span $V$.
      The other two statements fail for an orthogonal projection onto a line in $\mathbb{R}^2$, which satisfies $B^2 = B$ and is similar to $\operatorname{diag}(1, 0)$ [^2]. It has a nonzero null space, so it is not invertible, and it is neither the identity nor the zero map. In fact the identity is the only invertible idempotent matrix [^3].
    references:
      - title: Idempotent matrix (Wikipedia)
        url: https://en.wikipedia.org/wiki/Idempotent_matrix#Eigenvalues
        locator: Eigenvalues
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/projections.html#projections-matrices-properties-of
        locator: Sec. 6.3, Properties of Projection Matrices
      - title: Idempotent matrix (Wikipedia)
        url: https://en.wikipedia.org/wiki/Idempotent_matrix#Singularity_and_regularity
        locator: Singularity and regularity
    source:
      id: mmlu-redux
      ref: college_mathematics/30
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=30
    status: draft
  - id: linear-algebra-013
    type: single
    difficulty: medium
    question: |
      Suppose $A$ and $B$ are $n \times n$ invertible matrices, where $n > 1$, and $I$ is the $n \times n$ identity matrix. If $A$ and $B$ are similar matrices, which of the following statements must be true?

      I. $A - 2I$ and $B - 2I$ are similar matrices.

      II. $A$ and $B$ have the same trace.

      III. $A^{-1}$ and $B^{-1}$ are similar matrices.
    options:
      - text: I only
      - text: II only
      - text: I and II only
      - text: I, II, and III
        correct: true
    explanation: |
      Similar means $A = CBC^{-1}$ for some invertible $C$ [^1]. All three statements then follow:
      - $A - 2I = C(B - 2I)C^{-1}$, the same identity used to show that similar matrices share a characteristic polynomial [^1].
      - Similar matrices have the same characteristic polynomial and therefore the same trace [^1].
      - Inverting both sides gives $A^{-1} = (CBC^{-1})^{-1} = CB^{-1}C^{-1}$.

      So any option that leaves out a statement is incomplete.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/similarity.html#similarity-charpoly
        locator: Sec. 5.3 Similarity (Subsec. 5.3.1 definition; 5.3.3 Eigenvalues of Similar Matrices)
    source:
      id: mmlu-redux
      ref: college_mathematics/36
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=36
    status: draft
  - id: linear-algebra-014
    type: single
    difficulty: hard
    question: Let $I \ne A \ne -I$, where $I$ is the identity matrix and $A$ is a real $2 \times 2$ matrix. If $A = A^{-1}$, then the trace of $A$ is
    options:
      - text: '2'
      - text: '1'
      - text: '0'
        correct: true
      - text: '-1'
    explanation: |
      From $Av = \lambda v$ we get $v = A^2 v = \lambda^2 v$, so every eigenvalue is $\pm 1$. Because $(A - I)(A + I) = A^2 - I = 0$, an invertible $A + I$ would force $A = I$. So $A + I$ is singular and $-1$ is an eigenvalue, and the same argument with $A \ne -I$ makes $1$ an eigenvalue too [^1]. A $2 \times 2$ matrix has characteristic polynomial $\lambda^2 - \operatorname{Tr}(A)\lambda + \det A$ [^2]. Its roots are $1$ and $-1$, so $\operatorname{Tr}(A) = 1 + (-1) = 0$ (for example, $\operatorname{diag}(1,-1)$). A trace of 2 or $-2$ would need a repeated eigenvalue, which here means $A = I$ or $A = -I$, the excluded cases.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/characteristic-polynomial.html#theorem-27
        locator: 'Sec. 5.2, Theorem: Eigenvalues are roots of the characteristic polynomial'
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/characteristic-polynomial.html#bluebox-60
        locator: 'Sec. 5.2, Recipe: The characteristic polynomial of a 2×2 matrix'
    source:
      id: mmlu-redux
      ref: college_mathematics/41
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=41
    status: draft
  - id: linear-algebra-015
    type: single
    difficulty: medium
    question: |
      Suppose $A$ is a $3 \times 3$ matrix such that $\det(A - \lambda I) = -\lambda^3 + 3\lambda^2 + \lambda - 3$, where $I$ is the $3 \times 3$ identity matrix. Which of the following are TRUE of $A$?

      I. The trace of $A$ is 3.

      II. The determinant of $A$ is $-3$.

      III. The matrix $A$ has eigenvalues $-3$ and $1$.
    options:
      - text: I only
      - text: II only
      - text: I, II, and III
      - text: I and II only
        correct: true
    explanation: |
      For an $n \times n$ matrix, $\det(A - \lambda I) = (-1)^n\lambda^n + (-1)^{n-1}\operatorname{Tr}(A)\lambda^{n-1} + \dots + \det A$ [^1]. With $n = 3$ the $\lambda^2$ coefficient is $\operatorname{Tr}(A) = 3$, and the constant term is $\det A = -3$, so I and II hold. Factoring gives $-\lambda^3 + 3\lambda^2 + \lambda - 3 = -(\lambda - 3)(\lambda - 1)(\lambda + 1)$, so the eigenvalues (the roots [^2]) are $3$, $1$ and $-1$. Since $-3$ is not a root, III is false.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/characteristic-polynomial.html#charpoly-is-poly
        locator: Sec. 5.2, Form of the characteristic polynomial (theorem)
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/characteristic-polynomial.html#theorem-27
        locator: 'Sec. 5.2, Theorem: Eigenvalues are roots of the characteristic polynomial'
    source:
      id: mmlu-redux
      ref: college_mathematics/52
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=52
    status: draft
  - id: linear-algebra-016
    type: single
    difficulty: medium
    question: If $V$ and $W$ are 2-dimensional subspaces of $\mathbb{R}^4$, what are the possible dimensions of the subspace $V \cap W$?
    options:
      - text: 1 only
      - text: 2 only
      - text: 0 and 1 only
      - text: 0, 1, and 2 only
        correct: true
    explanation: |
      By $\dim(V+W) = \dim V + \dim W - \dim(V \cap W)$ [^1], we get $\dim(V \cap W) = 4 - \dim(V + W)$. Since $\dim(V+W)$ can be anything from 2 to 4 inside $\mathbb{R}^4$, the intersection can have dimension 2, 1 or 0. With standard basis vectors $e_i$:
      - $\operatorname{span}\{e_1,e_2\} \cap \operatorname{span}\{e_3,e_4\} = \{0\}$ (dimension 0);
      - $\operatorname{span}\{e_1,e_2\} \cap \operatorname{span}\{e_2,e_3\} = \operatorname{span}\{e_2\}$ (dimension 1);
      - $V = W$ gives dimension 2.

      Options that leave out 0 are thinking of $\mathbb{R}^3$, where two planes through the origin must share a line.
    references:
      - title: A First Course in Linear Algebra (Kuttler), LibreTexts
        url: https://math.libretexts.org/Bookshelves/Linear_Algebra/A_First_Course_in_Linear_Algebra_(Kuttler)/09%3A_Vector_Spaces/9.05%3A_Sums_and_Intersections
        locator: Sec. 9.5, Theorem 9.5.1 Dimension of Sum
    source:
      id: mmlu-redux
      ref: college_mathematics/58
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=58
    status: draft
  - id: linear-algebra-017
    type: single
    difficulty: medium
    question: If $A$ is the $2 \times 2$ matrix whose $(i, j)$ entry is equal to $i + j$, and $B$ is the $3 \times 3$ matrix whose $(i, j)$ entry is equal to $i + j$, find the value of the sum $\det A + \det B$.
    options:
      - text: '-2'
      - text: '-1'
        correct: true
      - text: '0'
      - text: '2'
    explanation: |
      $A = \begin{pmatrix} 2 & 3 \\ 3 & 4 \end{pmatrix}$, so $\det A = ad - bc = 8 - 9 = -1$ [^1]. $B = \begin{pmatrix} 2&3&4 \\ 3&4&5 \\ 4&5&6 \end{pmatrix}$ has columns satisfying $c_1 + c_3 = 2c_2$. Linearly dependent columns force $\det B = 0$ [^2]. So $\det A + \det B = -1$. The answer $-2$ comes from assuming $\det B = \det A$, and 0 comes from overlooking that $A$ is invertible.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/determinants-definitions-properties.html#det-defn-22-again
        locator: 'Sec. 4.1, Example: the determinant of a 2×2 matrix'
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/determinants-definitions-properties.html#det-defn-dep-det0
        locator: 'Sec. 4.1, Corollary: linearly dependent rows or columns give det = 0'
    source:
      id: mmlu-redux
      ref: college_mathematics/60
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=60
    status: draft
  - id: linear-algebra-018
    type: single
    difficulty: medium
    question: Let $V$ be the real vector space of all real $2 \times 3$ matrices, and let $W$ be the real vector space of all real $4 \times 1$ column vectors. If $T$ is a linear transformation from $V$ onto $W$, what is the dimension of the subspace kernel of $T$?
    options:
      - text: '2'
        correct: true
      - text: '3'
      - text: '4'
      - text: '5'
    explanation: |
      For a linear map $T: V \to W$, $\dim V = \dim\ker T + \dim\operatorname{im} T$ [^1]. The space of $2 \times 3$ matrices has dimension 6, with the six matrices that have a single 1 as a basis (just as $M_{22}$ has four [^2]). "Onto" means $\operatorname{im} T = W$, which has dimension 4. So $\dim \ker T = 6 - 4 = 2$. The answer 4 mixes up the kernel with the image.
    references:
      - title: A First Course in Linear Algebra (Kuttler), LibreTexts
        url: https://math.libretexts.org/Bookshelves/Linear_Algebra/A_First_Course_in_Linear_Algebra_(Kuttler)/09%3A_Vector_Spaces/9.08%3A_The_Kernel_and_Image_of_a_Linear_Map
        locator: Sec. 9.8, Theorem 9.8.1 Dimension of Kernel + Image
      - title: A First Course in Linear Algebra (Kuttler), LibreTexts
        url: https://math.libretexts.org/Bookshelves/Linear_Algebra/A_First_Course_in_Linear_Algebra_(Kuttler)/09%3A_Vector_Spaces/9.04%3A_Subspaces_and_Basis
        locator: Sec. 9.4, Example 9.4.8 Adding to a Linearly Independent Set (basis of M22)
    source:
