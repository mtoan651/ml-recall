  - id: linear-algebra-036
    type: short_answer
    difficulty: easy
    tags:
      - norms
      - l1-norm
      - manhattan-distance
    question: |
      In a city grid you can only walk along avenues and streets, never diagonally. Positions are
      given as (avenue, street). How many blocks do you walk from the corner $(3, 10)$ to the corner
      $(7, 2)$ along a shortest route?
    answer:
      numeric: 12
      tolerance: 0
      hint: a number of blocks
      model: $|7 - 3| + |2 - 10| = 4 + 8 = 12$ blocks, the $\ell_1$ distance
    explanation: |
      Without diagonal moves, every route has to cover the avenue gap and the street gap separately,
      so the shortest walk is the sum of the absolute coordinate differences: the $\ell_1$ norm of the
      difference vector, which d2l calls the Manhattan distance [^1]. Here that is $4 + 8 = 12$
      blocks. Flying straight would cover the $\ell_2$ distance $\sqrt{4^2 + 8^2} \approx 8.94$
      blocks, which is never longer than the $\ell_1$ distance [^2].
    references:
      - source: d2l
        locator: Sec. 2.3.11 Norms
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#norms
      - title: 'Wikipedia: Taxicab geometry'
        locator: Introduction (formal definition)
        url: https://en.wikipedia.org/wiki/Taxicab_geometry
      - source: d2l
        locator: Sec. 2.3.13 Exercises, Exercise 7
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/linear-algebra#ex7
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
