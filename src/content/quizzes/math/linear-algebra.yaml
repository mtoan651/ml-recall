  - id: linear-algebra-032
    type: true_false
    difficulty: easy
    tags:
      - determinant
      - rank
      - outer-product
    shuffle: false
    question: |
      True or false: for any numbers $a, b, c, d$, the matrix
      $A = \begin{bmatrix} c \\ d \end{bmatrix}\begin{bmatrix} a & b \end{bmatrix}$ (a column times a
      row) has determinant 0.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: $A = \begin{bmatrix} ca & cb \\ da & db \end{bmatrix}$, so $\det A = ca \cdot db - cb \cdot da = 0$ for every choice of numbers.
    explanation: |
      An outer product $\mathbf{u}\mathbf{v}^\top$ has every column a multiple of $\mathbf{u}$, so
      its rank is at most 1 [^1]. It squashes the plane onto a line (or a point), so the unit square
      becomes a figure of zero area and the determinant is 0 [^2]. Low-rank products of this kind are
      the building block of matrix factorizations and low-rank weight updates.
    references:
