  - id: linear-algebra-037
    type: short_answer
    difficulty: hard
    tags:
      - matrix-multiplication
      - computational-cost
      - associativity
    question: |
      Let $\mathbf{A} \in \mathbb{R}^{2^{10} \times 2^{16}}$, $\mathbf{B} \in \mathbb{R}^{2^{16} \times 2^{5}}$
      and $\mathbf{C} \in \mathbb{R}^{2^{5} \times 2^{14}}$. Multiplying an $n \times k$ matrix by a
      $k \times m$ matrix takes $nkm$ scalar multiplications. How many times more multiplications does
      $\mathbf{A}(\mathbf{B}\mathbf{C})$ need than $(\mathbf{A}\mathbf{B})\mathbf{C}$? Round to 1
      decimal.
    answer:
      numeric: 422.4
      tolerance: 0.5
      hint: a number, 1 decimal
      model: $\dfrac{2^{35} + 2^{40}}{2^{31} + 2^{29}} = \dfrac{2^{6} + 2^{11}}{5} = 422.4$
    explanation: |
      A product of an $n \times k$ and a $k \times m$ matrix consists of $nm$ dot products of length
      $k$ [^1]. $(\mathbf{A}\mathbf{B})\mathbf{C}$ costs $2^{10} \cdot 2^{16} \cdot 2^{5} = 2^{31}$
      for $\mathbf{A}\mathbf{B}$, a small $2^{10} \times 2^{5}$ matrix, plus
      $2^{10} \cdot 2^{5} \cdot 2^{14} = 2^{29}$, about $2.7 \times 10^9$ in total.
      $\mathbf{A}(\mathbf{B}\mathbf{C})$ first builds the $2^{16} \times 2^{14}$ matrix
      $\mathbf{B}\mathbf{C}$ ($2^{35}$ multiplications and $2^{30}$ entries, 4 GiB in float32) and then
      multiplies $\mathbf{A}$ by it ($2^{40}$), about $1.1 \times 10^{12}$ in total. Matrix
      multiplication is associative, so both orders give the same matrix, but choosing the cheapest
      order is the matrix chain ordering problem [^2].
    references:
      - source: d2l
        locator: Sec. 2.3.10 Matrix–Matrix Multiplication
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#matrixmatrix-multiplication
      - title: 'Wikipedia: Matrix chain multiplication'
        locator: Introduction
        url: https://en.wikipedia.org/wiki/Matrix_chain_multiplication
      - source: d2l
        locator: Sec. 2.3.13 Exercises, Exercise 10
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/linear-algebra#ex10
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
    status: draft
  - id: linear-algebra-038
    type: single
    difficulty: medium
    tags:
      - power-method
      - eigenvectors
      - pca
    question: |
      The power method iterates $\mathbf{v}_{k+1} = \Sigma \mathbf{w}_k$, $\mathbf{w}_{k+1} =
      \mathbf{v}_{k+1}/\lVert \mathbf{v}_{k+1} \rVert_2$ for a symmetric positive definite $\Sigma$
      (e.g. a data covariance matrix) with eigenvalues $\lambda_1 > \lambda_2 > \cdots > \lambda_n >
      0$ and orthonormal eigenvectors $\mathbf{u}_i$. Starting from $\mathbf{w}_0$ with
      $\mathbf{u}_1^\top \mathbf{w}_0 \neq 0$, what happens?
    options:
      - text: $\mathbf{w}_k$ converges to $\mathbf{u}_n$, the eigenvector of the smallest eigenvalue
        why: Repeated multiplication by $\Sigma$ amplifies the component with the *largest* eigenvalue the most [^1].
      - text: It converges to $\pm\mathbf{u}_1$; the other components shrink like $(\lambda_i/\lambda_1)^k$
        correct: true
      - text: $\mathbf{w}_k$ converges to $\mathbf{u}_1$ at a speed that does not depend on the eigenvalues
        why: In the eigenbasis the $i$-th component relative to the first scales like $(\lambda_i/\lambda_1)^k$, so a gap $\lambda_2 \approx \lambda_1$ makes convergence slow [^1][^2].
      - text: $\mathbf{w}_k$ reaches $\mathbf{u}_1$ exactly after $n$ iterations
        why: Convergence is geometric, not finite; the other components shrink but never vanish exactly [^1].
    explanation: |
      Writing $\Sigma = U\Lambda U^\top$ and $\tilde{\mathbf{w}}_k = U^\top\mathbf{w}_k$, the update
      becomes $\tilde{\mathbf{w}}_{k+1} \propto \Lambda\tilde{\mathbf{w}}_k$, so $\tilde{\mathbf{w}}_k
      \propto (\alpha_1\lambda_1^k, \ldots, \alpha_n\lambda_n^k)$ where $\alpha_i$ are the initial
      coordinates [^1]. Dividing by $\alpha_1\lambda_1^k$, every other component decays like
      $(\alpha_i/\alpha_1)(\lambda_i/\lambda_1)^k$, and after normalisation $\mathbf{w}_k \to
      \pm\mathbf{u}_1$, the first principal direction [^1][^2]. If $\alpha_1 = 0$ the method cannot
      find $\mathbf{u}_1$ in exact arithmetic.
    references:
      - source: gutmann-pen-paper
        locator: Ch. 1 Linear Algebra, Ex. 1.6 (a)–(d) Power method
        url: https://arxiv.org/abs/2206.13446
      - title: 'Wikipedia: Power iteration'
        url: https://en.wikipedia.org/wiki/Power_iteration
        locator: Analysis
    source:
      id: gutmann-pen-paper
      ref: linear-algebra#power-method-c
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/linear-algebra.tex
    status: draft
  - id: linear-algebra-039
    type: short_answer
    difficulty: medium
    tags:
      - determinant
      - change-of-variables
      - linear-transform
      - density
    question: |
      $\mathbf{x}$ is uniformly distributed on the unit square $[0, 1]^2$ (density 1 there), and
      $\mathbf{y} = A\mathbf{x}$ with $A = \begin{pmatrix} 2 & 1 \\ 1 & 3 \end{pmatrix}$. What is the
      density $p_{\mathbf{y}}(\mathbf{y})$ at a point inside the image of the square?
    answer:
      numeric: 0.2
      tolerance: 0.001
      hint: a number, 1 decimal (a fraction like 1/3 also works)
      model: $|\det A| = |2 \cdot 3 - 1 \cdot 1| = 5$, so the image has area 5 and $p_{\mathbf{y}} = 1/5 = 0.2$
    explanation: |
      A linear map turns an axis-aligned rectangle with sides $\Delta_1, \Delta_2$ into a
      parallelogram spanned by $\Delta_1\mathbf{a}_1$ and $\Delta_2\mathbf{a}_2$, whose area is
      $\Delta_1\Delta_2\lvert\det A\rvert$ [^1][^2]. Here the square becomes a parallelogram of area 5,
      and the probability mass 1 is spread uniformly over it, so the density is $1/5$. In general
      $p_{\mathbf{y}}(\mathbf{y}) = p_{\mathbf{x}}(A^{-1}\mathbf{y})/\lvert\det A\rvert$, the
      change-of-variables formula behind e.g. normalising flows [^1].
    references:
      - source: gutmann-pen-paper
        locator: Ch. 1 Linear Algebra, Ex. 1.2 (c)–(d) Linear transforms
        url: https://arxiv.org/abs/2206.13446
      - source: d2l
        locator: Sec. 22.1.8 Determinant
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#determinant
    source:
      id: gutmann-pen-paper
      ref: linear-algebra#linear-transforms-d
      url: https://github.com/michaelgutmann/ml-pen-and-paper-exercises/blob/571295dfe49b37d16884b2c5397e62e154ce5f88/topics/linear-algebra.tex
    status: draft
  - id: linear-algebra-040
    type: short_answer
    difficulty: easy
    tags:
      - projection
      - dot-product
      - unit-vector
    question: |
      The unit vector $\mathbf{u} = (0.6, 0.8)$ defines the line $\{\alpha\mathbf{u} : \alpha \in
      \mathbb{R}\}$. Which point $\mathbf{y}$ on this line is closest to $\mathbf{x} = (3, 1)$?

      $\mathbf{y} =$ ({{1}}, {{2}})
    answer:
      blanks:
        - numeric: 1.56
          tolerance: 0.005
          hint: first coordinate, 2 decimals
        - numeric: 2.08
          tolerance: 0.005
          hint: second coordinate, 2 decimals
      model: $\alpha^* = \mathbf{x}^\top\mathbf{u} = 1.8 + 0.8 = 2.6$, so $\mathbf{y} = 2.6\,(0.6, 0.8) = (1.56, 2.08)$
    explanation: |
      Minimising $\lVert\mathbf{x} - \alpha\mathbf{u}\rVert^2 = \mathbf{x}^\top\mathbf{x} - 2\alpha\,
      \mathbf{x}^\top\mathbf{u} + \alpha^2$ (using $\mathbf{u}^\top\mathbf{u} = 1$) over $\alpha$ gives
      $\alpha^* = \mathbf{x}^\top\mathbf{u}$, so the projection is $\mathbf{y} =
      (\mathbf{x}^\top\mathbf{u})\,\mathbf{u}$ [^1][^2]. Here $\mathbf{x}^\top\mathbf{u} = 2.6$ and
      $\mathbf{y} = (1.56, 2.08)$; the residual $\mathbf{x} - \mathbf{y} = (1.44, -1.08)$ is orthogonal
      to $\mathbf{u}$, as it must be.
    references:
      - source: dlbook-exercises
        url: https://github.com/goodfeli/dlbook_exercises/blob/5b643c1a41a35da44a61190b35772969c306ca2b/linear_algebra.tex
        locator: 'Exercises for Chapter 2: Linear Algebra, Exercise 1 and its solution (projection onto a line)'
      - title: 'Wikipedia: Vector projection'
        url: https://en.wikipedia.org/wiki/Vector_projection
        locator: Definitions based on angle θ (vector projection)
    source:
      id: dlbook-exercises
      ref: linear_algebra.tex#ex1
      url: https://github.com/goodfeli/dlbook_exercises/blob/5b643c1a41a35da44a61190b35772969c306ca2b/linear_algebra.tex
