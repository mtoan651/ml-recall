  - id: linear-algebra-033
    type: single
    difficulty: medium
    tags:
      - orthogonality
      - matrix-columns
      - linear-transformations
    question: |
      $\mathbf{e}_1 = (1, 0)^\top$ and $\mathbf{e}_2 = (0, 1)^\top$ are orthogonal. For which $2 \times 2$
      matrices $A$ are $A\mathbf{e}_1$ and $A\mathbf{e}_2$ orthogonal too?
    options:
      - text: Those whose two columns are orthogonal, i.e. $A^\top A$ is diagonal
        correct: true
      - text: Only the orthogonal matrices, i.e. those with $A^\top A = \mathbf{I}$ exactly
        why: That is sufficient but not necessary; $\textrm{diag}(2, 3)$ maps $\mathbf{e}_1, \mathbf{e}_2$ to orthogonal vectors without being orthogonal.
      - text: The symmetric matrices, i.e. $A = A^\top$
        why: $\begin{bmatrix} 1 & 1 \\ 1 & 1 \end{bmatrix}$ is symmetric but sends both basis vectors to $(1, 1)^\top$.
      - text: All invertible matrices, i.e. $\det A \neq 0$
        why: $\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$ is invertible, yet its columns $(1, 0)^\top$ and $(1, 1)^\top$ have dot product 1.
    explanation: |
      $A\mathbf{e}_1$ and $A\mathbf{e}_2$ are the first and second columns of $A$, since a matrix is
      determined by where it sends the basis vectors [^1]. They are orthogonal exactly when their dot
      product $a_{11}a_{12} + a_{21}a_{22}$ is zero [^2], which is the off-diagonal entry of
      $A^\top A$. Orthogonal matrices are the special case where the columns also have length 1.
    references:
      - source: d2l
        locator: Sec. 22.1.4 Geometry of Linear Transformations ($A\mathbf{v}$ in terms of $A[1,0]^\top$ and $A[0,1]^\top$)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#geometry-of-linear-transformations
      - source: d2l
        locator: Sec. 22.1.2 Dot Products and Angles (orthogonal if and only if the dot product is 0)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#dot-products-and-angles
      - source: d2l
        locator: Sec. 22.1.11 Exercises, Exercise 6
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/geometry-linear-algebraic-ops.html#exercises
