  - id: linear-algebra-035
    type: true_false
    difficulty: easy
    tags:
      - transpose
      - symmetric-matrix
    shuffle: false
    question: |
      True or false: for every square matrix $\mathbf{A}$, the matrix $\mathbf{A} + \mathbf{A}^\top$ is
      symmetric.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: Transposition is linear and undoes itself, so $(\mathbf{A} + \mathbf{A}^\top)^\top = \mathbf{A}^\top + \mathbf{A}$, the same matrix [^1].
    explanation: |
      A matrix is symmetric when it equals its own transpose [^1]. Two facts settle it: transposing
      twice gives back the matrix, $(\mathbf{A}^\top)^\top = \mathbf{A}$, and the transpose of a sum
      is the sum of the transposes. Hence
      $(\mathbf{A} + \mathbf{A}^\top)^\top = \mathbf{A}^\top + (\mathbf{A}^\top)^\top = \mathbf{A}^\top + \mathbf{A}$
      [^2]. For example, $\mathbf{A} = \begin{bmatrix} 1 & 2 \\ 0 & 3 \end{bmatrix}$ gives
      $\begin{bmatrix} 2 & 2 \\ 2 & 6 \end{bmatrix}$. In the same way, $\mathbf{A} - \mathbf{A}^\top$
      is always antisymmetric.
    references:
      - source: d2l
        locator: Sec. 2.3.3 Matrices (symmetric matrices)
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#matrices
      - title: 'Wikipedia: Symmetric matrix'
        locator: Definition and Properties
        url: https://en.wikipedia.org/wiki/Symmetric_matrix
      - source: d2l
        locator: Sec. 2.3.13 Exercises, Exercise 3
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
    source:
      id: d2l
      ref: chapter_preliminaries/linear-algebra#ex3
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html#exercises
