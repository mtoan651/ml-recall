  - id: linear-algebra-023
    type: single
    difficulty: hard
    question: |
      Consider the system of linear equations
      w + 3x + 2y + 2z = 0
      w + 4x + y = 0
      3w + 5x + 10 y + 14z = 0
      2w + 5x + 5y + 6z = 0
      with solutions of the form (w, x, y, z), where w x, y, and z are real. Which of the following statements is FALSE?
    options:
      - text: The system is consistent.
      - text: The system has infinitely many solutions.
      - text: The sum of any two solutions is a solution.
      - text: Every solution is a scalar multiple of (-5, 1, 1, 0).
        correct: true
    explanation: |
      The system is homogeneous, so it always has the zero solution (it is consistent) [^1]. Its solutions form the null space, a subspace, so the sum of two solutions is again a solution [^2]. Row reduction gives $w + 5y + 8z = 0$ and $x - y - 2z = 0$, leaving two free variables ($y$ and $z$). So there are infinitely many solutions, $y(-5,1,1,0) + z(-8,2,0,1)$, in parametric vector form [^1].
      This solution set is two-dimensional. For example, $(-8,2,0,1)$ solves all four equations but is not a multiple of $(-5,1,1,0)$, which is why "every solution is a scalar multiple" is the false statement.
    references:
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/solution-sets.html#solnsets-homog
        locator: Sec. 2.4.1 Homogeneous Systems
      - title: Interactive Linear Algebra (Margalit & Rabinoff)
        url: https://textbooks.math.gatech.edu/ila/subspaces.html#definition-23
        locator: Sec. 2.6.2, Definition of the null space (a subspace)
    source:
      id: mmlu-redux
      ref: college_mathematics/99
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_mathematics/test?row=99
