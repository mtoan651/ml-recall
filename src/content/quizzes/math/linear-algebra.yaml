  - id: linear-algebra-041
    type: single
    difficulty: hard
    question: Multiplying a $p \times q$ matrix by a $q \times r$ matrix takes time proportional to $pqr$ and gives a $p \times r$ matrix. Consider the product $N_1 N_2 N_3$ of matrices of sizes $w \times x$, $x \times y$ and $y \times z$. Under what condition does computing $(N_1 N_2) N_3$ take less time than computing $N_1 (N_2 N_3)$?
    options:
      - text: There is no such condition; both orders always take the same time.
        why: 'Associativity guarantees the same result, not the same cost: for sizes $10 \times 30$, $30 \times 5$ and $5 \times 60$ the two orders need 4,500 and 27,000 multiplications.'
      - text: $\frac{1}{x} + \frac{1}{z} < \frac{1}{w} + \frac{1}{y}$
        correct: true
      - text: $x > y$
        why: With $(w, x, y, z) = (10, 3, 2, 1)$ we have $x > y$, yet $(N_1N_2)N_3$ costs 80 and $N_1(N_2N_3)$ only 36.
      - text: $\frac{1}{w} + \frac{1}{x} < \frac{1}{y} + \frac{1}{z}$
        why: With $(w, x, y, z) = (2, 1, 1, 1)$ the inequality holds, yet $(N_1N_2)N_3$ costs 4 and $N_1(N_2N_3)$ only 3.
    explanation: $(N_1N_2)N_3$ costs $wxy$ for $N_1N_2$ (a $w \times y$ matrix) plus $wyz$, while $N_1(N_2N_3)$ costs $xyz$ plus $wxz$ [^2]. Dividing $wxy + wyz < xyz + wxz$ by $wxyz$ gives $\frac{1}{z} + \frac{1}{x} < \frac{1}{w} + \frac{1}{y}$. Choosing the cheapest bracketing of a longer product is the matrix chain ordering problem [^2][^1].
    references:
      - source: mmlu-redux
        locator: college_computer_science row 32
      - title: 'Wikipedia: Matrix chain multiplication'
        url: https://en.wikipedia.org/wiki/Matrix_chain_multiplication
        locator: Introduction
    source:
      id: mmlu-redux
      ref: college_computer_science/32
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/college_computer_science/test?row=32
    status: draft
  - id: linear-algebra-042
    type: true_false
    difficulty: medium
    tags:
      - cosine-similarity
      - dot-product
      - representational-similarity
    question: |
      The representational similarity matrix of hidden activations $\mathbf{H}$ (one row per input item) is computed as
      $\mathbf{H}\mathbf{H}^\top$. True or false: entry $(i, j)$ of this matrix is the cosine similarity between the representations
      of items $i$ and $j$.
    options:
      - text: 'True'
        why: $\mathbf{H}\mathbf{H}^\top$ holds raw dot products; they equal cosine similarities only if every row of $\mathbf{H}$ has unit length.
      - text: 'False'
        correct: true
    explanation: |
      $(\mathbf{H}\mathbf{H}^\top)_{ij} = \mathbf{h}_i \cdot \mathbf{h}_j = \lVert\mathbf{h}_i\rVert\,\lVert\mathbf{h}_j\rVert\cos\theta_{ij}$, so it mixes the angle
      between the representations with their lengths [^1][^2]. It equals the cosine similarity only after every row is
      normalized to unit length. NMA's linear-network tutorial calls the dot product "cosine similarity", while its
      self-supervised tutorial computes similarity matrices with `torch.nn.functional.cosine_similarity`, which does
      the normalization [^1][^3].
    references:
      - source: neuromatch-dl
        locator: W1D2 Tutorial 3, Section 3 Representational Similarity Analysis, Coding Exercise 3
        url: https://github.com/NeuromatchAcademy/course-content-dl/blob/caba36c513fb8139ac3c9e7503f7a769dadde25e/tutorials/W1D2_LinearDeepLearning/instructor/W1D2_Tutorial3.ipynb
