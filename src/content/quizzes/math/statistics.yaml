  - id: statistics-096
    type: single
    difficulty: easy
    question: A producer of skin care products has created a new formula for its cream to cure acne. To compare the effectiveness of the new cream to that of the old cream, it conducted a double-blind randomized experiment. Volunteers with acne tried the old formula on one side of their face and the new formula on the other, and which side got which formula was determined randomly. The response variable was the difference in the number of pimples (old formula - new formula). Which is the correct significance test to perform?
    options:
      - text: A two-proportion z-test
        why: The response is a difference in counts, a quantitative variable, not a proportion.
      - text: A two-sample t-test
        why: The two sides of one face are paired, not independent groups [^1][^2].
      - text: A matched pairs t-test
        correct: true
      - text: A chi-square test of independence
        why: That test is for two categorical variables, not for a numeric difference.
    explanation: 'Each volunteer gets both creams, one on each side of the face, so this is a matched pairs design and the response is the within-person difference (old minus new) [^1]. Paired data are analyzed by treating the differences as one sample, which leads to a one-sample $t$ procedure on the mean difference: the matched pairs $t$-test [^2]. A two-sample $t$-test would wrongly treat the two sides of a face as independent groups, and the two-proportion $z$-test and the chi-square test of independence are for categorical outcomes, not for counts of pimples.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#types-of-research-studies
        locator: Lesson 2, Sec. 2.6 Types of Research Studies (Example 2.6 matched pairs design)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-paired-means.html#sec-mathpaired
        locator: Sec. 21.3 Mathematical model for the mean paired difference
    source:
      id: mmlu-redux
      ref: high_school_statistics/80
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=80
