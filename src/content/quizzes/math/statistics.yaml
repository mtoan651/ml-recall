  - id: statistics-013
    type: single
    question: The distribution of salaries of a county school system with 4,752 employees is known to be right skewed, with the superintendent’s salary an outlier on the higher side. A random sample of 20 employees was taken and their salaries recorded. A 95 percent t-confidence interval for the mean salary of the county school system employees is (\$15,360, \$32,470). The t-confidence interval is not appropriate in this situation because
    options:
      - text: the sample size is too small compared to the number of employees in the system to give a fair representation
      - text: the skewed salary distribution tells us that assumption of normality of the sampled population will not be satisfied
        correct: true
      - text: the population standard deviation of the salaries of employees of this county school system is not known
      - text: the teacher salaries are not negotiable, but the superintendent’s salary is negotiable, so the superintendent’s salary should be excluded from the population sampled
    explanation: A t-interval assumes the sample comes from a roughly normal population; with only 20 observations from a strongly right-skewed distribution with a large outlier, that assumption fails. Excluding the superintendent is not a statistical reason. MMLU-Redux experts flagged the original key (D) as wrong [^1].
    references:
      - source: mmlu-redux
        locator: high_school_statistics row 10 — wrong_groundtruth
    source:
