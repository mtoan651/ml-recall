  - id: statistics-057
    type: single
    difficulty: medium
    question: You need to construct a 94% confidence interval for a population proportion. What is the upper critical value of z to be used in constructing this interval?
    options:
      - text: '0.9699'
      - text: '1.96'
      - text: '1.555'
      - text: '1.88'
        correct: true
    explanation: |
      For confidence level $C$, choose $z^\star$ so that the area between $-z^\star$ and
      $z^\star$ under the standard normal equals $C$ [^1]. For 94%, the two tails hold 6% in
      total, 3% each, so $z^\star$ is the 97th percentile; the normal table shows an area of about
      0.47 between 0 and 1.88, so $z^\star \approx 1.88$ [^2]. 1.96 belongs to 95% confidence,
      0.9699 is a probability rather than a z-score, and 1.555 would put all 6% in one tail.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level (Figure 16.2)
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/89
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=89
    status: draft
  - id: statistics-058
    type: single
    difficulty: easy
    question: The observed times (in minutes) it takes a runner to complete a marathon are normally distributed. The z-score for his running time this week is –2. Which one of the following statements is a correct interpretation of his z-score?
    options:
      - text: This week his time was two minutes lower than his time last week.
      - text: This week his time was two minutes lower than his best time ever.
      - text: This week his time was two minutes lower than his average time.
      - text: This week his time was two standard deviations lower than his average time.
        correct: true
    explanation: |
      A z-score counts standard deviations from the mean, $z = (x - \mu)/\sigma$, and negative
      values lie below the mean [^1]. So $z = -2$ means his time this week was two standard
      deviations below his average time. A z-score is not in minutes, and it compares with the
      mean of his times, not with last week or his best time.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
    source:
      id: mmlu-redux
      ref: high_school_statistics/91
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=91
    status: draft
  - id: statistics-059
    type: single
    difficulty: hard
    question: The waiting times for a new roller coaster ride are normally distributed with a mean of 35 minutes and a standard deviation of 10 minutes. If there are 150,000 riders the first summer, which of the following is the shortest time interval associated with 100,000 riders?
    options:
      - text: 0 to 31.7 minutes
      - text: 31.7 to 39.3 minutes
      - text: 25.3 to 44.7 minutes
        correct: true
      - text: 25.3 to 35 minutes
    explanation: |
      100,000 of 150,000 riders is $2/3 \approx 66.7\%$ of the distribution. The normal curve is
      symmetric and single-peaked [^1], with its density highest at the mean, so the shortest
      interval holding a given area is the one centered on the mean: the middle 66.7%, leaving
      16.7% in each tail. The cutoff with 83.3% below it is about $z = 0.967$ (table area 0.333
      between 0 and $z$) [^2], giving $35 \pm 0.967 \times 10$, about 25.3 to 44.7 minutes [^3].
      The other intervals hold far less than two thirds: 25.3 to 35 covers one third of the
      riders, 31.7 to 39.3 about 30%, and 0 to 31.7 about 37%.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-distribution-model
        locator: Sec. 13.2.1 Normal distribution model
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 0.9)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples
    source:
      id: mmlu-redux
      ref: high_school_statistics/92
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=92
    status: draft
  - id: statistics-060
    type: single
    difficulty: hard
    question: A student organization at a university is interested in estimating the proportion of students in favor of showing movies biweekly instead of monthly. How many students should be sampled to get a 90 percent confidence interval with a width of at most 0.08?
    options:
      - text: '27'
      - text: '64'
      - text: '106'
      - text: '423'
        correct: true
    explanation: |
      The margin of error is half the width of a confidence interval [^1], so a width of 0.08
      means $M = 0.04$. With no prior guess for the proportion, use the conservative
      $\tilde{p} = 0.5$ in $n = (z^\star/M)^2\,\tilde{p}(1-\tilde{p})$ [^2]. For 90% confidence
      $z^\star = 1.645$ [^3], so $n = (1.645/0.04)^2 \times 0.25 \approx 422.8$, which rounds up to
      423 [^2]. The option 106 comes from using the full width 0.08 as the margin of error.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#introduction-to-confidence-intervals
        locator: Lesson 4, Sec. 4.2 Introduction to Confidence Intervals (Definition 4.6)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#computing-necessary-sample-size
        locator: Lesson 8, Sec. 8.1.2 Computing Necessary Sample Size
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#z-multiplier-for-a-90-confidence-interval
        locator: Lesson 7, Sec. 7.4.2 (z* multiplier for a 90% confidence interval)
    source:
      id: mmlu-redux
      ref: high_school_statistics/93
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=93
    status: draft
  - id: statistics-061
    type: single
    difficulty: hard
    question: Suppose that 60% of a particular electronic part last over 3 years, while 70% last less than 6 years. Assuming a normal distribution, what are the mean and standard deviation with regard to length of life of these parts?
    options:
      - text: μ = 3.677, σ = 3.561
      - text: μ = 3.977, σ = 3.861
        correct: true
      - text: μ = 4.177, σ = 3.561
      - text: μ = 4.377, σ = 3.261
    explanation: |
      If 60% last more than 3 years, then 3 is the 40th percentile; if 70% last less than 6
      years, then 6 is the 70th percentile. The matching z-scores are $z_{0.40} \approx -0.253$
      [^1] and $z_{0.70} \approx 0.524$ (table area 0.20 between 0 and $z$) [^2]. Writing
      $x = \mu + z\sigma$ for both [^1] gives $3 = \mu - 0.253\sigma$ and $6 = \mu + 0.524\sigma$.
      Subtracting, $3 = 0.777\sigma$, so $\sigma \approx 3.861$ and
      $\mu = 3 + 0.253 \times 3.861 \approx 3.977$.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (40th percentile, Z = -0.253)
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 0.5)
    source:
      id: mmlu-redux
      ref: high_school_statistics/96
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=96
    status: draft
  - id: statistics-062
    type: single
    difficulty: medium
    question: A researcher planning a survey of school principals in a particular state has lists of the school principals employed in each of the 125 school districts. The procedure is to obtain a random sample of principals from each of the districts rather than grouping all the lists together and obtaining a sample from the entire group. Which of the following is a correct conclusion?
    options:
      - text: This is a simple random sample obtained in an easier and less costly manner than procedures involving sampling from the entire population of principals.
      - text: This is a cluster sample in which the population was divided into heterogeneous groups called clusters.
      - text: This is an example of systematic sampling, which gives a reasonable sample as long as the original order of the list is not related to the variables under consideration.
      - text: This is a stratified sample, which may give comparative information that a simple random sample wouldn't give.
        correct: true
    explanation: |
      Dividing the population into groups (here the 125 districts) and then drawing a random
      sample within every group is stratified sampling; the groups are the strata [^1]. Because
      each district is sampled on its own, the design gives an estimate for every district, and
      those within-stratum estimates can be more stable than what a simple random sample would
      provide [^1]. It is not a cluster sample, which picks a few groups at random and includes
      everyone in them [^1]. Nor is it a simple random sample: that would mean drawing from one
      combined list of all principals, which is exactly what the researcher chose not to do [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-samp-methods
        locator: Sec. 2.1.5 Four sampling methods
    source:
      id: mmlu-redux
      ref: high_school_statistics/99
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=99
    status: draft
  - id: statistics-063
    type: single
    difficulty: medium
    question: |
      For each person in a survey you know their yearly income and their years of education,
      both as numbers. Which statistic measures the strength and direction of the linear
      relationship between the two, on a scale that does not depend on the units (dollars,
      years)?
    options:
      - text: Correlation coefficient
        correct: true
      - text: Covariance
      - text: Difference between the mean incomes of two education groups
      - text: p-value of a t-test
    explanation: |
      Correlation is the covariance divided by the standard deviations of both variables, which
      makes it unit-free and always between $-1$ and $1$, with the sign giving the direction [^1][^2].
      Covariance has the right sign, but its size depends on the magnitude of the values, so on its
      own it does not show how strong the relationship is [^1]. Comparing the mean incomes of two
      education groups, or testing that difference with a t-test, throws away the numeric years of
      education and answers another question: whether two groups differ [^1]. Even a strong
      correlation would not prove that education causes higher income [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md#covariance-and-correlation
        locator: 'Lesson 4: Statistics and Probability, sec. Covariance and Correlation and Hypothesis Testing'
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
        locator: Sec. 7.1.4 Describing linear relationships with correlation
    source:
      id: ms-ds-for-beginners
      ref: quiz-7/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: statistics-064
    type: single
    difficulty: easy
    question: 'You can analyze trends over time using a:'
    options:
      - text: line chart
        correct: true
      - text: histogram
      - text: pie chart
    explanation: |
      The lesson's chart guide recommends a line chart to analyze trends over time: the x-axis is
      ordered time and the line shows the rises and falls [^1]. A pie chart shows how parts relate
      to a whole at one moment [^1], and a histogram shows how the values of one numeric variable
      are distributed, not how they change over time [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#observe-wingspan-with-matplotlib
        locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide)'
      - source: ms-ds-for-beginners
