      ref: quiz-18/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-3.json
    status: draft
  - id: statistics-068
    type: single
    difficulty: easy
    question: Which chart is usually used to show the distribution of a numeric variable?
    options:
      - text: histogram
        correct: true
      - text: pie chart
      - text: line chart
    explanation: |
      A scatterplot gives a quick look at how values spread, but the lesson notes it is not the best
      way to show a true distribution; that is usually done with a histogram, which counts the
      values that fall into each bin [^1]. A pie chart shows parts of a whole and a line chart shows
      trends over an ordered axis; neither shows how often each range of values occurs [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#explore-the-birds-dataset
        locator: 'Lesson 10: Visualizing Distributions, sec. Explore the birds dataset and Working with histograms'
      - source: ms-ds-for-beginners
