  - id: statistics-102
    type: single
    difficulty: medium
    tags:
      - estimators
      - bias
      - variance
      - mean-squared-error
    question: |
      $X_1, \dots, X_{10}$ are i.i.d. $\textrm{Unif}(0, \theta)$. Two estimators of $\theta$ are
      $\hat{\theta} = \max_i X_i$ and $\tilde{\theta} = 2\bar{X}$. Which statement is correct?
    options:
      - text: '$\hat{\theta}$ is biased low but has the smaller MSE: about $0.015\theta^2$ versus $0.033\theta^2$'
        correct: true
      - text: '$\tilde{\theta}$ is better: it is unbiased, and an unbiased estimator always has the smaller MSE of the two'
        why: MSE is bias squared plus variance, so a small bias can be worth a much smaller variance [^1].
      - text: '$\hat{\theta}$ is better because it is unbiased: on average the largest sample equals $\theta$'
        why: The maximum is always below $\theta$; its mean is $\frac{n}{n+1}\theta = \frac{10}{11}\theta$.
      - text: Both have MSE $\theta^2/30$, because they use the same ten samples
        why: Only $\tilde{\theta}$ has MSE $\theta^2/(3n) = \theta^2/30$; the maximum uses the data differently and does better.
    explanation: |
      For the maximum, $E[\hat{\theta}] = \frac{n}{n+1}\theta$ (bias $-\theta/11$) and
      $\textrm{Var}(\hat{\theta}) = \frac{n\theta^2}{(n+1)^2(n+2)}$, so
      $\textrm{MSE} = \textrm{bias}^2 + \textrm{Var} = \frac{2\theta^2}{(n+1)(n+2)} = \frac{2\theta^2}{132} \approx 0.015\theta^2$
      [^1]. $2\bar{X}$ is unbiased with variance $4 \cdot \frac{\theta^2}{12n} = \frac{\theta^2}{30}$,
      which is also its MSE. The biased estimator wins, and its advantage grows with $n$ (order
      $1/n^2$ against $1/n$); rescaling to $\frac{n+1}{n}\hat{\theta}$ removes the bias and does
      better still. Statistical bias alone does not decide which estimator is better [^2].
    references:
      - source: d2l
        locator: Sec. 22.10.1.4 The Bias-Variance Trade-off (MSE = bias² + variance)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#the-bias-variance-trade-off
      - source: d2l
        locator: Sec. 22.10.1.2 Statistical Bias (biased estimators are frequently used)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#statistical-bias
      - source: d2l
        locator: Sec. 22.10.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/statistics#ex1
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: statistics-103
    type: short_answer
    difficulty: medium
    tags:
      - estimators
      - bias
      - order-statistics
    question: |
      $X_1, \dots, X_{10}$ are i.i.d. $\textrm{Unif}(0, 1)$, so $\theta = 1$. What is the statistical
      bias $E[\hat{\theta}] - \theta$ of the estimator $\hat{\theta} = \max_i X_i$?
    answer:
      numeric: -0.0909
      tolerance: 0.001
      hint: a number, 4 decimals (it can be negative)
      model: $P(\hat{\theta} \le x) = x^{10}$, so $E[\hat{\theta}] = \int_0^1 x \cdot 10x^9\,dx = \frac{10}{11}$ and the bias is $-\frac{1}{11} \approx -0.0909$
    explanation: |
      The maximum is at most $x$ exactly when all ten samples are, so its CDF is $x^{10}$ and its
      density $10x^9$ on $[0, 1]$. Then $E[\hat{\theta}] = 10/11$ and the bias is
      $E[\hat{\theta}] - \theta = -1/11 \approx -0.0909$ [^1]. In general the bias is
      $-\theta/(n+1)$, which tends to 0, so the estimator is asymptotically unbiased [^1].
    references:
      - source: d2l
        locator: Sec. 22.10.1.2 Statistical Bias, Eq. (22.10.2)
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#statistical-bias
      - source: d2l
        locator: Sec. 22.10.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/statistics#ex1-b
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: statistics-104
    type: single
    difficulty: medium
    tags:
      - confidence-intervals
      - interpretation
      - small-samples
    question: |
      With $N = 2$ samples per dataset you build 100 intervals
      $\hat{\mu} \pm t^*\hat{\sigma}/\sqrt{N}$ with $t^* = 1$ (a 50% confidence interval for $N = 2$),
      where the true mean is 0. About half of them contain 0, and some very short intervals lie far
      from 0. Does this contradict the 50% interpretation?
    options:
      - text: 'No: 50% describes the procedure over many datasets; a short interval just means the two samples were close'
        correct: true
      - text: 'Yes: every observed 50% interval, the short ones included, should contain 0 with probability exactly one half'
        why: Once computed, a particular interval either contains 0 or it does not; the 50% refers to the procedure [^1].
      - text: 'Yes: short intervals come from precise estimates, so they should cover the mean more often'
        why: This is a known fallacy; with $N = 2$, $\hat{\sigma}$ is very noisy and a small value does not mean the estimate is precise [^1].
      - text: No, but only because $t^* = 1$ is too small for $N = 2$, so the real coverage is just 25%
        why: With one degree of freedom, $P(|T| \le 1) = \frac{2}{\pi}\arctan 1 = 0.5$, so $t^* = 1$ is exactly right.
    explanation: |
      A confidence interval is a random interval: the guarantee is that, over many datasets, 50% of
      the intervals produced by the procedure contain the true mean [^1]. It says nothing about any
      single interval. With $N = 2$ the estimated standard deviation is extremely noisy; when the two
      samples happen to land close together the interval is short, wherever they landed. This is the
      fallacy "narrow confidence intervals mean precise estimates" [^1][^2]. So the short, far-off
      intervals are expected, and short intervals should not be read as high precision here.
    references:
      - source: d2l
        locator: Sec. 22.10.3.2 Interpretation (the three fallacies) and Sec. 22.10.3.3 A Gaussian Example
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#interpretation
      - title: Morey et al., The fallacy of placing confidence in confidence intervals (Psychonomic Bulletin & Review, 2016)
        locator: Fallacy 2, the precision fallacy
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4742505/
      - source: d2l
        locator: Sec. 22.10.5 Exercises, Exercise 3
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/statistics#ex3
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: statistics-105
    type: single
    difficulty: easy
    tags:
      - survival-analysis
      - censoring
    question: |
      A clinical study follows patients for 12 months to see when they relapse. One patient leaves
      the study after 8 months without having relapsed. How should this patient's record be
      treated?
    options:
      - text: As right-censored at 8 months
        correct: true
      - text: As a complete event time of 8 months
        why: No relapse was observed, so 8 months is not the event time; it is only a lower bound for it [^1].
      - text: As missing data, so the patient is dropped
        why: Dropping censored patients ignores those who lasted longest and biases the estimated time to event downward [^2].
      - text: As missing data whose relapse time is imputed
        why: Survival methods use exactly what is known, that the time to relapse exceeds 8 months, instead of inventing a value [^2].
    explanation: |
      Right censoring occurs when we know the event has not happened yet but we stop observing
      before it does [^1]. Here we know the patient was relapse-free for at least 8 months, which is
      real information. Dropping such records or treating their last observed time as the event
      time both underestimate how long patients go without relapse; survival analysis instead
      treats the censoring time as a lower bound for the event time [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 20: Survival analysis — Time to event and censoring'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/20_survival-analysis.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 20: Survival analysis — Approaches 1–3 (only churned customers, everyone churns now, survival analysis)'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/20_survival-analysis.ipynb
    source:
      id: ubc-cpsc330
      ref: lectures/tutorials/solutions/final_prep.pdf#q19
      url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/tutorials/solutions/final_prep.pdf
    status: reviewed
    reviewed_by: claude
  - id: statistics-106
    type: multiple
    difficulty: medium
    tags:
      - survival-analysis
      - right-censoring
    question: |
      In a churn dataset, customers who are still subscribed only have their tenure so far recorded.
      Which statements about such right-censored data are true? Select all that apply.
    options:
      - text: Right censoring means that for some subjects the event has not yet been observed when observation stops
        correct: true
      - text: Right censoring implies that the data are missing completely at random
        why: Censoring is tied to time, since subjects who last longer are more likely to be censored, so the missingness is not random [^2].
      - text: With right-censored data, binary classification models can be applied directly without special care
        why: A classifier would only predict whether the event happened by the time the data was collected, treating censored subjects as if they never had the event [^1].
      - text: Ridge regression fitted to the observed tenures of right-censored customers is likely to underestimate tenure
        correct: true
    explanation: |
      Right censoring occurs when we know the event has not happened yet but we stop observing
      before it does, so for those subjects we only know a lower bound on the time to the event [^1].
      Treating the observed times as complete, as a regression on tenure would, underestimates the
      true times, because customers still subscribed will stay for a while longer; dropping them
      is no better, since long-time customers are the ones most likely to be removed [^2].
      Survival analysis is built to use this partial information [^2].
    references:
      - source: ubc-cpsc330
        locator: 'Lecture 20: Survival analysis — Time to event and censoring'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/20_survival-analysis.ipynb
      - source: ubc-cpsc330
        locator: 'Lecture 20: Survival analysis — Approach 1, Approach 2 and Approach 3: Survival analysis'
        url: https://github.com/UBC-CS/cpsc330-2025W1/blob/a89d6131a0e2ae5f7ab36f207a3809a5b7137aef/lectures/notes/20_survival-analysis.ipynb
