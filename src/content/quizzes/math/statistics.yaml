  - id: statistics-040
    type: single
    difficulty: easy
    question: A chi-squared test of independence is to be performed on a 3 × 4 contingency table. How many degrees of freedom does this test have?
    options:
      - text: '6'
        correct: true
      - text: '8'
        why: 8 is $2 \times 4$, which subtracts 1 from only one dimension; use $(3-1)(4-1) = 6$ [^1].
      - text: '10'
        why: The formula $(R-1)(C-1)$ gives $2 \times 3 = 6$, not 10 [^1].
      - text: '11'
        why: 11 is the number of cells minus one, which is not the df of a two-way table [^1].
    explanation: |
      For a chi-squared test of independence on a table with $R$ rows and $C$ columns,
      $df = (R-1)(C-1)$ [^1][^2]. A $3 \times 4$ table gives $(3-1)(4-1) = 2 \times 3 = 6$. The
      option 11 is the number of cells minus one, which is the wrong formula for a two-way table.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-tables.html#observed-statistic-vs.-null-chi-squared-statistics-1
        locator: Sec. 18.2.3 Observed statistic vs. null chi-squared statistics (degrees of freedom for a two-way table)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson11#chi-square-test-of-independence
        locator: Lesson 11, Sec. 11.3 Chi-Square Test of Independence
