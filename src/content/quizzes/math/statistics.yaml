  - id: statistics-144
    type: short_answer
    difficulty: easy
    tags:
      - sample-size
      - margin-of-error
      - mean
    question: |
      A market researcher assumes that the standard deviation of customers' savings is \$100. He
      wants a 95% confidence interval for the mean saving with a margin of error of at most \$10.
      Using the normal model for the sample mean, what is the minimum sample size?
    answer:
      numeric: 385
      tolerance: 0
      hint: a whole number
      model: $1.96 \times 100/\sqrt{n} \le 10 \Rightarrow n \ge 384.16$, so $n = 385$
    explanation: |
      With the normal model the margin of error of a 95% interval for a mean is
      $1.96\,\sigma/\sqrt{n}$, a good approximation for large samples [^1][^2]. Requiring
      $1.96 \times 100/\sqrt{n} \le 10$ gives $\sqrt{n} \ge 19.6$, that is $n \ge 384.16$. A sample
      size must be a whole number, and rounding down would make the margin of error slightly too
      large, so the minimum is 385. (Using $t^\star$, which is slightly above 1.96, would give 387.)
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.1.4 One sample t-confidence intervals
      - title: 'Wikipedia: Sample size determination'
        url: https://en.wikipedia.org/wiki/Sample_size_determination#Estimation_of_a_mean
        locator: Estimation of a mean
    source:
      id: openintro-stats
      ref: ch7/7.13-car_insurance_savings
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/one-sample_means_with_the_t-distribution.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-145
    type: short_answer
    difficulty: medium
    tags:
      - two-sample-t-test
      - standard-error
      - welch
    question: |
      Newly hatched chicks were randomly assigned to feed supplements. The 12 chicks fed linseed
      weighed on average 218.75 g (SD 52.24 g), and the 10 chicks fed horsebean 160.20 g (SD
      38.63 g). What is the two-sample $t$ statistic for the difference in means (linseed minus
      horsebean), using the unpooled standard error?
    answer:
      numeric: 3.02
      tolerance: 0.01
      hint: 2 decimals
      model: $SE = \sqrt{52.24^2/12 + 38.63^2/10} \approx 19.41$; $T = (218.75 - 160.20)/19.41 \approx 3.02$
    explanation: |
      For two independent groups the standard error of $\bar x_1 - \bar x_2$ is
      $\sqrt{s_1^2/n_1 + s_2^2/n_2} \approx 19.41$ g, and $T = 58.55/19.41 \approx 3.02$ [^1][^2].
      With the conservative choice $df = \min(n_1 - 1, n_2 - 1) = 9$, the two-sided p-value is
      about 0.015, significant at 5% but not at 1% [^1]; the Welch–Satterthwaite degrees of freedom
      (about 20) give about 0.007 [^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.3.1 Confidence interval for a difference of means; Sec. 7.3.2 Hypothesis tests for the difference of two means
      - title: "Wikipedia: Welch's t-test"
        url: https://en.wikipedia.org/wiki/Welch%27s_t-test#Calculations
        locator: Calculations
    source:
      id: openintro-stats
      ref: ch7/7.27-chick_wts_linseed_horsebean
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/difference_of_two_means.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-146
    type: short_answer
    difficulty: hard
    tags:
      - power
      - sample-size
      - two-sample-test
    question: |
      Plots of farmland yield on average 1,215 lb of corn with a standard deviation of 94 lb per
      plot. An experiment will give each plot either the current or a new fertilizer, with equal
      numbers of plots per fertilizer. How many plots per fertilizer are needed to detect a
      difference of 40 lb per plot with 90% power, using a two-sided test at $\alpha = 0.05$?
      Use normal quantiles rounded to two decimals, and round the number of plots up.
    answer:
      numeric: 116
      tolerance: 0
      hint: a whole number of plots per fertilizer
      model: $(1.96 + 1.28) \times SE = 40$ with $SE = \sqrt{94^2/n + 94^2/n}$, so $n = 2 \times 94^2 \times 3.24^2 / 40^2 \approx 115.9$, rounded up to 116
    explanation: |
      To reject $H_0$ in 90% of experiments when the true difference is 40 lb, the difference must
      lie $1.96 + 1.28 = 3.24$ standard errors from 0: 1.96 for the two-sided 5% rejection
      boundary plus 1.28 to put 90% of the alternative distribution beyond it, the same
      $z_{1-\alpha/2} + z_{1-\beta}$ that appears in standard sample-size formulas [^1][^2]. For a
      difference of two means $SE = \sqrt{94^2/n + 94^2/n}$ [^1], and solving $3.24 \times SE = 40$
      gives
      $n = 2 \times 94^2 \times 3.24^2/40^2 \approx 115.9$, so 116 plots per fertilizer (232 in
      total). The result is sensitive to rounding: with unrounded quantiles ($1.960 + 1.282$),
      $n \approx 116.05$, which would round up to 117.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.4.3 Determining a proper sample size
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc222.htm
        locator: Sec. 7.2.2.2 Sample sizes required
    source:
