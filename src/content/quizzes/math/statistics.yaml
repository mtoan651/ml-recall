  - id: statistics-066
    type: single
    difficulty: easy
    question: 'Show how parts relate to a whole using this type of chart:'
    options:
      - text: line
        why: Line charts show trends over time, not shares of a whole [^1].
      - text: column
        why: Column charts compare values but do not show each part as a share of one whole [^1].
      - text: pie
        correct: true
    explanation: |
      To show how parts relate to a whole, the chart guide recommends a pie chart [^1]: each slice is
      one category's share of the total, as in the lesson's pie of edible versus poisonous mushrooms
      [^2]. Line charts show trends over time and column charts compare values, but neither shows
      each part as a share of one whole [^1].
