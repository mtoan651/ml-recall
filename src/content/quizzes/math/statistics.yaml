  - id: statistics-076
    type: single
    difficulty: easy
    question: Why do you explore data before using it in a model or further analysis?
    options:
      - text: To delete the rows you do not need
        why: Deleting data is a cleaning decision that should follow from understanding the data [^1][^2].
      - text: To identify challenges in the data
        correct: true
      - text: To choose the final model's hyperparameters
        why: Hyperparameter tuning belongs to modeling, which exploration prepares for [^1].
    explanation: |
      Exploratory data analysis is the process of getting to know the data: checking whether there
      is enough of it, whether its quality is acceptable for the problem, and identifying the
      challenges of working with it [^1]. Deleting data is a cleaning decision that should follow
      from understanding why values are missing or inconsistent [^1][^2], and choosing
      hyperparameters belongs to modeling, which exploration prepares for [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md#exploratory-data-analysis
        locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, sec. Exploratory Data Analysis and Exploring to identify inconsistencies'
      - source: ms-ds-for-beginners
