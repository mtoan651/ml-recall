  - id: statistics-141
    type: short_answer
    difficulty: medium
    tags:
      - chi-square-test
      - goodness-of-fit
    question: |
      To check whether players choose rock, paper and scissors at random, you record 99 throws:
      rock 43, paper 21, scissors 35. What is the chi-square goodness-of-fit statistic for the
      hypothesis that the three choices are equally likely?
    answer:
      numeric: 7.52
      tolerance: 0.02
      hint: 2 decimals
      model: Expected count $99/3 = 33$ each; $\chi^2 = \dfrac{10^2 + 12^2 + 2^2}{33} = \dfrac{248}{33} \approx 7.52$
    explanation: |
      Under $H_0$ each option is expected $99/3 = 33$ times, and all expected counts are at least
      5 [^1]. The statistic is $\sum (O - E)^2/E = (100 + 144 + 4)/33 \approx 7.52$ [^1][^2]. With
      $3 - 1 = 2$ degrees of freedom the p-value is about 0.023, below 0.05, so the data suggest
      that some options are favoured.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.3.2 The chi-square test statistic; Sec. 6.3.4 Finding a p-value for a chi-square distribution
      - title: "Wikipedia: Pearson's chi-squared test"
        url: https://en.wikipedia.org/wiki/Pearson%27s_chi-squared_test#Discrete_uniform_distribution
        locator: Test for fit of a distribution (Discrete uniform distribution, Calculating the test-statistic); Examples, Fairness of dice
    source:
      id: openintro-stats
      ref: ch6/6.47-rps_chisq_GOF
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/review_exercises.tex
    status: reviewed
