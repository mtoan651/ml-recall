        url: https://online.stat.psu.edu/stat100/Lesson01#its-all-in-the-wording
        locator: Lesson 1, Sec. 1.2 It's All in the Wording
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#sec-randomSampEtc
        locator: Lesson 2, Sec. 2.4 Simple Random Sampling and Other Sampling Methods (stratified sampling)
    source:
      id: mmlu-redux
      ref: high_school_statistics/34
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=34
