  - id: statistics-004
    type: single
    difficulty: easy
    question: We want to prove that basketball players are taller than average people. We have collected heights of 20 people from both groups. What do we need to do?
    options:
      - text: compare means
      - text: collect more data, 20 is not enough!
      - text: use t-test
        correct: true
    explanation: |
      A gap between two sample means could be nothing more than random variation, so eyeballing
      the means does not prove anything; you need a hypothesis test [^1]. Student's t-test turns
      the difference in means, scaled by the variability, into a t-value, compares it with the
      t-distribution and returns a p-value for judging whether the difference is real [^1]. The
      t-distribution exists for exactly this case, where $\sigma$ has to be estimated from a
      smallish sample [^2], and with small samples it is fine as long as the data show no clear
      outliers, so 20 people per group is workable [^3].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: "Lesson 4: Statistics and Probability, section 'Hypothesis Testing'"
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
        locator: Sec. 19.2.3 Introducing the t-distribution
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
        locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄
    source:
      id: ms-ds-for-beginners
      ref: quiz-7/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
