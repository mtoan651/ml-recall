  - id: statistics-006
    type: single
    difficulty: easy
    question: What is the purpose of sampling data?
    options:
      - text: Sampling is better than data profiling when looking for errors
      - text: Sampling doesn't serve a purpose
      - text: Sampling is used to analyze data in a large data set because it's hard to analyze all of it
        correct: true
    explanation: |
      Going through every record of a large dataset is slow, so analysts examine a random
      sample and use probability and statistics to draw general conclusions about the whole;
      the more data sampled, the more precise the generalization [^1]. It is the same reason
      studies sample a population instead of taking a census, which is often too expensive or
      impossible [^2]. The lesson does not rank sampling above data profiling for finding errors:
      profiling with descriptive statistics, and checks such as missing-value functions, are
      separate tools for spotting inconsistencies [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
        locator: "Lesson 15: Analyzing, sections 'Sampling and Querying' and 'Exploring to identify inconsistencies'"
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
        locator: Sec. 2.1.1 Populations and samples
