    status: draft
  - id: statistics-079
    type: single
    difficulty: medium
    question: Which of the following is the central limit theorem?
    options:
      - text: No matter how the population is distributed, as the sample size increases, the mean of the sample means becomes closer to the mean of the population.
      - text: No matter how the population is distributed, as the sample size increases, the standard deviation of the sample means becomes closer to the standard deviation of the population divided by the square root of the sample size.
      - text: If the population is normally distributed, then as the sample size increases, the sampling distribution of the sample mean becomes closer to a normal distribution.
      - text: No matter how the population is distributed (as long as its variance is finite), as the sample size increases, the sampling distribution of the sample mean becomes closer to a normal distribution.
        correct: true
    explanation: "The central limit theorem is about shape: for a random sample from any distribution with finite mean and variance, the distribution of $\\bar X$ approaches a normal distribution as $n$ grows [^1]. The other statements are not limit results. The mean of $\\bar X$ equals $\\mu$ and its variance equals $\\sigma^2/n$ exactly, for every sample size [^2]. And for a normal population $\\bar X$ is exactly normal for every $n$ [^3], so nothing needs to 'become closer'; the point of the theorem is that normality appears even when the population is not normal."
    references:
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson27#the-theorem
        locator: Lesson 27, Sec. 27.1 The Theorem
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson24#mean-and-variance-of-sample-mean
        locator: Lesson 24, Sec. 24.4 Mean and Variance of Sample Mean
      - title: 'Penn State STAT 414: Introduction to Probability Theory'
        url: https://online.stat.psu.edu/stat414/Lesson26#sampling-distribution-of-sample-mean
        locator: Lesson 26, Sec. 26.2 Sampling Distribution of Sample Mean
    source:
      id: mmlu-redux
      ref: high_school_statistics/0
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=0
    status: draft
  - id: statistics-080
    type: single
    difficulty: medium
    question: 'The main purpose of blocking in an experiment is to:'
    options:
      - text: reduce bias.
      - text: reduce confounding.
      - text: reduce variation within treatments.
        correct: true
      - text: reduce variation between treatments.
    explanation: A block groups experimental units that are alike on a nuisance variable known to affect the response, and the treatments are then randomized within each block [^1]. Comparing treatments inside blocks takes the block-to-block differences out of the error, so the main gain is a smaller unexplained variation among units given the same treatment and a more precise comparison [^2]. Bias and confounding are handled mainly by randomization [^1], and variation between treatments is the effect the experiment is trying to detect, not something to reduce.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (randomization, blocking)
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson01#blocking
        locator: Lesson 1, Sec. 1.2 The Basic Principles of DOE (Blocking)
    source:
      id: mmlu-redux
      ref: high_school_statistics/1
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=1
    status: draft
  - id: statistics-081
    type: single
    difficulty: easy
    question: A manufacturer of ready-bake cake mixes is interested in designing an experiment to test the effects of four different temperature levels (300, 325, 350, and 375F), two different types of pans (glass and metal), and three different types of ovens (gas, electric, and microwave) on the texture of its cakes, in all combinations. Which of the following below is the best description of the design of the necessary experiment?
    options:
      - text: A completely randomized design with nine treatment groups
      - text: A completely randomized design with 24 treatment groups
        correct: true
      - text: A randomized block design, blocked on temperature, with six treatment groups
      - text: A randomized block design, blocked on type of pan, with 12 treatment groups
    explanation: 'All three factors are under study and every combination of levels is tested, so each combination is a treatment: $4 \times 2 \times 3 = 24$ treatment groups, and in a completely randomized design each of these combinations is randomly assigned to experimental units [^1]. Blocking is for nuisance factors that are not of interest [^2]; temperature, pan and oven are the factors being studied, so blocking on one of them is wrong. Nine is the sum $4 + 2 + 3$, not the number of combinations.'
    references:
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson05#extension-to-a-3-factor-model
        locator: Lesson 5, Sec. 5.1 Extension to a 3 Factor Model
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson04#blocking-scenarios
        locator: Lesson 4, Sec. 4.1 Blocking Scenarios (nuisance factors)
    source:
      id: mmlu-redux
      ref: high_school_statistics/11
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=11
    status: draft
  - id: statistics-082
    type: single
    difficulty: easy
    question: A school committee member is lobbying for an increase in the gasoline tax to support the county school system. The local newspaper conducted a survey of county residents to assess their support for such an increase. What is the population of interest here?
    options:
      - text: All school-aged children
      - text: All county residents
        correct: true
      - text: All county residents with school-aged children
      - text: All county residents with children in the county school system
    explanation: The population is the whole group a research question is about, and the sample is the subset actually surveyed [^1]. The newspaper wants to know how much support a gasoline-tax increase has among county residents, all of whom would pay the tax, so the target population is all county residents [^2]. Children or households with school-aged children are only subgroups; limiting the population to them would leave out most of the people whose support is being measured.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#samples-populations
        locator: Lesson 1, Sec. 1.2 Samples & Populations
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
        locator: Sec. 2.1.1 Populations and samples
    source:
      id: mmlu-redux
      ref: high_school_statistics/21
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=21
    status: draft
  - id: statistics-083
    type: single
    difficulty: medium
    question: Which of the following is a false statement about simple random samples?
    options:
      - text: A sample must be reasonably large to be properly considered a simple random sample.
        correct: true
      - text: Inspection of a sample will give no indication of whether or not it is a simple random sample.
      - text: Attributes of a simple random sample may be very different from attributes of the population.
      - text: Every element of the population has an equal chance of being picked.
    explanation: 'A simple random sample is defined by how it is drawn: each case in the population has an equal chance of being included, and knowing that one case is in the sample tells you nothing about which others are [^1]. Sample size plays no part in that definition, so a small sample can be a perfectly good SRS. Because the definition is about the selection process, inspecting a finished sample cannot show whether it was drawn as an SRS, and by chance alone a random sample can still differ noticeably from the population; that chance variation is what the margin of error describes [^2].'
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-samp-methods
        locator: Sec. 2.1.5 Four sampling methods (simple random sampling)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#the-margin-of-error
        locator: Lesson 2, Sec. 2.2 The Beauty of Sampling (The margin of error)
    source:
      id: mmlu-redux
      ref: high_school_statistics/26
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=26
    status: draft
  - id: statistics-084
    type: single
    difficulty: easy
    question: A medical research team tests for tumor reduction in a sample of patients using three different dosages of an experimental cancer drug. Which of the following is true?
    options:
      - text: There are three explanatory variables and one response variable.
      - text: There is one explanatory variable with three levels of response.
      - text: Tumor reduction is the only explanatory variable, but there are three response variables corresponding to the different dosages.
      - text: There are three levels of a single explanatory variable.
        correct: true
    explanation: The explanatory variable is the one the researchers manipulate, here the dosage of the drug, and the response variable is the outcome they measure, tumor reduction [^1]. Three dosages are three levels of that single explanatory variable (one factor with three levels), not three different explanatory variables [^2]. Tumor reduction is the only response, so the statements that make it explanatory or speak of three response variables reverse the roles.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#sec-explanatory-and-response-variables
        locator: Lesson 1, Sec. 1.1.2 Explanatory & Response Variables
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson01#factors
        locator: Lesson 1, Sec. 1.3 Steps for Planning an Experiment (choice of factors, levels, and ranges; Factors)
    source:
      id: mmlu-redux
      ref: high_school_statistics/28
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=28
    status: draft
  - id: statistics-085
    type: single
    difficulty: easy
    question: |
      Two possible wordings for a questionnaire on a proposed school budget increase are:

      - **Wording I:** "This school district has one of the highest per-student expenditure rates in the state. This has resulted in low failure rates, high standardized test scores, and most students going on to good colleges and universities. Do you support the proposed school budget increase?"
      - **Wording II:** "This school district has one of the highest per-student expenditure rates in the state. This has resulted in high property taxes, with many people on fixed incomes having to give up their homes because they cannot pay the school tax. Do you support the proposed school budget increase?"

      One wording found that 58% of respondents support the increase; the other found only 13%. Which result most likely came from which wording, and why?
    options:
      - text: Wording I showed 58% and wording II 13%, because of the lack of randomization as evidenced by the wording of the questions.
      - text: Wording I showed 13% and wording II 58%, because of a placebo effect due to the wording of the questions.
      - text: Wording I showed 58% and wording II 13%, because of the lack of a control group.
      - text: Wording I showed 58% and wording II 13%, because of response bias due to the wording of the questions.
        correct: true
    explanation: 'The two versions ask the same thing but lead the respondent: wording I mentions only benefits of the high spending and wording II only its costs, and respondents tend to go along with one-sided statements [^1]. So the positive framing produces the high support (58%) and the negative framing the low support (13%). This is response bias, a systematic distortion in the answers caused here by the wording [^1][^2]. Randomization, placebos and control groups belong to experiments and do not explain a difference created by how a survey question is phrased.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson01#its-all-in-the-wording
        locator: Lesson 1, Sec. 1.2 It's All in the Wording (Example 1.4 one-sided statements)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#other-sources-of-bias
        locator: Lesson 1, Sec. 1.3 Other Sources of Bias (Definition 1.19 Response Bias)
    source:
      id: mmlu-redux
      ref: high_school_statistics/29
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=29
    status: draft
  - id: statistics-086
    type: single
    difficulty: medium
    question: A reading specialist in a large public school system believes that the more time students spend reading, the better they will do in school. She plans a middle school experiment in which an SRS of 30 eighth graders will be assigned four extra hours of reading per week, an SRS of 30 seventh graders will be assigned two extra hours of reading per week, and an SRS of 30 sixth graders with no extra assigned reading will be a control group. After one school year, the mean GPAs from each group will be compared. Is this a good experimental design?
    options:
      - text: Yes.
      - text: No, because while this design may point out an association between reading and GPA, it cannot establish a cause-and-effect relationship.
      - text: No, because without blinding, there is a strong chance of a placebo effect.
      - text: No, because grade level is a lurking variable which may well be confounded with the variables under consideration.
        correct: true
    explanation: 'Each amount of extra reading goes to a different grade (eighth graders four hours, seventh graders two, sixth graders none), so grade level moves together with the treatment. Grade also affects GPA on its own, which makes it a confounding (lurking) variable: any difference in GPA could come from grade rather than from reading [^1][^2]. Randomly assigning the reading levels to students within the same grade would break that link; the flaw is not that experiments cannot show cause and effect, and blinding is not the main problem here.'
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#confounding-variables
        locator: Lesson 1, Sec. 1.4.1 Confounding Variables
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
