  - id: statistics-015
    type: single
    difficulty: medium
    question: Company I manufactures demolition fuses that burn an average of 50 minutes with a standard deviation of 10 minutes, while company II advertises fuses that burn an average of 55 minutes with a standard deviation of 5 minutes. Which company's fuse is more likely to last at least 1 hour? Assume normal distributions of fuse times.
    options:
      - text: Company I's, because of its greater standard deviation
      - text: Company II's, because of its greater mean
      - text: For both companies, the probability that a fuse will last at least 1 hour is 0.159
        correct: true
      - text: For both companies, the probability that a fuse will last at least 1 hour is 0.841
    explanation: |
      Turn one hour into a z-score for each company [^1]: Company I gives
      $z = (60-50)/10 = 1$ and Company II gives $z = (60-55)/5 = 1$. Both fuses have to beat the
      same z-score, so the probabilities are equal: $P(Z > 1) = 0.5 - 0.34134 \approx 0.159$ [^2].
      The value 0.841 is $P(Z < 1)$, the chance a fuse burns out before an hour. Neither the
      larger standard deviation nor the larger mean wins on its own; what matters is how many
      standard deviations 60 minutes lies above each mean.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.0)
    source:
      id: mmlu-redux
      ref: high_school_statistics/13
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=13
    status: draft
  - id: statistics-016
    type: single
    difficulty: medium
    question: The total cholesterol level in a large population of people is strongly skewed right with a mean of 210 mg/dL and a standard deviation of 15 mg/dL. If random samples of size 16 are repeatedly drawn from this population, which of the following appropriately describes the sampling distribution of these sample means?
    options:
      - text: The shape is unknown with a mean of 210 and a standard deviation of 15.
      - text: The shape is somewhat skewed right with a mean of 210 and a standard deviation of 3.75.
        correct: true
      - text: The shape is approximately normal with a mean of 210 and a standard deviation of 15.
      - text: The shape is approximately normal with a mean of 210 and a standard deviation of 3.75.
    explanation: |
      For random samples of size $n$, the sampling distribution of $\bar{x}$ is centered at
      $\mu = 210$ with standard error $\sigma/\sqrt{n} = 15/\sqrt{16} = 3.75$ [^1]. Its shape is
      close to normal only when $n$ is large relative to the skew of the population: a common
      rule of thumb asks for about 60 observations when the population is strongly skewed [^2].
      With only 16 observations from a strongly right-skewed population, the sample means are
      still somewhat skewed right, so "approximately normal" overstates the Central Limit
      Theorem here. Options with a standard deviation of 15 confuse the spread of individual
      values with the spread of sample means.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#mathematical-distribution-of-the-sample-mean
        locator: Sec. 19.2.1 Mathematical distribution of the sample mean
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
        locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄
    source:
      id: mmlu-redux
      ref: high_school_statistics/14
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=14
    status: draft
  - id: statistics-017
    type: single
    difficulty: medium
    question: A recent poll reported that 43% of Americans approve of the job the president is doing, with a margin of sampling error of ±3.2% at a 95% level of confidence. Which of these correctly interprets that margin of error?
    options:
      - text: There is a 3.2% percent chance that the proportion of all Americans who approve of the job the president is doing is not 43%.
      - text: There is a 95% chance that the proportion of all Americans who approve of the job the president is doing is 43%.
      - text: About 95% of polls conducted in this way will find that between 39.8% and 46.2% of those sampled approve of the job the president is doing.
      - text: About 95% of polls conducted in this way will give a sample proportion within 3.2 percentage points of the actual proportion of all Americans who approve of the job the president is doing.
        correct: true
    explanation: |
      The margin of error, $z^\star \times SE$, describes how far sample proportions typically
      land from the truth: at 95% confidence, about 95% of samples drawn the same way give a
      $\hat{p}$ within the margin of the population proportion [^1]. The confidence level
      describes the method over many possible polls, not this one dataset [^2], so it gives no
      probability (95% or 3.2%) that the true proportion is, or is not, exactly 43%. The option about
      39.8% to 46.2% "of those sampled" is wrong because the interval is meant to capture the
      population proportion, not the results of other samples [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#sec-moe
        locator: Sec. 13.3.3 Margin of error
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-props.html#what-does-95-mean
        locator: Sec. 17.2.4 What does 95% mean?
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
    source:
      id: mmlu-redux
      ref: high_school_statistics/15
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=15
    status: draft
  - id: statistics-018
    type: single
    difficulty: medium
    question: A company is interested in comparing the mean sales revenue per salesperson at two different locations. The manager takes a random sample of 10 salespeople from each location independently and records the sales revenue generated by each person during the last four weeks. He decides to use a t-test to compare the mean sales revenue at the two locations. Which of the following assumptions is necessary for the validity of the t-test?
    options:
      - text: The population standard deviations at both locations are equal.
      - text: The population standard deviations at both locations are not equal.
      - text: The population standard deviations at both locations are known.
      - text: The population of the sales records at each location is normally distributed.
        correct: true
    explanation: |
      With only 10 salespeople per location, the two-sample t procedure is justified only if
      each population is approximately normal; the large-sample alternative needs at least 30
      per group [^1]. The usual standard error $\sqrt{s_1^2/n_1 + s_2^2/n_2}$ uses each sample's
      own standard deviation, so the population standard deviations do not have to be equal
      [^1][^2], and assuming they differ is not a requirement either. If the population standard
      deviations were known, you would use a z procedure rather than a t-test [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson09#two-independent-means
        locator: Lesson 9, Sec. 9.2 Two Independent Means
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-means.html#observed-data-3
        locator: Sec. 20.4.1 (conditions for the t-distribution with a difference in means)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#one-sample-mean
        locator: Lesson 8, Sec. 8.2 One Sample Mean
    source:
      id: mmlu-redux
      ref: high_school_statistics/16
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=16
    status: draft
  - id: statistics-019
    type: single
    difficulty: easy
    question: A study is made to determine whether more hours of academic studying leads to higher point scoring by basketball players. In surveying 50 basketball players, it is noted that the 25 who claim to study the most hours have a higher point average than the 25 who study less. Based on this study, the coach begins requiring the players to spend more time studying. Which of the following is a correct statement?
    options:
      - text: While this study may have its faults, it still does prove causation.
      - text: There could well be a confounding variable responsible for the seeming relationship.
        correct: true
      - text: While this is a controlled experiment, the conclusion of the coach is not justified.
      - text: To get the athletes to study more, it would be more meaningful to have them put in more practice time on the court to boost their point averages, as higher point averages seem to be associated with more study time.
    explanation: |
      The players chose how much to study, so this is an observational comparison with no
      random assignment and no control over other factors [^1]. A confounding variable is one
      related to both the explanatory and the response variable [^1]. Motivation or discipline
      could drive both study time and scoring, much as sun exposure drives both sunscreen use and
      skin cancer in the textbook example [^2]. Association in
      such data does not establish causation, so this study does not justify the coach's
      requirement [^3]. It is not a controlled experiment, and the idea that more court practice
      would raise study time reverses the reasoning without any evidence.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#confounding-variables
        locator: Lesson 1, Sec. 1.4.1 Confounding Variables
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-observational-studies
        locator: Sec. 2.3 Observational studies
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#observational-studies-and-experiments
        locator: Sec. 1.2.5 Observational studies and experiments (Association ≠ Causation)
    source:
      id: mmlu-redux
      ref: high_school_statistics/17
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=17
    status: draft
  - id: statistics-020
    type: single
    difficulty: medium
    question: The mean daily demand for bread at a popular bakery is 2,500 loaves, with a standard deviation of 225 loaves. Every morning the bakery bakes 3,000 loaves. What is the probability that today it will run out of bread? Assume that the mean daily demand for bread at this bakery is normally distributed.
    options:
      - text: '0.8333'
      - text: '0.1667'
      - text: '0.9869'
      - text: '0.0132'
        correct: true
    explanation: |
      The bakery runs out when demand exceeds 3,000 loaves, so standardize that value [^1]:
      $z = (3000 - 2500)/225 \approx 2.22$. The normal table gives an area of 0.48679 between 0
      and 2.22, so $P(Z > 2.22) = 0.5 - 0.48679 \approx 0.0132$ [^2]. The value 0.9869 is the
      chance of *not* running out, $P(Z < 2.22)$. The options 0.8333 and 0.1667 come from
      $2500/3000$ and its complement, which ignore the standard deviation entirely.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 2.2)
    source:
      id: mmlu-redux
      ref: high_school_statistics/18
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=18
    status: draft
  - id: statistics-021
    type: single
    difficulty: medium
    question: 'An assembly line machine is supposed to turn out ball bearings with a diameter of 1.25 centimeters. Each morning the first 30 bearings produced are pulled and measured. If their mean diameter is under 1.23 centimeters or over 1.27 centimeters, the machinery is stopped and an engineer is called to make adjustments before production is resumed. The quality control procedure may be viewed as a hypothesis test with the null hypothesis H0: μ = 1.25 and the alternative hypothesis Ha: μ 1.25. The engineer is asked to make adjustments when the null hypothesis is rejected. In test terminology, what would a Type II error result in?'
    options:
      - text: A warranted halt in production to adjust the machinery
      - text: An unnecessary stoppage of the production process
      - text: Continued production of wrong size ball bearings
        correct: true
      - text: Continued production of proper size ball bearings
    explanation: |
      A Type II error is failing to reject $H_0$ when $H_0$ is false [^1]. Here $H_0$ says the
      mean diameter is on target (1.25 cm), and not rejecting it means production continues, so a
      Type II error is continued production of wrong-size bearings while the machine is actually
      off. An unnecessary stoppage is the opposite mistake, a Type I error: rejecting a true
      $H_0$ [^1]. A warranted halt and continued production of correct bearings are the two
      correct decisions [^2].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-errors.html#sec-foundations-decision-errors
        locator: Ch. 14 Decision Errors, Table 14.1
    source:
      id: mmlu-redux
      ref: high_school_statistics/19
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=19
    status: draft
  - id: statistics-022
    type: single
    difficulty: medium
    question: The probability is 0.2 that a value selected at random from a normal distribution with mean 600 and standard deviation 15 will be above what number?
    options:
      - text: '0.84'
      - text: '603.8'
      - text: '612.6'
        correct: true
      - text: '587.4'
    explanation: |
      A value with 20% of the distribution above it is the 80th percentile. The 80th percentile
      of the standard normal is $z \approx 0.84$ [^1], and converting back with $x = \mu + z\sigma$
      gives $600 + 0.84 \times 15 \approx 612.6$ [^2]. The option 0.84 is the z-score, not the
      value, and 587.4 $= 600 - 0.84 \times 15$ is the 20th percentile, the value with 20%
      *below* it.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-calculations
        locator: Sec. 13.2.3 Normal probability calculations (Z for the 80th percentile)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (finding the value at a percentile)
    source:
      id: mmlu-redux
      ref: high_school_statistics/20
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=20
    status: draft
  - id: statistics-023
    type: single
    difficulty: medium
    question: 'A farmer wants to know whether a new fertilizer has increased the mean weight of his apples. With the old fertilizer, the mean weight was 4.0 ounces per apple. The farmer decides to test H0: μ = 4.0 ounces versus Ha : μ > 4.0 ounces, at a 5 percent level of significance, where μ = the mean weight of apples using the new fertilizer. The weights of apples are approximately normally distributed. The farmer takes a random sample of 16 apples and computes a mean of 4.3 ounces and a standard deviation of 0.6 ounces. Which of the following gives the p-value for this test?'
    options:
      - text: P(Z > 2)
      - text: P(Z < 2)
      - text: P(t > 2) with 15 degrees of freedom
        correct: true
      - text: P(t < 2) with 15 degrees of freedom
    explanation: |
      Only the sample standard deviation $s = 0.6$ is known, so the test statistic is a T score
      with $df = n - 1 = 15$ [^1]: $T = (4.3 - 4.0)/(0.6/\sqrt{16}) = 0.3/0.15 = 2$. The
      alternative is $\mu > 4.0$, so the p-value is the area to the right of the test statistic,
      $P(t > 2)$ [^2]. Z-based options would need a known population $\sigma$ [^3], and
      $P(t < 2)$ points in the wrong direction.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#one-sample-t-tests
        locator: Sec. 19.2.5 One sample t-tests
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#minitab-finding-proportions-under-a-normal-distribution
        locator: Lesson 7, Sec. 7.2 (p-value for a right-tailed test)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#one-sample-mean
        locator: Lesson 8, Sec. 8.2 One Sample Mean
    source:
      id: mmlu-redux
      ref: high_school_statistics/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=22
    status: draft
  - id: statistics-024
    type: single
    difficulty: medium
    shuffle: false
    question: The mean height of adult men is 70 inches, with a standard deviation of four inches. The mean height of adult women is 66 inches, with a standard deviation of three inches. Between a man with a height of 74 inches and a woman with a height of 70 inches, who is more unusually tall within his or her respective sex?
    options:
      - text: It cannot be determined, because the mean heights for the two groups are different.
      - text: It cannot be determined, because the standard deviations of the heights for the two groups are different.
      - text: The man, because he is 74 inches tall and the woman is only 70 inches tall.
      - text: The woman, because her height is 1.33 standard deviations above the mean height of all women, whereas the man’s height is only one standard deviation above the mean height of all men.
        correct: true
    explanation: |
      Raw heights from distributions with different means and spreads are not directly
      comparable, so compare z-scores [^1]. The man's is $(74-70)/4 = 1$ and the woman's is
      $(70-66)/3 \approx 1.33$. An observation is more unusual when its z-score is larger in
      absolute value [^1], so the woman is the more unusually tall one. Different means or
      standard deviations do not make the comparison impossible; standardizing is exactly what
      removes those differences.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
    source:
      id: mmlu-redux
      ref: high_school_statistics/23
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=23
    status: draft
  - id: statistics-025
    type: single
    difficulty: medium
    question: A random sample of 25 men and a separate random sample of 25 women are selected to answer questions about attitudes toward abortion. The answers were categorized as "pro-life" or "pro-choice." Which of the following is the proper null hypothesis for this situation?
    options:
      - text: The variables "gender" and "attitude toward abortion" are related.
      - text: The proportion of "pro-life" men is the same as the proportion of "pro-life" women.
        correct: true
      - text: The proportion of "pro-life" men is related to the proportion of "pro-life" women.
      - text: The proportion of "pro-choice" men is the same as the proportion of "pro-life" women.
    explanation: |
      There are two independent random samples (men and women) and a two-category response, so
      the question is whether the proportion holding a given view is the same in both
      populations. A null hypothesis states that there is no difference in the populations, and
      for two proportions it is written $p_1 = p_2$ [^1]; here, the proportion of "pro-life" men
      equals the proportion of "pro-life" women. "The variables are related" is the alternative
      hypothesis, not the null [^1]. Saying two proportions are "related" is not a testable
      statement, and comparing pro-choice men with pro-life women mixes two different categories.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#writing-hypotheses
        locator: Lesson 5, Sec. 5.2 Writing Hypotheses (Difference between Two Proportions)
    source:
      id: mmlu-redux
      ref: high_school_statistics/24
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=24
    status: draft
  - id: statistics-026
    type: single
    difficulty: hard
    question: A telephone survey of 400 registered voters showed that 256 had not yet made up their minds 1 month before the election. How sure can we be that between 60% and 68% of the electorate were still undecided at that time?
    options:
      - text: 2.4%
      - text: 8.0%
      - text: 64.0%
      - text: 90.4%
        correct: true
    explanation: |
      The sample proportion is $\hat{p} = 256/400 = 0.64$, with standard error
      $\sqrt{0.64 \times 0.36/400} = 0.024$ [^1]. The interval 60% to 68% is $0.64 \pm 0.04$, which
      is $0.04/0.024 \approx 1.67$ standard errors on each side. The confidence level of such an
      interval is the normal area between $-z^\star$ and $z^\star$ [^2]; the table gives about
      0.4522 between 0 and 1.667, so the level is $2 \times 0.4522 \approx 0.904$, or 90.4% [^3].
      The 64.0% option is the point estimate, 2.4% is the standard error, and 8.0% is the width
      of the interval; none of these is a confidence level.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#confidence-interval-for-a-proportion
        locator: Sec. 16.2.2 Confidence interval for a proportion
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.6)
    source:
      id: mmlu-redux
      ref: high_school_statistics/25
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=25
    status: draft
  - id: statistics-027
    type: single
    difficulty: medium
    question: In a random sample of Toyota car owners, 83 out of 112 said they were satisfied with the Toyota front-wheel drive, while in a similar survey of Subaru owners, 76 out of 81 said they were satisfied with the Subaru four-wheel drive. A 90% confidence interval estimate for the difference in proportions between Toyota and Subaru car owners who are satisfied with their drive systems is reported to be -0.197 ± 0.081. Which is a proper conclusion?
    options:
      - text: The interval is invalid because probabilities cannot be negative.
      - text: The interval is invalid because it does not contain zero.
      - text: Subaru owners are approximately 19.7% more satisfied with their drive systems than are Toyota owners.
      - text: We are 90% confident that the difference in proportions between Toyota and Subaru car owners who are satisfied with their drive systems is between -0.278 and -0.116.
        correct: true
    explanation: |
      The interval $-0.197 \pm 0.081$ runs from $-0.278$ to $-0.116$, and the right reading is
      that we are 90% confident the population difference (Toyota minus Subaru) lies in that
      range [^1]. An interval for a difference of proportions, $(\hat{p}_1 - \hat{p}_2) \pm z^\star
      \times SE$, can perfectly well contain negative values [^2]; here the sign just says
      Toyota's satisfaction rate is lower. An interval need not contain zero to be valid; a value
      outside it, such as 0, is simply not a plausible value of the difference [^3]. "19.7% more
      satisfied" ignores the margin of error and treats a 0.197 difference in proportions as a
      percentage.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-props.html#confidence-interval-for-the-difference-between-two-proportions
        locator: Sec. 17.3.2 Confidence interval for the difference between two proportions
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#applying-confidence-intervals
        locator: Lesson 4, Sec. 4.2.2 Applying Confidence Intervals
    source:
      id: mmlu-redux
      ref: high_school_statistics/32
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=32
    status: draft
  - id: statistics-028
    type: single
    difficulty: easy
    question: A small kiosk at the Atlanta airport carries souvenirs in the price range of \$3.99 to \$29.99, with a mean price of \$14.75. The airport authorities decide to increase the rent charged for a kiosk by 5 percent. To make up for the increased rent, the kiosk owner decides to increase the prices of all items by 50 cents. As a result, which of the following will happen?
    options:
      - text: The mean price and the range of prices will increase by 50 cents.
      - text: The mean price will remain the same, but the range of prices will increase by 50 cents.
      - text: The mean price and the standard deviation of prices will increase by 50 cents.
      - text: The mean price will increase by 50 cents, but the standard deviation of prices will remain the same.
        correct: true
    explanation: |
      Adding the same constant to every value raises the mean by exactly that constant [^1].
      The spread does not change: every deviation from the (new) mean is the same as before, so
      the standard deviation and variance stay the same [^1]. The range, maximum minus minimum
      [^2], is also unchanged because both extremes rise by 50 cents (\$3.99–\$29.99 becomes
      \$4.49–\$30.49). The 5% rent increase is a distractor; only the 50-cent price change
      matters.
    references:
      - title: 'Data Science Discovery (University of Illinois): Modifying Values in Data and its Effect on Descriptive Statistics'
        url: https://discovery.cs.illinois.edu/guides/Descriptive-Statistics/modifying-descriptive-stats/#Adding-or-Subtracting-a-Constant-To-All-Values
        locator: Section 'Adding (or Subtracting) a Constant To All Values'
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson02#sec-5-num-sum
        locator: Lesson 2, Sec. 2.2.9 Five Number Summary (Definition 2.20, Range)
    source:
      id: mmlu-redux
      ref: high_school_statistics/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=33
    status: draft
  - id: statistics-029
    type: single
    difficulty: medium
    question: A correlation of 0.6 indicates that the percentage of variation in y that is explained by the variation in x is how many times the percentage indicated by a correlation of 0.3?
    options:
      - text: '2'
      - text: '3'
      - text: '4'
        correct: true
      - text: '6'
    explanation: |
      The share of the variation in $y$ explained by a linear fit is $R^2$, which equals the
      square of the correlation [^1]. For $r = 0.6$, $R^2 = 0.36$; for $r = 0.3$, $R^2 = 0.09$;
      and $0.36/0.09 = 4$. Doubling $r$ quadruples $R^2$, so 2 is the tempting answer that forgets
      to square.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
        locator: Sec. 7.2.5 Describing the strength of a fit
    source:
      id: mmlu-redux
      ref: high_school_statistics/38
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=38
    status: draft
  - id: statistics-030
    type: single
    difficulty: easy
    question: What is the probability of a Type II error when a hypothesis test is being conducted at the 10% significance level (α = 0.10)?
    options:
      - text: '0.05'
      - text: '0.10'
      - text: '0.90'
      - text: There is insufficient information to answer this question.
        correct: true
    explanation: |
      $\beta = P(\text{Type II error})$ is the probability of failing to reject $H_0$ when it is
      false [^1]. It depends on things the question does not give, such as the sample size, the
      standard error and the size of the true difference from the null value, all of which change
      the power $1 - \beta$ [^2]. The significance level fixes only the Type I error rate,
      $\alpha = 0.10$ [^1]; 0.10 is $\alpha$ and 0.90 is $1 - \alpha$, and neither is $\beta$.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/39
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=39
    status: draft
  - id: statistics-031
    type: single
    difficulty: medium
    shuffle: false
    question: 'Suppose H0: p = 0.6, and the power of the test for Ha: p = 0.7 is 0.8. Which of the following is a valid conclusion?'
    options:
      - text: The probability of committing a Type I error is 0.1.
      - text: If Ha is true, the probability of failing to reject H0 is 0.2.
        correct: true
      - text: The probability of committing a Type II error is 0.3.
      - text: All of the above are valid conclusions.
    explanation: |
      Power is the probability of rejecting $H_0$ when it is false, and power $= 1 - \beta$,
      where $\beta$ is the probability of a Type II error [^1]. A power of 0.8 against $p = 0.7$
      therefore means $\beta = 0.2$: if $H_a$ ($p = 0.7$) is true, the test fails to reject $H_0$
      with probability 0.2. The question never gives the significance level $\alpha$, the Type I
      error probability [^2], so 0.1 cannot be concluded, and 0.3 is not $1 - 0.8$.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/40
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=40
    status: draft
  - id: statistics-032
    type: single
    difficulty: medium
    question: The mean thrust of a certain model jet engine is 9500 pounds. Concerned that a production process change might have lowered the thrust, an inspector tests a sample of units, calculating a mean of 9350 pounds with a z-score of -2.46 and a P-value of 0.0069. Which of the following is the most reasonable conclusion?
    options:
      - text: 99.31% of the engines produced under the new process will have a thrust under 9350 pounds.
      - text: 99.31% of the engines produced under the new process will have a thrust under 9500 pounds.
      - text: 0.69% of the time an engine produced under the new process will have a thrust over 9500 pounds.
      - text: There is evidence to conclude that the new process is producing engines with a mean thrust under 9500 pounds.
        correct: true
    explanation: |
      The P-value 0.0069 is the probability of getting a sample mean at least this far below
      9500 if the true mean thrust were still 9500 [^1]. A P-value that small is strong evidence
      against $H_0$, so the inspector concludes that the new process has a mean thrust below 9500
      pounds [^1][^2]. A P-value is not a percentage of engines above or below some thrust: it
      is computed from the sampling distribution of the mean under $H_0$, not from individual
      engines.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#making-a-decision
        locator: Lesson 5, Sec. 5.4 p-values (Making a Decision)
    source:
      id: mmlu-redux
      ref: high_school_statistics/41
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=41
    status: draft
  - id: statistics-033
    type: single
    difficulty: easy
    question: In a group of 10 scores, the largest score is increased by 40 points. What will happen to the mean?
    options:
      - text: It will remain the same.
      - text: It will increase by 4 points.
        correct: true
      - text: It will increase by 10 points.
      - text: It will increase by 40 points.
    explanation: |
      The mean is the sum of the values divided by how many there are [^1]. Raising one score by
      40 raises the sum by 40, so the mean rises by $40/10 = 4$ points, whichever score was
      changed. The mean would go up by 40 only if every score rose by 40 [^2].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-dotplots
        locator: Sec. 5.2 Dot plots and the mean
      - title: 'Data Science Discovery (University of Illinois): Modifying Values in Data and its Effect on Descriptive Statistics'
        url: https://discovery.cs.illinois.edu/guides/Descriptive-Statistics/modifying-descriptive-stats/#The-effect-on-the-mean
        locator: Section 'The effect on the mean'
    source:
      id: mmlu-redux
      ref: high_school_statistics/42
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=42
    status: draft
  - id: statistics-034
    type: single
    difficulty: medium
    question: A study was conducted to test a new style of keyboard in preventing repetitive stress disorders. Volunteers who have had problems with such injuries were randomly assigned to use either a traditional keyboard or the new design. A significance test was conducted with the alternative hypothesis that a smaller proportion of those using the new keyboard will suffer injuries than those using the traditional keyboard. The resulting P-value was 0.07. Which is a correct interpretation of this P-value?
    options:
      - text: The null hypothesis should be rejected.
      - text: The null hypothesis should be accepted.
      - text: There is a 7% chance that the null hypothesis is correct.
      - text: There is a 7% chance of getting a difference between the two groups at least as large as the observed difference if the new keyboard is really no better at preventing injuries.
        correct: true
    explanation: |
      A P-value is the probability of data at least as favorable to $H_a$ as the observed data,
      computed assuming $H_0$ is true [^1]. Here that is a 7% chance of seeing a difference at
      least this large if the new keyboard really is no better. It is not the probability that
      $H_0$ is true. No significance level was set, so "reject" does not follow automatically:
      you reject only when $p \le \alpha$, and at the common $\alpha = 0.05$ a P-value of 0.07
      would not be enough [^2]. Failing to reject never means accepting $H_0$ [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#making-a-decision
        locator: Lesson 5, Sec. 5.4 p-values (Making a Decision)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#the-us-court-system
        locator: Sec. 11.3.1 The US court system
    source:
      id: mmlu-redux
      ref: high_school_statistics/43
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=43
    status: draft
  - id: statistics-035
    type: single
    difficulty: easy
    question: A hypothesis test is set up so that P(rejecting H0 when H0 is true) = 0.05 and P(failing to reject H0 when H0 is false) = 0.26. What is the power of the test?
    options:
      - text: '0.26'
      - text: '0.05'
      - text: '0.95'
      - text: '0.74'
        correct: true
    explanation: |
      $P(\text{fail to reject } H_0 \mid H_0 \text{ false})$ is the Type II error probability
      $\beta = 0.26$, and power is $1 - \beta$ [^1], so the power is $1 - 0.26 = 0.74$. The 0.05
      is $\alpha$, the Type I error probability [^2], and 0.95 is $1 - \alpha$, which is not the
      power.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/44
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=44
    status: draft
  - id: statistics-036
    type: single
    difficulty: medium
    question: Which of these statements correctly explains bias?
    options:
      - text: It describes a process that creates estimates that are too high on average or too low on average.
        correct: true
      - text: It describes a process that results in a sample that does not represent the population.
      - text: It describes a lack of randomization in the sampling process.
      - text: It describes a sample that is not representative of the population.
    explanation: |
      Bias is a systematic tendency to over- or under-estimate the true population value [^1]:
      it is a property of the estimation process, judged by where its estimates land on average.
      The other options describe causes or symptoms rather than the definition. A poor sampling
      method can create bias, which is why sampling bias is defined by the methods used to
      obtain the sample [^2]; and even a random method sometimes yields a sample that is not
      representative, which is chance variation rather than bias [^3].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex#L221
        locator: Sec. 5.1.1 Point estimates and error (LaTeX source, l. 221)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#sampling-bias
        locator: Lesson 1, Sec. 1.2.1 Sampling Bias (Definitions 1.14–1.15)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sampling-from-a-population
        locator: Sec. 2.1.4 Sampling from a population
    source:
      id: mmlu-redux
      ref: high_school_statistics/45
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=45
    status: draft
  - id: statistics-037
    type: single
    difficulty: medium
    question: Which of the following statements is false?
    options:
      - text: Like the normal distribution, the t-distributions are symmetric.
      - text: The t-distributions are lower at the mean and higher at the tails, and so are more spread out than the normal distribution.
      - text: The greater the df, the closer the t-distributions are to the normal distribution.
      - text: The smaller the df, the better the 68-95-99.7 Rule works for t-models.
        correct: true
    explanation: |
      The claim about small df is the false one: with few degrees of freedom the t-distribution
      has much thicker tails, so the 68-95-99.7 Rule fits worse, not better. For example, with
      $df = 2$ about 9.6% of the area lies more than 3 units from the center, versus roughly 0.3%
      for the normal [^1]. The other statements are true: t-distributions are symmetric like the
      normal [^2], their tails are higher than the normal's [^1][^2], and they get closer to the
      normal as df grows [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
        locator: Sec. 19.2.3 Introducing the t-distribution
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#t-distribution
        locator: Lesson 8, Sec. 8.2 One Sample Mean and Sec. 8.2.1 t-Distribution
    source:
      id: mmlu-redux
      ref: high_school_statistics/46
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=46
    status: draft
  - id: statistics-038
    type: single
    difficulty: medium
    question: Self-efficacy (the belief that one has control over one's situation) as it related to job satisfaction was studied. When a group of teachers rated their ability to control their situation and their satisfaction with their job, the two variables had a correlation of 0.30. Which statement follows from this correlation?
    options:
      - text: If you want teachers to be happy with their job, give them more control over their situation.
      - text: If you want teachers to take more control over their situation, make them happier at their jobs.
      - text: Teachers in the study who were more satisfied with their job were less confident in their ability to control their situation.
      - text: 9% of the variability in job satisfaction can be explained by the linear model with self-efficacy as a predictor.
        correct: true
    explanation: |
      For a linear fit, $R^2 = r^2$ is the share of the variation in the response explained by
      the predictor [^1], so $r = 0.30$ gives $0.30^2 = 0.09$, i.e. 9%. A positive correlation
      means higher values of one variable tend to go with higher values of the other [^2], so
      "more satisfied but less confident" gets the direction wrong. The two "if you want..."
      options read causation into an observational association, which such data cannot
      support [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
        locator: Sec. 7.2.5 Describing the strength of a fit
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-relations
        locator: Sec. 1.2.3 Relationships between variables
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-observational-studies
        locator: Sec. 2.3 Observational studies
    source:
      id: mmlu-redux
      ref: high_school_statistics/47
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=47
    status: draft
  - id: statistics-039
    type: single
    difficulty: medium
    question: The director of a local food bank asks for data on all donations given during the month of November. Of the 100 checks received, the average donation is \$155 with a standard deviation of \$32. Which of the following is the most appropriate statement?
    options:
      - text: This November, the average donation is \$155.
        correct: true
      - text: 50% of all donations this November are more than \$155.
      - text: We are 95% confident that the average donation in November is between about \$91 and \$219.
      - text: We are 95% confident that the average donation in November is between about \$149 and \$161.
    explanation: |
      The 100 checks are all of November's donations, so the data are a census of the
      population [^1] and \$155 is a population parameter, not a sample statistic [^2]. A
      confidence interval estimates an unknown parameter from a sample [^3], so none is needed
      when the parameter has been computed directly. (\$91 to \$219 is the mean ± 2 SD, a spread
      of individual checks, and \$149 to \$161 is the mean ± 2 SE.) "50% of donations are more
      than \$155" describes the median, the value that splits the data in half, not the mean [^4].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
        locator: Sec. 2.1.1 Populations and samples
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#parameters-and-statistics
        locator: Sec. 2.1.2 Parameters and statistics
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#introduction-to-confidence-intervals
        locator: Lesson 4, Sec. 4.2 Introduction to Confidence Intervals (Definition 4.4)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
    source:
      id: mmlu-redux
      ref: high_school_statistics/50
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=50
    status: draft
  - id: statistics-040
    type: single
    difficulty: easy
    question: A chi-squared test of independence is to be performed on a 3 × 4 contingency table. How many degrees of freedom does this test have?
    options:
      - text: '6'
        correct: true
      - text: '8'
      - text: '10'
      - text: '11'
    explanation: |
      For a chi-squared test of independence on a table with $R$ rows and $C$ columns,
      $df = (R-1)(C-1)$ [^1][^2]. A $3 \times 4$ table gives $(3-1)(4-1) = 2 \times 3 = 6$. The
      option 11 is the number of cells minus one, which is the wrong formula for a two-way table.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-tables.html#observed-statistic-vs.-null-chi-squared-statistics-1
        locator: Sec. 18.2.3 Observed statistic vs. null chi-squared statistics (degrees of freedom for a two-way table)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson11#chi-square-test-of-independence
        locator: Lesson 11, Sec. 11.3 Chi-Square Test of Independence
    source:
      id: mmlu-redux
      ref: high_school_statistics/51
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=51
    status: draft
  - id: statistics-041
    type: single
    difficulty: easy
    question: What is a sampling distribution?
    options:
      - text: A distribution of all the statistics that can be found in a given sample
      - text: A histogram, or other such visual representation, showing the distribution of a sample
      - text: A normal distribution of some statistic
      - text: A distribution of all the values taken by a statistic from all possible samples of a given size
        correct: true
    explanation: |
      A sampling distribution is the distribution of all possible values of a statistic (such
      as $\bar{x}$ or $\hat{p}$) over samples of a given size from a population; it shows how the
      statistic varies from sample to sample [^1]. A histogram of one sample shows the data
      distribution, which is a different thing [^1]. A sampling distribution is also not
      automatically normal: by the Central Limit Theorem it is approximately normal only when the
      sample is large enough [^2].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#sec-CLTsection
        locator: Sec. 13.1 Central Limit Theorem (definition of sampling distribution)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#central-limit-theorem
        locator: Lesson 7, Sec. 7.4 Central Limit Theorem
    source:
      id: mmlu-redux
      ref: high_school_statistics/57
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=57
    status: draft
  - id: statistics-042
    type: single
    difficulty: medium
    question: A soft drink dispenser can be adjusted to deliver any fixed number of ounces. If the machine is operating with a standard deviation in delivery equal to 0.3 ounce, what should be the mean setting so that a 12-ounce cup will overflow less than 1% of the time? Assume a normal distribution for ounces delivered.
    options:
      - text: 12 - 0.99(0.3) ounces
      - text: 12 - 2.326(0.3) ounces
        correct: true
      - text: 12 - 2.576(0.3) ounces
      - text: 12 + 2.326(0.3) ounces
    explanation: |
      Overflow means more than 12 ounces, so we need $P(X > 12) = 0.01$. The standard normal
      value with 1% above it is $z = 2.326$ [^1], so 12 ounces must sit 2.326 standard deviations
      above the mean. Solving $2.326 = (12 - \mu)/0.3$ gives $\mu = 12 - 2.326(0.3) \approx 11.3$
      ounces [^2]. The value 2.576 leaves only 0.5% in the upper tail [^1], 0.99 is a probability
      rather than a z-score, and $12 + 2.326(0.3)$ would make the cup overflow most of the time.
    references:
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 (table of critical values of the normal distribution)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (solving the Z score formula for x)
    source:
      id: mmlu-redux
      ref: high_school_statistics/58
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=58
    status: draft
  - id: statistics-043
    type: single
    difficulty: medium
    question: Researchers are conducting an experiment using a significance level of 0.05. The null hypothesis is, in fact, false. If they modify their experiment to use twice as many experimental units for each treatment, which of the following would be true?
    options:
      - text: The probability of a Type I error and the probability of a Type II error would both decrease.
      - text: The probability of a Type I error and the power would both increase.
      - text: The probability of a Type II error and the power would both increase.
      - text: The probability of a Type I error would stay the same and the power would increase.
        correct: true
    explanation: |
      The researchers choose the significance level, and $\alpha$ is the probability of a Type I
      error, so it stays at 0.05 whatever the sample size [^1]. Increasing the sample size
      increases the power of the test [^2], and because power $= 1 - \beta$, the Type II error
      probability goes down [^2]. Power and the Type II error probability always move in opposite
      directions, so they cannot both increase.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/59
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=59
    status: draft
  - id: statistics-044
    type: single
    difficulty: medium
    question: At a large hospital, the durations of emergency room visits, from check-in to discharge, are approximately normally distributed with a mean of 167 minutes and a standard deviation of 76 minutes. Which interval, to the nearest minute, contains the middle 80% of durations?
    options:
      - text: 15 minutes to 319 minutes
      - text: 53 minutes to 281 minutes
      - text: 70 minutes to 264 minutes
        correct: true
      - text: 91 minutes to 243 minutes
    explanation: |
      The middle 80% leaves 10% in each tail, so the cutoffs are the 10th and 90th percentiles,
      at $z = \pm 1.282$ [^1]. Converting back with $x = \mu + z\sigma$ [^2] gives
      $167 \pm 1.282 \times 76 = 167 \pm 97.4$, about 70 to 264 minutes. The option 15 to 319 is
      $167 \pm 2 \times 76$, the middle 95%, and 91 to 243 is $167 \pm 76$, the middle 68% [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#top-x
        locator: Lesson 7, Sec. 7.3.1 Top X% and 7.3.2 Bottom X% (z = ±1.282)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#rule
        locator: Sec. 13.3.1 68-95-99.7 rule
    source:
      id: mmlu-redux
      ref: high_school_statistics/60
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=60
    status: draft
  - id: statistics-045
    type: single
    difficulty: hard
    question: A farmer who raises hens for egg production wants his eggs to have a mean mass of 56 grams. He is considering the purchase of a different type of hen, so he took a random sample of 18 eggs laid by this type of hen. The distribution of the masses is symmetric and mound-shaped with a mean of 54.1 grams and no outliers. The farmer conducted a t-test to see if there is evidence that the eggs from these hens have a mean mass that is different from 56 g and got a test statistic of t= -1.973. If he uses a 5% significance level, which is the correct conclusion and reason?
    options:
      - text: Because tis more extreme than ±1.96, he should reject the null hypothesis. He has convincing evidence at the 5% significance level that the mean mass of eggs from these hens is different from 56 grams.
      - text: Because tis less extreme than the critical value of t for 17 degrees of freedom, he should not reject the null hypothesis. He does not have convincing evidence at the 5% significance level that the mean mass of eggs from these hens is different from 56 grams.
        correct: true
      - text: Because tis less extreme than the critical value of t for 18 degrees of freedom, he should not reject the null hypothesis. He does not have convincing evidence at the 5% significance level that the mean mass of eggs from these hens is different from 56 grams.
      - text: Because tis more extreme than the critical value of t for 18 degrees of freedom, he should reject the null hypothesis. He has convincing evidence at the 5% significance level that the mean mass of eggs from these hens is different from 56 grams.
    explanation: |
      A one-sample t-test on $n = 18$ eggs uses $df = n - 1 = 17$ [^1]. The two-sided 5%
      critical value for 17 df is $t^\star = 2.110$ (the 0.975 column of a t table) [^2]. Since
      $|t| = 1.973 < 2.110$, the farmer fails to reject $H_0$ and does not have convincing evidence
      that the mean mass differs from 56 g. Comparing with $\pm 1.96$ wrongly uses the normal
      distribution, and 18 df uses $n$ instead of $n - 1$; even its critical value, 2.101, is not
      exceeded [^2].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#one-sample-t-tests
        locator: Sec. 19.2.5 One sample t-tests
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3672.htm
        locator: Sec. 1.3.6.7.2 Critical values of the Student's t distribution (rows 17–18)
    source:
      id: mmlu-redux
      ref: high_school_statistics/63
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=63
    status: draft
  - id: statistics-046
    type: single
    difficulty: easy
    question: In comparing the life expectancies of two models of refrigerators, the average years before complete breakdown of 10 model A refrigerators is compared with that of 15 model B refrigerators. The 90% confidence interval estimate of the difference is (6, 12). Which of the following is the most reasonable conclusion?
    options:
      - text: The mean life expectancy of one model is twice that of the other.
      - text: The mean life expectancy of one model is 6 years, while the mean life expectancy of the other is 12 years.
      - text: The probability that the life expectancies are different is 0.90.
      - text: We should be 90% confident that the difference in life expectancies is between 6 and 12 years.
        correct: true
    explanation: |
      A confidence interval estimates a population parameter, here the difference between the
      two models' mean life expectancies: we are 90% confident it is between 6 and 12 years
      [^1][^2]. The endpoints are not the two means, and nothing says one mean is twice the
      other. The 90% describes how often the method captures the parameter over many studies,
      not a probability that the life expectancies differ [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#interpreting-confidence-intervals
        locator: Lesson 4, Sec. 4.2.1 Interpreting Confidence Intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-props.html#what-does-95-mean
        locator: Sec. 17.2.4 What does 95% mean?
    source:
      id: mmlu-redux
      ref: high_school_statistics/65
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=65
    status: draft
  - id: statistics-047
    type: single
    difficulty: medium
    question: Changing from a 90% confidence interval estimate for a population proportion to a 99% confidence interval estimate, with all other things being equal,
    options:
      - text: increases the interval size by 9%.
      - text: decreases the interval size by 9%.
      - text: increases the interval size by 57%.
        correct: true
      - text: decreases the interval size by 57%.
    explanation: |
      A confidence interval for a proportion is $\hat{p} \pm z^\star \times SE$, so with the same
      data its width is proportional to $z^\star$, and a higher confidence level needs a wider
      interval [^1]. The critical values are $z^\star = 1.645$ for 90% and $2.576$ for 99% [^2],
      and $2.576/1.645 \approx 1.57$, so the interval becomes about 57% wider. Going to 99% can
      never shrink the interval, and the change has nothing to do with the 9-point gap between
      90 and 99.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 (table of critical values of the normal distribution)
    source:
      id: mmlu-redux
      ref: high_school_statistics/66
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=66
    status: draft
  - id: statistics-048
    type: single
    difficulty: easy
    question: A study looked at medical records of about 23,000 patients, mostly in Asia. They found that patients who drank at least three cups of green tea per day had a much lower incidence of depression. In an American newspaper article about this study, which of the following statements should not be made?
    options:
      - text: It is possible that people who drink green tea also tend to have healthier lifestyles than those who don't.
      - text: It is possible that people who drink green tea also tend to have a more positive outlook on life than those who don't.
      - text: Because this is observational data, the association between drinking green tea and a lower incidence of depression is not an indication of a causal relationship.
      - text: People who want to avoid depression should consider drinking green tea on a daily basis.
        correct: true
    explanation: |
      The data are observational: patients chose how much green tea they drank, so the
      association with less depression cannot show that tea causes it [^1]. Confounders such as
      a healthier lifestyle or a more positive outlook could explain the link, so the statements
      raising those possibilities, and the one calling the data merely associational, are all
      appropriate [^1][^2]. Advising readers to drink green tea to avoid depression makes a causal
      claim the study cannot support, so that is the statement that should not appear.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-observational-studies
        locator: Sec. 2.3 Observational studies
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#confounding-variables
        locator: Lesson 1, Sec. 1.4.1 Confounding Variables
    source:
      id: mmlu-redux
      ref: high_school_statistics/70
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=70
    status: draft
  - id: statistics-049
    type: single
    difficulty: medium
    question: Which of the following is NOT true of the χ2 probability distribution function?
    options:
      - text: The area under the χ2 curve is 1.
      - text: χ2 is defined only for nonnegative values of the variable.
      - text: For small degrees of freedom, the curve displays strong right-skewness.
      - text: For the same α, as the number of degrees of freedom increases, the critical value for the rejection region decreases.
        correct: true
    explanation: |
      For a fixed $\alpha$, the upper-tail critical value of $\chi^2$ grows with the degrees of
      freedom: at $\alpha = 0.05$ it is 3.841 for 1 df, 11.070 for 5 df and 18.307 for 10 df [^1].
      So the statement that it decreases is the one that is not true. The others hold: $\chi^2$
      is a sum of squared standard normals, defined only on $0$ to $\infty$, and as a probability
      density its total area is 1 [^2]. Its skewness, $2^{1.5}/\sqrt{\nu}$, is large for small df
      and shrinks as df grows [^2], while larger df stretch the right tail farther out [^3].
    references:
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3674.htm
        locator: Sec. 1.3.6.7.4 Critical values of the chi-square distribution (upper-tail table, 0.95 column)
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3666.htm
        locator: Sec. 1.3.6.6.6 Chi-square distribution (pdf, range, skewness)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-tables.html#the-chi-squared-test-of-independence
        locator: Sec. 18.2.1 The chi-squared test of independence (Figure 18.2)
    source:
      id: mmlu-redux
      ref: high_school_statistics/72
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=72
    status: draft
  - id: statistics-050
    type: single
    difficulty: easy
    question: Mr. Bee's statistics class had a standard deviation of 11.2 on a standardized test, while Mr. Em's class had a standard deviation of 5.6 on the same test. Which of the following is the most reasonable conclusion concerning the two classes' performance on the test?
    options:
      - text: Mr. Bee's class is less heterogeneous than Mr. Em's.
      - text: Mr. Em's class is more homogeneous than Mr. Bee's.
        correct: true
      - text: Mr. Bee's class performed twice as well as Mr. Em's.
      - text: Mr. Em's class did not do as well as Mr. Bee's.
    explanation: |
      The standard deviation roughly measures how far a typical observation lies from the mean
      [^1], and more variable data have a larger standard deviation [^2]. Mr. Em's smaller SD
      (5.6 versus 11.2) therefore means his students' scores are more tightly clustered: his
      class is more homogeneous, and Mr. Bee's is more heterogeneous. Standard deviation says
      nothing about which class scored higher, so the options about performing better, worse or
      "twice as well" do not follow.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-variance-sd
        locator: Sec. 5.4 Variance and standard deviation
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
    source:
      id: mmlu-redux
      ref: high_school_statistics/73
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=73
    status: draft
  - id: statistics-051
    type: single
    difficulty: medium
    question: A filling machine puts an average of four ounces of coffee in jars, with a standard deviation of 0.25 ounces. Forty jars filled by this machine are selected at random. What is the probability that the mean amount per jar filled in the sampled jars is less than 3.9 ounces?
    options:
      - text: '0.0057'
        correct: true
      - text: '0.0225'
      - text: '0.025'
      - text: '0.05'
    explanation: |
      By the Central Limit Theorem, the mean of 40 jars is approximately normal with mean 4 oz
      and standard error $\sigma/\sqrt{n} = 0.25/\sqrt{40} \approx 0.0395$ oz [^1]. Then
      $z = (3.9 - 4)/0.0395 \approx -2.53$, and the normal table gives
      $P(Z < -2.53) = 0.5 - 0.49430 \approx 0.0057$ [^2]. Using the individual-jar SD of 0.25
      instead of the standard error would give $z = -0.4$ and a far larger probability; 0.025 and
      0.05 are just familiar tail areas.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#mathematical-distribution-of-the-sample-mean
        locator: Sec. 19.2.1 Mathematical distribution of the sample mean
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 2.5)
    source:
      id: mmlu-redux
      ref: high_school_statistics/78
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=78
    status: draft
  - id: statistics-052
    type: single
    question: Which of the following is the primary difference between an experiment and an observational study?
    options:
      - text: Experiments are only conducted on human subjects; observational studies can be conducted on nonhuman subjects.
      - text: In an experiment, the researcher manipulates some variable to observe its effect on a response variable; in an observational study, he or she simply observes and records the observations.
        correct: true
      - text: Experiments must use randomized treatment and control groups; observational studies also use treatment and control groups, but they do not need to be randomized.
      - text: Experiments must be double-blind; observational studies do not need to be.
    explanation: In an experiment the researcher deliberately imposes a treatment (manipulates a variable) and observes the response; an observational study only records what happens. Experiments are not limited to human subjects. MMLU-Redux experts flagged the original key (A) as wrong [^1].
    references:
      - source: mmlu-redux
        locator: high_school_statistics row 81 — wrong_groundtruth
    source:
      id: mmlu-redux
      ref: high_school_statistics/81
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=81
    status: draft
  - id: statistics-053
    type: single
    difficulty: easy
    question: Which of these is the best description of a P-value?
    options:
      - text: The probability of making a Type I error.
      - text: The probability of making a Type II error.
      - text: The probability of rejecting the null hypothesis if it is, in fact, false.
      - text: The probability of getting a test statistic at least as extreme as the observed test statistic, if the null hypothesis is true.
        correct: true
    explanation: |
      The P-value is the probability, computed assuming $H_0$ is true, of getting data at least
      as favorable to the alternative as the observed data, usually summarized by a test
      statistic [^1]. The Type I error probability is $\alpha$, which is set in advance, and the
      Type II error probability is $\beta$ [^2]; the probability of rejecting a false $H_0$ is
      the power [^3]. None of these depends on the observed sample the way a P-value does.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/82
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=82
    status: draft
  - id: statistics-054
    type: single
    difficulty: easy
    question: Which of the following is the best description of the power of a significance test?
    options:
      - text: The probability that the null hypothesis is true.
      - text: The probability of getting a Type I error.
      - text: The probability of getting a Type II error.
      - text: The probability of rejecting the null hypothesis if it is, in fact, false.
        correct: true
    explanation: |
      Power is the probability of rejecting the null hypothesis when it is false, that is, of
      correctly detecting a real effect, and it equals $1 - \beta$ [^1][^2]. The Type I error
      probability is $\alpha$ and the Type II error probability is $\beta$ [^3], so power is the
      complement of the Type II error probability, not the same thing. A hypothesis test never
      gives the probability that $H_0$ is true.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-errors.html#sec-pow
        locator: Sec. 14.4 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/83
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=83
    status: draft
  - id: statistics-055
    type: single
    difficulty: medium
    shuffle: false
    question: Both over-the-counter niacin and the prescription drug Lipitor are known to lower blood cholesterol levels. In one double-blind study Lipitor outperformed niacin. The 95% confidence interval estimate of the difference in mean cholesterol level lowering was (18, 41). Which of the following is a reasonable conclusion?
    options:
      - text: Niacin lowers cholesterol an average of 18 points, while Lipitor lowers cholesterol an average of 41 points.
      - text: There is a 0.95 probability that Lipitor will outperform niacin in lowering the cholesterol level of any given individual.
      - text: There is a 0.95 probability that Lipitor will outperform niacin by at least 23 points in lowering the cholesterol level of any given individual.
      - text: None of the above.
        correct: true
    explanation: |
      The interval estimates the difference between the two population mean reductions: we are
      95% confident that, on average, Lipitor lowers cholesterol by 18 to 41 points more than
      niacin [^1]. It does not say niacin's mean is 18 and Lipitor's is 41; those are the
      endpoints for the difference. It also says nothing about any given individual, because a
      confidence interval only tries to capture a population parameter, not individual
      observations [^1][^2]. So none of the listed statements is a reasonable conclusion.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#one-sample-t-intervals
        locator: Sec. 19.2.4 One sample t-intervals (Guided Practice on croaker white fish, footnote 8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/84
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=84
    status: draft
  - id: statistics-056
    type: single
    difficulty: medium
    question: The Department of Health plans to test the lead level in a specific park. Because a high lead level is harmful to children, the park will be closed if the lead level exceeds the allowed limit. The department randomly selects several locations in the park, gets soil samples from those locations, and tests the samples for their lead levels. Which of the following decisions would result from the type I error?
    options:
      - text: Closing the park when the lead levels are within the allowed limit
        correct: true
      - text: Keeping the park open when the lead levels are in excess of the allowed limit
      - text: Closing the park when the lead levels are in excess of the allowed limit
      - text: Keeping the park open when the lead levels are within the allowed limit
    explanation: |
      The null hypothesis is the no-problem statement, that the lead level is within the allowed
      limit, and the park is closed only if the data reject it [^1]. A Type I error is rejecting
      $H_0$ when it is actually true [^2], so here it means closing the park even though the lead
      level is within the limit. Keeping the park open when lead is too high would be a Type II
      error, and the other two options are correct decisions [^2].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#writing-hypotheses
        locator: Lesson 5, Sec. 5.2 Writing Hypotheses (Definitions 5.2–5.3)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/85
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=85
    status: draft
  - id: statistics-057
    type: single
    difficulty: medium
    question: You need to construct a 94% confidence interval for a population proportion. What is the upper critical value of z to be used in constructing this interval?
    options:
      - text: '0.9699'
      - text: '1.96'
      - text: '1.555'
      - text: '1.88'
        correct: true
    explanation: |
      For confidence level $C$, choose $z^\star$ so that the area between $-z^\star$ and
      $z^\star$ under the standard normal equals $C$ [^1]. For 94%, the two tails hold 6% in
      total, 3% each, so $z^\star$ is the 97th percentile; the normal table shows an area of about
      0.47 between 0 and 1.88, so $z^\star \approx 1.88$ [^2]. 1.96 belongs to 95% confidence,
      0.9699 is a probability rather than a z-score, and 1.555 would put all 6% in one tail.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level (Figure 16.2)
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/89
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=89
    status: draft
  - id: statistics-058
    type: single
    difficulty: easy
    question: The observed times (in minutes) it takes a runner to complete a marathon are normally distributed. The z-score for his running time this week is –2. Which one of the following statements is a correct interpretation of his z-score?
    options:
      - text: This week his time was two minutes lower than his time last week.
      - text: This week his time was two minutes lower than his best time ever.
      - text: This week his time was two minutes lower than his average time.
      - text: This week his time was two standard deviations lower than his average time.
        correct: true
    explanation: |
      A z-score counts standard deviations from the mean, $z = (x - \mu)/\sigma$, and negative
      values lie below the mean [^1]. So $z = -2$ means his time this week was two standard
      deviations below his average time. A z-score is not in minutes, and it compares with the
      mean of his times, not with last week or his best time.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
    source:
      id: mmlu-redux
      ref: high_school_statistics/91
