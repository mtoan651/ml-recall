        url: https://online.stat.psu.edu/stat100/Lesson02#sec-randomSampEtc
        locator: Lesson 2, Sec. 2.4 Simple Random Sampling and Other Sampling Methods (cluster sampling)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#the-margin-of-error
        locator: Lesson 2, Sec. 2.2 The Beauty of Sampling (The margin of error)
