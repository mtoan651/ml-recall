    reviewed_by: claude
  - id: statistics-053
    type: single
    difficulty: easy
    question: Which of these is the best description of a P-value?
    options:
      - text: The probability of making a Type I error.
        why: That is $\alpha$, which is set before the data are seen [^2].
      - text: The probability of making a Type II error.
        why: That is $\beta$, the probability of failing to reject a false $H_0$ [^2].
      - text: The probability of rejecting the null hypothesis if it is, in fact, false.
        why: That is the power of the test [^3].
      - text: The probability of a test statistic at least as extreme as the one observed, if $H_0$ is true.
        correct: true
    explanation: |
      The P-value is the probability, computed assuming $H_0$ is true, of getting data at least
      as favorable to the alternative as the observed data, usually summarized by a test
      statistic [^1]. The Type I error probability is $\alpha$, which is set in advance, and the
      Type II error probability is $\beta$ [^2]; the probability of rejecting a false $H_0$ is
      the power [^3]. None of these depends on the observed sample the way a P-value does.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/82
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=82
    status: reviewed
    reviewed_by: claude
  - id: statistics-054
    type: single
    difficulty: easy
    question: Which of the following is the best description of the power of a significance test?
    options:
      - text: The probability that the null hypothesis is true, given the observed data.
        why: A significance test assumes $H_0$; it never gives the probability that $H_0$ is true given the data.
      - text: The probability of getting a Type I error.
        why: That is $\alpha$, the significance level [^3].
      - text: The probability of getting a Type II error.
        why: That is $\beta$; the power is its complement, $1 - \beta$ [^1].
      - text: The probability of rejecting the null hypothesis if it is, in fact, false.
        correct: true
    explanation: |
      Power is the probability of rejecting the null hypothesis when it is false, that is, of
      correctly detecting a real effect, and it equals $1 - \beta$ [^1][^2]. The Type I error
      probability is $\alpha$ and the Type II error probability is $\beta$ [^3], so power is the
      complement of the Type II error probability, not the same thing. A hypothesis test never
      gives the probability that $H_0$ is true.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-errors.html#sec-pow
        locator: Sec. 14.4 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
