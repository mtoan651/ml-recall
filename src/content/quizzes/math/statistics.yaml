  - id: statistics-065
    type: single
    difficulty: easy
    question: Which chart is the usual choice to compare a quantity across categories, such as the number of birds in each category?
    options:
      - text: line chart
        why: A line chart implies a trend along an ordered axis such as time; categories have no such order [^1].
      - text: bar chart
        correct: true
      - text: histogram
        why: A histogram bins one numeric variable to show its distribution; it does not compare named categories [^2].
    explanation: |
      The lesson's chart guide lists bar (and column) charts for comparing values, and the lesson
      compares bird counts per category with a horizontal bar chart [^1]. A line chart is meant for
      trends along an ordered axis such as time; joining unordered categories with a line suggests a
      trend that does not exist [^1]. A histogram groups the values of one numeric variable into bins
      to show their distribution, so it does not compare named categories [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#explore-bar-charts
