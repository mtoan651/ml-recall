    status: reviewed
    reviewed_by: claude
  - id: statistics-085
    type: single
    difficulty: easy
    question: |
      Two possible wordings for a questionnaire on a proposed school budget increase are:

      - **Wording I:** "This school district has one of the highest per-student expenditure rates in the state. This has resulted in low failure rates, high standardized test scores, and most students going on to good colleges and universities. Do you support the proposed school budget increase?"
      - **Wording II:** "This school district has one of the highest per-student expenditure rates in the state. This has resulted in high property taxes, with many people on fixed incomes having to give up their homes because they cannot pay the school tax. Do you support the proposed school budget increase?"

      One wording found that 58% of respondents support the increase; the other found only 13%. Which result most likely came from which wording, and why?
    options:
      - text: Wording I showed 58% and wording II 13%, because of the lack of randomization as evidenced by the wording of the questions.
        why: The direction is right, but randomization is not the issue; the one-sided wording biases the answers [^1][^2].
      - text: Wording I showed 13% and wording II 58%, because of a placebo effect due to the wording of the questions.
        why: Wrong direction, since the positive framing wins more support, and placebos belong to experiments, not surveys [^1].
      - text: Wording I showed 58% and wording II 13%, because of the lack of a control group.
        why: Control groups belong to experiments; the gap comes from the wording [^2].
      - text: Wording I showed 58% and wording II 13%, because of response bias due to the wording of the questions.
        correct: true
    explanation: 'The two versions ask the same thing but lead the respondent: wording I mentions only benefits of the high spending and wording II only its costs, and respondents tend to go along with one-sided statements [^1]. So the positive framing produces the high support (58%) and the negative framing the low support (13%). This is response bias, a systematic distortion in the answers caused here by the wording [^1][^2]. Randomization, placebos and control groups belong to experiments and do not explain a difference created by how a survey question is phrased.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson01#its-all-in-the-wording
        locator: Lesson 1, Sec. 1.2 It's All in the Wording (Example 1.4 one-sided statements)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#other-sources-of-bias
        locator: Lesson 1, Sec. 1.3 Other Sources of Bias (Definition 1.19 Response Bias)
    source:
      id: mmlu-redux
      ref: high_school_statistics/29
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=29
    status: reviewed
    reviewed_by: claude
  - id: statistics-086
    type: single
    difficulty: medium
    question: A reading specialist in a large public school system believes that the more time students spend reading, the better they will do in school. She plans a middle school experiment in which an SRS of 30 eighth graders will be assigned four extra hours of reading per week, an SRS of 30 seventh graders will be assigned two extra hours of reading per week, and an SRS of 30 sixth graders with no extra assigned reading will be a control group. After one school year, the mean GPAs from each group will be compared. Is this a good experimental design?
    options:
      - text: Yes.
        why: Grade level changes together with the amount of reading, so the effect of reading cannot be separated from grade [^1].
      - text: No, because while this design may point out an association between reading and GPA, it cannot establish a cause-and-effect relationship.
        why: A well-designed experiment can establish cause and effect; the flaw here is the confounding with grade [^2].
      - text: No, because without blinding, there is a strong chance of a placebo effect.
        why: Blinding is not the main problem; grade level is confounded with the treatment [^1].
      - text: No, because grade level is a lurking variable which may well be confounded with the variables under consideration.
        correct: true
    explanation: 'Each amount of extra reading goes to a different grade (eighth graders four hours, seventh graders two, sixth graders none), so grade level moves together with the treatment. Grade also affects GPA on its own, which makes it a confounding (lurking) variable: any difference in GPA could come from grade rather than from reading [^1][^2]. Randomly assigning the reading levels to students within the same grade would break that link; the flaw is not that experiments cannot show cause and effect, and blinding is not the main problem here.'
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#confounding-variables
        locator: Lesson 1, Sec. 1.4.1 Confounding Variables
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (randomization, confounding variable)
    source:
      id: mmlu-redux
      ref: high_school_statistics/30
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=30
    status: reviewed
    reviewed_by: claude
  - id: statistics-087
    type: single
    difficulty: medium
    question: In a clinic, 50 patients with sleep disorders are randomly assigned to one of two different groups. Patients in one group are given medication before bedtime. Patients in the other group are given blindfolds and played soft music at bedtime. Each patient is attached to a machine that records breathing patterns. From the patterns, it is possible to determine if the patient is awake or asleep. The data will be used to decide which method is more effective in helping patients with sleep disorders. Here a study is called single-blind when only one party (the subjects, or the people who evaluate them) does not know which treatment each subject received, and double-blind when neither party knows. Which of the following statements is correct in the context of this experiment?
    options:
      - text: It is not possible for this experiment to be single-blind or double-blind, because human subjects are involved.
        why: Blinding is routine in experiments with human subjects [^1].
      - text: This is only a single-blind experiment because the experimenters did not include a control group that received neither medication nor a blindfold and soft music.
        why: A missing no-treatment group has nothing to do with who is blinded [^1].
      - text: This is only a single-blind experiment because patients will know which treatment they are receiving, although the examining doctor might not.
        correct: true
      - text: This is a double-blind experiment because the experimenters could prevent both groups of patients from knowing what sort of treatment the other group is receiving.
        why: Blinding means not knowing one's own treatment, and these patients know which treatment they get [^1].
    explanation: 'Blinding keeps the subjects and/or the people who interact with or evaluate them from knowing who receives which treatment [^1]. The patients here cannot be blinded: anyone given a blindfold and music, or a pill, knows which treatment they are getting, and no placebo can disguise that difference [^2]. The doctor who reads the breathing records can still be kept unaware of the groups, so at most one party is blind and the study can only be single-blind. Human subjects do not rule out blinding, a missing no-treatment group is a different issue, and hiding what the other group receives is not blinding.'
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#blinding
        locator: Lesson 1, Sec. 1.4.5 Blinding
