  - id: statistics-012
    type: single
    difficulty: easy
    question: In one study on the effect that eating meat products has on weight level, an SRS of 500 subjects who admitted to eating meat at least once a day had their weights compared with those of an independent SRS of 500 people who claimed to be vegetarians. In a second study, an SRS of 500 subjects were served at least one meat meal per day for 6 months, while an independent SRS of 500 others were chosen to receive a strictly vegetarian diet for 6 months, with weights compared after 6 months. How should the two studies be classified?
    options:
      - text: The first study is a controlled experiment, while the second is an observational study.
      - text: The first study is an observational study, while the second is a controlled experiment.
        correct: true
      - text: Both studies are controlled experiments.
      - text: Both studies are observational studies.
    explanation: |
      In the first study the researchers only recorded people's existing diets and compared
      weights; nobody was assigned a treatment, so it is an observational study [^1][^2]. In the
      second, the researchers decided who ate meat meals and who ate a vegetarian diet for six
      months, so they imposed the treatments: that is an experiment [^1][^2]. Only the second
      design can support a cause-and-effect conclusion, because self-selected meat eaters and
      vegetarians may differ in other ways (confounding variables) [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#experimental-and-observational-designs
        locator: Lesson 1, Sec. 1.4 Research Study Design (Definitions 1.20–1.21)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#observational-studies-and-experiments
        locator: Sec. 1.2.5 Observational studies and experiments
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-observational-studies
        locator: Sec. 2.3 Observational studies
    source:
      id: mmlu-redux
      ref: high_school_statistics/8
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=8
    status: draft
  - id: statistics-013
    type: single
    difficulty: medium
    question: The distribution of salaries of a county school system with 4,752 employees is known to be right skewed, with the superintendent’s salary an outlier on the higher side. A random sample of 20 employees was taken and their salaries recorded. A 95 percent t-confidence interval for the mean salary of the county school system employees is (\$15,360, \$32,470). The t-confidence interval is not appropriate in this situation because
    options:
      - text: the sample size is too small compared to the number of employees in the system to give a fair representation
      - text: the skewed salary distribution tells us that assumption of normality of the sampled population will not be satisfied
        correct: true
      - text: the population standard deviation of the salaries of employees of this county school system is not known
      - text: the teacher salaries are not negotiable, but the superintendent’s salary is negotiable, so the superintendent’s salary should be excluded from the population sampled
    explanation: |
      A t-interval models $\bar{x}$ as nearly normal. With a small sample that requires the
      observations to come from a nearly normal population; as a rule of thumb, strong skew needs
      a sample of about 60 before the sampling distribution of $\bar{x}$ is close enough to
      normal [^1]. Here $n = 20$ and the salaries are strongly right-skewed with a high outlier,
      so the condition fails and the interval cannot be trusted. Not knowing the population
      standard deviation is no objection: estimating $\sigma$ with $s$ is exactly the situation
      the t-distribution is built for [^2]. Nor is 20 out of 4,752 too small a share of the
      population; what the method needs is a random sample of independent observations [^1].
      Whether a salary is negotiable has nothing to do with the conditions for the interval.
      MMLU-Redux experts flagged the original MMLU answer key for this item as wrong [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
        locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄ (independence; normality, skew vs. sample size)
        quote: slight skew is okay for sample sizes of 15, moderate skew for sample sizes of 30, and strong skew for sample sizes of 60.
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
        locator: Sec. 19.2.3 Introducing the t-distribution
      - source: mmlu-redux
        locator: high_school_statistics row 10 — wrong_groundtruth
    source:
      id: mmlu-redux
