  - id: statistics-050
    type: single
    difficulty: easy
    question: Mr. Bee's statistics class had a standard deviation of 11.2 on a standardized test, while Mr. Em's class had a standard deviation of 5.6 on the same test. Which of the following is the most reasonable conclusion concerning the two classes' performance on the test?
    options:
      - text: Mr. Bee's class is less heterogeneous than Mr. Em's.
        why: Mr. Bee's SD is the larger one, so his class is *more* heterogeneous [^2].
      - text: Mr. Em's class is more homogeneous than Mr. Bee's.
        correct: true
      - text: Mr. Bee's class performed twice as well as Mr. Em's.
        why: Standard deviation measures spread, not the level of the scores [^1].
      - text: Mr. Em's class did not do as well as Mr. Bee's.
        why: The standard deviations say nothing about which class scored higher [^1].
    explanation: |
      The standard deviation roughly measures how far a typical observation lies from the mean
      [^1], and more variable data have a larger standard deviation [^2]. Mr. Em's smaller SD
      (5.6 versus 11.2) therefore means his students' scores are more tightly clustered: his
      class is more homogeneous, and Mr. Bee's is more heterogeneous. Standard deviation says
      nothing about which class scored higher, so the options about performing better, worse or
      "twice as well" do not follow.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-variance-sd
        locator: Sec. 5.4 Variance and standard deviation
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
    source:
      id: mmlu-redux
      ref: high_school_statistics/73
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=73
    status: reviewed
    reviewed_by: claude
  - id: statistics-051
    type: single
    difficulty: medium
    question: A filling machine puts an average of four ounces of coffee in jars, with a standard deviation of 0.25 ounces. Forty jars filled by this machine are selected at random. What is the probability that the mean amount per jar filled in the sampled jars is less than 3.9 ounces?
    options:
      - text: '0.0057'
        correct: true
      - text: '0.0225'
        why: This is about $P(Z < -2)$, not the area below $z = -0.1/0.0395 \approx -2.53$ [^2].
      - text: '0.025'
        why: 0.025 is a familiar tail area (beyond $z = -1.96$), not the area below $z \approx -2.53$ [^2].
      - text: '0.05'
        why: 0.05 is a familiar significance level, not the area below $z \approx -2.53$ [^2].
    explanation: |
      By the Central Limit Theorem, the mean of 40 jars is approximately normal with mean 4 oz
      and standard error $\sigma/\sqrt{n} = 0.25/\sqrt{40} \approx 0.0395$ oz [^1]. Then
      $z = (3.9 - 4)/0.0395 \approx -2.53$, and the normal table gives
      $P(Z < -2.53) = 0.5 - 0.49430 \approx 0.0057$ [^2]. Using the individual-jar SD of 0.25
      instead of the standard error would give $z = -0.4$ and a far larger probability; 0.025 and
      0.05 are just familiar tail areas.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#mathematical-distribution-of-the-sample-mean
        locator: Sec. 19.2.1 Mathematical distribution of the sample mean
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 2.5)
    source:
      id: mmlu-redux
      ref: high_school_statistics/78
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=78
    status: reviewed
    reviewed_by: claude
  - id: statistics-052
    type: single
    difficulty: easy
    question: Which of the following is the primary difference between an experiment and an observational study?
    options:
      - text: Experiments are only conducted on human subjects; observational studies can be conducted on nonhuman subjects.
        why: Experimental units can be animals, plants or objects as well as people [^1].
      - text: In an experiment, the researcher manipulates some variable to observe its effect on a response variable; in an observational study, he or she simply observes and records the observations.
        correct: true
      - text: Experiments must use randomized treatment and control groups; observational studies also use treatment and control groups, but they do not need to be randomized.
        why: Randomization strengthens an experiment but does not define one, and observational studies assign no treatments at all [^1][^2].
      - text: Experiments must be double-blind; observational studies do not need to be.
        why: Blinding is a tool that can be built into an experiment; it is not always needed [^1].
    explanation: |
      What makes a study an experiment is that the researcher manipulates the treatments, that
      is, decides which level of the explanatory variable each case receives, and then collects
      the data; in an observational study the researcher collects data without manipulating
      anything and merely observes what arises [^1][^2]. Random assignment, placebos and blinding
      are tools that can be built into an experiment to strengthen its conclusions [^1], not the
      defining difference: an experiment is called a randomized experiment only when it assigns
      groups at random [^2], and a double-blind design is not always necessary [^1]. Observational
      studies do not assign anyone to treatment or control groups at all. Experiments are not
      limited to people either: cases can be animals or other experimental units [^1]. MMLU-Redux
      experts flagged the original MMLU answer key for this item as wrong [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#experimental-and-observational-designs
        locator: Lesson 1, Sec. 1.1 Cases & Variables, Sec. 1.4 Research Study Design (Definitions 1.20–1.21) and Sec. 1.4.5 Blinding
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#observational-studies-and-experiments
        locator: Sec. 1.2.5 Observational studies and experiments
      - source: mmlu-redux
        locator: high_school_statistics row 81 — wrong_groundtruth
    source:
      id: mmlu-redux
      ref: high_school_statistics/81
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=81
