  - id: statistics-149
    type: multiple
    difficulty: medium
    tags:
      - anova
      - conditions
      - bonferroni
    question: |
      Which statements about one-way ANOVA and its follow-up pairwise tests are true? Select all
      that apply.
    options:
      - text: As the total sample size grows, the residual degrees of freedom grow too.
        correct: true
      - text: The constant-variance condition can be relaxed somewhat when the group sizes are similar.
        correct: true
      - text: As the number of groups grows, the Bonferroni-corrected level for each pairwise test grows too.
        why: More groups mean more pairwise comparisons $K$, so the corrected level $\alpha/K$ gets smaller.
      - text: The independence condition can be relaxed when the total sample size is large.
        why: A large sample helps with skewed data, not with dependent observations; independence is always required.
    explanation: |
      The residuals have $n - k$ degrees of freedom, which grow with the total sample size $n$
      [^1]. The constant-variance condition matters most when the group sizes differ, so it can be
      relaxed somewhat when they are similar, whereas independence is always important [^1]. The
      Bonferroni correction tests each of the $K = k(k-1)/2$ pairs at $\alpha^\star = \alpha/K$,
      which shrinks as the number of groups $k$ grows [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.5.3 Analysis of variance (ANOVA) and the F-test; Sec. 7.5.5 Graphical diagnostics for an ANOVA analysis; Sec. 7.5.6 Multiple comparisons and controlling Type 1 Error rate
      - title: 'Wikipedia: Bonferroni correction'
        url: https://en.wikipedia.org/wiki/Bonferroni_correction#Definition
        locator: Definition
    source:
      id: openintro-stats
      ref: ch7/7.43-tf_anova_1
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/comparing_many_means_with_anova.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-150
    type: single
    difficulty: medium
    tags:
      - multiple-comparisons
      - bonferroni
      - anova
    question: |
      An experiment with three treatment groups (14 subjects each) gives a significant one-way
      ANOVA ($p = 0.046$). Pairwise $t$-tests with the Bonferroni correction follow, at an overall
      $\alpha = 0.05$. The comparison of treatments 1 and 3 gives $p \approx 0.015$. What is the
      correct conclusion for this pair?
    options:
      - text: Significant, because 0.015 is below $0.05/3 \approx 0.0167$
        correct: true
      - text: Not significant, because 0.015 is above $0.05/6 \approx 0.0083$
        why: With 3 groups there are $3 \times 2/2 = 3$ distinct pairs, not 6; the order within a pair does not matter.
      - text: Not significant, because 0.015 is above $0.05/14 \approx 0.0036$
        why: The correction divides by the number of comparisons, not by the group size.
      - text: Significant, because 0.015 is below 0.05 and no correction is needed after a significant ANOVA
        why: A significant ANOVA does not remove the multiple-comparisons problem; each pairwise test still uses the corrected level.
    explanation: |
      Running several pairwise tests inflates the chance of at least one Type 1 error, so the
      Bonferroni correction tests each pair at $\alpha^\star = \alpha/K$, where
      $K = k(k-1)/2$ is the number of pairs [^1][^2]. With $k = 3$ groups, $K = 3$ and
      $\alpha^\star = 0.05/3 \approx 0.0167$. Since $0.015 < 0.0167$, treatments 1 and 3 differ
      significantly (the other two pairs do not).
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.5.6 Multiple comparisons and controlling Type 1 Error rate
      - title: 'Wikipedia: Bonferroni correction'
        url: https://en.wikipedia.org/wiki/Bonferroni_correction#Definition
        locator: Definition
    source:
      id: openintro-stats
      ref: ch7/7.45-prison_isolation_anova
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/comparing_many_means_with_anova.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-151
    type: short_answer
    difficulty: hard
    tags:
      - power
      - sample-size
      - ab-testing
    question: |
      An A/B test of an app (1% of users in each arm) estimated the change in daily visitors as
      +1.2%, with 95% confidence interval (−0.2%, +2.6%). The team wants a new experiment that
      detects a change of 1.0% with 80% power, using a two-sided test at $\alpha = 0.05$. The
      standard error shrinks like $1/\sqrt{n}$. By what factor must the size of each arm grow?
    answer:
      numeric: 4.0
      tolerance: 0.15
      hint: a factor, 1 or 2 decimals
      model: $SE_{old} = 1.4/1.96 \approx 0.714$; required $SE = 1.0/(1.96 + 0.84) \approx 0.357$; factor $= (0.714/0.357)^2 \approx 4.0$
    explanation: |
      For 80% power at $\alpha = 0.05$ (two-sided), the effect to detect must equal
      $(1.96 + 0.84) \times SE = 2.8\,SE$, so the new standard error must be
      $1.0/2.8 \approx 0.357$ [^1]. The old interval has margin of error
      $(2.6 - (-0.2))/2 = 1.4$, so its standard error was $1.4/1.96 \approx 0.714$. The SE must
      shrink by a factor of about 2.0, and since SE scales like $1/\sqrt{n}$, each arm needs about
      $2.0^2 = 4.0$ times as many users, about 4% of users per arm [^1]. (Rounding the two
      standard errors to 0.36 and 0.71 first gives about 3.9.) Lehr's rule of thumb for 80% power,
      $n \approx 16\,s^2/d^2$ per group, encodes the same factor: $2 \times 2.8^2 \approx 16$ [^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.4.3 Determining a proper sample size
      - title: 'Wikipedia: Power (statistics)'
        url: https://en.wikipedia.org/wiki/Power_(statistics)#Rule_of_thumb_for_t-test
        locator: Rule of thumb for t-test
    source:
      id: openintro-stats
      ref: ch7/7.53-tech_exp_resizing
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-152
    type: true_false
    difficulty: easy
    tags:
      - paired-data
      - two-sample-test
    question: |
      True or false: when two groups have the same sample size, their means should be compared
      with a paired test.
    options:
      - text: 'True'
        why: Equal sample sizes are necessary for pairing but not sufficient; pairing needs a special correspondence between the observations.
      - text: 'False'
        correct: true
    explanation: |
      Data are paired when each observation in one group has a special correspondence with exactly
      one observation in the other, such as the same subject measured twice or matched cases [^1].
      Paired data necessarily have equal group sizes, but two independent random samples that
      happen to be the same size are not paired and are compared with a two-sample test [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.2.1 Paired observations
      - title: 'Wikipedia: Paired difference test'
        url: https://en.wikipedia.org/wiki/Paired_difference_test
        locator: Introduction
    source:
