        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/13-meaningful-visualizations/README.md#avoid-deception
        locator: 'Lesson 13: Making Meaningful Visualizations, sec. Avoid deception and Styling your charts for readability'
