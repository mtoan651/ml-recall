  - id: statistics-039
    type: single
    difficulty: medium
    question: The director of a local food bank asks for data on all donations given during the month of November. Of the 100 checks received, the average donation is \$155 with a standard deviation of \$32. Which of the following is the most appropriate statement?
    options:
      - text: This November, the average donation is \$155.
        correct: true
      - text: 50% of all donations this November are more than \$155.
        why: That describes the median, the value that splits the data in half, not the mean [^4].
      - text: We are 95% confident that the average donation in November is between about \$91 and \$219.
        why: This is the mean ± 2 SD, a range for individual checks; and with all donations known, no interval is needed [^1][^3].
      - text: We are 95% confident that the average donation in November is between about \$149 and \$161.
        why: A confidence interval estimates an unknown parameter from a sample; here the 100 checks are the whole population [^1][^3].
    explanation: |
      The 100 checks are all of November's donations, so the data are a census of the
      population [^1] and \$155 is a population parameter, not a sample statistic [^2]. A
      confidence interval estimates an unknown parameter from a sample [^3], so none is needed
      when the parameter has been computed directly. (\$91 to \$219 is the mean ± 2 SD, a spread
      of individual checks, and \$149 to \$161 is the mean ± 2 SE.) "50% of donations are more
      than \$155" describes the median, the value that splits the data in half, not the mean [^4].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
        locator: Sec. 2.1.1 Populations and samples
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#parameters-and-statistics
        locator: Sec. 2.1.2 Parameters and statistics
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#introduction-to-confidence-intervals
        locator: Lesson 4, Sec. 4.2 Introduction to Confidence Intervals (Definition 4.4)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
    source:
