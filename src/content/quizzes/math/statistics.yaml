  - id: statistics-037
    type: single
    difficulty: medium
    question: Which of the following statements is false?
    options:
      - text: Like the normal distribution, the t-distributions are symmetric.
        why: 'This statement is true: t-distributions are symmetric about 0, like the normal [^2].'
      - text: The t-distributions are lower at the mean and higher at the tails, and so are more spread out than the normal distribution.
        why: 'This statement is true: t-distributions have thicker tails than the normal [^1][^2].'
      - text: The greater the df, the closer the t-distributions are to the normal distribution.
        why: 'This statement is true: as df grows, the t-distribution approaches the normal [^1].'
      - text: The smaller the df, the better the 68-95-99.7 Rule works for t-models.
        correct: true
    explanation: |
      The claim about small df is the false one: with few degrees of freedom the t-distribution
      has much thicker tails, so the 68-95-99.7 Rule fits worse, not better. For example, with
      $df = 2$ about 9.5% of the area lies more than 3 units from the center, versus roughly 0.3%
      for the normal [^1]. The other statements are true: t-distributions are symmetric like the
      normal [^2], their tails are higher than the normal's [^1][^2], and they get closer to the
      normal as df grows [^1].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
        locator: Sec. 19.2.3 Introducing the t-distribution
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#t-distribution
        locator: Lesson 8, Sec. 8.2 One Sample Mean and Sec. 8.2.1 t-Distribution
    source:
      id: mmlu-redux
      ref: high_school_statistics/46
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=46
