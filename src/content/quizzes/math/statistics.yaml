  - id: statistics-142
    type: short_answer
    difficulty: easy
    tags:
      - t-distribution
      - critical-value
      - confidence-interval
    question: |
      A random sample of $n = 21$ comes from a nearly normal population with unknown standard
      deviation. What critical value $t^\star$ should you use for a 98% confidence interval for the
      mean?
    answer:
      numeric: 2.53
      tolerance: 0.005
      hint: 2 or 3 decimals
      model: $df = 20$; $t^\star_{20} \approx 2.528$ (1% in each tail)
    explanation: |
      With the standard deviation estimated from the data, the interval uses the $t$-distribution
      with $df = n - 1 = 20$ [^1][^2]. A 98% interval leaves 1% in each tail, so $t^\star$ is the
      99th percentile of $t_{20}$, about 2.53. The normal value $z^\star = 2.33$ would be too small
      for a sample of this size.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.1.3 Introducing the t-distribution; Sec. 7.1.4 One sample t-confidence intervals
      - title: "Wikipedia: Student's t-distribution"
        url: https://en.wikipedia.org/wiki/Student%27s_t-distribution#Confidence_intervals
        locator: Confidence intervals
    source:
      id: openintro-stats
      ref: ch7/7.1-identify_critical_t
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/one-sample_means_with_the_t-distribution.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-143
    type: short_answer
    difficulty: medium
    tags:
      - t-interval
      - margin-of-error
      - standard-deviation
    question: |
      A 95% confidence interval for a population mean, based on a simple random sample of 36
      observations and the $t$-distribution, is (18.985, 21.015). What is the sample standard
      deviation?
    answer:
      numeric: 3.00
      tolerance: 0.02
      hint: 2 decimals
      model: $\bar x = 20$, $ME = 1.015 = t^\star_{35} \times s/\sqrt{36}$ with $t^\star_{35} \approx 2.03$, so $s = 1.015 \times 6 / 2.03 \approx 3.00$
    explanation: |
      A $t$-interval is $\bar x \pm t^\star_{df}\, s/\sqrt{n}$ [^1][^2]. Its midpoint is the sample
      mean, $\bar x = 20$, and half its width is the margin of error, 1.015. With $df = 35$,
      $t^\star \approx 2.03$, so $s/\sqrt{36} = 1.015/2.03 = 0.5$ and $s = 3.00$. Using
      $z^\star = 1.96$ instead would give about 3.11.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.1.4 One sample t-confidence intervals
      - title: "Wikipedia: Student's t-distribution"
        url: https://en.wikipedia.org/wiki/Student%27s_t-distribution#Confidence_intervals
        locator: Confidence intervals
