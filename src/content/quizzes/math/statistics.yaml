  - id: statistics-088
    type: single
    difficulty: medium
    question: Which of the following is least likely to reduce bias in a sample survey?
    options:
      - text: Following up with those who did not respond to the survey the first time
        why: Following up nonrespondents reduces nonresponse bias [^1].
      - text: Asking questions in a neutral manner to avoid influencing the responses
        why: Neutral wording reduces the bias created by leading questions [^2].
      - text: Using stratified random sampling rather than simple random sampling
        correct: true
      - text: Selecting samples randomly
        why: Random selection avoids the bias of convenience or hand-picked samples [^1].
    explanation: Following up nonrespondents attacks nonresponse bias, and random selection avoids the bias of hand-picked or convenience samples [^1]. Neutral wording attacks the bias created by leading, one-sided questions [^2]. Stratified random sampling is still random, so it is no less biased than a simple random sample; what stratifying buys is more precise (less variable) estimates when the strata are internally similar [^3]. It is therefore the step least likely to reduce bias.
    references:
