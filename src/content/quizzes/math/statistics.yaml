      ref: ch7/7.49-sample_size_pairing
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/review_exercises.tex
