  - id: statistics-073
    type: multiple
    difficulty: easy
    question: |
      Besides color, which encodings can show a third variable in a scatterplot so that
      color-blind readers can still read it? Select all that apply.
    options:
      - text: Point size
        correct: true
      - text: Point shape (marker style)
        correct: true
      - text: A red-green color scale
        why: This is still a color encoding, and red and green are hard to tell apart for many readers with a color-vision deficiency [^3].
    explanation: |
      For color-blind readers, the honey lesson shows the year with growing dot size instead of
      color [^1]. Seaborn's guide adds marker style, a different shape for each class, to improve
      accessibility, and lists size as another way to encode a third variable [^2]. A red-green
      scale is still a color encoding, which readers with a color-vision deficiency may not be able
      to tell apart [^3].
