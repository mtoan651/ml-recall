  - id: statistics-007
    type: single
    difficulty: medium
    question: In one metropolitan region, technical writers have an annual salary that is approximately normally distributed with a mean of \$55,800. The first quartile of salaries is \$48,815. What is the standard deviation?
    options:
      - text: \$6,984
      - text: \$10,356
        correct: true
      - text: \$10,476
      - text: \$13,968
    explanation: |
      The first quartile is the 25th percentile [^1]. In a normal table the area between 0 and
      $z$ reaches 0.25 at about $z = 0.6745$, so the 25th percentile lies $0.6745\sigma$ below
      the mean [^2]. Solving the z-score equation for the unknown, as in any percentile problem
      [^3], $\frac{48{,}815 - 55{,}800}{\sigma} = -0.6745$ gives $\sigma = 6{,}985/0.6745 \approx 10{,}356$,
      i.e. \$10,356. The option \$6,984 is essentially the gap between the mean and $Q_1$
      (\$6,985), which would wrongly put $Q_1$ one standard deviation below the mean; \$13,968 is
      about twice that gap.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, rows 0.6–0.7)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (finding the value at a percentile)
    source:
      id: mmlu-redux
      ref: high_school_statistics/2
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=2
    status: draft
  - id: statistics-008
    type: single
    difficulty: medium
    question: |
      Which of the following statements is (are) true?

      I. In order to use a $\chi^2$ procedure, the expected value for each cell of a one- or two-way table must be at least 5.

      II. In order to use $\chi^2$ procedures, you must have at least 2 degrees of freedom.

      III. In a 4 × 2 two-way table, the number of degrees of freedom is 3.
    options:
      - text: I only
      - text: I and III only
        correct: true
      - text: I and II only
      - text: III only
    explanation: |
      Statement I is the usual large-sample condition: the chi-squared approximation needs an
      expected count of at least 5 in every cell [^1][^2]. Statement III is also true, because a
      table with $R$ rows and $C$ columns has $df = (R-1)(C-1)$, so a $4 \times 2$ table has
      $3 \times 1 = 3$ degrees of freedom [^1]. Statement II is false: a $2 \times 2$ table gives
      $df = 1$, and chi-squared tests of independence with 1 degree of freedom are routine [^2].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-tables.html#observed-statistic-vs.-null-chi-squared-statistics-1
        locator: Sec. 18.2.3 Observed statistic vs. null chi-squared statistics (conditions and df)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson11#probability-distribution-plots
        locator: Lesson 11, Sec. 11.1.1 (Example 11.1, df = 1) and Sec. 11.3 Chi-Square Test of Independence
    source:
      id: mmlu-redux
      ref: high_school_statistics/3
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=3
    status: draft
  - id: statistics-009
    type: single
    difficulty: medium
    question: Which of the following is a correct statement?
    options:
      - text: The probability of a Type II error does not depend on the probability of a Type I error.
      - text: In conducting a hypothesis test, it is possible to simultaneously make both a Type I and a Type II error.
      - text: A Type II error will result if one incorrectly assumes the data are normally distributed.
      - text: When you choose a significance level α, you're setting the probability of a Type I error to exactly α.
        correct: true
    explanation: |
      By definition $\alpha = P(\text{Type I error})$, the probability of rejecting $H_0$ when it
      is true, so picking the significance level sets the Type I error rate [^1]. The two error
      rates are linked: for a fixed sample size, lowering $\alpha$ raises $\beta$ [^2], so the
      claim that the Type II error probability does not depend on the Type I error probability
      is wrong. Both errors cannot happen in one test, since a Type I error needs a rejection of
      $H_0$ and a Type II error needs a failure to reject it [^1]. Wrongly assuming normality can
      make a test unreliable, but that is not what a Type II error is.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/4
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=4
    status: draft
  - id: statistics-010
    type: single
    difficulty: easy
    question: As reported on CNN, in a May 1999 national poll 43% of high school students expressed fear about going to school. Which of the following best describes what is meant by the poll having a margin of error of 5%?
    options:
      - text: It is likely that the true proportion of high school students afraid to go to school is between 38% and 48%.
        correct: true
      - text: Five percent of the students refused to participate in the poll.
      - text: Between 38% and 48% of those surveyed expressed fear about going to school.
      - text: There is a 0.05 probability that the 43% result is in error.
    explanation: |
      A margin of error is $z^\star \times SE$, a measure of how much a sample proportion varies
      from sample to sample [^1]. Adding it to the poll result gives an interval estimate for the
      population, so $43\% \pm 5\%$ is a plausible range of 38% to 48% for the proportion of all
      high school students who were afraid [^2]. The interval targets the population parameter,
      not the people surveyed: exactly 43% of the sample said they were afraid [^2]. Refusals are
      non-response, a separate source of bias that the margin of error does not measure [^3], and
      the margin is not a 5% chance that the result is wrong.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#sec-moe
        locator: Sec. 13.3.3 Margin of error
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sampling-from-a-population
        locator: Sec. 2.1.4 Sampling from a population (non-response bias)
    source:
      id: mmlu-redux
      ref: high_school_statistics/5
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=5
    status: draft
  - id: statistics-011
    type: single
    difficulty: medium
    shuffle: false
    question: Consider the two sets X = {10, 30, 45, 50, 55, 70, 90} and Y = {10, 30, 35, 50, 65, 70, 90}. Which of the following is false?
    options:
      - text: The sets have identical medians.
      - text: The sets have identical means.
      - text: The sets have identical ranges.
      - text: None of the above are false.
        correct: true
    explanation: |
      Check all three claims. Medians: each set has 7 ordered values, so the median is the 4th
      value, 50 in both [^1]. Means: both sums are 350, so each mean is $350/7 = 50$ [^2]. Ranges:
      $90 - 10 = 80$ for both, since range = maximum − minimum [^3]. All three statements are
      true, so none of them is false.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-dotplots
        locator: Sec. 5.2 Dot plots and the mean
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson02#sec-5-num-sum
        locator: Lesson 2, Sec. 2.2.9 Five Number Summary (Definition 2.20, Range)
    source:
