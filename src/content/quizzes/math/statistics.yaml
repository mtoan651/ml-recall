  - id: statistics-014
    type: single
    difficulty: hard
    question: The number of days it takes to build a new house has a variance of 386. A sample of 40 new homes shows an average building time of 83 days. With what confidence can we assert that the average building time for a new house is between 80 and 90 days?
    options:
      - text: 15.4%
        why: This is the area between $z = 0.966$ and $z = 2.253$, as if both endpoints were above the mean; 80 lies below $\bar{x} = 83$, so the left cutoff is $-0.966$ [^3].
      - text: 17.8%
        why: This is roughly the area *outside* the interval, $1 - 0.821$, not the confidence attached to it [^3].
      - text: 20.0%
        why: This divides by $\sigma \approx 19.6$ instead of the standard error $\sigma/\sqrt{40} \approx 3.1$ [^1].
      - text: 82.1%
        correct: true
    explanation: |
      The population variance is known, so the sample mean has standard error
      $\sigma/\sqrt{n} = \sqrt{386}/\sqrt{40} \approx 3.106$ days [^1]. Measured from
      $\bar{x} = 83$, the interval 80 to 90 runs from $(80-83)/3.106 \approx -0.966$ to
      $(90-83)/3.106 \approx 2.253$ standard errors. The confidence attached to an interval built
      from the normal model is the normal area between its two cutoffs [^2], computed as the
      total area minus the two tails [^3]: $P(-0.966 < Z < 2.253) \approx 0.821$, about 82.1%. The
      20.0% option is what you get by dividing by $\sigma \approx 19.6$ instead of by the standard
      error.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#mathematical-distribution-of-the-sample-mean
        locator: Sec. 19.2.1 Mathematical distribution of the sample mean
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (probability between two values)
    source:
      id: mmlu-redux
      ref: high_school_statistics/12
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=12
    status: reviewed
    reviewed_by: claude
  - id: statistics-015
    type: single
    difficulty: medium
    question: Company I manufactures demolition fuses that burn an average of 50 minutes with a standard deviation of 10 minutes, while company II advertises fuses that burn an average of 55 minutes with a standard deviation of 5 minutes. Which company's fuse is more likely to last at least 1 hour? Assume normal distributions of fuse times.
    options:
      - text: Company I's, because of its greater standard deviation
        why: "Company I's larger spread is exactly offset by its lower mean: one hour is $z = 1$ for both companies [^1]."
      - text: Company II's, because of its greater mean
        why: "Company II's higher mean is offset by its smaller standard deviation: one hour is $z = 1$ for both companies [^1]."
      - text: For both companies, the probability that a fuse will last at least 1 hour is 0.159
        correct: true
      - text: For both companies, the probability that a fuse will last at least 1 hour is 0.841
        why: 0.841 is $P(Z < 1)$, the chance that a fuse burns out before one hour [^2].
    explanation: |
      Turn one hour into a z-score for each company [^1]: Company I gives
      $z = (60-50)/10 = 1$ and Company II gives $z = (60-55)/5 = 1$. Both fuses have to beat the
      same z-score, so the probabilities are equal: $P(Z > 1) = 0.5 - 0.34134 \approx 0.159$ [^2].
      The value 0.841 is $P(Z < 1)$, the chance a fuse burns out before an hour. Neither the
      larger standard deviation nor the larger mean wins on its own; what matters is how many
      standard deviations 60 minutes lies above each mean.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.0)
    source:
      id: mmlu-redux
      ref: high_school_statistics/13
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=13
    status: reviewed
    reviewed_by: claude
  - id: statistics-016
    type: single
    difficulty: medium
    question: The total cholesterol level in a large population of people is strongly skewed right with a mean of 210 mg/dL and a standard deviation of 15 mg/dL. If random samples of size 16 are repeatedly drawn from this population, which of the following appropriately describes the sampling distribution of these sample means?
    options:
      - text: The shape is unknown with a mean of 210 and a standard deviation of 15.
        why: 15 is the spread of individual cholesterol levels; means of 16 values vary less, $15/\sqrt{16} = 3.75$ [^1].
      - text: The shape is somewhat skewed right with a mean of 210 and a standard deviation of 3.75.
        correct: true
      - text: The shape is approximately normal with a mean of 210 and a standard deviation of 15.
        why: 'Both parts are off: means of 16 values have SD 3.75, and from a strongly skewed population they are not yet approximately normal [^1][^2].'
      - text: The shape is approximately normal with a mean of 210 and a standard deviation of 3.75.
        why: Center and spread are right, but $n = 16$ is too small to remove strong skew; about 60 observations would be needed [^2].
    explanation: |
      For random samples of size $n$, the sampling distribution of $\bar{x}$ is centered at
      $\mu = 210$ with standard error $\sigma/\sqrt{n} = 15/\sqrt{16} = 3.75$ [^1]. Its shape is
      close to normal only when $n$ is large relative to the skew of the population: a common
      rule of thumb asks for about 60 observations when the population is strongly skewed [^2].
      With only 16 observations from a strongly right-skewed population, the sample means are
      still somewhat skewed right, so "approximately normal" overstates the Central Limit
      Theorem here. Options with a standard deviation of 15 confuse the spread of individual
      values with the spread of sample means.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#mathematical-distribution-of-the-sample-mean
        locator: Sec. 19.2.1 Mathematical distribution of the sample mean
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
        locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄
    source:
      id: mmlu-redux
      ref: high_school_statistics/14
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=14
    status: reviewed
    reviewed_by: claude
  - id: statistics-017
    type: single
    difficulty: medium
    question: A recent poll reported that 43% of Americans approve of the job the president is doing, with a margin of sampling error of ±3.2% at a 95% level of confidence. Which of these correctly interprets that margin of error?
    options:
      - text: There is a 3.2% chance that the proportion of all Americans who approve of the job the president is doing is not 43%.
        why: The margin of error is a distance, not a probability, and the confidence level describes the method, not this one result [^2].
      - text: There is a 95% chance that the proportion of all Americans who approve of the job the president is doing is 43%.
        why: The confidence level is not a probability that the population proportion equals the sample value of 43% [^2].
      - text: About 95% of polls conducted in this way will find that between 39.8% and 46.2% of those sampled approve of the job the president is doing.
        why: Other samples are centered on the true proportion, not on 43%; the interval targets the population proportion [^3].
      - text: About 95% of polls conducted in this way will give a sample proportion within 3.2 percentage points of the actual proportion of all Americans who approve of the job the president is doing.
        correct: true
    explanation: |
      The margin of error, $z^\star \times SE$, describes how far sample proportions typically
      land from the truth: at 95% confidence, about 95% of samples drawn the same way give a
      $\hat{p}$ within the margin of the population proportion [^1]. The confidence level
      describes the method over many possible polls, not this one dataset [^2], so it gives no
      probability (95% or 3.2%) that the true proportion is, or is not, exactly 43%. The option about
      39.8% to 46.2% "of those sampled" is wrong because the interval is meant to capture the
      population proportion, not the results of other samples [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#sec-moe
        locator: Sec. 13.3.3 Margin of error
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-props.html#what-does-95-mean
        locator: Sec. 17.2.4 What does 95% mean?
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
    source:
      id: mmlu-redux
      ref: high_school_statistics/15
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=15
    status: reviewed
    reviewed_by: claude
  - id: statistics-018
    type: single
    difficulty: medium
    question: A company is interested in comparing the mean sales revenue per salesperson at two different locations. The manager takes a random sample of 10 salespeople from each location independently and records the sales revenue generated by each person during the last four weeks. He decides to use a t-test to compare the mean sales revenue at the two locations. Which of the following assumptions is necessary for the validity of the t-test?
    options:
      - text: The population standard deviations at both locations are equal.
        why: The standard error $\sqrt{s_1^2/n_1 + s_2^2/n_2}$ uses each sample's own SD, so equal population SDs are not required [^1].
      - text: The population standard deviations at both locations are not equal.
        why: Unequal SDs are allowed, not required; the unpooled t-test works either way [^1].
      - text: The population standard deviations at both locations are known.
        why: If the population SDs were known, you would use a z procedure, not a t-test [^3].
      - text: The population of the sales records at each location is normally distributed.
        correct: true
    explanation: |
      With only 10 salespeople per location, the two-sample t procedure is justified only if
      each population is approximately normal; the large-sample alternative needs at least 30
      per group [^1]. The usual standard error $\sqrt{s_1^2/n_1 + s_2^2/n_2}$ uses each sample's
      own standard deviation, so the population standard deviations do not have to be equal
      [^1][^2], and assuming they differ is not a requirement either. If the population standard
      deviations were known, you would use a z procedure rather than a t-test [^3].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson09#two-independent-means
        locator: Lesson 9, Sec. 9.2 Two Independent Means
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-means.html#observed-data-3
        locator: Sec. 20.4.1 (conditions for the t-distribution with a difference in means)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#one-sample-mean
        locator: Lesson 8, Sec. 8.2 One Sample Mean
    source:
      id: mmlu-redux
      ref: high_school_statistics/16
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=16
    status: reviewed
    reviewed_by: claude
  - id: statistics-019
    type: single
    difficulty: easy
    question: A study is made to determine whether more hours of academic studying leads to higher point scoring by basketball players. In surveying 50 basketball players, it is noted that the 25 who claim to study the most hours have a higher point average than the 25 who study less. Based on this study, the coach begins requiring the players to spend more time studying. Which of the following is a correct statement?
    options:
      - text: While this study may have its faults, it still does prove causation.
        why: An observational comparison without random assignment cannot prove causation [^3].
      - text: There could well be a confounding variable responsible for the seeming relationship.
        correct: true
      - text: While this is a controlled experiment, the conclusion of the coach is not justified.
        why: The players chose how much to study; nothing was assigned, so this is not an experiment [^1].
      - text: To get the athletes to study more, it would be more meaningful to have them put in more practice time on the court to boost their point averages, as higher point averages seem to be associated with more study time.
        why: 'This reverses the reasoning: the association gives no evidence that higher scores would cause more studying [^3].'
    explanation: |
      The players chose how much to study, so this is an observational comparison with no
      random assignment and no control over other factors [^1]. A confounding variable is one
      related to both the explanatory and the response variable [^1]. Motivation or discipline
      could drive both study time and scoring, much as sun exposure drives both sunscreen use and
      skin cancer in the textbook example [^2]. Association in
      such data does not establish causation, so this study does not justify the coach's
      requirement [^3]. It is not a controlled experiment, and the idea that more court practice
      would raise study time reverses the reasoning without any evidence.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#confounding-variables
        locator: Lesson 1, Sec. 1.4.1 Confounding Variables
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-observational-studies
        locator: Sec. 2.3 Observational studies
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-hello.html#observational-studies-and-experiments
        locator: Sec. 1.2.5 Observational studies and experiments (Association ≠ Causation)
    source:
