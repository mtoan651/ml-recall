  - id: statistics-147
    type: short_answer
    difficulty: hard
    tags:
      - anova
      - f-statistic
      - sum-of-squares
    question: |
      A study compared weekly physical activity across 5 levels of coffee consumption in 50,739
      women using a one-way ANOVA. The total sum of squares is 25,575,327 and the residual
      (within-group) sum of squares is 25,564,819. What is the $F$ statistic?
    answer:
      numeric: 5.21
      tolerance: 0.02
      hint: 2 decimals
      model: $SSG = 10{,}508$ on $df = 4$, so $MSG = 2627$; $MSE = 25{,}564{,}819 / 50{,}734 \approx 503.9$; $F = 2627/503.9 \approx 5.21$
    explanation: |
      The group sum of squares is the total minus the residual, $SSG = 10{,}508$, with
      $df_G = k - 1 = 4$; the residuals have $df_E = n - k = 50{,}734$ [^1][^2]. Each mean square
      is a sum of squares divided by its degrees of freedom, $MSG = 2627$ and $MSE \approx 503.9$,
      and $F = MSG/MSE \approx 5.21$ [^1][^2]. On $F_{4,\,50734}$ the p-value is about 0.0003, so
      mean activity differs between at least two groups, even though the group means only range
      from 17.5 to 19.6, because the sample is huge.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.5.3 Analysis of variance (ANOVA) and the F-test; Sec. 7.5.4 Reading an ANOVA table from software
      - title: 'Wikipedia: One-way analysis of variance'
        url: https://en.wikipedia.org/wiki/One-way_analysis_of_variance#Example
        locator: Example (step-by-step F-test with degrees of freedom)
    source:
      id: openintro-stats
      ref: ch7/7.39-coffee_depression_phys_act
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/comparing_many_means_with_anova.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-148
    type: short_answer
    difficulty: easy
    tags:
      - anova
      - degrees-of-freedom
    question: |
      A one-way ANOVA comparing mean GPA across three groups of majors reports 2 degrees of freedom
      for the groups and 195 for the residuals. How many students were in the sample?
    answer:
      numeric: 198
      tolerance: 0
      hint: a whole number
      model: $df_G + df_E = 2 + 195 = 197 = n - 1$, so $n = 198$
    explanation: |
      In a one-way ANOVA with $k$ groups and $n$ observations, the groups have $k - 1$ degrees of
      freedom and the residuals $n - k$ [^1][^2]. Their sum is $n - 1$: $2 + 195 = 197$, so
      $n = 198$ students (and indeed $k = 3$ gives $df_E = 198 - 3 = 195$).
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/ch_inference_for_means.tex
        locator: Sec. 7.5.3 Analysis of variance (ANOVA) and the F-test
      - title: 'Wikipedia: One-way analysis of variance'
        url: https://en.wikipedia.org/wiki/One-way_analysis_of_variance#Example
        locator: Example (step-by-step F-test with degrees of freedom)
    source:
