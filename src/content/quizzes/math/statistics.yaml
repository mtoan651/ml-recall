    status: draft
  - id: statistics-067
    type: true_false
    difficulty: easy
    question: |
      Raising the number of bins of a histogram, for example from 10 to 30, shows the
      distribution in finer detail, because each bar then covers a narrower range of values.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
    explanation: |
      A histogram splits the range of a numeric variable into bins and counts how many values fall
      into each one [^1][^2]. The bins are a choice of the analyst [^2]: with more bins each covers a
      narrower interval, so the shape shows more detail, as the lesson's body-mass histogram does when
      `bins` goes from 10 to 30 [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
