  - id: statistics-003
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - mean
    question: Two measured travel times are 2 minutes and 4 minutes. What is their mean?
    options:
      - text: 2 minutes
      - text: 3 minutes
        correct: true
      - text: 4 minutes
      - text: 6 minutes
        why: 6 is the sum; the mean divides it by the number of values.
    explanation: 'The mean is the sum divided by the count: $(2 + 4) / 2 = 3$ minutes [^1].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 58
    source:
