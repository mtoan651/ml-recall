  - id: statistics-099
    type: single
    difficulty: medium
    question: An experiment was designed to test the effects of three different types of paint on the durability of wooden toys. Because boys and girls tend to play differently with toys, a randomly selected group of children was divided into two groups by sex. Which of the following statements about this experiment is true?
    options:
      - text: There are three types of paint and two sex groups, giving a total of six treatment combinations in this experiment.
        why: Sex cannot be randomly assigned, so it is a block, not a treatment factor; there are three treatments [^2].
      - text: Type of paint is a blocking factor.
        why: Paint is the treatment being studied; blocking is for a nuisance variable [^1].
      - text: Sex is a blocking factor.
        correct: true
      - text: This is a completely randomized design.
        why: Randomization happens within each sex group, which makes it a randomized block design [^1].
    explanation: 'The treatment factor is the type of paint, with three levels. The children are first split by sex because boys and girls are expected to play differently, and the paints are then assigned within each group, so sex is a blocking factor: a nuisance variable used to remove variation that is not of interest [^1][^2]. Sex is a classification factor that cannot be randomly assigned, so it is not part of the treatments, and there are three treatments, not six [^2]. Because randomization happens within blocks, this is a randomized block design rather than a completely randomized one.'
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
