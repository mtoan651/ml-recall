  - id: statistics-084
    type: single
    difficulty: easy
    question: A medical research team tests for tumor reduction in a sample of patients using three different dosages of an experimental cancer drug. Which of the following is true?
    options:
      - text: There are three explanatory variables and one response variable.
        why: The three dosages are levels of one explanatory variable, dosage [^2].
      - text: There is one explanatory variable with three levels of response.
        why: The three levels belong to the explanatory variable; the response, tumor reduction, is just measured [^1].
      - text: Tumor reduction is the only explanatory variable, but there are three response variables corresponding to the different dosages.
        why: 'This reverses the roles: dosage is explanatory and tumor reduction is the response [^1].'
      - text: There are three levels of a single explanatory variable.
        correct: true
    explanation: The explanatory variable is the one the researchers manipulate, here the dosage of the drug, and the response variable is the outcome they measure, tumor reduction [^1]. Three dosages are three levels of that single explanatory variable (one factor with three levels), not three different explanatory variables [^2]. Tumor reduction is the only response, so the statements that make it explanatory or speak of three response variables reverse the roles.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#sec-explanatory-and-response-variables
        locator: Lesson 1, Sec. 1.1.2 Explanatory & Response Variables
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson01#factors
        locator: Lesson 1, Sec. 1.3 Steps for Planning an Experiment (choice of factors, levels, and ranges; Factors)
    source:
