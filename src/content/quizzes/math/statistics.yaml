  - id: statistics-119
    type: short_answer
    difficulty: easy
    tags:
      - empirical-cdf
      - variance
      - binomial
    question: |
      The empirical CDF of $n$ i.i.d. samples is $\hat F_n(t) = \frac{1}{n}\sum_{i=1}^{n}\mathbf{1}(X_i \le t)$.
      If the true CDF has $F(t) = 0.3$ at some point $t$ and $n = 100$, what is the variance of
      $\hat F_n(t)$?
    answer:
      numeric: 0.0021
      tolerance: 0.00001
      hint: a number, 4 decimals
      model: $F(t)(1 - F(t))/n = 0.3 \cdot 0.7 / 100 = 0.0021$
    explanation: |
      Each indicator $\mathbf{1}(X_i \le t)$ is a Bernoulli variable with mean $F(t)$ and variance
      $F(t)(1 - F(t))$, so $n\hat F_n(t)$ is binomial and $\hat F_n(t)$ has mean $F(t)$ and variance
      $F(t)(1 - F(t))/n$ [^1] [^2]. Here $0.21/100 = 0.0021$ (standard deviation about 0.046). The
      estimate is unbiased and its variance shrinks like $1/n$, which with Hoeffding's inequality
      and Borel–Cantelli gives almost sure convergence at each $t$ [^1].
    references:
      - source: mit-ocw-18657
        locator: Problem set 1 solutions, Problem 3 (1)
        url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-1-solution/
      - title: 'Wikipedia: Empirical distribution function'
        locator: Definition (n·F̂n(t) is binomial with mean nF(t) and variance nF(t)(1 − F(t)))
        url: https://en.wikipedia.org/wiki/Empirical_distribution_function#Definition
    source:
      id: mit-ocw-18657
      ref: assignment-1#q3.1
      url: https://ocw.mit.edu/courses/18-657-mathematics-of-machine-learning-fall-2015/resources/assignment-1-solution/
    status: reviewed
    reviewed_by: claude
  - id: statistics-120
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l01
      - correlation
      - covariance
    question: |
      Three equally weighted pairs $(x, y)$ are $(1, 2)$, $(2, 1)$ and $(3, 3)$. What is the
      (Pearson) correlation between $x$ and $y$?
    answer:
      numeric: 0.5
      tolerance: 0.001
      hint: a number between −1 and 1
      model: Means 2 and 2; $\mathrm{Cov} = \tfrac13[(-1)(0) + (0)(-1) + (1)(1)] = \tfrac13$; both variances are $\tfrac23$, so $r = \tfrac{1/3}{2/3} = 0.5$.
    explanation: |
      Covariance averages the products of deviations from the means, and correlation divides it by
      both standard deviations [^1][^2]. Both means are 2, the deviation products are $0$, $0$
      and $1$, so the covariance is $1/3$. Each variable has variance
      $(1 + 0 + 1)/3 = 2/3$, giving $r = (1/3)/(2/3) = 0.5$ — a moderate positive linear
      relationship. Correlation does not depend on whether you divide by $n$ or $n - 1$, as long as
      you do it consistently.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 59
      - title: 'Wikipedia: Pearson correlation coefficient'
        url: https://en.wikipedia.org/wiki/Pearson_correlation_coefficient
        locator: Definition
    source:
      id: ncu-intro-dl
      ref: lecture-01/q09
    status: reviewed
    reviewed_by: claude
  - id: statistics-121
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-l01
      - maximum-likelihood
    question: |
      Two classifiers are compared on three independent examples. Model A assigns probabilities
      0.9, 0.9 and 0.2 to the observed labels; model B assigns 0.6 to each. Which model does
      maximum likelihood estimation prefer?
    options:
      - text: Model B, because the product of its probabilities is larger (0.216 vs 0.162)
        correct: true
      - text: Model A, because its average probability for the observed labels is larger (0.667 vs 0.6)
        why: Likelihood multiplies the probabilities of independent examples; it does not average them.
      - text: Model A, because it gives high probability to two of the three observed labels
        why: The single example given probability 0.2 shrinks A's product more than its two confident hits help.
      - text: Neither, because both models are right on the majority of the examples
        why: Likelihood uses the probability values themselves, not just whether each prediction is correct.
    explanation: |
      For independent examples the likelihood is the product of the probabilities assigned to the
      observed labels, and MLE picks the model with the larger product — equivalently the smaller
      summed negative log-likelihood [^1][^2]. A gives $0.9 \times 0.9 \times 0.2 = 0.162$ and B
      gives $0.6^3 = 0.216$, so B wins. In log terms, A's $-\ln 0.2 \approx 1.61$ on one example
      outweighs its two small losses of $0.105$; one confident miss is expensive.
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 71
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html
        locator: Sec. 22.7.1 The Maximum Likelihood Principle; Sec. 22.7.2 Numerical Optimization and the Negative Log-Likelihood
    source:
      id: ncu-intro-dl
      ref: lecture-01/q15
    status: reviewed
    reviewed_by: claude
  - id: statistics-122
    type: short_answer
    difficulty: medium
    tags:
      - ce6146
      - ce6146-l02
      - squared-error
      - conditional-mean
    question: |
      At a fixed input, the target $Y$ is 0 or 4 with probability $\tfrac12$ each. A model predicts
      the constant $a = 1$. Its expected squared loss $E[(Y - a)^2]$ is {{1}}, and the smallest
      expected squared loss any prediction can reach is {{2}}.
    answer:
      blanks:
        - numeric: 5
          tolerance: 0.001
          hint: a number
        - numeric: 4
          tolerance: 0.001
          hint: a number
      model: $E[(Y-1)^2] = \tfrac12(1) + \tfrac12(9) = 5 = \mathrm{Var}(Y) + (2 - 1)^2 = 4 + 1$; the minimum, at $a = E[Y] = 2$, is $\mathrm{Var}(Y) = 4$.
    explanation: |
      The expected squared loss splits as $E[(Y - a)^2] = \mathrm{Var}(Y) + (E[Y] - a)^2$, the
      variance-plus-squared-bias decomposition of the mean squared error [^1][^3].
      With $E[Y] = 2$ and $\mathrm{Var}(Y) = 4$, predicting $a = 1$ costs $4 + 1 = 5$. The second
      term vanishes at $a = E[Y]$, so the conditional mean is the optimal prediction [^2] and the
      variance, 4, is noise that no model can remove.
    references:
      - source: ncu-intro-dl
        locator: Lecture 2, slide 48
      - title: 'Wikipedia: Conditional expectation'
        url: https://en.wikipedia.org/wiki/Conditional_expectation
        locator: Definitions — L² random variables (the expectation minimizes the mean squared error)
      - title: 'Wikipedia: Mean squared error'
        url: https://en.wikipedia.org/wiki/Mean_squared_error
        locator: Definition and basic properties — Estimator (proof of variance and bias relationship)
    source:
      id: ncu-intro-dl
