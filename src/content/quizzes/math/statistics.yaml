      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-3.json
    status: draft
  - id: statistics-066
    type: single
    difficulty: easy
    question: 'Show how parts relate to a whole using this type of chart:'
    options:
      - text: line
      - text: column
      - text: pie
        correct: true
    explanation: |
      To show how parts relate to a whole, the chart guide recommends a pie chart [^1]: each slice is
      one category's share of the total, as in the lesson's pie of edible versus poisonous mushrooms
      [^2]. Line charts show trends over time and column charts compare values, but neither shows
      each part as a share of one whole [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#observe-wingspan-with-matplotlib
        locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide)'
      - source: ms-ds-for-beginners
