    reviewed_by: claude
  - id: statistics-020
    type: single
    difficulty: medium
    question: The mean daily demand for bread at a popular bakery is 2,500 loaves, with a standard deviation of 225 loaves. Every morning the bakery bakes 3,000 loaves. What is the probability that today it will run out of bread? Assume that the daily demand for bread at this bakery is normally distributed.
    options:
      - text: '0.8333'
        why: This is $2500/3000$, which ignores the standard deviation and the normal model [^1].
      - text: '0.1667'
        why: This is $1 - 2500/3000$, which also ignores the standard deviation [^1].
      - text: '0.9869'
        why: This is $P(Z < 2.22)$, the probability of *not* running out [^2].
      - text: '0.0132'
        correct: true
    explanation: |
      The bakery runs out when demand exceeds 3,000 loaves, so standardize that value [^1]:
      $z = (3000 - 2500)/225 \approx 2.22$. The normal table gives an area of 0.48679 between 0
      and 2.22, so $P(Z > 2.22) = 0.5 - 0.48679 \approx 0.0132$ [^2]. The value 0.9869 is the
      chance of *not* running out, $P(Z < 2.22)$. The options 0.8333 and 0.1667 come from
      $2500/3000$ and its complement, which ignore the standard deviation entirely.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 2.2)
    source:
      id: mmlu-redux
      ref: high_school_statistics/18
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=18
    status: reviewed
    reviewed_by: claude
  - id: statistics-021
    type: single
    difficulty: medium
    question: 'An assembly line machine is supposed to turn out ball bearings with a diameter of 1.25 centimeters. Each morning the first 30 bearings produced are pulled and measured. If their mean diameter is under 1.23 centimeters or over 1.27 centimeters, the machinery is stopped and an engineer is called to make adjustments before production is resumed. The quality control procedure may be viewed as a hypothesis test with the null hypothesis $H_0: \mu = 1.25$ and the alternative hypothesis $H_a: \mu \neq 1.25$. The engineer is asked to make adjustments when the null hypothesis is rejected. In test terminology, what would a Type II error result in?'
    options:
      - text: A warranted halt in production to adjust the machinery
        why: Halting when the machine really is off target is a correct decision, not an error [^2].
      - text: An unnecessary stoppage of the production process
        why: 'Stopping when the machine is fine means rejecting a true $H_0$: that is a Type I error [^1].'
      - text: Continued production of wrong size ball bearings
        correct: true
      - text: Continued production of proper size ball bearings
        why: Continuing when the machine is on target is a correct decision [^2].
    explanation: |
      A Type II error is failing to reject $H_0$ when $H_0$ is false [^1]. Here $H_0$ says the
      mean diameter is on target (1.25 cm), and not rejecting it means production continues, so a
      Type II error is continued production of wrong-size bearings while the machine is actually
      off. An unnecessary stoppage is the opposite mistake, a Type I error: rejecting a true
      $H_0$ [^1]. A warranted halt and continued production of correct bearings are the two
      correct decisions [^2].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-errors.html#sec-foundations-decision-errors
        locator: Ch. 14 Decision Errors, Table 14.1
    source:
      id: mmlu-redux
      ref: high_school_statistics/19
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=19
    status: reviewed
    reviewed_by: claude
  - id: statistics-022
    type: single
    difficulty: medium
    question: The probability is 0.2 that a value selected at random from a normal distribution with mean 600 and standard deviation 15 will be above what number?
    options:
      - text: '0.84'
        why: 0.84 is the z-score of the 80th percentile, not the value on the original scale [^1].
      - text: '603.8'
        why: $600 + 0.253 \times 15 \approx 603.8$ is the 60th percentile, which has 40% above it, not 20% [^2].
      - text: '612.6'
        correct: true
      - text: '587.4'
        why: $600 - 0.84 \times 15$ is the 20th percentile, the value with 20% *below* it [^2].
    explanation: |
      A value with 20% of the distribution above it is the 80th percentile. The 80th percentile
      of the standard normal is $z \approx 0.84$ [^1], and converting back with $x = \mu + z\sigma$
      gives $600 + 0.84 \times 15 \approx 612.6$ [^2]. The option 0.84 is the z-score, not the
      value, and 587.4 $= 600 - 0.84 \times 15$ is the 20th percentile, the value with 20%
      *below* it.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-calculations
        locator: Sec. 13.2.3 Normal probability calculations (Z for the 80th percentile)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples (finding the value at a percentile)
    source:
      id: mmlu-redux
      ref: high_school_statistics/20
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=20
    status: reviewed
    reviewed_by: claude
  - id: statistics-023
    type: single
    difficulty: medium
    question: 'A farmer wants to know whether a new fertilizer has increased the mean weight of his apples. With the old fertilizer, the mean weight was 4.0 ounces per apple. The farmer decides to test $H_0: \mu = 4.0$ ounces versus $H_a: \mu > 4.0$ ounces, at a 5 percent level of significance, where $\mu$ = the mean weight of apples using the new fertilizer. The weights of apples are approximately normally distributed. The farmer takes a random sample of 16 apples and computes a mean of 4.3 ounces and a standard deviation of 0.6 ounces. Which of the following gives the p-value for this test?'
    options:
      - text: $P(Z \gt 2)$
        why: $\sigma$ is unknown and estimated by $s = 0.6$, so the statistic follows a t-distribution with 15 df, not the normal [^1][^3].
      - text: $P(Z \lt 2)$
        why: 'Wrong distribution and wrong tail: use $t$ with 15 df, and $H_a: \mu > 4.0$ calls for the right tail [^2].'
      - text: $P(t \gt 2)$ with 15 degrees of freedom
        correct: true
      - text: $P(t \lt 2)$ with 15 degrees of freedom
        why: 'For $H_a: \mu > 4.0$ the p-value is the area to the right of the test statistic [^2].'
    explanation: |
      Only the sample standard deviation $s = 0.6$ is known, so the test statistic is a T score
      with $df = n - 1 = 15$ [^1]: $T = (4.3 - 4.0)/(0.6/\sqrt{16}) = 0.3/0.15 = 2$. The
      alternative is $\mu > 4.0$, so the p-value is the area to the right of the test statistic,
      $P(t > 2)$ [^2]. Z-based options would need a known population $\sigma$ [^3], and
      $P(t < 2)$ points in the wrong direction.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#one-sample-t-tests
        locator: Sec. 19.2.5 One sample t-tests
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#minitab-finding-proportions-under-a-normal-distribution
        locator: Lesson 7, Sec. 7.2 (p-value for a right-tailed test)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#one-sample-mean
        locator: Lesson 8, Sec. 8.2 One Sample Mean
    source:
      id: mmlu-redux
      ref: high_school_statistics/22
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=22
    status: reviewed
    reviewed_by: claude
  - id: statistics-024
    type: single
    difficulty: medium
    question: The mean height of adult men is 70 inches, with a standard deviation of four inches. The mean height of adult women is 66 inches, with a standard deviation of three inches. Between a man with a height of 74 inches and a woman with a height of 70 inches, who is more unusually tall within his or her respective sex?
    options:
      - text: It cannot be determined, because the mean heights for the two groups are different.
        why: Standardizing with z-scores removes the difference in means [^1].
      - text: It cannot be determined, because the standard deviations of the heights for the two groups are different.
        why: Dividing by each group's own SD in the z-score removes the difference in spread [^1].
      - text: The man, because he is 74 inches tall and the woman is only 70 inches tall.
        why: Raw heights from different distributions are not comparable; his z-score is 1, hers about 1.33 [^1].
      - text: The woman, because her height is 1.33 standard deviations above the women's mean, versus 1 standard deviation for the man.
        correct: true
    explanation: |
      Raw heights from distributions with different means and spreads are not directly
      comparable, so compare z-scores [^1]. The man's is $(74-70)/4 = 1$ and the woman's is
      $(70-66)/3 \approx 1.33$. An observation is more unusual when its z-score is larger in
      absolute value [^1], so the woman is the more unusually tall one. Different means or
      standard deviations do not make the comparison impossible; standardizing is exactly what
      removes those differences.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
    source:
      id: mmlu-redux
      ref: high_school_statistics/23
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=23
    status: reviewed
    reviewed_by: claude
  - id: statistics-025
    type: single
    difficulty: medium
    question: A random sample of 25 men and a separate random sample of 25 women are selected to answer questions about attitudes toward abortion. The answers were categorized as "pro-life" or "pro-choice." Which of the following is the proper null hypothesis for this situation?
    options:
      - text: The variables "gender" and "attitude toward abortion" are related.
        why: That is the alternative hypothesis; the null states that there is no difference [^1].
      - text: The proportion of "pro-life" men is the same as the proportion of "pro-life" women.
        correct: true
      - text: The proportion of "pro-life" men is related to the proportion of "pro-life" women.
        why: \"Related\" proportions is not a testable equality; the null for two proportions is $p_1 = p_2$ [^1].
      - text: The proportion of "pro-choice" men is the same as the proportion of "pro-life" women.
        why: It compares two different categories; the null must compare the same response in both groups [^1].
    explanation: |
      There are two independent random samples (men and women) and a two-category response, so
      the question is whether the proportion holding a given view is the same in both
      populations. A null hypothesis states that there is no difference in the populations, and
      for two proportions it is written $p_1 = p_2$ [^1]; here, the proportion of "pro-life" men
      equals the proportion of "pro-life" women. "The variables are related" is the alternative
      hypothesis, not the null [^1]. Saying two proportions are "related" is not a testable
      statement, and comparing pro-choice men with pro-life women mixes two different categories.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#writing-hypotheses
        locator: Lesson 5, Sec. 5.2 Writing Hypotheses (Difference between Two Proportions)
    source:
      id: mmlu-redux
      ref: high_school_statistics/24
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=24
    status: reviewed
    reviewed_by: claude
  - id: statistics-026
    type: single
    difficulty: hard
    question: A telephone survey of 400 registered voters showed that 256 had not yet made up their minds 1 month before the election. How sure can we be that between 60% and 68% of the electorate were still undecided at that time?
    options:
      - text: 2.4%
        why: 2.4% is the standard error $\sqrt{0.64 \times 0.36/400}$, not a confidence level [^1].
      - text: 8.0%
        why: 8.0% is the width of the interval from 60% to 68%, not a confidence level.
      - text: 64.0%
        why: 64.0% is the point estimate $\hat{p} = 256/400$ [^1].
      - text: 90.4%
        correct: true
    explanation: |
      The sample proportion is $\hat{p} = 256/400 = 0.64$, with standard error
      $\sqrt{0.64 \times 0.36/400} = 0.024$ [^1]. The interval 60% to 68% is $0.64 \pm 0.04$, which
      is $0.04/0.024 \approx 1.67$ standard errors on each side. The confidence level of such an
      interval is the normal area between $-z^\star$ and $z^\star$ [^2]; the table gives about
      0.4522 between 0 and 1.667, so the level is $2 \times 0.4522 \approx 0.904$, or 90.4% [^3].
      The 64.0% option is the point estimate, 2.4% is the standard error, and 8.0% is the width
      of the interval; none of these is a confidence level.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#confidence-interval-for-a-proportion
        locator: Sec. 16.2.2 Confidence interval for a proportion
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.6)
    source:
      id: mmlu-redux
      ref: high_school_statistics/25
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=25
    status: reviewed
    reviewed_by: claude
  - id: statistics-027
    type: single
    difficulty: medium
    question: In a random sample of Toyota car owners, 83 out of 112 said they were satisfied with the Toyota front-wheel drive, while in a similar survey of Subaru owners, 76 out of 81 said they were satisfied with the Subaru four-wheel drive. A 90% confidence interval estimate for the difference in proportions between Toyota and Subaru car owners who are satisfied with their drive systems is reported to be -0.197 ± 0.081. Which is a proper conclusion?
    options:
      - text: The interval is invalid because probabilities cannot be negative.
        why: The interval is for a *difference* of proportions, which can be negative; the sign says Toyota's rate is lower [^2].
      - text: The interval is invalid because it does not contain zero.
        why: An interval need not contain zero; zero lying outside it means \"no difference\" is not a plausible value [^3].
      - text: Subaru owners are approximately 19.7% more satisfied with their drive systems than are Toyota owners.
        why: It ignores the margin of error and turns a 0.197 difference in proportions into \"19.7% more satisfied\" [^1].
      - text: We are 90% confident that the difference in satisfied proportions (Toyota minus Subaru) is between -0.278 and -0.116.
        correct: true
    explanation: |
      The interval $-0.197 \pm 0.081$ runs from $-0.278$ to $-0.116$, and the right reading is
      that we are 90% confident the population difference (Toyota minus Subaru) lies in that
      range [^1]. An interval for a difference of proportions,
      $(\hat{p}_1 - \hat{p}_2) \pm z^\star \times SE$, can perfectly well contain negative
      values [^2]; here the sign just says Toyota's satisfaction rate is lower. An interval need
      not contain zero to be valid; a value outside it, such as 0, is simply not a plausible
      value of the difference [^3]. "19.7% more satisfied" ignores the margin of error and treats
      a 0.197 difference in proportions as a percentage.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-two-props.html#confidence-interval-for-the-difference-between-two-proportions
        locator: Sec. 17.3.2 Confidence interval for the difference between two proportions
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#applying-confidence-intervals
        locator: Lesson 4, Sec. 4.2.2 Applying Confidence Intervals
    source:
      id: mmlu-redux
      ref: high_school_statistics/32
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=32
    status: reviewed
    reviewed_by: claude
  - id: statistics-028
    type: single
    difficulty: easy
    question: A small kiosk at the Atlanta airport carries souvenirs in the price range of \$3.99 to \$29.99, with a mean price of \$14.75. The airport authorities decide to increase the rent charged for a kiosk by 5 percent. To make up for the increased rent, the kiosk owner decides to increase the prices of all items by 50 cents. As a result, which of the following will happen?
    options:
      - text: The mean price and the range of prices will increase by 50 cents.
        why: Both extremes rise by 50 cents, so the range does not change [^2].
      - text: The mean price will remain the same, but the range of prices will increase by 50 cents.
        why: Adding 50 cents to every price raises the mean by 50 cents, and the range stays the same [^1][^2].
      - text: The mean price and the standard deviation of prices will increase by 50 cents.
        why: Adding a constant shifts every value but leaves the deviations from the mean, and so the SD, unchanged [^1].
      - text: The mean price will increase by 50 cents, but the standard deviation of prices will remain the same.
        correct: true
    explanation: |
      Adding the same constant to every value raises the mean by exactly that constant [^1].
      The spread does not change: every deviation from the (new) mean is the same as before, so
      the standard deviation and variance stay the same [^1]. The range, maximum minus minimum
      [^2], is also unchanged because both extremes rise by 50 cents (\$3.99–\$29.99 becomes
      \$4.49–\$30.49). The 5% rent increase is a distractor; only the 50-cent price change
      matters.
    references:
      - title: 'Data Science Discovery (University of Illinois): Modifying Values in Data and its Effect on Descriptive Statistics'
        url: https://discovery.cs.illinois.edu/guides/Descriptive-Statistics/modifying-descriptive-stats/#Adding-or-Subtracting-a-Constant-To-All-Values
        locator: Section 'Adding (or Subtracting) a Constant To All Values'
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson02#sec-5-num-sum
        locator: Lesson 2, Sec. 2.2.9 Five Number Summary (Definition 2.20, Range)
    source:
      id: mmlu-redux
      ref: high_school_statistics/33
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=33
    status: reviewed
    reviewed_by: claude
  - id: statistics-029
    type: single
    difficulty: medium
    question: A correlation of 0.6 indicates that the percentage of variation in y that is explained by the variation in x is how many times the percentage indicated by a correlation of 0.3?
    options:
      - text: '2'
        why: 'This forgets to square: the explained share is $r^2$, and doubling $r$ quadruples it [^1].'
      - text: '3'
        why: The ratio of the explained shares is $0.6^2/0.3^2 = 0.36/0.09 = 4$, not 3 [^1].
      - text: '4'
        correct: true
      - text: '6'
        why: The explained share is $r^2$, so the ratio is $0.36/0.09 = 4$, not 6 [^1].
    explanation: |
      The share of the variation in $y$ explained by a linear fit is $R^2$, which equals the
      square of the correlation [^1]. For $r = 0.6$, $R^2 = 0.36$; for $r = 0.3$, $R^2 = 0.09$;
      and $0.36/0.09 = 4$. Doubling $r$ quadruples $R^2$, so 2 is the tempting answer that forgets
      to square.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
        locator: Sec. 7.2.5 Describing the strength of a fit
    source:
      id: mmlu-redux
      ref: high_school_statistics/38
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=38
    status: reviewed
    reviewed_by: claude
  - id: statistics-030
    type: single
    difficulty: easy
    question: What is the probability of a Type II error when a hypothesis test is being conducted at the 10% significance level (α = 0.10)?
    options:
      - text: 0.05, because $\beta = \alpha/2$
        why: There is no such relation; $\beta$ depends on the sample size and on the true parameter value [^2].
      - text: 0.10, because $\beta$ always equals $\alpha$
        why: $\alpha$ is the Type I error probability; $\beta$ is a different probability that the significance level does not fix [^1].
      - text: 0.90, because $\beta = 1 - \alpha$
        why: $1 - \alpha$ is the chance of not rejecting a true $H_0$, which is not $\beta$ [^1].
      - text: It cannot be determined from $\alpha$ alone
        correct: true
    explanation: |
      $\beta = P(\text{Type II error})$ is the probability of failing to reject $H_0$ when it is
      false [^1]. It depends on things the question does not give, such as the sample size, the
      standard error and the size of the true difference from the null value, all of which change
      the power $1 - \beta$ [^2]. The significance level fixes only the Type I error rate,
      $\alpha = 0.10$ [^1]; 0.10 is $\alpha$ and 0.90 is $1 - \alpha$, and neither is $\beta$.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
    source:
      id: mmlu-redux
      ref: high_school_statistics/39
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=39
    status: reviewed
    reviewed_by: claude
  - id: statistics-031
    type: single
    difficulty: medium
    shuffle: false
    question: 'Suppose $H_0: p = 0.6$, and the power of the test for $H_a: p = 0.7$ is 0.8. Which of the following is a valid conclusion?'
    options:
      - text: The probability of committing a Type I error is 0.1.
        why: The Type I error probability is $\alpha$, which the question does not give [^2].
      - text: If $H_a$ is true, the probability of failing to reject $H_0$ is 0.2.
        correct: true
      - text: The probability of committing a Type II error is 0.3.
        why: With power 0.8, the Type II error probability is $\beta = 1 - 0.8 = 0.2$, not 0.3 [^1].
      - text: All of the above are valid conclusions.
        why: Only the statement about failing to reject with probability 0.2 follows from the given power [^1].
    explanation: |
      Power is the probability of rejecting $H_0$ when it is false, and power $= 1 - \beta$,
      where $\beta$ is the probability of a Type II error [^1]. A power of 0.8 against $p = 0.7$
      therefore means $\beta = 0.2$: if $H_a$ ($p = 0.7$) is true, the test fails to reject $H_0$
      with probability 0.2. The question never gives the significance level $\alpha$, the Type I
      error probability [^2], so 0.1 cannot be concluded, and 0.3 is not $1 - 0.8$.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/40
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=40
    status: reviewed
    reviewed_by: claude
  - id: statistics-032
    type: single
    difficulty: medium
    question: The mean thrust of a certain model jet engine is 9500 pounds. Concerned that a production process change might have lowered the thrust, an inspector tests a sample of units, calculating a mean of 9350 pounds with a z-score of -2.46 and a P-value of 0.0069. Which of the following is the most reasonable conclusion?
    options:
      - text: 99.31% of the engines produced under the new process will have a thrust under 9350 pounds.
        why: A P-value comes from the sampling distribution of the mean under $H_0$; it is not a share of individual engines [^1].
      - text: 99.31% of the engines produced under the new process will have a thrust under 9500 pounds.
        why: $1 - 0.0069$ is not a percentage of engines below 9500; the P-value describes sample means assuming $\mu = 9500$ [^1].
      - text: 0.69% of the time an engine produced under the new process will have a thrust over 9500 pounds.
        why: 0.0069 is the chance of a sample mean this low if $\mu = 9500$, not the share of engines above 9500 [^1].
      - text: There is evidence to conclude that the new process is producing engines with a mean thrust under 9500 pounds.
        correct: true
    explanation: |
      The P-value 0.0069 is the probability of getting a sample mean at least this far below
      9500 if the true mean thrust were still 9500 [^1]. A P-value that small is strong evidence
      against $H_0$, so the inspector concludes that the new process has a mean thrust below 9500
      pounds [^1][^2]. A P-value is not a percentage of engines above or below some thrust: it
      is computed from the sampling distribution of the mean under $H_0$, not from individual
      engines.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#making-a-decision
        locator: Lesson 5, Sec. 5.4 p-values (Making a Decision)
    source:
      id: mmlu-redux
      ref: high_school_statistics/41
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=41
    status: reviewed
    reviewed_by: claude
  - id: statistics-033
    type: single
    difficulty: easy
    question: In a group of 10 scores, the largest score is increased by 40 points. What will happen to the mean?
    options:
      - text: It will remain the same.
        why: Raising one value raises the sum, so the mean must change [^1].
      - text: It will increase by 4 points.
        correct: true
      - text: It will increase by 10 points.
        why: 'The sum rises by 40 and is divided by 10 scores: $40/10 = 4$ [^1].'
      - text: It will increase by 40 points.
        why: The mean rises by 40 only if every score rises by 40 [^2].
    explanation: |
      The mean is the sum of the values divided by how many there are [^1]. Raising one score by
      40 raises the sum by 40, so the mean rises by $40/10 = 4$ points, whichever score was
      changed. The mean would go up by 40 only if every score rose by 40 [^2].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-dotplots
        locator: Sec. 5.2 Dot plots and the mean
      - title: 'Data Science Discovery (University of Illinois): Modifying Values in Data and its Effect on Descriptive Statistics'
        url: https://discovery.cs.illinois.edu/guides/Descriptive-Statistics/modifying-descriptive-stats/#The-effect-on-the-mean
        locator: Section 'The effect on the mean'
    source:
      id: mmlu-redux
      ref: high_school_statistics/42
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=42
    status: reviewed
    reviewed_by: claude
  - id: statistics-034
    type: single
    difficulty: medium
    question: A study was conducted to test a new style of keyboard in preventing repetitive stress disorders. Volunteers who have had problems with such injuries were randomly assigned to use either a traditional keyboard or the new design. A significance test was conducted with the alternative hypothesis that a smaller proportion of those using the new keyboard will suffer injuries than those using the traditional keyboard. The resulting P-value was 0.07. Which is a correct interpretation of this P-value?
    options:
      - text: The null hypothesis should be rejected.
        why: No significance level was set, and at the common $\alpha = 0.05$ a P-value of 0.07 would not lead to rejection [^2].
      - text: The null hypothesis should be accepted.
        why: Failing to reject never means accepting $H_0$ [^3].
      - text: There is a 7% chance that the null hypothesis is correct, that is, that the new keyboard is no better.
        why: A P-value is computed assuming $H_0$ is true; it is not the probability that $H_0$ is true [^1].
      - text: If the new keyboard is really no better, there is a 7% chance of a difference between the groups at least as large as the one observed.
        correct: true
    explanation: |
      A P-value is the probability of data at least as favorable to $H_a$ as the observed data,
      computed assuming $H_0$ is true [^1]. Here that is a 7% chance of seeing a difference at
      least this large if the new keyboard really is no better. It is not the probability that
      $H_0$ is true. No significance level was set, so "reject" does not follow automatically:
      you reject only when $p \le \alpha$, and at the common $\alpha = 0.05$ a P-value of 0.07
      would not be enough [^2]. Failing to reject never means accepting $H_0$ [^3].
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#p-value-and-statistical-discernibility
        locator: Sec. 11.3.2 p-value and statistical discernibility
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#making-a-decision
        locator: Lesson 5, Sec. 5.4 p-values (Making a Decision)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-randomization.html#the-us-court-system
        locator: Sec. 11.3.1 The US court system
    source:
      id: mmlu-redux
      ref: high_school_statistics/43
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=43
    status: reviewed
    reviewed_by: claude
  - id: statistics-035
    type: single
    difficulty: easy
    question: A hypothesis test is set up so that $P(\text{rejecting } H_0 \text{ when } H_0 \text{ is true}) = 0.05$ and $P(\text{failing to reject } H_0 \text{ when } H_0 \text{ is false}) = 0.26$. What is the power of the test?
    options:
      - text: '0.26'
        why: 0.26 is $\beta$, the Type II error probability; the power is $1 - \beta$ [^1].
      - text: '0.05'
        why: 0.05 is $\alpha$, the Type I error probability [^2].
      - text: '0.95'
        why: 0.95 is $1 - \alpha$, the chance of not rejecting a true $H_0$, not the power [^2].
      - text: '0.74'
        correct: true
    explanation: |
      $P(\text{fail to reject } H_0 \mid H_0 \text{ false})$ is the Type II error probability
      $\beta = 0.26$, and power is $1 - \beta$ [^1], so the power is $1 - 0.26 = 0.74$. The 0.05
      is $\alpha$, the Type I error probability [^2], and 0.95 is $1 - \alpha$, which is not the
      power.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#power
        locator: Lesson 6, Sec. 6.5 Power
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/44
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=44
    status: reviewed
    reviewed_by: claude
  - id: statistics-036
    type: single
    difficulty: medium
    question: Which of these statements correctly explains bias?
    options:
      - text: It describes a process that creates estimates that are too high on average or too low on average.
        correct: true
      - text: It describes a process that results in a sample that does not represent the population.
        why: Even a random process sometimes yields an unrepresentative sample by chance; bias is a systematic tendency of the estimates [^1][^3].
      - text: It describes a lack of randomization in the sampling process.
        why: Lack of randomization is one possible cause of bias, not its definition [^2].
      - text: It describes a sample that is not representative of the population.
        why: One unrepresentative sample can arise by chance under an unbiased method; bias describes the process, not a single sample [^3].
    explanation: |
      Bias is a systematic tendency to over- or under-estimate the true population value [^1]:
      it is a property of the estimation process, judged by where its estimates land on average.
      The other options describe causes or symptoms rather than the definition. A poor sampling
      method can create bias, which is why sampling bias is defined by the methods used to
      obtain the sample [^2]; and even a random method sometimes yields a sample that is not
      representative, which is chance variation rather than bias [^3].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex#L221
        locator: Sec. 5.1.1 Point estimates and error (LaTeX source, l. 221)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#sampling-bias
        locator: Lesson 1, Sec. 1.2.1 Sampling Bias (Definitions 1.14–1.15)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
