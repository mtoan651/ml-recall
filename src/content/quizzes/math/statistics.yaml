  - id: statistics-098
    type: single
    difficulty: medium
    shuffle: false
    question: To test whether extensive exercise lowers the resting heart rate, a study is performed by randomly selecting half of a group of volunteers to exercise 1 hour each morning, while the rest are instructed to perform no exercise. Is this study an experiment or an observational study?
    options:
      - text: An experiment with a control group and blinding
        why: 'There is a comparison group, but no blinding: every volunteer knows whether they exercise [^2].'
      - text: An experiment with blocking
        why: The volunteers were not grouped by any characteristic before the randomization [^3].
      - text: An observational study with comparison and randomization
        why: The researchers decide who exercises, so this is an experiment [^1].
      - text: None of the above
        correct: true
    explanation: 'The researchers randomly decide who exercises, so this is an experiment, not an observational study [^1]. It has a comparison group, but it is not blinded: every volunteer knows whether they were told to exercise for an hour each morning [^2]. It does not use blocking either, since the volunteers were not first grouped by any characteristic and then randomized within groups [^3]. Each listed description therefore fails.'
    references:
