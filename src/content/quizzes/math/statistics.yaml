      id: openintro-stats
      ref: ch7/7.5-work_backwards_1
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_means/TeX/one-sample_means_with_the_t-distribution.tex
