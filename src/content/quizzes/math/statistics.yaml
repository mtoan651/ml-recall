      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-3.json
    status: draft
  - id: statistics-070
    type: single
    difficulty: medium
    question: What does a kernel density estimate (KDE) plot show, compared with a histogram of the same data?
    options:
      - text: A smooth curve that estimates the distribution
        correct: true
      - text: The exact count of values in each bin
      - text: How two variables change together over time
      - text: Only the outliers of the data
    explanation: |
      Like a histogram, a KDE plot shows the distribution of observations, but as a continuous,
      smooth probability-density curve instead of stepped bars [^1][^2]. It can be less cluttered
      than a histogram, especially when several distributions are overlaid, but its shape depends
      on a smoothing parameter and it can distort bounded or non-smooth data [^2]. Exact counts per
      bin are what a histogram shows, and change over time calls for a line chart [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#density-plots
        locator: 'Lesson 10: Visualizing Distributions, sec. Density plots'
      - title: 'seaborn documentation: seaborn.kdeplot'
        url: https://seaborn.pydata.org/generated/seaborn.kdeplot.html
        locator: description and Notes
    source:
      id: ms-ds-for-beginners
      ref: quiz-19/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-3.json
    status: draft
  - id: statistics-071
    type: single
    difficulty: easy
    question: |
      Which chart shows proportions as a grid of small squares, where each category's share is
      the number of squares in its color?
    options:
      - text: Waffle chart
        correct: true
      - text: Donut chart
      - text: Histogram
      - text: Scatterplot
    explanation: |
      A waffle chart shows quantities as a 2D array of squares colored by category, so each
      category's proportion can be read from how many squares it fills [^1]. A donut chart also shows
      proportions, but as slices of a pie with a hole in the middle [^1]. A histogram shows the
      distribution of a numeric variable in bins [^2], and a scatterplot plots individual points.
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/11-visualization-proportions/README.md#waffles
        locator: 'Lesson 11: Visualizing Proportions, sec. Donuts! and Waffles!'
