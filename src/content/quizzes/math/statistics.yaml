  - id: statistics-011
    type: single
    difficulty: medium
    shuffle: false
    question: Consider the two sets X = {10, 30, 45, 50, 55, 70, 90} and Y = {10, 30, 35, 50, 65, 70, 90}. Which of the following is false?
    options:
      - text: The sets have identical medians.
      - text: The sets have identical means.
      - text: The sets have identical ranges.
      - text: None of the above are false.
        correct: true
    explanation: |
      Check all three claims. Medians: each set has 7 ordered values, so the median is the 4th
      value, 50 in both [^1]. Means: both sums are 350, so each mean is $350/7 = 50$ [^2]. Ranges:
      $90 - 10 = 80$ for both, since range = maximum − minimum [^3]. All three statements are
      true, so none of them is false.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-boxplots
        locator: Sec. 5.5 Box plots, quartiles, and the median
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/explore-numerical.html#sec-dotplots
        locator: Sec. 5.2 Dot plots and the mean
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson02#sec-5-num-sum
        locator: Lesson 2, Sec. 2.2.9 Five Number Summary (Definition 2.20, Range)
    source:
      id: mmlu-redux
      ref: high_school_statistics/7
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=7
