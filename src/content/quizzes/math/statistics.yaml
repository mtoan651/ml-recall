questions:
  - id: statistics-001
    type: single
    difficulty: medium
    shuffle: false
    question: MLE estimates are often undesirable because
    options:
      - text: they are biased
      - text: they have high variance
        correct: true
      - text: they are not consistent estimators
      - text: None of the above
    explanation: |
      Under standard regularity conditions the MLE is consistent: as the sample grows it converges
      to the true parameter value [^1], so a lack of consistency is not the complaint. Some MLEs
      are biased, but most estimators used in practice are at least asymptotically unbiased, with
      the bias shrinking to zero as $n$ grows [^2]. The practical problem is variance: with
      limited data a flexible model fitted by maximum likelihood also fits the noise of its
      particular training set, so refitting on a new sample gives quite different estimates,
      which is overfitting [^3]. That is why a prior (MAP estimation) or a regularizer is added,
      making the estimate less prone to overfitting than plain MLE [^4].
    references:
      - title: 'Wikipedia: Maximum likelihood estimation'
        url: https://en.wikipedia.org/wiki/Maximum_likelihood_estimation#Properties
        locator: Properties (consistency, efficiency)
      - source: d2l
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/statistics.html#statistical-bias
        locator: Sec. 22.10.1.2 Statistical Bias
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 8.1 Bias-variance tradeoff (Fig. 8.7 and following text)
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 9.4 Bayesian statistics and regularization
    source:
      id: mmlu-redux
      ref: machine_learning/29
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=29
    status: draft
  - id: statistics-002
    type: single
    difficulty: medium
    question: Which of the following points would Bayesians and frequentists disagree on?
    options:
      - text: The use of a non-Gaussian noise model in probabilistic regression.
      - text: The use of probabilistic modelling for regression.
      - text: The use of prior distributions on the parameters in a probabilistic model.
        correct: true
      - text: The use of class priors in Gaussian Discriminant Analysis.
    explanation: |
      The split is about how unknown parameters are treated. A frequentist regards $\theta$ as a
      fixed but unknown constant and estimates it with procedures such as maximum likelihood,
      while a Bayesian treats $\theta$ as a random variable and puts a prior distribution
      $p(\theta)$ on it [^1]. A non-Gaussian noise model, or probabilistic regression in general,
      is just a choice of likelihood that both camps use. Class priors in Gaussian discriminant
      analysis are not priors on parameters: $p(y)$ is part of the generative model, and its
      parameter $\phi$ is fitted by maximum likelihood as the fraction of training examples in
      the class [^2].
    references:
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 9.4 Bayesian statistics and regularization
      - title: Stanford CS229 Lecture Notes (Ma & Ng)
        url: https://cs229.stanford.edu/main_notes.pdf
        locator: Sec. 4.1.2 The Gaussian discriminant analysis model
    source:
      id: mmlu-redux
      ref: machine_learning/92
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/machine_learning/test?row=92
    status: draft
  - id: statistics-003
    type: single
    difficulty: easy
    tags:
      - ce6146
      - ce6146-ex01
      - mean
    question: Two measured travel times are 2 minutes and 4 minutes. What is their mean?
    options:
      - text: 2 minutes
      - text: 3 minutes
        correct: true
      - text: 4 minutes
      - text: 6 minutes
        why: 6 is the sum; the mean divides it by the number of values.
    explanation: 'The mean is the sum divided by the count: $(2 + 4) / 2 = 3$ minutes [^1].'
    references:
      - source: ncu-intro-dl
        locator: Lecture 1, slide 58
    source:
      id: ncu-intro-dl
      ref: exercise-01/q12
    status: reviewed
  - id: statistics-004
    type: single
    difficulty: easy
    question: We want to prove that basketball players are taller than average people. We have collected heights of 20 people from both groups. What do we need to do?
    options:
      - text: compare means
      - text: collect more data, 20 is not enough!
      - text: use t-test
        correct: true
    explanation: |
      A gap between two sample means could be nothing more than random variation, so eyeballing
      the means does not prove anything; you need a hypothesis test [^1]. Student's t-test turns
      the difference in means, scaled by the variability, into a t-value, compares it with the
      t-distribution and returns a p-value for judging whether the difference is real [^1]. The
      t-distribution exists for exactly this case, where $\sigma$ has to be estimated from a
      smallish sample [^2], and with small samples it is fine as long as the data show no clear
      outliers, so 20 people per group is workable [^3].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
        locator: "Lesson 4: Statistics and Probability, section 'Hypothesis Testing'"
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
        locator: Sec. 19.2.3 Introducing the t-distribution
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
        locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄
    source:
      id: ms-ds-for-beginners
      ref: quiz-7/q1
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-1.json
    status: draft
  - id: statistics-005
    type: single
    difficulty: easy
    question: "In a histogram, a 'bin' refers to:"
    options:
      - text: the height of a bar
      - text: a grouping of data
        correct: true
      - text: throwaway data
    explanation: |
      A histogram splits the range of a numeric variable into intervals called bins (also called
      classes), counts how many observations fall into each bin, and draws one bar per bin [^1][^2].
      A bin is therefore a grouping of the data by value range. The height of a bar is the count
      (frequency) for its bin, not the bin itself [^1]. No data is thrown away: changing the number
      of bins only changes how finely the values are grouped [^2].
    references:
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/histogra.htm
        locator: Sec. 1.3.3.14 Histogram, Definition
        quote: splitting the range of the data into equal-sized bins (called classes). Then for each bin, the number of points from the data set that fall into each bin are counted.
      - source: ms-ds-for-beginners
        locator: 'Lesson: Visualizing Distributions, Working with histograms'
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
    source:
      id: ms-ds-for-beginners
      ref: quiz-19/q2
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-3.json
    status: draft
  - id: statistics-006
    type: single
    difficulty: easy
    question: What is the purpose of sampling data?
    options:
      - text: Sampling is better than data profiling when looking for errors
      - text: Sampling doesn't serve a purpose
      - text: Sampling is used to analyze data in a large data set because it's hard to analyze all of it
        correct: true
    explanation: |
      Going through every record of a large dataset is slow, so analysts examine a random
      sample and use probability and statistics to draw general conclusions about the whole;
      the more data sampled, the more precise the generalization [^1]. It is the same reason
      studies sample a population instead of taking a census, which is often too expensive or
      impossible [^2]. The lesson does not rank sampling above data profiling for finding errors:
      profiling with descriptive statistics, and checks such as missing-value functions, are
      separate tools for spotting inconsistencies [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
        locator: "Lesson 15: Analyzing, sections 'Sampling and Querying' and 'Exploring to identify inconsistencies'"
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
        locator: Sec. 2.1.1 Populations and samples
    source:
      id: ms-ds-for-beginners
      ref: quiz-29/q3
      url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/quiz-app/src/assets/translations/en/group-4.json
