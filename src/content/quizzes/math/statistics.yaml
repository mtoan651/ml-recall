  - id: statistics-074
    type: single
    difficulty: easy
    question: What does a facet grid (also called small multiples) show?
    options:
      - text: One copy of the same plot for each value of a chosen variable
        correct: true
      - text: All subsets superimposed on one pair of axes
        why: That is a single overlaid plot; a facet grid draws one panel per value [^1].
      - text: One chart with two y-axes that share the x-axis
        why: That is a dual-axis (dual-line) plot, a different technique [^1].
      - text: The outliers of the data, highlighted in color
        why: Facets split the data by a variable; they do not highlight outliers [^1].
    explanation: |
      A facet grid takes one variable, such as the year, and draws the same x-y plot for each of
      its values, so the panels can be compared side by side [^1]. Seaborn calls these lattice or
      small-multiples plots and notes that several simple plots are usually more effective than one
      complex plot [^2]. Superimposing all subsets on one set of axes, or two y-axes sharing one
      x-axis (the lesson's dual-line plot), are different techniques [^1].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/12-visualization-relationships/README.md#facet-grids
        locator: 'Lesson 12: Visualizing Relationships, sec. Facet grids and Dual-line Plots'
      - title: 'seaborn documentation: Visualizing statistical relationships'
        url: https://seaborn.pydata.org/tutorial/relational.html
        locator: sec. Showing multiple relationships with facets
    source:
