  - id: statistics-089
    type: single
    difficulty: medium
    shuffle: false
    question: An insurance company wishes to study the number of years drivers in a large city go between automobile accidents. They plan to obtain and analyze the data from a sample of drivers. Which of the following is a true statement?
    options:
      - text: A reasonable time-and-cost-saving procedure would be to use systematic sampling on an available list of all AAA (Automobile Association of America) members in the city.
      - text: A reasonable time-and-cost-saving procedure would be to randomly choose families, include all drivers in each of these families, and analyze them as a simple random sample of drivers.
      - text: To determine the mean number of years between accidents, randomness in choosing a sample of drivers is not important as long as the sample size is very large.
      - text: None of the above are true statements.
        correct: true
    explanation: 'AAA members are a convenient list, not the population of all drivers in the city, so a systematic sample from that list inherits its undercoverage, a form of selection bias [^1]. Choosing whole families is a cluster sample; drivers in one family share cars and habits, and a cluster sample needs its own, more complicated analysis rather than being treated as a simple random sample [^2]. A very large sample does not cure a non-random selection method: a bigger sample shrinks the margin of error, but the margin of error says nothing about bias [^3]. So none of the three statements is true.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#defining-a-common-language-for-sampling
        locator: Lesson 2, Sec. 2.1 Defining a Common Language for Sampling (sampling frame, undercoverage)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#sec-randomSampEtc
        locator: Lesson 2, Sec. 2.4 Simple Random Sampling and Other Sampling Methods (cluster sampling)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#the-margin-of-error
        locator: Lesson 2, Sec. 2.2 The Beauty of Sampling (The margin of error)
    source:
      id: mmlu-redux
      ref: high_school_statistics/35
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=35
    status: draft
  - id: statistics-090
    type: single
    difficulty: easy
    question: A sports talk show asks listeners to call in and give their opinion of the officiating in the local basketball team's most recent loss. Which opinion is most likely to dominate among the callers, and why?
    options:
      - text: That the officials cost the team the game, because fans angry about the calls are the most likely to phone in.
        correct: true
      - text: A balanced mix of opinions, because any listener of the show is free to call in.
      - text: That the team's own poor play caused the loss, because callers are the team's most knowledgeable fans.
      - text: Support for the officials, because a large number of calls averages out individual biases.
    explanation: The callers select themselves, so this is a volunteer (voluntary-response) sample, a non-probability method whose bias statistical theory cannot correct [^1]. People with strong feelings, here fans angry about the officiating, are the most likely to take the trouble to respond, so they are over-represented [^2]. Being free to call does not make the sample random, and many calls do not cancel a bias built into who chooses to call.
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#non-probability-sampling
        locator: Lesson 2, Sec. 2.4 Simple Random Sampling and Other Sampling Methods (Non-probability Sampling)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#other-sources-of-bias
        locator: Lesson 1, Sec. 1.3 Other Sources of Bias (Example 1.15, restaurant survey)
    source:
      id: mmlu-redux
      ref: high_school_statistics/48
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=48
    status: draft
  - id: statistics-091
    type: single
    difficulty: easy
    question: A manufacturer of motor oil is interested in testing the effects of a newly developed additive on the lifespan of an engine. Twenty-five different engine types are selected at random and each one is tested using oil with the additive and oil without the additive. What type of analysis will yield the most useful information?
    options:
      - text: Matched pairs comparison of population proportions
      - text: Matched pairs comparison of population means
        correct: true
      - text: Independent samples comparison of population proportions
      - text: Independent samples comparison of population means
    explanation: Each engine type is run twice, with and without the additive, so the measurements come in natural pairs and the analysis should use the within-engine differences [^1][^2]. Engine lifespan is a quantitative measurement, so what is compared is a mean (the mean difference), not a proportion. Treating the two sets of runs as independent samples would ignore the pairing and leave the large engine-to-engine variation in the error.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#independent-and-paired-samples
        locator: Lesson 1, Sec. 1.4.3 Independent and Paired Samples
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-paired-means.html
        locator: Ch. 21 Inference for comparing paired means (introduction)
    source:
      id: mmlu-redux
      ref: high_school_statistics/55
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=55
    status: draft
  - id: statistics-092
    type: single
    difficulty: medium
    question: A telephone executive instructs an associate to contact 104 customers using their service to obtain their opinions in regard to an idea for a new pricing package. The associate notes the number of customers whose names begin with A and uses a random number table to pick four of these names. She then proceeds to use the same procedure for each letter of the alphabet and combines the 4 × 26 = 104 results into a group to be contacted. Which of the following is a correct conclusion?
    options:
      - text: Her procedure makes use of chance.
        correct: true
      - text: Her procedure results in a simple random sample.
      - text: Each customer has an equal probability of being included in the survey.
      - text: Her procedure introduces bias through sampling error.
    explanation: "Choosing four names at random within each initial letter is a stratified sample with the letters as strata, so chance is used [^1]. It is not a simple random sample: in an SRS, knowing that one case is in the sample tells you nothing about which others are [^2], but here, once four A-names are drawn, no other A-name can be. Nor does every customer have the same chance of selection, because a customer whose initial is rare competes with few others for that letter's four places. Sampling error is the chance variation between random samples, not a source of bias [^3]."
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#sec-randomSampEtc
        locator: Lesson 2, Sec. 2.4 Simple Random Sampling and Other Sampling Methods (stratified sampling)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-samp-methods
        locator: Sec. 2.1.5 Four sampling methods (simple random sampling)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#the-margin-of-error
        locator: Lesson 2, Sec. 2.2 The Beauty of Sampling (The margin of error)
    source:
      id: mmlu-redux
      ref: high_school_statistics/62
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=62
    status: draft
  - id: statistics-093
    type: single
    difficulty: medium
    shuffle: false
    question: Which of the following is a true statement?
    options:
      - text: In a well-designed, well-conducted sample survey, sampling error is effectively eliminated.
      - text: In a well-designed observational study, responses are influenced through an orderly, carefully planned procedure during the collection of data.
      - text: In a well-designed experiment, the treatments are carefully planned to result in responses that are as similar as possible.
      - text: None of the above is a true statement.
        correct: true
    explanation: 'Sampling error, the chance difference between a sample statistic and the population value, is part of every sample survey: good design removes bias and a larger sample shrinks the margin of error, but it never reaches zero short of a census [^1]. An observational study records data without manipulating anything, so it does not steer the responses [^2]. An experiment assigns treatments in order to compare their effects, keeping everything else alike across groups; it does not plan the treatments so that the responses come out similar [^3]. So none of the three statements is true.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#the-margin-of-error
        locator: Lesson 2, Sec. 2.2 The Beauty of Sampling (The margin of error)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#experimental-and-observational-designs
        locator: Lesson 1, Sec. 1.4 Experimental and Observational Designs
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (controlling)
    source:
      id: mmlu-redux
      ref: high_school_statistics/64
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=64
    status: draft
  - id: statistics-094
    type: single
    difficulty: easy
    question: In an experiment, the control group should receive
    options:
      - text: treatment opposite that given the experimental group.
      - text: the same treatment given the experimental group without knowing they are receiving the treatment.
      - text: a procedure identical to that given the experimental group except for receiving the treatment under examination.
        correct: true
      - text: a procedure identical to that given the experimental group except for a random decision on receiving the treatment under examination.
    explanation: A control group is the baseline condition that does not receive the active treatment; it may get a placebo or nothing at all [^1]. To attribute a difference to the treatment, researchers keep every other part of the procedure the same in both groups, so that the treatment is the only systematic difference [^2]. An 'opposite' treatment is just another treatment, and secretly giving the control group the treatment defeats its purpose. Random assignment decides who is in which group; it is not part of the control group's procedure.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#control-and-placebo-groups
        locator: Lesson 1, Sec. 1.4.4 Control and Placebo Groups
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (controlling)
    source:
      id: mmlu-redux
      ref: high_school_statistics/71
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=71
    status: draft
  - id: statistics-095
    type: single
    difficulty: easy
    question: "A high school sent a survey to a randomly selected sample of 75 of last year's graduating class. 27 of those selected did not return the survey. The best plan of action would be to:"
    options:
      - text: Use the surveys that were returned and change the sample size to 48 for the analysis.
      - text: Use the surveys that were returned and leave the sample size at 75 for the analysis.
      - text: Randomly select 27 additional class members and send the survey to them.
      - text: Follow up with those that did not return the survey to encourage them to respond.
        correct: true
    explanation: The 27 people who did not return the survey may differ systematically from the 48 who did, which is nonresponse bias [^1][^2]. Analyzing only the 48 returns, whether with $n = 48$ or with an inflated $n = 75$, keeps that bias, and mailing the survey to 27 new people just adds more of the kind of people who respond. The remedy is to follow up the nonrespondents and raise the response rate among the people originally selected at random.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sampling-from-a-population
        locator: Sec. 2.1.4 Sampling from a population (non-response bias)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#defining-a-common-language-for-sampling
        locator: Lesson 2, Sec. 2.1 Defining a Common Language for Sampling (low response rate)
    source:
      id: mmlu-redux
      ref: high_school_statistics/77
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=77
    status: draft
  - id: statistics-096
    type: single
    difficulty: easy
    question: A producer of skin care products has created a new formula for its cream to cure acne. To compare the effectiveness of the new cream to that of the old cream, it conducted a double-blind randomized experiment. Volunteers with acne tried the old formula on one side of their face and the new formula on the other, and which side got which formula was determined randomly. The response variable was the difference in the number of pimples (old formula - new formula). Which is the correct significance test to perform?
    options:
      - text: A two-proportion z-test
      - text: A two-sample t-test
      - text: A matched pairs t-test
        correct: true
      - text: A chi-square test of independence
    explanation: 'Each volunteer gets both creams, one on each side of the face, so this is a matched pairs design and the response is the within-person difference (old minus new) [^1]. Paired data are analyzed by treating the differences as one sample, which leads to a one-sample $t$ procedure on the mean difference: the matched pairs $t$-test [^2]. A two-sample $t$-test would wrongly treat the two sides of a face as independent groups, and the two-proportion $z$-test and the chi-square test of independence are for categorical outcomes, not for counts of pimples.'
    references:
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#types-of-research-studies
        locator: Lesson 2, Sec. 2.6 Types of Research Studies (Example 2.6 matched pairs design)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-paired-means.html#sec-mathpaired
        locator: Sec. 21.3 Mathematical model for the mean paired difference
    source:
      id: mmlu-redux
      ref: high_school_statistics/80
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=80
    status: draft
  - id: statistics-097
    type: single
    difficulty: medium
    question: The principal of a school is interested in estimating the average income per family of her students. She selects a random sample of students and collects information about their family income. A 95 percent confidence interval computed from this data for the mean income per family is (\$35,095, \$45,005). Which of the following provides the best interpretation of this confidence interval?
    options:
      - text: 95 percent of the students in her school are from families whose income is between \$35,095 and \$45,005.
      - text: There is a 95% probability that the mean income per family in the school is between \$35,095 and \$45,005.
      - text: If we were to take another sample of the same size and compute a 95 percent confidence interval, we would have a 95% chance of getting the interval (\$35,095, \$45,005).
      - text: We are 95% confident that the mean income per family of all the students in the school is between \$35,095 and \$45,005.
        correct: true
    explanation: "A confidence interval estimates a population parameter, here the mean family income of all the school's students, and is read as 'we are 95% confident that the parameter lies between the endpoints' [^1][^2]. The 95% describes the method: across many random samples, about 95% of the intervals built this way would capture the true mean. Calling this one computed interval a 95% probability statement about the fixed mean is the classic misreading [^1]. The interval also says nothing about where 95% of individual family incomes lie, and another sample would give a different interval."
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#interpreting-confidence-intervals
        locator: Lesson 4, Sec. 4.2.1 Interpreting Confidence Intervals
    source:
      id: mmlu-redux
      ref: high_school_statistics/87
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=87
    status: draft
  - id: statistics-098
    type: single
    difficulty: medium
    shuffle: false
    question: To test whether extensive exercise lowers the resting heart rate, a study is performed by randomly selecting half of a group of volunteers to exercise 1 hour each morning, while the rest are instructed to perform no exercise. Is this study an experiment or an observational study?
    options:
      - text: An experiment with a control group and blinding
      - text: An experiment with blocking
      - text: An observational study with comparison and randomization
      - text: None of the above
        correct: true
    explanation: 'The researchers randomly decide who exercises, so this is an experiment, not an observational study [^1]. It has a comparison group, but it is not blinded: every volunteer knows whether they were told to exercise for an hour each morning [^2]. It does not use blocking either, since the volunteers were not first grouped by any characteristic and then randomized within groups [^3]. Each listed description therefore fails.'
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#experimental-and-observational-designs
        locator: Lesson 1, Sec. 1.4 Experimental and Observational Designs
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson01#blinding
        locator: Lesson 1, Sec. 1.4.5 Blinding
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (blocking)
    source:
      id: mmlu-redux
      ref: high_school_statistics/90
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=90
    status: draft
  - id: statistics-099
    type: single
    difficulty: medium
    question: An experiment was designed to test the effects of three different types of paint on the durability of wooden toys. Because boys and girls tend to play differently with toys, a randomly selected group of children was divided into two groups by sex. Which of the following statements about this experiment is true?
    options:
      - text: There are three types of paint and two sex groups, giving a total of six treatment combinations in this experiment.
      - text: Type of paint is a blocking factor.
      - text: Sex is a blocking factor.
        correct: true
      - text: This is a completely randomized design.
    explanation: 'The treatment factor is the type of paint, with three levels. The children are first split by sex because boys and girls are expected to play differently, and the paints are then assigned within each group, so sex is a blocking factor: a nuisance variable used to remove variation that is not of interest [^1][^2]. Sex is a classification factor that cannot be randomly assigned, so it is not part of the treatments, and there are three treatments, not six [^2]. Because randomization happens within blocks, this is a randomized block design rather than a completely randomized one.'
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sec-principles-experimental-design
        locator: Sec. 2.2.1 Principles of experimental design (blocking)
      - title: 'Penn State STAT 503: Design of Experiments'
        url: https://online.stat.psu.edu/stat503/Lesson01#blocking
        locator: Lesson 1, Sec. 1.2 Blocking and Sec. 1.3 Experimental vs. Classification Factors
    source:
      id: mmlu-redux
      ref: high_school_statistics/94
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=94
    status: draft
