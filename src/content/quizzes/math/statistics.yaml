  - id: statistics-072
    type: single
    difficulty: easy
    question: |
      In a scatterplot of honey price per pound (x-axis) by U.S. state (y-axis), each point is
      colored by its year (the plot's `hue`). What does the color add?
    options:
      - text: 'A third variable: how the price changes over the years'
        correct: true
      - text: Nothing but decoration; the colors carry no data
        why: The colors encode the year, a third variable [^1][^2].
      - text: The temperature at which the honey was stored
        why: The `hue` is mapped to the year, not to any storage temperature [^2].
    explanation: |
      Coloring the points by a third variable adds another dimension to a two-variable scatterplot
      [^1]. In the honey example, mapping the year to color with a sequential palette reveals that
      the price per pound rose year over year in most states [^2]. The colors therefore encode data,
      the year, rather than being decoration or a measured temperature.
    references:
      - title: 'seaborn documentation: Visualizing statistical relationships'
        url: https://seaborn.pydata.org/tutorial/relational.html
