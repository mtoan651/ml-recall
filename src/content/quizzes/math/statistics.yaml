    status: draft
  - id: statistics-069
    type: single
    difficulty: easy
    question: What kind of data does a histogram take as input?
    options:
      - text: Text (categorical) values, plotted directly
      - text: Numeric values, which it groups into bins
        correct: true
      - text: Either kind, with no transformation needed
    explanation: |
      To build a histogram you need numeric data: the chart divides the range of the values into
      bins and counts how many fall into each [^1]. Text values such as a bird's conservation status
      have no numeric range to bin; the lesson first transforms the data and plots a numeric column
      (minimum wingspan) separately for each status [^1]. Counting categories is a job for a bar
      chart instead [^2].
    references:
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#explore-the-dataset-for-distributions-using-text-data
        locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms and Explore the dataset for distributions using text data'
      - source: ms-ds-for-beginners
        url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#explore-bar-charts
        locator: 'Lesson 9: Visualizing Quantities, sec. Explore bar charts'
