  - id: statistics-095
    type: single
    difficulty: easy
    question: "A high school sent a survey to a randomly selected sample of 75 of last year's graduating class. 27 of those selected did not return the survey. The best plan of action would be to:"
    options:
      - text: Use the surveys that were returned and change the sample size to 48 for the analysis.
        why: The 48 who answered may differ systematically from the 27 who did not, so nonresponse bias remains [^1].
      - text: Use the surveys that were returned and leave the sample size at 75 for the analysis.
        why: Using $n = 75$ with only 48 answers misstates the sample size, and the nonresponse bias remains [^1].
      - text: Randomly select 27 additional class members and send the survey to them.
        why: New recipients just add more people who choose to respond; the original nonrespondents stay unheard [^2].
      - text: Follow up with those that did not return the survey to encourage them to respond.
        correct: true
    explanation: The 27 people who did not return the survey may differ systematically from the 48 who did, which is nonresponse bias [^1][^2]. Analyzing only the 48 returns, whether with $n = 48$ or with an inflated $n = 75$, keeps that bias, and mailing the survey to 27 new people just adds more of the kind of people who respond. The remedy is to follow up the nonrespondents and raise the response rate among the people originally selected at random.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/data-design.html#sampling-from-a-population
        locator: Sec. 2.1.4 Sampling from a population (non-response bias)
      - title: 'Penn State STAT 100: Statistical Concepts and Reasoning'
        url: https://online.stat.psu.edu/stat100/Lesson02#defining-a-common-language-for-sampling
        locator: Lesson 2, Sec. 2.1 Defining a Common Language for Sampling (low response rate)
