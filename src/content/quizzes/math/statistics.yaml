  - id: statistics-077
    type: multiple
    difficulty: easy
    question: Which of these does a data scientist do when exploring a dataset? Select all that apply.
    options:
      - text: Draw a random sample to inspect
        correct: true
      - text: Make quick visualizations
        correct: true
      - text: Compute descriptive statistics such as count, mean and quartiles
        correct: true
      - text: Deploy the model to production
        why: Deployment comes long after exploration, which prepares the data for modeling [^1].
    explanation: |
      The exploratory-data-analysis lesson describes data profiling with descriptive statistics
      (for example the pandas `describe()` function), sampling and querying to understand a large
      dataset, and visualizations that reveal patterns, relationships and problems [^1]. Deploying a
      model is not part of exploration; exploration prepares the data for modeling [^1].
    references:
