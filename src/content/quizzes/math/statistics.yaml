  - id: statistics-100
    type: short_answer
    difficulty: easy
    tags:
      - maximum-likelihood
      - exponential-distribution
    question: |
      A nonnegative random variable has density $\alpha e^{-\alpha x}$ for some unknown $\alpha > 0$.
      You observe a single value, $x = 3$. What is the maximum likelihood estimate of $\alpha$?
    answer:
      numeric: 0.3333
      tolerance: 0.001
      hint: a number, 3 decimals
      model: $\frac{d}{d\alpha}(\log\alpha - 3\alpha) = \frac{1}{\alpha} - 3 = 0$, so $\hat{\alpha} = 1/3$
    explanation: |
      For continuous data we maximize the density of the observations, or equivalently minimize the
      negative log-likelihood [^1][^2]. Here
      $-\log p(3 \mid \alpha) = -\log\alpha + 3\alpha$, whose derivative $-1/\alpha + 3$ vanishes at
      $\hat{\alpha} = 1/3$; the second derivative $1/\alpha^2$ is positive, so this is a minimum of
      the negative log-likelihood. In general the MLE of an exponential rate is one over the sample
      mean, here $1/3$.
    references:
      - source: d2l
        locator: Sec. 22.7.3 Maximum Likelihood for Continuous Variables
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#maximum-likelihood-for-continuous-variables
      - source: d2l
        locator: Sec. 22.7.2 Numerical Optimization and the Negative Log-Likelihood
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#numerical-optimization-and-the-negative-log-likelihood
      - source: d2l
        locator: Sec. 22.7.5 Exercises, Exercise 1
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/maximum-likelihood#ex1
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#exercises
    status: reviewed
    reviewed_by: claude
  - id: statistics-101
    type: single
    difficulty: easy
    tags:
      - maximum-likelihood
      - gaussian-distribution
      - squared-loss
    question: |
      Samples $x_1, \dots, x_N$ come from $\mathcal{N}(\mu, 1)$ with unknown mean $\mu$. Which
      statement about the maximum likelihood estimate of $\mu$ is correct?
    options:
      - text: It is the sample mean, as the negative log-likelihood is $\frac{1}{2}\sum_i (x_i - \mu)^2$ plus a constant
        correct: true
      - text: It is the sample median, because the Gaussian density is symmetric about $\mu$
        why: The median is the maximum likelihood estimate of the location under Laplace noise, which leads to absolute errors [^3].
      - text: It is the sample mean only for large $N$; for small samples the estimate is the most frequent value
        why: The derivation gives $\bar{x}$ for every $N$; nothing changes with the sample size [^1].
      - text: It cannot be found without first estimating the variance from the same data
        why: The variance is known here, and in any case the $\mu$ that maximizes a Gaussian likelihood does not depend on $\sigma^2$ [^2].
    explanation: |
      For continuous data we minimize the negative log-likelihood [^1]:
      $-\log p(x_{1:N} \mid \mu) = \frac{N}{2}\log 2\pi + \frac{1}{2}\sum_i (x_i - \mu)^2$. Its derivative
      $-\sum_i (x_i - \mu)$ vanishes at $\hat{\mu} = \frac{1}{N}\sum_i x_i$, the sample mean. Minimizing
      a sum of squared deviations is the same calculation as least squares: with Gaussian noise,
      maximum likelihood and squared loss give the same estimate [^2].
    references:
      - source: d2l
        locator: Sec. 22.7.3 Maximum Likelihood for Continuous Variables
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#maximum-likelihood-for-continuous-variables
      - source: d2l
        locator: Sec. 3.1.3 The Normal Distribution and Squared Loss
        url: https://d2l.ai/chapter_linear-regression/linear-regression.html#the-normal-distribution-and-squared-loss
      - title: 'Wikipedia: Laplace distribution'
        locator: Statistical inference (the MLE of the location is the sample median)
        url: https://en.wikipedia.org/wiki/Laplace_distribution
      - source: d2l
        locator: Sec. 22.7.5 Exercises, Exercise 2
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#exercises
    source:
      id: d2l
      ref: chapter_appendix-mathematics-for-deep-learning/maximum-likelihood#ex2
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/maximum-likelihood.html#exercises
