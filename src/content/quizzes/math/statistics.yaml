  - id: statistics-123
    type: single
    difficulty: medium
    tags:
      - study-design
      - random-assignment
      - scope-of-inference
    question: |
      Researchers recruited 600 asthma patients aged 18–69 who relied on medication (they were not
      randomly sampled) and randomly assigned them either to practise a breathing technique or not.
      The technique group showed a significantly larger reduction in symptoms. Which conclusion is
      justified?
    options:
      - text: It shows a causal effect, but extending it to all such patients assumes the recruits represent them.
        correct: true
      - text: No causal conclusion is possible, because the patients were not a random sample.
        why: Causal conclusions come from random assignment to treatments, which this study used; random sampling matters for generalizing, not for causation.
      - text: It shows a causal effect that holds for all asthma patients aged 18–69, with no further assumptions needed.
        why: Without random sampling, generalizing to the whole population rests on the assumption that the recruited patients are representative.
      - text: It shows only an association, because this is an observational study.
        why: The researchers assigned the treatments, so this is an experiment, not an observational study.
    explanation: |
      Random assignment of the treatment balances other factors between the groups, so a
      significant difference can be attributed to the treatment: randomized experiments are the
      tool for causal conclusions [^1][^2]. Generalizing to a population is a separate question,
      answered by how the subjects were selected; random sampling supports it [^1]. These
      patients were recruited, not randomly sampled, so applying the result to all medicated
      asthma patients aged 18–69 requires assuming that the recruits are representative of them.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/ch_intro_to_data.tex
        locator: Sec. 1.3.3 Sampling from a population; Sec. 1.4 Experiments
      - title: 'Wikipedia: Random assignment'
        url: https://en.wikipedia.org/wiki/Random_assignment
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch1/1.15-scope_buteyko
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/sampling_principles_and_strategies.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-124
    type: single
    difficulty: medium
    tags:
      - study-design
      - observational-study
      - scope-of-inference
    question: |
      A random sample of 200 adults rated many unrelated things (camping, architecture, crossword
      puzzles, …), which gave each person a "dispositional attitude" score. They then read mixed
      reviews of a fictional microwave oven and rated it. People with more positive dispositional
      attitudes rated the oven more positively. Which conclusion is justified?
    options:
      - text: The association generalizes to the sampled population but is not causal.
        correct: true
      - text: Positive dispositions cause positive ratings, and this holds for the whole population.
        why: Nothing was assigned by the researchers, so this is an observational study, which cannot establish causation.
      - text: Positive dispositions cause positive ratings, but only among these 200 people.
        why: An observational study does not establish causation even within the sample, and random sampling does allow generalizing the association.
      - text: Neither generalization nor causation is possible, because no treatment was assigned.
        why: The lack of assignment only rules out causal claims; the random sample still supports generalizing the association to the population.
    explanation: |
      How the cases were chosen and how the explanatory variable arose answer two different
      questions. The participants were randomly sampled, so the association can be generalized to
      the population they were drawn from [^1]. The researchers only measured dispositional
      attitude, they did not assign it, so this is an observational study: other variables could
      explain both ratings, and the result shows an association, not a causal effect [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/ch_intro_to_data.tex
        locator: Sec. 1.3.3 Sampling from a population; Sec. 1.3.4 Observational studies
      - title: 'Wikipedia: Observational study'
        url: https://en.wikipedia.org/wiki/Observational_study
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch1/1.25-scope_haters
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/sampling_principles_and_strategies.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-125
    type: single
    difficulty: medium
    tags:
      - sampling-methods
      - cluster-sampling
      - stratified-sampling
    question: |
      A university wants to estimate the fraction of its undergraduates who support a new \$25
      annual fee. Which of these sampling plans is NOT reasonable?
    options:
      - text: Randomly pick three ages (say 19, 20 and 23) and survey every student of those ages.
        correct: true
      - text: Survey a simple random sample of 500 undergraduates.
        why: A simple random sample gives every student the same chance of selection, which is a sound plan.
      - text: Group students by field of study and randomly sample 10% of the students within each field.
        why: This is stratified sampling; opinions may differ by field, and sampling within every field ensures each is represented.
      - text: Group students by year of study and randomly sample 5% of the students within each year.
        why: This is also stratified sampling, which represents every year of study and is a reasonable plan.
    explanation: |
      Picking whole groups is cluster sampling, which works best when each cluster is diverse,
      like a small copy of the population, and the clusters resemble each other [^1][^2]. Students
      of the same age probably hold similar views, so three age clusters can miss whole groups of
      opinion, and the clusters also differ greatly in size. Stratified sampling is the opposite
      case: it samples from every group and works best when each stratum is internally similar
      [^1].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/ch_intro_to_data.tex
        locator: Sec. 1.3.5 Four sampling methods
      - title: 'Wikipedia: Cluster sampling'
        url: https://en.wikipedia.org/wiki/Cluster_sampling
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch1/1.23-evaluate_sampling_methods
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/sampling_principles_and_strategies.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-126
    type: multiple
    difficulty: medium
    tags:
      - experimental-design
      - blocking
      - scope-of-inference
    question: |
      In a study, 38 men and 38 women volunteered. Within each sex, half were randomly assigned to
      eat 25 g of chia seeds twice a day and the other half to a placebo, and the participants did
      not know which they received. After 12 weeks there was no significant difference in weight
      loss between the groups. Which statements are true? Select all that apply.
    options:
      - text: Sex was used as a blocking variable.
        correct: true
      - text: Had a significant difference been found, the random assignment would have allowed attributing it to the seeds.
        correct: true
      - text: Because the participants volunteered, this is an observational study.
        why: The researchers assigned the treatments at random, which makes it an experiment; volunteering affects whom the results generalize to, not the type of study.
      - text: Because the treatments were randomly assigned, the conclusion can be generalized to all adults.
        why: Random assignment supports causal conclusions; generalizing to a population needs a representative sample, and these participants were volunteers.
    explanation: |
      Splitting the participants by sex first and then randomizing within each group is blocking:
      it guarantees that both treatment groups contain equal numbers of men and women [^1][^2].
      Because the researchers randomly assigned the treatments, this is a randomized experiment, so
      a difference between the groups could be attributed to the seeds [^1]. The placebo kept the
      participants blind to their treatment [^1]. The participants were volunteers rather than a
      random sample, so the findings do not automatically extend to all adults [^1].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/ch_intro_to_data.tex
        locator: Sec. 1.4.1 Principles of experimental design; Sec. 1.4.2 Reducing bias in human experiments
      - title: 'Wikipedia: Blocking (statistics)'
        url: https://en.wikipedia.org/wiki/Blocking_(statistics)
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch1/1.37-chia_weight_lostt
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-127
    type: single
    difficulty: easy
    tags:
      - study-design
      - comparison-group
      - confounding
    question: |
      An orthopedist gives a questionnaire to 30 of his patients who have no joint problems and
      finds that 20 of them run regularly. He concludes that running lowers the risk of joint
      problems. What is the main flaw in this reasoning?
    options:
      - text: He has no comparison of joint problems between runners and non-runners.
        correct: true
      - text: 30 patients are too few; the same design with 300 patients would support his conclusion.
        why: A larger sample of people without joint problems still has no comparison group, and confounding would remain.
      - text: He should have reported the proportion 20/30 with a confidence interval.
        why: An interval would describe the uncertainty of 2/3, but it still could not compare runners with non-runners.
      - text: He should have measured running in hours per week instead of yes/no.
        why: A finer measurement does not fix the missing comparison group.
    explanation: |
      To link running with the risk of joint problems you need the rate of joint problems among
      runners and among non-runners; a sample of people who all lack joint problems cannot provide
      that comparison. Even with such data, the study would be observational: people who run may
      differ in other ways, for example be healthier or younger, and such confounding variables
      could explain the association [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/ch_intro_to_data.tex
        locator: Sec. 1.3.4 Observational studies
      - title: 'Wikipedia: Confounding'
        url: https://en.wikipedia.org/wiki/Confounding
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch1/1.39-flawed_reasoning
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_intro_to_data/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-128
    type: short_answer
    difficulty: hard
    tags:
      - standard-deviation
      - sample-variance
      - updating-statistics
    question: |
      In a class of 25, 24 students took an exam and scored a mean of 74 with a standard deviation
      of 8.9 (the sample SD, dividing by $n - 1$). The last student takes a make-up exam and scores
      64. What is the standard deviation of all 25 scores, again dividing by $n - 1$?
    answer:
      numeric: 8.94
      tolerance: 0.01
      hint: 2 decimals
      model: Sum of squared deviations $= 23 \times 8.9^2 + \frac{24}{25}(64 - 74)^2 = 1821.83 + 96 = 1917.83$; $s = \sqrt{1917.83/24} \approx 8.94$
    explanation: |
      The sample variance is the sum of squared deviations from the mean divided by $n - 1$ [^1],
      so the 24 scores have a sum of squares of $23 \times 8.9^2 = 1821.83$. Adding one value $x$
      to $n$ values increases this sum by $\frac{n}{n+1}(x - \bar x_n)^2$ [^2], here
      $\frac{24}{25} \times 10^2 = 96$, so the new SD is $\sqrt{1917.83/24} \approx 8.94$ (the
      mean drops to 73.6). The SD rises only slightly: a new value increases the variance exactly
      when it lies farther than $s\sqrt{(n+1)/n} = 8.9\sqrt{25/24} \approx 9.08$ from the old
      mean [^2], and 64 is 10 points away.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_summarizing_data/TeX/ch_summarizing_data.tex
        locator: Sec. 2.1.4 Variance and standard deviation
      - title: 'Wikipedia: Variance'
        url: https://en.wikipedia.org/wiki/Variance#Effect_of_adding_one_observation_on_variance
        locator: Sample variance, Effect of adding one observation on variance
    source:
      id: openintro-stats
      ref: ch2/2.27-makeup_exam
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_summarizing_data/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-129
    type: short_answer
    difficulty: easy
    tags:
      - independence
      - expected-count
      - randomization-test
    question: |
      An observational study followed diabetes patients on one of two drugs: 2,593 of 67,593
      patients on drug R and 5,386 of 159,978 patients on drug P had serious cardiovascular
      problems. If the drug and the outcome were independent, how many of the drug-R patients
      would you expect to have had cardiovascular problems?
    answer:
      numeric: 2370
      tolerance: 1
      hint: a whole number
      model: $67{,}593 \times \dfrac{7{,}979}{227{,}571} \approx 2370$
    explanation: |
      Under independence both groups share the overall rate of problems,
      $7{,}979 / 227{,}571 \approx 3.5\%$, so the expected count in the drug-R group is
      $67{,}593 \times 0.035 \approx 2370$ [^1]. Equivalently, the expected count of a cell is its
      row total times its column total divided by the grand total [^2]. The observed 2,593 is
      higher; a randomization test checks whether a gap this large is plausible by repeatedly
      shuffling the outcomes between the two groups [^1]. Because the study is observational, even
      a real difference would show association, not causation.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_summarizing_data/TeX/ch_summarizing_data.tex
        locator: 'Sec. 2.3 Case study: malaria vaccine (2.3.2 Simulating the study; 2.3.3 Checking for independence)'
      - title: "Wikipedia: Pearson's chi-squared test"
        url: https://en.wikipedia.org/wiki/Pearson%27s_chi-squared_test#Testing_for_statistical_independence
        locator: Testing for statistical independence
    source:
      id: openintro-stats
      ref: ch2/2.25-randomization_avandia
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_summarizing_data/TeX/case_study_malaria_vaccine.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-130
    type: short_answer
    difficulty: easy
    tags:
      - standard-error
      - proportion
      - point-estimate
    question: |
      To estimate the rate of severely defective chips, an engineer randomly samples 212 chips from
      a week's production and finds 27 defective. What is the standard error of the sample
      proportion?
    answer:
      numeric: 0.023
      tolerance: 0.001
      hint: 3 decimals
      model: $\hat p = 27/212 \approx 0.127$, $SE \approx \sqrt{0.127 \times 0.873 / 212} \approx 0.023$
    explanation: |
      The standard error of a sample proportion is $\sqrt{p(1 - p)/n}$; since $p$ is unknown, the
      point estimate $\hat p = 27/212 \approx 0.127$ is plugged in [^1][^2], giving
      $\sqrt{0.127 \times 0.873 / 212} \approx 0.023$. A historical defect rate of 10% is only
      about $(0.127 - 0.10)/0.023 \approx 1.2$ standard errors away, so this week's rate is not
      surprising. Using $p = 0.10$ in the formula gives 0.021, almost the same.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex
        locator: Sec. 5.1.3 Central Limit Theorem; Sec. 5.1.4 Applying the Central Limit Theorem to a real-world setting
      - title: 'Wikipedia: Standard error'
        url: https://en.wikipedia.org/wiki/Standard_error
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch5/5.3-comp_chips_quality_ctrl_prop
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/variability_in_estimates.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-131
    type: multiple
    difficulty: medium
    tags:
      - confidence-interval
      - interpretation
      - margin-of-error
    question: |
      From a simple random sample of 64 emergency-room patients, a hospital computes a 95%
      confidence interval of (128, 147) minutes for the mean waiting time, using the normal model
      for the sample mean. Which statements are true? Select all that apply.
    options:
      - text: We are 95% confident that the mean waiting time of all patients at this ER is between 128 and 147 minutes.
        correct: true
      - text: The sample mean is 137.5 minutes and the margin of error is 9.5 minutes.
        correct: true
      - text: 95% of random samples of 64 patients would have a sample mean between 128 and 147 minutes.
        why: The confidence level describes how often intervals built this way capture the population mean, not where 95% of sample means fall.
      - text: Halving the margin of error would require doubling the sample size.
        why: The margin of error shrinks like $1/\sqrt{n}$, so halving it requires four times as many patients.
    explanation: |
      A confidence interval is a range of plausible values for a population parameter, here the
      mean waiting time of all patients, not a statement about this sample or about other samples'
      means [^1][^2]. An interval from the normal model is centred on the point estimate, so the
      sample mean is the midpoint $(128 + 147)/2 = 137.5$ and the margin of error is half the width,
      9.5 [^1]. The standard error is $s/\sqrt{n}$, so cutting the margin of error in half requires
      $2^2 = 4$ times the sample size [^1].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex
        locator: Sec. 5.2.2 Constructing a 95% confidence interval; Sec. 5.2.5 Interpreting confidence intervals
      - title: 'Wikipedia: Confidence interval'
        url: https://en.wikipedia.org/wiki/Confidence_interval#Common_misunderstandings
        locator: Common misunderstandings
    source:
      id: openintro-stats
      ref: ch5/5.11-er_wait_intro_prop_ok
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/confidence_intervals.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-132
    type: single
    difficulty: medium
    tags:
      - type-ii-error
      - significance-level
      - decision-errors
    question: |
      A food-safety inspector tests $H_0$: the restaurant meets sanitation regulations, against
      $H_A$: it does not; rejecting $H_0$ means the restaurant's licence is revoked. For diners,
      a Type 2 error is the more harmful mistake. From the diners' point of view, how should the
      significance level $\alpha$ be chosen?
    options:
      - text: Larger, so that less evidence is needed to revoke a licence
        correct: true
      - text: Smaller, because a smaller $\alpha$ reduces the chance of a Type 2 error
        why: For a fixed sample, a smaller $\alpha$ makes rejection harder, which increases the chance of a Type 2 error.
      - text: It does not matter, because $\alpha$ controls only Type 1 errors
        why: The two error rates trade off; making rejection easier (larger $\alpha$) lowers the chance of missing a real violation.
      - text: Always 0.05, whatever the costs of the two errors
        why: 0.05 is a convention; the significance level should reflect the consequences of each type of error.
    explanation: |
      Here a Type 2 error means concluding that the restaurant meets the regulations, so it stays
      open, when it actually does not; a Type 1 error means closing a restaurant that is in fact
      safe [^1][^2]. When a Type 2 error is more dangerous or costly than a Type 1 error, a higher
      significance level such as 0.10 is appropriate: rejecting $H_0$ becomes easier, which lowers
      the Type 2 error rate at the price of more Type 1 errors [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex
        locator: Sec. 5.3.3 Decision errors; Sec. 5.3.5 Choosing a significance level
      - title: 'Wikipedia: Type I and type II errors'
        url: https://en.wikipedia.org/wiki/Type_I_and_type_II_errors#Error_rate
        locator: Error rate; The quality of hypothesis test
    source:
      id: openintro-stats
      ref: ch5/5.29-errors_food_safety
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-133
    type: single
    difficulty: medium
    tags:
      - p-value
      - interpretation
      - two-proportion-test
    question: |
      In a poll, 27% of 1,145 unemployed and 25% of 675 underemployed adults said their job
      situation had caused major problems in their close relationships. A test of $H_0$: the two
      population proportions are equal gives a two-sided p-value of about 0.35. Which statement
      correctly interprets this p-value?
    options:
      - text: If the proportions were equal, a gap of 2 points or more would occur in about 35% of samples.
        correct: true
      - text: There is a 35% probability that the two population proportions are equal, given these data.
        why: A p-value is computed assuming $H_0$ is true; it is not the probability that $H_0$ is true.
      - text: There is a 65% probability that the two population proportions differ.
        why: One minus the p-value is not the probability that $H_A$ is true either.
      - text: About 35% of the observed 2-point difference between the sample proportions is due to chance alone.
        why: A p-value is not a share of the observed difference; it is a tail probability computed under $H_0$.
    explanation: |
      The p-value is the probability, computed assuming the null hypothesis is true, of observing
      data at least as favourable to the alternative as the data actually observed [^1][^2]. Here
      it says that if the two population proportions were equal, sampling variability alone would
      produce a difference of at least 2 percentage points (in either direction) about 35% of the
      time. That is common, so we fail to reject $H_0$: the data give no convincing evidence of a
      difference [^1].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex
        locator: Sec. 5.3.4 Formal testing using p-values
      - title: 'Wikipedia: P-value'
        url: https://en.wikipedia.org/wiki/P-value#Definition
        locator: Definition; Usage, Misuse
    source:
      id: openintro-stats
      ref: ch5/5.31-unemployment_relationship
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-134
    type: true_false
    difficulty: easy
    tags:
      - statistical-significance
      - practical-significance
      - sample-size
    question: |
      True or false: with very large samples, even a tiny difference between the null value and
      the point estimate can be statistically significant.
    options:
      - text: 'True'
        correct: true
      - text: 'False'
        why: The standard error shrinks as the sample grows, so with enough data any nonzero difference gives a large test statistic.
    explanation: |
      The test statistic divides the difference between the point estimate and the null value by
      the standard error, which shrinks like $1/\sqrt{n}$. As the sample grows, even a very small
      difference eventually lies many standard errors from the null value and becomes
      statistically significant [^1]. Such a result may still have no practical value, which is why
      statistical significance and practical significance must be judged separately [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/ch_foundations_for_inf.tex
        locator: Sec. 5.3.6 Statistical significance versus practical significance
      - title: 'Wikipedia: Statistical significance'
        url: https://en.wikipedia.org/wiki/Statistical_significance#Limitations
        locator: Limitations
    source:
      id: openintro-stats
      ref: ch5/5.35-prac_stat_sig
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_foundations_for_inf/TeX/review_exercises.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-135
    type: multiple
    difficulty: medium
    tags:
      - sampling-distribution
      - success-failure-condition
      - standard-error
    question: |
      Suppose 8% of college students are vegetarians, and $\hat p$ is the proportion of
      vegetarians in a random sample of $n$ students. Which statements are true? Select all that
      apply.
    options:
      - text: With $n = 50$, the sampling distribution of $\hat p$ is right-skewed.
        correct: true
      - text: With $n = 250$, a sample with $\hat p = 0.12$ would be unusual, more than 2 standard errors above 0.08.
        correct: true
      - text: With $n = 60$, the sampling distribution of $\hat p$ is nearly normal because $n \ge 30$.
        why: For a proportion the condition is at least 10 expected successes and 10 expected failures; $60 \times 0.08 = 4.8$ is too few.
      - text: Increasing $n$ from 125 to 250 cuts the standard error of $\hat p$ in half.
        why: The standard error is proportional to $1/\sqrt{n}$, so doubling $n$ divides it by $\sqrt 2 \approx 1.41$; halving it needs four times the sample.
    explanation: |
      $\hat p$ is nearly normal only when the observations are independent and the sample has at
      least 10 expected successes and 10 expected failures, $np \ge 10$ and $n(1 - p) \ge 10$
      [^1]. With $n = 50$ we expect only 4 vegetarians; $\hat p$ is bounded below by 0 but can be
      much larger than 0.08, so its distribution is right-skewed [^1]. With $n = 250$ the
      condition holds and $SE = \sqrt{0.08 \times 0.92 / 250} \approx 0.0172$, so $\hat p = 0.12$
      lies $(0.12 - 0.08)/0.0172 \approx 2.3$ standard errors above the mean [^1][^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.1.1 Identifying when the sample proportion is nearly normal
      - title: 'Wikipedia: Standard error'
        url: https://en.wikipedia.org/wiki/Standard_error
        locator: Introduction
    source:
      id: openintro-stats
      ref: ch6/6.1-veg_coll_students_CLT
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/inference_for_a_single_proportion.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-136
    type: short_answer
    difficulty: medium
    tags:
      - hypothesis-test
      - one-proportion
      - p-value
    question: |
      80 people who say they can tell diet soda from regular soda each taste one cup, which is
      diet or regular by random assignment; 53 of them identify it correctly. Using the normal
      approximation, what is the two-sided p-value for testing $H_0: p = 0.5$ (pure guessing)?
    answer:
      numeric: 0.0036
      tolerance: 0.0003
      hint: a probability, 4 decimals
      model: $\hat p = 53/80 = 0.6625$, $SE = \sqrt{0.5 \times 0.5 / 80} \approx 0.0559$, $Z \approx 2.91$, p-value $= 2 \times 0.0018 \approx 0.0036$
    explanation: |
      In a test for one proportion the standard error is computed with the null value,
      $\sqrt{0.5 \times 0.5 / 80} \approx 0.0559$, and the success-failure condition holds (40
      expected correct and 40 incorrect) [^1]. Then $Z = (0.6625 - 0.5)/0.0559 \approx 2.91$, the
      upper tail area is about 0.0018, and the two-sided p-value doubles it to about 0.0036
      [^1][^2]. Since it is below 0.05, we reject $H_0$: these people do better than random
      guessing. (The exact binomial test gives 0.0049, the same conclusion.)
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.1.3 Hypothesis testing for a proportion
      - title: 'Wikipedia: P-value'
        url: https://en.wikipedia.org/wiki/P-value#Definition
        locator: Definition (one- and two-sided p-values)
    source:
      id: openintro-stats
      ref: ch6/6.13-taste_test_HT_2_sided
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/inference_for_a_single_proportion.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-137
    type: short_answer
    difficulty: medium
    tags:
      - sample-size
      - margin-of-error
      - proportion
    question: |
      A poll found that 55% of Independents support a health plan. How many Independents should a
      new poll sample to estimate this proportion within 1 percentage point with 90% confidence,
      using 0.55 as the planning value?
    answer:
      accept:
        - '6697'
        - '6698'
      hint: a whole number (round up)
      model: $n \ge \left(\dfrac{1.6449}{0.01}\right)^2 \times 0.55 \times 0.45 \approx 6696.6$, so $n = 6697$ (6698 with $z^\star = 1.645$)
    explanation: |
      The margin of error of a sample proportion is $z^\star\sqrt{p(1 - p)/n}$; with
      $z^\star = 1.6449$ for 90% confidence, requiring it to be at most 0.01 gives
      $n \ge z^{\star 2}\,p(1 - p)/0.01^2 \approx 6696.6$ [^1][^2]. Sample sizes are rounded up,
      so at least 6,697 Independents are needed (6,698 with $z^\star$ rounded to 1.645);
      rounding down to 6,696 would leave the margin of error slightly above 1 point. Halving
      the margin of error always requires about four times the sample.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.1.5 Choosing a sample size when estimating a proportion
      - title: 'Wikipedia: Sample size determination'
        url: https://en.wikipedia.org/wiki/Sample_size_determination#Estimation_of_a_proportion
        locator: Estimation of a proportion
    source:
      id: openintro-stats
      ref: ch6/6.15-national_health_plan_CI_sample_size_replaced
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/inference_for_a_single_proportion.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-138
    type: short_answer
    difficulty: hard
    tags:
      - two-proportion-test
      - pooled-proportion
      - z-statistic
    question: |
      In a random sample of California voters asked about offshore drilling, 104 of 438 college
      graduates and 131 of 389 non-graduates answered "do not know". You test whether the two
      population proportions answering "do not know" differ. Using the pooled proportion, what is
      the Z statistic for graduates minus non-graduates?
    answer:
      numeric: -3.16
      tolerance: 0.03
      hint: 2 decimals, with its sign
      model: $\hat p_1 = 0.237$, $\hat p_2 = 0.337$, $\hat p_{pool} = 235/827 = 0.284$; $SE = \sqrt{0.284 \times 0.716 \times (1/438 + 1/389)} \approx 0.0315$; $Z = (0.237 - 0.337)/0.0315 \approx -3.16$
    explanation: |
      Under $H_0: p_1 = p_2$ both groups share one proportion, best estimated by pooling:
      $\hat p_{pool} = (104 + 131)/(438 + 389) = 235/827 \approx 0.284$. This pooled value is used
      both for the success-failure check and in the standard error,
      $\sqrt{\hat p_{pool}(1 - \hat p_{pool})(1/n_1 + 1/n_2)} \approx 0.0315$ [^1][^2]. With
      $\hat p_1 = 0.237$ and $\hat p_2 = 0.337$, $Z \approx -0.0994/0.0315 \approx -3.16$, a
      two-sided p-value of about 0.002, so the proportions differ: fewer graduates say "do not
      know". (Rounding the intermediate values gives about −3.18.)
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.2.3 Hypothesis tests for the difference of two proportions
      - title: 'Wikipedia: Two-proportion Z-test'
        url: https://en.wikipedia.org/wiki/Two-proportion_Z-test#Hypothesis_test
        locator: Hypothesis test (pooled proportion in the standard error)
    source:
      id: openintro-stats
      ref: ch6/6.23-offshore_drill_edu_dontknow_HT
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/difference_of_two_proportions.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-139
    type: short_answer
    difficulty: hard
    tags:
      - chi-square-test
      - independence
      - two-way-table
    question: |
      A random sample of California voters was asked whether they support drilling for oil and gas
      off the coast:

      | Response | College graduate | Not a graduate |
      | --- | --- | --- |
      | Support | 154 | 132 |
      | Oppose | 180 | 126 |
      | Do not know | 104 | 131 |
      | Total | 438 | 389 |

      What is the chi-square statistic for testing whether the response is independent of being a
      college graduate?
    answer:
      numeric: 11.46
      tolerance: 0.05
      hint: 2 decimals
      model: Expected counts (row total × column total / 827) are 151.5, 134.5, 162.1, 143.9, 124.5, 110.5; $\chi^2 = \sum (O - E)^2 / E \approx 11.46$ with $df = 2$
    explanation: |
      Under independence, each cell's expected count is its row total times its column total
      divided by the table total; for example, $286 \times 438 / 827 \approx 151.5$ [^1][^2]. The
      statistic sums $(O - E)^2/E$ over all six cells, $\chi^2 \approx 11.46$, with
      $df = (3 - 1)(2 - 1) = 2$ [^1][^2]. All expected counts are well above 5, and the p-value is
      about 0.003, so there is strong evidence that opinion on drilling is associated with having
      a college degree.
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.4.1 Expected counts in two-way tables; Sec. 6.4.2 The chi-square test for two-way tables
      - title: "Wikipedia: Pearson's chi-squared test"
        url: https://en.wikipedia.org/wiki/Pearson%27s_chi-squared_test#Testing_for_statistical_independence
        locator: Testing for statistical independence
    source:
      id: openintro-stats
      ref: ch6/6.37-offshore_drilling_chisq_indep
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/testing_for_independence_in_two-way_tables.tex
    status: reviewed
    reviewed_by: claude
  - id: statistics-140
    type: single
    difficulty: medium
    tags:
      - two-proportion-test
      - independence
      - paired-data
    question: |
      A teacher asks her students at the start and at the end of the semester whether more active
      learning in class would help them learn, and wants to know whether the proportion answering
      "yes" changed. Why is the two-proportion Z-test for independent samples not appropriate?
    options:
      - text: The same students answer twice, so the two samples are not independent.
        correct: true
      - text: A proportion measured at two times cannot be compared with any hypothesis test.
        why: Proportions can be compared over time; the problem is the dependence between two answers from the same student, which needs a method for paired data.
      - text: A two-proportion test requires the two groups to have different sample sizes.
        why: The two-proportion test allows equal or different sample sizes; neither makes it valid here.
      - text: Yes/no answers are categorical, so a $t$-test for means is required instead.
        why: Yes/no answers are exactly what proportion methods handle; a $t$-test compares means of numerical data.
    explanation: |
      Methods for a difference of two proportions require the data to be independent within and
      between the two groups, for example two independent random samples [^1]. Here each student
      answers twice, and a student's two answers are related, so the samples are paired. Paired
      yes/no data call for a different method, such as McNemar's test, which uses the students
      whose answers changed [^2].
    references:
      - source: openintro-stats
        url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/ch_inference_for_props.tex
        locator: Sec. 6.2.1 Sampling distribution of the difference of two proportions (independence, extended)
      - title: "Wikipedia: McNemar's test"
        url: https://en.wikipedia.org/wiki/McNemar%27s_test
        locator: Introduction and Definition
    source:
      id: openintro-stats
      ref: ch6/6.39-active_learning_HT_concept
      url: https://github.com/OpenIntroStat/openintro-statistics/blob/fee25091fb24e89c36296fd67c48c1fcf7a93b6e/ch_inference_for_props/TeX/review_exercises.tex
