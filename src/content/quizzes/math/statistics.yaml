  - id: statistics-055
    type: single
    difficulty: medium
    shuffle: false
    question: Both over-the-counter niacin and the prescription drug Lipitor are known to lower blood cholesterol levels. In one double-blind study Lipitor outperformed niacin. The 95% confidence interval estimate of the difference in mean cholesterol level lowering was (18, 41). Which of the following is a reasonable conclusion?
    options:
      - text: Niacin lowers cholesterol an average of 18 points, while Lipitor lowers cholesterol an average of 41 points.
        why: 18 and 41 are the endpoints of the interval for the difference in means, not the two means [^1].
      - text: There is a 0.95 probability that Lipitor will outperform niacin in lowering the cholesterol level of any given individual.
        why: A confidence interval is about the population mean difference, not about any given individual [^2].
      - text: There is a 0.95 probability that Lipitor will outperform niacin by at least 23 points in lowering the cholesterol level of any given individual.
        why: The interval says nothing about individuals, and 23 is only its width [^2].
      - text: None of the above.
        correct: true
    explanation: |
      The interval estimates the difference between the two population mean reductions: we are
      95% confident that, on average, Lipitor lowers cholesterol by 18 to 41 points more than
      niacin [^1]. It does not say niacin's mean is 18 and Lipitor's is 41; those are the
      endpoints for the difference. It also says nothing about any given individual, because a
      confidence interval only tries to capture a population parameter, not individual
      observations [^1][^2]. So none of the listed statements is a reasonable conclusion.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#interpreting-confidence-intervals
        locator: Sec. 13.6.3 Interpreting confidence intervals
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-mean.html#one-sample-t-intervals
        locator: Sec. 19.2.4 One sample t-intervals (Guided Practice on croaker white fish, footnote 8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/84
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=84
    status: reviewed
    reviewed_by: claude
  - id: statistics-056
    type: single
    difficulty: medium
    question: The Department of Health plans to test the lead level in a specific park. Because a high lead level is harmful to children, the park will be closed if the lead level exceeds the allowed limit. The department randomly selects several locations in the park, gets soil samples from those locations, and tests the samples for their lead levels. Which of the following decisions would result from the type I error?
    options:
      - text: Closing the park when the lead levels are within the allowed limit
        correct: true
      - text: Keeping the park open when the lead levels are in excess of the allowed limit
        why: 'This fails to reject a false $H_0$: a Type II error [^2].'
      - text: Closing the park when the lead levels are in excess of the allowed limit
        why: Closing a park whose lead level is too high is a correct decision [^2].
      - text: Keeping the park open when the lead levels are within the allowed limit
        why: Keeping a safe park open is a correct decision [^2].
    explanation: |
      The null hypothesis is the no-problem statement, that the lead level is within the allowed
      limit, and the park is closed only if the data reject it [^1]. A Type I error is rejecting
      $H_0$ when it is actually true [^2], so here it means closing the park even though the lead
      level is within the limit. Keeping the park open when lead is too high would be a Type II
      error, and the other two options are correct decisions [^2].
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson05#writing-hypotheses
        locator: Lesson 5, Sec. 5.2 Writing Hypotheses (Definitions 5.2–5.3)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson06#type-i-and-type-ii-errors
        locator: Lesson 6, Sec. 6.1 Type I and Type II Errors
    source:
      id: mmlu-redux
      ref: high_school_statistics/85
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=85
    status: reviewed
    reviewed_by: claude
  - id: statistics-057
    type: single
    difficulty: medium
    question: You need to construct a 94% confidence interval for a population proportion. What is the upper critical value of z to be used in constructing this interval?
    options:
      - text: '0.9699'
        why: 0.9699 is the area to the left of 1.88, a probability rather than a z-score [^2].
      - text: '1.96'
        why: 1.96 is the critical value for 95% confidence [^1].
      - text: '1.555'
        why: 1.555 puts all 6% in one tail; a two-sided interval leaves 3% in each [^1].
      - text: '1.88'
        correct: true
    explanation: |
      For confidence level $C$, choose $z^\star$ so that the area between $-z^\star$ and
      $z^\star$ under the standard normal equals $C$ [^1]. For 94%, the two tails hold 6% in
      total, 3% each, so $z^\star$ is the 97th percentile; the normal table shows an area of about
      0.47 between 0 and 1.88, so $z^\star \approx 1.88$ [^2]. 1.96 belongs to 95% confidence,
      0.9699 is a probability rather than a z-score, and 1.555 would put all 6% in one tail.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/inference-one-prop.html#changing-the-confidence-level
        locator: Sec. 16.2.4 Changing the confidence level (Figure 16.2)
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 1.8)
    source:
      id: mmlu-redux
      ref: high_school_statistics/89
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=89
    status: reviewed
    reviewed_by: claude
  - id: statistics-058
    type: single
    difficulty: easy
    question: The observed times (in minutes) it takes a runner to complete a marathon are normally distributed. The z-score for his running time this week is –2. Which one of the following statements is a correct interpretation of his z-score?
    options:
      - text: This week his time was two minutes lower than his time last week.
        why: A z-score is measured from the mean of his times, in standard deviations, not from last week [^1].
      - text: This week his time was two minutes lower than his best time ever.
        why: A z-score is measured from the mean, not from his best time, and it is not in minutes [^1].
      - text: This week his time was two minutes lower than his average time.
        why: A z-score counts standard deviations, not minutes [^1].
      - text: This week his time was two standard deviations lower than his average time.
        correct: true
    explanation: |
      A z-score counts standard deviations from the mean, $z = (x - \mu)/\sigma$, and negative
      values lie below the mean [^1]. So $z = -2$ means his time this week was two standard
      deviations below his average time. A z-score is not in minutes, and it compares with the
      mean of his times, not with last week or his best time.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#standardizing-with-z-scores
        locator: Sec. 13.2.2 Standardizing with Z scores
    source:
      id: mmlu-redux
      ref: high_school_statistics/91
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=91
    status: reviewed
    reviewed_by: claude
  - id: statistics-059
    type: single
    difficulty: hard
    question: The waiting times for a new roller coaster ride are normally distributed with a mean of 35 minutes and a standard deviation of 10 minutes. If there are 150,000 riders the first summer, which of the following is the shortest time interval associated with 100,000 riders?
    options:
      - text: 0 to 31.7 minutes
        why: This interval holds only about 37% of the riders [^3].
      - text: 31.7 to 39.3 minutes
        why: This interval is centered but holds only about 30% of the riders [^3].
      - text: 25.3 to 44.7 minutes
        correct: true
      - text: 25.3 to 35 minutes
        why: This holds one third of the riders, half of the 100,000 [^3].
    explanation: |
      100,000 of 150,000 riders is $2/3 \approx 66.7\%$ of the distribution. The normal curve is
      symmetric and single-peaked [^1], with its density highest at the mean, so the shortest
      interval holding a given area is the one centered on the mean: the middle 66.7%, leaving
      16.7% in each tail. The cutoff with 83.3% below it is about $z = 0.967$ (table area 0.333
      between 0 and $z$) [^2], giving $35 \pm 0.967 \times 10$, about 25.3 to 44.7 minutes [^3].
      The other intervals hold far less than two thirds: 25.3 to 35 covers one third of the
      riders, 31.7 to 39.3 about 30%, and 0 to 31.7 about 37%.
    references:
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-distribution-model
        locator: Sec. 13.2.1 Normal distribution model
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda3671.htm
        locator: Sec. 1.3.6.7.1 Cumulative distribution function of the standard normal (table, row 0.9)
      - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
        url: https://openintro-ims.netlify.app/foundations-mathematical.html#normal-probability-examples
        locator: Sec. 13.2.4 Normal probability examples
    source:
      id: mmlu-redux
      ref: high_school_statistics/92
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=92
    status: reviewed
    reviewed_by: claude
  - id: statistics-060
    type: single
    difficulty: hard
    question: A student organization at a university is interested in estimating the proportion of students in favor of showing movies biweekly instead of monthly. How many students should be sampled to get a 90 percent confidence interval with a width of at most 0.08?
    options:
      - text: '27'
        why: 'Far too few: with margin $M = 0.04$ and $\tilde{p} = 0.5$ the formula gives about 423 [^2].'
      - text: '64'
        why: This uses $z = 1.28$ and the full width 0.08 as the margin; 90% confidence needs $z^\star = 1.645$ and $M = 0.04$ [^1][^3].
      - text: '106'
        why: This uses the full width 0.08 as the margin of error; the margin is half the width, 0.04 [^1].
      - text: '423'
        correct: true
    explanation: |
      The margin of error is half the width of a confidence interval [^1], so a width of 0.08
      means $M = 0.04$. With no prior guess for the proportion, use the conservative
      $\tilde{p} = 0.5$ in $n = (z^\star/M)^2\,\tilde{p}(1-\tilde{p})$ [^2]. For 90% confidence
      $z^\star = 1.645$ [^3], so $n = (1.645/0.04)^2 \times 0.25 \approx 422.8$, which rounds up to
      423 [^2]. The option 106 comes from using the full width 0.08 as the margin of error.
    references:
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson04#introduction-to-confidence-intervals
        locator: Lesson 4, Sec. 4.2 Introduction to Confidence Intervals (Definition 4.6)
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson08#computing-necessary-sample-size
        locator: Lesson 8, Sec. 8.1.2 Computing Necessary Sample Size
      - title: 'Penn State STAT 200: Elementary Statistics'
        url: https://online.stat.psu.edu/stat200/Lesson07#z-multiplier-for-a-90-confidence-interval
        locator: Lesson 7, Sec. 7.4.2 (z* multiplier for a 90% confidence interval)
    source:
      id: mmlu-redux
      ref: high_school_statistics/93
      url: https://huggingface.co/datasets/edinburgh-dawg/mmlu-redux-2.0/viewer/high_school_statistics/test?row=93
