[project]
name = "ml-recall-tools"
version = "0.1.0"
description = "Data tooling for the ml-recall question bank: schema, validation, importers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "markdownify>=0.13",
  "pyarrow>=17",
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
]

[project.scripts]
mlr = "mlrecall.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/mlrecall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mlrecall"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
