items:
  # chapter 1 — Transformer models
  "chapter1/7#q1":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        `roberta-large-mnli` is RoBERTa-large fine-tuned on the Multi-Genre Natural Language
        Inference (MNLI) corpus, and the Hub lists it under Text Classification [^1]. Natural language
        inference is a classification task: given a premise and a hypothesis, the model predicts one of
        three labels, contradiction, neutral or entailment [^2]. It outputs a label, never new text, so
        it does neither summarization nor text generation.
      why:
        0: Summarization produces a shorter version of an input text. This checkpoint outputs one of three labels for a pair of sentences.
        2: Text generation continues a prompt with new text. This checkpoint is a classifier that outputs one of three labels.
      references:
        - title: FacebookAI/roberta-large-mnli model card (Hugging Face Hub)
          url: https://huggingface.co/FacebookAI/roberta-large-mnli#model-details
          locator: Model card, sec. Model Details; task tag Text Classification
        - title: FacebookAI/roberta-large-mnli, config.json
          url: https://huggingface.co/FacebookAI/roberta-large-mnli/blob/main/config.json
          locator: id2label (CONTRADICTION, NEUTRAL, ENTAILMENT)
      references_replace: true
  "chapter1/7#q2":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        `pipeline("ner")` runs named entity recognition: it finds the parts of the text that are
        entities such as persons, organizations or locations, here Sylvain (PER), Hugging Face (ORG)
        and Brooklyn (LOC), each returned with a score and its character offsets [^1]. With
        `aggregation_strategy="simple"`, the pipeline also regroups the pieces that belong to the same
        entity, so "Hugging Face" comes back as one organization and the subword pieces of "Sylvain" as
        one word [^1]. Positive/negative labels would come from a `sentiment-analysis` pipeline, and a
        completion of the sentence from `text-generation`.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/3#named-entity-recognition
          locator: Chapter 1.3 Transformers, what can they do?, sec. Named entity recognition
      references_replace: true
  "chapter1/7#q3":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        A fill-mask pipeline predicts the word hidden behind the model's mask token, so the input must
        contain that model's exact mask token, and different checkpoints use different ones [^1].
        BERT's is `[MASK]`, as in the `bert-base-cased` model card example
        `unmasker("Hello I'm a [MASK] model.")` [^2]. `<mask>` is the token used in the course's
        example with the pipeline's default checkpoint [^1]; BERT's tokenizer just splits it into
        `<`, `mask` and `>`, so the pipeline finds no mask to fill, and a sentence without any mask
        token has nothing to predict.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/3#mask-filling
          locator: Chapter 1.3 Transformers, what can they do?, sec. Mask filling
        - title: google-bert/bert-base-cased model card (Hugging Face Hub)
          url: https://huggingface.co/google-bert/bert-base-cased#how-to-use
          locator: Model card, sec. How to use
      references_replace: true
  "chapter1/7#q4":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        The `zero-shot-classification` pipeline classifies a text with labels you choose at call time
        instead of the labels the model was trained with, so the call has to say which labels to choose
        from: the course passes `candidate_labels=["education", "politics", "business"]` and gets a score
        for each [^1]. That argument is the set of possible labels for each sequence [^2]; without it there
        is nothing to score the text against, and the call fails. The same course example creates the
        pipeline without `model=`, in which case the task's default checkpoint is loaded [^3], and it
        classifies a single short sentence [^1].
      options:
        2: This pipeline needs a `model=` argument, because the task has no default checkpoint.
      why:
        2: Without `model=`, the pipeline falls back to a default checkpoint for the task and only prints a warning.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/3#zero-shot-classification
          locator: Chapter 1.3 Transformers, what can they do?, sec. Zero-shot classification
        - title: Hugging Face Transformers documentation, Pipelines (ZeroShotClassificationPipeline)
          url: https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.ZeroShotClassificationPipeline.__call__.candidate_labels
          locator: ZeroShotClassificationPipeline.__call__, candidate_labels
          quote: The set of possible class labels to classify each sequence into.
        - title: Hugging Face Transformers documentation, Pipelines (pipeline)
          url: https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.pipeline.model
          locator: pipeline(), model
          quote: If not provided, the default for the task will be loaded.
      references_replace: true
  "chapter1/7#q5":
    topic: transfer-learning
    difficulty: easy
    fix:
      explanation: |
        Transfer learning starts from a pretrained model and continues training it on a new,
        task-specific dataset (fine-tuning). Because the second model starts from the first model's
        weights rather than random ones, what was learned during pretraining is carried over, or
        *transferred* [^1]. Training again on the same dataset transfers nothing to a new task, and
        copying only the architecture copies no knowledge: the architecture is just the skeleton of
        layers, while the learned knowledge lives in the weights (the checkpoint) [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
          locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#architecture-vs-checkpoints
          locator: Chapter 1.4 How do Transformers work?, sec. Architectures vs. checkpoints
      references_replace: true
  "chapter1/7#q6":
    topic: language-models
    difficulty: easy
    fix:
      type: true_false
      question: A language model usually does not need labels for its pretraining.
      explanation: |
        Pretraining is usually *self-supervised*: the objective is computed automatically from the inputs,
        for example predicting the next word (causal language modeling) or filling in masked words (masked
        language modeling), so humans are not needed to label the data [^1]. Human-annotated labels come in
        later, when the pretrained model is fine-tuned on a specific task [^1].
      why:
        1: Pretraining labels are created automatically from the text itself (the next word, or a masked word), so no human labelling is needed.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
          locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
          quote: Self-supervised learning is a type of training in which the objective is automatically computed from the inputs of the model. That means that humans are not needed to label the data!
      references_replace: true
  "chapter1/7#q7":
    topic: neural-networks
    difficulty: easy
    fix:
      options:
        2: An architecture is a succession of mathematical functions to build a model and its weights are those functions' parameters.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#architecture-vs-checkpoints
          locator: 'Chapter 1, How do Transformers work?: Architectures vs. checkpoints'
      references_replace: true
  "chapter1/7#q11":
    topic: ai-ethics
    fix:
      explanation: |
        All three are real sources of bias. Pretrained models are often trained on text scraped from
        the internet, and even BERT, trained on seemingly neutral Wikipedia and BookCorpus text,
        completes `This woman works as a [MASK].` with gender-stereotyped jobs. Fine-tuning on your own
        data does not make this intrinsic bias disappear, so a fine-tuned model inherits it [^1].
        Biased training data is the most obvious source, but not the only one. A less obvious one is
        the way the model is trained: it blindly optimizes whatever metric you chose, so a biased
        metric gives a biased model [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/9
          locator: 'Chapter 1: Bias and limitations'
          quote: Fine-tuning the model on your data won't make this intrinsic bias disappear.
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/7
          locator: 'Chapter 1: Ungraded quiz, question 11 (answer notes)'
      references_replace: true
  # chapter 2 — Using 🤗 Transformers (concepts → transformers/tokenization, API → huggingface)
  "chapter2/9#q2":
    topic: transformers
    difficulty: easy
    fix:
      explanation: |
        The base model (`AutoModel`) outputs hidden states with three dimensions: the batch size
        (how many sequences are processed at once), the sequence length, and the hidden size (the
        vector dimension of each input token) [^1]. In the course example, two sentences of 16 tokens
        give `last_hidden_state.shape == torch.Size([2, 16, 768])` [^1]. The batch dimension is
        always there: a single sentence is sent as a batch of one sequence [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#a-high-dimensional-vector
          locator: Chapter 2.2 Behind the pipeline, sec. A high-dimensional vector?
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/5#models-expect-a-batch-of-inputs
          locator: Chapter 2.5 Handling multiple sequences, sec. Models expect a batch of inputs
      references_replace: true
  "chapter2/9#q3":
    topic: tokenization
    difficulty: easy
    fix:
      question: Which of the following are examples of subword tokenization?
      explanation: |
        Subword tokenization keeps frequent words whole and splits rare words into meaningful pieces, for
        example "tokenization" into "token" and "ization", which gives good coverage with a small
        vocabulary and almost no unknown tokens [^1]. BPE, WordPiece and Unigram are the three main
        subword algorithms, used by GPT-2, BERT and T5 respectively [^2]. Splitting on whitespace and
        punctuation is word-based tokenization, and character-based tokenization splits text into single
        characters [^1]. Lowercasing and removing accents is normalization, a cleanup step before any
        splitting [^2].
      shuffle: true
      options:
        5: Lowercasing the text and removing accents
      why:
        5: That's normalization, a cleanup step before the text is split; it produces no tokens.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#subword-tokenization
          locator: Chapter 2.4 Tokenizers, secs. Word-based, Character-based and Subword tokenization
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
          locator: Chapter 6.4 Normalization and pre-tokenization, secs. Normalization and Algorithm overview
      references_replace: true
  "chapter2/9#q4":
    topic: transformers
    difficulty: easy
    fix:
      explanation: |
        The base Transformer outputs high-dimensional hidden states. A head is an extra component,
        usually one or a few linear layers, that projects those vectors onto a task-specific output,
        for example two logits for positive/negative sentence classification [^1]. The same base
        model can carry different heads, such as `*ForSequenceClassification`,
        `*ForTokenClassification`, `*ForQuestionAnswering` or `*ForCausalLM` [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#model-heads-making-sense-out-of-numbers
          locator: 'Chapter 2.2 Behind the pipeline, sec. Model heads: Making sense out of numbers'
      references_replace: true
  "chapter2/9#q6":
    topic: transformers
    difficulty: medium
    fix:
      explanation: |
        A batch must be a rectangular tensor, so sequences of different lengths have to be evened
        out. Padding adds a padding token to the shorter sequences [^1]. An attention mask (1 for
        real tokens, 0 for padding) then tells the attention layers to ignore the padding; without
        it, the padded sequence gets different outputs than it would on its own [^1]. Sequences
        longer than the model's maximum length must be truncated [^1]. Returning tensors
        (`return_tensors="pt"`) only chooses the type of the output, PyTorch tensors or NumPy arrays,
        and does nothing about the different lengths [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/5#padding-the-inputs
          locator: Chapter 2.5 Handling multiple sequences, secs. Padding the inputs, Attention masks and Longer sequences
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/6
          locator: Chapter 2.6 Putting it all together (return_tensors)
      references_replace: true
  "chapter2/9#q7":
    topic: neural-networks
    difficulty: easy
    fix:
      explanation: |
        The logits of a sequence classification model are raw, unnormalized scores; to be read as
        probabilities they go through a SoftMax layer [^1]. Softmax exponentiates every logit, which
        makes it non-negative, and divides by the sum of the exponentials, so each output lies between
        0 and 1 and all outputs add up to 1 [^2]. Both properties together allow the probabilistic
        reading. Softmax also preserves the ordering of the logits, so it does not change which class
        wins and does not make the prediction any more reliable [^2].
      why:
        1: Every softmax output lies between 0 and 1.
        2: Dividing each exponentiated logit by the sum of all of them makes the outputs add up to 1, like a probability distribution.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#postprocessing-the-output
          locator: 'Chapter 2, Behind the pipeline: Postprocessing the output'
        - source: d2l
          url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#the-softmax
          locator: Sec. 4.1.1.2 The Softmax, Eqs. (4.1.3)–(4.1.4)
          quote: because the softmax operation preserves the ordering among its arguments, we do not need to compute the softmax to determine which class has been assigned the highest probability
      references_replace: true
  "chapter3/2#q1":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        With `batched=True`, `map()` passes the function many examples at once (each key holding a list)
        instead of one example per call [^1]. The tokenizer accepts lists of sentence pairs, and the fast
        tokenizer, written in Rust, is only really fast when it gets lots of inputs at once, so batching
        greatly speeds up preprocessing [^1]. Padding is deliberately left out of this step and done per
        batch by a data collator (dynamic padding) [^2], and the conversion to PyTorch tensors comes later,
        when the dataset's format is set to `"torch"` [^3].
      options:
        0: It uses less memory while the dataset is processed.
        1: It tokenizes many examples per call, which is much faster.
        2: It pads every example in a batch to the same length.
        3: It converts the tokenized columns into PyTorch tensors.
      why:
        0: Saving memory isn't the point. Each call receives a whole batch of examples at once, so batching doesn't reduce memory; what it buys is speed.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#preprocessing-a-dataset
          locator: Chapter 3.2 Processing the data, sec. Preprocessing a dataset
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
          locator: Chapter 3.2 Processing the data, sec. Dynamic padding
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/4#prepare-for-training
          locator: Chapter 3.4 A full training loop, sec. Prepare for training
      references_replace: true
  "chapter3/2#q3":
    topic: transformers
    difficulty: easy
    fix:
      explanation: |
        For a sentence pair, BERT's tokenizer builds `[CLS] sentence1 [SEP] sentence2 [SEP]`, and
        `token_type_ids` says which part each token belongs to: 0 for `[CLS] sentence1 [SEP]` and 1
        for `sentence2 [SEP]` [^1]. BERT uses them because it was pretrained with next sentence
        prediction on sentence pairs; checkpoints that weren't, such as DistilBERT, don't return
        them [^1]. The vocabulary IDs and the padding information are separate fields, `input_ids`
        and `attention_mask` [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#preprocessing-a-dataset
          locator: Chapter 3.2 Processing the data, sec. Preprocessing a dataset
      references_replace: true
  "chapter3/2#q4":
    topic: huggingface
    fix:
      explanation: |
        The second positional argument of `load_dataset` is `name`, the dataset configuration [^2],
        and MRPC is one of the specific tasks within the larger GLUE benchmark collection [^1].
      why:
        2: The split has its own keyword argument, `split=` (e.g. `split="train"`); without it, `load_dataset` returns a `DatasetDict` with every split [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2
          locator: Chapter 3.2 Processing the data, "Loading a dataset from the Hub"
        - title: 🤗 Datasets documentation, Loading methods
          url: https://huggingface.co/docs/datasets/package_reference/loading_methods#datasets.load_dataset
          locator: load_dataset, parameters `name` and `split`
      references_replace: true
  "chapter3/2#q5":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        When you write your own training loop, you remove the columns the model does not expect
        (`sentence1`, `sentence2` and `idx`), rename `label` to `labels` and set the format to PyTorch, so
        that only `attention_mask`, `input_ids`, `labels` and `token_type_ids` remain [^1]. Each batch is
        then passed to the model as `model(**batch)`, so every column becomes an argument the model must
        accept, and the raw-text columns hold strings, from which no tensors can be created [^2]. Saving
        memory or time is a side effect, not the reason, and the `Trainer` removes such columns for you
        automatically [^1].
      options:
        2: These text columns are not needed when computing evaluation metrics.
        3: Dropping them makes each training step significantly faster.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/4#prepare-for-training
          locator: Chapter 3.4 A full training loop, secs. Prepare for training and The training loop
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
          locator: Chapter 3.2 Processing the data, sec. Dynamic padding (removing the string columns before batching)
      references_replace: true
  "chapter3/3#q1":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        `processing_class` is where you hand the `Trainer` your tokenizer (more generally a processor:
        an image processor, feature extractor or multimodal processor also fits) [^1][^2]. The Trainer
        uses it to process the inputs automatically, for instance by defaulting to a
        `DataCollatorWithPadding` when it gets a tokenizer, and saves it with the model so that training
        can be resumed or the fine-tuned model reused [^1][^2]. The architecture comes from the model
        you load, while batch size and evaluation frequency are `TrainingArguments` settings [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3#training
          locator: Chapter 3.3 Fine-tuning a model with the Trainer API, sec. Training
        - title: 🤗 Transformers documentation, Trainer
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.Trainer.processing_class
          locator: Trainer, parameter `processing_class`
          quote: Processing class used to process the data. If provided, will be used to automatically process the inputs for the model, and it will be saved along the model to make it easier to rerun an interrupted training or reuse the fine-tuned model.
      references_replace: true
  "chapter3/3#q2":
    topic: huggingface
    fix:
      explanation: |
        `eval_strategy` can be `"no"` (the default), `"steps"` (evaluate every `eval_steps` steps) or
        `"epoch"` (evaluate at the end of each epoch) [^1] [^2].
      options:
        0: '`eval_frequency`'
        1: '`eval_strategy`'
        2: '`evaluation_steps`'
        3: '`do_eval`'
      why:
        0: There's no `eval_frequency` parameter in `TrainingArguments`.
        2: There's no such parameter. The real `eval_steps` sets the number of steps between evaluations, but only when `eval_strategy="steps"`; `eval_strategy` decides if and when evaluation happens.
        3: "`do_eval` exists, but the `Trainer` doesn't use it directly: it is a flag for your own scripts, set to `True` automatically when `eval_strategy` is not `\"no\"` [^2]."
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3
          locator: Chapter 3.3 Fine-tuning a model with the Trainer API, "Training"
        - title: 🤗 Transformers documentation, Trainer
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments
          locator: TrainingArguments, parameters `eval_strategy` and `do_eval`
      references_replace: true
  "chapter3/3#q3":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        `fp16=True` turns on mixed precision training, which makes training faster and reduces memory
        use [^1]. "Mixed" means that not every operation runs in 16 bits: operations such as linear
        layers and convolutions are much faster in float16, while operations such as reductions need the
        wider range of float32, so each operation runs in the type that suits it [^2].
      options:
        0: 16-bit integer weights and activations for faster training.
        1: Mixed precision training with 16-bit floating-point numbers.
        2: Training for exactly 16 epochs with the default batch size.
        3: Distributed data-parallel training across 16 GPUs.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3#advanced-training-features
          locator: 'Chapter 3, Fine-tuning a model with the Trainer API: Advanced Training Features'
        - title: Automatic Mixed Precision package - torch.amp (PyTorch documentation)
          url: https://docs.pytorch.org/docs/stable/amp.html
          locator: Introduction
      references_replace: true
  "chapter3/3#q4":
    topic: huggingface
    fix:
      options:
        0: It calculates the loss that is backpropagated during training.
        1: It computes metrics like accuracy and F1 from the model's predictions.
        2: It determines which optimizer and learning rate to use.
        3: It preprocesses and tokenizes the training data.
  "chapter3/3#q5":
    topic: huggingface
    fix:
      question: What happens when you don't provide an `eval_dataset` to the `Trainer` and keep the default `eval_strategy="no"`?
      explanation: |
        With `eval_strategy="no"` (the default) the `Trainer` never evaluates, so it trains normally and
        just reports no validation metrics [^1] [^2]. If you set `eval_strategy` to `"steps"` or `"epoch"`
        without an `eval_dataset`, the `Trainer` raises a `ValueError` as soon as it is created [^3].
      why:
        0: Not with `eval_strategy="no"`. You only get an error if you ask for evaluation (`"steps"` or `"epoch"`) without passing an `eval_dataset`.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3
          locator: Chapter 3.3 Fine-tuning a model with the Trainer API, "Training"
        - title: 🤗 Transformers documentation, Trainer
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments
          locator: TrainingArguments, parameter `eval_strategy` (defaults to "no")
        - title: transformers v5.4.0 source, trainer.py
          url: https://github.com/huggingface/transformers/blob/v5.4.0/src/transformers/trainer.py#L635
          locator: Trainer.__init__, eval_strategy / eval_dataset check
          quote: but you didn't pass an `eval_dataset` to `Trainer`. Either set `args.eval_strategy` to `no` or pass an `eval_dataset`.
      references_replace: true
  "chapter3/3#q6":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Gradient accumulation adds up the gradients of several batches and updates the weights only once
        after them, which simulates a larger batch when GPU memory is limited [^1]. In the Trainer it is
        set with `gradient_accumulation_steps`: a per-device batch size of 4 with 4 accumulation steps
        gives an effective batch size of 16 [^1].
      options:
        0: It saves gradients to disk, enabled with `save_gradients=True`.
        1: It accumulates gradients over multiple batches before updating, enabled with `gradient_accumulation_steps`.
        2: It speeds up gradient computation, enabled automatically with `fp16`.
        3: It prevents gradient overflow, enabled with `gradient_clipping=True`.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3#advanced-training-features
          locator: 'Chapter 3, Fine-tuning a model with the Trainer API: Advanced Training Features'
      references_replace: true
  "chapter3/4#q1":
    topic: training
    difficulty: medium
    fix:
      explanation: |
        AdamW separates weight decay from the gradient-based parameter updates, leading to better
        regularization [^1].
      references:
        - source: hf-llm-course
