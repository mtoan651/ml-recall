  chapter5/8#q1:
    difficulty: easy
    fix:
      question: The `load_dataset()` function in 🤗 Datasets can load a dataset from which of these locations?
      explanation: |
        `load_dataset()` downloads datasets from the Hub by name, and it also loads local and remote
        files: you give the format (`csv`, `json`, `text`, ...) and point `data_files` at local paths or
        at URLs [^1] [^2]. Data that is already in memory, such as a Python dict or a list of dicts, is
        turned into a dataset with `Dataset.from_dict()` or `Dataset.from_list()` [^2].
      options:
        - text: Local files, e.g. CSV or JSON files on your laptop
          correct: true
        - text: The Hugging Face Hub, by dataset name
          correct: true
        - text: A remote server, by passing URLs as `data_files`
          correct: true
        - text: A Python list in memory, passed as the first argument
          why: The first argument is a dataset name or a path (a string). Data already in memory is wrapped with `Dataset.from_list()` or `Dataset.from_dict()` instead.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/2#working-with-local-and-remote-datasets
          locator: "Chapter 5.2: What if my dataset isn't on the Hub?, secs. Loading a local dataset and Loading a remote dataset"
        - title: Load (🤗 Datasets documentation)
          url: https://huggingface.co/docs/datasets/loading
          locator: Hugging Face Hub; Local and remote files; In-memory data
      references_replace: true
  chapter5/8#q2:
    difficulty: easy
    fix:
      explanation: |
        A random sample is made by chaining `Dataset.shuffle()` and `Dataset.select()`: shuffle the
        whole dataset, then select the first indices of the shuffled result [^1]. Selecting first and
        shuffling afterwards only reorders the first 50 rows. `Dataset` has no `sample()` method, and the
        first parameter of `shuffle()` is the seed, so `shuffle(50)` still returns every row [^2].
      options:
        - text: '`dataset.sample(50)`'
          why: There is no `Dataset.sample()` method.
        - text: '`dataset.shuffle().select(range(50))`'
          correct: true
        - text: '`dataset.select(range(50)).shuffle()`'
          why: The code runs, but it only shuffles the first 50 elements of the dataset, so the sample is not random.
        - text: '`dataset.shuffle(50)`'
          why: The first parameter of `shuffle()` is the random seed, so this returns the whole dataset in a new order.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/3#slicing-and-dicing-our-data
          locator: 'Chapter 5.3: Time to slice and dice, sec. Slicing and dicing our data'
        - title: Dataset.shuffle (🤗 Datasets documentation)
          url: https://huggingface.co/docs/datasets/package_reference/main_classes#datasets.Dataset.shuffle
          locator: Main classes, Dataset.shuffle, parameter seed
      references_replace: true
  chapter5/8#q3:
    difficulty: easy
    fix:
      explanation: |
        `Dataset.filter()` keeps the rows for which a function returns `True`, and that function can be
        a named function or a lambda [^1]. A lambda takes the general form
        `lambda <arguments> : <expression>`, so the version without an argument is a syntax error
        [^1]. `Dataset.select()` takes an iterable of indices such as `range(1000)`, not a condition
        [^1].
      options:
        - text: "`pets_dataset.filter(lambda x: x['name'].startswith('L'))`"
          correct: true
        - text: "`pets_dataset.filter(lambda x['name'].startswith('L'))`"
          why: 'This is a syntax error: a lambda has the form `lambda <arguments> : <expression>`, so it needs an argument before the colon.'
        - text: "Define `def filter_names(x): return x['name'].startswith('L')` and run `pets_dataset.filter(filter_names)`"
          correct: true
        - text: "`pets_dataset.select(lambda x: x['name'].startswith('L'))`"
          why: '`select()` expects an iterable of row indices, not a function; keeping rows that satisfy a condition is the job of `filter()`.'
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/3#slicing-and-dicing-our-data
          locator: 'Chapter 5.3: Time to slice and dice, sec. Slicing and dicing our data'
      references_replace: true
  chapter5/8#q4:
    difficulty: easy
    fix:
      question: 🤗 Datasets treats each dataset as a memory-mapped file. What is memory mapping?
      explanation: |
        🤗 Datasets treats each dataset as a memory-mapped file, which provides a mapping between RAM and
        filesystem storage [^1]. The library can then access and operate on elements of the dataset
        without loading all of it into memory, which is how a dataset of almost 20 GB can be used with
        far less RAM [^1]. It has nothing to do with GPU memory or with a tokenizer's vocabulary.
      options:
        - text: A mapping between CPU RAM and GPU memory
          why: Memory mapping is about RAM and files on disk, not about moving data to the GPU.
        - text: A mapping between RAM and filesystem storage
          correct: true
        - text: A mapping between two files in the 🤗 Datasets cache
          why: It maps a file on disk into memory, not one file onto another.
        - text: A mapping from each token to its ID in the vocabulary
          why: That is the tokenizer's vocabulary, which has nothing to do with how the dataset is stored.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. The magic of memory mapping'
      references_replace: true
  chapter5/8#q5:
    difficulty: medium
    fix:
      question: What are the main benefits of the memory mapping used by 🤗 Datasets?
      explanation: |
        A memory-mapped dataset can be accessed and operated on without being fully loaded into memory
        [^1]. Memory-mapped files can also be shared across processes, so methods like `Dataset.map()`
        can be parallelized without moving or copying the dataset [^1]. Memory mapping neither loads
        everything into RAM up front nor compresses the data; for corpora too large even for the disk,
        the HF LLM Course turns to streaming [^1].
      options:
        - text: Several processes can share one memory-mapped file, so `Dataset.map()` can run in parallel without copying the data
          correct: true
        - text: Programs can access parts of an extremely large file without first reading the whole file into RAM
          correct: true
        - text: The whole dataset is read into RAM once, so that later accesses never touch the disk
          why: It is the opposite. Memory mapping avoids loading the whole dataset into RAM.
        - text: The dataset is compressed, so that it takes up much less space on disk
          why: Memory mapping changes how a file is accessed, not how big it is on disk.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, secs. The magic of memory mapping and Streaming datasets'
      references_replace: true
  chapter5/8#q6:
    difficulty: easy
    fix:
      question: |
        With `streaming=True`, `load_dataset()` does not download the whole dataset first:

        ```py
        from datasets import load_dataset

        dataset = load_dataset("allocine", streaming=True, split="train")
        ```

        Why can't you get the first review with `dataset[0]`, as you could without streaming?
      explanation: |
        With `streaming=True`, `load_dataset()` returns an `IterableDataset` instead of a `Dataset`, and
        its elements are accessed by iterating over it, e.g. `next(iter(dataset))` [^1]. Streaming is
        meant precisely for corpora too large for RAM or even the disk, because entries are read on the
        fly [^1]. To pick examples from a stream you use `take()` and `skip()` rather than indices [^1].
      options:
        - text: It is too large to fit in RAM, so streaming refuses to return single elements
          why: Streamed datasets are decompressed on the fly, so you can process terabyte-sized datasets with very little RAM.
        - text: Streaming returns an `IterableDataset`, which has no random access by index
          correct: true
        - text: The `allocine` dataset has no `train` split
          why: It has train, validation and test splits; the problem is the type of object that streaming returns.
        - text: Streamed examples arrive as token IDs and must be decoded before they can be read
          why: Streamed examples are ordinary dicts of raw fields, as in a regular dataset; tokenizing is a separate `map()` step.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#streaming-datasets
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. Streaming datasets'
      references_replace: true
  chapter5/8#q7:
    difficulty: easy
    fix:
      question: Which of the following are the main benefits of writing a dataset card for a dataset you share on the Hub?
      explanation: |
        A dataset card, the repository's README.md, gives users the context to decide whether the
        dataset is relevant to their task and to evaluate potential biases or risks in using it [^1].
        Well-documented datasets are also more likely to be useful to others, including your future self
        [^1]. Writing down a bias does not remove it from the data, though.
      options:
        - text: It tells others the intended use and supported tasks, so they can decide whether the dataset suits them
          correct: true
        - text: It draws attention to the biases present in the corpus
          correct: true
        - text: It makes it more likely that others in the community will use the dataset
          correct: true
        - text: It removes the biases in the corpus by documenting them
          why: Documenting a bias helps users evaluate the risks, but it does not change the data.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/5#creating-a-dataset-card
          locator: 'Chapter 5.5: Creating your own dataset, sec. Creating a dataset card'
      references_replace: true
  chapter5/8#q8:
    topic: text-representation
    difficulty: easy
    fix:
      type: single
      explanation: |
        Semantic search embeds the documents of a corpus and the query into the same vector space and
        returns the documents whose embeddings are most similar to the query's [^1] [^2]. Because it
        matches meaning rather than wording, it also copes with synonyms, abbreviations and
        misspellings, whereas keyword search engines only find lexical matches [^2]. Counting keywords,
        in one language or several, is still lexical search.
      options:
        - text: Finding documents that contain the exact words of the query
          why: That is lexical (keyword) search, what traditional search engines do.
        - text: Finding documents by meaning, comparing embeddings of the query and documents
          correct: true
        - text: Ranking documents by how many of the query's keywords they contain
          why: Counting shared keywords is still lexical matching; a document that uses synonyms would score zero.
        - text: Translating the query into several languages and keyword-searching each one
          why: The matching would still be on exact words; translation does not add an understanding of meaning.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/6#using-embeddings-for-semantic-search
          locator: 'Chapter 5.6: Semantic search with FAISS, sec. Using embeddings for semantic search'
        - title: Semantic Search (Sentence Transformers documentation)
          url: https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html#background
          locator: Introduction and sec. Background
      references_replace: true
  chapter5/8#q9:
    topic: text-representation
    difficulty: medium
    fix:
      question: In *asymmetric* semantic search, what do the query and the matching documents usually look like?
      explanation: |
        In symmetric semantic search the query and the corpus entries have about the same length and
        content, as when looking for similar questions, and you could swap query and entries [^1]. In
        asymmetric search you usually have a short query, such as a question or some keywords, and want
        a longer paragraph that answers it, so swapping them makes no sense [^1]. The HF LLM Course calls
        its search of GitHub issue comments with short questions an example of asymmetric semantic
        search [^2].
      options:
        - text: A short query and a longer paragraph that answers it
          correct: true
        - text: A query and documents of about the same length
          why: That is symmetric semantic search, e.g. finding questions similar to a given question.
        - text: A long query and a shorter paragraph that answers it
          why: It is the other way round; the query is usually short, like a question or a few keywords.
        - text: A query in one language and documents in another
          why: That is cross-lingual search. Asymmetric refers to the different length and content of query and documents.
      references:
        - title: Semantic Search (Sentence Transformers documentation)
          url: https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html#symmetric-vs-asymmetric-semantic-search
          locator: sec. Symmetric vs. Asymmetric Semantic Search
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/6#creating-text-embeddings
          locator: 'Chapter 5.6: Semantic search with FAISS, sec. Creating text embeddings'
      references_replace: true
  chapter5/8#q10:
    difficulty: easy
    fix:
      type: true_false
      question: 🤗 Datasets can only load text data, so audio or computer-vision datasets need a different library.
      explanation: |
        🤗 Datasets is a library for accessing and sharing datasets for audio, computer vision and NLP
        tasks, with the same loading and processing methods for all of them [^1]. Its documentation has
        separate guides for loading and processing audio data, image data and tabular data [^1].
      options:
        0: 'True'
        1: 'False'
      why:
        0: 🤗 Datasets also loads and processes audio, image and tabular data.
      references:
