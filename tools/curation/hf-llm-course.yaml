  "chapter3/5#q1":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        A training loss that keeps falling while the validation loss rises or stalls is the classic
        sign of overfitting [^1]. The model still fits its training examples better and better, but what
        it now learns are quirks and noise of those examples that do not carry over to unseen data, so
        its generalization gets worse [^1][^2]. Typical remedies are regularization such as dropout or
        weight decay, early stopping, data augmentation or a smaller model [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#overfitting
          locator: 'Chapter 3, Understanding Learning Curves: Overfitting'
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/generalization.html#underfitting-or-overfitting
          locator: Sec. 3.6.2 Underfitting or Overfitting?
      references_replace: true
  "chapter3/5#q2":
    topic: training
    difficulty: medium
    fix:
      explanation: |
        Accuracy counts discrete decisions: a prediction only changes when the predicted class flips,
        i.e. when the probability of the right class crosses the decision threshold [^1]. Small gains in
        confidence lower the loss, which is continuous, but leave accuracy unchanged until enough
        examples cross the threshold, so the accuracy curve rises in jumps with plateaus between them
        [^1]. Accuracy is not even differentiable, which is why training optimizes the loss and accuracy
        is only monitored [^2].
      options:
        0: There is a bug in how the accuracy is being calculated.
        1: Accuracy changes only when a prediction flips to another class.
        2: The model is not learning effectively between the jumps.
        3: The batch size is too small to give stable gradient estimates.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#accuracy-curves
          locator: 'Chapter 3, Understanding Learning Curves: Accuracy Curves'
        - source: d2l
          locator: Sec. 4.3.2 Accuracy
          url: https://d2l.ai/chapter_linear-classification/classification.html#accuracy
      references_replace: true
  "chapter3/5#q3":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Frequent, large fluctuations mean the updates are too large or too noisy: steps overshoot, so the
        loss jumps up and down instead of trending downward [^1]. A lower learning rate takes smaller,
        more stable steps, and a larger batch averages the gradient over more examples, which reduces
        its noise [^1]. Gradient clipping and consistent preprocessing can also help; stopping or
        switching architectures is premature [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#erratic-learning-curves
          locator: 'Chapter 3, Understanding Learning Curves: Erratic Learning Curves'
      references_replace: true
  "chapter3/5#q4":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Early stopping monitors validation performance during training and stops once it no longer
        improves or starts to get worse, usually keeping the best model seen so far [^1][^2]. From that
        point on, more training only fits the training set more closely, which is the onset of
        overfitting [^1]. It is one remedy among several, next to regularization, data augmentation and
        smaller models, so it is used when that pattern appears rather than as a rule for every run [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#overfitting
          locator: 'Chapter 3, Understanding Learning Curves: Overfitting (solutions)'
        - source: d2l
          locator: Sec. 5.5.3 Early Stopping
          url: https://d2l.ai/chapter_multilayer-perceptrons/generalization-deep.html#early-stopping
      references_replace: true
  "chapter3/5#q5":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Underfitting means the model has not even learned the training data well: training and
        validation loss both stay high and level off early [^1]. Causes include too little capacity, too
        few epochs or an unsuitable learning rate, so the remedies are a larger model, longer training,
        other learning rates and checking the data [^1]. A large gap with good training performance is
        the opposite problem, overfitting [^1].
      why:
        3: Underfitting shows in the level of the losses, both staying high; how fast each one falls does not indicate it.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#underfitting
          locator: 'Chapter 3, Understanding Learning Curves: Underfitting'
      references_replace: true
  "chapter6/10#q2":
    topic: huggingface
    difficulty: medium
    fix:
      explanation: |
        `train_new_from_iterator()` takes an iterator over batches of texts; a list of lists of texts
        works, but builds every batch in memory up front [^1]. A generator produces each batch (say
        1,000 texts) only when the training loop asks for it, so the whole dataset is never loaded at
        once [^1]. This matters for huge corpora, especially with 🤗 Datasets, which keeps the data on
        disk instead of in RAM [^1]. The result is the same tokenizer either way, and a tokenizer
        splits text rather than generating it.
      why:
        0: The method takes any iterator over batches of texts, and a list of lists of texts works too; it just has to hold the whole corpus in memory.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/2#assembling-a-corpus
          locator: Chapter 6.2 Training a new tokenizer from an old one, sec. Assembling a corpus
      references_replace: true
  "chapter6/10#q3":
    topic: huggingface
    difficulty: medium
    fix:
      explanation: |
        A fast tokenizer is backed by the Rust 🤗 Tokenizers library, so it can tokenize a large batch in
        parallel and is much faster there; on a single text it may even be slower than the slow version.
        It also keeps track of the span of the original text that each token comes from, a feature called
        *offset mapping*. Padding and truncation are available in both kinds of tokenizer [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/3
          locator: Chapter 6.3 Fast tokenizers' special powers
      references_replace: true
  "chapter6/10#q4":
    topic: nlp-tasks
    difficulty: hard
    fix:
      explanation: |
        The model predicts one label per token, and entities are rebuilt from those labels. Labels come in
        pairs: `B-XXX` marks a token at the beginning of an entity of type XXX and `I-XXX` a token inside
        it [^1]. When grouping, consecutive tokens labelled `I-XXX` are added to the current entity, and the
        entity stops at an `O`, a different type, or a `B-XXX` that starts a new entity of the same type
        [^1]. With word-level strategies such as `aggregation_strategy="first"`, a word takes the tag of its
        first token, so its pieces cannot end up in different entities [^2]. Simply merging all tokens
        with the same label is an oversimplification: two adjacent entities of the same type would become
        one [^1].
      why:
        0: Too simple. Merging every run of tokens with the same entity type would fuse two adjacent entities of that type into one; the `B-` label exists to mark where a new entity starts.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/3#grouping-entities
          locator: Chapter 6.3 Fast tokenizers' special powers, secs. From inputs to predictions and Grouping entities
        - title: Hugging Face Transformers documentation, Pipelines (TokenClassificationPipeline)
          url: https://huggingface.co/docs/transformers/main_classes/pipelines#transformers.TokenClassificationPipeline
          locator: TokenClassificationPipeline, aggregation_strategy
          quote: Words will simply use the tag of the first token of the word when there is ambiguity.
      references_replace: true
  "chapter6/10#q5":
    topic: nlp-tasks
    difficulty: medium
    fix:
      explanation: |
        Truncating a long context could cut off the answer. Instead, the `question-answering` pipeline
        splits the context into chunks no longer than its maximum length (384 tokens), with some
        overlap (the `stride`) between consecutive chunks so that the answer is not split at exactly the
        wrong place [^1]. Every possible answer span in each chunk gets a score, the best span of each
        chunk is kept, and the candidate with the highest score is the answer [^1]. Averaging over chunks
        would make no sense, since most chunks do not contain the answer.
      why:
        0: No, truncating could cut off the answer; the pipeline splits a long context into chunks instead.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/3b#handling-long-contexts
          locator: Chapter 6.3b Fast tokenizers in the QA pipeline, sec. Handling long contexts
      references_replace: true
  "chapter7/9#q4":
    topic: transfer-learning
    difficulty: easy
    fix:
      explanation: |
        Domain adaptation means fine-tuning a pretrained model on in-domain data so that it fits that
        domain better. For example, a model pretrained on Wikipedia treats the specialised words of
        legal contracts or scientific articles as rare tokens until it is further trained on such
        text [^1]. The course fine-tunes DistilBERT's masked language model on IMDb movie reviews so
        that it adapts from Wikipedia's factual style to the more subjective language of reviews
        [^1]. Running inference, training a model from scratch and adding misclassified samples to
        the data are all useful steps, but none of them adapts a pretrained model to a new domain.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/3
          locator: Chapter 7.3 Fine-tuning a masked language model (introduction and the IMDb dataset)
      references_replace: true
  "chapter7/9#q5":
    topic: language-models
    difficulty: medium
    fix:
      explanation: |
        In masked language modeling the labels are a copy of the input token IDs. A data collator then
        masks a random fraction of the tokens (15%, as for BERT), mostly by replacing them with `[MASK]`,
        and the model learns to predict the original tokens at those positions [^1]. Labels shifted by one position belong to
        causal language modeling, which predicts the next word [^2], and a sentiment or a
        sentence-similarity label turns the problem into sequence classification.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/3#preprocessing-the-data
          locator: Chapter 7.3 Fine-tuning a masked language model, secs. Preprocessing the data and Fine-tuning DistilBERT with the Trainer API
          quote: in masked language modeling the objective is to predict randomly masked tokens in the input batch
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
          locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
      references_replace: true
  "chapter7/9#q7":
    topic: huggingface
    difficulty: medium
    fix:
      question: |
        When fine-tuning a sequence-to-sequence model such as a translator, the tokenized targets of a
        batch are padded to the same length, and the padding positions in `labels` are set to −100
        rather than to the tokenizer's padding ID. Why −100?
      explanation: |
        Padding positions are not real targets, so they must not count in the loss. The course's
        seq2seq data collator pads the labels with −100 instead of the padding token "to make sure
        those padded values are ignored in the loss computation" [^1]. This works because PyTorch's
        `CrossEntropyLoss` skips every target equal to its `ignore_index`, which defaults to −100
        [^2].
      options:
        0: PyTorch's cross-entropy skips targets equal to −100, its default `ignore_index`
        1: −100 is the ID that the vocabulary reserves for the padding token
        2: It tells the decoder to stop generating text at that position
        3: It hides those positions from the encoder's self-attention
      why:
        0:
        1: The padding token has its own ordinary vocabulary ID; −100 is not a valid token ID at all, it is a flag for the loss function.
        2: Generation stops at the end-of-sequence token; label values are only used to compute the training loss.
        3: Attention is masked with the 0/1 `attention_mask`, not through the values in `labels`.
      correct:
        - 0
      references:
        - source: hf-llm-course
          locator: Chapter 7.4 Translation — Fine-tuning the model with the Trainer API (data collation)
          url: https://huggingface.co/learn/llm-course/chapter7/4
        - title: 'PyTorch documentation: torch.nn.CrossEntropyLoss'
          locator: Parameters — ignore_index (default −100)
          url: https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
      references_replace: true
  "chapter7/9#q8":
    topic: huggingface
    difficulty: medium
    fix:
      explanation: |
        During training, a sequence-to-sequence model is fed the target tokens, with a mask that hides
        the tokens after the one it is predicting; at inference there are no labels, so the decoder
        must produce the output one token at a time with `generate()` [^1]. `Seq2SeqTrainer` adds
        exactly this to `Trainer`: with `predict_with_generate=True` it evaluates and predicts by
        generating, which is what text metrics such as BLEU or ROUGE need [^1][^2]. The -100 labels
        are ignored by the usual loss, the targets are tokenized before training, and the encoder and
        decoder form one model, so none of these needs a special class.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/4?fw=pt#metrics
          locator: Chapter 7.4 Translation (PyTorch), sec. Metrics
        - title: 🤗 Transformers documentation, Trainer
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.Seq2SeqTrainingArguments.predict_with_generate
          locator: Seq2SeqTrainingArguments, parameter `predict_with_generate`
      references_replace: true
  "chapter7/9#q9":                         # Keras compile(); course is PyTorch-first now
    topic: huggingface
    difficulty: easy
    fix:
      question: |
        In a PyTorch training loop for a 🤗 Transformers model you can write

        ```py
        outputs = model(**batch)
        loss = outputs.loss
        loss.backward()
        ```

        without defining a loss function yourself. Why?
      explanation: |
        All 🤗 Transformers models return the loss when `labels` are provided, alongside the logits [^1].
        A manual training loop therefore takes `outputs.loss`, calls `backward()` on it and then steps
        the optimizer [^1]. The loss is handled by the model, while `compute_metrics()` only computes
        evaluation metrics such as accuracy or F1 [^2].
      options:
        0: Transformer models are trained without supervision, so they need no loss function
        1: When the batch contains `labels`, the model computes the loss itself and returns it
        2: '`outputs.loss` is the metric that `compute_metrics()` returns after each evaluation'
        3: The optimizer computes the loss from the gradients during `optimizer.step()`
      why:
        0: Every model trained by gradient descent needs a loss; here the model computes it internally.
        2: '`compute_metrics()` reports evaluation metrics; it is not run in the forward pass and is not what gets back-propagated.'
        3: It is the other way round. The loss comes first, `backward()` turns it into gradients, and the optimizer only uses them to update the weights.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/4#prepare-for-training
          locator: 'Chapter 3.4: A full training loop, secs. Prepare for training and The training loop'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3
          locator: 'Chapter 3.3: Fine-tuning a model with the Trainer API, section quiz on compute_metrics'
      references_replace: true
  "chapter7/9#q10":
    topic: language-models
    difficulty: medium
    fix:
      explanation: |
        Pretraining from scratch is expensive, so the default is to fine-tune an existing pretrained model,
        which needs far less data, time and compute [^1]. Pretraining a new model makes sense when no
        suitable model exists, for example none in your language, or when your data are very different
        from what the available models were trained on [^2][^3]. Bias is the other good reason: a
        pretrained model can produce sexist, racist or homophobic content, and fine-tuning on your data
        won't remove that intrinsic bias [^4], so you would pretrain on data you have curated, after making
        very sure they really are better. Having lots of data is not enough on its own when a pretrained
        model already fits it [^3].
      why:
        3: Poor results usually come from the fine-tuning setup (data, hyperparameters, bugs); debug that first, since pretraining from scratch costs far more.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
          locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/2
          locator: Chapter 6.2 Training a new tokenizer from an old one, introduction
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/6
          locator: Chapter 7.6 Training a causal language model from scratch, introduction
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/9
          locator: Chapter 1.9 Bias and limitations
      references_replace: true
  "chapter7/9#q11":
    topic: language-models
    difficulty: easy
    fix:
      explanation: |
        Language models are trained in a self-supervised way: the objective (the next word, or a masked
        word) is computed automatically from the raw text, so no human has to label anything [^1]. That
        is what makes pretraining on huge amounts of text feasible [^1]. Plenty of text is indeed online
        and the training code is short, but without a self-supervised objective all that text would still
        need hand-made labels, which is the real bottleneck.
      why:
        0: True, but raw text is only usable at that scale because nobody has to label it. If the objective needed human labels, the amount of text online would hardly help.
        2: True, but short training code isn't what makes huge corpora usable. The bottleneck would be labeling the data, and the self-supervised objective removes it.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
          locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
      references_replace: true
  "chapter11/3#q1":
    topic: huggingface
    difficulty: easy
    fix:
      explanation: |
        The SFT configuration groups `num_train_epochs` and `max_steps` as the training-duration
        parameters: the first sets how many passes over the data to make, the second is the alternative
        that caps the total number of training steps [^1]. When `max_steps` is positive it overrides the
        number of epochs [^2]. Batch size governs memory use and gradient stability, the learning rate the
        size of each weight update, and `warmup_ratio` only the share of training used for warmup [^1];
        gradient checkpointing saves memory at the cost of extra compute per step [^3].
      options:
        0: '`num_train_epochs` and `max_steps`'
        1: '`batch_size` and `learning_rate`'
        2: '`gradient_checkpointing` and `warmup_ratio`'
      why:
        2: Gradient checkpointing trades compute for memory, so it changes the cost of each step but not how many steps are run, and `warmup_ratio` only sets which share of the run is used for learning-rate warmup.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3#training-configuration
          locator: Chapter 11.3 Supervised Fine-Tuning, sec. Training Configuration
        - title: Hugging Face Transformers documentation, Trainer (TrainingArguments)
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments.max_steps
          locator: TrainingArguments, max_steps
          quote: Overrides num_train_epochs. If set to a positive number, the total number of training steps to perform.
        - title: Hugging Face Transformers documentation, Trainer (TrainingArguments)
          url: https://huggingface.co/docs/transformers/main_classes/trainer#transformers.TrainingArguments.gradient_checkpointing
          locator: TrainingArguments, gradient_checkpointing
          quote: Enable gradient checkpointing to trade compute for memory.
      references_replace: true
  "chapter11/3#q2":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Overfitting shows as a growing gap between the curves: the training loss keeps going down while
        the validation loss stops improving or rises [^1][^2]. The model is then fitting details of the
        training examples that do not generalize. When both losses decrease together, training is
        healthy [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3
          locator: 'Chapter 11, Supervised Fine-Tuning: Monitoring Training Progress (Warning Signs to Watch For)'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#overfitting
          locator: 'Chapter 3, Understanding Learning Curves: Overfitting; Healthy Learning Curves'
      references_replace: true
  "chapter11/3#q3":
    topic: training
    difficulty: easy
    fix:
      question: What is `gradient_accumulation_steps` used for?
      explanation: |
        Gradient accumulation runs several forward and backward passes and adds up their gradients
        before a single optimizer step, so the update behaves like one computed on a larger batch [^1].
        Larger batches give more stable gradients but need more memory; accumulating over $k$ small
        batches gives a $k$ times larger effective batch while only one small batch is in memory at a
        time [^1][^2]. For example, a per-device batch size of 4 with 4 accumulation steps gives an
        effective batch size of 16 [^2].
      options:
        0: To increase the effective batch size without using more memory
        1: To save model checkpoints at regular intervals during training
        2: To control how the learning rate changes over the course of training
      why:
        1: This is handled by the `save_steps` and `save_strategy` parameters.
        2: The learning-rate schedule is set by `learning_rate` and warm-up options such as `warmup_ratio`.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3
          locator: 'Chapter 11, Supervised Fine-Tuning: Training Configuration (Batch Size Parameters)'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/3#advanced-training-features
          locator: 'Chapter 3, Fine-tuning a model with the Trainer API: Advanced Training Features'
      references_replace: true
  "chapter11/3#q5":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        In healthy training both losses fall and then level off, and the key indicator is a small gap
        between training and validation loss: the model is learning patterns that generalize rather
        than memorizing the training examples [^1]. A small gap alone is not enough, since an underfit
        model also has close curves, but at a high loss [^2].
      options:
        0: Both losses level off with a small gap between them
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3
          locator: 'Chapter 11, Supervised Fine-Tuning: The Path to Convergence'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/5#underfitting
          locator: 'Chapter 3, Understanding Learning Curves: Underfitting'
      references_replace: true
  "chapter11/5#q1":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        Automatic benchmarks are curated datasets with predefined tasks and metrics. Their key advantage
        is standardization: every model is scored the same way, so results can be compared across models
        and reproduced [^1]. They are not a perfect proxy, though: a model that excels at academic
        benchmarks may still struggle in a specific domain, so benchmarks are only one part of a
        comprehensive evaluation strategy [^1].
      options:
        1: They allow standardized, reproducible comparison between models
      why:
        0: Benchmark scores don't always carry over to real-world use; a model that excels on them can still struggle in a specific domain [^1].
        2: Automatic benchmarks should be one part of a comprehensive evaluation strategy, not the only method [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#understanding-automatic-benchmarks
          locator: Chapter 11.5 Evaluation, secs. Automatic Benchmarks and Understanding Automatic Benchmarks
          quote: The key advantage of using automatic benchmarks is their standardization - they allow for consistent comparison across different models and provide reproducible results.
      references_replace: true
  "chapter11/5#q2":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        MMLU (Massive Multitask Language Understanding) tests knowledge across 57 subjects, from science
        to the humanities [^1]. BBH (Big Bench Hard) and GSM8K are reasoning benchmarks instead: BBH tests
        logical thinking and planning, and GSM8K targets mathematical problem-solving [^1].
      why:
        0: BBH focuses on complex reasoning tasks, not on knowledge across many subjects [^1].
        1: GSM8K targets mathematical problem-solving, not broad subject knowledge [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#general-knowledge-benchmarks
          locator: Chapter 11.5 Evaluation, secs. General Knowledge Benchmarks and Reasoning Benchmarks
          quote: MMLU (Massive Multitask Language Understanding) tests knowledge across 57 subjects, from science to humanities.
      references_replace: true
  "chapter11/5#q3":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        LLM-as-Judge means using one language model to evaluate the outputs of another. It can give more
        nuanced feedback than traditional metrics, but the judge model brings its own biases and
        limitations [^1]. It is an evaluation method, not a benchmark, and it differs from evaluation
        arenas such as Chatbot Arena, where human users chat with two anonymous models and vote for the
        better answer [^1].
      options:
        2: Letting users vote on which of two anonymous models answered better
      why:
        1: LLM-as-Judge is an evaluation method in which a model judges outputs; it is not a benchmark of legal reasoning [^1].
        2: That is an evaluation arena such as Chatbot Arena, where the judges are crowds of human users, not a model [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#alternative-evaluation-approaches
          locator: Chapter 11.5 Evaluation, secs. LLM-as-Judge and Evaluation Arenas
      references_replace: true
  "chapter11/5#q4":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        No single kind of test is enough. Standard benchmarks give a baseline and allow comparison with
        other models, but they should not be the only method [^1]. On top of them you build custom
        evaluation datasets from your actual use case (real user queries, edge cases, hard scenarios) and
        add further layers such as human evaluation, domain-expert review and A/B testing [^1]. Custom data
        alone would lose the comparison with other models; benchmarks alone miss what matters in your
        domain.
      options:
        0: Only standard benchmarks, since they are reproducible and comparable
        2: Only custom datasets built from real queries in your own domain
      why:
        0: Benchmarks give a baseline for comparison but miss what matters in your own use case; a comprehensive strategy adds other methods [^1].
        2: Custom datasets alone lose the comparison with other models; they complement standard benchmarks rather than replace them [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#custom-evaluation
          locator: Chapter 11.5 Evaluation, sec. Custom Evaluation
      references_replace: true
  "chapter11/5#q5":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        Benchmark performance doesn't always translate directly into real-world effectiveness: a model
        that excels at academic benchmarks may still struggle with a specific domain or practical use case
        [^1]. Each benchmark also has blind spots; MMLU, for instance, may not reflect the depth of
        expertise a specific domain needs [^1]. That is why benchmarks should be only one part of the
        evaluation, next to custom, domain-specific tests [^1].
      options:
        0: They are too expensive to run for most model developers
        1: A high benchmark score may not carry over to real-world use
        2: They can only evaluate models below a certain size
      why:
        0: Cost isn't the main limitation; the problem is that a benchmark score may not reflect performance in your use case [^1].
        2: Automatic benchmarks can be run on models of any size.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#understanding-automatic-benchmarks
          locator: Chapter 11.5 Evaluation, secs. Understanding Automatic Benchmarks, General Knowledge Benchmarks and Custom Evaluation
      references_replace: true
  "chapter11/5#q6":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        Standard benchmarks give a baseline, but they know nothing about your application. Custom
        evaluation datasets are built to reflect your actual use case: real user queries from your
        domain, edge cases you have met, and especially challenging scenarios [^1]. They complement the
        standard benchmarks rather than replace them, and building them takes extra work [^1].
      options:
        0: To reflect your use case, e.g. with real user queries from your domain
        1: To replace standard benchmarks entirely with in-house tests
        2: To make evaluation easier and cheaper than running benchmarks
      why:
        1: Custom datasets complement standard benchmarks rather than replace them [^1].
        2: Building a custom dataset takes extra effort; its value is relevance to your use case, not lower cost [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/5#custom-evaluation
          locator: Chapter 11.5 Evaluation, sec. Custom Evaluation
      references_replace: true
  "chapter12/3#q1":                        # GRPO was introduced in DeepSeekMath, not R1
    difficulty: medium
    fix:
      question: What is the main contribution of the DeepSeek-R1 paper (2025)?
      explanation: |
        The paper set out to test whether pure reinforcement learning could develop reasoning without
        supervised fine-tuning [^1]. Its abstract reports that reasoning can be incentivized through
        pure RL, without human-labelled reasoning trajectories, with self-reflection and verification
        emerging during training [^2]; R1 then adds supervised phases for readability [^1]. GRPO, the
        RL algorithm it uses, was introduced earlier in DeepSeekMath [^3], even though the course page
        presents it as new in R1 [^1].
      options:
        - text: Introducing GRPO, a new RL algorithm that compares groups of sampled answers
          why: R1 is trained with GRPO, but GRPO was introduced earlier, in the DeepSeekMath paper (2024).
        - text: Training with far more GPUs and compute than any earlier language model
          why: The contribution is the training method, not the amount of compute.
        - text: Scaling the model to more parameters than any existing language model
          why: The contribution is the training method, not the model size.
        - text: Showing that reasoning can emerge from RL alone, without human-written reasoning examples
          correct: true
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3
          locator: 'Chapter 12.3: Understanding the DeepSeek R1 Paper, introduction and sec. The Training Process'
        - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning'
          url: https://arxiv.org/abs/2501.12948
          locator: Abstract
        - title: 'Shao et al. (2024), DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models'
          url: https://arxiv.org/abs/2402.03300
          locator: Abstract
      references_replace: true
  chapter1/7#q9:
    difficulty: easy
    fix:
      question: You want to fine-tune a dedicated summarization model, which reads a whole document and then writes a shorter text. Which type of Transformer model is the standard choice?
      explanation: |
        Sequence-to-sequence (encoder-decoder) models are best suited to generating a new text from
        a given input, such as a summary or a translation. The encoder reads the whole input with
        bidirectional attention, and the decoder then generates the output text [^1]. The Hugging Face
        LLM Course's guide to choosing an architecture lists encoder-decoder models such as BART and T5
        for summarization [^1]. Modern decoder-only LLMs can summarize as well [^1], but they are
        general-purpose text generators, not the dedicated architecture for this task.
      options:
        0: An encoder-only model
        1: A decoder-only model
      why:
        1: Decoder-only LLMs can summarize a text placed in their prompt, but each token attends only to the tokens before it. Models built specifically for summarization, such as BART and T5, are encoder-decoders [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#sequence-to-sequence-models
          locator: Chapter 1.6 Transformer Architectures, secs. Sequence-to-sequence models, Modern Large Language Models (LLMs) and Choosing the right architecture
      references_replace: true
  chapter6/10#q6:
    difficulty: easy
    fix:
      explanation: |
        Normalization is the first step of the tokenization pipeline, before pre-tokenization: a general
        cleanup such as removing needless whitespace, lowercasing and/or removing accents, possibly with
        Unicode normalization such as NFC or NFKC [^1]. For example, the `bert-base-uncased` tokenizer
        lowercases the text and removes accents [^1].
      why:
        1: No, normalization neither augments data nor removes rare words; it only cleans up the text (whitespace, case, accents).
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#normalization
          locator: Chapter 6.4 Normalization and pre-tokenization, introduction and sec. Normalization
          quote: The normalization step involves some general cleanup, such as removing needless whitespace, lowercasing, and/or removing accents.
      references_replace: true
  chapter6/10#q10:
    difficulty: hard
    fix:
      explanation: |
        Unigram works in the opposite direction to BPE and WordPiece: it starts from a big vocabulary and
        removes tokens until it reaches the desired size [^1][^2]. At each step it computes a loss over the
        whole corpus, the negative log-likelihood of the words under the unigram model, and removes the
        tokens whose removal increases that loss the least [^2]. To tokenize a word, it picks the most
        likely segmentation according to the token probabilities learned in training [^1][^2]. Learning
        merge rules, and splitting words into characters before applying merges, is what BPE does [^1].
      why:
        0: That describes BPE and WordPiece; Unigram goes the other way, starting big and removing tokens.
        3: No, frequency alone does not decide which tokens stay; Unigram removes the tokens whose removal increases the corpus loss the least.
        5: That is how BPE encodes a word; Unigram has no merge rules and picks the most probable segmentation instead.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
          locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/7#training-algorithm
          locator: Chapter 6.7 Unigram tokenization, secs. Training algorithm, Tokenization algorithm and Back to training
      references_replace: true
  chapter7/9#q1:
    difficulty: easy
    fix:
      explanation: |
        Token classification gives a label to each token of a sentence [^1]. Finding the grammatical
        components is part-of-speech tagging, which marks every word as noun, verb, adjective and so on,
        and finding the persons is named entity recognition, which labels each token with an entity class
        or "no entity" [^1]. Deciding whether a whole sentence is grammatical needs one label for the
        sentence, so it is sequence classification. Finding the chunk that answers a question is
        extractive question answering, where the model predicts the start and end positions of the answer
        [^2].
      options:
        3: Find the chunk of words in a sentence that is the answer to a question.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/2#token-classification
          locator: Chapter 7.2 Token classification, introduction
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/7#processing-the-training-data
          locator: Chapter 7.7 Question answering, sec. Processing the training data
      references_replace: true
  chapter7/9#q2:
    difficulty: hard
    fix:
      question: Which parts of the preprocessing for token classification differ from the other preprocessing pipelines?
      explanation: |
        Token classification datasets such as CoNLL-2003 come already split into words, each with a label,
        so instead of the full tokenization pipeline we only apply subword tokenization, passing
        `is_split_into_words=True` to the tokenizer [^1]. The labels then have to follow the inputs: once
        they are aligned with the tokens, they must be padded exactly like the inputs so that both keep the
        same size, which `DataCollatorForTokenClassification` does with the value `-100` [^1]. The words
        still have to be tokenized into subwords, and labelling special tokens with `-100` is not specific
        to this task: `-100` is simply the index the cross-entropy loss ignores [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/2#processing-the-data
          locator: Chapter 7.2 Token classification, secs. Processing the data and Data collation
      references_replace: true
  chapter7/9#q13:
    difficulty: hard
    fix:
      explanation: |
        The model outputs start and end logits for every token, and one long example can produce several
        features [^1]. For each feature, valid (start, end) pairs inside the context are scored, and the
        best candidate over all the features of the example is kept [^1][^2]. Its token positions are then
        mapped to character positions with the offset mapping, and the answer is the matching span of the
        original context [^1][^2]. Generating the answer token by token only happens when QA is framed as
        a sequence-to-sequence task.
      why:
        0: 'Too simple: one long example is split into several features, so the best-scoring candidate over all of them must be chosen, and its tokens mapped back to the context text [^1].'
        1: Close, but the answer is not decoded from the tokens; the offset mapping is used to cut the matching span out of the original context text.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/7#post-processing
          locator: Chapter 7.7 Question answering, sec. Post-processing
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/3b#handling-long-contexts
          locator: Chapter 6.3b Fast tokenizers in the QA pipeline, sec. Handling long contexts
      references_replace: true
  chapter12/2#q4:
    difficulty: easy
    fix:
      explanation: |
        In reinforcement learning, the reward is the feedback the environment gives the agent after an
        action, usually a number: positive when the action was good, negative as a penalty [^1]. For an
        LLM, rewards are designed to reflect how well a response does the task, for example how helpful,
        truthful or harmless it is [^1]. The model then updates its policy, reinforcing the responses that
        earned high rewards and moving away from those that earned low ones [^2]. The reward judges what
        the model says; it doesn't measure its vocabulary, and it isn't a training-speed setting.
      options:
        0: To score how well the model's responses match the desired behavior
        1: To measure how large a vocabulary the model has learned to use
        2: To set how fast the model trains, the way a learning rate does
      why:
        1: Rewards aren't used to evaluate vocabulary knowledge. They score the quality of the responses the model generates.
        2: Training speed is set by things like the optimizer and its learning rate. The reward is feedback on how good a response was.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reward
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reward
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#the-rl-process-trial-and-error
          locator: 'Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. The RL Process: Trial and Error (table, steps 3-4)'
      references_replace: true
  chapter12/3#q4:
    difficulty: easy
    fix:
      explanation: |
        GRPO starts by forming a group: given a prompt, the model doesn't generate one response but
        several attempts at the same problem, usually 4, 8 or 16, which are kept together [^1]. Each
        attempt is scored by a reward function, and the rewards are normalized within the group,
        $A_i = (r_i - \operatorname{mean}(r)) / \operatorname{std}(r)$, so the model learns which answers
        were better or worse than their peers [^2]. All the attempts come from the one policy being
        trained [^3], not from an ensemble of different models, and a group is a set of answers to one
        prompt, not a split of the training data.
      options:
        0: It samples 4–16 answers to the same prompt and scores them together
        1: It combines several different models into one ensemble
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3#group-formation-creating-multiple-solutions
          locator: 'Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. Group Formation: Creating Multiple Solutions'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3#preference-learning-understanding-what-makes-a-good-solution
          locator: 'Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. Preference Learning: Understanding What Makes a Good Solution'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3#grpo-algorithm-in-pseudocode
          locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. GRPO Algorithm in Pseudocode (group_size outputs per prompt)
      references_replace: true
  chapter12/3#q5:
    difficulty: easy
    fix:
      explanation: |
        DeepSeek-R1-Zero applies large-scale RL (GRPO with rule-based accuracy and format rewards)
        directly to the base model, with no supervised fine-tuning first [^2]. It reasons well but
        suffers from poor readability and language mixing, so DeepSeek-R1 uses a multi-stage pipeline:
        cold-start SFT, reasoning RL, rejection sampling with another SFT round, and a final RL stage
        [^1][^2]. Both start from the same pretrained DeepSeek-V3-Base, so they differ in training
        method, not in size or pre-training data [^2].
      options:
        0: R1-Zero is trained with pure RL; R1 adds supervised fine-tuning
        1: R1-Zero is a smaller version of R1 with fewer parameters
        2: R1-Zero was pre-trained on much less text than R1
      why:
        1: Both start from the same DeepSeek-V3-Base model, so they have the same architecture and size; only the post-training differs [^2].
        2: Neither model is pre-trained separately; both start from the same pretrained DeepSeek-V3-Base [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3
          locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Training Process"
        - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning, arXiv:2501.12948v1'
          url: https://arxiv.org/abs/2501.12948v1
          locator: Abstract; Sec. 2.2 DeepSeek-R1-Zero (base model, rewards); Sec. 2.3 DeepSeek-R1 (2.3.1-2.3.4)
      references_replace: true
  chapter4/6#q1:
    difficulty: easy
    fix:
      question: Which models can be hosted on the Hugging Face Hub?
      explanation: |
        The Hub is not limited to 🤗 Transformers or even to NLP: it hosts, for example, Flair and
        AllenNLP models for NLP, Asteroid and pyannote models for speech, and timm models for vision
        [^1]. Each model, whatever library produced it, is stored as a Git repository [^1], so no
        particular interface is required.
      options:
        0: Only models built with the 🤗 Transformers library
        1: Only models whose interface matches the 🤗 Transformers API
        2: Models from many libraries, e.g. timm (vision) or pyannote (speech)
        3: Only models for natural language processing (NLP) tasks
      why:
        0: Models from the 🤗 Transformers library are supported on the Hub, but they are not the only ones.
        1: There is no interface requirement for uploading a model to the Hub.
        3: There is no requirement on the field of application; the Hub also hosts vision and speech models.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/1
          locator: 'Chapter 4.1: The Hugging Face Hub'
      references_replace: true
  chapter4/6#q2:
    difficulty: easy
    fix:
      question: Every model on the Hugging Face Hub lives in a repository. How are the files in these repositories versioned and managed?
      explanation: |
        Each model on the Hub is hosted as a Git repository, which gives versioning and
        reproducibility [^1]. Regular files are managed with git, and large files such as weights are
        registered with Git LFS (Large File Storage) [^2]. The Hub has since moved large-file storage to
        its Xet backend, while Git LFS remains supported [^3]. Besides git, you can also upload with the
        `huggingface_hub` Python library or the web interface [^2].
      options:
        - text: With git, using a large-file extension (Git LFS, now also Xet) for big files such as weights
          correct: true
        - text: Through your own Google Cloud (GCP) account, which stores the model files
          why: The Hub stores the files itself; no cloud account of yours is involved.
        - text: Through peer-to-peer distribution among the users who download the model
          why: Files are served from the Hub's own storage, not shared peer to peer.
        - text: Only through the website, since repositories cannot be cloned and keep no history
          why: Hub repositories can be cloned, pushed to and browsed by revision like any git repository.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/1
          locator: 'Chapter 4.1: The Hugging Face Hub'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/3#uploading-the-model-files
          locator: 'Chapter 4.3: Sharing pretrained models, secs. Uploading the model files and The git-based approach'
        - title: Storage Backend (Xet) (Hugging Face Hub documentation)
          url: https://huggingface.co/docs/hub/xet/index
          locator: Introduction
      references_replace: true
  chapter4/6#q4:
    difficulty: easy
    fix:
      question: What is a model card on the Hugging Face Hub?
      explanation: |
        The model card is the repository's README.md, a Markdown file, and the HF LLM Course calls it
        arguably as important as the model and tokenizer files [^1]. It describes the model, its
        intended uses and limitations, how to use it, its biases, its training data and procedure, and
        its evaluation results [^1]. The idea comes from "Model Cards for Model Reporting", which
        proposes short documents that report a model's evaluation and intended use so that it is not
        used where it is not suited [^2].
      options:
        - text: A Markdown README documenting the model's intended uses, limitations, biases, data and evaluation
          correct: true
        - text: A rough description of the model, less important than the model and tokenizer files
          why: It is arguably as important as the model files; if it is incomplete or missing, the model is much less useful to others.
        - text: A Python script that you run to print information about the model's architecture
          why: A model card is a Markdown file, the repository's README.md, not code.
        - text: The JSON config file that the library reads to rebuild the model's architecture
          why: That is config.json. The model card is documentation written for people.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/4
          locator: 'Chapter 4.4: Building a model card'
        - title: Mitchell et al. (2019), Model Cards for Model Reporting
          url: https://arxiv.org/abs/1810.03993
          locator: Abstract
      references_replace: true
