  chapter2/9#q5:
    difficulty: easy
    fix:
      explanation: |
        `AutoModel` and its relatives are wrappers that look at the checkpoint passed to
        `from_pretrained()`, work out which architecture it belongs to, and instantiate that model
        class with the checkpoint's weights [^1]. So `AutoModel.from_pretrained("bert-base-cased")`
        gives you a BERT model, just as `BertModel.from_pretrained("bert-base-cased")` would [^1]. It
        neither trains on your data nor picks a checkpoint from the input's language: you choose the
        checkpoint yourself.
      why:
        0: That describes [AutoTrain](https://huggingface.co/autotrain), Hugging Face's no-code training tool. `AutoModel` only loads a model from a checkpoint.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/3#creating-a-transformer
          locator: Chapter 2.3 Models, sec. Creating a Transformer
      references_replace: true
  chapter3/2#q2:
    difficulty: easy
    fix:
      explanation: |
        Padding every sample to the longest sequence in the whole dataset (or to the model's maximum
        length) wastes computation on pad tokens. With dynamic padding, padding is postponed until
        the batches are built: a collate function such as `DataCollatorWithPadding` pads each batch
        only to the length of its longest sample, which speeds up training considerably [^1]. It is
        an efficiency choice, not a requirement of the model or of the collator, and it can even cause
        problems on TPUs, which prefer fixed shapes [^1].
      options:
        1: It pads each batch only to its own longest sequence, saving computation.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
          locator: Chapter 3.2 Processing the data, sec. Dynamic padding
      references_replace: true
  chapter11/3#q4:
    difficulty: easy
    fix:
      explanation: |
        Quantitative signals (training and validation loss, learning rate, gradient norms) reveal the
        training dynamics: for example, validation loss rising while training loss falls signals
        overfitting [^1]. But the loss can look fine while the model picks up unwanted behavior, such
        as inconsistent output formatting, so you should also read the model's actual outputs
        regularly [^2]. Each kind of check catches problems that the other misses.
      options:
        1: Only the training loss curve
        2: Only the quality of the model's generated outputs
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3#metrics-to-monitor
          locator: Chapter 11.3 Supervised Fine-Tuning, sec. Metrics to Monitor
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3#warning-signs-to-watch-for
          locator: Chapter 11.3 Supervised Fine-Tuning, sec. Warning Signs to Watch For (closing warning)
      references_replace: true
  chapter12/2#q2:
    difficulty: easy
    fix:
      explanation: |
        Pre-training on next-word prediction makes an LLM fluent, but not necessarily helpful,
        harmless or aligned with what people prefer [^1]. RLHF uses human feedback as the reward
        signal: people compare responses, a reward model learns to predict their preferences, and the
        LLM is then fine-tuned with RL to produce responses that this reward model scores highly [^2].
        It changes what the model says, not how fast it generates text or how much memory it needs.
      options:
        1: It makes models generate text much faster at inference time
        2: It reduces the amount of memory the model needs to run
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#role-of-rl-in-large-language-models-llms
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Role of RL in Large Language Models (LLMs)
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reinforcement-learning-from-human-feedback-rlhf
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reinforcement Learning from Human Feedback (RLHF)
      references_replace: true
  chapter12/2#q3:
    difficulty: easy
    fix:
      explanation: |
        Actions are the choices an agent makes in its environment; when the agent is an LLM, they are
        text-generation decisions, such as which words to produce, which answer to give or how to
        respond in a conversation [^1]. The RL loop separates them from the other steps: the agent
        first observes its state (for an LLM, reads the prompt), then acts, receives a reward, and
        finally updates its policy, which for an LLM means updating its weights [^2].
      options:
        1: Updating the model's weights after it receives a reward
        2: Reading and encoding the tokens of the input prompt
      why:
        1: That is the learning step, in which the policy is improved after rewards come in. It is not an action taken in the environment.
        2: Taking in the prompt is how the agent observes its current state. The action is what it generates in response.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#action
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Action
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#the-rl-process-trial-and-error
          locator: 'Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. The RL Process: Trial and Error (table)'
      references_replace: true
  chapter7/9#q12:
    difficulty: medium
    fix:
      explanation: |
        The labels for extractive QA are the indices of the tokens where the answer starts and ends, but
        the dataset gives the answer as a character position in the context, so the offset mapping is
        needed to turn that character span into start and end tokens [^1]. Long contexts are the other
        difficulty: one example becomes several training features through a sliding window, and features
        that do not contain the whole answer get the label `(0, 0)`, the `[CLS]` token [^1]. Tokenizing the
        inputs is routine, and the answers only need tokenizing when QA is framed as a generative,
        sequence-to-sequence task [^2].
      why:
        0: True, but every NLP task needs tokenized inputs, and it is a routine call to the tokenizer. The difficulties specific to QA are long contexts and locating the answer's tokens.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/7#processing-the-training-data
          locator: Chapter 7.7 Question answering, sec. Processing the training data
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/4#translation
          locator: Chapter 7.4 Translation, introduction (generative question answering)
      references_replace: true
  chapter1/7#q8:
    difficulty: easy
    fix:
      explanation: |
        Decoder models are pretrained to predict the next word, and at each position the attention
        layers can only see the words before it. That makes them best suited to text generation,
        such as continuing a prompt [^1]. Encoder models read the whole sentence in both directions
        and suit understanding tasks such as classification, and sequence-to-sequence models suit
        generating a new text from a given input, such as a translation or a summary [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#decoder-models
          locator: Chapter 1.6 Transformer Architectures, secs. Encoder models, Decoder models, Sequence-to-sequence models and Choosing the right architecture
      references_replace: true
  chapter1/7#q10:
    difficulty: easy
    fix:
      explanation: |
        Encoder models use bidirectional attention, so each token's representation reflects the
        whole sentence. That is what sentence classification needs, and the Hugging Face LLM Course
        suggests encoder models such as BERT and RoBERTa for text classification [^1]. Decoder models
        are built for generating text, and sequence-to-sequence models for turning an input text into a
        new output text, not for extracting a label [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#encoder-models
          locator: Chapter 1.6 Transformer Architectures, secs. Encoder models and Choosing the right architecture
      references_replace: true
  chapter2/9#q1:
    difficulty: easy
    fix:
      explanation: |
        A model can't read raw text, so the tokenizer first splits the text into tokens and maps each
        one to an integer ID [^1]. The model turns those IDs into numbers (hidden states, then logits
        from the head), not text [^2]. When the task needs text back, as in generation or translation,
        the tokenizer's `decode()` turns predicted IDs into a readable string, so the tokenizer is used
        at both ends of the pipeline [^3].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#preprocessing-with-a-tokenizer
          locator: Chapter 2.2 Behind the pipeline, sec. Preprocessing with a tokenizer
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#going-through-the-model
          locator: Chapter 2.2 Behind the pipeline, secs. Going through the model and Model heads
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#decoding
          locator: Chapter 2.4 Tokenizers, sec. Decoding
      references_replace: true
  chapter2/9#q8:
    difficulty: medium
    fix:
      question: |
        Calling a 🤗 Transformers tokenizer on a batch of raw sentences returns tensors that the model
        can use directly. In which order does it do the work?
      explanation: |
        The tokenizer first splits text into tokens and converts them to input IDs with its
        vocabulary [^1]. It then adds the special tokens the model was pretrained with (for BERT,
        `[CLS]` at the start and `[SEP]` at the end) and finally pads or truncates the sequences of
        a batch to a common length, returning an attention mask that marks the real tokens [^2].
        Calling the tokenizer object directly runs all of these steps at once [^2].
      options:
        0: Split into tokens → map tokens to IDs → add special tokens → pad or truncate and build the attention mask
        1: Map words to IDs → split the IDs into subword tokens → pad to equal length → add special tokens
        2: Add special tokens → pad every sentence to equal length → split into tokens → map tokens to IDs
        3: Split into tokens → pad to equal length → map tokens to IDs → the model adds its own special tokens
      why:
        0:
        1: IDs are looked up in the vocabulary of tokens, so the text must be split into tokens first; special tokens are added before padding, so that the padded length includes them.
        2: Padding works on token sequences, so it can only happen after tokenization; the tokenizer pads the finished ID sequences.
        3: Special tokens such as `[CLS]` and `[SEP]` are inserted by the tokenizer, not by the model, and padding comes last.
      correct:
        - 0
      references:
        - source: hf-llm-course
          locator: Chapter 2.4 Tokenizers — Encoding
          url: https://huggingface.co/learn/llm-course/chapter2/4
        - source: hf-llm-course
          locator: Chapter 2.6 Putting it all together — Special tokens
          url: https://huggingface.co/learn/llm-course/chapter2/6
      references_replace: true
  chapter2/9#q9:
    difficulty: easy
    fix:
      explanation: |
        `tokenize()` performs only the first step of encoding, splitting the text into tokens, and its
        output is a list of strings [^1]; for `"Hello!"` that is `['Hello', '!']`. Turning tokens
        into IDs is the second step, done by `convert_tokens_to_ids()` [^2] (calling the tokenizer
        directly does both steps and more). Returning one joined string would undo the split.
      why:
        1: Mapping tokens to IDs is a separate step, done by `convert_tokens_to_ids()` or by calling the tokenizer directly.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#tokenization
          locator: Chapter 2.4 Tokenizers, sec. Tokenization
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#from-tokens-to-input-ids
          locator: Chapter 2.4 Tokenizers, sec. From tokens to input IDs
      references_replace: true
  chapter2/9#q10:
    difficulty: easy
    fix:
      explanation: |
        Text must be preprocessed exactly as it was when the model was pretrained, so the tokenizer and the
        model should be loaded from the same checkpoint [^1]. Here the BERT tokenizer produces IDs from
        BERT's vocabulary (with `[CLS]` and `[SEP]`), which GPT-2 reads as unrelated tokens of its own
        vocabulary, so even if the code runs, the output is meaningless.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2
          locator: Chapter 2.2 Behind the pipeline, "Preprocessing with a tokenizer"
      references_replace: true
  chapter6/10#q1:
    difficulty: medium
    fix:
      explanation: |
        Fine-tuning a pretrained model always uses the tokenizer that model was pretrained with [^1]. A new
        tokenizer is needed when you train a model from scratch on a corpus unlike the original one, such
        as another language or domain: a tokenizer trained on English, for instance, performs poorly on
        Japanese, where spaces and punctuation are used very differently [^1][^2]. If your data resemble
        the original corpus, it is cheaper to keep the pretrained model and its tokenizer and fine-tune
        [^3].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/1
          locator: Chapter 6.1 The 🤗 Tokenizers library, introduction
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/2
          locator: Chapter 6.2 Training a new tokenizer from an old one, introduction
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transfer-learning
          locator: Chapter 1.4 How do Transformers work?, sec. Transfer Learning
      references_replace: true
  chapter6/10#q7:
    difficulty: medium
    fix:
      explanation: |
        Pre-tokenization comes after normalization and before the tokenizer model: a tokenizer cannot be
        trained on raw text alone, so the text is first split into small entities such as words, and these
        act as boundaries for the subwords the tokenizer learns [^1]. BERT's pre-tokenizer splits on
        whitespace and punctuation; GPT-2's does too but keeps the spaces as a `Ġ` symbol; T5's splits
        only on whitespace [^1]. Cleanup is the normalization step, and splitting words into subword tokens
        is the job of the tokenizer model itself [^1].
      why:
        0: Random masking is a training-time step on token IDs (done e.g. by a data collator); the tokenizer pipeline has no augmentation stage.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#pre-tokenization
          locator: Chapter 6.4 Normalization and pre-tokenization, sec. Pre-tokenization
      references_replace: true
  chapter6/10#q8:
    difficulty: medium
    fix:
      explanation: |
        BPE starts from a small vocabulary, the symbols used to write the words of the corpus, and learns
        merge rules: at each step it merges the most frequent pair of tokens, until the vocabulary reaches
        the desired size [^1][^2]. To tokenize a new word, it splits the word into characters and applies
        the learned merges in order [^1][^2]. Starting from a big vocabulary and removing tokens is what
        Unigram does; scoring pairs so that pairs of rarer parts win, and encoding by the longest match
        from the start of the word, is WordPiece [^1].
      why:
        1: That is Unigram, which starts from a large vocabulary and prunes it; BPE grows a small one by merges.
        3: That is WordPiece's score, freq(a, b) / (freq(a) × freq(b)); BPE simply merges the most frequent pair.
        5: That is WordPiece's longest-match-first encoding; BPE replays its learned merges on the characters of the word.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
          locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/5#training-algorithm
          locator: Chapter 6.5 Byte-Pair Encoding tokenization, secs. Training algorithm and Tokenization algorithm
      references_replace: true
  chapter6/10#q9:
    difficulty: hard
    fix:
      explanation: |
        Like BPE, WordPiece starts from a small vocabulary (the special tokens and the initial alphabet)
        and learns merge rules [^2]. Instead of merging the most frequent pair, it merges the pair with
        the best score, $\text{score}(a, b) = \dfrac{\text{freq}(a, b)}{\text{freq}(a) \times \text{freq}(b)}$,
        which favours pairs whose individual parts are less frequent [^1][^2]. It keeps only the final
        vocabulary, and it encodes a word by repeatedly taking the longest subword from the start that is
        in the vocabulary [^1][^2]. Merging the most frequent pair is BPE; starting from a big vocabulary
        and choosing the most likely segmentation is Unigram [^1].
      why:
        1: That is Unigram; WordPiece, like BPE, grows a small vocabulary by merges.
        2: That is BPE; WordPiece divides the pair's frequency by the frequencies of its two parts.
        4: That is Unigram, which picks the segmentation with the highest probability under its token model.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/4#algorithm-overview
          locator: Chapter 6.4 Normalization and pre-tokenization, sec. Algorithm overview (table)
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter6/6#training-algorithm
          locator: Chapter 6.6 WordPiece tokenization, secs. Training algorithm and Tokenization algorithm
      references_replace: true
  chapter7/9#q3:
    difficulty: medium
    fix:
      explanation: |
        The dataset gives one label per word, but the subword tokenizer can split a word into several
        tokens. In the first CoNLL-2003 sentence "lamb" becomes `la` and `##mb`, so 9 labels face 12
        tokens once `[CLS]` and `[SEP]` are added [^1]. The labels must therefore be aligned with the
        tokens: using `word_ids()`, each token gets the label of its word, with `B-` turned into `I-`
        inside a word [^1]. The special tokens are the easy part: they get the label `-100`, which the loss
        ignores [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/2#processing-the-data
          locator: Chapter 7.2 Token classification, sec. Processing the data
      references_replace: true
  chapter7/9#q6:
    difficulty: medium
    fix:
      explanation: |
        A sequence-to-sequence task turns an input text into a new output text, which is what
        encoder-decoder models are built for: summarization, translation and generative question
        answering [^1]. Writing short reviews of long documents is summarization, translating Chinese into
        English is translation, answering questions about a document can be framed as generative question
        answering, and rewriting someone's messages in proper English is style transfer, a translation
        within one language [^2]. All four options are therefore sequence-to-sequence problems.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#sequence-to-sequence-models
          locator: Chapter 1.6 Transformer Architectures, sec. Sequence-to-sequence models
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/4#translation
          locator: Chapter 7.4 Translation, introduction
      references_replace: true
  chapter12/2#q1:
    difficulty: easy
    fix:
      explanation: |
        In reinforcement learning an agent (for an LLM, the model itself) interacts with an
        environment: it takes actions, receives rewards as feedback, and improves its policy, the
        strategy that picks an action in each situation, so that it earns higher rewards [^1].
        Model, data, loss function and optimizer are the ingredients of an ordinary supervised
        training run, and input, output and hidden layers describe a network's architecture; neither
        list names the parts of this interaction loop.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#what-is-reinforcement-learning-rl
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. What is Reinforcement Learning (RL)? (Agent, Environment, Action, Reward, Policy)
      references_replace: true
  chapter12/2#q5:
    difficulty: easy
    fix:
      explanation: |
        A reward is the feedback the environment gives the agent after an action, and it is usually a
        number: positive for good behavior, negative as a penalty [^1]. For an LLM it scores a
        response, for example on how helpful, truthful or harmless it is [^1]. What generates the
        responses is the policy, the LLM itself. A model that scores responses is a reward model: in
        RLHF it is what produces the rewards, but the reward is the score it outputs, not the model [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reward
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reward
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reinforcement-learning-from-human-feedback-rlhf
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reinforcement Learning from Human Feedback (RLHF)
      references_replace: true
  chapter12/3#q2:
    difficulty: medium
    fix:
      explanation: |
        DeepSeek-R1 starts from the pretrained DeepSeek-V3-Base and alternates supervised
        fine-tuning (SFT) and RL in four stages [^1][^2]; generic project stages such as testing and
        deployment are not part of this recipe.

        1. **Cold start:** SFT on thousands of high-quality, readable chain-of-thought examples.
        2. **Reasoning RL:** large-scale RL on verifiable tasks (math, code, science, logic), with
           rule-based rewards for correct answers.
        3. **Rejection sampling:** the RL checkpoint generates many answers, only good ones are kept
           (checked by rules or judged by DeepSeek-V3), and they become data for another round of SFT.
        4. **Diverse RL:** a final RL stage on all kinds of prompts, with rule-based rewards for
           reasoning and model-based rewards for human preferences such as helpfulness and harmlessness.
      why:
        1: This is a generic model lifecycle. R1 starts from the already pretrained DeepSeek-V3-Base, and testing and deployment are not training stages; its four stages alternate SFT and RL [^1][^2].
        2: These are generic project steps. In R1, new training data is produced inside the stages themselves, e.g. rejection sampling from the RL checkpoint creates the data for the next SFT round [^1][^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3#the-training-process
          locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, sec. The Training Process (Cold Start, Reasoning RL, Rejection Sampling, Diverse RL)
        - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning, arXiv:2501.12948v1'
          url: https://arxiv.org/abs/2501.12948v1
          locator: 'Sec. 2.3 DeepSeek-R1: Reinforcement Learning with Cold Start, 2.3.1-2.3.4'
      references_replace: true
  chapter12/3#q3:
    difficulty: easy
    fix:
      explanation: |
        During RL training of DeepSeek-R1-Zero, an intermediate version of the model learned, without
        being taught to, to allocate more thinking time to a problem by re-evaluating its initial
        approach; the authors call this its "aha moment" [^2]. The HF course breaks it into four steps:
        an initial attempt, recognizing an error or inconsistency, self-correcting, and explaining why
        the new approach is better [^1]. It emerged from the RL incentives alone, rule-based rewards for
        correct and well-formatted answers, not from a special reward or a training milestone [^2].
      options:
        - text: The model learns, unprompted, to stop, spot an error in its reasoning and rethink it
          correct: true
        - text: The point at which the model's benchmark scores first reach human level
          why: It is not a performance milestone but a change in how the model reasons, re-evaluating its initial approach [^1][^2].
        - text: The moment training ends and the final checkpoint is chosen
          why: The behaviour appeared in an intermediate version of R1-Zero during RL training, not at the end [^2].
        - text: A bonus reward given whenever a problem is solved on the first attempt
          why: R1-Zero is trained only with rule-based accuracy and format rewards; the aha moment is emergent behaviour, not a reward [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/3
          locator: Chapter 12.3 Understanding the DeepSeek R1 Paper, "The Breakthrough 'Aha' Moment"
        - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning, arXiv:2501.12948v1'
          url: https://arxiv.org/abs/2501.12948v1
          locator: Sec. 2.2.2 Reward Modeling; Sec. 2.2.4 Performance, Self-evolution Process and Aha Moment of DeepSeek-R1-Zero
      references_replace: true
