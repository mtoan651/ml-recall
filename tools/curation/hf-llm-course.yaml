  "chapter3/4#q2":
    topic: training
    difficulty: medium
    fix:
      question: In a training loop that uses a learning-rate scheduler, what is the correct order of operations for each batch?
      explanation: |
        The forward pass computes the loss, the backward pass fills in the gradients, and the optimizer
        step uses them to update the parameters; the course's loop then steps the learning-rate scheduler
        and clears the gradients [^1]. PyTorch also requires the scheduler to be stepped after the
        optimizer's update [^2]. PyTorch adds each new gradient to the one already stored [^3], so the
        gradients are cleared once per batch, but never between the backward pass and the optimizer
        step: either at the end, as here, or at the start of the next iteration, as in PyTorch's own
        examples [^2].
      options:
        0: Forward pass → Backward pass → Scheduler step → Optimizer step → Zero gradients
        3: Forward pass → Backward pass → Zero gradients → Optimizer step → Scheduler step
      why:
        0: The scheduler should step after the optimizer. In PyTorch, calling the scheduler before the optimizer's update skips the first value of the learning-rate schedule.
        2: The optimizer step comes before the backward pass here, so it cannot use the gradients of the current batch.
        3: Zeroing the gradients between the backward pass and the optimizer step wipes out the gradients that were just computed.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/4#the-training-loop
          locator: 'Chapter 3, A full training loop: The training loop'
        - title: torch.optim (PyTorch documentation)
          url: https://docs.pytorch.org/docs/stable/optim.html#how-to-adjust-learning-rate
          locator: Taking an optimization step; How to adjust learning rate
          quote: Learning rate scheduling should be applied after optimizer’s update
        - source: d2l
          url: https://d2l.ai/chapter_preliminaries/autograd.html#a-simple-function
          locator: Sec. 2.5.1 A Simple Function
          quote: Instead, the new gradient is added to the already-stored gradient.
      references_replace: true
