    topic: huggingface
    fix:
      question: What is the proper way to preprocess the data for a sequence-to-sequence problem with a 🤗 Transformers tokenizer?
      options:
        0: Pass the inputs as usual and the targets through the tokenizer's `text_target` argument.
        1: Tokenize the inputs and the targets with two ordinary calls, treating both the same way.
        3: Concatenate each input with its target and tokenize the result as one sequence.
      why:
        1: Then the targets go through the input tokenizer; for a Marian translation model, a French target gets split into many meaningless pieces. Mark them as targets with `text_target`.
        2: Not in a sequence-to-sequence problem; the targets are also texts we need to convert into numbers!
        3: That is how data is prepared for a decoder-only (causal) language model; an encoder-decoder model takes the inputs and the labels separately.
        0:
