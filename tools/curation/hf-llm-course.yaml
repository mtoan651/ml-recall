      references_replace: true
  chapter8/7#q4:
    topic: training
    difficulty: easy
    fix:
      question: |
        `trainer.train()` (🤗 Transformers `Trainer`) fails with a cryptic error that doesn't say where
        it comes from. The `Trainer` turns datasets into dataloaders, feeds batches to the model,
        computes gradients, updates the weights and evaluates. Where should you look first?
      explanation: |
        An error in `trainer.train()` can come from the dataset, the batching, the model, the optimizer
        or the metric, so the best approach is to walk through the pipeline in order [^1]. The first
        stop is the data: if it is corrupted, the `Trainer` cannot even form batches, so look inside
        `trainer.train_dataset` and decode a few inputs and labels [^1]. Only then move on to the
        dataloader, the model's forward pass, the optimization step and finally evaluation [^1].
      options:
        0: The optimization step, where gradients are computed and the weights updated
        1: The evaluation step, where the metrics are computed
        2: The training dataset itself, by inspecting and decoding a few examples
        3: The dataloader that collates examples into batches
      why:
        0: Bugs can hide there, but it comes several steps into the pipeline, so check the earlier stages first.
        1: Evaluation usually runs after a full epoch of training, so check something earlier in the pipeline first.
        3: Very close, but the dataloader is built from the dataset; if the data is corrupted it cannot form batches, so check the dataset first.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#check-your-data
          locator: 'Chapter 8.4: Debugging the training pipeline, secs. Debugging the training pipeline and Check your data'
      references_replace: true
  chapter8/7#q5:
    topic: pytorch
    difficulty: medium
    fix:
      question: Your PyTorch training code fails on the GPU with a CUDA error that is **not** an out-of-memory error. What is usually the best way to debug it?
      explanation: |
        GPU operations run asynchronously: when one fails, the error only surfaces at a later
        synchronization, so the traceback points somewhere unrelated, e.g. at the backward pass for a
        bug in the forward pass [^1] [^2]. Unless it is an out-of-memory error, the course's advice is to
        go back to the CPU, where the same bug gives a precise error message [^1]. PyTorch can also
        force synchronous execution with `CUDA_LAUNCH_BLOCKING=1`, so that the stack trace shows where
        the error happened [^2].
      options:
        0: Post the error message on the forums or on GitHub
        1: Run the same code on the CPU to get an informative error
        2: Read the traceback to find the line that caused the error
        3: Reduce the batch size
        4: Restart the Jupyter kernel and run the code again
      why:
        0: CUDA error messages are usually very uninformative, so others can do little with them either.
        2: GPU operations are asynchronous, so the error is raised at a later synchronization point, far from the operation that caused it.
        3: That is the usual fix for CUDA out-of-memory errors, not for other CUDA errors.
        4: A CUDA error does break the kernel, so you must restart it, but running the same code again gives the same error.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#going-through-the-model
          locator: 'Chapter 8.4: Debugging the training pipeline, sec. Going through the model'
        - title: CUDA semantics (PyTorch documentation)
          url: https://docs.pytorch.org/docs/2.14/notes/cuda.html#asynchronous-execution
          locator: Asynchronous execution
      references_replace: true
  chapter8/7#q7:
    topic: training
    difficulty: medium
    fix:
      question: When a model doesn't seem to train properly, why is overfitting a single batch a good debugging test?
      explanation: |
        Training again and again on one batch tests whether the problem, as you framed it, can be solved
        by the model you are training, and it also shows whether the initial learning rate is too high
        [^1]. A working setup reaches near-perfect results on that batch (e.g. 100% accuracy); if it
        can't, something is wrong with how the problem or the data is framed, and only after passing the
        test can you be sure the model can learn [^1]. The memorized batch says nothing about
        generalization, and shape errors would stop training before this test.
      options:
        - text: It isn't; overfitting is always bad and should be avoided
          why: On the full dataset overfitting is a sign of poor generalization, but in this test you train on one batch on purpose.
        - text: 'It checks that the model can learn at all: the loss on that batch should drop to near zero'
          correct: true
        - text: It checks that the tensor shapes of the inputs and labels match what the model expects
          why: With misaligned shapes you could not train even on one batch; the test assumes training already runs.
        - text: It gives a quick estimate of the validation accuracy the full model will reach
          why: A model that memorizes one batch tells you nothing about how well it generalizes.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#overfit-your-model-on-one-batch
          locator: 'Chapter 8.4: Debugging the training pipeline, sec. Overfit your model on one batch'
      references_replace: true
