  chapter4/6#q1:
    difficulty: easy
    fix:
      question: Which models can be hosted on the Hugging Face Hub?
      explanation: |
        The Hub is not limited to 🤗 Transformers or even to NLP: it hosts, for example, Flair and
        AllenNLP models for NLP, Asteroid and pyannote models for speech, and timm models for vision
        [^1]. Each model, whatever library produced it, is stored as a Git repository [^1], so no
        particular interface is required.
      options:
        0: Only models built with the 🤗 Transformers library
        1: Only models whose interface matches the 🤗 Transformers API
        2: Models from many libraries and fields, e.g. timm for vision or pyannote for speech
        3: Only models for natural language processing (NLP) tasks
      why:
        0: Models from the 🤗 Transformers library are supported on the Hub, but they are not the only ones.
        1: There is no interface requirement for uploading a model to the Hub.
        3: There is no requirement on the field of application; the Hub also hosts vision and speech models.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/1
          locator: 'Chapter 4.1: The Hugging Face Hub'
      references_replace: true
  chapter4/6#q2:
    difficulty: easy
    fix:
      question: Every model on the Hugging Face Hub lives in a repository. How are the files in these repositories versioned and managed?
      explanation: |
        Each model on the Hub is hosted as a Git repository, which gives versioning and
        reproducibility [^1]. Regular files are managed with git, and large files such as weights are
        registered with Git LFS (Large File Storage) [^2]. The Hub has since moved large-file storage to
        its Xet backend, while Git LFS remains supported [^3]. Besides git, you can also upload with the
        `huggingface_hub` Python library or the web interface [^2].
      options:
        - text: With git, using a large-file extension (Git LFS, now also Xet) for big files such as weights
          correct: true
        - text: Through your own Google Cloud (GCP) account, which stores the model files
          why: The Hub stores the files itself; no cloud account of yours is involved.
        - text: Through peer-to-peer distribution among the users who download the model
          why: Files are served from the Hub's own storage, not shared peer to peer.
        - text: Only through the website, since repositories cannot be cloned and keep no history
          why: Hub repositories can be cloned, pushed to and browsed by revision like any git repository.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/1
          locator: 'Chapter 4.1: The Hugging Face Hub'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/3#uploading-the-model-files
          locator: 'Chapter 4.3: Sharing pretrained models, secs. Uploading the model files and The git-based approach'
        - title: Storage Backend (Xet) (Hugging Face Hub documentation)
          url: https://huggingface.co/docs/hub/xet/index
          locator: Introduction
      references_replace: true
  chapter4/6#q4:
    difficulty: easy
    fix:
      question: What is a model card on the Hugging Face Hub?
      explanation: |
        The model card is the repository's README.md, a Markdown file, and the course calls it arguably
        as important as the model and tokenizer files [^1]. It describes the model, its intended uses
        and limitations, how to use it, its biases, its training data and procedure, and its evaluation
        results [^1]. The idea comes from "Model Cards for Model Reporting", which proposes short
        documents that report a model's evaluation and intended use so that it is not used where it is
        not suited [^2].
      options:
        - text: A Markdown README documenting the model's intended uses, limitations, biases, data and evaluation
          correct: true
        - text: A rough description of the model, less important than the model and tokenizer files
          why: It is arguably as important as the model files; if it is incomplete or missing, the model is much less useful to others.
        - text: A Python script that you run to print information about the model's architecture
          why: A model card is a Markdown file, the repository's README.md, not code.
        - text: The JSON config file that the library reads to rebuild the model's architecture
          why: That is config.json. The model card is documentation written for people.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/4
          locator: 'Chapter 4.4: Building a model card'
        - title: Mitchell et al. (2019), Model Cards for Model Reporting
          url: https://arxiv.org/abs/1810.03993
          locator: Abstract
      references_replace: true
  chapter4/6#q5:
    difficulty: medium
    fix:
      question: Which of these objects can be uploaded to the Hub directly by calling their own `push_to_hub()` method?
      explanation: |
        Models, tokenizers and configuration objects each have a `push_to_hub()` method that creates the
        repository and uploads their files [^1]. A `Trainer` has one too: `trainer.push_to_hub()`
        uploads the final model and generates a model card with the hyperparameters and evaluation
        results [^1]. A data collator such as `DataCollatorWithPadding` is just the function that pads
        the samples of a batch to the same length [^2], so there is nothing to push.
      options:
        - text: A tokenizer
          correct: true
        - text: A model configuration
          correct: true
        - text: A model
          correct: true
        - text: A `Trainer`
          correct: true
        - text: A data collator such as `DataCollatorWithPadding`
          why: A data collator only pads examples into batches; it has no files to share and no `push_to_hub()` method.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/3#using-the-pushtohub-api
          locator: 'Chapter 4.3: Sharing pretrained models, sec. Using the push_to_hub API'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
          locator: 'Chapter 3.2: Processing the data, sec. Dynamic padding'
      references_replace: true
  chapter4/6#q6:
    difficulty: easy
    fix:
      question: Before you can upload with `push_to_hub()` or the `hf` command-line tool, what must you do first on your machine?
      explanation: |
        Uploading needs an authentication token so that the `huggingface_hub` API knows who you are and
        which namespaces you can write to [^1]. In a notebook you log in with `notebook_login()`, and in
        a terminal with the CLI's login command [^1], which is now `hf auth login` (the course still
        shows the older `huggingface-cli login`) [^2]. Logging in on the website or setting up Git LFS
        does not store a token for your local code.
      options:
        - text: Log in on the huggingface.co website in your browser
          why: A browser session does not give your local Python process or terminal a token.
        - text: Run `hf auth login` in a terminal
          correct: true
        - text: Run `notebook_login()` in a notebook
          correct: true
        - text: Run `git lfs install` in the model folder
          why: That only prepares git for large files; it does not authenticate you.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter4/3#using-the-pushtohub-api
          locator: 'Chapter 4.3: Sharing pretrained models, sec. Using the push_to_hub API'
        - title: Command Line Interface (Hugging Face Hub documentation)
          url: https://huggingface.co/docs/huggingface_hub/guides/cli#hf-auth-login
          locator: hf auth login
      references_replace: true
  chapter5/8#q1:
    difficulty: easy
    fix:
      question: The `load_dataset()` function in 🤗 Datasets can load a dataset from which of these locations?
      explanation: |
        `load_dataset()` downloads datasets from the Hub by name, and it also loads local and remote
        files: you give the format (`csv`, `json`, `text`, ...) and point `data_files` at local paths or
        at URLs [^1] [^2]. Data that is already in memory, such as a Python dict or a list of dicts, is
        turned into a dataset with `Dataset.from_dict()` or `Dataset.from_list()` [^2].
      options:
        - text: Local files, e.g. CSV or JSON files on your laptop
          correct: true
        - text: The Hugging Face Hub, by dataset name
          correct: true
        - text: A remote server, by passing URLs as `data_files`
          correct: true
        - text: A Python list in memory, passed as the first argument
          why: The first argument is a dataset name or a path (a string). Data already in memory is wrapped with `Dataset.from_list()` or `Dataset.from_dict()` instead.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/2#working-with-local-and-remote-datasets
          locator: "Chapter 5.2: What if my dataset isn't on the Hub?, secs. Loading a local dataset and Loading a remote dataset"
        - title: Load (🤗 Datasets documentation)
          url: https://huggingface.co/docs/datasets/loading
          locator: Hugging Face Hub; Local and remote files; In-memory data
      references_replace: true
  chapter5/8#q2:
    difficulty: easy
    fix:
      explanation: |
        A random sample is made by chaining `Dataset.shuffle()` and `Dataset.select()`: shuffle the
        whole dataset, then select the first indices of the shuffled result [^1]. Selecting first and
        shuffling afterwards only reorders the first 50 rows. `Dataset` has no `sample()` method, and the
        first parameter of `shuffle()` is the seed, so `shuffle(50)` still returns every row [^2].
      options:
        - text: '`dataset.sample(50)`'
          why: There is no `Dataset.sample()` method.
        - text: '`dataset.shuffle().select(range(50))`'
          correct: true
        - text: '`dataset.select(range(50)).shuffle()`'
          why: The code runs, but it only shuffles the first 50 elements of the dataset, so the sample is not random.
        - text: '`dataset.shuffle(50)`'
          why: The first parameter of `shuffle()` is the random seed, so this returns the whole dataset in a new order.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/3#slicing-and-dicing-our-data
          locator: 'Chapter 5.3: Time to slice and dice, sec. Slicing and dicing our data'
        - title: Dataset.shuffle (🤗 Datasets documentation)
          url: https://huggingface.co/docs/datasets/package_reference/main_classes#datasets.Dataset.shuffle
          locator: Main classes, Dataset.shuffle, parameter seed
      references_replace: true
  chapter5/8#q3:
    difficulty: easy
    fix:
      explanation: |
        `Dataset.filter()` keeps the rows for which a function returns `True`, and that function can be
        a named function or a lambda [^1]. A lambda takes the general form
        `lambda <arguments> : <expression>`, so the version without an argument is a syntax error
        [^1]. `Dataset.select()` takes an iterable of indices such as `range(1000)`, not a condition
        [^1].
      options:
        - text: "`pets_dataset.filter(lambda x: x['name'].startswith('L'))`"
          correct: true
        - text: "`pets_dataset.filter(lambda x['name'].startswith('L'))`"
          why: 'This is a syntax error: a lambda has the form `lambda <arguments> : <expression>`, so it needs an argument before the colon.'
        - text: "Define `def filter_names(x): return x['name'].startswith('L')` and run `pets_dataset.filter(filter_names)`"
          correct: true
        - text: "`pets_dataset.select(lambda x: x['name'].startswith('L'))`"
          why: '`select()` expects an iterable of row indices, not a function; keeping rows that satisfy a condition is the job of `filter()`.'
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/3#slicing-and-dicing-our-data
          locator: 'Chapter 5.3: Time to slice and dice, sec. Slicing and dicing our data'
      references_replace: true
  chapter5/8#q4:
    difficulty: easy
    fix:
      question: 🤗 Datasets treats each dataset as a memory-mapped file. What is memory mapping?
      explanation: |
        🤗 Datasets treats each dataset as a memory-mapped file, which provides a mapping between RAM and
        filesystem storage [^1]. The library can then access and operate on elements of the dataset
        without loading all of it into memory, which is how a dataset of almost 20 GB can be used with
        far less RAM [^1]. It has nothing to do with GPU memory or with a tokenizer's vocabulary.
      options:
        - text: A mapping between CPU RAM and GPU memory
          why: Memory mapping is about RAM and files on disk, not about moving data to the GPU.
        - text: A mapping between RAM and filesystem storage
          correct: true
        - text: A mapping between two files in the 🤗 Datasets cache
          why: It maps a file on disk into memory, not one file onto another.
        - text: A mapping from each token to its ID in the vocabulary
          why: That is the tokenizer's vocabulary, which has nothing to do with how the dataset is stored.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. The magic of memory mapping'
      references_replace: true
  chapter5/8#q5:
    difficulty: medium
    fix:
      question: What are the main benefits of the memory mapping used by 🤗 Datasets?
      explanation: |
        A memory-mapped dataset can be accessed and operated on without being fully loaded into memory
        [^1]. Memory-mapped files can also be shared across processes, so methods like `Dataset.map()`
        can be parallelized without moving or copying the dataset [^1]. Memory mapping neither loads
        everything into RAM up front nor compresses the data; for corpora too large even for the disk,
        the course turns to streaming [^1].
      options:
        - text: Several processes can share one memory-mapped file, so `Dataset.map()` can run in parallel without copying the data
          correct: true
        - text: Programs can access parts of an extremely large file without first reading the whole file into RAM
          correct: true
        - text: The whole dataset is read into RAM once, so that later accesses never touch the disk
          why: It is the opposite. Memory mapping avoids loading the whole dataset into RAM.
        - text: The dataset is compressed, so that it takes up much less space on disk
          why: Memory mapping changes how a file is accessed, not how big it is on disk.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#the-magic-of-memory-mapping
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, secs. The magic of memory mapping and Streaming datasets'
      references_replace: true
  chapter5/8#q6:
    difficulty: easy
    fix:
      question: |
        With `streaming=True`, `load_dataset()` does not download the whole dataset first:

        ```py
        from datasets import load_dataset

        dataset = load_dataset("allocine", streaming=True, split="train")
        ```

        Why can't you get the first review with `dataset[0]`, as you could without streaming?
      explanation: |
        With `streaming=True`, `load_dataset()` returns an `IterableDataset` instead of a `Dataset`, and
        its elements are accessed by iterating over it, e.g. `next(iter(dataset))` [^1]. Streaming is
        meant precisely for corpora too large for RAM or even the disk, because entries are read on the
        fly [^1]. To pick examples from a stream you use `take()` and `skip()` rather than indices [^1].
      options:
        - text: It is too large to fit in RAM, so streaming refuses to return single elements
          why: Streamed datasets are decompressed on the fly, so you can process terabyte-sized datasets with very little RAM.
        - text: Streaming returns an `IterableDataset`, which has no random access by index
          correct: true
        - text: The `allocine` dataset has no `train` split
          why: It has train, validation and test splits; the problem is the type of object that streaming returns.
        - text: Streamed examples arrive as token IDs and must be decoded before they can be read
          why: Streamed examples are ordinary dicts of raw fields, as in a regular dataset; tokenizing is a separate `map()` step.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/4#streaming-datasets
          locator: 'Chapter 5.4: Big data? 🤗 Datasets to the rescue!, sec. Streaming datasets'
      references_replace: true
  chapter5/8#q7:
    difficulty: easy
    fix:
      question: Which of the following are the main benefits of writing a dataset card for a dataset you share on the Hub?
      explanation: |
        A dataset card, the repository's README.md, gives users the context to decide whether the
        dataset is relevant to their task and to evaluate potential biases or risks in using it [^1].
        Well-documented datasets are also more likely to be useful to others, including your future self
        [^1]. Writing down a bias does not remove it from the data, though.
      options:
        - text: It tells others the intended use and supported tasks, so they can decide whether the dataset suits them
          correct: true
        - text: It draws attention to the biases present in the corpus
          correct: true
        - text: It makes it more likely that others in the community will use the dataset
          correct: true
        - text: It removes the biases in the corpus by documenting them
          why: Documenting a bias helps users evaluate the risks, but it does not change the data.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/5#creating-a-dataset-card
          locator: 'Chapter 5.5: Creating your own dataset, sec. Creating a dataset card'
      references_replace: true
  chapter5/8#q8:
    topic: text-representation
    difficulty: easy
    fix:
      type: single
      explanation: |
        Semantic search embeds the documents of a corpus and the query into the same vector space and
        returns the documents whose embeddings are most similar to the query's [^1] [^2]. Because it
        matches meaning rather than wording, it also copes with synonyms, abbreviations and
        misspellings, whereas keyword search engines only find lexical matches [^2]. Counting keywords,
        in one language or several, is still lexical search.
      options:
        - text: Finding documents that contain the exact words of the query
          why: That is lexical (keyword) search, what traditional search engines do.
        - text: Finding documents by meaning, comparing embeddings of the query and documents
          correct: true
        - text: Ranking documents by how many of the query's keywords they contain
          why: Counting shared keywords is still lexical matching; a document that uses synonyms would score zero.
        - text: Translating the query into several languages and keyword-searching each one
          why: The matching would still be on exact words; translation does not add an understanding of meaning.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/6#using-embeddings-for-semantic-search
          locator: 'Chapter 5.6: Semantic search with FAISS, sec. Using embeddings for semantic search'
        - title: Semantic Search (Sentence Transformers documentation)
          url: https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html#background
          locator: Introduction and sec. Background
      references_replace: true
  chapter5/8#q9:
    topic: text-representation
    difficulty: medium
    fix:
      question: In *asymmetric* semantic search, what do the query and the matching documents usually look like?
      explanation: |
        In symmetric semantic search the query and the corpus entries have about the same length and
        content, as when looking for similar questions, and you could swap query and entries [^1]. In
        asymmetric search you usually have a short query, such as a question or some keywords, and want
        a longer paragraph that answers it, so swapping them makes no sense [^1]. The course's search of
        GitHub issue comments with short questions is an example of the asymmetric case [^2].
      options:
        - text: A short query and a longer paragraph that answers it
          correct: true
        - text: A query and documents of about the same length
          why: That is symmetric semantic search, e.g. finding questions similar to a given question.
        - text: A long query and a shorter paragraph that answers it
          why: It is the other way round; the query is usually short, like a question or a few keywords.
        - text: A query in one language and documents in another
          why: That is cross-lingual search. Asymmetric refers to the different length and content of query and documents.
      references:
        - title: Semantic Search (Sentence Transformers documentation)
          url: https://www.sbert.net/examples/sentence_transformer/applications/semantic-search/README.html#symmetric-vs-asymmetric-semantic-search
          locator: sec. Symmetric vs. Asymmetric Semantic Search
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter5/6#creating-text-embeddings
          locator: 'Chapter 5.6: Semantic search with FAISS, sec. Creating text embeddings'
      references_replace: true
  chapter5/8#q10:
    difficulty: easy
    fix:
      type: true_false
      question: 🤗 Datasets can only load text data, so audio or computer-vision datasets need a different library.
      explanation: |
        🤗 Datasets is a library for accessing and sharing datasets for audio, computer vision and NLP
        tasks, with the same loading and processing methods for all of them [^1]. Its documentation has
        separate guides for loading and processing audio data, image data and tabular data [^1].
      options:
        0: 'True'
        1: 'False'
      why:
        0: 🤗 Datasets also loads and processes audio, image and tabular data.
      references:
        - title: 🤗 Datasets documentation
          url: https://huggingface.co/docs/datasets/index
          locator: Introduction and guides (Audio, Vision, Text, Tabular)
      references_replace: true
  chapter8/7#q4:
    topic: training
    difficulty: easy
    fix:
      question: |
        `trainer.train()` (🤗 Transformers `Trainer`) fails with a cryptic error that doesn't say where
        it comes from. The `Trainer` turns datasets into dataloaders, feeds batches to the model,
        computes gradients, updates the weights and evaluates. Where should you look first?
      explanation: |
        An error in `trainer.train()` can come from the dataset, the batching, the model, the optimizer
        or the metric, so the best approach is to walk through the pipeline in order [^1]. The first
        stop is the data: if it is corrupted, the `Trainer` cannot even form batches, so look inside
        `trainer.train_dataset` and decode a few inputs and labels [^1]. Only then move on to the
        dataloader, the model's forward pass, the optimization step and finally evaluation [^1].
      options:
        0: The optimization step, where gradients are computed and the weights updated
        1: The evaluation step, where the metrics are computed
        2: The training dataset itself, by inspecting and decoding a few examples
        3: The dataloader that collates examples into batches
      why:
        0: Bugs can hide there, but it comes several steps into the pipeline, so check the earlier stages first.
        1: Evaluation usually runs after a full epoch of training, so check something earlier in the pipeline first.
        3: Very close, but the dataloader is built from the dataset; if the data is corrupted it cannot form batches, so check the dataset first.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#check-your-data
          locator: 'Chapter 8.4: Debugging the training pipeline, secs. Debugging the training pipeline and Check your data'
      references_replace: true
  chapter8/7#q5:
    topic: pytorch
    difficulty: medium
    fix:
      question: Your PyTorch training code fails on the GPU with a CUDA error that is **not** an out-of-memory error. What is usually the best way to debug it?
      explanation: |
        GPU operations run asynchronously: when one fails, the error only surfaces at a later
        synchronization, so the traceback points somewhere unrelated, e.g. at the backward pass for a
        bug in the forward pass [^1] [^2]. Unless it is an out-of-memory error, the course's advice is to
        go back to the CPU, where the same bug gives a precise error message [^1]. PyTorch can also
        force synchronous execution with `CUDA_LAUNCH_BLOCKING=1`, so that the stack trace shows where
        the error happened [^2].
      options:
        0: Post the error message on the forums or on GitHub
        1: Run the same code on the CPU to get an informative error
        2: Read the traceback to find the line that caused the error
        3: Reduce the batch size
        4: Restart the Jupyter kernel and run the code again
      why:
        0: CUDA error messages are usually very uninformative, so others can do little with them either.
        2: GPU operations are asynchronous, so the error is raised at a later synchronization point, far from the operation that caused it.
        3: That is the usual fix for CUDA out-of-memory errors, not for other CUDA errors.
        4: A CUDA error does break the kernel, so you must restart it, but running the same code again gives the same error.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#going-through-the-model
          locator: 'Chapter 8.4: Debugging the training pipeline, sec. Going through the model'
        - title: CUDA semantics (PyTorch documentation)
          url: https://docs.pytorch.org/docs/2.14/notes/cuda.html#asynchronous-execution
          locator: Asynchronous execution
      references_replace: true
  chapter8/7#q7:
    topic: training
    difficulty: medium
    fix:
      question: When a model doesn't seem to train properly, why is overfitting a single batch a good debugging test?
      explanation: |
        Training again and again on one batch tests whether the problem, as you framed it, can be solved
        by the model you are training, and it also shows whether the initial learning rate is too high
        [^1]. A working setup reaches near-perfect results on that batch (e.g. 100% accuracy); if it
        can't, something is wrong with how the problem or the data is framed, and only after passing the
        test can you be sure the model can learn [^1]. The memorized batch says nothing about
        generalization, and shape errors would stop training before this test.
      options:
        - text: It isn't; overfitting is always bad and should be avoided
          why: On the full dataset overfitting is a sign of poor generalization, but in this test you train on one batch on purpose.
        - text: 'It checks that the model can learn at all: the loss on that batch should drop to near zero'
          correct: true
        - text: It checks that the tensor shapes of the inputs and labels match what the model expects
          why: With misaligned shapes you could not train even on one batch; the test assumes training already runs.
        - text: It gives a quick estimate of the validation accuracy the full model will reach
          why: A model that memorizes one batch tells you nothing about how well it generalizes.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter8/4#overfit-your-model-on-one-batch
          locator: 'Chapter 8.4: Debugging the training pipeline, sec. Overfit your model on one batch'
      references_replace: true
