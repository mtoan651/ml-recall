      question: 🤗 Datasets treats each dataset as a memory-mapped file. What is memory mapping?
      options:
        - text: A mapping between CPU RAM and GPU memory
          why: Memory mapping is about RAM and files on disk, not about moving data to the GPU.
        - text: A mapping between RAM and filesystem storage
