      explanation: |
        Domain adaptation means fine-tuning a pretrained model on in-domain data so that it fits that
        domain better. For example, a model pretrained on Wikipedia treats the specialised words of
        legal contracts or scientific articles as rare tokens until it is further trained on such
        text [^1]. The course fine-tunes DistilBERT's masked language model on IMDb movie reviews so
        that it adapts from Wikipedia's factual style to the more subjective language of reviews
        [^1]. Running inference, training a model from scratch and adding misclassified samples to
        the data are all useful steps, but none of them adapts a pretrained model to a new domain.
      references:
