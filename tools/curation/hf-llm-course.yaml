  chapter12/2#q1:
    difficulty: easy
    fix:
      explanation: |
        In reinforcement learning an agent (for an LLM, the model itself) interacts with an
        environment: it takes actions, receives rewards as feedback, and improves its policy, the
        strategy that picks an action in each situation, so that it earns higher rewards [^1].
        Model, data, loss function and optimizer are the ingredients of an ordinary supervised
        training run, and input, output and hidden layers describe a network's architecture; neither
        list names the parts of this interaction loop.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#what-is-reinforcement-learning-rl
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. What is Reinforcement Learning (RL)? (Agent, Environment, Action, Reward, Policy)
      references_replace: true
  chapter12/2#q5:
    difficulty: easy
    fix:
      explanation: |
        A reward is the feedback the environment gives the agent after an action, and it is usually a
        number: positive for good behavior, negative as a penalty [^1]. For an LLM it scores a
        response, for example on how helpful, truthful or harmless it is [^1]. What generates the
        responses is the policy, the LLM itself. A model that scores responses is a reward model: in
        RLHF it is what produces the rewards, but the reward is the score it outputs, not the model [^2].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reward
