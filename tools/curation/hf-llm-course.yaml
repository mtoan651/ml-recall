  chapter2/9#q5:
    difficulty: easy
    fix:
      explanation: |
        `AutoModel` and its relatives are wrappers that look at the checkpoint passed to
        `from_pretrained()`, work out which architecture it belongs to, and instantiate that model
        class with the checkpoint's weights [^1]. So `AutoModel.from_pretrained("bert-base-cased")`
        gives you a BERT model, just as `BertModel.from_pretrained("bert-base-cased")` would [^1]. It
        neither trains on your data nor picks a checkpoint from the input's language: you choose the
        checkpoint yourself.
      why:
        0: That describes [AutoTrain](https://huggingface.co/autotrain), Hugging Face's no-code training tool. `AutoModel` only loads a model from a checkpoint.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/3#creating-a-transformer
          locator: Chapter 2.3 Models, sec. Creating a Transformer
      references_replace: true
  chapter3/2#q2:
    difficulty: easy
    fix:
      explanation: |
        Padding every sample to the longest sequence in the whole dataset (or to the model's maximum
        length) wastes computation on pad tokens. With dynamic padding, padding is postponed until
        the batches are built: a collate function such as `DataCollatorWithPadding` pads each batch
        only to the length of its longest sample, which speeds up training considerably [^1]. It is
        an efficiency choice, not a requirement of the model or of the collator, and it can even cause
        problems on TPUs, which prefer fixed shapes [^1].
      options:
        1: It pads each batch only to its own longest sequence, saving computation.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter3/2#dynamic-padding
          locator: Chapter 3.2 Processing the data, sec. Dynamic padding
      references_replace: true
  chapter11/3#q4:
    difficulty: easy
    fix:
      explanation: |
        Quantitative signals (training and validation loss, learning rate, gradient norms) reveal the
        training dynamics: for example, validation loss rising while training loss falls signals
        overfitting [^1]. But the loss can look fine while the model picks up unwanted behavior, such
        as inconsistent output formatting, so you should also read the model's actual outputs
        regularly [^2]. Each kind of check catches problems that the other misses.
      options:
        1: Only the training loss curve
        2: Only the quality of the model's generated outputs
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3#metrics-to-monitor
          locator: Chapter 11.3 Supervised Fine-Tuning, sec. Metrics to Monitor
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter11/3#warning-signs-to-watch-for
          locator: Chapter 11.3 Supervised Fine-Tuning, sec. Warning Signs to Watch For (closing warning)
      references_replace: true
  chapter12/2#q2:
    difficulty: easy
    fix:
      explanation: |
        Pre-training on next-word prediction makes an LLM fluent, but not necessarily helpful,
        harmless or aligned with what people prefer [^1]. RLHF uses human feedback as the reward
        signal: people compare responses, a reward model learns to predict their preferences, and the
        LLM is then fine-tuned with RL to produce responses that this reward model scores highly [^2].
        It changes what the model says, not how fast it generates text or how much memory it needs.
      options:
        1: It makes models generate text much faster at inference time
        2: It reduces the amount of memory the model needs to run
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#role-of-rl-in-large-language-models-llms
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Role of RL in Large Language Models (LLMs)
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#reinforcement-learning-from-human-feedback-rlhf
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Reinforcement Learning from Human Feedback (RLHF)
      references_replace: true
  chapter12/2#q3:
    difficulty: easy
    fix:
      explanation: |
        Actions are the choices an agent makes in its environment; when the agent is an LLM, they are
        text-generation decisions, such as which words to produce, which answer to give or how to
        respond in a conversation [^1]. The RL loop separates them from the other steps: the agent
        first observes its state (for an LLM, reads the prompt), then acts, receives a reward, and
        finally updates its policy, which for an LLM means updating its weights [^2].
      options:
        1: Updating the model's weights after it receives a reward
        2: Reading and encoding the tokens of the input prompt
      why:
        1: That is the learning step, in which the policy is improved after rewards come in. It is not an action taken in the environment.
        2: Taking in the prompt is how the agent observes its current state. The action is what it generates in response.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#action
          locator: Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. Action
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter12/2#the-rl-process-trial-and-error
          locator: 'Chapter 12.2 Introduction to Reinforcement Learning and its Role in LLMs, sec. The RL Process: Trial and Error (table)'
      references_replace: true
  chapter7/9#q12:
    difficulty: medium
    fix:
      explanation: |
        The labels for extractive QA are the indices of the tokens where the answer starts and ends, but
        the dataset gives the answer as a character position in the context, so the offset mapping is
        needed to turn that character span into start and end tokens [^1]. Long contexts are the other
        difficulty: one example becomes several training features through a sliding window, and features
        that do not contain the whole answer get the label `(0, 0)`, the `[CLS]` token [^1]. Tokenizing the
        inputs is routine, and the answers only need tokenizing when QA is framed as a generative,
        sequence-to-sequence task [^2].
      why:
        0: True, but every NLP task needs tokenized inputs, and it is a routine call to the tokenizer. The difficulties specific to QA are long contexts and locating the answer's tokens.
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/7#processing-the-training-data
          locator: Chapter 7.7 Question answering, sec. Processing the training data
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/4#translation
          locator: Chapter 7.4 Translation, introduction (generative question answering)
      references_replace: true
  chapter1/7#q8:
    difficulty: easy
    fix:
      explanation: |
        Decoder models are pretrained to predict the next word, and at each position the attention
        layers can only see the words before it. That makes them best suited to text generation,
        such as continuing a prompt [^1]. Encoder models read the whole sentence in both directions
        and suit understanding tasks such as classification, and sequence-to-sequence models suit
        generating a new text from a given input, such as a translation or a summary [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#decoder-models
          locator: Chapter 1.6 Transformer Architectures, secs. Encoder models, Decoder models, Sequence-to-sequence models and Choosing the right architecture
      references_replace: true
  chapter1/7#q10:
    difficulty: easy
    fix:
      explanation: |
        Encoder models use bidirectional attention, so each token's representation reflects the
        whole sentence. That is what sentence classification needs, and the course suggests encoder
        models such as BERT and RoBERTa for text classification [^1]. Decoder models are built for
        generating text, and sequence-to-sequence models for turning an input text into a new output
        text, not for extracting a label [^1].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/6#encoder-models
          locator: Chapter 1.6 Transformer Architectures, secs. Encoder models and Choosing the right architecture
      references_replace: true
  chapter2/9#q1:
    difficulty: easy
    fix:
      explanation: |
        A model can't read raw text, so the tokenizer first splits the text into tokens and maps each
        one to an integer ID [^1]. The model turns those IDs into numbers (hidden states, then logits
        from the head), not text [^2]. When the task needs text back, as in generation or translation,
        the tokenizer's `decode()` turns predicted IDs into a readable string, so the tokenizer is used
        at both ends of the pipeline [^3].
      references:
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#preprocessing-with-a-tokenizer
          locator: Chapter 2.2 Behind the pipeline, sec. Preprocessing with a tokenizer
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/2#going-through-the-model
