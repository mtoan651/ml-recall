      why:
        1: Incorrect. The telemetry it collects helps you debug, but OpenTelemetry itself never changes or fixes code.
        2: Incorrect. OpenTelemetry is not a storage backend. It generates, collects and exports telemetry, and leaves storing and visualizing it to other tools.
