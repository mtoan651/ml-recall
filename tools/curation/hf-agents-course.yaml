# Curation for hf-agents-course (see docs/content-pipeline.md#curation).
# Refs: <unit page>#q<n>. Unlisted items are kept with the default topic `rag-agents`.
# Framework units (smolagents, LlamaIndex, LangGraph) are mostly API trivia; only conceptual items stay.
# Reviewed 2026-10-10 — 19 of 39 kept; re-reviewed 2026-10-11 — 26 kept (framework items that hide a
# general agent/RAG idea are rewritten around it; pure API trivia stays dropped).
exclude_prefixes:
  "unit2/langgraph/": tool-specific
items:
  "unit1/quiz2#q3":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        An LLM is an AI model trained on vast amounts of text so that it can understand and generate
        human language; most modern LLMs are deep neural networks built on the Transformer architecture
        [^1]. It learns by predicting the next word (token) from the previous ones and generates a reply
        one token at a time [^1]. It neither returns pre-written answers nor follows hand-coded rules:
        its behaviour comes from patterns in text learned during pre-training [^1].
      options:
        0: A simple chatbot that matches messages to a list of pre-defined answers
        1: A deep learning model trained on vast amounts of text to understand and generate language
        2: A rule-based AI system that follows strict, hand-written predefined commands
      why:
        0: An LLM does not pick stored answers; it generates a new reply one token at a time [^1].
        2: An LLM's behaviour is learned from patterns in text during pre-training, not hand-coded as rules [^1].
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#what-is-a-large-language-model
          locator: Unit 1, What are LLMs?, secs. What is a Large Language Model? and How are LLMs trained?
      references_replace: true
  "unit1/quiz2#q4":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        Special tokens are model-specific tokens that open and close the structured parts of a
        sequence, such as the start or end of a sequence, message or response. The most important is the
        end-of-sequence (EOS) token: generation stops when the model predicts it [^1]. In chat models,
        special tokens also mark where each user and assistant turn starts and ends [^2]. They are not
        ordinary words added for quality, nor random noise; each has a fixed structural role, and their
        exact form differs by model (for example `<|endoftext|>` for GPT-4, `<|im_end|>` for SmolLM2)
        [^1].
      why:
        0: Special tokens are not ordinary words; each one marks structure, such as where a sequence or a message ends [^1].
        2: They sit at fixed structural positions, for example around each chat turn, never at random [^2].
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#what-is-a-large-language-model
          locator: Unit 1, What are LLMs?, sec. What is a Large Language Model? (special tokens table) and Understanding next token prediction
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/messages-and-special-tokens
          locator: Unit 1, Messages and Special Tokens, introduction
      references_replace: true
  "unit1/quiz2#q5":
    topic: llm-basics
    difficulty: easy
    fix:
      explanation: |
        Chat messages are a UI abstraction. Before the model sees them, a chat template concatenates all
        messages of the conversation (system, user and assistant) into a single prompt string and wraps
        each turn in the model's own special tokens [^1]. The model does not remember earlier turns; it
        rereads the whole formatted conversation every time [^1]. It does not parse messages as
        structured commands, and its reply is not random: it comes from predicting the next token given
        that prompt [^2].
      why:
        0: The model only reads one token sequence; a chat template first turns all messages into a single formatted prompt [^1].
        2: The reply is predicted token by token from the current formatted conversation; the model keeps no memory of other conversations [^1][^2].
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/messages-and-special-tokens#conversations-user-and-assistant-messages
          locator: 'Unit 1, Messages and Special Tokens, introduction and sec. Conversations: User and Assistant Messages'
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-llms#understanding-next-token-prediction
          locator: Unit 1, What are LLMs?, sec. Understanding next token prediction
      references_replace: true
  "unit2/llama-index/quiz1#q1":
    difficulty: easy
    fix:
      question: |
        LlamaIndex packages retrieval-augmented generation (RAG) as a `QueryEngine` that an agent can
        use as a tool. What does such a component do when a question comes in?
      explanation: |
        LLMs learn general knowledge from their training data but may not have seen data that is
        relevant or up to date; RAG solves this by retrieving relevant information from your data and
        giving it to the LLM [^1]. Documents are split into chunks and embedded during indexing, and at
        query time the question is embedded into the same vector space to find the closest chunks [^1].
        A retriever stops there and returns the chunks with similarity scores, while a query engine
        also passes them to an LLM that writes the answer [^1]. The model itself is not retrained.
      options:
        0: It retrieves the chunks of your own data most relevant to the question and gives them to an LLM to answer
        1: It fine-tunes the LLM on your documents before each question, so the answer is in the weights
        2: It returns the best-matching chunks with their similarity scores, with no LLM involved
        3: It only stores the embeddings of your documents, while the LLM answers from its training data
      why:
        0:
        1: RAG does not change the model's weights; it supplies relevant data to the LLM at query time.
        2: That is a plain retriever. A query engine also passes the retrieved chunks to an LLM, which writes the response.
        3: Storing embeddings is the indexing and storing stage. A query engine also searches the index and uses the results to answer.
      correct:
        - 0
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/llama-index/components
          locator: Unit 2.2, What are components in LlamaIndex?, introduction and secs. Storing and indexing documents, Querying a VectorStoreIndex with prompts and LLMs
      references_replace: true
  "unit2/llama-index/quiz1#q2":
    drop: duplicate
    comment: "'turn a Python function into a tool an agent can use' is rag-agents-012 (what a tool is) plus unit2/llama-index/quiz1#q4 (kept: how a tool is built from a function)"
  "unit2/llama-index/quiz1#q3":
    drop: tool-specific
    comment: LlamaIndex Toolspecs (community tool bundles on LlamaHub); a product feature with no concept to generalize
  "unit2/llama-index/quiz1#q4":
    difficulty: medium
    fix:
      question: |
        Agent frameworks can turn a plain Python function into a tool, for example with a `@tool`
        decorator or LlamaIndex's `FunctionTool.from_defaults(fn)`. If you give only the function,
        where does the tool description that the LLM reads come from?
      explanation: |
        The LLM only sees a textual description of each tool in its system prompt: a name, what the tool
        does, the inputs it expects and the output it returns [^1]. Frameworks build this text
        automatically with Python introspection, so the function name, type hints and docstring become
        the tool's name, argument types and description [^1]. LlamaIndex's `FunctionTool` works the same
        way: its `name` and `description` arguments are optional, though good ones help the agent decide
        when and how to use the tool [^2].
      options:
        0: From the function itself, i.e. its name, its type-hinted arguments and return type, and its docstring
        1: From the function's full source code, which the framework pastes into the system prompt
        2: Nowhere; the LLM gets no description and learns what each tool does by calling it at random
        3: From a JSON schema you must always write by hand, because the function alone is not enough
      why:
        0:
        1: The implementation does not matter to the LLM, only the name, what the tool does, its inputs and its output; introspection extracts just those.
        2: Tool descriptions are given to the LLM in the system prompt; without them it could not choose tools sensibly.
        3: Frameworks build the description automatically by introspecting the function; a hand-written name and description are optional overrides.
      correct:
        - 0
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools#auto-formatting-tool-sections
          locator: Unit 1, What are Tools?, secs. How do we give tools to an LLM? and Auto-formatting Tool sections
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/llama-index/tools#creating-a-functiontool
          locator: Unit 2.2, Using Tools in LlamaIndex, sec. Creating a FunctionTool
      references_replace: true
  "unit2/llama-index/quiz2#q1":
    drop: tool-specific
    comment: purpose of LlamaIndex's AgentWorkflow class
  "unit2/llama-index/quiz2#q2":
    drop: tool-specific
    comment: name of the LlamaIndex object that holds workflow state (Context)
  "unit2/llama-index/quiz2#q3":
    drop: tool-specific
    comment: LlamaIndex method signature run(query_str, ctx=ctx) for keeping chat memory
  "unit2/smolagents/quiz1#q1":
    difficulty: medium
    fix:
      question: |
        Some agents, such as smolagents' `CodeAgent`, write each action as a Python snippet that is
        executed, instead of a JSON object naming one tool and its arguments. What is a main
        advantage of code actions?
      explanation: |
        A JSON action names one tool and its arguments as text that the framework must parse before it
        can run the tool [^1]. Code is more expressive: it naturally represents loops, conditionals and
        nested functions, can reuse functions across actions, and works directly with complex objects
        such as images [^1] [^2]. It is also natural for LLMs, because high-quality code is already in
        their training data [^2]. The price is security: executing LLM-generated code is risky, so it
        needs safeguards [^1].
      options:
        0: One action can combine several tool calls with variables, loops and conditionals, and pass objects between them
        1: Generated code cannot have side effects, so code actions need no sandbox or other safeguards
        2: The LLM no longer needs descriptions of the available tools in its prompt
        3: JSON cannot carry arguments, so code is the only way to call a tool with inputs
      why:
        0:
        1: Executing LLM-generated code carries security risks, from prompt injection to harmful code, so it needs safeguards such as a sandbox.
        2: The model still has to know which tools exist and how to call them; code only changes how the call is written.
        3: 'JSON actions do carry arguments, for example `{"action": "get_weather", "action_input": {"location": "New York"}}`.'
      correct:
        - 0
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/actions#code-agents
          locator: Unit 1, Actions, secs. The Stop and Parse Approach and Code Agents
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/code_agents#why-code-agents
          locator: Unit 2.1, Building Agents That Use Code, sec. Why Code Agents?
      references_replace: true
  "unit2/smolagents/quiz1#q2":
    drop: tool-specific
    comment: when to choose the smolagents framework (product positioning); the distractors are strawmen
  "unit2/smolagents/quiz1#q3":
    drop: tool-specific
    comment: names of smolagents model wrapper classes (TransformersModel, InferenceClientModel, LiteLLMModel)
  "unit2/smolagents/quiz1#q5":
