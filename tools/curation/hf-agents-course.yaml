  "unit2/smolagents/quiz2#q1":
    drop: tool-specific
    comment: "smolagents API: @tool decorator vs Tool subclass; the general 'tool from a function' idea is kept in unit2/llama-index/quiz1#q4"
  "unit2/smolagents/quiz2#q3":
    drop: trivial
    comment: joke distractors (sharing makes a tool vision-capable, restricts which agents may call it); the key is a product feature
  "unit2/smolagents/quiz2#q4":                     # same idea as smolagents/quiz1#q4 (code vs JSON actions)
    drop: duplicate
    comment: 'ToolCallingAgent writes JSON tool calls: same idea as rag-agents-015 (unit2/smolagents/quiz1#q4)'
  "unit2/smolagents/quiz2#q5":
    drop: tool-specific
    comment: contents of the smolagents default toolbox
  unit1/quiz1#q3:
    difficulty: easy
    fix:
      question: Why are tools essential for an AI agent?
      explanation: |
        An LLM only receives and generates text, so on its own it cannot act on the world or fetch
        information beyond its training data [^1]. Tools are functions with a clear objective, such as
        web search, image generation, retrieval or calling an API, that complement the LLM: it writes a
        tool call, and the agent runs the tool and adds the result to the conversation [^1]. Calling a
        tool does not change the model's weights, and tools exist to act, not merely to store memory.
      options:
        0: Tools let the LLM call external APIs by itself, so no agent code is needed to run them.
        2: Tools retrain the LLM's weights on new data, so the Agent permanently learns new skills.
      why:
        0: An LLM can only output text. It writes a tool call, and the agent parses it and runs the tool on the LLM's behalf.
        2: Calling a tool doesn't change the model's weights; the tool's result is simply added to the conversation as an observation.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools
          locator: Unit 1. What are Tools?, secs. "What are AI Tools?" and "How do tools work?"
      references_replace: true
  unit1/quiz1#q4:
    difficulty: easy
    fix:
      question: What is the key difference between actions and tools in an AI agent?
      explanation: |
        Actions are the concrete steps an Agent takes to interact with its environment, such as searching
        the web, querying a database or replying to the user [^1]. Tools are the functions the Agent can
        call to carry out some of those steps, for example a web-search or calculator function [^2].
      options:
        2: Tools are broad utilities available for many different functions, whereas Actions are restricted to physical interactions with the real world.
      why:
        1: An action is a step the agent takes, and a tool is a function it can call to carry out some of those steps, so they are not interchangeable [^1][^2].
        2: Actions include digital steps such as searching the web, querying a database or replying to the user, not only physical ones [^1].
        3: The LLM decides on actions but the agent's code executes them, and a tool runs only when the agent calls it, never on its own [^2].
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/actions
          locator: 'Unit 1. Actions: Enabling the Agent to Engage with Its Environment'
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools
          locator: Unit 1. What are Tools?
      references_replace: true
  unit1/quiz1#q5:
    difficulty: easy
    fix:
      question: What role does a large language model (LLM) play in an AI agent?
      explanation: |
        In an agent the AI model, most often an LLM, is the "brain": it does the reasoning and planning
        and decides which actions to take in the situation [^1]. Because an LLM can only read and write
        text, it does not run tools itself; it writes the tool call, and the agent executes it and feeds
        the result back [^2]. So the LLM is neither a passive store of facts nor a formatter of results
        decided by hand-written rules.
      options:
        2: LLMs execute the Agent's tools themselves, sending requests to external APIs directly without any agent code.
        3: LLMs only turn the final result into polished text, while hand-written rules decide which actions to take.
      why:
        2: An LLM can only output text. It writes the tool call, and the agent runs the tool on its behalf.
        3: In an Agent, the LLM is the reasoning engine that decides the next action, not just a text formatter.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
          locator: Unit 1. What is an Agent?, sec. Let's go more formal (The Brain)
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools
          locator: Unit 1. What are Tools?, sec. "How do tools work?"
      references_replace: true
  unit1/quiz2#q1:
    difficulty: easy
    fix:
      explanation: |
        A tool is a function given to the LLM that fulfils a clear objective, for example web search,
        image generation, retrieval or calling an external API [^1]. The LLM itself only generates text,
        so it writes a tool call and the agent runs the tool on its behalf [^1]. Remembering past
        conversations is the job of the agent's memory, not of a tool.
      options:
        0: A model component that only generates text responses
        1: A function or external API the agent can call to perform a specific task
        2: A memory feature that stores the agent's past conversations
      why:
        0: Generating text is what the LLM itself does; a tool is something the agent calls to act beyond text.
        2: Storing conversations is the agent's memory, not a tool; a tool is a callable function with a clear objective.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools
          locator: Unit 1. What are Tools?, "What are AI Tools?"
      references_replace: true
  unit1/quiz2#q2:
    difficulty: easy
    fix:
      explanation: |
        An LLM can only output text, so it cannot call a tool by itself. It writes a tool call (as text or
        code); the agent parses it, runs the tool on the LLM's behalf and adds the result to the
        conversation, so the LLM can plan its next step [^1].
      options:
        0: By passively waiting for the user to give step-by-step instructions
        1: By only returning pre-programmed responses to each request
        2: By having the LLM write tool calls, which the agent then runs on its behalf
      why:
        0: An agent acts on its own initiative; its LLM decides when a tool is needed.
        1: That describes a rule-based bot; an agent's LLM decides which tool to call and with which arguments.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/tools
          locator: Unit 1. What are Tools?, "How do tools work?"
      references_replace: true
  unit2/smolagents/quiz2#q2:
    difficulty: easy
    fix:
      question: A smolagents `CodeAgent` follows the ReAct (Reason + Act) approach. How does it carry out a multi-step task?
      explanation: |
        `CodeAgent.run()` follows the ReAct framework: after the system prompt and the task are logged, a
        loop sends the agent's memory to the model as chat messages, parses the completion to extract a
        Python code snippet, executes it, and logs the result in an `ActionStep` [^1]. Each step is one
        thought plus one tool call and its execution [^2], and the loop continues until the agent's
        objective is fulfilled [^3], so a single CodeAgent carries out a multi-step task by itself.
        Writing actions as JSON for the system to parse is what a `ToolCallingAgent` does [^4], and vision
        is an optional capability, not a step of the loop.
      options:
        2: It repeats a cycle of thinking, writing Python code, running it and logging the result until it reaches a final answer
      why:
        1: JSON tool calls are what a ToolCallingAgent writes, and even it executes them step by step. A CodeAgent writes Python code and runs each snippet before deciding on the next step.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/code_agents#how-does-a-code-agent-work
          locator: Unit 2.1 Building Agents That Use Code, sec. How Does a Code Agent Work?
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/why_use_smolagents#agent-types-in-smolagents
          locator: Unit 2.1 Why use smolagents, sec. Agent Types in smolagents
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/agent-steps-and-structure#the-thought-action-observation-cycle
          locator: Unit 1 Understanding AI Agents through the Thought-Action-Observation Cycle, sec. The Thought-Action-Observation Cycle
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/tool_calling_agents#how-do-tool-calling-agents-work
          locator: Unit 2.1 Writing actions as code snippets or JSON blobs, sec. How Do Tool Calling Agents Work?
      references_replace: true
  unit2/langgraph/quiz1#q2:
    difficulty: medium
    fix:
      question: |
        When designing an LLM application you trade **control** (predictable behaviour, guardrails)
        against **freedom** (letting the LLM decide what to do next). Where do graph-based workflow
        frameworks such as LangGraph sit on this spectrum?
      explanation: |
        Freedom gives the LLM room to be creative and handle unexpected problems, while control ensures
        predictable behaviour and maintains guardrails [^1]. Code agents sit at the free end: they can
        call several tools in one step or create their own tools, which makes them less predictable
        [^1]. LangGraph sits at the control end: the developer designs the flow of steps and the
        decision made at each junction, and the LLM works inside that structure [^1]. Its nodes can
        still contain LLM calls, tool calls, conditional logic or human input [^2].
      options:
        - text: Toward control. The developer fixes the steps and allowed transitions, and the LLM decides only at the branch points
          correct: true
        - text: Toward freedom. The LLM plans every step itself and may even write new tools at run time, so behaviour is hard to predict
          why: That describes code agents (for example in smolagents), which sit at the free end of the spectrum.
        - text: Outside the trade-off. A graph gives the LLM complete freedom and still makes its behaviour fully predictable
          why: The trade-off cannot be escaped. A graph buys predictability by restricting what the LLM may decide.
        - text: Outside the trade-off. A graph workflow contains no LLM calls at all, only deterministic Python functions
          why: Nodes can call an LLM, call tools or ask a human; a graph combines deterministic logic with LLM decisions.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/when_to_use_langgraph#control-vs-freedom
          locator: Unit 2.3, What is LangGraph?, sec. Control vs freedom
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/building_blocks
          locator: Unit 2.3, Building Blocks of LangGraph, sec. 2. Nodes
      references_replace: true
  unit2/langgraph/quiz1#q3:
    difficulty: easy
    fix:
      question: |
        In a graph-based agent workflow, such as one built with LangGraph, the application is a set of
        **nodes** (steps) connected by **edges**. What is the **state** of such a graph?
      explanation: |
        State is the central concept of LangGraph: it represents all the information that flows through
        the application, and it is user-defined, so its fields must hold everything needed for the
        decisions [^1]. Each node takes the state as input, performs an operation and returns updates
        to the state [^1], and when the graph decides which node runs next, it looks at the current
        state [^2]. It is application data, not the LLM's internal activations, the last LLM output or
        an after-the-fact log.
      options:
        0: Data you define yourself that flows through the application; nodes read it and return updates to it
        1: The hidden activations of the LLM's transformer layers, carried over from one call to the next
        2: The latest text the LLM generated, which replaces the previous output each time a node runs
        3: A log of past runs that is only read after execution, for debugging and tracing
      why:
        0:
        1: The state is ordinary application data that you define (for example a TypedDict); the LLM's internal activations are not kept between calls.
        2: The developer defines the state's fields. An LLM output may be stored in one of them, but the state is not just the last generation.
        3: That describes traces or logs. The state is used during execution, passed between nodes and consulted to choose the next node.
      correct:
        - 0
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/building_blocks
          locator: Unit 2.3, Building Blocks of LangGraph, secs. 1. State and 2. Nodes
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/when_to_use_langgraph#how-does-langgraph-work
          locator: Unit 2.3, What is LangGraph?, sec. How does LangGraph work?
      references_replace: true
  unit2/langgraph/quiz1#q4:
    difficulty: easy
    fix:
      question: |
        In a graph-based agent workflow (for example in LangGraph), the steps are **nodes** and the
        possible transitions between them are **edges**. What is a **conditional edge**?
      explanation: |
        Edges connect nodes and define the possible paths through the graph [^1]. A direct edge always
        goes from node A to node B, while a conditional edge chooses the next node based on the current
        state: in code, a routing function reads the state and returns the name of the node to visit
        next [^1]. The routing can be deterministic or depend on an LLM's output [^2]. Human input is
        modelled as a node, and the possible edges are declared when the graph is built [^1].
      options:
        - text: An edge that picks which node runs next by evaluating a function of the current state
          correct: true
        - text: An edge that always leads from one node to the same next node, whatever the state
          why: That is a direct (normal) edge. A conditional edge chooses among several possible next nodes.
        - text: An edge that pauses the whole graph until a human approves the next step
          why: Human input is a kind of node (a step). What makes an edge conditional is that it routes programmatically on the state.
        - text: An edge that the LLM adds to the graph at run time when it needs an extra step
          why: The possible edges are declared when the graph is built; only the choice among them is made at run time.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/building_blocks
          locator: Unit 2.3, Building Blocks of LangGraph, secs. 2. Nodes, 3. Edges and 4. StateGraph
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/when_to_use_langgraph#control-vs-freedom
          locator: Unit 2.3, What is LangGraph?, sec. When should I use LangGraph? (Control vs freedom)
      references_replace: true
  unit2/langgraph/quiz1#q5:
    difficulty: easy
    fix:
      question: |
        Graph-based workflow frameworks such as LangGraph structure an LLM application as explicit
        steps with branches between them. How can such a structure help with LLM hallucinations?
      explanation: |
        Choosing structure over freedom lets you ensure predictable behaviour and maintain guardrails
        [^1]. Because nodes can hold conditional logic and edges can route on the current state, a
        workflow can include a step that checks the LLM's output and send failures down another path,
        such as a retry or a human review [^2]. This reduces the impact of hallucinations but cannot
        remove them: the model inside each node is unchanged and can still be wrong.
      options:
        - text: It can add steps that check the LLM's output and route failures to a retry or fallback path
          correct: true
        - text: It removes hallucinations entirely, because the LLM may only answer inside fixed nodes
          why: No framework can eliminate hallucinations; the LLM inside a node can still produce wrong content.
        - text: It has no effect, because hallucinations come from the model's weights, which a workflow cannot change
          why: The weights are unchanged, but validation steps and guardrails in the workflow can catch many wrong outputs before they are used.
        - text: It fine-tunes the LLM on the graph's past runs, so the model learns to stop hallucinating
          why: A workflow framework orchestrates calls to the model; it does not train or update it.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/when_to_use_langgraph#control-vs-freedom
          locator: Unit 2.3, What is LangGraph?, sec. Control vs freedom
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/langgraph/building_blocks
          locator: Unit 2.3, Building Blocks of LangGraph, secs. 2. Nodes and 3. Edges
      references_replace: true
  unit2/langgraph/quiz1#q1:
    drop: tool-specific
    comment: asks what the LangGraph product is for and how it differs from LangChain (product identity); the control-flow idea itself is kept in unit2/langgraph/quiz1#q2
  bonus-unit2/quiz#q1:
    difficulty: easy
    fix:
      question: What does observability mean for an AI agent?
      explanation: |
        Observability means understanding what happens inside an agent from the signals it emits:
        logs, metrics and traces [^1]. A trace covers one whole task, and its spans are the individual
        steps, such as an LLM call or a tool call [^2]. Tracking actions, tool use, model calls and
        responses this way is what lets you debug the agent and improve it [^1]. Cost is one of the
        metrics it watches, alongside latency, request errors, user feedback and accuracy [^3].
      options:
        2: It means scoring the agent's answers on a test set whose correct outputs are known.
        3: It means recording only the final answer the agent returns to the user.
      why:
        2: That is offline evaluation. Observability collects the signals (logs, metrics, traces); evaluation analyzes them and runs tests.
        3: Observability looks inside the run, at the actions, tool calls and model calls, not just at the final answer.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-what-is-observability
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. What is Observability?
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#traces-and-spans
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Traces and Spans
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-key-metrics-to-monitor
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Key Metrics to Monitor
      references_replace: true
  bonus-unit2/quiz#q3:
    difficulty: easy
    fix:
      question: What best describes offline evaluation of an AI agent?
      explanation: |
        Offline evaluation tests the agent in a controlled setting on curated datasets whose expected
        outputs are known, for example a set of math word problems with their answers, typically
        during development or in a CI pipeline [^1]. Because there is ground truth, it is repeatable
        and gives clear accuracy metrics [^1]. Anything run on real user traffic in production,
        including A/B tests, is online evaluation [^2], and watching logs as they arrive is
        observability rather than a test against known answers.
      options:
        3: Comparing two versions of the agent with an A/B test on live traffic.
      why:
        3: A/B tests run on live traffic, so they are a form of online evaluation.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-offline-evaluation
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Offline Evaluation
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-online-evaluation
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Online Evaluation
      references_replace: true
  bonus-unit2/quiz#q5:
    difficulty: medium
    fix:
      question: What role does OpenTelemetry play in AI agent observability?
      explanation: |
        OpenTelemetry is an open-source, vendor-neutral observability framework and toolkit. You
        instrument your code with it to generate, collect and export telemetry such as traces, metrics
        and logs, and any compatible backend can then store and analyze that data [^1]. Agent
        frameworks such as smolagents use the OpenTelemetry standard to expose their runs to
        observability tools like Langfuse [^2]. It is not a storage backend itself, and it neither
        fixes code nor tunes the model [^1].
      why:
        1: The telemetry it collects helps you debug, but OpenTelemetry itself never changes or fixes code [^1].
        2: OpenTelemetry is not a storage backend. It generates, collects and exports telemetry, and leaves storing and visualizing it to other tools [^1].
        3: OpenTelemetry only produces observability data; it does not tune the model or the agent [^1].
      references:
        - title: What is OpenTelemetry? (OpenTelemetry documentation)
          url: https://opentelemetry.io/docs/what-is-opentelemetry/
          locator: What is OpenTelemetry? (definition, "OpenTelemetry is not an observability backend itself")
          quote: OpenTelemetry is not an observability backend itself.
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-observability-tools
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Observability Tools
      references_replace: true
  bonus-unit2/quiz#q4:
    difficulty: easy
    fix:
      question: What advantage does online evaluation of an AI agent offer?
      explanation: |
        Online evaluation monitors the agent on real user interactions in production, so it captures
        what a lab test set can't anticipate, such as model drift over time and unexpected kinds of
        queries [^1]. Controlled tests on predefined datasets are offline evaluation. The two are
        complementary, not substitutes: teams usually loop between them, adding the failures seen
        online to the offline test set [^2]. Cost is one of many observability metrics, not the point
        of online evaluation.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-online-evaluation
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Online Evaluation
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-combining-the-two
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Combining the two
      references_replace: true
  unit1/quiz1#q1:
    difficulty: easy
    fix:
      question: Which of the following best describes an AI agent?
      explanation: |
        The course defines an Agent as a system that uses an AI model to interact with its environment
        in order to achieve a user-defined objective, combining reasoning, planning and the execution
        of actions, often through external tools [^1]. What makes it an agent is this agency, the
        ability to act on its environment [^2]. A system that only processes text, a chatbot that can
        only answer questions and a static repository of information all lack it.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
          locator: Unit 1. What is an Agent?, sec. Let's go more formal
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#the-big-picture-alfred-the-agent
          locator: 'Unit 1. What is an Agent?, sec. The Big Picture: Alfred The Agent'
      references_replace: true
  unit1/quiz1#q2:
    difficulty: easy
    fix:
      question: Why does an AI agent plan before taking an action?
      explanation: |
        In the course's example, before fulfilling a request the agent reasons and plans: it works out
        the sequence of steps and the tools it needs, and only then acts [^1]. Planning is done by the
        agent's AI model, its "brain", which decides which actions to take in the situation [^2].
        Planning thoughts break a complex task into smaller steps and are revised as new observations
        arrive [^3]. Storing past interactions is memory, not planning, and planning is exactly what
        keeps the actions from being arbitrary.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#the-big-picture-alfred-the-agent
          locator: 'Unit 1. What is an Agent?, sec. The Big Picture: Alfred The Agent'
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
          locator: Unit 1. What is an Agent?, sec. Let's go more formal (The Brain)
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/thoughts
          locator: 'Unit 1. Thought: Internal Reasoning and the ReAct Approach, introduction'
      references_replace: true
  unit1/quiz1#q6:
    difficulty: easy
    fix:
      question: Which real-world example best illustrates an AI agent at work?
      explanation: |
        An agent understands natural language, reasons and plans, and acts on its environment [^1].
        Virtual assistants such as Siri or Alexa do all three: they interpret a spoken request, work
        out what it needs, and carry out actions such as setting reminders or sending messages [^2]. A
        static FAQ page and a calculator only return fixed content or apply fixed rules, and an NPC on
        a fixed script can't reason or use tools; the course counts an NPC as an agent only when an LLM
        lets it respond to and adapt to the player [^3].
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#lets-go-more-formal
          locator: Unit 1. What is an Agent?, sec. Let's go more formal and closing summary
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#example-1-personal-virtual-assistants
          locator: 'Unit 1. What is an Agent?, sec. Example 1: Personal Virtual Assistants'
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit1/what-are-agents#example-3-ai-non-playable-character-in-a-video-game
          locator: 'Unit 1. What is an Agent?, sec. Example 3: AI Non-Playable Character in a video game'
      references_replace: true
  unit2/smolagents/quiz1#q4:
    difficulty: easy
    fix:
      explanation: |
        Unlike frameworks whose agents write actions as JSON, smolagents focuses on tool calls written as
        code: the output can be executed directly, with no JSON to parse first [^1]. `CodeAgent` is its
        primary agent type, but it also supports `ToolCallingAgent`, which writes tool calls as JSON [^2];
        that option suits simple systems that don't need variable handling or complex tool calls [^3]. So
        the library is code-first rather than JSON-only, nobody converts code into JSON by hand, and
        calling external tools is exactly what both agent types are for.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/why_use_smolagents#code-vs-json-actions
          locator: Unit 2.1 Why use smolagents, sec. Code vs. JSON Actions
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/why_use_smolagents#agent-types-in-smolagents
          locator: Unit 2.1 Why use smolagents, sec. Agent Types in smolagents
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/tool_calling_agents
          locator: Unit 2.1 Writing actions as code snippets or JSON blobs (Tool Calling Agents)
      references_replace: true
  bonus-unit2/quiz#q2:
    difficulty: easy
    fix:
      question: Which of the following is NOT a common metric in agent observability?
      explanation: |
        Agent observability watches runtime signals of each run. The usual metrics are latency, cost per
        run, request errors, explicit and implicit user feedback, accuracy and automated evaluation
        scores [^1]. The number of lines of code is a static property of the source, measured once, and
        says nothing about how a given run behaved, so it is not an observability metric.
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/bonus-unit2/what-is-agent-observability-and-evaluation#-key-metrics-to-monitor
          locator: Bonus Unit 2. AI Agent Observability and Evaluation, sec. Key Metrics to Monitor
      references_replace: true
  unit2/llama-index/quiz2#q4:
    difficulty: medium
    fix:
      question: What distinguishes agentic RAG from a traditional retrieval-augmented generation (RAG) pipeline?
      explanation: |
        A traditional RAG pipeline runs one retrieval step on the user's query, based on direct semantic
        similarity, and passes the retrieved documents to the LLM, which can miss relevant information
        [^1]. Agentic RAG puts an agent in control of retrieval and generation: it formulates its own
        search queries, critiques the results and runs further retrieval steps when needed [^1].
        Retrieval becomes one tool among others, so the agent can also decide to answer with a
        different tool or workflow [^2].
      options:
        0: An agent decides when and what to retrieve, may search several times, and can use other tools
        1: It retrieves exactly once per question, using the user's query, before the LLM answers
        2: It answers from the model's pretrained knowledge alone, without calling retrieval tools
        3: It retrains the LLM on the document store whenever the documents change
      why:
        0:
        1: That is the traditional pipeline, a single retrieval step based on direct similarity to the user's query [^1].
        2: Retrieval stays central; the agent controls how the retrieval tools are used instead of dropping them [^1][^2].
        3: Neither kind of RAG updates the model's weights; retrieved text is passed to the model in its context [^1].
      correct:
        - 0
      references:
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/smolagents/retrieval_agents
          locator: Unit 2.1 Building Agentic RAG Systems, introduction
        - source: hf-agents-course
          url: https://huggingface.co/learn/agents-course/unit2/llama-index/agents
          locator: Unit 2.2 Using Agents in LlamaIndex, sec. Creating RAG Agents with QueryEngineTools
      references_replace: true
