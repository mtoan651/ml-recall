  unit2/langgraph/quiz1#q2:
    fix:
      question: |
        When designing an LLM application you trade **control** (predictable behaviour, guardrails)
        against **freedom** (letting the LLM decide what to do next). Where do graph-based workflow
        frameworks such as LangGraph sit on this spectrum?
      options:
        - text: Toward control. The developer fixes the steps and allowed transitions, and the LLM decides only at the branch points
          correct: true
        - text: Toward freedom. The LLM plans every step itself and may even write new tools at run time, so behaviour is hard to predict
          why: That describes code agents (for example in smolagents), which sit at the free end of the spectrum.
        - text: Outside the trade-off. A graph gives the LLM complete freedom and still makes its behaviour fully predictable
          why: The trade-off cannot be escaped. A graph buys predictability by restricting what the LLM may decide.
        - text: Outside the trade-off. A graph workflow contains no LLM calls at all, only deterministic Python functions
          why: Nodes can call an LLM, call tools or ask a human; a graph combines deterministic logic with LLM decisions.
  unit2/langgraph/quiz1#q3:
    fix:
      question: |
        In a graph-based agent workflow, such as one built with LangGraph, the application is a set of
        **nodes** (steps) connected by **edges**. What is the **state** of such a graph?
      options:
        - text: Data you define yourself that flows through the application; nodes read it and return updates to it
          correct: true
        - text: The hidden activations of the LLM's transformer layers, carried over from one call to the next
          why: The state is ordinary application data that you define (for example a TypedDict); the LLM's internal activations are not kept between calls.
        - text: The latest text the LLM generated, which replaces the previous output each time a node runs
          why: The developer defines the state's fields. An LLM output may be stored in one of them, but the state is not just the last generation.
        - text: A log of past runs that is only read after execution, for debugging and tracing
          why: That describes traces or logs. The state is used during execution, passed between nodes and consulted to choose the next node.
  unit2/langgraph/quiz1#q4:
    fix:
      question: |
        In a graph-based agent workflow (for example in LangGraph), the steps are **nodes** and the
        possible transitions between them are **edges**. What is a **conditional edge**?
      options:
        - text: An edge that picks which node runs next by evaluating a function of the current state
          correct: true
        - text: An edge that always leads from one node to the same next node, whatever the state
          why: That is a direct (normal) edge. A conditional edge chooses among several possible next nodes.
        - text: An edge that pauses the whole graph until a human approves the next step
          why: Human input is a kind of node (a step). What makes an edge conditional is that it routes programmatically on the state.
        - text: An edge that the LLM adds to the graph at run time when it needs an extra step
          why: The possible edges are declared when the graph is built; only the choice among them is made at run time.
  unit2/langgraph/quiz1#q5:
    fix:
      question: |
        Graph-based workflow frameworks such as LangGraph structure an LLM application as explicit
        steps with branches between them. How can such a structure help with LLM hallucinations?
      options:
        - text: It can add steps that check the LLM's output and route failures to a retry or fallback path
          correct: true
        - text: It removes hallucinations entirely, because the LLM may only answer inside fixed nodes
          why: No framework can eliminate hallucinations; the LLM inside a node can still produce wrong content.
        - text: It has no effect, because hallucinations come from the model's weights, which a workflow cannot change
          why: The weights are unchanged, but validation steps and guardrails in the workflow can catch many wrong outputs before they are used.
        - text: It fine-tunes the LLM on the graph's past runs, so the model learns to stop hallucinating
          why: A workflow framework orchestrates calls to the model; it does not train or update it.
  unit2/langgraph/quiz1#q1:
    drop: tool-specific
    comment: asks what the LangGraph product is for and how it differs from LangChain (product identity); the control-flow idea itself is kept in unit2/langgraph/quiz1#q2
  bonus-unit2/quiz#q1:
    fix:
      options:
        2: It means scoring the agent's answers on a test set whose correct outputs are known.
        3: It means recording only the final answer the agent returns to the user.
      why:
        2: That is offline evaluation. Observability collects the signals (logs, metrics, traces); evaluation analyzes them and runs tests.
        3: Observability looks inside the run, at the actions, tool calls and model calls, not just at the final answer.
  bonus-unit2/quiz#q3:
