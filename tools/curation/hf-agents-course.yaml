# Curation for hf-agents-course (see docs/content-pipeline.md#curation).
# Refs: <unit page>#q<n>. Unlisted items are kept with the default topic `rag-agents`.
# Framework units (smolagents, LlamaIndex, LangGraph) are mostly API trivia; only conceptual items stay.
# Reviewed 2026-10-10 — 19 of 39 kept.
exclude_prefixes:
  "unit2/langgraph/": tool-specific
items:
  "unit1/quiz2#q3":
    topic: llm-basics
    fix:
      options:
        0: A simple chatbot that matches messages to a list of pre-defined answers
        1: A deep learning model trained on vast amounts of text to understand and generate language
        2: A rule-based AI system that follows strict, hand-written predefined commands
