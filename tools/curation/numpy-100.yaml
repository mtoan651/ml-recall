      question: |
        Consider 2 sets of points `P0`, `P1` describing lines (2d) and a set of points `P`; how to
        compute the distance from each point j (`P[j]`) to each line i (`P0[i]`, `P1[i]`)? With
        broadcasting, per-point quantities are indexed as `x_0[:, np.`{{1}}`]` (a column) and
        per-line quantities as `dx[np.newaxis, :]` (a row), so their combination has one row per
        point and one column per line. For 5 points and 3 lines the result has shape {{2}}.
      answer:
        blanks:
          - accept:
              - newaxis
            hint: a NumPy constant name
          - accept:
              - (5, 3)
            pattern: \(?\s*5\s*[,x×]\s*3\s*\)?
            hint: a shape, e.g. (2, 4)
        model: |
          ```python
          # Author: Yang Wu (Broadcasting)
          def distance_points_to_lines(p, p_1, p_2):
              x_0, y_0 = p.T      # (n points,)
              x_1, y_1 = p_1.T    # (n lines,)
              x_2, y_2 = p_2.T    # (n lines,)
              dx = x_2 - x_1
              dy = y_2 - y_1
              cross_term = x_2 * y_1 - y_2 * x_1
              # (n points, 1) with (1, n lines) -> (n points, n lines)
              numerator = np.abs(dy[np.newaxis, :] * x_0[:, np.newaxis]
                                 - dx[np.newaxis, :] * y_0[:, np.newaxis]
                                 + cross_term[np.newaxis, :])
              denominator = np.sqrt(dx**2 + dy**2)    # (n lines,)
              return numerator / denominator[np.newaxis, :]

          P0 = np.random.uniform(-10, 10, (3, 2))
          P1 = np.random.uniform(-10, 10, (3, 2))
          P = np.random.uniform(-10, 10, (5, 2))
          print(distance_points_to_lines(P, P0, P1).shape)   # (5, 3)
          ```
