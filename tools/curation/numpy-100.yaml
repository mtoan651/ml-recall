        bytes per element. `Y[:] = Z` then writes the converted values into that memory, so `Y[2]`
        is {{3}}.
      explanation: |
        `a.view(some_dtype)` constructs a view of the array's memory with a different data type, which
        reinterprets the bytes; when the item sizes match, the shape stays the same [^2]. Assigning
        floats into an integer array converts them and drops the fractional part, e.g. 1.2 becomes
        1 [^3], so `Y` ends as `[1, 42, 99]` and the float data in that buffer are overwritten.
        `Z.astype(np.int32)` would give the same numbers in a newly allocated array instead [^4].
        This is the numpy-100 solution [^1].
      answer:
        model: |
          ```python
          # Thanks Vikas (https://stackoverflow.com/a/10622758/5989906)
          # & unutbu (https://stackoverflow.com/a/4396247/5989906)
          Z = (np.random.rand(10)*100).astype(np.float32)
          Y = Z.view(np.int32)
          Y[:] = Z
          print(Y)
          ```
