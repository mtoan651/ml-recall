        What is the output of this script?

        ```python
        print(sum(range(5), -1))
        from numpy import *
        print(sum(range(5), -1))
        ```

        The first line prints {{1}}. The second prints {{2}}, because `from numpy import *` replaces
        the built-in `sum` with `np.sum`, whose second positional parameter is the {{3}}.
      explanation: |
        Python's built-in `sum(iterable, start)` adds the items to the start value, so it returns
        $-1 + 0 + 1 + 2 + 3 + 4 = 9$ [^2]. The star import binds the name `sum` to
        `numpy.sum(a, axis=None, ...)`, so `-1` is read as the axis; a negative axis counts from the
        last one, and summing the only axis gives the plain total 10 [^3]. numpy-100 uses this script
        to show how a star import silently shadows a built-in [^1].
      answer:
        model: |
          ```python
          print(sum(range(5), -1))   # 9: built-in sum(iterable, start)
          from numpy import *
          print(sum(range(5), -1))   # 10: numpy.sum(a, axis=-1)
          ```
