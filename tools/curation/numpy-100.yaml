items:
  "q3":
    difficulty: easy
    fix:
      question: 'Create a null vector (all zeros) of size 10: `Z = np.`{{1}}`(10)`'
      explanation: |
        `np.zeros(shape)` returns a new array of the given shape filled with zeros [^2]. A single
        integer such as 10 is a valid shape and gives a 1-D vector of ten elements, of dtype float64 by
        default [^2]. This is the numpy-100 solution [^1]. `np.empty(10)` would also make ten elements,
        but it leaves them uninitialised [^2].
      answer:
        blanks:
          - accept:
              - zeros
              - np.zeros
              - numpy.zeros
            hint: a NumPy function name
        model: |
          ```python
          Z = np.zeros(10)
          print(Z)
          ```
      references:
        - title: numpy.zeros (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.zeros.html
          locator: Function description; shape and dtype parameters; See also (empty)
  "q4":
    difficulty: easy
    fix:
      question: |
        Find the memory size of an array. For `Z = np.zeros((10,10))` the size in bytes is
        `Z.size * Z.`{{1}}, and NumPy also gives it directly as the attribute `Z.`{{2}}. Here it
        is {{3}} bytes.
      explanation: |
        `itemsize` is the length of one array element in bytes [^2], and `nbytes` is the total number
        of bytes consumed by the elements [^3], i.e. the number of elements times `itemsize`.
        `np.zeros` creates float64 values by default [^4], 8 bytes each, so the 100 elements of a
        10x10 array take $100 \times 8 = 800$ bytes. numpy-100 shows both ways [^1].
      answer:
        blanks:
          - accept:
              - itemsize
            hint: an ndarray attribute
          - accept:
              - nbytes
            hint: an ndarray attribute
          - numeric: 800
            hint: a number
        model: |
          ```python
          Z = np.zeros((10,10))
          print("%d bytes" % (Z.size * Z.itemsize))

          # Simpler alternative
          print("%d bytes" % Z.nbytes)
          ```
      references:
        - title: numpy.ndarray.itemsize (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.ndarray.itemsize.html
          locator: Attribute description and examples
        - title: numpy.ndarray.nbytes (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.ndarray.nbytes.html
          locator: Attribute description and example (np.prod(x.shape) * x.itemsize)
        - title: numpy.zeros (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.zeros.html
          locator: dtype parameter (default numpy.float64)
  "q6":
    difficulty: easy
    fix:
      question: |
        Create a null vector of size 10 but the fifth value which is 1: after `Z = np.zeros(10)`,
        set `Z[`{{1}}`] = 1`.
      explanation: |
        NumPy indices are zero-based: for a dimension of length 10 the valid indices are 0 to 9, so the
        fifth element has index 4 [^2]. Negative indices count from the end ($n_i + d_i$), so `Z[-6]`
        reaches the same element [^2]. `np.zeros(10)` supplies the ten zeros to start from [^3], as in
        the numpy-100 solution [^1].
      answer:
        blanks:
          - accept:
              - '4'
              - '-6'
            pattern: 4|-6
            hint: an integer index
        model: |
          ```python
          Z = np.zeros(10)
          Z[4] = 1
          print(Z)
          ```
      references:
        - title: Indexing on ndarrays (NumPy user guide)
          url: https://numpy.org/doc/stable/user/basics.indexing.html#slicing-and-striding
          locator: Basic indexing, Slicing and striding (zero-based and negative indices)
        - title: numpy.zeros (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.zeros.html
          locator: Function description
  "q7":
    difficulty: easy
    fix:
      question: 'Create a vector with values ranging from 10 to 49: `Z = np.`{{1}}`(10, `{{2}}`)`'
      explanation: |
        `np.arange(start, stop)` generates values in the half-open interval [start, stop): the start is
        included but the stop is not [^2]. To end at 49 the stop must therefore be 50, which gives the
        40 integers 10, 11, …, 49, as in the numpy-100 solution [^1]. For integer arguments `arange`
        behaves like Python's `range` but returns an ndarray [^2].
      answer:
        blanks:
          - accept:
              - arange
              - np.arange
              - numpy.arange
            hint: a NumPy function name
          - numeric: 50
            hint: a number
        model: |
          ```python
          Z = np.arange(10,50)
          print(Z)
          ```
      references:
        - title: numpy.arange (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.arange.html
          locator: Function description; start and stop parameters
  "q8":
    difficulty: easy
    fix:
      question: 'Reverse a vector (first element becomes last) with slicing: `Z = Z[::`{{1}}`]`'
      explanation: |
        In the slice syntax `i:j:k`, `k` is the step, and a negative step walks towards smaller
        indices; with `i` and `j` omitted and `k < 0`, the slice starts at the last element and runs to
        the first [^2]. So `Z[::-1]` is the numpy-100 answer [^1]. `np.flip(Z)` does the same: for a
        1-D array it corresponds to `Z[::-1]` and returns a view [^3].
      answer:
        blanks:
          - numeric: -1
            hint: the step, a number
        model: |
          ```python
          Z = np.arange(50)
          Z = Z[::-1]
          print(Z)
          ```
      references:
        - title: Indexing on ndarrays (NumPy user guide)
          url: https://numpy.org/doc/stable/user/basics.indexing.html#slicing-and-striding
          locator: Basic indexing, Slicing and striding (i:j:k, negative k, defaults)
        - title: numpy.flip (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/generated/numpy.flip.html
          locator: Returns; Notes (flip(m) corresponds to m[::-1, ...])
