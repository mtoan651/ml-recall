  q78:
    difficulty: hard
    fix:
      question: |
        Consider 2 sets of points `P0`, `P1` describing lines (2d) and a point `p`; how to compute
        the distance from `p` to each line i (`P0[i]`, `P1[i]`)? A vectorized solution rotates each
        direction `P1 - P0` by 90 degrees into a normal vector `v`, then computes
        `norm = np.linalg.`{{1}}`(v, axis=1)`, `r = P0 - p` and
        `d = np.abs(np.einsum("`{{2}}`", r, v)) / norm`, where the einsum is the row-wise dot
        product. For the line through (0, 0) and (1, 0) and the point p = (3, 4), `d` is {{3}}.
      explanation: |
        With an integer `axis`, `np.linalg.norm` computes one vector norm per row [^2]. In `einsum`
        a label repeated across operands is multiplied and, when it is left out of the output after
        `->`, summed; so `'ij,ij->i'` multiplies matching entries and sums over `j`, giving one dot
        product per row [^3]. The distance is $|r \cdot v| / \lVert v \rVert$ with $v$ normal to the
        line; for the x-axis and $p = (3, 4)$ it is the height 4 [^1].
      answer:
        model: |
          ```python
          P0 = np.random.uniform(-10,10,(10,2))
          P1 = np.random.uniform(-10,10,(10,2))
          p  = np.random.uniform(-10,10,( 1,2))

          def distance_faster(P0,P1,p):
              #Author: Hemanth Pasupuleti
              #Reference: https://mathworld.wolfram.com/Point-LineDistance2-Dimensional.html

              v = P1- P0
              v[:,[0,1]] = v[:,[1,0]]
              v[:,1]*=-1
              norm = np.linalg.norm(v,axis=1)
              r = P0 - p
              d = np.abs(np.einsum("ij,ij->i",r,v)) / norm

              return d

          print(distance_faster(P0, P1, p))

          ##--------------- OR ---------------##
          def distance_slower(P0, P1, p):
              T = P1 - P0
              L = (T**2).sum(axis=1)
              U = -((P0[:,0]-p[...,0])*T[:,0] + (P0[:,1]-p[...,1])*T[:,1]) / L
              U = U.reshape(len(U),1)
              D = P0 + U*T - p
              return np.sqrt((D**2).sum(axis=1))

          print(distance_slower(P0, P1, p))
          ```
        blanks:
