        that shape, so `(3,3,3)` gives 27 values in a 3x3x3 array [^3]. This is the numpy-100
        solution [^1]; new code should prefer the `random` method of a Generator, e.g.
        `np.random.default_rng().random((3,3,3))` [^3].
