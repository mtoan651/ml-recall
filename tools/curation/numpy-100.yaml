    fix:
      question: |
        How to ignore all NumPy floating-point warnings (not recommended)? Globally,
        `defaults = np.`{{1}}`(all="ignore")` switches them off and returns the old settings, which
        `np.seterr(**defaults)` restores later. Locally, `with np.`{{2}}`(all="ignore"):` ignores
        them only inside the block. With the warnings off, `np.ones(1) / 0` silently returns an
        array holding {{3}}.
      explanation: |
        `np.seterr` sets how floating-point errors (divide, over, under, invalid) are handled, `all`
        sets every kind at once, and it returns a dictionary with the old settings [^2]. `np.errstate`
        is the context-manager form: on entry it sets the handling with `seterr`, and on exit it
        restores the previous state, so the change cannot leak out of the block [^3]. By default NumPy
        warns on divide, overflow and invalid [^4]; division by zero gives an infinite result [^2], and
        ignoring the error only hides the RuntimeWarning. numpy-100 shows both forms [^1].
      answer:
        model: |
          ```python
          # Suicide mode on
          defaults = np.seterr(all="ignore")
          Z = np.ones(1) / 0

          # Back to sanity
          _ = np.seterr(**defaults)

          # Equivalently with a context manager
          with np.errstate(all="ignore"):
              np.arange(3) / 0
          ```
