  q98:
    difficulty: hard
    fix:
      question: |
        Considering a path described by two vectors `(x, y)`, how to sample it using equidistant
        samples? Compute the segment lengths with `dx = np.`{{1}}`(x)` (and `dy` likewise) and
        `dr = (dx**2 + dy**2)**.5`, the distance along the path with `r = np.zeros_like(x)` and
        `r[1:] = np.`{{2}}`(dr)`, then take 200 equally spaced distances
        `r_int = np.linspace(0, r.max(), 200)` and interpolate the coordinates with
        `x_int = np.`{{3}}`(r_int, r, x)` (and the same for `y`).
      explanation: |
        `np.diff` returns the differences of consecutive elements, `a[i+1] - a[i]` [^2], so `dr` holds
        the length of each straight segment. `np.cumsum` accumulates them into the distance travelled
        from the start [^3], with `r[0] = 0` for the first point. `np.interp(x, xp, fp)` evaluates the
        piecewise-linear function through the points `(xp, fp)` at new positions and needs increasing
        `xp` [^4], which the distance is. Equally spaced `r_int` therefore give points equally spaced
        along the path, as in the numpy-100 solution [^1].
      answer:
        model: |
          ```python
          # Author: Bas Swinckels

          phi = np.arange(0, 10*np.pi, 0.1)
          a = 1
          x = a*phi*np.cos(phi)
          y = a*phi*np.sin(phi)

          dr = (np.diff(x)**2 + np.diff(y)**2)**.5 # segment lengths
          r = np.zeros_like(x)
          r[1:] = np.cumsum(dr)                # integrate path
          r_int = np.linspace(0, r.max(), 200) # regular spaced path
          x_int = np.interp(r_int, r, x)       # integrate path
          y_int = np.interp(r_int, r, y)
          ```
        blanks:
          - accept:
              - diff
              - np.diff
              - numpy.diff
            hint: a NumPy function name
          - accept:
              - cumsum
              - np.cumsum
              - numpy.cumsum
            hint: a NumPy function name
          - accept:
              - interp
              - np.interp
              - numpy.interp
            hint: a NumPy function name
