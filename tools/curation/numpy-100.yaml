    fix:
      question: |
        Considering a (w,h,3) array `I` of RGB pixels (dtype=ubyte), compute the number of unique
        colors:
        `colors = np.`{{1}}`(I.reshape(`{{2}}`, 3), axis=0)` and `n = len(colors)`. A faster variant
        packs each pixel into a single 24-bit integer with
        `I24 = np.dot(I.astype(np.uint32), [1, 256, `{{3}}`])` and counts the unique integers.
      explanation: |
        In a reshape one dimension can be -1, and NumPy infers it, so `I.reshape(-1, 3)` is a list of
        $w \cdot h$ RGB rows [^2]. With `axis=0`, `np.unique` treats each row as one element and returns
        the distinct rows [^3]. `np.dot` of an N-D array with a 1-D array is a sum product over the last
        axis [^4], so each pixel becomes $r + 256g + 256^2 b$ with $256^2 = 65536$; since every channel
        is below 256, different colors give different integers. numpy-100 shows both versions [^1].
      answer:
        model: |
          ```python
          # Author: Fisher Wang

          w, h = 256, 256
          I = np.random.randint(0, 4, (h, w, 3)).astype(np.ubyte)
          colors = np.unique(I.reshape(-1, 3), axis=0)
          n = len(colors)
          print(n)

          # Faster version
          # Author: Mark Setchell
          # https://stackoverflow.com/a/59671950/2836621

          w, h = 256, 256
          I = np.random.randint(0,4,(h,w,3), dtype=np.uint8)

          # View each pixel as a single 24-bit integer, rather than three 8-bit bytes
          I24 = np.dot(I.astype(np.uint32),[1,256,65536])

          # Count unique colours
          n = len(np.unique(I24))
          print(n)
          ```
        blanks:
