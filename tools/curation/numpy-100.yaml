      question: |
        Create a 2d array with 1 on the border and 0 inside: start from `Z = np.ones((10,10))` and
        zero the interior with `Z[`{{1}}`] = 0`. The result contains {{2}} zeros.
      explanation: |
        In a slice `i:j` the stop `j` is excluded, and a negative index counts from the end, so `1:-1`
        selects indices 1 to 8 of a length-10 axis, skipping the first and last [^2]. Applying it to
        both rows and columns selects the 8x8 interior, so $8 \times 8 = 64$ entries become 0 and the
        36 border entries stay 1. This is the numpy-100 solution [^1].
      answer:
