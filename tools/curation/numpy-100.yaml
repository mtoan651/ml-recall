              - 1:-1, 1:-1
              - 1:9, 1:9
            pattern: 1\s*:\s*(-1|9)\s*,\s*1\s*:\s*(-1|9)
            hint: row slice, column slice (start:stop, start:stop)
          - numeric: 64
            hint: a number
        model: |
          ```python
          Z = np.ones((10,10))
          Z[1:-1,1:-1] = 0
          print(Z)
          ```
