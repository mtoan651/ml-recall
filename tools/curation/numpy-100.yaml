  q63:
    difficulty: hard
    fix:
      question: |
        Create an array class that has a `name` attribute. In `class NamedArray(np.ndarray)`, the
        `__new__` method turns the input into an instance of the subclass with
        `obj = np.asarray(array).`{{1}}`(cls)` and sets `obj.name = name`. Arrays derived from it,
        such as slices, get the attribute in the method `def `{{2}}`(self, obj):`, which copies
        `getattr(obj, 'name', "no name")`. Without that method, `Z[2:5].name` would raise an
        {{3}}.
      explanation: |
        View casting, `arr.view(SubClass)`, is the standard way to return an existing array's data as
        an instance of a subclass [^2]. `__new__` runs only for an explicit constructor call, while
        `__array_finalize__` is called for all three ways a subclass instance appears (constructor,
        view casting, and new-from-template such as slicing), so it is where defaults for new
        attributes go [^2]. A slice is a new `NamedArray` instance; without `__array_finalize__` its
        `name` is never set and reading it raises AttributeError. numpy-100's solution follows this
        pattern [^1].
      answer:
        model: |
          ```python
          class NamedArray(np.ndarray):
              def __new__(cls, array, name="no name"):
                  obj = np.asarray(array).view(cls)
                  obj.name = name
                  return obj
              def __array_finalize__(self, obj):
                  if obj is None: return
                  self.name = getattr(obj, 'name', "no name")

          Z = NamedArray(np.arange(10), "range_10")
          print (Z.name)
          ```
        blanks:
          - accept:
              - view
            hint: an ndarray method name
          - accept:
              - __array_finalize__
            hint: a special method name
          - accept:
              - AttributeError
            hint: an exception class name
      references:
        - title: Subclassing ndarray (NumPy user guide)
          url: https://numpy.org/doc/stable/user/basics.subclassing.html#the-role-of-array-finalize
          locator: View casting; Creating new from template; The role of __array_finalize__
