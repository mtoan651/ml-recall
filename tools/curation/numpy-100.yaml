    difficulty: medium
    fix:
      question: |
        Consider an integer vector `Z = np.arange(3)`. Which of these expressions are legal?

        ```python
        Z**Z
        2 << Z >> 2
        Z <- Z
        1j*Z
        Z/1/1
        Z<Z>Z
        ```

        Exactly one of them raises an exception: {{1}} (type the expression). Python evaluates a
        chained comparison `a < b > c` as `(a < b)` {{2}} `(b > c)`, which needs the truth value of
        a whole array, and NumPy raises a {{3}}. The odd-looking `Z <- Z` is legal: it is
        `Z < (-Z)`.
      explanation: |
        Powers, the shifts `<<` and `>>`, multiplication by the complex scalar `1j` and true division
        all work element-wise on an integer array; `Z**Z` is fine here because no exponent is negative,
        since integers raised to negative integer powers raise an error [^4]. `Z <- Z` is a comparison
        with a unary minus [^2]. A chained comparison is defined as the comparisons joined by `and` [^2],
        and `and` needs the truth value of the first array; NumPy raises a ValueError for the truth
        value of an array with more than one element because it is ambiguous, and suggests `.any()` or
        `.all()` [^3]. numpy-100 poses this as a puzzle on operator parsing [^1].
      answer:
        model: |
          ```python
          Z = np.arange(3)
          Z**Z         # array([1, 1, 4])
          2 << Z >> 2  # array([0, 1, 2])
          Z <- Z       # Z < -Z: array([False, False, False])
          1j*Z         # array([0.+0.j, 0.+1.j, 0.+2.j])
          Z/1/1        # array([0., 1., 2.])
          Z<Z>Z        # ValueError: the truth value of an array with more than one element is ambiguous
          ```
