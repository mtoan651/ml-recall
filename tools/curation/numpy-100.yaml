    fix:
      question: |
        Create a 2D array subclass such that `Z[i,j] == Z[j,i]`. The subclass
        `Symetric(np.ndarray)` overrides the special method {{1}} so that an assignment
        `S[i,j] = value` also sets `S[j,i]`. The starting matrix is made symmetric with
        `Z + Z.`{{2}}` - np.diag(Z.diagonal())` and then viewed as the subclass. For
        `Z = np.array([[1, 2], [3, 4]])`, both off-diagonal entries become {{3}}.
      explanation: |
        `ndarray.T` is the transposed array [^2], so `Z + Z.T` is symmetric but counts the diagonal
        twice; subtracting `np.diag(Z.diagonal())`, a diagonal matrix built from the extracted
        diagonal [^3], puts it back. The off-diagonal entries become 2 + 3 = 5. Python calls
        `__setitem__` to implement `self[key] = value` [^4], so overriding it keeps later assignments
        symmetric, and `.view(Symetric)` turns the result into the subclass [^5]. numpy-100 notes that
        the class only handles 2-D arrays and assignments with an (i, j) index [^1].
      answer:
        model: |
          ```python
          # Author: Eric O. Lebigot
          # Note: only works for 2d array and value setting using indices

          class Symetric(np.ndarray):
              def __setitem__(self, index, value):
                  i,j = index
                  super(Symetric, self).__setitem__((i,j), value)
                  super(Symetric, self).__setitem__((j,i), value)

          def symetric(Z):
              return np.asarray(Z + Z.T - np.diag(Z.diagonal())).view(Symetric)

          S = symetric(np.random.randint(0,10,(5,5)))
          S[2,3] = 42
          print(S)
          ```
