    fix:
      question: |
        Consider an arbitrary array, write a function that extracts a subpart with a fixed shape and
        centered on a given element (pad with a `fill` value when necessary). numpy-100 computes, for
        each axis, the start and stop of the window in `Z` and in the result `R`, clips them to the
        array bounds with `np.maximum` and `np.minimum`, and copies with `R[r] = Z[z]`, where
        `r = tuple(`{{1}}`(start, stop) for start, stop in zip(R_start, R_stop))` and `z` is built
        likewise. For `Z = np.arange(100).reshape(10, 10)`, a (5, 5) window centred on position
        (1, 1) with `fill = 0` copies {{2}} values from `Z`, and its centre `R[2, 2]` is {{3}}.
      explanation: |
        Indexing with a tuple is the same as writing the indices separated by commas, and the
        built-in `slice(start, stop)` is the object form of `start:stop`, so code can build an index
        for any number of axes [^2]. The window centred on (1, 1) covers rows and columns -1 to 3 of
        `Z`; row and column -1 lie outside, so 4 x 4 = 16 values are copied and the other 9 cells keep
        the fill value [^1]. The centre of the window is the requested element, `Z[1, 1] = 11`.
      answer:
        model: |
          ```python
          # Author: Nicolas Rougier

          Z = np.random.randint(0,10,(10,10))
          shape = (5,5)
          fill  = 0
          position = (1,1)

          R = np.ones(shape, dtype=Z.dtype)*fill
          P  = np.array(list(position)).astype(int)
          Rs = np.array(list(R.shape)).astype(int)
          Zs = np.array(list(Z.shape)).astype(int)

          R_start = np.zeros((len(shape),)).astype(int)
          R_stop  = np.array(list(shape)).astype(int)
          Z_start = (P-Rs//2)
          Z_stop  = (P+Rs//2)+Rs%2

          R_start = (R_start - np.minimum(Z_start,0)).tolist()
          Z_start = (np.maximum(Z_start,0)).tolist()
          R_stop = np.maximum(R_start, (R_stop - np.maximum(Z_stop-Zs,0))).tolist()
          Z_stop = (np.minimum(Z_stop,Zs)).tolist()

          r = tuple([slice(start,stop) for start,stop in zip(R_start,R_stop)])
          z = tuple([slice(start,stop) for start,stop in zip(Z_start,Z_stop)])
          R[r] = Z[z]
          print(Z)
          print(R)
          ```
