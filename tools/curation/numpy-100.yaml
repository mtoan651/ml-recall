  "q21":
    difficulty: easy
    fix:
      question: |
        Create a checkerboard 8x8 matrix by tiling the 2x2 block `[[0,1],[1,0]]`:
        `Z = np.`{{1}}`(np.array([[0,1],[1,0]]), `{{2}}`)`
      explanation: |
        `np.tile(A, reps)` builds an array by repeating `A` the number of times given by `reps` along
        each axis [^2]. Repeating the 2x2 block 4 times down and 4 times across gives an 8x8
        checkerboard, the numpy-100 solution [^1]. A plain `4` would not do: when `A.ndim` exceeds the
        length of `reps`, ones are prepended, so `4` acts as `(1, 4)` and gives a 2x8 array [^2].
      answer:
        blanks:
          - accept:
