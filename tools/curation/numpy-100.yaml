  q88:
    difficulty: hard
    fix:
      question: |
        How to implement the Game of Life using NumPy arrays? numpy-100 counts the live neighbours of
        every interior cell at once by adding {{1}} shifted slices,
        `N = Z[0:-2,0:-2] + Z[0:-2,1:-1] + Z[0:-2,2:] + ...`, so for a 50x50 board `N` has shape
        {{2}}. With the boolean arrays `birth` and `survive`, the cells alive in the next step are set
        by `Z[1:-1,1:-1][birth` {{3}} `survive] = 1`.
      explanation: |
        Each slice such as `Z[0:-2, 0:-2]` is the board shifted by one cell in one of the 8 neighbour
        directions and cut to the interior, so their sum is the neighbour count of every interior
        cell [^1][^2]. Dropping one row and one column at each edge leaves 50 - 2 = 48 cells per
        axis. On boolean arrays `|` is the element-wise OR (`np.bitwise_or`) [^3], and the combined
        mask selects the cells to set through boolean array indexing [^2].
      answer:
        model: |
          ```python
          # Author: Nicolas Rougier

          def iterate(Z):
              # Count neighbours
              N = (Z[0:-2,0:-2] + Z[0:-2,1:-1] + Z[0:-2,2:] +
                   Z[1:-1,0:-2]                + Z[1:-1,2:] +
                   Z[2:  ,0:-2] + Z[2:  ,1:-1] + Z[2:  ,2:])

              # Apply rules
              birth = (N==3) & (Z[1:-1,1:-1]==0)
              survive = ((N==2) | (N==3)) & (Z[1:-1,1:-1]==1)
              Z[...] = 0
              Z[1:-1,1:-1][birth | survive] = 1
              return Z

          Z = np.random.randint(0,2,(50,50))
          for i in range(100): Z = iterate(Z)
          print(Z)
          ```
