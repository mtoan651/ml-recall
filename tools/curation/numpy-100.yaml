  "q17":
    difficulty: medium
    fix:
      question: |
        What is the result of the following expressions? Two are filled in; answer `True`, `False`
        or `nan` for the others.

        - `0 * np.nan` → `nan`
        - `np.nan - np.nan` → `nan`
        - `np.nan == np.nan` → {{1}}
        - `np.inf > np.nan` → {{2}}
        - `np.nan in set([np.nan])` → {{3}}
        - `0.3 == 3 * 0.1` → {{4}}
      explanation: |
        `np.nan` is the IEEE 754 Not a Number value [^2], and under IEEE 754 any ordered comparison with
        NaN is false and NaN is not even equal to itself [^3], so the first two comparisons are
        `False`. Membership in a set is tested as `x is e or x == e`, and `np.nan` is one single object,
        so the identity check makes it `True` [^4]. 0.1 has no exact binary representation, so
        `3 * 0.1` is not exactly 0.3 and the comparison is `False` [^5]. numpy-100 prints all six [^1].
      answer:
        blanks:
          - accept:
              - 'False'
            hint: True, False or nan
          - accept:
              - 'False'
            hint: True, False or nan
          - accept:
              - 'True'
            hint: True, False or nan
          - accept:
              - 'False'
            hint: True, False or nan
        model: |
          ```python
          print(0 * np.nan)
          print(np.nan == np.nan)
          print(np.inf > np.nan)
          print(np.nan - np.nan)
          print(np.nan in set([np.nan]))
          print(0.3 == 3 * 0.1)
          ```
      references:
        - title: Constants, numpy.nan (NumPy documentation)
          url: https://numpy.org/doc/stable/reference/constants.html
          locator: numpy.nan
        - title: The Python Language Reference, Expressions
          url: https://docs.python.org/3/reference/expressions.html#value-comparisons
          locator: Sec. 6.10.1 Value comparisons (not-a-number values)
        - title: The Python Language Reference, Expressions
          url: https://docs.python.org/3/reference/expressions.html#membership-test-operations
          locator: Sec. 6.10.2 Membership test operations
        - title: The Python Tutorial, Floating-Point Arithmetic
          url: https://docs.python.org/3/tutorial/floatingpoint.html
          locator: 'Sec. 15 Floating-Point Arithmetic: Issues and Limitations'
