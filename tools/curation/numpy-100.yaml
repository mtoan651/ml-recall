  q99:
    difficulty: medium
    fix:
      question: |
        Given an integer `n` and a 2D array `X`, select from `X` the rows which can be interpreted as
        draws from a multinomial distribution with `n` degrees, i.e., the rows which only contain
        integers and which sum to `n`.
        `M = np.logical_and.`{{1}}`(np.`{{2}}`(X, 1) == 0, axis=-1)` marks the rows made only of whole
        numbers, and `M &= (X.sum(axis=-1) == n)` adds the sum condition. For
        `X = np.asarray([[1.0, 0.0, 3.0, 8.0], [2.0, 0.0, 1.0, 1.0], [1.5, 2.5, 1.0, 0.0]])` and
        `n = 4`, `X[M]` contains {{3}} row(s).
      explanation: |
        `np.mod(X, 1)` is the element-wise remainder of division by 1 [^2], which is 0 exactly for whole
        numbers. `ufunc.reduce` applies a ufunc repeatedly along an axis [^3], so
        `np.logical_and.reduce(..., axis=-1)` ANDs the entries of each row [^4], like
        `.all(axis=-1)`. The first two rows are whole numbers, but only `[2, 0, 1, 1]` sums to 4; the
        third contains 1.5 and 2.5. So one row is selected, as numpy-100 prints [^1].
      answer:
        model: |
          ```python
          # Author: Evgeni Burovski

          X = np.asarray([[1.0, 0.0, 3.0, 8.0],
                          [2.0, 0.0, 1.0, 1.0],
                          [1.5, 2.5, 1.0, 0.0]])
          n = 4
          M = np.logical_and.reduce(np.mod(X, 1) == 0, axis=-1)
          M &= (X.sum(axis=-1) == n)
          print(X[M])
          ```
