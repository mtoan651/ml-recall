    difficulty: hard
    fix:
      question: |
        Consider a set of triplets describing triangles (with shared vertices), e.g.
        `faces = np.random.randint(0, 100, (10, 3))`, and find the set of unique line segments
        composing all the triangles. numpy-100's solution:

        ```python
        F = ...                                # line (1): each (a,b,c) -> (a,b,b,c,c,a)
        F = F.reshape(len(F)*3, 2)             # one row per edge
        F = ...                                # line (2): make (b,a) equal to (a,b)
        G = F.view(dtype=[('p0', F.dtype), ('p1', F.dtype)])
        G = np.unique(G)
        ```

        Line (1) is `F = np.`{{1}}`(faces.repeat(2, axis=1), -1, axis=1)` and line (2) is
        `F = np.`{{2}}`(F, axis=1)`. For the two triangles `faces = np.array([[0, 1, 2], [1, 2, 3]])`,
        `G` has {{3}} elements.
      explanation: |
        `faces.repeat(2, axis=1)` repeats each vertex after itself, turning (a,b,c) into
        (a,a,b,b,c,c) [^2], and `np.roll` by -1 shifts the elements left with wrap-around, giving
        (a,b,b,c,c,a) [^3]. Reshaping into pairs lists the three edges of each triangle, and sorting
        each pair along `axis=1` makes an edge independent of its direction [^4]. Viewing each row as a
        single structured element lets `np.unique` remove repeated edges [^5]: the two triangles share
        edge (1,2), so 6 edges reduce to 5 [^1].
      answer:
        model: |
          ```python
          # Author: Nicolas P. Rougier

          faces = np.random.randint(0,100,(10,3))
          F = np.roll(faces.repeat(2,axis=1),-1,axis=1)
          F = F.reshape(len(F)*3,2)
          F = np.sort(F,axis=1)
          G = F.view( dtype=[('p0',F.dtype),('p1',F.dtype)] )
          G = np.unique(G)
          print(G)
          ```
        blanks:
          - accept:
              - roll
              - np.roll
              - numpy.roll
            hint: a NumPy function name
          - accept:
              - sort
              - np.sort
              - numpy.sort
            hint: a NumPy function name
          - numeric: 5
            hint: a number
      references:
