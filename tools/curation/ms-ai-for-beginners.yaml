  "quiz-106/q1":
    difficulty: easy
    fix:
      type: multiple
      question: |
        Computer vision aims to give computers a high-level understanding of digital images. Which of
        these tasks belong to computer vision? Select all that apply.
      explanation: |
        "Understanding" an image covers many tasks: finding objects in a picture (object detection),
        recognising events, describing a picture in text, reconstructing a scene in 3D, and tasks on
        images of people such as age and emotion estimation or face recognition [^1]. Machine
        translation works on text and speech recognition on audio; both reached human parity as
        separate fields from image classification [^2].
      options:
        - text: Finding and locating the objects in a photo
          correct: true
        - text: Estimating a person's age from a photo of their face
          correct: true
        - text: Reconstructing a 3D model of a scene from images
          correct: true
        - text: Translating an English sentence into French
        - text: Converting recorded speech into text
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md
          locator: 'Lesson: Introduction to Computer Vision, introduction'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#recent-ai-research
          locator: 'Lesson: Introduction to AI, sec. Recent AI Research (human parity table)'
      references_replace: true
  "quiz-106/q2":
    difficulty: easy
    fix:
      question: |
        OpenCV is the de facto standard library for image processing. In which channel order does
        `cv2.imread` return a colour image?
      explanation: |
        OpenCV traditionally encodes colour images as BGR, while most other Python tools, such as
        Matplotlib, expect RGB [^1]. An image loaded with `cv2.imread` and shown directly therefore has
        its red and blue swapped; convert it first with `cv2.cvtColor(im, cv2.COLOR_BGR2RGB)` or by
        reversing the channel axis [^1]. HSV and grayscale are other colour spaces that `cvtColor` can
        convert to on request, not the default when loading a colour image [^1].
      shuffle: true
      options:
        - text: BGR (blue, green, red)
          correct: true
        - text: RGB (red, green, blue)
        - text: HSV (hue, saturation, value)
        - text: It returns a single grayscale channel
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#loading-images
          locator: 'Lesson: Introduction to Computer Vision, sec. Loading Images'
      references_replace: true
  "quiz-106/q3":
    difficulty: easy
    fix:
      type: short_answer
      question: |
        A colour image 320 pixels wide and 200 pixels high is loaded with OpenCV into a NumPy array.
        What is the shape of the array?
      explanation: |
        Images are stored as NumPy arrays with rows first: a grayscale image of 320×200 pixels is a
        $200 \times 320$ array, and a colour image of the same size has shape $200 \times 320 \times 3$, one
        slice per colour channel [^1]. A common mistake is to write the width first, as in the usual
        "320×200" description of the image size.
      options: []
      answer:
        accept:
          - (200, 320, 3)
        pattern: \(?\s*200\s*[,x×]\s*320\s*[,x×]\s*3\s*\)?
        hint: Three numbers, e.g. (10, 20, 1)
        model: '$(200, 320, 3)$: (height, width, colour channels)'
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#loading-images
          locator: 'Lesson: Introduction to Computer Vision, sec. Loading Images'
      references_replace: true
  "quiz-206/q3":
    difficulty: easy
    fix:
      question: |
        In a computer-vision pipeline, resizing an image to the size a network expects and blurring it
        to remove noise are typically done at which stage?
      explanation: |
        Before an image is passed to a neural network, it often pays to enhance it with algorithmic
        techniques; OpenCV's pre-processing steps include resizing (`cv2.resize`), blurring
        (`cv2.medianBlur`, `cv2.GaussianBlur`), brightness and contrast changes and thresholding [^1].
        Backpropagation updates the network's weights and does not edit the input images, and
        post-processing works on the predictions after the network has run.
      options:
        0: Pre-processing, before the image is fed to the network
        1: Training, as part of the backpropagation step
        2: Post-processing, applied to the network's predictions
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#image-processing
          locator: 'Lesson: Introduction to Computer Vision, sec. Image Processing'
      references_replace: true
  "quiz-207/q2":
    difficulty: medium
    fix:
      type: single
      question: |
        On image data, a convolutional network usually generalizes better than a fully connected
        network. What is the main reason?
      explanation: |
        A CNN looks for patterns with small convolutional filters; what matters is that a pattern is
        present and its relative position, not its exact location in the image, and the filters are
        learned automatically [^1]. Building in translation invariance and locality cuts a layer from
        billions of parameters to a few hundred, and when that bias matches reality the model is
        sample-efficient and generalizes well to unseen data [^2]. More parameters make memorising,
        i.e. overfitting, easier, and flattening the image is what a fully connected network does,
        throwing away the spatial structure [^2].
      options:
        - text: Small filters shared across the image give far fewer parameters and find a pattern anywhere
          correct: true
        - text: It has many more parameters than a dense network, so it can memorise every training image
        - text: It first flattens the image into one long vector, so pixel positions no longer matter
        - text: Its filters are designed by hand by experts, so it does not need any training data
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/README.md
          locator: 'Lesson: Convolutional Neural Networks, introduction and sec. Main ideas behind CNN'
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/why-conv.html#locality
          locator: Sec. 7.1 From Fully Connected Layers to Convolutions (7.1.2.2 Locality)
      references_replace: true
  "quiz-207/q3":
    topic: pytorch
    difficulty: medium
    fix:
      type: single
      question: |
        A $28 \times 28$ RGB image loaded with PIL is passed through
        `torchvision.transforms.ToTensor()`. What comes out?
      explanation: |
        A network trains on tensors, and a colour image is a 3D tensor with a colour-depth dimension
        [^1]. `ToTensor` converts a PIL image or a `uint8` NumPy array of shape (H, W, C) with values in
        [0, 255] into a `FloatTensor` of shape (C, H, W) with values in [0.0, 1.0] [^2]. It moves the
        channels first and rescales, but it does not standardize; subtracting a mean and dividing by a
        standard deviation per channel is the separate `Normalize` transform [^3].
      options:
        - text: A float tensor of shape (3, 28, 28) with values scaled to [0, 1]
          correct: true
        - text: A float tensor of shape (28, 28, 3) with values from 0 to 255
        - text: An integer tensor of shape (3, 28, 28) with values from 0 to 255
        - text: A float tensor of shape (3, 28, 28) standardized to mean 0 and standard deviation 1
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/README.md
          locator: 'Lesson: Convolutional Neural Networks, introduction'
        - title: torchvision documentation
          url: https://docs.pytorch.org/vision/stable/generated/torchvision.transforms.ToTensor.html
          locator: torchvision.transforms.ToTensor
        - title: torchvision documentation
          url: https://docs.pytorch.org/vision/stable/generated/torchvision.transforms.Normalize.html
          locator: torchvision.transforms.Normalize
      references_replace: true
  "quiz-108/q2":
    topic: training
    difficulty: easy
    fix:
      question: Which of these is not a normalization technique?
      explanation: |
        Weight normalization and layer normalization are real normalization techniques, listed in the
        course next to the most widely used one, batch normalization [^1]. Layer normalization, for
        example, standardizes each example's activations with that example's own mean and standard
        deviation [^2]. "Height normalization" is not a technique.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#batch-normalization
          locator: Deep Learning Training Tricks, Batch Normalization
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
          locator: Sec. 8.5.2.3 Layer Normalization
      references_replace: true
  "quiz-108/q3":
    topic: training
    difficulty: easy
    fix:
      question: We choose Stochastic Gradient Descent (SGD) in deep learning because classical gradient descent can be ____
      explanation: |
        The course notes that classical gradient descent can be too slow, so deep learning uses SGD,
        which applies gradient descent to randomly chosen minibatches [^1]. Full-batch gradient descent
        has to go through the whole training set for every single update, so each step costs
        $\mathcal{O}(n)$ and grows with the dataset [^2]. A stochastic gradient costs $\mathcal{O}(1)$
        per example and is still correct on average (an unbiased estimate of the full gradient) [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#optimizers--training-algorithms
          locator: Deep Learning Training Tricks, Optimizers / Training Algorithms
        - source: d2l
          url: https://d2l.ai/chapter_optimization/sgd.html#stochastic-gradient-updates
          locator: Sec. 12.4.1 Stochastic Gradient Updates
      references_replace: true
  "quiz-208/q1":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        Dropout zeroes a random fraction of neurons (typically 10-50%) at each training step [^1]. The
        course presents it as a regularization technique against overfitting [^2], and d2l calls it
        standard dropout regularization [^3]. The injected noise stops the next layer from relying on
        any single unit, and dropout is normally turned off at test time, so it is not just another
        "training" step and has nothing to do with gradient boosting [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#dropout
          locator: Deep Learning Training Tricks, Dropout
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#how-to-prevent-overfitting
          locator: 'Lesson: Neural Network Frameworks, How to prevent overfitting'
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html#dropout-in-practice
          locator: Sec. 5.6 Dropout and Sec. 5.6.1 Dropout in Practice
      references_replace: true
  "quiz-208/q3":
    topic: training
    difficulty: medium
    fix:
      question: Why do deep networks use batch normalization even when their weights were initialized carefully?
      explanation: |
        Good initialization keeps values in a reasonable range at the start, but during training the
        weights can become arbitrarily big or small and drive the signals out of that range [^1].
        Batch normalization brings them back: it subtracts the mean and divides by the standard
        deviation computed over the current minibatch, as a layer placed after the weights and before
        the activation function, usually giving faster training and higher accuracy [^1]. It works
        together with initialization schemes such as Xavier and keeps the activation function [^1].
        Normalizing each example on its own, without the minibatch, is layer normalization [^2].
      options:
        - text: During training, weights can drift and push signals out of a good range; normalizing per minibatch brings them back
          correct: true
        - text: Careful initialization is only possible with batch normalization, because without it every weight must start at zero
        - text: It replaces the activation function, so the network no longer needs a nonlinearity
        - text: It normalizes each example on its own, so training no longer needs minibatches
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md#batch-normalization
          locator: Deep Learning Training Tricks, secs. Initial Weight Initialization and Batch Normalization
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#layer-normalization
          locator: Sec. 8.5.2.3 Layer Normalization
      references_replace: true
  "quiz-109/q3":
    difficulty: easy
    fix:
      explanation: |
        VAE stands for variational autoencoder: an autoencoder whose encoder predicts a
        distribution over the latent vector, from which the decoder's input is sampled [^1]. The
        "variational" part comes from variational inference. Kingma and Welling fit an approximate
        posterior (the encoder, or recognition model) by optimizing a variational lower bound on
        the data likelihood [^2]. The other two options are made-up expansions.
      options:
        1: Variational autoencoder
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#variational-autoencoders-vae
          locator: Lesson 9 "Autoencoders", section "Variational Autoencoders (VAE)"
        - title: Kingma & Welling (2013), Auto-Encoding Variational Bayes
          url: https://arxiv.org/abs/1312.6114
          locator: Abstract; Sec. 2.2 The variational bound
      references_replace: true
  "quiz-110/q1":
    difficulty: easy
    fix:
      question: In a generative adversarial network (GAN), what does the generator take as input and what does it produce?
      explanation: |
        The generator takes a random vector and turns it into a generated sample, e.g. an image; it
        works like a reversed classifier, starting from a latent vector and upsampling it, much like
        the decoder of an autoencoder [^1]. Taking an image and saying whether it is real or generated
        is the discriminator's job [^1], and compressing an image into a latent vector is what an
        encoder does. The generator outputs data, not labels.
      options:
        - text: A random latent vector; a synthetic sample, such as an image
          correct: true
        - text: An image; the probability that the image is real
        - text: An image; a compressed latent vector describing it
        - text: A random latent vector; the class label of that vector
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md
          locator: 'Lesson: Generative Adversarial Networks, introduction and secs. Discriminator and Generator'
      references_replace: true
  "quiz-210/q1":
    difficulty: medium
    fix:
      type: single
      question: Deep convolutional GANs (DCGANs) add batch normalization to the generator and the discriminator. What does it do for GAN training?
      explanation: |
        DCGAN uses batch normalization in both networks: normalizing the input of each unit to zero mean
        and unit variance stabilizes learning, eases poor initialization and helps gradients flow, and
        it was critical for deep generators to start learning without collapsing all samples to a
        single point [^1]. Applying it to every layer caused oscillation and instability, so DCGAN
        leaves out the generator's output layer and the discriminator's input layer [^1]. Even with it,
        GAN losses do not go steadily down but oscillate as the two networks compete, and the generator
        is always trained through the discriminator's judgement [^2].
      options:
        - text: It normalizes each unit's input, which stabilizes learning and helps deep generators avoid collapsing to one output
          correct: true
        - text: It works best when applied to every layer, including the generator's output layer and the discriminator's input layer
        - text: It makes the generator and discriminator losses both decrease steadily to zero
        - text: It lets the generator be trained without a discriminator
      references:
        - title: Unsupervised Representation Learning with Deep Convolutional Generative Adversarial Networks (Radford, Metz & Chintala, 2015)
          url: https://arxiv.org/abs/1511.06434
          locator: Sec. 3 Approach and Model Architecture
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#training-the-gan
          locator: 'Lesson: Generative Adversarial Networks, sec. Training the GAN'
      references_replace: true
  "quiz-111/q1":
    difficulty: medium
    fix:
      type: single
      question: |
        A naive object detector cuts an image into tiles and runs an image classifier on each tile.
        Why do real object detectors also need a regression output?
      explanation: |
        The tile approach (split the image, classify each tile, keep tiles with high activation) finds
        the object's bounding box only very imprecisely [^1]. For a precise location the detector has to
        predict the coordinates of the box, which is a regression task and needs datasets labelled with
        boxes, such as PASCAL VOC or COCO [^1]. YOLO, for example, frames detection as regression from
        the image to box coordinates and class probabilities [^2]. The class itself is still predicted by
        classification.
      options:
        - text: Tiles locate an object only roughly; precise bounding-box coordinates must be predicted by regression
          correct: true
        - text: The class label of each detected object is a continuous number, so it must also be predicted by regression
        - text: Image classifiers cannot process an image that is larger than a single tile of the grid
        - text: A regression output removes the need for images labelled with the objects they contain
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#a-naive-approach-to-object-detection
          locator: 'Lesson: Object Detection, secs. A Naive Approach to Object Detection and Datasets for Object Detection'
        - title: 'You Only Look Once: Unified, Real-Time Object Detection (Redmon et al., 2016)'
          url: https://arxiv.org/abs/1506.02640
          locator: Sec. 2 Unified Detection, Figure 2
      references_replace: true
  "quiz-111/q3":
    difficulty: easy
    fix:
      type: short_answer
      question: |
        YOLO divides an image into an $S \times S$ grid, and every grid cell predicts $B$ bounding boxes,
        each with a confidence score. With $S = 7$ and $B = 2$, how many bounding boxes does the
        network predict for one image, before low-confidence boxes are discarded?
      explanation: |
        YOLO splits the image into $S \times S$ regions, and for each region a CNN predicts several
        possible objects with bounding-box coordinates and a confidence [^1]. On PASCAL VOC it uses
        $S = 7$ and $B = 2$, so it predicts $7 \times 7 \times 2 = 98$ boxes per image in a single pass
        [^2]. The number of objects actually reported varies from image to image: boxes with low
        confidence are dropped, and non-maximal suppression removes duplicates of the same object [^2].
      options: []
      answer:
        numeric: 98
        tolerance: 0
        model: $7 \times 7 \times 2 = 98$
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#yolo---you-only-look-once
          locator: 'Lesson: Object Detection, sec. YOLO - You Only Look Once'
        - title: 'You Only Look Once: Unified, Real-Time Object Detection (Redmon et al., 2016)'
          url: https://arxiv.org/abs/1506.02640
          locator: Sec. 2 Unified Detection and Sec. 2.3 Inference
      references_replace: true
  "quiz-112/q1":
    difficulty: easy
    fix:
      question: |
        A photo shows three sheep on a meadow. Which task labels every pixel and also tells the three
        sheep apart as separate objects, instead of giving all sheep pixels one "sheep" class?
      explanation: |
        Segmentation classifies every pixel. Semantic segmentation only gives each pixel its class and
        does not separate objects of the same class, so all sheep get one label; instance segmentation
        also divides a class into its individual instances [^1]. Object detection locates objects with
        bounding boxes rather than pixel masks [^1], and image classification gives one label for the
        whole image.
      options:
        - text: Instance segmentation
          correct: true
        - text: Semantic segmentation
        - text: Object detection with bounding boxes
        - text: Image classification
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
          locator: 'Lesson: Segmentation, introduction'
      references_replace: true
  "quiz-112/q2":
    difficulty: medium
    fix:
      question: A segmentation network outputs, for every pixel, scores for each class. Which loss is normally used to train it?
      explanation: |
        Segmentation is pixel classification: each pixel of the target mask holds a class number,
        one-hot encoded along the channel dimension, so a classification loss is used, cross-entropy
        averaged over all pixels, or binary cross-entropy when the mask is binary [^1]. Mean squared
        error is what a classical autoencoder uses to compare two images [^1]. IoU compares bounding
        boxes in object detection [^2], and one label for the whole image would be image
        classification.
      options:
        - text: Cross-entropy averaged over all pixels (binary cross-entropy for a two-class mask)
          correct: true
        - text: Mean squared error between the predicted mask image and the target mask image, pixel by pixel
        - text: Intersection over Union between predicted and true bounding boxes
        - text: The 0-1 loss of the single most likely class for the whole image
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
          locator: 'Lesson: Segmentation, introduction (loss function)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#intersection-over-union
          locator: 'Lesson: Object Detection, sec. Intersection over Union'
      references_replace: true
  "quiz-212/q3":
    difficulty: medium
    fix:
      question: |
        SegNet is a plain encoder-decoder for segmentation: its encoder's pooling layers reduce the
        spatial resolution, so its decoder cannot restore pixel positions accurately. What does U-Net
        add to fix this?
      explanation: |
        SegNet uses convolutions and pooling in the encoder and convolutions with upsampling in the
        decoder; the pyramid encoder reduces the spatial accuracy of the features, so the decoder cannot
        reconstruct pixel positions correctly [^1]. U-Net adds skip connections between encoder and
        decoder layers at each level, so the decoder does not lose the information from the original
        input at that level [^1]. Batch normalization is already part of SegNet, where it lets the
        multi-layer network train [^1]. A segmentation mask has the input's size, so the decoder
        upsamples rather than pooling further, and bounding boxes belong to object detection [^2].
      options:
        - text: Skip connections that pass the encoder's feature maps at each level to the decoder at the same level
          correct: true
        - text: Batch normalization after each convolution, so that the deep encoder-decoder network can be trained at all
        - text: A fully connected head that predicts a bounding box for each object
        - text: More pooling layers in the decoder, so the mask is produced at a lower resolution
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/SemanticSegmentationPytorch.ipynb
          locator: Semantic Segmentation (PyTorch notebook), secs. SegNet and U-Net
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md
          locator: 'Lesson: Segmentation, introduction'
      references_replace: true
  "quiz-113/q1":
    difficulty: easy
    fix:
      type: short_answer
      question: |
        A bag-of-words model uses the vocabulary `and`, `cat`, `dog`, `mat`, `the`, with each word
        mapped, in this order, to one position of a 5-dimensional vector. What is the bag-of-words
        vector of the text "the cat and the dog"?
      explanation: |
        Each vocabulary word owns one position of the vector, and its one-hot encoding has a 1 there.
        Adding the one-hot vectors of all words in a text gives a vector of word frequencies, the bag of
        words [^1]. In "the cat and the dog", *and*, *cat* and *dog* occur once, *mat* never and *the*
        twice, so the vector is $(1, 1, 1, 0, 2)$. Word order is lost: "the dog and the cat" gives the
        same vector [^1].
      options: []
      answer:
        accept:
          - (1, 1, 1, 0, 2)
        pattern: '[(\[]?\s*1\s*[,;\s]\s*1\s*[,;\s]\s*1\s*[,;\s]\s*0\s*[,;\s]\s*2\s*[)\]]?'
        hint: Five counts in vocabulary order, e.g. (0, 2, 0, 1, 0)
        model: '$(1, 1, 1, 0, 2)$: and, cat and dog once each, mat never, the twice'
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#bag-of-words-and-tfidf
          locator: 'Lesson: Representing Text as Tensors, sec. Bag-of-Words and TF/IDF'
      references_replace: true
  "quiz-113/q2":
    difficulty: medium
    fix:
      question: Which statement correctly compares word-level with character-level text representation?
      explanation: |
        Character-level representation treats each character as a number, so the word *Hello* becomes a
        $5 \times C$ one-hot tensor for an alphabet of $C$ characters [^1]. Word-level representation
        builds a vocabulary of all words and one-hot encodes them; it is somewhat better because a single
        letter means little on its own while words are higher-level semantic units, but the large
        dictionary gives high-dimensional sparse tensors [^1]. Either way the tokens are mapped to
        numbers through a vocabulary and then one-hot encoded [^1], so the tensor sizes differ: one
        column per character versus one per word, with very different vector lengths.
      options:
        - text: Words carry more meaning than characters, but the large vocabulary makes one-hot word vectors high-dimensional and sparse
          correct: true
        - text: Single characters carry more meaning than whole words, so character-level models are easier for a network to learn from
        - text: Both give tensors of the same size, because a word is just a short sequence of characters
        - text: Only character-level text can be one-hot encoded; words have to be fed to the network as strings
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#representing-text
          locator: 'Lesson: Representing Text as Tensors, sec. Representing text'
      references_replace: true
  "quiz-114/q3":
    difficulty: easy
    fix:
      type: single
      question: An *embedding bag* classifier turns a text of any length into one fixed-size vector before the classifier layer. How?
      explanation: |
        With an embedding layer as the first layer, a bag-of-words classifier becomes an embedding-bag
        model: each word is converted to its embedding and an aggregate function, such as sum, average or
        max, is computed over all of them [^1]. PyTorch's `nn.EmbeddingBag` does this in one module; with
        `mode="mean"` it equals an `Embedding` followed by a mean over the words [^2]. Concatenating
        vectors would give a length that depends on the text, and counting words is the plain
        bag-of-words representation with vocabulary-sized vectors [^1].
      options:
        - text: It looks up the embedding of every word and combines them with an aggregate such as sum, mean or max
          correct: true
        - text: It concatenates the one-hot vectors of all the words into one long vector
        - text: It counts how often each vocabulary word occurs in the text, giving a vector as long as the whole vocabulary
        - text: It keeps only the embedding of the text's first word and ignores the rest
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md
          locator: 'Lesson: Embeddings, introduction'
        - title: PyTorch documentation
          url: https://docs.pytorch.org/docs/stable/generated/torch.nn.EmbeddingBag.html
          locator: torch.nn.EmbeddingBag
      references_replace: true
  "quiz-214/q3":                        # an embedding layer takes token ids, not words
    difficulty: easy
    fix:
      question: What does an embedding layer (for example PyTorch's `nn.Embedding`) take as input?
      explanation: |
        An embedding layer is similar to a linear layer, but instead of a one-hot encoded vector it takes
        the word's number in the vocabulary, which avoids building large one-hot vectors [^1]. In PyTorch,
        `nn.Embedding` is a lookup table whose input is an `IntTensor` or `LongTensor` of indices; it
        returns the stored embedding for each index [^2]. Strings must be tokenized and mapped to indices
        first, and pre-trained Word2Vec vectors can replace the embedding layer's weights rather than
        being its input [^1].
      options:
        - text: The integer index of each token in the vocabulary
          correct: true
        - text: The token as a string of characters
        - text: A one-hot vector as long as the vocabulary, like a linear layer
        - text: A pre-trained Word2Vec vector of each word
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md
          locator: 'Lesson: Embeddings, introduction and sec. Semantic Embeddings: Word2Vec'
        - title: PyTorch documentation
          url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Embedding.html
          locator: torch.nn.Embedding
      references_replace: true
  "quiz-115/q1":                        # Word2Vec presented as a language model
    difficulty: medium
    fix:
      question: Which of these is trained with a language-modelling objective, predicting words from their context in unlabelled text?
      explanation: |
        Language models are trained on unlabelled text in a self-supervised way, for example by
        predicting missing words [^1]. Word2Vec's continuous bag-of-words (CBoW) predicts the middle
        token from the tokens around it, which is why semantic embeddings such as Word2Vec are called a
        first step towards language modelling [^1]. A topic or sentiment classifier learns from labelled
        examples instead, and an embedding layer trained inside such a classifier only learns what helps
        that task, which is why semantic embeddings are pre-trained on large text collections in a
        special way [^2]. TF-IDF only reweights word counts without learning to predict anything [^3].
      options:
        - text: Word2Vec's CBoW model, which predicts the middle word from its neighbours
          correct: true
        - text: An RNN that sorts news articles into topics from labelled examples
        - text: A TF-IDF vectorizer that weighs word counts by document frequency
        - text: An embedding layer trained as part of a sentiment classifier
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
          locator: 'Lesson: Language Modeling, introduction and sec. Training Embeddings'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md
          locator: 'Lesson: Embeddings, introduction'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#bag-of-words-and-tfidf
          locator: 'Lesson: Representing Text as Tensors, sec. Bag-of-Words and TF/IDF'
      references_replace: true
  "quiz-215/q1":
    topic: text-representation
    difficulty: easy
    fix:
      explanation: |
        CBoW (continuous bag-of-words) predicts the middle word $W_0$ from the words around it,
        $W_{-N}, \dots, W_{-1}, W_1, \dots, W_N$ [^1][^2]. Skip-gram does the opposite and predicts the
        neighbouring words from the middle word [^1][^2]. An n-gram language model predicts a token from
        the $N$ previous tokens only, not from neighbours on both sides [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md#training-embeddings
          locator: 'Lesson: Language Modeling, sec. Training Embeddings'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-pretraining/word2vec.html#the-continuous-bag-of-words-cbow-model
          locator: Sec. 15.1.3 The Skip-Gram Model and 15.1.4 The Continuous Bag of Words (CBOW) Model
      references_replace: true
  "quiz-215/q2":
    topic: text-representation
    difficulty: medium
    fix:
      explanation: |
        CBoW is a means, not the end product: the network is trained to predict a word from its
        neighbours, and the embedding layer it learns along the way is the Word2Vec embedding [^1][^2].
        After training you keep that layer's vectors, in which similar words lie close together [^1].
        The output layer only scores which single word fits a given context, so the trained model is
        neither a text generator nor a document classifier [^1]; d2l likewise notes that the CBOW
        model's word vectors are what is used as the word representations [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/CBoW-TF.ipynb
          locator: Notebook CBoW-TF.ipynb (Language Modeling lesson), secs. CBoW Model and Trying out Word2Vec
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md#training-embeddings
          locator: 'Lesson: Language Modeling, sec. Training Embeddings'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-pretraining/word2vec.html#the-continuous-bag-of-words-cbow-model
          locator: Sec. 15.1.4.1 Training (CBOW)
      references_replace: true
  "quiz-215/q3":
    topic: text-representation
    difficulty: medium
    fix:
      explanation: |
        The CBoW network is a simple dense (fully connected) model: an embedding layer maps the input
        word to a vector, and a dense layer with one neuron per vocabulary word predicts the target word
        [^1]. The original word2vec paper describes CBOW as a feedforward neural-network language model
        with the non-linear hidden layer removed and the context word vectors averaged, i.e. a log-linear
        classifier [^2]. There are no convolutions and no recurrent connections; word order in the
        context is ignored, which is why it is called a bag of words [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/CBoW-TF.ipynb
          locator: Notebook CBoW-TF.ipynb (Language Modeling lesson), sec. CBoW Model
        - title: Mikolov et al., Efficient Estimation of Word Representations in Vector Space (2013)
          url: https://arxiv.org/abs/1301.3781
          locator: Sec. 3.1 Continuous Bag-of-Words Model
      references_replace: true
  "quiz-116/q3":
    difficulty: medium
    fix:
      question: Why does a plain (vanilla) RNN struggle to learn dependencies between tokens that are far apart in a long sequence?
      explanation: |
        An RNN is trained end-to-end through all its steps, so the error has to travel back through every
        step; it has difficulty reaching the first ones, and the network cannot learn relations between
        distant tokens. This is the vanishing-gradient problem, which gated cells such as LSTM and GRU
        were designed to avoid [^1]. Backpropagation through time multiplies long chains of the same
        matrices, and high powers of a matrix make the gradient vanish or explode [^2]. All RNN steps share
        the same weights and process the tokens one after another, so neither the parameter count nor
        parallel processing is the issue, and sequence length is not limited by the hidden size [^1].
      options:
        - text: Backpropagating through many time steps multiplies many factors, so the gradient vanishes before reaching early tokens
          correct: true
        - text: Every time step has its own separate weight matrices, so a long sequence ends up with far too many parameters to train
        - text: It can only read sequences that are shorter than the size of its hidden state
        - text: It processes all time steps in parallel, so it cannot tell which token came first
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#long-short-term-memory-lstm
          locator: 'Lesson: Recurrent Neural Networks, introduction and sec. Long Short Term Memory (LSTM)'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html
          locator: Sec. 9.7 Backpropagation Through Time (9.7.2 and Summary)
      references_replace: true
  "quiz-216/q2":
    difficulty: medium
    fix:
      question: When does a bidirectional RNN make sense?
      explanation: |
        When we have random access to the whole input sequence, it can make sense to run the recurrent
        computation in both directions; a bidirectional network then needs two hidden state vectors, one
        per direction [^1]. Each time step's hidden state is determined by the data both before and after
        it, which suits encoding a sequence, e.g. tagging parts of speech [^2]. Next-token prediction may
        only use the leftward context, so a bidirectional RNN cannot generate text [^2]. Its long gradient
        chains make it costly to train rather than curing vanishing gradients [^2].
      options:
        - text: When the whole sequence is available up front, so each position can use context on both sides
          correct: true
        - text: When generating text token by token, so the model can look at the words it has not generated yet
        - text: When memory is short, because both directions share one hidden state and halve the parameters
        - text: When sequences are long, because running backwards removes the vanishing-gradient problem
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#bidirectional-and-multilayer-rnns
          locator: 'Lesson: Recurrent Neural Networks, sec. Bidirectional and Multilayer RNNs'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-modern/bi-rnn.html
          locator: Sec. 10.4 Bidirectional Recurrent Neural Networks (introduction and Summary)
      references_replace: true
  "quiz-117/q1":
    difficulty: easy
    fix:
      question: Which recurrent-network pattern fits image captioning, where a single picture has to be turned into a sentence?
      explanation: |
        One-to-many is the generative pattern: one input value produces a sequence of outputs. For image
        captioning, the picture goes through a CNN to obtain a hidden state, and a recurrent chain then
        generates the caption word by word [^1]. Many-to-one reads a sequence and outputs one value, as in
        text classification; many-to-many (sequence-to-sequence) maps a sequence to a sequence, as in
        machine translation; one-to-one is an ordinary network with one input and one output [^1].
      options:
        - text: One-to-many
          correct: true
        - text: Many-to-one
        - text: Many-to-many (sequence-to-sequence)
        - text: One-to-one
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
          locator: 'Lesson: Generative networks, introduction (RNN patterns)'
      references_replace: true
  "quiz-217/q1":
    difficulty: medium
    fix:
      question: In a character-level generative RNN, an output layer is applied to the hidden state at every step. What does it produce?
      explanation: |
        A generative RNN is trained to produce, for each input character, the next character, and the
        output of each step is a probability distribution over the characters [^1]. Generation then picks
        or samples the next character from that distribution, possibly with a temperature, and feeds it
        back in [^1]. The hidden state is passed along separately through the recurrent connection [^1],
        embeddings belong to the input side, and predicting a character index as a number by regression
        would impose a meaningless order on the characters.
      options:
        - text: A score for every character in the vocabulary, giving a probability distribution over the next one
          correct: true
        - text: The next hidden state, which replaces the recurrent connection
        - text: An embedding of the character that was just read
        - text: A single number, the index of the next character in the vocabulary, predicted directly by regression
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md#soft-text-generation-and-temperature
          locator: 'Lesson: Generative networks, introduction and sec. Soft text generation and temperature'
      references_replace: true
  "quiz-118/q1":
    difficulty: easy
    fix:
      question: Attention mechanism provides a means of _____ the impact of an input vector on an output prediction of an RNN
      explanation: |
        Attention lets the decoder use all encoder hidden states $h_i$ when producing output $y_t$, each
        with its own weight $\alpha_{t,i}$, so it weights how much each input vector influences each
        output prediction [^1]. In Bahdanau attention the context vector is exactly such a weighted sum,
        $c_{t'} = \sum_t \alpha(s_{t'-1}, h_t)\, h_t$ [^2]. Training and testing are stages of building
        a model, not something attention does.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md
          locator: 'Lesson: Attention Mechanisms and Transformers (introduction)'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/bahdanau-attention.html#model
          locator: Sec. 11.4.1 Model (Bahdanau Attention), Eq. (11.4.1)
      references_replace: true
  "quiz-118/q3":
    difficulty: medium
    fix:
      type: single
      question: Why does a transformer need positional encoding, while an RNN does not?
      explanation: |
        In an RNN the relative position of tokens is given by the number of steps, so it need not be
        represented explicitly; once we switch to attention, the positions must be supplied [^1]. Self-
        attention trades sequential processing for parallel computation and by itself does not preserve
        the order of the sequence, so positional encodings are added as an extra input for each token
        [^2]. They are added to the token embeddings, not used instead of them [^1][^2], and the
        transformer stays non-recurrent, which is why it parallelizes better [^1].
      options:
        - text: Self-attention handles all tokens in parallel and ignores order; an RNN gets order from its steps
          correct: true
        - text: Self-attention cannot handle sequences longer than the embedding size unless positions are encoded
        - text: Positional encoding replaces the token embeddings, which a transformer does not use at all
        - text: It adds the recurrent connection between time steps that a transformer would otherwise lack
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#positional-encodingembedding
          locator: 'Lesson: Attention Mechanisms and Transformers, sec. Positional Encoding/Embedding'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
          locator: Sec. 11.6.3 Positional Encoding
      references_replace: true
  "quiz-218/q1":
    difficulty: medium
    fix:
      question: In a transformer with *trainable* positional embeddings, how is the input vector of each token built?
      explanation: |
        The sequence of tokens is paired with the sequence of their positions $0, 1, \dots$. With trainable
        positional embedding, embedding layers are applied to both tokens and positions, giving vectors of
        the same dimension that are then added, so the result embeds both the token and its position [^1].
        The original transformer uses a fixed sine/cosine encoding instead, but it is added to the token
        embeddings in the same way, $\mathbf{X} + \mathbf{P}$ [^2]. A single extra number or a scaling by
        the index would give the position little room to be represented.
      options:
        - text: Token and position each get an embedding of the same size, and the two vectors are added
          correct: true
        - text: The position number is appended to the token embedding as one extra dimension at the end of the vector
        - text: The token embedding is multiplied by the token's position index
        - text: Only the position is embedded; the token itself stays one-hot encoded
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#positional-encodingembedding
          locator: 'Lesson: Attention Mechanisms and Transformers, sec. Positional Encoding/Embedding'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/self-attention-and-positional-encoding.html#positional-encoding
          locator: Sec. 11.6.3 Positional Encoding
      references_replace: true
  "quiz-218/q3":
    difficulty: medium
    fix:
      question: In an encoder-decoder transformer for machine translation, which attention lets the decoder use the encoded source sentence?
      explanation: |
        Transformers use attention in two ways: self-attention captures patterns within one text, and the
        attention layer between encoder and decoder performs the translation, much like attention in RNN
        encoder-decoders [^1]. In this encoder-decoder attention the queries come from the decoder's
        self-attention sublayer and the keys and values from the encoder outputs [^2]. Encoder
        self-attention only looks at the source, and the decoder's masked self-attention only at the
        output tokens generated so far [^2]. Squeezing the source into one final state is the RNN approach
        whose weaknesses attention was introduced to fix [^1].
      options:
        - text: 'Encoder-decoder attention: queries come from the decoder, keys and values from the encoder outputs'
          correct: true
        - text: Self-attention inside the encoder, applied to the source tokens
        - text: Masked self-attention inside the decoder, applied to the tokens generated so far
        - text: 'None: the encoder hands over only its final hidden state, exactly as in an RNN encoder-decoder without attention'
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#encoder-decoder-attention
          locator: 'Lesson: Attention Mechanisms and Transformers, introduction and sec. Encoder-Decoder Attention'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html#model
          locator: Sec. 11.7.1 Model (Transformer decoder)
      references_replace: true
  "quiz-120/q2":
    difficulty: easy
    fix:
      question: How can a generative pre-trained transformer such as GPT perform a task like sentiment classification without any task-specific training?
      explanation: |
        Large language models such as GPT can solve many tasks without domain-specific training, because
        many tasks can be modelled as text generation: the model gives the conditional probability of the
        next word given the previous ones [^1]. Prompts are the inputs that instruct the model, and prompt
        engineering chooses wording and format to elicit the desired output [^1]. Training a new
        classification head on labelled data is fine-tuning, which needs a task-specific dataset [^2], and
        GPT is pre-trained on next-word prediction, not as a classifier [^1].
      options:
        - text: The task is written as text to continue, e.g. a prompt ending in "Sentiment:", and the model generates the answer
          correct: true
        - text: A new classification layer must first be trained on labelled reviews, since GPT itself can only generate free text
        - text: GPT outputs class probabilities directly, because it was pre-trained as a sentiment classifier
        - text: It cannot; a generative model can only continue text and never solves other tasks
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
          locator: 'Lesson: Pre-Trained Large Language Models, secs. Text Generation and Perplexity and Prompt Engineering'
        - title: Language Models are Few-Shot Learners (Brown et al., 2020)
          url: https://arxiv.org/abs/2005.14165
          locator: Sec. 2 Approach (Fine-Tuning, Few-Shot, One-Shot, Zero-Shot)
      references_replace: true
  "quiz-220/q1":
    difficulty: easy
    fix:
      question: For a large language model, what is *zero-shot* learning?
      explanation: |
        In zero-shot use, no demonstrations are allowed: the model receives only a natural-language
        instruction describing the task and answers with forward passes, without weight updates [^1].
        Putting a few solved examples in the prompt is few-shot (one example is one-shot), and updating
        the weights on a labelled task dataset is fine-tuning [^1]. GPT models can solve many tasks in
        this way without any domain-specific training [^2].
      options:
        - text: It gets only a natural-language description of the task, with no examples and no weight updates
          correct: true
        - text: The prompt contains a few solved examples of the task, followed by the new input that the model must answer
        - text: The model's weights are fine-tuned on a small labelled dataset for the task
        - text: The model is trained from scratch for a single epoch on the task's data
      references:
        - title: Language Models are Few-Shot Learners (Brown et al., 2020)
          url: https://arxiv.org/abs/2005.14165
          locator: Sec. 2 Approach (Fine-Tuning, Few-Shot, One-Shot, Zero-Shot)
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
          locator: 'Lesson: Pre-Trained Large Language Models, introduction'
      references_replace: true
  "quiz-220/q3":
    topic: language-models
    difficulty: easy
    fix:
      question: Which metric scores a language model by the probability it assigns to held-out text?
      explanation: |
        Perplexity measures how well a model predicts held-out text. It is the inverse probability of
        the test set normalised by its length, $\mathrm{PPL}(W) = P(w_1,\dots,w_N)^{-1/N}$, so lower is
        better [^1][^2]. Equivalently it is the exponential of the average per-token cross-entropy: a
        perfect model scores 1, and one that predicts a uniform distribution scores the vocabulary size
        [^3]. It is an intrinsic metric that needs no task-specific dataset [^1][^2], whereas accuracy
        and recall evaluate a classifier by comparing its outputs with human gold labels [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#text-generation-and-perplexity
          locator: 'Lesson: Pre-Trained Large Language Models, sec. Text Generation and Perplexity'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 3 N-gram Language Models
          url: https://web.stanford.edu/~jurafsky/slp3/3.pdf
          locator: 'Sec. 3.3 Evaluating Language Models: Perplexity, Eq. 3.14'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#perplexity
          locator: Sec. 9.3.2 Perplexity, Eqs. 9.3.7-9.3.8
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 4 Logistic Regression and Text Classification
          url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
          locator: 'Sec. 4.9 Evaluation: Precision, Recall, F-measure (Fig. 4.7)'
      references_replace: true
  "quiz-221/q1":
    difficulty: easy
    fix:
      question: What makes a problem a good fit for a genetic algorithm?
      explanation: |
        To apply a genetic algorithm you need a way to code solutions as genes, a fitness function that
        scores them, and crossover and mutation operations; the population then evolves towards better
        solutions [^1]. Typical tasks are therefore optimisation and search problems such as schedule
        optimisation, optimal packing, optimal cutting and speeding up exhaustive search [^1]. Learning
        from labelled examples is supervised learning, and when an exact efficient algorithm or a closed
        formula exists there is nothing to gain from an evolutionary search.
      shuffle: true
      options:
        - text: Candidate solutions can be coded as genes and scored by a fitness function, e.g. scheduling
          correct: true
        - text: A dataset of inputs labelled with the correct outputs is available, as in image classification
        - text: An exact algorithm that runs in polynomial time is already known, as for sorting a list
        - text: The answer can be read straight from a formula, so no search over candidates is needed
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md#typical-tasks
          locator: 'Lesson: Genetic Algorithms, introduction and sec. Typical Tasks'
      references_replace: true
  "quiz-221/q2":
    difficulty: easy
    fix:
      type: single
      question: Once solutions are encoded as genes and a fitness function is defined, what is the first step of a genetic algorithm's main loop?
      explanation: |
        The algorithm first selects an initial population $G \subset \Gamma$ of genes. Only then does it
        repeat its step: randomly choose crossover or mutation, where crossover picks two genes of the
        population and mutation replaces one gene by a mutated copy, until the fitness is small enough or
        a step limit is reached [^1]. Choosing two genes therefore happens inside the loop, after the
        population exists. Genetic algorithms do not use gradients; they improve solutions by selection
        with the fitness function [^1].
      options:
        - text: Create an initial population of candidate solutions
          correct: true
        - text: Pick two genes at random and cross them over
        - text: Mutate every gene of the population once
        - text: Compute the gradient of the fitness function
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
          locator: 'Lesson: Genetic Algorithms, introduction (overall structure)'
      references_replace: true
  "quiz-221/q3":                        # crossover selects two parents, not two genes
    difficulty: easy
    fix:
      question: In a genetic algorithm, how do crossover and mutation differ?
      explanation: |
        Crossover is a map $\Gamma^2 \to \Gamma$ that combines two genes (solutions) into a new valid
        solution, while mutation $\Gamma \to \Gamma$ changes one gene; mutations destabilize the
        optimisation and help it leave a local minimum [^1]. Scoring solutions is the job of the fitness
        function, and keeping the better ones is selection [^1]. In the lesson's loop, a crossover child
        replaces a parent only if it has a better (smaller) fitness value [^1].
      options:
        - text: Crossover merges two parents into a new solution; mutation randomly alters one solution to escape local minima
          correct: true
        - text: Crossover randomly alters a single solution to escape local minima; mutation merges two parent solutions into one
        - text: Crossover scores the solutions with the fitness function; mutation keeps only the best ones
        - text: Both combine two solutions, but mutation always keeps the child even when it is worse
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
          locator: 'Lesson: Genetic Algorithms, introduction'
      references_replace: true
  "quiz-122/q1":
    difficulty: easy
    fix:
      question: Instead of a labelled dataset, what does reinforcement learning need in order to train an agent?
      explanation: |
        Supervised learning relies on a dataset with known outcomes, while RL learns by doing [^1]. It
        needs an environment or simulator that sets the rules and lets us run experiments and observe the
        results, and a reward function that says how successful an experiment was, e.g. the final score of
        a game [^1]. RL is not told the correct action for each state; often it only learns whether it won
        at the end of the game [^1], so labelled states, clusters and per-move accuracy do not fit.
      options:
        - text: An environment, often a simulator, to act in and a reward function that scores the outcome
          correct: true
        - text: A dataset of game states, each labelled by an expert with the correct action to take in it
        - text: A large unlabelled dataset whose examples are grouped into clusters
        - text: A fixed test set on which accuracy is measured after every move
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md
          locator: 'Lesson: Deep Reinforcement Learning, introduction'
      references_replace: true
  "quiz-222/q3":                        # the critic estimates a value function, not the reward
    topic: policy-gradient
    difficulty: medium
    fix:
      question: |
        In an actor-critic agent, the critic estimates the total reward that can be expected from the
        current state. How is the critic trained?
      explanation: |
        Actor-critic trains a network to return two things: the policy, i.e. which action to take (the
        actor), and an estimate of the total reward expected from the current state (the critic) [^1].
        Because the real cumulative rewards are known from the experiment, the critic loss is the
        difference between them and the critic's estimates; the actor loss is computed as in the policy
        gradient algorithm [^1]. The critic is a learned value function, not the environment's reward
        function, and both parts are updated during training [^2].
      options:
        - text: By minimising the difference between its estimates and the cumulative rewards actually observed
          correct: true
        - text: By copying the action probabilities that the actor outputs
        - text: By making the action that the actor took more likely, as in policy gradients
        - text: It is not trained; it is the fixed reward function that the environment provides
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#actor-critic-algorithm
          locator: 'Lesson: Deep Reinforcement Learning, sec. Actor-Critic Algorithm'
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic
          locator: 'Unit 6: Advantage Actor-Critic (A2C), sec. Reducing variance with Actor-Critic methods'
      references_replace: true
  "quiz-123/q1":
    difficulty: easy
    fix:
      type: single
      question: |
        In a flocking simulation, each bird only sees its near neighbours and follows three rules:
        alignment, cohesion and separation. What does the realistic flock that appears show about
        multi-agent systems?
      explanation: |
        The emergent (synergetic) approach rests on the idea that the combined behaviour of many simple
        agents can produce more complex behaviour of the system as a whole [^1]. In flocking, each bird
        only observes birds within a short distance and steers by alignment, cohesion and separation, yet
        the flock moves as if it followed a collective algorithm [^1]. No bird leads or plans: these are
        reactive agents, whereas deliberative agents reason and plan their actions [^1].
      options:
        - text: Complex group behaviour can emerge from simple agents following local rules, with no central controller
          correct: true
        - text: A flock needs a leader bird that computes the path for all the others
        - text: Each bird must reason about and plan the movement of the whole flock, so the agents are deliberative ones
        - text: Simple agents can only ever produce simple, easily predictable system behaviour
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md#flocking
          locator: 'Lesson: Multi-Agent Systems, introduction and secs. Flocking and Deliberative Agents'
      references_replace: true
  "quiz-123/q2":
    drop: off-scope
    comment: which schools of philosophy (evolutionary cybernetics, emergentism) the 'metasystem transition' principle is attributed to; the emergence idea itself is kept as quiz-123/q1
  "quiz-123/q3":
    drop: off-scope
    comment: history trivia (the decade multi-agent systems appeared); no concept to rewrite it around
  "quiz-223/q3":
    difficulty: easy
    fix:
      type: multiple
      question: Which of these are typical applications of multi-agent systems? Select all that apply.
      explanation: |
        Multi-agent systems are used in games, where non-player characters act as intelligent agents; in
        video production, where crowd scenes are rendered by multi-agent simulation; in systems modelling,
        e.g. simulating the spread of COVID-19 or city traffic; and in automation, where each device acts
        as an independent agent [^1]. Solving linear equations and compressing an image are single,
        fixed computations with no interacting agents.
      shuffle: true
      options:
        - text: Controlling the non-player characters of a computer game
          correct: true
        - text: Rendering film scenes with large crowds
          correct: true
        - text: Simulating how a disease spreads through a population
          correct: true
        - text: Solving a system of linear equations exactly
        - text: Compressing a photo into a JPEG file
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
          locator: 'Lesson: Multi-Agent Systems, introduction (applications)'
      references_replace: true
  "quiz-124/q1":
    difficulty: easy
    fix:
      question: Why do we need principles of responsible AI, given that today's AI is essentially large-scale matrix arithmetic?
      explanation: |
        The AI in this course has no emotions or intentions; it is a powerful tool, and like any powerful
        tool it can be used for good or bad and can be misused [^1]. The principles of responsible AI exist
        to avoid accidental or deliberate misuse; for example, a model trained on biased data can prefer
        one group of people [^1]. Science-fiction rebellion assumes emotions that matrix arithmetic does
        not have, and models do make mistakes, which is why reliability and safety is itself a principle
        [^1].
      options:
        - text: It is a powerful tool that can be misused, by accident or on purpose, e.g. a biased model
          correct: true
        - text: AI systems may develop emotions and goals of their own and decide to rebel against the people who built them
        - text: AI models never make mistakes, so nobody can question or correct their decisions
        - text: Only because laws require it; a model trained on real data carries no risk
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md
          locator: 'Lesson: Ethical and Responsible AI, introduction and sec. Principles of Responsible AI'
      references_replace: true
  "quiz-124/q3":
    difficulty: easy
    fix:
      type: single
      question: |
        A model suggests medical diagnoses from scans. Like every model, it has some precision and recall
        and will sometimes be wrong. Which principle of responsible AI is about understanding such errors
        to prevent the harm that wrong advice can cause?
      explanation: |
        Reliability and safety starts from the fact that AI models make mistakes: a network returns
        probabilities, every model has some precision and recall, and we must take that into account to
        prevent harm from wrong advice [^1]. Inclusiveness is about augmenting people and handling
        under-represented communities, privacy and security about the data a model was trained on, and
        transparency about being clear that AI is used and preferring interpretable models [^1]. Using AI
        in medicine is not unethical in itself; using it without accounting for its errors would be.
      options:
        - text: Reliability and safety
          correct: true
        - text: Inclusiveness
        - text: Privacy and security
        - text: Transparency
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, sec. Principles of Responsible AI'
      references_replace: true
  "quiz-224/q2":
    difficulty: easy
    fix:
      question: |
        Which principle of responsible AI says that AI should augment people rather than replace them,
        and that under-represented communities must be included and handled correctly?
      explanation: |
        Inclusiveness means building AI to augment people and make their work more creative, not to
        replace them; it is linked to fairness because data about under-represented communities is
        likely to be biased, and those communities must be included and handled correctly [^1]. Fairness
        itself is about model bias caused by biased training data, accountability about who is
        responsible for AI decisions, and transparency about being clear that AI is used [^1].
      options:
        - text: Inclusiveness
          correct: true
        - text: Fairness
        - text: Accountability
        - text: Transparency
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, sec. Principles of Responsible AI'
      references_replace: true
  quiz-206/q1:
    difficulty: easy
    fix:
      question: Optical flow helps us understand how each pixel moves from one video frame to the next.
      explanation: |
        Optical flow measures the apparent motion between two consecutive video frames: for a pixel
        (or object point) it estimates a displacement vector, i.e. where that point moved to in the
        next frame [^2]. The lesson uses it in exactly this way, to detect motion by seeing how
        individual pixels move from frame to frame [^1]. Its uses include video stabilization,
        compression and real-time tracking [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#examples-of-using-computer-vision
          locator: Lesson 6 "Introduction to Computer Vision", section "Examples of using Computer Vision" (Detecting motion using Optical Flow)
        - title: Optical Flow in OpenCV (C++/Python), LearnOpenCV (M. Kuklin)
          url: https://learnopencv.com/optical-flow-in-opencv/
          locator: Sections "What is Optical Flow?" and "Optical Flow applications"
      references_replace: true
  quiz-206/q2:
    difficulty: easy
    fix:
      explanation: |
        Dense optical flow estimates a motion vector for every pixel, so its output is a full vector
        field over the frame [^1][^2]. Sparse optical flow instead tracks only a chosen set of
        distinctive points, such as corners found with the Shi–Tomasi detector and followed with
        Lucas–Kanade. It therefore says nothing about pixels outside that set [^2]. Frame
        differencing subtracts two consecutive frames: the difference shows how much each pixel
        changed, which is enough to detect that something moved, but it gives no direction of
        motion, so it is not a vector field [^1].
      options:
        2: Frame Differencing
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/06-IntroCV/README.md#examples-of-using-computer-vision
          locator: Lesson 6 "Introduction to Computer Vision", section "Examples of using Computer Vision" (Dense vs. Sparse Optical Flow)
        - title: Optical Flow in OpenCV (C++/Python), LearnOpenCV (M. Kuklin)
          url: https://learnopencv.com/optical-flow-in-opencv/
          locator: Sections "Sparse and Dense Optical Flow", "Sparse Optical Flow" and "Dense Optical Flow"
      references_replace: true
  quiz-107/q1:
    difficulty: easy
    fix:
      question: In a CNN, what slides over the image to extract local patterns such as edges?
      explanation: |
        Patterns are extracted with convolutional filters: a small kernel matrix slides over the
        image and, at each pixel, takes a weighted sum of the neighbourhood, so a vertical-edge or
        horizontal-edge kernel lights up where those edges are [^1]. In a CNN these kernels are not
        designed by hand but learned as the layer's weights [^1][^2]. Pooling also uses a sliding
        window, but it only aggregates each window and has no parameters [^3]. Dropout is a
        regularizer that zeroes random units during training [^4].
      options:
        1: pooling windows
        2: dropout masks
      why:
        1: A pooling window also slides over the input, but it only takes the maximum or the average of each window. It has no kernel weights, so it cannot respond to a particular pattern [^3].
        2: Dropout randomly zeroes units during training to regularize the network; it neither slides over the image nor detects patterns [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/README.md
          locator: 'Lesson: Convolutional Neural Networks (intro and "Main ideas behind CNN")'
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/why-conv.html#convolutions
          locator: Sec. 7.1.3 Convolutions
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
          locator: Sec. 7.5.1 Maximum Pooling and Average Pooling
          quote: the pooling layer contains no parameters (there is no kernel)
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
          locator: Sec. 5.6 Dropout
      references_replace: true
  quiz-107/q3:
    difficulty: easy
    fix:
      question: CNNs are mostly used for computer vision tasks.
      explanation: |
        CNNs are built to exploit the 2D grid structure of images, and CNN-based architectures are now
        everywhere in computer vision [^2]. The lesson adds that they are not limited to images: they
        are good at finding fixed-size patterns in general, so 1D CNNs are used on audio and 3D CNNs on
        video, but vision remains their main use [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md#review--self-study
          locator: 'Lesson: Convolutional Neural Networks, Well-Known CNN Architectures (Review & Self Study)'
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/index.html
          locator: Ch. 7 Convolutional Neural Networks (chapter introduction)
      references_replace: true
  quiz-207/q1:
    difficulty: easy
    fix:
      type: multiple
      question: Which of these layers can "scale down" (downsample) the height and width of an image or feature map?
      explanation: |
        Both pooling layers shrink the image: average pooling replaces each window (for example
        $2\times2$) by the mean of its values, and max pooling by the largest value, which signals
        whether a pattern is present in that window [^1]. Pooling has no learnable kernel; it just
        aggregates each window, which downsamples the feature map and makes it less sensitive to
        the exact position of features [^2]. Batch normalization and a stride-1 $1\times1$
        convolution keep the height and width unchanged [^3][^4].
      shuffle: true
      options:
        - text: Average pooling
          correct: true
        - text: Max pooling
          correct: true
        - text: Batch normalization
          why: It standardizes each value with minibatch statistics and then applies an elementwise scale and shift, so the output has the same shape as the input [^3].
        - text: A $1\times1$ convolution with stride 1
          why: Each output pixel depends only on the input pixel at the same position, so the height and width stay the same; only the number of channels can change [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/ConvNetsPyTorch.ipynb
          locator: 'Notebook: Convolutional Neural Networks - PyTorch, "Multi-layered CNNs and pooling layers"'
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html#maximum-pooling-and-average-pooling
          locator: Sec. 7.5 Pooling and Sec. 7.5.1 Maximum Pooling and Average Pooling
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html#training-deep-networks
          locator: Sec. 8.5.1 Training Deep Networks, Eq. (8.5.1)
        - source: d2l
          url: https://d2l.ai/chapter_convolutional-neural-networks/channels.html#subsec-1x1
          locator: Sec. 7.4.3 1×1 Convolutional Layer, Fig. 7.4.2
          quote: The input and output have the same height and width.
      references_replace: true
  quiz-208/q2:
    difficulty: medium
    fix:
      type: multiple
      question: Which of the following freeze the weights of a pretrained convolutional feature extractor, so that training only updates the new classifier on top?
      explanation: |
        Both settings freeze the feature extractor; they are the PyTorch and the Keras/TensorFlow way
        of doing the same thing. In the PyTorch notebook the feature extractor is frozen by setting
        `requires_grad = False` on all its parameters [^1], which keeps them out of the backward graph
        so they get no gradient updates [^3]. In the TensorFlow notebook the pre-trained VGG16 layer
        gets `trainable = False` [^2], which moves its weights from the trainable to the
        non-trainable list, so training leaves them unchanged [^4]. Evaluation mode and a smaller
        learning rate freeze nothing: the weights still receive updates [^4][^5].
      shuffle: true
      options:
        - text: In PyTorch, setting `requires_grad` to `False` on all of the feature extractor's parameters
          correct: true
        - text: In Keras/TensorFlow, setting the feature extractor's `trainable` attribute to `False`
          correct: true
        - text: In PyTorch, calling `.eval()` on the feature extractor
          why: '`eval()` only switches layers such as dropout and batch normalization to their evaluation behaviour. It does not stop gradient computation, so the optimizer still updates the weights [^5].'
        - text: Training the whole network with a 10 times lower learning rate
          why: A lower learning rate makes the updates smaller, but the pretrained weights still change. Retraining everything with a very low learning rate is what the Keras guide calls fine-tuning, the step that comes after training with frozen layers [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TransferLearningPyTorch.ipynb
          locator: 'Notebook: Transfer Learning - PyTorch (freezing the convolutional feature extractor)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/TransferLearningTF.ipynb
          locator: 'Notebook: Transfer Learning - TensorFlow (freezing the convolutional feature extractor)'
        - title: Autograd mechanics (PyTorch documentation)
          url: https://docs.pytorch.org/docs/stable/notes/autograd.html#setting-requires-grad
          locator: Locally disabling gradient computation, Setting requires_grad
          quote: To freeze parts of your model, simply apply .requires_grad_(False) to the parameters that you don’t want updated.
        - title: Transfer learning & fine-tuning (Keras developer guide)
          url: https://keras.io/guides/transfer_learning/#freezing-layers-understanding-the-trainable-attribute
          locator: 'Sections "Freezing layers: understanding the trainable attribute" and "Fine-tuning"'
        - title: Autograd mechanics (PyTorch documentation)
          url: https://docs.pytorch.org/docs/stable/notes/autograd.html#evaluation-mode-nn-module-eval
          locator: Locally disabling gradient computation, Evaluation Mode (nn.Module.eval())
          quote: Evaluation mode is not a mechanism to locally disable gradient computation.
      references_replace: true
  quiz-109/q2:
    difficulty: easy
    fix:
      question: An autoencoder's encoder network maps input images into a latent space.
      explanation: |
        An autoencoder is made of two networks. The encoder maps the input image to a latent
        space, normally a much smaller vector, and the decoder tries to rebuild the original image
        from that vector [^1]. In a variational autoencoder the encoder still maps into the latent
        space, but it outputs the parameters of a distribution there (a mean and a log-sigma)
        instead of a single point [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
          locator: Lesson 9 "Autoencoders", introduction
        - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
          url: https://blog.keras.io/building-autoencoders-in-keras.html
          locator: Section "Variational autoencoder (VAE)"
      references_replace: true
  quiz-209/q1:
    difficulty: easy
    fix:
      type: multiple
      question: Which of the following are properties of autoencoders?
      explanation: |
        Autoencoders are data-specific: they only work well on data like their training set. An
        autoencoder trained on faces, for instance, does a poor job on pictures of trees [^1][^2].
        They also train on unlabeled data, because the input itself serves as the target [^1][^2].
        They are lossy rather than lossless, so the reconstruction is never exactly the original
        [^1][^2].
      shuffle: true
      options:
        0: 'They are data-specific: they work well only on data similar to their training data'
        1: They can be trained on unlabeled data
        2: 'They are lossless: the reconstruction is an exact copy of the input'
      why:
        2: Autoencoders are lossy. The reconstruction is close to the input but degraded, and the loss function decides what is lost [^1][^2].
      correct:
        - 0
        - 1
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#properties-of-autoencoders
          locator: Lesson 9 "Autoencoders", section "Properties of Autoencoders"
        - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
          url: https://blog.keras.io/building-autoencoders-in-keras.html
          locator: Section "What are autoencoders?"
      references_replace: true
  quiz-209/q3:
    difficulty: easy
    fix:
      question: Which of these is not part of a variational autoencoder's loss function?
      explanation: |
        A VAE's loss has two parts. The reconstruction loss (for example MSE) measures how close the
        decoded image is to the input. The KL loss keeps the learned latent distribution close to
        the prior normal distribution [^1][^2]. In the original paper's objective, the KL term acts
        as a regularizer and the other term is an expected negative reconstruction error [^3].
        An adversarial loss belongs to GANs, where a discriminator is trained to tell real images
        from generated ones and the generator is trained to fool it [^4]; a plain VAE has no
        discriminator.
      options:
        2: adversarial loss
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#variational-autoencoders-vae
          locator: Lesson 9 "Autoencoders", section "Variational Autoencoders (VAE)"
        - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
          url: https://blog.keras.io/building-autoencoders-in-keras.html
          locator: Section "Variational autoencoder (VAE)"
        - title: Kingma & Welling (2013), Auto-Encoding Variational Bayes
          url: https://arxiv.org/abs/1312.6114
          locator: Sec. 2.3 The SGVB estimator and AEVB algorithm (discussion of Eq. 7)
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#training-the-gan
          locator: Lesson 10 "Generative Adversarial Networks", section "Training the GAN"
      references_replace: true
  quiz-210/q2:
    difficulty: easy
    fix:
      explanation: |
        A DCGAN is a GAN built from convolutional networks [^1], so both of its networks are
        convolutional. The generator stacks transposed-convolution blocks that grow a latent vector
        into an image, and the discriminator is a strided convolutional classifier that mirrors
        it [^2]. In the original DCGAN design, pooling is replaced by strided convolutions in the
        discriminator and fractionally-strided convolutions in the generator [^3]. Training and
        testing are phases, not parts of the network, and "CNN, generator" is not a pair of GAN
        components.
      why:
        1: A CNN is a kind of network, not a component of a GAN. In a DCGAN both components, the generator and the discriminator, are convolutional [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#discriminator
          locator: Lesson 10 "Generative Adversarial Networks", sections "Discriminator" and "Generator"
        - source: d2l
          url: https://d2l.ai/chapter_generative-adversarial-networks/dcgan.html#the-generator
          locator: Sec. 20.2 Deep Convolutional Generative Adversarial Networks (20.2.2 The Generator, 20.2.3 Discriminator, 20.2.5 Summary)
        - title: Radford, Metz & Chintala (2015), Unsupervised Representation Learning with Deep Convolutional GANs
          url: https://arxiv.org/abs/1511.06434
          locator: Sec. 3 Approach and Model Architecture
      references_replace: true
  quiz-210/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Which of the following are known problems of GAN training?
      explanation: |
        All three are well-known difficulties of GAN training [^1]. On balance: if the
        discriminator gets too good too fast, its loss drops to zero and the generator stops
        learning. If the generator is trained too long without the discriminator being updated, it
        can collapse many inputs onto the same output [^1][^2]. That is mode collapse: the generator
        finds one image that fools the discriminator instead of producing a variety [^1]. On
        hyperparameters: GANs often fail to converge until the learning rate is changed. The DCGAN
        authors, for example, found that Adam's default learning rate was too high and that
        $\beta_1 = 0.9$ made training oscillate, so they used 0.0002 and 0.5 [^1][^3].
      shuffle: true
      options:
        - text: Sensitivity to hyperparameters
          correct: true
        - text: Keeping a balance between the generator and the discriminator
          correct: true
        - text: 'Mode collapse: the generator keeps producing the same few images'
          correct: true
        - text: Every training image needs a human-annotated class label
          why: A plain GAN learns from unlabeled images. The discriminator's targets are created automatically, 1 for training images and 0 for generated ones [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#problems-with-gan-training
          locator: Lesson 10 "Generative Adversarial Networks", sections "Training the GAN" and "Problems with GAN training"
        - title: Goodfellow et al. (2014), Generative Adversarial Networks
          url: https://arxiv.org/abs/1406.2661
          locator: Sec. 6 Advantages and disadvantages
        - title: Radford, Metz & Chintala (2015), Unsupervised Representation Learning with Deep Convolutional GANs
          url: https://arxiv.org/abs/1511.06434
          locator: Sec. 4 Details of Adversarial Training
      references_replace: true
  quiz-211/q1:
    difficulty: easy
    fix:
      question: An object detection model gives us
      explanation: |
        A detector has to say both what each object is and where it is. Its output is therefore a
        class label plus bounding-box coordinates for every object found [^1][^2]. YOLO, for
        example, predicts bounding boxes and their class probabilities directly from the full
        image [^3]. A class label alone is plain image classification, and boxes without labels
        would not tell you which object is which.
      options:
        0: object class only
        1: bounding box only
        2: class and bounding box
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#different-object-detection-approaches
          locator: Lesson 11 "Object Detection", sections "A Naive Approach to Object Detection" and "Different Object Detection Approaches"
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/bounding-box.html
          locator: Sec. 14.3 Object Detection and Bounding Boxes (introduction)
        - title: 'Redmon et al. (2016), You Only Look Once: Unified, Real-Time Object Detection'
          url: https://arxiv.org/abs/1506.02640
          locator: Abstract; Sec. 2 Unified Detection
      references_replace: true
  quiz-113/q3:
    difficulty: easy
    fix:
      explanation: |
        Character-level representation treats each character of the text as a number: with $C$
        distinct characters in the corpus, the word "Hello" becomes a $5 \times C$ tensor in which each
        letter is a one-hot column [^1]. Character-based tokenizers therefore have a much smaller
        vocabulary and few unknown tokens, at the cost of longer sequences of less meaningful units [^2].
        Giving each whole word a number is word-level representation [^1].
      options:
        2: sentence
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#representing-text
          locator: 'Lesson: Representing Text as Tensors, sec. Representing text'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#character-based
          locator: Chapter 2.4 Tokenizers, sec. Character-based
      references_replace: true
  quiz-213/q1:
    difficulty: easy
    fix:
      question: Word level representation represents each _____ as a number
      explanation: |
        Word-level representation builds a vocabulary of all words in the text and represents each word
        by its number in that vocabulary, usually fed to the network as a one-hot vector [^1]. Words carry
        more meaning than single letters, which makes the task easier for the network, but the large
        vocabulary produces high-dimensional, sparse tensors [^1]. Word-based tokenizers work the same
        way: every word gets an ID from 0 up to the vocabulary size [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#representing-text
          locator: 'Lesson: Representing Text as Tensors, sec. Representing text'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter2/4#word-based
          locator: Chapter 2.4 Tokenizers, sec. Word-based
      references_replace: true
  quiz-213/q2:
    difficulty: easy
    fix:
      question: In NLP, the term n-gram most commonly refers to a sequence of n consecutive _____
      explanation: |
        An n-gram is a sequence of $n$ consecutive words: in "I like to go fishing" the bigrams are
        "I like", "like to", "to go" and "go fishing", and trigrams use three words [^1][^2]. Treating
        such word groups as tokens lets a model capture some context, such as the difference between
        "neural network" and "fishing network" [^1]. The lesson notes that n-grams can also be built from
        characters, where they roughly correspond to syllables [^1], but the standard meaning is word
        sequences [^2]; sentences are never the unit.
      options:
        0: sentences
        1: letters
        2: words
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#n-grams
          locator: 'Lesson: Representing Text as Tensors, sec. N-Grams'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 3 N-gram Language Models
          url: https://web.stanford.edu/~jurafsky/slp3/3.pdf
          locator: Ch. 3 introduction (definition of an n-gram)
      references_replace: true
  quiz-213/q3:
    difficulty: easy
    fix:
      question: A drawback of n-gram representations is that the vocabulary size grows very fast
      explanation: |
        When every word pair or triple becomes its own token, the dictionary grows dramatically, since
        there are far more combinations than single words [^1]. These tokens also share nothing: "go
        fishing" and "go shopping" become unrelated entries even though they share a verb [^1].
        Count-based n-gram models hit the same wall, because most n-grams occur only rarely and all
        their counts have to be stored [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/13-TextRep/README.md#n-grams
          locator: 'Lesson: Representing Text as Tensors, sec. N-Grams'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#laplace-smoothing
          locator: Sec. 9.3.1.3 Laplace Smoothing (limitations of n-gram counting)
      references_replace: true
  quiz-116/q2:
    difficulty: easy
    fix:
      explanation: |
        A simple RNN cell holds two weight matrices: $W$ transforms the current input $X_i$ and $H$
        transforms the previous state $S_{i-1}$, and the new state is $\sigma(W X_i + H S_{i-1} + b)$
        [^1]. With embedding size `emb_size` and state size `hid_size`, $W$ is
        `emb_size` × `hid_size` and $H$ is `hid_size` × `hid_size` [^1]; only the bias $b$ is a
        vector. d2l writes the same update as $H_t = \phi(X_t W_{xh} + H_{t-1} W_{hh} + b_h)$, with an
        input-to-hidden and a hidden-to-hidden matrix [^2].
      options:
        1: vectors
        2: scalars
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#anatomy-of-an-rnn-cell
          locator: 'Lesson: Recurrent Neural Networks, Anatomy of an RNN Cell'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
          locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States, Eq. (9.4.5)
      references_replace: true
  quiz-216/q3:
    difficulty: easy
    fix:
      question: When an RNN layer is unrolled over a sequence, the cells at all time steps share the same weights.
      explanation: |
        An RNN applies the same block at every time step, so all the unrolled cells share one set of
        weights and are trained end to end with a single backpropagation pass [^1]. That sharing is
        why an RNN's parameter count does not grow with the length of the sequence [^2]. Stacked
        layers are different: in a deep (multi-layer) RNN each layer $l$ has its own weights
        $W_{xh}^{(l)}$ and $W_{hh}^{(l)}$ [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md
          locator: 'Lesson: Recurrent Neural Networks (introduction)'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
          locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-modern/deep-rnn.html
          locator: Sec. 10.3 Deep Recurrent Neural Networks, Eq. (10.3.1)
      references_replace: true
  quiz-217/q2:
    difficulty: easy
    fix:
      type: true_false
      question: When generating text with an RNN, always picking the character with the highest probability guarantees meaningful text.
      explanation: |
        Always taking the most probable character often makes the generated text cycle through the
        same phrases. The top few probabilities can also be nearly equal, so the runner-up character
        may be just as sensible [^1]. The lesson therefore samples from the predicted distribution,
        with a temperature to control how random the choice is [^1]. More generally, picking the most
        likely token at every step does not guarantee the most likely sequence overall [^2].
      options:
        - text: 'True'
        - text: 'False'
          correct: true
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md#soft-text-generation-and-temperature
          locator: 'Lesson: Generative networks, Soft text generation and temperature'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-modern/beam-search.html#greedy-search
          locator: Sec. 10.8.1 Greedy Search
      references_replace: true
  quiz-217/q3:
    difficulty: easy
    fix:
      explanation: |
        The lesson calls the many-to-many pattern sequence-to-sequence: one RNN collects the whole
        input sequence into a hidden state and a second RNN unrolls that state into the output
        sequence, as in machine translation [^1]. Sequence-to-vector is the many-to-one pattern: a
        whole sequence goes in and a single output comes out, as in text classification or sentiment
        analysis [^1][^2]. Vector-to-sequence is one-to-many: a single input, such as an image, is
        turned into a sequence, as in image captioning [^1][^2].
      options:
        0: sequence-to-vector
        2: vector-to-sequence
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
          locator: 'Lesson: Generative networks (architecture patterns)'
        - title: Karpathy, The Unreasonable Effectiveness of Recurrent Neural Networks (2015)
          url: http://karpathy.github.io/2015/05/21/rnn-effectiveness/
          locator: Sec. Recurrent Neural Networks, figure of input/output patterns and its caption
      references_replace: true
  quiz-218/q2:
    difficulty: easy
    fix:
      question: Multi-head attention is used in transformers to give the network the power to capture _____ of dependencies
      explanation: |
        Multi-head attention runs several attention heads in parallel, each with its own learned
        projections of the queries, keys and values, and concatenates their outputs [^2]. Each head
        can therefore pick up a different kind of dependency, such as long-range versus short-range
        word relations or co-reference, which is the lesson's reason for using several heads
        [^1][^2]. A single type would need only one head, and the heads are not limited to short
        range: long-range relations are among the dependencies they capture [^1][^2].
      options:
        1: a single type
        2: only short-range types
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#multi-head-self-attention
          locator: 'Lesson: Attention Mechanisms and Transformers, Multi-Head Self-Attention'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/multihead-attention.html
          locator: Sec. 11.5 Multi-Head Attention
      references_replace: true
  quiz-119/q1:
    difficulty: easy
    fix:
      question: What does NER stand for?
      explanation: |
        NER stands for Named Entity Recognition: finding specific entities in text, such as places,
        person names, date-time intervals or chemical formulae [^1]. Formally, it finds spans of text
        that are proper names and labels their type; the most common tags are PER (person), LOC
        (location), ORG (organization) and GPE (geo-political entity) [^2]. The other expansions are
        invented.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md
          locator: 'Lesson: Named Entity Recognition, introduction'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
          url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
          locator: Sec. 18.3 Named Entities and Named Entity Tagging
      references_replace: true
  quiz-119/q3:
    difficulty: easy
    fix:
      question: To train an NER model, we need
      explanation: |
        An NER model is a supervised token classifier, so it must learn from text in which every token
        already carries its entity label, usually in BIO format [^1]. Jurafsky and Martin note that,
        because these taggers are supervised, labelled data is essential for training and testing, and
        corpora such as OntoNotes supply named-entity annotations [^2]. Plain natural text is enough for
        a language model, which learns without labels [^3], and translated texts in two languages are
        what machine translation learns from [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
          locator: 'Lesson: Named Entity Recognition, secs. NER as Token Classification and Training NER models'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
          url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
          locator: Sec. 18.7 Further Details
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
          locator: 'Lesson: Language Modeling, introduction'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#machine-learning-approaches
          locator: 'Lesson: Translation and sentiment analysis with ML, sec. Machine learning approaches'
      references_replace: true
  quiz-219/q1:
    difficulty: easy
    fix:
      question: An NER model is essentially a ____ model
      explanation: |
        NER models are token classification models: for each input token they decide whether it is
        part of an entity and, if so, of which class [^1]. The HF course defines token classification
        as attributing a label to each token in a sentence, with NER as its first example [^2]. Text
        classification gives one label to the whole text (for example a chatbot's intent) [^1], and text
        regression likewise outputs a single value per text, so neither yields the per-token labels NER
        needs.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
          locator: 'Lesson: Named Entity Recognition, secs. Example of Using NER and NER as Token Classification'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/2#token-classification
          locator: Chapter 7.2 Token classification, introduction
      references_replace: true
  quiz-219/q3:
    difficulty: medium
    fix:
      question: An NER model is a good example of a ____ network architecture
      explanation: |
        NER outputs one tag for every input token, a one-to-one correspondence between input and output
        positions, so it fits the synchronised many-to-many pattern, the right-most architecture in
        Karpathy's diagram [^1][^2]. One-to-one maps a single fixed input to a single output (for
        example image classification), and one-to-many turns one input into a sequence (for example
        image captioning) [^2]. Machine translation is also many-to-many, but there the output sequence
        is produced after reading the input and is not aligned with it token by token [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
          locator: 'Lesson: Named Entity Recognition, sec. NER as Token Classification'
        - title: Karpathy, The Unreasonable Effectiveness of Recurrent Neural Networks (2015)
          url: http://karpathy.github.io/2015/05/21/rnn-effectiveness/
          locator: Sec. Recurrent Neural Networks, figure of input/output patterns and its caption
      references_replace: true
  quiz-121/q1:
    difficulty: easy
    fix:
      explanation: |
        A genetic algorithm evolves a population of candidate solutions. Selection keeps the better
        solutions according to a fitness function, and mutations randomly change genes to push the
        search out of local minima [^1]. Crossover, which combines two parent solutions into a new
        one, is the third ingredient [^1]. Since the method relies on both selection and mutation,
        neither option on its own is complete.
      shuffle: true
      options:
        0: Mutations, without selection
        1: Selection, without mutations
        2: Both mutations and selection
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
          locator: 'Lesson: Genetic Algorithms, introduction (list of ideas and algorithm outline)'
      references_replace: true
  quiz-121/q3:
    difficulty: easy
    fix:
      question: Valid solutions in a genetic algorithm can be represented as _____
      explanation: |
        The first step in building a genetic algorithm is to choose a way to code every candidate
        solution as a gene $g \in \Gamma$, often a bit vector or a sequence of numbers, so that
        crossover and mutation can act on it and a fitness function can score it [^1]. Neurons are the
        building blocks of the neural-network (bottom-up) approach, a different branch of AI [^2], and
        "cells" is only biological imagery with no role in the method.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
          locator: 'Lesson: Genetic Algorithms, introduction (ideas and implementation requirements)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#bottom-up-approach
          locator: 'Lesson: Introduction to AI, sec. Bottom-Up Approach'
      references_replace: true
  quiz-122/q3:
    difficulty: easy
    fix:
      question: When creating an RL-based chess engine, we need to
      explanation: |
        RL learns from experience, and in a two-player game the program can create that experience
        by playing against itself. AlphaZero was trained from scratch by two agents playing each
        other and improving at every step [^1]. AlphaGo Zero used no human game records at all,
        only self-play reinforcement learning, and AlphaZero applied the same general algorithm to
        chess [^2]. A database of past matches would make the program imitate humans, which this
        work showed is unnecessary [^2]. Exhaustive search is not feasible: even large dedicated
        computers cannot compute optimal chess moves outright [^3].
      options:
        1: let the computer play against itself many times
        2: program an exhaustive search algorithm
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
          locator: Lesson 22 "Deep Reinforcement Learning", section "Other RL Tasks"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.7 Optimality and Approximation, p. 67
      references_replace: true
  quiz-222/q1:
    difficulty: easy
    fix:
      question: How does an RL training algorithm know how well it did?
      explanation: |
        An RL agent's only feedback is reward. The reward function says how successful an attempt
        was; in a game it might be the final score [^1]. The agent's single objective is to
        maximize total reward over the long run, and it is never told which action would have been
        correct [^2]. That rules out accuracy, which needs known correct labels. Perplexity is a
        language-model metric that measures how well a model predicts the next token in a
        text [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#deep-reinforcement-learning
          locator: Lesson 22 "Deep Reinforcement Learning", introduction
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, p. 1; Sec. 1.3 Elements of Reinforcement Learning, p. 6
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html#perplexity
          locator: Sec. 9.3.2 Perplexity
      references_replace: true
  quiz-222/q2:
    difficulty: easy
    fix:
      question: Which kinds of environment is RL applicable to?
      explanation: |
        RL works with both kinds of environment. The ML-for-Beginners lessons first apply
        Q-learning to a board world with discrete states, then to CartPole, whose state is a vector
        of real numbers [^1]. For a Q-table, a continuous state has to be discretized, for example
        into bins [^1]. Actions can likewise be discrete (a finite set of moves, as in Atari or Go)
        or continuous (real-valued, as in robot control or steering a car) [^2][^3].
      options:
        0: Only discrete environments
        1: Only continuous environments
        2: Both discrete and continuous environments
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#state-discretization
          locator: Reinforcement lesson 2 "CartPole Skating", introduction, section "State discretization" and Conclusion
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#action-space
          locator: Unit 1, "The Reinforcement Learning Framework", section "Action Space"
        - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
          url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
          locator: Section "Action Spaces"
      references_replace: true
  quiz-223/q2:
    difficulty: easy
    fix:
      explanation: |
        Classified by their ability to reason, reactive agents usually have simple request-response
        behaviour, while deliberative agents use logical reasoning or planning [^1]. Complex planning
        and reasoning is the mark of cognitive agents, not reactive ones [^1]. Even passive agents,
        which have no goals of their own, still react to external stimuli, so "no behaviour" fits no
        type of agent [^1].
      options:
        1: complex, planning-based behavior
        2: no behavior at all
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
          locator: 'Lesson: Multi-Agent Systems, introduction (types of agents)'
      references_replace: true
  quiz-124/q2:
    difficulty: easy
    fix:
      question: Which of these is an example of interpretable AI?
      explanation: |
        An expert system stores knowledge as explicit if-then rules taken from human experts and
        applies them with an inference engine, so you can always trace which rules led to each
        decision [^2]. That is the kind of interpretable system the transparency principle of
        Responsible AI recommends wherever possible [^1]. A neural network instead encodes what it
        learned in a large number of numeric weights, which is why ML models are often called black
        boxes whose outcomes are hard to explain [^3]. Image classifiers are usually exactly such
        networks (convolutional neural networks) [^4], so they are not the interpretable example.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Transparency)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#expert-systems
          locator: "Lesson: Knowledge Representation and Expert Systems, sec. Expert Systems and the note in 'Exercise: Animal Inference'"
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#debugging-with-responsible-ai
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Debugging with responsible AI'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#recent-ai-research
          locator: 'Lesson: Introduction to AI, sec. Recent AI Research'
      references_replace: true
  quiz-224/q1:
    difficulty: easy
    fix:
      question: Why can an AI model discriminate?
      explanation: |
        A model reproduces the patterns in its training data, so if some groups are under- or
        over-represented its predictions favour the majority. The lesson's example is a hiring model
        that prefers men simply because its data was skewed towards male candidates; the remedy is to
        balance the data and inspect the model [^1]. The Gender Shades study showed this in practice:
        two face benchmarks were 79.6% and 86.2% lighter-skinned, and commercial gender classifiers
        misclassified darker-skinned women up to 34.7% of the time versus at most 0.8% for
        lighter-skinned men [^2]. A model is just large-scale matrix arithmetic with no emotions, so it
        cannot "become unfriendly" [^1], and bias usually enters unintentionally through the data rather
        than being deliberately programmed [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Fairness)'
        - title: 'Buolamwini & Gebru, Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification (FAT* 2018, PMLR 81)'
          url: https://proceedings.mlr.press/v81/buolamwini18a.html
          locator: Abstract
          quote: We find that these datasets are overwhelmingly composed of lighter-skinned subjects (79.6% for IJB-A and 86.2% for Adience)
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
      references_replace: true
  quiz-224/q3:
    difficulty: medium
    fix:
      explanation: |
        The lesson defines accountability as knowing where responsibility for an AI decision lies,
        and says the usual way to secure it is to keep human beings in the loop for important
        decisions, so that actual people are accountable [^1]. The AI system itself cannot carry
        responsibility: it is a tool built from matrix arithmetic, with no intentions of its own [^1].
        Developers do share responsibility (Microsoft's principle says the people who design and deploy
        AI systems must be accountable [^2]), but blaming developers alone misses the core idea that a
        responsible person must take part where each decision is made.
      options:
        1: the AI system itself should be held responsible for its own actions
        2: only the developers of the AI system should be held responsible
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Accountability)'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#accountability
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Accountability'
      references_replace: true
  quiz-101/q2:
    difficulty: easy
    fix:
      explanation: |
        Weak (narrow) AI is designed and trained for one specific task or a narrow set of tasks, such
        as a voice assistant or a recommendation algorithm, so the statement is false [^1]. A system
        able to take on any intellectual task a human can is called strong AI, or artificial general
        intelligence, and it remains a theoretical goal [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
          locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
      references_replace: true
  quiz-201/q1:
    difficulty: easy
    fix:
      explanation: |
        The top-down approach models the way a person reasons: it extracts knowledge from human
        experts, represents it in a computer-readable form and adds a mechanism for reasoning over it.
        This is called symbolic reasoning [^1]. Its counterpart, the bottom-up approach, models the
        brain with neural networks instead [^1]. "Strategic" and "synergistic" reasoning are not names
        of AI approaches; the similar-sounding synergetic approach is the emergent, multi-agent one, in
        which intelligence arises from many simple interacting agents [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#different-approaches-to-ai
          locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and The Top-Down Approach'
      references_replace: true
  quiz-201/q2:
    difficulty: easy
    fix:
      explanation: |
        The bottom-up approach copies the brain's structure rather than its conscious reasoning: it
        builds a network of many simple artificial neurons, each acting like a weighted average of its
        inputs, and trains the network on example data [^1]. The top-down approach is the opposite: it
        encodes human knowledge and reasoning as symbols and rules [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#bottom-up-approach
          locator: 'Lesson: Introduction to AI, sec. Different Approaches to AI and Bottom-Up Approach'
      references_replace: true
  quiz-201/q3:
    difficulty: easy
    fix:
      explanation: |
        Early AI relied on symbolic expert systems, but extracting knowledge from experts and keeping
        knowledge bases accurate turned out to be too complex and expensive, which led to the AI Winter
        of the 1970s [^1]. The ML history lesson dates it to 1974–1980, when compute was too limited,
        problems exploded combinatorially and funding dried up [^2]. The 1950s and 1960s were the
        founding years and the optimistic, well-funded "golden years", not a downturn [^2]. A second,
        milder slump, the "AI chill", came later, in 1987–1993 [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
          locator: 'Lesson: Introduction to AI, sec. A Brief History of AI'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, secs. 1956 - 1974 "The golden years" and 1974 - 1980 "AI Winter"'
      references_replace: true
  quiz-102/q1:
    difficulty: easy
    fix:
      explanation: |
        In the early days of AI the top-down approach was popular: extract knowledge from people into
        a machine-readable form, then use it to solve problems automatically. The lesson says it rested
        on two big ideas, knowledge representation and reasoning [^1]. The introductory lesson puts it
        the same way: symbolic AI depends on representing an expert's knowledge in the computer and on
        modelling reasoning there [^2]. "Seeking" and "reading" knowledge are not part of either
        description.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md
          locator: 'Lesson: Knowledge Representation and Expert Systems, introduction'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#the-top-down-approach
          locator: 'Lesson: Introduction to AI, sec. The Top-Down Approach'
      references_replace: true
  quiz-102/q2:
    difficulty: easy
    fix:
      explanation: |
        In the DIKW pyramid, data is what is recorded on a physical medium, information is how we
        interpret that data in our head, and knowledge is information integrated into our model of the
        world [^1]. Knowledge comes from an active learning process that links pieces of information,
        for example knowing how a computer works and what it costs, not just recognising the word
        "computer" [^1]. Knowledge therefore sits one level above information; the two are not the same.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
          locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (DIKW pyramid)'
      references_replace: true
  quiz-103/q2:
    difficulty: easy
    fix:
      explanation: |
        Rosenblatt's 1957 Mark-1 perceptron had 400 inputs, one binary output and a single neuron,
        which the lesson calls a threshold logic unit [^1]. The name comes from its step activation:
        the unit outputs one value when its weighted input is above a threshold and the other value
        below it, the thresholding units that McCulloch and Pitts used to model neurons that either
        fire or do not [^1][^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md
          locator: 'Lesson: Introduction to Neural Networks - Perceptron (introduction and Perceptron Model)'
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#sigmoid-function
          locator: Sec. 5.1.2.2 Sigmoid Function
      references_replace: true
  quiz-103/q3:
    difficulty: easy
    fix:
      explanation: |
        A perceptron computes $y(x) = f(w^\top x)$, where $f$ is a step function returning $+1$ or
        $-1$, so it separates the input into exactly two classes: it is a binary classification model
        [^1]. It is trained from labelled examples ($t_i = \pm 1$), so it is supervised learning, not
        clustering [^1]. Handling more than two classes needs an extension, which is one of the goals
        of the multi-layer networks in the next lesson [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#perceptron-model
          locator: 'Lesson: Introduction to Neural Networks - Perceptron, Perceptron Model and Training the Perceptron'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron (introduction)'
      references_replace: true
  quiz-203/q1:
    difficulty: easy
    fix:
      explanation: |
        Training means finding the weight vector that classifies as many training points as possible
        correctly, i.e. the one with the smallest error [^1]. The lesson measures this error with the
        perceptron criterion $E(w) = -\sum_i w^\top x_i t_i$, summed only over misclassified points, so it
        is zero when every point is on the right side [^1]. The number of nodes is not what training
        changes; the model is a single neuron and only its weights are learned [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
          locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
      references_replace: true
  quiz-203/q2:
    difficulty: easy
    fix:
      explanation: |
        The perceptron criterion $E(w)$ is a function of the weights, and the lesson minimizes it with
        gradient descent: start from initial weights $w^{(0)}$ and repeatedly step against the gradient,
        $w^{(t+1)} = w^{(t)} - \eta \nabla E(w)$ [^1]. The same idea, updating the parameters in the
        direction that lowers the loss, is how nearly every deep learning model is trained [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
          locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
          locator: Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent
      references_replace: true
  quiz-203/q3:
    difficulty: easy
    fix:
      explanation: |
        Each gradient-descent step changes the weights: $w^{(t+1)} = w^{(t)} - \eta \nabla E(w)$ [^1].
        The learning rate $\eta$ is a hyperparameter set by the designer that only scales the step
        [^2], and the gradient $\nabla E(w)$ is not updated but recomputed at the current weights to
        decide the direction of the next step [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
          locator: 'Lesson: Introduction to Neural Networks - Perceptron, Training the Perceptron'
        - source: d2l
          url: https://d2l.ai/chapter_optimization/gd.html#learning-rate
          locator: Sec. 12.3.1.1 Learning Rate
      references_replace: true
  quiz-104/q1:
    difficulty: easy
    fix:
      explanation: |
        To train a model we need a number that says how good its predictions are, and that number is
        the loss function $\mathcal{L}$: absolute or squared error for regression, 0-1 or logistic loss
        for classification [^1]. Loss is usually non-negative, smaller is better, and a perfect
        prediction scores 0 [^2]; training then means changing the parameters to make it smaller [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#formalization-of-machine-learning
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Formalization of Machine Learning'
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/linear-regression.html#loss-function
          locator: Sec. 3.1.1.2 Loss Function
      references_replace: true
  quiz-104/q2:
    difficulty: easy
    fix:
      explanation: |
        A one-layer network computes a linear function $f(x) = wx + b$ (optionally followed by
        softmax), so it can only tell apart classes that are linearly separable [^1]. Separating other
        classes needs hidden layers with a nonlinear activation; without the nonlinearity, stacked affine
        layers collapse back into one affine layer and gain nothing [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#multi-layered-perceptrons-and-backpropagation
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Multi-Layered Perceptrons and Backpropagation'
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
          locator: Sec. 5.1.1.3 From Linear to Nonlinear
      references_replace: true
  quiz-104/q3:
    difficulty: easy
    fix:
      explanation: |
        In a multi-layer network the loss is a composition of functions, so its gradient comes from the
        chain rule. The chain-rule products for different layers share their leftmost factors, so they
        are computed efficiently by starting at the loss and moving backwards through the computational
        graph, hence the name backpropagation [^1]. d2l describes it the same way: traverse the network
        from the output layer to the input layer, applying the chain rule and storing the intermediate
        derivatives [^2]. Forward propagation is the opposite pass, which computes and stores the
        intermediate values and outputs from input to output [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#multi-layered-perceptrons-and-backpropagation
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Multi-Layered Perceptrons and Backpropagation'
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html#backpropagation
          locator: Sec. 5.3.1 Forward Propagation and Sec. 5.3.3 Backpropagation
      references_replace: true
  quiz-204/q1:
    difficulty: easy
    fix:
      explanation: |
        A regression loss compares a predicted number with the true one, and the lesson lists both the
        absolute error $\sum_i |f(x^{(i)}) - y^{(i)}|$ and the squared error
        $\sum_i (f(x^{(i)}) - y^{(i)})^2$ [^1]. Both are standard, usually averaged as mean absolute
        error (MAE) and mean squared error (MSE); MSE pulls the model more strongly towards outliers,
        while MAE stays closer to the bulk of the data [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#formalization-of-machine-learning
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, Formalization of Machine Learning'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/linear-regression/loss
          locator: 'Linear regression: Loss, Types of loss and Choosing a loss'
      references_replace: true
  quiz-107/q2:
    difficulty: easy
    fix:
      explanation: |
        ResNet and MobileNet are CNN architectures: ResNet is built from residual blocks, and MobileNet
        uses depthwise separable convolutions to stay small enough for mobile devices [^1]. TensorFlow
        is not a network design at all; it is a deep learning framework, one of the two most popular
        together with PyTorch, used to build and train such networks [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md
          locator: 'Lesson: Convolutional Neural Networks, Well-Known CNN Architectures (ResNet, MobileNet)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md
          locator: 'Lesson: Neural Network Frameworks'
      references_replace: true
  quiz-108/q1:
    difficulty: easy
    fix:
      explanation: |
        Transfer learning starts from a pre-trained model, usually trained on a large dataset such as
        ImageNet, and reuses the features it has already learned, often just training a new classifier
        on top [^1]. When fine-tuning, only the new output layer starts from random weights; every other
        layer starts from the source model's trained parameters [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/08-TransferLearning/README.md
          locator: 'Lesson: Pre-trained Networks and Transfer Learning (introduction; Pre-Trained Models as Feature Extractors)'
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/fine-tuning.html#steps
          locator: Sec. 14.2.1 Steps (Fine-Tuning)
      references_replace: true
  quiz-109/q1:
    difficulty: easy
    fix:
      explanation: |
        Self-supervised learning trains on raw, unlabeled data. The training targets come from the
        data itself, so an autoencoder can use each image as both its input and its target [^1].
        This is why autoencoders count as self-supervised rather than truly unsupervised: they are
        a form of supervised learning whose targets are generated from the inputs [^2]. Labeled
        data would make it ordinary supervised learning. "Pre-trained" describes a model, not a
        kind of training data.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#autoencoders
          locator: Lesson 9 "Autoencoders", introduction
        - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
          url: https://blog.keras.io/building-autoencoders-in-keras.html
          locator: Section "So what's the big deal with autoencoders?"
      references_replace: true
  quiz-209/q2:
    difficulty: easy
    fix:
      explanation: |
        Denoising is one of the main uses of autoencoders. The network is given artificially noised
        images as input and the clean originals as targets. Noise carries a lot of useless
        information that does not fit through the small latent space, so the autoencoder learns to
        keep only the important content of the image [^1]. The Keras tutorial does exactly this
        with a convolutional autoencoder that maps noisy digit images to clean ones [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/09-Autoencoders/README.md#scenarios-for-using-autoencoders
          locator: Lesson 9 "Autoencoders", section "Scenarios for using Autoencoders" (Denoising)
        - title: Chollet (2016), Building Autoencoders in Keras, The Keras Blog
          url: https://blog.keras.io/building-autoencoders-in-keras.html
          locator: Section "Application to image denoising"
      references_replace: true
  quiz-110/q2:
    difficulty: easy
    fix:
      explanation: |
        GAN stands for generative adversarial network. "Generative" because the goal is to produce
        new data that looks like the training set. "Adversarial" because two networks are trained
        against each other [^1]. Goodfellow et al. framed this as a minimax two-player game. A
        generator $G$ tries to capture the data distribution, while a discriminator $D$ estimates
        whether a sample came from the real data or from $G$ [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
          locator: Lesson 10 "Generative Adversarial Networks", introduction and section "Training the GAN"
        - title: Goodfellow et al. (2014), Generative Adversarial Networks
          url: https://arxiv.org/abs/1406.2661
          locator: Abstract; Sec. 3 Adversarial nets
      references_replace: true
  quiz-110/q3:
    difficulty: easy
    fix:
      explanation: |
        A GAN has two networks trained against each other [^1]. The generator turns a random
        vector into an image. The discriminator is a binary classifier that decides whether an
        image is real (from the training set) or produced by the generator [^1][^2]. The
        generator tries to fool the discriminator, and the discriminator adapts to the new fakes,
        which in turn pushes the generator to improve [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
          locator: Lesson 10 "Generative Adversarial Networks", introduction and vocabulary note
        - source: d2l
          url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html
          locator: Sec. 20.1 Generative Adversarial Networks (introduction, Fig. 20.1.1)
      references_replace: true
  quiz-111/q2:
    difficulty: easy
    fix:
      explanation: |
        An image classifier only says what is in the picture. Object detection also says where each
        object is [^1][^2]. That position is usually given as a bounding box, a rectangle described
        by its corner or center coordinates [^2]. "Type" is just another word for the class.
        "Shape" is also wrong: a rectangular box gives the location but not the object's exact
        outline, and pixel-level outlines are the job of segmentation [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#object-detection
          locator: Lesson 11 "Object Detection", introduction
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/bounding-box.html#bounding-boxes
          locator: Sec. 14.3 Object Detection and Bounding Boxes (introduction and 14.3.1 Bounding Boxes)
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html
          locator: Sec. 14.9 Semantic Segmentation and the Dataset (introduction)
      references_replace: true
  quiz-211/q2:
    difficulty: easy
    fix:
      explanation: |
        One-pass detectors (YOLO, SSD, RetinaNet) predict classes and boxes in a single forward
        pass of the network. Region-proposal methods (R-CNN, Fast R-CNN, Faster R-CNN) first
        generate regions of interest and then run the classifier on them, which takes many passes
        and is slow [^1]. In the YOLO paper's comparison, Fast R-CNN runs at about 0.5 frames per
        second because it still relies on selective search for proposals, while YOLO runs at
        45 fps [^2]. Fast R-CNN is therefore an example of the slower family, not the answer.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#different-object-detection-approaches
          locator: Lesson 11 "Object Detection", section "Different Object Detection Approaches"
        - title: 'Redmon et al. (2016), You Only Look Once: Unified, Real-Time Object Detection'
          url: https://arxiv.org/abs/1506.02640
          locator: Sec. 1 Introduction; Sec. 4.1 Comparison to Other Real-Time Systems, Table 1
      references_replace: true
  quiz-211/q3:
    difficulty: easy
    fix:
      explanation: |
        Intersection over Union divides the area where two boxes overlap by the area they cover
        together. It is 1 for identical boxes and 0 for boxes that do not touch, so it directly
        measures how well a predicted box lines up with the ground-truth box [^1][^2]. Accuracy and
        precision count whether predictions are right or wrong. In detection, precision is computed
        only after an IoU threshold has decided which predicted boxes count as matches [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/11-ObjectDetection/README.md#intersection-over-union
          locator: Lesson 11 "Object Detection", sections "Intersection over Union" and "AP and IoU"
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/anchor.html#intersection-over-union-iou
          locator: Sec. 14.4.2 Intersection over Union (IoU)
      references_replace: true
  quiz-112/q3:
    difficulty: easy
    fix:
      explanation: |
        Segmentation networks follow the same pattern as an autoencoder. An encoder extracts
        features from the image, and a decoder turns those features into a mask with the same size
        as the input and one channel per class [^1]. U-Net is the classic example: a contracting
        path captures context, and a symmetric expanding path recovers precise localization [^2].
        A fully convolutional network does the same, using transposed convolutions to bring the
        feature maps back to the input's height and width [^3]. A generator and a discriminator
        are the two parts of a GAN, not of a segmentation model [^4].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md#segmentation
          locator: Lesson 12 "Segmentation", introduction (Encoder / Decoder)
        - title: 'Ronneberger, Fischer & Brox (2015), U-Net: Convolutional Networks for Biomedical Image Segmentation'
          url: https://arxiv.org/abs/1505.04597
          locator: Abstract
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/fcn.html#the-model
          locator: Sec. 14.11 Fully Convolutional Networks (introduction and 14.11.1 The Model)
        - source: d2l
          url: https://d2l.ai/chapter_generative-adversarial-networks/gan.html
          locator: Sec. 20.1 Generative Adversarial Networks (introduction)
      references_replace: true
  quiz-212/q1:
    difficulty: easy
    fix:
      explanation: |
        The encoder is the first half of a segmentation network. It reads the input image and
        compresses it into feature maps [^1]. In U-Net this is the contracting path, which
        captures the image's context [^2]. The decoder works in the opposite direction, turning
        features into the output mask [^1]. A generator is a GAN component that turns a random
        vector into an image, so it does not extract features from an input image [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md#segmentation
          locator: Lesson 12 "Segmentation", introduction (Encoder / Decoder)
        - title: 'Ronneberger, Fischer & Brox (2015), U-Net: Convolutional Networks for Biomedical Image Segmentation'
          url: https://arxiv.org/abs/1505.04597
          locator: Abstract
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generative-adversarial-networks
          locator: Lesson 10 "Generative Adversarial Networks", vocabulary note (Generator / Discriminator)
      references_replace: true
  quiz-212/q2:
    difficulty: easy
    fix:
      explanation: |
        The decoder takes the encoder's features and produces the mask. The mask has the input's
        spatial size and one channel per class, so each pixel ends up with a class prediction [^1].
        In a fully convolutional network this upsampling is done with transposed convolutions, so
        the output channels at each pixel hold the class scores for that input pixel [^2]. The
        encoder does the opposite job, extracting features from the image [^1]. A generator starts
        from a random latent vector rather than from features of an input image [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/12-Segmentation/README.md#segmentation
          locator: Lesson 12 "Segmentation", introduction (Encoder / Decoder)
        - source: d2l
          url: https://d2l.ai/chapter_computer-vision/fcn.html#the-model
          locator: Sec. 14.11 Fully Convolutional Networks (introduction and 14.11.1 The Model)
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/4-ComputerVision/10-GANs/README.md#generator
          locator: Lesson 10 "Generative Adversarial Networks", vocabulary note and section "Generator"
      references_replace: true
  quiz-114/q1:
    difficulty: easy
    fix:
      explanation: |
        An embedding represents each word by a dense vector of much lower dimension than the one-hot
        vector of vocabulary size, ideally one that also reflects the word's meaning [^1]. Typical
        embeddings have about 50 to 1000 dimensions instead of the vocabulary size $|V|$, and their
        entries are real numbers rather than mostly zeros [^2]. Lowering the dimension is the point: it
        saves memory and leaves the model far fewer weights to learn [^1][^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md
          locator: 'Lesson: Embeddings, introduction'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 5 Embeddings
          url: https://web.stanford.edu/~jurafsky/slp3/5.pdf
          locator: Sec. 5.5 Word2vec (opening paragraphs)
      references_replace: true
  quiz-114/q2:
    difficulty: easy
    fix:
      explanation: |
        Pretrained Word2Vec (or GloVe) vectors can be loaded as the weights of a network's embedding
        layer instead of learning that layer from scratch [^1]. The practical catch is the vocabulary:
        the one used for pretraining usually differs from the one in your corpus, so the two have to be
        matched [^1]. d2l does exactly this for sentiment analysis, giving each token its pretrained
        GloVe vector through the embedding layer and keeping those vectors fixed during training [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md#semantic-embeddings-word2vec
          locator: 'Lesson: Embeddings, sec. Semantic Embeddings: Word2Vec'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-applications/sentiment-analysis-rnn.html#loading-pretrained-word-vectors
          locator: Sec. 16.2.1 Representing Single Text with RNNs and 16.2.2 Loading Pretrained Word Vectors
      references_replace: true
  quiz-214/q1:
    difficulty: easy
    fix:
      explanation: |
        Word2Vec has two main architectures: continuous bag-of-words (CBoW) and skip-gram [^1][^2].
        CBoW predicts the centre word from its surrounding context words, while skip-gram does the
        reverse and predicts the context words from the centre word [^2]. CBoW trains faster, whereas
        skip-gram is slower but represents infrequent words better [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md#semantic-embeddings-word2vec
          locator: 'Lesson: Embeddings, sec. Semantic Embeddings: Word2Vec'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-pretraining/word2vec.html#self-supervised-word2vec
          locator: Sec. 15.1.2 Self-Supervised word2vec, 15.1.3 The Skip-Gram Model, 15.1.4 The CBOW Model
      references_replace: true
  quiz-214/q2:
    difficulty: easy
    fix:
      explanation: |
        The limitation meant here is that traditional pretrained embeddings such as Word2Vec cannot tell
        word senses apart: they are static, giving each word one fixed vector, so every meaning of the
        word is merged into the same embedding [^1][^3]. "Play" in "I went to a play at the theatre" and
        in "John wants to play with his friends" gets the same vector, which can mislead downstream
        models [^1]. Context-sensitive representations built from language models (ELMo, BERT) fix this
        by making a word's vector depend on its context, as with "crane" in "a crane is flying" versus
        "a crane driver came" [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/14-Embeddings/README.md#contextual-embeddings
          locator: 'Lesson: Embeddings, sec. Contextual Embeddings'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html#from-context-independent-to-context-sensitive
          locator: Sec. 15.8.1 From Context-Independent to Context-Sensitive
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 5 Embeddings
          url: https://web.stanford.edu/~jurafsky/slp3/5.pdf
          locator: Sec. 5.5 Word2vec (static embeddings)
      references_replace: true
  quiz-115/q2:
    difficulty: easy
    fix:
      explanation: |
        A language model assigns a probability to each possible next word given the words so far, so
        its basic job is to predict the next word [^2]. GPT-style text generators do exactly this by
        modelling the conditional probability $P(w_N \mid w_{N-1}, \dots, w_1)$ [^3], and language
        models can also be trained to predict words masked out of a text [^1]. "Guess" sounds close,
        but the technical term is prediction from a learned probability distribution; "use" does not
        describe a modelling task at all.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
          locator: 'Lesson: Language Modeling, introduction'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 3 N-gram Language Models
          url: https://web.stanford.edu/~jurafsky/slp3/3.pdf
          locator: Ch. 3 introduction (definition of a language model)
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#text-generation-and-perplexity
          locator: 'Lesson: Pre-Trained Large Language Models, sec. Text Generation and Perplexity'
      references_replace: true
  quiz-115/q3:
    difficulty: easy
    fix:
      explanation: |
        Language models are trained on unlabeled text in a self-supervised way: masking out a word and
        asking the model to predict it turns any text into training examples, and unlabeled text exists
        in huge amounts [^1]. The HF course says the same of GPT, BERT and T5: they are pretrained on
        large amounts of raw text, with the objective computed from the inputs, so no human labels are
        needed; labeled data comes in only later, for supervised fine-tuning on a specific task [^2]. A
        vocabulary is built from a corpus, not something the model is trained on [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/15-LanguageModeling/README.md
          locator: 'Lesson: Language Modeling, introduction'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter1/4#transformers-are-language-models
          locator: Chapter 1.4 How do Transformers work?, sec. Transformers are language models
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#vocabulary
          locator: Sec. 9.2.3 Vocabulary
      references_replace: true
  quiz-116/q1:
    difficulty: easy
    fix:
      explanation: |
        RNN stands for recurrent neural network. It reads a sequence one token at a time and passes the
        state it produces back into the network along with the next token [^1]. That loop is the
        "recurrence": the hidden state at step $t$ is computed from the input at step $t$ and the hidden
        state at step $t-1$ [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md
          locator: 'Lesson: Recurrent Neural Networks (introduction)'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#recurrent-neural-networks-with-hidden-states
          locator: Sec. 9.4.2 Recurrent Neural Networks with Hidden States
      references_replace: true
  quiz-216/q1:
    difficulty: easy
    fix:
      explanation: |
        In an LSTM the input gate takes information from the current input and the hidden vector and
        writes it into the cell state [^1]. The forget gate decides which parts of the state to keep or
        erase, and the output gate decides how much of the cell's memory shows up in the output at this
        step [^1][^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/16-RNN/README.md#long-short-term-memory-lstm
          locator: 'Lesson: Recurrent Neural Networks, Long Short Term Memory (LSTM)'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-modern/lstm.html#input-gate-forget-gate-and-output-gate
          locator: Sec. 10.1.1.2 Input Gate, Forget Gate, and Output Gate
      references_replace: true
  quiz-117/q2:
    difficulty: easy
    fix:
      explanation: |
        In the lesson's map of recurrent architectures, one-to-one is the ordinary neural network with
        a single input and a single output [^1]. One-to-many turns one input into a sequence (for
        example image captioning), and sequence-to-sequence (many-to-many) maps an input sequence to an
        output sequence, as in machine translation [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
          locator: 'Lesson: Generative networks (architecture patterns)'
      references_replace: true
  quiz-117/q3:
    difficulty: easy
    fix:
      explanation: |
        A generative RNN is trained to output, for each input character, the next character of the
        text, so the target sequence is the input shifted by one position [^1][^2]. To generate, it
        starts from a prompt and produces one character at a time, feeding each new character and the
        state back in to get the next one [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/17-GenerativeNetworks/README.md
          locator: 'Lesson: Generative networks (training and inference)'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html#rnn-based-character-level-language-models
          locator: Sec. 9.4.3 RNN-Based Character-Level Language Models
      references_replace: true
  quiz-118/q2:
    difficulty: easy
    fix:
      explanation: |
        BERT stands for Bidirectional Encoder Representations from Transformers [^1][^2]. It is a stack
        of Transformer encoder layers (12 in BERT-base, 24 in BERT-large), pre-trained on a large text
        corpus by predicting masked words [^1][^2]. The distractors change "Encoder" to "Encoded" or
        "Representations" to "Representatives".
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/18-Transformers/README.md#bert
          locator: 'Lesson: Attention Mechanisms and Transformers, BERT'
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-pretraining/bert.html
          locator: Sec. 15.8 Bidirectional Encoder Representations from Transformers (BERT)
      references_replace: true
  quiz-119/q2:
    difficulty: easy
    fix:
      explanation: |
        An entity can span several tokens. In "Tricuspid valve regurgitation and lithium carbonate
        toxicity", the first disease name has three tokens and the chemical has two [^1]. That is why
        NER uses BIO tagging: B- marks the first token of an entity, I- the tokens inside it, and O all
        other tokens [^1][^2]. Proper names such as "New York City" or "Stanford University" are typical
        multiword entities [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#ner-as-token-classification
          locator: 'Lesson: Named Entity Recognition, sec. NER as Token Classification'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
          url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
          locator: Ch. 18 introduction and Sec. 18.3 (BIO tagging)
      references_replace: true
  quiz-219/q2:
    difficulty: easy
    fix:
      explanation: |
        Because NER is token classification, any network that outputs one prediction per token can do
        it. The lesson trains an LSTM, a recurrent network, and its assignment then moves on to the BERT
        Transformer [^1]. The HF course fine-tunes BERT for NER on the CoNLL-2003 dataset [^2], and d2l
        shows how BERT's representation of every token is fed into a shared output layer to tag it [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/19-NER/README.md#training-ner-models
          locator: 'Lesson: Named Entity Recognition, secs. Training NER models and Assignment'
        - source: hf-llm-course
          url: https://huggingface.co/learn/llm-course/chapter7/2#the-conll-2003-dataset
          locator: Chapter 7.2 Token classification, introduction and sec. The CoNLL-2003 dataset
        - source: d2l
          url: https://d2l.ai/chapter_natural-language-processing-applications/finetuning-bert.html#text-tagging
          locator: Sec. 16.6.3 Text Tagging
      references_replace: true
  quiz-120/q1:
    difficulty: easy
    fix:
      explanation: |
        GPT stands for Generative Pre-trained Transformer [^1]. Each word describes the model:
        it generates text, it is first pre-trained as a language model on large amounts of unlabeled
        text, and its backbone is a Transformer (specifically a Transformer decoder) [^2]. The other
        expansions are invented.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
          locator: 'Lesson: Pre-Trained Large Language Models, introduction'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-and-gpt-2
          locator: Sec. 11.9.3 Decoder-Only, 11.9.3.1 GPT and GPT-2
      references_replace: true
  quiz-120/q3:
    difficulty: easy
    fix:
      explanation: |
        GPT uses a Transformer decoder as its backbone and is trained as an autoregressive language
        model: each token can attend only to the tokens before it, and the model learns to predict the
        next one [^2]. The HF course accordingly groups GPT-like models as auto-regressive Transformer
        models [^3], and the "T" in GPT itself stands for Transformer [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md
          locator: 'Lesson: Pre-Trained Large Language Models, introduction'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-and-gpt-2
          locator: Sec. 11.9.3 Decoder-Only, 11.9.3.1 GPT and GPT-2
