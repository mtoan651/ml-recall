items:
  "quiz-101/q1":
    drop: trivial
    comment: joke distractors (Charles Barkley, Charles Darwin); who built the first computers is history trivia with no ML concept to rewrite it around
  "quiz-101/q3":
    difficulty: easy
    fix:
      question: |
        A customer-service chatbot holds fluent text conversations, and some users cannot tell it
        apart from a human. Is it a truly intelligent system in the sense of strong AI?
      explanation: |
        Weak (narrow) AI is designed and trained for a specific task; the lesson's own examples include
        virtual assistants and chatbots built for specific customer-service tasks. Strong AI (AGI) would
        handle any intellectual task a human can, and no system has reached it yet [^1]. Fooling some
        judges is not proof either: the chatbot Eugene Goostman convinced 30% of judges in 5-minute chats
        by pretending to be a 13-year-old boy, yet that did not mean an intelligent system had been built;
        its creators, not the program, fooled the judges [^2]. Following rules does not make a system
        strong AI, and modern assistants are in fact hybrids that use neural networks to recognise
        speech and intent [^3].
      options:
        - text: 'No: it is narrow AI built for one task, and fooling some people does not prove general intelligence'
          correct: true
        - text: 'Yes: any program that some people mistake for a human has passed the Turing test and is therefore strong AI'
        - text: 'Yes: chatbots follow explicit rules, and a rule-following program counts as strong AI'
        - text: 'No: chatbots can only be built from hand-written rules, never from neural networks'
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#weak-ai-vs-strong-ai
          locator: 'Lesson: Introduction to AI, sec. Weak AI vs. Strong AI'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#the-definition-of-intelligence-and-the-turing-test
          locator: 'Lesson: Introduction to AI, sec. The Definition of Intelligence and the Turing Test'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/1-Intro/README.md#a-brief-history-of-ai
          locator: 'Lesson: Introduction to AI, sec. A Brief History of AI ("talking programs")'
      references_replace: true
  "quiz-102/q3":
    difficulty: easy
    fix:
      question: |
        In the DIKW (data, information, knowledge, wisdom) pyramid used in symbolic AI, how does
        information become knowledge?
      explanation: |
        Knowledge is what we hold in our head as our understanding of the world, and it is obtained by
        an active learning process that integrates the information we receive into our model of the
        world [^1]. Something recorded on a physical medium and passed between people is *data*, the
        bottom level, and merely interpreting what we read or hear gives only *information* [^1].
        Meta-knowledge about how and when to use knowledge is the level above it, *wisdom* [^1].
      shuffle: true
      options:
        - text: Through an active learning process that integrates the information into our model of the world
          correct: true
        - text: By being recorded on a physical medium, such as written text, so that it can be passed between people
        - text: Passively, the moment we read or hear it, without connecting it to anything we already know
        - text: By adding meta-knowledge about how and when the knowledge should be used
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
          locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (DIKW pyramid)'
      references_replace: true
  "quiz-202/q1":
    difficulty: medium
    fix:
      question: |
        Knowledge representations can be arranged on a spectrum, from forms that a computer can use
        directly to forms that are very expressive but hard to reason with automatically. Which
        representation sits at the simple end of this spectrum?
      explanation: |
        The simplest representation is algorithmic: the knowledge is encoded as a computer program,
        which a computer can use directly but which is inflexible, because the knowledge in our heads is
        often not algorithmic [^1]. Natural-language text is the other end of the spectrum: the most
        powerful form, but one that cannot be used for automatic reasoning [^1]. Frames sit in between:
        a hierarchical representation in which objects have slots with default values or restrictions,
        organised like classes in object-oriented programming [^2].
      options:
        0: 'Algorithmic: the knowledge is written directly as a computer program'
        1: Natural-language text, such as a textbook that explains the domain to people
        2: Frames with slots, default values and inheritance
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#knowledge-representation
          locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Knowledge Representation (spectrum)'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#classifying-computer-knowledge-representations
          locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Classifying Computer Knowledge Representations'
      references_replace: true
  "quiz-202/q2":
    difficulty: medium
    fix:
      type: single
      question: In knowledge representation, what is a *scenario*?
      explanation: |
        Scenarios belong to the hierarchical representations: they are a special kind of frame (an
        object with slots) used for complex situations that can unfold in time [^1]. Production rules
        are procedural representations, object-attribute-value triplets are a way to store a network
        (semantic-net) representation, and Horn clauses are the computable subset of predicate logic
        used by Prolog [^1].
      options:
        - text: A special kind of frame that represents a complex situation unfolding in time
          correct: true
        - text: An if-then production rule that draws a conclusion when its condition holds
        - text: A list of object-attribute-value triplets that encodes a semantic network
        - text: A Horn clause, the subset of predicate logic used in Prolog
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#classifying-computer-knowledge-representations
          locator: 'Lesson: Knowledge Representation and Expert Systems, sec. Classifying Computer Knowledge Representations'
      references_replace: true
  "quiz-202/q3":
    difficulty: medium
    fix:
      question: How does *forward* inference work in a rule-based expert system?
      explanation: |
        Forward inference starts with the initial data in working memory and loops: stop if the target
        attribute is present, otherwise collect the rules whose conditions are satisfied (the conflict
        set), pick one by a conflict-resolution strategy, apply it and add the new fact [^1]. Starting
        from the goal and recursively proving the conditions of a rule that concludes it, asking the
        user when no rule applies, is backward inference [^1]. An expert system's knowledge base is
        extracted from human experts rather than learned by gradient descent, and it reasons with rules
        instead of looking answers up in a table [^1].
      options:
        - text: It starts from the facts in working memory and keeps firing rules whose conditions hold, adding conclusions, until the goal is known
          correct: true
        - text: It starts from the goal, picks a rule that concludes it and tries to prove that rule's conditions as sub-goals, asking the user for missing values
        - text: It asks the user for the value of every attribute first and then looks the answer up in a table of all cases
        - text: It adjusts a weight for each rule by gradient descent on solved example cases
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/2-Symbolic/README.md#forward-vs-backward-inference
          locator: 'Lesson: Knowledge Representation and Expert Systems, secs. Expert Systems and Forward vs. Backward Inference'
      references_replace: true
  "quiz-103/q1":
    difficulty: medium
    fix:
      type: short_answer
      question: |
        A perceptron outputs $+1$ if $w^\top x \ge 0$ and $-1$ otherwise. When it misclassifies a
        training example $x$ with target $t \in \{-1, +1\}$, it updates $w \leftarrow w + \eta\, t\, x$.
        With $w = (1, -1)$ and $\eta = 1$, it receives the positive example $x = (1, 2)$, $t = +1$.
        What is $w$ after this step?
      explanation: |
        The perceptron is trained by gradient descent on the perceptron criterion, which sums
        $-w^\top x_i t_i$ over the misclassified examples; its gradient step becomes
        $w \leftarrow w + \eta\, x_i t_i$ [^1]. Here $w^\top x = 1 \cdot 1 + (-1) \cdot 2 = -1 < 0$, so the
        perceptron outputs $-1$ for a positive example and must update: $w = (1, -1) + (1, 2) = (2, 1)$.
        The new weights give $w^\top x = 4 \ge 0$, so this example is now classified correctly. A correctly
        classified example would leave $w$ unchanged [^1].
      options: []
      answer:
        accept:
          - (2, 1)
        pattern: \(?\s*2\s*(?:[,;]|\s)\s*1\s*\)?
        hint: Two numbers, e.g. (0, 3)
        model: $w^\top x = 1 - 2 = -1 < 0$, so the positive example is misclassified and $w \leftarrow (1, -1) + 1 \cdot (+1) \cdot (1, 2) = (2, 1)$.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/03-Perceptron/README.md#training-the-perceptron
          locator: 'Lesson: Introduction to Neural Networks: Perceptron, sec. Training the Perceptron'
      references_replace: true
  "quiz-204/q2":                        # "binary loss" is not a standard term
    difficulty: medium
    fix:
      question: |
        Two losses for classification are the 0-1 loss, which counts misclassified examples (it is
        essentially one minus the accuracy), and the logistic loss. Why are neural networks trained by
        minimising the logistic loss rather than the 0-1 loss?
      explanation: |
        Training minimises the loss by gradient descent, which needs the derivative of the loss with
        respect to the parameters [^1]. The 0-1 loss is essentially the model's accuracy [^1], and
        accuracy is hard to optimise directly because it is not differentiable [^2]: a small change of
        the weights either flips no prediction (zero gradient) or flips one (a jump). It is a
        classification loss, not a regression one [^1], and it needs only hard class predictions; a
        network can output class probabilities anyway through softmax [^1]. The logistic loss is used
        because it is smooth, not because it guarantees the best test accuracy.
      options:
        - text: The 0-1 loss changes only in jumps, so it gives gradient descent no useful gradient
          correct: true
        - text: The 0-1 loss is a regression loss, so it cannot be computed from class labels
        - text: The 0-1 loss needs predicted probabilities for every class, which a neural network cannot output
        - text: The logistic loss always gives a higher test accuracy than any other loss
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#formalization-of-machine-learning
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, secs. Formalization of Machine Learning and Gradient Descent Optimization'
        - source: d2l
          url: https://d2l.ai/chapter_linear-classification/classification.html#accuracy
          locator: Sec. 4.3.2 Accuracy
      references_replace: true
  "quiz-204/q3":
    topic: information-theory
    difficulty: medium
    fix:
      type: single
      question: |
        Cross-entropy $H(p, q) = -\sum_j p_j \log q_j$ is the usual classification loss, with $p$ the
        target distribution and $q$ the model's predicted distribution. Which statement about it is
        true?
      explanation: |
        The cross-entropy from $p$ to $q$ is the expected surprisal of an observer who believes $q$ while
        the data come from $p$; its lowest possible value is reached at $q = p$, where
        $H(p, p) = H(p)$ [^1]. So it behaves like a dissimilarity and training minimises it [^1]. That
        minimum is the entropy $H(p)$, which is $0$ only for a one-hot target, not for every $p$. It is
        not symmetric: for $p = (1, 0)$ and $q = (0.5, 0.5)$, $H(p, q) = \log 2$, but $H(q, p)$ is
        infinite because it takes $\log 0$ [^1].
      options:
        - text: For a fixed $p$ it is smallest at $q = p$, so lower values mean a prediction closer to the target
          correct: true
        - text: It measures how similar the two distributions are, so training should make it as large as possible
        - text: It is symmetric, $H(p, q) = H(q, p)$, so it is a true distance between distributions
        - text: It equals $0$ whenever the prediction matches the target ($q = p$), for every $p$
      references:
        - source: d2l
          url: https://d2l.ai/chapter_linear-classification/softmax-regression.html#cross-entropy-revisited
          locator: Sec. 4.1.3.3 Cross-Entropy Revisited
      references_replace: true
  "quiz-105/q1":
    difficulty: easy
    fix:
      type: single
      question: Why do deep learning frameworks such as PyTorch and TensorFlow support running computations on GPUs or TPUs?
      explanation: |
        A framework has to do two things: operate on tensors and compute gradients for gradient
        descent [^1]. Deep network training requires a very large amount of computation, so being able
        to parallelise it on GPUs or other specialised units such as TPUs is very important [^1]. Both
        TensorFlow and PyTorch run the same tensor and gradient operations on CPU and GPU [^1], so the
        GPU makes training faster, not more exact, and backpropagation works on either device. Training
        still uses minibatches drawn from the dataset (stochastic gradient descent) [^2].
      options:
        - text: Training needs a huge number of tensor operations, and a GPU or TPU can run many of them in parallel
          correct: true
        - text: Only a GPU can compute exact gradients; on a CPU, the framework can only approximate them numerically
        - text: A GPU holds the whole dataset in its memory, so minibatches are no longer needed
        - text: Backpropagation is defined only for code that runs on a GPU
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md
          locator: 'Lesson: Neural Network Frameworks, introduction'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/04-OwnFramework/README.md#gradient-descent-optimization
          locator: 'Lesson: Introduction to Neural Networks. Multi-Layered Perceptron, sec. Gradient Descent Optimization'
      references_replace: true
  "quiz-105/q2":
    topic: training
    difficulty: medium
    fix:
      explanation: |
        A model with more parameters than the data can support can pass through every training point
        (training error 0) while its validation error is high. The lesson lists "too powerful model"
        as a cause of overfitting, next to too little training data and noisy input data [^1]. More
        training data works the other way: increasing the amount of training data is one of the
        lesson's ways to prevent overfitting [^1]. Test data is held out and only used to measure an
        already-trained, fixed model, so having little of it does not cause overfitting [^2].
      options:
        2: Too much training data
      why:
        0: Test data is only used to measure the finished model, so its size does not change what the model learns.
        2: More training data makes overfitting less likely; adding data is one of the lesson's remedies.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#why-overfitting-occurs
          locator: 'Lesson: Neural Network Frameworks, Overfitting (Why overfitting occurs; How to prevent overfitting)'
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/generalization.html
          locator: Sec. 3.6.1 Training Error and Generalization Error
      references_replace: true
  "quiz-105/q3":
    topic: ml-basics
    difficulty: easy
    fix:
      question: In the bias-variance view of a model's error, what causes *bias* error?
      explanation: |
        Bias error comes from an algorithm that cannot capture the relationship in the training data,
        typically because the model is not powerful enough; this is underfitting [^1]. Approximating the
        noise in the data instead of the meaningful relationship is variance error, i.e. overfitting
        [^1]. Noise that no model can remove is a third term of the decomposition, the irreducible error,
        which is neither bias nor variance [^2]; hardware limits are not part of the decomposition at
        all.
      options:
        - text: The model is not powerful enough to capture the real relationship in the data, so it underfits
          correct: true
        - text: The model fits the random noise in the training data instead of the real relationship, so it overfits
        - text: The computer does not have enough memory to train the model to convergence
        - text: The labels contain random noise that no model could ever remove
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md#overfitting-and-bias-variance-tradeoff
          locator: 'Lesson: Neural Network Frameworks, sec. Overfitting and Bias-Variance Tradeoff'
        - title: scikit-learn documentation
          url: https://scikit-learn.org/stable/auto_examples/ensemble/plot_bias_variance.html
          locator: 'Example: Single estimator versus bagging: bias-variance decomposition'
      references_replace: true
  "quiz-205/q1":
    difficulty: easy
    fix:
      type: short_answer
      question: |
        In Keras, a model is first configured for training with `model.compile(optimizer="adam",
        loss="sparse_categorical_crossentropy")`. Complete the call that then trains it for 5 epochs:
        `model.`{{1}}`(x_train, y_train, epochs=5)`
      explanation: |
        High-level APIs such as Keras treat a network as a sequence of layers; training usually means
        preparing the data and calling a `fit` function [^1]. In Keras, `compile` only configures the
        optimizer, loss and metrics, and `Model.fit` then trains the model for a fixed number of epochs
        (passes over the dataset) [^2].
      options: []
      answer:
        blanks:
          - accept:
              - fit
            hint: a method name
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/README.md
          locator: 'Lesson: Neural Network Frameworks, high-level APIs'
        - title: Keras documentation
          url: https://keras.io/api/models/model_training_apis/
          locator: 'Model training APIs: compile method and fit method'
      references_replace: true
  "quiz-205/q2":
    topic: neural-networks
    difficulty: easy
    fix:
      explanation: |
        For binary classification with a single sigmoid output the lesson's notebook uses binary
        cross-entropy and notes that it is the same as log loss [^1]. Google's course writes log loss
        as $-\frac{1}{N}\sum_i \left[y_i \log y_i' + (1-y_i)\log(1-y_i')\right]$ [^2], and PyTorch's
        binary cross-entropy loss has exactly the same per-example form [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/3-NeuralNetworks/05-Frameworks/IntroKerasTF.ipynb
          locator: 'Notebook: Introduction to TensorFlow/Keras, "Classification Loss Functions"'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression/loss-regularization#log_loss
          locator: 'Logistic regression: Loss and regularization, Log Loss'
        - title: torch.nn.BCELoss (PyTorch documentation)
          url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCELoss.html
