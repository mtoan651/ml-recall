  quiz-220/q2:
    difficulty: easy
    fix:
      explanation: |
        Prompt engineering means choosing the words, format and symbols of the input so that the model
        produces the desired output [^1]. Large pretrained models such as GPT can solve tasks without
        further training, in zero-shot or few-shot settings [^1]. In both cases the task is specified
        only through the prompt: a zero-shot prompt holds the task description and the input, a few-shot
        prompt also adds a few solved input-output examples, and no parameters are updated (in-context
        learning) [^2].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/5-NLP/20-LangModels/README.md#prompt-engineering
          locator: 'Lesson: Pre-Trained Large Language Models, secs. Prompt Engineering and Conclusion'
        - source: d2l
          url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/large-pretraining-transformers.html#gpt-3-and-beyond
          locator: Sec. 11.9.3.2 GPT-3 and Beyond (Fig. 11.9.7)
      references_replace: true
  quiz-121/q2:
    difficulty: easy
    fix:
      explanation: |
        Crossover is defined as a map from two genes to one, $\mathrm{crossover}: \Gamma^2 \to \Gamma$,
        that combines two parent solutions into a new valid solution [^1]. At each step the algorithm
        either applies crossover to two randomly chosen genes, keeping the child if it scores better
        than a parent, or mutates a single gene [^1]. When genes are stored as bit vectors or numeric
        sequences, crossover is usually a simple operation on those sequences [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/21-GeneticAlgorithms/README.md
          locator: 'Lesson: Genetic Algorithms, introduction (ideas, requirements and algorithm steps 2-4)'
      references_replace: true
  quiz-122/q2:
    difficulty: easy
    fix:
      explanation: |
        RL is learning by doing: an agent acts in an environment and improves its behavior from the
        rewards it gets [^1]. A board game fits this exactly. Each move is an action, the rules
        form the environment, and winning or losing is the reward. AlphaZero, for example,
        learned chess, Go and shogi through reinforcement learning [^1][^2]. Zero-shot image or
        text classification assigns a label to an input in a single step. There is no sequence of
        actions and no trial-and-error search for reward, which are the defining features of
        RL [^3].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#other-rl-tasks
          locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "Other RL Tasks"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 16.6.2 AlphaGo Zero, pp. 447–450
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, p. 1
      references_replace: true
  quiz-223/q1:
    difficulty: easy
    fix:
      explanation: |
        Multi-agent systems define an agent as an entity that lives in some environment, which it can
        perceive and act upon [^1]. The definition is deliberately broad. Agents usually share their
        environment with other agents, so they do not live alone, and they need not be intelligent:
        simple reactive agents with request-response behaviour count too [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/23-MultiagentSystems/README.md
          locator: 'Lesson: Multi-Agent Systems, introduction (definition and types of agents)'
      references_replace: true
  quiz-224/q4:
    difficulty: easy
    fix:
      explanation: |
        The Responsible AI principles tie fairness directly to model bias: a model trained on biased
        data can favour one group, so the data must be balanced and the model examined [^1]. The ML
        lesson says the same from the other side: human biases end up in training data, and a fair
        system gives the same recommendation to people in similar situations [^2]. Interpretability
        belongs to the transparency principle, and accountability is a separate principle about who
        answers for a decision [^1].
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
      references_replace: true
