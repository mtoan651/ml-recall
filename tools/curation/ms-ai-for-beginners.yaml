  "quiz-103/q1":
    fix:
      type: short_answer
      question: |
        A perceptron outputs $+1$ if $w^\top x \ge 0$ and $-1$ otherwise. When it misclassifies a
        training example $x$ with target $t \in \{-1, +1\}$, it updates $w \leftarrow w + \eta\, t\, x$.
        With $w = (1, -1)$ and $\eta = 1$, it receives the positive example $x = (1, 2)$, $t = +1$.
        What is $w$ after this step?
      answer:
        accept:
          - (2, 1)
        pattern: \(?\s*2\s*(?:[,;]|\s)\s*1\s*\)?
        hint: Two numbers, e.g. (0, 3)
        model: $w^\top x = 1 - 2 = -1 < 0$, so the positive example is misclassified and $w \leftarrow (1, -1) + 1 \cdot (+1) \cdot (1, 2) = (2, 1)$.
      options: []
  "quiz-204/q2":                        # "binary loss" is not a standard term
    fix:
      question: |
        Two losses for classification are the 0-1 loss, which counts misclassified examples (it is
        essentially one minus the accuracy), and the logistic loss. Why are neural networks trained by
        minimising the logistic loss rather than the 0-1 loss?
      options:
        - text: The 0-1 loss changes only in jumps, so it gives gradient descent no useful gradient
          correct: true
        - text: The 0-1 loss is a regression loss, so it cannot be computed from class labels
        - text: The 0-1 loss needs predicted probabilities for every class, which a neural network cannot output
        - text: The logistic loss always gives a higher test accuracy than any other loss
  "quiz-204/q3":
    topic: information-theory
    fix:
      type: single
      question: |
        Cross-entropy $H(p, q) = -\sum_j p_j \log q_j$ is the usual classification loss, with $p$ the
        target distribution and $q$ the model's predicted distribution. Which statement about it is
        true?
      options:
        - text: For a fixed $p$ it is smallest at $q = p$, so lower values mean a prediction closer to the target
          correct: true
        - text: It measures how similar the two distributions are, so training should make it as large as possible
        - text: It is symmetric, $H(p, q) = H(q, p)$, so it is a true distance between distributions
        - text: It equals $0$ whenever the prediction matches the target ($q = p$), for every $p$
