  quiz-209/q1:
    fix:
      type: multiple
      question: Which of the following are properties of autoencoders?
      shuffle: true
      options:
        0: 'They are data-specific: they work well only on data similar to their training data'
        1: They can be trained on unlabeled data
        2: 'They are lossless: the reconstruction is an exact copy of the input'
      why:
        2: Autoencoders are lossy. The reconstruction is close to the input but degraded, and the loss function decides what is lost [^1][^2].
      correct:
        - 0
        - 1
  quiz-209/q3:
