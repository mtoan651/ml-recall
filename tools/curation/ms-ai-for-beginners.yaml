# Curation for ms-ai-for-beginners (see docs/content-pipeline.md#curation).
# Refs: quiz-<quiz id>/q<n>, 1-based; quiz 1xx = pre-lecture, 2xx = post-lecture of lesson xx.
# Unlisted items are kept with the lesson's default topic.
# Reviewed 2026-10-09 — 92 of 145 kept; re-reviewed 2026-10-11 under keep-and-fix — 141 kept
