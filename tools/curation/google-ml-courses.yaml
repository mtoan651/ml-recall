# Curation for google-ml-courses (see docs/content-pipeline.md#curation).
# Refs: <course>/<page>#q<n>, 1-based per page. Items flagged `image` or `context` need
# `keep: true` or a `fix` to stay.
# Reviewed 2026-10-11 — 38 of 41 kept; Intro to ML added the same day (10 of 11 kept: one
# regression-vs-classification item duplicates another, joke distractors replaced). The two groups below are excluded, but per-item decisions
# keep the questions that test ML knowledge (ML ethics, experiments, staleness, monitoring,
# recommenders); team planning and a duplicate stay dropped.
exclude_prefixes:
  "managing-ml-projects/": off-scope   # project management, unless an item says otherwise
  "recommendation/": off-scope         # no recommender topic; kept items go to ml-basics
items:
  intro-to-ml/supervised#q1: {difficulty: easy}
  intro-to-ml/supervised#q2:
    difficulty: easy
    fix:
      options:
        1: A model doesn't need training; it can predict as soon as its architecture is defined.
        2: Training stores the dataset, so the model can look up the answer for any new example.
      why:
        1: An untrained model has arbitrary (random or zero) parameters, so its outputs carry no information about the label.
        2: Training fits parameters that generalize to new examples; a model that only stores and looks up the training set can't answer for examples it hasn't seen.
      explanation: |
        Training adjusts the model's parameters so that it captures the relationship between the
        features and the label in labeled examples. Only then can it predict the label of new,
        unlabeled examples [^1].
  intro-to-ml/understanding#q1:
    topic: data-prep
    difficulty: easy
    fix:
      question: |
        A used-car dataset has the features make_model, year, color, miles, gearbox, tire_size,
        wheel_base and height. Which three are likely the strongest predictors of a car's price?
      explanation: |
        Google's introduction to ML picks make_model, year and miles: they say what the car is, how old
        it is and how much it has been driven, which drive most of its price [^1]. Color, height,
        gearbox, tire size and wheel base are, by comparison, weak predictors of price [^1].
      references:
        - source: google-ml-courses
          locator: Introduction to Machine Learning, Test your understanding (car-price question)
          url: https://developers.google.com/machine-learning/intro-to-ml/understanding
      references_replace: true
  intro-to-ml/understanding#q2:
    difficulty: easy
    fix:
      question: |
        A website logs how each visitor browses (pages viewed, time on site, purchases), but no
        column says what kind of user each visitor is. To discover the types of users that visit
        the site, would you use supervised or unsupervised learning?
      options:
        - text: Unsupervised learning.
          correct: true
        - text: Supervised learning, because I'm trying to predict which class a user belongs to.
          why: In supervised learning, the dataset must contain the label you're trying to predict. Here no column gives a category of user.
        - text: Reinforcement learning, because users interact with the site.
          why: Reinforcement learning learns a policy from rewards for actions; here we only want to find groups in recorded data.
  intro-to-ml/understanding#q3:
    difficulty: easy
    fix:
      question: |
        A dataset lists houses with their square footage, location, year built and the kilowatt
        hours they use per year. What type of ML would you use to predict the yearly kilowatt hours
        of a newly constructed house?
      explanation: |
        Supervised learning trains on labeled examples [^1]. In this dataset the kilowatt hours used
        per year is the label, because it is the value you want the model to predict, and square
        footage, location and year built are the features [^1]. The existing houses have known
        usage, so they are labeled training examples; the new house is only the input you predict for.
      options:
        1: Unsupervised learning, because the new house has no recorded energy usage yet.
      why:
        1: The new house is only the example you predict for. The model trains on the other houses, whose yearly usage is known, so they are labeled examples.
  intro-to-ml/understanding#q4:
    drop: duplicate
    comment: same regression-vs-classification point as intro-to-ml/what-is-ml#q2 (a numeric target)
  intro-to-ml/understanding#q5:
    difficulty: easy
    fix:
      question: |
        A flight dataset has the columns `departure_airport`, `destination_airport`, `date`,
        `time_of_day`, `airline`, `fuel_price` and `airplane_ticket_cost` (the ticket price). Could
        you train a classification model on it to classify the cost of an airplane ticket as "high,"
        "average," or "low"?
      explanation: |
        Classification needs a categorical label, but a numeric column can be converted into one [^1].
        Choose thresholds that define "high," "average" and "low" (for example relative to the
        average cost of a ticket from the departure airport to the destination airport), map every
        cost to its category, and train a multiclass classifier on that label; equivalently, predict
        the cost and compare the prediction with the same thresholds [^1]. Classification models are
        not limited to two classes: with three or more they are called multiclass classification
        models [^1].
      why:
        1: A numeric column can be turned into categories by binning it with thresholds; the binned column then serves as the class label.
  intro-to-ml/understanding#q6:
    difficulty: medium
    fix:
      why:
        3: Without labels in its objective, an unsupervised method can't learn to predict the label at all, so switching approach doesn't fix poor predictions.
  intro-to-ml/what-is-ml#q1:
    difficulty: easy
    fix:
      explanation: |
        In ML, a model is a mathematical relationship, such as a function with learned parameters,
        that an ML system derives from data and then uses to make predictions on new inputs [^1].
      options:
        0: A mathematical relationship, derived from data, that an ML system uses to make predictions
        1: The collection of labeled training examples that the ML system learns from
        2: A smaller, simplified representation of the thing you're studying
      why:
        1: The data is what a model is learned from; the model is the learned relationship that maps inputs to predictions.
        2: That is a model in the everyday sense, like a scale model. In ML, a model maps inputs (features) to predictions.
  intro-to-ml/what-is-ml#q2: {difficulty: easy}
  intro-to-ml/what-is-ml#q3: {difficulty: easy}
  "clustering/dnn-clustering/check-your-understanding#q1":
    difficulty: medium
    fix:
      question: In the figure below, vectors `a`, `b` and `c` start at the same origin. If you want `b` to be more similar to `a` than to `c`, which similarity measure should you pick?
      explanation: The dot product is proportional to both the cosine and the lengths of vectors. So even though the cosine is higher for the angle formed by `b` and `c` than for the angle formed by `b` and `a`, the greater vector length of `a` makes the dot product of `a` and `b` greater than the dot product of `b` and `c`. [^1]
      figure:
        src: ./clustering/clustering-011.svg
        alt: 'Three line segments from a common origin: a long, nearly vertical one ending at point a, and two short ones ending at points b and c, close together and to the right. The angle between a and b (θab) is much larger than the angle between b and c (θbc).'
      why:
        2: The distance $\lVert b - c \rVert$ is smaller than $\lVert a - b \rVert$, leaving `b` closer to `c` than to `a`.
  "clustering/dnn-clustering/check-your-understanding#q3":
    difficulty: medium
    fix:
      question: Music-video embeddings have lengths proportional to the videos' popularity. You switch the similarity measure from dot product to cosine. How does similarity between music videos change?
  "clustering/prepare-data#q1":
    topic: data-prep
    difficulty: medium
    fix:
      question: Assume you have enough data to create quantiles. How should you process the data distribution shown below?
      explanation: |
        The histogram rises steeply and then has a long right tail, so it is neither symmetric like a
        Gaussian nor a clean power law [^1]. Google's clustering course uses z-score normalization for
        roughly Gaussian data and a log transform only for data that follow a power law; when the data
        match no standard distribution, the default is to bin them into quantiles, which needs enough
        data (at least about 10 examples per quantile) [^1]. With quantiles, two examples are similar when
        few examples fall between them, whatever their raw values [^1].
      figure:
        src: ./data-prep/clustering-012.svg
        alt: Histogram that rises sharply to a peak at small values (around 3 to 4) and then falls off in a long tail to the right, reaching past 25.
      why:
        1: |
          You typically normalize data if:

          * The data distribution is Gaussian.
          * You have some insight into what the data represents in the real world that suggests the data shouldn't be transformed nonlinearly.

          Neither case applies here. The data distribution isn't Gaussian because it isn't symmetric. And you don't know what these values represent in the real world.
      references:
        - source: google-ml-courses
          locator: Clustering, Data preparation (Quantiles; Check your understanding, question one)
          url: https://developers.google.com/machine-learning/clustering/prepare-data
      references_replace: true
  "clustering/prepare-data#q2":
    topic: data-prep
    difficulty: easy
    fix:
      question: Assume you have enough data to create quantiles. How would you process the data distribution shown below?
      explanation: |
        The histogram is symmetric and bell-shaped, so the data are roughly Gaussian. For data shaped
        like a Gaussian, the recommended transform is normalization: compute z-scores [^1]. Quantiles
        are the default when the data do not match any known distribution, and a log transform is
        meant for data that follow a power law [^1].
      figure:
        src: ./data-prep/clustering-013.svg
        alt: Histogram of a symmetric, bell-shaped distribution centred at 0, spanning about −15 to 15.
      why:
        1: Quantiles are the default for data that match no standard distribution; this one is Gaussian, so normalization is preferred [^1].
        2: A log transform is only for power-law distributions, and this one is a symmetric bell [^1].
      references:
        - source: google-ml-courses
          locator: Clustering, Data preparation (Z-scores; Check your understanding, question two)
          url: https://developers.google.com/machine-learning/clustering/prepare-data
      references_replace: true
  "decision-forests/decision-trees-mce#q3":
    difficulty: easy
    fix:
      question: Which of the following decision trees matches the prediction map shown below?
      explanation: 'The map is split first at $x_1 = 1$: everything to the left is blue, and only on the right does $x_2$ matter, with orange above $x_2 = 0.5$ and green below. Tree A tests $x_1 \ge 1$ at the root, sends "no" to blue, and splits the right side on $x_2 \ge 0.5$ into orange and green, so it reproduces all three regions [^1]. Tree B tests $x_2 \ge 0.5$ first and labels everything below 0.5 blue, but the bottom-right region is green. Tree C sends $x_1 < 1$ to orange, but that region is blue.'
      figure:
        src: ./trees-ensembles/trees-ensembles-020.svg
        alt: 'Prediction map with x1 from 0 to 2 and x2 from 0 to 1: the region x1 < 1 is blue (square), the region x1 ≥ 1 and x2 ≥ 0.5 is orange (triangle), and the region x1 ≥ 1 and x2 < 0.5 is green (circle).'
      options:
        - text: Decision Tree A.
          correct: true
          image:
            src: ./trees-ensembles/trees-ensembles-020-a.svg
            alt: 'Decision tree A: the root tests x1 ≥ 1. No → leaf blue ■. Yes → a node testing x2 ≥ 0.5: yes → orange ▲, no → green ●.'
        - text: Decision Tree B.
          why: If the condition x2 ≥ 0.5 is no, then the leaf may or may not be blue, so this is a bad condition.
          image:
            src: ./trees-ensembles/trees-ensembles-020-b.svg
            alt: 'Decision tree B: the root tests x2 ≥ 0.5. No → leaf blue ■. Yes → a node testing x1 ≥ 1: yes → orange ▲, no → green ●.'
        - text: Decision Tree C.
          why: If x1 is not ≥ 1.0, then the leaf should be 'blue' rather than 'orange', so this is the wrong leaf.
          image:
            src: ./trees-ensembles/trees-ensembles-020-c.svg
            alt: 'Decision tree C: the root tests x1 ≥ 1. No → leaf orange ▲. Yes → a node testing x2 ≥ 0.5: yes → green ●, no → blue ■.'
  "decision-forests/random-forests-mce#q1":
    difficulty: hard
    fix:
      question: Which of the following random forest hyperparameters could be tuned to improve the quality of the model?
      explanation: |
        Maximum depth is worth tuning: pure random forests grow unlimited trees, but in practice
        capping depth (and leaf size) helps, and Google's Decision Forests course lists it among the
        hyperparameters to tune [^1]. The number of features sampled at each node is an important
        regularisation knob; fewer candidates make the trees more independent and cut variance, at the
        cost of more bias [^1][^2]. The number of trees is the trap: adding trees almost never makes a
        random forest worse, because its test error levels off at a limit instead of rising [^1][^3],
        so you set it as high as compute allows instead of searching for an optimum (scikit-learn's
        advice is simply "the larger the better" [^2]). The bagging sample size is normally kept equal
        to the training-set size, because training each tree on more or fewer examples tends to
        degrade the forest [^1].
      why:
        1: More trees almost never hurt; the error just levels off, so the count is set by compute budget, not tuned for quality [^1][^3].
        3: Each tree is normally trained on a bootstrap sample as large as the training set; Google's course reports that more or fewer examples per tree tends to degrade the forest [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/random-forests#disabling_decision_tree_regularization
          locator: "Decision Forests: Random forests, sections 'Bagging', 'Attribute sampling', 'Disabling decision tree regularization' and 'The clarity of noise'"
        - title: 'scikit-learn User Guide: Ensembles'
          url: https://scikit-learn.org/stable/modules/ensemble.html#parameters
          locator: Sec. 1.11.2.3 Parameters (random forests and extra-trees)
          quote: The larger the better, but also the longer it will take to compute.
        - title: Breiman, Random Forests (UC Berkeley technical report, Jan. 2001)
          url: https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf
          locator: Sec. 2.1 Random Forests Converge, Theorem 1.2, p. 4
          quote: This result explains why random forests do not overfit as more trees are added, but produce a limiting value of the generalization error.
      references_replace: true
  "decision-forests/variable-importances-mce#q1":
    difficulty: medium
    fix:
      explanation: |
        The two importances measure different things on different scales [^1]. "Sum of the split
        score" adds up the scores (such as information gain) of all conditions that use the feature,
        while "number of nodes" just counts those conditions [^1]. Comparing one feature's summed
        gain with another feature's node count is like comparing kilograms with metres, so neither
        "more" nor "less" important follows. Rank features with a single measure, and even then
        expect different measures to disagree [^1]. For example, a feature used in many nodes but
        with low permutation importance may be one the model fails to generalise from, and
        impurity-based scores are known to favour features with many distinct values [^1][^2].
      options:
        0: f1 is more important than f2, because its importance value is larger.
        1: f1 is less important than f2, because summed split scores are inflated.
        2: 'Neither: the two importance values cannot be compared.'
      why:
        0: The two values are on different scales, a sum of split scores versus a count of nodes, so comparing them says nothing [^1].
        1: Neither measure is inflated relative to the other; they measure different things and simply cannot be compared [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/variable-importances#variable_importances
          locator: 'Decision Forests: Variable importances'
        - title: 'scikit-learn User Guide: Ensembles'
          url: https://scikit-learn.org/stable/modules/ensemble.html#feature-importance-evaluation
          locator: Sec. 1.11.2.5 Feature importance evaluation (warning box)
      references_replace: true
  "gan/generative#q1":
    difficulty: medium
    fix:
      question: |
        You have IQ scores for 1000 people. You model the distribution of IQ scores with the following procedure:

        1. Roll three six-sided dice.
        2. Multiply the total of the roll by a constant $w$.
        3. Repeat 100 times and take the average of all the results.

        You try different values for $w$ until the result of your procedure equals the average of the real IQ scores. Is your model a generative model or a discriminative model?
      explanation: |
        Generative models capture the distribution of the data itself, $p(X)$ (or $p(X, Y)$ with labels),
        and can create new instances; discriminative models capture $p(Y \mid X)$ and only tell instances
        apart [^1]. Each roll of the three dice, multiplied by $w$, generates the IQ of an imaginary person,
        so the procedure is a (crude) generative model of IQ scores. It even captures the roughly
        bell-shaped distribution of IQ scores, since the total of three dice clusters around its mean [^1].
      why:
        1: A discriminative model learns $p(Y \mid X)$ and tells instances apart, for example classifying an IQ score as real or fake; this procedure assigns no labels but produces new IQ-like values [^1].
        2: The procedure produces new instances of the data, which is exactly what defines a generative model [^1].
  "problem-framing/problem#q3":
    difficulty: medium
    fix:
      explanation: |
        The course's checks are: a clearly stated goal, a non-ML baseline to compare against, and
        data whose features can predict the label [^1]. The goal here is clear. The heuristic is
        already known to fall short, because it assumes every call takes about 10 minutes when
        resolution times run from 2 to over 45 minutes depending on the issue [^1]. Columns such as
        `user_issue` and call volume plausibly correlate with `time_on_hold`, so the data look
        predictive [^1]. Google's Rules of ML also advise moving to ML once you have data and a
        clear goal, rather than patching together a complex heuristic that becomes hard to
        maintain [^2]. One caveat from the same page: a column like `time_to_resolve` can be used as
        a feature only if its value is available at prediction time [^1].
      why:
        1: The heuristic is already known to fall short, since resolution times range from 2 to over 45 minutes, and columns such as `user_issue` and the call volume plausibly predict the hold time.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/problem#check-your-understanding_5
          locator: "Problem Framing: Understand the problem, 'Clear use case for ML', 'Predictive ML and data' and the third 'Check Your Understanding'"
        - title: 'Rules of Machine Learning: Best Practices for ML Engineering (Zinkevich, Google)'
          url: https://developers.google.com/machine-learning/guides/rules-of-ml#rule_3_choose_machine_learning_over_a_complex_heuristic
          locator: 'Rule #3: Choose machine learning over a complex heuristic'
      references_replace: true
  decision-forests/decision-trees-mce#q2:
    difficulty: easy
    fix:
      question: In a decision tree, do all conditions involve only a single feature?
      explanation: |
        No. An axis-aligned condition involves a single feature, such as `num_legs ≥ 2`, while an
        oblique condition involves several, such as `num_legs ≥ num_fingers` [^1][^2]. Trees are often
        trained with axis-aligned conditions only, but oblique conditions are allowed: they are more
        powerful and can express more complex patterns, at a higher training and inference cost [^2].
      why:
        0: Oblique conditions test multiple features.
      references:
        - source: google-ml-courses
          locator: 'Decision trees: Check your understanding, Question 2'
          url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce
        - source: google-ml-courses
          locator: 'Decision Forests: Types of conditions, Axis-aligned vs. oblique conditions'
          url: https://developers.google.com/machine-learning/decision-forests/conditions
      references_replace: true
  decision-forests/overfitting-mce#q2:
    difficulty: medium
    fix:
      question: What operations can reduce overfitting in a decision tree known to be overfitted (for example, by evaluating it on a test dataset)?
      explanation: |
        Each correct option makes the tree stop growing earlier, which is how a single decision tree
        is regularised [^1]. A lower maximum depth limits how many conditions the tree can stack
        [^1][^3]. A higher minimum number of examples per leaf stops the tree from carving out tiny
        groups that mostly reflect noise [^1][^3]. A higher minimum gain (scikit-learn's
        `min_impurity_decrease`) refuses any split whose impurity decrease is below the threshold,
        so weak, noise-driven splits are never made [^2]. The three opposite moves (deeper trees,
        smaller leaves, a lower gain threshold) let the tree grow further and fit even more noise,
        which makes overfitting worse [^3].
      why:
        0: A deeper tree can carve out smaller, noisier regions, which makes overfitting worse [^1][^3].
        3: Smaller leaves let the tree fit tiny groups of examples, which mostly reflect noise [^1][^3].
        5: A lower threshold accepts weaker splits, so the tree grows further and fits more noise [^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/overfitting-and-pruning#overfitting_and_pruning
          locator: 'Decision Forests: Overfitting and pruning'
        - title: 'scikit-learn User Guide: Decision Trees'
          url: https://scikit-learn.org/stable/modules/tree.html#mathematical-formulation
          locator: Sec. 1.10.7 Mathematical formulation (stopping conditions)
        - title: 'scikit-learn User Guide: Decision Trees'
          url: https://scikit-learn.org/stable/modules/tree.html#tips-on-practical-use
          locator: Sec. 1.10.5 Tips on practical use
      references_replace: true
  decision-forests/training-mce#q1:
    difficulty: hard
    fix:
      explanation: |
        The exact splitter looks only at the order of a feature's values: it sorts them and tries a
        threshold halfway between each pair of neighbouring distinct values [^1][^3]. Negating the
        feature reverses that order, so the candidate thresholds are the old ones with their signs
        flipped, and they cut the examples into exactly the same groups with the same information
        gain [^1]. The splitter therefore picks the same partition at every node. Conditions have the
        form $\text{feature} \ge t$, so a split the old tree learned as $x \ge t$ is now learned as
        $-x \ge -t$. No example sits exactly on a midpoint threshold, so $-x \ge -t$ holds exactly
        for the examples that failed $x \ge t$: the former positive child becomes the negative child
        and vice versa. Each child still gets the same examples, so the recursion rebuilds the same
        tree with its branches mirrored [^2]. The other two options assume the split depends on the
        feature values themselves, but only their order matters [^1].
      why:
        1: 'Only the sign of each threshold flips: the same partitions are available with the same gains, so the same splits are chosen [^1].'
        2: Each child receives the same examples as before, so the tree keeps its shape [^1][^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/binary-classification
          locator: 'Decision Forests: Exact splitter for binary classification with numerical features (candidate thresholds and the closing remark on scale)'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/growing
          locator: 'Decision Forests: Growing decision trees (greedy divide-and-conquer algorithm)'
        - title: 'scikit-learn User Guide: Decision Trees'
          url: https://scikit-learn.org/stable/modules/tree.html#mathematical-formulation
          locator: Sec. 1.10.7 Mathematical formulation (best splitter)
      references_replace: true
  decision-forests/training-mce#q2:
    difficulty: hard
    fix:
      question: When the exact splitter grows a decision tree on a numerical feature, it scores every candidate threshold in a set $X$ and keeps the best one. What two answers best describe the effect of testing only half (randomly selected) of the candidate threshold values in $X$?
      explanation: |
        At each node, the splitter returns the candidate threshold in $X$ with the highest
        information gain [^1]. Searching only a random half of $X$ takes the maximum over a subset,
        so the best gain found is lower than or equal to the full search's (equal when the best
        threshold lands in the sampled half), which rules out "higher or equal" [^1]. Because each
        split then fits the training labels no better than the exact split, the tree generally ends
        up with no better training accuracy. Strictly, this is a tendency rather than a guarantee:
        greedy growth is only a heuristic, so a weaker early split can occasionally lead to a better
        tree later [^2]. Test accuracy is not necessarily worse, because random thresholds act as a
        regulariser: extremely randomized trees, which draw random thresholds and keep the best of
        them, often reduce variance at a small cost in bias [^3].
      why:
        0: A maximum over a subset of the candidates can never exceed the maximum over all of them [^1].
        2: Not necessarily. Random thresholds act as a regulariser, and extremely randomized trees often generalise as well or better [^3].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/binary-classification
          locator: 'Decision Forests: Exact splitter for binary classification with numerical features (information gain and the candidate set X)'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/growing
          locator: 'Decision Forests: Growing decision trees (NP-hardness and greedy heuristics)'
        - title: 'scikit-learn User Guide: Ensembles'
          url: https://scikit-learn.org/stable/modules/ensemble.html#extremely-randomized-trees
          locator: Sec. 1.11.2.2 Extremely Randomized Trees
      references_replace: true
  decision-forests/training-mce#q3:
    difficulty: medium
    fix:
      explanation: |
        The exact splitter does not climb the information-gain curve from a starting point, the way
        gradient ascent would. It scores every candidate threshold (the midpoints between
        consecutive sorted values) and keeps the one with the highest score [^2][^3][^4]. So a curve
        with several local maxima, which can happen [^1], causes no trouble: the global maximum over
        the candidates is the one selected. No rule prefers the smallest threshold. Only the score
        matters [^2].
      options:
        1: The algorithm would select the local maximum with the smallest threshold value.
      why:
        0: Information gain need not be unimodal in the threshold; several local maxima are possible [^1].
        1: The splitter scores every candidate and keeps the best score; nothing favours smaller thresholds [^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/training-mce#question_3
          locator: 'Decision trees: Check your understanding (Training Decision Trees), Question 3'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/growing
          locator: 'Decision Forests: Growing decision trees (selecting the condition with the highest score)'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/binary-classification
          locator: 'Decision Forests: Exact splitter for binary classification with numerical features (candidate set X)'
        - title: 'scikit-learn User Guide: Decision Trees'
          url: https://scikit-learn.org/stable/modules/tree.html#mathematical-formulation
          locator: 'Sec. 1.10.7 Mathematical formulation (best splitter: greedy exhaustive search)'
      references_replace: true
  gan/check#q1:
    difficulty: medium
    fix:
      type: true_false
      question: The discriminator network and generator network influence each other solely through the data produced by the generator and the labels produced by the discriminator. When it comes to backpropagation, they are separate networks.
      explanation: |
        During generator training, gradients propagate through the discriminator network to the
        generator network, although the discriminator does not update its weights during generator
        training [^1]. The generator's loss is computed from the discriminator's output, so
        backpropagation starts there and flows back through the discriminator into the generator;
        only the generator's weights are then changed [^2]. So the weights in the discriminator
        network influence the updates to the generator network.
      why:
        0: During generator training, gradients propagate through the discriminator network into the generator network, although the discriminator does not update its weights during generator training [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/gan/generator#using-the-discriminator-to-train-the-generator
          locator: The Generator, sec. Using the Discriminator to Train the Generator
  gan/check#q2:
    difficulty: easy
    fix:
      type: true_false
      question: A typical GAN trains the generator and the discriminator simultaneously.
      explanation: |
        A typical GAN alternates between training the discriminator and training the generator
        [^1]. The discriminator trains for one or more epochs while the generator is held constant,
        then the generator trains while the discriminator is held constant, and the two steps
        repeat [^2].
      why:
        0: A typical GAN alternates, training the discriminator while the generator is held fixed and then the other way round [^2]. Some [research](https://arxiv.org/abs/1706.04156) does study training both simultaneously.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/gan/training#alternating-training
          locator: GAN Training, sec. Alternating Training
  gan/check#q3:
    difficulty: medium
    fix:
      type: true_false
      question: A GAN always uses the same loss function for both discriminator and generator training.
      explanation: |
        It's possible for a GAN to use the same loss for both generator and discriminator training
        (or the same loss differing only in sign), but it's not required. In fact it's more common
        to use different losses for the discriminator and the generator [^1]. Even in the minimax
        and Wasserstein schemes, where both losses derive from a single distance measure, the
        generator can only affect the term for the generated data, so the two losses end up
        looking different [^2].
      why:
        0: Using the same loss (or the same loss with opposite signs) is possible but not required, and different losses for the discriminator and the generator are more common [^1][^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/gan/loss#one-loss-function-or-two
          locator: Loss Functions, sec. One Loss Function or Two?
  problem-framing/ml-framing#q1:
    difficulty: easy
    fix:
      explanation: |
        You use a proxy label when the thing you really want to predict is not recorded in the data
        and cannot be measured directly [^1]. "Feeling better", happiness and well-being are not
        observable quantities in app data. The model has to be trained on something measurable that
        should go along with them, such as weekly exercise hours, time with friends, or self-reported
        mood. The course warns that every proxy is an imperfect stand-in. Pick the one with the
        fewest problems for your use case, and check that it actually tracks the outcome you care
        about [^1].
      options:
        0: Yes. Happiness and well-being can't be measured directly, so they must be approximated by measurable signals such as weekly exercise hours.
        1: No. Happiness and well-being can be measured directly, so the app can record them and use them as labels without a stand-in.
      why:
        1: Happiness and well-being are not recorded in app data; even a self-reported mood score is only a stand-in for them, so a proxy label is unavoidable.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/ml-framing#proxy_labels
          locator: "Problem Framing: Framing an ML problem, 'Proxy labels'"
      references_replace: true
  managing-ml-projects/ethics#q1:
    topic: ai-ethics
    difficulty: easy
    fix:
      type: multiple
      question: |
        You're developing a model to quickly approve auto loans. Which of these are *ethical*
        questions you should ask about it, rather than engineering ones? Select all that apply.
      explanation: |
        ML systems should not perpetuate or reinforce biases and should not use personal data
        irresponsibly [^1]. For fairness, the course warns against features with little explanatory power
        in high-impact areas such as finance: in a loan model, an applicant's name is irrelevant but could
        let the model correlate male names with repayment [^1]. For privacy, personally identifiable
        information should be removed from datasets [^1]. Latency and on-device deployment matter for
        serving the model, but they are engineering requirements, not ethical ones.
      options:
        - text: Does the model perpetuate existing biases or stereotypes?
          correct: true
        - text: Are applicants' names left out of the features, so the model cannot link names to repayment?
          correct: true
        - text: Has personally identifiable information been removed from the training data?
          correct: true
        - text: Does the model serve predictions with low enough latency?
          why: Latency is a serving-performance requirement, an engineering question.
        - text: Can the model be deployed to devices, like phones?
          why: Running on phones is a deployment constraint, an engineering question.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/ethics
          locator: 'Managing ML Projects: AI and ML ethics and safety (Fairness, Privacy)'
      references_replace: true
  managing-ml-projects/experiments#q1:
    difficulty: medium
    fix:
      question: |
        A teammate's experiment found a combination of hyperparameters that beats the team's baseline
        metric. You are running your own experiments on a different model. What should you do?
      explanation: |
        Experiments should make a single, small change at a time, such as a new learning rate, and when a
        change improves the model, its metrics become the new baseline for later experiments [^1].
        Hyperparameters that helped one model need not help another, so copying all of them into a
        different model is not a controlled experiment. Progress is non-linear and many experiments are
        usually needed before the model is good enough for production, so one improvement over the
        baseline is a reason to keep experimenting, not to stop [^1].
      options:
        0: Maybe adopt one of those hyperparameters as a single change, but continue with your own experiments
        1: Change all the hyperparameters in your current experiment to match your teammate's
        2: Stop experimenting and put your teammate's model into production right away
      why:
        1: Hyperparameters that improved one model need not improve a different one, and changing many things at once hides which change helped.
        2: Beating the baseline does not make it the final model; further experiments may raise the baseline even more.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/experiments
          locator: 'Managing ML Projects: Experiments'
      references_replace: true
  managing-ml-projects/feasibility#q1:
    difficulty: medium
    fix:
      explanation: |
        Feasibility depends on data availability, problem difficulty, prediction quality, technical
        requirements and cost [^1]. Here most criteria are met (similar code exists, the budget fits,
        interpretability is not required), but the data is not: a classification model needs numerous
        examples for every label, and with only a few examples for some labels it cannot predict them
        well [^1]. The five most invasive species are exactly the classes the conservationists care
        about most, so the solution is not feasible until more examples of them are collected.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/feasibility
          locator: 'Managing ML Projects: Feasibility, sec. Data availability'
      references_replace: true
  managing-ml-projects/pipelines#q1:
    difficulty: easy
    fix:
      question: Which of the following models are likely to go stale quickly, so that they must be replaced regularly with models trained on newer data? Select all that apply.
      explanation: |
        As the world changes, trends in data shift and production models go stale, so they need
        retraining on up-to-date data [^1]. How fast depends on how dynamic the data is: a clothes
        recommender goes stale quickly because preferences change often, while a model that identifies
        flowers might never go stale because their identifying features are stable [^1]. Spam and fraud
        also change constantly in response to new tactics, whereas bird species, like flowers, keep their
        characteristics [^1].
      why:
        0: Spam tactics change constantly, so yesterday's training data soon stops describing today's spam.
        1: Consumer preferences for clothes change frequently, so recommendations go stale fast.
        3: Fraudsters keep changing their methods, so the patterns in older transactions soon stop applying.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
          locator: 'Managing ML Projects: ML pipelines, secs. Updating the model and Model staleness and training frequency'
      references_replace: true
  managing-ml-projects/pipelines#q2:
    difficulty: easy
    fix:
      explanation: |
        Storing datasets in version-controlled repositories makes training reproducible and lets you
        compare the prediction quality of different models [^1]. Versioned model repositories let you
        track the evaluation and prediction quality of production models and reproduce results and debug
        issues by tracing a model's datasets and dependencies, and logged predictions with their ground
        truth help monitor model quality [^1]. Versioning does not reduce the compute quota a pipeline
        needs; quota is planned separately [^1].
      why:
        2: Versioning makes results reproducible and comparable; it does not reduce the compute a pipeline needs, which is planned separately.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/pipelines
          locator: 'Managing ML Projects: ML pipelines, secs. Assets and metadata storage'
      references_replace: true
  managing-ml-projects/production#q1:
    difficulty: easy
    fix:
      type: true_false
      explanation: |
        Training and serving may run on the same or on different hardware, but in general it is common to
        train on bigger hardware and serve on smaller hardware [^1]. Hardware is chosen per pipeline by
        asking what the model's size and architecture need and whether cheaper hardware would do [^1].
        Training is usually the heavier job: it passes over the whole dataset many times and computes
        gradients, while serving runs one forward pass per request.
      options:
        0: 'True'
        1: 'False'
      why:
        0: Serving usually needs less compute than training, so it is common to serve on smaller hardware than the model was trained on.
      correct:
        - 1
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/production
          locator: 'Managing ML Projects: Productionization, sec. Provisioning compute resources'
      references_replace: true
  managing-ml-projects/production#q2:
    difficulty: medium
    fix:
      type: multiple
      question: Logging and monitoring are set up across a production ML system. Which of these should they be able to detect? Select all that apply.
      explanation: |
        Logging and monitoring let you find problems in ML pipelines before they affect users [^1]. They
        should catch skews or drifts in serving data, features and predictions, data-type problems, quota
        usage and model-quality metrics [^1]. In production you usually do not have the ground truth in
        real time, so model quality is tracked through proxies: a mail app cannot know which mail is spam
        as it arrives, but a jump in the share of mail users move to spam, say from 0.5% to 3%, signals a
        problem [^1].
      shuffle: true
      options:
        0: Skews or drifts in the serving data compared with the training data
        1: A jump in a proxy for model quality, such as the share of mail that users move to spam
        2: Quota usage that is about to reach its limit
        3: Whether each prediction was right, by checking it against its true label in real time
      why:
        3: In production the true labels usually arrive late or not at all, so correctness cannot be checked in real time; that is why quality is tracked through proxies.
      correct:
        - 0
        - 1
        - 2
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/production
          locator: 'Managing ML Projects: Productionization, sec. Logging, monitoring, and alerting'
      references_replace: true
  managing-ml-projects/success#q1:
    topic: metrics
    difficulty: easy
    fix:
      question: You plan to use an LLM as a customer-support agent to solve a clear business problem. Which of these is the best evidence that the solution is successful?
      explanation: |
        Success is measured by business metrics, which are the reason for using ML; they should be
        quantifiable and focused, like cutting the share of support cases that need a person from 72% to
        50% [^1]. Model metrics measure model quality, but great model metrics do not necessarily improve
        the business metric, so teams check the connection, e.g. by deploying to a small share of users
        [^1]. Favourable early feedback is encouraging, but it is not a quantified business metric.
      options:
        0: The share of resolved support cases that needed a human drops from 72% to 50%
        1: The LLM's evaluation metrics, such as accuracy on a support benchmark, are consistently high
        2: Feedback from the first round of user testing with real customers is very favourable
      why:
        1: Good model metrics do not guarantee better business metrics; the business metric that motivated the project has to be measured itself [^1].
        2: Early user feedback is typically more qualitative than quantitative. Success needs a quantifiable business metric [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/managing-ml-projects/success
          locator: 'Managing ML Projects: Measuring success'
      references_replace: true
  recommendation/collaborative/basics#q1:
    difficulty: easy
    fix:
      explanation: |
        Content-based filtering recommends items similar to what the user already likes, using item
        features and that user's own actions, without information about other users [^1]. Installing an
        app that is similar to the recommended one is such a signal. Collaborative filtering instead uses
        similarities between users and items at the same time, so it can recommend an item to one user
        because a similar user liked it [^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/recommendation/content-based/basics
          locator: 'Recommendation Systems: Content-based filtering, Basics'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/recommendation/collaborative/basics
          locator: 'Recommendation Systems: Collaborative filtering, Basics'
      references_replace: true
  recommendation/content-based/basics#q1:
    difficulty: easy
    fix:
      question: |
        A content-based recommender represents apps and the user in the same binary feature space
        (1 = the app has the feature, or the user has shown interest in it):

        | | Education | Casual | Health | TimeWastr | Science R Us | Healthcare |
        | --- | :-: | :-: | :-: | :-: | :-: | :-: |
        | Educational app by Science R Us | 1 | 0 | 0 | 0 | 1 | 0 |
        | Casual app by TimeWastr | 0 | 1 | 0 | 1 | 0 | 0 |
        | Health app by Healthcare | 0 | 0 | 1 | 0 | 0 | 1 |
        | **User** | 1 | 0 | 0 | 0 | 1 | 1 |

        Using the dot product as the similarity measure, which app should it recommend?
      explanation: |
        With binary vectors, the dot product $\langle x, y \rangle = \sum_i x_i y_i$ counts the features
        active in both the user and the app, so a higher value means a more similar item [^1]. The
        educational app shares Education and Science R Us with the user (score 2), the health app shares
        only Healthcare (score 1), and the casual app shares nothing (score 0). The system scores every
        candidate and recommends the highest, here the educational app [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/recommendation/content-based/basics
          locator: 'Recommendation Systems: Content-based filtering, Basics (sec. Using dot product as a similarity measure)'
      references_replace: true
  recommendation/overview/check-your-understanding#q1:
    difficulty: easy
    fix:
      question: Platforms such as YouTube and Google Play already have search. Why do they also use recommendation systems?
      explanation: |
        A recommendation system helps users find compelling content in a very large corpus: Google Play
        has millions of apps and YouTube billions of videos. Search works when you know what to look for,
        but recommendations can show items users might not have thought to search for, and they drive a
        large share of installs and watch time [^1]. They depend on data about users and items, such as
        past interactions, to measure similarity [^1], and they rank items by relevance rather than
        showing all equally.
      options:
        - text: They surface items users would not think to search for in a huge, growing catalogue
          correct: true
        - text: Search cannot find any item in a catalogue that holds more than a few thousand items
          why: Search handles catalogues of millions of items; its limit is that users must already know what to look for.
        - text: Recommendations need no data about users or items, so they are cheaper to run than search
          why: Recommendations depend on data about users and items, such as past interactions, to measure similarity.
        - text: Recommendations guarantee that every item in the catalogue is shown equally often
          why: Recommendations rank items by predicted relevance to each user, so some items are shown far more often than others.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/recommendation/overview
          locator: 'Recommendation Systems: Recommendation systems overview, sec. Why recommendations?'
      references_replace: true
  recommendation/overview/check-your-understanding#q2:
    difficulty: easy
    fix:
      question: A common architecture for large-scale recommendation systems has three stages. Which are they?
      explanation: |
        One common architecture has three stages. Candidate generation cuts a huge corpus down to a small
        subset, e.g. from billions of videos to hundreds; scoring ranks those candidates with a more
        precise model to pick about ten items; and re-ranking applies further constraints such as removing
        disliked items, boosting fresh content and ensuring diversity and fairness [^1]. Embeddings and
        similarity measures are tools used inside these stages, and matrix factorization and deep networks
        are kinds of candidate generators, not stages [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/recommendation/overview/types
          locator: 'Recommendation Systems: Recommendation systems overview, Candidate generation, scoring and re-ranking'
      references_replace: true
  managing-ml-projects/phases#q1:
    drop: duplicate
    comment: "'first verify that ML is the right solution' is ml-basics-049 (why problem framing comes before working with data and training a model)"
  managing-ml-projects/planning#q1:
    drop: off-scope
    comment: project planning (managing risk, time and stakeholder expectations with an 'experimental mindset'); no ML concept is tested
  managing-ml-projects/team#q1:
    drop: off-scope
    comment: team process (why ML teams write process documentation); no ML concept is tested
  decision-forests/decision-trees-mce#q1:
    difficulty: easy
    fix:
      explanation: |
        A decision tree predicts by starting at the root, testing its condition, following the
        branch that matches the example, and repeating at each node until it reaches a leaf. The
        leaf's value is the prediction, and the visited nodes form the inference path [^1][^2].
        Leaves hold predictions, not conditions, so a leaf has nothing that could send an example
        onward. You cannot start at a leaf and climb to the root, and no branch joins one leaf to
        another [^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/decision-trees-mce#question_1
          locator: 'Decision trees: Check your understanding, Question 1'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/decision-trees#the_model
          locator: "Decision Forests: Decision trees, 'The model'"
      references_replace: true
  decision-forests/overfitting-mce#q1:
    difficulty: medium
    fix:
      explanation: |
        In Google's Decision Forests course, the minimum number of examples is a stopping rule: a node
        with fewer examples than the limit is not split any further [^1]. Greedy growth chooses each
        node's condition using only that node's examples [^2], so raising the limit keeps the
        conditions near the root as they were and turns some deep, small subtrees into leaves. The tree
        gets smaller (or keeps its size), and its overall structure stays mostly the same [^1][^2]. It
        cannot get bigger, because the change only removes splits. A completely different structure is
        what can happen when a few *training examples* change, not when this limit rises [^1].
        scikit-learn's `min_samples_leaf` works slightly differently: it rejects any split that would
        leave a child below the limit, so it can sometimes change a split higher up [^3].
      why:
        0: Raising the minimum only stops splits earlier, so the tree can only shrink or keep its size [^1].
        2: Nodes near the root keep their conditions; only small, deep subtrees turn into leaves. A complete change is what new training examples can cause [^1][^2].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/overfitting-and-pruning#overfitting_and_pruning
          locator: "Decision Forests: Overfitting and pruning, sections 'Overfitting and pruning' and 'Direct decision tree interpretation'"
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/decision-forests/growing
          locator: 'Decision Forests: Growing decision trees (greedy divide-and-conquer algorithm)'
        - title: 'scikit-learn API: sklearn.tree.DecisionTreeClassifier'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html
          locator: Parameter min_samples_leaf
      references_replace: true
  gan/generative#q2:
    difficulty: medium
    fix:
      explanation: |
        Generative models capture the joint probability $p(X, Y)$, or $p(X)$ when there are no labels,
        while discriminative models capture the conditional probability $p(Y \mid X)$ [^1]. Both kinds can
        estimate probabilities, although neither has to [^1]. Knowing only that a model returns a
        probability for an instance therefore does not tell you which kind it is.
      options:
        2: Can't tell from this
      why:
        0: A generative model can assign a probability to an instance, but discriminative models also return probabilities, so a probability output alone does not identify a generative model [^1].
        1: A discriminative model does output probabilities such as $p(Y \mid X)$, but a generative model can return probabilities too, so this does not identify it either [^1].
  problem-framing/ml-framing#q2:
    difficulty: medium
    fix:
      explanation: |
        In the course's framing template, the ideal outcome is the product goal in non-ML terms, the
        model's goal says what the model must predict to serve it, the output type must match that
        prediction, and the success metric measures the business result rather than model
        accuracy [^1]. The firm's decision is which clothes to make, and the proposed model judges
        whether an item is in fashion. So a binary `in_fashion` / `not_in_fashion` classifier fits,
        and success is measured by sell-through (selling at least 70% of what is made) [^1]. The
        other framing switches the ideal outcome to ordering fabric and supplies, which is not the
        problem described. Its goal ("how much of each item") is also a quantity, which does not
        match a binary `make` / `do_not_make` output [^1].
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/ml-framing#define_the_ideal_outcome_and_the_models_goal
          locator: "Problem Framing: Framing an ML problem, sections 'Define the ideal outcome and the model's goal', 'Identify the output you need' and 'Define the success metrics'"
      references_replace: true
  problem-framing/problem#q1:
    difficulty: easy
    fix:
      explanation: |
        Before you commit to ML, the course says to optimise your existing non-ML solution, or try a
        simple heuristic if you have none, and to use that result as the baseline for judging any ML
        solution [^1]. The key question is how much better ML would be: if the gain over the
        heuristic is small, the simpler solution may be the right one [^1]. Google's Rules of ML make
        the same point: a heuristic often gets you a large share of the benefit, so you may launch
        without ML at first [^2]. Cost is weighed in the comparison too, but you estimate it from the
        ML system's compute, maintenance and staffing needs; the heuristic does not tell you what ML
        will cost [^1].
      why:
        1: The heuristic shows what quality you already get without ML; the cost of an ML solution is estimated separately, from its compute, maintenance and staffing needs.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/problem#clear_use_case_for_ml
          locator: "Problem Framing: Understand the problem, 'Clear use case for ML'"
        - title: 'Rules of Machine Learning: Best Practices for ML Engineering (Zinkevich, Google)'
          url: https://developers.google.com/machine-learning/guides/rules-of-ml#before_machine_learning
          locator: "Before Machine Learning, Rule #1: Don't be afraid to launch a product without machine learning"
      references_replace: true
  problem-framing/problem#q2:
    difficulty: easy
    fix:
      explanation: |
        Predictive ML lives on its data, and the course lists representativeness, correctness and
        predictive features among the qualities to check [^1]. *Representative*: if the data do not
        reflect the real-world behaviour being modelled, the model will predict poorly once deployed.
        *Correct*: a few wrong labels are unavoidable, but if more than a small fraction are wrong,
        predictions suffer. *Predictive power*: features must be correlated with the label, or the
        model has nothing to learn from [^1]. Size is not a limit (the course wants abundant data,
        the more relevant examples the better), and unpredictable sources go against its call for
        consistent, reliable and trusted data [^1].
      why:
        3: Size is not a limit to aim for; predictive ML wants abundant data, since more relevant examples generally give a better model.
        4: Data should be consistent, reliable and from trusted sources; unpredictable sources make the data unreliable.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/problem#predictive_ml_and_data
          locator: "Problem Framing: Understand the problem, 'Predictive ML and data' and 'Predictive power'"
      references_replace: true
  problem-framing/problem-framing#q1:
    difficulty: easy
    fix:
      explanation: |
        Problem framing means taking a problem apart to see which pieces need solving. That tells you
        whether the project is technically feasible and gives it clear goals and success
        criteria [^1]. It has two steps: deciding whether ML is the right approach at all and, if so,
        stating the problem in ML terms. Both happen before any data work or model training [^1].
        The first step matters because ML is a specialised tool, and a simpler non-ML solution may
        do the job [^2]. Diagnosing an existing model or finding data issues is debugging and
        evaluation work that comes later, not framing.
      why:
        1: Diagnosing an existing model and finding data issues are debugging and evaluation tasks that come once a model exists; framing happens before any data work or training.
      references:
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/problem-framing
          locator: 'Problem Framing: Overview'
        - source: google-ml-courses
          url: https://developers.google.com/machine-learning/problem-framing/problem#clear_use_case_for_ml
          locator: "Problem Framing: Understand the problem, 'Clear use case for ML'"
      references_replace: true
  clustering/dnn-clustering/check-your-understanding#q2:
    difficulty: medium
    fix:
      explanation: |
        The dot product equals $\lVert a\rVert\,\lVert b\rVert\cos\theta$: it grows with the lengths of
        both vectors, while the cosine depends only on the angle between them [^2]. Popular videos have
        long embeddings, so after the switch every similarity that involves a popular video is scaled up
        by its length, whatever the other video is [^1][^2]. That is why the dot product captures
        popularity, with the risk that popular items dominate the similarity measure [^2].
