  "quiz-48/q2":
    topic: q-learning
    difficulty: easy
    fix:
      question: When the number of possible states is not known in advance, a Q-table can be stored as a Python dictionary instead of a fixed-size array. What are its keys and values?
      explanation: |
        A Q-table records how good each action is in each state, one value per state–action pair [^1],
        and the Q-learning update changes the value of one such pair at a time [^2]. In the ML-For-Beginners CartPole lesson the discretized states have no guaranteed bounds, so the table becomes a dictionary keyed
        by the pair (state, action), with the Q-value as the value and 0 as the default for pairs not
        seen yet [^3]. A map from each state to an action is a policy, which the agent derives from the
        Q-values, not the Q-table itself [^1]. Q-values make no sense as keys, since many pairs can
        share the same value.
      options:
        0: 'Key: a (state, action) pair; value: the Q-value estimated for that pair'
        1: 'Key: a state; value: the single action the agent should take in that state'
        2: 'Key: a Q-value; value: the action that produced it'
      why:
        1: A map from states to actions is a policy, which the agent derives from the Q-values; the Q-table stores a value for every state–action pair [^1].
        2: Many pairs can share the same Q-value, and the update has to look up and change the value of a given (state, action) pair [^2][^3].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
          locator: 'Lesson: Introduction to reinforcement learning and Q-learning, secs. Actions and policy and Q-Learning'
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, pp. 131–132'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#the-q-table-structure
          locator: 'Lesson: CartPole skating, sec. The Q-Table structure'
      references_replace: true
  "quiz-48/q3":
    topic: q-learning
    difficulty: easy
    fix:
      explanation: |
        The ML-For-Beginners CartPole lesson sets three hyperparameters: `alpha`, the learning rate, which controls how far
        each update moves a Q-table entry; `gamma`, the discount factor, which weighs future
        against immediate reward; and `epsilon`, the exploration/exploitation factor [^1]. The
        other options mix in things that are not hyperparameters. Q-table values are the
        parameters being learned, and rewards are data that come from the environment.
        Hyperparameters are what you choose to steer the learning of those parameters [^2].
      why:
        0: Q-table values are the parameters being learned, the reward comes from the environment and a random action is something the agent does; none of them is set before training [^2].
        2: Cumulative rewards are what the agent collects from the environment, not a setting you choose, and the discount factor is missing [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#lets-start-q-learning
