  "quiz-13/q3":
    difficulty: medium
    fix:
      question: Before fitting a least-squares line, you compute the correlation coefficient $r$ between the feature and the target. Which values of $r$ suggest that a straight line will fit well?
      explanation: |
        The correlation $r$ lies between $-1$ and $+1$ and describes the strength and direction of a
        linear relationship: near $+1$ for a strong positive trend, near $-1$ for a strong negative
        one, near 0 when there is no linear trend [^1]. For a least-squares line with one predictor,
        $R^2 = r^2$, so $r = -0.9$ explains as much of the variation as $r = 0.9$ [^2]. The lesson's
        rule that a good linear model has a "high" coefficient, nearer to 1 than to 0, should be read
        as a large magnitude [^3]. A small positive $r$ means a weak linear relationship.
      options:
        0: Values close to 0
        1: Values close to +1 or −1
        2: Any positive value, however small
      references:
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
          locator: Sec. 7.1.4 Describing linear relationships with correlation
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
          locator: Sec. 7.2.5 Describing the strength of a fit
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#correlation
          locator: 'Lesson: Linear and polynomial regression, sec. Correlation'
      references_replace: true
  "quiz-14/q2":                         # misspelled distractors
    difficulty: easy
    fix:
      question: Which list contains only regression methods?
      explanation: |
        Ridge regression adds a penalty on the size of the coefficients to least squares, lasso uses a
        penalty that can set coefficients exactly to zero, and elastic net combines both penalties
        [^1]. Stepwise regression builds a regression model by entering and removing predictors one
        step at a time [^2]. The lesson names these four as the next regression techniques to study
        [^3]. scikit-learn's estimator map files k-means and spectral clustering under clustering, and
        PCA and Isomap under dimensionality reduction, so none of them predicts a numeric target [^4].
      options:
        0: Ridge, lasso, k-means and spectral clustering
        1: Stepwise, ridge, lasso and elastic net
        2: Ridge, PCA, Isomap and elastic net
      references:
        - title: 'scikit-learn User Guide: Linear Models'
          url: https://scikit-learn.org/stable/modules/linear_model.html#ridge-regression-and-classification
          locator: Secs. 1.1.2 Ridge regression, 1.1.3 Lasso, 1.1.5 Elastic-Net
        - title: 'Penn State STAT 501: Regression Methods'
          url: https://online.stat.psu.edu/stat501/Lesson10#stepwise-regression
          locator: Lesson 10.2 Stepwise Regression
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#review--self-study
          locator: 'Lesson: Linear and polynomial regression, sec. Review & Self Study'
        - title: 'scikit-learn User Guide: Choosing the right estimator'
          url: https://scikit-learn.org/stable/machine_learning_map.html
          locator: Estimator map (clustering, regression and dimensionality-reduction branches)
      references_replace: true
  "quiz-15/q3":                         # "weak correlations -> logistic regression"
    difficulty: medium
    fix:
      type: true_false
      question: 'True or false: if your features are only weakly correlated with the target, you should switch from linear to logistic regression.'
      explanation: |
        False. What decides between the two is the target: linear regression predicts a continuous
        value, while logistic regression predicts a category such as "white or not white" [^1]. The
        lesson remarks that logistic regression does not need the variables to line up the way linear
        regression does, which is why its weakly correlated pumpkin data was still usable [^1], but
        that is no reason to switch models. Logistic regression still computes a linear combination of
        the features, the log-odds, and passes it through a sigmoid [^2]; features that carry little
        information about the target give a weak classifier just as they give a weak regression.
      options:
        - text: 'True'
        - text: 'False'
          correct: true
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#binary-classification
          locator: 'Lesson: Logistic regression, secs. Binary classification and Variables DO NOT have to correlate'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
          locator: 'Logistic regression: Calculating a probability with the sigmoid function, Transforming linear output using the sigmoid function'
      references_replace: true
