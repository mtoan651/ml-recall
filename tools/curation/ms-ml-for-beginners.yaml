  "quiz-19/q3":
    topic: data-prep
    difficulty: medium
    fix:
      question: Before training a cuisine classifier, a dataset with 799 Korean but only 289 Thai recipes is balanced with SMOTE. How does SMOTE balance the classes?
      explanation: |
        ML-For-Beginners' introduction to classification first cleans the cuisine data and then balances it with SMOTE, the Synthetic
        Minority Over-sampling Technique, so that every cuisine ends up with 799 recipes [^1].
        imbalanced-learn explains the difference from naive over-sampling: random over-sampling
        duplicates some of the original minority samples, while SMOTE generates new samples by
        interpolation [^2]. Removing majority-class examples is the opposite strategy, under-sampling,
        for example a random subset with `RandomUnderSampler` [^3]. Balancing matters because a model
        trained on skewed data predicts the majority class more often simply because it has seen more
        of it [^1].
      options:
        0: It creates new synthetic examples of the smaller classes by interpolating between existing ones
        1: It duplicates randomly chosen examples of the smaller classes until all of the class counts match
        2: It deletes examples of the largest class until every class is as small as the smallest one
      why:
        1: That is naive random over-sampling, which repeats existing examples; SMOTE instead generates new samples by interpolation [^2].
        2: That is under-sampling, the opposite strategy, for example with `RandomUnderSampler` [^3].
      correct:
        - 0
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
          locator: 'Lesson: Introduction to classification, sec. Balance the dataset'
        - title: 'imbalanced-learn User Guide: Over-sampling'
          url: https://imbalanced-learn.org/stable/over_sampling.html#smote-adasyn
          locator: Secs. 2.1.1 Naive random over-sampling to 2.1.3 Ill-posed examples
        - title: 'imbalanced-learn User Guide: Under-sampling'
          url: https://imbalanced-learn.org/stable/under_sampling.html#random-under-sampling
          locator: Sec. 3.2.1.1 Random under-sampling
      references_replace: true
  "quiz-20/q2":
    difficulty: easy
    fix:
      question: 'True or false: in a recipe dataset used to predict the cuisine, dropping ingredients such as rice, garlic and ginger, which are common in recipes of every cuisine, can help the classifier.'
      explanation: |
        True. The lesson plots the most common ingredients of each cuisine, sees that rice, garlic and
        ginger are popular everywhere, and drops these columns because they create confusion between
        cuisines instead of telling them apart [^1]. A feature that looks the same in every class
        carries little information about the class. Univariate feature selection makes the same idea
        systematic: it scores each feature with a statistical test against the target and keeps only
        the best-scoring ones [^2].
      why:
        1: Ingredients common to every cuisine look alike in every class, so they carry little information and blur the classes [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#discovering-ingredients
          locator: 'Lesson: Introduction to classification, sec. Discovering ingredients'
        - title: 'scikit-learn User Guide: Feature selection'
          url: https://scikit-learn.org/stable/modules/feature_selection.html#univariate-feature-selection
          locator: Sec. 1.13.2 Univariate feature selection
      references_replace: true
  "quiz-20/q3":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        When one class dominates, a model sees many more examples of it and learns to predict it more
        often just because it is common. Balancing removes that skew so the minority classes are
        learned properly [^1][^2]. Balancing has nothing to do with how charts look. Its purpose is
        also not to gather more data: oversampling with SMOTE does add synthetic points, but only to
        equalize the classes [^1].
      options:
        0: Imbalanced data looks bad in charts and other visualizations
        1: It yields better results because the model won't skew towards one class
        2: Balancing your data always gives you more data points to train on
      why:
        0: Balancing changes what the model learns from, not how the data looks in a chart [^1].
        2: Balancing can also remove majority-class examples (downsampling); even oversampling with SMOTE adds points only to equalize the classes [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
          locator: 'Lesson: Classification 1, Balance the dataset'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets#the_difficulty_of_training_severely_class-imbalanced_datasets
          locator: 'Datasets: Class-imbalanced datasets, The difficulty of training severely class-imbalanced datasets'
      references_replace: true
  "quiz-21/q1":
    drop: duplicate
    comment: "'balanced, clean data yields the best classification results' is the claim data-prep-005 already tests (why balance your data); as a bare true/false it also overstates"
  "quiz-21/q2":
    difficulty: easy
    fix:
      type: multiple
      question: Which of these are sensible ways to choose a classifier for a new problem? Select all that apply.
      explanation: |
        The lesson suggests both: run several classifiers and compare the results, and, better than
        guessing, follow a cheat sheet that maps kinds of problems to suitable algorithms [^1]. It also
        rules out neural networks for its small, clean dataset as too heavy, so the most complex model
        is not automatically the best choice [^1]. Candidates must be compared on examples they were
        not trained on: MLCC splits the data into training, validation and test sets and stresses that
        testing on different examples is stronger proof of a model's fitness than testing on the
        training examples [^2].
      shuffle: true
      options:
        - text: Use a guide such as an algorithm cheat sheet to shortlist classifiers that suit your data
          correct: true
        - text: Try several candidates and compare them on held-out validation data
          correct: true
        - text: Always use the most complex model available, such as a deep neural network
          why: The lesson rules out neural networks for its small, clean dataset as too heavy; complexity is not automatically better [^1].
        - text: Pick the classifier with the highest accuracy on its own training data
          why: Training accuracy rewards overfitting; candidates must be compared on data they were not trained on [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#what-classifier-to-go-with
          locator: 'Lesson: Cuisine classifiers 1, secs. What classifier to go with?, A better approach and Reasoning'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#training_validation_and_test_sets
          locator: 'Datasets: Dividing the original dataset, Training, validation, and test sets'
      references_replace: true
  "quiz-22/q2":
    difficulty: medium
    fix:
      question: Which of these is a strategy for applying a binary classifier to a problem with more than two classes, rather than a classification algorithm itself?
      explanation: |
        One-vs-rest, also called one-vs-all, fits one classifier per class, each trained to separate
        its class from all the others. It wraps any binary classifier, which is why scikit-learn
        provides it as a meta-estimator, `OneVsRestClassifier` [^1]. Logistic regression and decision
        trees are classification algorithms. The lesson's model is a logistic regression run with the
        one-vs-rest scheme, because logistic regression is designed for binary problems and the
        cuisine task has five classes [^2].
      options:
        0: Logistic regression
        1: Decision-tree classification
        2: One-vs-rest (one-vs-all)
      why:
        0: Logistic regression is a classification algorithm; one-vs-rest is a scheme that can wrap it for several classes [^2].
        1: Decision trees are a classification algorithm, and they handle several classes natively [^1].
      correct:
        - 2
      references:
        - title: 'scikit-learn User Guide: Multiclass and multioutput algorithms'
          url: https://scikit-learn.org/stable/modules/multiclass.html#ovr-classification
          locator: Sec. 1.12.1.2 OneVsRestClassifier
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#using-scikit-learn
          locator: 'Lesson: Cuisine classifiers 1, sec. Using Scikit-learn'
      references_replace: true
  "quiz-22/q3":
    difficulty: easy
    fix:
      question: How do you check whether a trained classifier is working as expected?
      explanation: |
        A model is evaluated on data it has never seen: the lesson's workflow uses the test data for
        this [^1], and the cuisine lesson scores its classifier on the test split and prints a
        classification report with precision, recall and F1 for each class [^2]. Agreement with other
        algorithms says nothing about correctness, since several models can make the same mistakes.
        How an algorithm did on other problems does not show how this trained model does on your data.
      options:
        0: Measure its predictions (accuracy, precision, recall) on held-out test data
        1: Check that its predictions agree with those of several other algorithms on the same data
        2: Look up how well this type of algorithm has done on similar problems in published studies
      why:
        1: Several models can make the same mistakes, so agreement says nothing about correctness.
        2: How an algorithm did on other problems does not show how this trained model does on your data [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#evaluate-the-model
          locator: 'Lesson: Techniques of Machine Learning, sec. Evaluate the model'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#exercise---apply-logistic-regression
          locator: 'Lesson: Cuisine classifiers 1, sec. Exercise - apply logistic regression'
      references_replace: true
  "quiz-23/q1":
    difficulty: medium
    fix:
      question: You follow scikit-learn's 'Choosing the right estimator' map. You have about 6,000 labeled examples and want to predict a category. Which estimator does the map suggest trying first?
      explanation: |
        The map asks: more than 50 samples? predicting a category? labeled data? fewer than 100K
        samples? With a yes to all four it points to Linear SVC; if that does not work, it suggests naive
        Bayes for text data, otherwise a KNeighbors classifier and then SVC or ensemble classifiers
        [^1][^2]. The SGD classifier is the map's choice on the branch for 100K samples or more, because
        SGD scales to problems with more than $10^5$ training examples [^1][^3]. K-Means sits in the
        clustering part of the map, for data without labels [^1].
      options:
        2: SGD classifier
      why:
        1: K-Means sits in the clustering part of the map, for data without labels [^1].
        2: The map suggests the SGD classifier only on the branch for 100K samples or more [^1][^3].
      references:
        - title: 'scikit-learn User Guide: Choosing the right estimator'
          url: https://scikit-learn.org/stable/machine_learning_map.html
          locator: Estimator map (classification branch)
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#the-plan
          locator: 'Lesson: Cuisine classifiers 2, secs. A classification map and The plan'
        - title: 'scikit-learn User Guide: Stochastic Gradient Descent'
          url: https://scikit-learn.org/stable/modules/sgd.html
          locator: Sec. 1.5 introduction
      references_replace: true
  "quiz-23/q2":
    topic: linear-regression
    difficulty: medium
    fix:
      question: In scikit-learn's `LogisticRegression` and `SVC`, the parameter `C` controls regularization. What happens when you lower `C` from 1.0 to 0.01?
      explanation: "In both estimators `C` is the inverse of the regularization strength, so smaller values mean stronger regularization [^1][^2]. The penalty is on the size of the weights (the SVM minimizes $\\lVert w \\rVert^2$ plus `C` times the margin violations), so a stronger penalty keeps the weights smaller: a low `C` makes the decision surface smoother, while a high `C` tries to classify every training example correctly. scikit-learn advises lowering `C` when the data are noisy [^3]. Raising `C` would weaken the penalty instead. Microsoft's ML-For-Beginners classification lesson describes `C` as the setting that \"regulates the influence of parameters\" [^4]."
      options:
        0: 'Regularization gets stronger: the weights are pushed toward smaller values and the model becomes simpler'
        1: 'Regularization gets weaker: the weights may grow larger, so the model can fit the training data more closely'
        2: Only the training speed changes; the fitted model stays the same
      why:
        1: '`C` is the inverse of the regularization strength, so lowering it strengthens the penalty; it is a higher `C` that weakens it [^1][^2].'
        2: '`C` changes the objective being minimized, so the fitted weights change, not just the training time [^1][^3].'
      references:
        - title: 'scikit-learn API reference: LogisticRegression'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
          locator: Parameter C
        - title: 'scikit-learn API reference: SVC'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html
          locator: Parameter C
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#tips-on-practical-use
          locator: Secs. 1.4.5 Tips on practical use (Setting C), 1.4.6.1 Parameters of the RBF kernel, 1.4.7.1 SVC
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#linear-svc-classifier
          locator: 'Lesson: Cuisine classifiers 2, sec. Linear SVC classifier'
      references_replace: true
  "quiz-23/q3":
    topic: nonparametric
    difficulty: easy
    fix:
      question: "The k-nearest-neighbors classifier (scikit-learn's `KNeighborsClassifier`) is a method of:"
      explanation: |
        The k-NN classifier predicts the class of a new point by a majority vote among the labels of
        its nearest training points, so it needs labeled examples: it is supervised [^1]. Microsoft's
        ML-for-Beginners lesson remarks that the "neighbors" family serves both supervised and
        unsupervised learning, but that is about the whole family: scikit-learn also offers
        unsupervised nearest-neighbor search, which finds neighbors without using any labels [^1][^2].
        The classifier itself involves no actions or rewards, so it is not reinforcement learning
        either.
      shuffle: true
      options:
        2: reinforcement learning
      why:
        1: The classifier votes with the labels of the neighbours, so it needs labeled data; only plain nearest-neighbor search, which uses no labels, is unsupervised.
        2: There are no actions, states or rewards; the classifier just takes a vote among labeled neighbours.
      correct:
        - 0
      references:
        - title: 'scikit-learn User Guide: Nearest Neighbors'
          url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification
          locator: Sec. 1.6 introduction and 1.6.2 Nearest Neighbors Classification
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#k-neighbors-classifier
          locator: 'Lesson: Cuisine classifiers 2, sec. K-Neighbors classifier'
      references_replace: true
  "quiz-24/q1":
    topic: svm
    difficulty: easy
    fix:
      question: 'Support vector machines (SVMs) can be used for:'
      explanation: |
        Support vector machines are a family of methods used for both classification and regression
        [^1][^2]. Support-vector classifiers such as scikit-learn's SVC, NuSVC and LinearSVC handle
        classification. The same method extended to regression is Support Vector Regression (SVR),
        which fits a function and ignores training points whose prediction is already close to the
        target [^2].
      shuffle: true
      options:
        0: classification but not regression
        1: regression but not classification
        2: both classification and regression
      why:
        0: SVMs also do regression. Support Vector Regression (SVR) fits a function and ignores training points whose prediction is already close to the target [^2].
        1: Classification is the original use of SVMs; scikit-learn's SVC, NuSVC and LinearSVC are support-vector classifiers [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#support-vector-classifier
          locator: "Lesson: Classification 3, section 'Support Vector Classifier'"
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#regression
          locator: Sec. 1.4 (introduction); Sec. 1.4.2 Regression
      references_replace: true
  "quiz-24/q2":
    topic: trees-ensembles
    difficulty: easy
    fix:
      explanation: |
        A random forest trains many decision trees, each on a bootstrap sample of the training set and
        with a random subset of features considered at the splits, and averages their predictions;
        combining several base estimators like this is what makes it an ensemble method [^1][^2]. A
        linear classifier would separate the classes with a single linear boundary, and an
        instance-based classifier such as k-NN simply stores the training examples and votes among
        the nearest ones at prediction time [^3]; a forest is neither.
      options:
        0: ensemble
        1: linear
        2: instance-based (nearest-neighbor)
      why:
        1: A random forest combines many decision trees, whose axis-aligned splits give non-linear boundaries; it is not one linear separator [^1].
        2: A forest learns trees during training and predicts from them; it does not store the training set and vote among neighbours like k-NN [^3].
      references:
        - title: 'scikit-learn User Guide: Ensembles'
          url: https://scikit-learn.org/stable/modules/ensemble.html#random-forests
          locator: Sec. 1.11 introduction and 1.11.2.1 Random Forests
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#ensemble-classifiers
          locator: 'Lesson: Cuisine classifiers 2, sec. Ensemble Classifiers'
        - title: 'scikit-learn User Guide: Nearest Neighbors'
          url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification
          locator: Sec. 1.6.2 Nearest Neighbors Classification
      references_replace: true
  "quiz-24/q3":
    topic: trees-ensembles
    difficulty: easy
    fix:
      question: 'AdaBoost is known for:'
      explanation: |
        AdaBoost trains a sequence of weak learners on reweighted versions of the training data.
        After each round, the examples the current model misclassified get larger weights and the
        correctly classified ones get smaller weights, so the next learner concentrates on the
        examples that earlier ones got wrong [^1][^2]. The defining idea is this reweighting of
        misclassified items. AdaBoost neither detects outliers nor removes incorrect data [^2]. If
        anything, outliers and mislabelled points that keep being misclassified pile up weight, which
        makes AdaBoost sensitive to label noise [^3].
      options:
        1: focusing on detecting outliers in the data
        2: focusing on removing incorrect data
      why:
        1: AdaBoost has no outlier-detection step. It reweights misclassified examples, and outliers that keep being misclassified can even come to dominate the weights [^3].
        2: AdaBoost keeps every training example and only changes the weights, so mislabelled points make it more sensitive to noise rather than being removed [^2][^3].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#ensemble-classifiers
          locator: "Lesson: Classification 3, section 'Ensemble Classifiers'"
        - title: 'scikit-learn User Guide: Ensembles'
          url: https://scikit-learn.org/stable/modules/ensemble.html#adaboost
          locator: Sec. 1.11.7 AdaBoost
        - title: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning (2nd ed.)
          url: https://hastie.su.domains/ElemStatLearn/
          locator: Sec. 10.6 Loss Functions and Robustness, pp. 346-350
      references_replace: true
  "quiz-25/q1":
    drop: trivial
    comment: "'restaurants / fashions / both of these' for what recommenders can be used for is answerable without any knowledge"
  "quiz-25/q2":
    topic: ml-basics
    difficulty: easy
    fix:
      question: 'True or false: if a trained model is exported (for example to ONNX) and run inside the web page itself, instead of on a server that the page calls, the app can keep making predictions while the device is offline.'
      explanation: |
        True. In Microsoft's ML-for-Beginners cuisine-recommender lesson, the scikit-learn model is
        converted to ONNX and run in the browser with ONNX Runtime, which lets the app run locally and
