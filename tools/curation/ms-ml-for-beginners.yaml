  "quiz-44/q1":
    difficulty: medium
    fix:
      question: In an ARIMA model, what does the AR (autoregressive) part do?
      explanation: |
        ARIMA combines three parts [^1]. The autoregressive part regresses the variable on its own
        lagged, that is prior, values [^1]; an AR(1) model, for instance, predicts the present value
        from the value one time step earlier with a linear model [^2]. Differencing the data to remove
        a trend and make it stationary is the "I" (integrated) part [^1]. Building the value from past
        forecast errors is the moving-average part: a moving-average term is a past error multiplied
        by a coefficient [^3].
      options:
        0: It removes the trend by differencing the series, repeating until the series is stationary
        1: It predicts the current value as a linear function of the series' own past values (lags)
        2: It models the current value from the errors of past forecasts
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#arima-in-the-context-of-time-series
          locator: 'Lesson: Time series forecasting with ARIMA, secs. General concepts and ARIMA in the context of time series'
        - title: 'Penn State STAT 510: Applied Time Series Analysis'
          url: https://online.stat.psu.edu/stat510/Lesson01#overview-of-time-series-characteristics
          locator: Lesson 1.1 Overview of Time Series Characteristics (AR(1) model)
        - title: 'Penn State STAT 510: Applied Time Series Analysis'
          url: https://online.stat.psu.edu/stat510/Lesson02#moving-average-models-ma-models
          locator: Lesson 2.1 Moving Average Models (MA models)
      references_replace: true
  "quiz-46/q1":
    topic: q-learning
    difficulty: easy
    fix:
      explanation: |
        The ML-For-Beginners lesson describes Q-learning in both ways. Its policy is defined by a
        Q-table, and that table records the "goodness" (quality) of each action in each state [^1].
        The agent acts by choosing the action with the highest value in its current state [^1][^2].
        Q-learning itself is the algorithm that fills in this table using TD updates [^2].
      options:
        0: a mechanism for recording the 'goodness' of each action in each state
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", sections "Q-Learning" and "Checking the policy"
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit2/q-learning#what-is-q-learning
          locator: Unit 2, "Introducing Q-Learning", section "What is Q-Learning?"
      references_replace: true
  "quiz-46/q2":
    topic: q-learning
    difficulty: easy
    fix:
      question: An agent picks each action with probability proportional to that action's value in the Q-table for the current state. For which Q-table does this policy behave like a random walk?
      explanation: |
        A random walk chooses the next action at random from the allowed actions, each equally likely
        [^1]. If actions are picked with probabilities proportional to their Q-values, equal values give
        equal probabilities: that is why the lesson's Q-table, initialized with the same value (0.25)
        for every move, corresponds to the random-walk policy [^2]. As learning makes some entries
        larger, the agent picks the better actions more often while still exploring now and then [^3];
        once one action's value dominates, the policy almost always takes it, the opposite of a random
        walk.
      options:
        0: One where all entries are equal
        1: One where each state's best action has a much higher value than the rest
        2: One where all entries are different
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#random-walk
          locator: 'Lesson: Introduction to reinforcement learning and Q-learning, sec. Random walk'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
          locator: 'Lesson: Introduction to reinforcement learning and Q-learning, sec. Q-Learning'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#exploit-vs-explore
          locator: 'Lesson: Introduction to reinforcement learning and Q-learning, sec. Exploit vs. explore'
      references_replace: true
