      question: Which list contains only regression methods?
      explanation: Ridge regression adds a penalty on the size of the coefficients to least squares, lasso uses a penalty that can set coefficients exactly to zero, and elastic net combines both penalties [^1]. Stepwise regression builds a regression model by entering and removing predictors one step at a time [^2]. Microsoft's ML-For-Beginners regression lesson names these four as the next regression techniques to study [^3]. scikit-learn's estimator map files k-means and spectral clustering under clustering, and PCA and Isomap under dimensionality reduction, so none of them predicts a numeric target [^4].
