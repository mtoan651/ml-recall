  "quiz-16/q2":
    topic: metrics
    difficulty: easy
    fix:
      explanation: |
        A confusion matrix sets a classifier's predictions against the true labels and counts the true
        and false positives and negatives [^1][^2]. Because it lays out exactly where the model makes
        its mistakes, it is also called an error matrix [^1]. "Truth matrix" and "accuracy matrix" are
        not standard names for it.
      why:
        1: Not a standard name. The table records where the predictions go wrong, which is why its other name is error matrix [^1].
        2: Not a standard name. Accuracy is a single number read off the matrix (the diagonal over the total), not the matrix itself.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#better-comprehension-via-a-confusion-matrix
          locator: 'Lesson: Logistic Regression, Better comprehension via a confusion matrix'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/classification/thresholding#confusion_matrix
          locator: 'Classification: Thresholds and the confusion matrix, Confusion matrix'
      references_replace: true
  "quiz-16/q3":
    topic: metrics
    difficulty: easy
    fix:
      explanation: |
        True positives and true negatives are the correct predictions: actual positives labeled
        positive and actual negatives labeled negative [^1]. A good model has many of these and few
        false positives and false negatives [^2]. Any combination that includes many false positives or
        false negatives describes a model that makes many mistakes.
      why:
        0: False positives are mistakes (actual negatives predicted positive), so a good model has few of them [^1].
        2: False negatives are mistakes (actual positives predicted negative), so a good model has few of them [^1].
      references:
