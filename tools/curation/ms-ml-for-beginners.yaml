  "quiz-31/q2":
    difficulty: easy
    fix:
      question: ELIZA, a 1960s program, played the role of a computer therapist. How did it produce its replies?
      explanation: |
        Joseph Weizenbaum's ELIZA parsed a sentence for certain grammatical constructs and keywords
        and transformed them: "I am sad" could become "How long have you been sad?", and when no
        keyword matched it fell back on a generic reply [^1]. That gave the impression of
        understanding, but the program only changed tenses and added words, so "You are a bicycle"
        could get the answer "How long have I been a bicycle?" [^1]. It was a hand-tuned "scruffy"
        system of the 1960s, long before neural language models, and it held no medical knowledge
        [^2].
      options:
        0: By spotting keywords in the input and rearranging the user's words into canned replies
        1: By generating each reply with a neural language model trained on transcripts of real therapy sessions
        2: By looking up the medically correct answer in a database of diagnoses
      why:
        1: ELIZA dates from the 1960s, long before neural language models; it relied on hand-written keyword rules [^1][^2].
        2: ELIZA held no medical knowledge; it only rearranged the user's own words, so "You are a bicycle" could get "How long have I been a bicycle?" [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#developing-eliza
          locator: 'Lesson: Introduction to natural language processing, sec. Developing Eliza'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, secs. 1956 - 1974: "The golden years" and 1974 - 1980: "AI Winter"'
      references_replace: true
  "quiz-31/q3":
    topic: ai-intro
    difficulty: medium
    fix:
      question: What did Alan Turing's 'Turing test' check about a computer?
      explanation: |
        Turing considered the question "can machines think?" too vague to discuss and replaced it with
        a more precise one: can a computer do well in the imitation game [^1]? In the test, a human
        exchanges typed messages and must decide whether the replies come from a person or a
        machine; the machine counts as intelligent if the human finds them hard to tell apart
        [^2][^3]. The test looks at behaviour only. Whether passing it shows real understanding is
        what critics dispute: the Chinese-room argument holds that a program may appear to understand
        language without understanding it [^4]. Speed at arithmetic was never the criterion.
      shuffle: true
      options:
        0: Whether a human judge, chatting by text, could not tell its replies from a person's
        1: Whether it truly understands the meaning of the sentences it reads and writes
        2: Whether it can solve arithmetic problems faster and more accurately than a human expert
      why:
        1: The test looks only at behaviour; whether passing it shows real understanding is exactly what the Chinese-room argument disputes.
        2: Arithmetic speed was never the criterion; the test is a text conversation judged by a human.
      correct:
        - 0
      references:
        - title: 'Stanford Encyclopedia of Philosophy: The Turing Test'
          url: https://plato.stanford.edu/entries/turing-test/
          locator: Introduction (preamble)
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#roots
          locator: Sec. 1.4 Roots
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#the-turing-test
          locator: "Lesson: Introduction to natural language processing, secs. The 'Turing test' and The inspiration - 'the imitation game'"
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter" (Chinese room)'
      references_replace: true
