  "quiz-28/q1":
    difficulty: medium
    fix:
      question: scikit-learn recommends k-means for 'flat geometry' and DBSCAN for 'non-flat geometry'. What does non-flat geometry mean here?
      explanation: |
        In scikit-learn's overview of clustering methods, k-means is listed for general-purpose use
        with even cluster sizes and flat geometry, while DBSCAN suits non-flat geometry and uneven
        cluster sizes [^1]. Non-flat geometry clustering is useful when the clusters have a specific
        shape, a non-flat manifold, for which the standard Euclidean distance is not the right metric
        [^1]. The lesson describes it as distances measured along a straight line ("flat", Euclidean)
        versus along a curve (non-Euclidean) [^2]. Round clusters of similar size are the flat case
        that k-means handles well, and the term has nothing to do with the number of features.
      options:
        0: The clusters have curved shapes (a non-flat manifold), so Euclidean distance is not the right measure
        1: The data has exactly two features, so all the points lie on a flat plane and plain distances work fine
        2: The clusters are round, of similar size and well separated from each other
      references:
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#overview-of-clustering-methods
          locator: Sec. 2.3.1 Overview of clustering methods
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#getting-started-with-clustering
          locator: "Lesson: Introduction to clustering, sec. Getting started with clustering ('Non-flat' vs. 'flat' geometry)"
      references_replace: true
  "quiz-28/q2":
    difficulty: easy
    fix:
      question: In density-based clustering such as DBSCAN, what happens to a point that lies in a sparse region, far from any dense group of points?
      explanation: |
        Density-based methods assign points to clusters according to how densely they are grouped,
        and points far from the groups are treated as outliers or noise [^1]. In DBSCAN a cluster is
        built from core samples, which have at least `min_samples` neighbours within distance `eps`,
        plus the points close to them; any other point that is at least `eps` away from every core
        sample is an outlier, labelled −1 for noise [^2]. DBSCAN has no centroids, and an isolated
        point lacks the neighbours it would need to become a core sample [^2].
      options:
        0: It is labeled as noise (an outlier) and belongs to no cluster
        1: It becomes the center of a new cluster of its own
        2: It is assigned to the nearest cluster centroid, as in k-means
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#clustering-algorithms
          locator: 'Lesson: Introduction to clustering, sec. Clustering algorithms (Density-based clustering)'
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#dbscan
          locator: Sec. 2.3.7 DBSCAN
      references_replace: true
