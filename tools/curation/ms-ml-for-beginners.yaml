  "quiz-29/q1":
    difficulty: medium
    fix:
      question: k-means comes from signal processing, where it is used for vector quantization, for example to store a grayscale photo with 8 gray levels instead of 256. What does vector quantization do?
      explanation: |
        ML-For-Beginners' K-Means lesson notes that k-means comes from signal processing [^1]. There, vector quantization
        compresses data by replacing each value with one of a few representative values:
        scikit-learn's example reduces a 256-level grayscale image to 8 gray levels, and letting
        k-means choose the 8 levels maps the pixels better than equally spaced levels do [^2]. Each
        pixel goes to its nearest level, just as k-means assigns each point to its nearest centroid
        [^1]. Finding the directions of largest variance is what PCA does [^3], and splitting a signal
        into frequency components is a Fourier-style decomposition, not quantization.
      options:
        0: It projects the data onto the k directions of largest variance and keeps only those coordinates
        1: It replaces each value with the nearest of k representative values, which k-means finds
        2: It splits the signal into k frequency components that are stored separately
      why:
        0: Projecting onto the directions of largest variance is principal component analysis, a dimensionality reduction, not quantization [^3].
        2: Splitting a signal into frequency components is a Fourier-style decomposition; quantization maps each value to one of a few levels [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
          locator: 'Lesson: K-Means clustering, sec. Introduction'
        - title: 'scikit-learn examples: Vector Quantization Example'
          url: https://scikit-learn.org/stable/auto_examples/cluster/plot_face_compress.html
          locator: Secs. Compression via vector quantization and Encoding strategy (k-means strategy)
        - title: 'scikit-learn User Guide: Decomposing signals in components'
          url: https://scikit-learn.org/stable/modules/decomposition.html#principal-component-analysis-pca
          locator: Sec. 2.5.1 Principal component analysis (PCA)
      references_replace: true
  "quiz-29/q3":
    difficulty: medium
    fix:
      type: multiple
      question: Which statements about variance are true when you cluster data with k-means? Select all that apply.
      explanation: |
        Variance is the average squared distance from the mean, and the standard deviation is the
        square root of the variance, not the other way round [^1][^2]. k-means places centroids so as
        to minimize the within-cluster sum of squared distances [^3], so a feature whose variance is
        orders of magnitude larger than the others can dominate that objective [^4]. That is why ML-For-Beginners' K-Means lesson suggests scaling the data when its values diverge too much from the mean, and its
        challenge shows that scaling changes both the silhouette score and the elbow plot [^1].
      shuffle: true
      options:
        - text: Variance is the average of the squared differences from the mean
          correct: true
        - text: A feature with a much larger variance than the others can dominate the distances, so features are often scaled first
          correct: true
        - text: Variance is the square root of the standard deviation
          why: 'It is the other way round: the standard deviation is the square root of the variance [^2].'
        - text: k-means finds the same clusters whether or not the features are scaled
          why: k-means uses Euclidean distances, so rescaling a feature changes which points count as close; scaling changes both the silhouette score and the elbow plot [^1][^4].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#variance
          locator: 'Lesson: K-Means clustering, secs. Variance and Challenge'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/explore-numerical.html#sec-variance-sd
          locator: Sec. 5.4 Variance and standard deviation
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
        - title: 'scikit-learn User Guide: Preprocessing data'
          url: https://scikit-learn.org/stable/modules/preprocessing.html#standardization-or-mean-removal-and-variance-scaling
          locator: Sec. 8.3.1 Standardization, or mean removal and variance scaling
      references_replace: true
