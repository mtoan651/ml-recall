  "quiz-47/q2":
    difficulty: easy
    fix:
      question: In the classic CartPole reinforcement-learning environment, what must the agent learn to do?
      explanation: |
        In CartPole a pole is attached by an unpowered joint to a cart that moves along a track, and
        the agent pushes the cart left or right to keep the pole balanced upright [^1][^2]. Its state
        is continuous: four real numbers for the cart's position and velocity and the pole's angle and
        angular velocity, which is why the lesson discretizes it before it can use a Q-table [^1][^2].
        Reaching the top of a hill by accelerating back and forth is Mountain Car [^3], and landing a
        rocket on a pad is Lunar Lander [^4].
      options:
        0: Drive an under-powered car up a steep hill by building momentum
        1: Fire a lander's engines so that it touches down gently on a landing pad
        2: Push a cart left or right to keep a pole balanced upright on it
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
          locator: 'Lesson: CartPole skating, secs. Introduction and State discretization'
        - title: 'Gymnasium documentation: Cart Pole'
          url: https://gymnasium.farama.org/environments/classic_control/cart_pole/#description
          locator: Secs. Description and Observation Space
        - title: 'Gymnasium documentation: Mountain Car'
          url: https://gymnasium.farama.org/environments/classic_control/mountain_car/#description
          locator: Sec. Description
        - title: 'Gymnasium documentation: Lunar Lander'
          url: https://gymnasium.farama.org/environments/box2d/lunar_lander/#description
          locator: Sec. Description
      references_replace: true
  "quiz-48/q2":
    topic: q-learning
    difficulty: easy
    fix:
      question: When the number of possible states is not known in advance, a Q-table can be stored as a Python dictionary instead of a fixed-size array. What are its keys and values?
      explanation: |
        A Q-table records how good each action is in each state, one value per state–action pair [^1],
        and the Q-learning update changes the value of one such pair at a time [^2]. In the CartPole
        lesson the discretized states have no guaranteed bounds, so the table becomes a dictionary keyed
        by the pair (state, action), with the Q-value as the value and 0 as the default for pairs not
        seen yet [^3]. A map from each state to an action is a policy, which the agent derives from the
        Q-values, not the Q-table itself [^1]. Q-values make no sense as keys, since many pairs can
        share the same value.
      options:
        0: 'Key: a (state, action) pair; value: the Q-value estimated for that pair'
        1: 'Key: a state; value: the single action the agent should take in that state'
        2: 'Key: a Q-value; value: the action that produced it'
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#q-learning
          locator: 'Lesson: Introduction to reinforcement learning and Q-learning, secs. Actions and policy and Q-Learning'
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: 'Sec. 6.5 Q-learning: Off-policy TD Control, pp. 131–132'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#the-q-table-structure
          locator: 'Lesson: CartPole skating, sec. The Q-Table structure'
      references_replace: true
  "quiz-48/q3":
    topic: q-learning
    difficulty: easy
    fix:
      explanation: |
        The lesson sets three hyperparameters: `alpha`, the learning rate, which controls how far
        each update moves a Q-table entry; `gamma`, the discount factor, which weighs future
        against immediate reward; and `epsilon`, the exploration/exploitation factor [^1]. The
        other options mix in things that are not hyperparameters. Q-table values are the
        parameters being learned, and rewards are data that come from the environment.
        Hyperparameters are what you choose to steer the learning of those parameters [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#lets-start-q-learning
          locator: Reinforcement lesson 2 "CartPole Skating", section "Let's start Q-Learning" (code block 10)
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#investigating-the-learning-process
          locator: Reinforcement lesson 1, section "Investigating the learning process" (hyperparameters vs. parameters)
      references_replace: true
