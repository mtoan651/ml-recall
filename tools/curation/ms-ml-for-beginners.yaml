  quiz-51/q3:
    difficulty: easy
    fix:
      explanation: |
        ARIMA is the most common time series forecasting model. It relates the current value of a
        series to its past values and past forecast errors [^1][^2]. K-means is a clustering method
        for unlabelled data [^3], and logistic regression is a classifier that predicts a discrete
        label [^4]. Neither is built to forecast future values of a sequence.
