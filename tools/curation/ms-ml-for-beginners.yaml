# Curation for ms-ml-for-beginners (see docs/content-pipeline.md#curation).
# Refs: quiz-<quiz id>/q<n>, 1-based. Unlisted items are kept with the lesson's default topic.
# Drop reasons: trivial | lesson-specific | tool-trivia | inaccurate | ambiguous | off-scope
# Reviewed 2026-10-09 — 60 of 156 kept; re-reviewed 2026-10-11 under keep-and-fix — 112 kept
# (wrong keys fixed, 'both of the above' turned into select-all or true/false, joke and misspelled
# distractors replaced, lesson-specific stems generalized); duplicates and trivia stay dropped.
items:
  # 1-Introduction
  "quiz-1/q1":
    drop: trivial
    comment: "'Applications of machine learning are all around us' is a true/false platitude that needs no knowledge; nothing in it can be rewritten into a concept"
  "quiz-1/q3":
    difficulty: easy
    fix:
      question: Why might a business choose a machine-learning approach instead of a hand-coded rules engine?
      explanation: |
        The lesson starts the ML workflow with a question that cannot be answered by a simple
        conditional program or rules engine, for example predicting mortality when many health
        variables interact [^1]. d2l gives the same two reasons: some tasks follow a pattern that
        changes over time, and others involve relationships too complicated to code by hand, so the
        program has to learn from experience, usually data [^2]. ML models still make mistakes and
        cannot learn without data. A rules engine can be changed too, but only when its developers
        decide to update it by hand [^2].
      shuffle: true
      options:
        - text: The patterns are too complex or change too often to write as rules, but can be learned from data
          correct: true
        - text: An ML model is guaranteed to give the right answer on every input, which hand-written rules can never promise
        - text: An ML model needs no data, only a description of the problem
        - text: Hand-written rules cannot be changed once they are deployed
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#what-question-to-ask
          locator: 'Lesson: Techniques of Machine Learning, secs. Introduction (step 1) and What question to ask'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html
          locator: Ch. 1 Introduction (opening section, rules vs. learning from experience)
      references_replace: true
  "quiz-2/q1":                          # "ML algorithms are meant to simulate the human brain"
    difficulty: easy
    fix:
      type: true_false
      question: 'True or false: machine learning algorithms are designed to simulate the human brain.'
      explanation: |
        False. The lesson calls ML "loosely inspired" by how the brain learns from what it perceives
        and draws only "motivational similarities" between the two. What defines ML is algorithms
        that learn hidden patterns from data to support decisions [^1]. Most classical methods, such
        as linear regression, decision trees or k-means, contain nothing brain-like. Even neural
        networks took little more than their name from biology: d2l notes that the biological
        interpretation has become less literal over time, and what such networks share is layers of
        linear and nonlinear units trained with the chain rule [^2].
      options:
        - text: 'True'
        - text: 'False'
          correct: true
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#why-study-machine-learning
          locator: "Lesson: Introduction to machine learning, secs. The child's brain and Why study machine learning?"
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#roots
          locator: Sec. 1.4 Roots
      references_replace: true
  "quiz-2/q2":                          # NLP given as a classical ML technique
    difficulty: easy
    fix:
      question: Which of these is a classical machine-learning technique, as opposed to deep learning?
      explanation: |
        The curriculum's "classical machine learning" means methods such as regression,
        classification and clustering built with scikit-learn, and it explicitly leaves out neural
        networks and deep learning [^1]. Logistic regression belongs to that classical toolbox.
        Convolutional networks and Transformers are deep neural network architectures: d2l describes
        how, once data and compute grew, the sweet spot moved from linear models and kernel methods
        to deep networks such as these [^2]. Natural language processing, the key given upstream, is
        an application area rather than a technique; it can be tackled with classical methods (as the
        curriculum does) or with deep learning.
      options:
        0: Logistic regression
        1: A convolutional neural network
        2: A Transformer language model
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
          locator: 'Lesson: Introduction to machine learning, secs. Concepts to cover and What we will not cover'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#the-road-to-deep-learning
          locator: Sec. 1.5 The Road to Deep Learning
      references_replace: true
  "quiz-2/q3":
    drop: trivial
    comment: "'Why should everyone learn the basics of ML?' asks for an opinion (fun / used in many industries / both of the above); there is no fact to test"
  "quiz-3/q2":
    drop: trivial
    comment: joke distractors (Bill Gates, Shakey the robot); naming Turing as a pioneer is history trivia, and what his test measures is kept as quiz-31/q3
  "quiz-4/q1":
    difficulty: medium
    fix:
      question: Early AI systems such as ELIZA and SHRDLU are often called 'scruffy'. What distinguished 'scruffy' from 'neat' AI?
      explanation: |
        In the 1970s, AI split into two schools: "scruffy" labs tweaked their programs for hours
        until they got the results they wanted, while "neat" labs focused on logic and formal problem
        solving. ELIZA and SHRDLU were well-known scruffy systems [^1]. The split was about method,
        not data or hardware: ELIZA, for example, worked by spotting keywords and rearranging the
        user's words into canned replies, with no learning from data [^2], and data was scarce in that
        era anyway [^1]. In the 1980s, as demand grew for reproducible systems, the neat approach
        gained ground because its results are easier to explain [^1].
      options:
        0: Scruffy labs tweaked programs by hand until they behaved as desired; neat labs relied on logic and formal problem solving
        1: Scruffy systems learned their behaviour from large collections of data, while neat systems followed rules written by hand
        2: Scruffy systems ran on cheap hardware; neat systems needed supercomputers
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/1-Introduction-to-NLP/README.md#developing-eliza
          locator: 'Lesson: Introduction to natural language processing, sec. Developing Eliza'
      references_replace: true
  "quiz-4/q2":
    difficulty: easy
    fix:
      question: In AI research of the 1960s and 1970s, what was the 'blocks world'?
      explanation: |
        During the "golden years" (1956–1974), researchers created "micro-worlds", simple settings in
        which tasks were carried out from plain-language instructions [^1]. The blocks world was one:
        blocks could be stacked and sorted, which made it a testbed for teaching machines to make
        decisions, and programs such as SHRDLU built for it helped push language processing forward
        [^1]. It was a symbolic simulation, not a photo dataset and not a deep reinforcement learning
        benchmark, which came decades later; the lack of data was in fact one of the problems of that
        era [^1].
      options:
        0: A simple micro-world of blocks to stack and sort, for testing decision-making and language programs like SHRDLU
        1: A 3D video game used since the 2010s to benchmark deep reinforcement learning agents
        2: A large dataset of photographs of toy blocks, collected in the 1970s to train the first object detectors for robots
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956---1974-the-golden-years
          locator: 'Lesson: History of machine learning, secs. 1956 - 1974: "The golden years" and 1974 - 1980: "AI Winter"'
      references_replace: true
  "quiz-5/q1":
    difficulty: easy
    fix:
      type: true_false
      question: 'True or false: an ML model can only be unfair if someone built it with the intention to discriminate.'
      explanation: |
        False. People carry inherited biases that show up in the data used to train AI systems, and
        this often happens unintentionally, without anyone noticing [^1]. That is why Fairlearn defines
        unfair behaviour by its impact on people, the harms, rather than by its causes or by anyone's
        intent: societal biases reflected in the training data, too few data points about some group,
        or properties of the system itself can all produce it [^2].
      shuffle: true
      options:
        - text: 'True'
        - text: 'False'
          correct: true
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
        - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
          url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#fairness-of-ai-systems
          locator: Sec. Fairness of AI systems
      references_replace: true
  "quiz-5/q3":                          # distractors differ by misspellings only
    difficulty: easy
    fix:
      question: Which list names the main types of fairness-related harms that an ML system can cause?
      explanation: |
        The lesson lists five fairness-related harms: allocation (favouring one group, e.g. in who
        gets a loan), quality of service (working worse for some people), denigration, over- or
        under-representation and stereotyping [^1]. Fairlearn's user guide describes allocation and
        quality-of-service harms the same way and adds others, such as erasure [^2]. Reliability and
        safety, inclusiveness, security and privacy, transparency and accountability are the
        responsible-AI principles that the same lesson covers next, not harms [^1]. Overfitting, data
        leakage and the like are technical problems of a model or its data; they can lead to harm, but
        they are not the harm types.
      options:
        0: Allocation, quality of service, stereotyping, denigration, over- or under-representation
        1: Reliability and safety, inclusiveness, security and privacy, transparency, accountability
        2: Overfitting, underfitting, data leakage, label noise, concept drift
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness (and the principle sections after it)'
        - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
          url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#types-of-harms
          locator: Sec. Types of harms
      references_replace: true
  "quiz-6/q1":
    difficulty: easy
    fix:
      question: Which of these can make an ML model unfair?
      explanation: |
        Historical bias occurs when historical data reflects inequities that existed in the world at
        the time; a model trained on such records, for example 20 years of past admissions, can
        reproduce the same inequities in its predictions [^1]. The lesson makes the same point: the
        biases people carry show up in the data used to train AI systems [^2]. Relying less on such
        data does not create this problem. Feature scaling is a routine preprocessing step that puts
        features on comparable scales [^3]; it does not add or remove any group's disadvantage.
      options:
        0: Over-reliance on historical data that reflects past inequities
        1: Under-reliance on historical data
        2: Scaling all features to the same range before training the model
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/fairness/types-of-bias#historical_bias
          locator: 'Fairness: Types of bias, Historical bias'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
        - title: 'scikit-learn User Guide: Preprocessing data'
          url: https://scikit-learn.org/stable/modules/preprocessing.html#standardization-or-mean-removal-and-variance-scaling
          locator: Sec. 8.3.1 Standardization, or mean removal and variance scaling
      references_replace: true
  "quiz-6/q2":
    difficulty: medium
    fix:
      type: multiple
      question: Which of these are steps of a fairness assessment, the starting point for mitigating unfairness in an ML model? Select all that apply.
      explanation: |
        Fairlearn describes a fairness assessment as four steps: identify the types of harm, identify
        the groups that might be harmed, quantify the harms with metrics, and compare those numbers
        across the groups [^1]. Dropping a sensitive feature guarantees nothing: unfairness can come
        from societal biases in the training data or from too few data points about some group, and
        Fairlearn notes that "sensitive" does not mean a feature must be left out; sometimes it is
        better to include it [^2]. A single overall accuracy is an aggregate, and the lesson warns
        that such aggregate metrics are not enough to see how a model treats different groups [^3].
      shuffle: true
      options:
        - text: Identify the types of harm the system could cause and the groups that might be harmed
          correct: true
        - text: Define metrics that quantify those harms and compare them across the groups
          correct: true
        - text: Drop sensitive features such as gender, which guarantees that the model is fair
        - text: Check only the model's overall accuracy on the test set
      references:
        - title: 'Fairlearn User Guide (v0.13): Performing a Fairness Assessment'
          url: https://fairlearn.org/v0.13/user_guide/assessment/perform_fairness_assessment.html
          locator: Steps of the assessment (identify harms, identify groups, quantify, compare)
        - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
          url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#group-fairness-sensitive-features
          locator: Secs. Fairness of AI systems and Group fairness, sensitive features
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#debugging-with-responsible-ai
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Debugging with responsible AI'
      references_replace: true
  "quiz-6/q3":
    difficulty: easy
    fix:
      question: What can an open-source fairness toolkit such as Fairlearn do for you?
      explanation: |
        Fairlearn turns common scikit-learn accuracy and error metrics into group metrics, computed
        on the whole dataset and on each group, and reports the differences and ratios between groups
        [^1]. That lets you compare models on fairness and performance side by side. Choosing which
        model and which trade-off to accept stays with you: fairness is a contested,
        context-dependent idea, mathematical fairness metrics capture only some aspects of it, and you
        have to decide which metrics suit the situation at hand [^2].
      options:
        0: Compute fairness and performance metrics for each group, so you can compare models
        1: Pick the most accurate model for your application automatically, with no input from you
        2: Decide for you what counts as fair in your application
      references:
        - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
          url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#disparity-metrics-group-metrics
          locator: Sec. Disparity metrics, group metrics
        - title: 'Fairlearn User Guide (v0.13): Fairness in Machine Learning'
          url: https://fairlearn.org/v0.13/user_guide/fairness_in_machine_learning.html#the-formalism-trap
          locator: Sec. The Formalism Trap
      references_replace: true
  "quiz-7/q1":
    difficulty: easy
    fix:
      question: In the usual machine-learning workflow, which order of these two steps is right?
      explanation: |
        The lesson's workflow runs: decide on the question, collect and prepare the data, choose a
        training method, train the model, evaluate it, tune parameters, and predict [^1]. The training
        method comes after the data because the choice depends on the question and on the nature of
        the data [^1]. Tuning comes after a first round of training: you look at how the trained model
        performs on test data and then redo the process with different hyperparameters [^1].
      options:
        0: Prepare the data, then train the model
        1: Choose a training method, then collect and prepare the data
        2: Tune the hyperparameters, then train the model for the first time
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#introduction
          locator: 'Lesson: Techniques of Machine Learning, secs. Introduction (steps 1-7) and Parameter tuning'
      references_replace: true
  "quiz-7/q2":
    drop: trivial
    comment: "'quantity / shape / both of the above' with a vague 'shape'; that data quality and quantity matter is already asked by ml-basics-027 and ml-basics-047"
  "quiz-7/q3":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        A feature is a measurable property of the data, usually a column such as date, size or color.
        The feature variable (written `X` in code) holds the inputs the model is trained on [^1]. In a
        data table each row is one example and each column is a potential feature or label, so a row
        is not a feature [^2]. "A quality of your data" is too vague: features can be numerical or
        categorical, but each one is an attribute recorded for every example [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#features-and-target
          locator: 'Lesson: Techniques of Machine Learning, Features and Target'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#types_of_data
          locator: 'Datasets: Data characteristics (introduction and Types of data)'
          quote: You can imagine each row of the table as an example and each column as a potential feature or label.
      references_replace: true
  "quiz-8/q1":
    topic: data-prep
    difficulty: easy
    fix:
      type: multiple
      question: Which of these can plotting your data before training help you discover? Select all that apply.
      explanation: |
        The lesson says visualizing the data can uncover hidden correlations, bias and unbalanced
        data [^1]. MLCC recommends plotting data before building features because plots reveal
        anomalies, including outliers: values distant from most others, which often cause problems in
        training [^2]. Test accuracy only exists after a model has been trained and evaluated on
        held-out data [^1]. A learning rate is a training hyperparameter, found by training and
        evaluating models, not something a plot of the raw data shows.
      shuffle: true
      options:
        - text: Outliers, values far from most of the others
          correct: true
        - text: Unbalanced classes or other potential causes of bias
          correct: true
        - text: The model's accuracy on the test set
        - text: The best learning rate for training
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#visualize-your-data
          locator: 'Lesson: Techniques of Machine Learning, secs. Visualize your data and Evaluate the model'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/numerical-data/first-steps#visualize_your_data
          locator: 'Numerical data: First steps, Visualize your data and Find outliers'
      references_replace: true
  "quiz-8/q2":
    drop: duplicate
    comment: splitting the data into training and test sets is already asked by ml-basics-004 (hold-out split) and ml-basics-023 (roles of the three subsets); 'turing sets' was a joke distractor
  "quiz-8/q3":
    difficulty: easy
    fix:
      question: In scikit-learn, which call trains a model on the feature matrix `X` and the targets `y`?
      explanation: |
        Every scikit-learn estimator is trained with its `fit` method, which takes the samples matrix
        `X` and the target values `y`; once fitted, `predict` applies the trained model to new data
        without retraining [^1]. The lesson notes that `model.fit` is the training call in many ML
        libraries [^2]. `model.train()` is a trap from PyTorch: it only switches a module into training
        mode, which changes how layers such as dropout and batch normalization behave, and trains
        nothing by itself [^3].
      options:
        0: '`model.predict(X)`'
        1: '`model.train()`'
        2: '`model.fit(X, y)`'
      references:
        - title: 'scikit-learn: Getting Started'
          url: https://scikit-learn.org/stable/getting_started.html#fitting-and-predicting-estimator-basics
          locator: 'Fitting and predicting: estimator basics'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#train-a-model
          locator: 'Lesson: Techniques of Machine Learning, sec. Train a model'
        - title: 'PyTorch documentation: torch.nn.Module'
          url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html#torch.nn.Module.train
          locator: Method train(mode=True)
      references_replace: true
  "quiz-9/q1":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        Height is measured on a numeric scale, so it is quantitative (numerical). The regression lesson
        uses predicting a person's height as its example of a numeric value [^1][^2], and statistics
        texts classify height as a continuous numerical variable [^3]. Gender and hair color sort
        people into groups, which makes them categorical (qualitative) variables. Adding or averaging
        their values has no meaning [^3].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
          locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
          locator: 'Lesson: Defining Data, Quantitative Data'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
          locator: Sec. 1.2.2 Types of variables
          quote: Height varies continuously, so it is a continuous numerical variable.
      references_replace: true
  "quiz-9/q2":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        Blood type (A, B, AB, O with Rh sign) puts each person into one of a fixed set of groups. A
        variable whose values are categories is categorical (qualitative), and arithmetic such as
        averaging makes no sense for it [^1][^2]. Heart rate and weight are measured as numbers that
        can be added and averaged, which makes them quantitative (numerical) [^1].
      references:
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
          locator: Sec. 1.2.2 Types of variables
          quote: Because the responses themselves are categories, state is called a categorical variable
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/categorical-data
          locator: Working with categorical data (introduction)
          quote: Categorical data has a specific set of possible values.
      references_replace: true
  "quiz-10/q2":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        Feature selection keeps a subset of the original features, the ones that matter most, without
        changing them [^1][^2]. Feature extraction is different: it creates new features as functions
        of the original ones [^1]. Dimensionality reduction is the broader goal of working with fewer
        inputs. Both selection and extraction can serve that goal, so it is not the name for picking
        out the significant features [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#selecting-your-feature-variable
          locator: 'Lesson: Techniques of Machine Learning, Selecting your feature variable'
        - title: scikit-learn User Guide
          url: https://scikit-learn.org/stable/modules/feature_selection.html
          locator: Sec. 1.13 Feature selection
      references_replace: true
  "quiz-11/q1":
    drop: tool-specific
    comment: picking Matplotlib as 'the plotting module' over NumPy and scikit-learn is library name recognition; no ML or data concept to rewrite it around
  "quiz-11/q2":
    difficulty: medium
    fix:
      question: A correlation heatmap shows only a weak linear correlation between Month and pumpkin Price, yet a bar chart of the mean price per month shows a clear peak in September and October. What explains this?
      explanation: |
        In the lesson's pumpkin data, the heatmap shows only a weak linear correlation between Month
        and Price, although the bar chart of mean price per month has a clear peak in September and
        October [^1]. The lesson's conclusion: the correlation coefficient measures only straight-line
        relationships, so it can miss seasonal or other non-linear patterns, which is why you look at
        charts as well as the numbers [^1]. Statistics texts say the same: correlation quantifies the
        strength of a linear trend, and strong non-linear trends can produce correlations that do not
        reflect how strong the relationship is [^2]. So a weak correlation does not mean the variables
        are unrelated, and a train/test split has nothing to do with it.
      options:
        0: The correlation coefficient only measures straight-line relationships, so it misses the seasonal pattern
        1: The bar chart must be misleading, because a weak correlation means Month and Price are unrelated
        2: The data must first be split into training and test sets, because a correlation is only meaningful on the test set
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/2-Data/README.md#heatmaps-to-show-correlations
          locator: 'Lesson: Prepare and visualize data for regression, secs. Bar charts to show distributions and Heatmaps to show correlations'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
          locator: Sec. 7.1.4 Describing linear relationships with correlation
      references_replace: true
