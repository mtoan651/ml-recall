  "quiz-52/q1":
    topic: svm
    difficulty: medium
    fix:
      question: How does a support vector regressor (SVR) learn?
      explanation: |
        ε-SVR fits a function, a hyperplane in the kernel's feature space, and penalizes only samples
        whose prediction is at least ε away from their true target, that is, points that fall outside
        the "ε-tube" around the function [^1]. Because the cost ignores samples predicted within ε of
        their target, the model depends on only a subset of the training data, the support vectors
        [^2]. ML for Beginners describes SVR as finding the best-fit hyperplane that contains the
        maximum number of data points, a loose description of the same idea [^3]. SVR does not model
        the probability distribution of the data, and it is a supervised regressor, not a clustering
        method.
      options:
        0: By fitting a hyperplane with an ε-wide tube around it and penalizing only the points outside the tube
        1: By learning the full probability distribution that generated the training data, then sampling from it
        2: By grouping the data points into clusters of similar values
      why:
        1: That describes a generative model. SVR fits a single regression function and models no distribution [^1].
        2: Grouping points into clusters is unsupervised clustering; SVR is a supervised regressor trained on target values [^2].
      references:
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#svr
          locator: Sec. 1.4.7.2 SVR (mathematical formulation)
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#svm-regression
          locator: Sec. 1.4.2 Regression
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
          locator: 'Lesson: Time series forecasting with Support Vector Regressor, sec. SVR in the context of time series'
      references_replace: true
  "quiz-52/q2":
    topic: svm
    difficulty: easy
    fix:
      explanation: |
        A kernel lets an SVM work as if the data had been mapped into a higher-dimensional feature
        space, where classes that are tangled in the original space can become separable [^1][^2].
        The mapping is never computed explicitly. The kernel returns the inner product
        $K(x, z) = \phi(x)^\top \phi(z)$ in that space, and inner products are all the SVM needs [^2].
        A kernel does not measure accuracy, and it does not standardise the features. Scaling is a
        separate preprocessing step that SVMs need because they are not scale invariant [^3].
      why:
        0: Accuracy is measured with a metric on held-out data. The kernel is part of the model, an inner product between two inputs in a feature space [^2].
        2: Standardizing is a separate preprocessing step that SVMs need because they are not scale invariant; the kernel does not do it [^3].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
          locator: "Lesson: Time Series SVR, section 'Introduction' (SVR in the context of time series)"
        - title: Stanford CS229 Lecture Notes (Ma & Ng)
          url: https://cs229.stanford.edu/main_notes.pdf
          locator: Sec. 5.4 Properties of kernels, pp. 56-59
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#tips-on-practical-use
          locator: Sec. 1.4.5 Tips on Practical Use
      references_replace: true
  "quiz-52/q3":
    topic: svm
    difficulty: easy
    fix:
      question: Which of these models can capture non-linear structure in the data?
      explanation: |
        ARIMA is a statistical linear method, so it cannot capture non-linear structure in a time
        series. SVR can, because the SVM's kernel lets it model non-linearity [^1]. With the RBF kernel
        $\exp(-\gamma \lVert x - x' \rVert^2)$, the fitted function is non-linear in the inputs, with
        $\gamma$ and $C$ controlling how flexible it is [^2]. Simple linear regression is a linear
        model, so it has the same limitation as ARIMA [^1].
      why:
        0: Its prediction is a linear function of the input, so it cannot follow non-linear structure [^1].
        1: ARIMA is a linear statistical model; its forecast is a linear combination of past values and past errors [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/3-SVR/README.md#introduction
          locator: "Lesson: Time Series SVR, section 'Introduction' (Why SVR?)"
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#kernel-functions
          locator: Sec. 1.4.6 Kernel functions; Sec. 1.4.6.1 Parameters of the RBF Kernel
      references_replace: true
  quiz-10/q1:
    difficulty: easy
    fix:
      question: If your machine learning model's training accuracy is 95% and its test accuracy is 30%, what is this condition called?
      explanation: |
        A large gap between training accuracy (95%) and test accuracy (30%) is the signature of
        overfitting. The model has learned the details and noise of its training data so closely that
        it fails on new data [^1][^2]. An underfit model would do poorly on the training data as well
        [^1][^2]. A good fit, a model that generalizes well, makes good predictions on new data too, so
        it would not lose this much accuracy on the test set [^2].
      options:
        2: Good fit
      why:
        1: An underfit model does poorly on the training data too; 95% training accuracy rules that out [^1][^2].
        2: A model that generalizes well keeps a similar accuracy on new data; a drop from 95% to 30% is the opposite [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#evaluate-the-model
          locator: 'Lesson: Techniques of Machine Learning, Evaluate the model'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#fitting
          locator: Overfitting, Fitting, overfitting, and underfitting
      references_replace: true
  quiz-10/q3:
    difficulty: easy
    fix:
      question: "The process of splitting a dataset into a certain ratio of training and testing dataset using scikit-learn's `train_test_split()` function is called:"
      explanation: |
        Splitting the data once into a training part and a held-out test part, as `train_test_split`
        does, is hold-out validation [^1][^2]. Cross-validation instead rotates through several splits:
        k-fold trains on $k-1$ folds and tests on the remaining one, $k$ times over. Leave-one-out is
        the extreme case of k-fold with one sample per fold [^2].
      why:
        0: Cross-validation repeats the split several times (in k-fold, every fold is held out once); `train_test_split` splits only once [^2].
        2: Leave-one-out is k-fold cross-validation with one sample per fold, so it trains once per sample; `train_test_split` makes a single split [^2].
      references:
        - source: ms-ml-for-beginners
