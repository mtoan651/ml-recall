  "quiz-18/q3":
    topic: data-prep
    difficulty: medium
    fix:
      question: What does scikit-learn's `LabelEncoder().fit_transform(['pear', 'apple', 'fig', 'apple'])` return?
      explanation: |
        `LabelEncoder` encodes labels as integers from 0 to n_classes − 1 [^1]. The classes are kept in
        sorted order (`classes_` is `['apple', 'fig', 'pear']`), so apple → 0, fig → 1, pear → 2 and the
        list becomes `[2, 0, 1, 0]`. That is what the lesson's note "LabelEncoder encodes data
        alphabetically" means: the codes are numbers, assigned in alphabetical order [^2]. Numbering by
        first appearance would give `[0, 1, 2, 1]`, and one binary column per class is one-hot
        encoding, which is `OneHotEncoder`'s job [^3]. scikit-learn meant `LabelEncoder` for the target
        `y`, as in the lesson, where Country is the label [^1][^2].
      options:
        0: '`[2, 0, 1, 0]`'
        1: '`[0, 1, 2, 1]`'
        2: '`[[0, 0, 1], [1, 0, 0], [0, 1, 0], [1, 0, 0]]`'
      references:
        - title: 'scikit-learn API reference: LabelEncoder'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.LabelEncoder.html
          locator: Class description and classes_ attribute
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---clean-your-data
          locator: 'Lesson: Build a web app to use a ML model, secs. Exercise - clean your data and Exercise - build your model'
        - title: 'scikit-learn User Guide: Preprocessing data'
          url: https://scikit-learn.org/stable/modules/preprocessing.html#encoding-categorical-features
          locator: Sec. 8.3.4 Encoding categorical features
      references_replace: true
  "quiz-19/q2":
    drop: duplicate
    comment: with real distractors this becomes 'which problem is a classification problem?', already asked by ml-basics-018 (spam filter) and ml-basics-002; the upstream distractors were jokes (Can pigs fly?)
  "quiz-19/q3":
    topic: data-prep
    difficulty: medium
    fix:
      question: Before training a cuisine classifier, a dataset with 799 Korean but only 289 Thai recipes is balanced with SMOTE. How does SMOTE balance the classes?
      explanation: |
        The lesson first cleans the cuisine data and then balances it with SMOTE, the Synthetic
        Minority Over-sampling Technique, so that every cuisine ends up with 799 recipes [^1].
        imbalanced-learn explains the difference from naive over-sampling: random over-sampling
        duplicates some of the original minority samples, while SMOTE generates new samples by
        interpolation [^2]. Removing majority-class examples is the opposite strategy, under-sampling,
        for example a random subset with `RandomUnderSampler` [^3]. Balancing matters because a model
        trained on skewed data predicts the majority class more often simply because it has seen more
        of it [^1].
      options:
        0: It creates new synthetic examples of the smaller classes by interpolating between existing ones
        1: It duplicates randomly chosen examples of the smaller classes until all of the class counts match
        2: It deletes examples of the largest class until every class is as small as the smallest one
      correct:
        - 0
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
          locator: 'Lesson: Introduction to classification, sec. Balance the dataset'
        - title: 'imbalanced-learn User Guide: Over-sampling'
          url: https://imbalanced-learn.org/stable/over_sampling.html#smote-adasyn
          locator: Secs. 2.1.1 Naive random over-sampling to 2.1.3 Ill-posed examples
        - title: 'imbalanced-learn User Guide: Under-sampling'
          url: https://imbalanced-learn.org/stable/under_sampling.html#random-under-sampling
          locator: Sec. 3.2.1.1 Random under-sampling
      references_replace: true
  "quiz-20/q2":
    difficulty: easy
    fix:
      question: 'True or false: in a recipe dataset used to predict the cuisine, dropping ingredients such as rice, garlic and ginger, which are common in recipes of every cuisine, can help the classifier.'
      explanation: |
        True. The lesson plots the most common ingredients of each cuisine, sees that rice, garlic and
        ginger are popular everywhere, and drops these columns because they create confusion between
        cuisines instead of telling them apart [^1]. A feature that looks the same in every class
        carries little information about the class. Univariate feature selection makes the same idea
        systematic: it scores each feature with a statistical test against the target and keeps only
        the best-scoring ones [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#discovering-ingredients
          locator: 'Lesson: Introduction to classification, sec. Discovering ingredients'
        - title: 'scikit-learn User Guide: Feature selection'
          url: https://scikit-learn.org/stable/modules/feature_selection.html#univariate-feature-selection
          locator: Sec. 1.13.2 Univariate feature selection
      references_replace: true
  "quiz-20/q3":
    topic: data-prep
    difficulty: easy
    fix:
      explanation: |
        When one class dominates, a model sees many more examples of it and learns to predict it more
        often just because it is common. Balancing removes that skew so the minority classes are
        learned properly [^1][^2]. Balancing has nothing to do with how charts look. Its purpose is
        also not to gather more data: oversampling with SMOTE does add synthetic points, but only to
        equalize the classes [^1].
      options:
        0: Imbalanced data looks bad in charts and other visualizations
        1: It yields better results because the model won't skew towards one class
        2: Balancing your data always gives you more data points to train on
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#balance-the-dataset
          locator: 'Lesson: Classification 1, Balance the dataset'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/imbalanced-datasets#the_difficulty_of_training_severely_class-imbalanced_datasets
          locator: 'Datasets: Class-imbalanced datasets, The difficulty of training severely class-imbalanced datasets'
      references_replace: true
  "quiz-21/q1":
    drop: duplicate
    comment: "'balanced, clean data yields the best classification results' is the claim data-prep-005 already tests (why balance your data); as a bare true/false it also overstates"
  "quiz-21/q2":
    difficulty: easy
    fix:
      type: multiple
      question: Which of these are sensible ways to choose a classifier for a new problem? Select all that apply.
      explanation: |
        The lesson suggests both: run several classifiers and compare the results, and, better than
        guessing, follow a cheat sheet that maps kinds of problems to suitable algorithms [^1]. It also
        rules out neural networks for its small, clean dataset as too heavy, so the most complex model
        is not automatically the best choice [^1]. Candidates must be compared on examples they were
        not trained on: MLCC splits the data into training, validation and test sets and stresses that
        testing on different examples is stronger proof of a model's fitness than testing on the
        training examples [^2].
      shuffle: true
      options:
        - text: Use a guide such as an algorithm cheat sheet to shortlist classifiers that suit your data
          correct: true
        - text: Try several candidates and compare them on held-out validation data
          correct: true
        - text: Always use the most complex model available, such as a deep neural network
        - text: Pick the classifier with the highest accuracy on its own training data
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#what-classifier-to-go-with
          locator: 'Lesson: Cuisine classifiers 1, secs. What classifier to go with?, A better approach and Reasoning'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#training_validation_and_test_sets
          locator: 'Datasets: Dividing the original dataset, Training, validation, and test sets'
      references_replace: true
  "quiz-22/q2":
    difficulty: medium
    fix:
      question: Which of these is a strategy for applying a binary classifier to a problem with more than two classes, rather than a classification algorithm itself?
      explanation: |
        One-vs-rest, also called one-vs-all, fits one classifier per class, each trained to separate
        its class from all the others. It wraps any binary classifier, which is why scikit-learn
        provides it as a meta-estimator, `OneVsRestClassifier` [^1]. Logistic regression and decision
        trees are classification algorithms. The lesson's model is a logistic regression run with the
        one-vs-rest scheme, because logistic regression is designed for binary problems and the
        cuisine task has five classes [^2].
      options:
        0: Logistic regression
        1: Decision-tree classification
        2: One-vs-rest (one-vs-all)
      correct:
        - 2
      references:
        - title: 'scikit-learn User Guide: Multiclass and multioutput algorithms'
          url: https://scikit-learn.org/stable/modules/multiclass.html#ovr-classification
          locator: Sec. 1.12.1.2 OneVsRestClassifier
        - source: ms-ml-for-beginners
