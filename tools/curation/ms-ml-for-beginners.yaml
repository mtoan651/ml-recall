  "quiz-39/q2": {topic: data-prep}
  "quiz-39/q3":
    drop: trivial
    comment: "'it can be useful to categorize data using a Tag column' is an unfalsifiable true/false tied to the lesson's dataset"
  "quiz-40/q1":
    drop: lesson-specific
    comment: asks for the goal of the lesson's own hotel-review project; there is no general concept to rewrite it into
  "quiz-40/q3":
    topic: nlp-tasks
    fix:
      type: single
      question: You run a sentiment analyzer on hotel reviews that also come with the reviewer's numeric score. What is a sensible way to check whether the analyzer works?
      options:
        - text: Compare its sentiment scores with the reviewers' own scores for the same reviews
          correct: true
        - text: Check that it returns a sentiment score for every single review in the dataset, with no gaps
