      references_replace: true
  quiz-29/q2:
    difficulty: easy
    fix:
      explanation: |
        For each sample, the silhouette coefficient compares $a$, its mean distance to the other
        points in its own cluster, with $b$, its mean distance to the points of the nearest other
        cluster: $s = (b - a)/\max(a, b)$. The score of a clustering is the average over all samples [^2].
        Scores range from $-1$ to $1$. Values near 1 mean dense clusters that are well separated from
        their neighbours, and values near 0 mean the clusters overlap [^1][^2]. The score does not
        count clusters. In fact, it is often computed for several values of $k$ to help choose how
        many clusters to use [^2].
      options:
        1: the data splits into only a few clusters
        2: the data splits into a large number of clusters
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#silhouette-score
          locator: "Lesson: K-Means Clustering, section 'Silhouette score'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#silhouette-coefficient
          locator: Sec. 2.3.11.5 Silhouette Coefficient
      references_replace: true
  quiz-30/q2:
    difficulty: medium
    fix:
      question: 'In k-means clustering, inertia is:'
      explanation: |
        Inertia is the within-cluster sum of squares, $\sum_i \min_j \lVert x_i - \mu_j \rVert^2$: the
        squared distance from each point to its own centroid, summed over all points. It is the
        quantity k-means tries to minimise, and scikit-learn calls it a measure of how internally
        coherent the clusters are [^1][^2]. It only looks inside each cluster, so it says nothing about
        how far apart the centroids are: equally tight clusters give the same inertia whether their
        centroids are close together or far apart. It also does not measure how far the centroids
        move. That movement is what the algorithm checks to decide when to stop iterating [^2].
      options:
        2: a measure of how far apart the cluster centroids are
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#exercise---build-a-model
          locator: "Lesson: K-Means Clustering, section 'Exercise - build a model' (Inertia note)"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-43/q2:
    difficulty: easy
    fix:
      explanation: |
        A stationary series is one whose statistical properties, that is its distribution, do not
        depend on when it is observed. Shifting it in time changes nothing [^1][^2]. Series with a
        trend or seasonality are therefore not stationary, while white noise is [^2]. Data whose
        distribution changes over time are, by definition, non-stationary. "Attributes" is too vague
        a word for the definition [^1].
      options:
        0: data whose attributes do not change when shifted in time
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
          locator: "Lesson: Time Series ARIMA, section 'General concepts' (Stationarity)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/stationarity.html
          locator: Sec. 9.1 Stationarity and differencing
      references_replace: true
  quiz-45/q1:
    difficulty: easy
    fix:
      explanation: |
        The lesson defines RL as a way to learn an agent's optimal behavior in an environment by
        running many experiments, with the goal set by a reward function [^1]. Sutton & Barto
        describe it as learning how to map situations to actions so as to maximize a numerical
        reward, finding good actions by trying them out [^2]. The other options leave out what
        makes it RL: an agent that chooses actions in order to earn reward [^2].
      options:
        0: teaching someone the same thing over and over again until they finally understand it
        1: a learning technique that finds an agent's optimal behavior in an environment by running many experiments
        2: a way of understanding how to run multiple experiments at once, in parallel
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#introduction
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Introduction"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, p. 1
      references_replace: true
  quiz-45/q2:
    difficulty: easy
    fix:
      explanation: |
        A policy is the agent's strategy: a function that returns the action to take in any given
        state [^1]. Formally it maps states to actions, or, for a stochastic policy, to the
        probability of choosing each action [^2]. The other options describe the two other core
        elements of an RL system. The reward function gives the immediate score of a state, and a
        value function estimates the total reward the agent can expect to collect from a state
        onwards [^2].
      options:
        1: a function that returns the reward the agent receives in a given state
        2: a function that returns the total reward the agent can expect from a given state
      why:
        1: That is the reward function, which scores the immediate outcome of a state.
        2: That is a value function, which estimates the long-run reward from a state onwards.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#actions-and-policy
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Actions and policy"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.3 Elements of Reinforcement Learning, p. 6; Sec. 3.5 Policies and Value Functions, p. 58
      references_replace: true
  quiz-1/q2:
    difficulty: easy
    fix:
      explanation: |
        Deep learning is the part of machine learning built on neural networks with many layers, which
        learn several layers of representations jointly from data [^1][^2]. The course's "classical"
        machine learning deliberately leaves neural networks and deep learning out [^1]. Which approach
        came first, or whether robots use it, is not a technical difference between the two.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
