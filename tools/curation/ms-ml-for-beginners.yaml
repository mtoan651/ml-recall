  # 7-TimeSeries
  "quiz-41/q1":
    drop: trivial
    comment: "'determining future costs / predicting future pricing / both the above' needs no knowledge"
  "quiz-41/q3":
    fix:
      question: Which of these tasks works with time-series data?
      options:
        0: Forecasting earthquakes from decades of seismic records kept in time order
        1: Recognizing and naming all the objects that are shown in a single photograph
        2: Choosing a color palette from the colors of one painting
  "quiz-42/q3":
    drop: duplicate
    comment: "'time series forecasting is most useful for econometrics / history / libraries' asks the same 'where are time series used' as quiz-41/q3, which is kept with concrete tasks"
  "quiz-44/q1":
    fix:
      question: In an ARIMA model, what does the AR (autoregressive) part do?
      options:
        0: It removes the trend by differencing the series, repeating until the series is stationary
        1: It predicts the current value as a linear function of the series' own past values (lags)
        2: It models the current value from the errors of past forecasts
  # 8-Reinforcement
  "quiz-46/q1":
    topic: q-learning
