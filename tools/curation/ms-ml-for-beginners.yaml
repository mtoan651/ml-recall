  "quiz-13/q3":
    difficulty: medium
    fix:
      question: Before fitting a least-squares line, you compute the correlation coefficient $r$ between the feature and the target. Which values of $r$ suggest that a straight line will fit well?
      explanation: "The correlation $r$ lies between $-1$ and $+1$ and describes the strength and direction of a linear relationship: near $+1$ for a strong positive trend, near $-1$ for a strong negative one, near 0 when there is no linear trend [^1]. For a least-squares line with one predictor, $R^2 = r^2$, so $r = -0.9$ explains as much of the variation as $r = 0.9$ [^2]. Microsoft's ML-For-Beginners regression lesson says that a good linear model has a \"high\" coefficient, nearer to 1 than to 0, should be read as a large magnitude [^3]. A small positive $r$ means a weak linear relationship."
      options:
        0: Values close to 0
        1: Values close to +1 or −1
        2: Any positive value, however small
      why:
        0: An $r$ near 0 means there is no linear trend, so a straight line explains little of the variation [^1][^2].
        2: A small positive $r$ means only a weak linear relationship; what matters is the magnitude $|r|$, not the sign [^1].
      references:
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
          locator: Sec. 7.1.4 Describing linear relationships with correlation
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#sec-r-squared
          locator: Sec. 7.2.5 Describing the strength of a fit
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#correlation
          locator: 'Lesson: Linear and polynomial regression, sec. Correlation'
      references_replace: true
  "quiz-14/q2":                         # misspelled distractors
