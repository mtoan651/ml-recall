  "quiz-23/q1":
    difficulty: medium
    fix:
      question: You follow scikit-learn's 'Choosing the right estimator' map. You have about 6,000 labeled examples and want to predict a category. Which estimator does the map suggest trying first?
      explanation: |
        The map asks: more than 50 samples? predicting a category? labeled data? fewer than 100K
        samples? With a yes to all four it points to Linear SVC; if that does not work, it suggests a
        KNeighbors classifier, then SVC or ensemble classifiers [^1][^2]. The SGD classifier is the
        map's choice on the branch for 100K samples or more, because SGD scales to problems with more
        than $10^5$ training examples [^1][^3]. K-Means sits in the clustering part of the map, for
        data without labels [^1].
      options:
        2: SGD classifier
      references:
