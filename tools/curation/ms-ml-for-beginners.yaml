  quiz-19/q1:
    difficulty: easy
    fix:
      explanation: |
        The lesson introduces classification as a supervised technique that has a lot in common with
        regression: both learn from labeled examples to map input variables to an output [^1]. What
        differs is the target. Regression answers "how much?" with a number, classification answers
        "which one?" with a category, and many techniques carry over from one to the other [^2]. Time
        series and natural language processing (NLP) are kinds of data and application areas, not a
        sibling family of supervised methods.
      options:
        2: Natural language processing
      why:
        0: Time series is a kind of data, observations ordered in time, not a family of supervised methods like regression.
        2: NLP is an application area that may use classifiers, not a sibling family of supervised methods.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md
          locator: 'Lesson: Classification 1, introduction'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#classification
          locator: Sec. 1.3.1.2 Classification
      references_replace: true
  quiz-20/q1:
    difficulty: easy
    fix:
      explanation: |
        A multiclass problem has more than two possible classes, and each data point gets exactly one
        of them. The cuisine dataset is multiclass because a recipe belongs to one of several national
        cuisines [^1][^2]. Putting the same data point into several classes at once is a different
        task: when an example can be assigned to multiple classes, the problem is multi-label
        classification [^2]. Cleaning data is a preparation step that comes before modeling, not a type
        of question [^1].
      options:
        0: the task of classifying each data point into several classes at once
      why:
        0: Assigning one example to several classes at once is multi-label classification [^2].
        2: Cleaning is data preparation before modeling, not a kind of classification question [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/1-Introduction/README.md#hello-classifier
          locator: "Lesson: Classification 1, Hello 'classifier' and Exercise - clean and balance your data"
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/classification/multiclass
          locator: 'Classification: Multi-class classification'
      references_replace: true
  quiz-21/q3:
    difficulty: easy
    fix:
      explanation: |
        Classification learns from labeled examples, where the label is the class to predict, and that
        is what makes it supervised learning. Scikit-learn files all of its classifiers under
        supervised learning [^1][^2]. Unsupervised learning works with unlabeled data and looks for
        structure such as clusters, so it has no classes to learn from [^2]. NLP is an application area
        that may use classifiers, not a kind of learning.
      options:
        2: Unsupervised Learning
      why:
        0: NLP is an application area that may use classifiers, not a kind of learning.
        2: Unsupervised learning has no labels, so there are no classes to learn from [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#choosing-your-classifier
          locator: 'Lesson: Classification 2, Choosing your classifier'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#supervised-learning
          locator: Sec. 1.3.1 Supervised Learning (1.3.1.2 Classification) and Sec. 1.3.2 Unsupervised and Self-Supervised Learning
      references_replace: true
  quiz-22/q1:
    difficulty: easy
    fix:
      explanation: |
        In scikit-learn's `LogisticRegression`, the `solver` parameter names the optimization algorithm
        that fits the model's weights, for example `lbfgs` (the default) or `liblinear` [^1][^2]. The
        choice matters because not every solver supports every multiclass setting [^1]. The solver is
        not the loss function: the loss is the objective, and the solver is the procedure that
        minimizes it. Nor is it a machine learning technique of its own; it is one setting of a
        technique.
      options:
        0: the loss function that training minimizes
      why:
        0: The loss is the objective; the solver is the algorithm that minimizes it [^2].
        2: The solver is one setting of a technique such as logistic regression, not a technique of its own [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/2-Classifiers-1/README.md#using-scikit-learn
          locator: 'Lesson: Classification 2, Using Scikit-learn'
        - title: 'scikit-learn API reference: LogisticRegression'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html#sklearn.linear_model.LogisticRegression
          locator: 'Parameters: solver'
          quote: Algorithm to use in the optimization problem. Default is ‘lbfgs’.
      references_replace: true
  quiz-29/q2:
    difficulty: easy
    fix:
      explanation: |
        For each sample, the silhouette coefficient compares $a$, its mean distance to the other
        points in its own cluster, with $b$, its mean distance to the points of the nearest other
        cluster: $s = (b - a)/\max(a, b)$. The score of a clustering is the average over all samples [^2].
        Scores range from $-1$ to $1$. Values near 1 mean dense clusters that are well separated from
        their neighbours, and values near 0 mean the clusters overlap [^1][^2]. The score does not
        count clusters. In fact, it is often computed for several values of $k$ to help choose how
        many clusters to use [^2].
      options:
        1: the data splits into only a few clusters
        2: the data splits into a large number of clusters
      why:
        1: The silhouette score measures how compact and well separated the clusters are, not how many there are; a few overlapping clusters score near 0 [^1][^2].
        2: You choose the number of clusters yourself; the score is computed for several values of $k$ to compare them, and splitting the data into many small clusters can score badly too [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#silhouette-score
          locator: "Lesson: K-Means Clustering, section 'Silhouette score'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#silhouette-coefficient
          locator: Sec. 2.3.11.5 Silhouette Coefficient
      references_replace: true
  quiz-30/q2:
    difficulty: easy
    fix:
      question: 'In k-means clustering, inertia is:'
      explanation: |
        Inertia is the within-cluster sum of squares, $\sum_i \min_j \lVert x_i - \mu_j \rVert^2$: the
        squared distance from each point to its own centroid, summed over all points. It is the
        quantity k-means tries to minimise, and scikit-learn calls it a measure of how internally
        coherent the clusters are [^1][^2]. It only looks inside each cluster, so it says nothing about
        how far apart the centroids are: equally tight clusters give the same inertia whether their
        centroids are close together or far apart. It also does not measure how far the centroids
        move. That movement is what the algorithm checks to decide when to stop iterating [^2].
      options:
        2: a measure of how far apart the cluster centroids are
      why:
        1: How far the centroids move between iterations is what k-means checks to decide when to stop; inertia measures the distances of points to their own centroid [^2].
        2: Inertia only looks inside each cluster, so equally tight clusters give the same inertia whether their centroids are close together or far apart [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#exercise---build-a-model
          locator: "Lesson: K-Means Clustering, section 'Exercise - build a model' (Inertia note)"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-43/q2:
    difficulty: easy
    fix:
      explanation: |
        A stationary series is one whose statistical properties, that is its distribution, do not
        depend on when it is observed: shifting it in time changes nothing [^1][^2]. Its values still
        fluctuate; white noise is stationary even though every value is different [^2]. Series with a
        trend or seasonality are not stationary, because their level or pattern depends on the time,
        and data whose distribution changes over time are non-stationary by definition [^2].
      options:
        0: data whose values do not change when shifted in time
      why:
        0: A stationary series still fluctuates; white noise is stationary although every value differs. What stays the same is the distribution [^2].
        2: That describes a non-stationary series, such as one with a trend or seasonality [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
          locator: "Lesson: Time Series ARIMA, section 'General concepts' (Stationarity)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/stationarity.html
          locator: Sec. 9.1 Stationarity and differencing
      references_replace: true
  quiz-45/q1:
    difficulty: easy
    fix:
      explanation: |
        ML-For-Beginners defines RL as a way to learn an agent's optimal behavior in an environment by
        running many experiments, with the goal set by a reward function [^1]. Sutton & Barto
        describe it as learning how to map situations to actions so as to maximize a numerical
        reward, finding good actions by trying them out [^2]. The other options leave out what
        makes it RL: an agent that chooses actions in order to earn reward [^2].
      options:
        0: teaching someone the same thing over and over again until they finally understand it
        1: a learning technique that finds an agent's optimal behavior in an environment by running many experiments
        2: a way of understanding how to run multiple experiments at once, in parallel
      why:
        0: Repeating a lesson means someone shows the right answer; in RL nobody does, and the agent finds good actions by trying them and collecting reward [^2].
        2: Running experiments in parallel is at most an implementation detail; RL is about an agent learning which actions earn the most reward [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#introduction
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Introduction"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, p. 1
      references_replace: true
  quiz-45/q2:
    difficulty: easy
    fix:
      explanation: |
        A policy is the agent's strategy: a function that returns the action to take in any given
        state [^1]. Formally it maps states to actions, or, for a stochastic policy, to the
        probability of choosing each action [^2]. The other options describe the two other core
        elements of an RL system. The reward function gives the immediate score of a state, and a
        value function estimates the total reward the agent can expect to collect from a state
        onwards [^2].
      options:
        1: a function that returns the reward the agent receives in a given state
        2: a function that returns the total reward the agent can expect from a given state
      why:
        1: That is the reward function, which scores the immediate outcome of a state.
        2: That is a value function, which estimates the long-run reward from a state onwards.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#actions-and-policy
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Actions and policy"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.3 Elements of Reinforcement Learning, p. 6; Sec. 3.5 Policies and Value Functions, p. 58
      references_replace: true
  quiz-1/q2:
    difficulty: easy
    fix:
      explanation: |
        Deep learning is the part of machine learning built on neural networks with many layers, which
        learn several layers of representations jointly from data [^1][^2]. Microsoft's ML-For-Beginners
        curriculum, which teaches "classical" machine learning, deliberately leaves neural networks and
        deep learning out [^1]. Which approach came first, or whether robots use it, is not a technical
        difference between the two.
      why:
        0: When a family of methods appeared says nothing about how it works; the technical difference lies in the model, many-layered neural networks [^1][^2].
        2: Robots use classical ML as well as deep learning, so the application area is not a technical difference between the two.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/1-intro-to-ML/README.md#what-we-will-not-cover
          locator: 'Lesson: Introduction to Machine Learning, What we will not cover'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#the-essence-of-deep-learning
          locator: Sec. 1.7 The Essence of Deep Learning
      references_replace: true
  quiz-3/q1:
    difficulty: easy
    fix:
      explanation: |
        The phrase "artificial intelligence" appears in the proposal McCarthy, Minsky, Rochester and
        Shannon wrote on 31 August 1955 for a summer study at Dartmouth College [^2]. That 1956
        Dartmouth Summer Research Project is where the field got its name [^1][^3], so the answer is the
        1950s. The 1930s predate the field, and the 1980s are known for the spread of commercial
        expert systems [^1].
      why:
        0: By the 1980s the field was well established; that decade is known for commercial expert systems.
        2: The 1930s predate the field; the term first appears in a 1955 proposal for a Dartmouth workshop.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
          locator: 'Lesson: History of machine learning, sec. 1956: Dartmouth Summer Research Project'
        - title: McCarthy, Minsky, Rochester & Shannon, A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence (1955)
          url: http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf
          locator: Title page and p. 1
        - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
          url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
          locator: Page text (1956)
      references_replace: true
  quiz-3/q3:
    difficulty: easy
    fix:
      explanation: |
        By the mid-1970s it was clear that building intelligent machines was harder than promised,
        and the first limitation the lesson lists is that compute power was too limited [^1]. Related
        problems were combinatorial explosion (the parameters needed grew exponentially while computing
        power did not keep up) and a lack of data, so funding dried up [^1]. A shortage of engineers or
        conflicts between countries are not among the causes the lesson gives [^1].
      why:
        1: The lesson names limited compute, combinatorial explosion and a lack of data, not a shortage of engineers.
        2: Political conflicts are not among the causes given; the slowdown came from technical limits and the loss of funding that followed.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
      references_replace: true
  quiz-4/q3:
    difficulty: easy
    fix:
      explanation: |
        The 1956 Dartmouth Summer Research Project is called a seminal event for AI as a field: the
        term "artificial intelligence" was coined there, and it started discussions on symbolic methods
        and early expert systems [^1][^2]. Turing's test (1950) proposed a way to judge whether a machine
        can think; it shaped the idea of AI but was not the event that founded the field [^1]. The AI
        Winter was a later period of lost funding and confidence, the opposite of expansion [^1].
      options:
        0: Turing's 1950 paper proposing the Turing test
        2: The funding collapse of the AI Winter
      why:
        0: Turing's paper shaped the idea of machine intelligence, but the field was founded and named at Dartmouth six years later.
        2: The AI Winter was a later period of lost funding and confidence, the opposite of expansion.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
          locator: 'Lesson: History of machine learning, secs. 1950: Machines that think, 1956: Dartmouth Summer Research Project, 1974 - 1980: "AI Winter"'
        - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
          url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
          locator: Page text (1956)
      references_replace: true
  quiz-5/q2:
    difficulty: easy
    fix:
      explanation: |
        The lesson defines "unfairness" as negative impacts, or harms, for a group of people, such as
        groups defined by race, gender, age or disability status [^1]. Its five harm types
        (allocation, quality of service, denigration, over- or under-representation, stereotyping)
        all describe a whole group being treated worse, not a single person's bad outcome [^1]. The
        harmed groups are typically under-represented communities whose data is likely to be biased,
        rather than the majority [^2].
      why:
        1: Unfairness is defined as harm to a group of people (by race, gender, age, …), not one individual's bad outcome.
        2: The harmed groups are usually under-represented ones, not the majority.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Inclusiveness)'
      references_replace: true
  quiz-9/q3:
    difficulty: easy
    fix:
      question: Which of these problems is a regression problem?
      explanation: |
        Regression predicts a numeric value, and a final exam mark is a number on a scale [^1][^2]. Blood
        type and spam versus not-spam are category assignments, so predicting them is classification
        [^1][^2].
      why:
        1: Blood type is one of a few categories (A, B, AB, O), so predicting it is classification [^2].
        2: Spam or not spam is a yes/no category, so this is (binary) classification [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
          locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#regression
          locator: Sec. 1.3.1.1 Regression and Sec. 1.3.1.2 Classification
      references_replace: true
  quiz-14/q1:
    difficulty: easy
    fix:
      explanation: Polynomial regression adds powers of the inputs (such as $x^2$) as extra features, so the fitted curve can bend to follow nonlinear data [^1]. The model is still linear in its weights, which means the usual least-squares machinery can fit it [^2]. Plain linear regression can only fit a straight line (or plane), while "spherical" names no regression method in Microsoft's ML-For-Beginners lesson, which introduces polynomial regression for exactly this case [^1].
      why:
        0: Plain linear regression fits a straight line (or flat plane), which cannot follow a curved trend [^1].
        1: "'Spherical' is not a regression method for curved trends; the standard way to let a linear model bend is to add powers of the inputs as features [^2]."
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#polynomial-regression
          locator: 'Lesson: Linear and Polynomial Regression, Polynomial Regression'
        - title: scikit-learn User Guide
          url: https://scikit-learn.org/stable/modules/linear_model.html#polynomial-regression-extending-linear-models-with-basis-functions
          locator: 'Sec. 1.1.16 Polynomial regression: extending linear models with basis functions'
      references_replace: true
  quiz-14/q3:
    difficulty: easy
    fix:
      explanation: |
        Least squares takes each point's vertical distance to the line (its residual) and squares it,
        so errors above and below the line count the same way. It then adds the squares up, and the
        best line is the one with the smallest total [^1][^2]. Subtracting the squared values would let
        errors cancel out, and multiplying the residuals plays no part in the method.
      why:
        0: Subtracting would let the errors of different points cancel, so a badly fitting line could get a small total; least squares adds the squared residuals up [^2].
        1: A product of residuals is no measure of fit (a single point on the line would make it 0); least squares sums the squared residuals [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#a-linear-regression-line
          locator: 'Lesson: Linear and Polynomial Regression, A linear regression line'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#an-objective-measure-for-finding-the-best-line
          locator: Sec. 7.2.2 An objective measure for finding the best line
      references_replace: true
  quiz-15/q1:
    difficulty: easy
    fix:
      question: Which of these would you use logistic regression to predict?
      explanation: |
        Logistic regression predicts a binary category, a yes/no answer such as ripe or not ripe [^1].
        The number of tickets sold is a numeric quantity, which is a job for linear regression [^1][^2].
        The sky's color has many possible values. It could be framed as a multiclass problem for the
        multinomial extension, but it is not the two-class question that plain logistic regression is
        built for [^1].
      why:
        1: A number of tickets is a numeric quantity, a regression target such as linear regression predicts, not a yes/no category [^1][^2].
        2: The sky's color has many possible values, so it is not the two-class question that plain logistic regression answers; at most it could be framed as multiclass classification [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#binary-classification
          locator: 'Lesson: Logistic Regression, Introduction, Binary classification and Other classifications'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression
          locator: Logistic Regression (module introduction)
      references_replace: true
  quiz-15/q2:
    difficulty: easy
    fix:
      explanation: |
        Besides the binary case, Microsoft's ML-For-Beginners logistic-regression lesson names two more
        kinds of logistic regression [^1]. Multinomial handles more than two unordered categories (such
        as the pumpkin colors orange, white and striped), and ordinal handles categories with a natural
        order, such as pumpkin sizes [^1]. "Cardinal" and "principal" are not types of logistic
        regression. The multinomial form is also what scikit-learn fits for multiclass problems [^2].
      why:
        0: '"Cardinal" is not a kind of logistic regression; the variant for ordered categories is called ordinal [^1].'
        2: '"Principal" belongs to principal component analysis, an unsupervised method, not to logistic regression; the other variant is multinomial [^1].'
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#other-classifications
          locator: 'Lesson: Logistic Regression, Other classifications'
        - title: scikit-learn User Guide
          url: https://scikit-learn.org/stable/modules/linear_model.html#multinomial-case
          locator: Sec. 1.1.11.2 Multinomial Case
      references_replace: true
  quiz-27/q3:
    difficulty: easy
    fix:
      explanation: |
        Clustering assumes the data are unlabelled: there are no target outputs, and the algorithm
        groups the points using patterns it finds on its own. Learning without labels is what makes
        it unsupervised [^1]. Supervised learning needs labelled examples that show the correct
        output. Reinforcement learning learns by trying to maximise a reward signal. Clustering uses
        neither labels nor rewards [^2].
      why:
        0: Supervised learning needs labelled examples that show the correct output; clustering works on unlabelled data [^1].
        2: Reinforcement learning learns from a reward signal by acting in an environment; clustering has neither actions nor rewards [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md
          locator: 'Lesson: Introduction to Clustering (opening paragraph)'
        - title: 'Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)'
          url: http://incompleteideas.net/book/the-book-2nd.html
          locator: Sec. 1.1 Reinforcement Learning, p. 2
      references_replace: true
  quiz-30/q1:
    difficulty: easy
    fix:
      explanation: |
        K-means assigns every point to its nearest centroid, which cuts the space into one cell per
        centroid. A Voronoi diagram draws exactly this: each seed point together with the region of
        space closest to it [^1]. Each Voronoi cell is one cluster. K-means alternates between
        computing these cells and moving each centroid to the mean of its cell [^2]. Variance and
        inertia are single numbers that summarise how spread out the points are. A map of regions
        does not show them [^1][^2].
      options:
        0: a cluster's variance around its seed
        2: a cluster's inertia around its seed
      why:
        0: Variance is a single number that describes how spread out the points are; a Voronoi diagram is a map of regions [^1].
        2: Inertia is the summed squared distance of the points to their centroids, one number for the whole clustering, not a picture of regions [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
          locator: "Lesson: K-Means Clustering, sections 'Introduction' (Voronoi diagrams) and 'Variance'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-30/q3:
    difficulty: easy
    fix:
      explanation: |
        The number of clusters $k$ is an input to k-means. The algorithm starts by choosing $k$
        initial centroids, so $k$ must be fixed before it runs [^1][^2]. ML-For-Beginners' K-Means lesson calls this a drawback of k-means and uses the elbow method (plotting inertia against $k$) to choose a
        sensible value [^1].
      why:
        1: 'k-means cannot start without $k$: its first step picks $k$ initial centroids [^1][^2].'
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
          locator: "Lesson: K-Means Clustering, sections 'Introduction' and 'Elbow method'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-33/q1:
    difficulty: easy
    fix:
      question: What does tokenization do?
      explanation: |
        Tokenization is usually the first step of an NLP pipeline: it splits the text into tokens,
        typically words [^1]. Splitting at punctuation alone is not enough, since punctuation and the
        word and sentence delimiters of different languages must be handled, which is what makes
        tokenization tricky [^1]. Grouping words into phrases happens in later steps such as n-grams or
        noun-phrase extraction [^1]. In general a token is whatever unit the model treats as atomic:
        words, characters or word pieces [^2].
      why:
        0: 'Punctuation is only one clue: tokenization has to find word boundaries, and the delimiters differ between languages [^1].'
        2: Grouping words into phrases, such as n-grams or noun phrases, happens in later steps [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#tokenization
          locator: 'Lesson: Common NLP tasks and techniques, secs. Tokenization, N-grams, Noun phrase Extraction'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#tokenization
          locator: Sec. 9.2.2 Tokenization and 9.2.6 Summary
      references_replace: true
  quiz-33/q3:
    difficulty: easy
    fix:
      question: What does part-of-speech tagging do?
      explanation: |
        Part-of-speech tagging takes words that have already been tokenized and labels each one with its
        part of speech, such as noun, verb or adjective (in "the quick red fox jumped", fox is a noun and
        jumped a verb) [^1]. Formally it maps a sequence of words to a sequence of tags, exactly one tag
        per word [^2]. It labels words rather than cutting the sentence into pieces, and working out how
        words relate to each other, as a sentence diagram does, is parsing [^1].
      options:
        1: tags each tokenized word with its part of speech
        2: diagrams how the words of a sentence relate to each other
      why:
        0: Part-of-speech tagging labels the words; it does not cut the sentence into pieces [^1][^2].
        2: Working out how the words relate to each other, as a sentence diagram does, is parsing [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#parsing--part-of-speech-tagging
          locator: 'Lesson: Common NLP tasks and techniques, sec. Parsing & Part-of-speech Tagging'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
          url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
          locator: Sec. 18.2 Part-of-Speech Tagging
      references_replace: true
  quiz-34/q3:
    difficulty: easy
    fix:
      question: What does sentiment analysis do?
      explanation: |
        Sentiment analysis measures how positive or negative a sentence or text is; a common scale is
        polarity from -1.0 (negative) to 1.0 (positive), often reported together with subjectivity [^1].
        Jurafsky and Martin define it as classifying the positive or negative orientation a writer
        expresses toward something, as in a product or movie review [^2]. It is not about
        "sentimentality", and recognising one particular emotion such as sadness is a separate task,
        emotion detection [^2].
      why:
        1: Sentiment analysis measures polarity, how positive or negative a text is, not how sentimental it is [^1].
        2: Recognizing one particular emotion such as sadness is a separate task, emotion detection [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#sentiment-analysis
          locator: 'Lesson: Common NLP tasks and techniques, sec. Sentiment analysis'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 4 Logistic Regression and Text Classification
          url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
          locator: Ch. 4 introduction; Sec. 4.9.1 Evaluating with more than two classes
      references_replace: true
  quiz-35/q1:
    difficulty: easy
    fix:
      question: What does a naive translation program do?
      explanation: |
        A naive translation program translates the words only and ignores the sentence structure of
        the target language [^1]. In the ML-For-Beginners example, English "I feel happy" is
        subject-verb-adjective, but Irish expresses emotions as being "upon" you (Tá athas orm,
        literally "happy is upon me"); a word-by-word rendering gives "Mise bhraitheann athas", which is
        not a valid Irish sentence [^1]. Because it works word by word, naive translation carries over
        neither sentence structure nor meaning such as sentiment [^1].
      why:
        1: It ignores the sentence structure of the target language, which is why its word-by-word output can be ungrammatical [^1].
        2: Working word by word, it carries over neither the sentence structure nor meaning such as sentiment [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#translation
          locator: 'Lesson: Translation and sentiment analysis with ML, secs. Example sentence, English to Irish and Translation'
      references_replace: true
  quiz-35/q2:
    difficulty: easy
    fix:
      explanation: |
        A corpus is a body of texts, the collection a system learns from or searches over [^2]. In Microsoft's
        ML-For-Beginners translation lesson, machine translation needs "lots of text (a corpus)" in both languages so that a model can
        pick up patterns from existing human translations [^1]. A corpus is a collection, not one
        standard text, and the corpora used in NLP are usually large because the model needs many
        examples to learn reliable patterns [^1].
      why:
        0: The corpora used in NLP are usually large, because a model needs many examples to learn reliable patterns [^1].
        2: A corpus is a body, that is a collection, of texts, not a single text [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#machine-learning-approaches
          locator: 'Lesson: Translation and sentiment analysis with ML, sec. Machine learning approaches'
        - title: Manning, Raghavan & Schütze, Introduction to Information Retrieval (2008)
          url: https://nlp.stanford.edu/IR-book/html/htmledition/an-example-information-retrieval-problem-1.html
          locator: Sec. 1.1 An example information retrieval problem
          quote: It is sometimes also referred to as a corpus (a body of texts).
      references_replace: true
  quiz-40/q2:
    difficulty: easy
    fix:
      explanation: |
        Microsoft's ML-For-Beginners hotel-review lesson defines stop words as common English words that do not change the sentiment of a
        sentence, and removing them is the first step to make sentiment analysis faster without making
        it less accurate: the longest negative review shrank from 395 to 195 words [^1]. Both statements
        are therefore part of the definition. Search engines use the same idea, discarding a stop list
        of extremely frequent, low-value words [^2]. The idea has limits: stop words do carry meaning,
        and modern RNN and Transformer models usually keep them [^3]. Some stop lists even contain
        negations such as "not", which do change the sentiment; scikit-learn warns that its built-in
        English list has known issues [^4].
      options:
        0: very common words, such as "the" or "is", that carry little meaning on their own
      why:
        0: 'True, but only half of it: these are also the words you remove to speed up sentiment analysis, so both statements describe stop words [^1].'
        1: 'True, but only half of it: they can be removed because they are very common words that carry little meaning, so both statements describe stop words [^1].'
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/5-Hotel-Reviews-2/README.md#removing-stop-words
          locator: 'Lesson: Sentiment analysis with hotel reviews, sec. Removing stop words'
        - title: Manning, Raghavan & Schütze, Introduction to Information Retrieval (2008)
          url: https://nlp.stanford.edu/IR-book/html/htmledition/dropping-common-terms-stop-words-1.html
          locator: 'Sec. 2.2.2 Dropping common terms: stop words'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
          locator: Sec. 9.2.5 Exploratory Language Statistics
        - title: 'scikit-learn User Guide: Feature extraction'
          url: https://scikit-learn.org/stable/modules/feature_extraction.html#using-stop-words
          locator: Text feature extraction, Using stop words
      references_replace: true
  quiz-41/q2:
    difficulty: easy
    fix:
      explanation: |
        A time series is a sequence of data points indexed in time order. Most commonly, the points
        are taken at successive, equally spaced points in time, such as a stock index's daily
        closing value [^1]. Forecasting texts likewise work with series observed at regular time
        intervals: hourly, daily, monthly and so on [^2]. What defines a time series is the time
        index, not position in space.
      why:
        0: What defines a time series is its time index; values spaced along a line in space are spatial data [^1].
        2: Space is not part of the definition; a time series is indexed by time alone [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#some-definitions
          locator: "Lesson: Intro to Time Series, section 'Some definitions'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/data-methods.html
          locator: Sec. 1.4 Forecasting data and methods
      references_replace: true
  quiz-42/q1:
    difficulty: easy
    fix:
      explanation: |
        A trend is a long-term increase or decrease in the data. It can rise, fall or change
        direction, and it does not have to be linear [^1][^2]. So it covers both increases and
        decreases, not decreases alone, and it is a movement of the level of the series, not a gap
        between rises and falls [^2].
      why:
        1: A trend can rise as well as fall, so it is not about decreases alone [^2].
        2: A trend is a long-term movement in the level of the series, not a gap between its rises and falls [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
          locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Trends)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/tspatterns.html
          locator: Sec. 2.3 Time series patterns
      references_replace: true
  quiz-42/q2:
    difficulty: easy
    fix:
      question: In a time series, outliers are
      explanation: |
        Outliers are observations that lie far from the bulk of the data, outside its usual
        spread [^1][^2]. They may be errors or genuinely unusual events. Extreme outliers can break
        most forecasting methods, so they need attention before modelling [^2]. Points close to or
        within the normal spread are ordinary observations.
      options:
        0: points that lie close to the mean of the data
        1: points that lie far outside the usual spread of the data
        2: points that lie within the usual spread of the data
      why:
        0: Points near the mean are the most typical observations, the opposite of outliers [^2].
        2: Points inside the normal spread are ordinary observations; outliers lie far from the bulk of the data [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
          locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Outliers)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/missing-outliers.html#outliers
          locator: Sec. 13.9 Dealing with outliers and missing values
      references_replace: true
  quiz-43/q1:
    difficulty: easy
    fix:
      explanation: |
        ARIMA stands for AutoRegressive Integrated Moving Average [^1][^2]. "Integrated" refers to
        differencing: the model is fitted to a differenced series, and integration is the reverse of
        differencing [^2]. "Moving average" means the model regresses on past forecast errors, while
        the autoregressive part uses past values of the series [^1][^2]. So neither "Integral" nor
        "Moving Action" is right.
      why:
        0: The I stands for *Integrated*. The model is fitted to a differenced series, and integration undoes the differencing [^2].
        1: MA stands for *moving average*, a regression on past forecast errors [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#arima-in-the-context-of-time-series
          locator: "Lesson: Time Series ARIMA, sections 'Introduction' and 'ARIMA in the context of time series'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/non-seasonal-arima.html
          locator: Sec. 9.5 Non-seasonal ARIMA models
      references_replace: true
  quiz-43/q3:
    difficulty: easy
    fix:
      explanation: |
        Differencing replaces each observation with its change from the previous one,
        $y'_t = y_t - y_{t-1}$, or from the same season one period earlier, $y_t - y_{t-m}$ [^2].
        This removes changes in the level of the series, which eliminates, or at least reduces,
        trend and seasonality [^1][^2]. What differencing stabilises is the *mean* of the series:
        ML for Beginners defines it as eliminating trend and seasonality and consequently
        stabilising the mean, so "stabilizes trend and seasonality" mixes the two up [^1].
      why:
        0: Differencing stabilizes the *mean* of the series by removing trend and seasonality; it does not keep them stable [^2].
        1: Differencing removes changes in the level of the series, so it reduces trend and seasonality rather than amplifying them [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
          locator: "Lesson: Time Series ARIMA, section 'General concepts' (Differencing)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/stationarity.html#differencing
          locator: Sec. 9.1 Stationarity and differencing (Differencing; Seasonal differencing)
      references_replace: true
  quiz-44/q2:
    difficulty: easy
    fix:
      question: The SARIMAX class in statsmodels is used to fit
      explanation: |
        SARIMAX is statsmodels' Seasonal AutoRegressive Integrated Moving Average model with
        eXogenous regressors [^2]. ML for Beginners uses it for its energy-load data because they
        are seasonal [^1]. Besides the usual $(p, d, q)$, a seasonal ARIMA has a second set
        $(P, D, Q)$ that models the seasonal part of the series [^3]. The "S" stands for seasonal,
        not special or statistical [^2].
      options:
        0: seasonal ARIMA models
        1: special ARIMA models
        2: statistical ARIMA models
      why:
        1: The S in SARIMAX stands for *seasonal*; it adds a seasonal $(P, D, Q)$ part to the usual $(p, d, q)$ [^2][^3].
        2: Every ARIMA model is statistical. The S stands for *seasonal*, and the X for exogenous regressors [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#implement-arima
          locator: "Lesson: Time Series ARIMA, section 'Implement ARIMA'"
        - title: 'statsmodels documentation: statsmodels.tsa.statespace.sarimax.SARIMAX'
          url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.statespace.sarimax.SARIMAX.html
          locator: Class description
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/seasonal-arima.html
          locator: Sec. 9.9 Seasonal ARIMA models
      references_replace: true
  quiz-44/q3:
    difficulty: easy
    fix:
      explanation: |
        Walk-forward validation trains on the data up to some time, forecasts the next step and
        compares the forecast with the actual value. It then adds that value to the training set and
        trains again. The model is re-trained at every step as new data arrive [^1]. This is the
        time-series version of cross-validation: each test point is forecast only from earlier
        observations, and the forecast origin rolls forward in time [^2]. Simply re-scoring a fixed
        model, or changing its configuration at each step, is not what the method does [^1].
      why:
        0: Each step does score a forecast, but the defining feature is that the model is re-trained with the new observation before the next forecast [^1].
        2: The model's configuration (its orders and settings) stays fixed; only its fit is updated as new data arrive [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#evaluate-your-model
          locator: "Lesson: Time Series ARIMA, section 'Evaluate your model'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/tscv.html
          locator: Sec. 5.10 Time series cross-validation
      references_replace: true
  quiz-45/q3:
    difficulty: easy
    fix:
      explanation: |
        In the ML-For-Beginners grid world the reward function gives every state a score: $-10$ for water or the wolf,
        $+10$ for the apple and $-0.1$ for an ordinary move, with higher numbers meaning better
        outcomes [^1]. The general MDP formulation is broader. The reward arrives after the agent
        acts in a state, so it can depend on the state, the action and the next state, as in
        $p(s', r \mid s, a)$ [^2]. Scoring states alone is the simpler special case that grid world uses.
      why:
        1: A reward function does score the outcomes the agent reaches, e.g. −10 for water or the wolf, +10 for the apple and −0.1 for an ordinary move in the ML-For-Beginners grid world; in general it can also depend on the action and the next state [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#reward-function
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Reward function"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.1 The Agent–Environment Interface, Eqs. (3.1)–(3.2), pp. 47–48
      references_replace: true
  quiz-47/q1:
    difficulty: easy
    fix:
      explanation: |
        Chess and Go are played on a board with fixed rules, and a position is one of a finite set
        of configurations. Their state is therefore discrete [^1]. A continuous state is described
        by real numbers, like CartPole's cart position and velocity, pole angle and rotation
        rate [^1]. Go's action space is discrete as well, since only a finite number of moves is
        available [^2].
      why:
        0: A chess or Go position is one of a finite set of board configurations, so the state is discrete; continuous states are real-valued, like CartPole's [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
          locator: Reinforcement lesson 2 "CartPole Skating", introduction and section "Exercise - initialize a cartpole environment"
        - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
          url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#action-spaces
          locator: Section "Action Spaces"
      references_replace: true
  quiz-47/q3:
    difficulty: easy
    fix:
      explanation: |
        RL needs an environment or simulator that enforces the rules of the game, where experiments
        can be run and their results observed [^1]. A simulation environment such as OpenAI Gym
        simulates anything from Atari games to the physics of pole balancing, so the agent can play
        out as many scenarios as it needs [^1][^2]. Guessing and checking by hand, or testing
        individual state transitions, cannot produce that volume of experience. The ML-For-Beginners CartPole agent, for example, trains on 100,000 simulated episodes [^2].
      why:
        0: Guessing and checking by hand cannot produce the many thousands of episodes an agent learns from; a simulator plays them out automatically [^1][^2].
        2: State transition testing is a software-testing technique for checking individual transitions; it does not play out whole games for an agent to learn from.
      references:
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/6-Other/22-DeepRL/README.md#openai-gym
          locator: Lesson 22 "Deep Reinforcement Learning", introduction and section "OpenAI Gym"
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#openai-gym
          locator: Reinforcement lesson 2 "CartPole Skating", section "OpenAI Gym"
      references_replace: true
  quiz-48/q1:
    difficulty: easy
    fix:
      explanation: |
        Each Gym environment defines an action space, which lists the possible actions, and an
        observation space, which describes what the agent receives. For CartPole the action space
        is discrete, with just two actions, left and right [^1]. In general, the action space is the
        set of all actions available in an environment, and it can be discrete or continuous [^2].
        "Methods" and "action list" are not the standard terms.
