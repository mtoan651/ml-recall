          locator: 'Lesson: Cuisine classifiers 2, sec. K-Neighbors classifier'
      references_replace: true
  "quiz-24/q1":
    topic: svm
    difficulty: easy
    fix:
      question: 'Support vector machines (SVMs) can be used for:'
      explanation: |
        Support vector machines are a family of methods used for both classification and regression
        [^1][^2]. Support-vector classifiers such as scikit-learn's SVC, NuSVC and LinearSVC handle
        classification. The same method extended to regression is Support Vector Regression (SVR),
        which fits a function and ignores training points whose prediction is already close to the
