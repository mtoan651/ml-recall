  "quiz-12/q1":
    difficulty: easy
    fix:
      question: '`dataset` is a pandas DataFrame. Which call tells you how many values are missing in each column?'
      explanation: |
        `isnull()`, an alias of `isna()`, returns a same-shaped table of booleans that is True
        wherever a value is missing [^1]; `.sum()` then adds up the Trues column by column, which gives
        the number of missing values per column. The pumpkin lesson runs `pumpkins.isnull().sum()` for
        exactly this check [^2]. `dropna()` drops the rows or columns that contain missing data and
        `fillna(0)` replaces missing values with 0 [^3]: both change the data instead of reporting how
        much is missing. `.any()` returns only whether each column has at least one True, so it tells
        you *whether* values are missing, not how many [^4].
      options:
        - text: '`dataset.isnull().sum()`'
          correct: true
        - text: '`dataset.isnull().any()`'
        - text: '`dataset.dropna()`'
        - text: '`dataset.fillna(0)`'
      references:
        - title: 'pandas API reference: DataFrame.isnull'
          url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.isnull.html
          locator: DataFrame.isnull (alias of DataFrame.isna)
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/2-Data/README.md#first-check-for-missing-dates
          locator: 'Lesson: Prepare and visualize data for regression, sec. First, check for missing dates'
        - title: 'pandas User Guide: Working with missing data'
          url: https://pandas.pydata.org/docs/user_guide/missing_data.html#dropping-missing-data
          locator: Secs. Dropping missing data and Filling missing data
        - title: 'pandas API reference: DataFrame.any'
          url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.any.html
          locator: Method description
      references_replace: true
  "quiz-12/q2":                         # bar plot for the spread of groups
    difficulty: easy
    fix:
      question: Which kind of plot is best for comparing how spread out the values are in several groups, for example pumpkin prices in each month?
      explanation: |
        A box plot shows the distribution of a quantitative variable across the levels of a
        category: the box marks the quartiles, the whiskers show the rest of the distribution, and
        outliers are drawn separately, so the spread of the groups can be compared side by side [^1].
        A bar plot shows one aggregate, such as the mean, as the height of each bar, and its error bar
        shows the uncertainty of that estimate, not the spread of the data [^2]. The lesson's bar chart
        of mean price per month answers "which months are most expensive?", not how widely prices vary
        within a month [^3]. A line through the group means likewise shows only their centres.
      options:
        0: A box plot per group
        1: A bar plot of each group's mean
        2: A line plot of each group's mean
      correct:
        - 0
      references:
        - title: 'seaborn API reference: seaborn.boxplot'
          url: https://seaborn.pydata.org/generated/seaborn.boxplot.html
          locator: Function description
        - title: 'seaborn API reference: seaborn.barplot'
          url: https://seaborn.pydata.org/generated/seaborn.barplot.html
          locator: Function description
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/2-Data/README.md#bar-charts-to-show-distributions
          locator: 'Lesson: Prepare and visualize data for regression, secs. Make it useful and Bar charts to show distributions'
      references_replace: true
