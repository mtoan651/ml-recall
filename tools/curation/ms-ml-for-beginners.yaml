  "quiz-36/q3":
    topic: nlp-tasks
    difficulty: medium
    fix:
      question: How does a machine-learning approach to sentiment analysis differ from scoring texts with a hand-made list of positive and negative words?
      explanation: |
        The non-ML approach adds up the words a person has marked as positive or negative, which a
        sarcastic sentence easily fools [^1]. The ML approach starts from texts where a human has
        given both a score and a written opinion, such as movie reviews, and lets patterns emerge: for
        example, positive reviews contain "Oscar worthy" more often than negative ones [^1]. A longer
        word list is still the hand-made approach. Clustering unlabeled texts cannot tell you which
        group, if any, is the positive one; the ML approach relies on the human scores for that [^1].
      options:
        0: It uses a longer hand-made list of positive and negative words
        1: It learns which words and phrases go with positive or negative opinions from texts people have already scored
        2: It clusters unlabeled texts into two groups and simply assumes that one group is positive and the other negative
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#ml-approaches
          locator: 'Lesson: Translation and sentiment analysis with ML, secs. Sentiment analysis and ML approaches'
      references_replace: true
