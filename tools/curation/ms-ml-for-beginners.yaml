      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/4-Applied/README.md#build-your-model
          locator: 'Lesson: Build a cuisine recommender web app, secs. Build your model and Build a recommender web application'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---build-a-flask-app
          locator: 'Lesson: Build a web app to use a ML model, sec. Exercise - build a Flask app'
      references_replace: true
  "quiz-25/q3":
    drop: duplicate
    comment: made unambiguous ('ONNX Runtime runs an exported model'), it is covered by quiz-17/q1 (what ONNX is for) and quiz-25/q2 (running an exported model inside the web page)
  "quiz-26/q1":
    drop: tool-specific
    comment: Netron is a niche model-viewer app; 'it visualizes a model's structure' is UI trivia
  "quiz-26/q2":
    drop: tool-specific
    comment: the name of the converter package (sklearn-onnx) is package trivia; what ONNX is for is kept in quiz-17/q1
  "quiz-26/q3":
    topic: ml-basics
    difficulty: easy
    fix:
      question: 'Using a trained model to make predictions on new inputs, as a web app does when a user submits a form, is called:'
      explanation: |
        Inference is the process of making predictions by applying a trained model to new, unlabeled
        examples [^1]. In the terms of Microsoft's ML-for-Beginners course, the app takes the user's
        input and sends it to the model for inference [^2]. Training is the earlier step in which the
        model is fitted to the training data, and validation uses a separate set of examples to tune
        the model's hyperparameters [^2].
      options:
        1: training
        2: validation
      why:
        1: Training is the earlier step that fits the model to labeled data; a web app answering a form uses the finished model.
        2: Validation scores a model on held-out labeled examples to tune its hyperparameters; it does not serve predictions to users.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference
          locator: 'Production ML systems: Static versus dynamic inference'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#prediction
          locator: 'Lesson: Techniques of Machine Learning, secs. Split your dataset, Train a model and Prediction'
      references_replace: true
  "quiz-27/q1":
    drop: duplicate
    comment: the laundry analogy is not a question; turned into an ML scenario (group customers by buying habits without labels) it is ml-basics-021
  "quiz-27/q2":
    drop: trivial
    comment: "'banking / e-commerce / both of these' for where clustering is used is answerable without any knowledge"
  "quiz-28/q1":
    difficulty: medium
    fix:
      question: scikit-learn recommends k-means for 'flat geometry' and DBSCAN for 'non-flat geometry'. What does non-flat geometry mean here?
      explanation: |
        In scikit-learn's overview of clustering methods, k-means is listed for general-purpose use
        with even cluster sizes and flat geometry, while DBSCAN suits non-flat geometry and uneven
        cluster sizes [^1]. Non-flat geometry clustering is useful when the clusters have a specific
        shape, a non-flat manifold, for which the standard Euclidean distance is not the right metric
        [^1]. ML-For-Beginners' introduction to clustering describes it as distances measured along a straight line ("flat", Euclidean)
        versus along a curve (non-Euclidean) [^2]. Round clusters of similar size are the flat case
        that k-means handles well, and the term has nothing to do with the number of features.
      options:
        0: The clusters have curved shapes (a non-flat manifold), so Euclidean distance is not the right measure
        1: The data has exactly two features, so all the points lie on a flat plane and plain distances work fine
        2: The clusters are round, of similar size and well separated from each other
      why:
        1: "'Flat' describes the shape of the clusters and the distance that suits them, not the number of features [^1][^2]."
        2: Round clusters of similar size are the flat case, the one that k-means handles well [^1].
      references:
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#overview-of-clustering-methods
          locator: Sec. 2.3.1 Overview of clustering methods
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#getting-started-with-clustering
          locator: "Lesson: Introduction to clustering, sec. Getting started with clustering ('Non-flat' vs. 'flat' geometry)"
      references_replace: true
  "quiz-28/q2":
    difficulty: easy
    fix:
      question: In density-based clustering such as DBSCAN, what happens to a point that lies in a sparse region, far from any dense group of points?
      explanation: |
        Density-based methods assign points to clusters according to how densely they are grouped,
        and points far from the groups are treated as outliers or noise [^1]. In DBSCAN a cluster is
        built from core samples, which have at least `min_samples` neighbours within distance `eps`,
        plus the points close to them; any other point that is at least `eps` away from every core
        sample is an outlier, labelled −1 for noise [^2]. DBSCAN has no centroids, and an isolated
        point lacks the neighbours it would need to become a core sample [^2].
      options:
        0: It is labeled as noise (an outlier) and belongs to no cluster
        1: It becomes the center of a new cluster of its own
        2: It is assigned to the nearest cluster centroid, as in k-means
      why:
        1: To start a cluster, a point must be a core sample with at least `min_samples` neighbours within `eps`; an isolated point has none [^2].
        2: DBSCAN has no centroids and does not force every point into a cluster; points far from every core sample are left as noise [^2].
      references:
        - source: ms-ml-for-beginners
