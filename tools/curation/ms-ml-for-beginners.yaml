  "quiz-50/q1":
    topic: clustering
    difficulty: easy
    fix:
      question: A bank has millions of card transactions, but almost none are labeled as fraud. It wants to group the transactions and flag the ones that fit no usual pattern for review. Which technique fits?
      explanation: |
        Clustering groups unlabeled data, and one of its uses is anomaly detection, for example to
        detect fraud in a dataset of credit-card transactions [^1]. The lesson's fraud example sorts card
        data with k-means, assigns each transaction to a cluster according to how much of an outlier
        it looks, and then examines the riskiest clusters for fraudulent versus legitimate transactions
        [^2]. Regression predicts a numeric target and would need known values to learn from, and NLP
        works on human language, which transaction records mostly are not.
      options:
        0: Regression, to predict the amount of each transaction from the customer's history
        1: Clustering, flagging transactions that lie far from every cluster as outliers
        2: NLP, to analyze the text of each transaction
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md#introduction
          locator: 'Lesson: Introduction to clustering, sec. Introduction'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/9-Real-World/1-Applications/README.md#credit-card-fraud-detection
          locator: 'Lesson: Machine learning in the real world, sec. Credit card fraud detection'
      references_replace: true
  "quiz-50/q2":
    topic: rl-basics
    difficulty: easy
    fix:
      question: Researchers modeled a wildfire as an agent that, in each cell of a landscape, chooses to spread north, south, east or west, or not to spread. Which kind of machine learning frames a problem as an agent choosing actions in states?
      explanation: |
        Reinforcement learning frames a problem as an agent interacting with an environment: in each
        state the agent selects an action, and the environment responds with a new state and a reward
        [^1]. The lesson's forest-management study used reinforcement learning in exactly this way,
        treating the fire as the agent in every cell of the landscape, with the actions spread north,
        south, east, west or not spread [^2]. Time-series forecasting predicts future values of a
        sequence from its past values [^3], and NLP processes human language; neither has an agent that
        chooses actions.
      options:
        0: Reinforcement learning
        1: Time-series forecasting
        2: Natural language processing
      references:
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.1 The Agent–Environment Interface, pp. 47–48
        - source: ms-ml-for-beginners
