# Curation for ms-ml-for-beginners (see docs/content-pipeline.md#curation).
# Refs: quiz-<quiz id>/q<n>, 1-based. Unlisted items are kept with the lesson's default topic.
# Drop reasons: trivial | lesson-specific | tool-trivia | inaccurate | ambiguous | off-scope
# Reviewed 2026-10-09 — 60 of 156 kept; re-reviewed 2026-10-11 under keep-and-fix — 112 kept
# (wrong keys fixed, 'both of the above' turned into select-all or true/false, joke and misspelled
# distractors replaced, lesson-specific stems generalized); duplicates and trivia stay dropped.
items:
  # 1-Introduction
  "quiz-1/q1":
    drop: trivial
    comment: "'Applications of machine learning are all around us' is a true/false platitude that needs no knowledge; nothing in it can be rewritten into a concept"
  "quiz-1/q3":
    fix:
      question: Why might a business choose a machine-learning approach instead of a hand-coded rules engine?
      options:
        - text: The patterns are too complex or change too often to write as rules, but can be learned from data
          correct: true
        - text: An ML model is guaranteed to give the right answer on every input, which hand-written rules can never promise
        - text: An ML model needs no data, only a description of the problem
        - text: Hand-written rules cannot be changed once they are deployed
  "quiz-2/q1":                          # "ML algorithms are meant to simulate the human brain"
    fix:
      type: true_false
      question: 'True or false: machine learning algorithms are designed to simulate the human brain.'
      options:
        - text: 'True'
        - text: 'False'
          correct: true
  "quiz-2/q2":                          # NLP given as a classical ML technique
    fix:
      question: Which of these is a classical machine-learning technique, as opposed to deep learning?
      options:
        - text: Logistic regression
          correct: true
        - text: A convolutional neural network
        - text: A Transformer language model
  "quiz-2/q3":
    drop: trivial
    comment: "'Why should everyone learn the basics of ML?' asks for an opinion (fun / used in many industries / both of the above); there is no fact to test"
  "quiz-3/q2":
    drop: trivial
    comment: joke distractors (Bill Gates, Shakey the robot); naming Turing as a pioneer is history trivia, and what his test measures is kept as quiz-31/q3
  "quiz-4/q1":
    topic: ai-intro
    fix:
      question: Early AI systems such as ELIZA and SHRDLU are often called 'scruffy'. What distinguished 'scruffy' from 'neat' AI?
      options:
        - text: Scruffy labs tweaked programs by hand until they behaved as desired; neat labs relied on logic and formal problem solving
          correct: true
        - text: Scruffy systems learned their behaviour from large collections of data, while neat systems followed rules written by hand
        - text: Scruffy systems ran on cheap hardware; neat systems needed supercomputers
  "quiz-4/q2":
    topic: ai-intro
    fix:
      question: In AI research of the 1960s and 1970s, what was the 'blocks world'?
      options:
        - text: A simple micro-world of blocks to stack and sort, for testing decision-making and language programs like SHRDLU
          correct: true
        - text: A 3D video game used since the 2010s to benchmark deep reinforcement learning agents
        - text: A large dataset of photographs of toy blocks, collected in the 1970s to train the first object detectors for robots
  "quiz-5/q1":
    fix:
      type: true_false
      question: 'True or false: an ML model can only be unfair if someone built it with the intention to discriminate.'
      options:
        - text: 'True'
        - text: 'False'
          correct: true
  "quiz-5/q3":                          # distractors differ by misspellings only
    fix:
      question: Which list names the main types of fairness-related harms that an ML system can cause?
      options:
        0: Allocation, quality of service, stereotyping, denigration, over- or under-representation
        1: Reliability and safety, inclusiveness, security and privacy, transparency, accountability
        2: Overfitting, underfitting, data leakage, label noise, concept drift
  "quiz-6/q1":
    fix:
      question: Which of these can make an ML model unfair?
      options:
        0: Over-reliance on historical data that reflects past inequities
        1: Under-reliance on historical data
        2: Scaling all features to the same range before training the model
  "quiz-6/q2":
    fix:
      type: multiple
      question: Which of these are steps of a fairness assessment, the starting point for mitigating unfairness in an ML model? Select all that apply.
      options:
        - text: Identify the types of harm the system could cause and the groups that might be harmed
          correct: true
        - text: Define metrics that quantify those harms and compare them across the groups
          correct: true
        - text: Drop sensitive features such as gender, which guarantees that the model is fair
        - text: Check only the model's overall accuracy on the test set
  "quiz-6/q3":
    fix:
      question: What can an open-source fairness toolkit such as Fairlearn do for you?
      options:
        0: Compute fairness and performance metrics for each group, so you can compare models
        1: Pick the most accurate model for your application automatically, with no input from you
        2: Decide for you what counts as fair in your application
  "quiz-7/q1":
    fix:
      question: In the usual machine-learning workflow, which order of these two steps is right?
      options:
        0: Prepare the data, then train the model
        1: Choose a training method, then collect and prepare the data
        2: Tune the hyperparameters, then train the model for the first time
  "quiz-7/q2":
    drop: trivial
    comment: "'quantity / shape / both of the above' with a vague 'shape'; that data quality and quantity matter is already asked by ml-basics-027 and ml-basics-047"
  "quiz-7/q3": {topic: data-prep}
  "quiz-8/q1":
    topic: data-prep
    fix:
      type: multiple
      question: Which of these can plotting your data before training help you discover? Select all that apply.
      options:
        - text: Outliers, values far from most of the others
          correct: true
        - text: Unbalanced classes or other potential causes of bias
          correct: true
        - text: The model's accuracy on the test set
        - text: The best learning rate for training
  "quiz-8/q2":
    drop: duplicate
    comment: splitting the data into training and test sets is already asked by ml-basics-004 (hold-out split) and ml-basics-023 (roles of the three subsets); 'turing sets' was a joke distractor
  "quiz-8/q3":
    fix:
      question: In scikit-learn, which call trains a model on the feature matrix `X` and the targets `y`?
      options:
        0: '`model.predict(X)`'
        1: '`model.train()`'
        2: '`model.fit(X, y)`'
  # 2-Regression
  "quiz-9/q1": {topic: data-prep}
  "quiz-9/q2": {topic: data-prep}
  "quiz-10/q2": {topic: data-prep}
  "quiz-11/q1":
    drop: tool-specific
    comment: picking Matplotlib as 'the plotting module' over NumPy and scikit-learn is library name recognition; no ML or data concept to rewrite it around
  "quiz-11/q2":
    fix:
      question: A correlation heatmap shows only a weak linear correlation between Month and pumpkin Price, yet a bar chart of the mean price per month shows a clear peak in September and October. What explains this?
      options:
        0: The correlation coefficient only measures straight-line relationships, so it misses the seasonal pattern
        1: The bar chart must be misleading, because a weak correlation means Month and Price are unrelated
        2: The data must first be split into training and test sets, because a correlation is only meaningful on the test set
  "quiz-11/q3":
    drop: trivial
    comment: asks which step is 'part of data visualization' and the key restates the definition ('a pictorial representation of data'); what visualization reveals is asked by quiz-8/q1 and quiz-11/q2
  "quiz-12/q1":
    fix:
      question: '`dataset` is a pandas DataFrame. Which call tells you how many values are missing in each column?'
      options:
        - text: '`dataset.isnull().sum()`'
          correct: true
        - text: '`dataset.isnull().any()`'
        - text: '`dataset.dropna()`'
        - text: '`dataset.fillna(0)`'
  "quiz-12/q2":                         # bar plot for the spread of groups
    fix:
      question: Which kind of plot is best for comparing how spread out the values are in several groups, for example pumpkin prices in each month?
      options:
        - text: A box plot per group
          correct: true
        - text: A bar plot of each group's mean
        - text: A line plot of each group's mean
  "quiz-12/q3":
    drop: trivial
    comment: "'What can data visualization NOT tell you? Where the dataset was collected' is answerable by common sense; no concept to rewrite it around"
  "quiz-13/q1":
    drop: trivial
    comment: "'Matplotlib is a drawing / data visualization / lending library' has joke distractors and is library name recognition"
  "quiz-13/q2":
    drop: trivial
    comment: "'linear regression uses a straight line' restates the method's name (circle and curve as distractors); linear-regression-001 and -002 already ask the real questions"
  "quiz-13/q3":
    fix:
      question: Before fitting a least-squares line, you compute the correlation coefficient $r$ between the feature and the target. Which values of $r$ suggest that a straight line will fit well?
      options:
        0: Values close to 0
        1: Values close to +1 or −1
        2: Any positive value, however small
  "quiz-14/q2":                         # misspelled distractors
    fix:
      question: Which list contains only regression methods?
      options:
        0: Ridge, lasso, k-means and spectral clustering
        1: Stepwise, ridge, lasso and elastic net
        2: Ridge, PCA, Isomap and elastic net
  "quiz-15/q3":                         # "weak correlations -> logistic regression"
    fix:
      type: true_false
      question: 'True or false: if your features are only weakly correlated with the target, you should switch from linear to logistic regression.'
      options:
        - text: 'True'
        - text: 'False'
          correct: true
  "quiz-16/q1":
    drop: tool-specific
    comment: "'Seaborn is a type of data visualization library' is library name recognition with no ML or data concept"
  "quiz-16/q2": {topic: metrics}
  "quiz-16/q3": {topic: metrics}
  # 3-Web-App
  "quiz-17/q1":
    topic: frameworks
    fix:
      question: What is ONNX (Open Neural Network Exchange) used for?
      options:
        0: Training neural networks faster by spreading the work over several GPUs
        1: Saving trained models in a common format that other frameworks and runtimes can load and run
        2: Labeling raw training data automatically, so that a neural network can then be trained on it
  "quiz-17/q2":
    drop: off-scope
    comment: how Flask's creators describe it ('micro-framework') is web-development trivia, not ML
  "quiz-17/q3":
    fix:
      type: multiple
      question: You save a trained scikit-learn model with Python's `pickle` module. Which statements are true? Select all that apply.
      options:
        - text: '`pickle.dump` serializes the model object into a byte stream that can be written to a file'
          correct: true
        - text: '`pickle.load` rebuilds the model object, so it can predict without being retrained'
          correct: true
        - text: Loading a pickle file from an untrusted source is safe, because the file only holds numbers
        - text: Programs in any language, such as JavaScript, can load the pickle file directly
  "quiz-18/q1":
    drop: tool-specific
    comment: picking Flask over TensorFlow.js and onnx.js is web-framework trivia; the ML idea behind it (running a model on a server vs. inside the page) is kept in quiz-25/q2
  "quiz-18/q2":
    drop: off-scope
    comment: spelling out 'SaaS' is a cloud-computing acronym, not ML
  "quiz-18/q3":
    topic: data-prep
    fix:
      question: What does scikit-learn's `LabelEncoder().fit_transform(['pear', 'apple', 'fig', 'apple'])` return?
      options:
        0: '`[2, 0, 1, 0]`'
        1: '`[0, 1, 2, 1]`'
        2: '`[[0, 0, 1], [1, 0, 0], [0, 1, 0], [1, 0, 0]]`'
  # 4-Classification
  "quiz-19/q2":
    drop: duplicate
    comment: with real distractors this becomes 'which problem is a classification problem?', already asked by ml-basics-018 (spam filter) and ml-basics-002; the upstream distractors were jokes (Can pigs fly?)
  "quiz-19/q3":
    topic: data-prep
    fix:
      question: Before training a cuisine classifier, a dataset with 799 Korean but only 289 Thai recipes is balanced with SMOTE. How does SMOTE balance the classes?
      options:
        - text: It creates new synthetic examples of the smaller classes by interpolating between existing ones
          correct: true
        - text: It duplicates randomly chosen examples of the smaller classes until all of the class counts match
        - text: It deletes examples of the largest class until every class is as small as the smallest one
  "quiz-20/q2":
    fix:
      question: 'True or false: in a recipe dataset used to predict the cuisine, dropping ingredients such as rice, garlic and ginger, which are common in recipes of every cuisine, can help the classifier.'
  "quiz-20/q3":
    topic: data-prep
    fix:
      options:
        0: Imbalanced data looks bad in charts and other visualizations
        1: It yields better results because the model won't skew towards one class
        2: Balancing your data always gives you more data points to train on
  "quiz-21/q1":
    drop: duplicate
    comment: "'balanced, clean data yields the best classification results' is the claim data-prep-005 already tests (why balance your data); as a bare true/false it also overstates"
  "quiz-21/q2":
    fix:
      type: multiple
      question: Which of these are sensible ways to choose a classifier for a new problem? Select all that apply.
      options:
        - text: Use a guide such as an algorithm cheat sheet to shortlist classifiers that suit your data
          correct: true
        - text: Try several candidates and compare them on held-out validation data
          correct: true
        - text: Always use the most complex model available, such as a deep neural network
        - text: Pick the classifier with the highest accuracy on its own training data
  "quiz-22/q2":
    fix:
      question: Which of these is a strategy for applying a binary classifier to a problem with more than two classes, rather than a classification algorithm itself?
      options:
        0: Logistic regression
        1: Decision-tree classification
        2: One-vs-rest (one-vs-all)
      correct:
        - 2
  "quiz-22/q3":
    fix:
      question: How do you check whether a trained classifier is working as expected?
      options:
        0: Measure its predictions (accuracy, precision, recall) on held-out test data
        1: Check that its predictions agree with those of several other algorithms on the same data
        2: Look up how well this type of algorithm has done on similar problems in published studies
  "quiz-23/q1":
    fix:
      question: You follow scikit-learn's 'Choosing the right estimator' map. You have about 6,000 labeled examples and want to predict a category. Which estimator does the map suggest trying first?
      options:
        0: Linear SVC
        1: K-Means
        2: SGD classifier
  "quiz-23/q2":
    topic: linear-regression
    fix:
      question: In scikit-learn's `LogisticRegression` and `SVC`, the parameter `C` controls regularization. What happens when you lower `C` from 1.0 to 0.01?
      options:
        0: 'Regularization gets stronger: the weights are pushed toward smaller values and the model becomes simpler'
        1: 'Regularization gets weaker: the weights may grow larger, so the model can fit the training data more closely'
        2: Only the training speed changes; the fitted model stays the same
  "quiz-23/q3":
    topic: nonparametric
    fix:
      question: "The k-nearest-neighbors classifier (scikit-learn's `KNeighborsClassifier`) is a method of:"
      options:
        0: supervised learning
        1: unsupervised learning
        2: reinforcement learning
      correct:
        - 0
  "quiz-24/q1":
    topic: svm
    fix:
      question: 'Support vector machines (SVMs) can be used for:'
      shuffle: true
      options:
        0: classification but not regression
        1: regression but not classification
        2: both classification and regression
  "quiz-24/q2":
    topic: trees-ensembles
    fix:
      options:
        0: ensemble
        1: linear
        2: instance-based (nearest-neighbor)
  "quiz-24/q3":
    topic: trees-ensembles
    fix:
      options:
        1: focusing on detecting outliers in the data
        2: focusing on removing incorrect data
  "quiz-25/q1":
    drop: trivial
    comment: "'restaurants / fashions / both of these' for what recommenders can be used for is answerable without any knowledge"
  "quiz-25/q2":
    topic: ml-basics
    fix:
      question: 'True or false: if a trained model is exported (for example to ONNX) and run inside the web page itself, instead of on a server that the page calls, the app can keep making predictions while the device is offline.'
  "quiz-25/q3":
    drop: duplicate
    comment: made unambiguous ('ONNX Runtime runs an exported model'), it is covered by quiz-17/q1 (what ONNX is for) and quiz-25/q2 (running an exported model inside the web page)
  "quiz-26/q1":
    drop: tool-specific
    comment: Netron is a niche model-viewer app; 'it visualizes a model's structure' is UI trivia
  "quiz-26/q2":
    drop: tool-specific
    comment: the name of the converter package (sklearn-onnx) is package trivia; what ONNX is for is kept in quiz-17/q1
  "quiz-26/q3":
    topic: ml-basics
    fix:
      question: 'Using a trained model to make predictions on new inputs, as a web app does when a user submits a form, is called:'
      options:
        0: inference
        1: training
        2: validation
  # 5-Clustering
  "quiz-27/q1":
    drop: duplicate
    comment: the laundry analogy is not a question; turned into an ML scenario (group customers by buying habits without labels) it is ml-basics-021
  "quiz-27/q2":
    drop: trivial
    comment: "'banking / e-commerce / both of these' for where clustering is used is answerable without any knowledge"
  "quiz-28/q1":
    fix:
      question: scikit-learn recommends k-means for 'flat geometry' and DBSCAN for 'non-flat geometry'. What does non-flat geometry mean here?
      options:
        0: The clusters have curved shapes (a non-flat manifold), so Euclidean distance is not the right measure
        1: The data has exactly two features, so all the points lie on a flat plane and plain distances work fine
        2: The clusters are round, of similar size and well separated from each other
  "quiz-28/q2":
    fix:
      question: In density-based clustering such as DBSCAN, what happens to a point that lies in a sparse region, far from any dense group of points?
      options:
        0: It is labeled as noise (an outlier) and belongs to no cluster
        1: It becomes the center of a new cluster of its own
        2: It is assigned to the nearest cluster centroid, as in k-means
  "quiz-28/q3":
    drop: trivial
    comment: "'the best-known clustering algorithm' is a popularity claim and the distractors are puns ('k-middle', 'k-mart'); the k-means vs. k-NN confusion is tested by quiz-23/q3"
  "quiz-29/q1":
    fix:
      question: k-means comes from signal processing, where it is used for vector quantization, for example to store a grayscale photo with 8 gray levels instead of 256. What does vector quantization do?
      options:
        0: It projects the data onto the k directions of largest variance and keeps only those coordinates
        1: It replaces each value with the nearest of k representative values, which k-means finds
        2: It splits the signal into k frequency components that are stored separately
      correct:
        - 1
  "quiz-29/q3":
    fix:
      type: multiple
      question: Which statements about variance are true when you cluster data with k-means? Select all that apply.
      options:
        - text: Variance is the average of the squared differences from the mean
          correct: true
        - text: A feature with a much larger variance than the others can dominate the distances, so features are often scaled first
          correct: true
        - text: Variance is the square root of the standard deviation
        - text: k-means finds the same clusters whether or not the features are scaled
  # 6-NLP
  "quiz-31/q1":
    drop: trivial
    comment: spelling out 'NLP' with two near-miss expansions; nothing to learn
  "quiz-31/q2":
    fix:
      question: ELIZA, a 1960s program, played the role of a computer therapist. How did it produce its replies?
      options:
        0: By spotting keywords in the input and rearranging the user's words into canned replies
        1: By generating each reply with a neural language model trained on transcripts of real therapy sessions
        2: By looking up the medically correct answer in a database of diagnoses
  "quiz-31/q3":
    topic: ai-intro
    fix:
      question: What did Alan Turing's 'Turing test' check about a computer?
      options:
        0: Whether a human judge, chatting by text, could not tell its replies from a person's
        1: Whether it truly understands the meaning of the sentences it reads and writes
        2: Whether it can solve arithmetic problems faster and more accurately than a human expert
      correct:
        - 0
  "quiz-32/q1":
    drop: dated-trivia
    comment: the inventor's name (Weizenbaum) with misspelled distractors (Elisha, Eloise); how ELIZA worked is kept as quiz-31/q2
  "quiz-32/q2":
    drop: trivial
    comment: "'random predefined replies / machine intelligence / both of these' is answerable without knowledge; the rule-based vs. learned contrast is tested by quiz-31/q2"
  "quiz-32/q3":
    drop: trivial
    comment: joke distractor ('The bot is dumb, it cannot learn :(') and a vague key ('feed it more data and train it')
  "quiz-33/q2": {topic: text-representation}
  "quiz-34/q1":
    topic: text-representation
    fix:
      type: short_answer
      question: |
        You build a word-frequency dictionary (each distinct word → how many times it occurs,
        ignoring case) for the sentence "The quick red fox jumped over the lazy brown dog". The
        dictionary has {{1}} entries, and the entry for "the" has the value {{2}}.
      answer:
        blanks:
          - numeric: 9
            tolerance: 0
            hint: a number
          - numeric: 2
            tolerance: 0
            hint: a number
        model: 10 words, 9 distinct once case is ignored ("The" and "the" are one entry); "the" occurs twice.
      options: []
  "quiz-34/q2":
    topic: text-representation
    fix:
      question: N-grams are obtained when _____
      options:
        0: a text is split into sequences of words of a set length
        1: a text is split into unordered sets of words of a set size
        2: a text is split into paragraphs of a set length
  "quiz-35/q3":
    topic: nlp-tasks
    fix:
      question: A word-by-word translator gets idioms wrong. What does an ML translation model gain by learning from a large corpus of texts and their human translations?
      options:
        0: It can translate languages that it has never seen any example of
        1: It translates every word literally, one at a time, so that nothing in the text is lost
        2: It learns how whole phrases are usually translated, which improves accuracy
  "quiz-36/q1":
