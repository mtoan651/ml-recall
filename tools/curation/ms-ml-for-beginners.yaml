  "quiz-17/q3":
    difficulty: medium
    fix:
      type: multiple
      question: You save a trained scikit-learn model with Python's `pickle` module. Which statements are true? Select all that apply.
      explanation: |
        Pickling converts a Python object hierarchy, such as a fitted model, into a byte stream, and
        unpickling turns the byte stream back into the object [^1]; the lesson pickles its trained
        model and then reloads it to call `predict` [^2]. Unpickling an untrusted file is not safe:
        malicious pickle data can execute arbitrary code while it loads, and the lesson warns about
        this too [^1][^2]. The format is Python-specific, so non-Python programs may be unable to read
        it; scikit-learn points to ONNX when a model must be served without Python [^1][^3].
      options:
        - text: '`pickle.dump` serializes the model object into a byte stream that can be written to a file'
          correct: true
        - text: '`pickle.load` rebuilds the model object, so it can predict without being retrained'
          correct: true
        - text: Loading a pickle file from an untrusted source is safe, because the file only holds numbers
        - text: Programs in any language, such as JavaScript, can load the pickle file directly
      references:
        - title: 'Python documentation: pickle — Python object serialization'
          url: https://docs.python.org/3/library/pickle.html
          locator: Module introduction, Warning, and Data stream format
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/3-Web-App/1-Web-App/README.md#exercise---pickle-your-model
          locator: "Lesson: Build a web app to use a ML model, secs. Tool and Exercise - 'pickle' your model"
        - title: 'scikit-learn User Guide: Model persistence'
          url: https://scikit-learn.org/stable/model_persistence.html
          locator: Summary of model persistence methods
      references_replace: true
