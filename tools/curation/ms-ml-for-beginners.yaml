  "quiz-23/q2":
    topic: linear-regression
    difficulty: medium
    fix:
      question: In scikit-learn's `LogisticRegression` and `SVC`, the parameter `C` controls regularization. What happens when you lower `C` from 1.0 to 0.01?
      explanation: |
        In both estimators `C` is the inverse of the regularization strength, so smaller values mean
        stronger regularization [^1][^2]. The penalty is on the size of the weights (the SVM minimizes
        $\lVert w \rVert^2$ plus `C` times the margin violations), so a stronger penalty keeps the weights
        smaller: a low `C` makes the decision surface smoother, while a high `C` tries to classify
        every training example correctly. scikit-learn advises lowering `C` when the data are noisy
        [^3]. Raising `C` would weaken the penalty instead. The lesson describes `C` as the setting
        that "regulates the influence of parameters" [^4].
      options:
        0: 'Regularization gets stronger: the weights are pushed toward smaller values and the model becomes simpler'
        1: 'Regularization gets weaker: the weights may grow larger, so the model can fit the training data more closely'
        2: Only the training speed changes; the fitted model stays the same
      references:
        - title: 'scikit-learn API reference: LogisticRegression'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
          locator: Parameter C
        - title: 'scikit-learn API reference: SVC'
          url: https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html
          locator: Parameter C
        - title: 'scikit-learn User Guide: Support Vector Machines'
          url: https://scikit-learn.org/stable/modules/svm.html#tips-on-practical-use
          locator: Secs. 1.4.5 Tips on practical use (Setting C), 1.4.6.1 Parameters of the RBF kernel, 1.4.7.1 SVC
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/4-Classification/3-Classifiers-2/README.md#linear-svc-classifier
          locator: 'Lesson: Cuisine classifiers 2, sec. Linear SVC classifier'
      references_replace: true
  "quiz-23/q3":
    topic: nonparametric
    difficulty: easy
    fix:
      question: "The k-nearest-neighbors classifier (scikit-learn's `KNeighborsClassifier`) is a method of:"
      explanation: |
        The k-NN classifier predicts the class of a new point by a majority vote among the labels of
        its nearest training points, so it needs labeled examples: it is supervised [^1]. The lesson's
        remark that the "neighbors" family serves both supervised and unsupervised learning is about
        the whole family: scikit-learn also offers unsupervised nearest-neighbor search, which finds
        neighbors without using any labels [^1][^2]. The classifier itself involves no actions or
        rewards, so it is not reinforcement learning either.
      shuffle: true
      options:
        2: reinforcement learning
      correct:
        - 0
      references:
        - title: 'scikit-learn User Guide: Nearest Neighbors'
          url: https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification
