        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#the-essence-of-deep-learning
          locator: Sec. 1.7 The Essence of Deep Learning
      references_replace: true
  quiz-3/q1:
    difficulty: easy
    fix:
      explanation: |
        The phrase "artificial intelligence" appears in the proposal McCarthy, Minsky, Rochester and
        Shannon wrote on 31 August 1955 for a summer study at Dartmouth College [^2]. That 1956
        Dartmouth Summer Research Project is where the field got its name [^1][^3], so the answer is the
        1950s. The 1930s predate the field, and the 1980s are known for the spread of commercial
        expert systems [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
          locator: 'Lesson: History of machine learning, sec. 1956: Dartmouth Summer Research Project'
        - title: McCarthy, Minsky, Rochester & Shannon, A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence (1955)
          url: http://jmc.stanford.edu/articles/dartmouth/dartmouth.pdf
          locator: Title page and p. 1
        - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
          url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
          locator: Page text (1956)
      references_replace: true
  quiz-3/q3:
    difficulty: easy
    fix:
      explanation: |
        By the mid-1970s it was clear that building intelligent machines was harder than promised,
        and the first limitation the lesson lists is that compute power was too limited [^1]. Related
        problems were combinatorial explosion (the parameters needed grew exponentially while computing
        power did not keep up) and a lack of data, so funding dried up [^1]. A shortage of engineers or
        conflicts between countries are not among the causes the lesson gives [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1974---1980-ai-winter
          locator: 'Lesson: History of machine learning, sec. 1974 - 1980: "AI Winter"'
      references_replace: true
  quiz-4/q3:
    difficulty: easy
    fix:
      explanation: |
        The 1956 Dartmouth Summer Research Project is called a seminal event for AI as a field: the
        term "artificial intelligence" was coined there, and it started discussions on symbolic methods
        and early expert systems [^1][^2]. Turing's test (1950) proposed a way to judge whether a machine
        can think; it shaped the idea of AI but was not the event that founded the field [^1]. The AI
        Winter was a later period of lost funding and confidence, the opposite of expansion [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/2-history-of-ML/README.md#1956-dartmouth-summer-research-project
          locator: 'Lesson: History of machine learning, secs. 1950: Machines that think, 1956: Dartmouth Summer Research Project, 1974 - 1980: "AI Winter"'
        - title: Dartmouth College, Artificial Intelligence (AI) Coined at Dartmouth
          url: https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth
          locator: Page text (1956)
      references_replace: true
  quiz-5/q2:
    difficulty: easy
    fix:
      explanation: |
        The lesson defines "unfairness" as negative impacts, or harms, for a group of people, such as
        groups defined by race, gender, age or disability status [^1]. Its five harm types
        (allocation, quality of service, denigration, over- or under-representation, stereotyping)
        all describe a whole group being treated worse, not a single person's bad outcome [^1]. The
        harmed groups are typically under-represented communities whose data is likely to be biased,
        rather than the majority [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/3-fairness/README.md#fairness
          locator: 'Lesson: Building ML solutions with responsible AI, sec. Fairness'
        - source: ms-ai-for-beginners
          url: https://github.com/microsoft/AI-For-Beginners/blob/392d0df1b2647cbee104942390551f1ed9e072c8/lessons/7-Ethics/README.md#principles-of-responsible-ai
          locator: 'Lesson: Ethical and Responsible AI, Principles of Responsible AI (Inclusiveness)'
      references_replace: true
  quiz-9/q3:
    difficulty: easy
    fix:
      explanation: |
        Regression predicts a numeric value, and a final exam mark is a number on a scale [^1][^2]. Blood
        type and spam versus not-spam are category assignments, so predicting them is classification
        [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/1-Tools/README.md
          locator: 'Lesson: Introduction to Regression, Exercise - your first Scikit-learn notebook'
        - source: d2l
          url: https://d2l.ai/chapter_introduction/index.html#regression
          locator: Sec. 1.3.1.1 Regression and Sec. 1.3.1.2 Classification
      references_replace: true
  quiz-14/q1:
    difficulty: easy
    fix:
      explanation: |
        Polynomial regression adds powers of the inputs (such as $x^2$) as extra features, so the fitted
        curve can bend to follow nonlinear data [^1]. The model is still linear in its weights, which
        means the usual least-squares machinery can fit it [^2]. Plain linear regression can only fit a
        straight line (or plane), and "spherical" is not a type of regression in the lesson [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#polynomial-regression
          locator: 'Lesson: Linear and Polynomial Regression, Polynomial Regression'
        - title: scikit-learn User Guide
          url: https://scikit-learn.org/stable/modules/linear_model.html#polynomial-regression-extending-linear-models-with-basis-functions
          locator: 'Sec. 1.1.16 Polynomial regression: extending linear models with basis functions'
      references_replace: true
  quiz-14/q3:
    difficulty: easy
    fix:
      explanation: |
        Least squares takes each point's vertical distance to the line (its residual) and squares it,
        so errors above and below the line count the same way. It then adds the squares up, and the
        best line is the one with the smallest total [^1][^2]. Subtracting the squared values would let
        errors cancel out, and multiplying the residuals plays no part in the method.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/3-Linear/README.md#a-linear-regression-line
          locator: 'Lesson: Linear and Polynomial Regression, A linear regression line'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#an-objective-measure-for-finding-the-best-line
          locator: Sec. 7.2.2 An objective measure for finding the best line
      references_replace: true
  quiz-15/q1:
    difficulty: easy
    fix:
      explanation: |
        Logistic regression predicts a binary category, a yes/no answer such as ripe or not ripe [^1].
        The number of tickets sold is a numeric quantity, which is a job for linear regression [^1][^2].
        The sky's color has many possible values. It could be framed as a multiclass problem for the
        multinomial extension, but it is not the two-class question that plain logistic regression is
        built for [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#binary-classification
          locator: 'Lesson: Logistic Regression, Introduction, Binary classification and Other classifications'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression
          locator: Logistic Regression (module introduction)
      references_replace: true
  quiz-15/q2:
    difficulty: easy
    fix:
      explanation: |
        Besides the binary case, the lesson names two more kinds of logistic regression. Multinomial
        handles more than two unordered categories, and ordinal handles categories with a natural order,
        such as pumpkin sizes [^1]. "Cardinal" and "principal" are not types of logistic regression. The
        multinomial form is also what scikit-learn fits for multiclass problems [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/2-Regression/4-Logistic/README.md#other-classifications
          locator: 'Lesson: Logistic Regression, Other classifications'
        - title: scikit-learn User Guide
          url: https://scikit-learn.org/stable/modules/linear_model.html#multinomial-case
          locator: Sec. 1.1.11.2 Multinomial Case
      references_replace: true
  quiz-27/q3:
    difficulty: easy
    fix:
      explanation: |
        Clustering assumes the data are unlabelled: there are no target outputs, and the algorithm
        groups the points using patterns it finds on its own. Learning without labels is what makes
        it unsupervised [^1]. Supervised learning needs labelled examples that show the correct
        output. Reinforcement learning learns by trying to maximise a reward signal. Clustering uses
        neither labels nor rewards [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/1-Visualize/README.md
          locator: 'Lesson: Introduction to Clustering (opening paragraph)'
        - title: 'Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)'
          url: http://incompleteideas.net/book/the-book-2nd.html
          locator: Sec. 1.1 Reinforcement Learning, p. 2
      references_replace: true
  quiz-30/q1:
    difficulty: easy
    fix:
      explanation: |
        K-means assigns every point to its nearest centroid, which cuts the space into one cell per
        centroid. A Voronoi diagram draws exactly this: each seed point together with the region of
        space closest to it [^1]. Each Voronoi cell is one cluster. K-means alternates between
        computing these cells and moving each centroid to the mean of its cell [^2]. Variance and
        inertia are single numbers that summarise how spread out the points are. A map of regions
        does not show them [^1][^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
          locator: "Lesson: K-Means Clustering, sections 'Introduction' (Voronoi diagrams) and 'Variance'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-30/q3:
    difficulty: easy
    fix:
      explanation: |
        The number of clusters $k$ is an input to k-means. The algorithm starts by choosing $k$
        initial centroids, so $k$ must be fixed before it runs [^1][^2]. The lesson calls this a
        drawback of k-means and uses the elbow method (plotting inertia against $k$) to choose a
        sensible value [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/5-Clustering/2-K-Means/README.md#introduction
          locator: "Lesson: K-Means Clustering, sections 'Introduction' and 'Elbow method'"
        - title: 'scikit-learn User Guide: Clustering'
          url: https://scikit-learn.org/stable/modules/clustering.html#k-means
          locator: Sec. 2.3.2 K-means
      references_replace: true
  quiz-33/q1:
    difficulty: easy
    fix:
      explanation: |
        Tokenization is usually the first step of an NLP pipeline: it splits the text into tokens,
        typically words [^1]. Splitting at punctuation alone is not enough, since punctuation and the
        word and sentence delimiters of different languages must be handled, which is what makes
        tokenization tricky [^1]. Grouping words into phrases happens in later steps such as n-grams or
        noun-phrase extraction [^1]. In general a token is whatever unit the model treats as atomic:
        words, characters or word pieces [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#tokenization
          locator: 'Lesson: Common NLP tasks and techniques, secs. Tokenization, N-grams, Noun phrase Extraction'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#tokenization
          locator: Sec. 9.2.2 Tokenization and 9.2.6 Summary
      references_replace: true
  quiz-33/q3:
    difficulty: easy
    fix:
      explanation: |
        Part-of-speech tagging takes words that have already been tokenized and labels each one with its
        part of speech, such as noun, verb or adjective (in "the quick red fox jumped", fox is a noun and
        jumped a verb) [^1]. Formally it maps a sequence of words to a sequence of tags, exactly one tag
        per word [^2]. It labels words rather than cutting the sentence into pieces, and working out how
        words relate to each other, as a sentence diagram does, is parsing [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#parsing--part-of-speech-tagging
          locator: 'Lesson: Common NLP tasks and techniques, sec. Parsing & Part-of-speech Tagging'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 18 Sequence Labeling for Parts of Speech and Named Entities
          url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
          locator: Sec. 18.2 Part-of-Speech Tagging
      references_replace: true
  quiz-34/q3:
    difficulty: easy
    fix:
      explanation: |
        Sentiment analysis measures how positive or negative a sentence or text is; a common scale is
        polarity from -1.0 (negative) to 1.0 (positive), often reported together with subjectivity [^1].
        Jurafsky and Martin define it as classifying the positive or negative orientation a writer
        expresses toward something, as in a product or movie review [^2]. It is not about
        "sentimentality", and recognising one particular emotion such as sadness is a separate task,
        emotion detection [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/2-Tasks/README.md#sentiment-analysis
          locator: 'Lesson: Common NLP tasks and techniques, sec. Sentiment analysis'
        - title: Jurafsky & Martin, Speech and Language Processing, 3rd ed. draft (Aug 2026), Ch. 4 Logistic Regression and Text Classification
          url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
          locator: Ch. 4 introduction; Sec. 4.9 (multi-class tasks)
      references_replace: true
  quiz-35/q1:
    difficulty: easy
    fix:
      explanation: |
        A naive translation program translates the words only and ignores the sentence structure of
        the target language [^1]. In the lesson's example, English "I feel happy" is
        subject-verb-adjective, but Irish expresses emotions as being "upon" you (Tá athas orm,
        literally "happy is upon me"); a word-by-word rendering gives "Mise bhraitheann athas", which is
        not a valid Irish sentence [^1]. Because it works word by word, naive translation carries over
        neither sentence structure nor meaning such as sentiment [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#translation
          locator: 'Lesson: Translation and sentiment analysis with ML, secs. Example sentence, English to Irish and Translation'
      references_replace: true
  quiz-35/q2:
    difficulty: easy
    fix:
      explanation: |
        A corpus is a body of texts, the collection a system learns from or searches over [^2]. In the
        lesson, machine translation needs "lots of text (a corpus)" in both languages so that a model can
        pick up patterns from existing human translations [^1]. A corpus is a collection, not one
        standard text, and the corpora used in NLP are usually large because the model needs many
        examples to learn reliable patterns [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/3-Translation-Sentiment/README.md#machine-learning-approaches
          locator: 'Lesson: Translation and sentiment analysis with ML, sec. Machine learning approaches'
        - title: Manning, Raghavan & Schütze, Introduction to Information Retrieval (2008)
          url: https://nlp.stanford.edu/IR-book/html/htmledition/an-example-information-retrieval-problem-1.html
          locator: Sec. 1.1 An example information retrieval problem
          quote: It is sometimes also referred to as a corpus (a body of texts).
      references_replace: true
  quiz-40/q2:
    difficulty: easy
    fix:
      explanation: |
        The lesson defines stop words as common English words that do not change the sentiment of a
        sentence, and removing them is the first step to make sentiment analysis faster without making
        it less accurate: the longest negative review shrank from 395 to 195 words [^1]. Both statements
        are therefore part of the definition. Search engines use the same idea, discarding a stop list
        of extremely frequent, low-value words [^2]. The idea has limits: stop words do carry meaning,
        and modern RNN and Transformer models usually keep them [^3].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/6-NLP/5-Hotel-Reviews-2/README.md#removing-stop-words
          locator: 'Lesson: Sentiment analysis with hotel reviews, sec. Removing stop words'
        - title: Manning, Raghavan & Schütze, Introduction to Information Retrieval (2008)
          url: https://nlp.stanford.edu/IR-book/html/htmledition/dropping-common-terms-stop-words-1.html
          locator: 'Sec. 2.2.2 Dropping common terms: stop words'
        - source: d2l
          url: https://d2l.ai/chapter_recurrent-neural-networks/text-sequence.html#exploratory-language-statistics
          locator: Sec. 9.2.5 Exploratory Language Statistics
      references_replace: true
  quiz-41/q2:
    difficulty: easy
    fix:
      explanation: |
        A time series is a sequence of data points indexed in time order. Most commonly, the points
        are taken at successive, equally spaced points in time, such as a stock index's daily
        closing value [^1]. Forecasting texts likewise work with series observed at regular time
        intervals: hourly, daily, monthly and so on [^2]. What defines a time series is the time
        index, not position in space.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#some-definitions
          locator: "Lesson: Intro to Time Series, section 'Some definitions'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/data-methods.html
          locator: Sec. 1.4 Forecasting data and methods
      references_replace: true
  quiz-42/q1:
    difficulty: easy
    fix:
      explanation: |
        A trend is a long-term increase or decrease in the data. It can rise, fall or change
        direction, and it does not have to be linear [^1][^2]. So it covers both increases and
        decreases, not decreases alone, and it is a movement of the level of the series, not a gap
        between rises and falls [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
          locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Trends)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/tspatterns.html
          locator: Sec. 2.3 Time series patterns
      references_replace: true
  quiz-42/q2:
    difficulty: easy
    fix:
      explanation: |
        Outliers are observations that lie far from the bulk of the data, outside its usual
        spread [^1][^2]. They may be errors or genuinely unusual events. Extreme outliers can break
        most forecasting methods, so they need attention before modelling [^2]. Points close to or
        within the normal spread are ordinary observations.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/1-Introduction/README.md#time-series-data-characteristics-to-consider
          locator: "Lesson: Intro to Time Series, section 'Time Series data characteristics to consider' (Outliers)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/missing-outliers.html#outliers
          locator: Sec. 13.9 Dealing with outliers and missing values
      references_replace: true
  quiz-43/q1:
    difficulty: easy
    fix:
      explanation: |
        ARIMA stands for AutoRegressive Integrated Moving Average [^1][^2]. "Integrated" refers to
        differencing: the model is fitted to a differenced series, and integration is the reverse of
        differencing [^2]. "Moving average" means the model regresses on past forecast errors, while
        the autoregressive part uses past values of the series [^1][^2]. So neither "Integral" nor
        "Moving Action" is right.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#arima-in-the-context-of-time-series
          locator: "Lesson: Time Series ARIMA, sections 'Introduction' and 'ARIMA in the context of time series'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/non-seasonal-arima.html
          locator: Sec. 9.5 Non-seasonal ARIMA models
      references_replace: true
  quiz-43/q3:
    difficulty: easy
    fix:
      explanation: |
        Differencing replaces each observation with its change from the previous one,
        $y'_t = y_t - y_{t-1}$, or from the same season one period earlier, $y_t - y_{t-m}$ [^2].
        This removes changes in the level of the series, which eliminates, or at least reduces,
        trend and seasonality [^1][^2]. What differencing stabilises is the *mean* of the series:
        the lesson's definition says it eliminates trend and seasonality and consequently stabilises
        the mean, so "stabilizes trend and seasonality" mixes the two up [^1][^2]. It never amplifies
        trend or seasonality.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#general-concepts
          locator: "Lesson: Time Series ARIMA, section 'General concepts' (Differencing)"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/stationarity.html#differencing
          locator: Sec. 9.1 Stationarity and differencing (Differencing; Seasonal differencing)
      references_replace: true
  quiz-44/q2:
    difficulty: easy
    fix:
      explanation: |
        SARIMAX is statsmodels' Seasonal AutoRegressive Integrated Moving Average model with
        eXogenous regressors [^2]. The lesson uses it because the energy data are seasonal. Besides
        the usual $(p, d, q)$, a seasonal ARIMA has a second set $(P, D, Q)$ that models the seasonal
        part of the series [^1][^3]. The "S" stands for seasonal, not special or statistical [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#implement-arima
          locator: "Lesson: Time Series ARIMA, section 'Implement ARIMA'"
        - title: 'statsmodels documentation: statsmodels.tsa.statespace.sarimax.SARIMAX'
          url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.statespace.sarimax.SARIMAX.html
          locator: Class description
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/seasonal-arima.html
          locator: Sec. 9.9 Seasonal ARIMA models
      references_replace: true
  quiz-44/q3:
    difficulty: easy
    fix:
      explanation: |
        Walk-forward validation trains on the data up to some time, forecasts the next step and
        compares the forecast with the actual value. It then adds that value to the training set and
        trains again. The model is re-trained at every step as new data arrive [^1]. This is the
        time-series version of cross-validation: each test point is forecast only from earlier
        observations, and the forecast origin rolls forward in time [^2]. Simply re-scoring a fixed
        model, or changing its configuration at each step, is not what the method does [^1].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/7-TimeSeries/2-ARIMA/README.md#evaluate-your-model
          locator: "Lesson: Time Series ARIMA, section 'Evaluate your model'"
        - title: 'Hyndman & Athanasopoulos, Forecasting: Principles and Practice (3rd ed.)'
          url: https://otexts.com/fpp3/tscv.html
          locator: Sec. 5.10 Time series cross-validation
      references_replace: true
  quiz-45/q3:
    difficulty: easy
    fix:
      explanation: |
        In the lesson the reward function gives every state a score: $-10$ for water or the wolf,
        $+10$ for the apple and $-0.1$ for an ordinary move, with higher numbers meaning better
        outcomes [^1]. The general MDP formulation is broader. The reward arrives after the agent
        acts in a state, so it can depend on the state, the action and the next state, as in
        $p(s', r \mid s, a)$ [^2]. Scoring states alone is the simpler special case the lesson uses.
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/1-QLearning/README.md#reward-function
          locator: Reinforcement lesson 1 "Introduction to Reinforcement Learning and Q-Learning", section "Reward function"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.1 The Agent–Environment Interface, Eqs. (3.1)–(3.2), pp. 47–48
      references_replace: true
  quiz-47/q1:
    difficulty: easy
    fix:
      explanation: |
        Chess and Go are played on a board with fixed rules, and a position is one of a finite set
        of configurations. Their state is therefore discrete [^1]. A continuous state is described
        by real numbers, like CartPole's cart position and velocity, pole angle and rotation
        rate [^1]. Go's action space is discrete as well, since only a finite number of moves is
        available [^2].
      references:
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/8-Reinforcement/2-Gym/README.md#introduction
