  "classification/roc-and-auc#q4":
    fix:
      question: Imagine a situation where it's better to allow some spam to reach the inbox than to send a business-critical email to the spam folder. You've trained a spam classifier for this situation where the positive class is spam and the negative class is not-spam. Which of the labelled points on the ROC curve of your classifier, shown below, is preferable?
