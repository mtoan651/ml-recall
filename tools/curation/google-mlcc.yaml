  "llm#q1":
    topic: language-models
    difficulty: medium
    fix:
      explanation: |
        Longer n-grams give more context, but as $N$ grows each n-gram occurs less often, and when $N$ is
        large most n-grams appear only once, which doesn't help predict the next token [^1]. So the answer
        depends on the data: if the training set spans millions of diverse documents, the 6-gram model will
        probably outperform the 5-gram model, while with a small training set most 6-grams are rare and the
        extra context does not pay off [^1].
      options:
        0: It depends on the size and diversity of the training set.
        1: The 6-gram model, since it uses more context.
        2: The 5-gram model, since its n-grams are less rare.
      why:
        2: Not in general. With a large, diverse training set the 6-gram model's extra context usually wins; the 5-gram model can do better only when the data are too small for most 6-grams to repeat.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm
          locator: Introduction to Large Language Models, N-gram language models and exercise
      references_replace: true
  "llm/transformers#q1":
    topic: transformers
    difficulty: medium
    fix:
      explanation: |
        For each token, self-attention works out how much every other token in the context should
        shape its interpretation, and the heads learn these relationships through their trained
        parameters [^1]. Across thousands of documents, *acacia* keeps appearing in passages about
        what elephants eat, and the other words of idioms such as "the elephant in the room" keep
        appearing next to *elephant*. So the trained model learns to give these pairs high attention
        when they occur together, which is what lets it answer diet questions or read an idiom
        correctly [^1]. Attention weights are computed afresh for each input (the page's "it … tired"
        versus "it … wide" example), so "gaining a high score" means the model tends to assign that
        weight whenever the words co-occur. Sarcasm and irony are not filtered out: large models
        trained on broad data become good at recognising them and learn from them [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/transformers#what_is_self-attention
          locator: "LLMs: What's a large language model?, sections 'What is self-attention?', 'What is multi-head multi-layer self-attention?' and the closing exercise"
      references_replace: true
  "llm/tuning#q1":
    topic: fine-tuning
    difficulty: easy
    fix:
      explanation: |
        Distillation creates a smaller version of an LLM: typically a large teacher model labels data,
        and that data trains a smaller student model with fewer parameters, which is cheaper to serve but
        usually predicts a little less well [^1]. Fine-tuning only updates existing weights on
        task-specific examples (all of them, or a subset with parameter-efficient tuning), so a fine-tuned
        model has exactly as many parameters as the foundation model [^2]. Prompt engineering changes only
        the input: it customizes the output without adding, removing or altering any parameter [^3].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#distillation
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Distillation'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#fine-tuning
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Fine-tuning'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#prompt_engineering
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Prompt engineering (note)'
      references_replace: true
  "logistic-regression/sigmoid-function#q1":
    fix:
      question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. For the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$, what is the value of $z$ (the linear output before the sigmoid)?
      explanation: |
        The linear part of the model is $z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2x_1 - x_2 + 5x_3$.
        Plugging in the input gives $z = 1 + 2(0) - 10 + 5(2) = 1$ [^1]. Only after that is the
        sigmoid applied, giving the probability $\sigma(1) \approx 0.731$ [^1].
      shuffle: true
      options:
        0: '21'
      why:
        0: This drops the minus sign of $w_2$. The term is $(-1)(10) = -10$, not $+10$.
        1: This leaves out the bias $b = 1$.
        2: That is $\sigma(z)$, the predicted probability. $z$ is the value before the sigmoid.
  "logistic-regression/sigmoid-function#q2":
    difficulty: medium
    fix:
      question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. What does it predict for the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$?
      explanation: |
        First compute the linear part (the log-odds), then pass it through the sigmoid [^1][^2]:
        $$z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2(0) + (-1)(10) + 5(2) = 1,$$
        $$y' = \sigma(z) = \frac{1}{1 + e^{-1}} \approx \frac{1}{1.368} \approx 0.731.$$
        The value 0.268 is $\sigma(-1)$, which you get with a sign error in $z$. The value 0.5 is
        $\sigma(0)$, which you get by dropping the bias. The sigmoid output always lies strictly
        between 0 and 1, so the model can never predict exactly 1 [^1][^2].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
          locator: "Logistic regression: Calculating a probability with the sigmoid function, 'Transforming linear output using the sigmoid function' and the sigmoid table"
        - title: Stanford CS229 Lecture Notes (Ng & Ma)
          url: https://cs229.stanford.edu/main_notes.pdf
          locator: Ch. 2, Sec. 2.1 Logistic regression, pp. 21-22
      references_replace: true
