    fix:
      question: Which of the two linear models shown below has the **higher** Mean Squared Error (MSE) when evaluated on the plotted data points?
      explanation: 'The eight examples on the line incur a total loss of 0. However, although only two points lie off the line, both of those points are *twice* as far off the line as the outlier points in the left figure. Squared loss amplifies those differences, so an offset of two incurs a loss four times as great as an offset of one: $MSE = \frac{0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2} {10} = 0.8$ [^1]'
