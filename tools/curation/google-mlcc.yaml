      question: You are developing a physics equation. Which of the following formulas conforms more closely to Occam's Razor?
      why:
        1: Twelve variables seems overly complicated, doesn't it? The two most famous physics formulas of all time ($F = ma$ and $E = mc^2$) each involve only three variables.
  "overfitting/model-complexity#q3":
    fix:
      question: Which of the following would be reasonable ways to measure a model's complexity?
      explanation: |
        Both statements about weights describe reasonable complexity measures, and each corresponds
        to a standard regularization penalty [^1]. Measuring complexity from the weights themselves
        (their absolute values) is what [L1 regularization](https://developers.google.com/machine-learning/glossary#L1_regularization)
        penalizes, and measuring it from the squares of the weights is what
        [L2 regularization](https://developers.google.com/machine-learning/glossary#L2_regularization)
        penalizes [^1]. The bias terms do not measure complexity [^1].
  "overfitting/overfitting#q1":
    difficulty: easy
    fix:
      question: You split a dataset into a training set (70%), a validation set (15%) and a test set (15%). What should you do to ensure that the examples in the training set have a similar statistical distribution to the examples in the validation set and the test set?
      explanation: |
        Good generalization requires partitions with the same distribution: the training examples should
        be statistically similar to the validation and test examples [^1]. Shuffling the whole dataset
        thoroughly before splitting makes this much more likely, since each partition then gets a random
        sample of every part of the data. Sorting from earliest to latest does the opposite when the data
        is not stationary (it doesn't stay the same over time [^1]): the training set would get the old
        examples and the test set the newest ones. Doing nothing is risky too, because datasets are often
        stored in some order, so different sections can differ however many examples there are.
      figure:
        src: ./ml-basics/ml-basics-036.svg
        alt: A horizontal bar split into a training part (70%), a validation part (15%) and a test part (15%).
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  "overfitting/regularization#q1": {topic: linear-regression}
  "overfitting/regularization#q2":
    topic: linear-regression
    fix:
      type: true_false
      shuffle: true
  "production-ml-systems/questions#q1": {keep: true}
  "production-ml-systems/static-vs-dynamic-inference#q1":
    fix:
      explanation: |
        Static inference computes predictions ahead of time and serves them from a cache or lookup
        table [^1]. So the model must make a prediction for every input it may be asked about, which
        works when the set of items is limited but not for free-form inputs with a long tail of rare
        cases. Because the predictions exist before anyone uses them, the system can verify them
        before serving them, and looking a prediction up is almost always faster than computing it
        on demand as dynamic inference does [^1]. The price is that cached predictions are refreshed
        only every few hours or days, so you cannot react quickly to changes in the world [^1].
  "production-ml-systems/static-vs-dynamic-inference#q2":
    difficulty: medium
    fix:
      explanation: |
        Dynamic (online) inference makes a prediction on demand for whatever request comes in, so it can
        serve any new item, including rare, long-tail inputs that a cache of precomputed predictions would
        not contain [^1]. The price is that it is compute intensive and latency sensitive, which may force
        a simpler model, and it needs more monitoring [^1]. Checking predictions before they are served is
        an advantage of static inference, which computes and caches them in advance [^2]; a dynamic
        prediction is used as soon as it is made, so at best you can monitor aggregate quality afterwards.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#dynamic_inference
          locator: 'Production ML systems: Static versus dynamic inference, sec. Dynamic inference'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#static_inference
          locator: 'Production ML systems: Static versus dynamic inference, sec. Static inference'
      references_replace: true
  "production-ml-systems/static-vs-dynamic-training#q1":
    difficulty: medium
    fix:
      explanation: |
        With static (offline) training you train the model once and serve it for a while, so you develop
        and test it once and can verify it before it goes into production [^1]. Because training jobs run
        rarely, monitoring at training time is more modest than for online training, whose continuous
        training jobs must be watched [^1]. The cost is staleness: the model can't take in new data, so its
        predictions degrade if the relationship between features and labels changes [^1]. For the same
        reason you still have to monitor the input data at serving time; a model trained only on summer
        data would be unreliable in winter [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
          locator: 'Production ML systems: Static versus dynamic training, Table 1 and the text after it'
      references_replace: true
  "production-ml-systems/static-vs-dynamic-training#q2": {keep: true}
  categorical-data/one-hot-encoding#q1:
    fix:
      type: true_false
      question: A machine learning model can train *directly* on raw string values, like "Red" and "Black", without converting these values to numerical vectors.
      shuffle: true
  fairness/equality-of-opportunity#q1:
    fix:
      type: true_false
      question: It is impossible for a binary classification model to satisfy both demographic parity and equality of opportunity on the same set of predictions.
      shuffle: true
      why:
        0: It's possible for a model's predictions to satisfy both demographic parity and equality of opportunity. See if you can think of a scenario where both metrics are satisfied; the explanation gives one.
  linear-regression/gradient-descent#q1:
    difficulty: easy
    fix:
      explanation: |
        Gradient descent is an optimiser: it starts from initial weights and bias, computes the
        slope (gradient) of the loss, takes a small step in the direction that lowers the loss, and
        repeats until the loss stops falling [^1][^2]. For linear regression, the loss surface is
        convex, so it converges to the weights and bias with the lowest loss [^1]. The loss function
        itself (squared error, absolute error, ...) is chosen beforehand as the measure of fit, and
        gradient descent just minimises whatever loss it is given [^2]. It never edits the dataset
        either, so outliers must be handled during data preparation, not by the optimiser.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/linear-regression/gradient-descent#convergence_and_convex_functions
          locator: "Linear regression: Gradient descent (intro and 'Convergence and convex functions')"
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
          locator: Sec. 3.1.1.2 Loss Function and Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent, Eq. (3.1.10)
      references_replace: true
  overfitting/dividing-datasets#q2:
    difficulty: medium
    fix:
      explanation: |
        A test loss that is too good to be true usually means the model is being tested on examples it
        has already seen. If the dataset has many redundant examples, shuffling and splitting puts copies
        of training examples into the test set; in MLCC's spam example, a model reached 99% precision on
        both sets because duplicates of the same spam emails had not been removed before the split [^1].
        The fix is to delete from the validation and test sets every example that duplicates a training
        example [^1]. Run-to-run randomness changes the loss only a little, and with well-shuffled data a
        lucky test set is extremely unlikely.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets'
      references_replace: true
  overfitting/dividing-datasets#q4:
    difficulty: easy
    fix:
      explanation: |
        A good test set must represent the dataset as a whole and also the real-world data the model will
        meet [^1]. Low loss on a large, statistically significant test set shows only that the test set
        resembles the training set. If the model still fails in production, the dataset itself differs
        from real-world data, for example because the world has changed since the data was collected;
        good generalization needs a stationary dataset whose partitions are statistically similar to
        real-world data [^2]. Find out how the data differs, then retrain and retest on data that matches
        reality; rerunning the same test would only reproduce the same misleading result.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets (criteria for a good test set)'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  overfitting/dividing-datasets#q5:
    difficulty: easy
    fix:
      explanation: |
        A test set is there to estimate how well the model generalises, and how precise that
        estimate is depends on the absolute number of test examples, not on a fixed share of the
        data [^1][^2]. The standard error of a measured error rate shrinks like $1/\sqrt{n}$. To be
        about 95% sure that the test error is within $\pm 0.01$ of the true error, you need roughly
        10,000 examples [^2]. So 15% of a 2,000-example dataset (300 examples) is far too small,
        while 15% of 100 million examples is far more than needed. The course says there is no
        percentage requirement for the splits. You should find the number that gives a
        statistically meaningful result [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: "Datasets: Dividing the original dataset, 'Additional problems with test sets' and 'Exercises: Check your understanding'"
        - source: d2l
          url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
          locator: Sec. 4.6.1 The Test Set
      references_replace: true
  overfitting/overfitting#q2:
    difficulty: easy
    fix:
      explanation: |
        A model generalizes well only if the dataset is stationary, that is, if it doesn't change
        significantly over time [^1]. Viewers' tastes are not stationary: they keep changing in ways that
        past behavior can't predict, so a model trained on the last ten years will probably misjudge what
        becomes popular in the next three. A bigger dataset doesn't fix this, since hundreds of millions of
        examples of past tastes still describe the past, and although some aspects of entertainment are
        somewhat cyclical, that is not enough to forecast new trends reliably.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  overfitting/overfitting#q3:
    difficulty: medium
    fix:
      explanation: |
        Seasonal variation is not a problem in itself; what generalization needs is that the training,
        validation and test partitions share the same distribution [^1]. A full year of data covers all
        four seasons, so as long as there are enough examples and every season is spread evenly across the
        partitions (for example, by shuffling the whole year before splitting), the model is trained and
        tested on the same mix of weather. Splitting by date would break this: a model trained on spring
        to autumn and tested on winter would meet weather it never saw in training.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
