  "fairness/identifying-bias#q1":
    difficulty: medium
    fix:
      question: |
        You're training a model to predict adoptability of rescue dogs based on a variety of features, including breed, age, weight, temperament, and quantity of fur shed each day. Your goal is to ensure the model performs equally well on all types of dogs, irrespective of their physical or behavioral characteristics.

        You discover that 1,500 of the 5,000 examples in the training set are missing temperament values. Which of the following are potential sources of bias you should investigate?
      options:
        1: Temperament data is more likely to be missing for dogs under 12 months in age.
  "fairness/mitigating-bias#q1":                             # MinDiff / CLP (TF Model Remediation)
    difficulty: medium
    fix:
      question: |
        MinDiff and counterfactual logit pairing (CLP) are two bias-mitigation techniques that change
        the loss used during training. Which of the following statements about bias mitigation are
        true? Select all that apply.
      explanation: |
        Bias can be mitigated by augmenting the training data or by adjusting the loss. Plain log loss
        ignores subgroup membership, so a fairness-aware penalty is added instead [^1]. MinDiff penalizes
        differences between the *distributions* of predictions for two slices of data, while CLP
        penalizes different predictions for a *pair* of examples that are identical except for a
        sensitive attribute [^1]. More data helps only if its composition fixes the imbalance; data that
        repeats the old skew will not. Augmenting the data and MinDiff or CLP can be combined, e.g. more
        data removes 30% of a performance gap and MinDiff a further 50% [^1].
      why:
        0: Both add a penalty to the training loss for prediction errors tied to how sensitive attributes are represented in the training data.
        1: MinDiff aligns the score distributions of two subgroups; CLP makes sure an individual example is not treated differently only because of its subgroup.
  "fairness/types-of-bias#q1":                               # the course's admissions example
    difficulty: medium
    fix:
      question: |
        A university's admissions committee uses an ML model to select applicants for its computer
        science program. The model was built by current students of the university, who curated and
        feature-engineered the training data: the records of students admitted over the past 20
        years. Its predictions turn out to be skewed against some groups of applicants. Which types of
        bias could have contributed to the skewed predictions? Select all that apply.
      explanation: |
        Historical bias occurs when historical data reflects inequities of its time, and 20 years of
        admission records can encode them [^1]. In-group bias is a preference for people of one's own
        group, and confirmation bias means processing data in ways that affirm existing beliefs; both can
        enter through how the student builders curated the data and engineered features [^1]. Automation
        bias, favouring automated results over human ones regardless of error rates, might explain why
        the committee chose a model at all, but not why the model's predictions are skewed [^1].
      why:
        0: Records from the past 20 years can carry past inequities; if minority students were under-represented then, the model reproduces that.
        1: Students who built the model may unconsciously prefer applicants with backgrounds like their own when curating data or choosing features.
        2: Students who built the model may hold beliefs about which qualifications predict success and shape the data so that the model confirms them.
  "linear-regression/hyperparameters#q1":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        There is no universal best value: each model and dataset has its own ideal learning rate, which
        has to be found by experimenting [^1]. Too small a learning rate needs many iterations to
        converge, and too large a one never converges, with a loss that bounces around or keeps
        increasing, so 1.0 is not automatically fastest [^1]. Values such as 0.01 are only common
        starting points for that search.
      options:
        0: It is problem-dependent.
        1: 0.01, a common default
        2: 1.0, so that training converges fastest
      why:
        1: 0.01 is a common starting point, but the best value differs from one model and dataset to another.
        2: A learning rate that is too large makes the weights bounce around and can slow down or prevent convergence.
  "linear-regression/hyperparameters#q2":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        The ideal batch size depends on the dataset and the available compute resources [^1]. Small
        batches behave like SGD, with cheap but noisy updates, and large batches behave like full-batch
        gradient descent, with smoother but more expensive ones [^1]. Some noise can even help the model
        generalize, so the batch size is a hyperparameter to tune together with the learning rate [^1].
      why:
        1: Small batches behave like SGD, with cheap but noisy updates; that suits some problems but not all [^1].
        2: Larger batches give smoother gradients, but whether 100 is best depends on the data and on the available memory and compute [^1].
  "linear-regression/hyperparameters#q3":
    topic: training
    difficulty: easy
    fix:
      explanation: |
        "Doubling the learning rate can slow down training" is true: if the doubled rate is too large,
        the weights bounce around the minimum and convergence takes longer, or fails [^1]. The other
        statement is false: averaging the gradients of more examples dilutes the effect of individual
        outliers, so larger batches can help with outlier-heavy data [^1]. As always, the best
        hyperparameters depend on the dataset and the available compute [^1].
  "linear-regression/loss#q1":
    difficulty: easy
    fix:
      question: Which of the two linear models shown below has the **higher** Mean Squared Error (MSE) when evaluated on the plotted data points?
      explanation: 'The eight examples on the line incur a total loss of 0. However, although only two points lie off the line, both of those points are *twice* as far off the line as the outlier points in the left figure. Squared loss amplifies those differences, so an offset of two incurs a loss four times as great as an offset of one: $MSE = \frac{0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2 + 0^2 + 2^2 + 0^2 + 0^2} {10} = 0.8$ [^1]'
      figure:
        src: ./linear-regression/linear-regression-017.svg
        alt: 'Two scatter plots, each with the same line y = 2 + 0.5x and 10 points. Left: 6 points lie on the line, 2 are 1 unit above it and 2 are 1 unit below it. Right: 8 points lie on the line, 1 is 2 units above it and 1 is 2 units below it.'
  "llm#q1":
    topic: language-models
    difficulty: medium
    fix:
      explanation: |
        Longer n-grams give more context, but as $N$ grows each n-gram occurs less often, and when $N$ is
        large most n-grams appear only once, which doesn't help predict the next token [^1]. So the answer
        depends on the data: if the training set spans millions of diverse documents, the 6-gram model will
        probably outperform the 5-gram model, while with a small training set most 6-grams are rare and the
        extra context does not pay off [^1].
      options:
        0: It depends on the size and diversity of the training set.
        1: The 6-gram model, since it uses more context.
        2: The 5-gram model, since its n-grams are less rare.
      why:
        2: Not in general. With a large, diverse training set the 6-gram model's extra context usually wins; the 5-gram model can do better only when the data are too small for most 6-grams to repeat.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm
          locator: Introduction to Large Language Models, N-gram language models and exercise
      references_replace: true
  "llm/transformers#q1":
    topic: transformers
    difficulty: medium
    fix:
      explanation: |
        For each token, self-attention works out how much every other token in the context should
        shape its interpretation, and the heads learn these relationships through their trained
        parameters [^1]. Across thousands of documents, *acacia* keeps appearing in passages about
        what elephants eat, and the other words of idioms such as "the elephant in the room" keep
        appearing next to *elephant*. So the trained model learns to give these pairs high attention
        when they occur together, which is what lets it answer diet questions or read an idiom
        correctly [^1]. Attention weights are computed afresh for each input, so "gaining a high score"
        means the model tends to assign that weight whenever the words co-occur. Sarcasm and irony are
        not filtered out: large models trained on broad data become good at recognising them and learn
        from them [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/transformers#what_is_self-attention
          locator: "LLMs: What's a large language model?, sections 'What is self-attention?', 'What is multi-head multi-layer self-attention?' and the closing exercise"
      references_replace: true
  "llm/tuning#q1":
    topic: fine-tuning
    difficulty: easy
    fix:
      explanation: |
        Distillation creates a smaller version of an LLM: typically a large teacher model labels data,
        and that data trains a smaller student model with fewer parameters, which is cheaper to serve but
        usually predicts a little less well [^1]. Fine-tuning only updates existing weights on
        task-specific examples (all of them, or a subset with parameter-efficient tuning), so a fine-tuned
        model has exactly as many parameters as the foundation model [^2]. Prompt engineering changes only
        the input: it customizes the output without adding, removing or altering any parameter [^3].
      options:
        0: A distilled LLM contains fewer parameters than the foundation language model it was distilled from.
        1: A fine-tuned LLM contains fewer parameters than the foundation language model it was fine-tuned from.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#distillation
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Distillation'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#fine-tuning
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Fine-tuning'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/llm/tuning#prompt_engineering
          locator: 'LLMs: Fine-tuning, distillation, and prompt engineering, sec. Prompt engineering (note)'
      references_replace: true
  "logistic-regression/sigmoid-function#q1":
    difficulty: easy
    fix:
      question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. For the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$, what is the value of $z$ (the linear output before the sigmoid)?
      explanation: |
        The linear part of the model is $z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2x_1 - x_2 + 5x_3$.
        Plugging in the input gives $z = 1 + 2(0) - 10 + 5(2) = 1$ [^1]. Only after that is the
        sigmoid applied, giving the probability $\sigma(1) \approx 0.731$ [^1].
      shuffle: true
      options:
        0: '21'
      why:
        0: This drops the minus sign of $w_2$. The term is $(-1)(10) = -10$, not $+10$.
        1: This leaves out the bias $b = 1$.
        2: That is $\sigma(z)$, the predicted probability. $z$ is the value before the sigmoid.
  "logistic-regression/sigmoid-function#q2":
    difficulty: medium
    fix:
      question: A logistic regression model with three features has bias $b = 1$ and weights $w_1 = 2$, $w_2 = -1$, $w_3 = 5$. What does it predict for the input $x_1 = 0$, $x_2 = 10$, $x_3 = 2$?
      explanation: |
        First compute the linear part (the log-odds), then pass it through the sigmoid [^1][^2]:
        $$z = b + w_1x_1 + w_2x_2 + w_3x_3 = 1 + 2(0) + (-1)(10) + 5(2) = 1,$$
        $$y' = \sigma(z) = \frac{1}{1 + e^{-1}} \approx \frac{1}{1.368} \approx 0.731.$$
        The value 0.268 is $\sigma(-1)$, which you get with a sign error in $z$. The value 0.5 is
        $\sigma(0)$, which you get by dropping the bias. The sigmoid output always lies strictly
        between 0 and 1, so the model can never predict exactly 1 [^1][^2].
      why:
        0: That is $\sigma(-1) = 1/(1 + e^{1})$, the result of a sign slip such as computing $1/(1 + e^{z})$ instead of $1/(1 + e^{-z})$ [^1].
        1: That is $\sigma(0)$, what you get by leaving out the bias; with it, $z = 1 + 0 - 10 + 10 = 1$ [^1].
        3: That is the linear output $z$, not the prediction. The sigmoid maps $z = 1$ to about 0.731, and its output always lies strictly between 0 and 1 [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/logistic-regression/sigmoid-function#transforming_linear_output_using_the_sigmoid_function
          locator: "Logistic regression: Calculating a probability with the sigmoid function, 'Transforming linear output using the sigmoid function' and the sigmoid table"
        - title: Stanford CS229 Lecture Notes (Ng & Ma)
          url: https://cs229.stanford.edu/main_notes.pdf
          locator: Ch. 2, Sec. 2.1 Logistic regression, pp. 21-22
      references_replace: true
  "neural-networks/nodes-hidden-layers#q1":
    difficulty: medium
    fix:
      question: The fully connected network below has 3 input features, one hidden layer of four neurons and a single output node. How many parameters (weights and biases) does it have?
      figure:
        src: ./neural-networks/neural-networks-039.svg
        alt: 'Network diagram: three input nodes x1, x2 and x3, a hidden layer of four nodes and one output node; every node is connected to every node in the next layer.'
      why:
        0: Four parameters (one weight per input plus a bias) is the count for the same network without the hidden layer. The hidden layer adds more parameters.
  "neural-networks/nodes-hidden-layers#q2":
    difficulty: medium
    fix:
      question: A network has 3 input features, one hidden layer of four neurons and a single output node, and every node uses a linear (identity) activation. Can this model learn nonlinear relationships?
      explanation: |
        With the identity activation, each hidden neuron outputs just a weighted sum of the inputs
        plus a bias, and the output node takes a weighted sum of those values plus another bias.
        That is a linear calculation applied to the results of linear calculations, which is still
        linear [^1]. Written out, $\mathbf{o} = (\mathbf{x}W^{(1)} + \mathbf{b}^{(1)})W^{(2)} + \mathbf{b}^{(2)} = \mathbf{x}W + \mathbf{b}$,
        so the hidden layer can be folded away into one linear layer [^2]. The extra layer adds
        parameters (21 here instead of 4) but no new kinds of functions [^1]. To learn nonlinear
        relationships, a nonlinear activation such as ReLU has to follow each hidden affine step [^2].
      why:
        0: With identity activations the hidden layer folds into one linear layer, so the network can only represent linear functions [^2].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/neural-networks/nodes-hidden-layers#exercise_2
          locator: "Neural networks: Nodes and hidden layers, 'Exercise 2'"
        - source: d2l
          url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html#from-linear-to-nonlinear
          locator: Sec. 5.1.1.3 From Linear to Nonlinear, Eq. (5.1.2)
          quote: An affine function of an affine function is itself an affine function.
      references_replace: true
  "numerical-data/binning#q1":
    difficulty: medium
    fix:
      question: The plot below shows the median home price for each 0.2 degrees of latitude in the mythical country of Freedonia. The relationship is nonlinear, so representing latitude as a single floating-point feature is unlikely to help a model make good predictions. Perhaps bucketing latitudes would be a better idea? What would be the best bucketing strategy?
      explanation: |
        Binning helps when the relationship between a feature and the label is nonlinear: each bin
        becomes its own feature with its own weight, so the model can learn a different value for
        each range [^1]. Here the median price is roughly flat within four latitude ranges — low
        from 41.0 to 41.8, high from 42.0 to 42.6, low again from 42.8 to 43.4 and high from 43.6 to
        44.8 — so four buckets with exactly those boundaries capture the pattern with only four
        weights. Google's own key for this quiz is "Don't bucket", arguing that the plot is mostly
        random and that some bins hold few examples; but each point is already a median over many
        homes, and the plot shows clear plateaus, so we key the four buckets. Each bucket still needs
        enough training examples, which is the caveat Google raises [^1].
      figure:
        src: ./data-prep/data-prep-018.svg
        alt: Scatter plot of median house value (about 330 to 710) against latitude from 41.0 to 44.8 in steps of 0.2. Values are low around 41, jump to about 700 near 42.2–42.4, drop to about 410 around 43, rise again to about 710 at 44.0 and end between 510 and 570.
      why:
        0: The stem itself says that a single floating-point latitude is unlikely to help, because the relationship is nonlinear. Leaving it unbucketed ignores the four flat regions the plot shows.
        1:
        2: Twenty one-point buckets give the model a separate weight for every 0.2° strip, so it memorizes noise between neighbouring strips instead of learning the four regions, and it needs many examples in every strip.
      correct:
        - 1
  "numerical-data/normalization#q1":
    difficulty: easy
    fix:
      question: Which technique would be most suitable for normalizing a feature with the distribution shown below?
      explanation: |
        The histogram rises to a single peak near the middle and falls off about evenly on both
        sides, so the feature roughly follows a normal distribution. Z-score scaling,
        $(x - \mu)/\sigma$, is the technique for such features [^1]. It does not cap anything, but
        in a normal distribution about 99.7% of the values lie within three standard deviations of
        the mean, so after scaling almost all of them fall between $-3$ and $+3$ [^1].
      figure:
        src: ./data-prep/data-prep-016.svg
        alt: Histogram of a feature whose values range from 0 to about 200,000, rising gradually to a peak around 100,000 and falling off gradually on the other side.
      why:
        1: Linear scaling suits features spread roughly uniformly between stable bounds, such as age [^1]. This feature is bell-shaped.
        2: Log scaling suits power-law or heavily skewed features, such as book sales [^1]. This histogram is roughly symmetric.
        3: Clipping caps extreme outliers [^1]. This feature has no extreme outliers, just a bell-shaped spread.
  "numerical-data/normalization#q2":
    difficulty: medium
    fix:
      explanation: |
        Clipping caps extreme values at a chosen limit, which reduces their influence while keeping the
        examples [^1]. The values of 1,000 are mistakes, not temperatures, so they should be deleted
        rather than clipped [^1]. The values between 31 and 45 are legitimate data points; clipping them
        is reasonable when there are too few hot days to learn that range well, at the cost that the
        model then makes the same prediction for 45 °C as for 35 °C [^1].
      options:
        3: Delete the outlier values between 31 and 45, but clip the outliers with a value of 1,000
      why:
        1: The values of 1,000 are recording errors, not temperatures; clipping would keep those examples with a made-up value, so they should be deleted [^1].
        2: The 31–45 °C readings are real hot days; deleting them throws away legitimate data, and clipping them is enough [^1].
        3: 'This is backwards: the 31–45 values are legitimate and should be kept (clipped), while the 1,000 values are mistakes to delete [^1].'
      references:
        - source: google-mlcc
          locator: 'Numerical data: Normalization (Clipping; Exercise: Test your knowledge, question 2)'
          url: https://developers.google.com/machine-learning/crash-course/numerical-data/normalization
      references_replace: true
  "overfitting#q1":
    difficulty: easy
    fix:
      explanation: |
        Data trumps all: the quality and size of the dataset matter much more than which algorithm
        you use to build the model [^1]. A model can only learn the patterns that its training
        examples contain, so label errors, noisy features or unrepresentative examples limit every
        model trained on them, however clever its loss function. That is also why practitioners
        typically spend about 80% of a project constructing datasets and transforming data [^1].
      why:
        1: A better loss function can help a model train faster, but it is a distant second to data quality; no loss function can recover patterns that a poor dataset does not contain.
      references:
        - source: google-mlcc
          locator: 'Datasets, generalization, and overfitting: module introduction'
          url: https://developers.google.com/machine-learning/crash-course/overfitting
      references_replace: true
  "overfitting#q2":                                          # "take a guess" about project time
    topic: data-prep
    difficulty: easy
    fix:
      question: In a typical machine learning project, roughly what share of the time goes into constructing datasets and transforming data?
      explanation: |
        Machine Learning Crash Course (MLCC) notes that practitioners spend most of an ML project
        building datasets and doing feature engineering: typically about 80% of the time goes into
        constructing and transforming data [^1]. Its datasets module stresses why: the quality and size of
        the dataset matter much more than which algorithm is used [^1]. Planning for half of the time or
        less underestimates the data work; MLCC's advice is to plan for more [^1].
      options:
        - text: About 80%
          correct: true
        - text: About 50%
          why: Half underestimates the data work; MLCC says to plan for more, typically 80% [^1].
        - text: About 20%
          why: "Far too low: most of a project's time goes into constructing datasets and transforming data [^1]."
        - text: About 5%
          why: "Far too low: building and transforming data typically takes about 80% of a project's time [^1]."
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting
          locator: Datasets, generalization, and overfitting (module introduction)
      references_replace: true
  "overfitting/data-characteristics#q1":
    difficulty: easy
    fix:
      question: |
        Here are two columns of a dataset, sorted by `Timestamp`:

        | Timestamp | Temperature |
        | --- | ---: |
        | June 8, 2023 09:00 | 12 |
        | June 8, 2023 10:00 | 18 |
        | June 8, 2023 11:00 | *missing* |
        | June 8, 2023 12:00 | 24 |
        | June 8, 2023 13:00 | 38 |

        Which of the following would be a reasonable value to impute for the missing value of `Temperature`?
      explanation: |
        Imputation replaces a missing value with a well-reasoned guess, and a common choice is the
        mean or median of the feature [^1]. The mean of the visible readings is
        $(12 + 18 + 24 + 38)/4 = 23$, and 23 also lies between the readings at 10:00 (18) and 12:00
        (24), as it should for a temperature rising through the morning. 31 is far above the readings
        on either side, and 51 is higher than every value shown. With only a few rows visible, 23 is
        still just a reasonable guess; a larger sample of the dataset might show that 11:00 readings
        usually differ [^1].
  "overfitting/dividing-datasets#q1":
    difficulty: medium
    fix:
      question: Suppose you train on the training set and evaluate on the test set over multiple rounds. In each round, you use the test set results to guide how to update hyperparameters and the feature set. Can you see anything wrong with this approach?
      explanation: |
        Every time the test results decide a change to the hyperparameters or features, some information
        about the test set leaks into the model. Over many rounds the model ends up fitting the test set's
        peculiarities, like a teacher teaching to the test, and does worse on real-world data than the
        test score suggests [^1]. The remedy is a third split: tune against a validation set and use the
        test set only to confirm the final model [^1]. Tuning is worth the compute; the problem is which
        data the choices are based on, and even validation and test sets "wear out" with repeated use [^1].
      why:
        1: A separate test set is not enough. Each round uses the test results to make a decision, so information about the test set leaks into the model, and after many rounds the test score no longer reflects performance on new data.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#training_validation_and_test_sets
          locator: 'Datasets: Dividing the original dataset, sec. Training, validation, and test sets'
      references_replace: true
  "overfitting/dividing-datasets#q3":
    difficulty: easy
    fix:
      explanation: |
        With a fixed dataset, the training, validation and test sets share one pool of examples, so
        splitting it is a zero-sum game: every example placed in the test set is one less example to
        train on [^1]. That is the central trade-off of splitting: a larger test set gives a more
        reliable estimate of quality, a larger training set a better model. There is no rule that the
        test set must be bigger than the other sets; the training set is usually the largest, and the
        validation and test sets are typically about the same size [^1].
      why:
        1: There is no such rule; in theory the validation set and the test set should contain the same number of examples or nearly so.
      references:
        - source: google-mlcc
          locator: 'Datasets: Dividing the original dataset, sec. Exercises: Check your understanding'
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#exercises_check_your_understanding
      references_replace: true
  "overfitting/interpreting-loss-curves#q1":
    difficulty: medium
    fix:
      question: The plot below shows a training loss curve. What **three** things could you do to try to improve it?
      explanation: 'A loss curve that keeps oscillating instead of flattening usually means the updates are too large or the data is noisy [^1]. Lowering the learning rate makes each step smaller. Checking examples against a data schema and removing bad ones takes out broken examples that kick the loss around. Training on a tiny set of trustworthy examples first is a debugging step: if the model cannot converge even there, the problem is in the model or the pipeline, and once it does you can add data back gradually [^1]. Adding more examples or raising the learning rate is unlikely to calm an oscillating curve.'
      figure:
        src: ./ml-basics/ml-basics-051.svg
        alt: 'Loss against training steps: the loss swings up and down in large waves throughout training and never settles.'
      why:
        3: The swings come from steps that are too large or from bad examples, and more data of the same kind fixes neither; it may even add more bad examples.
        4: Larger steps make an oscillating loss swing even more; when a loss curve shows a problem, lower the learning rate rather than raise it.
  "overfitting/interpreting-loss-curves#q2":
    difficulty: medium
    fix:
      question: Which **two** of the following statements identify possible reasons for the exploding loss shown in the plot below?
      explanation: |
        A loss that falls smoothly and then suddenly shoots up points to bad input data rather than a
        badly tuned hyperparameter [^1]. One cause is NaNs in the input, for example from a division
        by zero, which is more common than you might expect. Another is a batch packed with outliers,
        which can happen when batches are not shuffled properly [^1]. A low learning rate only slows
        training down, and a very high regularization rate can keep a model from converging, but
        neither produces a sudden jump like this one [^1].
      figure:
        src: ./ml-basics/ml-basics-052.svg
        alt: 'Loss against training steps: the loss falls smoothly for most of training, then suddenly shoots up to a high level and keeps jumping around there.'
      why:
        3: True, a very high regularization could prevent a model from converging; however, it won't cause the strange loss curve shown in the plot.
  "overfitting/interpreting-loss-curves#q3":
    difficulty: easy
    fix:
      question: The plot below shows the loss curves of the training and test sets. Which **one** of the following statements best identifies the reason for the difference between them?
      explanation: |
        The two curves fall together at first, then diverge: the training loss keeps going down while the
        test loss levels off and starts to rise. The model is learning details of the training set that
        don't carry over to new data, the classic sign of overfitting [^1]. A learning rate that is too
        high would show up in the training curve itself, which would bounce around or keep increasing
        instead of falling smoothly [^2]. Possible fixes are a simpler model (for example, fewer features),
        a higher regularization rate, and making sure the training and test sets are statistically
        equivalent [^3].
      figure:
        src: ./ml-basics/ml-basics-053.svg
        alt: 'Two loss curves against training steps: the training loss keeps decreasing, while the test loss decreases at first, then flattens and starts to rise.'
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#detecting_overfitting
          locator: Overfitting, sec. Detecting overfitting
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/linear-regression/hyperparameters#learning_rate
          locator: 'Linear regression: Hyperparameters, sec. Learning rate'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/interpreting-loss-curves#exercise_3_test_loss_diverges_from_training_loss
          locator: 'Overfitting: Interpreting loss curves, Exercise 3. Test loss diverges from training loss'
      references_replace: true
  "overfitting/interpreting-loss-curves#q4":
    difficulty: medium
    fix:
      question: Which **one** of the following statements is the most likely explanation for the erratic loss curve shown below?
      explanation: |
        The loss converges and then the same burst of bumps keeps repeating at regular intervals,
        which points to the order of the training data [^1]. If the examples are not shuffled, for
        example 100 images of dogs followed by 100 images of cats, each run of similar examples pulls
        the weights one way and the next run pulls them back, so the loss oscillates in a pattern that
        recurs on every pass through the data [^1]. The fix is to shuffle the examples sufficiently.
      figure:
        src: ./ml-basics/ml-basics-054.svg
        alt: 'Loss against training steps: the loss drops quickly and levels off, then the same burst of jagged bumps repeats at regular intervals.'
      why:
        1: Too much regularization keeps the model too simple, so the loss levels off at a high value; it does not make the same burst of bumps repeat at regular intervals.
        2: Too many features invite overfitting, which shows as a gap between training and validation loss, not as a repeating pattern in the training loss.
  "overfitting/labels#q1":
    difficulty: easy
    fix:
      question: Your company wants to mail coupons ("Get 15% off a new bicycle helmet") to bicycle owners, so your model must predict which people own a bicycle. The dataset has no `bike owner` column, but it does have a column named `recently bought a bicycle`. Would `recently bought a bicycle` be a good proxy label or a poor proxy label for this model?
  "overfitting/model-complexity#q1":
    difficulty: easy
    fix:
      question: You are developing a physics equation. Which of the following formulas conforms more closely to Occam's Razor?
      explanation: |
        Occam's razor is the preference for the simpler of two explanations that account for the
        facts equally well, a principle that remains essential in many sciences, including machine
        learning [^1]. A formula with three variables is far simpler than one with twelve, and the
        most famous physics formulas, $F = ma$ and $E = mc^2$, involve only three quantities each. In
        ML the same idea says that a simpler model often generalizes better to new data than a complex
        one, even if it fits the training data slightly worse [^1].
      why:
        1: Twelve variables is far more complicated than needed; the two most famous physics formulas of all time ($F = ma$ and $E = mc^2$) each involve only three variables.
  "overfitting/model-complexity#q3":
    difficulty: medium
    fix:
      question: Which of the following would be reasonable ways to measure a model's complexity?
      explanation: |
        Both statements about weights describe reasonable complexity measures, and each corresponds
        to a standard regularization penalty [^1]. Measuring complexity from the weights themselves
        (their absolute values) is what [L1 regularization](https://developers.google.com/machine-learning/glossary#L1_regularization)
        penalizes, and measuring it from the squares of the weights is what
        [L2 regularization](https://developers.google.com/machine-learning/glossary#L2_regularization)
        penalizes [^1]. The bias terms do not measure complexity [^1].
      why:
        2: Bias terms only shift the output up or down; they do not shape how the model responds to its features, so complexity measures such as L1 and L2 are computed from the weights.
  "overfitting/overfitting#q1":
    difficulty: easy
    fix:
      question: You split a dataset into a training set (70%), a validation set (15%) and a test set (15%). What should you do to ensure that the examples in the training set have a similar statistical distribution to the examples in the validation set and the test set?
      explanation: |
        Good generalization requires partitions with the same distribution: the training examples should
        be statistically similar to the validation and test examples [^1]. Shuffling the whole dataset
        thoroughly before splitting makes this much more likely, since each partition then gets a random
        sample of every part of the data. Sorting from earliest to latest does the opposite when the data
        is not stationary (it doesn't stay the same over time [^1]): the training set would get the old
        examples and the test set the newest ones. Doing nothing is risky too, because datasets are often
        stored in some order, so different sections can differ however many examples there are.
      figure:
        src: ./ml-basics/ml-basics-036.svg
        alt: A horizontal bar split into a training part (70%), a validation part (15%) and a test part (15%).
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  "overfitting/regularization#q1":
    topic: linear-regression
    difficulty: easy
    fix:
      explanation: L2 regularization measures a model's complexity as the sum of its squared weights, and training then minimizes a combination of the loss and this complexity, scaled by the regularization rate [^1]. Large weights add the most to the penalty, so L2 regularization encourages weights toward 0 [^1]. The overall complexity of the trained model will therefore probably drop.
      options:
        0: The overall complexity of the model will probably drop.
      why:
        1: The L2 penalty pulls the weights toward 0, so the trained weights, and with them the complexity, end up smaller than without it [^1].
        2: L2 regularization penalizes large weights, so it lowers complexity; nothing in it rewards larger weights [^1].
  "overfitting/regularization#q2":
    topic: linear-regression
    difficulty: easy
    fix:
      type: true_false
      explanation: 'L2 regularization adds the sum of the squared weights to the loss. This encourages weights toward 0, but it never pushes a weight all the way to zero [^1]. Weights can become very small, yet every feature keeps a nonzero weight and still contributes something to the model [^1]. Removing features is what $\ell_1$ regularization (the lasso) does: it clears some weights to exactly zero, which amounts to feature selection [^2].'
      shuffle: true
      references:
        - source: d2l
          locator: Sec. 3.7.1 Norms and Weight Decay
          url: https://d2l.ai/chapter_linear-regression/weight-decay.html#norms-and-weight-decay
  "production-ml-systems/questions#q1":
    difficulty: medium
    keep: true
  "production-ml-systems/static-vs-dynamic-inference#q1":
    difficulty: medium
    fix:
      explanation: |
        Static inference computes predictions ahead of time and serves them from a cache or lookup
        table [^1]. So the model must make a prediction for every input it may be asked about, which
        works when the set of items is limited but not for free-form inputs with a long tail of rare
        cases. Because the predictions exist before anyone uses them, the system can verify them
        before serving them, and looking a prediction up is almost always faster than computing it
        on demand as dynamic inference does [^1]. The price is that cached predictions are refreshed
        only every few hours or days, so you cannot react quickly to changes in the world [^1].
  "production-ml-systems/static-vs-dynamic-inference#q2":
    difficulty: medium
    fix:
      explanation: |
        Dynamic (online) inference makes a prediction on demand for whatever request comes in, so it can
        serve any new item, including rare, long-tail inputs that a cache of precomputed predictions would
        not contain [^1]. The price is that it is compute intensive and latency sensitive, which may force
        a simpler model, and it needs more monitoring [^1]. Checking predictions before they are served is
        an advantage of static inference, which computes and caches them in advance [^2]; a dynamic
        prediction is used as soon as it is made, so at best you can monitor aggregate quality afterwards.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#dynamic_inference
          locator: 'Production ML systems: Static versus dynamic inference, sec. Dynamic inference'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-inference#static_inference
          locator: 'Production ML systems: Static versus dynamic inference, sec. Static inference'
      references_replace: true
  "production-ml-systems/static-vs-dynamic-training#q1":
    difficulty: medium
    fix:
      explanation: |
        With static (offline) training you train the model once and serve it for a while, so you develop
        and test it once and can verify it before it goes into production [^1]. Because training jobs run
        rarely, monitoring at training time is more modest than for online training, whose continuous
        training jobs must be watched [^1]. The cost is staleness: the model can't take in new data, so its
        predictions degrade if the relationship between features and labels changes [^1]. For the same
        reason you still have to monitor the input data at serving time; a model trained only on summer
        data would be unreliable in winter [^1].
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/production-ml-systems/static-vs-dynamic-training
          locator: 'Production ML systems: Static versus dynamic training, Table 1 and the text after it'
      references_replace: true
  "production-ml-systems/static-vs-dynamic-training#q2":
    difficulty: easy
    fix:
      explanation: |
        Dynamic (online) training retrains the model continuously or at least frequently and serves
        the most recent version, so the model keeps up with changes in the relationship between
        features and labels; avoiding staleness is its primary benefit [^1]. The price is more work:
        training jobs must be monitored all the time, with the ability to roll back to an earlier
        snapshot if a job is buggy or the input data is corrupted [^1]. Inputs at serving time still
        need monitoring as well, because sudden changes, such as an upstream data source going down,
        can make predictions unreliable [^1].
  categorical-data/one-hot-encoding#q1:
    difficulty: easy
    fix:
      type: true_false
      question: A machine learning model can train *directly* on raw string values, like "Red" and "Black", without converting these values to numerical vectors.
      explanation: |
        A model can only manipulate floating-point numbers, so a string such as "Red" has to be
        converted before training [^1]. The usual route maps each possible string to an index in a
        vocabulary and then to a one-hot vector, and it is the one-hot vector that the model receives
        [^1]. Feeding in the bare index would not work well either: the model would treat it as a
        continuous value, as if one color were several times "larger" than another [^1].
      shuffle: true
      references:
        - source: google-mlcc
          locator: 'Categorical data: Vocabulary and one-hot encoding (Index numbers; One-hot encoding)'
          url: https://developers.google.com/machine-learning/crash-course/categorical-data/one-hot-encoding
      references_replace: true
  fairness/equality-of-opportunity#q1:
    difficulty: medium
    fix:
      type: true_false
      question: It is impossible for a binary classification model to satisfy both demographic parity and equality of opportunity on the same set of predictions.
      shuffle: true
      why:
        0: It's possible for a model's predictions to satisfy both demographic parity and equality of opportunity. See if you can think of a scenario where both metrics are satisfied; the explanation gives one.
  linear-regression/gradient-descent#q1:
    difficulty: easy
    fix:
      explanation: |
        Gradient descent is an optimiser: it starts from initial weights and bias, computes the
        slope (gradient) of the loss, takes a small step in the direction that lowers the loss, and
        repeats until the loss stops falling [^1][^2]. For linear regression, the loss surface is
        convex, so it converges to the weights and bias with the lowest loss [^1]. The loss function
        itself (squared error, absolute error, ...) is chosen beforehand as the measure of fit, and
        gradient descent just minimises whatever loss it is given [^2]. It never edits the dataset
        either, so outliers must be handled during data preparation, not by the optimiser.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/linear-regression/gradient-descent#convergence_and_convex_functions
          locator: "Linear regression: Gradient descent (intro and 'Convergence and convex functions')"
        - source: d2l
          url: https://d2l.ai/chapter_linear-regression/linear-regression.html#minibatch-stochastic-gradient-descent
          locator: Sec. 3.1.1.2 Loss Function and Sec. 3.1.1.4 Minibatch Stochastic Gradient Descent, Eq. (3.1.10)
      references_replace: true
  overfitting/dividing-datasets#q2:
    difficulty: medium
    fix:
      explanation: |
        A test loss that is too good to be true usually means the model is being tested on examples it
        has already seen. If the dataset has many redundant examples, shuffling and splitting puts copies
        of training examples into the test set; in MLCC's spam example, a model reached 99% precision on
        both sets because duplicates of the same spam emails had not been removed before the split [^1].
        The fix is to delete from the validation and test sets every example that duplicates a training
        example [^1]. Run-to-run randomness changes the loss only a little, and with well-shuffled data a
        lucky test set is extremely unlikely.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets'
      references_replace: true
  overfitting/dividing-datasets#q4:
    difficulty: easy
    fix:
      explanation: |
        A good test set must represent the dataset as a whole and also the real-world data the model will
        meet [^1]. Low loss on a large, statistically significant test set shows only that the test set
        resembles the training set. If the model still fails in production, the dataset itself differs
        from real-world data, for example because the world has changed since the data was collected;
        good generalization needs a stationary dataset whose partitions are statistically similar to
        real-world data [^2]. Find out how the data differs, then retrain and retest on data that matches
        reality; rerunning the same test would only reproduce the same misleading result.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: 'Datasets: Dividing the original dataset, sec. Additional problems with test sets (criteria for a good test set)'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  overfitting/dividing-datasets#q5:
    difficulty: easy
    fix:
      explanation: |
        A test set is there to estimate how well the model generalises, and how precise that
        estimate is depends on the absolute number of test examples, not on a fixed share of the
        data [^1][^2]. The standard error of a measured error rate shrinks like $1/\sqrt{n}$. To be
        about 95% sure that the test error is within $\pm 0.01$ of the true error, you need roughly
        10,000 examples [^2]. So 15% of a 2,000-example dataset (300 examples) is far too small,
        while 15% of 100 million examples is far more than needed. The course says there is no
        percentage requirement for the splits. You should find the number that gives a
        statistically meaningful result [^1].
      options:
        1: At least 15% of the original dataset, however large the dataset is.
      why:
        1: 'A fixed share says nothing about precision: 15% of 2,000 examples is only 300, while 15% of 100 million is far more than needed.'
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/dividing-datasets#additional_problems_with_test_sets
          locator: "Datasets: Dividing the original dataset, 'Additional problems with test sets' and 'Exercises: Check your understanding'"
        - source: d2l
          url: https://d2l.ai/chapter_linear-classification/generalization-classification.html#the-test-set
          locator: Sec. 4.6.1 The Test Set
      references_replace: true
  overfitting/overfitting#q2:
    difficulty: easy
    fix:
      explanation: |
        A model generalizes well only if the dataset is stationary, that is, if it doesn't change
        significantly over time [^1]. Viewers' tastes are not stationary: they keep changing in ways that
        past behavior can't predict, so a model trained on the last ten years will probably misjudge what
        becomes popular in the next three. A bigger dataset doesn't fix this, since hundreds of millions of
        examples of past tastes still describe the past, and although some aspects of entertainment are
        somewhat cyclical, that is not enough to forecast new trends reliably.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  overfitting/overfitting#q3:
    difficulty: medium
    fix:
      explanation: |
        Seasonal variation is not a problem in itself; what generalization needs is that the training,
        validation and test partitions share the same distribution [^1]. A full year of data covers all
        four seasons, so as long as there are enough examples and every season is spread evenly across the
        partitions (for example, by shuffling the whole year before splitting), the model is trained and
        tested on the same mix of weather. Splitting by date would break this: a model trained on spring
        to autumn and tested on winter would meet weather it never saw in training.
      references:
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/overfitting#generalization_conditions
          locator: Overfitting, sec. Generalization conditions
      references_replace: true
  classification/accuracy-precision-recall#q1:
    difficulty: easy
    fix:
      explanation: |
        Recall, the true positive rate, is the share of actual positives that the model catches:
        $\frac{TP}{TP+FN} = \frac{5}{5+2} = \frac{5}{7} \approx 0.714$ [^1]. True negatives and false
        positives play no part in it. 0.455 divides TP by all correct predictions (TP + TN), and 0.625
        is the precision $\frac{TP}{TP+FP} = \frac{5}{8}$ [^1].
      why:
        1: That is $\frac{5}{11}$, TP over all correct classifications. Recall considers all actual positives, $\frac{TP}{TP+FN}$.
        2: That is the precision $\frac{5}{8}$, TP over all positive classifications. Recall considers all actual positives, $\frac{TP}{TP+FN}$.
  classification/accuracy-precision-recall#q2:
    difficulty: easy
    fix:
      explanation: |
        Precision is the share of positive predictions that are correct:
        $\frac{TP}{TP+FP} = \frac{3}{3+2} = \frac{3}{5} = 0.6$ [^1]. True negatives and false negatives
        play no part in it. 0.75 is the recall $\frac{TP}{TP+FN} = \frac{3}{4}$, and 0.429 divides TP by
        all correct predictions, $\frac{3}{3+4}$ [^1].
      why:
        1: That is the recall $\frac{3}{4}$, TP over all actual positives. Precision considers all positive classifications, $\frac{TP}{TP+FP}$.
        2: That is $\frac{3}{7}$, TP over all correct classifications. Precision considers all positive classifications, $\frac{TP}{TP+FP}$.
  classification/accuracy-precision-recall#q3:
    difficulty: medium
    fix:
      explanation: |
        Recall, $\frac{TP}{TP+FN}$, is the share of actual positives that the model detects, which is
        why it is also called the probability of detection [^1]. Here a missed insect (a false negative)
        can let an infestation start, while a false alarm (a false positive) costs the entomologist only
        a quick look at the photo. When false negatives are much more expensive than false positives,
        recall is the metric to optimize [^1].
  classification/thresholding#q1:
    difficulty: easy
    fix:
      explanation: |
        A legitimate site is an actual negative (class 0), and calling it malware is a positive
        prediction. A wrong positive prediction is a false positive: "false" says the prediction was
        wrong, "positive" names the class that was predicted [^1].
  linear-regression#q1:
    difficulty: easy
    fix:
      explanation: A linear regression model predicts $y' = b + w_1x_1 + \dots + w_nx_n$, where the bias $b$ and the weights $w_i$ are its parameters [^1]. Training adjusts exactly these parameters to reduce the loss on the training examples [^1]. The feature values $x_i$ are fixed data, and the prediction $y'$ is computed from features and parameters, so it changes only because the parameters do.
      why:
        1: The prediction is computed from the features, weights and bias; it changes only as a consequence of updating the weights and bias [^1].
        2: Feature values are inputs from the dataset; training adjusts the parameters that multiply them, not the data [^1].
  overfitting/model-complexity#q2:
    difficulty: easy
    fix:
      explanation: |
        Start small: pick only a few features (one to three) that seem to have strong predictive
        power [^1]. A small first model lets you confirm that the data pipeline and the model work as
        intended, and it gives you a baseline to improve on. Every extra feature adds a dimension, and
        as the dimensionality grows the training data become sparse, so it gets harder to learn the
        relationship between the features that matter and the label; this is the curse of
        dimensionality [^1]. Add features later, once the baseline works.
