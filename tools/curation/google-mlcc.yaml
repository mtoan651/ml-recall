# Curation for google-mlcc (see docs/content-pipeline.md#curation).
# Refs: <module>/<page>#q<n>, 1-based per page. Items flagged `image` or `context` (the stem shows a
# picture or points at the page around it) need `keep: true` or a `fix` to stay; fixes below rewrite
# such stems so they stand alone (values taken from the page). Pictures are redrawn from code next
# to the topic file (docs/figures.md#redrawing-upstream-pictures).
# Reviewed 2026-10-11 — 58 of 58 kept.
items:
  "classification/roc-and-auc#q1":
    difficulty: easy
    fix:
      question: In practice, ROC curves are much less regular than textbook illustrations. Which of the following models, represented by their ROC curve and AUC, has the best performance?
      explanation: |
        The AUC is the probability that the model scores a randomly chosen positive higher than a
        randomly chosen negative, so a higher AUC means a better ranking over all thresholds [^1].
        Irregular, stepped curves are normal for real data; for this comparison only the area counts.
        The model with AUC 0.77 has the highest AUC of the four, so it performs best [^1].
      options:
        - text: AUC = 0.77
          correct: true
          image:
            src: ./metrics/metrics-014-a.svg
            alt: ROC curve (dashed) that rises steeply from (0, 0) and then flattens near the top; the area under it is shaded and labelled AUC = 0.77.
        - text: AUC = 0.508
          why: An AUC of 0.508 is barely above the 0.5 of random guessing [^1].
          image:
            src: ./metrics/metrics-014-b.svg
            alt: ROC curve (dash-dot) that runs almost along the diagonal from (0, 0) to (1, 1) with small zig-zags, labelled AUC = 0.508.
        - text: AUC = 0.623
          why: This model beats chance, but it ranks a random positive above a random negative less often than the model with AUC 0.77 [^1].
          image:
            src: ./metrics/metrics-014-c.svg
            alt: ROC curve (dotted) that climbs in uneven steps above the diagonal from (0, 0) to (1, 1), labelled AUC = 0.623.
        - text: AUC = 0.31
          why: An AUC below 0.5 means the model ranks positives above negatives less often than random guessing, which is worse than chance [^1].
          image:
            src: ./metrics/metrics-014-d.svg
            alt: ROC curve that stays below the diagonal, moving right first and rising steeply only near FPR = 1, labelled AUC = 0.31.
  "classification/roc-and-auc#q2":
    difficulty: easy
    fix:
      explanation: |
        The AUC is the probability that the model ranks a randomly chosen positive above a randomly
        chosen negative [^1]. Random guessing gives the diagonal ROC curve with AUC 0.5, so 0.5 is chance
        level [^1]. The model with AUC 0.32 is the only one below 0.5: it ranks a positive above a
        negative less often than a coin would, so it performs worse than chance.
      options:
        - text: A model whose ROC curve has an AUC of 0.32
          correct: true
          image:
            src: ./metrics/metrics-009-a.svg
            alt: ROC curve that stays below the diagonal, moving right first and rising steeply only near FPR = 1, labelled AUC = 0.32.
        - text: A model whose ROC curve has an AUC of 0.508
          why: This model performs slightly better than chance.
          image:
            src: ./metrics/metrics-009-b.svg
            alt: ROC curve (dash-dot) that runs almost along the diagonal with small zig-zags, labelled AUC = 0.508.
        - text: A model whose ROC curve has an AUC of 0.5
          why: This model performs the same as chance.
          image:
            src: ./metrics/metrics-009-c.svg
            alt: ROC curve that is the straight diagonal line from (0, 0) to (1, 1), labelled AUC = 0.5.
        - text: A model whose ROC curve has an AUC of 1.0
          why: This is a hypothetical perfect classifier.
          image:
            src: ./metrics/metrics-009-d.svg
            alt: ROC curve that goes straight up from (0, 0) to (0, 1) and then straight across to (1, 1), labelled AUC = 1.0.
  "classification/roc-and-auc#q3":
    difficulty: medium
    fix:
      question: A binary classifier's ROC curve has an AUC of 0.32, so it performs worse than chance. Which change makes it perform better than chance?
      explanation: |
        An AUC of 0.32 means the model ranks a random positive above a random negative only 32% of the
        time [^1]. If a binary classifier reliably puts examples in the wrong classes more often than
        chance, switching the class labels immediately makes its predictions better than chance without
        retraining: the reversed scores rank 68% of the pairs correctly, AUC $1 - 0.32 = 0.68$ [^1]. A
        model that predicts one class for every input ignores its input, so it can do no better than
        chance [^2].
      options:
        0: Reverse its predictions, so every **1** becomes **0** and every **0** becomes **1**.
        1: Have it always predict the negative class (**0**), whatever the input.
        2: Have it always predict the positive class (**1**), whatever the input.
      why:
        1: A constant prediction ignores the input. Its ROC point is (0, 0), on the diagonal, so it is at chance level, not better, and it never finds a positive, which makes it useless however high its accuracy [^1][^2].
        2: A constant prediction ignores the input. Its ROC point is (1, 1), on the diagonal, so it is at chance level, not better; it flags every negative as well [^1][^2].
      references:
        - source: google-mlcc
          locator: 'Classification: Accuracy, recall, precision, and related metrics (Accuracy)'
          url: https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall#accuracy
  "classification/roc-and-auc#q4":
    difficulty: medium
    fix:
      question: Imagine a situation where it's better to allow some spam to reach the inbox than to send a business-critical email to the spam folder. You've trained a spam classifier for this situation where the positive class is spam and the negative class is not-spam. Which of the labelled points on the ROC curve of your classifier, shown below, is preferable?
      explanation: |
        Here a false positive (a business email sent to the spam folder) is costlier than a false
        negative (a spam reaching the inbox) [^1]. When false positives are costly, choose the threshold
        with the lowest false positive rate, even though it catches less spam: point A, at an FPR of
        about 0.20 [^1]. Point C would be the choice if false negatives were the costly error, and
        point B if both errors cost about the same [^1].
      figure:
        src: ./metrics/metrics-015.svg
        alt: 'ROC curve labelled AUC = 0.84 with three marked points on its upper-left bend: A at about (FPR 0.20, TPR 0.72), B at about (0.27, 0.86) and C at about (0.39, 0.93).'
      why:
        1: B catches more spam (TPR about 0.86) at the price of more false alarms (FPR about 0.27). It balances the two errors, but here a misfiled business email costs more than a spam that gets through [^1].
        2: This threshold maximizes true positives (flags more spam) at a cost of more false positives (more legitimate emails flagged as spam) [^1].
  "classification/thresholding#q2":
    difficulty: easy
    fix:
      question: In general, what happens to the number of false positives when the classification threshold increases? What about true positives?
      why:
        1: A higher threshold is a higher bar for predicting positive, so fewer examples are labeled positive and both counts fall, not rise [^1].
        2: Raising the threshold only turns positive predictions into negative ones, so true positives cannot increase [^1].
  "classification/thresholding#q3":
    difficulty: easy
    fix:
      question: In general, what happens to the number of false negatives when the classification threshold increases? What about true negatives?
      why:
        1: A higher threshold labels more examples negative, so true and false negatives rise, not fall [^1].
        2: Every example whose label changes as the threshold rises becomes a negative prediction, so false negatives can only grow, together with true negatives [^1].
  "fairness/counterfactual-fairness#q1":
    difficulty: medium
    fix:
      question: In the set of predictions shown below, which of the following pairs of identical (excluding group membership) examples received predictions that violate counterfactual fairness?
      figure:
