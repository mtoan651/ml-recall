  "unit2/quiz2#q3":
    difficulty: medium
    fix:
      question: |
        Why does an optimal Q-function $Q^*$ give us an optimal policy? Complete the reasoning.
        $Q^*$ gives the value of every action in every state, so in each state we know the best action:
        the one with the {{1}} $Q^*$ value. Acting {{2}} with respect to $Q^*$,
        $\pi^*(s) = \arg\max_a Q^*(s,a)$, is therefore an optimal policy.
      explanation: |
        The optimal policy picks $a^*(s) = \arg\max_a Q^*(s,a)$ in every state [^1]. This works
        because $Q^*$ already includes the long-term consequences of each action, like a cache of
        every one-step lookahead, so choosing optimally needs no model of the environment's dynamics;
        knowing only $V^*$ would not be enough [^2]. That is also why value-based methods can put a
        simple greedy rule on top of the learned values instead of training a policy [^3].
      answer:
        blanks:
          - accept:
              - highest
              - largest
              - maximum
              - max
              - greatest
              - biggest
              - best
            hint: one word
          - accept:
              - greedily
              - greedy
            hint: one word
        model:
      references:
        - title: 'OpenAI Spinning Up, Part 1: Key Concepts in RL'
          url: https://spinningup.openai.com/en/latest/spinningup/rl_intro.html#the-optimal-q-function-and-the-optimal-action
          locator: Section "The Optimal Q-Function and the Optimal Action"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.6 Optimal Policies and Optimal Value Functions, p. 65
        - source: hf-deep-rl-course
