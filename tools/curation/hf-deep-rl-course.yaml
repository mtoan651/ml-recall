# Curation for hf-deep-rl-course (see docs/content-pipeline.md#curation).
# Refs: <unit page>#q<n>. Unlisted items are kept with the unit's default topic (importers/hf_units.py).
# Items flagged `image` (question or solution contains a picture) need `keep: true` to stay.
# Reviewed 2026-10-11 — 43 of 48 kept (Unity ML-Agents setup items dropped). Equation pictures are
# redrawn (docs/figures.md).
exclude_prefixes:
  "unit5/": tool-specific   # Unity ML-Agents specifics
items:
  "unit1/quiz#q2":                        # RL-loop picture is decorative; the text is self-contained
    difficulty: easy
    fix:
      question: |
        Complete the RL loop. At every step:

        - Our Agent receives ______ from the environment
        - Based on that ______ the Agent takes an ______ (in a platform game, for example, it moves to the right)
        - The Environment goes to a ______
        - The Environment gives a ______ to the Agent

        Which list fills the five blanks, in order?
      explanation: |
        The loop starts with the environment giving the agent a state $S_0$, for example the first
        frame of the game. From that state the agent picks an action $A_0$ (move right). The
        environment then moves to a new state $S_1$ and gives the agent a reward $R_1$ [^1].
        Repeating this produces the trajectory $S_0, A_0, R_1, S_1, A_1, R_2, \dots$ [^2]. The
        other options go wrong because the agent receives a state, not an action, and the
        environment returns a reward; actions only ever come from the agent.
      options:
        0: an action $A_0$, action $A_0$, state $S_0$, state $S_1$, reward $R_1$
        1: state $S_0$, state $S_0$, action $A_0$, new state $S_1$, reward $R_1$
        2: a state $S_0$, state $S_0$, action $A_0$, state $S_1$, action $A_1$
      why:
        0: The environment hands the agent a state, not an action. The agent receives $S_0$ and then chooses the action $A_0$ itself.
        2: The last thing the environment gives the agent is a reward $R_1$. Actions such as $A_1$ only ever come from the agent.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit1/rl-framework#the-rl-process
          locator: Unit 1, "The Reinforcement Learning Framework", section "The RL Process"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.1 The Agent–Environment Interface, Fig. 3.1 and Eq. (3.1), pp. 47–48
      references_replace: true
  "unit1/quiz#q5":
    difficulty: easy
    fix:
      question: |
        What is the exploration/exploitation trade-off? Complete the description. An RL agent must
        balance {{1}}, trying random actions to find more information about the environment, against
        {{2}}, using what it already knows to maximize the reward.
      explanation: |
        Neither side works alone: an agent that only exploits can settle on a small nearby reward and
        never find a much larger one further away, like the mouse in the course's cheese maze [^2].
        Learning to act well means trying many actions and gradually favoring the ones that look best,
        and on a stochastic task each action has to be tried many times before its estimated reward is
        reliable [^1].
      answer:
        blanks:
          - accept:
              - exploration
              - exploring
              - explore
            hint: one word
          - accept:
              - exploitation
              - exploiting
              - exploit
            hint: one word
        model:
      references:
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, p. 3
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit1/exp-exp-tradeoff
          locator: Unit 1, "The Exploration/Exploitation trade-off"
      references_replace: true
  "unit1/quiz#q6":
    difficulty: easy
    fix:
      question: |
        What is a policy? Complete the description. The policy $\pi$ is the agent's brain: the
        function that, given the {{1}} the agent is in, tells it which {{2}} to take. A {{3}} policy
        always returns the same action for a given state, while a {{4}} policy outputs a probability
        distribution over actions, $\pi(a \mid s)$.
      explanation: |
        The policy defines how the agent behaves at a given time, and training aims to find the
        optimal policy $\pi^*$, the one that maximizes expected return [^1]. Sutton & Barto define a
        policy formally as a mapping from states to probabilities of selecting each action, so
        $\pi(a \mid s)$ is the probability of taking $a$ in $s$; a deterministic policy is the special
        case that puts all probability on one action [^2][^1].
      answer:
        blanks:
          - accept:
              - state
              - observation
            hint: one word
          - accept:
              - action
            hint: one word
          - accept:
              - deterministic
            hint: one word
          - accept:
