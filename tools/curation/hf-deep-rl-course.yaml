# Curation for hf-deep-rl-course (see docs/content-pipeline.md#curation).
# Refs: <unit page>#q<n>. Unlisted items are kept with the unit's default topic (importers/hf_units.py).
# Items flagged `image` (question or solution contains a picture) need `keep: true` to stay.
# Reviewed 2026-10-11 — 41 of 48 kept. Equation pictures are redrawn (docs/figures.md).
exclude_prefixes:
  "unit5/": tool-specific   # Unity ML-Agents specifics
items:
  "unit1/quiz#q2": {keep: true}           # RL-loop picture is decorative; the text is self-contained
  "unit1/quiz#q5": {keep: true}
  "unit1/quiz#q6": {keep: true}
  "unit2/mid-way-quiz#q3":
    fix:  # upstream question and solution were pictures of the annotated equation
      question: Define each numbered part of the Bellman equation shown below.
      answer:
        model: |-
          1. $V_\pi(s)$: the value of state $s$ under policy $\pi$.
          2. $\mathbb{E}_\pi[R_{t+1}$: the expected immediate reward, with the agent following $\pi$ to choose its actions at every step.
          3. $\gamma V_\pi(S_{t+1})$: plus the discounted value of the next state.
          4. $S_t = s$: given that the agent starts in state $s$.

          In words: the value of a state is the immediate reward plus the discounted value of the state that follows.
      figure:
        src: ./q-learning/q-learning-016.svg
        alt: 'The Bellman equation V_π(s) = E_π[R_{t+1} + γ V_π(S_{t+1}) | S_t = s] with four underlined, numbered parts: 1 is V_π(s), 2 is E_π[R_{t+1}, 3 is γ V_π(S_{t+1}) and 4 is S_t = s.'
  "unit2/mid-way-quiz#q5":
    fix:
      question: Define each numbered part of the Temporal Difference (TD) learning update shown below.
      answer:
        model: |-
          1. $V(S_t)$ on the left: the new estimate of the value of state $S_t$.
          2. $V(S_t)$ on the right (both times): the former estimate of that value.
          3. $\alpha$: the learning rate.
          4. $R_{t+1}$: the reward received after leaving $S_t$.
          5. $\gamma V(S_{t+1})$: the discounted value estimate of the next state.

          $R_{t+1} + \gamma V(S_{t+1})$ is the TD target: TD learning updates after every step, using its own estimate of the next state instead of waiting for the end of the episode.
      figure:
        src: ./q-learning/q-learning-017.svg
        alt: 'The TD update V(S_t) ← V(S_t) + α[R_{t+1} + γ V(S_{t+1}) − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α, 4 is R_{t+1} and 5 is γ V(S_{t+1}).'
  "unit2/mid-way-quiz#q6":
    fix:
      question: Define each numbered part of the Monte Carlo learning update shown below.
      answer:
        model: |-
          1. $V(S_t)$ on the left: the new estimate of the value of state $S_t$.
          2. $V(S_t)$ on the right (both times): the former estimate, i.e. the expected return starting from that state.
          3. $\alpha$: the learning rate.
          4. $G_t$: the return actually observed from time step $t$ to the end of the episode.

          Monte Carlo waits until the episode ends, computes $G_t$ and uses it as the target.
      figure:
        src: ./q-learning/q-learning-018.svg
        alt: 'The Monte Carlo update V(S_t) ← V(S_t) + α[G_t − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α and 4 is G_t.'
  "unit2/quiz2#q3": {keep: true}
  "unit2/quiz2#q4": {keep: true}
  "unit2/quiz2#q5":
    fix:
      question: How do we update the Q-value of a state–action pair? Name each numbered part of the Q-learning update shown below.
      answer:
        model: |-
          1. $Q(S_t, A_t)$ on the left: the new Q-value estimate.
          2. $Q(S_t, A_t)$ on the right (both times): the former Q-value estimate.
          3. $\alpha$: the learning rate.
          4. $R_{t+1}$: the immediate reward.
          5. $\gamma \max_a Q(S_{t+1}, a)$: the discounted estimate of the best Q-value in the next state.

          $R_{t+1} + \gamma \max_a Q(S_{t+1}, a)$ is the TD target, and the whole bracket (target minus former estimate) is the TD error.
      figure:
        src: ./q-learning/q-learning-019.svg
        alt: 'The Q-learning update Q(S_t, A_t) ← Q(S_t, A_t) + α[R_{t+1} + γ max_a Q(S_{t+1}, a) − Q(S_t, A_t)] with numbered parts: 1 is the Q(S_t, A_t) on the left, 2 is Q(S_t, A_t) on the right (both occurrences), 3 is α, 4 is R_{t+1} and 5 is γ max_a Q(S_{t+1}, a).'
  "unit2/quiz2#q6":
    fix:  # the solution was a slide comparing the Q-learning and SARSA updates
      answer:
        model: |-
          - **Off-policy**: one policy chooses the actions and a different one is used for the update. Q-learning acts $\epsilon$-greedily, but its update uses the greedy $\max_a Q(S_{t+1}, a)$.
          - **On-policy**: the same policy acts and updates. SARSA picks $A_{t+1}$ $\epsilon$-greedily and updates with $\gamma Q(S_{t+1}, A_{t+1})$ for that same action.
