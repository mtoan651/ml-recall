  unit1/quiz#q4:
    difficulty: easy
    fix:
      explanation: |
        An episodic task has a starting point and a terminal state, so the interaction breaks into
        episodes, each a list of states, actions, rewards and new states. In Super Mario Bros an
        episode starts when a level is launched and ends when Mario is killed or reaches the end of the
        level [^1]. A continuing task has no terminal state and runs until we stop it, like an agent
        that trades stocks automatically [^1]. Sutton & Barto draw the same line between episodic and
        continuing tasks [^2]. "Recursive" and "adversarial" are not task types in this
        classification.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit1/tasks
          locator: Unit 1, "Type of tasks" (Episodic task; Continuing tasks)
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 3.3 Returns and Episodes, p. 54
      references_replace: true
  unit2/mid-way-quiz#q1:
    difficulty: easy
    fix:
      explanation: |
        Both approaches look for the optimal policy $\pi^*$. Policy-based methods learn it directly:
        the agent is trained to output which action to take in each state. Value-based methods learn it
        indirectly: the agent learns how valuable each state is and then takes the actions that lead to
        the more valuable states [^1]. Evolution strategies are not a third main approach. Like hill
        climbing and simulated annealing, they are one way of optimizing a policy's parameters
        directly, so they belong to the policy-based family [^2]. "Random-based methods" is not an
        established category.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit1/two-methods#policy
          locator: "Unit 1, \"Two main approaches for solving RL problems\", section \"The Policy π: the agent's brain\""
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#the-difference-between-policy-based-and-policy-gradient-methods
          locator: Unit 4, "What are the policy-based methods?", section "The difference between policy-based and policy-gradient methods"
      references_replace: true
  unit2/mid-way-quiz#q4:
    difficulty: easy
    fix:
      explanation: |
        Monte Carlo waits until the episode ends, computes the actual return $G_t$ and uses it as
        the target: $V(S_t) \leftarrow V(S_t) + \alpha[G_t - V(S_t)]$ [^1][^2]. TD(0) updates after a
        single step. Its target $R_{t+1} + \gamma V(S_{t+1})$ uses the current estimate of the next
        state's value, which is called bootstrapping [^1][^2]. The two other options swap the
        methods.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td
          locator: Unit 2, "Monte Carlo vs Temporal Difference Learning"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 6.1 TD Prediction, Eqs. (6.1)–(6.2), pp. 119–120
      references_replace: true
  unit3/quiz#q4:
    difficulty: easy
    fix:
      explanation: |
        The Deep Q-Learning training algorithm alternates two phases [^1]. In the sampling phase the
        agent acts in the environment and stores the experience tuples it observes in a replay memory.
        In the training phase it draws a small random batch of tuples from that memory and learns from
        it with a gradient-descent step [^1][^2]. Drawing the batch at random is part of the training
        phase, not a separate shuffling phase, and nothing is reranked.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit3/deep-q-algorithm
          locator: Unit 3, "The Deep Q-Learning Algorithm" (the two phases, Sampling and Training)
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 16.5 Human-level Video Game Play (experience replay), p. 440
      references_replace: true
  unit4/quiz#q1:
    difficulty: medium
    fix:
      explanation: |
        Policy-gradient methods output a probability distribution over actions, so they can learn a
        genuinely stochastic policy. This builds exploration in and handles perceptual aliasing,
        where two states look identical but need different actions [^1]. Value methods have no
        natural way to find stochastic optimal policies [^2]. They also suit huge or continuous
        action spaces. A Q-network has to score every action and take the max, and maximizing
        over a continuous output is an optimization problem in its own right [^1]. The global
        maximum claim is false: policy gradient frequently ends up at a local maximum, and
        REINFORCE is only guaranteed to converge to a local optimum [^1][^2].
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit4/advantages-disadvantages
          locator: Unit 4, "The advantages and disadvantages of policy-gradient methods" (Advantages; Disadvantages)
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 13.1 Policy Approximation and its Advantages, pp. 322–324; Sec. 13.3 REINFORCE, p. 329
      references_replace: true
  unit6/quiz#q5:
    difficulty: medium
    fix:
      explanation: |
        Actor-critic learns two function approximators. The actor is a policy $\pi_\theta$ that
        chooses actions, and the critic is a value function that judges them [^1]. It was
        introduced to cut the high variance of REINFORCE's Monte Carlo returns [^1]. The critic's
        one-step return varies far less than the actual return, although it adds some bias [^2].
        The claim that the critic learns nothing is false: during training the actor updates its
        policy parameters and the critic updates its value parameters [^1].
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit6/advantage-actor-critic#the-actor-critic-process
          locator: Unit 6, "Advantage Actor-Critic (A2C)", sections "Reducing variance with Actor-Critic methods" and "The Actor-Critic Process"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 13.5 Actor–Critic Methods, p. 331
      references_replace: true
  unit7/quiz#q2:
    difficulty: medium
    fix:
      explanation: |
        In decentralized learning each agent is trained independently, as if it were alone, and treats
        the other agents as part of the environment dynamics rather than as agents [^1]. The catch is
        that those other agents keep learning and changing, so the underlying MDP shifts over time: the
        environment becomes non-stationary, not stationary [^1]. Many RL algorithms then cannot
        guarantee convergence to a global optimum [^1].
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit7/multi-agent-setting#decentralized-system
          locator: Unit 7, Designing Multi-Agents systems, sec. Decentralized system
      references_replace: true
  unit7/quiz#q3:
    difficulty: medium
    fix:
      explanation: |
        In the centralized approach a high-level process gathers all agents' experiences in a shared
        buffer and learns one common policy from them [^1]. The policy takes the current state of the
        environment and outputs joint actions, and the reward is global [^1]. Because the agents are
        treated as one larger entity and each knows how the others' policy changes (it is the same
        policy), the environment is stationary, unlike in decentralized learning [^1].
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit7/multi-agent-setting#centralized-approach
          locator: Unit 7, Designing Multi-Agents systems, sec. Centralized approach
      references_replace: true
