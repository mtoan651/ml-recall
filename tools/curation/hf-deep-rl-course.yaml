  "unit2/mid-way-quiz#q3":
    difficulty: easy
    fix:
      question: |
        The figure below shows the Bellman equation with four numbered parts. Complete their
        definitions. Part 1, $V_\pi(s)$, is the {{1}} of state $s$. Part 2, $\mathbb{E}_\pi[R_{t+1}$,
        is the expected immediate {{2}}, where the subscript $\pi$ means the agent uses its {{3}} to
        choose actions at every time step. Part 3, $\gamma V_\pi(S_{t+1})$, adds the {{4}} value of the
        next state. Part 4, $S_t = s$, says the agent starts in state $s$.
      explanation: |
        The return from $s$ splits into the next reward plus the discounted return from the next
        state, and the expectation of that later return is $v_\pi(S_{t+1})$, which gives the equation
        in the figure [^1]. Subscripting the expectation with $\pi$ means it is taken while the agent
        follows $\pi$, and conditioning on $S_t = s$ fixes the starting state [^1]. The course labels
        the four parts the same way: value of state $s$, expected immediate reward, discounted value of
        the next state, and "if the agent starts at state $s$" [^2].
      figure:
        src: ./q-learning/q-learning-016.svg
        alt: 'The Bellman equation V_π(s) = E_π[R_{t+1} + γ V_π(S_{t+1}) | S_t = s] with four underlined, numbered parts: 1 is V_π(s), 2 is E_π[R_{t+1}, 3 is γ V_π(S_{t+1}) and 4 is S_t = s.'
      answer:
        blanks:
          - accept:
              - value
              - state value
              - state-value
              - expected return
            hint: one word
          - accept:
              - reward
              - rewards
            hint: one word
          - accept:
              - policy
              - π
              - pi
            hint: one word
          - accept:
              - discounted
            hint: one word
        model: The value of a state is the expected immediate reward plus the discounted value of the next state, when the agent starts in $s$ and follows $\pi$.
      references:
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 4.1 Policy Evaluation (Prediction), Eq. (4.3), p. 74
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit2/bellman-equation
          locator: 'Unit 2, "The Bellman Equation: simplify our value estimation" (labelled equation figure)'
      references_replace: true
  "unit2/mid-way-quiz#q5":
    difficulty: medium
    fix:
      question: |
        The figure below shows the Temporal Difference (TD) learning update with five numbered parts.
        Complete their definitions. Part 1 is the {{1}} estimate of the value of state $S_t$, and
        part 2 (both occurrences) is the former estimate. Part 3, $\alpha$, is the {{2}}. Part 4,
        $R_{t+1}$, is the {{3}} received after leaving $S_t$, and part 5, $\gamma V(S_{t+1})$, is the
        discounted value estimate of the next state. Parts 4 and 5 together form the TD {{4}}.
      explanation: |
        TD(0) updates after a single step: it moves the old estimate a fraction $\alpha$ of the way
        toward the target $R_{t+1} + \gamma V(S_{t+1})$ [^1][^2]. Because that target uses the current
        estimate of the next state's value instead of the full return, TD bootstraps and does not have
        to wait for the end of the episode [^1][^2]. The bracket, target minus old estimate, is called
        the TD error [^2].
      figure:
        src: ./q-learning/q-learning-017.svg
        alt: 'The TD update V(S_t) ← V(S_t) + α[R_{t+1} + γ V(S_{t+1}) − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α, 4 is R_{t+1} and 5 is γ V(S_{t+1}).'
      answer:
        blanks:
          - accept:
              - new
              - updated
              - revised
            hint: one word
          - accept:
              - learning rate
              - step size
              - step-size parameter
              - lr
            hint: two words
          - accept:
              - reward
              - immediate reward
            hint: one word
          - accept:
              - target
            hint: one word
        model: The TD target is $R_{t+1} + \gamma V(S_{t+1})$; the whole bracket is the TD error.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit2/mc-vs-td#td-learning
          locator: 'Unit 2, "Monte Carlo vs Temporal Difference Learning", section "Temporal Difference Learning: learning at each step" (labelled TD update figure)'
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 6.1 TD Prediction, Eqs. (6.2) and (6.5), pp. 120–121
      references_replace: true
  "unit2/mid-way-quiz#q6":
    difficulty: easy
    fix:
      question: |
        The figure below shows the Monte Carlo learning update with four numbered parts. Complete
        their definitions. Part 1 is the new estimate of the value of state $S_t$, and part 2 (both
        occurrences) is the {{1}} estimate. Part 3, $\alpha$, is the {{2}}. Part 4, $G_t$, is the
        {{3}} actually observed from time step $t$, which is only known at the end of the {{4}}.
      explanation: |
        Monte Carlo waits until the episode ends, computes the actual return $G_t$ and moves the old
        estimate, which stands for the expected return from that state, a fraction $\alpha$ of the way
        toward it [^1][^2]. Its target is a real sample of the return, whereas TD's target
        $R_{t+1} + \gamma V(S_{t+1})$ is built from another estimate, so TD can update after every step
        [^2]. Sutton & Barto call this rule constant-$\alpha$ MC, with $\alpha$ a constant step-size
        parameter [^2].
      figure:
        src: ./q-learning/q-learning-018.svg
        alt: 'The Monte Carlo update V(S_t) ← V(S_t) + α[G_t − V(S_t)] with numbered parts: 1 is the V(S_t) on the left, 2 is V(S_t) on the right (both occurrences), 3 is α and 4 is G_t.'
      answer:
