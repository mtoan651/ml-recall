        [^1]. Both search directly for a policy. They differ in how they optimize $\theta$.
        General policy-based methods may improve $\theta$ indirectly, for example by hill climbing,
        simulated annealing or evolution strategies on a local approximation of the objective.
        Policy-gradient methods compute (an estimate of) $\nabla_\theta J(\theta)$ and do gradient
        ascent on it [^1]. Sutton & Barto define policy-gradient methods by exactly this
        gradient-ascent update on a performance measure $J(\theta)$ [^2].
      options:
        2: In Policy-based methods, we can optimize the parameter $\theta$ **indirectly** by maximizing the local approximation of the objective function with techniques like hill climbing, simulated annealing, or evolution strategies.
        3: In Policy-gradient methods, we optimize the parameter $\theta$ **directly** by performing the gradient ascent on the performance of the objective function.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit4/what-are-policy-based-methods#the-difference-between-policy-based-and-policy-gradient-methods
          locator: Unit 4, "What are the policy-based methods?", section "The difference between policy-based and policy-gradient methods"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Ch. 13 introduction, Eq. (13.1), p. 321
      references_replace: true
  unit4/quiz#q4:
    difficulty: easy
    fix:
      question: Why do we use gradient ascent instead of gradient descent to optimize $J(\theta)$?
      explanation: |
        $J(\theta)$ is the expected return of the policy, which is something we want to make as
        large as possible [^1]. The gradient points in the direction of steepest increase, so we
        step along it: $\theta \leftarrow \theta + \alpha \nabla_\theta J(\theta)$ [^1][^2].
        Gradient descent is the right tool when the objective is a loss to minimize. Saying we
        want to minimize $J$ contradicts using the direction that increases it.
      options:
        0: We want to minimize $J(\theta)$ and gradient ascent gives us the direction of the steepest increase of $J(\theta)$
        1: We want to maximize $J(\theta)$ and gradient ascent gives us the direction of the steepest increase of $J(\theta)$
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit4/policy-gradient#gradient-ascent-and-the-policy-gradient-theorem
          locator: Unit 4, "Diving deeper into policy-gradient methods", sections "The objective function" and "Gradient Ascent and the Policy-gradient Theorem"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Ch. 13 introduction, Eq. (13.1), p. 321
      references_replace: true
  unit6/quiz#q1:
    difficulty: medium
    fix:
      explanation: |
        An RL agent has no labeled examples of the correct action; it learns only from a reward
        signal [^1]. In RL, bias and variance describe the estimate of return used as the learning
        signal. REINFORCE uses the actual Monte Carlo return, which is unbiased but varies a lot
        between episodes [^2]. Actor-critic methods replace it with a bootstrapped one-step return,
        which has lower variance but introduces bias [^3]. The tradeoff is therefore about how
        faithfully the reinforcement signal tracks the true expected return. Generalizing from
        labeled training data is the supervised-learning reading of bias and variance.
      options:
        1: The bias-variance tradeoff reflects how well the reinforcement signal reflects the true reward the agent should get from the environment
      references:
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 1.1 Reinforcement Learning, pp. 1–2
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit6/variance-problem
          locator: Unit 6, "The Problem of Variance in Reinforce"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 13.5 Actor–Critic Methods, p. 331
      references_replace: true
  unit6/quiz#q2:
    difficulty: medium
    fix:
      explanation: |
        "Unbiased" means the signal matches the true expected return on average. The Monte Carlo
        return in REINFORCE is unbiased because it is the return actually obtained, not an
        estimate [^1]. "High variance" means noisy: randomness in the environment and in the
        policy can give very different returns from the same starting state [^1]. The two wrong
        options swap the terms. A biased signal is one that systematically differs from the true
        return; bootstrapping on a critic's estimate is the classic source of such bias [^2].
        A low-variance signal is the one that stays stable despite the noise.
      why:
        3: If a reward signal has low variance, then it's less affected by the noise of the environment and produces similar values regardless of the random elements in the environment
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit6/variance-problem
          locator: Unit 6, "The Problem of Variance in Reinforce"
        - title: 'Sutton & Barto (2018), Reinforcement Learning: An Introduction, 2nd ed.'
          url: http://incompleteideas.net/book/RLbook2020.pdf
          locator: Sec. 13.5 Actor–Critic Methods, p. 331
      references_replace: true
  unit7/quiz#q1:
    difficulty: easy
    fix:
      question: |
        Choose the option that fits best when comparing different types of multi-agent environments.

        - Your agents aim to maximize common benefits in ____ environments
        - Your agents aim to maximize common benefits while minimizing the opponent's in ____ environments
      explanation: |
        In cooperative environments agents must maximise a common benefit, like warehouse robots
        working together to load and unload packages as fast as possible [^1]. In competitive
        (adversarial) environments each agent maximises its own benefit by minimising the opponent's,
        as in tennis [^1]. Environments can also mix both, as in 2-vs-2 soccer, where teammates
        cooperate to beat the other team [^1].
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit7/introduction-to-marl#different-types-of-multi-agent-environments
          locator: Unit 7, An introduction to Multi-Agents Reinforcement Learning (MARL), sec. Different types of multi-agent environments
      references_replace: true
  unit7/quiz#q6:
    difficulty: medium
    fix:
      question: What are the main motivations to use an Elo rating score?
      explanation: |
        Elo measures relative skill. The expected score $E_A = 1/\left(1+10^{(R_B-R_A)/400}\right)$
        depends on the rating gap, and the update $R_A + K(S_A - E_A)$ means a favourite who wins gains
        only a few points while an upset transfers many [^1]. It is also zero-sum: the winner takes
        points from the loser, so more points move after an unexpected result but the total stays the
        same [^1]. Keeping a high rating is in fact hard (rating deflation), and in team games Elo uses
        the team average without measuring each player's contribution [^1].
      options:
        0: The score takes into account the difference in skill between you and your opponent
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit7/self-play#the-elo-score-to-evaluate-our-agent
          locator: Unit 7, Self-Play, secs. The ELO Score to evaluate our agent, Example, The Advantages, The Disadvantages
      references_replace: true
  unit5/quiz#q5:
    difficulty: easy
    fix:
      question: |
        RL environments built in a game engine (for example with Unity ML-Agents) can give the agent
        its observation in two ways: as rendered **frames** or as **raycasts**. What is the
        difference?
      explanation: |
        A frame-based observation is the rendered image, so the agent perceives the environment
        through the pixels of the screen [^1]. A raycast is instead a line projected from the agent,
        best thought of as a laser, that detects whether it passes through an object: the
        SnowballTarget agent observes the world through several sets of raycasts (plus a "can I
        shoot" flag) rather than through vision [^1], and the Pyramids agent uses 148 raycasts that
        detect the switch, bricks, the golden brick and walls [^2]. Raycasts therefore do not sample
        or downscale pixels, and the reversed pairing mixes up which observation is which.
      options:
        - text: Frames give the agent the pixels of the rendered screen; raycasts are lines cast from the agent that report which objects they hit
          correct: true
        - text: Frames give the agent the pixels of the rendered screen; raycasts send only a random sample of those pixels to save memory
          why: Raycasts have nothing to do with pixels. They are lines projected into the scene, like lasers, that detect collisions with objects.
        - text: Raycasts give the agent the pixels of the rendered screen; frames are lines cast from the agent that report which objects they hit
          why: It is the other way round. Frames are the screen pixels; raycasts are the lines that detect collisions.
        - text: Both give the agent pixels; raycasts simply render the same screen at a much lower resolution
          why: A raycast observation contains no image at all, only what each ray collided with.
      references:
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit5/snowball-target#the-observation-space
          locator: Unit 5, The SnowballTarget environment, sec. The observation space
        - source: hf-deep-rl-course
          url: https://huggingface.co/learn/deep-rl-course/unit5/pyramids#the-observation-space
          locator: Unit 5, The Pyramids environment, sec. The observation space
      references_replace: true
