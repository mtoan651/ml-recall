    keep: true
    fix:
      question: |
        Complete the RL loop. At every step:

        - Our Agent receives ______ from the environment
        - Based on that ______ the Agent takes an ______ (in a platform game, for example, it moves to the right)
        - The Environment goes to a ______
        - The Environment gives a ______ to the Agent

        Which list fills the five blanks, in order?
      options:
        0: an action $A_0$, action $A_0$, state $S_0$, state $S_1$, reward $R_1$
        1: state $S_0$, state $S_0$, action $A_0$, new state $S_1$, reward $R_1$
        2: a state $S_0$, state $S_0$, action $A_0$, state $S_1$, action $A_1$
      why:
        0: The environment hands the agent a state, not an action. The agent receives $S_0$ and then chooses the action $A_0$ itself.
        2: The last thing the environment gives the agent is a reward $R_1$. Actions such as $A_1$ only ever come from the agent.
