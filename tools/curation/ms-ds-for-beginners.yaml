  quiz-0/q1:
    fix:
      question: Why does the name *Data Science* contain the word *science*?
      options:
        0: Because it uses scientific methods to analyze data
        1: Because it only studies data produced by laboratory experiments
        2: Because it is the branch of computer science that stores data
  quiz-1/q1:
    fix:
      question: |
        Data science overlaps with several related fields. Which one deals with storing and
        processing very large quantities of data, usually with a simple structure, in a
        distributed way on a cluster of computers?
      options:
        - text: Big data
          correct: true
        - text: Machine learning
        - text: Artificial intelligence
        - text: Visualization
  quiz-1/q3:
    fix:
      options:
        0: to collect as much data as possible
        1: to convert data into a clean, structured form
        2: to make decisions based on data
  quiz-2/q1:
    fix:
      question: |
        Data ownership, informed consent and intellectual-property rights are data-ethics
        challenges. In which kind of activity do they mainly arise?
      options:
        - text: Collecting personal data from people
          correct: true
        - text: Choosing a model's algorithm and hyperparameters
        - text: Tuning a database so that queries run faster
        - text: Converting a chart's colors for color-blind readers
  quiz-2/q2:
    fix:
      question: |
        Data ethics separates *principles* (shared values to uphold, such as those of a
        responsible-AI framework) from *challenges* (situations where an action may conflict with
        those values). Which of these is a challenge rather than a principle?
      options:
        - text: Transparency
        - text: Reliability and safety
        - text: Informed consent
          correct: true
        - text: Accountability
  quiz-2/q3:
    fix:
      type: true_false
      options:
        1: 'False'
  quiz-3/q1:
    fix:
      question: What distinguishes applied ethics from ethics in general?
      options:
        0: Applied ethics only means following the laws that regulate data
        1: Applied ethics defines the shared values, and ethics then puts them into practice
        2: Applied ethics investigates ethical issues in real products and processes and corrects them
  quiz-3/q2:
    fix:
      question: What is the difference between ethics regulations and ethics principles?
      options:
        0: Ethics principles are legally binding, while regulations are voluntary guidelines
  quiz-3/q3:
    fix:
      type: multiple
      question: Which of these are practices for applying data-ethics principles in real projects? Select all that apply.
      options:
        - text: Adopting a professional code of conduct for the team
          correct: true
        - text: Running an ethics checklist, such as Deon, before each release
          correct: true
        - text: Complying with data-protection regulations such as GDPR
          correct: true
        - text: Collection bias in the training data
  quiz-4/q3:
    fix:
      question: |
        Why do data scientists first classify a dataset's data, for example as quantitative or
        qualitative, and as structured, semi-structured or unstructured?
      options:
        0: To compress it so that it takes less storage space
        1: To give every column a proper name
        2: To know how best to organize and analyze it
  quiz-5/q2:
    keep: true
  quiz-5/q3:
    fix:
      question: |
        A student explores a data source by sending it SQL queries such as
        `SELECT name FROM students WHERE age > 20`. What kind of data source is it?
  quiz-6/q1:
    fix:
      question: Why are probability and statistics important for data science?
      options:
        1: Because data science is a science, with probability and statistics as its formal foundation
        2: Because they guarantee that a pattern found in a sample holds for everyone
  quiz-7/q2:
    topic: statistics
    fix:
      question: |
        For each person in a survey you know their yearly income and their years of education,
        both as numbers. Which statistic measures the strength and direction of the linear
        relationship between the two, on a scale that does not depend on the units (dollars,
        years)?
      options:
        - text: Correlation coefficient
          correct: true
        - text: Covariance
        - text: Difference between the mean incomes of two education groups
        - text: p-value of a t-test
  quiz-8/q2:
    fix:
      question: 'A relational database usually consists of:'
      options:
        0: one table that holds all the data
        1: one spreadsheet with several tabs
        2: many tables linked to each other by keys
  quiz-8/q3:
    fix:
      question: |
        In a relational database, how do you avoid repeating the same information, such as a
        city's name and country, on many rows?
      options:
        - text: Split the data into tables that refer to each other through keys
          correct: true
        - text: Add a new column for every year instead of a new row
        - text: Keep all the data in one big table
        - text: Copy the data into several unrelated tables
  quiz-9/q1:
    fix:
      question: 'In a relational database, a primary key is:'
      options:
        1: a column whose values point to rows of another table
        2: a value that sets the order in which the rows are stored
  quiz-9/q2:
    fix:
      question: |
        An auto-generated numeric ID column is usually a better primary key than a descriptive
        value such as a city's name.
  quiz-9/q3:
    fix:
      question: In a relational database, what is a foreign key?
      options:
        - text: A column whose values are the IDs (primary keys) of rows in another table
          correct: true
        - text: A column that copies text, such as names, from another table
        - text: A column that keeps the history of values that change over time
        - text: The column that identifies each row of its own table
  quiz-10/q1:
    fix:
      question: |
        A spreadsheet stores data in rows and columns, yet it counts as non-relational data
        rather than as a relational database.
  quiz-10/q2:
    fix:
      question: Which statement about relational and non-relational data is correct?
      options:
        0: Relational databases always organize data into tables of rows and columns
        1: Non-relational data stores never use columns
        2: Non-relational databases can never be queried with SQL
  quiz-10/q3:
    fix:
      question: What does the term *NoSQL* refer to?
      options:
        - text: Non-relational data stores, often read as "not only SQL"
          correct: true
        - text: A newer version of the SQL query language
        - text: A relational database without primary keys
        - text: A database that forbids any query language
  quiz-11/q1:
    fix:
      question: |
        Which type of NoSQL database stores data as nodes (entities such as people or places) and
