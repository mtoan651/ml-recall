# Keep-list. Reviewed 2026-10-10 — 15 of 120 kept; re-reviewed 2026-10-11 under keep-and-fix —
# 70 of 120 kept (wrong keys fixed, "all of the above" turned into select-all, joke distractors
# replaced). Still dropped, with a reason per item: communication and cloud lessons (off-scope),
# Azure/Seaborn/Matplotlib/D3 trivia (tool-specific), trivial items and duplicates.
default_drop: trivial-or-off-scope
items:
  "quiz-1/q2":                          # structured vs unstructured data
    difficulty: easy
    fix:
      explanation: |
        Essays are free text with no fixed rows and columns, which makes them unstructured data, like
        the text files and document shares in the lessons' examples [^1][^2]. A class list is
        structured: a table where every row has the same columns [^2]. A friendship graph sits in
        between, and the lesson lists social-network graphs as semi-structured data [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#types-of-data
          locator: 'Lesson: Defining Data Science, Types of Data and Where to get Data'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#unstructured-data
          locator: 'Lesson: Defining Data, Structured Data and Unstructured Data'
      references_replace: true
  "quiz-4/q1":                          # quantitative data
    difficulty: easy
    fix:
      explanation: |
        Quantitative data are numerical observations that can be measured and used in calculations, so
        numeric marks can be added, averaged and compared [^1][^2]. Photos and hotel reviews are images
        and free text. They describe qualities rather than measure amounts, so they count as
        qualitative data [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
          locator: 'Lesson: Defining Data, Quantitative Data and Qualitative Data'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
          locator: Sec. 1.2.2 Types of variables
          quote: it is sensible to add, subtract, or take averages with those values
      references_replace: true
  "quiz-4/q2":                          # qualitative data
    difficulty: easy
    fix:
      explanation: |
        Qualitative data record qualities that cannot be measured objectively, and written comments
        such as hotel reviews are a typical example [^1]. Salaries and exam scores are numbers that
        you can sensibly add or average, so they are quantitative (numerical) [^1][^2].
      options:
        2: Students' exam scores out of 100
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#qualitative-data
          locator: 'Lesson: Defining Data, Qualitative Data and Quantitative Data'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
          locator: Sec. 1.2.2 Types of variables
      references_replace: true
  "quiz-5/q1":
    difficulty: easy
    fix:
      question: A teacher is reviewing the number of correct answers each student got. What type of data is that?
      explanation: |
        The number of correct answers is a count. Counts are numerical variables, more precisely
        discrete ones, because they take whole-number values on which arithmetic makes sense [^1].
        Numerical observations like these are what the lesson calls quantitative data [^2]. That rules
        out qualitative data, and "both" fails because this variable is not qualitative at all.
      shuffle: true
      options:
        0: Qualitative data
        1: Quantitative data
        2: Both qualitative and quantitative data
      references:
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-hello.html#sec-variable-types
          locator: Sec. 1.2.2 Types of variables
          quote: Because the number of siblings is a count, it is discrete.
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#quantitative-data
          locator: 'Lesson: Defining Data, Quantitative Data'
      references_replace: true
  "quiz-6/q2":                          # independent coin flips
    difficulty: easy
    fix:
      explanation: "The lesson defines a probability as the number of favourable outcomes divided by the total, when all outcomes are equally likely [^1]. Ten tosses give $2^{10} = 1024$ equally likely sequences, and only one of them is all heads. Separate coin tosses are independent, so multiplying gives the same answer, $(1/2)^{10} = 1/1024$ [^2]. The probability is small but positive, so ten heads in a row is possible; it happens about once in a thousand tries.\n"
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
          locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
        - source: d2l
          url: https://d2l.ai/chapter_preliminaries/probability.html#multiple-random-variables
          locator: Sec. 2.6.4 Multiple Random Variables (independence)
      references_replace: true
  "quiz-6/q3":                          # P(even) on a die
    difficulty: easy
    fix:
      question: When you throw a fair die, what is the probability of getting an even number?
      explanation: "A fair die has six equally likely faces, and three of them (2, 4, 6) are even, so the probability is $3/6 = 1/2$ [^1]. \"Impossible to tell\" would only apply to an unknown, possibly biased die. $1/3$ counts the wrong number of faces.\n"
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
          locator: 'Lesson: Statistics and Probability, "Probability and Random Variables"'
      references_replace: true
  "quiz-7/q1":                          # t-test to compare two means
    topic: statistics
    difficulty: easy
    fix:
      explanation: |
        A gap between two sample means could be nothing more than random variation, so eyeballing
        the means does not prove anything; you need a hypothesis test [^1]. Student's t-test turns
        the difference in means, scaled by the variability, into a t-value, compares it with the
        t-distribution and returns a p-value for judging whether the difference is real [^1]. The
        t-distribution exists for exactly this case, where $\sigma$ has to be estimated from a
        smallish sample [^2], and with small samples it is fine as long as the data show no clear
        outliers, so 20 people per group is workable [^3].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
          locator: "Lesson 4: Statistics and Probability, section 'Hypothesis Testing'"
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/inference-one-mean.html#introducing-the-t-distribution
          locator: Sec. 19.2.3 Introducing the t-distribution
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/inference-one-mean.html#evaluating-the-two-conditions-required-for-modeling-barx
          locator: Sec. 19.2.2 Evaluating the two conditions required for modeling x̄
      references_replace: true
  "quiz-7/q3":                          # central limit theorem
    difficulty: easy
    fix:
      explanation: "By the central limit theorem, the mean of a large random sample is approximately normal, with mean $\\mu$ and variance $\\sigma^2/n$. This holds whatever distribution the individual values come from, including discrete ones [^1][^2]. One roll is uniform on $\\{1,\\dots,6\\}$, but the average of 100 rolls piles up around 3.5 in a bell shape, with standard deviation $\\sigma/\\sqrt{100} \\approx 0.17$. The uniform answer describes a single roll, not the average.\n"
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md
          locator: 'Lesson: Statistics and Probability, "Law of Large Numbers and Central Limit Theorem"'
        - title: 'Penn State STAT 414: Introduction to Probability Theory'
          url: https://online.stat.psu.edu/stat414/Lesson27#the-theorem
          locator: Sec. 27.1 The Theorem (Central Limit Theorem)
      references_replace: true
  "quiz-13/q3":                         # pairwise matrix -> NumPy array
    topic: numpy
    difficulty: medium
    fix:
      explanation: |
        The data is a $100 \times 100$ table of numbers: entry $(i, j)$ counts how often friends $i$ and
        $j$ are in a picture together. NumPy arrays are multi-dimensional arrays whose values all share
        one type, with more mathematical operations and less overhead than a DataFrame [^1], which fits
        a square matrix of counts. A Pandas Series is one-dimensional, a sequence of values with an
        index [^1], so it cannot hold the pairwise table directly.
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#tabular-data-and-dataframes
          locator: 'Lesson: Working with Data: Python and the Pandas Library, Tabular Data and Dataframes; Series'
      references_replace: true
  "quiz-14/q1":
    difficulty: easy
    fix:
      explanation: |
        Data preparation turns raw, "dirty" data into something usable, and cleaning (handling missing,
        inaccurate or duplicated values) is its core step [^1]. Classification and model validation come
        later. They belong to building and evaluating a model once the data are ready [^2].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
          locator: 'Lesson: Data Preparation, introduction and Common cleaning goals and strategies'
        - source: ms-ml-for-beginners
          url: https://github.com/microsoft/ML-For-Beginners/blob/de2d4e12236445198213a0711855e348e7253cd4/1-Introduction/4-techniques-of-ML/README.md#building-a-model
          locator: 'Lesson: Techniques of Machine Learning, Building a model / Evaluate the model'
      references_replace: true
  "quiz-15/q1":
    difficulty: easy
    fix:
      explanation: |
        Datasets from different sources often follow different conventions, such as date formats,
        number formats or whitespace. Joining them can therefore produce inconsistent values unless each
        one is standardized first, and the lesson gives consistency as a reason to clean data for exactly
        this case [^1]. Joins can also bring in duplicate records, which is another cleaning problem [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#the-importance-of-cleaning-data
          locator: 'Lesson: Data Preparation, The importance of cleaning data (Consistency) and Common cleaning goals and strategies (Formatting, Duplications)'
      references_replace: true
  "quiz-15/q2":                         # missing data: first ask why
    difficulty: easy
    fix:
      explanation: |
        Data go missing for many reasons, and the right fix (reloading, filling in values, or removing
        rows) depends on how and why the values went missing [^1]. Deleting or imputing right away can
        bias the results or throw away important examples, so first find out why the data are missing
        [^1][^2].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
          locator: 'Lesson: Data Preparation, Common cleaning goals and strategies (Missing Data)'
        - source: google-mlcc
          url: https://developers.google.com/machine-learning/crash-course/overfitting/data-characteristics#complete_vs_incomplete_examples
          locator: 'Datasets: Data characteristics, Complete vs. incomplete examples'
      references_replace: true
  "quiz-19/q2":                         # histogram bins
    difficulty: easy
    fix:
      explanation: |
        A histogram splits the range of a numeric variable into intervals called bins (also called
        classes), counts how many observations fall into each bin, and draws one bar per bin [^1][^2].
        A bin is therefore a grouping of the data by value range. The height of a bar is the count
        (frequency) for its bin, not the bin itself [^1]. No data is thrown away: changing the number
        of bins only changes how finely the values are grouped [^2].
      options:
        0: the height of a bar
      references:
        - title: NIST/SEMATECH e-Handbook of Statistical Methods
          url: https://www.itl.nist.gov/div898/handbook/eda/section3/histogra.htm
          locator: Sec. 1.3.3.14 Histogram, Definition
          quote: splitting the range of the data into equal-sized bins (called classes). Then for each bin, the number of points from the data set that fall into each bin are counted.
        - source: ms-ds-for-beginners
          locator: 'Lesson: Visualizing Distributions, Working with histograms'
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
      references_replace: true
  "quiz-29/q3":                         # purpose of sampling
    difficulty: easy
    fix:
      explanation: |
        Going through every record of a large dataset is slow, so analysts examine a random
        sample and use probability and statistics to draw general conclusions about the whole;
        the more data sampled, the more precise the generalization [^1]. It is the same reason
        studies sample a population instead of taking a census, which is often too expensive or
        impossible [^2]. The lesson does not rank sampling above data profiling for finding errors:
        profiling with descriptive statistics, and checks such as missing-value functions, are
        separate tools for spotting inconsistencies [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
          locator: "Lesson 15: Analyzing, sections 'Sampling and Querying' and 'Exploring to identify inconsistencies'"
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/data-design.html#populations-and-samples
          locator: Sec. 2.1.1 Populations and samples
      references_replace: true
  "quiz-38/q3":                         # Gender Shades
    topic: ai-ethics
    difficulty: easy
    fix:
      explanation: |
        Gender Shades (Buolamwini and Gebru, 2018) evaluated the bias in automated facial analysis
        algorithms and datasets with respect to gender and skin type [^1][^2]. The authors built a
        benchmark balanced by gender and skin type, tested three commercial gender classifiers
        (Microsoft, IBM, Face++), and found the most errors on darker-skinned women, up to 34.7%,
        against at most 0.8% for lighter-skinned men [^1][^2]. Gender classification was only the test
        case used to show why AI products that analyse people need transparent performance reporting;
        the project was not about gender discourse [^3].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/6-Data-Science-In-Wild/20-Real-World-Examples/README.md#data-science--research
          locator: 'Lesson: Data Science in the Real World, sec. Data Science + Research'
        - title: 'Buolamwini & Gebru, Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification (FAT* 2018, PMLR 81)'
          url: https://proceedings.mlr.press/v81/buolamwini18a.html
          locator: Abstract
        - title: Gender Shades project site
          url: http://gendershades.org/overview.html
          locator: Overview page (introduction)
      references_replace: true
  quiz-0/q1:
    difficulty: easy
    fix:
      question: Why does the name *Data Science* contain the word *science*?
      explanation: |
        Data science is defined as a field that uses scientific methods, such as probability and
        statistics, to extract knowledge and insights from structured and unstructured data [^1].
        It is not limited to experimental data: it works across application domains such as
        finance, medicine or marketing, with data from surveys, sensors, texts or images [^1].
        Storing data is the concern of a related field, databases; data science is about drawing
        knowledge from the data [^1].
      options:
        0: Because it uses scientific methods to analyze data
        1: Because it only studies data produced by laboratory experiments
        2: Because it is the branch of computer science that stores data
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-is-data-science
          locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and Other Related Fields'
      references_replace: true
  quiz-1/q1:
    difficulty: easy
    fix:
      question: |
        Data science overlaps with several related fields. Which one deals with storing and
        processing very large quantities of data, usually with a simple structure, in a
        distributed way on a cluster of computers?
      explanation: |
        The lesson lists databases, big data, machine learning, artificial intelligence and
        visualization as fields related to data science [^1]. Big data is the one about storing and
        processing very large quantities of relatively simply structured data, distributed over a
        computer cluster; data lakes are a typical storage for it [^1]. Machine learning builds
        predictive models from data, AI builds high-complexity models that often turn unstructured
        data into structured insights, and visualization makes large data understandable to people,
        so none of them is defined by distributed storage [^1].
      shuffle: true
      options:
        - text: Big data
          correct: true
        - text: Machine learning
        - text: Artificial intelligence
        - text: Visualization
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#other-related-fields
          locator: 'Lesson 1: Defining Data Science, sec. Other Related Fields and What you can do with Data (Data Storage)'
      references_replace: true
  quiz-1/q3:
    difficulty: easy
    fix:
      explanation: |
        The lesson states that the ultimate goal of data science is to be able to make decisions
        based on data: it extracts knowledge from data and turns it into actionable insights that
        can be applied to real situations [^1]. Collecting data and processing it into a usable form
        are steps of the data journey (acquisition, storage, processing) that serve this goal, not
        the goal itself [^1].
      options:
        0: to collect as much data as possible
        1: to convert data into a clean, structured form
        2: to make decisions based on data
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-you-can-do-with-data
          locator: 'Lesson 1: Defining Data Science, sec. What is Data Science? and What you can do with Data'
      references_replace: true
  quiz-2/q1:
    difficulty: medium
    fix:
      question: |
        Data ownership, informed consent and intellectual-property rights are data-ethics
        challenges. In which kind of activity do they mainly arise?
      explanation: |
        The lesson sorts data actions into two categories, data collection and algorithm design [^1].
        Collecting data usually involves personal data about identifiable people, so its challenges
        are about privacy, who owns the data, whether people gave informed consent, and who holds
        intellectual-property rights in it [^1]. Algorithm design (curating datasets and training
        models on them) raises other challenges, such as dataset bias, data quality, unfairness and
        misrepresentation [^1]. Database tuning and chart colors are technical choices that do not
        raise consent or ownership questions.
      shuffle: true
      options:
        - text: Collecting personal data from people
          correct: true
        - text: Choosing a model's algorithm and hyperparameters
        - text: Tuning a database so that queries run faster
        - text: Converting a chart's colors for color-blind readers
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#2-ethics-challenges
          locator: 'Lesson 2: Introduction to Data Ethics, sec. 2. Ethics Challenges'
      references_replace: true
  quiz-2/q2:
    difficulty: medium
    fix:
      question: |
        Data ethics separates *principles* (shared values to uphold, such as those of a
        responsible-AI framework) from *challenges* (situations where an action may conflict with
        those values). Which of these is a challenge rather than a principle?
      explanation: |
        Microsoft's responsible-AI framework, the lesson's example of ethics principles, lists
        accountability, transparency, fairness, reliability and safety, privacy and security, and
        inclusiveness [^1]. Informed consent is one of the ethics challenges: it asks whether users
        agreed to an action such as data collection with a full understanding of its purpose, risks
        and alternatives [^1]. Transparency, accountability and reliability and safety are values to
        uphold, so they are principles [^1].
      options:
        - text: Transparency
        - text: Reliability and safety
        - text: Informed consent
          correct: true
        - text: Accountability
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#ethics-concepts
          locator: 'Lesson 2: Introduction to Data Ethics, sec. 1. Ethics Principles and 2.2 Informed Consent'
      references_replace: true
  quiz-2/q3:
    difficulty: easy
    fix:
      type: true_false
      explanation: |
        Data ethics is the branch of ethics that studies and evaluates moral problems related to
        data, algorithms and the corresponding practices, where "algorithms" covers AI, agents,
        machine learning and robots [^1]. The models trained on data are therefore within its scope,
        and challenges such as dataset bias and algorithm fairness are core data-ethics topics [^1].
      options:
        1: 'False'
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#basic-definitions
          locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions'
      references_replace: true
  quiz-3/q1:
    difficulty: medium
    fix:
      question: What distinguishes applied ethics from ethics in general?
      explanation: |
        Ethics in general is about shared values and moral principles, widely accepted norms of
        right and wrong rather than laws [^1]. Applied ethics is the practical application of these
        moral considerations: actively investigating ethical issues in real-world actions, products
        and processes, and taking corrective measures so that they stay aligned with the defined
        values [^1]. Following the law is compliance, a separate idea, and the reversed description
        swaps the roles, since ethics defines the values and applied ethics acts on them [^1].
      options:
        0: Applied ethics only means following the laws that regulate data
        1: Applied ethics defines the shared values, and ethics then puts them into practice
        2: Applied ethics investigates ethical issues in real products and processes and corrects them
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#basic-definitions
          locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions and 3. Ethics Regulations'
      references_replace: true
  quiz-3/q2:
    difficulty: easy
    fix:
      question: What is the difference between ethics regulations and ethics principles?
      explanation: |
        Ethics principles are shared values that an organization adopts voluntarily, for example in
        a responsible-AI framework; ethics rests on accepted norms of right and wrong, not on laws
        [^1]. Regulations such as GDPR, HIPAA or CCPA are government-mandated rules that an
        organization must comply with in the regions where it operates [^1]. So the binding part is
        the regulation, and the two clearly differ: ethics means doing the right thing voluntarily,
        compliance means following the law [^1].
      options:
        0: Ethics principles are legally binding, while regulations are voluntary guidelines
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#3-ethics-regulations
          locator: 'Lesson 2: Introduction to Data Ethics, sec. Basic Definitions and 3. Ethics Regulations'
      references_replace: true
  quiz-3/q3:
    difficulty: medium
    fix:
      type: multiple
      question: Which of these are practices for applying data-ethics principles in real projects? Select all that apply.
      explanation: |
        The applied-ethics section names concrete practices: professional codes that guide members'
        decisions, ethics checklists that turn principles into yes/no tasks tracked in the release
        workflow (Deon is one), and compliance with data-protection regulations such as GDPR, CCPA
        or HIPAA [^1]. Collection bias is not a practice but one of the ethics challenges: selecting a
        non-representative subset of data, which can make outcomes unfair for some groups [^1].
      shuffle: true
      options:
        - text: Adopting a professional code of conduct for the team
          correct: true
        - text: Running an ethics checklist, such as Deon, before each release
          correct: true
        - text: Complying with data-protection regulations such as GDPR
          correct: true
        - text: Collection bias in the training data
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#applied-ethics
          locator: 'Lesson 2: Introduction to Data Ethics, sec. Applied Ethics and 2.6 Dataset Bias'
      references_replace: true
  quiz-4/q3:
    difficulty: easy
    fix:
      question: |
        Why do data scientists first classify a dataset's data, for example as quantitative or
        qualitative, and as structured, semi-structured or unstructured?
      explanation: |
        Raw data has to be organized into a form that people and tools can analyze, and its
        structure (structured, semi-structured or unstructured) describes how it is organized [^1].
        The type also tells you which operations make sense: quantitative data can be measured and
        used mathematically, while qualitative data is not, even when it consists of digits such as
        phone numbers [^1]. Classifying data neither compresses nor renames it; it guides how you
        organize and analyze it.
      options:
        0: To compress it so that it takes less storage space
        1: To give every column a proper name
        2: To know how best to organize and analyze it
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#how-data-is-described
          locator: 'Lesson 3: Defining Data, sec. How Data is Described'
      references_replace: true
  quiz-5/q2:
    difficulty: easy
    fix:
      explanation: |
        Data generated by its own users, collected first-hand for the purpose at hand, is primary
        data; secondary data comes from a source that collected it for general use [^1]. The company
        designs and runs the survey itself, so the answers are primary data; they would be secondary
        data for another organization that later reused them [^1]. "Tertiary" is not one of the
        kinds of data source in this classification.
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
          locator: 'Lesson 3: Defining Data, sec. Sources of Data'
      references_replace: true
  quiz-5/q3:
    difficulty: easy
    fix:
      question: |
        A student explores a data source by sending it SQL queries such as
        `SELECT name FROM students WHERE age > 20`. What kind of data source is it?
      explanation: |
        Databases are hosted by a database management system, and users explore them with commands
        called queries [^1]; SQL is the standard language for retrieving and modifying data in a
        relational database [^2]. Local files such as spreadsheets or images are opened directly, and
        an API shares data over the internet through requests defined by its provider rather than
        SQL statements [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/03-defining-data/README.md#sources-of-data
          locator: 'Lesson 3: Defining Data, sec. Sources of Data'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#retrieving-the-data
          locator: 'Lesson 5: Relational Databases, sec. Retrieving the data'
      references_replace: true
  quiz-6/q1:
    difficulty: easy
    fix:
      question: Why are probability and statistics important for data science?
      explanation: |
        Data science uses scientific methods such as probability and statistics, and statistics gives
        it the mathematical foundations it applies to draw insights from data [^1]. The statistics
        lesson notes that you can work with data without deep knowledge of mathematics, although
        basic concepts help, so math is not a hard prerequisite [^2]. Statistics does not guarantee
        that a sample pattern holds for everyone either: a sample may not represent the population,
        which is why confidence intervals and hypothesis tests quantify the uncertainty [^2].
      options:
        1: Because data science is a science, with probability and statistics as its formal foundation
        2: Because they guarantee that a pattern found in a sample holds for everyone
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-is-data-science
          locator: 'Lesson 1: Defining Data Science, sec. What is Data Science?'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md#confidence-intervals
          locator: 'Lesson 4: Statistics and Probability, introduction and sec. Confidence Intervals'
      references_replace: true
  quiz-7/q2:
    topic: statistics
    difficulty: medium
    fix:
      question: |
        For each person in a survey you know their yearly income and their years of education,
        both as numbers. Which statistic measures the strength and direction of the linear
        relationship between the two, on a scale that does not depend on the units (dollars,
        years)?
      explanation: |
        Correlation is the covariance divided by the standard deviations of both variables, which
        makes it unit-free and always between $-1$ and $1$, with the sign giving the direction [^1][^2].
        Covariance has the right sign, but its size depends on the magnitude of the values, so on its
        own it does not show how strong the relationship is [^1]. Comparing the mean incomes of two
        education groups, or testing that difference with a t-test, throws away the numeric years of
        education and answers another question: whether two groups differ [^1]. Even a strong
        correlation would not prove that education causes higher income [^1].
      options:
        - text: Correlation coefficient
          correct: true
        - text: Covariance
        - text: Difference between the mean incomes of two education groups
        - text: p-value of a t-test
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/04-stats-and-probability/README.md#covariance-and-correlation
          locator: 'Lesson 4: Statistics and Probability, sec. Covariance and Correlation and Hypothesis Testing'
        - title: 'OpenIntro: Introduction to Modern Statistics (2nd ed.)'
          url: https://openintro-ims.netlify.app/model-slr.html#describing-linear-relationships-with-correlation
          locator: Sec. 7.1.4 Describing linear relationships with correlation
      references_replace: true
  quiz-8/q2:
    difficulty: easy
    fix:
      question: 'A relational database usually consists of:'
      explanation: |
        A relational database is built on tables of rows and columns, like a spreadsheet, but it
        spreads the information across multiple tables [^1]. The tables are linked through keys:
        each row has a primary key, and other tables refer to it with a foreign key, so the data can
        be joined back together for analysis [^1]. Keeping everything in one table repeats the same
        data on many rows, which is what splitting it into related tables avoids [^1].
      options:
        0: one table that holds all the data
        1: one spreadsheet with several tabs
        2: many tables linked to each other by keys
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
          locator: 'Lesson 5: Relational Databases, introduction and sec. The concepts of relationships'
      references_replace: true
  quiz-8/q3:
    difficulty: easy
    fix:
      question: |
        In a relational database, how do you avoid repeating the same information, such as a
        city's name and country, on many rows?
      explanation: |
        Storing yearly rainfall for each city in one table repeats the city's name and country on
        every row, which wastes storage [^1]. Adding a column for each year avoids that repetition,
        but the table's structure must change every new year and calculations become harder [^1].
        The relational solution keeps the cities in their own table with an ID (the primary key) and
        stores the rainfall in a second table that refers to that ID (a foreign key), so each fact is
        stored once [^1]. Copying data into unrelated tables would still duplicate it.
      options:
        - text: Split the data into tables that refer to each other through keys
          correct: true
        - text: Add a new column for every year instead of a new row
        - text: Keep all the data in one big table
        - text: Copy the data into several unrelated tables
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-shortcomings-of-a-single-table-approach
          locator: 'Lesson 5: Relational Databases, sec. The shortcomings of a single table approach and The concepts of relationships'
      references_replace: true
  quiz-9/q1:
    difficulty: easy
    fix:
      question: 'In a relational database, a primary key is:'
      explanation: |
        A primary key is a value used to identify one specific row in a table, usually an
        auto-generated number that never changes [^1]. A column whose values point to rows of
        another table is a foreign key, the primary key of another table used as a reference [^1].
        The primary key identifies rows; it does not define the order in which they are stored.
      options:
        1: a column whose values point to rows of another table
        2: a value that sets the order in which the rows are stored
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
          locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
      references_replace: true
  quiz-9/q2:
    difficulty: easy
    fix:
      question: |
        An auto-generated numeric ID column is usually a better primary key than a descriptive
        value such as a city's name.
      explanation: |
        A primary key could be based on a value itself, such as the city name, but it should almost
        always be a number or other identifier, and in most cases it is an auto-generated number [^1].
        The key must never change, because other tables refer to it and a change would break those
        relationships; names can change or be spelled differently, an auto-generated ID does not [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
          locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
      references_replace: true
  quiz-9/q3:
    difficulty: easy
    fix:
      question: In a relational database, what is a foreign key?
      explanation: |
        In the rainfall example, the `city_id` column of the rainfall table holds values that
        reference the IDs in the cities table; such a column is a foreign key, the primary key of
        another table used as a pointer [^1]. It stores IDs instead of copying names, which is how
        the design avoids duplication, and it says nothing about history over time [^1]. The column
        that identifies each row of its own table is that table's primary key [^1].
      options:
        - text: A column whose values are the IDs (primary keys) of rows in another table
          correct: true
        - text: A column that copies text, such as names, from another table
        - text: A column that keeps the history of values that change over time
        - text: The column that identifies each row of its own table
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
          locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
      references_replace: true
  quiz-10/q1:
    difficulty: medium
    fix:
      question: |
        A spreadsheet stores data in rows and columns, yet it counts as non-relational data
        rather than as a relational database.
      explanation: |
        The non-relational-data lesson starts with spreadsheets: a spreadsheet is a file (a workbook)
        made of worksheets and cells, worked on with formulas and functions [^1]. A relational
        database, by contrast, spreads the data across several tables that are linked through primary
        and foreign keys and queried with SQL [^2]. Having rows and columns is not enough to be
        relational; a spreadsheet does not define such links between tables.
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#spreadsheets
          locator: 'Lesson 6: Non-Relational Data, introduction and sec. Spreadsheets'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#the-concepts-of-relationships
          locator: 'Lesson 5: Relational Databases, sec. The concepts of relationships'
      references_replace: true
  quiz-10/q2:
    difficulty: medium
    fix:
      question: Which statement about relational and non-relational data is correct?
      explanation: |
        A relational database is built on tables of columns and rows, spread across several related
        tables [^1]. Non-relational stores vary: a columnar store also organizes data into columns and
        rows, grouped into column families, so they do use columns [^2]. And the document database
        Cosmos DB is queried with SQL, which is why NoSQL is often read as "not only SQL" [^2].
      options:
        0: Relational databases always organize data into tables of rows and columns
        1: Non-relational data stores never use columns
        2: Non-relational databases can never be queried with SQL
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#it-all-starts-with-tables
          locator: 'Lesson 5: Relational Databases, sec. It all starts with tables'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
          locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
      references_replace: true
  quiz-10/q3:
    difficulty: easy
    fix:
      question: What does the term *NoSQL* refer to?
      explanation: |
        NoSQL is an umbrella term for the different ways of storing non-relational data, read as
        "non-SQL", "non-relational" or "not only SQL" [^1]. It covers key-value, graph, columnar and
        document stores, which favor flexible schemas and horizontal scale over relational tables
        [^1][^2]. Some of them can still be queried with SQL, as Cosmos DB's document database is,
        which is why "not only SQL" fits; NoSQL is neither a new version of SQL nor a relational
        database [^1].
      options:
        - text: Non-relational data stores, often read as "not only SQL"
          correct: true
        - text: A newer version of the SQL query language
        - text: A relational database without primary keys
        - text: A database that forbids any query language
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
          locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
        - title: 'Azure Architecture Center: Understand data models'
          url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
          locator: sec. Nonrelational data stores
      references_replace: true
  quiz-11/q1:
    difficulty: easy
    fix:
      question: |
        Which type of NoSQL database stores data as nodes (entities such as people or places) and
        edges (the relationships between them)?
      explanation: |
        A graph database represents data as a collection of nodes, the entities, and edges, the
        relationships between two entities; both can carry properties [^1][^2]. A key-value store pairs
        a unique key with a value, a document store holds JSON-like documents of fields and values,
        and a columnar store groups columns into column families; none of them models relationships
        as edges [^1][^2]. Graph stores suit relationship-heavy data such as social networks [^2].
      options:
        - text: Graph
          correct: true
        - text: Key-value
        - text: Columnar (column-family)
        - text: Document
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#nosql
          locator: 'Lesson 6: Non-Relational Data, sec. NoSQL'
        - title: 'Azure Architecture Center: Understand data models'
          url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
          locator: sec. Graph data stores, Key-value data stores, Document data stores
      references_replace: true
  quiz-11/q3:
    difficulty: easy
    fix:
      question: Documents in a document database, such as Azure Cosmos DB or MongoDB, are most similar to which data format?
      explanation: |
        A document is a collection of fields and values, and documents look like JavaScript Object
        Notation (JSON); APIs that return JSON can often be stored in a document database directly
        [^1]. Document stores keep semi-structured documents, often in JSON, whose values can be
        nested lists or child collections [^2]. CSV rows are flat, and tables linked by foreign keys
        are the relational model [^2].
      options:
        0: Rows of a CSV file
        1: Tables linked by foreign keys
        2: JSON objects
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/06-non-relational/README.md#json-and-documents
          locator: 'Lesson 6: Non-Relational Data, sec. JSON and Documents'
        - title: 'Azure Architecture Center: Understand data models'
          url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/understand-data-store-models
          locator: sec. Document data stores and Relational data stores
      references_replace: true
  quiz-13/q1:
    difficulty: easy
    fix:
      question: |
        You want to hold a table of students with their name (text), group number and average
        grade, and select, filter and group its rows by column. Which Python library fits best?
      explanation: |
        Pandas works with DataFrames, which are like relational tables: named columns that can
        hold different types, with operations on rows, columns and groups [^1][^2]. A NumPy array
        holds values of one underlying type and has no column names, so it suits a matrix of
        numbers, or a plain list of grades, rather than a mixed table [^1]. SciPy adds scientific
        functions such as statistical tests; it is not a library for tables [^1].
      options:
        0: NumPy
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#tabular-data-and-dataframes
          locator: 'Lesson 7: Python and the Pandas Library, sec. Tabular Data and Dataframes'
        - title: 'pandas documentation: Intro to data structures'
          url: https://pandas.pydata.org/docs/user_guide/dsintro.html#dataframe
          locator: sec. DataFrame
      references_replace: true
  quiz-13/q2:
    difficulty: easy
    fix:
      explanation: |
        Grouping splits the rows by the values of a column, applies a function such as `mean` to each
        group and combines the results, as in `df.groupby('group')['grade'].mean()` [^1][^2]. Calling
        `mean` alone averages a whole column over all students, `iloc` selects rows by position and
        `head` prints the first rows, so none of them gives one average per group [^1].
      options:
        - text: '`mean`'
        - text: '`groupby`'
          correct: true
        - text: '`iloc`'
        - text: '`head`'
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/07-python/README.md#dataframe
          locator: 'Lesson 7: Python and the Pandas Library, sec. DataFrame (grouping)'
        - title: 'pandas documentation: Group by: split-apply-combine'
          url: https://pandas.pydata.org/docs/user_guide/groupby.html
          locator: introduction and sec. Aggregation
      references_replace: true
  quiz-14/q2:
    difficulty: easy
    fix:
      explanation: |
        Cleaning matters for ease of use and reuse, for consistency when datasets from different
        sources are merged, and for model accuracy, since cleaned data improves the accuracy of the
        models that rely on it [^1]. It does not add rows: removing duplicates or rows with missing
        values usually leaves fewer [^1]. And it does not replace exploration; exploring the dataset
        is how you discover what needs cleaning in the first place [^1].
      options:
        1: It increases the number of rows available for training
        2: It removes the need to explore the data first
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#the-importance-of-cleaning-data
          locator: 'Lesson 8: Data Preparation, sec. The importance of cleaning data and Common cleaning goals and strategies'
      references_replace: true
  quiz-14/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Which of these are goals of data cleaning? Select all that apply.
      explanation: |
        Common cleaning goals are fixing formatting problems (whitespace, dates and data types),
        removing duplicates, which often appear after joining datasets, and handling missing data
        [^1]. Deleting correct values because they do not fit the hypothesis is not cleaning but
        manipulating the result; the ethics lesson calls selective reporting of this kind data
        misrepresentation [^2].
      shuffle: true
      options:
        - text: Fixing formatting problems such as stray whitespace or mixed date formats
          correct: true
        - text: Fixing columns stored with the wrong data type
          correct: true
        - text: Removing duplicate records
          correct: true
        - text: Removing correct values that contradict your hypothesis
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
          locator: 'Lesson 8: Data Preparation, sec. Common cleaning goals and strategies'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#29-misrepresentation
          locator: 'Lesson 2: Introduction to Data Ethics, sec. 2.9 Misrepresentation'
      references_replace: true
  quiz-15/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Joining two datasets from different sources can introduce which problems? Select all that apply.
      explanation: |
        Duplicates are common when two or more datasets are joined, and datasets from different
        sources follow different conventions for dates, numbers or whitespace, so each one must be
        standardized to stay consistent after the merge [^1]. A join brings the columns of both tables
        together, for example a city from one table with its rainfall from the other, so the result
        does not have fewer columns than its inputs [^2].
      shuffle: true
      options:
        0: Duplicate records
        1: Inconsistent formats, such as dates written differently in each source
        2: Fewer columns than either dataset had on its own
      correct:
        - 0
        - 1
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
          locator: 'Lesson 8: Data Preparation, sec. The importance of cleaning data (Consistency) and Common cleaning goals and strategies (Duplications)'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/05-relational-databases/README.md#joining-data
          locator: 'Lesson 5: Relational Databases, sec. Joining data'
      references_replace: true
  quiz-17/q1:
    difficulty: easy
    fix:
      explanation: |
        The lesson's chart guide recommends a line chart to analyze trends over time: the x-axis is
        ordered time and the line shows the rises and falls [^1]. A pie chart shows how parts relate
        to a whole at one moment [^1], and a histogram shows how the values of one numeric variable
        are distributed, not how they change over time [^2].
      options:
        1: histogram
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#observe-wingspan-with-matplotlib
          locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide)'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
          locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms'
      references_replace: true
  quiz-17/q2:
    difficulty: easy
    fix:
      question: Which chart is the usual choice to compare a quantity across categories, such as the number of birds in each category?
      explanation: |
        The lesson's chart guide lists bar (and column) charts for comparing values, and the lesson
        compares bird counts per category with a horizontal bar chart [^1]. A line chart is meant for
        trends along an ordered axis such as time; joining unordered categories with a line suggests a
        trend that does not exist [^1]. A histogram groups the values of one numeric variable into bins
        to show their distribution, so it does not compare named categories [^2].
      shuffle: true
      options:
        2: histogram
      correct:
        - 1
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#explore-bar-charts
          locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide) and Explore bar charts'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
          locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms'
      references_replace: true
  quiz-17/q3:
    difficulty: easy
    fix:
      explanation: |
        To show how parts relate to a whole, the chart guide recommends a pie chart [^1]: each slice is
        one category's share of the total, as in the lesson's pie of edible versus poisonous mushrooms
        [^2]. Line charts show trends over time and column charts compare values, but neither shows
        each part as a share of one whole [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#observe-wingspan-with-matplotlib
          locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide)'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/11-visualization-proportions/README.md#pie
          locator: 'Lesson 11: Visualizing Proportions, sec. Pie!'
      references_replace: true
  quiz-18/q1:
    difficulty: easy
    fix:
      question: |
        Raising the number of bins of a histogram, for example from 10 to 30, shows the
        distribution in finer detail, because each bar then covers a narrower range of values.
      explanation: |
        A histogram splits the range of a numeric variable into bins and counts how many values fall
        into each one [^1][^2]. The bins are a choice of the analyst [^2]: with more bins each covers a
        narrower interval, so the shape shows more detail, as the lesson's body-mass histogram does when
        `bins` goes from 10 to 30 [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
          locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms'
        - title: NIST/SEMATECH e-Handbook of Statistical Methods
          url: https://www.itl.nist.gov/div898/handbook/eda/section3/histogra.htm
          locator: Sec. 1.3.3.14 Histogram, Definition
      references_replace: true
  quiz-18/q2:
    difficulty: easy
    fix:
      question: Which chart is usually used to show the distribution of a numeric variable?
      explanation: |
        A scatterplot gives a quick look at how values spread, but the lesson notes it is not the best
        way to show a true distribution; that is usually done with a histogram, which counts the
        values that fall into each bin [^1]. A pie chart shows parts of a whole and a line chart shows
        trends over an ordered axis; neither shows how often each range of values occurs [^2].
      options:
        0: histogram
        2: line chart
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#explore-the-birds-dataset
          locator: 'Lesson 10: Visualizing Distributions, sec. Explore the birds dataset and Working with histograms'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#observe-wingspan-with-matplotlib
          locator: 'Lesson 9: Visualizing Quantities, sec. Observe wingspan with Matplotlib (chart guide)'
      references_replace: true
  quiz-19/q1:
    difficulty: easy
    fix:
      question: What kind of data does a histogram take as input?
      explanation: |
        To build a histogram you need numeric data: the chart divides the range of the values into
        bins and counts how many fall into each [^1]. Text values such as a bird's conservation status
        have no numeric range to bin; the lesson first transforms the data and plots a numeric column
        (minimum wingspan) separately for each status [^1]. Counting categories is a job for a bar
        chart instead [^2].
      shuffle: true
      options:
        0: Text (categorical) values, plotted directly
        1: Numeric values, which it groups into bins
        2: Either kind, with no transformation needed
      correct:
        - 1
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#explore-the-dataset-for-distributions-using-text-data
          locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms and Explore the dataset for distributions using text data'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/09-visualization-quantities/README.md#explore-bar-charts
          locator: 'Lesson 9: Visualizing Quantities, sec. Explore bar charts'
      references_replace: true
  quiz-19/q3:
    difficulty: medium
    fix:
      question: What does a kernel density estimate (KDE) plot show, compared with a histogram of the same data?
      explanation: |
        Like a histogram, a KDE plot shows the distribution of observations, but as a continuous,
        smooth probability-density curve instead of stepped bars [^1][^2]. It can be less cluttered
        than a histogram, especially when several distributions are overlaid, but its shape depends
        on a smoothing parameter and it can distort bounded or non-smooth data [^2]. Exact counts per
        bin are what a histogram shows, and change over time calls for a line chart [^1].
      options:
        - text: A smooth curve that estimates the distribution
          correct: true
        - text: The exact count of values in each bin
        - text: How two variables change together over time
        - text: Only the outliers of the data
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#density-plots
          locator: 'Lesson 10: Visualizing Distributions, sec. Density plots'
        - title: 'seaborn documentation: seaborn.kdeplot'
          url: https://seaborn.pydata.org/generated/seaborn.kdeplot.html
          locator: description and Notes
      references_replace: true
  quiz-20/q1:
    difficulty: easy
    fix:
      question: |
        Which chart shows proportions as a grid of small squares, where each category's share is
        the number of squares in its color?
      explanation: |
        A waffle chart shows quantities as a 2D array of squares colored by category, so each
        category's proportion can be read from how many squares it fills [^1]. A donut chart also shows
        proportions, but as slices of a pie with a hole in the middle [^1]. A histogram shows the
        distribution of a numeric variable in bins [^2], and a scatterplot plots individual points.
      shuffle: true
      options:
        - text: Waffle chart
          correct: true
        - text: Donut chart
        - text: Histogram
        - text: Scatterplot
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/11-visualization-proportions/README.md#waffles
          locator: 'Lesson 11: Visualizing Proportions, sec. Donuts! and Waffles!'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/10-visualization-distributions/README.md#working-with-histograms
          locator: 'Lesson 10: Visualizing Distributions, sec. Working with histograms'
      references_replace: true
  quiz-22/q3:
    difficulty: easy
    fix:
      question: |
        In a scatterplot of honey price per pound (x-axis) by U.S. state (y-axis), each point is
        colored by its year (the plot's `hue`). What does the color add?
      explanation: |
        Coloring the points by a third variable adds another dimension to a two-variable scatterplot
        [^1]. In the honey example, mapping the year to color with a sequential palette reveals that
        the price per pound rose year over year in most states [^2]. The colors therefore encode data,
        the year, rather than being decoration or a measured temperature.
      options:
        0: 'A third variable: how the price changes over the years'
        1: Nothing but decoration; the colors carry no data
        2: The temperature at which the honey was stored
      references:
        - title: 'seaborn documentation: Visualizing statistical relationships'
          url: https://seaborn.pydata.org/tutorial/relational.html
          locator: sec. Relating variables with scatter plots
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/12-visualization-relationships/README.md#scatterplots
          locator: 'Lesson 12: Visualizing Relationships, sec. Scatterplots'
      references_replace: true
  quiz-23/q1:
    difficulty: easy
    fix:
      type: multiple
      question: |
        Besides color, which encodings can show a third variable in a scatterplot so that
        color-blind readers can still read it? Select all that apply.
      explanation: |
        For color-blind readers, the honey lesson shows the year with growing dot size instead of
        color [^1]. Seaborn's guide adds marker style, a different shape for each class, to improve
        accessibility, and lists size as another way to encode a third variable [^2]. A red-green
        scale is still a color encoding, which readers with a color-vision deficiency may not be able
        to tell apart [^3].
      shuffle: true
      options:
        0: Point size
        1: Point shape (marker style)
        2: A red-green color scale
      correct:
        - 0
        - 1
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/12-visualization-relationships/README.md#scatterplots
          locator: 'Lesson 12: Visualizing Relationships, sec. Scatterplots'
        - title: 'seaborn documentation: Visualizing statistical relationships'
          url: https://seaborn.pydata.org/tutorial/relational.html
          locator: sec. Relating variables with scatter plots
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/13-meaningful-visualizations/README.md#color
          locator: 'Lesson 13: Making Meaningful Visualizations, sec. Color'
      references_replace: true
  quiz-23/q3:
    difficulty: easy
    fix:
      question: What does a facet grid (also called small multiples) show?
      explanation: |
        A facet grid takes one variable, such as the year, and draws the same x-y plot for each of
        its values, so the panels can be compared side by side [^1]. Seaborn calls these lattice or
        small-multiples plots and notes that several simple plots are usually more effective than one
        complex plot [^2]. Superimposing all subsets on one set of axes, or two y-axes sharing one
        x-axis (the lesson's dual-line plot), are different techniques [^1].
      options:
        - text: One copy of the same plot for each value of a chosen variable
          correct: true
        - text: All subsets superimposed on one pair of axes
        - text: One chart with two y-axes that share the x-axis
        - text: The outliers of the data, highlighted in color
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/12-visualization-relationships/README.md#facet-grids
          locator: 'Lesson 12: Visualizing Relationships, sec. Facet grids and Dual-line Plots'
        - title: 'seaborn documentation: Visualizing statistical relationships'
          url: https://seaborn.pydata.org/tutorial/relational.html
          locator: sec. Showing multiple relationships with facets
      references_replace: true
  quiz-24/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Which of these can make a chart mislead its readers? Select all that apply.
      explanation: |
        The lesson's deceptive charts include a reversed x-axis, dates rearranged to fake a downward
        trend, and a flipped y-axis combined with color that makes a rise in gun deaths look like a
        fall [^1]. It also warns that a poor chart choice, such as a pie chart with too many
        categories, can mislead even with good intentions [^1]. Labeling the axes and adding a legend
        is the lesson's advice for readable charts, not a trick [^1]. The ethics lesson calls such
        visualization tricks data misrepresentation [^2].
      shuffle: true
      options:
        - text: Reversing an axis or putting the dates out of order
          correct: true
        - text: Colors whose usual meaning suggests the opposite of the data
          correct: true
        - text: A pie chart with too many categories
          correct: true
        - text: Labeling both axes and adding a legend
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/3-Data-Visualization/13-meaningful-visualizations/README.md#avoid-deception
          locator: 'Lesson 13: Making Meaningful Visualizations, sec. Avoid deception and Styling your charts for readability'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/02-ethics/README.md#29-misrepresentation
          locator: 'Lesson 2: Introduction to Data Ethics, sec. 2.9 Misrepresentation and 3. Case Studies'
      references_replace: true
  quiz-26/q1:
    difficulty: easy
    fix:
      explanation: |
        The lifecycle has five stages: capturing, processing, analysis, communication and maintenance
        [^1]. Capturing comes first because every later stage depends on it; it combines defining the
        purpose and the problem with the stakeholders and identifying, collecting and exploring the
        data needed [^1]. Processing (finding patterns and modeling) and analysis (exploratory data
        analysis and checking the model) can only start once there is a defined problem and data to
        work with [^1][^2].
      options:
        0: 'Analysis: exploring the data and checking the model'
        1: 'Processing: finding patterns and building models'
        2: 'Capturing: defining the problem and acquiring the data'
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#capturing
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, introduction and sec. Capturing'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
      references_replace: true
  quiz-26/q2:
    difficulty: easy
    fix:
      explanation: |
        The lifecycle is a cycle, not a one-way pipeline: maintenance runs throughout the project, and
        what you discover in the data can lead you to change or redefine the goals set during
        capturing [^1]. The first lesson also notes that some steps may be skipped and others, such
        as data processing, repeated several times [^2].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#maintaining
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Capturing and Maintaining'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/1-Introduction/01-defining-data-science/README.md#what-you-can-do-with-data
          locator: 'Lesson 1: Defining Data Science, sec. What you can do with Data'
      references_replace: true
  quiz-26/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Which of these belong to the maintenance stage of the data science lifecycle? Select all that apply.
      explanation: |
        Maintenance is the ongoing work of managing, storing and securing the data throughout the
        project [^1]. It covers storage decisions (on or off premise, hot or cold data), applying the
        same cleaning to new data so its quality stays consistent, and security measures such as
        encryption and removing access for people who left the project [^1]. Presenting findings
        belongs to the communication stage [^1].
      shuffle: true
      options:
        - text: Choosing how and where to store the data, such as hot or cold storage
          correct: true
        - text: Cleaning newly arriving data so that its quality stays consistent
          correct: true
        - text: Keeping the data secure, for example with encryption and limited access
          correct: true
        - text: Presenting the findings to stakeholders
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#maintaining
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Maintaining'
      references_replace: true
  quiz-27/q1:
    difficulty: easy
    fix:
      question: |
        The data science lifecycle has five stages: capturing, processing, analysis,
        communication and maintenance. In which stage is a model most likely to be built?
      explanation: |
        The processing stage focuses on discovering patterns in the data and on modeling; it is where
        data science meets machine learning, with techniques such as classification, clustering and
        regression [^1]. Capturing defines the problem and acquires the data, and maintenance manages,
        stores and secures it; neither builds the model [^1]. The analysis stage then checks the data
        and confirms that the model addresses the questions [^2].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#processing
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Processing'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
      references_replace: true
  quiz-27/q2:
    difficulty: easy
    fix:
      question: In the capturing stage of the data science lifecycle, which question is a data scientist most likely to ask?
      explanation: |
        While capturing, the data scientist defines the goals with the stakeholders and asks whether
        the problem has been approached before, how to reduce ambiguity, what the constraints are and
        which resources are available [^1]. Comparing algorithms by test accuracy and judging whether a
        model makes sense come later, in processing and analysis, once a model exists [^1][^2].
      options:
        1: Which algorithm reaches the best test accuracy?
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#capturing
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Capturing and Processing'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, introduction'
      references_replace: true
  quiz-27/q3:
    difficulty: easy
    fix:
      question: Which of these is a common technique in the processing stage of the data science lifecycle?
      explanation: |
        Processing is about discovering patterns in the data and modeling, and the lesson names
        classification, clustering and regression as its common techniques [^1]. Encrypting the data
        is part of maintenance, which secures the data, and presenting results belongs to the
        communication stage [^1].
      shuffle: true
      options:
        1: Encrypting the stored data
        2: Presenting the results to executives
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/14-Introduction/README.md#processing
          locator: 'Lesson 14: Introduction to the Data Science Lifecycle, sec. Processing and Maintaining'
      references_replace: true
  quiz-28/q2:
    difficulty: easy
    fix:
      question: Why do you explore data before using it in a model or further analysis?
      explanation: |
        Exploratory data analysis is the process of getting to know the data: checking whether there
        is enough of it, whether its quality is acceptable for the problem, and identifying the
        challenges of working with it [^1]. Deleting data is a cleaning decision that should follow
        from understanding why values are missing or inconsistent [^1][^2], and choosing
        hyperparameters belongs to modeling, which exploration prepares for [^1].
      options:
        0: To delete the rows you do not need
        1: To identify challenges in the data
        2: To choose the final model's hyperparameters
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md#exploratory-data-analysis
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, sec. Exploratory Data Analysis and Exploring to identify inconsistencies'
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#common-cleaning-goals-and-strategies
          locator: 'Lesson 8: Data Preparation, sec. Common cleaning goals and strategies (Missing Data)'
      references_replace: true
  quiz-28/q3:
    difficulty: easy
    fix:
      type: multiple
      question: Which of these does a data scientist do when exploring a dataset? Select all that apply.
      explanation: |
        The exploratory-data-analysis lesson describes data profiling with descriptive statistics
        (for example the pandas `describe()` function), sampling and querying to understand a large
        dataset, and visualizations that reveal patterns, relationships and problems [^1]. Deploying a
        model is not part of exploration; exploration prepares the data for modeling [^1].
      shuffle: true
      options:
        - text: Draw a random sample to inspect
          correct: true
        - text: Make quick visualizations
          correct: true
        - text: Compute descriptive statistics such as count, mean and quartiles
          correct: true
        - text: Deploy the model to production
      references:
