  quiz-29/q1:
    difficulty: easy
    fix:
      question: You should wait until the data is fully cleaned and analyzed before making any visualizations.
      explanation: |
        You do not have to wait until the data is cleaned and analyzed: visualizing while exploring
        helps you identify patterns, relationships and problems in the data [^1]. Early charts also
        help you talk with people who do not manage the data and raise questions that were missed in
        the capture stage [^1].
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md#exploring-with-visualizations
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, sec. Exploring with Visualizations'
      references_replace: true
  quiz-29/q2:
    topic: data-prep
    difficulty: easy
    fix:
      question: |
        Which pandas method gives a basic profile of a DataFrame's numeric columns: count, mean,
        standard deviation, min, max and quartiles?
      explanation: |
        `describe()` generates descriptive statistics; for numeric data it reports the count, mean,
        standard deviation, min, max and the 25th, 50th and 75th percentiles [^1][^2]. `head()` only
        shows the first rows, and `isnull()` returns a Boolean mask marking missing values; both help
        exploration but do not summarize the columns [^3].
      options:
        0: '`head()`'
        1: '`isnull()`'
        2: '`describe()`'
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/4-Data-Science-Lifecycle/15-analyzing/README.md#data-profiling-descriptive-statistics-and-pandas
          locator: 'Lesson 15: The Data Science Lifecycle: Analyzing, sec. Data Profiling, Descriptive Statistics, and Pandas'
        - title: 'pandas documentation: pandas.DataFrame.describe'
          url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.describe.html
          locator: Notes
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/2-Working-With-Data/08-data-preparation/README.md#exploring-dataframe-information
          locator: 'Lesson 8: Data Preparation, sec. Exploring DataFrame information and Dealing with Missing Data'
      references_replace: true
  quiz-35/q3:
    difficulty: easy
    fix:
      question: In which case do you need a GPU rather than a CPU?
      explanation: |
        A CPU is built to run a wide range of tasks quickly but with limited concurrency, while a GPU
        is built for parallel computing, which makes it much faster at training deep learning models
        [^1]. Deep learning is compute-hungry, and its large matrix operations map well onto a GPU's
        thousands of simple cores working in parallel [^2]. Fitting a small decision tree or loading and
        cleaning a file is light work that a CPU handles well, and a GPU would only add cost [^1].
      options:
        0: When you fit a small decision tree on tabular data
        1: When you load and clean a CSV file
        2: When you train a deep neural network
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#221-choosing-the-right-options-for-your-compute-resources
          locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.2.1 Choosing the right options for your compute resources'
        - source: d2l
          url: https://d2l.ai/chapter_computational-performance/hardware.html
          locator: Sec. 13.4 Hardware
      references_replace: true
  quiz-36/q1:
    difficulty: medium
    fix:
      type: multiple
      question: |
        You rerun the same training job (same model, data and settings) on a compute cluster
        with more nodes. Which of these change as a result? Select all that apply.
      explanation: |
        Larger clusters are more expensive but more responsive: the more nodes, the shorter the
        training [^1]. The lesson presents cluster size purely as this trade-off between time and
        money [^1]. The accuracy of the model depends on the data, the algorithm and its settings, so
        running the same training on more machines makes it finish sooner without making the model
        more accurate.
      options:
        0: Responsiveness (how soon training finishes)
        2: The accuracy the trained model reaches
      correct:
        - 0
        - 1
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#221-choosing-the-right-options-for-your-compute-resources
          locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.2.1 Choosing the right options (Cluster Size) and 2.2.2 Creating a compute cluster'
      references_replace: true
  quiz-36/q3:
    topic: ml-basics
    difficulty: easy
    fix:
      question: What is AutoML (automated machine learning)?
      explanation: |
        AutoML automates the time-consuming, iterative tasks of model development [^1][^2]: it trains
        many pipelines that try different algorithms, features and hyperparameters, scores each on the
        chosen metric and recommends the best model [^2]. Deployment is a separate, later step: the
        lesson deploys the model that AutoML selected afterwards [^1]. You also bring your own labeled
        training data, so collecting and labeling data are not what AutoML does [^2].
      shuffle: true
      options:
        - text: Automatically trying many algorithms and settings to find the best model
          correct: true
        - text: Automatically deploying a trained model to a web endpoint
        - text: Automatically collecting new data from users
        - text: Automatically labeling a raw dataset
      references:
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/18-Low-Code/README.md#24-low-codeno-code-training-with-automl
          locator: 'Lesson 18: Data Science in the Cloud, the Low code/No code way, sec. 2.4 Low code/No Code training with AutoML and 3. model deployment'
        - title: 'Microsoft Learn: What is automated ML? AutoML (Azure Machine Learning)'
          url: https://learn.microsoft.com/en-us/azure/machine-learning/concept-automated-ml
          locator: introduction and sec. How does AutoML work?
      references_replace: true
  quiz-37/q2:
    topic: metrics
    difficulty: easy
    fix:
      question: Which of these metrics is used to evaluate a classification model?
      explanation: |
        Accuracy is the fraction of predictions whose class equals the true class, so it needs class
        labels and is a classification metric [^1]. The $R^2$ score and the (normalized) root mean
        squared error measure how far numeric predictions are from numeric targets, so they are
        regression metrics [^1]. In the Azure lesson the experiment is configured with a task type
        (classification, regression or forecasting) and a primary metric, and the classification run
        uses weighted AUC [^2].
      options:
        1: R² score (coefficient of determination)
        2: Normalized root mean squared error
      references:
        - title: 'scikit-learn User Guide: Metrics and scoring'
          url: https://scikit-learn.org/stable/modules/model_evaluation.html
          locator: Sec. 3.4.3.1 String name scorers, 3.4.4 Classification metrics, 3.4.6 Regression metrics
        - source: ms-ds-for-beginners
          url: https://github.com/microsoft/Data-Science-For-Beginners/blob/4d2ac427ad6f022e73a75c4f46a28bbb7978ec3f/5-Data-Science-In-Cloud/19-Azure/README.md#252-automl-configuration-and-training
          locator: 'Lesson 19: Data Science in the Cloud, the Azure ML SDK way, sec. 2.5.2 AutoML Configuration and training'
      references_replace: true
